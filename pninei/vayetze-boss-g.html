  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .arena { background: linear-gradient(#3b3020, #4a3a22 60%, #5a4526); } }

  .water.up { opacity:1; transform: translateY(-34px) scale(1.35); }

  .center { text-align:center; }

      b.onclick = function(){
        var k = +b.getAttribute('data-k');
        if (k === pos) { sGood(); hit(!tried); pos++; tried = false;
          if (pos >= items.length) { draw('<div class="fb good">✅ כל הכבוד! הכול בסדר הנכון.</div>'); setTimeout(done, 1500); } else draw();
        } else { sBad(); tried = true; b.classList.add('no', 'shake'); b.disabled = true;
          document.getElementById('fb').innerHTML = '<div class="fb retry">עוד לא… חשבו מה קרה ' + (pos ? 'מיד אחרי: «' + esc(items[pos - 1]) + '»' : 'ראשון בסיפור') + love() + '</div>'; }
      };
    });
  }
  draw();
}

// תור של פריטים: מה שנכשל פעמיים חוזר לסוף הסבב (בלי נקודות)
function queue(r, list, done) {
  var n0 = list.length, count = 0;
  function step() {
    if (!list.length) return done();
    var it = list.shift(), again = !!it._again;
    count++;
    var ask = { who: askWho, tiles: askTiles, tf: askTf, mc: askMc }[r.kind];
    ask(r, it, again, function(result){   // result: 'first' | 'second' | 'fail'
      if (result === 'fail') { var c = {}; for (var k in it) c[k] = it[k]; c._again = true; list.push(c); }
      else hit(result === 'first' && !again);
      setTimeout(step, result === 'fail' ? 2600 : 1900);
    });
  }
  step();
}
function progress(r) { return header(r); }

function choice(r, top, opts, correctIdx, hint, explain, again, cb, row) {
  var tries = 0;
  screen.innerHTML = progress(r) + top + '<div class="' + (row ? 'row2' : '') + '">' +
    opts.map(function(o, k){ return '<button class="opt" data-k="' + k + '" type="button">' + esc(o) + '</button>'; }).join('') +
    '</div><div id="fb"></div>';
  var btns = screen.querySelectorAll('.opt');
  Array.prototype.forEach.call(btns, function(b){
    b.onclick = function(){
      var k = +b.getAttribute('data-k'), fb = document.getElementById('fb');
      if (k === correctIdx) {
        sGood(); b.classList.add('ok'); Array.prototype.forEach.call(btns, function(x){ x.disabled = true; });
        fb.innerHTML = '<div class="fb good">✅ ' + (tries ? 'נכון! התעקשתם וניצחתם.' : 'נכון!') + (explain ? '<div>' + esc(explain) + '</div>' : '') + '</div>';
        cb(tries ? 'second' : 'first');
      } else {
        sBad(); tries++; b.classList.add('no'); b.disabled = true;
        if (tries >= 2 || opts.length - tries < 2) {
          Array.prototype.forEach.call(btns, function(x){ x.disabled = true; if (+x.getAttribute('data-k') === correctIdx) x.classList.add('ok'); });
          fb.innerHTML = '<div class="fb retry">התשובה: <b>' + esc(opts[correctIdx]) + '</b>' + (explain ? '<div>' + esc(explain) + '</div>' : '') +
            '<div>השאלה תחזור עוד מעט 🔁</div>' + love() + '</div>';
          cb('fail');
        } else fb.innerHTML = '<div class="fb retry">לא בדיוק. רמז: ' + esc(hint) + love() + '</div>';
      }
    };
  });
}
function askWho(r, it, again, cb) {
  var opts = shuffle(it.options);
  choice(r, '<div class="q">מי אמר?</div><div class="quote">«' + esc(it.quote) + '»</div>', opts, opts.indexOf(it.speaker),
    'הדברים נאמרו אל ' + it.to + '. מי דיבר אליו?', esc(it.speaker) + ' אמר את זה אל ' + it.to + '.', again, cb);
}
function askTf(r, it, again, cb) {
  var opts = ['✔ נכון', '✘ לא נכון'];
  // בנכון/לא נכון אין ניסיון שני של ממש - טעות מציגה את ההסבר, והמשפט חוזר בסוף הסבב
  choice(r, '<div class="q">נכון או לא נכון?</div><div class="quote">' + esc(it.s) + '</div>', opts, it.ok ? 0 : 1,
    '', (it.ok ? 'נכון! ' : 'לא נכון. ') + it.fix, again, cb, true);
}
function askMc(r, it, again, cb) {
  var idx = shuffle(it.options.map(function(_, k){ return k; }));
  choice(r, (it.old ? '<div class="round">🧠 שאלה שהייתה קשה לכם</div>' : '') + '<div class="q">' + esc(it.q) + '</div>',
    idx.map(function(k){ return it.options[k]; }), idx.indexOf(it.correct), it.hint, it.explain, again, cb);
}
function askTiles(r, it, again, cb) {
  var ans = clean(it.answer).trim(), letters = ans.replace(/ /g, '').split('');
  var ABC = 'אבגדהוזחטיכלמנסעפצקרשת'.split(''), decoy = [];
  while (decoy.length < 3) { var c = ABC[Math.floor(Math.random() * ABC.length)]; if (letters.indexOf(c) < 0 && decoy.indexOf(c) < 0) decoy.push(c); }
  var tiles = shuffle(letters.concat(decoy).map(function(ch){ return ch.replace(/[ךםןףץ]/, function(f){ return 'כמנפצ'['ךםןףץ'.indexOf(f)]; }); }));
  var target = letters.map(function(ch){ return ch.replace(/[ךםןףץ]/, function(f){ return 'כמנפצ'['ךםןףץ'.indexOf(f)]; }); });
  var fill = [], fixed = 0, tries = 0;   // fill[i] = אינדקס אריח
  function slotsHtml() {
    var h = '', li = 0;
    ans.split('').forEach(function(ch){
      if (ch === ' ') { h += '<span class="slot gap"></span>'; return; }
      var t = fill[li]; h += '<span class="slot' + (li < fixed ? ' fixed' : '') + '" data-i="' + li + '">' + (t == null ? '' : tiles[t]) + '</span>'; li++;
    });
    return h;
  }
  function draw(msg) {
    screen.innerHTML = progress(r) + '<div class="q">' + esc(it.clue) + '</div><div class="slots">' + slotsHtml() + '</div>' +
      '<div class="tiles">' + tiles.map(function(t, k){ return '<button class="tile" data-k="' + k + '" type="button"' + (fill.indexOf(k) >= 0 ? ' disabled' : '') + '>' + t + '</button>'; }).join('') + '</div>' +
      '<div class="note">לחצו על אות כדי למחוק אותה</div><div id="fb">' + (msg || '') + '</div>';
    Array.prototype.forEach.call(screen.querySelectorAll('.tile'), function(b){
      b.onclick = function(){ var i = 0; while (fill[i] != null) i++; if (i >= target.length) return; fill[i] = +b.getAttribute('data-k'); check(); };
    });
    Array.prototype.forEach.call(screen.querySelectorAll('.slot[data-i]'), function(s){
      s.onclick = function(){ var i = +s.getAttribute('data-i'); if (i >= fixed && fill[i] != null) { fill[i] = null; draw(); } };
    });
  }
  function check() {
    var full = target.every(function(_, i){ return fill[i] != null; });
    if (!full) return draw();
    var ok = target.every(function(ch, i){ return tiles[fill[i]] === ch; });
    if (ok) { sGood(); draw('<div class="fb good">✅ ' + esc(ans) + '! ' + (tries ? 'התעקשתם וניצחתם.' : 'מצוין!') + '</div>');
      Array.prototype.forEach.call(screen.querySelectorAll('.tile'), function(b){ b.disabled = true; }); cb(tries ? 'second' : 'first'); return; }
    sBad(); tries++;
    if (tries >= 2) { draw('<div class="fb retry">המילה היא: <b>' + esc(ans) + '</b><div>היא תחזור עוד מעט 🔁</div>' + love() + '</div>');
      Array.prototype.forEach.call(screen.querySelectorAll('.tile'), function(b){ b.disabled = true; }); cb('fail'); return; }
    // רמז: האות הראשונה במקום
    fill = []; var t0 = tiles.indexOf(target[0]); fill[0] = t0; fixed = 1;
    draw('<div class="fb retry">לא בדיוק. רמז: האות הראשונה היא ' + target[0] + love() + '</div>');
  }
  draw();
}

// ---------- 16.11 (המשתמש): "כל הכיתה יחד אספה N כתרים" - כמו כתרי הכיתות בדף הראשי (תלמיד אחד = כתר אחד בכל פרשה, רק נעם) ----------
var CC_SCHOOL = 'נעם קרית אתא';
function ccNorm(s) { return String(s || '').replace(/[֑-ֽֿ-ׇ]/g, '').replace(/["'.,!?;:()\-]/g, '').replace(/\s+/g, ' ').trim().toLowerCase(); }
function ccSchool(s) { s = String(s == null ? '' : s).trim(); return ccNorm(/נו?עם/.test(ccNorm(s)) ? CC_SCHOOL : s); }
function ccNoam(s) { return ccSchool(s) === ccNorm(CC_SCHOOL); }
function ccParasha(g) { var m = /^pninei-(?:more-|hard-|boss-)?(.+?)-5787-[a-z]+(?:-kita)?$/.exec(String(g)); return m ? m[1] : ''; }
function ccCls(c) { var m = String(c == null ? '' : c).match(/^([א-ת])(\d*)$/); return m ? m[1] + "'" + m[2] : String(c == null ? '' : c); }
function ccCovers(a, b) {
  var A = a.split(' '), B = b.split(' ');
  if (A.length > B.length || a === b) return false;
  for (var i = 0; i < A.length; i++) {
    if (A[i] === B[i]) continue;
    if (i === A.length - 1 && A.length > 1 && B[i].indexOf(A[i]) === 0) continue;
    return false;
  }
  return true;
}
function ccRows(raw) {   // שורות action=boards → רק המבדקים בבית שנותנים כתר
  return (raw || []).map(function(e){ return { game: e[0], name: e[1], cls: e[2], school: e[3], score: e[4] }; })
    .filter(function(r){ return CONFIG.ALL_HOME.indexOf(r.game) >= 0; });
}
function ccCount(rows, me) {
  var mine = { game: CONFIG.GAME_ID, name: me.name, cls: me.cls, school: me.school, score: 0 };
  rows = rows.concat([mine]);
  var byCls = {}, map = {};
  function ck(r) { return String(r.cls == null ? '' : r.cls).trim() + '|' + ccSchool(r.school); }
  rows.forEach(function(r){ (byCls[ck(r)] = byCls[ck(r)] || {})[ccNorm(r.name)] = 1; });
  Object.keys(byCls).forEach(function(c){
    var names = Object.keys(byCls[c]);
    var full = names.filter(function(b){ return !names.some(function(x){ return ccCovers(b, x); }); });
    names.forEach(function(a){ var hits = full.filter(function(b){ return ccCovers(a, b); }); if (hits.length === 1) map[a + '|' + c] = hits[0]; });
  });
  function who(r) { var n = ccNorm(r.name); return (map[n + '|' + ck(r)] || n) + '|' + ck(r); }
  var seen = {}, n = 0, myCls = String(me.cls) + '|' + ccSchool(me.school);
  rows.forEach(function(r){
    if ((Number(r.score) || 0) < CONFIG.PASS || !ccNoam(r.school)) return;
    var sk = who(r) + '|' + ccParasha(r.game);
    if (seen[sk]) return;
    seen[sk] = 1;
    if (String(r.cls) + '|' + ccSchool(r.school) === myCls) n++;
  });
  return { n: n, had: !!seen[who(mine) + '|' + CONFIG.SLUG] };
}
function ccBeforeHad(who) {
  try { var s = lsJson('pninei-boards-v13'); return s && s.rows ? ccCount(ccRows(s.rows), who).had : null; } catch (e) { return null; }
}
function ccShow(before, who, score) {
  fetch(CONFIG.API_URL + '?action=boards').then(function(r){ return r.json(); }).then(function(j){
    if (!j || !j.ok || !j.rows) return;
    lsSet('pninei-boards-v13', JSON.stringify({ t: Date.now(), rows: j.rows }));
    var box = document.getElementById('ccBox');
    if (!box) return;
    var now = ccCount(ccRows(j.rows).concat([{ game: CONFIG.GAME_ID, name: who.name, cls: who.cls, school: who.school, score: score }]), who);
    var cls = esc(ccCls(who.cls)), n = now.n;
    var together = '<div class="cc-sub">כל הכיתה יחד אספה ' + (n === 1 ? 'כתר אחד – והוא שלך! 💪' : n + ' כתרים – ואחד מהם שלך 💪') + '</div>';
    box.innerHTML = '<div class="big">👑</div>' + (before === false
      ? (n === 1 ? 'הוספת לכיתה ' + cls + ' את הכתר הראשון שלה!' : 'הוספת לכיתה ' + cls + ' את הכתר ה-<b class="cc-n">' + n + '</b>!')
      : 'ניצחת את הבוס בגדול!' + (before === true ? ' הכתר שלך בפרשה הזו כבר נמצא בכיתה ' + cls + '.' : '')) + together;
  }).catch(function(){});
}

// ---------- ניצחון, שאלה אישית, סיום ----------
function victory() {
  sWin();
  document.getElementById('water').className = 'water up';
  var st = document.getElementById('stone'); st.style.transform = 'translateX(-190px) rotate(-320deg)';
  screen.innerHTML = '<div class="big">🎉💧</div><h2 class="center">ניצחתם את הבוס!</h2><p class="center">' + esc(CONFIG.BOSS.win) + '</p>' +
    '<button class="primary" id="go" type="button">עוד שאלה אחת – רק בשבילכם 💛</button>';
  document.getElementById('go').onclick = personal;
}
function personal() {
  var p = D.personal;
  screen.innerHTML = '<div class="big">🪞</div><h2 class="center">ומה זה אומר עליי?</h2><p class="center">' + esc(p.lead) + '</p>' +
    '<p class="center" style="font-weight:700">מה אני רוצה לעשות השבוע?</p>' +
    p.choices.map(function(c, k){ return '<button class="opt" data-k="' + k + '" type="button">' + esc(c) + '</button>'; }).join('') +
    '<div class="note">התשובה נשארת רק אצלכם, במכשיר הזה. אף אחד אחר לא רואה אותה.</div>';
  Array.prototype.forEach.call(screen.querySelectorAll('.opt'), function(b){
    b.onclick = function(){ lsSet('pninei-kabbala-' + CONFIG.SLUG, p.choices[+b.getAttribute('data-k')]); finish(p.choices[+b.getAttribute('data-k')]); };
  });
}
function finish(kab) {
  var score = Math.round(S.first / S.items * 100), isClass = S.mode === 'class', who = S.who;
  var ccB;
  var top = '<h2 class="center">כל הכבוד, ' + esc(who.name) + '!</h2>';
  if (isClass) top += '<div class="center">הציון של הכיתה בקרב הבוס:</div><div class="score">' + score + '</div>';
  else if (score >= CONFIG.PASS) { lsSet('pninei-pass-' + CONFIG.GAME_ID, '1');
    var ccB = ccNoam(who.school) ? ccBeforeHad(who) : undefined;
    top += '<div class="crowns-box center" id="' + (ccB === undefined ? 'ccNo' : 'ccBox') + '"><div class="big">👑</div><p class="center">ניצחתם את הבוס בגדול! הוספתם כתר ללוח התלמידים.</p></div>'; }
  else top += '<p class="center">ניצחתם את הבוס! 🌟 כדי לקבל כתר צריך לענות נכון בפעם הראשונה על 80% – נסו שוב ותצליחו.</p>';
  screen.innerHTML = top + '<div class="blessing">✨ הקבלה שלי השבוע: <b>' + esc(kab) + '</b></div>' +
    '<div class="blessing">' + esc(CONFIG.BLESSING) + '</div>' +
    '<div id="send" class="note">שומר את התוצאה...</div>' +
    '<button class="primary" id="again" type="button">לשחק שוב 🔄</button>' +
    '<a class="secondary" href="https://www.kol-toda.co.il/pninei/">🗂 לכל המבדקים ולכתרי הכיתות</a>';
  document.getElementById('again').onclick = function(){ setup(); runRound(0); };
  fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify({ id: who.id, name: who.name, cls: who.cls, school: who.school, score: score,
    game: isClass ? CONFIG.CLASS_GAME_ID : CONFIG.GAME_ID }) })
    .then(function(){ document.getElementById('send').textContent = 'נשמר בהצלחה! ✅'; if (ccB !== undefined && !isClass && score >= CONFIG.PASS) ccShow(ccB, who, score); })
    .catch(function(){ document.getElementById('send').textContent = 'לא הצלחנו לשמור את התוצאה (אין חיבור?).'; });
}

// ---------- פתיחה, זיהוי ונעילה ----------
function passed(id, st) {
  if (lsGet('pninei-pass-' + id) === '1') return true;
  var s = lsJson('pninei-boards-v13');
  return !!(s && s.rows && st && s.rows.some(function(r){ return r[0] === id && normalize(r[1]) === normalize(st.name) && String(r[2]) === String(st.cls) && +r[4] >= CONFIG.PASS; }));
}
function start(mode, who) { S.mode = mode; S.who = who; setup();
  screen.innerHTML = '<div class="big">🪨</div><h2 class="center">' + esc(CONFIG.BOSS.name) + '</h2><p>' + esc(CONFIG.BOSS.intro) + '</p>' +
    '<p class="note">5 סבבים, כל אחד משחק אחר. טעיתם? יש רמז וניסיון שני, ומה שלא הצלחתם – חוזר.</p>' +
    '<button class="primary" id="go" type="button">' + esc(CONFIG.BOSS.verb) + '! 💪</button>';
  document.getElementById('go').onclick = function(){ runRound(0); };
}
function locked(st) {
  screen.innerHTML = '<div class="big">🔒</div><h2 class="center">קרב הבוס עוד נעול</h2>' +
    '<p class="center">מגיעים לבוס אחרי שעוברים את ' + esc(CONFIG.REQUIRE.name) + ' (80 ומעלה).</p>' +
    '<a class="primary" href="' + CONFIG.REQUIRE.url + '">ל' + esc(CONFIG.REQUIRE.name) + ' ←</a><div class="note" id="chk">' + (st ? 'כבר עברתם במכשיר אחר? בודקים בלוח...' : '') + '</div>' +
    '<button class="secondary" id="back" type="button">חזרה</button>';
  document.getElementById('back').onclick = boot;
  if (!st) return;
  fetch(CONFIG.API_URL + '?action=boards').then(function(r){ return r.json(); }).then(function(j){
    if (j && j.ok && j.rows) lsSet('pninei-boards-v13', JSON.stringify({ t: Date.now(), rows: j.rows }));
    if (passed(CONFIG.REQUIRE.id, st)) start('home', st); else document.getElementById('chk').textContent = 'בלוח עוד לא רשום שעברתם בשם הזה ובכיתה הזו.';
  }).catch(function(){});
}
function boot() {
  var st = lsJson('uq_student'), room = lsJson('uq_classroom');
  screen.innerHTML = '<h2 class="center">איך משחקים?</h2>' +
    '<button class="opt" id="mHome" type="button">🏠 <b>תלמיד בבית</b>' + (st ? ' – ' + esc(st.name) + ', כיתה ' + esc(st.cls) : '') + '</button>' +
    '<button class="opt" id="mClass" type="button">🏫 <b>משחק כיתתי</b>' + (room ? ' – ' + esc(room.name) : '') + '</button>';
  document.getElementById('mHome').onclick = function(){
    if (!st) { screen.innerHTML = '<p class="center">כדי להיכנס לקרב הבוס צריך להירשם ולעבור את מבדק השבוע, ואחריו את הרמה הקשה.</p>' +
      '<a class="primary" href="' + CONFIG.FIRST_URL + '">למבדק השבוע ←</a>'; return; }
    if (passed(CONFIG.REQUIRE.id, st)) start('home', st); else locked(st);
  };
  document.getElementById('mClass').onclick = function(){
    if (!room) { screen.innerHTML = '<p class="center">משחק כיתתי: קודם פותחים את מבדק השבוע במצב "משחק כיתתי" ונרשמים שם. אחר כך חוזרים לכאן.</p>' +
      '<a class="primary" href="' + CONFIG.FIRST_URL + '">למבדק השבוע ←</a>'; return; }
    start('class', room);
  };
}
boot();
