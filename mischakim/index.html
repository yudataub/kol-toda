הַיֹּפִי תָּלוּי גַּם בָּעֵינַיִם","../midot/../halacha-quiz/eretz-12.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/eretz-12-b1.webp"],["midot","אַהֲבַת אֶרֶץ יִשְׂרָאֵל","הָאֶבֶן וְהַחוֹל שֶׁל הַבֶּן אִישׁ חַי","אֲבָנִים וְחוֹל בְּבֵית הַכְּנֶסֶת, שִׁיר גַּעְגּוּעִים, וְטִיּוּל שֶׁהוּא מִצְוָה כְּשֶׁהוּא בָּא מֵאַהֲבָה","../midot/../halacha-quiz/eretz-13.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/eretz-13-b1.webp"],["midot","אַהֲבַת אֶרֶץ יִשְׂרָאֵל","הַזַּיִת שֶׁהָיָה מַר","סִפּוּר עַל סַבָּא שֶׁקָּטַף זֵיתִים בַּדֶּרֶךְ לִירוּשָׁלַיִם, שָׂמַח בָּהֶם, וְלָמַד אֶת הַיְּלָדִים שֶׁלֹּא מוֹצִיאִים דִּבָּה עַל פֵּרוֹת הָאָרֶץ","../midot/../halacha-quiz/eretz-14.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/eretz-14-b1.webp"],["midot","אַהֲבַת אֶרֶץ יִשְׂרָאֵל","הָרַקְדָּן מֵרֹב שִׂמְחָה","אַדְמוֹ״רִים שֶׁרָקְדוּ, הִשְׁתַּטְּחוּ וְשָׁרוּ מֵרֹב שִׂמְחָה כְּשֶׁהִגִּיעוּ לְאֶרֶץ יִשְׂרָאֵל","../midot/../halacha-quiz/eretz-15.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/eretz-15-b1.webp"],["midot","אַהֲבַת אֶרֶץ יִשְׂרָאֵל","מְעָרַת הַמַּכְפֵּלָה – הַמְּעָרָה שֶׁחָזְרָה","אַבְרָהָם קָנָה בְּכֶסֶף מָלֵא, שֶׁבַע מֵאוֹת שָׁנָה עָמְדוּ בַּחוּץ, וְהַיּוֹם הַמְּעָרָה חָזְרָה אֵלֵינוּ","../midot/../halacha-quiz/eretz-16.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/eretz-16-b1.webp"],["midot","אַהֲבַת אֶרֶץ יִשְׂרָאֵל","שְׂמֵחִים בַּבִּנְיָן","הָרַב אֵלִיָּהוּ, הַסָּבָא וְהַגְּרִי״ח זוֹנֶנְפֶלְד שָׂמְחוּ בְּכָל בִּנְיָן וְיִשּׁוּב חָדָשׁ בָּאָרֶץ","../midot/../halacha-quiz/eretz-17.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/eretz-17-b1.webp"],["midot","אַהֲבַת אֶרֶץ יִשְׂרָאֵל","הִגַּדְתִּי הַיּוֹם – הָאָרֶץ חֲדָשָׁה בְּכָל יוֹם","לָמָּה אוֹמְרִים בַּבִּכּוּרִים ׳הַיּוֹם׳, אֵיךְ גַּם מִי שֶׁגָּר בָּאָרֶץ שָׁנִים אוֹהֵב אוֹתָהּ כְּמוֹ בַּיּוֹם הָרִאשׁוֹן, וְאֵיךְ הַהוֹדָיָה מְחַדֶּשֶׁת אֶת הָאַהֲבָה","../midot/../halacha-quiz/eretz-18.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/eretz-18-b1.webp"],["midot","אַהֲבַת אֶרֶץ יִשְׂרָאֵל","מַה יָּפִית אַרְצֵנוּ הַקְּדוֹשָׁה","אֵיךְ גְּדוֹלֵי יִשְׂרָאֵל עָצְרוּ מוּל נוֹף הָאָרֶץ, הִתְפַּעֲלוּ מִמֶּנּוּ, וְאֵיךְ גַּם אֲנִי יָכוֹל לְהַפֹּךְ יֹפִי לְהוֹדָיָה","../midot/../halacha-quiz/eretz-19.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/eretz-19-b1.webp"],["midot","אַהֲבַת אֶרֶץ יִשְׂרָאֵל","מִתְכּוֹנְנִים לַעֲלוֹת","אֵיךְ רַבִּי מֵאִיר שָׁפִירָא וְרַבִּי יְחֶזְקֵאל אַבְרַמְסְקִי הִתְכּוֹנְנוּ לָאָרֶץ, לָמָּה כְּמִיהָה צְרִיכָה מַעֲשִׂים, וְאֵיךְ גַּם אֲנִי מִתְכּוֹנֵן","../midot/../halacha-quiz/eretz-20.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/eretz-20-b1.webp"],["midot","אַהֲבַת הַתּוֹרָה","מַה אוֹהֲבִים בַּתּוֹרָה?","מַהִי הַתּוֹרָה, אֵיךְ כּוֹתְבִים וְשׁוֹמְרִים סֵפֶר תּוֹרָה, וְלָמָּה לוֹמְדִים – כְּדֵי לְהִתְקָרֵב לְאַבָּא","../midot/../halacha-quiz/torah-01.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/torah-01-b1.webp"],["midot","אַהֲבַת הַתּוֹרָה","הִלֵּל עַל הַגָּג","הִלֵּל הֶעָנִי שֶׁעָלָה לַגָּג בַּשֶּׁלֶג כְּדֵי לִשְׁמֹעַ תּוֹרָה – וּמָה אֶפְשָׁר לִלְמֹד מִמֶּנּוּ","../midot/../halacha-quiz/torah-02.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/torah-02-b1.webp"],["midot","אַהֲבַת הַתּוֹרָה","הַנָּאד שֶׁל רַבִּי אֶלְעָזָר","רַבִּי אֶלְעָזָר בֶּן חַרְסוֹם, הֶעָשִׁיר שֶׁהָלַךְ כָּל יוֹם עִם נָאד קֶמַח לִלְמֹד תּוֹרָה – וּמַדּוּעַ עָשִׁיר אֵינוֹ פָּטוּר","../midot/../halacha-quiz/torah-03.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/torah-03-b1.webp"],["midot","אַהֲבַת הַתּוֹרָה","מֵהַשָּׂדֶה לְבֵית הַמִּדְרָשׁ","רַבִּי אֱלִיעֶזֶר בֶּן הוֹרְקְנוֹס, שֶׁהִתְחִיל לִלְמֹד תּוֹרָה בֶּן עֶשְׂרִים וּשְׁתַּיִם – וְהַדֶּרֶךְ מִן הַשָּׂדֶה לְבֵית הַמִּדְרָשׁ","../midot/../halacha-quiz/torah-04.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/torah-04-b1.webp"],["midot","אַהֲבַת הַתּוֹרָה","מוֹכְרִים שָׂדוֹת בִּשְׁבִיל תּוֹרָה","רַבִּי יוֹחָנָן מוֹכֵר שָׂדֶה, כֶּרֶם וְזַיִת – וְקוֹנֶה תּוֹרָה. לָמָּה הַתּוֹרָה יְקָרָה כָּל כָּךְ?","../midot/../halacha-quiz/torah-05.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/torah-05-b1.webp"],["midot","אַהֲבַת הַתּוֹרָה","הַחֲמוֹר וְהַמַּרְגָּלִית","הַתַּלְמִידִים קָנוּ חֲמוֹר לְרַבָּם שִׁמְעוֹן בֶּן שָׁטָח, וּמָצְאוּ עָלָיו אֶבֶן יְקָרָה. מָה עָשָׂה הָרַב?","../midot/../halacha-quiz/torah-06.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/torah-06-b1.webp"],["midot","אַהֲבַת הַתּוֹרָה","הַיֶּלֶד שֶׁרָצָה לִרְקֹד","הֶחָפֵץ חַיִּים בֶּן חָמֵשׁ רוֹצֶה לִרְקֹד בְּשִׂמְחַת תּוֹרָה, וְהָרַב קוּק בֶּן אַרְבַּע רוֹצֶה לִלְמֹד בַּסְּפָרִים הַגְּדוֹלִים","../midot/../halacha-quiz/torah-07.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/torah-07-b1.webp"],["midot","אַהֲבַת הַתּוֹרָה","הַתְּרִיסִים נִסְגָּרִים – אֱלוּל בִּירוּשָׁלַיִם","לָמָּה חֲנֻיּוֹת נִסְגָּרוֹת בַּצָּהֳרַיִם בְּאֱלוּל, מָה מְיֻחָד בַּחֹדֶשׁ הַזֶּה, וְאֵיךְ קוֹבְעִים עִתִּים לַתּוֹרָה","../midot/../halacha-quiz/torah-08.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/torah-08-b1.webp"],["midot","אַהֲבַת הַתּוֹרָה","לָמָּה לוֹמְדִים תּוֹרָה?","שְׁתֵּי סִבּוֹת לִלְמֹד תּוֹרָה, מָה אָמַר הִלֵּל לָאִישׁ שֶׁעָמַד עַל רֶגֶל אַחַת, וּמָשָׁל הַבְּגָדִים וְהָאֹכֶל","../midot/../halacha-quiz/torah-09.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/torah-09-b1.webp"],["midot","אַהֲבַת הַתּוֹרָה","שִׂמְחַת תּוֹרָה – לְמִי רוֹקְדִים?","לָמָּה מְבַקְּשִׁים ׳הוֹשִׁיעָה נָּא׳ בְּתוֹךְ הַשִּׂמְחָה, לָמָּה רוֹקְדִים לִפְנֵי הַסִּיּוּם, וּמָה נִשְׁאָר לָנוּ אַחֲרֵי הֶחָג","../midot/../halacha-quiz/torah-10.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/torah-10-b1.webp"],["midot","אַהֲבַת הַתּוֹרָה","הַנַּעַר וְהַנֵּרוֹת","אֵיךְ הַנַּעַר מָרְדֳּכַי אֱלִיָּהוּ לָמַד תּוֹרָה גַּם כְּשֶׁלֹּא הָיוּ לוֹ נֵרוֹת, וּמָה אֲנַחְנוּ לוֹקְחִים מִזֶּה","../midot/../halacha-quiz/torah-11.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/torah-11-b1.webp"],["midot","אַהֲבַת הַתּוֹרָה","כְּשֶׁהַזְּמַן נֶעֱצָר","הָאוֹר שָׂמֵחַ עַל הַסֻּלָּם, הָרַב צְבִי יְהוּדָה וְהָרַב מָרְדֳּכַי אֱלִיָּהוּ: מָה קּוֹרֶה כְּשֶׁשְּׁקוּעִים בַּתּוֹרָה בְּאַהֲבָה","../midot/../halacha-quiz/torah-12.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/torah-12-b1.webp"],["midot","אַהֲבַת הַתּוֹרָה","הַתַּנּוּר שֶׁנִּשְׁבַּר","מָה גִּלָּה הָרִידְבָּ״ז עַל הַהוֹרִים שֶׁלּוֹ, וְכַמָּה הֵם שְׂמֵחִים בַּלִּמּוּד שֶׁלָּנוּ","../midot/../halacha-quiz/torah-13.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/torah-13-b1.webp"],["midot","אַהֲבַת הַתּוֹרָה","אַחֲרֵי כָּל הַצּוֹם","הָאוֹרֵחַ שֶׁהִתְפַּלֵּל כָּל הַלַּיְלָה וְכָל הַיּוֹם בְּיוֹם כִּפּוּר, וְאָז בִּקֵּשׁ גְּמָרָא: רָעֵב לֹא לְאֹכֶל אֶלָּא לְתוֹרָה","../midot/../halacha-quiz/torah-14.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/torah-14-b1.webp"],["midot","אַהֲבַת הַתּוֹרָה","אֵין לָנוּ זְמַן!","הָרַב עוֹבַדְיָה יוֹסֵף: חֲבָל עַל כָּל רֶגַע, וְהַזְּמַן שֶׁלּוֹ לַתּוֹרָה וּלְעַם יִשְׂרָאֵל","../midot/../halacha-quiz/torah-15.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/torah-15-b1.webp"],["midot","אַהֲבַת הַתּוֹרָה","לִפְנֵי שֶׁפּוֹתְחִים סֵפֶר","עוֹצְרִים רֶגַע: מוֹדִים, מְבַקְּשִׁים, וְלוֹמְדִים כְּדֵי לְהִתְקָרֵב וּלְשַׂמֵּחַ אֶת אַבָּא","../midot/../halacha-quiz/torah-16.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/torah-16-b1.webp"],["midot","אַהֲבַת הַתּוֹרָה","בְּלִי לְהַפְסִיק","הַמְהַלֵּךְ בַּדֶּרֶךְ וְשׁוֹנֶה: לָמָּה לוֹמְדִים בְּרֶצֶף, וְאֵיךְ מַתְמִידִים","../midot/../halacha-quiz/torah-17.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/torah-17-b1.webp"],["midot","אַהֲבַת הַתּוֹרָה","וְהַעֲרֵב נָא – תּוֹרָה מְתוּקָה","לָמָּה מְבַקְשִׁים בְּכָל בֹּקֶר שֶׁהַתּוֹרָה תִּהְיֶה מְתוּקָה, וְאֵיךְ לוֹמְדִים בְּתֵאָבוֹן וּבְשִׂמְחָה","../midot/../halacha-quiz/torah-18.html","htt  הָעֵסֶק שֶׁלִּי","אֵיךְ עוֹשִׂים חֶשְׁבּוֹן נֶפֶשׁ כְּמוֹ מְנַהֵל עֵסֶק: גַּן הַמְּבוּכָה, שְׁתֵּי שִׁיטוֹת לַחֲשֹׁב עַל הַיּוֹם, וְזְמַן קָבוּעַ בְּכָל יוֹם","../midot/../halacha-quiz/cheshbon-03.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/cheshbon-03-b1.webp"],["midot","חֶשְׁבּוֹן הַנֶּפֶשׁ","לָמָּה אֲנִי עוֹשֶׂה אֶת זֶה?","׳בְּכָל דְּרָכֶיךָ דָעֵהוּ׳: לִשְׁאֹל לָמָּה לִפְנֵי כָּל מַעֲשֶׂה, לֹא לַעֲשׂוֹת מִצְוָה מְלֻמָּדָה, וְלִזְכֹּר אֶת ה׳ גַּם בַּדְּבָרִים הָרְגִילִים","../midot/../halacha-quiz/cheshbon-04.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/cheshbon-04-b1.webp"],["midot","חֶשְׁבּוֹן הַנֶּפֶשׁ","הַטַּבְלָה שֶׁלִּי – רְשִׁימָה שֶׁקּוֹרְאִים כָּל יוֹם","לָמָּה רַעְיוֹן טוֹב נִשְׁכָּח אַחֲרֵי כַּמָּה יָמִים, וְאֵיךְ טַבְלָה קְטַנָּה שֶׁל שׁוּרוֹת וְיָמִים עוֹזֶרֶת לִי לְהַתְמִיד","../midot/../halacha-quiz/cheshbon-05.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/cheshbon-05-b1.webp"],["midot","חֶשְׁבּוֹן הַנֶּפֶשׁ","סְלִיחָה מִן הַלֵּב – לֹא רַק מִן הַפֶּה","דָּנִי מְבַקֵּשׁ סְלִיחָה מִכֻּלָּם וְאַף אֶחָד לֹא סוֹלֵחַ לוֹ – עַד שֶׁהוּא לוֹמֵד מָה הִיא סְלִיחָה אֲמִתִּית","../midot/../halacha-quiz/cheshbon-06.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/cheshbon-06-b1.webp"],["midot","חֶשְׁבּוֹן הַנֶּפֶשׁ","אֶבֶן גְּדוֹלָה וַאֲבָנִים קְטַנּוֹת","שְׁתֵּי נָשִׁים אֵצֶל צַדִּיק: אַחַת בָּאָה לְהִתְוַדּוֹת עַל חֵטְא כָּבֵד, וְהַשְּׁנִיָּה אָמְרָה ׳רַק חֲטָאִים קְטַנִּים׳ – וְלָמָּה הַקְּטַנִּים קָשִׁים לְתַקֵּן","../midot/../halacha-quiz/cheshbon-07.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/cheshbon-07-b1.webp"],["midot","חֶשְׁבּוֹן הַנֶּפֶשׁ","גַּם הַטּוֹב צָרִיךְ בְּדִיקָה","פִּשְׁפּוּשׁ וּמִשְׁמוּשׁ: בּוֹדְקִים לֹא רַק מָה לְתַקֵּן, אֶלָּא גַּם אֵיךְ וּלְשֵׁם מָה עָשִׂינוּ אֶת הַמַּעֲשִׂים הַטּוֹבִים","../midot/../halacha-quiz/cheshbon-08.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/cheshbon-08-b1.webp"],["midot","חֶשְׁבּוֹן הַנֶּפֶשׁ","לִפְנֵי הַמִּצְוָה כֹּחַ, אַחֲרֶיהָ שִׂמְחָה","מָתַי עוֹשִׂים חֶשְׁבּוֹן נֶפֶשׁ, וְלָמָּה יוֹצְאִים מִן הַתְּפִלָּה וּמִן הַלִּמּוּד בְּשִׂמְחָה: רָבָא וְהַצְּדוֹקִי, ׳עָלֵינוּ לְשַׁבֵּחַ׳ וְ׳שַׂמְתָּ חֶלְקִי׳","../midot/../halacha-quiz/cheshbon-09.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/cheshbon-09-b1.webp"],["midot","חֶשְׁבּוֹן הַנֶּפֶשׁ","לֹא בְּמִקְרֶה","כְּשֶׁמַּשֶּׁהוּ קוֹרֶה אֵין אוֹמְרִים ׳מִקְרֶה׳: עוֹצְרִים עֶשֶׂר דַּקּוֹת וְשׁוֹאֲלִים מָה ה׳ רוֹצֶה שֶׁנָּבִין, וְכוֹתְבִים בְּפִנְקַס הַפֶּלֶא אֶת הַטּוֹבוֹת","../midot/../halacha-quiz/cheshbon-10.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/cheshbon-10-b1.webp"],["midot","כְּבוֹד שַׁבָּת וְעֹנֶג שַׁבָּת","מִי שֶׁטָּרַח בְּעֶרֶב שַׁבָּת","לָמָּה מִתְכּוֹנְנִים לַשַּׁבָּת, מָה פֵּרוּשׁ ׳שָׁמוֹר׳, וְאֵיךְ הַהֲכָנָה הִיא דֶּרֶךְ לְקַבֵּל מַתָּנָה מֵה׳","../midot/../halacha-quiz/oneg-01.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/oneg-01-b1.webp"],["midot","כְּבוֹד שַׁבָּת וְעֹנֶג שַׁבָּת","אֵיךְ כִּבְּדוּ חֲכָמִים אֶת הַשַּׁבָּת","אִישׁ אִישׁ לְפִי דַּרְכּוֹ: רַב נַחְמָן, רָבָא, רַב הוּנָא וַחֲבֵרֵיהֶם טָרְחוּ בְּעַצְמָם, וּמְכַבְּדִים אֶת הַשַּׁבָּת כְּמוֹ אוֹרֵחַ חָשׁוּב","../midot/../halacha-quiz/oneg-02.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/oneg-02-b1.webp"],["midot","כְּבוֹד שַׁבָּת וְעֹנֶג שַׁבָּת","יוֹסֵף מוֹקִיר שַׁבָּת","הָעָנִי שֶׁלֹּא חָסַךְ עַל הַשַּׁבָּת, הֶעָשִׁיר שֶׁחָלַם חֲלוֹם, הָאֶבֶן בַּכּוֹבַע וְהַדָּג הַגָּדוֹל","../midot/../halacha-quiz/oneg-03.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/oneg-03-b1.webp"],["midot","כְּבוֹד שַׁבָּת וְעֹנֶג שַׁבָּת","שַׁמַּאי – זוֹכְרִים אֶת הַשַּׁבָּת כָּל הַשָּׁבוּעַ","זָכוֹר אֶת יוֹם הַשַּׁבָּת: לָמָּה קוֹרְאִים רִאשׁוֹן בְּשַׁבָּת, מָה עָשָׂה שַׁמַּאי הַזָּקֵן, וְאֵיךְ מַכְנִיסִים אֶת הַשַּׁבָּת לַלֵּב בְּכָל יוֹם","../midot/../halacha-quiz/oneg-04.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/oneg-04-b1.webp"],["midot","כְּבוֹד שַׁבָּת וְעֹנֶג שַׁבָּת","לְכַבֵּד וּלְעַנֵּג","מָה הַהֶבְדֵּל בֵּין כָּבוֹד לְעֹנֶג, אֵיךְ מְכַבְּדִים בַּיָּדַיִם וּמִתְעַנְּגִים בַּלֵּב, וְלָמָּה הַפָּסוּק מַמְשִׁיךְ ׳אָז תִּתְעַנַּג עַל ה׳׳","../midot/../halacha-quiz/oneg-05.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/oneg-05-b1.webp"],["midot","כְּבוֹד שַׁבָּת וְעֹנֶג שַׁבָּת","שִׁירוֹ שֶׁל אָדָם הָרִאשׁוֹן","אֵיךְ נוֹלַד שִׁיר הַשַּׁבָּת מִתְּשׁוּבָה, מָה קָשׁוּר בֵּין הוֹדָיָה לְטָעוּת, וְלָמָּה שָׁרִים ׳טוֹב לְהוֹדוֹת׳ בְּשַׁבָּת","../midot/../halacha-quiz/oneg-06.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/oneg-06-b1.webp"],["midot","כְּבוֹד שַׁבָּת וְעֹנֶג שַׁבָּת","הַכִּנּוֹר בְּתַחֲנַת הָרַכֶּבֶת","לָמָּה אַף אֶחָד לֹא שָׂם לֵב לַכַּנָּר הַמְפֻרְסָם בַּתַּחֲנָה, וּמָה זֶה מְלַמֵּד עַל הַשַּׁבָּת וְעַל הַהַקְשָׁבָה לְטוּב ה׳","../midot/../halacha-quiz/oneg-07.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/oneg-07-b1.webp"],["midot","כְּבוֹד שַׁבָּת וְעֹנֶג שַׁבָּת","״יֶשׁ לִי כֹּל״","מָה אָמַר יַעֲקֹב לְעֵשָׂו, אֵיךְ אֶפְשָׁר לְהַרְגִּישׁ שֶׁיֵּשׁ לִי הַכֹּל, וְלָמָּה זֶה קָשׁוּר דַּוְקָא לְשַׁבָּת","../midot/../halacha-quiz/oneg-08.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/oneg-08-b1.webp"],["midot","כְּבוֹד שַׁבָּת וְעֹנֶג שַׁבָּת","כִּי חַג ה׳ לָנוּ","לָמָּה לוֹקְחִים אֶת כֻּלָּם לְחַג, לָמָּה שִׁיר נִשְׁאָר בַּלֵּב, וְאֵיךְ אֶפְשָׁר לַהֲפֹךְ מִצְוָה לַחֲגִיגָה","../midot/../halacha-quiz/oneg-09.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/oneg-09-b1.webp"],["midot","כְּבוֹד שַׁבָּת וְעֹנֶג שַׁבָּת","מְקוֹר הַבְּרָכָה","לָמָּה שַׁבָּת הִיא מְקוֹר הַבְּרָכָה לְכָל הַשָּׁבוּעַ, מָה הַיַּעַד ׳אָז תִּתְעַנַּג עַל ה׳׳, וְאֵיךְ כָּל מָה שֶׁלָּמַדְנוּ מִתְחַבֵּר לְשַׁרְשֶׁרֶת אַחַת","../midot/../halacha-quiz/oneg-10.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/oneg-10-b1.webp"],["midot","זְרִיזוּת","מַה זֹּאת זְרִיזוּת?","הֱוֵי עַז כַּנָּמֵר, קַל כַּנֶּשֶׁר, רָץ כַּצְּבִי וְגִבּוֹר כָּאֲרִי – מַה בְּדִיּוּק זְרִיזוּת, וּמַה הַהֶבְדֵּל בֵּינָהּ לְבֵין פְּזִיזוּת","../midot/../halacha-quiz/zrizut-01.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/zrizut-01-b1.webp"],["midot","זְרִיזוּת","אַבְרָהָם רָץ","וַיָּרָץ, וַיְמַהֵר, מַהֲרִי, רָץ – חָמֵשׁ מִלִּים שֶׁל מְהִירוּת בְּסִפּוּר קָצָר: מָה לוֹמְדִים מֵאַבְרָהָם אָבִינוּ וּמֵהַהֶבְדֵּל בֵּינוֹ לְבֵין לוֹט","../midot/../halacha-quiz/zrizut-02.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/zrizut-02-b1.webp"],["midot","זְרִיזוּת","רִבְקָה – ׳וַתְּמַהֵר וַתָּרָץ׳","וַתְּמַהֵר, וַתְּמַהֵר, וַתָּרָץ – רִבְקָה הוֹלֶכֶת בְּדַרְכּוֹ שֶׁל אַבְרָהָם, וְלוֹמֶדֶת אוֹתָנוּ לָרוּץ גַּם לְמִצְוָה קַלָּה","../midot/../halacha-quiz/zrizut-03.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/zrizut-03-b1.webp"],["midot","זְרִיזוּת","מַצָּה וּמִצְוָה","׳אַל תִּקְרֵי מַצּוֹת אֶלָּא מִצְווֹת׳ – מִצְוָה הַבָּאָה לְיָדְךָ אַל תַּחְמִיצֶנָּה: לָמָּה מִצְוָה שֶׁמְּעַכְּבִים מְאַבֶּדֶת מֵהַחִיּוּת שֶׁלָּהּ","../midot/../halacha-quiz/zrizut-04.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/zrizut-04-b1.webp"],["midot","זְרִיזוּת","שֵׁם וָיֶפֶת: מִי הִתְאַמֵּץ יוֹתֵר?","מָה לָמְדוּ חֲכָמִים מִן הַמִּלָּה ׳וַיִּקַּח׳, אֵיךְ הִתְאַמְּצוּת בְּמִצְוָה מְבִיאָה בְּרָכָה, וְלָמָּה זְרִיזוּת הִיא מִדָּה שֶׁל לֵב","../midot/../halacha-quiz/zrizut-05.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/zrizut-05-b1.webp"],["midot","זְרִיזוּת","הַנְּשִׂיאִים שֶׁהִמְתִּינוּ","מָה קָרָה כְּשֶׁהַנְּשִׂיאִים אָמְרוּ ׳מַה שֶּׁיֶּחְסַר נַשְׁלִים׳, לָמָּה לֹא מְחַכִּים לָרֶגַע הַמֻּשְׁלָם, וְאֵיךְ מַתְחִילִים עַכְשָׁו וּמְהַדְּרִים תּוֹךְ כְּדֵי","../midot/../halacha-quiz/zrizut-06.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/zrizut-06-b1.webp"],["midot","זְרִיזוּת","לָרוּץ לְבֵית הַכְּנֶסֶת","מָה אָמַר אַבַּיֵּי עַל הָרִיצָה לַמִּצְוָה, מָה לָמַד רַבִּי זֵירָא, וְאֵיךְ רָצִים בִּזְהִירוּת וּבְשִׂמְחָה","../midot/../halacha-quiz/zrizut-07.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/zrizut-07-b1.webp"],["midot","זְרִיזוּת","הָרֶגֶל מְעוֹרֶרֶת אֶת הַלֵּב","אֵיךְ תְּנוּעָה מְהִירָה מְעוֹרֶרֶת חֵשֶׁק, לָמָּה ׳רָץ׳ קָרוֹב ל׳רָצוֹן׳, וּמָה לָמַדְנוּ מִדָּוִד וּמִנַּפְתָּלִי","../midot/../halacha-quiz/zrizut-08.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/zrizut-08-b1.webp"],["midot","זְרִיזוּת","שְׂדֵה הֶעָצֵל","מָה גָּדֵל בְּשָׂדֶה שֶׁלֹּא עוֹבְדִים בּוֹ, לָמָּה הָעַצְלוּת בָּאָה לְאַט לְאַט, וְאֵיךְ מְטַפְּחִים אֶת הַשָּׂדֶה שֶׁלִּי","../midot/../halacha-quiz/zrizut-09.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/zrizut-09-b1.webp"],["midot","זְרִיזוּת","הַשְׁכָּמָה","אֵיךְ קָמִים בַּבֹּקֶר בִּזְרִיזוּת וּבְחֵשֶׁק, מָה הַיֵּצֶר אוֹמֵר, וְאֵיךְ הוֹלְכִים לִישֹׁן כְּדֵי לָקוּם","../midot/../halacha-quiz/zrizut-10.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/zrizut-10-b1.webp"],["midot","זְרִיזוּת","מִצְוָה שֶׁבָּאָה לְיָדְךָ – אֲפִלּוּ בַּשֶּׁלֶג","הָרַב חַיִּים זוֹנֶנְפֶלְד יוֹצֵא בַּשֶּׁלֶג וּבַסּוּפָה, וְאֵין לוֹ תֵּרוּצִים: מָה אוֹמֶרֶת הַזְּרִיזוּת עַל מִצְוָה שֶׁבָּאָה לַיָּד?","../midot/../halacha-quiz/zrizut-11.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/zrizut-11-b1.webp"],["midot","זְרִיזוּת","בְּעַצְמִי, בִּזְרִיזוּת – הַכְּרָכָּרָה, הַמִּכְתָּב וְעֶרֶב פֶּסַח","הָרַב חַיִּים זוֹנֶנְפֶלְד לֹא שׁוֹלֵחַ אֲחֵרִים: הוּא עוֹלֶה בַּגֶּשֶׁם, רָץ לְבֵית הַחוֹלִים וּמְחַלֵּק כֶּסֶף לְפֶסַח. מָה אוֹמֵר זָרִיז עַל מִצְוָה שֶׁעוֹשִׂים בְּעַצְמוֹ?","../midot/../halacha-quiz/zrizut-12.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/zrizut-12-b1.webp"],["midot","זְרִיזוּת","הַמָּשִׁיחַ מַתִּיר אֶת הַתַּחְבּוֹשֶׁת – זְרִיזוּת לְפַיֵּס","הָרַב חַיִּים זוֹנֶנְפֶלְד הוֹלֵךְ בַּלַּיְלָה לְפַיֵּס, וּמֵבִיא סִפּוּר מֵהַגְּמָרָא עַל הַמָּשִׁיחַ: כָּל דַּקָּה חֲשׁוּבָה, גַּם כְּשֶׁמְּפַיְּסִים.","../midot/../halacha-quiz/zrizut-13.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/zrizut-13-b1.webp"],["midot","זְרִיזוּת","רַבִּי נַחוּם מֵהוֹרַדְנָא – רְגָעִים כְּמוֹ מַרְגָּלִיּוֹת","הוּא סָפַר אֶת הָרְגָעִים כְּמוֹ מַרְגָּלִיּוֹת, יָשֵׁן בַּבְּגָדִים, אָסַף צְדָקָה בְּתַרְמִיל וְרָץ בְּכָל יוֹם שִׁשִּׁי לְזָרֵז אֶת הָעִיר לִקְרַאת הַשַּׁבָּת.","../midot/../halacha-quiz/zrizut-14.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/zrizut-14-b1.webp"],["midot","זְרִיזוּת","בְּעֶרֶב יוֹם כִּפּוּר – רָצִים לַעֲזֹר","רַבִּי זֶרַח בְּרַוֶּרְמַן, הָעֶזְרָה שֶׁלֹּא מְחַכָּה, וְלָמָּה זְרִיזוּת הִיא אַהֲבָה","../midot/../halacha-quiz/zrizut-15.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/zrizut-15-b1.webp"],["midot","זְרִיזוּת","לֹא הִקְדִּימוּ אוֹתוֹ – שָׁלוֹם רִאשׁוֹן","רַבִּי מֹשֶׁה לֵייב מִסַּסּוֹב, הַדֶּלֶת שֶׁנִּפְתַּחַת מִיָּד, וְהַזְּרִיזוּת שֶׁל לוֹמַר שָׁלוֹם","../midot/../halacha-quiz/zrizut-16.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/zrizut-16-b1.webp"],["midot","זְרִיזוּת","הַלְוָאָה בַּשֶּׁלֶג – מְקַיְּמִים בַּזְּמַן","רַבִּי אַרְיֵה לֵוִין, הַהַבְטָחָה שֶׁמְּקַיְּמִים בְּדִיּוּק, וְהַחֵפֶץ חַיִּים שֶׁחָשׁ לְשַׁלֵּם","../midot/../halacha-quiz/zrizut-17.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/zrizut-17-b1.webp"],["midot","זְרִיזוּת","הַנַּעַר שֶׁלֹּא זָז","סִפּוּר עַל יֶלֶד יָתוֹם שֶׁהֶחְלִיט לִלְמֹד תּוֹרָה, לֹא וִתֵּר, וְלָמַדְנוּ מִמֶּנּוּ נְחִישׁוּת בְּבִצּוּעַ הַחְלָטוֹת","../midot/../halacha-quiz/zrizut-18.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/zrizut-18-b1.webp"],["midot","זְרִיזוּת","אֵיךְ נַעֲשִׂים זְרִיזִים?","דְּרָכִים לִקְנִיַּת הַזְּרִיזוּת: הִתְבּוֹנְנוּת בַּטּוֹבוֹת, שְׁאִיפָה, תָּכְנִית, הֶרְגֵּל וְלִמּוּד מִגְּדוֹלִים","../midot/../halacha-quiz/zrizut-19.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/zrizut-19-b1.webp"],["midot","זְרִיזוּת","סִכּוּם: זָרִיז וְלֹא פַּזִּיז","חֲמִשָּׁה חֶלְקֵי הַזְּרִיזוּת, הַהֶבְדֵּל בֵּין זְרִיזוּת לִפְזִיזוּת, וְהַזְּרִיזוּת הַגְּדוֹלָה – לָרוּץ אַחֲרֵי ה׳","../midot/../halacha-quiz/zrizut-20.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/zrizut-20-b1.webp"],["midot","אֱמֶת","הָעוֹלָם עוֹמֵד עַל הָאֱמֶת","מִי הוּא אִישׁ אֱמֶת, לָמָּה יִתְרוֹ בִּקֵּשׁ שָׂרִים שֶׁהֵם אַנְשֵׁי אֱמֶת, וְאֵיךְ הוֹלְכִים בְּדֶרֶךְ הָאֱמֶת","../midot/../halacha-quiz/emet-01.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/emet-01-b1.webp"],["midot","אֱמֶת","עִיר הָאֱמֶת","סִפּוּרוֹ שֶׁל רַב טַבְיוּמִי בְּעִיר שֶׁכֻּלָּם בָּהּ דּוֹבְרֵי אֱמֶת, וּמָה לּוֹמְדִים מִמֶּנּוּ עַל שְׁמִירָה עַל כָּל מִלָּה","../midot/../halacha-quiz/emet-02.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/emet-02-b1.webp"],["midot","אֱמֶת","הַשֶּׁקֶר וְהַהֶפְסֵד","מַה קָּרָה לַשֶּׁקֶר שֶׁרָצָה לְהִכָּנֵס לַתֵּבָה, וְלָמָּה לַשֶּׁקֶר אֵין רַגְלַיִם","../midot/../halacha-quiz/emet-03.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/emet-03-b1.webp"],["midot","אֱמֶת","הַמַּקֵּל שֶׁל בַּר תַּלְמְיוֹן","אִישׁ יָשָׁר, שְׁבוּעָה מְתֻחְכֶּמֶת וְקָנֶה שֶׁנִּשְׁבַּר – וְלָמָּה שֶׁקֶר אֵינוֹ מַחֲזִיק מַעֲמָד","../midot/../halacha-quiz/emet-04.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/emet-04-b1.webp"],["midot","אֱמֶת","מָה עוֹשִׂים כְּשֶׁאַף אֶחָד לֹא רוֹאֶה?","יֹשֶׁר בַּסֵּתֶר, חֲמִשָּׁה שְׁקָלִים מוּל שְׁלוֹשִׁים אֶלֶף, וְלָמָּה הָאֱמֶת נִבְחֶנֶת כְּשֶׁהִיא עוֹלָה לָנוּ","../midot/../halacha-quiz/emet-05.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/emet-05-b1.webp"],["midot","אֱמֶת","לְהוֹדוֹת עַל הָאֱמֶת","הֶחָכָם מוֹדֶה עַל הָאֱמֶת: ׳טָעִיתִי׳, ׳לֹא שָׁמַעְתִּי׳, ׳צָדַקְתָּ׳ – מִשְׁנָה מִפִּרְקֵי אָבוֹת וּמַה לוֹמְדִים מִמֶּנָּה","../midot/../halacha-quiz/emet-06.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/emet-06-b1.webp"],["midot","אֱמֶת","כַּלָּה נָאָה וַחֲסוּדָה","בֵּית שַׁמַּאי וּבֵית הִלֵּל נֶחְלְקוּ אֵיךְ מְשַׁבְּחִים כַּלָּה, וּמָה זֶה מְלַמֵּד עַל אֱמֶת וְשָׁלוֹם בַּחַיִּים שֶׁלָּנוּ","../midot/../halacha-quiz/emet-07.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/emet-07-b1.webp"],["midot","אֱמֶת","שְׂפַת אֱמֶת תִּכּוֹן לָעַד","הָאֱמֶת עוֹמֶדֶת וְהַשֶּׁקֶר לֹא מַחְזִיק מַעֲמָד, וְכָךְ עָמַד יוֹסֵף בַּנִּסָּיוֹן וְקִבֵּל הַכֹּל מִשֶּׁלּוֹ","../midot/../halacha-quiz/emet-08.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/emet-08-b1.webp"],["midot","אֱמֶת","הַחוֹתָם שֶׁלִּי","חוֹתָמוֹ שֶׁל ה׳ הוּא אֱמֶת – אֵיזֶה חוֹתָם אֲנִי רוֹצֶה שֶׁיִּהְיֶה לִי? תּוֹכוֹ כְּבָרוֹ, וִיסוֹד הָעוֹלָם","../midot/../halacha-quiz/emet-09.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/emet-09-b1.webp"],["midot","שְׁמִירַת הַלָּשׁוֹן","הַנֵּר הָאֶמְצָעִי","לָמָּה הַפֶּה נִמְצָא בְּאֶמְצַע הַפָּנִים, וּמָה כֹּחוֹ שֶׁל הַדִּבּוּר","../midot/../halacha-quiz/lashon-01.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/lashon-01-b1.webp"],["midot","שְׁמִירַת הַלָּשׁוֹן","הַמֶּלֶךְ שֶׁל הָאֵיבָרִים","מַעֲשֶׂה בְּמֶלֶךְ פָּרַס וּבַחֲלֵב לְבִיאָה, וְאֵיךְ הַלָּשׁוֹן הִצִּילָה","../midot/../halacha-quiz/lashon-02.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/lashon-02-b1.webp"],["midot","שְׁמִירַת הַלָּשׁוֹן","מִלָּה בְּסֶלַע, שְׁתִיקָה בִּשְׁתַּיִם","לָמָּה חוֹשְׁבִים לִפְנֵי שֶׁמְּדַבְּרִים, וְאֵיךְ בּוֹחֲרִים אֶת הַמִּלָּה הַנְּכוֹנָה","../midot/../halacha-quiz/lashon-03.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/lashon-03-b1.webp"],["midot","שְׁמִירַת הַלָּשׁוֹן","בְּרָכָה שֶׁל מִי שֶׁלֹּא חָשַׁבְנוּ","אַל תְּהִי בִּרְכַּת הֶדְיוֹט קַלָּה בְּעֵינֶיךָ – כֹּחָהּ שֶׁל בְּרָכָה מִן הַלֵּב","../midot/../halacha-quiz/lashon-04.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/lashon-04-b1.webp"],["midot","שְׁמִירַת הַלָּשׁוֹן","הַדִּבּוּר מְחַבֵּר אֶת הַלֵּב","אֵיךְ הַדִּבּוּר מַעֲבִיר אֶת הָאֱמוּנָה מֵהָרֹאשׁ אֶל הַלֵּב, וְלָמָּה כְּדַאי לוֹמַר תּוֹדָה בַּפֶּה גַּם כְּשֶׁהַלֵּב עוֹד לֹא מַרְגִּישׁ","../midot/../halacha-quiz/lashon-05.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/lashon-05-b1.webp"],["midot","שְׁמִירַת הַלָּשׁוֹן","הַפֶּה נִבְרָא לְהוֹדוֹת","לָמָּה נִבְרָא הַפֶּה, אֵיךְ רְאִיַּת הַטּוֹב מְבִיאָה לְהוֹדָיָה, וְלָמָּה מִי שֶׁמְּחַפֵּשׂ רַע מוֹצֵא אוֹתוֹ אֲפִלּוּ בַּמָּן","../midot/../halacha-quiz/lashon-06.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/lashon-06-b1.webp"],["midot","שְׁמִירַת הַלָּשׁוֹן","מִרְיָם וְהַפֶּה","אֵם הַשִּׁירָה בְּיִשְׂרָאֵל וְהַלֶּקַח שֶׁלָּהּ עַל כֹּחַ הַפֶּה: פֶּה שֶׁל שִׁירָה אוֹ פֶּה שֶׁל תְּלוּנָה","../midot/../halacha-quiz/lashon-07.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/lashon-07-b1.webp"],["midot","שְׁמִירַת הַלָּשׁוֹן","הַנּוֹצוֹת וְהַמִּלִּים","סִפּוּר עַל אֶלְחָנָן וְהַכָּרִית בַּשּׁוּק – לָמָּה אִי אֶפְשָׁר לֶאֱסֹף מִלִּים שֶׁיָּצְאוּ מֵהַפֶּה, וְאֵיךְ מְתַקְּנִים","../midot/../halacha-quiz/lashon-08.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/lashon-08-b1.webp"],["midot","שְׁמִירַת הַלָּשׁוֹן","פְּרָחִים אוֹ קוֹצִים?","מִלִּים שֶׁמְּשַׂמְּחוֹת וּמִלִּים שֶׁדּוֹקְרוֹת – אֵיךְ מַחֲלִיפִים קוֹץ בְּפֶרַח, וּמְדַבְּרִים עַל הַמַּעֲשֶׂה וְלֹא עַל הַיֶּלֶד","../midot/../halacha-quiz/lashon-09.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/lashon-09-b1.webp"],["midot","שְׁמִירַת הַלָּשׁוֹן","מִי נִפְגָּע?","לָשׁוֹן הָרָע פּוֹגַעַת בִּשְׁלוֹשָׁה: הַמְדַבֵּר, הַמַּקְשִׁיב וְהַמְדֻבָּר עָלָיו – וּמָה עוֹשִׂים כְּשֶׁמַּתְחִילִים לְסַפֵּר","../midot/../halacha-quiz/lashon-10.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/lashon-10-b1.webp"],["midot","שְׁמִירַת הַלָּשׁוֹן","גַּם הַמְרַגְּלִים דִּבְּרוּ אֱמֶת","אֵיךְ דִּבּוּר שֶׁכֻּלּוֹ אֱמֶת יָכוֹל לִהְיוֹת דִּבַּת הָאָרֶץ, מָה הִפְרִיד בֵּין מֹשֶׁה לַמְרַגְּלִים, וְאֵיךְ מְסַפְּרִים אֶת אוֹתָהּ אֱמֶת בְּדֶרֶךְ שֶׁמְּקָרֶבֶת","../midot/../halacha-quiz/lashon-11.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/lashon-11-b1.webp"],["midot","שְׁמִירַת הַלָּשׁוֹן","אֵין כָּמוֹהָ","לָמָּה אָסוּר אֲפִלּוּ לוֹמַר שֶׁמָּקוֹם אַחֵר טוֹב כְּמוֹ אֶרֶץ יִשְׂרָאֵל, מַה הַחִדּוּשׁ בָּאִסּוּר הַזֶּה, וּמָה שְׁלוֹשֶׁת הַטְּעָמִים","../midot/../halacha-quiz/lashon-12.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/lashon-12-b1.webp"],["midot","שְׁמִירַת הַלָּשׁוֹן","סַנְחֵרִיב שֶׁלֹּא סִפֵּר בִּגְנוּתָהּ","לָמָּה זָכָה מֶלֶךְ רָשָׁע לְשֵׁם שֶׁל כָּבוֹד, מַה אָמְרוּ יִשְׂרָאֵל בַּגָּלוּת שֶׁנֶּחְשָׁב גְּנוּת, וְאֵיךְ גַּם אֲנִי יָכוֹל לִהְיוֹת ׳רַבָּא וִיקִירָא׳","../midot/../halacha-quiz/lashon-13.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/lashon-13-b1.webp"],["midot","שְׁמִירַת הַלָּשׁוֹן","אֶפְתַּח אֶת הָעַיִן הַטּוֹבָה","אֵיךְ אֶפְשָׁר לְאַמֵּן עַיִן טוֹבָה וְאֹזֶן טוֹבָה, מַה לָּמַדְנוּ מֵהָאַמְרֵי אֱמֶת וּמִשְּׁלִיחִים שֶׁלֹּא הִתְאִימוּ, וְאֵיךְ אֲנִי שָׁלִיחַ שֶׁל הָאָרֶץ","../midot/../halacha-quiz/lashon-14.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/lashon-14-b1.webp"],["midot","שְׁמִירַת הַלָּשׁוֹן","לִמְחֹק אֶת הַמִּלִּים","לָמָּה צִוָּה הָאַבִּיר יַעֲקֹב מִסָּדִיגּוּרָא לִמְחֹק מִשְׁפָּט מִמִּכְתָּב בַּקָּשָׁה, וְאֵיךְ מְבַקְּשִׁים עֶזְרָה בְּלִי לְדַבֵּר רַע עַל הָאָרֶץ","../midot/../halacha-quiz/lashon-15.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/lashon-15-b1.webp"],["midot","שְׁמִירַת הַלָּשׁוֹן","דִּבּוּרִים כָּאֵלֶּה תָּבִיא לִי","מָה קָרָה לַחֲסִיד שֶׁאָמַר ׳הַלְוַאי שֶׁכָּךְ בְּכָל אֶרֶץ יִשְׂרָאֵל׳, וְלָמָּה פְּנֵי הָרַבִּי מִבֶּעלְז צָהֲלוּ בְּעֶרֶב יוֹם כִּפּוּר","../midot/../halacha-quiz/lashon-16.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/lashon-16-b1.webp"],["midot","שְׁמִירַת הַלָּשׁוֹן","שֶׁלֹּא לְהוֹצִיא לַעַז עַל הָאָרֶץ","אֵיךְ חָזַר רַבִּי יַעֲקֹב שִׁמְשׁוֹן מִשְּׁפִּיטְבְּקָה מֵאֶרֶץ יִשְׂרָאֵל בְּפָנִים טוֹבוֹת, וּמָה לָמַדְנוּ מִמֶּנּוּ וּמֵרַבָּנִים נוֹסָפִים עַל שֵׁם טוֹב לָאָרֶץ","../midot/../halacha-quiz/lashon-17.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/lashon-17-b1.webp"],["midot","שְׁמִירַת הַלָּשׁוֹן","הַנְּצִי״ב וְהַסְּטָטִיסְטִיקָה","מָה עָנָה הַנְּצִי״ב מִוָּלוֹזִ׳ין לְמִי שֶׁהֵבִיא מִסְפָּרִים וְחִשּׁוּבִים נֶגֶד אֶרֶץ יִשְׂרָאֵל, וְאֵיךְ אֶפְשָׁר לָדַעַת עוּבְדּוֹת וְגַם לְהַאֲמִין שֶׁטּוֹבָה הָאָרֶץ","../midot/../halacha-quiz/lashon-18.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/lashon-18-b1.webp"],["midot","עֲנָוָה וְנַחַת","מַהִי עֲנָוָה?","עֲנָוָה אֵינָהּ לַחְשֹׁב שֶׁאֲנִי קָטָן, אֶלָּא לָדַעַת שֶׁהַכֹּל מַתָּנָה – כְּמוֹ מֹשֶׁה, וְכָךְ הִיא מוֹלִידָה תּוֹדָה","../midot/../halacha-quiz/nefesh-01.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/nefesh-01-b1.webp"],["midot","עֲנָוָה וְנַחַת","שְׁמוּאֵל הַקָּטָן","הַגָּדוֹל שֶׁהִקְטִין אֶת עַצְמוֹ: שְׁמוּאֵל הַקָּטָן בַּעֲלִיָּה, וּכְבוֹד הֶחָבֵר שֶׁחָשׁוּב מִכְּבוֹדוֹ","../midot/../halacha-quiz/nefesh-02.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/nefesh-02-b1.webp"],["midot","עֲנָוָה וְנַחַת","הַשֶּׁמֶשׁ וְהַיָּרֵחַ","הַאִם הַשֶּׁמֶשׁ יְכוֹלָה לְהִתְגָּאוֹת עַל הַיָּרֵחַ? לְכָל אֶחָד מָקוֹם, וְהַגַּאֲוָה מַפִּילָה אֶת עַצְמָהּ","../midot/../halacha-quiz/nefesh-03.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/nefesh-03-b1.webp"],["midot","עֲנָוָה וְנַחַת","הַבִּימָה שֶׁל לֵוִי בַּר סִיסִי","תַּלְמִיד חָכָם גָּדוֹל שֶׁיָּשַׁב עַל בִּימָה גְּבוֹהָה, שָׁכַח אֶת תַּלְמוּדוֹ, וְלָמַד שֶׁהַתּוֹרָה נִשְׁאֶרֶת בְּלֵב עָנָו","../midot/../halacha-quiz/nefesh-04.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/nefesh-04-b1.webp"],["midot","עֲנָוָה וְנַחַת","הִשָּׁמֶר לְךָ פֶּן תִּשְׁכַּח","לָמָּה גַּאֲוָה הִיא שִׁכְחָה, וְאֵיךְ הַתּוֹדָה שֶׁל בִּרְכַּת הַמָּזוֹן מַצִּילָה אוֹתָנוּ","../midot/../halacha-quiz/nefesh-05.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/nefesh-05-b1.webp"],["midot","עֲנָוָה וְנַחַת","אַרְבַּע מֵאוֹת זוּז שֶׁל סַבְלָנוּת","הִלֵּל שֶׁלֹּא כָּעַס, וְאֵיךְ נִשְׁאָרִים רְגוּעִים גַּם כְּשֶׁמַּרְגִּיזִים אוֹתָנוּ","../midot/../halacha-quiz/nefesh-06.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/nefesh-06-b1.webp"],["midot","עֲנָוָה וְנַחַת","שַׁמַּאי וְהִלֵּל וְהַגֵּרִים","שְׁלוֹשָׁה גֵּרִים, שְׁתֵּי דְּרָכִים, וּמָה לָמַדְנוּ מִ׳עַנְוְתָן כְּהִלֵּל׳","../midot/../halacha-quiz/nefesh-07.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/nefesh-07-b1.webp"],["midot","עֲנָוָה וְנַחַת","כַּעַס שֶׁמַּשְׁכִּיחַ","לָמָּה בִּשְׁעַת כַּעַס מִסְתַּלְּקוֹת הַחָכְמָה וְהָאֱמוּנָה, מָה לָמְדוּ חֲכָמִים עַל מִי שֶׁשּׁוֹבֵר בַּחֲמָתוֹ, וְאֵיךְ מִתְרַחֲקִים מִן הַכַּעַס","../midot/../halacha-quiz/nefesh-08.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/nefesh-08-b1.webp"],["midot","עֲנָוָה וְנַחַת","לְדַבֵּר בְּנַחַת","הָעֵצָה הַמְּיֻחֶדֶת שֶׁל הָרַמְבַּ״ן, לָמָּה בְּנַחַת יֵשׁ זְמַן לַחֲשֹׁב, וְאֵיךְ נִשְׁאָרִים רְגוּעִים גַּם כְּשֶׁמַּרְגִּיזִים אוֹתָנוּ","../midot/../halacha-quiz/nefesh-09.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/nefesh-09-b1.webp"],["midot","עֲנָוָה וְנַחַת","הָאוֹת א׳ וְהַסַּבְלָנוּת","רַבִּי יִצְחָק מִוּוּרְקִי מְלַמֵּד יֶלֶד אֶת הָאוֹת הָרִאשׁוֹנָה, וְלוֹמֵד מַהִי סַבְלָנוּת, אֹרֶךְ אַפַּיִם וְאֵיךְ אֶפְשָׁר לִקְנוֹת אוֹתָהּ","../midot/../halacha-quiz/nefesh-10.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/nefesh-10-b1.webp"],["midot","נִפְלְאוֹת הַבְּרִיאָה","בְּחֵן בְּחֶסֶד וּבְרַחֲמִים – הַיֹּפִי הוּא אַהֲבָה","לָמָּה ה׳ בָּרָא עוֹלָם יָפֶה, מָה זֶה ׳חֵן׳, וְאֵיךְ רוֹאִים בַּיֹּפִי אֶת הָאַהֲבָה","../midot/../halacha-quiz/pliot-01.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/pliot-01-b1.webp"],["midot","נִפְלְאוֹת הַבְּרִיאָה","אֲשֶׁר יָצַר אֶת הָאָדָם בְּחָכְמָה","לָמָּה הַגּוּף לֹא צָרִיךְ שִׁכְלוּל, מַהוּ הַנָּאד שֶׁל רַשִׁ״י, וּמַהוּ נֶקֶב וּמַהוּ חָלָל","../midot/../halacha-quiz/pliot-02.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/pliot-02-b1 בּוֹ","הַיָּם, הַגַּלִּים, הַמַּיִם וְהַגֶּשֶׁם, הַדָּגִים וְהֶחָגָב – אֵיךְ הַכֹּל בָּנוּי בְּחָכְמָה","../midot/../halacha-quiz/pliot-09.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/pliot-09-b1.webp"],["midot","נִפְלְאוֹת הַבְּרִיאָה","הוּא עָשָׂנוּ וְלוֹ אֲנַחְנוּ – מֵהִתְפַּעֲלוּת לְהוֹדָיָה","סִכּוּם הַסִּדְרָה: לָמָּה נִבְרָא הָאָדָם, מַהִי מַתְּנַת הַחַיִּים, וְאֵיךְ הוֹפְכִים הִתְפַּעֲלוּת לְהוֹדָיָה","../midot/../halacha-quiz/pliot-10.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/pliot-10-b1.webp"],["midot","הָרְגָשׁוֹת שֶׁלִּי בַּתּוֹרָה","לָמָּה ה׳ נָתַן לִי רְגָשׁוֹת?","מָתַי הָרֶגֶשׁ מַצִּיל אוֹתִי, מָה הַקֶּשֶׁר בֵּין רֶגֶשׁ לִתְזוּזָה, וּמָתַי צָרִיךְ לְהַפְעִיל אֶת הַשֵּׂכֶל","../midot/../halacha-quiz/regashot-01.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/regashot-01-b1.webp"],["midot","הָרְגָשׁוֹת שֶׁלִּי בַּתּוֹרָה","לִקְרֹא לָרֶגֶשׁ בְּשֵׁם","מָה הַהֶבְדֵּל בֵּין מַחֲשָׁבָה לְרֶגֶשׁ, אֵיךְ קוֹרְאִים לַפַּחַד וְלַשִּׂמְחָה, וּמַהוּ מַד הָרֶגֶשׁ","../midot/../halacha-quiz/regashot-02.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/regashot-02-b1.webp"],["midot","הָרְגָשׁוֹת שֶׁלִּי בַּתּוֹרָה","הַלֵּב רוֹאֶה, שׁוֹמֵעַ וּמְדַבֵּר","אֵיךְ מְתָאֶרֶת הַתּוֹרָה אֶת הַלֵּב כְּמוֹ אָדָם: רוֹאֶה, שׁוֹמֵעַ, שָׂמֵחַ, חָרֵד וְחַם","../midot/../halacha-quiz/regashot-03.html"],["midot","הָרְגָשׁוֹת שֶׁלִּי בַּתּוֹרָה","הַצַּדִּיקִים – לִבָּם בִּרְשׁוּתָם","מִי מַחְלִיט – הַלֵּב אוֹ אֲנִי? מָה אָמַר הָמָן בְּלִבּוֹ, מָה עָשָׂה דָּנִיֵּאל, וְאֵיךְ מְדַבְּרִים אֶל הַלֵּב","../midot/../halacha-quiz/regashot-04.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/regashot-04-b1.webp"],["midot","הָרְגָשׁוֹת שֶׁלִּי בַּתּוֹרָה","פַּחַד שֶׁמַּזִּיק וּפַחַד שֶׁשּׁוֹמֵר","מָה קוֹרֶה כְּשֶׁאֲנִי פּוֹחֵד, מָתַי הַפַּחַד עוֹזֵר, מָה פֵּרוּשׁ ׳פּוֹחֵד׳ מוּל ׳מְפַחֵד׳, וְאֵיךְ בּוֹטְחִים בַּה׳","../midot/../halacha-quiz/regashot-05.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/regashot-05-b1.webp"],["midot","הָרְגָשׁוֹת שֶׁלִּי בַּתּוֹרָה","דְּאָגָה בְּלֵב אִישׁ – יְשִׂיחֶנָּה","מָה עוֹשִׂים כְּשֶׁיֵּשׁ דְּאָגָה בַּלֵּב: לְהָסִיחַ לְדָבָר טוֹב, לְלִמּוּד תּוֹרָה, וּלְסַפֵּר לְמִי שֶׁאִכְפַּת לוֹ","../midot/../halacha-quiz/regashot-06.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/regashot-06-b1.webp"],["midot","הָרְגָשׁוֹת שֶׁלִּי בַּתּוֹרָה","עֶצֶב וְאַכְזָבָה – קַבְּלָנֵי עֲבוֹדָה","מָה עוֹשִׂים כְּשֶׁלֹּא הִצְלַחְתִּי, מָה הַהֶבְדֵּל בֵּין לֵב נִשְׁבָּר לְעַצְבוּת, וְאֵיךְ הַהוֹדָיָה מְחַזֶּקֶת אוֹתִי","../midot/../halacha-quiz/regashot-07.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/regashot-07-b1.webp"],["midot","הָרְגָשׁוֹת שֶׁלִּי בַּתּוֹרָה","לֹא תַחְמֹד – עַיִן רוֹאָה וְלֵב חוֹמֵד","אֵיךְ אֶפְשָׁר לְצַוּוֹת עַל רֶגֶשׁ, מָה גִּלּוּ הַחוֹקְרִים בְּנִסָּיוֹן הַמַּרְשְׁמַלּוֹ, וּמָה עוֹזֵר כְּשֶׁהַלֵּב רוֹצֶה אֶת מָה שֶׁלַּחֲבֵרִי","../midot/../halacha-quiz/regashot-08.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/regashot-08-b1.webp"],["midot","הָרְגָשׁוֹת שֶׁלִּי בַּתּוֹרָה","לֵב חַם – לְהַרְגִּישׁ אֶת הַשֵּׁנִי","לָמָּה ׳לֹא תְאַמֵּץ אֶת לְבָבְךָ׳, מָה אוֹמְרִים לְחָבֵר שֶׁקָּרְתָה לוֹ צָרָה, וְאֵיךְ מִתְחַבְּרִים לְלֵב שֶׁל הַשֵּׁנִי","../midot/../halacha-quiz/regashot-09.html"],["midot","הָרְגָשׁוֹת שֶׁלִּי בַּתּוֹרָה","הַשֵּׂכֶל מְנַהֵל אֶת הַלֵּב","לָמָּה הַלֵּב שׁוֹאֵל ׳כְּדַאי׳, אֵיךְ מְשַׁכְנְעִים אוֹתוֹ, מָה לָמַדְנוּ מִמִּבְחַן הַמַּרְשְׁמֶלוֹ, וְסִכּוּם הַסִּדְרָה","../midot/../halacha-quiz/regashot-10.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/regashot-10-b1.webp"],["midot","לָמָּה עוֹשִׂים מִצְווֹת?","לְטוֹב לָךְ – לָמָּה ה׳ נָתַן מִצְווֹת?","ה׳ לֹא צָרִיךְ אֶת הַמִּצְווֹת, הוּא רוֹצֶה לְהֵיטִיב לָנוּ – מָשָׁל הַמְּעָרוֹת וּמָה עוֹשִׂים כְּשֶׁקָּשֶׁה","../midot/../halacha-quiz/lama-01.html"],["midot","לָמָּה עוֹשִׂים מִצְווֹת?","אַחֲרֵי הַמַּעֲשִׂים נִמְשָׁכִים הַלְּבָבוֹת","הַמִּצְווֹת בּוֹנוֹת אֶת הַלֵּב – מַיִם שׁוֹחֲקִים אֲבָנִים, רַכֶּבֶת הָרִים, וְהָרָצוֹן שֶׁלָּנוּ","../midot/../halacha-quiz/lama-02.html"],["midot","לָמָּה עוֹשִׂים מִצְווֹת?","לְאָן נוֹסַעַת הַמְּכוֹנִית? – מָה חוֹשְׁבִים בִּשְׁעַת מִצְוָה","הָרֶכֶב הַמְּשֻׁכְלָל, הַנִּרְדָּם בַּנְּסִיעָה, שְׁלוֹשָׁה אֲנָשִׁים בִּתְפִלִּין וְ׳בְּפִיךָ וּבִלְבָבְךָ׳","../midot/../halacha-quiz/lama-03.html"],["midot","לָמָּה עוֹשִׂים מִצְווֹת?","לִשְׁמָהּ – לַעֲשׂוֹת נַחַת רוּחַ לַה׳","בִּשְׁבִיל מִי עוֹשִׂים מִצְוָה, מָה זֶה נַחַת רוּחַ, וְאֵיךְ הָאֲחוּזִים שֶׁל לִשְׁמָהּ גְּדֵלִים","../midot/../halacha-quiz/lama-04.html"],["midot","לָמָּה עוֹשִׂים מִצְווֹת?","אַרְבַּע פְּסִיעוֹת – כַּמָּה שָׁוֶה מִצְוָה לִכְבוֹד שָׁמַיִם","הַמֶּלֶךְ שֶׁרָץ לִכְבוֹד ה׳, הַמִּכְתָּב מִבָּבֶל, וְלָמָּה מִצְוָה שֶׁנַּעֲשֵׂית לִכְבוֹד שָׁמַיִם שָׁוָה כָּל כָּךְ הַרְבֵּה","../midot/../halacha-quiz/lama-05.html"],["midot","לָמָּה עוֹשִׂים מִצְווֹת?","הֱוֵי זָהִיר בְּמִצְוָה קַלָּה כְּבַחֲמוּרָה","לָמָּה כָּל מִצְוָה חֲשׁוּבָה, מָה הַשָּׂכָר עַל הַטֹּרַח, וְאֵיךְ הַפְּסִיעוֹת לְבֵית הַכְּנֶסֶת סוֹפְרוֹת","../midot/../halacha-quiz/lama-06.html"],["midot","לָמָּה עוֹשִׂים מִצְווֹת?","זֶה אֵלִי וְאַנְוֵהוּ – מִצְוָה חֲבִיבָה","לָמָּה מִי שֶׁמּוֹדֶה מְהַדֵּר, מָה הָיָה בְּמַסַּע הַבִּכּוּרִים, וְאֵיךְ מְכַבְּדִים מִצְווֹת","../midot/../halacha-quiz/lama-07.html"],["midot","לָמָּה עוֹשִׂים מִצְווֹת?","הִנְנִי מוּכָן וּמְזֻמָּן – לִפְנֵי, בִּזְמַן, אַחֲרֵי","שָׁלוֹשׁ תַּחֲנוֹת בְּכָל מִצְוָה: לְהָכִין אֶת הַלֵּב, לִשְׂמֹחַ בִּזְמַן הַמַּעֲשֶׂה, וְלִשְׂמֹחַ אַחֲרָיו","../midot/../halacha-quiz/lama-08.html"],["midot","לָמָּה עוֹשִׂים מִצְווֹת?","שְׂכַר מִצְוָה מִצְוָה – רַכֶּבֶת הַמִּצְווֹת","מַדּוּעַ מִצְוָה גּוֹרֶרֶת מִצְוָה, מַהִי הָרוּחַ מִמָּרוֹם שֶׁל הַגְּר״א, וְאֵיךְ מַתְחִילִים רַכֶּבֶת בִּשְׁתֵּי דַּקּוֹת","../midot/../halacha-quiz/lama-09.html"],["midot","לָמָּה עוֹשִׂים מִצְווֹת?","לָמָּה ה׳ לֹא מְפַרְנֵס אֶת הָעֲנִיִּים? – הַמִּצְווֹת מְתַקְּנוֹת אוֹתִי","הַשְּׁאֵלָה שֶׁל טוּרְנוּסְרוּפוּס, ׳לְצָרֵף אֶת הַבְּרִיּוֹת׳, וְסִכּוּם הַסִּדְרָה: אוֹצַר הַמִּצְווֹת שֶׁלִּי","../midot/../halacha-quiz/lama-10.html"],["shira","🎶 עֶשֶׂר הַשִּׁירוֹת","הַשִּׁירָה הָרִאשׁוֹנָה – שִׁירָה בַּלַּיְלָה","עֶשֶׂר שִׁירוֹת הֵן, הַהַלֵּל בְּלֵיל הַפֶּסַח שֶׁלִּפְנֵי הַיְּצִיאָה, וְ׳קוֹל רִנָּה׳ שֶׁקּוֹדֵם לַיְשׁוּעָה","../halacha-quiz/shirot-01.html"],["shira","🎶 עֶשֶׂר הַשִּׁירוֹת","אָז יָשִׁיר – קֹדֶם אֱמוּנָה, אַחַר כָּךְ שִׁירָה","שִׁירָה שֶׁעוֹלָה מֵהַלֵּב, ׳זֶה אֵלִי וְאַנְוֵהוּ׳, וְאַרְבָּעָה גֵּאִים","../halacha-quiz/shirot-02.html"],["shira","🎶 עֶשֶׂר הַשִּׁירוֹת","עֲלִי בְאֵר – הַבְּאֵר שֶׁשָּׁרָה","הַנֵּס הַנִּסְתָּר, שְׁנֵים עָשָׂר נְשִׂיאִים, וְ׳פִּי הַבְּאֵר׳","../halacha-quiz/shirot-03.html"],["shira","🎶 עֶשֶׂר הַשִּׁירוֹת","הַאֲזִינוּ – כִּי שֵׁם ה׳ אֶקְרָא","הַמָּקוֹר לִבְרָכַת הַתּוֹרָה, קֹדֶם שֶׁבַח וְאַחַר כָּךְ בַּקָּשָׁה, וְרַבִּי חִיָּיא וּבָנָיו","../halacha-quiz/shirot-04.html"],["shira","🎶 עֶשֶׂר הַשִּׁירוֹת","אָז יְדַבֵּר יְהוֹשֻׁעַ – מִי שֶׁמּוֹדֶה מְקַבֵּל עוֹד","יַעֲקֹב בְּבֵית אֵל, הָרַמְחַ״ל, וְשָׁלוֹשׁ שִׁירוֹת שֶׁל ׳אָז׳","../halacha-quiz/shirot-05.html"],["shira","🎶 עֶשֶׂר הַשִּׁירוֹת","שִׁשָּׁה נִסִּים בְּיוֹם אֶחָד – שִׁירַת דְּבוֹרָה וּבָרָק","׳בַּיּוֹם הַהוּא׳, בָּרָק שֶׁרָץ בְּרַגְלָיו, וְתוֹדָה שֶׁלֹּא דּוֹחִים לְמָחָר","../halacha-quiz/shirot-06.html"],["shira","🎶 עֶשֶׂר הַשִּׁירוֹת","בְּיוֹם הִצִּיל ה׳ אֹתוֹ – מַבָּט לְאָחוֹר","שִׁירָה עַל כָּל הַחַיִּים, ׳מְהֻלָּל אֶקְרָא׳ וְ׳בְּכָל יוֹם אֲבָרְכֶךָּ׳","../halacha-quiz/shirot-07.html"],["shira","🎶 עֶשֶׂר הַשִּׁירוֹת","מִזְמוֹר שִׁיר חֲנֻכַּת הַבַּיִת – תּוֹדָה עַל הַבַּיִת","דַּלְתוֹת הָאָרוֹן, שִׁיר שֶׁל תּוֹדָה עַל כָּל פִּנָּה, וְלִזְכֹּר גַּם אֶת הַדֶּרֶךְ","../halacha-quiz/shirot-08.html"],["shira","🎶 עֶשֶׂר הַשִּׁירוֹת","הוֹדוּ לַה׳ כִּי לְעוֹלָם חַסְדּוֹ – שִׁירַת יְהוֹשָׁפָט","אַרְבָּעָה מְלָכִים, ׳כִּי טוֹב׳ שֶׁחָסֵר, וְהַמֶּלֶךְ שֶׁלֹּא שָׁר","../halacha-quiz/shirot-09.html"],["shira","🎶 עֶשֶׂר הַשִּׁירוֹת","שִׁיר חָדָשׁ – הַשִּׁירָה הָעֲשִׂירִית","שִׁיר בִּלְשׁוֹן זָכָר, כָּל הַבְּרִיאָה שָׁרָה, וְכָל הַתִּזְמֹרֶת","../halacha-quiz/shirot-10.html"],["chagim","🕎 חֲנֻכָּה – לְהוֹדוֹת וּלְהַלֵּל","מָה קָרָה בַּחֲנֻכָּה?","מָה רָצוּ הַיְּוָנִים לְהַרְחִיק, אֵיךְ עָמַד מַתִּתְיָהוּ וּבָנָיו, וְאֵיךְ חָזַר הָאוֹר בְּפַךְ אֶחָד","../halacha-quiz/chanukaor-01.html"],["chagim","🕎 חֲנֻכָּה – לְהוֹדוֹת וּלְהַלֵּל","מְעַטִּים בְּיַד רַבִּים","חֲמִשָּׁה זוּגוֹת שֶׁל נֵס, שְׁאֵלַת הַמַּהֲרַ״ל לָמָּה נַעֲשָׂה נֵס גַּם בַּשֶּׁמֶן, וְאֵיךְ מוֹדִים בְּפֵרוּט עַל הַצְלָחָה","../halacha-quiz/chanukaor-02.html"],["chagim","🕎 חֲנֻכָּה – לְהוֹדוֹת וּלְהַלֵּל","פַּךְ אֶחָד – נֵס בְּתוֹךְ הַטֶּבַע","לָמָּה מוֹדִים גַּם עַל שֶׁמֶן שֶׁדּוֹלֵק בְּדֶרֶךְ הַטֶּבַע, מָה אָמַר רַבִּי חֲנִינָא עַל הַחֹמֶץ, וְאֵיךְ רוֹאִים אַהֲבָה בַּפַּךְ","../halacha-quiz/chanukaor-03.html"],["chagim","🕎 חֲנֻכָּה – לְהוֹדוֹת וּלְהַלֵּל","חֲנֻכַּת הַבַּיִת","לָמָּה אַהֲרֹן הִצְטַעֵר, מָה נָתַן לוֹ ה׳ בַּנֵּרוֹת, וְאֵיךְ הַבַּיִת שֶׁלִּי נַעֲשֶׂה מִקְדָּשׁ מְעַט","../halacha-quiz/chanukaor-04.html"],["chagim","🕎 חֲנֻכָּה – לְהוֹדוֹת וּלְהַלֵּל","לְהוֹדוֹת וּלְהַלֵּל – כָּל אֶחָד בְּעַצְמוֹ","לָמָּה חֲנֻכָּה נִתְקְנָה לְהוֹדָאָה, מָה הָאֶתְרוֹג שֶׁל חֲנֻכָּה, וְאֵיךְ אוֹמְרִים תּוֹדָה אֲמִתִּית בְּעַצְמִי","../halacha-quiz/chanukaor-05.html"],["chagim","🕎 חֲנֻכָּה – לְהוֹדוֹת וּלְהַלֵּל","לָמָּה דַּוְקָא אוֹר?","מָה הַפִּקֵּחַ בִּקֵּשׁ מֵהַסּוּמָא, לָמָּה חֲנֻכָּה בְּאֶמְצַע הַחֹרֶף, וְאֵיךְ נֵר קָטָן מֵאִיר יוֹם עָצוּב","../halacha-quiz/chanukaor-06.html"],["chagim","🕎 חֲנֻכָּה – לְהוֹדוֹת וּלְהַלֵּל","חֲנֻכִּיָּה מְהַלֶּכֶת","לָמָּה מַדְלִיקִים עַל הַפֶּתַח, מַה הַהֶבְדֵּל בֵּין לְהוֹדוֹת לְבֵין לְסַפֵּר, וְאֵיךְ אֲנִי נַעֲשֶׂה נֵר שֶׁמֵּאִיר בָּרְחוֹב","../halacha-quiz/chanukaor-07.html"],["chagim","🕎 חֲנֻכָּה – לְהוֹדוֹת וּלְהַלֵּל","בַּיָּמִים הָהֵם בַּזְּמַן הַזֶּה","אֵיךְ מוֹדִים עַל נֵס שֶׁל פַּעַם בְּעֶזְרַת נִסִּים שֶׁל הַיּוֹם, מָה עָשָׂה הַחַיֵּי אָדָם אַחֲרֵי שֶׁנִּצַּל, וְאֵיךְ פִּנְקַס נִסִּים פּוֹתֵחַ אֶת הָעֵינַיִם","../halacha-quiz/chanukaor-08.html"],["chagim","⛰️ שָׁבוּעוֹת – עָמַדְנוּ בְּהַר סִינַי","מֵהוֹדָיָה לְהוֹדָיָה – סוֹפְרִים אֶת יְמֵי הַקָּצִיר","מָה הֶבְדֵּל בֵּין הָעֹמֶר לִשְׁתֵּי הַלֶּחֶם, לָמָּה סוֹפְרִים אַרְבָּעִים וְתִשְׁעָה יָמִים, וְאֵיךְ הַלֶּחֶם מַגִּיעַ אֵלֵינוּ מוּכָן","../halacha-quiz/shavuot-01.html"],["chagim","⛰️ שָׁבוּעוֹת – עָמַדְנוּ בְּהַר סִינַי","כְּאִישׁ אֶחָד בְּלֵב אֶחָד","לָמָּה כָּתוּב ״וַיִּחַן״ בִּלְשׁוֹן יָחִיד, מַה שָּׁוֶה ״אִלּוּ קֵרְבָנוּ״, וְלָמָּה חוֹגְגִים בַּיּוֹם הַחֲמִישִׁים","../halacha-quiz/shavuot-02.html"],["chagim","⛰️ שָׁבוּעוֹת – עָמַדְנוּ בְּהַר סִינַי","קוֹלוֹת וּבְרָקִים – כְּדֵי שֶׁלֹּא נִשְׁכַּח","אֵיזֶה קוֹל הוּא הָעִקָּר בְּהַר סִינַי, לָמָּה הָיָה כָּל הָרַעַשׁ, וְאֵיךְ הַסִּפּוּר הִגִּיעַ עַד אֶצְלֵנוּ","../halacha-quiz/shavuot-03.html"],["chagim","⛰️ שָׁבוּעוֹת – עָמַדְנוּ בְּהַר סִינַי","נַעֲשֶׂה וְנִשְׁמָע – סוֹמְכִים עַל אַבָּא","לָמָּה אָמַרְנוּ ״נַעֲשֶׂה״ לִפְנֵי ״נִשְׁמָע״, מָה לֹא הֵבִין הַבֵּן שֶׁבַּמָּשָׁל, וְאֵיךְ מִתְכּוֹנְנִים לַחַג בְּמִצְוָה אַחַת","../halacha-quiz/shavuot-04.html"],["chagim","⛰️ שָׁבוּעוֹת – עָמַדְנוּ בְּהַר סִינַי","שְׁנֵי לוּחוֹת וְסֻלָּם אֶחָד","מָה כָּתוּב בְּכָל לוּחַ, אֵיךְ הַלּוּחַ הַשֵּׁנִי יוֹרֵד כְּמוֹ סֻלָּם, וְאֵיךְ זוֹכְרִים אֶת הַדִּבְּרוֹת בְּלִי לְשַׁנֵּן","../halacha-quiz/shavuot-05.html"],["chagim","⛰️ שָׁבוּעוֹת – עָמַדְנוּ בְּהַר סִינַי","חֲתֻנָּה בְּהַר סִינַי","לָמָּה מַתַּן תּוֹרָה הוּא כְּמוֹ חֲתֻנָּה, מָה הַחֻפָּה וְהַנֵּרוֹת וְהַכּוֹס מַזְכִּירִים מִסִּינַי, וְאֵיךְ מְקַשְּׁטִים אֶת הָעֶרֶב שֶׁל שָׁבוּעוֹת","../halacha-quiz/shavuot-06.html"],["chagim","⛰️ שָׁבוּעוֹת – עָמַדְנוּ בְּהַר סִינַי","שְׁתֵּי מַתָּנוֹת – תּוֹרָה וְאֶרֶץ","לָמָּה יֵשׁ חָמֵשׁ לְשׁוֹנוֹת וְרַק אַרְבַּע כּוֹסוֹת, מַדּוּעַ לַחַג יֵשׁ שְׁלוֹשָׁה שֵׁמוֹת, וּמָה קִבַּלְנוּ בְּשָׁבוּעוֹת","../halacha-quiz/shavuot-07.html"],["chagim","⛰️ שָׁבוּעוֹת – עָמַדְנוּ בְּהַר סִינַי","לָמָּה חָמֵץ בְּשָׁבוּעוֹת?","מָה הַהֶבְדֵּל בֵּין מַצָּה לְחָמֵץ, לָמָּה שְׁתֵּי הַלֶּחֶם הֵן חָמֵץ, וְעַל מָה מוֹדִים בְּקָרְבַּן תּוֹדָה","../halacha-quiz/shavuot-08.html"],["chagim","⛰️ שָׁבוּעוֹת – עָמַדְנוּ בְּהַר סִינַי","רוּת בּוֹחֶרֶת – לָמָּה קוֹרְאִים אֶת מְגִלַּת רוּת","לָמָּה עָזַב אֱלִימֶלֶךְ אֶת הָאָרֶץ, מָה בָּחֲרָה רוּת, וְאֵיךְ קָשׁוּר דָּוִד הַמֶּלֶךְ לַחַג","../halacha-quiz/shavuot-09.html"],["chagim","⛰️ שָׁבוּעוֹת – עָמַדְנוּ בְּהַר סִינַי","אִלְמָלֵא הַאי יוֹמָא – מָה הַתּוֹרָה עָשְׂתָה מִמֶּנִּי","מָה אָמַר רַב יוֹסֵף בְּיוֹם הָעֲצֶרֶת, לָמָּה שְׂמֵחִים גַּם בָּאֹכֶל וּבָאוֹרְחִים, וּמָה לוֹקְחִים מִכָּל הַסִּדְרָה","../halacha-quiz/shavuot-10.html"],["chagim","🕯️ מִשִּׁבְעָה עָשָׂר בְּתַמּוּז עַד שִׁבְעָה דְּנֶחָמְתָא","שִׁבְעָה עָשָׂר בְּתַמּוּז – מַה נִּסְדַּק?","מָה קָרָה בְּאוֹתוֹ יוֹם, מָה מְשֻׁתָּף לַחֲמֵשֶׁת הַדְּבָרִים, וְאֵיךְ מְתַקְּנִים סֶדֶק קָטָן לִפְנֵי שֶׁהוּא גָּדֵל","../halacha-quiz/tamuz-01.html"],["chagim","🕯️ מִשִּׁבְעָה עָשָׂר בְּתַמּוּז עַד שִׁבְעָה דְּנֶחָמְתָא","אִם צָדַקְתָּ – גַּם אָז לֹא עוֹלְבִים","שְׁנֵי דְּבָרִים שֶׁגָּרְמוּ לַסֶּדֶק, מַה זֶה ׳נֶעֱלָב וְאֵינוֹ עוֹלֵב׳, וְאֵיךְ מְגִיבִים כְּשֶׁפּוֹגְעִים בִּי","../halacha-quiz/tamuz-02.html"],["chagim","🕯️ מִשִּׁבְעָה עָשָׂר בְּתַמּוּז עַד שִׁבְעָה דְּנֶחָמְתָא","מַהִי שִׂנְאַת חִנָּם בֶּאֱמֶת?","לָמָּה חָרַב בֵּית שֵׁנִי אַף שֶׁעָסְקוּ בְּתוֹרָה, מַה זֶה חֹסֶר אַהֲבָה, וְאֵיךְ אֲנִי מוֹסִיף אַהֲבָה לַחֲבֵרִים","../halacha-quiz/tamuz-03.html"],["chagim","🕯️ מִשִּׁבְעָה עָשָׂר בְּתַמּוּז עַד שִׁבְעָה דְּנֶחָמְתָא","עַל נַהֲרוֹת בָּבֶל – אִם אֶשְׁכָּחֵךְ","לָמָּה בָּכוּ בְּבָבֶל, מָה הִבְטִיחוּ, וְאֵיךְ זוֹכְרִים אֶת יְרוּשָׁלַיִם גַּם בְּאֶמְצַע הַשִּׂמְחָה","../halacha-quiz/tamuz-04.html"],["chagim","🕯️ מִשִּׁבְעָה עָשָׂר בְּתַמּוּז עַד שִׁבְעָה דְּנֶחָמְתָא","תִּשְׁעָה בְּאָב לִילָדִים – מָה עוֹשִׂים וְלָמָּה","אֵיךְ מִתְגַּעְגְּעִים לְמַה שֶּׁלֹּא רָאִינוּ, מָה יֶלֶד יָכוֹל לַעֲשׂוֹת, וְלָמָּה הַצּוֹם יֵהָפֵךְ לְחַג","../halacha-quiz/tamuz-05.html"],["chagim","🕯️ מִשִּׁבְעָה עָשָׂר בְּתַמּוּז עַד שִׁבְעָה דְּנֶחָמְתָא","חֲמִשָּׁה עָשָׂר בְּאָב – טוֹב־אָב","בִּגְדֵי לָבָן שְׁאוּלִים, מַעְגָּל שֶׁל אַחְדוּת, יָרֵחַ מָלֵא וְיוֹם שֶׁל אָב טוֹב","../halacha-quiz/tamuz-06.html"],["chagim","🕯️ מִשִּׁבְעָה עָשָׂר בְּתַמּוּז עַד שִׁבְעָה דְּנֶחָמְתָא","נַחֲמוּ נַחֲמוּ עַמִּי","שֶׁבַע הַפְטָרוֹת שֶׁל נֶחָמָה, וְהַהוֹכָחָה שֶׁה׳ אוֹהֵב אוֹתָנוּ","../halacha-quiz/tamuz-07.html"],["chagim","🕯️ מִשִּׁבְעָה עָשָׂר בְּתַמּוּז עַד שִׁבְעָה דְּנֶחָמְתָא","כֵּיצַד תּוּכַל אַתָּה לִבְנוֹת אֶת בֵּית הַמִּקְדָּשׁ?","בַּיִת שֶׁיֵּשׁ בּוֹ אַהֲבָה, שָׁלוֹם וְשִׂמְחָה הוּא מִקְדָּשׁ מְעַט","../halacha-quiz/tamuz-08.html"],["chagim","🗺️ יְרוּשָׁלַיִם – עִיר הַקֹּדֶשׁ","יִרְאֶה וְשָׁלֵם","לָמָּה לִירוּשָׁלַיִם יֵשׁ שֵׁם שֶׁנּוֹלַד מִשְּׁנֵי שֵׁמוֹת, וּמָה הוּא מְלַמֵּד אוֹתָנוּ עַל יִרְאָה וְעַל שָׁלוֹם","../halacha-quiz/irkodesh-01.html"],["chagim","🗺️ יְרוּשָׁלַיִם – עִיר הַקֹּדֶשׁ","הַר, שָׂדֶה וּבַיִת","אֵיךְ שְׁלוֹשָׁה אָבוֹת קָרְאוּ לְאוֹתוֹ מָקוֹם בִּשְׁלוֹשָׁה שֵׁמוֹת, וּמִי בָּנָה עָלָיו מִזְבֵּחַ לְאוֹרֶךְ הַדּוֹרוֹת","../halacha-quiz/irkodesh-02.html"],["chagim","🗺️ יְרוּשָׁלַיִם – עִיר הַקֹּדֶשׁ","אֶבֶן הַשְּׁתִיָּה","הָאֶבֶן שֶׁמִּמֶּנָּה הוּשְׁתַּת הָעוֹלָם, הַמָּקוֹם שֶׁבּוֹ יָשַׁן יַעֲקֹב, וְלָמָּה הַמָּקוֹם עַצְמוֹ חָשׁוּב","../halacha-quiz/irkodesh-03.html"],["chagim","🗺️ יְרוּשָׁלַיִם – עִיר הַקֹּדֶשׁ","הַמָּקוֹם שֶׁלֹּא נִתְּנוּ בְּחִנָּם","לָמָּה דָּוִד שִׁלֵּם, מִי שַׁיָּךְ לָעִיר, וְלָמָּה אֵין מַשְׂכִּירִים בָּתִּים בִּירוּשָׁלַיִם","../halacha-quiz/irkodesh-04.html"],["chagim","🗺️ יְרוּשָׁלַיִם – עִיר הַקֹּדֶשׁ","שְׁנֵי הַשְּׁעָרִים – עִיר שֶׁחֻבְּרָה יַחְדָּו","לָמָּה בָּנָה שְׁלֹמֹה שְׁנֵי שְׁעָרִים, מָה עָשׂוּ בֵּינֵיהֶם, וְאֵיךְ אֲנִי בּוֹנֶה שַׁעַר לַחֲבֵרִים","../halacha-quiz/irkodesh-05.html"],["chagim","🗺️ יְרוּשָׁלַיִם – עִיר הַקֹּדֶשׁ","עֲשָׂרָה נִסִּים וְלֹא צַר הַמָּקוֹם","מָה הָיוּ הַנִּסִּים בַּמִּקְדָּשׁ, מָה הַנֵּס הַיָּפֶה בְּיוֹתֵר, וְאֵיךְ אֲנִי מְפַנֶּה מָקוֹם לְחָבֵר","../halacha-quiz/irkodesh-06.html"],["chagim","🗺️ יְרוּשָׁלַיִם – עִיר הַקֹּדֶשׁ","דֶּרֶךְ הָעוֹלִים","אֵיךְ עָלוּ הַבִּכּוּרִים לִירוּשָׁלַיִם, מִי יָצָא לִקְרָאתָם, וְאֵיךְ אֲנִי מְקַבֵּל אוֹרֵחַ","../halacha-quiz/irkodesh-07.html"],["chagim","🗺️ יְרוּשָׁלַיִם – עִיר הַקֹּדֶשׁ","כֻּלָּם פּוֹנִים לִירוּשָׁלַיִם","לְאָן פּוֹנִים בַּתְּפִלָּה, מָה אָמַר שְׁלֹמֹה, וְאֵיךְ כָּל הַלְּבָבוֹת פּוֹנִים לְמָקוֹם אֶחָד","../halacha-quiz/irkodesh-08.html"],["chagim","🏛️ בּוֹנִים אֶת הַמִּקְדָּשׁ","בַּיִת לַה׳ בְּתוֹכֵנוּ","לָמָּה לַה׳ גָּדוֹל מִכָּל הָעוֹלָם יֵשׁ בַּיִת, מָה מַרְגִּישׁ ה׳ בַּמִּקְדָּשׁ, וְעַל מָה עוֹמֵד הַבַּיִת","../halacha-quiz/bonim-01.html"],["chagim","🏛️ בּוֹנִים אֶת הַמִּקְדָּשׁ","הַמִּזְבֵּחַ – מַתָּנָה שֶׁל חַיִּים","לָמָּה מֵבִיאִים קָרְבָּן, מָה מְלַמֶּדֶת הַסְּמִיכָה, וְאֵיךְ מוֹדִים עַל כָּל דָּבָר","../halacha-quiz/bonim-02.html"],["chagim","🏛️ בּוֹנִים אֶת הַמִּקְדָּשׁ","הַכֹּהֲנִים וְהַכִּיּוֹר – מְטַהֲרִים אֶת הַיָּדַיִם","לָמָּה הַכֹּהֲנִים נָטְלוּ יָדַיִם, מָה הַקֶּשֶׁר לִנְטִילָה שֶׁלָּנוּ, וּמָה פֵּרוּשׁ בִּרְכַּת כֹּהֲנִים","../halacha-quiz/bonim-03.html"],["chagim","🏛️ בּוֹנִים אֶת הַמִּקְדָּשׁ","קָרְבַּן תּוֹדָה וְשִׁירַת הַלְוִיִּם","לָמָּה קָרְבַּן תּוֹדָה לֹא יִתְבַּטֵּל, וְאֵיךְ הַשִּׁיר שֶׁל הַלְוִיִּם נוֹתֵן הַתְחָלָה חֲדָשָׁה","../halacha-quiz/bonim-04.html"],["chagim","🏛️ בּוֹנִים אֶת הַמִּקְדָּשׁ","הַמְּנוֹרָה וְהַשֻּׁלְחָן – אוֹר וְלֶחֶם","לָמָּה הַנֵּרוֹת פּוֹנִים אֶל הָאֶמְצַע, מָה מְלַמְּדִים הַכַּפְתּוֹרִים, וְאֵיךְ הַשֻּׁלְחָן שֶׁלָּנוּ דּוֹמֶה לַמִּזְבֵּחַ","../halacha-quiz/bonim-05.html"],["chagim","🏛️ בּוֹנִים אֶת הַמִּקְדָּשׁ","מִזְבַּח הַקְּטֹרֶת וְהַתְּפִלָּה","אֵיךְ הָיְתָה הַקְּטֹרֶת, לָמָּה הַחֶלְבְּנָה נִכְנְסָה אֵלֶיהָ, וְאֵיךְ הַתְּפִלָּה שֶׁלָּנוּ עוֹלָה כְּמוֹ רֵיחַ טוֹב","../halacha-quiz/bonim-06.html"],["chagim","🏛️ בּוֹנִים אֶת הַמִּקְדָּשׁ","הָאָרוֹן – הַלֵּב שֶׁל הַבַּיִת","אֵיךְ נִרְאָה הָאָרוֹן, מָה הָיָה בְּתוֹכוֹ, וְלָמָּה צָרִיךְ לִהְיוֹת טוֹב גַּם בִּפְנִים","../halacha-quiz/bonim-07.html"],["chagim","🏛️ בּוֹנִים אֶת הַמִּקְדָּשׁ","הַמִּקְדָּשׁ הַשְּׁלִישִׁי וְהַבַּיִת שֶׁלָּנוּ","מִי יִבְנֶה אֶת בֵּית הַמִּקְדָּשׁ, וּמָה אֲנִי בּוֹנֶה בֵּינְתַיִים בַּבַּיִת שֶׁלִּי","../halacha-quiz/bonim-08.html"],["chagim","🧱 כֹּתֶל הַהוֹדָיוֹת","לֹא זָזָה מִשָּׁם","הָאוֹר שֶׁנִּשְׁאָר, הַכֹּתֶל שֶׁעוֹמֵד, וְלָמָּה מוֹדִים דַּוְקָא כָּאן","../halacha-quiz/kotel-01.html"],["chagim","🧱 כֹּתֶל הַהוֹדָיוֹת","לָמָּה לְהוֹדוֹת דַּוְקָא שָׁם?","בֹּאוּ שְׁעָרָיו בְּתוֹדָה: הַכָּרַת הַטּוֹב, הַמָּשָׁל עַל הַטֶּלֶפוֹן, וְלָמָּה בָּאִים לְבַקֵּר","../halacha-quiz/kotel-02.html"],["chagim","🧱 כֹּתֶל הַהוֹדָיוֹת","בַּכֹּתֶל כֻּלָּם עֲנָוִים","הַגֵּאֶה שֶׁנִּכְנָע, כּוֹתֶל וְעָפָר, וְלָמָּה תּוֹדָה מַתְחִילָה בַּעֲנָוָה","../halacha-quiz/kotel-03.html"],["chagim","🧱 כֹּתֶל הַהוֹדָיוֹת","הַדֹּאַר הַמֶּרְכָּזִי","לָמָּה רַבִּי שְׁלֹמֹה חָזַר מִמִּירוֹן וְהָלַךְ לַכֹּתֶל, וְאֵיךְ שׁוֹלְחִים לְשָׁם גַּם תּוֹדָה","../halacha-quiz/kotel-04.html"],["chagim","🧱 כֹּתֶל הַהוֹדָיוֹת","הָלְכוּ כָּל הַדֶּרֶךְ","סִפּוּרִים עַל גְּדוֹלִים שֶׁרָצוּ אֶל הַכֹּתֶל, וְעַל מַה שֶּׁמְּשֻׁתָּף לְכֻלָּם","../halacha-quiz/kotel-05.html"],["chagim","🧱 כֹּתֶל הַהוֹדָיוֹת","הַכֹּתֶל חָזַר אֵלֵינוּ","מִגַּעְגּוּעִים לְשִׂמְחָה: הַכֹּתֶל חָזַר, וְאֵיךְ מוֹדִים עַל כָּךְ","../halacha-quiz/kotel-06.html"],["chagim","🧱 כֹּתֶל הַהוֹדָיוֹת","אַמָּה עַל אַמָּה – הַכֹּתֶל שֶׁבַּבַּיִת","מָה מַשְׁאִירִים בַּקִּיר כְּשֶׁמְּסַיְּדִים, לָמָּה דַּוְקָא מוּל הַפֶּתַח, וְאֵיךְ גַּעְגּוּעִים לַמִּקְדָּשׁ הֵם חֵלֶק מֵהַתּוֹדָה","../halacha-quiz/kotel-07.html"],["chagim","🧱 כֹּתֶל הַהוֹדָיוֹת","קוֹל אֹמְרִים הוֹדוּ","מָה הִבְטִיחַ יִרְמְיָהוּ, לָמָּה לֹא כָּתוּב ׳קוֹל מוֹדִים׳, וְאֵיךְ אֲנִי יָכוֹל לִהְיוֹת קוֹל שֶׁמְּעוֹרֵר אֲחֵרִים לְהוֹדוֹת","../halacha-quiz/kotel-08.html"],["tefila","🙏 פִּרְקֵי הַתְּפִלָּה","לָמָּה מִתְפַּלְּלִים וְאֵיךְ מִתְכּוֹנְנִים","מַה הַמַּטָּרָה שֶׁל הַתְּפִלָּה, לָמָּה מִתְפַּלְּלִים הַרְבֵּה, וְאֵיךְ מַכְשִׁירִים אֶת הַלֵּב","../halacha-quiz/siddur-01.html","s-halacha-quiz_siddur-01"],["tefila","🙏 פִּרְקֵי הַתְּפִלָּה","בִּרְכוֹת הַשַּׁחַר וּבִרְכוֹת הַתּוֹרָה – תּוֹדָה עַל כָּל בֹּקֶר","מָה אוֹמְרִים כְּשֶׁקָּמִים, מָה מְבַקְּשִׁים בְּכָל בְּרָכָה, וְלָמָּה מְבָרְכִים עַל הַתּוֹרָה","../halacha-quiz/siddur-02.html","s-halacha-quiz_siddur-02"],["tefila","🙏 פִּרְקֵי הַתְּפִלָּה","שִׁירַת הַיּוֹם – פְּסוּקֵי דְזִמְרָה וּמִזְמוֹר לְתוֹדָה","מָה אוֹמְרִים לִפְנֵי שְׁמוֹנֶה עֶשְׂרֵה, מָה הַהֶבְדֵּל בֵּין שֶׁבַח לְהַלֵּל, וְלָמָּה תּוֹדָה פּוֹתַחַת שְׁעָרִים","../halacha-quiz/siddur-03.html","s-halacha-quiz_siddur-03"],["tefila","🙏 פִּרְקֵי הַתְּפִלָּה","הַלְלוּיָהּ – ה׳ מַשְׁגִּיחַ עַל הַכֹּל","שָׁלוֹשׁ הַשְׁגָּחוֹת בַּמִּזְמוֹרִים הָאַחֲרוֹנִים שֶׁל תְּהִלִּים: עָלַי, עַל עַם יִשְׂרָאֵל וְעַל כָּל הַבְּרִיאָה","../halacha-quiz/siddur-04.html","s-halacha-quiz_siddur-04"],["tefila","🙏 פִּרְקֵי הַתְּפִלָּה","נִשְׁמַת כָּל חַי – שִׁיר הַתּוֹדָה שֶׁל כָּל הַגּוּף","מָה אוֹמְרִים בַּנִּשְׁמַת, מָה פֵּרוּשׁ הַמִּלִּים, וְאֵיךְ הַגּוּף כֻּלּוֹ מוֹדֶה לַה׳","../halacha-quiz/siddur-05.html","s-halacha-quiz_siddur-05"],["tefila","🙏 פִּרְקֵי הַתְּפִלָּה","אָבוֹת, גְּבוּרוֹת וּקְדֻשָּׁה – שָׁלֹשׁ הַבְּרָכוֹת הָרִאשׁוֹנוֹת","מָה אוֹמְרִים בִּשְׁלוֹשׁ הַבְּרָכוֹת הָרִאשׁוֹנוֹת שֶׁל שְׁמוֹנֶה עֶשְׂרֵה, מָה פֵּרוּשָׁן, וּמָה חוֹשְׁבִים בָּהֶן","../halacha-quiz/siddur-06.html","s-halacha-quiz_siddur-06"],["tefila","🙏 פִּרְקֵי הַתְּפִלָּה","מְבַקְּשִׁים מֵאַבָּא – הַבַּקָּשׁוֹת וְהַגְּאֻלָּה","מָה מְבַקְּשִׁים בַּבְּרָכוֹת הָאֶמְצָעִיּוֹת, לָמָּה הֵן בָּאוֹת בַּסֵּדֶר הַזֶּה, וְאֵיךְ מִתְפַּלְּלִים גַּם עַל חֲבֵרִים","../halacha-quiz/siddur-07.html","s-halacha-quiz_siddur-07"],["tefila","🙏 פִּרְקֵי הַתְּפִלָּה","רְצֵה, מוֹדִים וְשִׂים שָׁלוֹם – תּוֹדָה וְשָׁלוֹם","אֵיךְ ה׳ מְקַבֵּל אֶת הַתְּפִלָּה, עַל מָה מוֹדִים, וְלָמָּה הַשָּׁלוֹם הוּא הַכְּלִי לַבְּרָכָה","../halacha-quiz/siddur-08.html","s-halacha-quiz_siddur-08"],["tefila","🙏 פִּרְקֵי הַתְּפִלָּה","אַשְׁרֵי וְעָלֵינוּ – שִׁיר שֶׁל שֶׁבַח וְתוֹדָה","לָמָּה אוֹמְרִים אַשְׁרֵי שָׁלֹשׁ פְּעָמִים בְּיוֹם, מָה יֵשׁ בִּשְׁלֹשֶׁת חֲלָקָיו, וּמָה אוֹמְרִים בְּ׳עָלֵינוּ לְשַׁבֵּחַ׳","../halacha-quiz/siddur-09.html","s-halacha-quiz_siddur-09"],["tefila","📖 מִזְמוֹרֵי תְּהִלִּים – דָּוִד מְדַבֵּר אִתָּנוּ","דָּוִד הַמֶּלֶךְ – נְעִים זְמִירוֹת יִשְׂרָאֵל","מָה הָיָה תָּלוּי מֵעַל מִטָּתוֹ שֶׁל דָּוִד, לָמָּה הוּא קָם בַּחֲצוֹת, וּמָה אֶפְשָׁר לִלְמֹד מִמֶּנּוּ","../halacha-quiz/tehilim-01.html"],["tefila","📖 מִזְמוֹרֵי תְּהִלִּים – דָּוִד מְדַבֵּר אִתָּנוּ","אַשְׁרֵי הָאִישׁ – הָעֵץ וְהַמֹּץ","שְׁלוֹשָׁה צְעָדִים שֶׁמַּרְחִיקִים מֵהַטּוֹב, עֵץ עַל מַיִם, וּמֹץ שֶׁהָרוּחַ מְעִיפָה","../halacha-quiz/tehilim-02.html"],["tefila","📖 מִזְמוֹרֵי תְּהִלִּים – דָּוִד מְדַבֵּר אִתָּנוּ","מָה אַדִּיר שִׁמְךָ – מִפִּי עוֹלְלִים וְיֹנְקִים","דָּוִד הָרוֹעֶה מַבִּיט בַּכּוֹכָבִים, הַפֶּלֶא הָרִאשׁוֹן שֶׁל תִּינוֹק, וּמָה אֱנוֹשׁ שֶׁה׳ זוֹכֵר אוֹתוֹ","../halacha-quiz/tehilim-03.html"],["tefila","📖 מִזְמוֹרֵי תְּהִלִּים – דָּוִד מְדַבֵּר אִתָּנוּ","ה׳ רֹעִי לֹא אֶחְסָר – דָּוִד הָרוֹעֶה","אֵיךְ דָּוִד הָיָה רוֹעֶה, מָה לָמַד מֵהַצֹּאן, וּמָה אוֹמְרִים כְּשֶׁחָשׁוּךְ אוֹ כְּשֶׁחָסֵר","../halacha-quiz/tehilim-04.html"],["tefila","📖 מִזְמוֹרֵי תְּהִלִּים – דָּוִד מְדַבֵּר אִתָּנוּ","ה׳ אוֹרִי וְיִשְׁעִי – מִמִּי אִירָא","מָה עוֹשִׂים כְּשֶׁחָשׁוּךְ וּמַפְחִיד, מַה בִּקֵּשׁ דָּוִד, וְאֵיךְ לְבַקֵּשׁ מֵהַלֵּב","../halacha-quiz/tehilim-05.html"],["tefila","📖 מִזְמוֹרֵי תְּהִלִּים – דָּוִד מְדַבֵּר אִתָּנוּ","יַעַנְךָ ה׳ בְּיוֹם צָרָה – תְּפִלָּה בִּשְׁבִיל אַחֵר","אֵיךְ מְבָרְכִים חָבֵר, מִי עָנָה לְיַעֲקֹב, וְלָמָּה ׳בְּשֵׁם ה׳ נַזְכִּיר׳","../halacha-quiz/tehilim-06.html"],["tefila","📖 מִזְמוֹרֵי תְּהִלִּים – דָּוִד מְדַבֵּר אִתָּנוּ","יֹשֵׁב בְּסֵתֶר עֶלְיוֹן – בְּצֵל שַׁדַּי","מִי שֶׁבּוֹטֵחַ בַּה׳ חוֹסֶה בְּצִלּוֹ: מַחְסֶה, כְּנָפַיִם וּמָגֵן – וה׳ אִתָּנוּ גַּם בַּצָּרָה","../halacha-quiz/tehilim-07.html"],["tefila","📖 מִזְמוֹרֵי תְּהִלִּים – דָּוִד מְדַבֵּר אִתָּנוּ","מִן הַמֵּצַר קָרָאתִי יָהּ – מֵהַצַּר לָרָחָב","קוֹרְאִים לַה׳ מִתּוֹךְ הַצָּרָה, וְהוּא עוֹנֶה בַּמֶּרְחָב: הַשּׁוֹפָר, ׳צָרָה – רָצָה׳ וְיוֹסֵף","../halacha-quiz/tehilim-08.html"],["tefila","📖 מִזְמוֹרֵי תְּהִלִּים – דָּוִד מְדַבֵּר אִתָּנוּ","לְכוּ נְרַנְּנָה – בּוֹאוּ נָשִׁירָה יַחַד","הַזְמָנָה לָשִׁיר, לָמָּה אַזְהָרָה בָּאֶמְצַע הַשִּׂמְחָה, וְאֵיךְ שִׁירָה מְנַצַּחַת","../halacha-quiz/tehilim-09.html"],["tefila","📖 מִזְמוֹרֵי תְּהִלִּים – דָּוִד מְדַבֵּר אִתָּנוּ","שִׁיר הַמַּעֲלוֹת – הַשִּׁירִים שֶׁעָצְרוּ אֶת הַתְּהוֹם","הַסִּפּוּר שֶׁמֵּאֲחוֹרֵי חֲמֵשׁ עֶשְׂרֵה הַמַּעֲלוֹת, וְשָׁלוֹשׁ הַמַּחְשָׁבוֹת מִקכ״א, קכ״ב וְקכ״ו","../halacha-quiz/tehilim-10.html"],["tefila","👂 קְרִיאַת שְׁמַע","שְׁמַע יִשְׂרָאֵל – עַל מָה אֲנַחְנוּ מְעִידִים","מִצְוָה שֶׁבַּלֵּב: ה׳ מַשְׁגִּיחַ עָלַי, ה׳ אֶחָד – וְהַכֹּל מֵאִתּוֹ","../halacha-quiz/shema-01.html","s-halacha-quiz_shema-01"],["tefila","👂 קְרִיאַת שְׁמַע","וְאָהַבְתָּ – לֶאֱהֹב אֶת ה׳ גַּם כְּשֶׁקָּשֶׁה","לָמָּה לֹא מַסְפִּיק לְהַאֲמִין, אֵיךְ מַגִּיעִים לְאַהֲבָה, וְאֵיךְ שְׂמֵחִים גַּם בְּיוֹם קָשֶׁה","../halacha-quiz/shema-02.html","s-halacha-quiz_shema-02"],["tefila","👂 קְרִיאַת שְׁמַע","בְּכָל לְבָבְךָ, בְּכָל נַפְשְׁךָ, בְּכָל מְאֹדֶךָ","אַבְרָהָם, יִצְחָק וְיַעֲקֹב, רַבִּי עֲקִיבָא – וְהָעֲקֵדָה שֶׁלִּי","../halacha-quiz/shema-03.html","s-halacha-quiz_shema-03"],["tefila","👂 קְרִיאַת שְׁמַע","וְהָיוּ הַדְּבָרִים – מְקַיְּמִים אֶת שְׁמַע בְּכָל יוֹם","עַל הַלֵּב, בַּפֶּה, עַל הַיָּד, בֵּין הָעֵינַיִם וְעַל הַדֶּלֶת – וְהַהֲכָנָה מֵרֹאשׁ","../halacha-quiz/shema-04.html","s-halacha-quiz_shema-04"],["tefila","👂 קְרִיאַת שְׁמַע","הַפָּרָשָׁה הַחֲשׁוּבָה בְּיוֹתֵר – אֵיךְ מַגִּיעִים לְאַהֲבַת ה׳","שֶׁבַע פְּעֻלּוֹת לַפָּרָשָׁה, ״ה׳ אֱלֹהֵינוּ״, ״בְּכָל לְבָבְךָ וְנַפְשְׁךָ וּמְאֹדֶךָ״ וְהַדֶּרֶךְ לְאַהֲבָה","../halacha-quiz/shema-05.html","s-halacha-quiz_shema-05"],["emuna","🌙 אֱמוּנָה – וֶאֱמוּנָתְךָ בַּלֵּילוֹת","עוֹבְדִים אֶת ה׳ גַּם בַּלַּיְלָה וְגַם כְּשֶׁקָּשֶׁה","מִצְווֹת גְּדוֹלוֹת בָּרְגָעִים הָעֲיֵפִים, שָׂרָה אִמֵּנוּ שֶׁקָּמָה בַּלֵּילוֹת, וְהֲלָכוֹת שֶׁל מַחֲשָׁבָה","../halacha-quiz/emuna-01.html","s-halacha-quiz_emuna-01"],["emuna","🌙 אֱמוּנָה – וֶאֱמוּנָתְךָ בַּלֵּילוֹת","רַחֲמָנָא לִבָּא בָּעֵי – ה׳ רוֹצֶה אֶת הַלֵּב","מִצְווֹת שֶׁבַּלֵּב גְּדוֹלוֹת מִלִּמּוּד תּוֹרָה, וְלָמָּה נֶחְרְבוּ שְׁנֵי בָּתֵּי הַמִּקְדָּשׁ","../halacha-quiz/emuna-02.html","s-halacha-quiz_emuna-02"],["emuna","🌙 אֱמוּנָה – וֶאֱמוּנָתְךָ בַּלֵּילוֹת","חֶסֶד בַּבַּיִת – הוֹלְכִים בִּדְרָכָיו","אֵיךְ עֶזְרָה בַּבַּיִת נַעֲשֵׂית מִצְוָה, מָה אוֹמְרִים לִפְנֵי חֶסֶד, וְלָמָּה ה׳ אוֹהֵב אוֹתוֹ","../halacha-quiz/emuna-03.html","s-halacha-quiz_emuna-03"],["emuna","💛 אַהֲבַת ה׳","מַהִי אַהֲבַת ה׳?","מִצְוָה לְכָל גִּיל, הַדֶּרֶךְ הַפְּשׁוּטָה לְקַיֵּם אוֹתָהּ, וְאֵיךְ מַתְחִילִים עוֹד הַיּוֹם","../halacha-quiz/ahava-01.html","s-halacha-quiz_ahava-01"],["emuna","💛 אַהֲבַת ה׳","לָמָּה ה׳ בָּרָא אֶת הָעוֹלָם?","כְּדֵי לְהֵיטִיב: הָעוֹלָם נִבְרָא מֵאַהֲבָה, וְהַמִּצְווֹת הֵן נַחַת רוּחַ לַבּוֹרֵא","../halacha-quiz/ahava-02.html","s-halacha-quiz_ahava-02"],["emuna","💛 אַהֲבַת ה׳","הָאֹכֶל – מַתָּנָה מֵאַבָּא","מִי הֵבִיא לִי אֶת הַפְּרִי הַמָּתוֹק, לָמָּה חוֹשְׁבִים ׳מוֹדֶה אֲנִי לְךָ׳ לִפְנֵי בְּרָכָה, וְאֵיךְ טוֹעֲמִים בְּכַוָּנָה","../halacha-quiz/ahava-03.html","s-halacha-quiz_ahava-03"],["emuna","💛 אַהֲבַת ה׳","תּוֹדָה בְּעֵינַיִם","אֵיךְ אוֹמְרִים תּוֹדָה שֶׁהַנּוֹתֵן בֶּאֱמֶת מַרְגִּישׁ? מַבָּט, מִשְׁפָּט שָׁלֵם וְלֵב פָּתוּחַ","../halacha-quiz/ahava-04.html","s-halacha-quiz_ahava-04"],["emuna","💛 אַהֲבַת ה׳","דַּקָּה שֶׁל תּוֹדָה בְּכָל יוֹם","מָה אָמַר הֶחָפֵץ חַיִּים עַל מִצְוַת אַהֲבַת ה׳, אֵיךְ מְחַבְּרִים דַּקַּת תּוֹדָה מִן הַלֵּב, וְלָמָּה לֹא מְמַהֲרִים","../halacha-quiz/ahava-05.html","s-halacha-quiz_ahava-05"],["emuna","💛 אַהֲבַת ה׳","עַיִן טוֹבָה פּוֹתַחַת אֶת הַלֵּב","מָה הִיא עַיִן טוֹבָה, לָמָּה קָשֶׁה לִרְאוֹת טוֹב, וְאֵיךְ רְאִיַּת הַטּוֹב מְחַזֶּקֶת אֶת הַהוֹדָיָה וְאֶת אַהֲבַת ה׳","../halacha-quiz/ahava-06.html","s-halacha-quiz_ahava-06"],["emuna","💛 אַהֲבַת ה׳","נִפְלְאוֹת הַבְּרִיאָה – מִתְבּוֹנְנִים וְאוֹהֲבִים","פֶּרַח, נְמָלָה וְשָׁעוֹן: אֵיךְ הַהִתְבּוֹנְנוּת בָּעוֹלָם מַגִּיעָה אֶל הַלֵּב","../halacha-quiz/ahava-07.html","s-halacha-quiz_ahava-07"],["emuna","💛 אַהֲבַת ה׳","גַּם זוֹ לְטוֹבָה – שְׁלוֹשָׁה סִפּוּרִים שֶׁל חֲזַ״ל","נַחוּם אִישׁ גַּם זוֹ, רַבִּי עֲקִיבָא וְאַבָּא יוּדָן: גַּם דְּבָרִים קָשִׁים בָּאִים מֵאַהֲבָה","../halacha-quiz/ahava-08.html","s-halacha-quiz_ahava-08"],["emuna","💛 אַהֲבַת ה׳","אַהֲבַת יִשְׂרָאֵל וְאַהֲבַת ה׳ – כָּל יְהוּדִי הוּא בֵּן יָקִיר","לָמָּה אוֹהֲבִים כָּל יְהוּדִי, וְאֵיךְ קוֹנִים אַהֲבָה לְחָבֵר בְּהִשְׁתַּוּוּת, בִּנְתִינָה, בִּתְפִלָּה וּבְמַחֲשָׁבָה","../halacha-quiz/ahava-09.html","s-halacha-quiz_ahava-09"],["emuna","💛 אַהֲבַת ה׳","קׇרְבַּן תּוֹדָה – הַכָּרָה, אֲמִירָה וּמַעֲשֶׂה","מִי מֵבִיא קָרְבַּן תּוֹדָה, לָמָּה אַרְבָּעִים לְחָמִים, וְאֵיךְ מוֹדִים לְה׳ בְּשָׁלוֹשׁ דְּרָכִים","../halacha-quiz/ahava-10.html","s-halacha-quiz_ahava-10"],["geula","🌅 מְחַכִּים לַמָּשִׁיחַ","פָּקֹד יִפְקֹד","הַסִּימָן שֶׁיּוֹסֵף מָסַר לָאַחִים: הַגְּאֻלָּה מַתְחִילָה בִּפְקִידָה וּבָאָה בִּשְׁלָבִים, כְּמוֹ בְּמִצְרַיִם","../halacha-quiz/geula-01.html"],["geula","🌅 מְחַכִּים לַמָּשִׁיחַ","אֲחַכֶּה לוֹ בְּכָל יוֹם","׳צִפִּיתָ לִישׁוּעָה?׳ – מְחַכִּים לַגְּאֻלָּה כָּל יוֹם, בְּעֵינַיִם פְּקוּחוֹת וּבְלִי לְחַשֵּׁב מָתַי","../halacha-quiz/geula-02.html"],["geula","🌅 מְחַכִּים לַמָּשִׁיחַ","מִי הוּא הַמֶּלֶךְ הַמָּשִׁיחַ?","מָה הָרַמְבַּ״ם מְלַמֵּד עַל הַמֶּלֶךְ שֶׁיָּבִיא אֶת הַגְּאֻלָּה","../halacha-quiz/geula-03.html"],["geula","🌅 מְחַכִּים לַמָּשִׁיחַ","צֶמַח דָּוִד","לָמָּה הַמָּשִׁיחַ נִקְרָא ׳צֶמַח׳, וּמָה מְבַקְּשִׁים בַּתְּפִלָּה","../halacha-quiz/geula-04.html"],["geula","🌅 מְחַכִּים לַמָּשִׁיחַ","אֵלִיָּהוּ מְבַשֵּׂר הַגְּאֻלָּה","הַנָּבִיא שֶׁבָּא לַעֲשׂוֹת שָׁלוֹם: ׳וְהֵשִׁיב לֵב אָבוֹת עַל בָּנִים׳","../halacha-quiz/geula-05.html"],["geula","🌅 מְחַכִּים לַמָּשִׁיחַ","נִיצוֹץ שֶׁל אֵלִיָּהוּ","כָּל מִי שֶׁמְּבַשֵּׂר בְּשׂוֹרָה טוֹבָה, וְהַקַּטֵּגוֹר שֶׁנַּעֲשָׂה סַנֵּגוֹר","../halacha-quiz/geula-06.html"],["geula","🌅 מְחַכִּים לַמָּשִׁיחַ","וְגָר זְאֵב עִם כֶּבֶשׂ","חֲרָבוֹת לְאִתִּים, נֵר בַּצָּהֳרַיִם, וּמָה הַזְּאֵב וְהַכֶּבֶשׂ מְלַמְּדִים עַל הָעוֹלָם הֶעָתִיד","../halacha-quiz/geula-07.html"],["geula","🌅 מְחַכִּים לַמָּשִׁיחַ","עוֹלָם כְּמִנְהָגוֹ נוֹהֵג","נֵס שֶׁנִּסְתָּר בְּתוֹךְ הַטֶּבַע: הַמָּשָׁל שֶׁל יְהוּדָה וְיִשְׂרָאֵל, וּמַיִם שֶׁנִּבְקְעוּ בַּמִּדְבָּר","../halacha-quiz/geula-08.html"],["geula","🌅 מְחַכִּים לַמָּשִׁיחַ","תְּחִיַּת הַמֵּתִים","אֵלִיָּהוּ וְהַיֶּלֶד, ׳מְחַיֵּה מֵתִים׳ בַּתְּפִלָּה, וְהַשִּׁיר שֶׁמְּחַכֶּה לֶעָתִיד","../halacha-quiz/geula-09.html"],["geula","🌅 מְחַכִּים לַמָּשִׁיחַ","הָרַחֲמָן הוּא יְזַכֵּנוּ","מִתְפַּלְלִים עַל הַגְּאֻלָּה בְּבִרְכַּת הַמָּזוֹן וּבִשְׁמוֹנֶה עֶשְׂרֵה, וְסִכּוּם עֶשֶׂר הַתַּחֲנוֹת הָרִאשׁוֹנוֹת","../halacha-quiz/geula-10.html"],["geula","🌄 קִמְעָא קִמְעָא","כְּאַיֶּלֶת הַשַּׁחַר","רַבִּי חִיָּיא וְרַבִּי שִׁמְעוֹן בֶּן חַלְפָתָא בְּבִקְעַת אַרְבֵּל, וְהָאוֹר שֶׁמַּתְחִיל קָטָן וְגָדֵל","../halacha-quiz/geula-11.html"],["geula","🌄 קִמְעָא קִמְעָא","לָמָּה לֹא בְּבַת אַחַת?","מְשַׁל הַשֶּׁמֶשׁ שֶׁמְּסַנְוֶרֶת, וְהַמִּלִּים ׳מַגְדִּיל׳ וְ׳מִגְדּוֹל׳","../halacha-quiz/geula-12.html"],["geula","🌄 קִמְעָא קִמְעָא","יְשֻׂשׂוּם מִדְבָּר וְצִיָּה","חֲמִשָּׁה שְׁלָבִים שֶׁל מִדְבָּר שֶׁפּוֹרֵחַ, כְּמוֹ בַּמִּדְרָשׁ","../halacha-quiz/geula-13.html"],["geula","🌄 קִמְעָא קִמְעָא","מָרְדְּכַי בְּשַׁעַר הַמֶּלֶךְ","שְׁלָבִים בַּמְּגִלָּה: יוֹשֵׁב בַּשַּׁעַר, לְבוּשׁ וְסוּס, לְבוּשׁ מַלְכוּת, וְאוֹרָה וְשִׂמְחָה","../halacha-quiz/geula-14.html"],["geula","🌄 קִמְעָא קִמְעָא","אַרְבַּע לְשׁוֹנוֹת שֶׁל גְּאֻלָּה","וְהוֹצֵאתִי, וְהִצַּלְתִּי, וְגָאַלְתִּי, וְלָקַחְתִּי: אַרְבָּעָה שְׁלָבִים, וְהוֹדָיָה עַל כָּל שָׁלָב","../halacha-quiz/geula-15.html"],["geula","🌄 קִמְעָא קִמְעָא","הַגַּלְגַּל הַכָּבֵד","קָשֶׁה לְהָזִיז גַּלְגַּל כָּבֵד בַּהַתְחָלָה: הָאָדָם מַתְחִיל בְּמַה שֶּׁבְּיָדוֹ, וְה׳ מַשְׁלִים","../halacha-quiz/geula-16.html"],["geula","🌄 קִמְעָא קִמְעָא","וַיָּשֶׂם מִדְבָּרָהּ כְּעֵדֶן","הָעֲרָבָה שֶׁלֹּא גִּדְּלָה כְּלוּם פּוֹרַחַת, וּמִי שֶׁנּוֹטֵעַ מִשְׁתַּתֵּף בַּבִּנְיָן","../halacha-quiz/geula-17.html"],["geula","🌄 קִמְעָא קִמְעָא","אַבָּא מֵכִין אֶת הַבַּיִת","הַמָּשָׁל עַל הָאַבָּא שֶׁמֵּכִין אֶת הַבַּיִת לִפְנֵי שֶׁהַיְלָדִים חוֹזְרִים, וְהַשְּׁקֵדִיָּה שֶׁפּוֹרַחַת רִאשׁוֹנָה","../halacha-quiz/geula-18.html"],["geula","🌄 קִמְעָא קִמְעָא","גָּדוֹל מִיְּצִיאַת מִצְרַיִם","הַנְּבוּאָה בְּיִרְמְיָהוּ, ׳אֶחָד מֵעִיר׳, וּבְרָכַת ׳תְּקַע בְּשׁוֹפָר גָּדוֹל׳","../halacha-quiz/geula-19.html"],["geula","🌄 קִמְעָא קִמְעָא","לִפְקֹחַ עֵינַיִם","אִיָּר – חֹדֶשׁ הַתַּהֲלִיךְ, וְיוֹמַן גְּאֻלָּה שֶׁרוֹאֶה אֶת כָּל הַשְּׁלָבִים","../halacha-quiz/geula-20.html"],["geula","🏛️ בּוֹנִים אֶת הַבַּיִת","הָשִׁיבָה שׁוֹפְטֵינוּ","מָה מְבַקְּשִׁים שָׁלוֹשׁ פְּעָמִים בַּיּוֹם, וְאֵיזוֹ הַבְטָחָה שֶׁל ה׳ עוֹמֶדֶת מֵאֲחוֹרֵי הַבַּקָּשָׁה","../halacha-quiz/geula-21.html"],["geula","🏛️ בּוֹנִים אֶת הַבַּיִת","כְּשֶׁבֵּית הַדִּין הַגָּדוֹל הָיָה קַיָּם","שׁוֹאֲלִים מִבֵּית דִּין לְבֵית דִּין, עַד לִשְׁכַּת הַגָּזִית","../halacha-quiz/geula-22.html"],["geula","🏛️ בּוֹנִים אֶת הַבַּיִת","רַבִּי יְהוּדָה בֶּן בָּבָא","שׁוֹמֵר הַשַּׁלְשֶׁלֶת: בֵּין שְׁנֵי הָרִים, בָּנַי רוּצוּ, וְאֶבֶן שֶׁאֵין לָהּ הוֹפְכִין","../halacha-quiz/geula-23.html"],["geula","🏛️ בּוֹנִים אֶת הַבַּיִת","הַסְּמִיכָה בִּצְפַת","לִפְנֵי כַּחֲמֵשׁ מֵאוֹת שָׁנָה חַכְמֵי צְפַת סָמְכוּ אֶת מַהֲרִ״י בֵּירָב, וְהַבֵּית יוֹסֵף הָיָה בֵּין הַנִּסְמָכִים: תְּשׁוּבָה צְרִיכָה תִּקְוָה","../halacha-quiz/geula-24.html"],["geula","🏛️ בּוֹנִים אֶת הַבַּיִת","הַדֶּרֶךְ הָאֲרֻכָּה","לָמָּה הַסַּנְהֶדְרִין עֲדַיִן לֹא קָמָה? קָשֶׁה לְהַסְכִּים כֻּלָּם, אֵלִיָּהוּ הַסָּמוּךְ יָבוֹא, וְהָאָדָם מַתְחִיל בְּמַה שֶּׁבְּיָדוֹ","../halacha-quiz/geula-25.html"],["geula","🏛️ בּוֹנִים אֶת הַבַּיִת","מִן הַשָּׁמַיִם אוֹ בִּידֵי אָדָם?","רַשִׁ״י מוּל הָרַמְבַּ״ם וְהַיְּרוּשַׁלְמִי: הַאִם בֵּית הַמִּקְדָּשׁ הַשְּׁלִישִׁי יֵרֵד מוּכָן, אוֹ שֶׁבְּנֵי אָדָם יִבְנוּ אוֹתוֹ?","../halacha-quiz/geula-26.html"],["geula","🏛️ בּוֹנִים אֶת הַבַּיִת","שְׁנֵי בָּתִּים","הֶסְבֵּר שֶׁמְּחַבֵּר בֵּין רַשִׁ״י לְהַיְּרוּשַׁלְמִי: בַּיִת אֶחָד יִבָּנֶה בִּידֵי אָדָם, וְהַשֵּׁנִי יֵרֵד מִן הַשָּׁמַיִם","../halacha-quiz/geula-27.html"],["geula","🏛️ בּוֹנִים אֶת הַבַּיִת","מִזְבֵּחַ חָדָשׁ בְּצִיּוֹן תָּכִין","מָה בָּנוּ קֹדֶם בִּימֵי עֶזְרָא, וּמָה מְבַקְּשִׁים בַּתְּפִלָּה?","../halacha-quiz/geula-28.html"],["geula","🏛️ בּוֹנִים אֶת הַבַּיִת","מִי מֵכִין הַיּוֹם אֶת הַמִּקְדָּשׁ?","סִיּוּר בֵּין הַמַּכִינִים: דֶּלֶת, פָּרֹכֶת, לֶחֶם הַפָּנִים וַאֲבָנִים, וְאֵיזֶה חֵלֶק אֲנִי בּוֹחֵר?","../halacha-quiz/geula-29.html"],["geula","🏛️ בּוֹנִים אֶת הַבַּיִת","הַהוֹדָיָה בּוֹנָה אֶת הַמִּקְדָּשׁ","מְשַׁל הַיֶּלֶד בְּכִתָּה ד׳, וְסִכּוּם הַתַּחֲנוֹת 21–30","../halacha-quiz/geula-30.html"],["geula","🛤️ מְקָרְבִים אֶת הַגְּאֻלָּה","וְשַׁבְתָּ עַד ה׳","פָּרָשַׁת נִצָּבִים שׁוֹזֶרֶת תְּשׁוּבָה וּגְאֻלָּה כְּמוֹ סֻלָּם, וְהַתְּשׁוּבָה הִיא חֲזָרָה בְּאַהֲבָה","../halacha-quiz/geula-31.html"],["geula","🛤️ מְקָרְבִים אֶת הַגְּאֻלָּה","קוֹל דּוֹדִי דוֹפֵק","ה׳ דּוֹפֵק בַּדֶּלֶת וְקוֹרֵא לָנוּ, וַאֲנַחְנוּ פּוֹתְחִים אֶת הַפֶּתַח","../halacha-quiz/geula-32.html"],["geula","🛤️ מְקָרְבִים אֶת הַגְּאֻלָּה","לֵב בָּשָׂר","מַיִם טְהוֹרִים, לֵב אֶבֶן וְלֵב חַי: הִתְעוֹרְרוּת שֶׁבָּאָה מִבִּפְנִים וְלֹא מִלַּחַץ","../halacha-quiz/geula-33.html"],["geula","🛤️ מְקָרְבִים אֶת הַגְּאֻלָּה","הַקּוֹל הַחֲמִישִׁי","חֲמִשָּׁה קוֹלוֹת שֶׁיִּשָּׁמְעוּ בַּגְּאֻלָּה, וְהַחֲמִישִׁי הוּא קוֹל הַתּוֹדָה","../halacha-quiz/geula-34.html"],["geula","🛤️ מְקָרְבִים אֶת הַגְּאֻלָּה","חִזְקִיָּהוּ שֶׁלֹּא אָמַר שִׁירָה","הַשִּׁירָה שֶׁחָסְרָה, וְכֹחָהּ שֶׁל שִׁירָה","../halacha-quiz/geula-35.html"],["geula","🛤️ מְקָרְבִים אֶת הַגְּאֻלָּה","הַשִּׁיר שֶׁלֹּא יִתְבַּטֵּל","הַתּוֹדָה שֶׁנִּשְׁאֶרֶת לֶעָתִיד לָבוֹא","../halacha-quiz/geula-36.html"],["geula","🛤️ מְקָרְבִים אֶת הַגְּאֻלָּה","לִטְעֹם מִמַּעֲדַנֵּי הַגְּאֻלָּה","טוֹעֲמִים אֶת תַּבְשִׁילֵי הַשַּׁבָּת בְּיוֹם שִׁשִּׁי, וְטוֹעֲמִים מִן הַגְּאֻלָּה כְּבָר עַכְשָׁיו","../halacha-quiz/geula-37.html"],["geula","🛤️ מְקָרְבִים אֶת הַגְּאֻלָּה","הַשְּׁכֵנוֹת קָרְאוּ לוֹ שֵׁם","בְּסוֹף מְגִלַּת רוּת נוֹלָד תִּינוֹק, וְהַבְּרָכָה הִקְדִּימָה אֶת הַהֲבָנָה: מֵעוֹבֵד בָּא יִשַׁי, וּמִיִּשַׁי בָּא דָּוִד","../halacha-quiz/geula-38.html"],["geula","🛤️ מְקָרְבִים אֶת הַגְּאֻלָּה","מַצָּה לִפְנֵי מָרוֹר","לָמָּה אוֹכְלִים מַצָּה לִפְנֵי מָרוֹר? הַמְּרִירוּת שֶׁהֵבִיאָה אֶת הַגְּאֻלָּה","../halacha-quiz/geula-39.ht 8d71df4"]];
const CM={};COLS.forEach(c=>CM[c.k]=c);
const $=s=>document.querySelector(s), main=$("#main"), q=$("#q");
const norm=s=>(s||"").replace(/[\u0591-\u05C7]/g,"").replace(/[״"׳']/g,"").toLowerCase();
ITEMS.forEach(it=>it.s=norm(it[1]+" "+it[2]+" "+it[3]+" "+CM[it[0]].t));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let cur="", limit=120, grp="";
// כרטיס לכל נושא בתוך סדרה (15.11.2026, בקשת המשתמש – "כמו בקטלוג המידות"): נושאי 🌱 מתקפלים לכרטיס אחד של המידות
const TPAL=[["#f4a261","#e76f51"],["#2a9d8f","#264653"],["#7b5cff","#c86dd7"],["#3a86ff","#1d4ed8"],["#ef476f","#b5179e"],["#06d6a0","#118ab2"],["#ff9f1c","#e85d04"],["#8338ec","#3a0ca3"],["#43aa8b","#277da1"],["#d62828","#9d0208"],["#f9c74f","#f3722c"],["#4cc9f0","#4361ee"],["#90be6d","#2d6a4f"],["#b5838d","#6d597a"]];
function topics(k){
  const m=new Map();
  ITEMS.forEach(it=>{if(it[0]!==k||!it[1])return;const key=/^🌱/.test(it[1])&&CM.midot?"🌱":it[1];m.set(key,(m.get(key)||0)+1)});
  return [...m].map(([g,n])=>{const sp=g.indexOf(" "),emo=sp>0&&!/[א-ת]/.test(g.slice(0,sp));
    return g==="🌱"?{g,e:"🌱",t:"מִדּוֹת טוֹבוֹת",n,k:"midot"}:{g,e:emo?g.slice(0,sp):CM[k].e,t:emo?g.slice(sp+1):g,n}});
}
function topicCards(k){
  const T=topics(k); if(T.length<3||T.length>30) return "";
  return '<p class="tsub">🗺️ בּוֹחֲרִים נוֹשֵׂא</p><div class="tgrid">'+T.map((t,i)=>{const c=TPAL[i%TPAL.length];
    return '<button class="tcard" '+(t.k?'data-k="'+t.k+'"':'data-g="'+esc(t.g)+'"')+' style="background:linear-gradient(145deg,'+c[0]+','+c[1]+')"><span class="ti">'+t.e+'</span><b>'+esc(t.t)+'</b><span class="tn">'+t.n+(t.n===1?' חידון':' חידונים')+'</span></button>'}).join("")+'</div>';
}

function chips(){
  $("#chips").innerHTML='<button class="chip" data-k="" aria-pressed="'+(!cur)+'">🎲 כל הסדרות</button>'+
    COLS.map(c=>'<button class="chip" style="--c:'+c.c+'" data-k="'+c.k+'" aria-pressed="'+(cur===c.k)+'">'+c.e+' '+esc(c.t)+'</button>').join("");
}
function card(it){
  const c=CM[it[0]];
  return '<a class="card" style="--c:'+c.c+'" href="'+esc(it[4])+'">'+
    (it[5]?(/^https:/.test(it[5])?'<img class="shot" src="'+esc(it[5])+'" alt="" loading="lazy">':'<img class="shot" src="https://yudataub.github.io/kol-toda-img-4/mischakim/img/'+it[5]+'.webp" alt="" loading="lazy">'):'')+   // offload.py rewrites src="https://yudataub.github.io/kol-toda-img-4/mischakim/img/'+ (JOINED)
    '<span class="tag">'+c.e+' '+esc(c.t)+(it[1]?' · '+esc(it[1]):'')+'</span>'+
    '<b>'+esc(it[2])+'</b>'+(it[3]?'<small>'+esc(it[3])+'</small>':'')+'<span class="go">לשחק ◀</span></a>';
}
function render(){
  const term=norm(q.value.trim());
  $("#clear").hidden=!q.value;
  chips();
  if(!cur && !term){
    main.innerHTML='<div class="cols">'+COLS.map(c=>'<button class="col'+(c.i?' pic':'')+'" style="--c:'+c.c+'" data-k="'+c.k+'">'+
      (c.i?'<img class="pimg" src="'+c.i+'" alt="" loading="lazy">':'')+'<span class="ic">'+c.e+'</span><h2>'+esc(c.t)+'</h2><p>'+esc(c.d)+'</p><span class="n">'+c.n+(c.n===1?' משחק':' חידונים ומשחקים')+'</span></button>').join("")+'</div>';
    return;
  }
  const words=term.split(/\s+/).filter(Boolean);
  const list=ITEMS.filter(it=>(!cur||it[0]===cur)&&(!grp||term||it[1]===grp)&&words.every(w=>it.s.includes(w)));
  let h="";
  if(cur){const c=CM[cur];
    h+='<div class="head" style="--c:'+c.c+'"><button class="back" data-k="">→ כל הסדרות</button><h2>'+c.e+' '+esc(c.t)+'</h2>'+
      (c.h?'<a class="home" href="'+c.h+'">לדף הסדרה ולוח המצטיינים ◀</a>':'')+'</div>';
    if(grp&&!term) h+='<div class="head"><button class="back" data-g="">→ כל הנושאים</button></div>';
    else if(!term) h+=topicCards(cur);}
  if(term) h+='<div class="head"><h2 style="font-size:20px">'+list.length+' תוצאות</h2></div>';
  if(!list.length){main.innerHTML=h+'<p class="empty">לא נמצא חידון כזה. נסו מילה אחרת.</p>';return;}
  let last=null;const shown=list.slice(0,limit);let grid="";
  shown.forEach(it=>{
    const g=cur?it[1]:CM[it[0]].t;
    if(g!==last){ if(last!==null) grid+='</div>'; grid+=(g?'<h3 class="grp">'+esc(g)+'</h3>':'')+'<div class="grid">'; last=g; }
    grid+=card(it);
  });
  grid+='</div>';
  if(list.length>limit) grid+='<button class="more" id="more">להציג עוד ('+(list.length-limit)+')</button>';
  main.innerHTML=h+grid;
}
function pick(k){cur=k;grp="";limit=120;render();window.scrollTo({top:0});try{history.replaceState(null,"",k?"#"+k:location.pathname)}catch(e){}}
document.addEventListener("click",e=>{
  const tg=e.target.closest("[data-g]"); if(tg){grp=tg.dataset.g;limit=120;render();window.scrollTo({top:0});return;}
  const b=e.target.closest("[data-k]"); if(b){pick(b.dataset.k);return;}
  if(e.target.id==="more"){limit+=240;render();}
  if(e.target.id==="clear"){q.value="";render();q.focus();}
});
let tm;q.addEventListener("input",()=>{clearTimeout(tm);tm=setTimeout(()=>{limit=120;render()},120)});
const h0=decodeURIComponent(location.hash.slice(1)); if(CM[h0]) cur=h0;
render();
</script>
