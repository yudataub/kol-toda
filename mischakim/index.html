.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:4px;padding:14px 14px 12px;border-radius:16px;background:var(--paper);text-decoration:none;

.card b{font-size:16.5px;line-height:1.35}

.card .go{margin-top:auto;padding-top:6px;font-size:13px;font-weight:800;color:var(--c)}
.empty{text-align:center;color:var(--muted);padding:40px 0;font-size:18px}

./halacha-quiz/nashim-02.html"],["halacha","🌸 תְּפִלַּת בָּנוֹת","עוֹמֶדֶת לִפְנֵי הַמֶּלֶךְ","מָקוֹם, לְבוּשׁ וְהִתְנַהֲגוּת בִּתְפִלַּת הָעֲמִידָה","../halacha-quiz/nashim-03.html"],["halacha","🌸 תְּפִלַּת בָּנוֹת","בַּת בְּבֵית הַכְּנֶסֶת וּבַשַּׁבָּת","מִנְיָן, קַדִּישׁ וּ״בָרְכוּ״, קְדֻשַּׁת בֵּית הַכְּנֶסֶת, תְּפִלּוֹת הַשַּׁבָּת וְהַחַגִּים","../halacha-quiz/nashim-04.html"],["halacha","🌸 תְּפִלַּת בָּנוֹת","מוּשָּׂגִים וּלְשׁוֹן חֲכָמִים – תְּפִלַּת בָּנוֹת","מָה פֵּרוּשׁ הַמִּלִּים וְהַמּוּשָּׂגִים שֶׁפּוֹגְשִׁים בְּהִלְכוֹת תְּפִלַּת הַנָּשִׁים","../halacha-quiz/nashim-mk.html"],["halacha","🍎 הִלְכוֹת בְּרָכוֹת","תּוֹדָה לַה׳ וְיָדַיִם טְהוֹרוֹת","מִצְוַת הַהוֹדָאָה, סוּגֵי הַבְּרָכוֹת, עֲנִיַּת אָמֵן וּנְטִילַת יָדַיִם לַסְּעוּדָה","../halacha-quiz/berachot-01.html"],["halacha","🍎 הִלְכוֹת בְּרָכוֹת","הַמּוֹצִיא לֶחֶם מִן הָאָרֶץ","בִּרְכַּת הַלֶּחֶם, בְּצִיעַת הַפַּת, הַמֶּלַח, וּמָה נִפְטָר בַּסְּעוּדָה","../halacha-quiz/berachot-02.html"],["halacha","🍎 הִלְכוֹת בְּרָכוֹת","אָכַלְנוּ, שָׂבַעְנוּ – וּמְבָרְכִים","בִּרְכַּת הַמָּזוֹן וְזִמּוּן","../halacha-quiz/berachot-03.html"],["halacha","🍎 הִלְכוֹת בְּרָכוֹת","מִן הַשָּׂדֶה וּמִן הַכֶּרֶם","בִּרְכוֹת חֲמֵשֶׁת מִינֵי דָּגָן וּבִרְכַּת הַיַּיִן","../halacha-quiz/berachot-04.html"],["halacha","🍎 הִלְכוֹת בְּרָכוֹת","הָעֵץ, הָאֲדָמָה וְשֶׁהַכֹּל","בִּרְכוֹת הַפֵּרוֹת וְ״שֶׁהַכֹּל״, וּכְלָלֵי הַבְּרָכָה הָרִאשׁוֹנָה","../halacha-quiz/berachot-05.html"],["halacha","🍎 הִלְכוֹת בְּרָכוֹת","בְּרָכָה אַחֲרוֹנָה, עִקָּר וְטָפֵל","מֵעֵין שָׁלֹשׁ, בּוֹרֵא נְפָשׁוֹת, שִׁעוּר כְּזַיִת – וְאֵיךְ מְבָרְכִים עַל מַאֲכָל מְעֹרָב","../halacha-quiz/berachot-06.html"],["halacha","🍎 הִלְכוֹת בְּרָכוֹת","בְּרָכָה בִּמְקוֹמָהּ וְשֻׁלְחָן שֶׁל חֶסֶד","כְּלָלֵי הַבְּרָכוֹת, עֲנִיַּת אָמֵן, וְדֶרֶךְ אֶרֶץ בַּסְּעוּדָה","../halacha-quiz/berachot-07.html"],["halacha","🍎 הִלְכוֹת בְּרָכוֹת","רֵיחַ טוֹב וּמַרְאוֹת נִפְלָאִים","בִּרְכוֹת הָרֵיחַ וּבִרְכוֹת הָרְאִיָּה: קֶשֶׁת, בְּרָקִים, יָם, הָרִים וְאִילָנוֹת פּוֹרְחִים","../halacha-quiz/berachot-08.html"],["halacha","🍎 הִלְכוֹת בְּרָכוֹת","תּוֹדָה עַל כָּל טוֹבָה","בִּרְכַּת הַגּוֹמֵל, שֶׁהֶחֱיָנוּ, הַטּוֹב וְהַמֵּטִיב, דַּיַּן הָאֱמֶת וּתְפִלַּת הַדֶּרֶךְ","../halacha-quiz/berachot-09.html"],["halacha","🍎 הִלְכוֹת בְּרָכוֹת","מוּשָּׂגִים וּלְשׁוֹן חֲכָמִים – הִלְכוֹת בְּרָכוֹת","מָה פֵּרוּשׁ הַמִּלִּים וְהַמּוּשָּׂגִים שֶׁפּוֹגְשִׁים בְּכָל הִלְכוֹת הַבְּרָכוֹת","../halacha-quiz/berachot-mk.html"],["halacha","🧵 צִיצִית, תְּפִלִּין וּמְזוּזָה","צִיצִית וְכִפָּה","","../halacha-quiz/mitzvot-01.html"],["halacha","🧵 צִיצִית, תְּפִלִּין וּמְזוּזָה","תְּפִלִּין א׳ – אוֹת וְכֶתֶר","מָה יֵשׁ בַּתְּפִלִּין, מָה הֵן אוֹמְרוֹת לָנוּ, וְאֵיךְ שׁוֹמְרִים עַל כְּבוֹדָן – לִקְרַאת בַּר מִצְוָה","../halacha-quiz/mitzvot-02.html"],["halacha","🧵 צִיצִית, תְּפִלִּין וּמְזוּזָה","תְּפִלִּין ב׳ – מַנִּיחִים כַּהֲלָכָה","מְקוֹם הַתְּפִלִּין, הַסֵּדֶר, הַבְּרָכָה, בְּלִי הֶפְסֵק – וּמָתַי לֹא מַנִּיחִים. לְחָתָן בַּר מִצְוָה","../halacha-quiz/mitzvot-03.html"],["halacha","🧵 צִיצִית, תְּפִלִּין וּמְזוּזָה","מְזוּזָה – שְׁמַע יִשְׂרָאֵל בַּפֶּתַח","אֵיפֹה קוֹבְעִים, בְּאֵיזֶה צַד וּבְאֵיזֶה גֹּבַהּ, מָה מְבָרְכִים, וּמָתַי בּוֹדְקִים","../halacha-quiz/mitzvot-04.html"],["halacha","🧵 צִיצִית, תְּפִלִּין וּמְזוּזָה","מוּשָּׂגִים וּלְשׁוֹן חֲכָמִים – צִיצִית, תְּפִלִּין וּמְזוּזָה","מָה פֵּרוּשׁ הַמִּלִּים וְהַמּוּשָּׂגִים שֶׁל הִלְכוֹת כִּפָּה, צִיצִית, תְּפִלִּין וּמְזוּזָה","../halacha-quiz/mitzvot-mk.html"],["halacha","🕯️ הִלְכוֹת שַׁבָּת","הַשַּׁבָּת – מַתָּנָה שֶׁל אַהֲבָה","עֵרֶךְ הַשַּׁבָּת, הַהֲכָנוֹת לְשַׁבָּת, וּזְמַנֵּי כְּנִיסָתָהּ וִיצִיאָתָהּ","../halacha-quiz/shabbat-01.html"],["halacha","🕯️ הִלְכוֹת שַׁבָּת","נֵרוֹת שֶׁל שָׁלוֹם וְיוֹם שֶׁל תּוֹרָה","הַדְלָקַת נֵרוֹת שַׁבָּת, לִמּוּד תּוֹרָה, קְרִיאַת הַתּוֹרָה וּתְפִלּוֹת הַשַּׁבָּת","../halacha-quiz/shabbat-02.html"],["halacha","🕯️ הִלְכוֹת שַׁבָּת","קִדּוּשׁ וּסְעוּדוֹת שֶׁל עֹנֶג","הִלְכוֹת קִדּוּשׁ, כּוֹס שֶׁל בְּרָכָה, שָׁלֹשׁ סְעוּדוֹת, לֶחֶם מִשְׁנֶה וּמְלַוֶּה מַלְכָּה","../halacha-quiz/shabbat-03.html"],["halacha","🕯️ הִלְכוֹת שַׁבָּת","הַבְדָּלָה וּמְלֶאכֶת מַחֲשֶׁבֶת","הַבְדָּלָה וּמוֹצָאֵי שַׁבָּת, ל״ט הַמְּלָאכוֹת וּכְלָלֵי הַמְּלָאכוֹת","../halacha-quiz/shabbat-04.html"],["halacha","🕯️ הִלְכוֹת שַׁבָּת","אֹכֶל חַם וְחַמִּין שֶׁל שַׁבָּת","מְלֶאכֶת בִּשּׁוּל: חִמּוּם אֹכֶל, פְּלָטָה, כְּלִי רִאשׁוֹן, שֵׁנִי וּשְׁלִישִׁי, וְהַטְמָנָה","../halacha-quiz/shabbat-05.html"],["halacha","🕯️ הִלְכוֹת שַׁבָּת","בּוֹרְרִים אֶת הַטּוֹב","בּוֹרֵר, דָּשׁ, טוֹחֵן, לָשׁ וְסוֹחֵט – הֲכָנַת אֹכֶל בְּשַׁבָּת","../halacha-quiz/shabbat-06.html"],["halacha","🕯️ הִלְכוֹת שַׁבָּת","בֶּגֶד, גּוּף וּבַיִת בְּשַׁבָּת","כִּבּוּס, תְּפִירָה וּקְשָׁרִים, הַטִּפּוּל בַּגּוּף, בּוֹנֶה וְסוֹתֵר בַּבַּיִת וּבַכֵּלִים","../halacha-quiz/shabbat-07.html"],["halacha","🕯️ הִלְכוֹת שַׁבָּת","אוֹר, אֵשׁ וְאוֹתִיּוֹת בְּשַׁבָּת","מַבְעִיר וּמְכַבֶּה, חַשְׁמַל וּמַכְשִׁירָיו, כּוֹתֵב, מוֹחֵק וְצוֹבֵעַ","../halacha-quiz/shabbat-08.html"],["halacha","🕯️ הִלְכוֹת שַׁבָּת","הַגִּנָּה, הַחַיּוֹת וְהָרְחוֹב","מְלָאכוֹת שֶׁבַּצּוֹמֵחַ, בַּעֲלֵי חַיִּים בְּשַׁבָּת וְהִלְכוֹת הוֹצָאָה","../halacha-quiz/shabbat-09.html"],["halacha","🕯️ הִלְכוֹת שַׁבָּת","יוֹם שֶׁל מְנוּחָה וּקְדֻשָּׁה","צִבְיוֹן הַשַּׁבָּת – הֲלִיכָה, דִּבּוּר, מִשְׂחָקִים וְקִנְיָה – וְהִלְכוֹת מֻקְצֶה","../halacha-quiz/shabbat-10.html"],["halacha","🕯️ הִלְכוֹת שַׁבָּת","יְלָדִים שׁוֹמְרֵי שַׁבָּת","דִּינֵי קָטָן וּמִשְׂחֲקֵי שַׁבָּת, מְלֶאכֶת גּוֹי, מַעֲשֵׂה שַׁבָּת וְלִפְנֵי עִוֵּר","../halacha-quiz/shabbat-11.html"],["halacha","🕯️ הִלְכוֹת שַׁבָּת","וָחַי בָּהֶם","","../halacha-quiz/shabbat-12.html"],["halacha","🕯️ הִלְכוֹת שַׁבָּת","מוּשָּׂגִים וּלְשׁוֹן חֲכָמִים – הִלְכוֹת שַׁבָּת","מָה פֵּרוּשׁ הַמִּלִּים וְהַמּוּשָּׂגִים שֶׁפּוֹגְשִׁים בְּכָל הִלְכוֹת הַשַּׁבָּת, מִכְּנִיסָתָהּ עַד תְּחוּמֶיהָ","../halacha-quiz/shabbat-mk.html"],["halacha","🤝 בֵּין אָדָם לַחֲבֵרוֹ","וְאָהַבְתָּ לְרֵעֲךָ כָּמוֹךָ","לֹא שׂוֹנְאִים וְלֹא נוֹקְמִים, דָּנִים לְכַף זְכוּת, שׁוֹמְרִים אֶת הַלָּשׁוֹן וְלֹא מַעֲלִיבִים","../halacha-quiz/chavero-01.html"],["halacha","🤝 בֵּין אָדָם לַחֲבֵרוֹ","אֱמֶת וְיֹשֶׁר","","../halacha-quiz/chavero-02.html"],["halacha","🤝 בֵּין אָדָם לַחֲבֵרוֹ","לֹא תִּגְנֹבוּ","","../halacha-quiz/chavero-03.html"],["halacha","🤝 בֵּין אָדָם לַחֲבֵרוֹ","מַלְוִים וְנוֹתְנִים","מִצְוַת הַהַלְוָאָה, צְדָקָה וּמַעֲשֵׂר מִדְּמֵי הַכִּיס","../halacha-quiz/chavero-04.html"],["halacha","🤝 בֵּין אָדָם לַחֲבֵרוֹ","אוֹרְחִים וַחֲבֵרִים","הַכְנָסַת אוֹרְחִים, חֶבְרָה טוֹבָה וְהַשְׁפָּעָה בְּאַהֲבָה","../halacha-quiz/chavero-05.html"],["halacha","🤝 בֵּין אָדָם לַחֲבֵרוֹ","שׁוֹמְרִים עַל הַחַיִּים","מַעֲקֶה וּבְטִיחוּת בַּבַּיִת, זְהִירוּת בַּדְּרָכִים, תְּפִלַּת הַדֶּרֶךְ וְהַצָּלַת נְפָשׁוֹת","../halacha-quiz/chavero-06.html"],["halacha","🤝 בֵּין אָדָם לַחֲבֵרוֹ","מוּשָּׂגִים וּלְשׁוֹן חֲכָמִים – בֵּין אָדָם לַחֲבֵרוֹ","מָה פֵּרוּשׁ הַמִּלִּים וְהַמּוּשָּׂגִים שֶׁפּוֹגְשִׁים בְּכָל הֲלָכוֹת בֵּין אָדָם לַחֲבֵרוֹ","../halacha-quiz/chavero-mk.html"],["halacha","🍽️ הִלְכוֹת כַּשְׁרוּת","בַּעֲלֵי חַיִּים בְּרַחֲמִים","אֲכִילַת בָּשָׂר, צַעַר בַּעֲלֵי חַיִּים, שִׁלּוּחַ הַקֵּן וְסִימָנֵי הַכַּשְׁרוּת","../halacha-quiz/kashrut-01.html"],["halacha","🍽️ הִלְכוֹת כַּשְׁרוּת","בּוֹדְקִים וְנִזְהָרִים","דָּם וְהַכְשָׁרַת הַבָּשָׂר, בְּדִיקַת חֲרָקִים, בֵּיצִים וּדְבַשׁ","../halacha-quiz/kashrut-02.html"],["halacha","🍽️ הִלְכוֹת כַּשְׁרוּת","בָּשָׂר לְחוּד וְחָלָב לְחוּד","אִסּוּר בָּשָׂר בְּחָלָב, כֵּלִים נִפְרָדִים, פַּרְוֶה, וְהַהַמְתָּנָה בֵּין בָּשָׂר לְחָלָב","../halacha-quiz/kashrut-03.html"],["halacha","🍽️ הִלְכוֹת כַּשְׁרוּת","שׁוֹמְרִים עַל הָעוֹלָם וְעַל הַגּוּף","בַּל תַּשְׁחִית, פַּת וּבִשּׁוּלֵי גּוֹיִם, טְבִילַת כֵּלִים, בְּרִיאוּת וְהֶכְשֵׁר","../halacha-quiz/kashrut-04.html"],["halacha","🍽️ הִלְכוֹת כַּשְׁרוּת","מִצְווֹת הָאָרֶץ הַטּוֹבָה","חָדָשׁ, עָרְלָה וְנֶטַע רְבָעִי, מַתְּנוֹת עֲנִיִּים, תְּרוּמוֹת וּמַעַשְׂרוֹת וְחַלָּה","../halacha-quiz/kashrut-05.html"],["halacha","🍽️ הִלְכוֹת כַּשְׁרוּת","עַם מְיֻחָד גַּם בַּמִּטְבָּח","הַגְּזֵרוֹת עַל מַאַכְלֵי גּוֹיִם, יֵין גּוֹיִם, חָלָב וּגְבִינָה, וּבִט ת","מוּשָּׂגִים וּלְשׁוֹן חֲכָמִים – הִלְכוֹת סֻכּוֹת","מָה פֵּרוּשׁ הַמִּלִּים וְהַמּוּשָּׂגִים שֶׁפּוֹגְשִׁים בְּכָל הִלְכוֹת הַסֻּכָּה וְאַרְבַּעַת הַמִּינִים","../halacha-quiz/sukkot-mk.html"],["halacha","🕎 הִלְכוֹת חֲנֻכָּה","נֵס פַּךְ הַשֶּׁמֶן","","../halacha-quiz/chanuka-01.html"],["halacha","🕎 הִלְכוֹת חֲנֻכָּה","מַדְלִיקִים נֵר חֲנֻכָּה","מְהַדְּרִין מִן הַמְּהַדְּרִין, מִי מַדְלִיק, הַבְּרָכוֹת, הַנֵּרוֹת, הַחֲנֻכִּיָּה וְהַשַּׁמָּשׁ, וְהַדְלָקָה בְּבֵית הַכְּנֶסֶת","../halacha-quiz/chanuka-02.html"],["halacha","🕎 הִלְכוֹת חֲנֻכָּה","אֵיפֹה וּמָתַי מַדְלִיקִים","פִּרְסוּם הַנֵּס: פֶּתַח, חַלּוֹן וּמִרְפֶּסֶת, זְמַן הַהַדְלָקָה, שַׁבַּת חֲנֻכָּה, אוֹרְחִים, יְשִׁיבָה, מָלוֹן וְטִיּוּל","../halacha-quiz/chanuka-03.html"],["halacha","🕎 הִלְכוֹת חֲנֻכָּה","מוּשָּׂגִים וּלְשׁוֹן חֲכָמִים – הִלְכוֹת חֲנֻכָּה","מָה פֵּרוּשׁ הַמִּלִּים וְהַמּוּשָּׂגִים שֶׁפּוֹגְשִׁים בְּהִלְכוֹת חֲנֻכָּה","../halacha-quiz/chanuka-mk.html"],["halacha","🎭 הִלְכוֹת פּוּרִים","מִשֶּׁנִּכְנַס אֲדָר מַרְבִּים בְּשִׂמְחָה","חֹדֶשׁ אֲדָר, אַרְבַּע הַפָּרָשִׁיּוֹת, זְכִירַת עֲמָלֵק, תַּעֲנִית אֶסְתֵּר, מַחֲצִית הַשֶּׁקֶל וְנֵס פּוּרִים","../halacha-quiz/purim-01.html"],["halacha","🎭 הִלְכוֹת פּוּרִים","מִקְרָא מְגִלָּה","","../halacha-quiz/purim-02.html"],["halacha","🎭 הִלְכוֹת פּוּרִים","שִׂמְחָה, חֶסֶד וִירוּשָׁלַיִם","מִשְׁלוֹחַ מָנוֹת, מַתָּנוֹת לָאֶבְיוֹנִים, סְעוּדַת פּוּרִים, תַּחְפֹּשׂוֹת, פְּרָזִים וּמֻקָּפִים וּפוּרִים הַמְשֻׁלָּשׁ","../halacha-quiz/purim-03.html"],["halacha","🎭 הִלְכוֹת פּוּרִים","מוּשָּׂגִים וּלְשׁוֹן חֲכָמִים – הִלְכוֹת פּוּרִים","מָה פֵּרוּשׁ הַמִּלִּים וְהַמּוּשָּׂגִים שֶׁפּוֹגְשִׁים בְּהִלְכוֹת פּוּרִים","../halacha-quiz/purim-mk.html"],["halacha","🍷 הִלְכוֹת פֶּסַח","חָמֵץ וּמַצָּה – מָה הַסּוֹד?","מַשְׁמָעוּת חַג הַפֶּסַח, מָה הוּא חָמֵץ, זְמַנֵּי הָאִסּוּר וְחָמֵץ שֶׁל גּוֹי","../halacha-quiz/pesach-01.html"],["halacha","🍷 הִלְכוֹת פֶּסַח","מְחַפְּשִׂים וּמְבַעֲרִים","בְּדִיקַת חָמֵץ, בִּטּוּל חָמֵץ וּשְׂרֵפַת חָמֵץ","../halacha-quiz/pesach-02.html"],["halacha","🍷 הִלְכוֹת פֶּסַח","מְכִירַת חָמֵץ, כַּשְׁרוּת וְקִטְנִיּוֹת","מְכִירַת חָמֵץ לְגוֹי, מוּצָרִים כְּשֵׁרִים לְפֶסַח, תְּרוּפוֹת וּמִנְהַג הַקִּטְנִיּוֹת","../halacha-quiz/pesach-03.html"],["halacha","🍷 הִלְכוֹת פֶּסַח","מַצָּה שְׁמוּרָה וְעֶרֶב פֶּסַח","הִלְכוֹת מַצָּה, מְלָאכָה וַאֲכִילָה בְּעֶרֶב פֶּסַח, תַּעֲנִית בְּכוֹרוֹת וְעֶרֶב פֶּסַח שֶׁחָל בְּשַׁבָּת","../halacha-quiz/pesach-04.html"],["halacha","🍷 הִלְכוֹת פֶּסַח","וְהִגַּדְתָּ לְבִנְךָ","","../halacha-quiz/pesach-05.html"],["halacha","🍷 הִלְכוֹת פֶּסַח","מִמַּצָּה וּמָרוֹר עַד נִרְצָה","הֲסִבָּה, מוֹצִיא מַצָּה, מָרוֹר, כּוֹרֵךְ, שֻׁלְחָן עוֹרֵךְ, צָפוּן, בָּרֵךְ, הַלֵּל וְנִרְצָה","../halacha-quiz/pesach-06.html"],["halacha","🍷 הִלְכוֹת פֶּסַח","מוּשָּׂגִים וּלְשׁוֹן חֲכָמִים – הִלְכוֹת פֶּסַח","מָה פֵּרוּשׁ הַמִּלִּים וְהַמּוּשָּׂגִים שֶׁפּוֹגְשִׁים בְּכָל הִלְכוֹת הַפֶּסַח וְלֵיל הַסֵּדֶר","../halacha-quiz/pesach-mk.html"],["halacha","📅 רֹאשׁ חֹדֶשׁ, סְפִירַת הָעֹמֶר וְהַצּוֹמוֹת","רֹאשׁ חֹדֶשׁ וְקִדּוּשׁ לְבָנָה","הַחֹדֶשׁ הָעִבְרִי, סְעוּדַת רֹאשׁ חֹדֶשׁ, יַעֲלֶה וְיָבוֹא, הַלֵּל, מוּסָף וּבִרְכַּת הַלְּבָנָה","../halacha-quiz/zmanim-01.html"],["halacha","📅 רֹאשׁ חֹדֶשׁ, סְפִירַת הָעֹמֶר וְהַצּוֹמוֹת","סְפִירַת הָעֹמֶר וְל״ג בָּעֹמֶר","מִצְוַת הַסְּפִירָה, מִנְהֲגֵי הָאֲבֵלוּת, רַבִּי עֲקִיבָא וְרַבִּי שִׁמְעוֹן בַּר יוֹחָאי","../halacha-quiz/zmanim-02.html"],["halacha","📅 רֹאשׁ חֹדֶשׁ, סְפִירַת הָעֹמֶר וְהַצּוֹמוֹת","הַצּוֹמוֹת וּשְׁלֹשֶׁת הַשָּׁבוּעוֹת","עֲשָׂרָה בְּטֵבֵת, י״ז בְּתַמּוּז וְצוֹם גְּדַלְיָה, דִּינֵי הַצּוֹמוֹת, בֵּין הַמְּצָרִים וְתִשְׁעַת הַיָּמִים","../halacha-quiz/zmanim-03.html"],["halacha","📅 רֹאשׁ חֹדֶשׁ, סְפִירַת הָעֹמֶר וְהַצּוֹמוֹת","עֶרֶב תִּשְׁעָה בְּאָב וְתִשְׁעָה בְּאָב","הַסְּעוּדָה הַמַּפְסֶקֶת, חֲמִשָּׁה עִנּוּיִים, אֵיכָה וְקִינוֹת, מִנְהֲגֵי אֲבֵלוּת וִילָדִים בְּתִשְׁעָה בְּאָב","../halacha-quiz/zmanim-04.html"],["halacha","📅 רֹאשׁ חֹדֶשׁ, סְפִירַת הָעֹמֶר וְהַצּוֹמוֹת","מוּשָּׂגִים וּלְשׁוֹן חֲכָמִים – רֹאשׁ חֹדֶשׁ, סְפִירַת הָעֹמֶר וְהַצּוֹמוֹת","מָה פֵּרוּשׁ הַמּוּשָּׂגִים וְהַמִּלִּים שֶׁפּוֹגְשִׁים בְּרֹאשׁ חֹדֶשׁ, בִּסְפִירַת הָעֹמֶר וּבְצוֹמוֹת הַשָּׁנָה","../halacha-quiz/zmanim-mk.html"],["halacha","👨‍👩‍👧 כִּבּוּד הוֹרִים וּמִשְׁפָּחָה","כַּבֵּד אֶת אָבִיךָ וְאֶת אִמֶּךָ","כִּבּוּד וּמוֹרָא, הַמָּקוֹם שֶׁל הַהוֹרִים, קִימָה, שְׁמוֹתֵיהֶם וּשְׁנָתָם","../halacha-quiz/mishpacha-01.html"],["halacha","👨‍👩‍👧 כִּבּוּד הוֹרִים וּמִשְׁפָּחָה","עוֹזְרִים בְּסֵבֶר פָּנִים יָפוֹת","עֶזְרָה בַּבַּיִת, שְׁלִיחֻיּוֹת, הוֹרִים זְקֵנִים, שְׂכַר הַמִּצְוָה, שְׁתִיקָה וּמְחִילָה","../halacha-quiz/mishpacha-02.html"],["halacha","👨‍👩‍👧 כִּבּוּד הוֹרִים וּמִשְׁפָּחָה","לִשְׁמֹעַ בְּקוֹלָם – וּלְכַבֵּד אֶת כָּל הַמִּשְׁפָּחָה","כָּבוֹד בַּלֵּב וְכַף זְכוּת, כִּבּוּד הוֹרִים וּשְׁמִירַת מִצְווֹת, שְׁמִיעָה בְּקוֹלָם, סָבִים וְאַחִים גְּדוֹלִים","../halacha-quiz/mishpacha-03.html"],["halacha","👨‍👩‍👧 כִּבּוּד הוֹרִים וּמִשְׁפָּחָה","בְּרִית מִילָה וּפִדְיוֹן הַבֵּן","הַמִּצְוָה הָרִאשׁוֹנָה, הַיּוֹם הַשְּׁמִינִי, מִנְהֲגֵי הַבְּרִית וְהַכִּבּוּדִים, וּפִדְיוֹן הַבְּכוֹר אֵצֶל הַכֹּהֵן","../halacha-quiz/mishpacha-04.html"],["halacha","👨‍👩‍👧 כִּבּוּד הוֹרִים וּמִשְׁפָּחָה","נִחוּם אֲבֵלִים וְעִלּוּי נְשָׁמָה","בָּרוּךְ דַּיַּן הָאֱמֶת, אֵיךְ מְנַחֲמִים בְּבֵית הָאֲבֵלִים, קַדִּישׁ, צְדָקָה וּמַעֲשִׂים טוֹבִים לְעִלּוּי הַנְּשָׁמָה, וְיוֹם הַשָּׁנָה","../halacha-quiz/mishpacha-05.html"],["halacha","👨‍👩‍👧 כִּבּוּד הוֹרִים וּמִשְׁפָּחָה","מוּשָּׂגִים וּלְשׁוֹן חֲכָמִים – כִּבּוּד הוֹרִים וּמִשְׁפָּחָה","מָה פֵּרוּשׁ הַמִּלִּים וְהַמּוּשָּׂגִים שֶׁל כִּבּוּד הוֹרִים, בְּרִית מִילָה, פִּדְיוֹן הַבֵּן וְנִחוּם אֲבֵלִים","../halacha-quiz/mishpacha-mk.html"],["halacha","🌷 הִלְכוֹת צְנִיעוּת","עוֹלָמָהּ שֶׁל הַצְּנִיעוּת","שׁוֹאֲפוֹת לִשְׁלֵמוּת, וּמְקַיְּמוֹת גַּם כְּשֶׁלֹּא מְבִינוֹת","../halacha-quiz/tzniut-01.html"],["halacha","🌷 הִלְכוֹת צְנִיעוּת","פְּנִימִיּוּת וְכָבוֹד","לָמָּה חָשׁוּב לְהִתְלַבֵּשׁ בִּצְנִיעוּת – בִּשְׁבִילֵנוּ, וְ״עִם אֱ־לֹהֶיךָ״","../halacha-quiz/tzniut-02.html"],["halacha","🌷 הִלְכוֹת צְנִיעוּת","כֹּחָהּ שֶׁל הִתְמוֹדְדוּת","כָּל הִתְגַּבְּרוּת חֲשׁוּבָה, צַעַד אַחַר צַעַד – וְשִׂמְחָה לִהְיוֹת עַבְדֵי ה׳","../halacha-quiz/tzniut-03.html"],["halacha","🌷 הִלְכוֹת צְנִיעוּת","לְבוּשׁ צָנוּעַ – חֲצָאִית, שַׁרְווּל וְצַוָּאר","צְנִיעוּת הִיא לֹא רַק אֹרֶךְ: כִּסּוּי הָרַגְלַיִם, הַיָּדַיִם וְהַצַּוָּאר","../halacha-quiz/tzniut-04.html"],["halacha","🌷 הִלְכוֹת צְנִיעוּת","חֲצָאִית – וְלֹא מִכְנָסַיִם","לֹא יִלְבַּשׁ, דַּת יְהוּדִית, לְבוּשׁ יִצּוּגִי וְזֶהוּת – וּמָה עוֹשִׂים בַּבַּיִת וּבַטִּיּוּל","../halacha-quiz/tzniut-05.html"],["halacha","🌷 הִלְכוֹת צְנִיעוּת","יֵצֶר הָעֲרָיוֹת – כֹּחַ גָּדוֹל מִמָּקוֹם קָדוֹשׁ","לָמָּה חֲכָמִים לֹא בִּטְּלוּ אֶת הַיֵּצֶר, מָה תַּפְקִידוֹ, וְלָמָּה הוּא חָזָק כָּל כָּךְ","../halacha-quiz/tzniut-06.html"],["halacha","🌷 הִלְכוֹת צְנִיעוּת","אִסּוּר נְגִיעָה – קְדֻשַּׁת הַמַּגָּע","״לֹא תִקְרְבוּ״: מְקוֹר הָאִסּוּר, הַהֲלָכָה לְמַעֲשֶׂה, וְאֵיךְ שׁוֹמְרִים בְּלִי לְהַעֲלִיב","../halacha-quiz/tzniut-07.html"],["halacha","🌷 הִלְכוֹת צְנִיעוּת","יִחוּד – דֶּלֶת פְּתוּחָה וְלֵב שָׁמוּר","מָה זֶה יִחוּד, מָה מוֹנֵעַ אוֹתוֹ, וְאֵיךְ נִזְהָרוֹת בְּשִׁעוּר פְּרָטִי, בַּהַסָּעָה וְאֵצֶל הָרוֹפֵא","../halacha-quiz/tzniut-08.html"],["halacha","🌷 הִלְכוֹת צְנִיעוּת","חֶבְרָה מְעֹרֶבֶת וּצְנִיעוּת בַּטִּיּוּל","שִׂיחָה עִנְיָנִית, גְּבוּלוֹת בְּרוּרִים, וְטִיּוּל שֶׁשּׁוֹמֵר עָלֵינוּ","../halacha-quiz/tzniut-09.html"],["halacha","🌷 הִלְכוֹת צְנִיעוּת","שְׁמִירַת הָעֵינַיִם – הִסְתַּכְּלוּת אֲסוּרָה","גַּם בַּמָּסָךְ, גַּם לַבָּנוֹת: תּוֹכְנַת סִנּוּן, הֲסָטַת הַמַּבָּט וְקִרְבַת ה׳","../halacha-quiz/tzniut-10.html"],["halacha","🌷 הִלְכוֹת צְנִיעוּת","שִׁירַת נָשִׁים","","../halacha-quiz/tzniut-11.html"],["halacha","🌷 הִלְכוֹת צְנִיעוּת","כִּסּוּי רֹאשׁ לְנָשִׁים","דַּת מֹשֶׁה וְדַת יְהוּדִית, שְׁלֹשָׁה טְעָמִים, גֶּדֶר הַכִּסּוּי – וְכָבוֹד לְאִמָּא וּלְכָל אִשָּׁה שֶׁמִּשְׁתַּדֶּלֶת","../halacha-quiz/tzniut-12.html"],["halacha","🌷 הִלְכוֹת צְנִיעוּת","מוּשָּׂגִים וּלְשׁוֹן חֲכָמִים – הִלְכוֹת צְנִיעוּת","מָה פֵּרוּשׁ הַמִּלִּים וְהַמּוּשָּׂגִים שֶׁפּוֹגְשִׁים בְּהִלְכוֹת צְנִיעוּת","../halacha-quiz/tzniut-mk.html"],["halacha","👂 קְרִיאַת שְׁמַע","שְׁמַע יִשְׂרָאֵל – עַל מָה אֲנַחְנוּ מְעִידִים","מִצְוָה שֶׁבַּלֵּב: ה׳ מַשְׁגִּיחַ עָלַי, ה׳ אֶחָד – וְהַכֹּל מֵאִתּוֹ","../halacha-quiz/shema-01.html"],["halacha","👂 קְרִיאַת שְׁמַע","וְאָהַבְתָּ – לֶאֱהֹב אֶת ה׳ גַּם כְּשֶׁקָּשֶׁה","לָמָּה לֹא מַסְפִּיק לְהַאֲמִין, אֵיךְ מַגִּיעִים לְאַהֲבָה, וְאֵיךְ שְׂמֵחִים גַּם בְּיוֹם קָשֶׁה","../halacha-quiz/shema-02.html"],["halacha","👂 קְרִיאַת שְׁמַע","בְּכָל לְבָבְךָ, בְּכָל נַפְשְׁךָ, בְּכָל מְאֹדֶךָ","אַבְרָהָם, יִצְחָק וְיַעֲקֹב, רַבִּי עֲקִיבָא – וְהָעֲקֵדָה שֶׁלִּי","../halacha-quiz/shema-03.html"],["halacha","👂 קְרִיאַת שְׁמַע","וְהָיוּ הַדְּבָרִים – מְקַיְּמִים אֶת שְׁמַע בְּכָל יוֹם","עַל הַלֵּב, בַּפֶּה, עַל הַיָּד, בֵּין הָעֵינַיִם וְעַל הַדֶּלֶת – וְהַהֲכָנָה מֵרֹאשׁ","../halacha-quiz/shema-04.html"],["halacha","👂 קְרִיאַת שְׁמַע","הַפָּרָשָׁה הַחֲשׁוּבָה בְּיוֹתֵר – אֵיךְ מַגִּיעִים לְאַהֲבַת ה׳","שֶׁבַע פְּעֻלּוֹת לַפָּרָשָׁה, ״ה׳ אֱלֹהֵינוּ״, ״בְּכָל לְבָבְךָ וְנַפְשְׁךָ וּמְאֹדֶךָ״ וְהַדֶּרֶךְ לְאַהֲבָה","../halacha-quiz/shema-05.html"],["halacha","🌙 אֱמוּנָה – וֶאֱמוּנָתְךָ בַּלֵּילוֹת","עוֹבְדִים אֶת ה׳ גַּם בַּלַּיְלָה וְגַם כְּשֶׁקָּשֶׁה","מִצְווֹת גְּדוֹלוֹת בָּרְגָעִים הָעֲיֵפִים, שָׂרָה אִמֵּנוּ שֶׁקָּמָה בַּלֵּילוֹת, וְהֲלָכוֹת שֶׁל מַחֲשָׁבָה","../halacha-quiz/emuna-01.html"],["halacha","🌙 אֱמוּנָה – וֶאֱמוּנָתְךָ בַּלֵּילוֹת","רַחֲמָנָא לִבָּא בָּעֵי – ה׳ רוֹצֶה אֶת הַלֵּב","מִצְווֹת שֶׁבַּלֵּב גְּדוֹלוֹת מִלִּמּוּד תּוֹרָה, וְלָמָּה נֶחְרְבוּ שְׁנֵי בָּתֵּי הַמִּקְדָּשׁ","../halacha-quiz/emuna-02.html"],["halacha","🌙 אֱמוּנָה – וֶאֱמוּנָתְךָ בַּלֵּילוֹת","חֶסֶד בַּבַּיִת – הוֹלְכִים בִּדְרָכָיו","אֵיךְ עֶזְרָה בַּבַּיִת נַעֲשֵׂית מִצְוָה, מָה אוֹמְרִים לִפְנֵי חֶסֶד, וְלָמָּה ה׳ אוֹהֵב אוֹתוֹ","../halacha-quiz/emuna-03.html"],["halacha","🙏 פִּרְקֵי הַתְּפִלָּה","לָמָּה מִתְפַּלְּלִים וְאֵיךְ מִתְכּוֹנְנִים","מַה הַמַּטָּרָה שֶׁל הַתְּפִלָּה, לָמָּה מִתְפַּלְּלִים הַרְבֵּה, וְאֵיךְ מַכְשִׁירִים אֶת הַלֵּב","../halacha-quiz/siddur-01.html"],["halacha","🙏 פִּרְקֵי הַתְּפִלָּה","בִּרְכוֹת הַשַּׁחַר וּבִרְכוֹת הַתּוֹרָה – תּוֹדָה עַל כָּל בֹּקֶר","מָה אוֹמְרִים כְּשֶׁקָּמִים, מָה מְבַקְּשִׁים בְּכָל בְּרָכָה, וְלָמָּה מְבָרְכִים עַל הַתּוֹרָה","../halacha-quiz/siddur-02.html"],["halacha","🙏 פִּרְקֵי הַתְּפִלָּה","שִׁירַת הַיּוֹם – פְּסוּקֵי דְזִמְרָה וּמִזְמוֹר לְתוֹדָה","מָה אוֹמְרִים לִפְנֵי שְׁמוֹנֶה עֶשְׂרֵה, מָה הַהֶבְדֵּל בֵּין שֶׁבַח לְהַלֵּל, וְלָמָּה תּוֹדָה פּוֹתַחַת שְׁעָרִים","../halacha-quiz/siddur-03.html"],["halacha","🙏 פִּרְקֵי הַתְּפִלָּה","הַלְלוּיָהּ – ה׳ מַשְׁגִּיחַ עַל הַכֹּל","שָׁלוֹשׁ הַשְׁגָּחוֹת בַּמִּזְמוֹרִים הָאַחֲרוֹנִים שֶׁל תְּהִלִּים: עָלַי, עַל עַם יִשְׂרָאֵל וְעַל כָּל הַבְּרִיאָה","../halacha-quiz/siddur-04.html"],["halacha","🙏 פִּרְקֵי הַתְּפִלָּה","נִשְׁמַת כָּל חַי – שִׁיר הַתּוֹדָה שֶׁל כָּל הַגּוּף","מָה אוֹמְרִים בַּנִּשְׁמַת, מָה פֵּרוּשׁ הַמִּלִּים, וְאֵיךְ הַגּוּף כֻּלּוֹ מוֹדֶה לַה׳","../halacha-quiz/siddur-05.html"],["halacha","🙏 פִּרְקֵי הַתְּפִלָּה","אָבוֹת, גְּבוּרוֹת וּקְדֻשָּׁה – שָׁלֹשׁ הַבְּרָכוֹת הָרִאשׁוֹנוֹת","מָה אוֹמְרִים בִּשְׁלוֹשׁ הַבְּרָכוֹת הָרִאשׁוֹנוֹת שֶׁל שְׁמוֹנֶה עֶשְׂרֵה, מָה פֵּרוּשָׁן, וּמָה חוֹשְׁבִים בָּהֶן","../halacha-quiz/siddur-06.html"],["halacha","🙏 פִּרְקֵי הַתְּפִלָּה","מְבַקְּשִׁים מֵאַבָּא – הַבַּקָּשׁוֹת וְהַגְּאֻלָּה","מָה מְבַקְּשִׁים בַּבְּרָכוֹת הָאֶמְצָעִיּוֹת, לָמָּה הֵן בָּאוֹת בַּסֵּדֶר הַזֶּה, וְאֵיךְ מִתְפַּלְּלִים גַּם עַל חֲבֵרִים","../halacha-quiz/siddur-07.html"],["halacha","🙏 פִּרְקֵי הַתְּפִלָּה","רְצֵה, מוֹדִים וְשִׂים שָׁלוֹם – תּוֹדָה וְשָׁלוֹם","אֵיךְ ה׳ מְקַבֵּל אֶת הַתְּפִלָּה, עַל מָה מוֹדִים, וְלָמָּה הַשָּׁלוֹם הוּא הַכְּלִי לַבְּרָכָה","../halacha-quiz/siddur-08.html"],["halacha","🙏 פִּרְקֵי הַתְּפִלָּה","אַשְׁרֵי וְעָלֵינוּ – שִׁיר שֶׁל שֶׁבַח וְתוֹדָה","לָמָּה אוֹמְרִים אַשְׁרֵי שָׁלֹשׁ פְּעָמִים בְּיוֹם, מָה יֵשׁ בִּשְׁלֹשֶׁת חֲלָקָיו, וּמָה אוֹמְרִים בְּ׳עָלֵינוּ לְשַׁבֵּחַ׳","../halacha-quiz/siddur-09.html"],["halacha","💛 אַהֲבַת ה׳","מַהִי אַהֲבַת ה׳?","מִצְוָה לְכָל גִּיל, הַדֶּרֶךְ הַפְּשׁוּטָה לְקַיֵּם אוֹתָהּ, וְאֵיךְ מַתְחִילִים עוֹד הַיּוֹם","../halacha-quiz/ahava-01.html"],["halacha","💛 אַהֲבַת ה׳","לָמָּה ה׳ בָּרָא אֶת הָעוֹלָם?","כְּדֵי לְהֵיטִיב: הָעוֹלָם נִבְרָא מֵאַהֲבָה, וְהַמִּצְווֹת הֵן נַחַת רוּחַ לַבּוֹרֵא","../halacha-quiz/ahava-02.html"],["halacha","💛 אַהֲבַת ה׳","הָאֹכֶל – מַתָּנָה מֵאַבָּא","מִי הֵבִיא לִי אֶת הַפְּרִי הַמָּתוֹק, לָמָּה חוֹשְׁבִים ׳מוֹדֶה אֲנִי לְךָ׳ לִפְנֵי בְּרָכָה, וְאֵיךְ טוֹעֲמִים בְּכַוָּנָה","../halacha-quiz/ahava-03.html"],["halacha","💛 אַהֲבַת ה׳","תּוֹדָה בְּעֵינַיִם","","../halacha-quiz/ahava-04.html"],["halacha","💛 אַהֲבַת ה׳","דַּקָּה שֶׁל תּוֹדָה בְּכָל יוֹם","מָה אָמַר הֶחָפֵץ חַיִּים עַל מִצְוַת אַהֲבַת ה׳, אֵיךְ מְחַבְּרִים דַּקַּת תּוֹדָה מִן הַלֵּב, וְלָמָּה לֹא מְמַהֲרִים","../halacha-quiz/ahava-05.html"],["halacha","💛 אַהֲבַת ה׳","עַיִן טוֹבָה פּוֹתַחַת אֶת הַלֵּב","מָה הִיא עַיִן טוֹבָה, לָמָּה קָשֶׁה לִרְאוֹת טוֹב, וְאֵיךְ רְאִיַּת הַטּוֹב מְחַזֶּקֶת אֶת הַהוֹדָיָה וְאֶת אַהֲבַת ה׳","../halacha-quiz/ahava-06.html"],["halacha","💛 אַהֲבַת ה׳","נִפְלְאוֹת הַבְּרִיאָה – מִתְבּוֹנְנִים וְאוֹהֲבִים","פֶּרַח, נְמָלָה וְשָׁעוֹן: אֵיךְ הַהִתְבּוֹנְנוּת בָּעוֹלָם מַגִּיעָה אֶל הַלֵּב","../halacha-quiz/ahava-07.html"],["halacha","💛 אַהֲבַת ה׳","גַּם זוֹ לְטוֹבָה – שְׁלוֹשָׁה סִפּוּרִים שֶׁל חֲזַ״ל","נַחוּם אִישׁ גַּם זוֹ, רַבִּי עֲקִיבָא וְאַבָּא יוּדָן: גַּם דְּבָרִים קָשִׁים בָּאִים מֵאַהֲבָה","../halacha-quiz/ahava-08.html"],["halacha","💛 אַהֲבַת ה׳","אַהֲבַת יִשְׂרָאֵל וְאַהֲבַת ה׳ – כָּל יְהוּדִי הוּא בֵּן יָקִיר","לָמָּה אוֹהֲבִים כָּל יְהוּדִי, וְאֵיךְ קוֹנִים אַהֲבָה לְחָבֵר בְּהִשְׁתַּוּוּת, בִּנְתִינָה, בִּתְפִלָּה וּבְמַחֲשָׁבָה","../halacha-quiz/ahava-09.html"],["halacha","💛 אַהֲבַת ה׳","קׇרְבַּן תּוֹדָה – הַכָּרָה, אֲמִירָה וּמַעֲשֶׂה","מִי מֵבִיא קָרְבַּן תּוֹדָה, לָמָּה אַרְבָּעִים לְחָמִים, וְאֵיךְ מוֹדִים לְה׳ בְּשָׁלוֹשׁ דְּרָכִים","../halacha-quiz/ahava-10.html"],["mekor","שַׁעַר רִאשׁוֹן – הַשְׁכָּמַת הַבֹּקֶר","הַשְׁכָּמַת הַבֹּקֶר","","../mekor-haim-quiz/mekorhaim-01.html"],["mekor","שַׁעַר רִאשׁוֹן – הַשְׁכָּמַת הַבֹּקֶר","חִידוֹן מְקוֹר חַיִּים – בִּרְכַּת אֲשֶׁר יָצַר וּבִרְכוֹת הַתּוֹרָה","פרקים ג-ד","../mekor-haim-quiz/mekorhaim-02.html"],["mekor","שַׁעַר רִאשׁוֹן – הַשְׁכָּמַת הַבֹּקֶר","בִּרְכוֹת הַשַּׁחַר","","../mekor-haim-quiz/mekorhaim-03.html"],["mekor","שַׁעַר רִאשׁוֹן – הַשְׁכָּמַת הַבֹּקֶר","הַשְׁכָּמַת בֵּית הַכְּנֶסֶת וּקְדֻשָּׁתוֹ","פרק ו","../mekor-haim-quiz/mekorhaim-04.html"],["mekor","שַׁעַר רִאשׁוֹן – הַשְׁכָּמַת הַבֹּקֶר","צִיצִית – חֵלֶק א׳","פרק ז","../mekor-haim-quiz/mekorhaim-06.html"],["mekor","שַׁעַר רִאשׁוֹן – הַשְׁכָּמַת הַבֹּקֶר","הַטַּלִּית וְחוּטֵי הַצִּיצִית","פרק ז","../mekor-haim-quiz/mekorhaim-07.html"],["mekor","שַׁעַר רִאשׁוֹן – הַשְׁכָּמַת הַבֹּקֶר","טַלִּית שְׁאוּלָה וּפְתִיל תְּכֵלֶת","פרק ז","../mekor-haim-quiz/mekorhaim-08.html"],["mekor","שַׁעַר רִאשׁוֹן – הַשְׁכָּמַת הַבֹּקֶר","מוּשָּׂגִים וּלְשׁוֹן חֲכָמִים – הַשְׁכָּמַת הַבֹּקֶר","","../mekor-haim-quiz/mekorhaim-mkp001.html"],["mekor","שַׁעַר רִאשׁוֹן – הַשְׁכָּמַת הַבֹּקֶר","מוּשָּׂגִים וּלְשׁוֹן חֲכָמִים – בִּרְכַּת אֲשֶׁר יָצַר וּבִרְכוֹת הַתּוֹרָה","","../mekor-haim-quiz/mekorhaim-mkp003.html"],["mekor","שַׁעַר רִאשׁוֹן – הַשְׁכָּמַת הַבֹּקֶר","מוּשָּׂגִים וּלְשׁוֹן חֲכָמִים – בִּרְכוֹת הַשַּׁחַר","","../mekor-haim-quiz/mekorhaim-mkp005.html"],["mekor","שַׁעַר רִאשׁוֹן – הַשְׁכָּמַת הַבֹּקֶר","מוּשָּׂגִים וּלְשׁוֹן חֲכָמִים – הַשְׁכָּמַת בֵּית הַכְּנֶסֶת וּקְדֻשָּׁתוֹ","","../mekor-haim-quiz/mekorhaim-mkp006.html"],["mekor","שַׁעַר רִאשׁוֹן – הַשְׁכָּמַת הַבֹּקֶר","מוּשָּׂגִים וּלְשׁוֹן חֲכָמִים – צִיצִית","","../mekor-haim-quiz/mekorhaim-mkp007.html"],["mekor","שַׁעַר שֵׁנִי – תְּפִלָּה","פֶּרֶק ח׳: קַדִּישׁ","פרק ח","../mekor-haim-quiz/mekorhaim-05.html"],["mekor","שַׁעַר שֵׁנִי – תְּפִלָּה","מִנְיַן עֲשָׂרָה","","../mekor-haim-quiz/mekorhaim-09.html"],["mekor","שַׁעַר שֵׁנִי – תְּפִלָּה","מוּשָּׂגִים וּלְשׁוֹן חֲכָמִים – קַדִּישׁ","","../mekor-haim-quiz/mekorhaim-mkp008.html"],["mekor","שַׁעַר שֵׁנִ const CM={};COLS.forEach(c=>CM[c.k]=c);
const $=s=>document.querySelector(s), main=$("#main"), q=$("#q");
const norm=s=>(s||"").replace(/[\u0591-\u05C7]/g,"").replace(/[״"׳']/g,"").toLowerCase();
ITEMS.forEach(it=>it.s=norm(it[1]+" "+it[2]+" "+it[3]+" "+CM[it[0]].t));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let cur="", limit=120;

function chips(){
  $("#chips").innerHTML='<button class="chip" data-k="" aria-pressed="'+(!cur)+'">🎲 כל הסדרות</button>'+
    COLS.map(c=>'<button class="chip" style="--c:'+c.c+'" data-k="'+c.k+'" aria-pressed="'+(cur===c.k)+'">'+c.e+' '+esc(c.t)+'</button>').join("");
}
function card(it){
  const c=CM[it[0]];
  return '<a class="card" style="--c:'+c.c+'" href="'+esc(it[4])+'">'+
    '<span class="tag">'+c.e+' '+esc(c.t)+(it[1]?' · '+esc(it[1]):'')+'</span>'+
    '<b>'+esc(it[2])+'</b>'+(it[3]?'<small>'+esc(it[3])+'</small>':'')+'<span class="go">לשחק ◀</span></a>';
}
function render(){
  const term=norm(q.value.trim());
  $("#clear").hidden=!q.value;
  chips();
  if(!cur && !term){
    main.innerHTML='<div class="cols">'+COLS.map(c=>'<button class="col'+(c.i?' pic':'')+'" style="--c:'+c.c+'" data-k="'+c.k+'">'+
      (c.i?'<img class="pimg" src="'+c.i+'" alt="" loading="lazy">':'')+'<span class="ic">'+c.e+'</span><h2>'+esc(c.t)+'</h2><p>'+esc(c.d)+'</p><span class="n">'+c.n+(c.n===1?' משחק':' חידונים ומשחקים')+'</span></button>').join("")+'</div>';
    return;
  }
  const words=term.split(/\s+/).filter(Boolean);
  const list=ITEMS.filter(it=>(!cur||it[0]===cur)&&words.every(w=>it.s.includes(w)));
  let h="";
  if(cur){const c=CM[cur];
    h+='<div class="head" style="--c:'+c.c+'"><button class="back" data-k="">→ כל הסדרות</button><h2>'+c.e+' '+esc(c.t)+'</h2>'+
      (c.h?'<a class="home" href="'+c.h+'">לדף הסדרה ולוח המצטיינים ◀</a>':'')+'</div>';}
  if(term) h+='<div class="head"><h2 style="font-size:20px">'+list.length+' תוצאות</h2></div>';
  if(!list.length){main.innerHTML=h+'<p class="empty">לא נמצא חידון כזה. נסו מילה אחרת.</p>';return;}
  let last=null;const shown=list.slice(0,limit);let grid="";
  shown.forEach(it=>{
    const g=cur?it[1]:CM[it[0]].t;
    if(g!==last){ if(last!==null) grid+='</div>'; grid+=(g?'<h3 class="grp">'+esc(g)+'</h3>':'')+'<div class="grid">'; last=g; }
    grid+=card(it);
  });
  grid+='</div>';
  if(list.length>limit) grid+='<button class="more" id="more">להציג עוד ('+(list.length-limit)+')</button>';
  main.innerHTML=h+grid;
}
function pick(k){cur=k;limit=120;render();window.scrollTo({top:0});try{history.replaceState(null,"",k?"#"+k:location.pathname)}catch(e){}}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-k]"); if(b){pick(b.dataset.k);return;}
  if(e.target.id==="more"){limit+=240;render();}
  if(e.target.id==="clear"){q.value="";render();q.focus();}
});
let tm;q.addEventListener("input",()=>{clearTimeout(tm);tm=setTimeout(()=>{limit=120;render()},120)});
const h0=decodeURIComponent(location.hash.slice(1)); if(CM[h0]) cur=h0;
render();
</script>
