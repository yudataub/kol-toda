"מָה ה׳ מְחַפֵּשׂ קֹדֶם כֹּל בַּמִּצְווֹת שֶׁלָּנוּ, וְלָמָּה הַלֵּב וְהָרָצוֹן חֲשׁוּבִים יוֹתֵר מִכַּמּוּת הַמַּעֲשִׂים","../halacha-quiz/ratzon-01.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – רָצוֹן וְחֵשֶׁק לַעֲבוֹדַת ה׳","רוֹצֶה מְאוֹד, וְנֶחְשָׁב כְּאִלּוּ עָשִׂיתִי","מָה קוֹרֶה כְּשֶׁרוֹצִים מְאוֹד לַעֲשׂוֹת מִצְוָה וְלֹא מַצְלִיחִים: מַחֲשָׁבָה טוֹבָה שֶׁה׳ מְצָרֵף לְמַעֲשֶׂה, וְסִפּוּרִים עַל מוֹהֵל וְעַל רַחַב״ד","../halacha-quiz/ratzon-02.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – רָצוֹן וְחֵשֶׁק לַעֲבוֹדַת ה׳","אַבְרָהָם הִתְחִיל מֵהַלֵּב","אֵיךְ הִתְחִיל אַבְרָהָם אָבִינוּ אֶת הַדֶּרֶךְ בְּלִי בֵּית מִדְרָשׁ, מֵאָבוֹת לְשׁוֹן רָצוֹן, וְאֵיךְ גַּם אֲנַחְנוּ מַתְחִילִים מֵהַלֵּב","../halacha-quiz/ratzon-03.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – רָצוֹן וְחֵשֶׁק לַעֲבוֹדַת ה׳","מָתַי יַגִּיעוּ מַעֲשַׂי לְמַעֲשֵׂי אֲבוֹתַי?","לָמָּה כָּל יְהוּדִי שׁוֹאֵף לִהְיוֹת כְּמוֹ הָאָבוֹת, אֵיךְ שְׁאִיפָה וּתְשׁוּקָה מְבִיאוֹת הֲנָאָה וְהַצְלָחָה, וּמַדּוּעַ ה׳ שָׂמֵחַ בְּלֵב מִשְׁתּוֹקֵק","../halacha-quiz/ratzon-04.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – רָצוֹן וְחֵשֶׁק לַעֲבוֹדַת ה׳","בְּדֶרֶךְ שֶׁאָדָם רוֹצֶה לֵילֵךְ","לָמָּה כְּשֶׁאָדָם רוֹצֶה בֶּאֱמֶת הַדֶּרֶךְ נִפְתַּחַת לְפָנָיו, וְאֵיךְ פֶּתַח קָטָן כְּחוֹד מַחַט נַעֲשֶׂה שַׁעַר גָּדוֹל","../halacha-quiz/ratzon-05.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – רָצוֹן וְחֵשֶׁק לַעֲבוֹדַת ה׳","אִם אֵין חֵשֶׁק, מְבַקְּשִׁים חֵשֶׁק","מָה עוֹשִׂים כְּשֶׁאֵין לָנוּ רָצוֹן לְמִצְוָה, אֵיךְ מְבַקְּשִׁים מֵה׳ חֵשֶׁק, וְלָמָּה הַבַּקָּשָׁה עַצְמָהּ מְעוֹרֶרֶת אֶת הַלֵּב","../halacha-quiz/ratzon-06.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – רָצוֹן וְחֵשֶׁק לַעֲבוֹדַת ה׳","הַפַּרְעוֹשׁ בַּקֻּפְסָה – לֹא מִתְיָאֲשִׁים","מָה לָמַד הַפַּרְעוֹשׁ שֶׁהִתְרַגֵּל לַמַּכָּה, לָמָּה עֶצֶם הָרָצוֹן הוּא הַנִּצָּחוֹן, וְאֵיךְ מַמְשִׁיכִים לְנַסּוֹת","../halacha-quiz/ratzon-07.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – רָצוֹן וְחֵשֶׁק לַעֲבוֹדַת ה׳","בַּבֹּקֶר מַחְלִיטִים: אֲנִי רוֹצֶה הַכֹּל","אֵיךְ אֶפְשָׁר לְקַיֵּם אֶת כָּל הַמִּצְווֹת בְּיוֹם אֶחָד? בְּרָצוֹן שֶׁמְּצַפֶּה לַמִּצְוָה, וּבְ׳הֲרֵינִי מוּכָן וּמְזֻמָּן׳","../halacha-quiz/ratzon-08.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – רָצוֹן וְחֵשֶׁק לַעֲבוֹדַת ה׳","עֲקֵדַת הָרָצוֹן","","../halacha-quiz/ratzon-09.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – רָצוֹן וְחֵשֶׁק לַעֲבוֹדַת ה׳","כְּפִי הַחֵשֶׁק נִבְנֶה מִשְׁכָּן בַּלֵּב","מִי נִקְרָא אֵיתָן, לָמָּה הַחֵשֶׁק הוּא כְּלִי לַשְּׁכִינָה, וְאֵיךְ לֹא מְמַלְּאִים אֶת הַלֵּב בִּדְבָרִים לֹא נְכוֹנִים","../halacha-quiz/ratzon-10.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – רָצוֹן וְחֵשֶׁק לַעֲבוֹדַת ה׳","לֵאָה וְיִשָּׂשכָר – נוֹלַד מֵהִשְׁתּוֹקְקוּת","מָה הָיוּ הַכִּסּוּפִים שֶׁל לֵאָה, לָמָּה יִשָּׂשכָר הוּא שֵׁבֶט הַתּוֹרָה, וְאֵיךְ מַתְחִילִים לִלְמֹד מִתּוֹךְ רָצוֹן","../halacha-quiz/ratzon-11.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – רָצוֹן וְחֵשֶׁק לַעֲבוֹדַת ה׳","לָמָּה נִגְרַע חֶלְקֵנוּ?","מִי הָיוּ הָאֲנָשִׁים שֶׁלֹּא יָכְלוּ לְהַקְרִיב, לָמָּה נִכְתְּבָה פָּרָשַׁת פֶּסַח שֵׁנִי, וְאֵיךְ מְבַקְּשִׁים הִזְדַּמְּנוּת כְּשֶׁאִכְפַּת לָנוּ","../halacha-quiz/ratzon-12.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – רָצוֹן וְחֵשֶׁק לַעֲבוֹדַת ה׳","סוֹפְרִים בְּגַעְגּוּעַ – סְפִירַת הָעֹמֶר","לָמָּה סוֹפְרִים יָמִים מִפֶּסַח לַשָּׁבוּעוֹת, מָה מְלַמֵּד הַמָּשָׁל עַל עֶבֶד שֶׁשּׁוֹאֵף צֵל, וְאֵיךְ הַכְּמִיהָה מַכִּינָה אֶת הַלֵּב לְקַבָּלַת הַתּוֹרָה","../halacha-quiz/ratzon-13.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – רָצוֹן וְחֵשֶׁק לַעֲבוֹדַת ה׳","הַכֹּל בִּידֵי שָׁמַיִם חוּץ מִיִּרְאַת שָׁמַיִם","מָה ה׳ קוֹבֵעַ וּמָה בְּיָדֵינוּ, לָמָּה מֻתָּר לְבַקֵּשׁ מֵה׳ ׳תֵּן אַתָּה׳, וְאֵיךְ הַבַּקָּשָׁה הִיא חֵלֶק מֵהָרָצוֹן","../halacha-quiz/ratzon-14.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – רָצוֹן וְחֵשֶׁק לַעֲבוֹדַת ה׳","לוֹמְדִים כְּדֵי לִרְצוֹת לַעֲשׂוֹת","לָמָּה גָּדוֹל הַלִּמּוּד שֶׁמֵּבִיא לִידֵי מַעֲשֶׂה, וְאֵיךְ לִמּוּד יוֹצֵר בַּלֵּב רָצוֹן לְקַיֵּם","../halacha-quiz/ratzon-15.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – רָצוֹן וְחֵשֶׁק לַעֲבוֹדַת ה׳","לָמָּה קוֹרְאִים קְרִיאַת שְׁמַע פַּעֲמַיִם?","לָמָּה קוֹרְאִים קְרִיאַת שְׁמַע בַּבֹּקֶר וּבָעֶרֶב, וְאֵיךְ הִיא מְעוֹרֶרֶת בַּלֵּב שְׁאִיפָה לְהִתְקָרֵב לַה׳","../halacha-quiz/ratzon-16.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – רָצוֹן וְחֵשֶׁק לַעֲבוֹדַת ה׳","הַכֹּל תָּלוּי בָּרָצוֹן","לָמָּה הָרָצוֹן הוּא הַמְּכַוֵּן שֶׁל כָּל הַמִּצְווֹת, וְאֵיךְ מַגִּיעִים לִקְרַבַת ה׳ כְּשֶׁיֵּשׁ שְׁאִיפָה אֲמִתִּית","../halacha-quiz/ratzon-17.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – רָצוֹן וְחֵשֶׁק לַעֲבוֹדַת ה׳","שְׁלֹשָׁה שְׁלָבִים לְרָצוֹן אֲמִתִּי","מַהוּ הַיְּסוֹד שֶׁל כָּל הַבִּנְיָן, מָה שְׁלֹשֶׁת הַשְּׁלָבִים לִבְנִיַּת הָרָצוֹן, וְאֵיךְ כְּשֶׁיֵּשׁ רָצוֹן אֲמִתִּי אֵין קֹשִׁי","../halacha-quiz/ratzon-18.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – רָצוֹן וְחֵשֶׁק לַעֲבוֹדַת ה׳","הַתְּפִלָּה לְחַזֵּק אֶת הַלֵּב","מָה מְבַקְּשִׁים מֵה׳ עַל הַלֵּב וְעַל הָאֵיבָרִים, לָמָּה צוֹעֲקִים אֵלָיו, וְאֵיךְ כּוֹתְבִים תְּפִלָּה בִּשְׁנֵי מִשְׁפָּטִים","../halacha-quiz/ratzon-19.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – רָצוֹן וְחֵשֶׁק לַעֲבוֹדַת ה׳","הַסִּימָן שֶׁאֲנִי אוֹהֵב מִצְווֹת","מָתַי אֲנִי שָׂמֵחַ בְּמִצְוָה, מָה לָמַד הָאוֹר הַחַיִּים עַל הַלֵּב הַחוֹשֵׁק, וְאֵיךְ מַד שִׂמְחָה עוֹזֵר לִי לְחַזֵּק אֶת הָרָצוֹן","../halacha-quiz/ratzon-20.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – חֶשְׁבּוֹן הַנֶּפֶשׁ","אֱלוּל – מְחַפְּשִׂים","מַה פֵּרוּשׁ הַשֵּׁם אֱלוּל, לָמָּה מְחַפְּשִׂים אֶת הַדֶּרֶךְ וְלֹא רַק אֶת הַמַּעֲשִׂים, וְאֵיךְ עוֹצְרִים דַּקָּה לִפְגֹּשׁ אֶת עַצְמִי","../halacha-quiz/cheshbon-01.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – חֶשְׁבּוֹן הַנֶּפֶשׁ","קוֹדֵם כֹּל הַטּוֹב","לָמָּה חֶשְׁבּוֹן נֶפֶשׁ מַתְחִיל בְּהַטּוֹב שֶׁה׳ עָשָׂה אִתִּי, מָה זֶה פִּנְקַס הַפֶּלֶא, וְאֵיךְ שׁוֹאֲלִים אַחַר כָּךְ: מָה אֲנִי מַחְזִיר","../halacha-quiz/cheshbon-02.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – חֶשְׁבּוֹן הַנֶּפֶשׁ","מְנַהֵל הָעֵסֶק שֶׁלִּי","אֵיךְ עוֹשִׂים חֶשְׁבּוֹן נֶפֶשׁ כְּמוֹ מְנַהֵל עֵסֶק: גַּן הַמְּבוּכָה, שְׁתֵּי שִׁיטוֹת לַחֲשֹׁב עַל הַיּוֹם, וְזְמַן קָבוּעַ בְּכָל יוֹם","../halacha-quiz/cheshbon-03.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – חֶשְׁבּוֹן הַנֶּפֶשׁ","לָמָּה אֲנִי עוֹשֶׂה אֶת זֶה?","׳בְּכָל דְּרָכֶיךָ דָעֵהוּ׳: לִשְׁאֹל לָמָּה לִפְנֵי כָּל מַעֲשֶׂה, לֹא לַעֲשׂוֹת מִצְוָה מְלֻמָּדָה, וְלִזְכֹּר אֶת ה׳ גַּם בַּדְּבָרִים הָרְגִילִים","../halacha-quiz/cheshbon-04.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – חֶשְׁבּוֹן הַנֶּפֶשׁ","הַטַּבְלָה שֶׁלִּי – רְשִׁימָה שֶׁקּוֹרְאִים כָּל יוֹם","לָמָּה רַעְיוֹן טוֹב נִשְׁכָּח אַחֲרֵי כַּמָּה יָמִים, וְאֵיךְ טַבְלָה קְטַנָּה שֶׁל שׁוּרוֹת וְיָמִים עוֹזֶרֶת לִי לְהַתְמִיד","../halacha-quiz/cheshbon-05.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – חֶשְׁבּוֹן הַנֶּפֶשׁ","סְלִיחָה מִן הַלֵּב – לֹא רַק מִן הַפֶּה","דָּנִי מְבַקֵּשׁ סְלִיחָה מִכֻּלָּם וְאַף אֶחָד לֹא סוֹלֵחַ לוֹ – עַד שֶׁהוּא לוֹמֵד מָה הִיא סְלִיחָה אֲמִתִּית","../halacha-quiz/cheshbon-06.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – חֶשְׁבּוֹן הַנֶּפֶשׁ","אֶבֶן גְּדוֹלָה וַאֲבָנִים קְטַנּוֹת","שְׁתֵּי נָשִׁים אֵצֶל צַדִּיק: אַחַת בָּאָה לְהִתְוַדּוֹת עַל חֵטְא כָּבֵד, וְהַשְּׁנִיָּה אָמְרָה ׳רַק חֲטָאִים קְטַנִּים׳ – וְלָמָּה הַקְּטַנִּים קָשִׁים לְתַקֵּן","../halacha-quiz/cheshbon-07.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – חֶשְׁבּוֹן הַנֶּפֶשׁ","גַּם הַטּוֹב צָרִיךְ בְּדִיקָה","פִּשְׁפּוּשׁ וּמִשְׁמוּשׁ: בּוֹדְקִים לֹא רַק מָה לְתַקֵּן, אֶלָּא גַּם אֵיךְ וּלְשֵׁם מָה עָשִׂינוּ אֶת הַמַּעֲשִׂים הַטּוֹבִים","../halacha-quiz/cheshbon-08.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – חֶשְׁבּוֹן הַנֶּפֶשׁ","לִפְנֵי הַמִּצְוָה כֹּחַ, אַחֲרֶיהָ שִׂמְחָה","מָתַי עוֹשִׂים חֶשְׁבּוֹן נֶפֶשׁ, וְלָמָּה יוֹצְאִים מִן הַתְּפִלָּה וּמִן הַלִּמּוּד בְּשִׂמְחָה: רָבָא וְהַצְּדוֹקִי, ׳עָלֵינוּ לְשַׁבֵּחַ׳ וְ׳שַׂמְתָּ חֶלְקִי׳","../halacha-quiz/cheshbon-09.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – חֶשְׁבּוֹן הַנֶּפֶשׁ","לֹא בְּמִקְרֶה","","../halacha-quiz/cheshbon-10.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – כְּבוֹד שַׁבָּת וְעֹנֶג שַׁבָּת","מִי שֶׁטָּרַח בְּעֶרֶב שַׁבָּת","לָמָּה מִתְכּוֹנְנִים לַשַּׁבָּת, מָה פֵּרוּשׁ ׳שָׁמוֹר׳, וְאֵיךְ הַהֲכָנָה הִיא דֶּרֶךְ לְקַבֵּל מַתָּנָה מֵה׳","../halacha-quiz/oneg-01.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – כְּבוֹד שַׁבָּת וְעֹנֶג שַׁבָּת","אֵיךְ כִּבְּדוּ חֲכָמִים אֶת הַשַּׁבָּת","אִישׁ אִישׁ לְפִי דַּרְכּוֹ: רַב נַחְמָן, רָבָא, רַב הוּנָא וַחֲבֵרֵיהֶם טָרְחוּ בְּעַצְמָם, וּמְכַבְּדִים אֶת הַשַּׁבָּת כְּמוֹ אוֹרֵחַ חָשׁוּב","../halacha-quiz/oneg-02.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – כְּבוֹד שַׁבָּת וְעֹנֶג שַׁבָּת","יוֹסֵף מוֹקִיר שַׁבָּת","הָעָנִי שֶׁלֹּא חָסַךְ עַל הַשַּׁבָּת, הֶעָשִׁיר שֶׁחָלַם חֲלוֹם, הָאֶבֶן בַּכּוֹבַע וְהַדָּג הַגָּדוֹל","../halacha-quiz/oneg-03.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – כְּבוֹד שַׁבָּת וְעֹנֶג שַׁבָּת","שַׁמַּאי – זוֹכְרִים אֶת הַשַּׁבָּת כָּל הַשָּׁבוּעַ","זָכוֹר אֶת יוֹם הַשַּׁבָּת: לָמָּה קוֹרְאִים רִאשׁוֹן בְּשַׁבָּת, מָה עָשָׂה שַׁמַּאי הַזָּקֵן, וְאֵיךְ מַכְנִיסִים אֶת הַשַּׁבָּת לַלֵּב בְּכָל יוֹם","../halacha-quiz/oneg-04.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – כְּבוֹד שַׁבָּת וְעֹנֶג שַׁבָּת","לְכַבֵּד וּלְעַנֵּג","","../halacha-quiz/oneg-05.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – כְּבוֹד שַׁבָּת וְעֹנֶג שַׁבָּת","שִׁירוֹ שֶׁל אָדָם הָרִאשׁוֹן","אֵיךְ נוֹלַד שִׁיר הַשַּׁבָּת מִתְּשׁוּבָה, מָה קָשׁוּר בֵּין הוֹדָיָה לְטָעוּת, וְלָמָּה שָׁרִים ׳טוֹב לְהוֹדוֹת׳ בְּשַׁבָּת","../halacha-quiz/oneg-06.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – כְּבוֹד שַׁבָּת וְעֹנֶג שַׁבָּת","הַכִּנּוֹר בְּתַחֲנַת הָרַכֶּבֶת","לָמָּה אַף אֶחָד לֹא שָׂם לֵב לַכַּנָּר הַמְפֻרְסָם בַּתַּחֲנָה, וּמָה זֶה מְלַמֵּד עַל הַשַּׁבָּת וְעַל הַהַקְשָׁבָה לְטוּב ה׳","../halacha-quiz/oneg-07.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – כְּבוֹד שַׁבָּת וְעֹנֶג שַׁבָּת","״יֶשׁ לִי כֹּל״","","../halacha-quiz/oneg-08.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – כְּבוֹד שַׁבָּת וְעֹנֶג שַׁבָּת","כִּי חַג ה׳ לָנוּ","לָמָּה לוֹקְחִים אֶת כֻּלָּם לְחַג, לָמָּה שִׁיר נִשְׁאָר בַּלֵּב, וְאֵיךְ אֶפְשָׁר לַהֲפֹךְ מִצְוָה לַחֲגִיגָה","../halacha-quiz/oneg-09.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – כְּבוֹד שַׁבָּת וְעֹנֶג שַׁבָּת","מְקוֹר הַבְּרָכָה","","../halacha-quiz/oneg-10.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – זְרִיזוּת","מַה זֹּאת זְרִיזוּת?","הֱוֵי עַז כַּנָּמֵר, קַל כַּנֶּשֶׁר, רָץ כַּצְּבִי וְגִבּוֹר כָּאֲרִי – מַה בְּדִיּוּק זְרִיזוּת, וּמַה הַהֶבְדֵּל בֵּינָהּ לְבֵין פְּזִיזוּת","../halacha-quiz/zrizut-01.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – זְרִיזוּת","אַבְרָהָם רָץ","","../halacha-quiz/zrizut-02.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – זְרִיזוּת","רִבְקָה – ׳וַתְּמַהֵר וַתָּרָץ׳","וַתְּמַהֵר, וַתְּמַהֵר, וַתָּרָץ – רִבְקָה הוֹלֶכֶת בְּדַרְכּוֹ שֶׁל אַבְרָהָם, וְלוֹמֶדֶת אוֹתָנוּ לָרוּץ גַּם לְמִצְוָה קַלָּה","../halacha-quiz/zrizut-03.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – זְרִיזוּת","מַצָּה וּמִצְוָה","","../halacha-quiz/zrizut-04.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – זְרִיזוּת","שֵׁם וָיֶפֶת: מִי הִתְאַמֵּץ יוֹתֵר?","מָה לָמְדוּ חֲכָמִים מִן הַמִּלָּה ׳וַיִּקַּח׳, אֵיךְ הִתְאַמְּצוּת בְּמִצְוָה מְבִיאָה בְּרָכָה, וְלָמָּה זְרִיזוּת הִיא מִדָּה שֶׁל לֵב","../halacha-quiz/zrizut-05.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – זְרִיזוּת","הַנְּשִׂיאִים שֶׁהִמְתִּינוּ","מָה קָרָה כְּשֶׁהַנְּשִׂיאִים אָמְרוּ ׳מַה שֶּׁיֶּחְסַר נַשְׁלִים׳, לָמָּה לֹא מְחַכִּים לָרֶגַע הַמֻּשְׁלָם, וְאֵיךְ מַתְחִילִים עַכְשָׁו וּמְהַדְּרִים תּוֹךְ כְּדֵי","../halacha-quiz/zrizut-06.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – זְרִיזוּת","לָרוּץ לְבֵית הַכְּנֶסֶת","מָה אָמַר אַבַּיֵּי עַל הָרִיצָה לַמִּצְוָה, מָה לָמַד רַבִּי זֵירָא, וְאֵיךְ רָצִים בִּזְהִירוּת וּבְשִׂמְחָה","../halacha-quiz/zrizut-07.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – זְרִיזוּת","הָרֶגֶל מְעוֹרֶרֶת אֶת הַלֵּב","אֵיךְ תְּנוּעָה מְהִירָה מְעוֹרֶרֶת חֵשֶׁק, לָמָּה ׳רָץ׳ קָרוֹב ל׳רָצוֹן׳, וּמָה לָמַדְנוּ מִדָּוִד וּמִנַּפְתָּלִי","../halacha-quiz/zrizut-08.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – זְרִיזוּת","שְׂדֵה הֶעָצֵל","","../halacha-quiz/zrizut-09.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – זְרִיזוּת","הַשְׁכָּמָה","","../halacha-quiz/zrizut-10.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – זְרִיזוּת","מִצְוָה שֶׁבָּאָה לְיָדְךָ – אֲפִלּוּ בַּשֶּׁלֶג","הָרַב חַיִּים זוֹנֶנְפֶלְד יוֹצֵא בַּשֶּׁלֶג וּבַסּוּפָה, וְאֵין לוֹ תֵּרוּצִים: מָה אוֹמֶרֶת הַזְּרִיזוּת עַל מִצְוָה שֶׁבָּאָה לַיָּד?","../halacha-quiz/zrizut-11.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – זְרִיזוּת","בְּעַצְמִי, בִּזְרִיזוּת – הַכְּרָכָּרָה, הַמִּכְתָּב וְעֶרֶב פֶּסַח","הָרַב חַיִּים זוֹנֶנְפֶלְד לֹא שׁוֹלֵחַ אֲחֵרִים: הוּא עוֹלֶה בַּגֶּשֶׁם, רָץ לְבֵית הַחוֹלִים וּמְחַלֵּק כֶּסֶף לְפֶסַח. מָה אוֹמֵר זָרִיז עַל מִצְוָה שֶׁעוֹשִׂים בְּעַצְמוֹ?","../halacha-quiz/zrizut-12.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – זְרִיזוּת","הַמָּשִׁיחַ מַתִּיר אֶת הַתַּחְבּוֹשֶׁת – זְרִיזוּת לְפַיֵּס","הָרַב חַיִּים זוֹנֶנְפֶלְד הוֹלֵךְ בַּלַּיְלָה לְפַיֵּס, וּמֵבִיא סִפּוּר מֵהַגְּמָרָא עַל הַמָּשִׁיחַ: כָּל דַּקָּה חֲשׁוּבָה, גַּם כְּשֶׁמְּפַיְּסִים.","../halacha-quiz/zrizut-13.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – זְרִיזוּת","רַבִּי נַחוּם מֵהוֹרַדְנָא – רְגָעִים כְּמוֹ מַרְגָּלִיּוֹת","הוּא סָפַר אֶת הָרְגָעִים כְּמוֹ מַרְגָּלִיּוֹת, יָשֵׁן בַּבְּגָדִים, אָסַף צְדָקָה בְּתַרְמִיל וְרָץ בְּכָל יוֹם שִׁשִּׁי לְזָרֵז אֶת הָעִיר לִקְרַאת הַשַּׁבָּת.","../halacha-quiz/zrizut-14.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – זְרִיזוּת","בְּעֶרֶב יוֹם כִּפּוּר – רָצִים לַעֲזֹר","רַבִּי זֶרַח בְּרַוֶּרְמַן, הָעֶזְרָה שֶׁלֹּא מְחַכָּה, וְלָמָּה זְרִיזוּת הִיא אַהֲבָה","../halacha-quiz/zrizut-15.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – זְרִיזוּת","לֹא הִקְדִּימוּ אוֹתוֹ – שָׁלוֹם רִאשׁוֹן","רַבִּי מֹשֶׁה לֵייב מִסַּסּוֹב, הַדֶּלֶת שֶׁנִּפְתַּחַת מִיָּד, וְהַזְּרִיזוּת שֶׁל לוֹמַר שָׁלוֹם","../halacha-quiz/zrizut-16.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – זְרִיזוּת","הַלְוָאָה בַּשֶּׁלֶג – מְקַיְּמִים בַּזְּמַן","רַבִּי אַרְיֵה לֵוִין, הַהַבְטָחָה שֶׁמְּקַיְּמִים בְּדִיּוּק, וְהַחֵפֶץ חַיִּים שֶׁחָשׁ לְשַׁלֵּם","../halacha-quiz/zrizut-17.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – זְרִיזוּת","הַנַּעַר שֶׁלֹּא זָז","","../halacha-quiz/zrizut-18.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – זְרִיזוּת","אֵיךְ נַעֲשִׂים זְרִיזִים?","דְּרָכִים לִקְנִיַּת הַזְּרִיזוּת: הִתְבּוֹנְנוּת בַּטּוֹבוֹת, שְׁאִיפָה, תָּכְנִית, הֶרְגֵּל וְלִמּוּד מִגְּדוֹלִים","../halacha-quiz/zrizut-19.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – זְרִיזוּת","סִכּוּם: זָרִיז וְלֹא פַּזִּיז","חֲמִשָּׁה חֶלְקֵי הַזְּרִיזוּת, הַהֶבְדֵּל בֵּין זְרִיזוּת לִפְזִיזוּת, וְהַזְּרִיזוּת הַגְּדוֹלָה – לָרוּץ אַחֲרֵי ה׳","../halacha-quiz/zrizut-20.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אֱמֶת","הָעוֹלָם עוֹמֵד עַל הָאֱמֶת","מִי הוּא אִישׁ אֱמֶת, לָמָּה יִתְרוֹ בִּקֵּשׁ שָׂרִים שֶׁהֵם אַנְשֵׁי אֱמֶת, וְאֵיךְ הוֹלְכִים בְּדֶרֶךְ הָאֱמֶת","../halacha-quiz/emet-01.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אֱמֶת","עִיר הָאֱמֶת","","../halacha-quiz/emet-02.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אֱמֶת","הַשֶּׁקֶר וְהַהֶפְסֵד","","../halacha-quiz/emet-03.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אֱמֶת","הַמַּקֵּל שֶׁל בַּר תַּלְמְיוֹן","אִישׁ יָשָׁר, שְׁבוּעָה מְתֻחְכֶּמֶת וְקָנֶה שֶׁנִּשְׁבַּר – וְלָמָּה שֶׁקֶר אֵינוֹ מַחֲזִיק מַעֲמָד","../halacha-quiz/emet-04.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אֱמֶת","מָה עוֹשִׂים כְּשֶׁאַף אֶחָד לֹא רוֹאֶה?","יֹשֶׁר בַּסֵּתֶר, חֲמִשָּׁה שְׁקָלִים מוּל שְׁלוֹשִׁים אֶלֶף, וְלָמָּה הָאֱמֶת נִבְחֶנֶת כְּשֶׁהִיא עוֹלָה לָנוּ","../halacha-quiz/emet-05.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אֱמֶת","לְהוֹדוֹת עַל הָאֱמֶת","הֶחָכָם מוֹדֶה עַל הָאֱמֶת: ׳טָעִיתִי׳, ׳לֹא שָׁמַעְתִּי׳, ׳צָדַקְתָּ׳ – מִשְׁנָה מִפִּרְקֵי אָבוֹת וּמַה לוֹמְדִים מִמֶּנָּה","../halacha-quiz/emet-06.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אֱמֶת","כַּלָּה נָאָה וַחֲסוּדָה","בֵּית שַׁמַּאי וּבֵית הִלֵּל נֶחְלְקוּ אֵיךְ מְשַׁבְּחִים כַּלָּה, וּמָה זֶה מְלַמֵּד עַל אֱמֶת וְשָׁלוֹם בַּחַיִּים שֶׁלָּנוּ","../halacha-quiz/emet-07.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אֱמֶת","שְׂפַת אֱמֶת תִּכּוֹן לָעַד","הָאֱמֶת עוֹמֶדֶת וְהַשֶּׁקֶר לֹא מַחְזִיק מַעֲמָד, וְכָךְ עָמַד יוֹסֵף בַּנִּסָּיוֹן וְקִבֵּל הַכֹּל מִשֶּׁלּוֹ","../halacha-quiz/emet-08.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אֱמֶת","הַחוֹתָם שֶׁלִּי","","../halacha-quiz/emet-09.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שְׁמִירַת הַלָּשׁוֹן","הַנֵּר הָאֶמְצָעִי","","../halacha-quiz/lashon-01.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שְׁמִירַת הַלָּשׁוֹן","הַמֶּלֶךְ שֶׁל הָאֵיבָרִים","מַעֲשֶׂה בְּמֶלֶךְ פָּרַס וּבַחֲלֵב לְבִיאָה, וְאֵיךְ הַלָּשׁוֹן הִצִּילָה","../halacha-quiz/lashon-02.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שְׁמִירַת הַלָּשׁוֹן","מִלָּה בְּסֶלַע, שְׁתִיקָה בִּשְׁתַּיִם","לָמָּה חוֹשְׁבִים לִפְנֵי שֶׁמְּדַבְּרִים, וְאֵיךְ בּוֹחֲרִים אֶת הַמִּלָּה הַנְּכוֹנָה","../halacha-quiz/lashon-03.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שְׁמִירַת הַלָּשׁוֹן","בְּרָכָה שֶׁל מִי שֶׁלֹּא חָשַׁבְנוּ","אַל תְּהִי בִּרְכַּת הֶדְיוֹט קַלָּה בְּעֵינֶיךָ – כֹּחָהּ שֶׁל בְּרָכָה מִן הַלֵּב","../halacha-quiz/lashon-04.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שְׁמִירַת הַלָּשׁוֹן","הַדִּבּוּר מְחַבֵּר אֶת הַלֵּב","אֵיךְ הַדִּבּוּר מַעֲבִיר אֶת הָאֱמוּנָה מֵהָרֹאשׁ אֶל הַלֵּב, וְלָמָּה כְּדַאי לוֹמַר תּוֹדָה בַּפֶּה גַּם כְּשֶׁהַלֵּב עוֹד לֹא מַרְגִּישׁ","../halacha-quiz/lashon-05.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שְׁמִירַת הַלָּשׁוֹן","הַפֶּה נִבְרָא לְהוֹדוֹת","לָמָּה נִבְרָא הַפֶּה, אֵיךְ רְאִיַּת הַטּוֹב מְבִיאָה לְהוֹדָיָה, וְלָמָּה מִי שֶׁמְּחַפֵּשׂ רַע מוֹצֵא אוֹתוֹ אֲפִלּוּ בַּמָּן","../halacha-quiz/lashon-06.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שְׁמִירַת הַלָּשׁוֹן","מִרְיָם וְהַפֶּה","","../halacha-quiz/lashon-07.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שְׁמִירַת הַלָּשׁוֹן","הַנּוֹצוֹת וְהַמִּלִּים","סִפּוּר עַל אֶלְחָנָן וְהַכָּרִית בַּשּׁוּק – לָמָּה אִי אֶפְשָׁר לֶאֱסֹף מִלִּים שֶׁיָּצְאוּ מֵהַפֶּה, וְאֵיךְ מְתַקְּנִים","../halacha-quiz/lashon-08.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שְׁמִירַת הַלָּשׁוֹן","פְּרָחִים אוֹ קוֹצִים?","מִלִּים שֶׁמְּשַׂמְּחוֹת וּמִלִּים שֶׁדּוֹקְרוֹת – אֵיךְ מַחֲלִיפִים קוֹץ בְּפֶרַח, וּמְדַבְּרִים עַל הַמַּעֲשֶׂה וְלֹא עַל הַיֶּלֶד","../halacha-quiz/lashon-09.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שְׁמִירַת הַלָּשׁוֹן","מִי נִפְגָּע?","","../halacha-quiz/lashon-10.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שְׁמִירַת הַלָּשׁוֹן","גַּם הַמְרַגְּלִים דִּבְּרוּ אֱמֶת","אֵיךְ דִּבּוּר שֶׁכֻּלּוֹ אֱמֶת יָכוֹל לִהְיוֹת דִּבַּת הָאָרֶץ, מָה הִפְרִיד בֵּין מֹשֶׁה לַמְרַגְּלִים, וְאֵיךְ מְסַפְּרִים אֶת אוֹתָהּ אֱמֶת בְּדֶרֶךְ שֶׁמְּקָרֶבֶת","../halacha-quiz/lashon-11.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שְׁמִירַת הַלָּשׁוֹן","אֵין כָּמוֹהָ","","../halacha-quiz/lashon-12.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שְׁמִירַת הַלָּשׁוֹן","סַנְחֵרִיב שֶׁלֹּא סִפֵּר בִּגְנוּתָהּ","לָמָּה זָכָה מֶלֶךְ רָשָׁע לְשֵׁם שֶׁל כָּבוֹד, מַה אָמְרוּ יִשְׂרָאֵל בַּגָּלוּת שֶׁנֶּחְשָׁב גְּנוּת, וְאֵיךְ גַּם אֲנִי יָכוֹל לִהְיוֹת ׳רַבָּא וִיקִירָא׳","../halacha-quiz/lashon-13.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שְׁמִירַת הַלָּשׁוֹן","אֶפְתַּח אֶת הָעַיִן הַטּוֹבָה","אֵיךְ אֶפְשָׁר לְאַמֵּן עַיִן טוֹבָה וְאֹזֶן טוֹבָה, מַה לָּמַדְנוּ מֵהָאַמְרֵי אֱמֶת וּמִשְּׁלִיחִים שֶׁלֹּא הִתְאִימוּ, וְאֵיךְ אֲנִי שָׁלִיחַ שֶׁל הָאָרֶץ","../halacha-quiz/lashon-14.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שְׁמִירַת הַלָּשׁוֹן","לִמְחֹק אֶת הַמִּלִּים","לָמָּה צִוָּה הָאַבִּיר יַעֲקֹב מִסָּדִיגּוּרָא לִמְחֹק מִשְׁפָּט מִמִּכְתָּב בַּקָּשָׁה, וְאֵיךְ מְבַקְּשִׁים עֶזְרָה בְּלִי לְדַבֵּר רַע עַל הָאָרֶץ","../halacha-quiz/lashon-15.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שְׁמִירַת הַלָּשׁוֹן","דִּבּוּרִים כָּאֵלֶּה תָּבִיא לִי","מָה קָרָה לַחֲסִיד שֶׁאָמַר ׳הַלְוַאי שֶׁכָּךְ בְּכָל אֶרֶץ יִשְׂרָאֵל׳, וְלָמָּה פְּנֵי הָרַבִּי מִבֶּעלְז צָהֲלוּ בְּעֶרֶב יוֹם כִּפּוּר","../halacha-quiz/lashon-16.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שְׁמִירַת הַלָּשׁוֹן","שֶׁלֹּא לְהוֹצִיא לַעַז עַל הָאָרֶץ","אֵיךְ חָזַר רַבִּי יַעֲקֹב שִׁמְשׁוֹן מִשְּׁפִּיטְבְּקָה מֵאֶרֶץ יִשְׂרָאֵל בְּפָנִים טוֹבוֹת, וּמָה לָמַדְנוּ מִמֶּנּוּ וּמֵרַבָּנִים נוֹסָפִים עַל שֵׁם טוֹב לָאָרֶץ","../halacha-quiz/lashon-17.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שְׁמִירַת הַלָּשׁוֹן","הַנְּצִי״ב וְהַסְּטָטִיסְטִיקָה","מָה עָנָה הַנְּצִי״ב מִוָּלוֹזִ׳ין לְמִי שֶׁהֵבִיא מִסְפָּרִים וְחִשּׁוּבִים נֶגֶד אֶרֶץ יִשְׂרָאֵל, וְאֵיךְ אֶפְשָׁר לָדַעַת עוּבְדּוֹת וְגַם לְהַאֲמִין שֶׁטּוֹבָה הָאָרֶץ","../halacha-quiz/lashon-18.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – עֲנָוָה וְנַחַת","מַהִי עֲנָוָה?","","../halacha-quiz/nefesh-01.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – עֲנָוָה וְנַחַת","שְׁמוּאֵל הַקָּטָן","","../halacha-quiz/nefesh-02.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – עֲנָוָה וְנַחַת","הַשֶּׁמֶשׁ וְהַיָּרֵחַ","","../halacha-quiz/nefesh-03.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – עֲנָוָה וְנַחַת","הַבִּימָה שֶׁל לֵוִי בַּר סִיסִי","תַּלְמִיד חָכָם גָּדוֹל שֶׁיָּשַׁב עַל בִּימָה גְּבוֹהָה, שָׁכַח אֶת תַּלְמוּדוֹ, וְלָמַד שֶׁהַתּוֹרָה נִשְׁאֶרֶת בְּלֵב עָנָו","../halacha-quiz/nefesh-04.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – עֲנָוָה וְנַחַת","הִשָּׁמֶר לְךָ פֶּן תִּשְׁכַּח","לָמָּה גַּאֲוָה הִיא שִׁכְחָה, וְאֵיךְ הַתּוֹדָה שֶׁל בִּרְכַּת הַמָּזוֹן מַצִּילָה אוֹתָנוּ","../halacha-quiz/nefesh-05.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – עֲנָוָה וְנַחַת","אַרְבַּע מֵאוֹת זוּז שֶׁל סַבְלָנוּת","הִלֵּל שֶׁלֹּא כָּעַס, וְאֵיךְ נִשְׁאָרִים רְגוּעִים גַּם כְּשֶׁמַּרְגִּיזִים אוֹתָנוּ","../halacha-quiz/nefesh-06.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – עֲנָוָה וְנַחַת","שַׁמַּאי וְהִלֵּל וְהַגֵּרִים","שְׁלוֹשָׁה גֵּרִים, שְׁתֵּי דְּרָכִים, וּמָה לָמַדְנוּ מִ׳עַנְוְתָן כְּהִלֵּל׳","../halacha-quiz/nefesh-07.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – עֲנָוָה וְנַחַת","כַּעַס שֶׁמַּשְׁכִּיחַ","","../halacha-quiz/nefesh-08.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – עֲנָוָה וְנַחַת","לְדַבֵּר בְּנַחַת","","../halacha-quiz/nefesh-09.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – עֲנָוָה וְנַחַת","הָאוֹת א׳ וְהַסַּבְלָנוּת","רַבִּי יִצְחָק מִוּוּרְקִי מְלַמֵּד יֶלֶד אֶת הָאוֹת הָרִאשׁוֹנָה, וְלוֹמֵד מַהִי סַבְלָנוּת, אֹרֶךְ אַפַּיִם וְאֵיךְ אֶפְשָׁר לִקְנוֹת אוֹתָהּ","../halacha-quiz/nefesh-10.html"],["mekor","שַׁעַר רִאשׁוֹן – הַשְׁכָּמַת הַבֹּקֶר","הַשְׁכָּמַת הַבֹּקֶר","","../mekor-haim-quiz/mekorhaim-01.html"],["mekor","שַׁעַר רִאשׁוֹן – הַשְׁכָּמַת הַבֹּקֶר","חִידוֹן מְקוֹר חַיִּים – בִּרְכַּת אֲשֶׁר יָצַר וּבִרְכוֹת הַתּוֹרָה","פרקים ג-ד","../mekor-haim-quiz/mekorhaim-02.html"],["mekor","שַׁעַר רִאשׁוֹן – הַשְׁכָּמַת הַבֹּקֶר","בִּרְכוֹת הַשַּׁחַר","","../mekor-haim-quiz/mekorhaim-03.html"],["mekor","שַׁעַר רִאשׁוֹן – הַשְׁכָּמַת הַבֹּקֶר","הַשְׁכָּמַת בֵּית הַכְּנֶסֶת וּקְדֻשָּׁתוֹ","פרק ו","../mekor-haim-quiz/mekorhaim-04.html"],["mekor","שַׁעַר רִאשׁוֹן – הַשְׁכָּמ const CM={};COLS.forEach(c=>CM[c.k]=c);
const $=s=>document.querySelector(s), main=$("#main"), q=$("#q");
const norm=s=>(s||"").replace(/[\u0591-\u05C7]/g,"").replace(/[״"׳']/g,"").toLowerCase();
ITEMS.forEach(it=>it.s=norm(it[1]+" "+it[2]+" "+it[3]+" "+CM[it[0]].t));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let cur="", limit=120;

function chips(){
  $("#chips").innerHTML='<button class="chip" data-k="" aria-pressed="'+(!cur)+'">🎲 כל הסדרות</button>'+
    COLS.map(c=>'<button class="chip" style="--c:'+c.c+'" data-k="'+c.k+'" aria-pressed="'+(cur===c.k)+'">'+c.e+' '+esc(c.t)+'</button>').join("");
}
function card(it){
  const c=CM[it[0]];
  return '<a class="card" style="--c:'+c.c+'" href="'+esc(it[4])+'">'+
    '<span class="tag">'+c.e+' '+esc(c.t)+(it[1]?' · '+esc(it[1]):'')+'</span>'+
    '<b>'+esc(it[2])+'</b>'+(it[3]?'<small>'+esc(it[3])+'</small>':'')+'<span class="go">לשחק ◀</span></a>';
}
function render(){
  const term=norm(q.value.trim());
  $("#clear").hidden=!q.value;
  chips();
  if(!cur && !term){
    main.innerHTML='<div class="cols">'+COLS.map(c=>'<button class="col'+(c.i?' pic':'')+'" style="--c:'+c.c+'" data-k="'+c.k+'">'+
      (c.i?'<img class="pimg" src="'+c.i+'" alt="" loading="lazy">':'')+'<span class="ic">'+c.e+'</span><h2>'+esc(c.t)+'</h2><p>'+esc(c.d)+'</p><span class="n">'+c.n+(c.n===1?' משחק':' חידונים ומשחקים')+'</span></button>').join("")+'</div>';
    return;
  }
  const words=term.split(/\s+/).filter(Boolean);
  const list=ITEMS.filter(it=>(!cur||it[0]===cur)&&words.every(w=>it.s.includes(w)));
  let h="";
  if(cur){const c=CM[cur];
    h+='<div class="head" style="--c:'+c.c+'"><button class="back" data-k="">→ כל הסדרות</button><h2>'+c.e+' '+esc(c.t)+'</h2>'+
      (c.h?'<a class="home" href="'+c.h+'">לדף הסדרה ולוח המצטיינים ◀</a>':'')+'</div>';}
  if(term) h+='<div class="head"><h2 style="font-size:20px">'+list.length+' תוצאות</h2></div>';
  if(!list.length){main.innerHTML=h+'<p class="empty">לא נמצא חידון כזה. נסו מילה אחרת.</p>';return;}
  let last=null;const shown=list.slice(0,limit);let grid="";
  shown.forEach(it=>{
    const g=cur?it[1]:CM[it[0]].t;
    if(g!==last){ if(last!==null) grid+='</div>'; grid+=(g?'<h3 class="grp">'+esc(g)+'</h3>':'')+'<div class="grid">'; last=g; }
    grid+=card(it);
  });
  grid+='</div>';
  if(list.length>limit) grid+='<button class="more" id="more">להציג עוד ('+(list.length-limit)+')</button>';
  main.innerHTML=h+grid;
}
function pick(k){cur=k;limit=120;render();window.scrollTo({top:0});try{history.replaceState(null,"",k?"#"+k:location.pathname)}catch(e){}}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-k]"); if(b){pick(b.dataset.k);return;}
  if(e.target.id==="more"){limit+=240;render();}
  if(e.target.id==="clear"){q.value="";render();q.focus();}
});
let tm;q.addEventListener("input",()=>{clearTimeout(tm);tm=setTimeout(()=>{limit=120;render()},120)});
const h0=decodeURIComponent(location.hash.slice(1)); if(CM[h0]) cur=h0;
render();
</script>
