<style>

:root[data-theme="dark"]{--bg:#15131d;--paper:#211e2c;--ink:#f2eefa;--muted:#b6aec8;--line:#363146;--bar:#0f0d16;--shadow:rgba(0,0,0,.45)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Heebo,Arial,sans-serif}
a{color:inherit}
.top{background:var(--bar);color:var(--bar-ink)}
.top .in{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:22px;color:#fff;
  background:linear-gradient(135deg,#7c3aed,#f59e0b)}
.brand b{display:block;font-size:19px}.brand small{display:block;font-size:12px;opacity:.75}
.top nav{margin-inline-start:auto;display:flex;gap:16px;font-size:15px}
.top nav a{text-decoration:none;opacity:.9}.top nav a:hover{opacity:1;text-decoration:underline}
.top nav .gold{color:var(--gold);font-weight:700}
.hero{max-width:1200px;margin:0 auto;padding:28px 16px 6px;text-align:center}
.hero h1{margin:0;font-size:clamp(30px,5vw,46px);font-weight:900;line-height:1.15}
.hero h1 span{background:linear-gradient(90deg,#7c3aed,#db2777,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:8px auto 0;max-width:680px;color:var(--muted);font-size:17px}
.tools{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 16px;max-width:1200px;margin:0 auto}
.search{display:flex;gap:8px;align-items:center}
.search input{flex:1;min-width:0;font:inherit;font-size:17px;padding:12px 16px;border-radius:14px;border:2px solid var(--line);
  background:var(--paper);color:var(--ink);outline:none}
.search input:focus{border-color:#7c3aed}
.search button{font:inherit;font-weight:700;padding:11px 16px;border-radius:14px;border:2px solid var(--line);background:var(--paper);
  color:var(--ink);cursor:pointer;white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:thin}
.chip{flex:none;font:inherit;font-size:14px;font-weight:700;padding:6px 12px;border-radius:999px;border:2px solid var(--line);
  background:var(--paper);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--c,#7c3aed);border-color:var(--c,#7c3aed);color:#fff}
main{max-width:1200px;margin:0 auto;padding:6px 16px 40px}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:8px}
.col{position:relative;display:flex;flex-direction:column;gap:6px;padding:18px 18px 16px;border-radius:20px;background:var(--paper);
  border:1px solid var(--line);box-shadow:0 4px 16px var(--shadow);cursor:pointer;text-align:start;font:inherit;color:inherit;overflow:hidden;
  transition:transform .15s,box-shadow .15s}
.col:before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--c)}
.col:hover,.col:focus-visible{transform:translateY(-3px);box-shadow:0 10px 26px var(--shadow)}
.col.pic{padding-top:0}
.col .pimg{display:block;margin:0 -18px 8px;width:calc(100% + 36px);aspect-ratio:3/2;object-fit:cover;background:color-mix(in srgb,var(--c) 18%,#fff)}
.col.pic:before{z-index:1}
.col.pic .ic{position:absolute;top:14px;left:14px;width:44px;height:44px;font-size:24px;background:var(--paper);box-shadow:0 2px 8px var(--shadow)}
.col.pic h2{margin-top:6px}
.herobox{max-width:1200px;margin:14px auto 0;padding:0 16px}
.herobox img{display:block;width:100%;height:auto;aspect-ratio:1200/380;object-fit:cover;object-position:center;border-radius:24px;box-shadow:0 8px 28px var(--shadow)}

.tcard:before{content:"";position:absolute;inset:auto -30px -40px auto;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.16)}
.tcard .ti{font-size:40px;line-height:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.2))}
.tcard b{font-size:19px;margin-top:6px;text-shadow:0 1px 3px rgba(0,0,0,.25);line-height:1.3}
.tcard .tn{margin-top:auto;padding-top:10px;align-self:flex-start;background:rgba(255,255,255,.25);border-radius:999px;padding:2px 10px;font-weight:800;font-size:14px}
.tsub{margin:16px 0 0;font-size:20px;font-weight:900}

.grp{margin:22px 0 10px;font-size:19px;font-weight:800;display:flex;align-items:center;gap:8px}
.grp:after{content:"";flex:1;height:2px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:4px;padding:14px 14px 12px;border-radius:16px;background:var(--paper);text-decoration:none;
  border:1px solid var(--line);border-inline-start:5px solid var(--c);box-shadow:0 2px 8px var(--shadow);transition:transform .12s,box-shadow .12s}
.card:hover,.card:focus-visible{transform:translateY(-2px);box-shadow:0 8px 20px var(--shadow)}
.card .shot{display:block;margin:-14px -14px 6px;width:calc(100% + 28px);aspect-ratio:3/2;object-fit:cover;border-radius:16px 16px 0 0;background:color-mix(in srgb,var(--c) 15%,#fff)}
.card .tag{font-size:12px;font-weight:700;color:var(--c)}
.card b{font-size:16.5px;line-height:1.35}
.card small{color:var(--muted);font-size:13.5px;line-height:1.4}
.card .go{margin-top:auto;padding-top:6px;font-size:13px;font-weight:800;color:var(--c)}
.empty{text-align:center;color:var(--muted);padding:40px 0;font-size:18px}
.more{display:block;margin:18px auto 0;font:inherit;font-weight:800;padding:10px 22px;border-radius:14px;border:2px solid var(--line);
  background:var(--paper);color:var(--ink);cursor:pointer}
.sig{max-width:1200px;margin:10px auto 0;padding:0 16px 30px;text-align:center;color:var(--muted);font-size:14px}
.sig a{color:#7c3aed;font-weight:700}
@media (max-width:640px){.top nav{width:100%;margin:0;justify-content:space-between}.grid{grid-template-columns:1fr}.cols{grid-template-columns:1fr}}

ּזָה – שְׁמַע יִשְׂרָאֵל בַּפֶּתַח","אֵיפֹה קוֹבְעִים, בְּאֵיזֶה צַד וּבְאֵיזֶה גֹּבַהּ, מָה מְבָרְכִים, וּמָתַי בּוֹדְקִים","../halacha-quiz/mitzvot-04.html","s-halacha-quiz_mitzvot-04"],["halacha","🧵 צִיצִית, תְּפִלִּין וּמְזוּזָה","מוּשָּׂגִים וּלְשׁוֹן חֲכָמִים – צִיצִית, תְּפִלִּין וּמְזוּזָה","מָה פֵּרוּשׁ הַמִּלִּים וְהַמּוּשָּׂגִים שֶׁל הִלְכוֹת כִּפָּה, צִיצִית, תְּפִלִּין וּמְזוּזָה","../halacha-quiz/mitzvot-mk.html","s-halacha-quiz_mitzvot-mk"],["halacha","🕯️ הִלְכוֹת שַׁבָּת","הַשַּׁבָּת – מַתָּנָה שֶׁל אַהֲבָה","עֵרֶךְ הַשַּׁבָּת, הַהֲכָנוֹת לְשַׁבָּת, וּזְמַנֵּי כְּנִיסָתָהּ וִיצִיאָתָהּ","../halacha-quiz/shabbat-01.html","s-halacha-quiz_shabbat-01"],["halacha","🕯️ הִלְכוֹת שַׁבָּת","נֵרוֹת שֶׁל שָׁלוֹם וְיוֹם שֶׁל תּוֹרָה","הַדְלָקַת נֵרוֹת שַׁבָּת, לִמּוּד תּוֹרָה, קְרִיאַת הַתּוֹרָה וּתְפִלּוֹת הַשַּׁבָּת","../halacha-quiz/shabbat-02.html","s-halacha-quiz_shabbat-02"],["halacha","🕯️ הִלְכוֹת שַׁבָּת","קִדּוּשׁ וּסְעוּדוֹת שֶׁל עֹנֶג","הִלְכוֹת קִדּוּשׁ, כּוֹס שֶׁל בְּרָכָה, שָׁלֹשׁ סְעוּדוֹת, לֶחֶם מִשְׁנֶה וּמְלַוֶּה מַלְכָּה","../halacha-quiz/shabbat-03.html","s-halacha-quiz_shabbat-03"],["halacha","🕯️ הִלְכוֹת שַׁבָּת","הַבְדָּלָה וּמְלֶאכֶת מַחֲשֶׁבֶת","הַבְדָּלָה וּמוֹצָאֵי שַׁבָּת, ל״ט הַמְּלָאכוֹת וּכְלָלֵי הַמְּלָאכוֹת","../halacha-quiz/shabbat-04.html","s-halacha-quiz_shabbat-04"],["halacha","🕯️ הִלְכוֹת שַׁבָּת","אֹכֶל חַם וְחַמִּין שֶׁל שַׁבָּת","מְלֶאכֶת בִּשּׁוּל: חִמּוּם אֹכֶל, פְּלָטָה, כְּלִי רִאשׁוֹן, שֵׁנִי וּשְׁלִישִׁי, וְהַטְמָנָה","../halacha-quiz/shabbat-05.html","s-halacha-quiz_shabbat-05"],["halacha","🕯️ הִלְכוֹת שַׁבָּת","בּוֹרְרִים אֶת הַטּוֹב","בּוֹרֵר, דָּשׁ, טוֹחֵן, לָשׁ וְסוֹחֵט – הֲכָנַת אֹכֶל בְּשַׁבָּת","../halacha-quiz/shabbat-06.html","s-halacha-quiz_shabbat-06"],["halacha","🕯️ הִלְכוֹת שַׁבָּת","בֶּגֶד, גּוּף וּבַיִת בְּשַׁבָּת","כִּבּוּס, תְּפִירָה וּקְשָׁרִים, הַטִּפּוּל בַּגּוּף, בּוֹנֶה וְסוֹתֵר בַּבַּיִת וּבַכֵּלִים","../halacha-quiz/shabbat-07.html","s-halacha-quiz_shabbat-07"],["halacha","🕯️ הִלְכוֹת שַׁבָּת","אוֹר, אֵשׁ וְאוֹתִיּוֹת בְּשַׁבָּת","מַבְעִיר וּמְכַבֶּה, חַשְׁמַל וּמַכְשִׁירָיו, כּוֹתֵב, מוֹחֵק וְצוֹבֵעַ","../halacha-quiz/shabbat-08.html","s-halacha-quiz_shabbat-08"],["halacha","🕯️ הִלְכוֹת שַׁבָּת","הַגִּנָּה, הַחַיּוֹת וְהָרְחוֹב","מְלָאכוֹת שֶׁבַּצּוֹמֵחַ, בַּעֲלֵי חַיִּים בְּשַׁבָּת וְהִלְכוֹת הוֹצָאָה","../halacha-quiz/shabbat-09.html","s-halacha-quiz_shabbat-09"],["halacha","🕯️ הִלְכוֹת שַׁבָּת","יוֹם שֶׁל מְנוּחָה וּקְדֻשָּׁה","צִבְיוֹן הַשַּׁבָּת – הֲלִיכָה, דִּבּוּר, מִשְׂחָקִים וְקִנְיָה – וְהִלְכוֹת מֻקְצֶה","../halacha-quiz/shabbat-10.html","s-halacha-quiz_shabbat-10"],["halacha","🕯️ הִלְכוֹת שַׁבָּת","יְלָדִים שׁוֹמְרֵי שַׁבָּת","דִּינֵי קָטָן וּמִשְׂחֲקֵי שַׁבָּת, מְלֶאכֶת גּוֹי, מַעֲשֵׂה שַׁבָּת וְלִפְנֵי עִוֵּר","../halacha-quiz/shabbat-11.html","s-halacha-quiz_shabbat-11"],["halacha","🕯️ הִלְכוֹת שַׁבָּת","וָחַי בָּהֶם","וָחַי בָּהֶם","../halacha-quiz/shabbat-12.html","s-halacha-quiz_shabbat-12"],["halacha","🕯️ הִלְכוֹת שַׁבָּת","מוּשָּׂגִים וּלְשׁוֹן חֲכָמִים – הִלְכוֹת שַׁבָּת","מָה פֵּרוּשׁ הַמִּלִּים וְהַמּוּשָּׂגִים שֶׁפּוֹגְשִׁים בְּכָל הִלְכוֹת הַשַּׁבָּת, מִכְּנִיסָתָהּ עַד תְּחוּמֶיהָ","../halacha-quiz/shabbat-mk.html","s-halacha-quiz_shabbat-mk"],["halacha","🤝 בֵּין אָדָם לַחֲבֵרוֹ","וְאָהַבְתָּ לְרֵעֲךָ כָּמוֹךָ","לֹא שׂוֹנְאִים וְלֹא נוֹקְמִים, דָּנִים לְכַף זְכוּת, שׁוֹמְרִים אֶת הַלָּשׁוֹן וְלֹא מַעֲלִיבִים","../halacha-quiz/chavero-01.html","s-halacha-quiz_chavero-01"],["halacha","🤝 בֵּין אָדָם לַחֲבֵרוֹ","אֱמֶת וְיֹשֶׁר","אֱמֶת וְיֹשֶׁר","../halacha-quiz/chavero-02.html","s-halacha-quiz_chavero-02"],["halacha","🤝 בֵּין אָדָם לַחֲבֵרוֹ","לֹא תִּגְנֹבוּ","לֹא תִּגְנֹבוּ","../halacha-quiz/chavero-03.html","s-halacha-quiz_chavero-03"],["halacha","🤝 בֵּין אָדָם לַחֲבֵרוֹ","מַלְוִים וְנוֹתְנִים","מִצְוַת הַהַלְוָאָה, צְדָקָה וּמַעֲשֵׂר מִדְּמֵי הַכִּיס","../halacha-quiz/chavero-04.html","s-halacha-quiz_chavero-04"],["halacha","🤝 בֵּין אָדָם לַחֲבֵרוֹ","אוֹרְחִים וַחֲבֵרִים","הַכְנָסַת אוֹרְחִים, חֶבְרָה טוֹבָה וְהַשְׁפָּעָה בְּא ה, שְׁמִינִי עֲצֶרֶת, שִׂמְחַת תּוֹרָה וּמִצְוַת הַקְהֵל","../halacha-quiz/sukkot-04.html","s-halacha-quiz_sukkot-04"],["halacha","🌿 הִלְכוֹת סֻכּוֹת","מוּשָּׂגִים וּלְשׁוֹן חֲכָמִים – הִלְכוֹת סֻכּוֹת","מָה פֵּרוּשׁ הַמִּלִּים וְהַמּוּשָּׂגִים שֶׁפּוֹגְשִׁים בְּכָל הִלְכוֹת הַסֻּכָּה וְאַרְבַּעַת הַמִּינִים","../halacha-quiz/sukkot-mk.html","s-halacha-quiz_sukkot-mk"],["halacha","🕎 הִלְכוֹת חֲנֻכָּה","נֵס פַּךְ הַשֶּׁמֶן","נֵס פַּךְ הַשֶּׁמֶן","../halacha-quiz/chanuka-01.html","s-halacha-quiz_chanuka-01"],["halacha","🕎 הִלְכוֹת חֲנֻכָּה","מַדְלִיקִים נֵר חֲנֻכָּה","מְהַדְּרִין מִן הַמְּהַדְּרִין, מִי מַדְלִיק, הַבְּרָכוֹת, הַנֵּרוֹת, הַחֲנֻכִּיָּה וְהַשַּׁמָּשׁ, וְהַדְלָקָה בְּבֵית הַכְּנֶסֶת","../halacha-quiz/chanuka-02.html","s-halacha-quiz_chanuka-02"],["halacha","🕎 הִלְכוֹת חֲנֻכָּה","אֵיפֹה וּמָתַי מַדְלִיקִים","פִּרְסוּם הַנֵּס: פֶּתַח, חַלּוֹן וּמִרְפֶּסֶת, זְמַן הַהַדְלָקָה, שַׁבַּת חֲנֻכָּה, אוֹרְחִים, יְשִׁיבָה, מָלוֹן וְטִיּוּל","../halacha-quiz/chanuka-03.html","s-halacha-quiz_chanuka-03"],["halacha","🕎 הִלְכוֹת חֲנֻכָּה","מוּשָּׂגִים וּלְשׁוֹן חֲכָמִים – הִלְכוֹת חֲנֻכָּה","מָה פֵּרוּשׁ הַמִּלִּים וְהַמּוּשָּׂגִים שֶׁפּוֹגְשִׁים בְּהִלְכוֹת חֲנֻכָּה","../halacha-quiz/chanuka-mk.html","s-halacha-quiz_chanuka-mk"],["halacha","🎭 הִלְכוֹת פּוּרִים","מִשֶּׁנִּכְנַס אֲדָר מַרְבִּים בְּשִׂמְחָה","חֹדֶשׁ אֲדָר, אַרְבַּע הַפָּרָשִׁיּוֹת, זְכִירַת עֲמָלֵק, תַּעֲנִית אֶסְתֵּר, מַחֲצִית הַשֶּׁקֶל וְנֵס פּוּרִים","../halacha-quiz/purim-01.html","s-halacha-quiz_purim-01"],["halacha","🎭 הִלְכוֹת פּוּרִים","מִקְרָא מְגִלָּה","מִקְרָא מְגִלָּה","../halacha-quiz/purim-02.html","s-halacha-quiz_purim-02"],["halacha","🎭 הִלְכוֹת פּוּרִים","שִׂמְחָה, חֶסֶד וִירוּשָׁלַיִם","מִשְׁלוֹחַ מָנוֹת, מַתָּנוֹת לָאֶבְיוֹנִים, סְעוּדַת פּוּרִים, תַּחְפֹּשׂוֹת, פְּרָזִים וּמֻקָּפִים וּפוּרִים הַמְשֻׁלָּשׁ","../halacha-quiz/purim-03.html","s-halacha-quiz_purim-03"],["halacha","🎭 הִלְכוֹת פּוּרִים","מוּשָּׂגִים וּלְשׁוֹן חֲכָמִים – הִלְכוֹת פּוּרִים","מָה פֵּרוּשׁ הַמִּלִּים וְהַמּוּשָּׂגִים שֶׁפּוֹגְשִׁים בְּהִלְכוֹת פּוּרִים","../halacha-quiz/purim-mk.html","s-halacha-quiz_purim-mk"],["halacha","🍷 הִלְכוֹת פֶּסַח","חָמֵץ וּמַצָּה – מָה הַסּוֹד?","מַשְׁמָעוּת חַג הַפֶּסַח, מָה הוּא חָמֵץ, זְמַנֵּי הָאִסּוּר וְחָמֵץ שֶׁל גּוֹי","../halacha-quiz/pesach-01.html","s-halacha-quiz_pesach-01"],["halacha","🍷 הִלְכוֹת פֶּסַח","מְחַפְּשִׂים וּמְבַעֲרִים","בְּדִיקַת חָמֵץ, בִּטּוּל חָמֵץ וּשְׂרֵפַת חָמֵץ","../halacha-quiz/pesach-02.html","s-halacha-quiz_pesach-02"],["halacha","🍷 הִלְכוֹת פֶּסַח","מְכִירַת חָמֵץ, כַּשְׁרוּת וְקִטְנִיּוֹת","מְכִירַת חָמֵץ לְגוֹי, מוּצָרִים כְּשֵׁרִים לְפֶסַח, תְּרוּפוֹת וּמִנְהַג הַקִּטְנִיּוֹת","../halacha-quiz/pesach-03.html","s-halacha-quiz_pesach-03"],["halacha","🍷 הִלְכוֹת פֶּסַח","מַצָּה שְׁמוּרָה וְעֶרֶב פֶּסַח","הִלְכוֹת מַצָּה, מְלָאכָה וַאֲכִילָה בְּעֶרֶב פֶּסַח, תַּעֲנִית בְּכוֹרוֹת וְעֶרֶב פֶּסַח שֶׁחָל בְּשַׁבָּת","../halacha-quiz/pesach-04.html","s-halacha-quiz_pesach-04"],["halacha","🍷 הִלְכוֹת פֶּסַח","וְהִגַּדְתָּ לְבִנְךָ","וְהִגַּדְתָּ לְבִנְךָ","../halacha-quiz/pesach-05.html","s-halacha-quiz_pesach-05"],["halacha","🍷 הִלְכוֹת פֶּסַח","מִמַּצָּה וּמָרוֹר עַד נִרְצָה","הֲסִבָּה, מוֹצִיא מַצָּה, מָרוֹר, כּוֹרֵךְ, שֻׁלְחָן עוֹרֵךְ, צָפוּן, בָּרֵךְ, הַלֵּל וְנִרְצָה","../halacha-quiz/pesach-06.html","s-halacha-quiz_pesach-06"],["halacha","🍷 הִלְכוֹת פֶּסַח","מוּשָּׂגִים וּלְשׁוֹן חֲכָמִים – הִלְכוֹת פֶּסַח","מָה פֵּרוּשׁ הַמִּלִּים וְהַמּוּשָּׂגִים שֶׁפּוֹגְשִׁים בְּכָל הִלְכוֹת הַפֶּסַח וְלֵיל הַסֵּדֶר","../halacha-quiz/pesach-mk.html","s-halacha-quiz_pesach-mk"],["halacha","📅 רֹאשׁ חֹדֶשׁ, סְפִירַת הָעֹמֶר וְהַצּוֹמוֹת","רֹאשׁ חֹדֶשׁ וְקִדּוּשׁ לְבָנָה","הַחֹדֶשׁ הָעִבְרִי, סְעוּדַת רֹאשׁ חֹדֶשׁ, יַעֲלֶה וְיָבוֹא, הַלֵּל, מוּסָף וּבִרְכַּת הַלְּבָנָה","../halacha-quiz/zmanim-01.html","s-halacha-quiz_zmanim-01"],["halacha","📅 רֹאשׁ חֹדֶשׁ, סְפִירַת הָעֹמֶר וְהַצּוֹמוֹת","סְפִירַת הָעֹמֶר וְל״ג בָּעֹמֶר","מִצְוַת הַסְּפִירָה, מִנְהֲגֵי הָאֲבֵלוּת, רַבִּי עֲקִיבָא וְרַבִּי שִׁמְעוֹן בַּר יוֹחָאי","../halacha-quiz/zmanim-02.html","s-halacha-quiz_zmanim-02"],["halacha","📅 רֹאשׁ חֹדֶשׁ, סְפִירַת הָעֹמֶר וְהַצּוֹמוֹת","הַצּוֹמוֹת וּשְׁלֹשֶׁת הַשָּׁבוּעוֹת","עֲשָׂרָה בְּטֵבֵת, י״ז בְּתַמּוּז וְצוֹם גְּדַלְיָה, דִּינֵי הַצּוֹמוֹת, בֵּין הַמְּצָרִים וְתִשְׁעַת הַיָּמִים","../halacha-quiz/zmanim-03.html","s-halacha-quiz_zmanim-03"],["halacha","📅 רֹאשׁ חֹדֶשׁ, סְפִירַת הָעֹמֶר וְהַצּוֹמוֹת","עֶרֶב תִּשְׁעָה בְּאָב וְתִשְׁעָה בְּאָב","הַסְּעוּדָה הַמַּפְסֶקֶת, חֲמִשָּׁה עִנּוּיִים, אֵיכָה וְקִינוֹת, מִנְהֲגֵי אֲבֵלוּת וִילָדִים בְּתִשְׁעָה בְּאָב","../halacha-quiz/zmanim-04.html","s-halacha-quiz_zmanim-04"],["halacha","📅 רֹאשׁ חֹדֶשׁ, סְפִירַת הָעֹמֶר וְהַצּוֹמוֹת","מוּשָּׂגִים וּלְשׁוֹן חֲכָמִים – רֹאשׁ חֹדֶשׁ, סְפִירַת הָעֹמֶר וְהַצּוֹמוֹת","מָה פֵּרוּשׁ הַמּוּשָּׂגִים וְהַמִּלִּים שֶׁפּוֹגְשִׁים בְּרֹאשׁ חֹדֶשׁ, בִּסְפִירַת הָעֹמֶר וּבְצוֹמוֹת הַשָּׁנָה","../halacha-quiz/zmanim-mk.html","s-halacha-quiz_zmanim-mk"],["halacha","👨‍👩‍👧 כִּבּוּד הוֹרִים וּמִשְׁפָּחָה","כַּבֵּד אֶת אָבִיךָ וְאֶת אִמֶּךָ","כִּבּוּד וּמוֹרָא, הַמָּקוֹם שֶׁל הַהוֹרִים, קִימָה, שְׁמוֹתֵיהֶם וּשְׁנָתָם","../halacha-quiz/mishpacha-01.html","s-halacha-quiz_mishpacha-01"],["halacha","👨‍👩‍👧 כִּבּוּד הוֹרִים וּמִשְׁפָּחָה","עוֹזְרִים בְּסֵבֶר פָּנִים יָפוֹת","עֶזְרָה בַּבַּיִת, שְׁלִיחֻיּוֹת, הוֹרִים זְקֵנִים, שְׂכַר הַמִּצְוָה, שְׁתִיקָה וּמְחִילָה","../halacha-quiz/mishpacha-02.html","s-halacha-quiz_mishpacha-02"],["halacha","👨‍👩‍👧 כִּבּוּד הוֹרִים וּמִשְׁפָּחָה","לִשְׁמֹעַ בְּקוֹלָם – וּלְכַבֵּד אֶת כָּל הַמִּשְׁפָּחָה","כָּבוֹד בַּלֵּב וְכַף זְכוּת, כִּבּוּד הוֹרִים וּשְׁמִירַת מִצְווֹת, שְׁמִיעָה בְּקוֹלָם, סָבִים וְאַחִים גְּדוֹלִים","../halacha-quiz/mishpacha-03.html","s-halacha-quiz_mishpacha-03"],["halacha","👨‍👩‍👧 כִּבּוּד הוֹרִים וּמִשְׁפָּחָה","בְּרִית מִילָה וּפִדְיוֹן הַבֵּן","הַמִּצְוָה הָרִאשׁוֹנָה, הַיּוֹם הַשְּׁמִינִי, מִנְהֲגֵי הַבְּרִית וְהַכִּבּוּדִים, וּפִדְיוֹן הַבְּכוֹר אֵצֶל הַכֹּהֵן","../halacha-quiz/mishpacha-04.html","s-halacha-quiz_mishpacha-04"],["halacha","👨‍👩‍👧 כִּבּוּד הוֹרִים וּמִשְׁפָּחָה","נִחוּם אֲבֵלִים וְעִלּוּי נְשָׁמָה","בָּרוּךְ דַּיַּן הָאֱמֶת, אֵיךְ מְנַחֲמִים בְּבֵית הָאֲבֵלִים, קַדִּישׁ, צְדָקָה וּמַעֲשִׂים טוֹבִים לְעִלּוּי הַנְּשָׁמָה, וְיוֹם הַשָּׁנָה","../halacha-quiz/mishpacha-05.html","s-halacha-quiz_mishpacha-05"],["halacha","👨‍👩‍👧 כִּבּוּד הוֹרִים וּמִשְׁפָּחָה","מוּשָּׂגִים וּלְשׁוֹן חֲכָמִים – כִּבּוּד הוֹרִים וּמִשְׁפָּחָה","מָה פֵּרוּשׁ הַמִּלִּים וְהַמּוּשָּׂגִים שֶׁל כִּבּוּד הוֹרִים, בְּרִית מִילָה, פִּדְיוֹן הַבֵּן וְנִחוּם אֲבֵלִים","../halacha-quiz/mishpacha-mk.html","s-halacha-quiz_mishpacha-mk"],["halacha","🌷 הִלְכוֹת צְנִיעוּת","עוֹלָמָהּ שֶׁל הַצְּנִיעוּת","שׁוֹאֲפוֹת לִשְׁלֵמוּת, וּמְקַיְּמוֹת גַּם כְּשֶׁלֹּא מְבִינוֹת","../halacha-quiz/tzniut-01.html","s-halacha-quiz_tzniut-01"],["halacha","🌷 הִלְכוֹת צְנִיעוּת","פְּנִימִיּוּת וְכָבוֹד","לָמָּה חָשׁוּב לְהִתְלַבֵּשׁ בִּצְנִיעוּת – בִּשְׁבִילֵנוּ, וְ״עִם אֱ־לֹהֶיךָ״","../halacha-quiz/tzniut-02.html","s-halacha-quiz_tzniut-02"],["halacha","🌷 הִלְכוֹת צְנִיעוּת","כֹּחָהּ שֶׁל הִתְמוֹדְדוּת","כָּל הִתְגַּבְּרוּת חֲשׁוּבָה, צַעַד אַחַר צַעַד – וְשִׂמְחָה לִהְיוֹת עַבְדֵי ה׳","../halacha-quiz/tzniut-03.html","s-halacha-quiz_tzniut-03"],["halacha","🌷 הִלְכוֹת צְנִיעוּת","לְבוּשׁ צָנוּעַ – חֲצָאִית, שַׁרְווּל וְצַוָּאר","צְנִיעוּת הִיא לֹא רַק אֹרֶךְ: כִּסּוּי הָרַגְלַיִם, הַיָּדַיִם וְהַצַּוָּאר","../halacha-quiz/tzniut-04.html","s-halacha-quiz_tzniut-04"],["halacha","🌷 הִלְכוֹת צְנִיעוּת","חֲצָאִית – וְלֹא מִכְנָסַיִם","לֹא יִלְבַּשׁ, דַּת יְהוּדִית, לְבוּשׁ יִצּוּגִי וְזֶהוּת – וּמָה עוֹשִׂים בַּבַּיִת וּבַטִּיּוּל","../halacha-quiz/tzniut-05.html","s-halacha-quiz_tzniut-05"],["halacha","🌷 הִלְכוֹת צְנִיעוּת","יֵצֶר הָעֲרָיוֹת – כֹּחַ גָּדוֹל מִמָּקוֹם קָדוֹשׁ","לָמָּה חֲכָמִים לֹא בִּטְּלוּ אֶת הַיֵּצֶר, מָה תַּפְקִידוֹ, וְלָמָּה הוּא חָזָק כָּל כָּךְ","../halacha-quiz/tzniut-06.html","s-halacha-quiz_tzniut-06"],["halacha","🌷 הִלְכוֹת צְנִיעוּת","אִסּוּר נְגִיעָה – קְדֻשַּׁת הַמַּגָּע","״לֹא תִקְרְבוּ״: מְקוֹר הָאִסּוּר, הַהֲלָכָה לְמַעֲשֶׂה, וְאֵיךְ שׁוֹמְרִים בְּלִי לְהַעֲלִיב","../halacha-quiz/tzniut-07.html","s-halacha-quiz_tzniut-07"],["halacha","🌷 הִלְכוֹת צְנִיעוּת","יִחוּד – דֶּלֶת פְּתוּחָה וְלֵב שָׁמוּר","מָה זֶה יִחוּד, מָה מוֹנֵעַ אוֹתוֹ, וְאֵיךְ נִזְהָרוֹת בְּשִׁעוּר פְּרָטִי, בַּהַסָּעָה וְאֵצֶל הָרוֹפֵא","../halacha-quiz/tzniut-08.html","s-halacha-quiz_tzniut-08"],["halacha","🌷 הִלְכוֹת צְנִיעוּת","חֶבְרָה מְעֹרֶבֶת וּצְנִיעוּת בַּטִּיּוּל","שִׂיחָה עִנְיָנִית, גְּבוּלוֹת בְּרוּרִים, וְטִיּוּל שֶׁשּׁוֹמֵר עָלֵינוּ","../halacha-quiz/tzniut-09.html","s-halacha-quiz_tzniut-09"],["halacha","🌷 הִלְכוֹת צְנִיעוּת","שְׁמִירַת הָעֵינַיִם – הִסְתַּכְּלוּת אֲסוּרָה","גַּם בַּמָּסָךְ, גַּם לַבָּנוֹת: תּוֹכְנַת סִנּוּן, הֲסָטַת הַמַּבָּט וְקִרְבַת ה׳","../halacha-quiz/tzniut-10.html","s-halacha-quiz_tzniut-10"],["halacha","🌷 הִלְכוֹת צְנִיעוּת","שִׁירַת נָשִׁים","שִׁירַת נָשִׁים","../halacha-quiz/tzniut-11.html","s-halacha-quiz_tzniut-11"],["halacha","🌷 הִלְכוֹת צְנִיעוּת","כִּסּוּי רֹאשׁ לְנָשִׁים","דַּת מֹשֶׁה וְדַת יְהוּדִית, שְׁלֹשָׁה טְעָמִים, גֶּדֶר הַכִּסּוּי – וְכָבוֹד לְאִמָּא וּלְכָל אִשָּׁה שֶׁמִּשְׁתַּדֶּלֶת","../halacha-quiz/tzniut-12.html","s-halacha-quiz_tzniut-12"],["halacha","🌷 הִלְכוֹת צְנִיעוּת","מוּשָּׂגִים וּלְשׁוֹן חֲכָמִים – הִלְכוֹת צְנִיעוּת","מָה פֵּרוּשׁ הַמִּלִּים וְהַמּוּשָּׂגִים שֶׁפּוֹגְשִׁים בְּהִלְכוֹת צְנִיעוּת","../halacha-quiz/tzniut-mk.html","s-halacha-quiz_tzniut-mk"],["midot","הַחִיּוּךְ","וּלְבֶן שִׁנַּיִם מֵחָלָב","לָמָּה חִיּוּךְ טוֹב יוֹתֵר מִכּוֹס חָלָב? הַגְּמָרָא, רַבִּי יוֹחָנָן וְהַחֲפֵץ חַיִּים","../midot/../halacha-quiz/chiyuch-01.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/chiyuch-01-b1.webp"],["midot","הַחִיּוּךְ","שַׁמַּאי: סֵבֶר פָּנִים יָפוֹת","הֱוֵי מְקַבֵּל אֶת כָּל הָאָדָם – לָמָּה דַּוְקָא שַׁמַּאי הַקַּפְּדָן אָמַר זֹאת, וְלָמָּה זוֹ חוֹבָה","../midot/../halacha-quiz/chiyuch-02.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/chiyuch-02-b1.webp"],["midot","הַחִיּוּךְ","הַפָּנִים שֶׁלִּי – רְשׁוּת הָרַבִּים","פָּנָיו שֶׁל אָדָם הֵם רְשׁוּת הָרַבִּים, וְהַלֵּב הוּא רְשׁוּת הַיָּחִיד. אֵיךְ שׁוֹמְרִים עַל פָּנִים שֶׁלֹּא מַזִּיקוֹת לְאַף אֶחָד?","../midot/../halacha-quiz/chiyuch-03.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/chiyuch-03-b1.webp"],["midot","הַחִיּוּךְ","עִקַּר הַחֶסֶד הוּא הַלֵּב","בְּחֶסֶד חָשׁוּב אֵיךְ נוֹתְנִים יוֹתֵר מִמָּה שֶׁנּוֹתְנִים. מָה אוֹמֶרֶת הַגְּמָרָא, הַמַּהַרַ״ל וְהַשֻּׁלְחָן עָרוּךְ עַל סֵבֶר פָּנִים יָפוֹת?","../midot/../halacha-quiz/chiyuch-04.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/chiyuch-04-b1.webp"],["midot","הַחִיּוּךְ","סֵבֶר פָּנִים יָפוֹת וְשִׂמְחָה","מָה הַהֶבְדֵּל בֵּין חִיּוּךְ לְשִׂמְחָה, וְאֵיךְ מְקַבְּלִים אוֹרֵחַ גַּם כְּשֶׁאֵין מַצַּב רוּחַ?","../midot/../halacha-quiz/chiyuch-05.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/chiyuch-05-b1.webp"],["midot","הַחִיּוּךְ","תְּחַיֵּךְ וְתִהְיֶה שָׂמֵחַ","אַחֲרֵי הַמַּעֲשִׂים נִמְשָׁכִים הַלְּבָבוֹת – חִיּוּךְ שֶׁמְּשַׂמֵּחַ אוֹתָנוּ","../midot/../halacha-quiz/chiyuch-06.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/chiyuch-06-b1.webp"],["midot","הַחִיּוּךְ","ה׳ צִלְּךָ – כְּמַיִם הַפָּנִים לַפָּנִים","אֵיךְ הַחִיּוּךְ שֶׁלָּנוּ מְעוֹרֵר חִיּוּךְ גַּם מִלְּמַעְלָה: הַצֵּל, הַמַּרְאָה וְאוֹר הַפָּנִים","../midot/../halacha-quiz/chiyuch-07.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/chiyuch-07-b1.webp"],["midot","הַחִיּוּךְ","מְשַׂמְּחִים אֶת הָעֲצוּבִים","שְׁנֵי הַבַּדְחָנִים בַּשּׁוּק, הַמִּצְוָה הַגְּדוֹלָה בְּיוֹתֵר וְהַמְּשִׂימָה: לִהְיוֹת בַּדְחָן שֶׁל הַשּׁוּק","../midot/../halacha-quiz/chiyuch-08.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/chiyuch-08-b1.webp"],["midot","הַחִיּוּךְ","חִיּוּךְ שֶׁל קִדּוּשׁ ה׳","אֵיךְ חִיּוּךְ וְ׳שָׁלוֹם׳ מְקַדְּשִׁים שֵׁם שָׁמַיִם? בַּדֶּרֶךְ, בְּבֵית הַמִּדְרָשׁ וּבַכִּתָּה","../midot/../halacha-quiz/chiyuch-09.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/chiyuch-09-b1.webp"],["midot","הַחִיּוּךְ","חִיּוּךְ בַּבַּיִת","אֵיךְ מַתְחִילִים אֶת הַבַּיִת בְּחִיּוּךְ? לְאַבָּא, לְאִמָּא, לָאַחִים – וְגַם כְּשֶׁקָּשֶׁה","../midot/../halacha-quiz/chiyuch-10.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/chiyuch-10-b1.webp"],["midot","הַחִיּוּךְ","חֶדֶר הַכֹּשֶׁר שֶׁל הַפָּנִים","אֵיךְ מִתְאַמְּנִים בְּחִיּוּךְ? מַרְאָה, עִפָּרוֹן, שִׁחְרוּר לֶסֶת, יַהֲלוֹם וְ׳מוֹדֶה אֲנִי׳","../midot/../halacha-quiz/chiyuch-11.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/chiyuch-11-b1.webp"],["midot","הַחִיּוּךְ","הַמַּדָּע שֶׁמֵּאֲחוֹרֵי הַמָּאוֹר","אֵיךְ חִיּוּךְ פּוֹעֵל עַל הַמֹּחַ וְעַל הַגּוּף? נוֹיְרוֹנֵי מַרְאָה, הִשָּׂרְדוּת וְשִׂגְשׁוּג, וְהַשִּׁנַּיִם כֵּלִים שֶׁל מִצְוָה","../midot/../halacha-quiz/chiyuch-12.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/chiyuch-12-b1.webp"],["midot","הַחִיּוּךְ","הַיַּהֲלוֹם בַּעַל עֶשֶׂר הַפֵּאוֹת","חִיּוּךְ אֶחָד וַעֲשָׂרָה מִצְווֹת: מִ׳וְאָהַבְתָּ לְרֵעֲךָ׳ וְעַד נַחַת רוּחַ לַבּוֹרֵא","../midot/../halacha-quiz/chiyuch-13.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/chiyuch-13-b1.webp"],["midot","הַחִיּוּךְ","מִצְוָה שֶׁמְּחַיָּה נְפָשׁוֹת","מָה הַהֶפֶךְ מִבּוּשָׁה? לְהַחְזִיר צֶבַע וְכֹחַ לְאָדָם עָצוּב, בְּחִיּוּךְ אֶחָד","../midot/../halacha-quiz/chiyuch-14.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/chiyuch-14-b1.webp"],["midot","הַחִיּוּךְ","כְּשֶׁהָעֵינַיִם צוֹחֲקוֹת","מָה הַהֶבְדֵּל בֵּין חִיּוּךְ שֶׁל נִימוּס לְחִיּוּךְ שֶׁל אֱמֶת? מִן הַשְּׂפָתַיִם אֶל הָעֵינַיִם","../midot/../halacha-quiz/chiyuch-15.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/chiyuch-15-b1.webp"],["midot","הַחִיּוּךְ","הַשִּׂמְחָה הִיא בְּחִירָה","רַבִּי קָלְמָן גּוֹלְדְשְׁמִידְט בָּחַר לִשְׂמֹחַ גַּם בִּתְקוּפָה קָשָׁה מְאוֹד","../midot/../halacha-quiz/chiyuch-16.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/chiyuch-16-b1.webp"],["midot","הַחִיּוּךְ","סֻלַּם הַקִּנְיָן","חֲמִשָּׁה שְׁלָבִים שֶׁבָּהֶם הַחִיּוּךְ נַעֲשֶׂה מִדָּה שֶׁלָּנוּ","../midot/../halacha-quiz/chiyuch-17.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/chiyuch-17-b1.webp"],["midot","עַיִן טוֹבָה","מָה הָעַיִן בּוֹחֶרֶת לִרְאוֹת","הֶחָסִיד וְהַשִּׁנַּיִם הַלְּבָנוֹת, הַזְּבוּב שֶׁבּוֹחֵר מָקוֹם מְלֻכְלָךְ, וְהַכּוֹס הַחֲצִי מְלֵאָה","../midot/../halacha-quiz/ayin-01.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/ayin-01-b1.webp"],["midot","עַיִן טוֹבָה","וְהִנֵּה טוֹב מְאֹד","הַפָּסוּק שֶׁה׳ כָּתַב בִּשְׁבִילֵנוּ, בֶּן זוֹמָא וְהַלֶּחֶם, וּמִצְוַת ׳וְשָׂמַחְתָּ בְּכָל הַטּוֹב׳","../midot/../halacha-quiz/ayin-02.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/ayin-02-b1.webp"],["midot","עַיִן טוֹבָה","רְאֵה, נָאִים, בִּשְׁבִילְךָ – מַתָּנוֹת בְּכָל יוֹם","אוֹר, לֶחֶם, מַיִם וַאֲוִיר, פְּרָחִים וְטַעֲמִים – וְאֵיךְ עוֹצְרִים לְרֶגַע וְאוֹמְרִים תּוֹדָה","../midot/../halacha-quiz/ayin-03.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/ayin-03-b1.webp"],["midot","עַיִן טוֹבָה","הַדָּן אֶת חֲבֵרוֹ לְכַף זְכוּת – הַשָּׂכִיר וּבַעַל הַבַּיִת","הַסִּפּוּר הַמָּלֵא מִן הַגְּמָרָא, חֲמִשָּׁה הֶסְבֵּרִים טוֹבִים, וְאֵיךְ דָּנִים חָבֵר לִזְכוּת","../midot/../halacha-quiz/ayin-04.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/ayin-04-b1.webp"],["midot","עַיִן טוֹבָה","נְקֻדָּה טוֹבָה בְּכָל חָבֵר","אֵיךְ מוֹצְאִים מְעַט טוֹב בְּכָל אֶחָד, אֵיךְ מְסַפְּרִים בְּשִׁבְחוֹ שֶׁל חָבֵר, וְלָמָּה ה׳ לֹא מַבִּיט בַּחֶסְרוֹנוֹת","../midot/../halacha-quiz/ayin-05.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/ayin-05-b1.webp"],["midot","עַיִן טוֹבָה","נְקֻדָּה טוֹבָה בְּתוֹכִי","אֵיךְ מוֹצְאִים מְעַט טוֹב בְּעַצְמִי, לָמָּה אָסוּר לִפֹּל בְּעֶצֶב, וְאֵיךְ שָׁרִים לַה׳ גַּם כְּשֶׁלֹּא הַכֹּל מֻשְׁלָם","../midot/../halacha-quiz/ayin-06.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/ayin-06-b1.webp"],["midot","עַיִן טוֹבָה","הָעֵינַיִם שֶׁל הַמְּרַגְּלִים","אֵיךְ רוֹאִים אֶת הָאָרֶץ הַטּוֹבָה, לָמָּה הָעַיִן הוֹלֶכֶת אַחַר הַלֵּב, וְאֵיךְ מִתְרַגְּלִים לִרְאוֹת טוֹב","../midot/../halacha-quiz/ayin-07.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/ayin-07-b1.webp"],["midot","עַיִן טוֹבָה","רַבִּי עֲקִיבָא – אֲבִי הָאוֹפְּטִימִיּוּת","הַבְּאֵר שֶׁבְּלוֹד, הַשּׁוּעָל עַל הַר הַבַּיִת, וְהַבִּטָּחוֹן שֶׁתָּמִיד יָבוֹא הַטּוֹב","../midot/../halacha-quiz/ayin-08.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/ayin-08-b1.webp"],["midot","עַיִן טוֹבָה","מָה אֲנִי אוֹמֵר עַל מָה שֶׁקָּרָה","אֵיךְ הָאוֹפְּטִימִי מֵסְבִּיר מִקְרֶה: הַטּוֹב בָּא מִמֶּנִּי, הָרַע קָצָר וְלֹא הוֹרֵס אֶת הַכֹּל, וְכִשָּׁלוֹן הוּא לֶקַח","../midot/../halacha-quiz/ayin-09.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/ayin-09-b1.webp"],["midot","עַיִן טוֹבָה","תַּחְשֹׁב טוֹב","הֶרְגֵּלִים שֶׁל כָּל יוֹם: שָׁלוֹשׁ טוֹבוֹת לִפְנֵי הַשֵּׁנָה, נִצָּחוֹנוֹת קְטַנִּים, בֹּקֶר שֶׁמַּתְחִיל בְּתוֹדָה וַחֲבֵרִים שֶׁרוֹאִים טוֹב","../midot/../halacha-quiz/ayin-10.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/ayin-10-b1.webp"],["midot","שִׂמְחָה","מַהִי שִׂמְחָה?","שִׂמְחָה כְּהַרְגָּשַׁת סִפּוּק: שְׁקֵטָה, פְּנִימִית, וְאֶפְשָׁר לִבְנוֹת אוֹתָהּ אַחֲרֵי כָּל מִצְוָה","../midot/../halacha-quiz/simcha-01.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/simcha-01-b1.webp"],["midot","שִׂמְחָה","׳יִשְׂרָאֵל מֵאִיר, אֵינְךָ שָׂמֵחַ מַסְפִּיק׳","חֶשְׁבּוֹן הַנֶּפֶשׁ שֶׁל הֶחָפֵץ חַיִּים: לֹא רַק לְקַיֵּם מִצְוָה, אֶלָּא לִשְׂמֹחַ בָּהּ, וּלְהַגְדִּיל אֶת הַשִּׂמְחָה כָּל יוֹם","../midot/../halacha-quiz/simcha-02.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/simcha-02-b1.webp"],["midot","שִׂמְחָה","מִצְוָה זֶה דּוֹרוֹן מֵהַמֶּלֶךְ","סֵפֶר חֲרֵדִים: כָּל מִצְוָה הִיא מַתָּנָה מֵהַמֶּלֶךְ, וּמִי שֶׁמַּרְגִּישׁ אֶת זֶה שָׂמֵחַ, גַּם בְּמִצְוָה קְטַנָּה","../midot/../halacha-quiz/simcha-03.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/simcha-03-b1.webp"],["midot","שִׂמְחָה","כַּמָּה שָׁוָה מִצְוָה?","פַּחִית אוֹ שָׁעָה שֶׁל תּוֹרָה? שְׁלוֹשָׁה סִפּוּרִים שֶׁעוֹזְרִים לַלֵּב לְהַרְגִּישׁ אֶת עֵרֶךְ הַמִּצְוָה","../midot/../halacha-quiz/simcha-04.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/simcha-04-b1.webp"],["midot","שִׂמְחָה","הַתִּינוֹק שֶׁבּוֹרֵחַ מִבֵּית הַסֵּפֶר","מָה קוֹרֶה כְּשֶׁהַגּוּף עוֹשֶׂה מִצְוָה וְהַלֵּב בַּחוּץ, לָמָּה הַלֵּב חָשׁוּב בַּמִּצְוָה, וְאֵיךְ מַחֲזִירִים אֵלֶיהָ חַיּוּת וְשִׂמְחָה","../midot/../halacha-quiz/simcha-05.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/simcha-05-b1.webp"],["midot","שִׂמְחָה","שִׂמְחָה שֶׁנִּשְׁאֶרֶת","לָמָּה מַה שֶּׁלּוֹמְדִים וְעוֹשִׂים בְּשִׂמְחָה נִשְׁאָר בַּלֵּב, וְאֵיךְ שִׁירָה וְרִקּוּד מַחְדִּירִים אֶת הַתּוֹרָה עָמֹק","../midot/../halacha-quiz/simcha-06.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/simcha-06-b1.webp"],["midot","שִׂמְחָה","מְבַקְּשִׁים לִהְיוֹת שְׂמֵחִים","אֵיךְ לוֹמְדִים שִׂמְחָה בְּמִצְוֹת: מַחְלִיטִים, מְבַקְּשִׁים מֵה׳, אוֹמְרִים תּוֹדָה, שָׁרִים וְרָצִים לַמִּצְוָה","../midot/../halacha-quiz/simcha-07.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/simcha-07-b1.webp"],["midot","שִׂמְחָה","כְּשֶׁאֲנִי שָׂמֵחַ, ה׳ שָׂמֵחַ","לָמָּה ה׳ בָּרָא אֶת הָעוֹלָם, מָה קוֹרֶה כְּשֶׁאֲנִי נֶהֱנֶה מִמִּצְוָה, וְאֵיךְ אֲנִי מְשַׂמֵּחַ אֶת אַבָּא שֶׁבַּשָּׁמַיִם","../midot/../halacha-quiz/simcha-08.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/simcha-08-b1.webp"],["midot","שִׂמְחָה","שִׂמְחַת הֶחָג: ׳עַכְּבוּ עִמָּדִי׳","הַמֶּלֶךְ וּבָנָיו, ׳וְהָיִיתָ אַךְ שָׂמֵחַ׳, וְאֵיךְ מְשַׂמְּחִים אֶת כֻּלָּם בֶּחָג","../midot/../halacha-quiz/simcha-09.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/simcha-09-b1.webp"],["midot","שִׂמְחָה","גַּם בְּיוֹם שֶׁאֵין חֵשֶׁק","כְּשֶׁהַלֵּב סָגוּר, כְּשֶׁנּוֹפְלִים, וְאֵיךְ חוֹזְרִים לְשִׂמְחָה בִּצְעָדִים קְטַנִּים: שְׁבוּעַ שֶׁל שִׂמְחָה","../midot/../halacha-quiz/simcha-10.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/simcha-10-b1.webp"],["midot","שִׂמְחָה","אֵיזֶהוּ עָשִׁיר?","בֶּן זוֹמָא שׁוֹאֵל מִי עָשִׁיר, וְהַתְּשׁוּבָה מַפְתִּיעָה: הַשָּׂמֵחַ בְּחֶלְקוֹ. מָה זֶה חֵלֶק, לָמָּה זוֹ מִדָּה גְּדוֹלָה, וְאֵיךְ מְקַיְּמִים אוֹתָהּ","../midot/../halacha-quiz/simcha-11.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/simcha-11-b1.webp"],["midot","שִׂמְחָה","הַמַּתָּנָה שֶׁל יוֹם הַהוּלֶדֶת","הַמַּתָּנָה הַגְּדוֹלָה בְּיוֹתֵר שֶׁקִּבַּלְנוּ הִיא עֶצֶם הַחַיִּים. לָמָּה יוֹם הַהוּלֶדֶת הוּא יוֹם שֶׁל שִׂמְחָה, וּמָה הָעֲנִי שֶׁהִתְלוֹנֵן בַּמָּטוֹס מְלַמֵּד אוֹתָנוּ","../midot/../halacha-quiz/simcha-12.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/simcha-12-b1.webp"],["midot","שִׂמְחָה","הָאוֹרְחִים וְהַמָּרָק","אוֹרְחִים קִבְּלוּ דָּגִים וְעוֹפוֹת וְהִתְלוֹנְנוּ עַל הַמָּרָק. מָה זֶה מְלַמֵּד עָלֵינוּ, מָה אָמַר הָרַמְבַּ״ן עַל הַמִּתְאוֹנְנִים, וְאֵיךְ תְּלוּנוֹת הָפְכוּ לְרִקּוּדִים","../midot/../halacha-quiz/simcha-13.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/simcha-13-b1.webp"],["midot","שִׂמְחָה","הַיֵּשׁ וְהָאַיִן","הָמָן הָיָה לוֹ הַכֹּל וְאָמַר ׳וְכָל זֶה אֵינֶנּוּ שֹׁוֶה לִי׳. אֵיךְ מַסְתַּכְּלִים עַל הַ׳יֵּשׁ׳ וְלֹא רַק עַל הָ׳אַיִן׳, וּמָה לִמֵּד רַבִּי חַיִּים מִוֹּלוֹזִ׳ין","../midot/../halacha-quiz/simcha-14.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/simcha-14-b1.webp"],["midot","שִׂמְחָה","מַתָּנַת חִנָּם","מָה זֶה שָׂבֵעַ רָצוֹן? מַדּוּעַ נַפְתָּלִי הָיָה ׳מָלֵא בִּרְכַּת ה׳׳, וְאֵיזוֹ מַתָּנָה מְחַכָּה לְמִי שֶׁשָּׂמֵחַ בְּחֶלְקוֹ","../midot/../halacha-quiz/simcha-15.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/simcha-15-b1.webp"],["midot","שִׂמְחָה","לְלַמֵּד אֶת הַלֵּב לִשְׂמֹחַ","שִׂמְחָה אֲמִתִּית צְרִיכָה עָמָל, לִימּוּד וְהוֹדָיָה: נְשִׁימָה, רְאִיָּה וּמַתָּנוֹת הָעוֹלָם","../midot/../halacha-quiz/simcha-16.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/simcha-16-b1.webp"],["midot","שִׂמְחָה","הַמַּאֲבָק הָעַצְלָנִי","מִי מְנַצֵּחַ בַּמַּאֲבָק? מָה הַיֵּצֶר רוֹצֶה, וְאֵיךְ שִׂמְחָה וּזְרִיזוּת מְחַזְּקוֹת זוֹ אֶת זוֹ","../midot/../halacha-quiz/simcha-17.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/simcha-17-b1.webp"],["midot","שִׂמְחָה","שֶׁלִּי וְשֶׁלְּךָ","לָמָּה מִי שֶׁשָּׂמֵחַ בְּחֶלְקוֹ אֵינוֹ מְקַנֵּא וְאוֹהֵב אֶת כֻּלָּם, וְאֵיךְ אוֹמְרִים ׳אֲנִי שָׂמֵחַ בִּשְׁבִילְךָ׳","../midot/../halacha-quiz/simcha-18.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/simcha-18-b1.webp"],["midot","שִׂמְחָה","גַּם ה׳ שָׂמֵחַ בְּחֶלְקוֹ","מָה פֵּרוּשׁ ׳חֶלְקוֹ׳ שֶׁל הַקָּדוֹשׁ בָּרוּךְ הוּא, וְאֵיךְ אָנוּ לוֹמְדִים מִמֶּנּוּ לִהְיוֹת שְׂמֵחִים בְּחֶלְקֵנוּ","../midot/../halacha-quiz/simcha-19.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/simcha-19-b1.webp"],["midot","שִׂמְחָה","הַקַּסְדָּה וְכוֹס הַמַּיִם","אֵיךְ שׁוֹמֵר עָלֵינוּ חֶסֶד ה׳ שֶׁבַּגּוּף, וְאֵיךְ אֲפִלּוּ כּוֹס מַיִם הִיא מַתָּנָה נִפְלָאָה מִן הַנּוֹתֵן","../midot/../halacha-quiz/simcha-20.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/simcha-20-b1.webp"],["midot","שִׂמְחָה","בֶּכִי אוֹ שִׁירָה?","שְׁתֵּי דְּרָכִים לִפְנוֹת אֶל ה׳, וְלָמָּה שִׁיר שֶׁל תּוֹדָה פּוֹתֵחַ אֶת הַלֵּב","../midot/../halacha-quiz/simcha-21.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/simcha-21-b1.webp"],["midot","שִׂמְחָה","׳וּפַרְעֹה הִקְרִיב׳","אֵיךְ דָּבָר מַצִּיק יָכוֹל לְקָרֵב אוֹתָנוּ אֶל ה׳, וְאֵיזוֹ דֶּרֶךְ אַחֶרֶת יֵשׁ","../midot/../halacha-quiz/simcha-22.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/simcha-22-b1.webp"],["midot","שִׂמְחָה","טִיּוּל אוֹ רוֹפֵא שִׁנַּיִם?","לָמָּה דָּבָר קָשֶׁה לִפְעָמִים קַל, וְאֵיךְ אֶפְשָׁר לְהָפְכוֹ לְהִזְדַּמְּנוּת","../midot/../halacha-quiz/simcha-23.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/simcha-23-b1.webp"],["midot","שִׂמְחָה","בְּיוֹם שֶׁאֵין חֵשֶׁק","חוּט דַּק שֶׁל קֶשֶׁר, תְּפִלָּה קְצָרָה וְנִגּוּן – וְחוֹזְרִים מָחָר","../midot/../halacha-quiz/simcha-24.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/simcha-24-b1.webp"],["midot","שִׂמְחָה","הַפַּעַם הִצְלַחְתִּי!","אֵיךְ שָׂמֵחִים אַחֲרֵי טָעוּת: הַפַּעַם הִצְלַחְתִּי, עֲנָוָה, וְהַדֶּלֶת שֶׁתָּמִיד פְּתוּחָה","../midot/../halacha-quiz/simcha-25.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/simcha-25-b1.webp"],["midot","שִׂמְחָה","נִדְמֶה שֶׁמַּרְחִיקִים – וְצַעַד קָטָן מְקָרֵב","רַבִּי נַחְמָן מְלַמֵּד: מָה עוֹשִׂים כְּשֶׁנִּדְמֶה שֶׁאֲנִי לֹא מִתְקַדֵּם, אֵיךְ צַעַד קָטָן יָקָר, וְלָמָּה הָעִקָּר לִהְיוֹת בְּשִׂמְחָה","../midot/../halacha-quiz/simcha-26.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/simcha-26-b1.webp"],["midot","שִׂמְחָה","שִׁירָה לִפְנֵי הַמִּלְחָמָה","יְהוֹשָׁפָט, הַמְשׁוֹרְרִים בַּחֲזִית, וְאֵיךְ שִׁיר קָטָן עוֹזֵר לְמִי שֶׁמְּפַחֵד","../midot/../halacha-quiz/simcha-27.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/simcha-27-b1.webp"],["midot","שִׂמְחָה","הַשִּׁיר שֶׁעוֹשֶׂה בְּרִיָּה חֲדָשָׁה","אֵיךְ שִׁיר נִשְׁאָר בַּלֵּב, מִתְפַּשֵּׁט בֵּין הָאֲנָשִׁים, וּפוֹתֵחַ הַתְחָלָה חֲדָשָׁה","../midot/../halacha-quiz/simcha-28.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/simcha-28-b1.webp"],["midot","שִׂמְחָה","הָרָעָה שֶׁהִיא זְכוּת","לָמָּה הָרָעָה לְעוֹבְדֵי ה׳ הִיא שִׂמְחָתָם, וְאֵיךְ שׁוֹמְרִים עַל הָאַהֲבָה גַּם כְּשֶׁקָּשֶׁה","../midot/../halacha-quiz/simcha-29.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/simcha-29-b1.webp"],["midot","שִׂמְחָה","הַהֲלִיכָה לְבֵית הָאֲבוֹת","אֵיךְ אֶפְשָׁר לִשְׂמֹחַ גַּם כְּשֶׁחָסֵר מַשֶּׁהוּ: רוֹאִים אֶת הַיֵּשׁ וְנוֹתְנִים לַאֲחֵרִים","../midot/../halacha-quiz/simcha-30.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/simcha-30-b1.webp"],["midot","הַכָּרַת הַטּוֹב לַה׳ (הוֹדָיָה)","מוֹדִים בְּשִׂמְחָה – כְּמוֹ יִתְרוֹ","מָה צָרִיךְ כְּדֵי שֶׁהַהוֹדָיָה תִּהְיֶה אֲמִתִּית, לָמָּה שָׂמַח יִתְר  מוֹדִים לְמִי שֶׁלִּמֵּד אוֹתָנוּ, וְאֵיךְ","../midot/../halacha-quiz/hakarat-06.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/hakarat-06-b1.webp"],["midot","הַכָּרַת הַטּוֹב לַחֲבֵרִים וְלַהוֹרִים","תּוֹדָה לְאִמָּא וּלְאַבָּא עַל הַדְּבָרִים הַקְּטַנִּים","לָמָּה קָשֶׁה לְהוֹדוֹת לַהוֹרִים עַל מָה שֶׁקּוֹרֶה כָּל יוֹם, מָה אוֹמֵר סֵפֶר הַחִנּוּךְ, וְאֵיךְ תּוֹדָה קְטַנָּה מְקָרֶבֶת לְהוֹדוֹת לַה׳","../midot/../halacha-quiz/hakarat-07.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/hakarat-07-b1.webp"],["midot","הַכָּרַת הַטּוֹב לַחֲבֵרִים וְלַהוֹרִים","הַמַּתָּנָה שֶׁמַּטָּה אֶת הַלֵּב","לָמָּה אָסוּר לְשׁוֹפֵט לְקַבֵּל מַתָּנָה, וְאֵיךְ מַכִּירִים טוֹבָה וְנִשְׁאָרִים הוֹגְנִים","../midot/../halacha-quiz/hakarat-08.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/hakarat-08-b1.webp"],["midot","הַכָּרַת הַטּוֹב לַחֲבֵרִים וְלַהוֹרִים","שָׁלוֹם – וְלֹא גּוֹזְלִים אֶת הַתּוֹדָה","לָמָּה מַקְדִּימִים שָׁלוֹם, מַחֲזִירִים שָׁלוֹם, וּמוֹדִים גַּם לְמִי שֶׁלֹּא מְצַפֶּה","../midot/../halacha-quiz/hakarat-09.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/hakarat-09-b1.webp"],["midot","הַכָּרַת הַטּוֹב לַחֲבֵרִים וְלַהוֹרִים","הַכָּרַת הַטּוֹב – הַדֶּרֶךְ לַה׳","לָמָּה הַכּוֹפֵר בְּטוֹבַת חֲבֵרוֹ לְסוֹף כּוֹפֵר בְּטוֹבַת ה׳, וְאֵיךְ תּוֹדָה לְאָדָם מְקָרֶבֶת אוֹתָנוּ לַה׳","../midot/../halacha-quiz/hakarat-10.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/hakarat-10-b1.webp"],["midot","כִּבּוּד אָב וָאֵם","עַל הַלּוּחוֹת, בַּצַּד הַיְמָנִי","לָמָּה כִּבּוּד הוֹרִים נִכְתַּב בַּלּוּחוֹת, וְלָמָּה יֶלֶד צָרִיךְ אֶת הוֹרָיו הַרְבֵּה שָׁנִים","../midot/../halacha-quiz/kibud-01.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/kibud-01-b1.webp"],["midot","כִּבּוּד אָב וָאֵם","דָּמָא בֶּן נְתִינָה – הַמַּפְתֵּחַ מִתַּחַת לַכַּר","סוֹחֵר מֵאַשְׁקְלוֹן שֶׁוִּתֵּר עַל אַלְפֵי דִּינָרִים כְּדֵי לֹא לְהָעִיר אֶת אָבִיו","../midot/../halacha-quiz/kibud-02.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/kibud-02-b1.webp"],["midot","כִּבּוּד אָב וָאֵם","רַבִּי טַרְפוֹן – ׳אֲנִי בְּעַצְמִי׳","עָשִׁיר עִם מְשָׁרְתִים שֶׁעָזַר לְאִמּוֹ בְּעַצְמוֹ, וְסִפּוּר הַסַּנְדָּל בְּשַׁבָּת","../midot/../halacha-quiz/kibud-03.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/kibud-03-b1.webp"],["midot","כִּבּוּד אָב וָאֵם","אֲבִימִי: ׳הֵן, הֵן׳","חֲמִשָּׁה בָּנִים תַּלְמִידֵי חֲכָמִים, וְאֲבִימִי רָץ בְּעַצְמוֹ אֶל אָבִיו וְעוֹמֵד עִם הַכּוֹס","../midot/../halacha-quiz/kibud-04.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/kibud-04-b1.webp"],["midot","כִּבּוּד אָב וָאֵם","חֲצִי שָׁעָה כָּל יוֹם","מָה עָשָׂה הַחֲזוֹן אִישׁ כָּל יוֹם בִּשְׁבִיל אִמּוֹ, לָמָּה בָּא מֵעַצְמוֹ, וְאֵיךְ גַּם אֲנִי יָכוֹל לְהַחֲזִיר לַהוֹרִים","../midot/../halacha-quiz/kibud-05.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/kibud-05-b1.webp"],["midot","כִּבּוּד אָב וָאֵם","לְכַבֵּד בְּשִׂמְחָה","מָה לָמַד הַסְּטַיְיפְלֶר עַל יֶלֶד קָטָן, אֵיךְ מְכַבְּדִים אֶת שְׁנֵי הַהוֹרִים, וְלָמָּה פָּנִים שְׂמֵחוֹת הֵן חֵלֶק מֵהַמִּצְוָה","../midot/../halacha-quiz/kibud-06.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/kibud-06-b1.webp"],["midot","כִּבּוּד אָב וָאֵם","גְּדוֹלִים כִּי כִּבְּדוּ","אֵיךְ כִּבְּדוּ הָאַמְרֵי אֱמֶת, רַבִּי חַיִּים מִבְּרִיסְק, יוֹתָם וְרַב יוֹסֵף אֶת הוֹרֵיהֶם, וּמָה אֲנִי יָכוֹל לִלְמֹד מֵהֶם","../midot/../halacha-quiz/kibud-07.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/kibud-07-b1.webp"],["midot","כִּבּוּד אָב וָאֵם","כְּשֶׁחוֹלְקִים בְּדֵעוֹת – וְשׁוֹמְרִים עַל הַכָּבוֹד","אֵיךְ מְדַבְּרִים עִם הוֹרִים כְּשֶׁחוֹשְׁבִים אַחֶרֶת, וְלָמָּה הֵם צְרִיכִים לְהַרְגִּישׁ שֶׁהֵם חֲשׁוּבִים","../midot/../halacha-quiz/kibud-08.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/kibud-08-b1.webp"],["midot","כִּבּוּד אָב וָאֵם","חוֹב שֶׁמְּשַׁלְּמִים בְּשִׂמְחָה","לָמָּה כִּבּוּד הוֹרִים הוּא פֵּרָעוֹן חוֹב, וְאֵיךְ הַכָּרַת הַטּוֹב מֵהַלֵּב מוֹבִילָה גַּם אֶל ה׳","../midot/../halacha-quiz/kibud-09.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/kibud-09-b1.webp"],["midot","כִּבּוּד אָב וָאֵם","מִצְוָה שֶׁנַּעֲשֵׂית כֶּתֶר","רַבִּי טַרְפוֹן וְהַסַּנְדָּל, ״עוֹד לֹא הִגִּיעַ לַחֲצִי״, וְכִבּוּד הוֹרִים כְּגֶשֶׁר לְהַכָּרַת הַטּוֹב וּלְאַהֲבַת ה׳","../midot/../halacha-quiz/kibud-10.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/kibud-10-b1.webp"],["midot","חֶסֶד","מַהוּ חֶסֶד? לָתֵת מִן הַלֵּב","לָמָּה חֶסֶד הוּא לֹא רַק לַעֲזֹר לְמִי שֶׁחָסֵר לוֹ, אֵיךְ מוֹדְדִים אוֹתוֹ, וְלָמָּה צָרִיךְ גַּם לֵב שֶׁאוֹהֵב לָתֵת","../midot/../halacha-quiz/chesed-01.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/chesed-01-b1.webp"],["midot","חֶסֶד","עוֹלָם חֶסֶד יִבָּנֶה","לָמָּה ה׳ בָּרָא אוֹתָנוּ צְרִיכִים, אֵיךְ כָּל טוֹב הוּא חֶסֶד, וְאֵיךְ אֲנִי יָכוֹל לְהַמְשִׁיךְ אוֹתוֹ הָלְאָה","../midot/../halacha-quiz/chesed-02.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/chesed-02-b1.webp"],["midot","חֶסֶד","הַבִּירָה הַדּוֹלֶקֶת","מָה לָמַד אַבְרָהָם מִן הַמָּשָׁל, אֵיךְ מַחְזִירִים טוֹבָה לַבּוֹרֵא, וְלָמָּה אָמַר לָאוֹרְחִים לְהוֹדוֹת לַה׳","../midot/../halacha-quiz/chesed-03.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/chesed-03-b1.webp"],["midot","חֶסֶד","רוֹעֵי צֹאן","מָה עָשָׂה מֹשֶׁה לַגְּדִי שֶׁבָּרַח, לָמָּה דָּוִד הוֹצִיא אֶת הַקְּטַנִּים קֹדֶם, וְאֵיךְ נוֹתְנִים לְכָל אֶחָד לְפִי כֹּחוֹ","../midot/../halacha-quiz/chesed-04.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/chesed-04-b1.webp"],["midot","חֶסֶד","הַתּוֹרָה מַתְחִילָה וְנִגְמֶרֶת בְּחֶסֶד","אֵיךְ הוֹלְכִים בְּדַרְכֵי ה׳: מַלְבִּישִׁים, מְבַקְּרִים חוֹלִים, מְנַחֲמִים אֲבֵלִים, וְהַתּוֹרָה כֻּלָּהּ חֶסֶד","../midot/../halacha-quiz/chesed-05.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/chesed-05-b1.webp"],["midot","חֶסֶד","חֶסֶד וְרַחֲמִים","מָה הַהֶבְדֵּל בֵּין לָתֵת כִּי כּוֹאֵב לִי לְבֵין לָתֵת כִּי אֲנִי רוֹצֶה לְהֵיטִיב, וְאֵיךְ אַבְרָהָם הִגִּיעַ לְחֶסֶד","../midot/../halacha-quiz/chesed-06.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/chesed-06-b1.webp"],["midot","חֶסֶד","חֶסֶד בִּמְגִלַּת רוּת","מִי עוֹשֶׂה חֶסֶד עִם מִי בִּמְגִלַּת רוּת, מַה לָמַד רַבִּי זְעֵירָא, וּמַה נּוֹתֵן מִי שֶׁמְּקַבֵּל","../midot/../halacha-quiz/chesed-07.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/chesed-07-b1.webp"],["midot","חֶסֶד","רַבִּי חֲנִינָא בֶּן דּוֹסָא – לִפְנִים מִשּׁוּרַת הַדִּין","הַתַּרְנְגוֹלִים הָאֲבוּדִים, מַה פֵּרוּשׁ לִפְנִים מִשּׁוּרַת הַדִּין, וְאֵיךְ אֶפְשָׁר לָתֵת גַּם כְּשֶׁיֵּשׁ מְעַט – בְּבִטָּחוֹן בַּה׳","../midot/../halacha-quiz/chesed-08.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/chesed-08-b1.webp"],["midot","חֶסֶד","לָשִׂים לֵב לַצַּעַר","מֹשֶׁה שֶׁחוֹשֵׁשׁ לְצַעֵר אֶת אַהֲרֹן, רַבִּי פְּרִידָא וְהַסַּבְלָנוּת, וְאֵיךְ מְצַיְּרִים בַּלֵּב אֶת הַצַּעַר שֶׁל הַשֵּׁנִי","../midot/../halacha-quiz/chesed-09.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/chesed-09-b1.webp"],["midot","חֶסֶד","כִּי חֶסֶד חָפַצְתִּי","בֵּית הַמִּקְדָּשׁ וְרַבִּי יְהוֹשֻׁעַ, חֶסֶד שֶׁמּוֹצִיא אוֹתִי מֵ׳רַק אֲנִי׳, וּדְרָכִים לִקְנוֹת אַהֲבַת חֶסֶד","../midot/../halacha-quiz/chesed-10.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/chesed-10-b1.webp"],["midot","הַכְנָסַת אוֹרְחִים","יוֹשֵׁב בְּפֶתַח הָאֹהֶל","אַבְרָהָם יוֹשֵׁב בַּחוּץ בְּיוֹם חַם וּמִצְטַעֵר שֶׁאֵין אוֹרְחִים – מָה זֶה אַהֲבַת חֶסֶד, וְאֵיךְ מְחַפְּשִׂים הִזְדַּמְנוּת לָתֵת","../midot/../halacha-quiz/orchim-01.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/orchim-01-b1.webp"],["midot","הַכְנָסַת אוֹרְחִים","וַיָּרָץ לִקְרָאתָם","אַבְרָהָם רָץ לִקְרַאת הָאוֹרְחִים – מָה אוֹמֶרֶת הָרִיצָה, וְאֵיךְ מְקַבְּלִים אוֹרֵחַ בְּשִׂמְחָה, בְּתוֹדָה וּבַעֲנָוָה","../midot/../halacha-quiz/orchim-02.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/orchim-02-b1.webp"],["midot","הַכְנָסַת אוֹרְחִים","וַיְמַהֵר – רֵץ וּמַהֵר","אַבְרָהָם רָץ וּמְמַהֵר בְּכָל הַסִּפּוּר – מָה אוֹמֶרֶת הַזְּרִיזוּת, וְאֵיךְ מַתְחִילִים לָרוּץ גַּם כְּשֶׁאֵין חֵשֶׁק","../midot/../halacha-quiz/orchim-03.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/orchim-03-b1.webp"],["midot","הַכְנָסַת אוֹרְחִים","גְּדוֹלָה הַכְנָסַת אוֹרְחִים מִקַּבָּלַת פְּנֵי שְׁכִינָה","אַבְרָהָם מְבַקֵּשׁ מֵה׳ לְהַמְתִּין וְרָץ אֶל הָאוֹרְחִים – מַדּוּעַ זוֹ הֲלִיכָה בְּדַרְכֵי ה׳, וּמָה רוֹאִים בְּכָל אוֹרֵחַ","../midot/../halacha-quiz/orchim-04.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/orchim-04-b1.webp"],["midot","הַכְנָסַת אוֹרְחִים","קֹדֶם כֹּל – אֶל שָׂרָה","אֵיךְ מְשַׁתְּפִים אֶת כָּל הַבַּיִת בְּאִירוּחַ, וְלָמָּה אַבְרָהָם בִּקֵּשׁ קֶמַח וְנָתַן לִבְחֹר סֹלֶת","../midot/../halacha-quiz/orchim-05.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/orchim-05-b1.webp"],["midot","הַכְנָסַת אוֹרְחִים","חֶסֶד שֶׁל הֶרְגֵּל","מָה הַהֶבְדֵּל בֵּין אַבְרָהָם לְלוֹט, וְלָמָּה חֶסֶד מֵאַהֲבָה הוּא עֵץ עִם שָׁרָשִׁים עֲמֻקִּים","../midot/../halacha-quiz/orchim-06.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/orchim-06-b1.webp"],["midot","הַכְנָסַת אוֹרְחִים","מַלְאָכִים שֶׁאֵינָם אוֹכְלִים","לָמָּה הַתּוֹרָה מְסַפֶּרֶת עַל אוֹרְחִים שֶׁלֹּא צְרִיכִים כְּלוּם, וּמָה אֶפְשָׁר לָתֵת לְאוֹרֵחַ שֶׁיֵּשׁ לוֹ הַכֹּל","../midot/../halacha-quiz/orchim-07.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/orchim-07-b1.webp"],["midot","הַכְנָסַת אוֹרְחִים","רִבְקָה – יוֹתֵר מִמָּה שֶׁבִּקְשׁוּ","מַה בָּדַק אֱלִיעֶזֶר בַּבְּאֵר, לָמָּה הַשְׁקָיַת הַגְּמַלִּים הִיא חֶסֶד מְיֻחָד, וְאֵיךְ נוֹתְנִים יוֹתֵר מִמָּה שֶׁמְּבַקְּשִׁים","../midot/../halacha-quiz/orchim-08.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/orchim-08-b1.webp"],["midot","הַכְנָסַת אוֹרְחִים","אוֹכֵל פֵּרוֹתֵיהֶם בָּעוֹלָם הַזֶּה","מָה קִבְּלוּ אַבְרָהָם וְשָׂרָה, לוֹט, הַשּׁוּנַמִּית וְאַלְמָנַת צָרְפַת בִּזְכוּת הַכְנָסַת אוֹרְחִים, וְלָמָּה פּוֹתְחִים אֶת הַבַּיִת מֵאַהֲבָה","../midot/../halacha-quiz/orchim-09.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/orchim-09-b1.webp"],["midot","הַכְנָסַת אוֹרְחִים","וַיִּטַּע אֶשֶׁל","מָה הָיָה הָאֶשֶׁל שֶׁנָּטַע אַבְרָהָם, מָה פֵּרוּשׁ רָאשֵׁי הַתֵּבוֹת, וְלָמָּה הַמִּצְוָה שְׁלֵמָה רַק עִם לְוָיָה","../midot/../halacha-quiz/orchim-10.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/orchim-10-b1.webp"],["midot","הַכְנָסַת אוֹרְחִים","הַפְתָּעוֹת קְטַנּוֹת לָאוֹרֵחַ","אֵיךְ מַרְגִּישׁ אוֹרֵחַ עָיֵף שֶׁמַּגִּיעַ, אֵילוּ דְּבָרִים קְטַנִּים הוֹפְכִים אֶת הַבַּיִת לְחַם וְנָעִים, וּמָה עוֹשֶׂה אוֹרֵחַ טוֹב","../midot/../halacha-quiz/orchim-11.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/orchim-11-b1.webp"],["midot","הַכְנָסַת אוֹרְחִים","הֶחָפֵץ חַיִּים בּוֹדֵק אֶת הַמִּטָּה","אוֹרֵחַ עָיֵף בַּגֶּשֶׁם, זָקֵן שֶׁטָּרַח בְּעַצְמוֹ לִבְדֹּק אִם הַמִּטָּה נוֹחָה, וְהַשְּׁאֵלָה שֶׁל מְאָרֵחַ טוֹב: מָה הָיִיתִי רוֹצֶה","../midot/../halacha-quiz/orchim-12.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/orchim-12-b1.webp"],["midot","הַכְנָסַת אוֹרְחִים","הַגְּר״א וְהַפַּרְוָה","לַיְלָה קַר אֵצֶל רַב זָקֵן, פַּרְוָה שֶׁנִּפְרֶמֶת, וְהַלֶּקַח: מְאָרֵחַ טוֹב רוֹאֶה אֶת הָעוֹלָם דֶּרֶךְ הָעֵינַיִם שֶׁל הָאוֹרֵחַ","../midot/../halacha-quiz/orchim-13.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/orchim-13-b1.webp"],["midot","הַכְנָסַת אוֹרְחִים","רַבִּי חַיִּים מִבְּרִיסְק – הַדֶּלֶת פְּתוּחָה","אוֹרֵחַ שֶׁלָּקַח כֵּלִים, אַרְבָּעִים חַיָּלִים בְּעֶרֶב סֻכּוֹת, וְהַהַגְבָּהָה שֶׁל רַבִּי חַיִּים: לָמָּה הַדֶּלֶת צְרִיכָה לִהְיוֹת פְּתוּחָה לְכָל אֶחָד","../midot/../halacha-quiz/orchim-14.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/orchim-14-b1.webp"],["midot","הַכְנָסַת אוֹרְחִים","הַמִּטָּה שֶׁל הַגְּדוֹלִים","אֵיךְ גְּדוֹלֵי יִשְׂרָאֵל וִתְּרוּ עַל הַמִּטָּה שֶׁלָּהֶם בִּשְׁבִיל אוֹרֵחַ, וּמָה אֲנִי יָכוֹל לְוַתֵּר עָלָיו","../midot/../halacha-quiz/orchim-15.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/orchim-15-b1.webp"],["midot","הַכְנָסַת אוֹרְחִים","הֶחָזוֹן אִישׁ – פָּטוּר מִן הַתְּפִלָּה, לֹא מֵהַכְנָסַת אוֹרְחִים","לָמָּה הָאוֹרֵחַ אֵינוֹ מַטְרִיחַ, מָה פֵּרוּשׁ ׳אֶתְרוֹג׳ וּמָה מְחַפְּשִׂים כְּשֶׁאֶפְשָׁר לְהִפָּטֵר","../midot/../halacha-quiz/orchim-16.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/orchim-16-b1.webp"],["midot","הַכְנָסַת אוֹרְחִים","אוֹרֵחַ בְּכָל אֲרוּחָה","אֵיךְ גְּדוֹלֵי יִשְׂרָאֵל לֹא אָכְלוּ לְבַד, וּמִי יוֹשֵׁב לְבַד אֶצְלֵנוּ בַּהֲפְסָקָה","../midot/../halacha-quiz/orchim-17.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/orchim-17-b1.webp"],["midot","הַכְנָסַת אוֹרְחִים","לְלַוּוֹת אֶת הָאוֹרֵחַ","לָמָּה יוֹצְאִים עִם הָאוֹרֵחַ מִן הַבַּיִת, כַּמָּה הוֹלְכִים אִתּוֹ, וְאֵיךְ גַּם טֶלֶפוֹן הוּא לְוָיָה","../midot/../halacha-quiz/orchim-18.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/orchim-18-b1.webp"],["midot","הַכְנָסַת אוֹרְחִים","הַזְמָנָה בַּדֶּרֶךְ","אֵיךְ אָדָם שֶׁהַכְנָסַת אוֹרְחִים הִיא חֵלֶק מִנִּשְׁמָתוֹ חוֹשֵׁב עַל הָאוֹרֵחַ גַּם בְּרֶגַע קָשֶׁה, וּמָה מְשַׁחְרֵר אֶת הַלֵּב לְהִתְעַנְיֵן בַּאֲחֵרִים","../midot/../halacha-quiz/orchim-19.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/orchim-19-b1.webp"],["midot","הַכְנָסַת אוֹרְחִים","הַדִּירָה שֶׁל סָבָא","אֵיךְ דִּירָה רֵיקָה נַעֲשֵׂית בַּיִת פָּתוּחַ לָאוֹרְחִים, מָה לָמַדְנוּ מִן הַפּוֹנְדָּק בְּתַחֲנַת הָרַכֶּבֶת, וְאֵיךְ כָּל הָעוֹלָם הוּא בֵּית הַאֲרָחָה","../midot/../halacha-quiz/orchim-20.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/orchim-20-b1.webp"],["midot","צְדָקָה וּנְתִינָה","מַהִי צְדָקָה?","לָמָּה צְדָקָה אֵינָהּ ׳לָתֵת מִשֶּׁלִּי׳, מָה מְסֻתָּר בָּאוֹתִיּוֹת שֶׁל הַמִּלָּה, וְאֵיךְ נוֹתְנִים מִתּוֹךְ הוֹדָיָה","../midot/../halacha-quiz/tzedaka-01.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/tzedaka-01-b1.webp"],["midot","צְדָקָה וּנְתִינָה","תֶּן לוֹ מִשֶּׁלּוֹ – רַבִּי אֶלְעָזָר אִישׁ בַּרְתּוֹתָא","הַגַּבָּאִים בּוֹרְחִים, הַיְתוֹמִים קוֹדְמִים, וּמַחְסָן אֶחָד מִתְמַלֵּא בְּחִטָּה","../midot/../halacha-quiz/tzedaka-02.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/tzedaka-02-b1.webp"],["midot","צְדָקָה וּנְתִינָה","צְדָקָה תַּצִּיל מִמָּוֶת – בַּת רַבִּי עֲקִיבָא","עָנִי בַּפֶּתַח, סִיכָּה בַּקִּיר, וְהַנֵּס שֶׁל הַמַּעֲשֶׂה הַקָּטָן","../midot/../halacha-quiz/tzedaka-03.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/tzedaka-03-b1.webp"],["midot","צְדָקָה וּנְתִינָה","בְּלִי לְהַלְבִּין פָּנִים – הַצְּרוֹר וְהַנָּחָשׁ","פּוֹעֵל אֶחָד אָסַף לֶחֶם מִכֻּלָּם, וְהָעָנִי אָכַל בְּכָבוֹד – וְנִמְצָא נָחָשׁ חָתוּךְ בַּצְּרוֹר","../midot/../halacha-quiz/tzedaka-04.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/tzedaka-04-b1.webp"],["midot","צְדָקָה וּנְתִינָה","דֵּי מַחְסוֹרוֹ – רָבָא וְקֻפַּת הַצְּדָקָה","מָה בִּקֵּשׁ עָנִי מִקֻּפַּת הַצְּדָקָה, לָמָּה רָבָא הִתְלַבֵּט, וְאֵיךְ בָּאָה הַתְּשׁוּבָה בְּדִיּוּק בַּזְּמַן","../midot/../halacha-quiz/tzedaka-05.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/tzedaka-05-b1.webp"],["midot","צְדָקָה וּנְתִינָה","מַתָּן בַּסֵּתֶר – הַדִּינָר שֶׁל רַבִּי שִׁמְעוֹן בַּר בָּא","אֵיךְ עוֹזְרִים לְחָבֵר בְּלִי לְהַבִּיךְ אוֹתוֹ, מָה לָמַדְנוּ מִשְּׁנֵי חֲכָמִים גְּדוֹלִים, וּמָה אוֹמֵר הָרַמְבַּ״ם","../midot/../halacha-quiz/tzedaka-06.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/tzedaka-06-b1.webp"],["midot","צְדָקָה וּנְתִינָה","הַדּוֹרוֹן שֶׁל הַקָּדוֹשׁ בָּרוּךְ הוּא","לָמָּה הַזֹּהַר קוֹרֵא לֶעָנִי דּוֹרוֹן, מָה הוּא חוּט הַחֶסֶד, וְאֵיךְ חֹדֶשׁ שֶׁל שְׂכִירוּת חָזַר בְּרָכָה","../midot/../halacha-quiz/tzedaka-07.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/tzedaka-07-b1.webp"],["midot","צְדָקָה וּנְתִינָה","גַּם הֶעָנִי נוֹתֵן","מַר זוּטְרָא אוֹמֵר: גַּם מִי שֶׁמְּקַבֵּל עֶזְרָה יָכוֹל לָתֵת. מָשָׁל הַזּוֹרֵעַ, הַגּוּף הַמִּתְחַדֵּשׁ וְהַבִּטָּחוֹן בַּה׳","../midot/../halacha-quiz/tzedaka-08.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/tzedaka-08-b1.webp"],["midot","צְדָקָה וּנְתִינָה","לְשַׂמֵּחַ אֶת הַמְּקַבֵּל","הָאַדְמוֹ״ר מִסְּטוֹלִין נָתַן עֶשְׂרִים וְתִשְׁעָה אֶלֶף מִתּוֹךְ שְׁלוֹשִׁים, כְּדֵי שֶׁהַיְּהוּדִי יֵצֵא שָׂמֵחַ בִּשְׁלֵמוּת","../midot/../halacha-quiz/tzedaka-09.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/tzedaka-09-b1.webp"],["midot","צְדָקָה וּנְתִינָה","עַשֵּׂר בִּשְׁבִיל שֶׁתִּתְעַשֵּׁר","הַגִּזְבָּר הַנֶּאֱמָן שׁוֹמֵר עַל אוֹצָר שֶׁאֵינוֹ שֶׁלּוֹ, וְכָךְ הוּא מִתְקַדֵּם: מַעֲשֵׂר, חֹמֶשׁ וְקֻפַּת צְדָקָה","../midot/../halacha-quiz/tzedaka-10.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/tzedaka-10-b1.webp"],["midot","שָׁלוֹם וְוִתּוּר","מִתַּלְמִידָיו שֶׁל אַהֲרֹן","מִי הָיָה אַהֲרֹן הַכֹּהֵן, אֵיךְ עָשָׂה שָׁלוֹם בֵּין חֲבֵרִים שֶׁרָבוּ, וְאֵיךְ גַּם אֲנִי יָכוֹל לִהְיוֹת רוֹדֵף שָׁלוֹם","../midot/../halacha-quiz/shalom-01.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/shalom-01-b1.webp"],["midot","שָׁלוֹם וְוִתּוּר","גָּדוֹל הַשָּׁלוֹם","לָמָּה הַשָּׁלוֹם הוּא הַכְּלִי שֶׁמַּחֲזִיק אֶת הַבְּרָכָה, וְאֵיךְ מְסַיְּמִים בּוֹ תְּפִלָּה וּבְרָכוֹת","../midot/../halacha-quiz/shalom-02.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/shalom-02-b1.webp"],["midot","שָׁלוֹם וְוִתּוּר","שָׁלוֹם זֶה יוֹתֵר מִ״לֹא רָבִים״","לָמָּה שָׁלוֹם הוּא אַהֲבָה וְלֹא רַק שֶׁאֵין רִיב, וְאֵיךְ מוֹסִיפִים אוֹתוֹ בְּכָל יוֹם","../midot/../halacha-quiz/shalom-03.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/shalom-03-b1.webp"],["midot","שָׁלוֹם וְוִתּוּר","מְשַׁנִּים מִפְּנֵי הַשָּׁלוֹם","לָמָּה ה׳ שִׁנָּה אֶת דִּבְרֵי שָׂרָה, וְאֵיךְ לוֹמְדִים לְדַבֵּר אֱמֶת בַּעֲדִינוּת","../midot/../halacha-quiz/shalom-04.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/shalom-04-b1.webp"],["midot","שָׁלוֹם וְוִתּוּר","רַבִּי חֲנִינָא וְהַכִּסֵּא הָרֵיק","מָה עָשָׂה רַבִּי חֲנִינָא כְּשֶׁקִּבֵּל אֶת הַמִּשְׂרָה הַגְּדוֹלָה, לָמָּה הַוִּתּוּר שֶׁלּוֹ לֹא הָיָה הֶפְסֵד, וְאֵיךְ גַּם אֲנִי יָכוֹל לְוַתֵּר","../midot/../halacha-quiz/shalom-05.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/shalom-05-b1.webp"],["midot","שָׁלוֹם וְוִתּוּר","מִיֶּתֶר לְיִתְרוֹ","אֵיךְ הַוִּתּוּר שֶׁל יִתְרוֹ נֶהֱפַךְ לְיִתְרוֹן, לָמָּה הַתּוֹרָה נִתְּנָה עַל הַהַר הַנָּמוּךְ, וּמָה אֲנִי מַרְוִיחַ כְּשֶׁאֲנִי מְוַתֵּר","../midot/../halacha-quiz/shalom-06.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/shalom-06-b1.webp"],["midot","שָׁלוֹם וְוִתּוּר","סֻכָּה – בַּיִת שֶׁל וִתּוּר","לָמָּה הַסֻּכָּה הִיא סֵמֶל שֶׁל שָׁלוֹם, מָה אֶפְשָׁר לְוַתֵּר עָלָיו בַּבַּיִת וּבַכִּתָּה, וְאֵיךְ הַחַיִּים הֵם מַתָּנָה","../midot/../halacha-quiz/shalom-07.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/shalom-07-b1.webp"],["midot","שָׁלוֹם וְוִתּוּר","וְלֹא יִהְיֶה כְקֹרַח","מָה לָקַח קֹרַח, לָמָּה אַחְדוּת שֶׁל ׳רַק נֶגֶד׳ אֵינָהּ אַחְדוּת, וְאֵיךְ אוֹהֲבִים גַּם כְּשֶׁחוֹלְקִים","../midot/../halacha-quiz/shalom-08.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/shalom-08-b1.webp"],["midot","שָׁלוֹם וְוִתּוּר","מֹשֶׁה קָם וְהוֹלֵךְ","מֹשֶׁה לֹא חִכָּה שֶׁיָּבוֹאוּ אֵלָיו – הוּא הָלַךְ לְפַיֵּס. מָה לוֹמְדִים מִזֶּה, וּמָה לוֹמְדִים מִשְּׁתִיקָתוֹ שֶׁל אַהֲרֹן","../midot/../halacha-quiz/shalom-09.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/shalom-09-b1.webp"],["midot","שָׁלוֹם וְוִתּוּר","מָתַי מְוַתְּרִים וּמָתַי עוֹמְדִים","עַל מָה אֶפְשָׁר לְוַתֵּר, עַל מָה לֹא, וְאֵיךְ חוֹלְקִים בְּשָׁלוֹם בְּאַרְבָּעָה סִימָנִים","../midot/../halacha-quiz/shalom-10.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/shalom-10-b1.webp"],["midot","אַהֲבַת יִשְׂרָאֵל","הַבֹּרֶג הַקָּטָן וְהַמְּכוֹנָה","אֲפִלּוּ קָטָן חָשׁוּב: אֵיךְ אֲנִי חֵלֶק מִמְּכוֹנָה גְּדוֹלָה, מָה בָּאָרוֹן וּמָה מֵעָלָיו, וְאֵיךְ מִתְחַבְּרִים לְעַם יִשְׂרָאֵל","../midot/../halacha-quiz/reim-01.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/reim-01-b1.webp"],["midot","אַהֲבַת יִשְׂרָאֵל","אֲגֻדָּה אַחַת שֶׁל אַרְבָּעָה מִינִים","שׁוֹנִים וְיַחַד: טַעַם וְרֵיחַ, אַהֲבָה שָׁוָה אֶחָד, וְסֻכַּת שָׁלוֹם","../midot/../halacha-quiz/reim-02.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/reim-02-b1.webp"],["midot","אַהֲבַת יִשְׂרָאֵל","הַזָּקֵן וְהָעֲנָפִים","שְׁלֹשָׁה בָּנִים חֲזָקִים, עָנָף אֶחָד שֶׁנִּשְׁבַּר וַאֲגֻדָּה שֶׁלֹּא נִשְׁבְּרָה: סִפּוּר עַל אַחְדוּת","../midot/../halacha-quiz/reim-03.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/reim-03-b1.webp"],["midot","אַהֲבַת יִשְׂרָאֵל","נְשָׁמָה אַחַת","נְשָׁמָה אֱלוֹקִית בְּכָל יְהוּדִי, שֹׁרֶשׁ אֶחָד, נְפָשׁוֹת קְשׁוּרוֹת וּמָחוֹל שֶׁל צַדִּיקִים","../midot/../halacha-quiz/reim-04.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/reim-04-b1.webp"],["midot","אַהֲבַת יִשְׂרָאֵל","אֵיךְ אֶשָּׂא עֵינַי וְאֶרְאֶה אֶת אַהֲרֹן?","שָׁלוֹם בְּחִיּוּךְ לְכָל אֶחָד, גַּם לְמִי שֶׁטָּעָה, וְכָךְ מַדְלִיקִים אֶת הַנְּשָׁמוֹת","../midot/../halacha-quiz/reim-05.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/reim-05-b1.webp"],["midot","אַהֲבַת יִשְׂרָאֵל","קַמְצָא וּבַר קַמְצָא – מָה אֶפְשָׁר הָיָה לַעֲשׂוֹת?","סְעוּדָה שֶׁהִתְבַּלְבְּלָה, חֲכָמִים שֶׁשָּׁתְקוּ, וְאַהֲבַת חִנָּם שֶׁבּוֹנָה מֵחָדָשׁ","../midot/../halacha-quiz/reim-06.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/reim-06-b1.webp"],["midot","אַהֲבַת יִשְׂרָאֵל","מִשִּׂנְאַת חִנָּם לֶאֱהָבַת חִנָּם","מָה אֲנִי יוֹדֵעַ בְּוַדַּאי, מָה אֲנִי מַשְׁלִים בְּעַצְמִי, וְאֵיךְ בּוֹנִים גֶּשֶׁר","../midot/../halacha-quiz/reim-07.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/reim-07-b1.webp"],["midot","אַהֲבַת יִשְׂרָאֵל","רֵעֲךָ – מַעֲמִיקִים אֶת הָאַהֲבָה","לָמָּה כָּתוּב ׳רֵעֲךָ׳ וְלֹא ׳אָחִיךָ׳, אֵיךְ מַעֲמִיקִים אֶת הָאַהֲבָה לַחָבֵר הַקָּרוֹב, וְאֵיךְ בּוֹנִים לֵב שֶׁיּוֹדֵעַ לֶאֱהֹב","../midot/../halacha-quiz/reim-08.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/reim-08-b1.webp"],["midot","אַהֲבַת יִשְׂרָאֵל","וַאֲהַבְתֶּם אֶת הַגֵּר","מִי הוּא גֵּר, לָמָּה יֵשׁ מִצְוָה מְיֻחֶדֶת לֶאֱהֹב אוֹתוֹ, וּמָה לָמַדְנוּ מִסִּפּוּר עֲקִילַס וְרַבִּי יְהוֹשֻׁעַ","../midot/../halacha-quiz/reim-09.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/reim-09-b1.webp"],["midot","אַהֲבַת יִשְׂרָאֵל","בְּרָכָה, תְּפִלָּה וְאַהֲבַת יִשְׂרָאֵל","אֵיךְ אַהֲרֹן הַכֹּהֵן בֵּרַךְ אֶת עַם יִשְׂרָאֵל בְּאַהֲבָה, וְאֵיךְ מִתְחַבְּרִים לְכָל הָעָם בִּבְרָכָה וּבִתְפִלָּה","../midot/../halacha-quiz/reim-10.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/reim-10-b1.webp"],["midot","כְּבוֹד הַבְּרִיּוֹת","מַהוּ כָּבוֹד?","כָּבוֹד מַתְחִיל בַּלֵּב: כָּל אָדָם בֵּן שֶׁל מֶלֶךְ, וּבְכָל אֶחָד יֵשׁ מַעֲלָה שֶׁרָאוּי לְהַעֲרִיךְ","../midot/../halacha-quiz/kavod-01.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/kavod-01-b1.webp"],["midot","כְּבוֹד הַבְּרִיּוֹת","אֵיזֶהוּ מְכֻבָּד?","הַמְכַבֵּד אֶת הַבְּרִיּוֹת נַעֲשֶׂה מְכֻבָּד: צֶלֶם אֱלֹהִים, רַבֵּנוּ יוֹנָה וְהָרַב אַרְיֵה לֵוִין","../midot/../halacha-quiz/kavod-02.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/kavod-02-b1.webp"],["midot","כְּבוֹד הַבְּרִיּוֹת","לֵךְ לָאֻמָּן שֶׁעֲשָׂאַנִי","הָאִישׁ הַמְכֻעָּר וְרַבִּי אֶלְעָזָר: גַּאֲוָה, בִּזָּיוֹן, בַּקָּשַׁת סְלִיחָה, וְרַךְ כְּקָנֶה","../midot/../halacha-quiz/kavod-03.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/kavod-03-b1.webp"],["midot","כְּבוֹד הַבְּרִיּוֹת","לֹא מְבַיְּשִׁים","הַלְבָּנַת פָּנִים, גָּדוֹל כְּבוֹד הַבְּרִיּוֹת, וְהַכֹּהֵן הַגָּדוֹל: אֵיךְ שׁוֹמְרִים עַל כְּבוֹד הֶחָבֵר","../midot/../halacha-quiz/kavod-04.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/kavod-04-b1.webp"],["midot","כְּבוֹד הַבְּרִיּוֹת","חָס הַמָּקוֹם עַל כְּבוֹדָן שֶׁל בְּרִיּוֹת","מָה הַגַּנָּב וְהַשֶּׂה מְלַמְּדִים עַל כָּבוֹד, וְאֵיךְ שׁוֹמְרִים עַל כְּבוֹד מִי שֶׁטָּעָה","../midot/../halacha-quiz/kavod-05.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/kavod-05-b1.webp"],["midot","כְּבוֹד הַבְּרִיּוֹת","פָּרָשָׁה לְכָל נָשִׂיא","לָמָּה כָּתְבָה הַתּוֹרָה שִׁבְעִים וּשְׁנַיִם פְּסוּקִים עַל קָרְבְּנוֹת הַנְּשִׂיאִים, וְאֵיךְ נוֹתְנִים כָּבוֹד לְכָל אֶחָד","../midot/../halacha-quiz/kavod-06.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/kavod-06-b1.webp"],["midot","כְּבוֹד הַבְּרִיּוֹת","כָּבוֹד לְחַבְרֵי הַתּוֹרָה","לָמָּה מְכַבְּדִים אֶת הַחֶבְרוּתָא וְאֶת הָרַב, מָה קָרָה לְתַלְמִידֵי רַבִּי עֲקִיבָא, וּמָה עוֹשִׂים כְּדֵי לְכַבֵּד","../midot/../halacha-quiz/kavod-07.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/kavod-07-b1.webp"],["midot","כְּבוֹד הַבְּרִיּוֹת","הָרַב קְלֵירְס וְהָעֵרוּב","אֵיךְ מְתַקְּנִים טָעוּת בְּלִי לְבַיֵּשׁ אֶת מִי שֶׁטָּעָה, וּמָה אָמַר רַבִּי מֹשֶׁה עַל כְּבוֹד הַתּוֹרָה וּכְבוֹד הַבְּרִיּוֹת","../midot/../halacha-quiz/kavod-08.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/kavod-08-b1.webp"],["midot","כְּבוֹד הַבְּרִיּוֹת","כְּבוֹד שָׁמַיִם וְכְבוֹד הַמִּצְווֹת","מָה זֶה כָּבוֹד לַקָּדוֹשׁ בָּרוּךְ הוּא, וְאֵיךְ אֶפְשָׁר לְכַבֵּד מִצְווֹת בְּשִׂמְחָה, בַּזְּמַן וּבְהִדּוּר","../midot/../halacha-quiz/kavod-09.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/kavod-09-b1.webp"],["midot","כְּבוֹד הַבְּרִיּוֹת","כָּל אָדָם גָּדוֹל מִמְּךָ","מָה אָמַר הָרַמְבַּ״ן עַל כְּבוֹד כָּל אָדָם, וְלָמָּה ׳כָּבוֹד׳ בְּגִימַטְרִיָּה ׳לֵב׳","../midot/../halacha-quiz/kavod-10.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/kavod-10-b1.webp"],["midot","דָּן לְכַף זְכוּת","הֱוֵי דָּן אֶת חֲבֵרְךָ לְכַף זְכוּת","מָה הִיא הַמִּצְוָה, מָה פֵּרוּשׁ ׳כַּף זְכוּת׳, וְאֵיךְ בּוֹחֲרִים הֶסְבֵּר טוֹב לְמַעֲשֶׂה שֶׁאֶפְשָׁר לְהָבִין בִּשְׁתֵּי דְּרָכִים","../midot/../halacha-quiz/zechut-01.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/zechut-01-b1.webp"],["midot","דָּן לְכַף זְכוּת","תַּלְמִידֵי רַבִּי יְהוֹשֻׁעַ","שְׁלוֹשָׁה מַעֲשִׂים מוּזָרִים שֶׁל הָרַב, שְׁלוֹשָׁה הֶסְבֵּרִים טוֹבִים שֶׁל הַתַּלְמִידִים, וּבְרָכָה אַחַת","../midot/../halacha-quiz/zechut-02.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/zechut-02-b1.webp"],["midot","דָּן לְכַף זְכוּת","הַמַּגָּשׁ שֶׁנֶּעֱלַם","הִלֵּל וְאִשְׁתּוֹ, חָתָן עָנִי וְאוֹרֵחַ רָעֵב – וּשְׁנֵי מַעֲשִׂים שֶׁל כַּף זְכוּת בְּבַיִת אֶחָד","../midot/../halacha-quiz/zechut-03.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/zechut-03-b1.webp"],["midot","דָּן לְכַף זְכוּת","מַטְבֵּעַ מַחֲצִית הַשֶּׁקֶל","תַּלְמִידֵי חֲכָמִים בִּסְעוּדָה, מַטְבֵּעַ שֶׁנֶּעֱלַם, רַב זָקֵן שֶׁמְּסָרֵב – וְהָאֱמֶת שֶׁהִתְבָּרְרָה אַחַר כָּךְ","../midot/../halacha-quiz/zechut-04.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/zechut-04-b1.webp"],["midot","דָּן לְכַף זְכוּת","כְּשֵׁם שֶׁאַתָּה דָּן","מָה לָמַד הַבַּעַל שֵׁם טוֹב מִמָּשָׁל שֶׁל נָתָן הַנָּבִיא, וְאֵיךְ דָּנִים אוֹתִי כְּמוֹ שֶׁאֲנִי דָּן אֶת חֲבֵרִי","../midot/../halacha-quiz/zechut-05.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/zechut-05-b1.webp"],["midot","דָּן לְכַף זְכוּת","אַל תָּדִין עַד שֶׁתַּגִּיעַ לִמְקוֹמוֹ","מָה לָמַד הִלֵּל, הַבַּעַל שֵׁם טוֹב וְהַשִּׁעוּר: אֵיךְ מְבִינִים חָבֵר לִפְנֵי שֶׁדָּנִים אוֹתוֹ","../midot/../halacha-quiz/zechut-06.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/zechut-06-b1.webp"],["midot","דָּן לְכַף זְכוּת","וְהֵן לֹא יַאֲמִינוּ לִי","מָה לָמַד מֹשֶׁה רַבֵּנוּ מֵהַנָּחָשׁ וְהַיָּד הַלְּבָנָה, וְלָמָּה אָסוּר לַחֲשֹׁד בִּכְשֵׁרִים","../midot/../halacha-quiz/zechut-07.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/zechut-07-b1.webp"],["midot","דָּן לְכַף זְכוּת","יֵשׁ הַרְבֵּה דְּרָכִים","לָמָּה כָּל אֶחָד בָּטוּחַ שֶׁדַּרְכּוֹ נְכוֹנָה, מָה לָמַדְנוּ מֵהַחֵילוֹת בַּצָּבָא, וְאֵיךְ מִסְתַּכְּלִים בְּעַיִן טוֹבָה עַל חָבֵר שֶׁעוֹשֶׂה אַחֶרֶת","../midot/../halacha-quiz/zechut-08.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/zechut-08-b1.webp"],["midot","דָּן לְכַף זְכוּת","עַיִן טוֹבָה אֵינָהּ עִוֶּרֶת","מָתַי דָּנִים לְכַף זְכוּת, מָתַי נִזְהָרִים, וְאֵיךְ בַּעַל עַיִן טוֹבָה חָכָם מְסַפֵּר לְמֻבְגָּר כְּשֶׁצָּרִיךְ","../midot/../halacha-quiz/zechut-09.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/zechut-09-b1.webp"],["midot","דָּן לְכַף זְכוּת","תְּפִלָּה וְנַחַת רוּחַ לַה׳","אֵיךְ מַחְשָׁבָה טוֹבָה עַל חָבֵר מְשַׂמַּחַת אֶת ה׳, מָה אוֹמֶרֶת הַתְּפִלָּה הַקְּצָרָה, וְאֵיךְ מִי שֶׁדָּן חֲבֵרִים לִזְכוּת יָכוֹל לְהַאֲמִין שֶׁה׳ עוֹשֶׂה לְטוֹבָה","../midot/../halacha-quiz/zechut-10.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/zechut-10-b1.webp"],["midot","אֱמוּנָה","מָה זֹאת אֱמוּנָה? ה׳ מַשְׁגִּיחַ עַל כָּל פְּרָט","הַמִּצְוָה הָרִאשׁוֹנָה בַּדִּבְּרוֹת, לָמָּה צָרִיךְ לְצַוּוֹת עָלֶיהָ, וְאֵיךְ מְזַהִים שֶׁהַכֹּל בָּא מֵה׳","../midot/../halacha-quiz/emunah-01.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/emunah-01-b1.webp"],["midot","אֱמוּנָה","הַלֵּב לֹא רוֹאֶה – אֵיךְ מְשַׁכְנְעִים אֶת הַלֵּב","שֵׂכֶל וְלֵב, לָמָּה הַלֵּב מַאֲמִין רַק לְמַה שֶׁרוֹאֶה, וְאֵיךְ מַחֲזִירִים אֶת הַיְדִיעָה אֶל הַלֵּב","../midot/../halacha-quiz/emunah-02.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/emunah-02-b1.webp"],["midot","אֱמוּנָה","״כֹּחִי וְעֹצֶם יָדִי״ – מִי הִצְלִיחַ?","כְּשֶׁמַּצְלִיחִים, מִי נָתַן לָנוּ אֶת הַכֹּחַ? נִסָּיוֹן הָעֹשֶׁר, גַּאֲוָה, וְהוֹדָיָה שֶׁבַּלֵּב","../midot/../halacha-quiz/emunah-03.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/emunah-03-b1.webp"],["midot","אֱמוּנָה","אֵין עוֹד מִלְּבַדּוֹ – הַצּוֹמֶת","מָשָׁל הַצּוֹמֶת, ׳ה׳ אֶחָד׳ וֶאֱלִיעֶזֶר בְּבֵית לָבָן: אַף אֶחָד לֹא יָכוֹל לַעֲשׂוֹת דָּבָר אִם ה׳ לֹא פָּתַח אֶת הַנָּתִיב","../midot/../halacha-quiz/emunah-04.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/emunah-04-b1.webp"],["midot","אֱמוּנָה","יַעֲקֹב וְלָבָן – ׳לָמָּה רִמִּיתָנִי׳ בְּלִי כַּעַס","לָמָּה יַעֲקֹב שָׁאַל בְּלִי כַּעַס, מָה אָמַר דָּוִד עַל מִי שֶׁקִּלֵּל אוֹתוֹ, וְלָמָּה הַכּוֹעֵס שׁוֹכֵחַ שֶׁהַכֹּל מֵה׳","../midot/../halacha-quiz/emunah-05.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/emunah-05-b1.webp"],["midot","אֱמוּנָה","יוֹסֵף – ׳לֹא אַתֶּם שְׁלַחְתֶּם אוֹתִי׳","מִי בֶּאֱמֶת שָׁלַח אֶת יוֹסֵף לְמִצְרַיִם, מַה פֵּרוּשׁ ׳בִּלְעָדָי אֱלֹהִים׳, וְאֵיךְ כָּל אֶחָד יָכוֹל לִהְיוֹת יוֹסֵף הַצַּדִּיק","../midot/../halacha-quiz/emunah-06.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/emunah-06-b1.webp"],["midot","אֱמוּנָה","נַחְשׁוֹן בַּיָּם – מַחֲשָׁבוֹת שֶׁל סָפֵק","מָה חָשְׁבוּ בְּנֵי יִשְׂרָאֵל עַל שְׂפַת הַיָּם, מַדּוּעַ נַחְשׁוֹן קָפַץ, וְאֵיךְ אוֹמְרִים ׳ה׳ אִתִּי׳ בִּשְׁעַת פַּחַד","../midot/../halacha-quiz/emunah-07.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/emunah-07-b1.webp"],["midot","אֱמוּנָה","אַחֲרֵי שֶׁטָּעִיתִי – קֶרֶשׁ קְפִיצָה","אֵיךְ חוֹשְׁבִים אַחֲרֵי טָעוּת: לֹא עֶצֶב, אֶלָּא קֶרֶשׁ קְפִיצָה, כִּי יֵשׁ לִי אַבָּא שֶׁרוֹצֶה בִּתְשׁוּבָה","../midot/../halacha-quiz/emunah-08.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/emunah-08-b1.webp"],["midot","אֱמוּנָה","לָמָּה כָּל שַׁבָּת? – מְחַזְּקִים שׁוּב","גַּם מִי שֶׁרָאָה נִסִּים שׁוֹכֵחַ, וְלָכֵן מְחַזְּקִים אֶת הָאֱמוּנָה שׁוּב וָשׁוּב: בְּשַׁבָּת, בִּקְרִיאַת שְׁמַע וּבְכָל יוֹם","../midot/../halacha-quiz/emunah-09.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/emunah-09-b1.webp"],["midot","אֱמוּנָה","לֹא לוֹקְחִים סִכּוּן – מְחַפְּשִׂים אֱמוּנָה","מְשַׁל הָרוֹפֵא וְהַתְּרוּפָה: בִּדְבָרִים הַחֲשׁוּבִים בֶּאֱמֶת לֹא לוֹקְחִים סִכּוּן, וְעוֹשִׂים חֶשְׁבּוֹן שֶׁל רֶוַח וָהֶפְסֵד","../midot/../halacha-quiz/emunah-10.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/emunah-10-b1.webp"],["midot","בִּטָּחוֹן בַּה׳","מַהוּ בִּטָּחוֹן?","לִהְיוֹת רָגוּעַ וְלֹא לִפְחֹד מַה יִּהְיֶה, כִּי יֵשׁ לִי אַבָּא טוֹב שֶׁאוֹהֵב אוֹתִי","../midot/../halacha-quiz/bitachon-01.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/bitachon-01-b1.webp"],["midot","בִּטָּחוֹן בַּה׳","׳וְצֹאן מַרְעִיתוֹ׳ – הָרוֹעֶה הַנֶּאֱמָן","ה׳ הוּא מֶלֶךְ, אָב וְרוֹעֶה: הוּא דּוֹאֵג לִי וּמַרְגִּישׁ אוֹתִי יוֹתֵר מִמֶּנִּי","../midot/../halacha-quiz/bitachon-02.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/bitachon-02-b1.webp"],["midot","בִּטָּחוֹן בַּה׳","עָשִׁיר וְעָנִי – פַּת בַּסַּל","מִי עָשִׁיר? הַשָּׂמֵחַ בְּחֶלְקוֹ, שֶׁיּוֹדֵעַ שֶׁה׳ דּוֹאֵג לוֹ גַּם לְמָחָר","../midot/../halacha-quiz/bitachon-03.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/bitachon-03-b1.webp"],["midot","בִּטָּחוֹן בַּה׳","מַה יַּעֲשֶׂה אָדָם לִי?","אַף אָדָם לֹא יָכוֹל לְהָרַע לִי בְּלִי רְצוֹן ה׳, אָז מַפְנִים אֶת הַלֵּב אֶל ה׳","../midot/../halacha-quiz/bitachon-04.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/bitachon-04-b1.webp"],["midot","בִּטָּחוֹן בַּה׳","הַקֶּרֶשׁ בֵּין הַגַּגּוֹת","לָמָּה הַפַּחַד מַפִּיל, מָה מֻתָּר וּמָה אָסוּר לַעֲשׂוֹת עִם פַּחַד, וְאֵיךְ בִּטָּחוֹן בַּה׳ מַרְגִּיעַ","../midot/../halacha-quiz/bitachon-05.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/bitachon-05-b1.webp"],["midot","בִּטָּחוֹן בַּה׳","בְּצֵל קוֹרָתִי – חוֹסִים וּבוֹטְחִים","מָה הַהֶבְדֵּל בֵּין לַחֲסוֹת לִבְטֹחַ, מָה אָמַר לוֹט, וְלָמָּה הַבּוֹטֵחַ בַּה׳ חֶסֶד מְסוֹבֵב אוֹתוֹ","../midot/../halacha-quiz/bitachon-06.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/bitachon-06-b1.webp"],["midot","בִּטָּחוֹן בַּה׳","בָּרוּךְ גּוֹזֵר וּמְקַיֵּם","הַסִּפּוּר עַל הָאַבְרֵךְ בַּצִּינוֹק, שְׁנֵי הַפֵּרוּשִׁים שֶׁל ׳מְקַיֵּם׳, וְהַכֹּחַ שֶׁה׳ נוֹתֵן יַחַד עִם הַקֹּשִׁי","../midot/../halacha-quiz/bitachon-07.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/bitachon-07-b1.webp"],["midot","בִּטָּחוֹן בַּה׳","כִּי בוֹ יִשְׂמַח לִבֵּנוּ","אֵיךְ הַבִּטָּחוֹן מֵבִיא שִׂמְחָה, אֵיךְ בּוֹדְקִים אֶת ׳מַד הַבִּטָּחוֹן׳, וְלָמָּה לֵב שָׂמֵחַ מוּכָן לְקַבֵּל מֵה׳","../midot/../halacha-quiz/bitachon-08.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/bitachon-08-b1.webp"],["midot","בִּטָּחוֹן בַּה׳","מִבְחֲנֵי בִּטָּחוֹן קְטַנִּים","מָה עוֹשִׂים כְּשֶׁהָאוֹטוֹבּוּס נָסַע, הַמִּשְׁקָפַיִם נִשְׁבְּרוּ אוֹ חָבֵר לֹא רוֹצֶה – וְאֵיךְ מִתְאַמְּנִים בְּרוֹגַע כָּל יוֹם","../midot/../halacha-quiz/bitachon-09.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/bitachon-09-b1.webp"],["midot","בִּטָּחוֹן בַּה׳","מִי שֶׁבּוֹטֵחַ לֹא שׂוֹנֵא","אֵיךְ מַחֲשָׁבָה ׳הוּא לָקַח לִי׳ מְבִיאָה שִׂנְאָה, אֵיךְ הַבִּטָּחוֹן מַפְסִיק אוֹתָהּ, וְלָמָּה ׳יֵשׁ לִי אַבָּא טוֹב׳ מַסְפִּיק","../midot/../halacha-quiz/bitachon-10.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/bitachon-10-b1.webp"],["midot","יִרְאַת שָׁמַיִם","מָה זֹאת יִרְאַת שָׁמַיִם?","יִרְאַת שָׁמַיִם הִיא לֹא רַק פַּחַד: הִיא לְהַרְגִּישׁ שֶׁה׳ כָּאן לְיָדִי, וְאֶפְשָׁר לְדַבֵּר אִתּוֹ","../midot/../halacha-quiz/yira-01.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/yira-01-b1.webp"],["midot","יִרְאַת שָׁמַיִם","סֻלָּם הַיִּרְאָה","שָׁלוֹשׁ מַדְרֵגוֹת: יִרְאַת הָעֹנֶשׁ, יִרְאַת הָרוֹמְמוּת וְיִרְאַת הַחֶסֶד, וְאִי אֶפְשָׁר לְדַלֵּג עַל הָרִאשׁוֹנָה","../midot/../halacha-quiz/yira-02.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/yira-02-b1.webp"],["midot","יִרְאַת שָׁמַיִם","עַיִן רוֹאָה וְאֹזֶן שׁוֹמַעַת","שְׁלוֹשָׁה דְּבָרִים שֶׁשּׁוֹמְרִים עָלֵינוּ: עַיִן רוֹאָה, אֹזֶן שׁוֹמַעַת וְסֵפֶר שֶׁכּוֹתֵב. הֵם לֹא בָּאִים לְהַפְחִיד, אֶלָּא לְהַזְכִּיר שֶׁאֲנַחְנוּ לֹא לְבַד","../midot/../halacha-quiz/yira-03.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/yira-03-b1.webp"],["midot","יִרְאַת שָׁמַיִם","חֶשְׁבּוֹן שֶׁל רֶוַח וְהֶפְסֵד","מִצְוָה קַלָּה כַּחֲמוּרָה, מֹאזְנַיִם שֶׁל שָׂכָר מוּל הֶפְסֵד, וְחֶשְׁבּוֹן לִפְנֵי כׇּל בְּחִירָה","../midot/../halacha-quiz/yira-04.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/yira-04-b1.webp"],["midot","יִרְאַת שָׁמַיִם","׳מָה׳ אוֹ ׳מֵאָה׳?","אֵיךְ מֵאָה בְּרָכוֹת בְּיוֹם מְקָרְבוֹת אוֹתָנוּ לְיִרְאַת שָׁמַיִם, וְאֵיךְ מְחַלְּקִים כָּל בְּרָכָה לִשְׁלוֹשָׁה חֲלָקִים","../midot/../halacha-quiz/yira-05.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/yira-05-b1.webp"],["midot","יִרְאַת שָׁמַיִם","עֵצִים בַּבֹּקֶר בַּבֹּקֶר","אֵיךְ מְעוֹרְרִים אֶת הַיִּרְאָה וְהָאַהֲבָה בְּכָל בֹּקֶר מֵחָדָשׁ, כְּמוֹ הַכֹּהֵן שֶׁהִבְעִיר עֵצִים עַל הַמִּזְבֵּחַ","../midot/../halacha-quiz/yira-06.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/yira-06-b1.webp"],["midot","יִרְאַת שָׁמַיִם","יִרְאַת הָרוֹמְמוּת – לֹא רוֹצִים לְהַפְסִיד אֶת הַקִּרְבָה","מִפַּחַד מֵעֹנֶשׁ אֶל פַּחַד לְהַפְסִיד אֶת הַקִּרְבָה לַה׳, וְאֵיךְ בָּאִים מִיִּרְאָה לְאַהֲבָה","../midot/../halacha-quiz/yira-07.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/yira-07-b1.webp"],["midot","יִרְאַת שָׁמַיִם","יִרְאָה שֶׁמְּבִיאָה שִׂמְחָה","אֵיךְ יִצְחָק הָיָה גַּם צְחוֹק וְגַם פַּחַד, וְלָמָּה יִרְאַת הָרוֹמְמוּת מְשַׂמַּחַת","../midot/../halacha-quiz/yira-08.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/yira-08-b1.webp"],["midot","יִרְאַת שָׁמַיִם","שִׁוִּיתִי ה׳ לְנֶגְדִּי תָמִיד","לָמָּה הָרֶמָ״א פָּתַח בְּ׳שִׁוִּיתִי׳ וְסִיֵּם בְּ׳טוֹב לֵב מִשְׁתֶּה תָמִיד׳, וְאֵיךְ אֶפְשָׁר לִהְיוֹת שָׂמֵחַ כָּל הַשָּׁנָה","../midot/../halacha-quiz/yira-09.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/yira-09-b1.webp"],["midot","יִרְאַת שָׁמַיִם","חָבֵר שֶׁמְּדַבֵּר עַל ה׳","הָעֵצָה שֶׁל רַבֵּנוּ יוֹנָה וּתְפִלָּתוֹ שֶׁל רַבִּי נַחְמָן: חֲבֵרִים שֶׁמְּחַזְּקִים זֶה אֶת זֶה בְּיִרְאַת שָׁמַיִם","../midot/../halacha-quiz/yira-10.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/yira-10-b1.webp"],["midot","תְּפִלָּה מִן הַלֵּב","׳אֱלֹהִים קְרֹבִים אֵלָיו׳ – אַבָּא, אֲנִי כָּאן","מָה פֵּרוּשׁ ׳בְּכָל קָרְאֵנוּ אֵלָיו׳, אֵיךְ מַרְגִּישִׁים שֶׁה׳ קָרוֹב, וְלָמָּה כְּדַאי לִקְרֹא לוֹ כָּל יוֹם","../midot/../halacha-quiz/lev-01.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/lev-01-b1.webp"],["midot","תְּפִלָּה מִן הַלֵּב","יוֹסֵף – ׳מְלַחֵשׁ וְנִכְנָס׳","אֵיךְ הִצְלִיחַ יוֹסֵף בְּכָל מַעֲשָׂיו, לָמָּה שֵׁם שָׁמַיִם הָיָה שָׁגוּר בְּפִיו, וְאֵיךְ מְבַקְּשִׁים מֵה׳ לִפְנֵי כָּל דָּבָר","../midot/../halacha-quiz/lev-02.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/lev-02-b1.webp"],["midot","תְּפִלָּה מִן הַלֵּב","שִׂיחָה, לֹא טֶקְסְט – בַּמִּלִּים שֶׁלִּי","מָה פֵּרוּשׁ ׳וְלִפְנֵי ה׳ יִשְׁפֹּךְ שִׂיחוֹ׳, אֵיךְ מְדַבְּרִים עִם ה׳ בַּמִּלִּים שֶׁלִּי, וְלָמָּה אֶפְשָׁר לְבַקֵּשׁ שׁוּב וָשׁוּב","../midot/../halacha-quiz/lev-03.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/lev-03-b1.webp"],["midot","תְּפִלָּה מִן הַלֵּב","מָקוֹם שֶׁקֵּט – מֹשֶׁה בַּמִּדְבָּר","לָמָּה מֹשֶׁה הָלַךְ לַמִּדְבָּר, אֵיךְ יִצְחָק וְאֵלִיָּהוּ הִתְבּוֹדְדוּ, וְאֵיפֹה יֶלֶד מוֹצֵא מָקוֹם שָׁקֵט לְדַבֵּר עִם ה׳","../midot/../halacha-quiz/lev-04.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/lev-04-b1.webp"],["midot","תְּפִלָּה מִן הַלֵּב","דַּקָּה אַחַת בָּעֶרֶב – תּוֹדָה, סְלִיחָה, עֶזְרָה","אֵיךְ מְסַיְּמִים אֶת הַיּוֹם בְּשִׂיחָה קְצָרָה עִם ה׳: לְהוֹדוֹת, לְבַקֵּשׁ סְלִיחָה אוֹ לְבַקֵּשׁ עֶזְרָה לְמָחָר","../midot/../halacha-quiz/lev-05.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/lev-05-b1.webp"],["midot","תְּפִלָּה מִן הַלֵּב","חַנָּה – ״מְדַבֶּרֶת עַל לִבָּהּ״","אֵיךְ חַנָּה הִתְפַּלְּלָה בְּשֶׁקֶט מִן הַלֵּב, לָמָּה הִרְבְּתָה לְהִתְפַּלֵּל, וּמָה אֲנִי לוֹמֵד מִמֶּנָּה","../midot/../halacha-quiz/lev-06.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/lev-06-b1.webp"],["midot","תְּפִלָּה מִן הַלֵּב","אֶבֶן וּמַיִם – סַבְלָנוּת בַּתְּפִלָּה","לָמָּה הַשִּׁנּוּי בָּא לְאַט, מָה לוֹמְדִים מֵהָאֶבֶן וְהַמַּיִם וּמֵהַתְּפִלִּין, וְאֵיךְ מַמְשִׁיכִים לְבַקֵּשׁ בְּסַבְלָנוּת","../midot/../halacha-quiz/lev-07.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/lev-07-b1.webp"],["midot","תְּפִלָּה מִן הַלֵּב","מְבִיאִים אֶת מַה שֶּׁכּוֹאֵב – תְּפִלָּה חַיָּה","אֵיךְ בָּאִים לַתְּפִלָּה כְּמוֹ שֶׁאֲנִי, מוֹסִיפִים מִשְׁפָּט מִשֶּׁלִּי, וּמִתְפַּלְּלִים בְּשִׂמְחָה","../midot/../halacha-quiz/lev-08.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/lev-08-b1.webp"],["midot","אַהֲבַת אֶרֶץ יִשְׂרָאֵל","מַה זֹּאת אַהֲבַת הָאָרֶץ?","לָמָּה אֵין מִצְוָה לֶאֱהֹב טַלִּית אֲבָל יֵשׁ מִצְוָה לְחַבֵּב אֶת הָאָרֶץ, וּמָה פֵּרוּשׁ ׳יִדְבְּקוּ׳","../midot/../halacha-quiz/eretz-01.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/eretz-01-b1.webp"],["midot","אַהֲבַת אֶרֶץ יִשְׂרָאֵל","אֶרֶץ שֶׁה׳ חָפֵץ בָּהּ","הַמֹּאזְנַיִם שֶׁבָּהֶם הָאָרֶץ שְׁקוּלָה כְּנֶגֶד כָּל הַבְּרִיּוֹת, וְלָמָּה אוֹהֲבִים אֶת מַה שֶׁה׳ אוֹהֵב","../midot/../halacha-quiz/eretz-02.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/eretz-02-b1.webp"],["midot","אַהֲבַת אֶרֶץ יִשְׂרָאֵל","כִּי רָצוּ עֲבָדֶיךָ אֶת אֲבָנֶיהָ","הַפָּסוּק שֶׁמְּלַמֵּד לֶאֱהֹב אֶת הָאָרֶץ עַד הָאֲבָנִים וְהֶעָפָר, וּמַה עָשׂוּ גְּדוֹלֵי הַחֲכָמִים","../midot/../halacha-quiz/eretz-03.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/eretz-03-b1.webp"],["midot","אַהֲבַת אֶרֶץ יִשְׂרָאֵל","בְּנוֹת צְלָפְחָד חִבְּבוּ אֶת הָאָרֶץ","חָמֵשׁ אַחְיוֹת שֶׁבִּקְשׁוּ חֵלֶק בָּאָרֶץ לִפְנֵי שֶׁנִּכְנְסוּ אֵלֶיהָ, וּמָה לָמַד רַשִׁ״י עַל מִי שֶׁמְּחַבֵּב אֶת הָאָרֶץ","../midot/../halacha-quiz/eretz-04.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/eretz-04-b1.webp"],["midot","אַהֲבַת אֶרֶץ יִשְׂרָאֵל","דָּוִד וּמֹשֶׁה – כִּסּוּפִים לָאָרֶץ","מָה בָּחַר דָּוִד, לָמָּה מֹשֶׁה הִתְפַּלֵּל כָּל כָּךְ הַרְבֵּה, וְאֵיךְ הַכִּסּוּפִים שֶׁלָּהֶם מְלַמְּדִים אוֹתָנוּ לֶאֱהֹב אֶת הָאָרֶץ","../midot/../halacha-quiz/eretz-05.html","https://yudataub.github.io/kol-toda-halacha/halacha-quiz/img/eretz-05-b1.webp"],["midot","אַהֲבַת אֶרֶץ יִשְׂרָאֵל","טוֹבָה הָאָרֶץ מְאֹד מְאֹד","אֵיךְ הַתּוֹרָה מְשַׁבַּחַת אֶת הָאָרֶץ,
