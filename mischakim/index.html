.card .go{margin-top:auto;padding-top:6px;font-size:13px;font-weight:800;color:var(--c)}
.empty{text-align:center;color:var(--muted);padding:40px 0;font-size:18px}

./halacha-quiz/nashim-02.html"],["halacha","🌸 תְּפִלַּת בָּנוֹת","עוֹמֶדֶת לִפְנֵי הַמֶּלֶךְ","מָקוֹם, לְבוּשׁ וְהִתְנַהֲגוּת בִּתְפִלַּת הָעֲמִידָה","../halacha-quiz/nashim-03.html"],["halacha","🌸 תְּפִלַּת בָּנוֹת","בַּת בְּבֵית הַכְּנֶסֶת וּבַשַּׁבָּת","מִנְיָן, קַדִּישׁ וּ״בָרְכוּ״, קְדֻשַּׁת בֵּית הַכְּנֶסֶת, תְּפִלּוֹת הַשַּׁבָּת וְהַחַגִּים","../halacha-quiz/nashim-04.html"],["halacha","🌸 תְּפִלַּת בָּנוֹת","מוּשָּׂגִים וּלְשׁוֹן חֲכָמִים – תְּפִלַּת בָּנוֹת","מָה פֵּרוּשׁ הַמִּלִּים וְהַמּוּשָּׂגִים שֶׁפּוֹגְשִׁים בְּהִלְכוֹת תְּפִלַּת הַנָּשִׁים","../halacha-quiz/nashim-mk.html"],["halacha","🍎 הִלְכוֹת בְּרָכוֹת","תּוֹדָה לַה׳ וְיָדַיִם טְהוֹרוֹת","מִצְוַת הַהוֹדָאָה, סוּגֵי הַבְּרָכוֹת, עֲנִיַּת אָמֵן וּנְטִילַת יָדַיִם לַסְּעוּדָה","../halacha-quiz/berachot-01.html"],["halacha","🍎 הִלְכוֹת בְּרָכוֹת","הַמּוֹצִיא לֶחֶם מִן הָאָרֶץ","בִּרְכַּת הַלֶּחֶם, בְּצִיעַת הַפַּת, הַמֶּלַח, וּמָה נִפְטָר בַּסְּעוּדָה","../halacha-quiz/berachot-02.html"],["halacha","🍎 הִלְכוֹת בְּרָכוֹת","אָכַלְנוּ, שָׂבַעְנוּ – וּמְבָרְכִים","בִּרְכַּת הַמָּזוֹן וְזִמּוּן","../halacha-quiz/berachot-03.html"],["halacha","🍎 הִלְכוֹת בְּרָכוֹת","מִן הַשָּׂדֶה וּמִן הַכֶּרֶם","בִּרְכוֹת חֲמֵשֶׁת מִינֵי דָּגָן וּבִרְכַּת הַיַּיִן","../halacha-quiz/berachot-04.html"],["halacha","🍎 הִלְכוֹת בְּרָכוֹת","הָעֵץ, הָאֲדָמָה וְשֶׁהַכֹּל","בִּרְכוֹת הַפֵּרוֹת וְ״שֶׁהַכֹּל״, וּכְלָלֵי הַבְּרָכָה הָרִאשׁוֹנָה","../halacha-quiz/berachot-05.html"],["halacha","🍎 הִלְכוֹת בְּרָכוֹת","בְּרָכָה אַחֲרוֹנָה, עִקָּר וְטָפֵל","מֵעֵין שָׁלֹשׁ, בּוֹרֵא נְפָשׁוֹת, שִׁעוּר כְּזַיִת – וְאֵיךְ מְבָרְכִים עַל מַאֲכָל מְעֹרָב","../halacha-quiz/berachot-06.html"],["halacha","🍎 הִלְכוֹת בְּרָכוֹת","בְּרָכָה בִּמְקוֹמָהּ וְשֻׁלְחָן שֶׁל חֶסֶד","כְּלָלֵי הַבְּרָכוֹת, עֲנִיַּת אָמֵן, וְדֶרֶךְ אֶרֶץ בַּסְּעוּדָה","../halacha-quiz/berachot-07.html"],["halacha","🍎 הִלְכוֹת בְּרָכוֹת","רֵיחַ טוֹב וּמַרְאוֹת נִפְלָאִים","בִּרְכוֹת הָרֵיחַ וּבִרְכוֹת הָרְאִיָּה: קֶשֶׁת, בְּרָקִים, יָם, הָרִים וְאִילָנוֹת פּוֹרְחִים","../halacha-quiz/berachot-08.html"],["halacha","🍎 הִלְכוֹת בְּרָכוֹת","תּוֹדָה עַל כָּל טוֹבָה","בִּרְכַּת הַגּוֹמֵל, שֶׁהֶחֱיָנוּ, הַטּוֹב וְהַמֵּטִיב, דַּיַּן הָאֱמֶת וּתְפִלַּת הַדֶּרֶךְ","../halacha-quiz/berachot-09.html"],["halacha","🍎 הִלְכוֹת בְּרָכוֹת","מוּשָּׂגִים וּלְשׁוֹן חֲכָמִים – הִלְכוֹת בְּרָכוֹת","מָה פֵּרוּשׁ הַמִּלִּים וְהַמּוּשָּׂגִים שֶׁפּוֹגְשִׁים בְּכָל הִלְכוֹת הַבְּרָכוֹת","../halacha-quiz/berachot-mk.html"],["halacha","🧵 צִיצִית, תְּפִלִּין וּמְזוּזָה","צִיצִית וְכִפָּה","","../halacha-quiz/mitzvot-01.html"],["halacha","🧵 צִיצִית, תְּפִלִּין וּמְזוּזָה","תְּפִלִּין א׳ – אוֹת וְכֶתֶר","מָה יֵשׁ בַּתְּפִלִּין, מָה הֵן אוֹמְרוֹת לָנוּ, וְאֵיךְ שׁוֹמְרִים עַל כְּבוֹדָן – לִקְרַאת בַּר מִצְוָה","../halacha-quiz/mitzvot-02.html"],["halacha","🧵 צִיצִית, תְּפִלִּין וּמְזוּזָה","תְּפִלִּין ב׳ – מַנִּיחִים כַּהֲלָכָה","מְקוֹם הַתְּפִלִּין, הַסֵּדֶר, הַבְּרָכָה, בְּלִי הֶפְסֵק – וּמָתַי לֹא מַנִּיחִים. לְחָתָן בַּר מִצְוָה","../halacha-quiz/mitzvot-03.html"],["halacha","🧵 צִיצִית, תְּפִלִּין וּמְזוּזָה","מְזוּזָה – שְׁמַע יִשְׂרָאֵל בַּפֶּתַח","אֵיפֹה קוֹבְעִים, בְּאֵיזֶה צַד וּבְאֵיזֶה גֹּבַהּ, מָה מְבָרְכִים, וּמָתַי בּוֹדְקִים","../halacha-quiz/mitzvot-04.html"],["halacha","🧵 צִיצִית, תְּפִלִּין וּמְזוּזָה","מוּשָּׂגִים וּלְשׁוֹן חֲכָמִים – צִיצִית, תְּפִלִּין וּמְזוּזָה","מָה פֵּרוּשׁ הַמִּלִּים וְהַמּוּשָּׂגִים שֶׁל הִלְכוֹת כִּפָּה, צִיצִית, תְּפִלִּין וּמְזוּזָה","../halacha-quiz/mitzvot-mk.html"],["halacha","🕯️ הִלְכוֹת שַׁבָּת","הַשַּׁבָּת – מַתָּנָה שֶׁל אַהֲבָה","עֵרֶךְ הַשַּׁבָּת, הַהֲכָנוֹת לְשַׁבָּת, וּזְמַנֵּי כְּנִיסָתָהּ וִיצִיאָתָהּ","../halacha-quiz/shabbat-01.html"],["halacha","🕯️ הִלְכוֹת שַׁבָּת","נֵרוֹת שֶׁל שָׁלוֹם וְיוֹם שֶׁל תּוֹרָה","הַדְלָקַת נֵרוֹת שַׁבָּת, לִמּוּד תּוֹרָה, קְרִיאַת הַתּוֹרָה וּתְפִלּוֹת הַשַּׁבָּת","../halacha-quiz/shabbat-02.html"],["halacha","🕯️ הִלְכוֹת שַׁבָּת","קִדּוּשׁ וּסְעוּדוֹת שֶׁל עֹנֶג","הִלְכוֹת קִדּוּשׁ, כּוֹס שֶׁל בְּרָכָה, שָׁלֹשׁ סְעוּדוֹת, לֶחֶם מִשְׁנֶה וּמְלַוֶּה מַלְכָּה","../halacha-quiz/shabbat-03.html"],["halacha","🕯️ הִלְכוֹת שַׁבָּת","הַבְדָּלָה וּמְלֶאכֶת מַחֲשֶׁבֶת","הַבְדָּלָה וּמוֹצָאֵי שַׁבָּת, ל״ט הַמְּלָאכוֹת וּכְלָלֵי הַמְּלָאכוֹת","../halacha-quiz/shabbat-04.html"],["halacha","🕯️ הִלְכוֹת שַׁבָּת","אֹכֶל חַם וְחַמִּין שֶׁל שַׁבָּת","מְלֶאכֶת בִּשּׁוּל: חִמּוּם אֹכֶל, פְּלָטָה, כְּלִי רִאשׁוֹן, שֵׁנִי וּשְׁלִישִׁי, וְהַטְמָנָה","../halacha-quiz/shabbat-05.html"],["halacha","🕯️ הִלְכוֹת שַׁבָּת","בּוֹרְרִים אֶת הַטּוֹב","בּוֹרֵר, דָּשׁ, טוֹחֵן, לָשׁ וְסוֹחֵט – הֲכָנַת אֹכֶל בְּשַׁבָּת","../halacha-quiz/shabbat-06.html"],["halacha","🕯️ הִלְכוֹת שַׁבָּת","בֶּגֶד, גּוּף וּבַיִת בְּשַׁבָּת","כִּבּוּס, תְּפִירָה וּקְשָׁרִים, הַטִּפּוּל בַּגּוּף, בּוֹנֶה וְסוֹתֵר בַּבַּיִת וּבַכֵּלִים","../halacha-quiz/shabbat-07.html"],["halacha","🕯️ הִלְכוֹת שַׁבָּת","אוֹר, אֵשׁ וְאוֹתִיּוֹת בְּשַׁבָּת","מַבְעִיר וּמְכַבֶּה, חַשְׁמַל וּמַכְשִׁירָיו, כּוֹתֵב, מוֹחֵק וְצוֹבֵעַ","../halacha-quiz/shabbat-08.html"],["halacha","🕯️ הִלְכוֹת שַׁבָּת","הַגִּנָּה, הַחַיּוֹת וְהָרְחוֹב","מְלָאכוֹת שֶׁבַּצּוֹמֵחַ, בַּעֲלֵי חַיִּים בְּשַׁבָּת וְהִלְכוֹת הוֹצָאָה","../halacha-quiz/shabbat-09.html"],["halacha","🕯️ הִלְכוֹת שַׁבָּת","יוֹם שֶׁל מְנוּחָה וּקְדֻשָּׁה","צִבְיוֹן הַשַּׁבָּת – הֲלִיכָה, דִּבּוּר, מִשְׂחָקִים וְקִנְיָה – וְהִלְכוֹת מֻקְצֶה","../halacha-quiz/shabbat-10.html"],["halacha","🕯️ הִלְכוֹת שַׁבָּת","יְלָדִים שׁוֹמְרֵי שַׁבָּת","דִּינֵי קָטָן וּמִשְׂחֲקֵי שַׁבָּת, מְלֶאכֶת גּוֹי, מַעֲשֵׂה שַׁבָּת וְלִפְנֵי עִוֵּר","../halacha-quiz/shabbat-11.html"],["halacha","🕯️ הִלְכוֹת שַׁבָּת","וָחַי בָּהֶם","","../halacha-quiz/shabbat-12.html"],["halacha","🕯️ הִלְכוֹת שַׁבָּת","מוּשָּׂגִים וּלְשׁוֹן חֲכָמִים – הִלְכוֹת שַׁבָּת","מָה פֵּרוּשׁ הַמִּלִּים וְהַמּוּשָּׂגִים שֶׁפּוֹגְשִׁים בְּכָל הִלְכוֹת הַשַּׁבָּת, מִכְּנִיסָתָהּ עַד תְּחוּמֶיהָ","../halacha-quiz/shabbat-mk.html"],["halacha","🤝 בֵּין אָדָם לַחֲבֵרוֹ","וְאָהַבְתָּ לְרֵעֲךָ כָּמוֹךָ","לֹא שׂוֹנְאִים וְלֹא נוֹקְמִים, דָּנִים לְכַף זְכוּת, שׁוֹמְרִים אֶת הַלָּשׁוֹן וְלֹא מַעֲלִיבִים","../halacha-quiz/chavero-01.html"],["halacha","🤝 בֵּין אָדָם לַחֲבֵרוֹ","אֱמֶת וְיֹשֶׁר","","../halacha-quiz/chavero-02.html"],["halacha","🤝 בֵּין אָדָם לַחֲבֵרוֹ","לֹא תִּגְנֹבוּ","","../halacha-quiz/chavero-03.html"],["halacha","🤝 בֵּין אָדָם לַחֲבֵרוֹ","מַלְוִים וְנוֹתְנִים","מִצְוַת הַהַלְוָאָה, צְדָקָה וּמַעֲשֵׂר מִדְּמֵי הַכִּיס","../halacha-quiz/chavero-04.html"],["halacha","🤝 בֵּין אָדָם לַחֲבֵרוֹ","אוֹרְחִים וַחֲבֵרִים","הַכְנָסַת אוֹרְחִים, חֶבְרָה טוֹבָה וְהַשְׁפָּעָה בְּאַהֲבָה","../halacha-quiz/chavero-05.html"],["halacha","🤝 בֵּין אָדָם לַחֲבֵרוֹ","שׁוֹמְרִים עַל הַחַיִּים","מַעֲקֶה וּבְטִיחוּת בַּבַּיִת, זְהִירוּת בַּדְּרָכִים, תְּפִלַּת הַדֶּרֶךְ וְהַצָּלַת נְפָשׁוֹת","../halacha-quiz/chavero-06.html"],["halacha","🤝 בֵּין אָדָם לַחֲבֵרוֹ","מוּשָּׂגִים וּלְשׁוֹן חֲכָמִים – בֵּין אָדָם לַחֲבֵרוֹ","מָה פֵּרוּשׁ הַמִּלִּים וְהַמּוּשָּׂגִים שֶׁפּוֹגְשִׁים בְּכָל הֲלָכוֹת בֵּין אָדָם לַחֲבֵרוֹ","../halacha-quiz/chavero-mk.html"],["halacha","🍽️ הִלְכוֹת כַּשְׁרוּת","בַּעֲלֵי חַיִּים בְּרַחֲמִים","אֲכִילַת בָּשָׂר, צַעַר בַּעֲלֵי חַיִּים, שִׁלּוּחַ הַקֵּן וְסִימָנֵי הַכַּשְׁרוּת","../halacha-quiz/kashrut-01.html"],["halacha","🍽️ הִלְכוֹת כַּשְׁרוּת","בּוֹדְקִים וְנִזְהָרִים","דָּם וְהַכְשָׁרַת הַבָּשָׂר, בְּדִיקַת חֲרָקִים, בֵּיצִים וּדְבַשׁ","../halacha-quiz/kashrut-02.html"],["halacha","🍽️ הִלְכוֹת כַּשְׁרוּת","בָּשָׂר לְחוּד וְחָלָב לְחוּד","אִסּוּר בָּשָׂר בְּחָלָב, כֵּלִים נִפְרָדִים, פַּרְוֶה, וְהַהַמְתָּנָה בֵּין בָּשָׂר לְחָלָב","../halacha-quiz/kashrut-03.html"],["halacha","🍽️ הִלְכוֹת כַּשְׁרוּת","שׁוֹמְרִים עַל הָעוֹלָם וְעַל הַגּוּף","בַּל תַּשְׁחִית, פַּת וּבִשּׁוּלֵי גּוֹיִם, טְבִילַת כֵּלִים, בְּרִיאוּת וְהֶכְשֵׁר","../halacha-quiz/kashrut-04.html"],["halacha","🍽️ הִלְכוֹת כַּשְׁרוּת","מִצְווֹת הָאָרֶץ הַטּוֹבָה","חָדָשׁ, עָרְלָה וְנֶטַע רְבָעִי, מַתְּנוֹת עֲנִיִּים, תְּרוּמוֹת וּמַעַשְׂרוֹת וְחַלָּה","../halacha-quiz/kashrut-05.html"],["halacha","🍽️ הִלְכוֹת כַּשְׁרוּת","עַם מְיֻחָד גַּם בַּמִּטְבָּח","הַגְּזֵרוֹת עַל מַאַכְלֵי גּוֹיִם, יֵין גּוֹיִם, חָלָב וּגְבִינָה, וּבִט ת","מוּשָּׂגִים וּלְשׁוֹן חֲכָמִים – הִלְכוֹת סֻכּוֹת","מָה פֵּרוּשׁ הַמִּלִּים וְהַמּוּשָּׂגִים שֶׁפּוֹגְשִׁים בְּכָל הִלְכוֹת הַסֻּכָּה וְאַרְבַּעַת הַמִּינִים","../halacha-quiz/sukkot-mk.html"],["halacha","🕎 הִלְכוֹת חֲנֻכָּה","נֵס פַּךְ הַשֶּׁמֶן","","../halacha-quiz/chanuka-01.html"],["halacha","🕎 הִלְכוֹת חֲנֻכָּה","מַדְלִיקִים נֵר חֲנֻכָּה","מְהַדְּרִין מִן הַמְּהַדְּרִין, מִי מַדְלִיק, הַבְּרָכוֹת, הַנֵּרוֹת, הַחֲנֻכִּיָּה וְהַשַּׁמָּשׁ, וְהַדְלָקָה בְּבֵית הַכְּנֶסֶת","../halacha-quiz/chanuka-02.html"],["halacha","🕎 הִלְכוֹת חֲנֻכָּה","אֵיפֹה וּמָתַי מַדְלִיקִים","פִּרְסוּם הַנֵּס: פֶּתַח, חַלּוֹן וּמִרְפֶּסֶת, זְמַן הַהַדְלָקָה, שַׁבַּת חֲנֻכָּה, אוֹרְחִים, יְשִׁיבָה, מָלוֹן וְטִיּוּל","../halacha-quiz/chanuka-03.html"],["halacha","🕎 הִלְכוֹת חֲנֻכָּה","מוּשָּׂגִים וּלְשׁוֹן חֲכָמִים – הִלְכוֹת חֲנֻכָּה","מָה פֵּרוּשׁ הַמִּלִּים וְהַמּוּשָּׂגִים שֶׁפּוֹגְשִׁים בְּהִלְכוֹת חֲנֻכָּה","../halacha-quiz/chanuka-mk.html"],["halacha","🎭 הִלְכוֹת פּוּרִים","מִשֶּׁנִּכְנַס אֲדָר מַרְבִּים בְּשִׂמְחָה","חֹדֶשׁ אֲדָר, אַרְבַּע הַפָּרָשִׁיּוֹת, זְכִירַת עֲמָלֵק, תַּעֲנִית אֶסְתֵּר, מַחֲצִית הַשֶּׁקֶל וְנֵס פּוּרִים","../halacha-quiz/purim-01.html"],["halacha","🎭 הִלְכוֹת פּוּרִים","מִקְרָא מְגִלָּה","","../halacha-quiz/purim-02.html"],["halacha","🎭 הִלְכוֹת פּוּרִים","שִׂמְחָה, חֶסֶד וִירוּשָׁלַיִם","מִשְׁלוֹחַ מָנוֹת, מַתָּנוֹת לָאֶבְיוֹנִים, סְעוּדַת פּוּרִים, תַּחְפֹּשׂוֹת, פְּרָזִים וּמֻקָּפִים וּפוּרִים הַמְשֻׁלָּשׁ","../halacha-quiz/purim-03.html"],["halacha","🎭 הִלְכוֹת פּוּרִים","מוּשָּׂגִים וּלְשׁוֹן חֲכָמִים – הִלְכוֹת פּוּרִים","מָה פֵּרוּשׁ הַמִּלִּים וְהַמּוּשָּׂגִים שֶׁפּוֹגְשִׁים בְּהִלְכוֹת פּוּרִים","../halacha-quiz/purim-mk.html"],["halacha","🍷 הִלְכוֹת פֶּסַח","חָמֵץ וּמַצָּה – מָה הַסּוֹד?","מַשְׁמָעוּת חַג הַפֶּסַח, מָה הוּא חָמֵץ, זְמַנֵּי הָאִסּוּר וְחָמֵץ שֶׁל גּוֹי","../halacha-quiz/pesach-01.html"],["halacha","🍷 הִלְכוֹת פֶּסַח","מְחַפְּשִׂים וּמְבַעֲרִים","בְּדִיקַת חָמֵץ, בִּטּוּל חָמֵץ וּשְׂרֵפַת חָמֵץ","../halacha-quiz/pesach-02.html"],["halacha","🍷 הִלְכוֹת פֶּסַח","מְכִירַת חָמֵץ, כַּשְׁרוּת וְקִטְנִיּוֹת","מְכִירַת חָמֵץ לְגוֹי, מוּצָרִים כְּשֵׁרִים לְפֶסַח, תְּרוּפוֹת וּמִנְהַג הַקִּטְנִיּוֹת","../halacha-quiz/pesach-03.html"],["halacha","🍷 הִלְכוֹת פֶּסַח","מַצָּה שְׁמוּרָה וְעֶרֶב פֶּסַח","הִלְכוֹת מַצָּה, מְלָאכָה וַאֲכִילָה בְּעֶרֶב פֶּסַח, תַּעֲנִית בְּכוֹרוֹת וְעֶרֶב פֶּסַח שֶׁחָל בְּשַׁבָּת","../halacha-quiz/pesach-04.html"],["halacha","🍷 הִלְכוֹת פֶּסַח","וְהִגַּדְתָּ לְבִנְךָ","","../halacha-quiz/pesach-05.html"],["halacha","🍷 הִלְכוֹת פֶּסַח","מִמַּצָּה וּמָרוֹר עַד נִרְצָה","הֲסִבָּה, מוֹצִיא מַצָּה, מָרוֹר, כּוֹרֵךְ, שֻׁלְחָן עוֹרֵךְ, צָפוּן, בָּרֵךְ, הַלֵּל וְנִרְצָה","../halacha-quiz/pesach-06.html"],["halacha","🍷 הִלְכוֹת פֶּסַח","מוּשָּׂגִים וּלְשׁוֹן חֲכָמִים – הִלְכוֹת פֶּסַח","מָה פֵּרוּשׁ הַמִּלִּים וְהַמּוּשָּׂגִים שֶׁפּוֹגְשִׁים בְּכָל הִלְכוֹת הַפֶּסַח וְלֵיל הַסֵּדֶר","../halacha-quiz/pesach-mk.html"],["halacha","📅 רֹאשׁ חֹדֶשׁ, סְפִירַת הָעֹמֶר וְהַצּוֹמוֹת","רֹאשׁ חֹדֶשׁ וְקִדּוּשׁ לְבָנָה","הַחֹדֶשׁ הָעִבְרִי, סְעוּדַת רֹאשׁ חֹדֶשׁ, יַעֲלֶה וְיָבוֹא, הַלֵּל, מוּסָף וּבִרְכַּת הַלְּבָנָה","../halacha-quiz/zmanim-01.html"],["halacha","📅 רֹאשׁ חֹדֶשׁ, סְפִירַת הָעֹמֶר וְהַצּוֹמוֹת","סְפִירַת הָעֹמֶר וְל״ג בָּעֹמֶר","מִצְוַת הַסְּפִירָה, מִנְהֲגֵי הָאֲבֵלוּת, רַבִּי עֲקִיבָא וְרַבִּי שִׁמְעוֹן בַּר יוֹחָאי","../halacha-quiz/zmanim-02.html"],["halacha","📅 רֹאשׁ חֹדֶשׁ, סְפִירַת הָעֹמֶר וְהַצּוֹמוֹת","הַצּוֹמוֹת וּשְׁלֹשֶׁת הַשָּׁבוּעוֹת","עֲשָׂרָה בְּטֵבֵת, י״ז בְּתַמּוּז וְצוֹם גְּדַלְיָה, דִּינֵי הַצּוֹמוֹת, בֵּין הַמְּצָרִים וְתִשְׁעַת הַיָּמִים","../halacha-quiz/zmanim-03.html"],["halacha","📅 רֹאשׁ חֹדֶשׁ, סְפִירַת הָעֹמֶר וְהַצּוֹמוֹת","עֶרֶב תִּשְׁעָה בְּאָב וְתִשְׁעָה בְּאָב","הַסְּעוּדָה הַמַּפְסֶקֶת, חֲמִשָּׁה עִנּוּיִים, אֵיכָה וְקִינוֹת, מִנְהֲגֵי אֲבֵלוּת וִילָדִים בְּתִשְׁעָה בְּאָב","../halacha-quiz/zmanim-04.html"],["halacha","📅 רֹאשׁ חֹדֶשׁ, סְפִירַת הָעֹמֶר וְהַצּוֹמוֹת","מוּשָּׂגִים וּלְשׁוֹן חֲכָמִים – רֹאשׁ חֹדֶשׁ, סְפִירַת הָעֹמֶר וְהַצּוֹמוֹת","מָה פֵּרוּשׁ הַמּוּשָּׂגִים וְהַמִּלִּים שֶׁפּוֹגְשִׁים בְּרֹאשׁ חֹדֶשׁ, בִּסְפִירַת הָעֹמֶר וּבְצוֹמוֹת הַשָּׁנָה","../halacha-quiz/zmanim-mk.html"],["halacha","👨‍👩‍👧 כִּבּוּד הוֹרִים וּמִשְׁפָּחָה","כַּבֵּד אֶת אָבִיךָ וְאֶת אִמֶּךָ","כִּבּוּד וּמוֹרָא, הַמָּקוֹם שֶׁל הַהוֹרִים, קִימָה, שְׁמוֹתֵיהֶם וּשְׁנָתָם","../halacha-quiz/mishpacha-01.html"],["halacha","👨‍👩‍👧 כִּבּוּד הוֹרִים וּמִשְׁפָּחָה","עוֹזְרִים בְּסֵבֶר פָּנִים יָפוֹת","עֶזְרָה בַּבַּיִת, שְׁלִיחֻיּוֹת, הוֹרִים זְקֵנִים, שְׂכַר הַמִּצְוָה, שְׁתִיקָה וּמְחִילָה","../halacha-quiz/mishpacha-02.html"],["halacha","👨‍👩‍👧 כִּבּוּד הוֹרִים וּמִשְׁפָּחָה","לִשְׁמֹעַ בְּקוֹלָם – וּלְכַבֵּד אֶת כָּל הַמִּשְׁפָּחָה","כָּבוֹד בַּלֵּב וְכַף זְכוּת, כִּבּוּד הוֹרִים וּשְׁמִירַת מִצְווֹת, שְׁמִיעָה בְּקוֹלָם, סָבִים וְאַחִים גְּדוֹלִים","../halacha-quiz/mishpacha-03.html"],["halacha","👨‍👩‍👧 כִּבּוּד הוֹרִים וּמִשְׁפָּחָה","בְּרִית מִילָה וּפִדְיוֹן הַבֵּן","הַמִּצְוָה הָרִאשׁוֹנָה, הַיּוֹם הַשְּׁמִינִי, מִנְהֲגֵי הַבְּרִית וְהַכִּבּוּדִים, וּפִדְיוֹן הַבְּכוֹר אֵצֶל הַכֹּהֵן","../halacha-quiz/mishpacha-04.html"],["halacha","👨‍👩‍👧 כִּבּוּד הוֹרִים וּמִשְׁפָּחָה","נִחוּם אֲבֵלִים וְעִלּוּי נְשָׁמָה","בָּרוּךְ דַּיַּן הָאֱמֶת, אֵיךְ מְנַחֲמִים בְּבֵית הָאֲבֵלִים, קַדִּישׁ, צְדָקָה וּמַעֲשִׂים טוֹבִים לְעִלּוּי הַנְּשָׁמָה, וְיוֹם הַשָּׁנָה","../halacha-quiz/mishpacha-05.html"],["halacha","👨‍👩‍👧 כִּבּוּד הוֹרִים וּמִשְׁפָּחָה","מוּשָּׂגִים וּלְשׁוֹן חֲכָמִים – כִּבּוּד הוֹרִים וּמִשְׁפָּחָה","מָה פֵּרוּשׁ הַמִּלִּים וְהַמּוּשָּׂגִים שֶׁל כִּבּוּד הוֹרִים, בְּרִית מִילָה, פִּדְיוֹן הַבֵּן וְנִחוּם אֲבֵלִים","../halacha-quiz/mishpacha-mk.html"],["halacha","🌷 הִלְכוֹת צְנִיעוּת","עוֹלָמָהּ שֶׁל הַצְּנִיעוּת","שׁוֹאֲפוֹת לִשְׁלֵמוּת, וּמְקַיְּמוֹת גַּם כְּשֶׁלֹּא מְבִינוֹת","../halacha-quiz/tzniut-01.html"],["halacha","🌷 הִלְכוֹת צְנִיעוּת","פְּנִימִיּוּת וְכָבוֹד","לָמָּה חָשׁוּב לְהִתְלַבֵּשׁ בִּצְנִיעוּת – בִּשְׁבִילֵנוּ, וְ״עִם אֱ־לֹהֶיךָ״","../halacha-quiz/tzniut-02.html"],["halacha","🌷 הִלְכוֹת צְנִיעוּת","כֹּחָהּ שֶׁל הִתְמוֹדְדוּת","כָּל הִתְגַּבְּרוּת חֲשׁוּבָה, צַעַד אַחַר צַעַד – וְשִׂמְחָה לִהְיוֹת עַבְדֵי ה׳","../halacha-quiz/tzniut-03.html"],["halacha","🌷 הִלְכוֹת צְנִיעוּת","לְבוּשׁ צָנוּעַ – חֲצָאִית, שַׁרְווּל וְצַוָּאר","צְנִיעוּת הִיא לֹא רַק אֹרֶךְ: כִּסּוּי הָרַגְלַיִם, הַיָּדַיִם וְהַצַּוָּאר","../halacha-quiz/tzniut-04.html"],["halacha","🌷 הִלְכוֹת צְנִיעוּת","חֲצָאִית – וְלֹא מִכְנָסַיִם","לֹא יִלְבַּשׁ, דַּת יְהוּדִית, לְבוּשׁ יִצּוּגִי וְזֶהוּת – וּמָה עוֹשִׂים בַּבַּיִת וּבַטִּיּוּל","../halacha-quiz/tzniut-05.html"],["halacha","🌷 הִלְכוֹת צְנִיעוּת","יֵצֶר הָעֲרָיוֹת – כֹּחַ גָּדוֹל מִמָּקוֹם קָדוֹשׁ","לָמָּה חֲכָמִים לֹא בִּטְּלוּ אֶת הַיֵּצֶר, מָה תַּפְקִידוֹ, וְלָמָּה הוּא חָזָק כָּל כָּךְ","../halacha-quiz/tzniut-06.html"],["halacha","🌷 הִלְכוֹת צְנִיעוּת","אִסּוּר נְגִיעָה – קְדֻשַּׁת הַמַּגָּע","״לֹא תִקְרְבוּ״: מְקוֹר הָאִסּוּר, הַהֲלָכָה לְמַעֲשֶׂה, וְאֵיךְ שׁוֹמְרִים בְּלִי לְהַעֲלִיב","../halacha-quiz/tzniut-07.html"],["halacha","🌷 הִלְכוֹת צְנִיעוּת","יִחוּד – דֶּלֶת פְּתוּחָה וְלֵב שָׁמוּר","מָה זֶה יִחוּד, מָה מוֹנֵעַ אוֹתוֹ, וְאֵיךְ נִזְהָרוֹת בְּשִׁעוּר פְּרָטִי, בַּהַסָּעָה וְאֵצֶל הָרוֹפֵא","../halacha-quiz/tzniut-08.html"],["halacha","🌷 הִלְכוֹת צְנִיעוּת","חֶבְרָה מְעֹרֶבֶת וּצְנִיעוּת בַּטִּיּוּל","שִׂיחָה עִנְיָנִית, גְּבוּלוֹת בְּרוּרִים, וְטִיּוּל שֶׁשּׁוֹמֵר עָלֵינוּ","../halacha-quiz/tzniut-09.html"],["halacha","🌷 הִלְכוֹת צְנִיעוּת","שְׁמִירַת הָעֵינַיִם – הִסְתַּכְּלוּת אֲסוּרָה","גַּם בַּמָּסָךְ, גַּם לַבָּנוֹת: תּוֹכְנַת סִנּוּן, הֲסָטַת הַמַּבָּט וְקִרְבַת ה׳","../halacha-quiz/tzniut-10.html"],["halacha","🌷 הִלְכוֹת צְנִיעוּת","שִׁירַת נָשִׁים","","../halacha-quiz/tzniut-11.html"],["halacha","🌷 הִלְכוֹת צְנִיעוּת","כִּסּוּי רֹאשׁ לְנָשִׁים","דַּת מֹשֶׁה וְדַת יְהוּדִית, שְׁלֹשָׁה טְעָמִים, גֶּדֶר הַכִּסּוּי – וְכָבוֹד לְאִמָּא וּלְכָל אִשָּׁה שֶׁמִּשְׁתַּדֶּלֶת","../halacha-quiz/tzniut-12.html"],["halacha","🌷 הִלְכוֹת צְנִיעוּת","מוּשָּׂגִים וּלְשׁוֹן חֲכָמִים – הִלְכוֹת צְנִיעוּת","מָה פֵּרוּשׁ הַמִּלִּים וְהַמּוּשָּׂגִים שֶׁפּוֹגְשִׁים בְּהִלְכוֹת צְנִיעוּת","../halacha-quiz/tzniut-mk.html"],["halacha","👂 קְרִיאַת שְׁמַע","שְׁמַע יִשְׂרָאֵל – עַל מָה אֲנַחְנוּ מְעִידִים","מִצְוָה שֶׁבַּלֵּב: ה׳ מַשְׁגִּיחַ עָלַי, ה׳ אֶחָד – וְהַכֹּל מֵאִתּוֹ","../halacha-quiz/shema-01.html"],["halacha","👂 קְרִיאַת שְׁמַע","וְאָהַבְתָּ – לֶאֱהֹב אֶת ה׳ גַּם כְּשֶׁקָּשֶׁה","לָמָּה לֹא מַסְפִּיק לְהַאֲמִין, אֵיךְ מַגִּיעִים לְאַהֲבָה, וְאֵיךְ שְׂמֵחִים גַּם בְּיוֹם קָשֶׁה","../halacha-quiz/shema-02.html"],["halacha","👂 קְרִיאַת שְׁמַע","בְּכָל לְבָבְךָ, בְּכָל נַפְשְׁךָ, בְּכָל מְאֹדֶךָ","אַבְרָהָם, יִצְחָק וְיַעֲקֹב, רַבִּי עֲקִיבָא – וְהָעֲקֵדָה שֶׁלִּי","../halacha-quiz/shema-03.html"],["halacha","👂 קְרִיאַת שְׁמַע","וְהָיוּ הַדְּבָרִים – מְקַיְּמִים אֶת שְׁמַע בְּכָל יוֹם","עַל הַלֵּב, בַּפֶּה, עַל הַיָּד, בֵּין הָעֵינַיִם וְעַל הַדֶּלֶת – וְהַהֲכָנָה מֵרֹאשׁ","../halacha-quiz/shema-04.html"],["halacha","👂 קְרִיאַת שְׁמַע","הַפָּרָשָׁה הַחֲשׁוּבָה בְּיוֹתֵר – אֵיךְ מַגִּיעִים לְאַהֲבַת ה׳","שֶׁבַע פְּעֻלּוֹת לַפָּרָשָׁה, ״ה׳ אֱלֹהֵינוּ״, ״בְּכָל לְבָבְךָ וְנַפְשְׁךָ וּמְאֹדֶךָ״ וְהַדֶּרֶךְ לְאַהֲבָה","../halacha-quiz/shema-05.html"],["halacha","🌙 אֱמוּנָה – וֶאֱמוּנָתְךָ בַּלֵּילוֹת","עוֹבְדִים אֶת ה׳ גַּם בַּלַּיְלָה וְגַם כְּשֶׁקָּשֶׁה","מִצְווֹת גְּדוֹלוֹת בָּרְגָעִים הָעֲיֵפִים, שָׂרָה אִמֵּנוּ שֶׁקָּמָה בַּלֵּילוֹת, וְהֲלָכוֹת שֶׁל מַחֲשָׁבָה","../halacha-quiz/emuna-01.html"],["halacha","🌙 אֱמוּנָה – וֶאֱמוּנָתְךָ בַּלֵּילוֹת","רַחֲמָנָא לִבָּא בָּעֵי – ה׳ רוֹצֶה אֶת הַלֵּב","מִצְווֹת שֶׁבַּלֵּב גְּדוֹלוֹת מִלִּמּוּד תּוֹרָה, וְלָמָּה נֶחְרְבוּ שְׁנֵי בָּתֵּי הַמִּקְדָּשׁ","../halacha-quiz/emuna-02.html"],["halacha","🌙 אֱמוּנָה – וֶאֱמוּנָתְךָ בַּלֵּילוֹת","חֶסֶד בַּבַּיִת – הוֹלְכִים בִּדְרָכָיו","אֵיךְ עֶזְרָה בַּבַּיִת נַעֲשֵׂית מִצְוָה, מָה אוֹמְרִים לִפְנֵי חֶסֶד, וְלָמָּה ה׳ אוֹהֵב אוֹתוֹ","../halacha-quiz/emuna-03.html"],["halacha","🙏 פִּרְקֵי הַתְּפִלָּה","לָמָּה מִתְפַּלְּלִים וְאֵיךְ מִתְכּוֹנְנִים","מַה הַמַּטָּרָה שֶׁל הַתְּפִלָּה, לָמָּה מִתְפַּלְּלִים הַרְבֵּה, וְאֵיךְ מַכְשִׁירִים אֶת הַלֵּב","../halacha-quiz/siddur-01.html"],["halacha","🙏 פִּרְקֵי הַתְּפִלָּה","בִּרְכוֹת הַשַּׁחַר וּבִרְכוֹת הַתּוֹרָה – תּוֹדָה עַל כָּל בֹּקֶר","מָה אוֹמְרִים כְּשֶׁקָּמִים, מָה מְבַקְּשִׁים בְּכָל בְּרָכָה, וְלָמָּה מְבָרְכִים עַל הַתּוֹרָה","../halacha-quiz/siddur-02.html"],["halacha","🙏 פִּרְקֵי הַתְּפִלָּה","שִׁירַת הַיּוֹם – פְּסוּקֵי דְזִמְרָה וּמִזְמוֹר לְתוֹדָה","מָה אוֹמְרִים לִפְנֵי שְׁמוֹנֶה עֶשְׂרֵה, מָה הַהֶבְדֵּל בֵּין שֶׁבַח לְהַלֵּל, וְלָמָּה תּוֹדָה פּוֹתַחַת שְׁעָרִים","../halacha-quiz/siddur-03.html"],["halacha","🙏 פִּרְקֵי הַתְּפִלָּה","הַלְלוּיָהּ – ה׳ מַשְׁגִּיחַ עַל הַכֹּל","שָׁלוֹשׁ הַשְׁגָּחוֹת בַּמִּזְמוֹרִים הָאַחֲרוֹנִים שֶׁל תְּהִלִּים: עָלַי, עַל עַם יִשְׂרָאֵל וְעַל כָּל הַבְּרִיאָה","../halacha-quiz/siddur-04.html"],["halacha","🙏 פִּרְקֵי הַתְּפִלָּה","נִשְׁמַת כָּל חַי – שִׁיר הַתּוֹדָה שֶׁל כָּל הַגּוּף","מָה אוֹמְרִים בַּנִּשְׁמַת, מָה פֵּרוּשׁ הַמִּלִּים, וְאֵיךְ הַגּוּף כֻּלּוֹ מוֹדֶה לַה׳","../halacha-quiz/siddur-05.html"],["halacha","🙏 פִּרְקֵי הַתְּפִלָּה","אָבוֹת, גְּבוּרוֹת וּקְדֻשָּׁה – שָׁלֹשׁ הַבְּרָכוֹת הָרִאשׁוֹנוֹת","מָה אוֹמְרִים בִּשְׁלוֹשׁ הַבְּרָכוֹת הָרִאשׁוֹנוֹת שֶׁל שְׁמוֹנֶה עֶשְׂרֵה, מָה פֵּרוּשָׁן, וּמָה חוֹשְׁבִים בָּהֶן","../halacha-quiz/siddur-06.html"],["halacha","🙏 פִּרְקֵי הַתְּפִלָּה","מְבַקְּשִׁים מֵאַבָּא – הַבַּקָּשׁוֹת וְהַגְּאֻלָּה","מָה מְבַקְּשִׁים בַּבְּרָכוֹת הָאֶמְצָעִיּוֹת, לָמָּה הֵן בָּאוֹת בַּסֵּדֶר הַזֶּה, וְאֵיךְ מִתְפַּלְּלִים גַּם עַל חֲבֵרִים","../halacha-quiz/siddur-07.html"],["halacha","🙏 פִּרְקֵי הַתְּפִלָּה","רְצֵה, מוֹדִים וְשִׂים שָׁלוֹם – תּוֹדָה וְשָׁלוֹם","אֵיךְ ה׳ מְקַבֵּל אֶת הַתְּפִלָּה, עַל מָה מוֹדִים, וְלָמָּה הַשָּׁלוֹם הוּא הַכְּלִי לַבְּרָכָה","../halacha-quiz/siddur-08.html"],["halacha","🙏 פִּרְקֵי הַתְּפִלָּה","אַשְׁרֵי וְעָלֵינוּ – שִׁיר שֶׁל שֶׁבַח וְתוֹדָה","לָמָּה אוֹמְרִים אַשְׁרֵי שָׁלֹשׁ פְּעָמִים בְּיוֹם, מָה יֵשׁ בִּשְׁלֹשֶׁת חֲלָקָיו, וּמָה אוֹמְרִים בְּ׳עָלֵינוּ לְשַׁבֵּחַ׳","../halacha-quiz/siddur-09.html"],["halacha","💛 אַהֲבַת ה׳","מַהִי אַהֲבַת ה׳?","מִצְוָה לְכָל גִּיל, הַדֶּרֶךְ הַפְּשׁוּטָה לְקַיֵּם אוֹתָהּ, וְאֵיךְ מַתְחִילִים עוֹד הַיּוֹם","../halacha-quiz/ahava-01.html"],["halacha","💛 אַהֲבַת ה׳","לָמָּה ה׳ בָּרָא אֶת הָעוֹלָם?","כְּדֵי לְהֵיטִיב: הָעוֹלָם נִבְרָא מֵאַהֲבָה, וְהַמִּצְווֹת הֵן נַחַת רוּחַ לַבּוֹרֵא","../halacha-quiz/ahava-02.html"],["halacha","💛 אַהֲבַת ה׳","הָאֹכֶל – מַתָּנָה מֵאַבָּא","מִי הֵבִיא לִי אֶת הַפְּרִי הַמָּתוֹק, לָמָּה חוֹשְׁבִים ׳מוֹדֶה אֲנִי לְךָ׳ לִפְנֵי בְּרָכָה, וְאֵיךְ טוֹעֲמִים בְּכַוָּנָה","../halacha-quiz/ahava-03.html"],["halacha","💛 אַהֲבַת ה׳","תּוֹדָה בְּעֵינַיִם","","../halacha-quiz/ahava-04.html"],["halacha","💛 אַהֲבַת ה׳","דַּקָּה שֶׁל תּוֹדָה בְּכָל יוֹם","מָה אָמַר הֶחָפֵץ חַיִּים עַל מִצְוַת אַהֲבַת ה׳, אֵיךְ מְחַבְּרִים דַּקַּת תּוֹדָה מִן הַלֵּב, וְלָמָּה לֹא מְמַהֲרִים","../halacha-quiz/ahava-05.html"],["halacha","💛 אַהֲבַת ה׳","עַיִן טוֹבָה פּוֹתַחַת אֶת הַלֵּב","מָה הִיא עַיִן טוֹבָה, לָמָּה קָשֶׁה לִרְאוֹת טוֹב, וְאֵיךְ רְאִיַּת הַטּוֹב מְחַזֶּקֶת אֶת הַהוֹדָיָה וְאֶת אַהֲבַת ה׳","../halacha-quiz/ahava-06.html"],["halacha","💛 אַהֲבַת ה׳","נִפְלְאוֹת הַבְּרִיאָה – מִתְבּוֹנְנִים וְאוֹהֲבִים","פֶּרַח, נְמָלָה וְשָׁעוֹן: אֵיךְ הַהִתְבּוֹנְנוּת בָּעוֹלָם מַגִּיעָה אֶל הַלֵּב","../halacha-quiz/ahava-07.html"],["halacha","💛 אַהֲבַת ה׳","גַּם זוֹ לְטוֹבָה – שְׁלוֹשָׁה סִפּוּרִים שֶׁל חֲזַ״ל","נַחוּם אִישׁ גַּם זוֹ, רַבִּי עֲקִיבָא וְאַבָּא יוּדָן: גַּם דְּבָרִים קָשִׁים בָּאִים מֵאַהֲבָה","../halacha-quiz/ahava-08.html"],["halacha","💛 אַהֲבַת ה׳","אַהֲבַת יִשְׂרָאֵל וְאַהֲבַת ה׳ – כָּל יְהוּדִי הוּא בֵּן יָקִיר","לָמָּה אוֹהֲבִים כָּל יְהוּדִי, וְאֵיךְ קוֹנִים אַהֲבָה לְחָבֵר בְּהִשְׁתַּוּוּת, בִּנְתִינָה, בִּתְפִלָּה וּבְמַחֲשָׁבָה","../halacha-quiz/ahava-09.html"],["halacha","💛 אַהֲבַת ה׳","קׇרְבַּן תּוֹדָה – הַכָּרָה, אֲמִירָה וּמַעֲשֶׂה","מִי מֵבִיא קָרְבַּן תּוֹדָה, לָמָּה אַרְבָּעִים לְחָמִים, וְאֵיךְ מוֹדִים לְה׳ בְּשָׁלוֹשׁ דְּרָכִים","../halacha-quiz/ahava-10.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַחִיּוּךְ","וּלְבֶן שִׁנַּיִם מֵחָלָב","לָמָּה חִיּוּךְ טוֹב יוֹתֵר מִכּוֹס חָלָב? הַגְּמָרָא, רַבִּי יוֹחָנָן וְהַחֲפֵץ חַיִּים","../halacha-quiz/chiyuch-01.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַחִיּוּךְ","שַׁמַּאי: סֵבֶר פָּנִים יָפוֹת","הֱוֵי מְקַבֵּל אֶת כָּל הָאָדָם – לָמָּה דַּוְקָא שַׁמַּאי הַקַּפְּדָן אָמַר זֹאת, וְלָמָּה זוֹ חוֹבָה","../halacha-quiz/chiyuch-02.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַחִיּוּךְ","הַפָּנִים שֶׁלִּי – רְשׁוּת הָרַבִּים","פָּנָיו שֶׁל אָדָם הֵם רְשׁוּת הָרַבִּים, וְהַלֵּב הוּא רְשׁוּת הַיָּחִיד. אֵיךְ שׁוֹמְרִים עַל פָּנִים שֶׁלֹּא מַזִּיקוֹת לְאַף אֶחָד?","../halacha-quiz/chiyuch-03.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַחִיּוּךְ","עִקַּר הַחֶסֶד הוּא הַלֵּב","בְּחֶסֶד חָשׁוּב אֵיךְ נוֹתְנִים יוֹתֵר מִמָּה שֶׁנּוֹתְנִים. מָה אוֹמֶרֶת הַגְּמָרָא, הַמַּהַרַ״ל וְהַשֻּׁלְחָן עָרוּךְ עַל סֵבֶר פָּנִים יָפוֹת?","../halacha-quiz/chiyuch-04.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַחִיּוּךְ","סֵבֶר פָּנִים יָפוֹת וְשִׂמְחָה","מָה הַהֶבְדֵּל בֵּין חִיּוּךְ לְשִׂמְחָה, וְאֵיךְ מְקַבְּלִים אוֹרֵחַ גַּם כְּשֶׁאֵין מַצַּב רוּחַ?","../halacha-quiz/chiyuch-05.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַחִיּוּךְ","תְּחַיֵּךְ וְתִהְיֶה שָׂמֵחַ","אַחֲרֵי הַמַּעֲשִׂים נִמְשָׁכִים הַלְּבָבוֹת – חִיּוּךְ שֶׁמְּשַׂמֵּחַ אוֹתָנוּ","../halacha-quiz/chiyuch-06.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַחִיּוּךְ","ה׳ צִלְּךָ – כְּמַיִם הַפָּנִים לַפָּנִים","אֵיךְ הַחִיּוּךְ שֶׁלָּנוּ מְעוֹרֵר חִיּוּךְ גַּם מִלְּמַעְלָה: הַצֵּל, הַמַּרְאָה וְאוֹר הַפָּנִים","../halacha-quiz/chiyuch-07.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַחִיּוּךְ","מְשַׂמְּחִים אֶת הָעֲצוּבִים","שְׁנֵי הַבַּדְחָנִים בַּשּׁוּק, הַמִּצְוָה הַגְּדוֹלָה בְּיוֹתֵר וְהַמְּשִׂימָה: לִהְיוֹת בַּדְחָן שֶׁל הַשּׁוּק","../halacha-quiz/chiyuch-08.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַחִיּוּךְ","חִיּוּךְ שֶׁל קִדּוּשׁ ה׳","אֵיךְ חִיּוּךְ וְ׳שָׁלוֹם׳ מְקַדְּשִׁים שֵׁם שָׁמַיִם? בַּדֶּרֶךְ, בְּבֵית הַמִּדְרָשׁ וּבַכִּתָּה","../halacha-quiz/chiyuch-09.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַחִיּוּךְ","חִיּוּךְ בַּבַּיִת","","../halacha-quiz/chiyuch-10.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַחִיּוּךְ","חֶדֶר הַכֹּשֶׁר שֶׁל הַפָּנִים","אֵיךְ מִתְאַמְּנִים בְּחִיּוּךְ? מַרְאָה, עִפָּרוֹן, שִׁחְרוּר לֶסֶת, יַהֲלוֹם וְ׳מוֹדֶה אֲנִי׳","../halacha-quiz/chiyuch-11.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַחִיּוּךְ","הַמַּדָּע שֶׁמֵּאֲחוֹרֵי הַמָּאוֹר","אֵיךְ חִיּוּךְ פּוֹעֵל עַל הַמֹּחַ וְעַל הַגּוּף? נוֹיְרוֹנֵי מַרְאָה, הִשָּׂרְדוּת וְשִׂגְשׁוּג, וְהַשִּׁנַּיִם כֵּלִים שֶׁל מִצְוָה","../halacha-quiz/chiyuch-12.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַחִיּוּךְ","הַיַּהֲלוֹם בַּעַל עֶשֶׂר הַפֵּאוֹת","חִיּוּךְ אֶחָד וַעֲשָׂרָה מִצְווֹת: מִ׳וְאָהַבְתָּ לְרֵעֲךָ׳ וְעַד נַחַת רוּחַ לַבּוֹרֵא","../halacha-quiz/chiyuch-13.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַחִיּוּךְ","מִצְוָה שֶׁמְּחַיָּה נְפָשׁוֹת","מָה הַהֶפֶךְ מִבּוּשָׁה? לְהַחְזִיר צֶבַע וְכֹחַ לְאָדָם עָצוּב, בְּחִיּוּךְ אֶחָד","../halacha-quiz/chiyuch-14.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַחִיּוּךְ","כְּשֶׁהָעֵינַיִם צוֹחֲקוֹת","מָה הַהֶבְדֵּל בֵּין חִיּוּךְ שֶׁל נִימוּס לְחִיּוּךְ שֶׁל אֱמֶת? מִן הַשְּׂפָתַיִם אֶל הָעֵינַיִם","../halacha-quiz/chiyuch-15.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַחִיּוּךְ","הַשִּׂמְחָה הִיא בְּחִירָה","רַבִּי קָלְמָן גּוֹלְדְשְׁמִידְט בָּחַר לִשְׂמֹחַ גַּם בִּתְקוּפָה קָשָׁה מְאוֹד","../halacha-quiz/chiyuch-16.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַחִיּוּךְ","סֻלַּם הַקִּנְיָן","","../halacha-quiz/chiyuch-17.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – עַיִן טוֹבָה","מָה הָעַיִן בּוֹחֶרֶת לִרְאוֹת","הֶחָסִיד וְהַשִּׁנַּיִם הַלְּבָנוֹת, הַזְּבוּב שֶׁבּוֹחֵר מָקוֹם מְלֻכְלָךְ, וְהַכּוֹס הַחֲצִי מְלֵאָה","../halacha-quiz/ayin-01.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – עַיִן טוֹבָה","וְהִנֵּה טוֹב מְאֹד","הַפָּסוּק שֶׁה׳ כָּתַב בִּשְׁבִילֵנוּ, בֶּן זוֹמָא וְהַלֶּחֶם, וּמִצְוַת ׳וְשָׂמַחְתָּ בְּכָל הַטּוֹב׳","../halacha-quiz/ayin-02.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – עַיִן טוֹבָה","רְאֵה, נָאִים, בִּשְׁבִילְךָ – מַתָּנוֹת בְּכָל יוֹם","אוֹר, לֶחֶם, מַיִם וַאֲוִיר, פְּרָחִים וְטַעֲמִים – וְאֵיךְ עוֹצְרִים לְרֶגַע וְאוֹמְרִים תּוֹדָה","../halacha-quiz/ayin-03.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – עַיִן טוֹבָה","הַדָּן אֶת חֲבֵרוֹ לְכַף זְכוּת – הַשָּׂכִיר וּבַעַל הַבַּיִת","הַסִּפּוּר הַמָּלֵא מִן הַגְּמָרָא, חֲמִשָּׁה הֶסְבֵּרִים טוֹבִים, וְאֵיךְ דָּנִים חָבֵר לִזְכוּת","../halacha-quiz/ayin-04.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – עַיִן טוֹבָה","נְקֻדָּה טוֹבָה בְּכָל חָבֵר","אֵיךְ מוֹצְאִים מְעַט טוֹב בְּכָל אֶחָד, אֵיךְ מְסַפְּרִים בְּשִׁבְחוֹ שֶׁל חָבֵר, וְלָמָּה ה׳ לֹא מַבִּיט בַּחֶסְרוֹנוֹת","../halacha-quiz/ayin-05.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – עַיִן טוֹבָה","נְקֻדָּה טוֹבָה בְּתוֹכִי","אֵיךְ מוֹצְאִים מְעַט טוֹב בְּעַצְמִי, לָמָּה אָסוּר לִפֹּל בְּעֶצֶב, וְאֵיךְ שָׁרִים לַה׳ גַּם כְּשֶׁלֹּא הַכֹּל מֻשְׁלָם","../halacha-quiz/ayin-06.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – עַיִן טוֹבָה","הָעֵינַיִם שֶׁל הַמְּרַגְּלִים","אֵיךְ רוֹאִים אֶת הָאָרֶץ הַטּוֹבָה, לָמָּה הָעַיִן הוֹלֶכֶת אַחַר הַלֵּב, וְאֵיךְ מִתְרַגְּלִים לִרְאוֹת טוֹב","../halacha-quiz/ayin-07.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – עַיִן טוֹבָה","רַבִּי עֲקִיבָא – אֲבִי הָאוֹפְּטִימִיּוּת","הַבְּאֵר שֶׁבְּלוֹד, הַשּׁוּעָל עַל הַר הַבַּיִת, וְהַבִּטָּחוֹן שֶׁתָּמִיד יָבוֹא הַטּוֹב","../halacha-quiz/ayin-08.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – עַיִן טוֹבָה","מָה אֲנִי אוֹמֵר עַל מָה שֶׁקָּרָה","אֵיךְ הָאוֹפְּטִימִי מֵסְבִּיר מִקְרֶה: הַטּוֹב בָּא מִמֶּנִּי, הָרַע קָצָר וְלֹא הוֹרֵס אֶת הַכֹּל, וְכִשָּׁלוֹן הוּא לֶקַח","../halacha-quiz/ayin-09.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – עַיִן טוֹבָה","תַּחְשֹׁב טוֹב","","../halacha-quiz/ayin-10.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שִׂמְחָה","מַהִי שִׂמְחָה?","","../halacha-quiz/simcha-01.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שִׂמְחָה","׳יִשְׂרָאֵל מֵאִיר, אֵינְךָ שָׂמֵחַ מַסְפִּיק׳","חֶשְׁבּוֹן הַנֶּפֶשׁ שֶׁל הֶחָפֵץ חַיִּים: לֹא רַק לְקַיֵּם מִצְוָה, אֶלָּא לִשְׂמֹחַ בָּהּ, וּלְהַגְדִּיל אֶת הַשִּׂמְחָה כָּל יוֹם","../halacha-quiz/simcha-02.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שִׂמְחָה","מִצְוָה זֶה דּוֹרוֹן מֵהַמֶּלֶךְ","סֵפֶר חֲרֵדִים: כָּל מִצְוָה הִיא מַתָּנָה מֵהַמֶּלֶךְ, וּמִי שֶׁמַּרְגִּישׁ אֶת זֶה שָׂמֵחַ, גַּם בְּמִצְוָה קְטַנָּה","../halacha-quiz/simcha-03.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שִׂמְחָה","כַּמָּה שָׁוָה מִצְוָה?","פַּחִית אוֹ שָׁעָה שֶׁל תּוֹרָה? שְׁלוֹשָׁה סִפּוּרִים שֶׁעוֹזְרִים לַלֵּב לְהַרְגִּישׁ אֶת עֵרֶךְ הַמִּצְוָה","../halacha-quiz/simcha-04.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שִׂמְחָה","הַתִּינוֹק שֶׁבּוֹרֵחַ מִבֵּית הַסֵּפֶר","מָה קוֹרֶה כְּשֶׁהַגּוּף עוֹשֶׂה מִצְוָה וְהַלֵּב בַּחוּץ, לָמָּה הַלֵּב חָשׁוּב בַּמִּצְוָה, וְאֵיךְ מַחֲזִירִים אֵלֶיהָ חַיּוּת וְשִׂמְחָה","../halacha-quiz/simcha-05.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שִׂמְחָה","שִׂמְחָה שֶׁנִּשְׁאֶרֶת","","../halacha-quiz/simcha-06.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שִׂמְחָה","מְבַקְּשִׁים לִהְיוֹת שְׂמֵחִים","אֵיךְ לוֹמְדִים שִׂמְחָה בְּמִצְוֹת: מַחְלִיטִים, מְבַקְּשִׁים מֵה׳, אוֹמְרִים תּוֹדָה, שָׁרִים וְרָצִים לַמִּצְוָה","../halacha-quiz/simcha-07.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שִׂמְחָה","כְּשֶׁאֲנִי שָׂמֵחַ, ה׳ שָׂמֵחַ","לָמָּה ה׳ בָּרָא אֶת הָעוֹלָם, מָה קוֹרֶה כְּשֶׁאֲנִי נֶהֱנֶה מִמִּצְוָה, וְאֵיךְ אֲנִי מְשַׂמֵּחַ אֶת אַבָּא שֶׁבַּשָּׁמַיִם","../halacha-quiz/simcha-08.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שִׂמְחָה","שִׂמְחַת הֶחָג: ׳עַכְּבוּ עִמָּדִי׳","הַמֶּלֶךְ וּבָנָיו, ׳וְהָיִיתָ אַךְ שָׂמֵחַ׳, וְאֵיךְ מְשַׂמְּחִים אֶת כֻּלָּם בֶּחָג","../halacha-quiz/simcha-09.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שִׂמְחָה","גַּם בְּיוֹם שֶׁאֵין חֵשֶׁק","כְּשֶׁהַלֵּב סָגוּר, כְּשֶׁנּוֹפְלִים, וְאֵיךְ חוֹזְרִים לְשִׂמְחָה בִּצְעָדִים קְטַנִּים: שְׁבוּעַ שֶׁל שִׂמְחָה","../halacha-quiz/simcha-10.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שִׂמְחָה","אֵיזֶהוּ עָשִׁיר?","","../halacha-quiz/simcha-11.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שִׂמְחָה","הַמַּתָּנָה שֶׁל יוֹם הַהוּלֶדֶת","הַמַּתָּנָה הַגְּדוֹלָה בְּיוֹתֵר שֶׁקִּבַּלְנוּ הִיא עֶצֶם הַחַיִּים. לָמָּה יוֹם הַהוּלֶדֶת הוּא יוֹם שֶׁל שִׂמְחָה, וּמָה הָעֲנִי שֶׁהִתְלוֹנֵן בַּמָּטוֹס מְלַמֵּד אוֹתָנוּ","../halacha-quiz/simcha-12.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שִׂמְחָה","הָאוֹרְחִים וְהַמָּרָק","אוֹרְחִים קִבְּלוּ דָּגִים וְעוֹפוֹת וְהִתְלוֹנְנוּ עַל הַמָּרָק. מָה זֶה מְלַמֵּד עָלֵינוּ, מָה אָמַר הָרַמְבַּ״ן עַל הַמִּתְאוֹנְנִים, וְאֵיךְ תְּלוּנוֹת הָפְכוּ לְרִקּוּדִים","../halacha-quiz/simcha-13.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שִׂמְחָה","הַיֵּשׁ וְהָאַיִן","","../halacha-quiz/simcha-14.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שִׂמְחָה","מַתָּנַת חִנָּם","","../halacha-quiz/simcha-15.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שִׂמְחָה","לְלַמֵּד אֶת הַלֵּב לִשְׂמֹחַ","שִׂמְחָה אֲמִתִּית צְרִיכָה עָמָל, לִימּוּד וְהוֹדָיָה: נְשִׁימָה, רְאִיָּה וּמַתָּנוֹת הָעוֹלָם","../halacha-quiz/simcha-16.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שִׂמְחָה","הַמַּאֲבָק הָעַצְלָנִי","מִי מְנַצֵּחַ בַּמַּאֲבָק? מָה הַיֵּצֶר רוֹצֶה, וְאֵיךְ שִׂמְחָה וּזְרִיזוּת מְחַזְּקוֹת זוֹ אֶת זוֹ","../halacha-quiz/simcha-17.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שִׂמְחָה","שֶׁלִּי וְשֶׁלְּךָ","","../halacha-quiz/simcha-18.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שִׂמְחָה","גַּם ה׳ שָׂמֵחַ בְּחֶלְקוֹ","מָה פֵּרוּשׁ ׳חֶלְקוֹ׳ שֶׁל הַקָּדוֹשׁ בָּרוּךְ הוּא, וְאֵיךְ אָנוּ לוֹמְדִים מִמֶּנּוּ לִהְיוֹת שְׂמֵחִים בְּחֶלְקֵנוּ","../halacha-quiz/simcha-19.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שִׂמְחָה","הַקַּסְדָּה וְכוֹס הַמַּיִם","אֵיךְ שׁוֹמֵר עָלֵינוּ חֶסֶד ה׳ שֶׁבַּגּוּף, וְאֵיךְ אֲפִלּוּ כּוֹס מַיִם הִיא מַתָּנָה נִפְלָאָה מִן הַנּוֹתֵן","../halacha-quiz/simcha-20.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שִׂמְחָה","בֶּכִי אוֹ שִׁירָה?","שְׁתֵּי דְּרָכִים לִפְנוֹת אֶל ה׳, וְלָמָּה שִׁיר שֶׁל תּוֹדָה פּוֹתֵחַ אֶת הַלֵּב","../halacha-quiz/simcha-21.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שִׂמְחָה","׳וּפַרְעֹה הִקְרִיב׳","אֵיךְ דָּבָר מַצִּיק יָכוֹל לְקָרֵב אוֹתָנוּ אֶל ה׳, וְאֵיזוֹ דֶּרֶךְ אַחֶרֶת יֵשׁ","../halacha-quiz/simcha-22.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שִׂמְחָה","טִיּוּל אוֹ רוֹפֵא שִׁנַּיִם?","לָמָּה דָּבָר קָשֶׁה לִפְעָמִים קַל, וְאֵיךְ אֶפְשָׁר לְהָפְכוֹ לְהִזְדַּמְּנוּת","../halacha-quiz/simcha-23.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שִׂמְחָה","בְּיוֹם שֶׁאֵין חֵשֶׁק","חוּט דַּק שֶׁל קֶשֶׁר, תְּפִלָּה קְצָרָה וְנִגּוּן – וְחוֹזְרִים מָחָר","../halacha-quiz/simcha-24.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שִׂמְחָה","הַפַּעַם הִצְלַחְתִּי!","אֵיךְ שָׂמֵחִים אַחֲרֵי טָעוּת: הַפַּעַם הִצְלַחְתִּי, עֲנָוָה, וְהַדֶּלֶת שֶׁתָּמִיד פְּתוּחָה","../halacha-quiz/simcha-25.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שִׂמְחָה","נִדְמֶה שֶׁמַּרְחִיקִים – וְצַעַד קָטָן מְקָרֵב","רַבִּי נַחְמָן מְלַמֵּד: מָה עוֹשִׂים כְּשֶׁנִּדְמֶה שֶׁאֲנִי לֹא מִתְקַדֵּם, אֵיךְ צַעַד קָטָן יָקָר, וְלָמָּה הָעִקָּר לִהְיוֹת בְּשִׂמְחָה","../halacha-quiz/simcha-26.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שִׂמְחָה","שִׁירָה לִפְנֵי הַמִּלְחָמָה","יְהוֹשָׁפָט, הַמְשׁוֹרְרִים בַּחֲזִית, וְאֵיךְ שִׁיר קָטָן עוֹזֵר לְמִי שֶׁמְּפַחֵד","../halacha-quiz/simcha-27.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שִׂמְחָה","הַשִּׁיר שֶׁעוֹשֶׂה בְּרִיָּה חֲדָשָׁה","אֵיךְ שִׁיר נִשְׁאָר בַּלֵּב, מִתְפַּשֵּׁט בֵּין הָאֲנָשִׁים, וּפוֹתֵחַ הַתְחָלָה חֲדָשָׁה","../halacha-quiz/simcha-28.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שִׂמְחָה","הָרָעָה שֶׁהִיא זְכוּת","לָמָּה הָרָעָה לְעוֹבְדֵי ה׳ הִיא שִׂמְחָתָם, וְאֵיךְ שׁוֹמְרִים עַל הָאַהֲבָה גַּם כְּשֶׁקָּשֶׁה","../halacha-quiz/simcha-29.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שִׂמְחָה","הַהֲלִיכָה לְבֵית הָאֲבוֹת","אֵיךְ אֶפְשָׁר לִשְׂמֹחַ גַּם כְּשֶׁחָסֵר מַשֶּׁהוּ: רוֹאִים אֶת הַיֵּשׁ וְנוֹתְנִים לַאֲחֵרִים","../halacha-quiz/simcha-30.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכָּרַת הַטּוֹב לַה׳ (הוֹדָיָה)","מוֹדִים בְּשִׂמְחָה – כְּמוֹ יִתְרוֹ","מָה צָרִיךְ כְּדֵי שֶׁהַהוֹדָיָה תִּהְיֶה אֲמִתִּית, לָמָּה שָׂמַח יִתְרוֹ, וְאֵיךְ מוֹסִיפִים לַבְּרָכָה מִשְׁפָּט מִן הַלֵּב","../halacha-quiz/hodaya-01.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכָּרַת הַטּוֹב לַה׳ (הוֹדָיָה)","הַשֶּׁמֶשׁ שָׁרָה","","../halacha-quiz/hodaya-02.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכָּרַת הַטּוֹב לַה׳ (הוֹדָיָה)","אֱלִיעֶזֶר מוֹדֶה וּמְסַפֵּר","מָה עָשָׂה אֱלִיעֶזֶר אַחֲרֵי הַנֵּס, לָמָּה מוֹדִים עַל בְּשׂוֹרָה טוֹבָה, וְאֵיךְ מְסַפְּרִים בִּפְרָטִים","../halacha-quiz/hodaya-03.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכָּרַת הַטּוֹב לַה׳ (הוֹדָיָה)","הוֹדָיָה עַל הַהַתְחָלָה","לָמָּה חוֹגְגִים חֲנֻכָּה שְׁמוֹנָה יָמִים, מָה עָשׂוּ הַחַשְׁמוֹנָאִים כְּשֶׁמָּצְאוּ פַּךְ אֶחָד, וְאֵיךְ הוֹדָיָה עַל חֵלֶק מַמְשִׁיכָה אֶת הַטּוֹבָה","../halacha-quiz/hodaya-04.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכָּרַת הַטּוֹב לַה׳ (הוֹדָיָה)","מֵאָה בְּרָכוֹת בְּיוֹם","מָה תִּקֵּן דָּוִד הַמֶּלֶךְ, לָמָּה מוֹדִים שָׁוֶה מֵאָה, וְאֵיךְ בְּרָכָה אַחַר בְּרָכָה פּוֹתַחַת שְׁעָרִים","../halacha-quiz/hodaya-05.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכָּרַת הַטּוֹב לַה׳ (הוֹדָיָה)","לֵאָה: ׳הַפַּעַם אוֹדֶה׳","מָה הָיָה מְיֻחָד בַּהוֹדָיָה שֶׁל לֵאָה אִמֵּנוּ, וְלָמָּה מוֹדִים הֲכִי הַרְבֵּה עַל מָה שֶׁלֹּא הָיָה מַגִּיעַ לָנוּ","../halacha-quiz/hodaya-06.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכָּרַת הַטּוֹב לַה׳ (הוֹדָיָה)","בִּכּוּרִים: לְסַפֵּר מֵהַהַתְחָלָה","לָמָּה הַחַקְלָאִי אוֹמֵר פָּרָשָׁה שֶׁל הוֹדָיָה, מָה לָמַד רַבִּי יְרוּחָם, וְאֵיךְ מוֹדִים בִּפְרָטִים","../halacha-quiz/hodaya-07.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכָּרַת הַטּוֹב לַה׳ (הוֹדָיָה)","רְאוּ בָּנַי עַל מָה מִתְלוֹנְנִים","הַמָּן בַּמִּדְבָּר, הַשֻּׁלְחָן הַמָּלֵא וְהַשְּׁאֵלָה ׳אֵיפֹה הַחֲבִיתָה?׳ – וְאֵיךְ הוֹפְכִים תְּלוּנָה לְתוֹדָה","../halacha-quiz/hodaya-08.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכָּרַת הַטּוֹב לַה׳ (הוֹדָיָה)","מוֹדִים עַל מַה שֶּׁלֹּא קָרָה","רַבִּי זַלְמָן וְהַמַּגֶּבֶת, הָרֶגֶל הַשְּׁנִיָּה, וְהַנִּסִּים שֶׁלֹּא רוֹאִים – וְאֵיךְ מוֹדִים עֲלֵיהֶם","../halacha-quiz/hodaya-09.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכָּרַת הַטּוֹב לַה׳ (הוֹדָיָה)","קָטֹנְתִּי מִכֹּל הַחֲסָדִים","יַעֲקֹב לִפְנֵי עֵשָׂו, הַהוֹדָיָה שֶׁקּוֹדֶמֶת לַבַּקָּשָׁה, וּפִנְקַס הוֹדָיָה לַיְלָדִים","../halacha-quiz/hodaya-10.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכָּרַת הַטּוֹב לַה׳ (הוֹדָיָה)","הֶחָפֵץ חַיִּים בַּחֲצוֹת","מָה עָשָׂה הֶחָפֵץ חַיִּים בַּחֲצוֹת הַלַּיְלָה, לָמָּה פֵּרֵט כָּל טוֹבָה, וְאֵיךְ גַּם אֲנִי מוֹדֶה לִפְנֵי הַשֵּׁנָה","../halacha-quiz/hodaya-11.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכָּרַת הַטּוֹב לַה׳ (הוֹדָיָה)","תּוֹדָה שֶׁמַּרְגִּישִׁים","מָה עוֹשִׂים כְּדֵי שֶׁהַ׳תּוֹדָה׳ תֵּצֵא מִן הַלֵּב, לָמָּה בָּכָה הָרַב שַׁךְ עַל בְּרָכוֹת, וּמָה רָאָה רַבִּי יַעֲקֹב גְּלִינְסְקִי בַּכּוֹס","../halacha-quiz/hodaya-12.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכָּרַת הַטּוֹב לַה׳ (הוֹדָיָה)","מוֹדֶה אֲנִי בְּסִיבִּיר","מָה אָמַר רַבִּי יְחֶזְקֵאל אַבְרָמְסְקִי בַּבֹּקֶר הָרִאשׁוֹן בְּסִיבִּיר, וְעַל אֵיזֶה דָּבָר אִי אֶפְשָׁר לָקַחַת מִמֶּנּוּ","../halacha-quiz/hodaya-13.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכָּרַת הַטּוֹב לַה׳ (הוֹדָיָה)","מֵהַבּוֹרֵא יֵשׁ רַק טוֹב","מָה עָנָה הַמַּשְׁגִּיחַ רַבִּי דֹּב יָפֶה לָרוֹפֵא, מָה לָמַדְנוּ מִנְּשִׁיקָה שֶׁל אִמָּא, וְאֵיךְ מְשַׁנְּנִים אֶת הַחֲסָדִים כָּל יוֹם","../halacha-quiz/hodaya-14.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכָּרַת הַטּוֹב לַה׳ (הוֹדָיָה)","בִּרְכַּת הַמָּזוֹן בְּכַוָּנָה","רַבִּי שְׁלֹמֹה זַלְמָן אוֹיֶרְבַּךְ, ׳נוֹדֶה לְךָ׳ בְּלֵב, וְהוֹדָאָה מִקָּרוֹב","../halacha-quiz/hodaya-15.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכָּרַת הַטּוֹב לַה׳ (הוֹדָיָה)","הָאַדְּרֶ״ת וְהַלֶּחֶם","לֹא חֲבַל לְהַפְסִיד? מִצְוַת בִּרְכַּת הַמָּזוֹן, וְהַהוֹדָיָה עַל הַבְּרִית, הַתּוֹרָה וִירוּשָׁלַיִם","../halacha-quiz/hodaya-16.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכָּרַת הַטּוֹב לַה׳ (הוֹדָיָה)","רִקּוּד עַל הַשְּׂרֵפָה","רַבִּי שְׁמוּאֵל מוּנְקִיס, הַדָּבָר הַגָּדוֹל שֶׁאִי אֶפְשָׁר לִשְׂרֹף, וּבִרְכוֹת הַשַּׁחַר","../halacha-quiz/hodaya-17.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכָּרַת הַטּוֹב לַה׳ (הוֹדָיָה)","תּוֹדָה עַל כָּל פְּרָט","רַבִּי אֲלֶכְּסַנְדֶּר זִיסְקִינְד מוֹדֶה עַל חֶדֶר, עַל בְּגָדִים וְעַל כָּל חֵפֶץ – וְהָרַב מֶנְדֶּלְזוֹן פּוֹתֵחַ בְּ׳הוֹדוּ׳ בְּיוֹם חֹל","../halacha-quiz/hodaya-18.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכָּרַת הַטּוֹב לַה׳ (הוֹדָיָה)","הָאַחִים הַקְּדוֹשִׁים בַּחֶדֶר הַקָּטָן","הַקָּדוֹשׁ בָּרוּךְ הוּא הִכְנִיס אוֹתָנוּ לְכָאן – רַבִּי זוּשָׁא רוֹקֵד וְשָׂמֵחַ גַּם בְּמָקוֹם קָשֶׁה","../halacha-quiz/hodaya-19.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכָּרַת הַטּוֹב לַה׳ (הוֹדָיָה)","הָאוֹהֵב יִשְׂרָאֵל וְהַשִּׂמְחָה שֶׁל כֻּלָּם","תַּכְלִית הַבְּרִיאָה הִיא לְהֵיטִיב, וְהַצַּדִּיק מֵאָפְטָא מוֹצִיא הוֹן כְּדֵי לְשַׂמֵּחַ אָב לִפְנֵי חֲתֻנָּה – וּמְסַכְּמִים אֶת הַסִּדְרָה","../halacha-quiz/hodaya-20.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכָּרַת הַטּוֹב לַחֲבֵרִים וְלַהוֹרִים","תּוֹדָה שֶׁמַּרְגִּישִׁים","הַסֻּכָּרִיָּה שֶׁל הַנֶּכְדָּה, הַמִּכְתָּב שֶׁל דָּנָה, וְתוֹדָה שֶׁיּוֹצֵאת מִן הַלֵּב","../halacha-quiz/hakarat-01.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכָּרַת הַטּוֹב לַחֲבֵרִים וְלַהוֹרִים","מִי הוּא כְּפוּי טוֹבָה?","הָמָן שֶׁרָאָה רַק מָה שֶׁחָסֵר, פַּרְעֹה שֶׁלֹּא זָכַר אֶת יוֹסֵף, וְהַבּוֹר שֶׁשָּׁתִינוּ מִמֶּנּוּ","../halacha-quiz/hakarat-02.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכָּרַת הַטּוֹב לַחֲבֵרִים וְלַהוֹרִים","״דַּיֵּנוּ שֶׁמְּגַדְּלוֹת בָּנֵינוּ״","רַבִּי חִיָּיא שֶׁהֵבִיא מַתָּנָה בַּסּוּדָר, הַתּוֹדָה לַנֶּהָג, וְכָל מֵטִיב שֶׁהוּא שָׁלִיחַ שֶׁל ה׳","../halacha-quiz/hakarat-03.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכָּרַת הַטּוֹב לַחֲבֵרִים וְלַהוֹרִים","מֹשֶׁה לֹא הִכָּה אֶת הַיְאוֹר","הַיְאוֹר וְהֶעָפָר שֶׁהֵגֵנּוּ, הַכְּלָבִים שֶׁקִּבְּלוּ שָׂכָר, וְהַכָּרַת הַטּוֹב שֶׁבּוֹנָה אֶת הַלֵּב","../halacha-quiz/hakarat-04.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכָּרַת הַטּוֹב לַחֲבֵרִים וְלַהוֹרִים","מֹשֶׁה לֹא שׁוֹכֵחַ מִי פָּתַח לוֹ אֶת הַדֶּלֶת","מֹשֶׁה, יִתְרוֹ וְצִפּוֹרָה: לָמָּה גַּם בִּשְׁעַת מִשִּׂימָה גְּדוֹלָה זוֹכְרִים מִי עָזַר לָנוּ, וְאֵיךְ מַחְזִירִים טוֹבָה","../halacha-quiz/hakarat-05.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכָּרַת הַטּוֹב לַחֲבֵרִים וְלַהוֹרִים","אַלּוּפִי וּמְיֻדָּעִי – תּוֹדָה לַמּוֹרֶה","דָּוִד וַאֲחִיתֹפֶל, רַבִּי אֱלִיָּהוּ לוֹפְּיָאן וְרַבִּי חַיִּים לֵייבּ: לָמָּה מוֹדִים לְמִי שֶׁלִּמֵּד אוֹתָנוּ, וְאֵיךְ","../halacha-quiz/hakarat-06.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכָּרַת הַטּוֹב לַחֲבֵרִים וְלַהוֹרִים","תּוֹדָה לְאִמָּא וּלְאַבָּא עַל הַדְּבָרִים הַקְּטַנִּים","לָמָּה קָשֶׁה לְהוֹדוֹת לַהוֹרִים עַל מָה שֶׁקּוֹרֶה כָּל יוֹם, מָה אוֹמֵר סֵפֶר הַחִנּוּךְ, וְאֵיךְ תּוֹדָה קְטַנָּה מְקָרֶבֶת לְהוֹדוֹת לַה׳","../halacha-quiz/hakarat-07.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכָּרַת הַטּוֹב לַחֲבֵרִים וְלַהוֹרִים","הַמַּתָּנָה שֶׁמַּטָּה אֶת הַלֵּב","לָמָּה אָסוּר לְשׁוֹפֵט לְקַבֵּל מַתָּנָה, וְאֵיךְ מַכִּירִים טוֹבָה וְנִשְׁאָרִים הוֹגְנִים","../halacha-quiz/hakarat-08.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכָּרַת הַטּוֹב לַחֲבֵרִים וְלַהוֹרִים","שָׁלוֹם – וְלֹא גּוֹזְלִים אֶת הַתּוֹדָה","לָמָּה מַקְדִּימִים שָׁלוֹם, מַחֲזִירִים שָׁלוֹם, וּמוֹדִים גַּם לְמִי שֶׁלֹּא מְצַפֶּה","../halacha-quiz/hakarat-09.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכָּרַת הַטּוֹב לַחֲבֵרִים וְלַהוֹרִים","הַכָּרַת הַטּוֹב – הַדֶּרֶךְ לַה׳","לָמָּה הַכּוֹפֵר בְּטוֹבַת חֲבֵרוֹ לְסוֹף כּוֹפֵר בְּטוֹבַת ה׳, וְאֵיךְ תּוֹדָה לְאָדָם מְקָרֶבֶת אוֹתָנוּ לַה׳","../halacha-quiz/hakarat-10.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – כִּבּוּד אָב וָאֵם","עַל הַלּוּחוֹת, בַּצַּד הַיְמָנִי","לָמָּה כִּבּוּד הוֹרִים נִכְתַּב בַּלּוּחוֹת, וְלָמָּה יֶלֶד צָרִיךְ אֶת הוֹרָיו הַרְבֵּה שָׁנִים","../halacha-quiz/kibud-01.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – כִּבּוּד אָב וָאֵם","דָּמָא בֶּן נְתִינָה – הַמַּפְתֵּחַ מִתַּחַת לַכַּר","סוֹחֵר מֵאַשְׁקְלוֹן שֶׁוִּתֵּר עַל אַלְפֵי דִּינָרִים כְּדֵי לֹא לְהָעִיר אֶת אָבִיו","../halacha-quiz/kibud-02.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – כִּבּוּד אָב וָאֵם","רַבִּי טַרְפוֹן – ׳אֲנִי בְּעַצְמִי׳","עָשִׁיר עִם מְשָׁרְתִים שֶׁעָזַר לְאִמּוֹ בְּעַצְמוֹ, וְסִפּוּר הַסַּנְדָּל בְּשַׁבָּת","../halacha-quiz/kibud-03.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – כִּבּוּד אָב וָאֵם","אֲבִימִי: ׳הֵן, הֵן׳","חֲמִשָּׁה בָּנִים תַּלְמִידֵי חֲכָמִים, וְאֲבִימִי רָץ בְּעַצְמוֹ אֶל אָבִיו וְעוֹמֵד עִם הַכּוֹס","../halacha-quiz/kibud-04.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – כִּבּוּד אָב וָאֵם","חֲצִי שָׁעָה כָּל יוֹם","מָה עָשָׂה הַחֲזוֹן אִישׁ כָּל יוֹם בִּשְׁבִיל אִמּוֹ, לָמָּה בָּא מֵעַצְמוֹ, וְאֵיךְ גַּם אֲנִי יָכוֹל לְהַחֲזִיר לַהוֹרִים","../halacha-quiz/kibud-05.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – כִּבּוּד אָב וָאֵם","לְכַבֵּד בְּשִׂמְחָה","","../halacha-quiz/kibud-06.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – כִּבּוּד אָב וָאֵם","גְּדוֹלִים כִּי כִּבְּדוּ","אֵיךְ כִּבְּדוּ הָאַמְרֵי אֱמֶת, רַבִּי חַיִּים מִבְּרִיסְק, יוֹתָם וְרַב יוֹסֵף אֶת הוֹרֵיהֶם, וּמָה אֲנִי יָכוֹל לִלְמֹד מֵהֶם","../halacha-quiz/kibud-07.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – כִּבּוּד אָב וָאֵם","כְּשֶׁחוֹלְקִים בְּדֵעוֹת – וְשׁוֹמְרִים עַל הַכָּבוֹד","אֵיךְ מְדַבְּרִים עִם הוֹרִים כְּשֶׁחוֹשְׁבִים אַחֶרֶת, וְלָמָּה הֵם צְרִיכִים לְהַרְגִּישׁ שֶׁהֵם חֲשׁוּבִים","../halacha-quiz/kibud-08.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – כִּבּוּד אָב וָאֵם","חוֹב שֶׁמְּשַׁלְּמִים בְּשִׂמְחָה","לָמָּה כִּבּוּד הוֹרִים הוּא פֵּרָעוֹן חוֹב, וְאֵיךְ הַכָּרַת הַטּוֹב מֵהַלֵּב מוֹבִילָה גַּם אֶל ה׳","../halacha-quiz/kibud-09.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – כִּבּוּד אָב וָאֵם","מִצְוָה שֶׁנַּעֲשֵׂית כֶּתֶר","רַבִּי טַרְפוֹן וְהַסַּנְדָּל, ״עוֹד לֹא הִגִּיעַ לַחֲצִי״, וְכִבּוּד הוֹרִים כְּגֶשֶׁר לְהַכָּרַת הַטּוֹב וּלְאַהֲבַת ה׳","../halacha-quiz/kibud-10.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – חֶסֶד","מַהוּ חֶסֶד? לָתֵת מִן הַלֵּב","לָמָּה חֶסֶד הוּא לֹא רַק לַעֲזֹר לְמִי שֶׁחָסֵר לוֹ, אֵיךְ מוֹדְדִים אוֹתוֹ, וְלָמָּה צָרִיךְ גַּם לֵב שֶׁאוֹהֵב לָתֵת","../halacha-quiz/chesed-01.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – חֶסֶד","עוֹלָם חֶסֶד יִבָּנֶה","לָמָּה ה׳ בָּרָא אוֹתָנוּ צְרִיכִים, אֵיךְ כָּל טוֹב הוּא חֶסֶד, וְאֵיךְ אֲנִי יָכוֹל לְהַמְשִׁיךְ אוֹתוֹ הָלְאָה","../halacha-quiz/chesed-02.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – חֶסֶד","הַבִּירָה הַדּוֹלֶקֶת","מָה לָמַד אַבְרָהָם מִן הַמָּשָׁל, אֵיךְ מַחְזִירִים טוֹבָה לַבּוֹרֵא, וְלָמָּה אָמַר לָאוֹרְחִים לְהוֹדוֹת לַה׳","../halacha-quiz/chesed-03.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – חֶסֶד","רוֹעֵי צֹאן","","../halacha-quiz/chesed-04.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – חֶסֶד","הַתּוֹרָה מַתְחִילָה וְנִגְמֶרֶת בְּחֶסֶד","אֵיךְ הוֹלְכִים בְּדַרְכֵי ה׳: מַלְבִּישִׁים, מְבַקְּרִים חוֹלִים, מְנַחֲמִים אֲבֵלִים, וְהַתּוֹרָה כֻּלָּהּ חֶסֶד","../halacha-quiz/chesed-05.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – חֶסֶד","חֶסֶד וְרַחֲמִים","","../halacha-quiz/chesed-06.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – חֶסֶד","חֶסֶד בִּמְגִלַּת רוּת","מִי עוֹשֶׂה חֶסֶד עִם מִי בִּמְגִלַּת רוּת, מַה לָמַד רַבִּי זְעֵירָא, וּמַה נּוֹתֵן מִי שֶׁמְּקַבֵּל","../halacha-quiz/chesed-07.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – חֶסֶד","רַבִּי חֲנִינָא בֶּן דּוֹסָא – לִפְנִים מִשּׁוּרַת הַדִּין","הַתַּרְנְגוֹלִים הָאֲבוּדִים, מַה פֵּרוּשׁ לִפְנִים מִשּׁוּרַת הַדִּין, וְאֵיךְ אֶפְשָׁר לָתֵת גַּם כְּשֶׁיֵּשׁ מְעַט – בְּבִטָּחוֹן בַּה׳","../halacha-quiz/chesed-08.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – חֶסֶד","לָשִׂים לֵב לַצַּעַר","מֹשֶׁה שֶׁחוֹשֵׁשׁ לְצַעֵר אֶת אַהֲרֹן, רַבִּי פְּרִידָא וְהַסַּבְלָנוּת, וְאֵיךְ מְצַיְּרִים בַּלֵּב אֶת הַצַּעַר שֶׁל הַשֵּׁנִי","../halacha-quiz/chesed-09.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – חֶסֶד","כִּי חֶסֶד חָפַצְתִּי","בֵּית הַמִּקְדָּשׁ וְרַבִּי יְהוֹשֻׁעַ, חֶסֶד שֶׁמּוֹצִיא אוֹתִי מֵ׳רַק אֲנִי׳, וּדְרָכִים לִקְנוֹת אַהֲבַת חֶסֶד","../halacha-quiz/chesed-10.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכְנָסַת אוֹרְחִים","יוֹשֵׁב בְּפֶתַח הָאֹהֶל","אַבְרָהָם יוֹשֵׁב בַּחוּץ בְּיוֹם חַם וּמִצְטַעֵר שֶׁאֵין אוֹרְחִים – מָה זֶה אַהֲבַת חֶסֶד, וְאֵיךְ מְחַפְּשִׂים הִזְדַּמְנוּת לָתֵת","../halacha-quiz/orchim-01.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכְנָסַת אוֹרְחִים","וַיָּרָץ לִקְרָאתָם","","../halacha-quiz/orchim-02.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכְנָסַת אוֹרְחִים","וַיְמַהֵר – רֵץ וּמַהֵר","אַבְרָהָם רָץ וּמְמַהֵר בְּכָל הַסִּפּוּר – מָה אוֹמֶרֶת הַזְּרִיזוּת, וְאֵיךְ מַתְחִילִים לָרוּץ גַּם כְּשֶׁאֵין חֵשֶׁק","../halacha-quiz/orchim-03.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכְנָסַת אוֹרְחִים","גְּדוֹלָה הַכְנָסַת אוֹרְחִים מִקַּבָּלַת פְּנֵי שְׁכִינָה","אַבְרָהָם מְבַקֵּשׁ מֵה׳ לְהַמְתִּין וְרָץ אֶל הָאוֹרְחִים – מַדּוּעַ זוֹ הֲלִיכָה בְּדַרְכֵי ה׳, וּמָה רוֹאִים בְּכָל אוֹרֵחַ","../halacha-quiz/orchim-04.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכְנָסַת אוֹרְחִים","קֹדֶם כֹּל – אֶל שָׂרָה","אֵיךְ מְשַׁתְּפִים אֶת כָּל הַבַּיִת בְּאִירוּחַ, וְלָמָּה אַבְרָהָם בִּקֵּשׁ קֶמַח וְנָתַן לִבְחֹר סֹלֶת","../halacha-quiz/orchim-05.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכְנָסַת אוֹרְחִים","חֶסֶד שֶׁל הֶרְגֵּל","","../halacha-quiz/orchim-06.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכְנָסַת אוֹרְחִים","מַלְאָכִים שֶׁאֵינָם אוֹכְלִים","לָמָּה הַתּוֹרָה מְסַפֶּרֶת עַל אוֹרְחִים שֶׁלֹּא צְרִיכִים כְּלוּם, וּמָה אֶפְשָׁר לָתֵת לְאוֹרֵחַ שֶׁיֵּשׁ לוֹ הַכֹּל","../halacha-quiz/orchim-07.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכְנָסַת אוֹרְחִים","רִבְקָה – יוֹתֵר מִמָּה שֶׁבִּקְשׁוּ","מַה בָּדַק אֱלִיעֶזֶר בַּבְּאֵר, לָמָּה הַשְׁקָיַת הַגְּמַלִּים הִיא חֶסֶד מְיֻחָד, וְאֵיךְ נוֹתְנִים יוֹתֵר מִמָּה שֶׁמְּבַקְּשִׁים","../halacha-quiz/orchim-08.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכְנָסַת אוֹרְחִים","אוֹכֵל פֵּרוֹתֵיהֶם בָּעוֹלָם הַזֶּה","מָה קִבְּלוּ אַבְרָהָם וְשָׂרָה, לוֹט, הַשּׁוּנַמִּית וְאַלְמָנַת צָרְפַת בִּזְכוּת הַכְנָסַת אוֹרְחִים, וְלָמָּה פּוֹתְחִים אֶת הַבַּיִת מֵאַהֲבָה","../halacha-quiz/orchim-09.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכְנָסַת אוֹרְחִים","וַיִּטַּע אֶשֶׁל","","../halacha-quiz/orchim-10.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכְנָסַת אוֹרְחִים","הַפְתָּעוֹת קְטַנּוֹת לָאוֹרֵחַ","אֵיךְ מַרְגִּישׁ אוֹרֵחַ עָיֵף שֶׁמַּגִּיעַ, אֵילוּ דְּבָרִים קְטַנִּים הוֹפְכִים אֶת הַבַּיִת לְחַם וְנָעִים, וּמָה עוֹשֶׂה אוֹרֵחַ טוֹב","../halacha-quiz/orchim-11.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכְנָסַת אוֹרְחִים","הֶחָפֵץ חַיִּים בּוֹדֵק אֶת הַמִּטָּה","אוֹרֵחַ עָיֵף בַּגֶּשֶׁם, זָקֵן שֶׁטָּרַח בְּעַצְמוֹ לִבְדֹּק אִם הַמִּטָּה נוֹחָה, וְהַשְּׁאֵלָה שֶׁל מְאָרֵחַ טוֹב: מָה הָיִיתִי רוֹצֶה","../halacha-quiz/orchim-12.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכְנָסַת אוֹרְחִים","הַגְּר״א וְהַפַּרְוָה","לַיְלָה קַר אֵצֶל רַב זָקֵן, פַּרְוָה שֶׁנִּפְרֶמֶת, וְהַלֶּקַח: מְאָרֵחַ טוֹב רוֹאֶה אֶת הָעוֹלָם דֶּרֶךְ הָעֵינַיִם שֶׁל הָאוֹרֵחַ","../halacha-quiz/orchim-13.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכְנָסַת אוֹרְחִים","רַבִּי חַיִּים מִבְּרִיסְק – הַדֶּלֶת פְּתוּחָה","אוֹרֵחַ שֶׁלָּקַח כֵּלִים, אַרְבָּעִים חַיָּלִים בְּעֶרֶב סֻכּוֹת, וְהַהַגְבָּהָה שֶׁל רַבִּי חַיִּים: לָמָּה הַדֶּלֶת צְרִיכָה לִהְיוֹת פְּתוּחָה לְכָל אֶחָד","../halacha-quiz/orchim-14.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכְנָסַת אוֹרְחִים","הַמִּטָּה שֶׁל הַגְּדוֹלִים","אֵיךְ גְּדוֹלֵי יִשְׂרָאֵל וִתְּרוּ עַל הַמִּטָּה שֶׁלָּהֶם בִּשְׁבִיל אוֹרֵחַ, וּמָה אֲנִי יָכוֹל לְוַתֵּר עָלָיו","../halacha-quiz/orchim-15.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכְנָסַת אוֹרְחִים","הֶחָזוֹן אִישׁ – פָּטוּר מִן הַתְּפִלָּה, לֹא מֵהַכְנָסַת אוֹרְחִים","לָמָּה הָאוֹרֵחַ אֵינוֹ מַטְרִיחַ, מָה פֵּרוּשׁ ׳אֶתְרוֹג׳ וּמָה מְחַפְּשִׂים כְּשֶׁאֶפְשָׁר לְהִפָּטֵר","../halacha-quiz/orchim-16.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכְנָסַת אוֹרְחִים","אוֹרֵחַ בְּכָל אֲרוּחָה","אֵיךְ גְּדוֹלֵי יִשְׂרָאֵל לֹא אָכְלוּ לְבַד, וּמִי יוֹשֵׁב לְבַד אֶצְלֵנוּ בַּהֲפְסָקָה","../halacha-quiz/orchim-17.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכְנָסַת אוֹרְחִים","לְלַוּוֹת אֶת הָאוֹרֵחַ","לָמָּה יוֹצְאִים עִם הָאוֹרֵחַ מִן הַבַּיִת, כַּמָּה הוֹלְכִים אִתּוֹ, וְאֵיךְ גַּם טֶלֶפוֹן הוּא לְוָיָה","../halacha-quiz/orchim-18.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכְנָסַת אוֹרְחִים","הַזְמָנָה בַּדֶּרֶךְ","","../halacha-quiz/orchim-19.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – הַכְנָסַת אוֹרְחִים","הַדִּירָה שֶׁל סָבָא","אֵיךְ דִּירָה רֵיקָה נַעֲשֵׂית בַּיִת פָּתוּחַ לָאוֹרְחִים, מָה לָמַדְנוּ מִן הַפּוֹנְדָּק בְּתַחֲנַת הָרַכֶּבֶת, וְאֵיךְ כָּל הָעוֹלָם הוּא בֵּית הַאֲרָחָה","../halacha-quiz/orchim-20.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – צְדָקָה וּנְתִינָה","מַהִי צְדָקָה?","","../halacha-quiz/tzedaka-01.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – צְדָקָה וּנְתִינָה","תֶּן לוֹ מִשֶּׁלּוֹ – רַבִּי אֶלְעָזָר אִישׁ בַּרְתּוֹתָא","הַגַּבָּאִים בּוֹרְחִים, הַיְתוֹמִים קוֹדְמִים, וּמַחְסָן אֶחָד מִתְמַלֵּא בְּחִטָּה","../halacha-quiz/tzedaka-02.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – צְדָקָה וּנְתִינָה","צְדָקָה תַּצִּיל מִמָּוֶת – בַּת רַבִּי עֲקִיבָא","עָנִי בַּפֶּתַח, סִיכָּה בַּקִּיר, וְהַנֵּס שֶׁל הַמַּעֲשֶׂה הַקָּטָן","../halacha-quiz/tzedaka-03.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – צְדָקָה וּנְתִינָה","בְּלִי לְהַלְבִּין פָּנִים – הַצְּרוֹר וְהַנָּחָשׁ","פּוֹעֵל אֶחָד אָסַף לֶחֶם מִכֻּלָּם, וְהָעָנִי אָכַל בְּכָבוֹד – וְנִמְצָא נָחָשׁ חָתוּךְ בַּצְּרוֹר","../halacha-quiz/tzedaka-04.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – צְדָקָה וּנְתִינָה","דֵּי מַחְסוֹרוֹ – רָבָא וְקֻפַּת הַצְּדָקָה","מָה בִּקֵּשׁ עָנִי מִקֻּפַּת הַצְּדָקָה, לָמָּה רָבָא הִתְלַבֵּט, וְאֵיךְ בָּאָה הַתְּשׁוּבָה בְּדִיּוּק בַּזְּמַן","../halacha-quiz/tzedaka-05.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – צְדָקָה וּנְתִינָה","מַתָּן בַּסֵּתֶר – הַדִּינָר שֶׁל רַבִּי שִׁמְעוֹן בַּר בָּא","אֵיךְ עוֹזְרִים לְחָבֵר בְּלִי לְהַבִּיךְ אוֹתוֹ, מָה לָמַדְנוּ מִשְּׁנֵי חֲכָמִים גְּדוֹלִים, וּמָה אוֹמֵר הָרַמְבַּ״ם","../halacha-quiz/tzedaka-06.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – צְדָקָה וּנְתִינָה","הַדּוֹרוֹן שֶׁל הַקָּדוֹשׁ בָּרוּךְ הוּא","לָמָּה הַזֹּהַר קוֹרֵא לֶעָנִי דּוֹרוֹן, מָה הוּא חוּט הַחֶסֶד, וְאֵיךְ חֹדֶשׁ שֶׁל שְׂכִירוּת חָזַר בְּרָכָה","../halacha-quiz/tzedaka-07.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – צְדָקָה וּנְתִינָה","גַּם הֶעָנִי נוֹתֵן","מַר זוּטְרָא אוֹמֵר: גַּם מִי שֶׁמְּקַבֵּל עֶזְרָה יָכוֹל לָתֵת. מָשָׁל הַזּוֹרֵעַ, הַגּוּף הַמִּתְחַדֵּשׁ וְהַבִּטָּחוֹן בַּה׳","../halacha-quiz/tzedaka-08.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – צְדָקָה וּנְתִינָה","לְשַׂמֵּחַ אֶת הַמְּקַבֵּל","הָאַדְמוֹ״ר מִסְּטוֹלִין נָתַן עֶשְׂרִים וְתִשְׁעָה אֶלֶף מִתּוֹךְ שְׁלוֹשִׁים, כְּדֵי שֶׁהַיְּהוּדִי יֵצֵא שָׂמֵחַ בִּשְׁלֵמוּת","../halacha-quiz/tzedaka-09.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – צְדָקָה וּנְתִינָה","עַשֵּׂר בִּשְׁבִיל שֶׁתִּתְעַשֵּׁר","הַגִּזְבָּר הַנֶּאֱמָן שׁוֹמֵר עַל אוֹצָר שֶׁאֵינוֹ שֶׁלּוֹ, וְכָךְ הוּא מִתְקַדֵּם: מַעֲשֵׂר, חֹמֶשׁ וְקֻפַּת צְדָקָה","../halacha-quiz/tzedaka-10.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שָׁלוֹם וְוִתּוּר","מִתַּלְמִידָיו שֶׁל אַהֲרֹן","מִי הָיָה אַהֲרֹן הַכֹּהֵן, אֵיךְ עָשָׂה שָׁלוֹם בֵּין חֲבֵרִים שֶׁרָבוּ, וְאֵיךְ גַּם אֲנִי יָכוֹל לִהְיוֹת רוֹדֵף שָׁלוֹם","../halacha-quiz/shalom-01.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שָׁלוֹם וְוִתּוּר","גָּדוֹל הַשָּׁלוֹם","","../halacha-quiz/shalom-02.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שָׁלוֹם וְוִתּוּר","שָׁלוֹם זֶה יוֹתֵר מִ״לֹא רָבִים״","לָמָּה שָׁלוֹם הוּא אַהֲבָה וְלֹא רַק שֶׁאֵין רִיב, וְאֵיךְ מוֹסִיפִים אוֹתוֹ בְּכָל יוֹם","../halacha-quiz/shalom-03.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שָׁלוֹם וְוִתּוּר","מְשַׁנִּים מִפְּנֵי הַשָּׁלוֹם","לָמָּה ה׳ שִׁנָּה אֶת דִּבְרֵי שָׂרָה, וְאֵיךְ לוֹמְדִים לְדַבֵּר אֱמֶת בַּעֲדִינוּת","../halacha-quiz/shalom-04.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שָׁלוֹם וְוִתּוּר","רַבִּי חֲנִינָא וְהַכִּסֵּא הָרֵיק","מָה עָשָׂה רַבִּי חֲנִינָא כְּשֶׁקִּבֵּל אֶת הַמִּשְׂרָה הַגְּדוֹלָה, לָמָּה הַוִּתּוּר שֶׁלּוֹ לֹא הָיָה הֶפְסֵד, וְאֵיךְ גַּם אֲנִי יָכוֹל לְוַתֵּר","../halacha-quiz/shalom-05.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שָׁלוֹם וְוִתּוּר","מִיֶּתֶר לְיִתְרוֹ","","../halacha-quiz/shalom-06.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שָׁלוֹם וְוִתּוּר","סֻכָּה – בַּיִת שֶׁל וִתּוּר","לָמָּה הַסֻּכָּה הִיא סֵמֶל שֶׁל שָׁלוֹם, מָה אֶפְשָׁר לְוַתֵּר עָלָיו בַּבַּיִת וּבַכִּתָּה, וְאֵיךְ הַחַיִּים הֵם מַתָּנָה","../halacha-quiz/shalom-07.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שָׁלוֹם וְוִתּוּר","וְלֹא יִהְיֶה כְקֹרַח","מָה לָקַח קֹרַח, לָמָּה אַחְדוּת שֶׁל ׳רַק נֶגֶד׳ אֵינָהּ אַחְדוּת, וְאֵיךְ אוֹהֲבִים גַּם כְּשֶׁחוֹלְקִים","../halacha-quiz/shalom-08.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שָׁלוֹם וְוִתּוּר","מֹשֶׁה קָם וְהוֹלֵךְ","מֹשֶׁה לֹא חִכָּה שֶׁיָּבוֹאוּ אֵלָיו – הוּא הָלַךְ לְפַיֵּס. מָה לוֹמְדִים מִזֶּה, וּמָה לוֹמְדִים מִשְּׁתִיקָתוֹ שֶׁל אַהֲרֹן","../halacha-quiz/shalom-09.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – שָׁלוֹם וְוִתּוּר","מָתַי מְוַתְּרִים וּמָתַי עוֹמְדִים","עַל מָה אֶפְשָׁר לְוַתֵּר, עַל מָה לֹא, וְאֵיךְ חוֹלְקִים בְּשָׁלוֹם בְּאַרְבָּעָה סִימָנִים","../halacha-quiz/shalom-10.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת יִשְׂרָאֵל","הַבֹּרֶג הַקָּטָן וְהַמְּכוֹנָה","אֲפִלּוּ קָטָן חָשׁוּב: אֵיךְ אֲנִי חֵלֶק מִמְּכוֹנָה גְּדוֹלָה, מָה בָּאָרוֹן וּמָה מֵעָלָיו, וְאֵיךְ מִתְחַבְּרִים לְעַם יִשְׂרָאֵל","../halacha-quiz/reim-01.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת יִשְׂרָאֵל","אֲגֻדָּה אַחַת שֶׁל אַרְבָּעָה מִינִים","שׁוֹנִים וְיַחַד: טַעַם וְרֵיחַ, אַהֲבָה שָׁוָה אֶחָד, וְסֻכַּת שָׁלוֹם","../halacha-quiz/reim-02.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת יִשְׂרָאֵל","הַזָּקֵן וְהָעֲנָפִים","שְׁלֹשָׁה בָּנִים חֲזָקִים, עָנָף אֶחָד שֶׁנִּשְׁבַּר וַאֲגֻדָּה שֶׁלֹּא נִשְׁבְּרָה: סִפּוּר עַל אַחְדוּת","../halacha-quiz/reim-03.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת יִשְׂרָאֵל","נְשָׁמָה אַחַת","","../halacha-quiz/reim-04.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת יִשְׂרָאֵל","אֵיךְ אֶשָּׂא עֵינַי וְאֶרְאֶה אֶת אַהֲרֹן?","שָׁלוֹם בְּחִיּוּךְ לְכָל אֶחָד, גַּם לְמִי שֶׁטָּעָה, וְכָךְ מַדְלִיקִים אֶת הַנְּשָׁמוֹת","../halacha-quiz/reim-05.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת יִשְׂרָאֵל","קַמְצָא וּבַר קַמְצָא – מָה אֶפְשָׁר הָיָה לַעֲשׂוֹת?","סְעוּדָה שֶׁהִתְבַּלְבְּלָה, חֲכָמִים שֶׁשָּׁתְקוּ, וְאַהֲבַת חִנָּם שֶׁבּוֹנָה מֵחָדָשׁ","../halacha-quiz/reim-06.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת יִשְׂרָאֵל","מִשִּׂנְאַת חִנָּם לֶאֱהָבַת חִנָּם","מָה אֲנִי יוֹדֵעַ בְּוַדַּאי, מָה אֲנִי מַשְׁלִים בְּעַצְמִי, וְאֵיךְ בּוֹנִים גֶּשֶׁר","../halacha-quiz/reim-07.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת יִשְׂרָאֵל","רֵעֲךָ – מַעֲמִיקִים אֶת הָאַהֲבָה","לָמָּה כָּתוּב ׳רֵעֲךָ׳ וְלֹא ׳אָחִיךָ׳, אֵיךְ מַעֲמִיקִים אֶת הָאַהֲבָה לַחָבֵר הַקָּרוֹב, וְאֵיךְ בּוֹנִים לֵב שֶׁיּוֹדֵעַ לֶאֱהֹב","../halacha-quiz/reim-08.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת יִשְׂרָאֵל","וַאֲהַבְתֶּם אֶת הַגֵּר","מִי הוּא גֵּר, לָמָּה יֵשׁ מִצְוָה מְיֻחֶדֶת לֶאֱהֹב אוֹתוֹ, וּמָה לָמַדְנוּ מִסִּפּוּר עֲקִילַס וְרַבִּי יְהוֹשֻׁעַ","../halacha-quiz/reim-09.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת יִשְׂרָאֵל","בְּרָכָה, תְּפִלָּה וְאַהֲבַת יִשְׂרָאֵל","אֵיךְ אַהֲרֹן הַכֹּהֵן בֵּרַךְ אֶת עַם יִשְׂרָאֵל בְּאַהֲבָה, וְאֵיךְ מִתְחַבְּרִים לְכָל הָעָם בִּבְרָכָה וּבִתְפִלָּה","../halacha-quiz/reim-10.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – כְּבוֹד הַבְּרִיּוֹת","מַהוּ כָּבוֹד?","","../halacha-quiz/kavod-01.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – כְּבוֹד הַבְּרִיּוֹת","אֵיזֶהוּ מְכֻבָּד?","","../halacha-quiz/kavod-02.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – כְּבוֹד הַבְּרִיּוֹת","לֵךְ לָאֻמָּן שֶׁעֲשָׂאַנִי","הָאִישׁ הַמְכֻעָּר וְרַבִּי אֶלְעָזָר: גַּאֲוָה, בִּזָּיוֹן, בַּקָּשַׁת סְלִיחָה, וְרַךְ כְּקָנֶה","../halacha-quiz/kavod-03.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – כְּבוֹד הַבְּרִיּוֹת","לֹא מְבַיְּשִׁים","","../halacha-quiz/kavod-04.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – כְּבוֹד הַבְּרִיּוֹת","חָס הַמָּקוֹם עַל כְּבוֹדָן שֶׁל בְּרִיּוֹת","מָה הַגַּנָּב וְהַשֶּׂה מְלַמְּדִים עַל כָּבוֹד, וְאֵיךְ שׁוֹמְרִים עַל כְּבוֹד מִי שֶׁטָּעָה","../halacha-quiz/kavod-05.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – כְּבוֹד הַבְּרִיּוֹת","פָּרָשָׁה לְכָל נָשִׂיא","לָמָּה כָּתְבָה הַתּוֹרָה שִׁבְעִים וּשְׁנַיִם פְּסוּקִים עַל קָרְבְּנוֹת הַנְּשִׂיאִים, וְאֵיךְ נוֹתְנִים כָּבוֹד לְכָל אֶחָד","../halacha-quiz/kavod-06.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – כְּבוֹד הַבְּרִיּוֹת","כָּבוֹד לְחַבְרֵי הַתּוֹרָה","לָמָּה מְכַבְּדִים אֶת הַחֶבְרוּתָא וְאֶת הָרַב, מָה קָרָה לְתַלְמִידֵי רַבִּי עֲקִיבָא, וּמָה עוֹשִׂים כְּדֵי לְכַבֵּד","../halacha-quiz/kavod-07.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – כְּבוֹד הַבְּרִיּוֹת","הָרַב קְלֵירְס וְהָעֵרוּב","אֵיךְ מְתַקְּנִים טָעוּת בְּלִי לְבַיֵּשׁ אֶת מִי שֶׁטָּעָה, וּמָה אָמַר רַבִּי מֹשֶׁה עַל כְּבוֹד הַתּוֹרָה וּכְבוֹד הַבְּרִיּוֹת","../halacha-quiz/kavod-08.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – כְּבוֹד הַבְּרִיּוֹת","כְּבוֹד שָׁמַיִם וְכְבוֹד הַמִּצְווֹת","מָה זֶה כָּבוֹד לַקָּדוֹשׁ בָּרוּךְ הוּא, וְאֵיךְ אֶפְשָׁר לְכַבֵּד מִצְווֹת בְּשִׂמְחָה, בַּזְּמַן וּבְהִדּוּר","../halacha-quiz/kavod-09.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – כְּבוֹד הַבְּרִיּוֹת","כָּל אָדָם גָּדוֹל מִמְּךָ","מָה אָמַר הָרַמְבַּ״ן עַל כְּבוֹד כָּל אָדָם, וְלָמָּה ׳כָּבוֹד׳ בְּגִימַטְרִיָּה ׳לֵב׳","../halacha-quiz/kavod-10.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – דָּן לְכַף זְכוּת","הֱוֵי דָּן אֶת חֲבֵרְךָ לְכַף זְכוּת","מָה הִיא הַמִּצְוָה, מָה פֵּרוּשׁ ׳כַּף זְכוּת׳, וְאֵיךְ בּוֹחֲרִים הֶסְבֵּר טוֹב לְמַעֲשֶׂה שֶׁאֶפְשָׁר לְהָבִין בִּשְׁתֵּי דְּרָכִים","../halacha-quiz/zechut-01.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – דָּן לְכַף זְכוּת","תַּלְמִידֵי רַבִּי יְהוֹשֻׁעַ","שְׁלוֹשָׁה מַעֲשִׂים מוּזָרִים שֶׁל הָרַב, שְׁלוֹשָׁה הֶסְבֵּרִים טוֹבִים שֶׁל הַתַּלְמִידִים, וּבְרָכָה אַחַת","../halacha-quiz/zechut-02.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – דָּן לְכַף זְכוּת","הַמַּגָּשׁ שֶׁנֶּעֱלַם","","../halacha-quiz/zechut-03.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – דָּן לְכַף זְכוּת","מַטְבֵּעַ מַחֲצִית הַשֶּׁקֶל","תַּלְמִידֵי חֲכָמִים בִּסְעוּדָה, מַטְבֵּעַ שֶׁנֶּעֱלַם, רַב זָקֵן שֶׁמְּסָרֵב – וְהָאֱמֶת שֶׁהִתְבָּרְרָה אַחַר כָּךְ","../halacha-quiz/zechut-04.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – דָּן לְכַף זְכוּת","כְּשֵׁם שֶׁאַתָּה דָּן","","../halacha-quiz/zechut-05.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – דָּן לְכַף זְכוּת","אַל תָּדִין עַד שֶׁתַּגִּיעַ לִמְקוֹמוֹ","מָה לָמַד הִלֵּל, הַבַּעַל שֵׁם טוֹב וְהַשִּׁעוּר: אֵיךְ מְבִינִים חָבֵר לִפְנֵי שֶׁדָּנִים אוֹתוֹ","../halacha-quiz/zechut-06.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – דָּן לְכַף זְכוּת","וְהֵן לֹא יַאֲמִינוּ לִי","מָה לָמַד מֹשֶׁה רַבֵּנוּ מֵהַנָּחָשׁ וְהַיָּד הַלְּבָנָה, וְלָמָּה אָסוּר לַחֲשֹׁד בִּכְשֵׁרִים","../halacha-quiz/zechut-07.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – דָּן לְכַף זְכוּת","יֵשׁ הַרְבֵּה דְּרָכִים","לָמָּה כָּל אֶחָד בָּטוּחַ שֶׁדַּרְכּוֹ נְכוֹנָה, מָה לָמַדְנוּ מֵהַחֵילוֹת בַּצָּבָא, וְאֵיךְ מִסְתַּכְּלִים בְּעַיִן טוֹבָה עַל חָבֵר שֶׁעוֹשֶׂה אַחֶרֶת","../halacha-quiz/zechut-08.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – דָּן לְכַף זְכוּת","עַיִן טוֹבָה אֵינָהּ עִוֶּרֶת","מָתַי דָּנִים לְכַף זְכוּת, מָתַי נִזְהָרִים, וְאֵיךְ בַּעַל עַיִן טוֹבָה חָכָם מְסַפֵּר לְמֻבְגָּר כְּשֶׁצָּרִיךְ","../halacha-quiz/zechut-09.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – דָּן לְכַף זְכוּת","תְּפִלָּה וְנַחַת רוּחַ לַה׳","אֵיךְ מַחְשָׁבָה טוֹבָה עַל חָבֵר מְשַׂמַּחַת אֶת ה׳, מָה אוֹמֶרֶת הַתְּפִלָּה הַקְּצָרָה, וְאֵיךְ מִי שֶׁדָּן חֲבֵרִים לִזְכוּת יָכוֹל לְהַאֲמִין שֶׁה׳ עוֹשֶׂה לְטוֹבָה","../halacha-quiz/zechut-10.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אֱמוּנָה","מָה זֹאת אֱמוּנָה? ה׳ מַשְׁגִּיחַ עַל כָּל פְּרָט","הַמִּצְוָה הָרִאשׁוֹנָה בַּדִּבְּרוֹת, לָמָּה צָרִיךְ לְצַוּוֹת עָלֶיהָ, וְאֵיךְ מְזַהִים שֶׁהַכֹּל בָּא מֵה׳","../halacha-quiz/emunah-01.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אֱמוּנָה","הַלֵּב לֹא רוֹאֶה – אֵיךְ מְשַׁכְנְעִים אֶת הַלֵּב","שֵׂכֶל וְלֵב, לָמָּה הַלֵּב מַאֲמִין רַק לְמַה שֶׁרוֹאֶה, וְאֵיךְ מַחֲזִירִים אֶת הַיְדִיעָה אֶל הַלֵּב","../halacha-quiz/emunah-02.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אֱמוּנָה","״כֹּחִי וְעֹצֶם יָדִי״ – מִי הִצְלִיחַ?","כְּשֶׁמַּצְלִיחִים, מִי נָתַן לָנוּ אֶת הַכֹּחַ? נִסָּיוֹן הָעֹשֶׁר, גַּאֲוָה, וְהוֹדָיָה שֶׁבַּלֵּב","../halacha-quiz/emunah-03.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אֱמוּנָה","אֵין עוֹד מִלְּבַדּוֹ – הַצּוֹמֶת","מָשָׁל הַצּוֹמֶת, ׳ה׳ אֶחָד׳ וֶאֱלִיעֶזֶר בְּבֵית לָבָן: אַף אֶחָד לֹא יָכוֹל לַעֲשׂוֹת דָּבָר אִם ה׳ לֹא פָּתַח אֶת הַנָּתִיב","../halacha-quiz/emunah-04.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אֱמוּנָה","יַעֲקֹב וְלָבָן – ׳לָמָּה רִמִּיתָנִי׳ בְּלִי כַּעַס","לָמָּה יַעֲקֹב שָׁאַל בְּלִי כַּעַס, מָה אָמַר דָּוִד עַל מִי שֶׁקִּלֵּל אוֹתוֹ, וְלָמָּה הַכּוֹעֵס שׁוֹכֵחַ שֶׁהַכֹּל מֵה׳","../halacha-quiz/emunah-05.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אֱמוּנָה","יוֹסֵף – ׳לֹא אַתֶּם שְׁלַחְתֶּם אוֹתִי׳","מִי בֶּאֱמֶת שָׁלַח אֶת יוֹסֵף לְמִצְרַיִם, מַה פֵּרוּשׁ ׳בִּלְעָדָי אֱלֹהִים׳, וְאֵיךְ כָּל אֶחָד יָכוֹל לִהְיוֹת יוֹסֵף הַצַּדִּיק","../halacha-quiz/emunah-06.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אֱמוּנָה","נַחְשׁוֹן בַּיָּם – מַחֲשָׁבוֹת שֶׁל סָפֵק","מָה חָשְׁבוּ בְּנֵי יִשְׂרָאֵל עַל שְׂפַת הַיָּם, מַדּוּעַ נַחְשׁוֹן קָפַץ, וְאֵיךְ אוֹמְרִים ׳ה׳ אִתִּי׳ בִּשְׁעַת פַּחַד","../halacha-quiz/emunah-07.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אֱמוּנָה","אַחֲרֵי שֶׁטָּעִיתִי – קֶרֶשׁ קְפִיצָה","אֵיךְ חוֹשְׁבִים אַחֲרֵי טָעוּת: לֹא עֶצֶב, אֶלָּא קֶרֶשׁ קְפִיצָה, כִּי יֵשׁ לִי אַבָּא שֶׁרוֹצֶה בִּתְשׁוּבָה","../halacha-quiz/emunah-08.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אֱמוּנָה","לָמָּה כָּל שַׁבָּת? – מְחַזְּקִים שׁוּב","גַּם מִי שֶׁרָאָה נִסִּים שׁוֹכֵחַ, וְלָכֵן מְחַזְּקִים אֶת הָאֱמוּנָה שׁוּב וָשׁוּב: בְּשַׁבָּת, בִּקְרִיאַת שְׁמַע וּבְכָל יוֹם","../halacha-quiz/emunah-09.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אֱמוּנָה","לֹא לוֹקְחִים סִכּוּן – מְחַפְּשִׂים אֱמוּנָה","מְשַׁל הָרוֹפֵא וְהַתְּרוּפָה: בִּדְבָרִים הַחֲשׁוּבִים בֶּאֱמֶת לֹא לוֹקְחִים סִכּוּן, וְעוֹשִׂים חֶשְׁבּוֹן שֶׁל רֶוַח וָהֶפְסֵד","../halacha-quiz/emunah-10.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – בִּטָּחוֹן בַּה׳","מַהוּ בִּטָּחוֹן?","","../halacha-quiz/bitachon-01.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – בִּטָּחוֹן בַּה׳","׳וְצֹאן מַרְעִיתוֹ׳ – הָרוֹעֶה הַנֶּאֱמָן","ה׳ הוּא מֶלֶךְ, אָב וְרוֹעֶה: הוּא דּוֹאֵג לִי וּמַרְגִּישׁ אוֹתִי יוֹתֵר מִמֶּנִּי","../halacha-quiz/bitachon-02.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – בִּטָּחוֹן בַּה׳","עָשִׁיר וְעָנִי – פַּת בַּסַּל","מִי עָשִׁיר? הַשָּׂמֵחַ בְּחֶלְקוֹ, שֶׁיּוֹדֵעַ שֶׁה׳ דּוֹאֵג לוֹ גַּם לְמָחָר","../halacha-quiz/bitachon-03.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – בִּטָּחוֹן בַּה׳","מַה יַּעֲשֶׂה אָדָם לִי?","אַף אָדָם לֹא יָכוֹל לְהָרַע לִי בְּלִי רְצוֹן ה׳, אָז מַפְנִים אֶת הַלֵּב אֶל ה׳","../halacha-quiz/bitachon-04.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – בִּטָּחוֹן בַּה׳","הַקֶּרֶשׁ בֵּין הַגַּגּוֹת","לָמָּה הַפַּחַד מַפִּיל, מָה מֻתָּר וּמָה אָסוּר לַעֲשׂוֹת עִם פַּחַד, וְאֵיךְ בִּטָּחוֹן בַּה׳ מַרְגִּיעַ","../halacha-quiz/bitachon-05.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – בִּטָּחוֹן בַּה׳","בְּצֵל קוֹרָתִי – חוֹסִים וּבוֹטְחִים","מָה הַהֶבְדֵּל בֵּין לַחֲסוֹת לִבְטֹחַ, מָה אָמַר לוֹט, וְלָמָּה הַבּוֹטֵחַ בַּה׳ חֶסֶד מְסוֹבֵב אוֹתוֹ","../halacha-quiz/bitachon-06.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – בִּטָּחוֹן בַּה׳","בָּרוּךְ גּוֹזֵר וּמְקַיֵּם","הַסִּפּוּר עַל הָאַבְרֵךְ בַּצִּינוֹק, שְׁנֵי הַפֵּרוּשִׁים שֶׁל ׳מְקַיֵּם׳, וְהַכֹּחַ שֶׁה׳ נוֹתֵן יַחַד עִם הַקֹּשִׁי","../halacha-quiz/bitachon-07.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – בִּטָּחוֹן בַּה׳","כִּי בוֹ יִשְׂמַח לִבֵּנוּ","אֵיךְ הַבִּטָּחוֹן מֵבִיא שִׂמְחָה, אֵיךְ בּוֹדְקִים אֶת ׳מַד הַבִּטָּחוֹן׳, וְלָמָּה לֵב שָׂמֵחַ מוּכָן לְקַבֵּל מֵה׳","../halacha-quiz/bitachon-08.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – בִּטָּחוֹן בַּה׳","מִבְחֲנֵי בִּטָּחוֹן קְטַנִּים","מָה עוֹשִׂים כְּשֶׁהָאוֹטוֹבּוּס נָסַע, הַמִּשְׁקָפַיִם נִשְׁבְּרוּ אוֹ חָבֵר לֹא רוֹצֶה – וְאֵיךְ מִתְאַמְּנִים בְּרוֹגַע כָּל יוֹם","../halacha-quiz/bitachon-09.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – בִּטָּחוֹן בַּה׳","מִי שֶׁבּוֹטֵחַ לֹא שׂוֹנֵא","אֵיךְ מַחֲשָׁבָה ׳הוּא לָקַח לִי׳ מְבִיאָה שִׂנְאָה, אֵיךְ הַבִּטָּחוֹן מַפְסִיק אוֹתָהּ, וְלָמָּה ׳יֵשׁ לִי אַבָּא טוֹב׳ מַסְפִּיק","../halacha-quiz/bitachon-10.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – יִרְאַת שָׁמַיִם","מָה זֹאת יִרְאַת שָׁמַיִם?","יִרְאַת שָׁמַיִם הִיא לֹא רַק פַּחַד: הִיא לְהַרְגִּישׁ שֶׁה׳ כָּאן לְיָדִי, וְאֶפְשָׁר לְדַבֵּר אִתּוֹ","../halacha-quiz/yira-01.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – יִרְאַת שָׁמַיִם","סֻלָּם הַיִּרְאָה","","../halacha-quiz/yira-02.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – יִרְאַת שָׁמַיִם","עַיִן רוֹאָה וְאֹזֶן שׁוֹמַעַת","שְׁלוֹשָׁה דְּבָרִים שֶׁשּׁוֹמְרִים עָלֵינוּ: עַיִן רוֹאָה, אֹזֶן שׁוֹמַעַת וְסֵפֶר שֶׁכּוֹתֵב. הֵם לֹא בָּאִים לְהַפְחִיד, אֶלָּא לְהַזְכִּיר שֶׁאֲנַחְנוּ לֹא לְבַד","../halacha-quiz/yira-03.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – יִרְאַת שָׁמַיִם","חֶשְׁבּוֹן שֶׁל רֶוַח וְהֶפְסֵד","מִצְוָה קַלָּה כַּחֲמוּרָה, מֹאזְנַיִם שֶׁל שָׂכָר מוּל הֶפְסֵד, וְחֶשְׁבּוֹן לִפְנֵי כׇּל בְּחִירָה","../halacha-quiz/yira-04.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – יִרְאַת שָׁמַיִם","׳מָה׳ אוֹ ׳מֵאָה׳?","אֵיךְ מֵאָה בְּרָכוֹת בְּיוֹם מְקָרְבוֹת אוֹתָנוּ לְיִרְאַת שָׁמַיִם, וְאֵיךְ מְחַלְּקִים כָּל בְּרָכָה לִשְׁלוֹשָׁה חֲלָקִים","../halacha-quiz/yira-05.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – יִרְאַת שָׁמַיִם","עֵצִים בַּבֹּקֶר בַּבֹּקֶר","אֵיךְ מְעוֹרְרִים אֶת הַיִּרְאָה וְהָאַהֲבָה בְּכָל בֹּקֶר מֵחָדָשׁ, כְּמוֹ הַכֹּהֵן שֶׁהִבְעִיר עֵצִים עַל הַמִּזְבֵּחַ","../halacha-quiz/yira-06.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – יִרְאַת שָׁמַיִם","יִרְאַת הָרוֹמְמוּת – לֹא רוֹצִים לְהַפְסִיד אֶת הַקִּרְבָה","מִפַּחַד מֵעֹנֶשׁ אֶל פַּחַד לְהַפְסִיד אֶת הַקִּרְבָה לַה׳, וְאֵיךְ בָּאִים מִיִּרְאָה לְאַהֲבָה","../halacha-quiz/yira-07.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – יִרְאַת שָׁמַיִם","יִרְאָה שֶׁמְּבִיאָה שִׂמְחָה","אֵיךְ יִצְחָק הָיָה גַּם צְחוֹק וְגַם פַּחַד, וְלָמָּה יִרְאַת הָרוֹמְמוּת מְשַׂמַּחַת","../halacha-quiz/yira-08.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – יִרְאַת שָׁמַיִם","שִׁוִּיתִי ה׳ לְנֶגְדִּי תָמִיד","לָמָּה הָרֶמָ״א פָּתַח בְּ׳שִׁוִּיתִי׳ וְסִיֵּם בְּ׳טוֹב לֵב מִשְׁתֶּה תָמִיד׳, וְאֵיךְ אֶפְשָׁר לִהְיוֹת שָׂמֵחַ כָּל הַשָּׁנָה","../halacha-quiz/yira-09.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – יִרְאַת שָׁמַיִם","חָבֵר שֶׁמְּדַבֵּר עַל ה׳","הָעֵצָה שֶׁל רַבֵּנוּ יוֹנָה וּתְפִלָּתוֹ שֶׁל רַבִּי נַחְמָן: חֲבֵרִים שֶׁמְּחַזְּקִים זֶה אֶת זֶה בְּיִרְאַת שָׁמַיִם","../halacha-quiz/yira-10.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – תְּפִלָּה מִן הַלֵּב","׳אֱלֹהִים קְרֹבִים אֵלָיו׳ – אַבָּא, אֲנִי כָּאן","מָה פֵּרוּשׁ ׳בְּכָל קָרְאֵנוּ אֵלָיו׳, אֵיךְ מַרְגִּישִׁים שֶׁה׳ קָרוֹב, וְלָמָּה כְּדַאי לִקְרֹא לוֹ כָּל יוֹם","../halacha-quiz/lev-01.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – תְּפִלָּה מִן הַלֵּב","יוֹסֵף – ׳מְלַחֵשׁ וְנִכְנָס׳","אֵיךְ הִצְלִיחַ יוֹסֵף בְּכָל מַעֲשָׂיו, לָמָּה שֵׁם שָׁמַיִם הָיָה שָׁגוּר בְּפִיו, וְאֵיךְ מְבַקְּשִׁים מֵה׳ לִפְנֵי כָּל דָּבָר","../halacha-quiz/lev-02.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – תְּפִלָּה מִן הַלֵּב","שִׂיחָה, לֹא טֶקְסְט – בַּמִּלִּים שֶׁלִּי","מָה פֵּרוּשׁ ׳וְלִפְנֵי ה׳ יִשְׁפֹּךְ שִׂיחוֹ׳, אֵיךְ מְדַבְּרִים עִם ה׳ בַּמִּלִּים שֶׁלִּי, וְלָמָּה אֶפְשָׁר לְבַקֵּשׁ שׁוּב וָשׁוּב","../halacha-quiz/lev-03.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – תְּפִלָּה מִן הַלֵּב","מָקוֹם שֶׁקֵּט – מֹשֶׁה בַּמִּדְבָּר","לָמָּה מֹשֶׁה הָלַךְ לַמִּדְבָּר, אֵיךְ יִצְחָק וְאֵלִיָּהוּ הִתְבּוֹדְדוּ, וְאֵיפֹה יֶלֶד מוֹצֵא מָקוֹם שָׁקֵט לְדַבֵּר עִם ה׳","../halacha-quiz/lev-04.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – תְּפִלָּה מִן הַלֵּב","דַּקָּה אַחַת בָּעֶרֶב – תּוֹדָה, סְלִיחָה, עֶזְרָה","אֵיךְ מְסַיְּמִים אֶת הַיּוֹם בְּשִׂיחָה קְצָרָה עִם ה׳: לְהוֹדוֹת, לְבַקֵּשׁ סְלִיחָה אוֹ לְבַקֵּשׁ עֶזְרָה לְמָחָר","../halacha-quiz/lev-05.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – תְּפִלָּה מִן הַלֵּב","חַנָּה – ״מְדַבֶּרֶת עַל לִבָּהּ״","אֵיךְ חַנָּה הִתְפַּלְּלָה בְּשֶׁקֶט מִן הַלֵּב, לָמָּה הִרְבְּתָה לְהִתְפַּלֵּל, וּמָה אֲנִי לוֹמֵד מִמֶּנָּה","../halacha-quiz/lev-06.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – תְּפִלָּה מִן הַלֵּב","אֶבֶן וּמַיִם – סַבְלָנוּת בַּתְּפִלָּה","לָמָּה הַשִּׁנּוּי בָּא לְאַט, מָה לוֹמְדִים מֵהָאֶבֶן וְהַמַּיִם וּמֵהַתְּפִלִּין, וְאֵיךְ מַמְשִׁיכִים לְבַקֵּשׁ בְּסַבְלָנוּת","../halacha-quiz/lev-07.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – תְּפִלָּה מִן הַלֵּב","מְבִיאִים אֶת מַה שֶּׁכּוֹאֵב – תְּפִלָּה חַיָּה","אֵיךְ בָּאִים לַתְּפִלָּה כְּמוֹ שֶׁאֲנִי, מוֹסִיפִים מִשְׁפָּט מִשֶּׁלִּי, וּמִתְפַּלְּלִים בְּשִׂמְחָה","../halacha-quiz/lev-08.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת אֶרֶץ יִשְׂרָאֵל","מַה זֹּאת אַהֲבַת הָאָרֶץ?","לָמָּה אֵין מִצְוָה לֶאֱהֹב טַלִּית אֲבָל יֵשׁ מִצְוָה לְחַבֵּב אֶת הָאָרֶץ, וּמָה פֵּרוּשׁ ׳יִדְבְּקוּ׳","../halacha-quiz/eretz-01.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת אֶרֶץ יִשְׂרָאֵל","אֶרֶץ שֶׁה׳ חָפֵץ בָּהּ","הַמֹּאזְנַיִם שֶׁבָּהֶם הָאָרֶץ שְׁקוּלָה כְּנֶגֶד כָּל הַבְּרִיּוֹת, וְלָמָּה אוֹהֲבִים אֶת מַה שֶׁה׳ אוֹהֵב","../halacha-quiz/eretz-02.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת אֶרֶץ יִשְׂרָאֵל","כִּי רָצוּ עֲבָדֶיךָ אֶת אֲבָנֶיהָ","הַפָּסוּק שֶׁמְּלַמֵּד לֶאֱהֹב אֶת הָאָרֶץ עַד הָאֲבָנִים וְהֶעָפָר, וּמַה עָשׂוּ גְּדוֹלֵי הַחֲכָמִים","../halacha-quiz/eretz-03.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת אֶרֶץ יִשְׂרָאֵל","בְּנוֹת צְלָפְחָד חִבְּבוּ אֶת הָאָרֶץ","חָמֵשׁ אַחְיוֹת שֶׁבִּקְשׁוּ חֵלֶק בָּאָרֶץ לִפְנֵי שֶׁנִּכְנְסוּ אֵלֶיהָ, וּמָה לָמַד רַשִׁ״י עַל מִי שֶׁמְּחַבֵּב אֶת הָאָרֶץ","../halacha-quiz/eretz-04.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת אֶרֶץ יִשְׂרָאֵל","דָּוִד וּמֹשֶׁה – כִּסּוּפִים לָאָרֶץ","מָה בָּחַר דָּוִד, לָמָּה מֹשֶׁה הִתְפַּלֵּל כָּל כָּךְ הַרְבֵּה, וְאֵיךְ הַכִּסּוּפִים שֶׁלָּהֶם מְלַמְּדִים אוֹתָנוּ לֶאֱהֹב אֶת הָאָרֶץ","../halacha-quiz/eretz-05.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת אֶרֶץ יִשְׂרָאֵל","טוֹבָה הָאָרֶץ מְאֹד מְאֹד","אֵיךְ הַתּוֹרָה מְשַׁבַּחַת אֶת הָאָרֶץ, לָמָּה כָּלֵב אָמַר ׳מְאֹד מְאֹד׳, וְאֵיךְ אֲנִי כּוֹתֵב חוֹבֶרֶת תַּיָּרוּת","../halacha-quiz/eretz-06.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת אֶרֶץ יִשְׂרָאֵל","לְסַפֵּר בְּשִׁבְחָהּ שֶׁל הָאָרֶץ","הַזֵּיתִים שֶׁל הָרַב אֱלִיָּהוּ, הַמִּכְתָּב שֶׁנִּקְרַע, וּמָה מֻתָּר וּמָה אָסוּר לוֹמַר בְּחֻפְשָׁה בְּחוּץ לָאָרֶץ","../halacha-quiz/eretz-07.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת אֶרֶץ יִשְׂרָאֵל","אוֹהֲבִים אֶת הָאָרֶץ גַּם בַּחֹם וּבַקֹּר","אֵיךְ רַבִּי אַמִּי וְרַבִּי אַסִּי לֹא הִתְלוֹנְנוּ עַל מֶזֶג הָאֲוִיר, וּמָה עוֹשִׂים כְּשֶׁחַם אוֹ קַר בָּאָרֶץ שֶׁאוֹהֲבִים","../halacha-quiz/eretz-08.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת אֶרֶץ יִשְׂרָאֵל","מְנַקִּים וּמְיַפִּים אֶת הָאָרֶץ","רַבִּי חֲנִינָא מְתַקֵּן מִכְשׁוֹלִים, הַסָּבָא מִסְּלָבּוֹדְקָה מְסַלֵּק אֲבָנִים, וְהַמְנַקֶּה שֶׁהִרְגִּישׁ כְּמוֹ בֶּן מֶלֶךְ","../halacha-quiz/eretz-09.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת אֶרֶץ יִשְׂרָאֵל","עֶשֶׂר דְּרָכִים לְהַרְגִּישׁ אֶת הָאָרֶץ","בִּרְכַּת הַמָּזוֹן, שִׁירִים, תְּבוּאָה מֵהָאָרֶץ, קֻפָּה, גְּבוּלוֹת וּפְרָחִים – עֶשֶׂר פְּעֻלּוֹת פְּשׁוּטוֹת שֶׁבָּהֶן אֲנַחְנוּ מַרְגִּישִׁים אֶת אַהֲבַת הָאָרֶץ","../halacha-quiz/eretz-10.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת אֶרֶץ יִשְׂרָאֵל","הַגְּרַ״א וּמַפַּת הַגְּבוּלוֹת","פְּרוּטוֹת, מַפָּה וְכִסּוּפִים: אֵיךְ אוֹהֲבִים אֶת הָאָרֶץ גַּם מֵרָחוֹק, וְאֵיךְ הָאַהֲבָה עוֹבֶרֶת לַתַּלְמִידִים","../halacha-quiz/eretz-11.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת אֶרֶץ יִשְׂרָאֵל","אֲבָנִים כְּיַהֲלוֹמִים","הַ׳בַּת עַיִן׳ שָׁמַע שֶׁבָּאָרֶץ אֲפִלּוּ הָאֲבָנִים מְאִירוֹת, וְלָמַד שֶׁהַיֹּפִי תָּלוּי גַּם בָּעֵינַיִם","../halacha-quiz/eretz-12.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת אֶרֶץ יִשְׂרָאֵל","הָאֶבֶן וְהַחוֹל שֶׁל הַבֶּן אִישׁ חַי","אֲבָנִים וְחוֹל בְּבֵית הַכְּנֶסֶת, שִׁיר גַּעְגּוּעִים, וְטִיּוּל שֶׁהוּא מִצְוָה כְּשֶׁהוּא בָּא מֵאַהֲבָה","../halacha-quiz/eretz-13.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת אֶרֶץ יִשְׂרָאֵל","הַזַּיִת שֶׁהָיָה מַר","סִפּוּר עַל סַבָּא שֶׁקָּטַף זֵיתִים בַּדֶּרֶךְ לִירוּשָׁלַיִם, שָׂמַח בָּהֶם, וְלָמַד אֶת הַיְּלָדִים שֶׁלֹּא מוֹצִיאִים דִּבָּה עַל פֵּרוֹת הָאָרֶץ","../halacha-quiz/eretz-14.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת אֶרֶץ יִשְׂרָאֵל","הָרַקְדָּן מֵרֹב שִׂמְחָה","אַדְמוֹ״רִים שֶׁרָקְדוּ, הִשְׁתַּטְּחוּ וְשָׁרוּ מֵרֹב שִׂמְחָה כְּשֶׁהִגִּיעוּ לְאֶרֶץ יִשְׂרָאֵל","../halacha-quiz/eretz-15.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת אֶרֶץ יִשְׂרָאֵל","מְעָרַת הַמַּכְפֵּלָה – הַמְּעָרָה שֶׁחָזְרָה","אַבְרָהָם קָנָה בְּכֶסֶף מָלֵא, שֶׁבַע מֵאוֹת שָׁנָה עָמְדוּ בַּחוּץ, וְהַיּוֹם הַמְּעָרָה חָזְרָה אֵלֵינוּ","../halacha-quiz/eretz-16.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת אֶרֶץ יִשְׂרָאֵל","שְׂמֵחִים בַּבִּנְיָן","","../halacha-quiz/eretz-17.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת אֶרֶץ יִשְׂרָאֵל","הִגַּדְתִּי הַיּוֹם – הָאָרֶץ חֲדָשָׁה בְּכָל יוֹם","לָמָּה אוֹמְרִים בַּבִּכּוּרִים ׳הַיּוֹם׳, אֵיךְ גַּם מִי שֶׁגָּר בָּאָרֶץ שָׁנִים אוֹהֵב אוֹתָהּ כְּמוֹ בַּיּוֹם הָרִאשׁוֹן, וְאֵיךְ הַהוֹדָיָה מְחַדֶּשֶׁת אֶת הָאַהֲבָה","../halacha-quiz/eretz-18.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת אֶרֶץ יִשְׂרָאֵל","מַה יָּפִית אַרְצֵנוּ הַקְּדוֹשָׁה","אֵיךְ גְּדוֹלֵי יִשְׂרָאֵל עָצְרוּ מוּל נוֹף הָאָרֶץ, הִתְפַּעֲלוּ מִמֶּנּוּ, וְאֵיךְ גַּם אֲנִי יָכוֹל לְהַפֹּךְ יֹפִי לְהוֹדָיָה","../halacha-quiz/eretz-19.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת אֶרֶץ יִשְׂרָאֵל","מִתְכּוֹנְנִים לַעֲלוֹת","אֵיךְ רַבִּי מֵאִיר שָׁפִירָא וְרַבִּי יְחֶזְקֵאל אַבְרַמְסְקִי הִתְכּוֹנְנוּ לָאָרֶץ, לָמָּה כְּמִיהָה צְרִיכָה מַעֲשִׂים, וְאֵיךְ גַּם אֲנִי מִתְכּוֹנֵן","../halacha-quiz/eretz-20.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת הַתּוֹרָה","מַה אוֹהֲבִים בַּתּוֹרָה?","מַהִי הַתּוֹרָה, אֵיךְ כּוֹתְבִים וְשׁוֹמְרִים סֵפֶר תּוֹרָה, וְלָמָּה לוֹמְדִים – כְּדֵי לְהִתְקָרֵב לְאַבָּא","../halacha-quiz/torah-01.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת הַתּוֹרָה","הִלֵּל עַל הַגָּג","","../halacha-quiz/torah-02.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת הַתּוֹרָה","הַנָּאד שֶׁל רַבִּי אֶלְעָזָר","רַבִּי אֶלְעָזָר בֶּן חַרְסוֹם, הֶעָשִׁיר שֶׁהָלַךְ כָּל יוֹם עִם נָאד קֶמַח לִלְמֹד תּוֹרָה – וּמַדּוּעַ עָשִׁיר אֵינוֹ פָּטוּר","../halacha-quiz/torah-03.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת הַתּוֹרָה","מֵהַשָּׂדֶה לְבֵית הַמִּדְרָשׁ","רַבִּי אֱלִיעֶזֶר בֶּן הוֹרְקְנוֹס, שֶׁהִתְחִיל לִלְמֹד תּוֹרָה בֶּן עֶשְׂרִים וּשְׁתַּיִם – וְהַדֶּרֶךְ מִן הַשָּׂדֶה לְבֵית הַמִּדְרָשׁ","../halacha-quiz/torah-04.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת הַתּוֹרָה","מוֹכְרִים שָׂדוֹת בִּשְׁבִיל תּוֹרָה","רַבִּי יוֹחָנָן מוֹכֵר שָׂדֶה, כֶּרֶם וְזַיִת – וְקוֹנֶה תּוֹרָה. לָמָּה הַתּוֹרָה יְקָרָה כָּל כָּךְ?","../halacha-quiz/torah-05.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת הַתּוֹרָה","הַחֲמוֹר וְהַמַּרְגָּלִית","הַתַּלְמִידִים קָנוּ חֲמוֹר לְרַבָּם שִׁמְעוֹן בֶּן שָׁטָח, וּמָצְאוּ עָלָיו אֶבֶן יְקָרָה. מָה עָשָׂה הָרַב?","../halacha-quiz/torah-06.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת הַתּוֹרָה","הַיֶּלֶד שֶׁרָצָה לִרְקֹד","הֶחָפֵץ חַיִּים בֶּן חָמֵשׁ רוֹצֶה לִרְקֹד בְּשִׂמְחַת תּוֹרָה, וְהָרַב קוּק בֶּן אַרְבַּע רוֹצֶה לִלְמֹד בַּסְּפָרִים הַגְּדוֹלִים","../halacha-quiz/torah-07.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת הַתּוֹרָה","הַתְּרִיסִים נִסְגָּרִים – אֱלוּל בִּירוּשָׁלַיִם","לָמָּה חֲנֻיּוֹת נִסְגָּרוֹת בַּצָּהֳרַיִם בְּאֱלוּל, מָה מְיֻחָד בַּחֹדֶשׁ הַזֶּה, וְאֵיךְ קוֹבְעִים עִתִּים לַתּוֹרָה","../halacha-quiz/torah-08.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת הַתּוֹרָה","לָמָּה לוֹמְדִים תּוֹרָה?","שְׁתֵּי סִבּוֹת לִלְמֹד תּוֹרָה, מָה אָמַר הִלֵּל לָאִישׁ שֶׁעָמַד עַל רֶגֶל אַחַת, וּמָשָׁל הַבְּגָדִים וְהָאֹכֶל","../halacha-quiz/torah-09.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת הַתּוֹרָה","שִׂמְחַת תּוֹרָה – לְמִי רוֹקְדִים?","לָמָּה מְבַקְּשִׁים ׳הוֹשִׁיעָה נָּא׳ בְּתוֹךְ הַשִּׂמְחָה, לָמָּה רוֹקְדִים לִפְנֵי הַסִּיּוּם, וּמָה נִשְׁאָר לָנוּ אַחֲרֵי הֶחָג","../halacha-quiz/torah-10.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת הַתּוֹרָה","הַנַּעַר וְהַנֵּרוֹת","","../halacha-quiz/torah-11.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת הַתּוֹרָה","כְּשֶׁהַזְּמַן נֶעֱצָר","","../halacha-quiz/torah-12.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת הַתּוֹרָה","הַתַּנּוּר שֶׁנִּשְׁבַּר","","../halacha-quiz/torah-13.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת הַתּוֹרָה","אַחֲרֵי כָּל הַצּוֹם","הָאוֹרֵחַ שֶׁהִתְפַּלֵּל כָּל הַלַּיְלָה וְכָל הַיּוֹם בְּיוֹם כִּפּוּר, וְאָז בִּקֵּשׁ גְּמָרָא: רָעֵב לֹא לְאֹכֶל אֶלָּא לְתוֹרָה","../halacha-quiz/torah-14.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת הַתּוֹרָה","אֵין לָנוּ זְמַן!","הָרַב עוֹבַדְיָה יוֹסֵף: חֲבָל עַל כָּל רֶגַע, וְהַזְּמַן שֶׁלּוֹ לַתּוֹרָה וּלְעַם יִשְׂרָאֵל","../halacha-quiz/torah-15.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת הַתּוֹרָה","לִפְנֵי שֶׁפּוֹתְחִים סֵפֶר","עוֹצְרִים רֶגַע: מוֹדִים, מְבַקְּשִׁים, וְלוֹמְדִים כְּדֵי לְהִתְקָרֵב וּלְשַׂמֵּחַ אֶת אַבָּא","../halacha-quiz/torah-16.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת הַתּוֹרָה","בְּלִי לְהַפְסִיק","","../halacha-quiz/torah-17.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת הַתּוֹרָה","וְהַעֲרֵב נָא – תּוֹרָה מְתוּקָה","לָמָּה מְבַקְשִׁים בְּכָל בֹּקֶר שֶׁהַתּוֹרָה תִּהְיֶה מְתוּקָה, וְאֵיךְ לוֹמְדִים בְּתֵאָבוֹן וּבְשִׂמְחָה","../halacha-quiz/torah-18.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת הַתּוֹרָה","לִלְמֹד כְּדֵי לֶאֱהֹב","אֵיךְ הַלִּמּוּד, כְּשֶׁמִּתְבּוֹנְנִים בּוֹ וְנֶהֱנִים מִמֶּנּוּ, מְקָרֵב אוֹתָנוּ לְאַהֲבַת ה׳","../halacha-quiz/torah-19.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – אַהֲבַת הַתּוֹרָה","שֻׁתָּפִים בַּתּוֹרָה","","../halacha-quiz/torah-20.html"],["halacha","🌱 מִדּוֹת טוֹבוֹת – רָצוֹן וְחֵשֶׁק לַעֲבוֹדַת ה׳","מָה ה׳ בֶּאֱמֶת רוֹצֶה?",
