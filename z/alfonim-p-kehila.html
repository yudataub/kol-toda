async function open_(code) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name: "PBKDF2", salt: b64(D.s), iterations: D.r, hash: "SHA-256"},

  const pt = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(D.i)}, key, b64(D.c));
  return new TextDecoder().decode(pt);
}
async function go(code, quiet) {
  const e = document.getElementById("e");
  if (!quiet) e.textContent = "פותח…";
  try {
    const page = await open_(code);
    try { sessionStorage.setItem("kz", code); } catch (_) {}
    document.open(); document.write(page); document.close();
  } catch (_) {
    try { sessionStorage.removeItem("kz"); } catch (_) {}
    if (!quiet) e.textContent = "קוד שגוי";
  }
}
