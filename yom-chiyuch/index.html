<title>יום של חיוכים – משחק בחירות על מידת החיוך</title>

<style>
:root{
  --bg:#fff7e0; --card:#ffffff; --ink:#3a2c12; --soft:#7a6642;
  --sun:#ffb703; --sun-d:#e08a00; --sky:#dff3ff; --good:#e7f8e9; --good-b:#4caf50;
  --mid:#fff3cd; --mid-b:#e0a800; --low:#eef0f4; --low-b:#8d99ae; --src:#f3ecff; --src-b:#7b5cc4;
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,var(--sky),var(--bg) 260px);color:var(--ink);
  font-family:Arial,"Segoe UI","Arial Hebrew",sans-serif;font-size:21px;line-height:1.85;min-height:100vh}
.wrap{max-width:700px;margin:0 auto;padding:16px 16px 40px}
header{text-align:center;padding:8px 0 4px}
header h1{margin:0;font-size:32px;line-height:1.5}
header p{margin:0;color:var(--soft);font-size:17px}
.meter{display:flex;justify-content:center;gap:8px;margin:12px 0 14px}
.meter span{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:22px;line-height:1;background:#fff;border:2px dashed #d9c9a0;filter:grayscale(1);opacity:.45;transition:.4s}
.meter span.l2{filter:none;opacity:1;border:2px solid var(--sun);background:#fff3c4;box-shadow:0 0 14px #ffd166}
.meter span.l1{filter:grayscale(.5);opacity:.8;border:2px solid #e6cf8a}
.meter span.l0{filter:grayscale(1);opacity:.7;border:2px solid var(--low-b)}
.meter span.now{border-style:solid;border-color:var(--sun-d);opacity:1}
.card{background:var(--card);border-radius:22px;padding:20px;box-shadow:0 6px 24px rgba(120,90,20,.15)}
.time{display:inline-block;background:var(--sky);border-radius:99px;padding:0 14px;font-size:16px;color:#27506b;font-weight:700}
.pic{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:16px;margin:10px 0 6px;background:#f3ead0}
.pic.small{max-width:420px;margin-inline:auto}
h2{margin:6px 0 6px;font-size:26px;line-height:1.6}
.story{margin:0 0 12px}
.ask{font-weight:700;margin:0 0 8px}
.choice{display:block;width:100%;text-align:right;font:inherit;color:inherit;background:#fffaf0;
  border:2px solid #f0dca8;border-radius:16px;padding:10px 14px;margin:0 0 10px;cursor:pointer;transition:.15s}
.choice:hover,.choice:focus-visible{border-color:var(--sun-d);background:#fff3c4;transform:translateY(-2px);outline:none}
.picked{background:#fffaf0;border:2px solid #f0dca8;border-radius:16px;padding:8px 14px;margin:0 0 12px;color:var(--soft)}
.picked b{color:var(--ink)}
.box{border-radius:16px;padding:10px 14px;margin:0 0 12px;border-right:6px solid}
.box h3{margin:0;font-size:19px}
.box p{margin:0}
.r2{background:var(--good);border-color:var(--good-b)}
.r1{background:var(--mid);border-color:var(--mid-b)}
.r0{background:var(--low);border-color:var(--low-b)}
.src{background:var(--src);border-color:var(--src-b)}
.src cite{display:block;font-style:normal;font-size:16px;color:var(--src-b)}
.praise{background:linear-gradient(135deg,#fff3b0,#ffd166);border:2px solid var(--sun-d);border-radius:16px;
  padding:10px 14px;margin:0 0 12px;font-weight:700;text-align:center;animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
#muteBtn{position:fixed;top:10px;left:10px;width:46px;height:46px;border-radius:50%;border:2px solid #e3d3a6;
  background:#fff;font-size:22px;line-height:1;cursor:pointer;z-index:5}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.btn{font:inherit;font-weight:700;border:0;border-radius:99px;padding:8px 22px;cursor:pointer;
  background:var(--sun);color:#3a2500;box-shadow:0 3px 0 var(--sun-d)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--sun-d)}
.btn.ghost{background:#fff;border:2px solid #e3d3a6;box-shadow:none}
.big{font-size:24px;padding:10px 34px}
.center{text-align:center}
ul.sum{list-style:none;padding:0;margin:10px 0 16px}
ul.sum li{padding:4px 0;border-bottom:1px dashed #ead9ac}
.note{color:var(--soft);font-size:18px}
.kol{margin-top:26px;background:linear-gradient(135deg,#e8f4ff,#fff3c4);border:2px solid #b9d9f5;border-radius:18px;
  padding:12px 16px;text-align:center;font-size:16px;line-height:1.7}
.kol a{color:#0b5cab;font-weight:700}
@media (max-width:480px){body{font-size:19px}header h1{font-size:26px}h2{font-size:23px}.meter span{width:32px;height:32px;font-size:18px}}
</style>

let audioCtx = null;
function muted(){try{return localStorage.getItem("chiyuch-dilemmas-mute")==="1";}catch(e){return false;}}
function song(seq){
  if(muted()) return;
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    if(!audioCtx) audioCtx = new AC();
    if(audioCtx.state === "suspended") audioCtx.resume();
    let t = audioCtx.currentTime + 0.05;
    seq.forEach(n=>{
      n[0].forEach((f,j)=>{
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = j ? "sine" : "triangle"; o.frequency.value = f; o.connect(g); g.connect(audioCtx.destination);
        const v = j ? 0.09 : 0.2;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, t + n[1]*0.98);
        o.start(t); o.stop(t + n[1]);
      });
      t += n[1];
    });
  }catch(e){}
}

   ${head(idx)}
   <h2>${esc(s.title)}</h2>
   <div class="picked">בָּחַרְתָּ: <b>${esc(c.t)}</b></div>
   ${praise}
   <div class="box r${c.light}"><h3>${face} מָה קָרָה לוֹ</h3><p>${esc(c.him)}</p></div>
   <div class="box r${c.light}"><h3>🪞 וּמָה קָרָה לְךָ</h3><p>${esc(c.me)}</p></div>
   <div class="box src"><h3>💡 מָה אָמְרוּ חֲכָמִים</h3><p>${esc(s.q)}</p><cite>${esc(s.ref)}</cite></div>
   <div class="row">
     <button class="btn" onclick="${last?"finish()":"go("+(idx+1)+")"}">${last?"לְסִכּוּם הַיּוֹם":"מַמְשִׁיכִים"}</button>
     ${c.light<2?`<button class="btn ghost" onclick="go(${idx})">↩️ לַחֲזֹר לָרֶגַע הַזֶּה וְלִבְחֹר אַחֶרֶת</button>`:""}
   </div>`);
}

function finish(){
  idx = -1;
  const lit = picks.filter((p,i)=>STATIONS[i].choices[p].light===2).length;
  const line = lit===N ? "הֵאַרְתָּ אֶת כָּל הַפָּנִים שֶׁפָּגַשְׁתָּ הַיּוֹם. כָּךְ נִרְאֶה יוֹם שֶׁל ״מְקַבֵּל אֶת כָּל הָאָדָם בְּסֵבֶר פָּנִים יָפוֹת״."
    : lit>=4 ? "הַרְבֵּה אֲנָשִׁים הוֹלְכִים לִישֹׁן הַלַּיְלָה שְׂמֵחִים יוֹתֵר בִּזְכוּתְךָ."
    : lit>=2 ? "הָיוּ הַיּוֹם רְגָעִים שֶׁבָּהֶם הֵאַרְתָּ פָּנִים, וְהָיוּ רְגָעִים שֶׁאֶפְשָׁר לְנַסּוֹת שׁוּב."
    : "הַיּוֹם הָיָה יוֹם קָשֶׁה. מָחָר מַתְחִיל יוֹם חָדָשׁ, וְאֶפְשָׁר גַּם לְשַׂחֵק שׁוּב וְלִבְחֹר אַחֶרֶת.";
  if(lit === N) song(GRAND); else if(lit >= 4) song(TUNES[3]);
  show(`
   ${pic("end","small")}
   <h2 class="center" data-lit="${lit}">הַיּוֹם נִגְמַר. הִדְלַקְתָּ ${lit} מִתּוֹךְ ${N} שְׁמָשׁוֹת</h2>
   <p class="center">${line}</p>
   <ul class="sum">${STATIONS.map((s,i)=>{
      const c=s.choices[picks[i]];
      return `<li>${["😔","😐","😊"][c.light]} <b>${esc(s.title)}:</b> ${esc(c.t)}</li>`;}).join("")}</ul>
   <div class="box src"><h3>🎯 עַכְשָׁו בֶּאֱמֶת: הַמְּשִׂימָה שֶׁלִּי לְמָחָר</h3>
     <p>הַמִּשְׂחָק הָיָה רַק אִמּוּן. בְּחַר מְשִׂימָה אַחַת שֶׁתַּעֲשֶׂה מָחָר בַּחַיִּים הָאֲמִתִּיִּים:</p></div>
   ${MISSIONS.map((m,k)=>`<button class="choice" onclick="mission(${k})">${esc(m)}</button>`).join("")}
   <div class="row"><button class="btn ghost" onclick="again()">🔁 לְשַׂחֵק שׁוּב אֶת כָּל הַיּוֹם</button></div>`);
}

function mission(k){
  save({m:k, date:today()});
  song(TUNES[1]);
  show(`
   ${pic("mission","small")}
   <h2 class="center">קִבַּלְתָּ עַל עַצְמְךָ!</h2>
   <div class="box r2"><h3>הַמְּשִׂימָה שֶׁלִּי לְמָחָר</h3><p>${esc(MISSIONS[k])}</p></div>
   <p>כְּשֶׁתִּפְתַּח אֶת הַמִּשְׂחָק מָחָר, הוּא יִשְׁאַל אוֹתְךָ אֵיךְ הָלַךְ.</p>
   <p class="note">רַעְיוֹן: סַפֵּר עַל הַמְּשִׂימָה לְאַבָּא, לְאִמָּא אוֹ לְחָבֵר. כָּךְ קַל יוֹתֵר לִזְכֹּר.</p>
   <div class="row"><button class="btn ghost" onclick="again()">🔁 לְשַׂחֵק שׁוּב אֶת כָּל הַיּוֹם</button></div>`);
}

function checkIn(m){
  idx = -1;
  show(`
   ${pic("mission","small")}
   <h2 class="center" data-checkin="1">בָּרוּךְ הַשָּׁב!</h2>
   <div class="box src"><h3>בַּפַּעַם הַקּוֹדֶמֶת קִבַּלְתָּ עַל עַצְמְךָ</h3><p>${esc(MISSIONS[m.m])}</p></div>
   <p class="ask">אֵיךְ הָלַךְ?</p>
   <button class="choice" onclick="checked(2)">😊 עָשִׂיתִי!</button>
   <button class="choice" onclick="checked(1)">🙂 נִסִּיתִי, וְזֶה הָיָה קָשֶׁה</button>
   <button class="choice" onclick="checked(0)">😶 שָׁכַחְתִּי</button>`);
}
function checked(r){
  const m = load();
  const txt = [
   "זֶה קוֹרֶה לְכֻלָּם. הַמְּשִׂימָה נִשְׁאֶרֶת שֶׁלְּךָ גַּם לְהַיּוֹם. נַסֵּה לַעֲשׂוֹת אוֹתָהּ כְּבָר בַּשָּׁעָה הַקְּרוֹבָה.",
   "עֶצֶם זֶה שֶׁנִּסִּיתָ הוּא כְּבָר הַתְחָלָה. מִי שֶׁמִּתְאַמֵּן כָּל יוֹם מְגַלֶּה שֶׁזֶּה נִהְיֶה קַל יוֹתֵר.",
   "מִישֶׁהוּ פָּגַשׁ אֶתְמוֹל פָּנִים מְאִירוֹת בִּזְכוּתְךָ. סַפֵּר לְחָבֵר אוֹ לַמּוֹרֶה מָה קָרָה כְּשֶׁחִיַּכְתָּ."][r];
  if(r===2){ save(null); song(GRAND); } else save({m:m.m, date:today()});
  show(`
   <p class="center" style="font-size:60px;margin:0">${["🌱","💪","🌟"][r]}</p>
   <p class="center" style="font-size:23px">${txt}</p>
   <p class="center"><button class="btn big" data-new="1" onclick="again()">לְיוֹם חָדָשׁ שֶׁל חִיּוּכִים</button></p>`);
}
function again(){picks=[]; idx=0; const m=load(); if(m){m.date=today(); save(m);} start();}

initMute();
start();
</script>
</body>
</html>
