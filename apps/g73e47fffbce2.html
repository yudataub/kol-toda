<body>
    <div id="gameContainer">
        <!-- Game content is rendered here by JavaScript -->
    </div>

    <script>
        const gameContainer = document.getElementById('gameContainer');
        let userName = "";
        let currentLessonIndex = -1; // -1 for splash screen
        let score = 0;
        let lessonsData = [];

        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!audioContext) return;
            const gainNode = audioContext.createGain();
            gainNode.connect(audioContext.destination);
            gainNode.gain.setValueAtTime(0, audioContext.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.2, audioContext.currentTime + 0.01);

            if (type === 'correct') {
                const frequencies = [523.25, 659.25, 783.99]; // C-E-G chord
                frequencies.forEach((freq, i) => {
                    const osc = audioContext.createOscillator();
                    osc.frequency.setValueAtTime(freq, audioContext.currentTime);
                    osc.type = 'sine';
                    osc.connect(gainNode);
                    osc.start(audioContext.currentTime + i * 0.05);
                    osc.stop(audioContext.currentTime + 0.2);
                });
            } else if (type === 'wrong') {
                const oscillator = audioContext.createOscillator();
                oscillator.connect(gainNode);
                oscillator.type = 'square';
                oscillator.frequency.setValueAtTime(150, audioContext.currentTime);
                oscillator.frequency.linearRampToValueAtTime(100, audioContext.currentTime + 0.2);
                oscillator.start();
                oscillator.stop(audioContext.currentTime + 0.2);
            }
            
            gainNode.gain.exponentialRampToValueAtTime(0.00001, audioContext.currentTime + 0.5);
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function populateLessonsData() {
            lessonsData = [
                {
                    title: `🌟 שִׁיעוּר 1: מַדּוּעַ חֲנֻכָּה הִיא שְׁמוֹנָה יָמִים?`,
                    content: `
                        <p>שָׁלוֹם לְךָ, ${userName} יָקָר! בְּרוּךְ הַבָּא לְמַסָּע מְרַתֵּק אֶל סוֹד הַמִּסְפָּר שְׁמוֹנֶה! 💖</p>
                        <p>חַג הַחֲנֻכָּה נִקְבַּע לִהְיוֹת יְמֵי הַלֵּל וְהוֹדָיָה כִּי הַיְּוָנִים רָצוּ לִגְזֹר עַל הַדָּבָר הֲכִי יָקָר לָנוּ - עַל הַנְּשָׁמָה שֶׁלָּנוּ. לָכֵן, כְּשֶׁנִּצַּחְנוּ, הַקָּדוֹשׁ בָּרוּךְ הוּא נָתַן לָנוּ מַתָּנָה מְיֻחֶדֶת, תַּעֲנוּג אֲמִתִּי לַנְּשָׁמָה: לְהוֹדוֹת וּלְהַלֵּל אוֹתוֹ. ✨</p>
                        <p class="highlight">הַמִּלָּה <strong>"שְׁמוֹנֶה"</strong> וְהַמִּלָּה <strong>"נְשָׁמָה"</strong> הֵן בְּדִיּוּק אוֹתָן אוֹתִיּוֹת! זֶהוּ רֶמֶז עָצוּם שֶׁהַנְּשָׁמָה שֶׁלָּנוּ שַׁיֶּכֶת לְעוֹלַם הַשְּׁמוֹנֶה, עוֹלָם שֶׁהוּא מֵעַל הַטֶּבַע.</p>
                        <p><strong>שְׁאֵלַת הַשְׁרָאָה:</strong> אֵיךְ אֲנִי מַרְגִּישׁ אֶת אַהֲבַת הַשֵּׁם כָּאן? הַשֵּׁם נָתַן לָנוּ נְשָׁמָה טְהוֹרָה, וְהוּא שׂוֹמֵר עָלֶיהָ תָּמִיד.</p>
                    `,
                    loveOfGod: "בְּכָל פַּעַם שֶׁאָנוּ מוֹדִים לַה', הַנְּשָׁמָה שֶׁלָּנוּ מִתְמַלֵּאת בְּאוֹר וְשִׂמְחָה. הַקָּדוֹשׁ בָּרוּךְ הוּא רוֹצֶה בְּקִרְבָתֵנוּ וְשָׂמֵחַ בִּתְפִלָּתֵנוּ.",
                    questions: [
                        {
                            question: "מַהוּ הַקֶּשֶׁר הַמְּיֻחָד בֵּין הַמִּלִּים 'שְׁמוֹנֶה' וְ'נְשָׁמָה'?",
                            answers: [
                                { text: "לִשְׁתֵּיהֶן יֵשׁ אוֹתָן אוֹתִיּוֹת בְּדִיּוּק, וְזֶה מְרַמֵּז עַל קֶשֶׁר עָמֹק.", isCorrect: true },
                                { text: "לִשְׁתֵּיהֶן יֵשׁ אֶת אוֹתָהּ הַגִּימַטְרִיָּה, וְזֶה מְסַמֵּל חִבּוּר רוּחָנִי.", isCorrect: false },
                                { text: "שְׁתֵּיהֶן מוֹפִיעוֹת בְּאוֹתוֹ פָּסוּק בַּתּוֹרָה בְּהֶקְשֵׁר שֶׁל חֲנֻכָּה.", isCorrect: false },
                                { text: "שְׁתֵּיהֶן מַתְחִילוֹת בָּאוֹת שׁ', הַמְּסַמֶּלֶת שְׁלֵמוּת וְקִרְבַת אֱלֹהִים.", isCorrect: false }
                            ],
                            explanation: "הַמִּלִּים 'שְׁמוֹנֶה' וְ'נְשָׁמָה' מֻרְכָּבוֹת מֵאוֹתָן הָאוֹתִיּוֹת בְּדִיּוּק, מַה שֶּׁמְּלַמֵּד שֶׁהַנְּשָׁמָה שַׁיֶּכֶת לְ'עוֹלַם הַשְּׁמוֹנֶה' – הָעוֹלָם שֶׁמֵּעַל הַטֶּבַע.",
                            encouragement: `יָפֶה מְאֹד, ${userName}! עַכְשָׁו אַתָּה מֵבִין אֶת לֵב הַנּוֹשֵׂא!`
                        },
                        {
                            question: "מַדּוּעַ נִקְבְּעוּ יְמֵי חֲנֻכָּה כִּימֵי 'הַלֵּל וְהוֹדָיָה'?",
                            answers: [
                                { text: "כִּי הַיְּוָנִים נִסּוּ לִפְגֹּעַ בַּנְּשָׁמָה, וְהוֹדָיָה הִיא הַתַּעֲנוּג שֶׁל הַנְּשָׁמָה.", isCorrect: true },
                                { text: "כִּי זֶה מְסַמֵּל אֶת נֵס פַּךְ הַשֶּׁמֶן שֶׁדָּלַק שְׁמוֹנָה יָמִים רְצוּפִים.", isCorrect: false },
                                { text: "כִּי הַחַשְׁמוֹנָאִים הִתְפַּלְּלוּ וְשָׁרוּ הַלֵּל לִפְנֵי כָּל קְרָב שֶׁיָּצְאוּ אֵלָיו.", isCorrect: false },
                                { text: "כִּי זֶה מִנְהָג קָדוּם שֶׁהִתְחִיל כְּבָר בִּזְמַן בֵּית הַמִּקְדָּשׁ הָרִאשׁוֹן.", isCorrect: false }
                            ],
                            explanation: "הַיְּוָנִים רָצוּ לִפְגֹּעַ בַּנְּשָׁמָה שֶׁל עַם יִשְׂרָאֵל. הַתַּעֲנוּג הָאֲמִתִּי שֶׁל הַנְּשָׁמָה הוּא לְהוֹדוֹת וּלְהַלֵּל אֶת ה', וְלָכֵן זוֹהִי מַהוּת הֶחָג.",
                            encouragement: `כֹּחַ שֶׁלְּךָ, ${userName}! הַהֲבָנָה שֶׁלְּךָ מְעוֹרֶרֶת הַשְׁרָאָה.`
                        },
                        {
                            question: "עוֹלַם הַשְּׁמוֹנֶה, שֶׁאֵלָיו שַׁיֶּכֶת הַנְּשָׁמָה, מְסַמֵּל:",
                            answers: [
                                { text: "מְצִיאוּת רוּחָנִית שֶׁנִּמְצֵאת מֵעַל חֻקֵּי הַטֶּבַע הָרְגִילִים.", isCorrect: true },
                                { text: "אֶת שְׁמוֹנַת הַשְּׁעָרִים שֶׁהָיוּ בְּבֵית הַמִּקְדָּשׁ הַשֵּׁנִי.", isCorrect: false },

                                { text: "אֶת שְׁמוֹנֶה הַשָּׁנִים שֶׁלָּקַח לִבְנוֹת מֵחָדָשׁ אֶת בֵּית הַמִּקְדָּשׁ.", isCorrect: false }
                            ],
                            explanation: "הַמִּסְפָּר שְׁמוֹנֶה מְיַצֵּג אֶת מַה שֶּׁנִּמְצָא מִחוּץ לַטֶּבַע וּמֵעָלָיו, בְּדִיּוּק כְּמוֹ הַנְּשָׁמָה שֶׁהִיא 'חֵלֶק אֱלוֹקָה מִמַּעַל'.",
                            encouragement: `מְצֻיָּן, ${userName}! אַתָּה קוֹלֵט אֶת הָרַעְיוֹנוֹת הָעֲמֻקִּים בְּקַלּוּת!`
                        }
                    ]
                },
                {
                    title: `🌍 שִׁיעוּר 2: הַסּוֹד שֶׁל הַמִּסְפָּרִים 6, 7 ו-8`,
                    content: `
                        <p>כָּל הַכָּבוֹד, ${userName}! הִתְקַדַּמְנוּ לַשָּׁלָב הַבָּא. כְּדֵי לְהָבִין אֶת הָעֹמֶק שֶׁל שְׁמוֹנֶה, נְגַלֶּה מָה מְסַמְּלִים הַמִּסְפָּרִים שֶׁלְּפָנָיו.</p>
                        <p><strong>הַמִּסְפָּר 6️⃣</strong> – מְסַמֵּל אֶת הַטֶּבַע. לָמָּה? כִּי לָעוֹלָם הַגַּשְׁמִי יֵשׁ שִׁשָּׁה צְדָדִים: אַרְבַּע רוּחוֹת הַשָּׁמַיִם, לְמַעְלָה וּלְמַטָּה. הַיְּוָנִים הֶאֱמִינוּ רַק בַּטֶּבַע, וְלָכֵן <span class="highlight">הַמִּלָּה "יָוָן" בְּגִימַטְרִיָּה הִיא 66</span>.</p>
                        <p><strong>הַמִּסְפָּר 7️⃣</strong> – מְסַמֵּל אֶת הָרוּחָנִיּוּת שֶׁבְּתוֹךְ הַטֶּבַע. זוֹהִי הַנְּקֻדָּה הַפְּנִימִית, הַקְּדוֹשָׁה, כְּמוֹ הַשַּׁבָּת (הַיּוֹם הַשְּׁבִיעִי). גַּם בְּמוּזִיקָה יֵשׁ רַק שִׁבְעָה תַּוִּים.</p>
                        <p><strong>הַמִּסְפָּר 8️⃣</strong> – הוּא הַמִּסְפָּר שֶׁמִּחוּץ לַטֶּבַע, מֵעַל הַטֶּבַע! זֶהוּ עוֹלַם הַנְּשָׁמוֹת, עוֹלַם הַמָּשִׁיחַ. לָכֵן בִּימוֹת הַמָּשִׁיחַ, הַכִּנּוֹר יְנַגֵּן עִם שְׁמוֹנָה נִימִים, דָּבָר שֶׁהוּא בִּלְתִּי אֶפְשָׁרִי בַּטֶּבַע הַיּוֹם.</p>
                        <p>דֻּגְמָה נוֹסֶפֶת: כַּיּוֹם יֵשׁ לָנוּ <span class="highlight">שִׁבְעָה רוֹעִים</span> (אַבְרָהָם, יִצְחָק, יַעֲקֹב, מֹשֶׁה, אַהֲרֹן, יוֹסֵף וְדָוִד), אַךְ הַמָּשִׁיחַ יִהְיֶה <strong>הָרוֹעֶה הַשְּׁמִינִי</strong> – שׁוּב מַשֶּׁהוּ שֶׁמֵּעַל הַטֶּבַע הַמֻּכָּר לָנוּ.</p>

        function startGame() {
            currentLessonIndex = -1;
            score = 0;

        function showSplashScreen() {
            gameContainer.innerHTML = `
                <h1>מַסָּע אֶל סוֹד הַמִּסְפָּר שְׁמוֹנֶה 🕎✨</h1>

                <label for="nameInput"><h3>אֵיזֶה שֵׁם נִרְשֹׁם לְךָ בִּתְעוּדָה? 💫</h3></label>
                <input type="text" id="nameInput" placeholder="הַשֵּׁם שֶׁלִּי הוּא..." onkeydown="if(event.key==='Enter') submitName()">
                <button class="start-button" onclick="submitName()">מַתְחִילִים!</button>
            `;
            document.getElementById('nameInput').focus();
        }

        function submitName() {
            const nameInput = document.getElementById('nameInput');
            userName = nameInput.value.trim();
            if (userName) {
                populateLessonsData();
                currentLessonIndex = 0;
                showLesson();
            } else {
                alert("כְּדַאי לִכְתֹּב שֵׁם כְּדֵי שֶׁהַחֲוָיָה תִּהְיֶה אִישִׁית! 😊");
            }
        }
        
        function showLesson() {
            if (currentLessonIndex < 0 || currentLessonIndex >= lessonsData.length) return;

            const lesson = lessonsData[currentLessonIndex];
            let questionsHTML = lesson.questions.map((q, index) => {
                let shuffledAnswers = shuffleArray([...q.answers]);
                let answersHTML = shuffledAnswers.map(answer => 
                    `<button class="answer-btn" onclick="handleAnswer(${index}, ${answer.isCorrect})">${answer.text}</button>`
                ).join('');
                return `
                    <div class="question" id="question-${index}">
                        <h3>שְׁאֵלָה ${index + 1}: ${q.question}</h3>
                        <div class="answers">${answersHTML}</div>
                        <div class="feedback" style="display:none"></div>
                    </div>
                `;
            }).join('');

            gameContainer.innerHTML = `
                <div id="progressBarContainer"><div id="progressBar"></div></div>
                <h2>${lesson.title}</h2>
                <div>${lesson.content}</div>
                <div class="questions-container">
                    ${questionsHTML}
                </div>
                <p><em>${lesson.loveOfGod}</em></p>
            `;
            updateProgressBar();
        }

        function handleAnswer(questionIdx, isCorrect) {
            const questionDiv = document.getElementById(`question-${questionIdx}`);
            const feedbackDiv = questionDiv.querySelector('.feedback');
            const questionData = lessonsData[currentLessonIndex].questions[questionIdx];
            
            const buttons = questionDiv.querySelectorAll('.answer-btn');
            buttons.forEach(button => button.disabled = true);

            let feedbackHTML;
            if (isCorrect) {
                score++;
                playSound('correct');
                feedbackHTML = `
                    <div class="feedback correct">
                        <p><strong>מְצֻיָּן, ${userName}! ⭐</strong></p>
                        <p><strong>הֶסְבֵּר:</strong> ${questionData.explanation}</p>
                        <p><strong>מֶסֶר מְחַזֵּק:</strong> ${questionData.encouragement.replace(/\$\{userName\}/g, userName)}</p>
                        <p>הַשֵּׁם שָׂמֵחַ מִמְּךָ, ${userName}! 💖</p>
                    </div>
                `;
            } else {
                playSound('wrong');
                const correctAnswer = questionData.answers.find(a => a.isCorrect).text;
                feedbackHTML = `
                    <div class="feedback incorrect">
                        <p><strong>לֹא בְּדִיּוּק, ${userName}... 🤔</strong></p>
                        <p><strong>הַתְּשׁוּבָה הַנְּכוֹנָה:</strong> ${correctAnswer}</p>
                        <p><strong>הֶסְבֵּר:</strong> ${questionData.explanation}</p>
                        <p>"גַּם כְּשֶׁטּוֹעִים לוֹמְדִים, ${userName}! הַשֵּׁם אוֹהֵב אוֹתְךָ תָּמִיד! 💡"</p>
                    </div>
                `;
            }
            
            feedbackDiv.innerHTML = feedbackHTML;
            feedbackDiv.style.display = 'block';
            feedbackDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });

            checkIfLessonFinished();
        }

        function checkIfLessonFinished() {
            const answeredQuestions = document.querySelectorAll('.feedback[style*="display: block"]').length;
            if (answeredQuestions === lessonsData[currentLessonIndex].questions.length) {
                setTimeout(() => {
                    currentLessonIndex++;
                    if (currentLessonIndex < lessonsData.length) {
                        showLesson();
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    } else {
                        showEndScreen();
                    }
                }, 3000); // Wait 3 seconds
            }
        }

        function updateProgressBar() {
            const progress = (currentLessonIndex / lessonsData.length) * 100;
            const bar = document.getElementById('progressBar');
            if (bar) {
                bar.style.width = `${progress}%`;
            }
        }

        function showEndScreen() {
            const totalQuestions = lessonsData.reduce((acc, l) => acc + l.questions.length, 0);
            gameContainer.innerHTML = `
                <div class="certificate">
                    <h1>🏆 תְּעוּדַת הִצְטַיְּנוּת 🏆</h1>

                    <h2 style="color: #c0392b;">${userName}</h2>
                    <p>עַל סִיּוּם הַמַּסָּע הַמֻּפְלָא לְגִלּוּי "סוֹד הַמִּסְפָּר שְׁמוֹנֶה" בְּהַצְלָחָה!</p>
                    <p><strong>הַנִּקּוּד שֶׁלְּךָ: ${score} מִתּוֹךְ ${totalQuestions}</strong></p>
                    <p style="font-size: 1.2em; font-weight: bold;"><em>"כִּי נִשְׂגָּב שְׁמוֹ לְבַדּוֹ, הוֹדוֹ עַל-אֶרֶץ וְשָׁמָיִם"</em></p>
                </div>
                <div class="questions-container">
                    <h3>שְׁאֵלוֹת לְמַחְשָׁבָה וְהִתְבּוֹנְנוּת: 🤔</h3>
                    <ol style="padding-right: 20px;">
                        <li>אֵיךְ אֲנִי יָכוֹל לְהוֹדוֹת לַה' יוֹתֵר בַּחַיִּים שֶׁלִּי, כְּמוֹ שֶׁהַנְּשָׁמָה אוֹהֶבֶת?</li>
                        <li>הֵיכָן אֲנִי רוֹאֶה דְּבָרִים שֶׁהֵם "מֵעַל הַטֶּבַע" בָּעוֹלָם שֶׁסְּבִיבִי?</li>
                        <li>מָה הַדָּבָר הָאֶחָד שֶׁלָּמַדְתִּי הַיּוֹם שֶׁיָּכוֹל לְחַזֵּק אוֹתִי?</li>
                    </ol>
                    <p>לְהִצְטָרְפוּת לְהַגְרָלָה עַל פְּרָסִים, לַחֲצוּ כָּאן: <a href="https://forms.gle/A66uubei4XSX6SG2A" target="_blank">קִישּׁוּר לְהַגְרָלָה</a></p>
                    <p>לְכָל שְׁאֵלָה, אֶפְשָׁר לִפְנוֹת: <strong>הָרַב יְהוּדָה טָאוּב, 📞 052-7139520</strong></p>
                </div>
                <button class="start-button" onclick="startGame()">שׂחַק שׁוּב!</button>
            `;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        startGame();
    </script>
