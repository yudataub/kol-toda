<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>חידון: ברכת שהחיינו על פירות</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
            direction: rtl;
        }
        h1 {
            color: #1a237e;
            text-align: center;
            margin-bottom: 30px;
        }
        #quiz-container {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .question {
            margin-bottom: 25px;
        }
        .question h3 {
            color: #283593;
            margin-bottom: 15px;
            font-size: 1.2em;
        }
        button {
            display: block;
            width: 100%;
            padding: 12px 15px;
            margin-top: 12px;
            border: none;
            border-radius: 6px;
            background-color: #3949ab;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: right;
        }
        button:hover {
            background-color: #283593;
            transform: translateY(-2px);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        button.correct {
            background-color: #43a047;
        }
        button.incorrect {
            background-color: #e53935;
        }
        #score {
            text-align: center;
            font-size: 1.2em;
            margin-top: 20px;
            color: #1a237e;
            font-weight: bold;
        }
        .fact {
            background-color: #e8eaf6;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            border-right: 4px solid #3949ab;
        }
        #next-button {
            background-color: #ffa000;
            margin-top: 15px;
            text-align: center;
        }
        #next-button:hover {
            background-color: #ff8f00;
        }
    </style>
</head>
<body>
    <h1>חידון: ברכת שהחיינו על פירות</h1>
    <div id="quiz-container"></div>
    <div id="score"></div>

    <script>
        const questions = [
            {
                question: "מתי מברכים ברכת שהחיינו על פרי חדש לפי המנהג כיום?",
                answers: [
                    { text: "בשעת הקנייה", correct: false },
                    { text: "בשעת האכילה", correct: true },
                    { text: "בשעת הראייה הראשונה", correct: false },
                    { text: "בשעת הבישול", correct: false }
                ],
                fact: "למרות שמעיקר הדין היה צריך לברך בראייה ראשונה, המנהג השתנה לברך בשעת האכילה כי זה זמן ההנאה העיקרית."
            },
            {
                question: "על אילו מהבאים אין מברכים שהחיינו?",
                answers: [
                    { text: "פירות העונה", correct: false },
                    { text: "פירות מיובאים", correct: false },
                    { text: "ירקות", correct: true },
                    { text: "פירות הדר", correct: false }
                ],
                fact: "הסיבה שלא מברכים על ירקות היא שהם היו נשמרים בבורות באדמה במשך כל השנה, ולכן לא היה ניכר ההבדל בין חדש לישן."
            },
            {
                question: "מה נדרש כדי לברך שהחיינו על פרי?",
                answers: [
                    { text: "רק שיהיה טעים", correct: false },
                    { text: "רק שיהיה יקר", correct: false },
                    { text: "חידוש בחפצא ובגברא", correct: true },
                    { text: "רק שיהיה מיובא", correct: false }
                ],
                fact: "נדרש חידוש כפול - גם שהפרי התחדש בעולם וגם שהתחדש אצל האדם המברך."
            },
            {
                question: "האם מברכים שהחיינו על פרי שגדל בחממה כל השנה?",
                answers: [
                    { text: "כן, אם הוא טעים במיוחד", correct: false },
                    { text: "לא", correct: true },
                    { text: "כן, אם הוא יקר", correct: false },
                    { text: "תלוי במנהג המקום", correct: false }
                ],
                fact: "ההלכה מתייחסת לעונתיות הטבעית של הפרי, ולכן פירות שגדלים בחממה כל השנה מאבדים את המעמד של 'פרי המתחדש'."
            },
            {
                question: "מה הדין בפרי שמתחדש פעמיים בשנה?",
                answers: [
                    { text: "לא מברכים עליו כלל", correct: false },
                    { text: "מברכים רק פעם אחת בשנה", correct: false },
                    { text: "מברכים עליו פעמיים", correct: true },
                    { text: "מברכים רק אם עבר חודש", correct: false }
                ],
                fact: "הרמ\"א חידש שמברכים על פרי כזה פעמיים, כי כל התחדשות יוצרת שמחה חדשה."
            },
            {
                question: "מה הדין בענבים שמגיעים מארץ ישראל ומאפריקה ללא הפסקה ביניהם?",
                answers: [
                    { text: "מברכים פעמיים", correct: false },
                    { text: "מברכים רק על של ארץ ישראל", correct: false },
                    { text: "לא מברכים כלל", correct: true },
                    { text: "מברכים רק על של אפריקה", correct: false }
                ],
                fact: "הסיבה היא שכאשר אין הפסקה, קשה להבחין בהבדל בין סוגי הענבים ולכן אין תחושת התחדשות."
            },
            {
                question: "האם פרי שנשמר בקירור כל השנה מחייב ברכת שהחיינו?",
                answers: [
                    { text: "כן, כי הוא טרי", correct: false },
                    { text: "לא", correct: true },
                    { text: "תלוי במחיר", correct: false },
                    { text: "רק אם עבר חודש", correct: false }
                ],
                fact: "שימור בקירור אינו יוצר 'התחדשות' אמיתית, כי הפרי לא התחדש באמת אלא רק נשמר."
            },
            {
                question: "מתי לפי ספר האשכול ברכת שהחיינו על פירות היא חובה?",
                answers: [
                    { text: "תמיד", correct: false },
                    { text: "כשרואים או אוכלים", correct: true },
                    { text: "רק בחגים", correct: false },
                    { text: "רק בשבת", correct: false }
                ],
                fact: "ספר האשכול מחדש שהרשות היא רק לגבי החיפוש אחר הברכה, אבל כשכבר פוגשים בפרי - חייבים לברך."
            },
            {
                question: "מה המצב בשנת תשפ\"ה לגבי ברכת שהחיינו על ענבים?",
                answers: [
                    { text: "אין לברך כלל", correct: false },
                    { text: "מברכים פעם אחת", correct: false },
                    { text: "מברכים פעמיים בגלל ההפסקה המכוונת", correct: true },
                    { text: "תלוי במחיר הענבים", correct: false }
                ],
                fact: "הסוחרים יצרו הפסקה מלאכותית בייבוא כדי לאפשר ברכת שהחיינו פעמיים."
            },
            {
                question: "איזה תנאי הכרחי נדרש לברכת שהחיינו על פירות?",
                answers: [
                    { text: "שיהיו זולים", correct: false },
                    { text: "שיהיו מתוקים", correct: false },
                    { text: "עונתיות קבועה בגידול", correct: true },
                    { text: "שיהיו מיובאים", correct: false }
                ],
                fact: "העונתיות הקבועה היא המפתח ליצירת תחושת ההתחדשות והשמחה שעליה מברכים שהחיינו."
            }
        ];

        let currentQuestions = [];
        let correctAnswers = 0;
        let totalClicks = 0;

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function startQuiz() {
            correctAnswers = 0;
            totalClicks = 0;
            currentQuestions = [...questions];
            shuffleArray(currentQuestions);
            showQuestion();
        }

        function showQuestion() {
            const quizContainer = document.getElementById('quiz-container');
            quizContainer.innerHTML = '';

            if (currentQuestions.length === 0) {
                quizContainer.innerHTML = '<h2>כל הכבוד! סיימת את החידון!</h2>';
                updateScore();
                return;
            }

            const questionData = currentQuestions.pop();
            const questionElement = document.createElement('div');
            questionElement.className = 'question';
            questionElement.innerHTML = `<h3>${questionData.question}</h3>`;

            const answers = [...questionData.answers];
            shuffleArray(answers);

            answers.forEach(answer => {
                const button = document.createElement('button');
                button.innerHTML = answer.text;
                button.addEventListener('click', () => selectAnswer(button, answer.correct, questionData.fact));
                questionElement.appendChild(button);
            });

            quizContainer.appendChild(questionElement);
        }

        function selectAnswer(button, correct, fact) {
            totalClicks++;
            if (correct) {
                button.classList.add('correct');
                correctAnswers++;
                disableButtons();
                showFact(fact);
            } else {
                button.classList.add('incorrect');
                button.disabled = true;
            }
            updateScore();
        }

        function disableButtons() {
            const buttons = document.querySelectorAll('.question button');
            buttons.forEach(button => button.disabled = true);
        }

        function showFact(fact) {
            const factElement = document.createElement('div');
            factElement.className = 'fact';
            factElement.innerHTML = `<p><strong>נכון מאוד!</strong> ${fact}</p>`;
            
            const nextButton = document.createElement('button');
            nextButton.id = 'next-button';
            nextButton.textContent = 'לשאלה הבאה';
            nextButton.addEventListener('click', showQuestion);
            
            factElement.appendChild(nextButton);
            document.querySelector('.question').appendChild(factElement);
        }

        function updateScore() {
            const scoreElement = document.getElementById('score');
            const accuracy = (correctAnswers / totalClicks * 100).toFixed(2);
            scoreElement.innerHTML = `ציון: ${correctAnswers} תשובות נכונות | דיוק: ${accuracy}%`;
        }

        startQuiz();
    </script>
</body>
</html>
