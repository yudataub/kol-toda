<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>חידון הודיה לחנוכה</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e8ba3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .header p {
            font-size: 1.2em;
            color: #ffffff;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            min-height: 400px;
            position: relative;
        }

        .question-number {
            color: #1e3c72;
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 20px;
            display: inline-block;
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            padding: 8px 20px;
            border-radius: 25px;
            box-shadow: 0 3px 10px rgba(255, 215, 0, 0.3);
        }

        .question-text {
            font-size: 1.4em;
            line-height: 1.8;
            color: #333;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .answer-section {
            margin-top: 30px;
            border-top: 2px solid #ffd700;
            padding-top: 20px;
        }

        .answer-content {
            display: none;
            font-size: 1.1em;
            line-height: 1.9;
            color: #444;
            background: #f8f9fa;
            padding: 25px;
            border-radius: 12px;
            margin-top: 15px;
            border-right: 5px solid #ffd700;
        }

        .answer-content.show {
            display: block;
            animation: slideDown 0.4s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .answer-content p {
            margin-bottom: 15px;
        }

        .answer-content strong {
            color: #1e3c72;
        }

        .source {
            font-size: 0.95em;
            color: #666;
            font-style: italic;
            margin-top: 10px;
            padding: 10px;
            background: #fff;
            border-radius: 8px;
        }

        .btn {
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            color: #1e3c72;
            border: none;
            padding: 12px 35px;
            font-size: 1.1em;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.6);
        }

        .btn:active {
            transform: translateY(0);
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }

        .nav-btn {
            background: #2a5298;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 1em;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .nav-btn:hover:not(:disabled) {
            background: #1e3c72;
            transform: scale(1.05);
        }

        .nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .counter {
            color: #666;
            font-size: 1em;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .card {
                padding: 25px;
            }

            .question-text {
                font-size: 1.2em;
            }

            .answer-content {
                font-size: 1em;
            }
        }

        .menorah {
            text-align: center;
            font-size: 3em;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="menorah">🕎</div>
            <h1>חידון הודיה לחנוכה</h1>
            <p>י"ג שאלות על ההודיה בחנוכה</p>
        </div>

        <div class="card">
            <div id="question-container">
                <!-- השאלות יוצגו כאן -->
            </div>

            <div class="navigation">
                <button class="nav-btn" id="prev-btn" onclick="prevQuestion()">→ הקודם</button>
                <div class="counter">
                    <span id="current">1</span> / <span id="total">13</span>
                </div>
                <button class="nav-btn" id="next-btn" onclick="nextQuestion()">הבא ←</button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                number: 1,
                question: "האם בחנוכה המצווה להודות היא רק על הניסים שהיו בזמן החשמונאים, או שהמצווה גם להודות על הניסים בזמן הזה? הבא ראיה לכך משירי חנוכה!",
                answer: `<p>כתב בקונטרס 'קומי אורי' מבית שערי אהבה: בנוסח תפלת "על הניסים", שמוסיפים בימי החנוכה, כתוב "וקבעו שמונת ימי חנוכה אלו להודות ולהלל לשמך הגדול". גם בברייתא המובאת בגמרא שבת כ"א ע"ב כתוב "לשנה אחרת קבעום ועשאום ימים טובים בהלל והודאה".</p>
                
                <p>והנה יש לתמוה שאם חז"ל רצו שבמשך הדורות כלל ישראל יודו ויהללו להקב"ה על הניסים הגדולים שעשה הקב"ה לעם ישראל בימים ההם בימי מתתיהו ובניו, היה להם, כחלק מתקנת הלל והודיה זו, לכתוב מגילה כמו בפורים, אשר שם יתארו בפרוטרוט כל הנסים והחסדים הגדולים אשר עליהם נתקן החג להודות עליהם.</p>
                
                <p><strong>בפורים</strong>, חז"ל תקנו לקרא את המגילה המתארת את הניסים שהתרחשו שעליהם אנו חוגגים, לעומת זאת <strong>בחנוכה</strong> תקנו לקרא את ההלל שמתאר את כל החסדים הרבים שהקב"ה עשה לכלל ישראל במשך כל הדורות.</p>
                
                <p>הבדל זה ניכר גם בפיוטים שהתקבלו בכלל ישראל לשיר בימים אלו. בפורים נוהגים לשיר על הנסים של פורים דווקא ["שושנת יעקב צהלה ושמחה בראותם יחד תכלת מרדכי כו' ... ארור המן ... ברוך מרדכי ..."], ובחנוכה מודים ומשבחים על כל חסדי ה' לעם ישראל במשך כל הדורות ["מעוז צור ישועתי ... חיל פרעה וכל זרעו ... קץ בבל זרובבל ... אגגי בן המדתא ... יונים נקבצו עלי ... דחה אדמון ... הקם לנו רועים שבעה"].</p>`
            },
            {
                number: 2,
                question: "היכן מצאנו בתנ\"ך אדם שהבטיח לספר ב'קול תודה'? (רמז: קשור ליום כיפור)",
                answer: `<p><strong>יונה הנביא</strong></p>
                
                <p class="source">יונה פרק ב פסוק י:<br>
                "וַאֲנִי בְּקוֹל תּוֹדָה אֶזְבְּחָה לָּךְ אֲשֶׁר נָדַרְתִּי אֲשַׁלֵּמָה יְשׁוּעָתָה לַיהֹוָה"</p>
                
                <p>יונה הנביא, שספר יונה נקרא ביום כיפור, הבטיח להודות לה' "בקול תודה" על הישועה שהושיע אותו ממעי הדגה.</p>`
            },
            {
                number: 3,
                question: "מי יודע מהו הקול החמישי בחתונה?",
                answer: `<p class="source">ירמיהו פרק לג פסוק י–יא:<br>
                "כֹּה אָמַר יְהֹוָה עוֹד יִשָּׁמַע בַּמָּקוֹם הַזֶּה אֲשֶׁר אַתֶּם אֹמְרִים חָרֵב הוּא מֵאֵין אָדָם וּמֵאֵין בְּהֵמָה בְּעָרֵי יְהוּדָה וּבְחֻצוֹת יְרוּשָׁלִַם הַנְשַׁמּוֹת מֵאֵין אָדָם וּמֵאֵין יוֹשֵׁב וּמֵאֵין בְּהֵמָה: קוֹל שָׂשׂוֹן וְקוֹל שִׂמְחָה קוֹל חָתָן וְקוֹל כַּלָּה <strong>קוֹל אֹמְרִים הוֹדוּ אֶת יְהֹוָה צְבָאוֹת כִּי טוֹב יְהֹוָה כִּי לְעוֹלָם חַסְדּוֹ</strong> מְבִאִים תּוֹדָה בֵּית יְהֹוָה כִּי אָשִׁיב אֶת שְׁבוּת הָאָרֶץ כְּבָרִאשֹׁנָה אָמַר יְהֹוָה"</p>
                
                <p>ארבעת הקולות הראשונים בחתונה הם: קול ששון, קול שמחה, קול חתן, קול כלה.</p>
                
                <p><strong>הקול החמישי</strong> הוא: "קול אומרים הודו את ה' צבאות כי טוב ה' כי לעולם חסדו" - קול ההודיה!</p>`
            },
            {
                number: 4,
                question: "כיצד גם חנוכה מהווה את הנקודה החמישית? (שאלה קשה)",
                answer: `<p>בחנוכה יש רמז לקול החמישי, היות ויש <strong>ארבעה חודשים שאין בהם חגים</strong>: חשוון, כסלו, טבת, שבט.</p>
                
                <p><strong>חנוכה באמצע החודשים</strong> ומאיר את כל החודשים באור ההודיה.</p>
                
                <p>בזה הוא דומה לקול החמישי שמאיר את ארבעת הקולות (ששון ושמחה, חתן וכלה) - כך חנוכה כ"נקודה חמישית" מאירה את ארבעת החודשים ללא חגים!</p>
                
                <p>כשם שהקול החמישי בחתונה - "קול אומרים הודו את ה'" - מאיר ומעלה את כל החתונה, כך חנוכה מאיר את כל התקופה שאין בה חגים באור של הודיה והלל.</p>`
            },
            {
                number: 5,
                question: "חנוכה חל בחודשים כסלו וטבת, חשבו כיצד יש חלוקה שווה בין שני החודשים על חג החנוכה?",
                answer: `<p>החלוקה היא לפי <strong>מספר הנרות</strong>!</p>
                
                <p>מספר הנרות הכולל בחנוכה הוא 36 נרות (1+2+3+4+5+6+7+8).</p>
                
                <ul style="margin-right: 20px; margin-top: 15px;">
                    <li><strong>בימים כה-כט בכסלו</strong> (5 ימים) מדליקים: 1+2+3+4+5 = <strong>15 נרות</strong></li>
                    <li><strong>ביום ל' בכסלו</strong> (יום 6) מדליקים 6 נרות - חציים לכסלו וחציים לטבת</li>
                    <li><strong>בימים א-ב בטבת</strong> (3 ימים) מדליקים: 7+8 = <strong>15 נרות</strong></li>
                </ul>
                
                <p style="margin-top: 15px;">ביום השישי (ל' בכסלו) נרותיו מתחלקים בדיוק: <strong>חצי לכסלו וחצי לטבת</strong>!</p>`
            },
            {
                number: 6,
                question: "שאלה: האם צריך לחשוש לעינא בישא בסיפורי שיחו בכל נפלאותיו?",
                answer: `<p>ענה הרב:</p>
                
                <p><strong>אם האדם אומר את הדברים בצלצלי שמע</strong> - "תראו כמה ה' אוהב אותי, זה מסוכן" - זה מסוכן לעין הרע.</p>
                
                <p><strong>אבל אם אומר</strong>: "מה אני, מה חיי, שעשה לי ה' כך? זה לא מגיע לי ולא לפי מעשי, רק מחמת טובו הגדול עלינו" - ואומר זאת מתוך בכי וכדומה - <strong>אין חשש</strong>.</p>
                
                <p>העיקרון: כאשר מספרים על נפלאות ה' מתוך <strong>ענווה והכרה</strong> שזה לא בזכותנו אלא מחסדו, ומתוך התרגשות אמיתית - אין בזה חשש לעין הרע.</p>`
            },
            {
                number: 7,
                question: "בארגון קול תודה עושים מבצע הודיה למשך ארבעים יום. מצא את הקשר בין הודיה למספר ארבעים?",
                answer: `<p><strong>ארבעים יום – כנגד ארבעים לחמי קרבן תודה!</strong></p>
                
                <p>קרבן התודה בא עם ארבעים לחמים (עשרה מכל אחד מארבעת סוגי הלחם).</p>
                
                <p>בעזרת הש"י מוציאים כעשרים חוברות אשר בהם יובאו ארבעים פרקים של ליקוט ביאורים על "מזמור לתודה", מחולק ומסודר לארבעים פעמים – <strong>כנגד ארבעים לחמי קרבן תודה</strong>.</p>
                
                <p>כדי לסייע להתחדשות הכוונה בעת אמירת מזמור זה במשך ארבעים יום [או ארבעים פעמים באותו יום].</p>`
            },
            {
                number: 8,
                question: "כיצד באכילת סופגניה אנו מודים לה' על חנוכת המזבח?",
                answer: `<p>לכן נהגו לאכול מאכלים שמברכים עליהם <strong>ברכת מעין שלוש</strong> (סופגניה) שבה מוזכר <strong>"ועל מזבחך"</strong> - להודות על חנוכת המזבח!</p>
                
                <p>משא"כ בברכת המזון שאין מוזכר בה מזבח ביחוד.</p>
                
                <p class="source">עיין כעין זה בהגרשז"א (שלמי מועד נג)</p>`
            },
            {
                number: 9,
                question: "למה ב'על הנסים' של חנוכה מסיימים 'וקבעו שמונת ימי חנוכה', משא\"כ בשל פורים שמסיימים רק 'ותלו אותו ואת בניו על העץ' ולא נזכר שקבעו אותם לימי משתה ושמחה?",
                answer: `<p>אומר הגרשז"א:</p>
                
                <p><strong>בפורים</strong> - עיקר השמחה ממפלת המן ובניו, לכן מסיימים בכך.</p>
                
                <p><strong>אבל בחנוכה</strong> - הרי רצו היוונים בהשכחת התורה ובהרחקה מעבודת ד'. לכן מדגישים את ההיפך: שהתקרבנו אל ד' ביתר שאת ע"י קביעות ימי הודאה והלל לד'.</p>
                
                <p>לכן <strong>הימים האלה צריכים להשפיע עלינו</strong> שפע של אהבת ד', אהבת התורה ושמחת המצוות.</p>
                
                <p><strong>אמר הרב שטיינמן זצ"ל:</strong><br>
                "איך מה עושים כדי להתרומם? כי אם לא להתרומם, אז מה כל הענין של המסיבות, מה כל התכלית של המסיבות, שום דבר!! אנחנו מבקשים שכל אחד יחפש עד כמה שאפשר, יחפש ויחשוב איך מתרוממים, איך להשתנות ולא יהיה מה שהיה קודם. ואם אפילו רק זה לבד [אפילו רק חושב מחשבה זו], זה כבר התרוממות, זה שהגיע למדרגה כזאת שחושב איך עולים, איך לא נשארים כמו שהיה קודם, זה עצמו כבר התרוממות."</p>`
            },
            {
                number: 10,
                question: "במעוז צור ישנו רמז מתי יאמרו את 'מזמור לתודה' - היכן?<br><br>מָעוֹז צוּר יְשׁוּעָתִי לְךָ נָאֶה לְשַׁבֵּחַ<br>תִּכּוֹן בֵּית תְּפִלָּתִי וְשָׁם תּוֹדָה נְזַבֵּחַ<br>לְעֵת תָּכִין מַטְבֵּחַ מִצָּר הַמְנַבֵּחַ<br>אָז אֶגְמֹר בְּשִׁיר מִזְמוֹר חֲנֻכַּת הַמִּזְבֵּחַ",
                answer: `<p>במעוז צור משמע שיש <strong>שני חלקים</strong> בחנוכת המקדש:</p>
                <ol style="margin-right: 20px; margin-top: 10px; margin-bottom: 15px;">
                    <li><strong>בנין המקדש</strong> - "תִּכּוֹן בֵּית תְּפִלָּתִי"</li>
                    <li><strong>כאשר ימותו הגווים המפריעים</strong> - "לְעֵת תָּכִין מַטְבֵּחַ מִצָּר הַמְנַבֵּחַ"</li>
                </ol>
                
                <p><strong>קרבן תודה יקריבו מיד שיבנה המקדש</strong> - "וְשָׁם תּוֹדָה נְזַבֵּחַ"</p>
                
                <p><strong>אבל שירה בשיר של תודה יהיה רק לאחר</strong> "תכין מטבח מצר המנבח" - "אָז אֶגְמֹר בְּשִׁיר מִזְמוֹר חֲנֻכַּת הַמִּזְבֵּחַ"</p>
                
                <p>הטעם מסביר בנתיבות המועדים: יש לומר שכל עוד הפריצים קיימים, אי אפשר 'לגמור' את שיר חנוכת המזבח, כי עדיין יכולים הפריצים להיכנס להיכל ולטמא את כליו בכניסתם. על כן אמר המחבר שרק לעת תכין מטבח מצר המנבח, היא העת שיכלו ויתמו הפריצים, ניתן יהיה אז לגמור את שיר חנוכת המזבח.</p>
                
                <p><strong>מהו אותו שיר מזמור? מזמור לתודה!</strong></p>
                
                <p class="source">כמו שאמרו בגמרא (תלמוד בבלי מסכת שבועות דף טו עמוד ב):<br>
                ת"ר: שיר של תודה - בכנורות ובנבלים ובצלצלים על כל פינה ופינה ועל כל אבן גדולה שבירושלים.<br>
                רש"י: תנו רבנן שיר של תודה - היו אומרים שם בכנורות וכו' ומהו שיר של תודה מזמור לתודה (תהלים ק).</p>`
            },
            {
                number: 11,
                question: "באלו מילים במזמור לתודה – ישנו הודאה כנגד 'ופרצו חומות מגדלי'?",
                answer: `<p><strong>"בֹּאוּ שְׁעָרָיו בְּתוֹדָה חֲצֵרֹתָיו בִּתְהִלָּה"</strong></p>
                
                <p>למזמור לתודה יש כוח לפתוח את <strong>י"ג שערי שמים</strong> של י"ג מידות הרחמים.</p>
                
                <p>כמו שנרמז במזמור לתודה "בֹּאוּ שְׁעָרָיו בְּתוֹדָה" - במילים אלו <strong>י"ג אותיות</strong> כנגד י"ג שערים שהיו בבית המקדש, שהדרך להכנס לשערים נפלאים אלו הוא בתודה ותהילה.</p>
                
                <p><strong>כמובא במגלה עמוקות:</strong> על מזמור לתודה: "חֲצֵרֹתָיו בִּתְהִלָּה" - הם סוד י"ג שהם כנגד <strong>י"ג שערים שהיו במקדש</strong>, שהיו משתחווים להודות בהם, כנגד <strong>י"ג פרצות שפרצו יוונים במקדש</strong> בחצר המקדש וזכו לגדרם (מדות פ"ב מ"ג).</p>
                
                <p>וזהו שאמר "חֲצֵרֹתָיו בִּתְהִלָּה" - שכנגד מה שפרצו ועשו י"ג פרצות, מן חצר אחד עשו חצירות, ותקנו כנגד זה בִּתְהִלָּה, שהם השתחויה, כנגד י"ג עקרים שעקרו.</p>
                
                <p><strong>כך ההודיה במזמור לתודה מתקנת את הפרצות שפרצו היוונים בחומות המקדש!</strong></p>`
            },
            {
                number: 12,
                question: "נפסק בשולחן ערוך הלכות חנוכה (סימן תרע סעיף ב): 'ריבוי הסעודות שמרבים בהם הם סעודות הרשות, שלא קבעום למשתה ושמחה. הגה: וי\"א שיש קצת מצוה ברבוי הסעודות, משום דבאותן הימים היה חנוכת המזבח (מהר\"א מפרא\"ג). ונוהגין לומר זמירות ושבחות בסעודות שמרבים בהם, ואז הוי סעודת מצוה (מנהגים).'<br><br>האם רק בחנוכה ששרים שירים הסעודה נהפכת לסעודת מצווה, או בכל סעודה במשך השנה?",
                answer: `<p>נחלקו האחרונים בזה:</p>
                
                <p><strong>כמובא בספר שפת אמת (חנוכה - שנת תרל"ב):</strong><br>
                "עשאום יו"ט בהלל והודאה. פירוש ע"י שהכירו גודל הישועה מהשי"ת והללו והודו בכל לבבם עי"ז המשיכו הארת הנס לעולם."</p>
                
                <p><strong>וכן צריך להיות בכל אדם</strong> - כשמרגיש איזה ישועה ומתגלה הטוב בגודל חסד ה', וכפי השבח והודיה שנותן, כך נשאר אצלו לדורות.</p>
                
                <p>ועפי"ז יש לכוין דברי מו"ז ז"ל (החידושי הרים) שאמר על מ"ש ברמ"א שכשאומרים זמירות הוא סעודת מצוה. וכ' מג"א שה"ה בכל מקום ספק בנשואי ע"ה ות"ח ע"ש.</p>
                
                <p><strong>והוא אמר שאין ראיה מדהכא</strong> - כיון שנתקן להלל והודאה, לכן אז הוא סעודת מצוה כו'.</p>
                
                <p>והוא כמ"ש שע"י השבח והודאה מעוררין הארה הגנוזה באלה הימים ונעשה יו"ט וממילא הוא סעודת מצוה.</p>
                
                <p><strong>המסקנה:</strong> יש מחלוקת האם הדין שסעודה עם זמירות היא סעודת מצוה הוא רק בחנוכה (בגלל הארת הימים המיוחדת), או גם בכל השנה.</p>`
            },
            {
                number: 13,
                question: "הסבר את המילים: 'מפני שהם קלויים בשמן זכר לברכתו'?",
                answer: `<p><strong>הברכה שהיתה בשמן שבפך שנתרבה!</strong></p>
                
                <p>כתב רבינו מימון בן יוסף אבי הרמב"ם בחיבורו על התפילות על ענין חנוכה:</p>
                
                <p>"אין להקל בשום מנהג ואפילו מנהג קל ויתחייב כל נכון לו לעשות משתה ושמחה ומאכל לפרסם הנס שעשה השי"ת עמנו באותם הימים.</p>
                
                <p><strong>ופשט המנהג לעשות סופגנין והם הצפיחיות בדבש, והוא מנהג הקדמונים, משום שהן קלוים בשמן זכר לברכתו.</strong></p>
                
                <p>וכתב רבינו נסים במגילת סתרים כי בכל מנהגי האומה באלו מנהגות כמו זה... ומי שהנהיגם זריז ומשתדל הוא כי הם מעיקרים נעשים ולא יבוזו במנהג האומה, וכבר אמר הנביא ע"ה ואל תיטוש תורת אימך, דת אימתך אל תעזוב".</p>
                
                <p class="source">וכ"ה בזמר לחנוכה המיוחס לרבי אברהם אבן עזרא: "איכלו משמנים וסולת רבוכה"</p>
                
                <p>הגרי"ש אלישיב זצ"ל נהג לאכול אחר הדלקת הנרות 'לאטקעס' (איש על העדה, ח"ב עמ' רנ"ג בשם בתו הרבנית ישראלזון תליט"א, והוסיפה שאפילו בשנים שקשתה לו האכילה מ"מ דקדק לטעום מעט מן הלאטקעס כדי לקיים מנהגן של ישראל).</p>`
            }
        ];

        let currentQuestion = 0;

        function displayQuestion(index) {
            const q = questions[index];
            const container = document.getElementById('question-container');
            
            container.innerHTML = `
                <div class="question-number">שאלה ${q.number}</div>
                <div class="question-text">${q.question}</div>
                <div class="answer-section">
                    <button class="btn" onclick="toggleAnswer()">הצג תשובה</button>
                    <div class="answer-content" id="answer-content">
                        ${q.answer}
                    </div>
                </div>
            `;

            // Update counter
            document.getElementById('current').textContent = index + 1;
            
            // Update navigation buttons
            document.getElementById('prev-btn').disabled = (index === 0);
            document.getElementById('next-btn').disabled = (index === questions.length - 1);
        }

        function toggleAnswer() {
            const answerContent = document.getElementById('answer-content');
            const btn = event.target;
            
            if (answerContent.classList.contains('show')) {
                answerContent.classList.remove('show');
                btn.textContent = 'הצג תשובה';
            } else {
                answerContent.classList.add('show');
                btn.textContent = 'הסתר תשובה';
            }
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                displayQuestion(currentQuestion);
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                displayQuestion(currentQuestion);
            }
        }

        // Initialize
        displayQuestion(0);
    </script>
