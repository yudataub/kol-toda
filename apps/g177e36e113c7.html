        function playSound(frequencies, durations) {
            let startTime = audioContext.currentTime;
            frequencies.forEach((freq, index) => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = freq;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.3, startTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + durations[index]);
                
                oscillator.start(startTime);
                oscillator.stop(startTime + durations[index]);
                
                startTime += durations[index];
            });

        function startQuestions() {
            currentQuestion = 0;
            lessonScore = 0;
            renderQuestion();
        }

        function renderQuestion() {
            const container = document.getElementById('gameContainer');
            const lesson = lessons[currentLesson];
            const question = lesson.questions[currentQuestion];
            
            const shuffledAnswers = shuffle(question.answers.map((answer, index) => ({
                text: answer,
                isCorrect: index === question.correct
            })));
            
            answered = false;
            
            container.innerHTML = `
                <h1>מֹשֶׁה רַבֵּנוּ וְהַסְּנֶה הַבּוֹעֵר 🔥💖</h1>
                ${updateProgress()}
                <div class="lesson-title">${lesson.title}</div>
                <div class="question-box">
                    <div class="question-text">
                        שְׁאֵלָה ${currentQuestion + 1} מִתּוֹךְ 3:<br>
                        ${question.question}
                    </div>
                    <div id="answersContainer">
                        ${shuffledAnswers.map((answer, index) => `
                            <button class="answer-button" onclick="checkAnswer(${answer.isCorrect}, ${index})">
                                ${answer.text}
                            </button>
                        `).join('')}
                    </div>
                    <div id="feedback"></div>
                </div>
            `;
        }

        function checkAnswer(isCorrect, buttonIndex) {
            if (answered) return;
            answered = true;
            
            const buttons = document.querySelectorAll('.answer-button');
            const feedback = document.getElementById('feedback');
            const lesson = lessons[currentLesson];
            const question = lesson.questions[currentQuestion];
            
            totalQuestions++;
            
            if (isCorrect) {
                score++;
                lessonScore++;
                buttons[buttonIndex].classList.add('correct');
                
                const encouragements = [
                    'מְצֻיָּן! ⭐',
                    'נִפְלָא! 💪',
                    'כָּל הַכָּבוֹד! 🎯',
                    'פַּצְצָה! 🔥',
                    'אַתָּה/אַתְּ שׁוֹלֵט/שׁוֹלֶטֶת! 🌟'
                ];
                
                const encouragement = encouragements[Math.floor(Math.random() * encouragements.length)];
                
                feedback.innerHTML = `
                    <div class="feedback correct">
                        <p style="font-size: 1.4em; margin-bottom: 10px;">${encouragement}</p>
                        <p>${question.explanation}</p>
                        <p style="margin-top: 15px; color: #065f46; font-weight: bold;">הַקָּדוֹשׁ בָּרוּךְ הוּא שָׂמֵחַ כְּשֶׁאַתָּה/אַתְּ לוֹמֵד/לוֹמֶדֶת בְּאַהֲבָה! 💖</p>
                    </div>
                `;
                
                playSound([523.25, 659.25, 783.99], [0.15, 0.15, 0.3]);
            } else {
                buttons[buttonIndex].classList.add('wrong');
                
                feedback.innerHTML = `
                    <div class="feedback wrong">
                        <p style="font-size: 1.3em; margin-bottom: 10px;">לֹא בְּדִיּוּק... 🤔</p>
                        <p>${question.explanation}</p>
                        <p style="margin-top: 15px; color: #991b1b; font-weight: bold;">נַסֶּה שׁוּב! גַּם כְּשֶׁטּוֹעִים - לוֹמְדִים! הַשֵּׁם אוֹהֵב אוֹתְךָ! 💡💖</p>
                    </div>
                `;
            }
            
            setTimeout(() => {
                if (currentQuestion < lesson.questions.length - 1) {
                    currentQuestion++;
                    renderQuestion();
                } else {
                    finishLesson();
                }
            }, 3500);
        }

        function finishLesson() {
            const container = document.getElementById('gameContainer');
            const lesson = lessons[currentLesson];
            const passed = lessonScore >= 2;
            
            if (passed) {
                if (lessonScore === 3) {
                    container.innerHTML = `
                        <h1>מֹשֶׁה רַבֵּנוּ וְהַסְּנֶה הַבּוֹעֵר 🔥💖</h1>
                        ${updateProgress()}
                        <div class="lesson-title">${lesson.title}</div>
                        <div class="certificate">
                            <h2>מַדְהִים! 🏆</h2>
                            <p style="font-size: 1.5em;">עָנִיתָ נָכוֹן עַל כָּל הַשְּׁאֵלוֹת!</p>
                            <p style="font-size: 1.3em; margin-top: 20px;">אַתָּה/אַתְּ שׁוֹלֵט/שׁוֹלֶטֶת!</p>
                            <p style="font-size: 1.4em; color: #92400e; margin-top: 20px;">
                                אַתָּה/אַתְּ חַי/חַיָּה בְּאַהֲבַת הַשֵּׁם! 🎉💖
                            </p>
                        </div>
                        <button class="btn-primary" onclick="nextLesson()">
                            ${currentLesson < lessons.length - 1 ? 'לַשִּׁיעוּר הַבָּא! 🚀' : 'לְסִיּוּם הַמִּשְׂחָק! 🎊'}
                        </button>
                    `;
                    playSound([523.25, 659.25, 783.99, 1046.50, 783.99, 659.25], [0.15, 0.15, 0.15, 0.2, 0.15, 0.3]);
                } else {
                    container.innerHTML = `
                        <h1>מֹשֶׁה רַבֵּנוּ וְהַסְּנֶה הַבּוֹעֵר 🔥💖</h1>
                        ${updateProgress()}
                        <div class="lesson-title">${lesson.title}</div>
                        <div class="certificate">
                            <h2>כִּמְעַט מֻשְׁלָם! 💪</h2>
                            <p style="font-size: 1.4em;">עָנִיתָ נָכוֹן עַל ${lessonScore} מִתּוֹךְ 3!</p>
                            <p style="font-size: 1.3em; margin-top: 20px; color: #92400e;">
                                מַמָּשׁ כְּמוֹ בָּאַהֲבָה - מַמְשִׁיכִים לִצְמוֹחַ! 🌱💖
                            </p>
                        </div>
                        <button class="btn-primary" onclick="nextLesson()">
                            ${currentLesson < lessons.length - 1 ? 'לַשִּׁיעוּר הַבָּא! 🚀' : 'לְסִיּוּם הַמִּשְׂחָק! 🎊'}
                        </button>
                    `;
                }
            } else {
                container.innerHTML = `
                    <h1>מֹשֶׁה רַבֵּנוּ וְהַסְּנֶה הַבּוֹעֵר 🔥💖</h1>
                    ${updateProgress()}
                    <div class="lesson-title">${lesson.title}</div>
                    <div class="certificate">
                        <h2>בּוֹא נְנַסֶּה שׁוּב! 💖</h2>
                        <p style="font-size: 1.3em;">עָנִיתָ נָכוֹן עַל ${lessonScore} מִתּוֹךְ 3</p>
                        <p style="font-size: 1.2em; margin-top: 20px; color: #92400e;">
                            צָרִיךְ 2 תְּשׁוּבוֹת נְכוֹנוֹת כְּדֵי לְהַמְשִׁיךְ
                        </p>
                        <p style="font-size: 1.3em; margin-top: 15px; color: #78350f;">
                            בּוֹא נְנַסֶּה שׁוּב, בְּאַהֲבָה וְסַבְלָנוּת! 💖
                        </p>
                        <p style="margin-top: 15px;">הַקָּדוֹשׁ בָּרוּךְ הוּא אוֹהֵב אוֹתְךָ גַּם כְּשֶׁטּוֹעִים! 🙏</p>
                    </div>
                    <button class="btn-primary" onclick="renderLesson()">נְנַסֶּה שׁוּב! 🔄</button>
                `;
            }
        }

        function nextLesson() {
            if (currentLesson < lessons.length - 1) {
                currentLesson++;
                renderLesson();
            } else {
                showCompletion();
            }
        }

        function showCompletion() {
            const container = document.getElementById('gameContainer');
            const percentage = Math.round((score / totalQuestions) * 100);
            
            container.innerHTML = `
                <h1>סִיַּמְתָּ אֶת הַמִּשְׂחָק! 🎊💖</h1>
                <div class="certificate">
                    <h2>תְּעוּדַת הִצְטַיְּנוּת 🏆</h2>
                    <div class="certificate-content">
                        <p style="font-size: 1.6em; margin: 20px 0;">
                            <strong>כָּל הַכָּבוֹד!</strong>
                        </p>
                        <p style="font-size: 1.3em;">
                            עָנִיתָ נָכוֹן עַל <strong>${score}</strong> מִתּוֹךְ <strong>${totalQuestions}</strong> שְׁאֵלוֹת
                        </p>
                        <p style="font-size: 1.3em;">
                            (${percentage}% 🌟)
                        </p>
                        <p style="margin-top: 30px; font-size: 1.2em; line-height: 1.8;">
                            <em>"וְאָהַבְתָּ אֵת ה' אֱלֹהֶיךָ בְּכָל לְבָבְךָ<br>
                            וּבְכָל נַפְשְׁךָ וּבְכָל מְאֹדֶךָ"</em>
                        </p>
                    </div>
                </div>
                
                <div class="reflection-questions">
                    <h3>שְׁאֵלוֹת לְמַחְשָׁבָה 💭</h3>
                    <p><strong>1.</strong> אֵיךְ אוּכַל לְהָבִיא יוֹתֵר אַהֲבַת הַשֵּׁם לַלִּמּוּד הַבָּא שֶׁלִּי?</p>
                    <p><strong>2.</strong> אֵיזוֹ מִצְוָה אֲנִי רוֹצֶה לְקַיֵּם הַיּוֹם מִתּוֹךְ שִׂמְחָה?</p>
                    <p><strong>3.</strong> מָה לָמַדְתִּי עַל אַהֲבַת הַקָּדוֹשׁ בָּרוּךְ הוּא אֵלַי?</p>
                </div>

                <div class="lottery-link">
                    <h3>🎁 הַגְרָלָה נוֹשֵׂאת פְּרָסִים! 🎁</h3>
                    <p>זָכִיתָ לְהִכָּנֵס לְהַגְרָלָה מְיֻחֶדֶת!</p>
                    <a href="https://forms.gle/A66uubei4XSX6SG2A" target="_blank">
                        👉 לַחֲצוּ כָּאן לְהִרָשֵׁם לַהַגְרָלָה! 👈
                    </a>
                </div>

                <div class="contact-info">
                    <p><strong>נִבְנָה בְּאַהֲבָה עַל יְדֵי:</strong></p>
                    <p>הָרַב יְהוּדָה טָאוּב מִקִּרְיַת אַתָּא</p>
                    <p>📞 לִפְרָטִים: 0527139520</p>
                </div>

                <button class="btn-primary" onclick="renderIntro()">שַׂחֲקוּ שׁוּב! 🔄</button>
            `;
        }

        // התחלת המשחק
        renderIntro();
    </script>
</body>
</html>
