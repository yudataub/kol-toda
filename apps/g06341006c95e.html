                <h1>מִשְׂחַק אַרְבַּע לְשׁוֹנוֹת הַגְּאֻלָּה 💖</h1>
                <div class="intro-text">
                    <p>שָׁלוֹם יְקָרִים! 🌟</p>
                    <p>הַיּוֹם נִלְמַד יַחַד עַל אַרְבַּע הַהַבְטָחוֹת הַמְּיֻחָדוֹת שֶׁהַשֵּׁם נָתַן לְעַם יִשְׂרָאֵל - אַרְבַּע לְשׁוֹנוֹת הַגְּאֻלָּה! 💫</p>
                    <p>כָּל הַבְטָחָה מְלַמֶּדֶת אוֹתָנוּ עַל אַהֲבַת הַשֵּׁם וְדְאָגָתוֹ לָנוּ! 💖</p>
                    <p>בְּסוֹף הַמִּשְׂחָק תְּקַבְּלוּ תְּעוּדַת הִצְטַיְּנוּת וְתִכָּנְסוּ לְהַגְרָלָה! 🎁</p>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 0%">0%</div>
                </div>
                <button class="primary-btn" onclick="startGame()">בּוֹאוּ נַתְחִיל! 🚀</button>
            `;
        }
        
        function startGame() {
            userName = prompt("מָה שִׁמְךָ? 💫");
            if (!userName || userName.trim() === "") {
                userName = "תַּלְמִיד יָקָר";
            }
            currentLesson = 0;
            score = 0;
            renderLesson(0);
        }
        
        function renderLesson(lessonIndex) {
            lessonScore = 0;
            currentQuestionIndex = 0;
            const lesson = lessons[lessonIndex];
            const progress = ((lessonIndex) / lessons.length) * 100;
            
            document.getElementById("gameContainer").innerHTML = `
                <h1>${lesson.title}</h1>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${progress}%">${Math.round(progress)}%</div>
                </div>
                <div class="lesson-content">
                    ${lesson.content}
                </div>
                <button class="primary-btn" onclick="startQuestions()">בּוֹאוּ נַתְחִיל אֶת הַשְּׁאֵלוֹת! 📝</button>
            `;
        }
        
        function startQuestions() {
            renderQuestion(currentQuestionIndex);
        }
        
        function renderQuestion(questionIndex) {
            const lesson = lessons[currentLesson];
            const question = lesson.questions[questionIndex];
            const shuffledAnswers = shuffleArray(question.answers);
            const progress = ((currentLesson * 3 + questionIndex) / 12) * 100;
            
            let html = `
                <h1>${lesson.title}</h1>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${progress}%">${Math.round(progress)}%</div>
                </div>
                <div class="question-box">
                    <div class="question-text">${question.q}</div>
                    <div id="answersContainer">
            `;
            
            shuffledAnswers.forEach((answer, index) => {
                const originalIndex = question.answers.indexOf(answer);
                html += `<button class="answer-btn" onclick="checkAnswer(${questionIndex}, ${originalIndex})">${answer}</button>`;
            });
            
            html += `
                    </div>
                </div>
                <div id="feedbackContainer"></div>
            `;
            
            document.getElementById("gameContainer").innerHTML = html;
        }
        
        function checkAnswer(questionIndex, selectedAnswer) {
            const lesson = lessons[currentLesson];
            const question = lesson.questions[questionIndex];
            const buttons = document.querySelectorAll(".answer-btn");
            buttons.forEach(btn => btn.disabled = true);
            
            const feedbackContainer = document.getElementById("feedbackContainer");
            
            if (selectedAnswer === question.correct) {
                lessonScore++;
                score++;
                playSound([261.63, 329.63, 392.00]);
                
                const encouragements = [
                    `מְצֻיָּן, ${userName}! ⭐`,
                    `נִפְלָא, ${userName}! 💪`,
                    `כָּל הַכָּבוֹד, ${userName}! 🎯`,
                    `פַּצְצָה, ${userName}! 💫`
                ];
                const randomEncouragement = encouragements[Math.floor(Math.random() * encouragements.length)];
                
                feedbackContainer.innerHTML = `
                    <div class="feedback correct pulse">
                        <strong>${randomEncouragement}</strong><br>
                        ${question.explanation}<br>
                        <em>הַשֵּׁם שָׂמֵחַ כְּשֶׁרוֹאִים אֶת אַהֲבָתוֹ בְּלִבְּךָ, ${userName}! 💖</em>
                    </div>
                `;
            } else {
                playSound([196.00]);
                feedbackContainer.innerHTML = `
                    <div class="feedback incorrect">
                        <strong>לֹא בְּדִיּוּק, ${userName}... 🤔</strong><br>
                        ${question.explanation}<br>
                        <em>גַּם כְּשֶׁטּוֹעִים - לוֹמְדִים! הַשֵּׁם אוֹהֵב אוֹתְךָ, ${userName}! 💡</em>
                    </div>
                `;
            }
            
            setTimeout(() => {
                if (currentQuestionIndex < 2) {
                    currentQuestionIndex++;
                    feedbackContainer.innerHTML += `<button class="primary-btn" onclick="renderQuestion(${currentQuestionIndex})">הַשְּׁאֵלָה הַבָּאָה ⬅️</button>`;
                } else {
                    checkLessonCompletion();
                }
            }, 100);
        }
        
        function checkLessonCompletion() {
            const feedbackContainer = document.getElementById("feedbackContainer");
            
            if (lessonScore >= 2) {
                if (lessonScore === 3) {
                    playSound([523.25, 659.25, 783.99, 1046.50, 783.99, 659.25]);
                    feedbackContainer.innerHTML += `
                        <div class="feedback correct pulse">
                            <strong>מַדְהִים, ${userName}! 🏆</strong><br>
                            עָנִיתָ נָכוֹן עַל כָּל הַשְּׁאֵלוֹת! אַתָּה שׁוֹלֵט!<br>
                            אַתָּה חַי בְּאַהֲבַת ה׳! 🎉
                        </div>
                    `;
                } else {
                    playSound([523.25, 659.25, 783.99]);
                    feedbackContainer.innerHTML += `
                        <div class="feedback correct">
                            <strong>כִּמְעַט מֻשְׁלָם, ${userName}! 💪</strong><br>
                            מַמָּשׁ כְּמוֹ בְּאַהֲבָה - מַמְשִׁיכִים לִצְמוֹחַ! 🌱
                        </div>
                    `;
                }
                
                if (currentLesson < lessons.length - 1) {
                    feedbackContainer.innerHTML += `<button class="primary-btn" onclick="nextLesson()">הַשִּׁיעוּר הַבָּא! ⬅️</button>`;
                } else {
                    feedbackContainer.innerHTML += `<button class="primary-btn" onclick="showCertificate()">לִרְאוֹת אֶת הַתְּעוּדָה! 🎓</button>`;
                }
            } else {
                feedbackContainer.innerHTML += `
                    <div class="feedback incorrect">
                        <strong>בּוֹא נְנַסֶּה שׁוּב, ${userName}! 💖</strong><br>
                        בְּאַהֲבָה וּבְסַבְלָנוּת - נַצְלִיחַ!
                    </div>
                    <button class="primary-btn" onclick="renderLesson(${currentLesson})">נְנַסֶּה שׁוּב 🔄</button>
                `;
            }
        }
        
        function nextLesson() {
            currentLesson++;
            renderLesson(currentLesson);
        }
        
        async function sendScoreToTeacher() {
            const now = new Date();
            const data = {
                name: userName,
                score: `${score}/12`,
                percentage: `${Math.round((score/12)*100)}%`,
                gameName: document.title,
                date: now.toLocaleDateString("he-IL"),
                time: now.toLocaleTimeString("he-IL")
            };
            
            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: "POST",
                    headers: {"Content-Type": "text/plain"},
                    body: JSON.stringify(data)
                });
                console.log("✅ הַנְּתוּנִים נִשְׁלְחוּ בְּהַצְלָחָה!");
            } catch (error) {
                console.error("❌ שְׁגִיאָה בְּשִׁלּוּחַ:", error);
            }
        }
        
        function showCertificate() {
            playSound([523.25, 659.25, 783.99, 1046.50, 783.99, 659.25]);
            const percentage = Math.round((score / 12) * 100);
            
            document.getElementById("gameContainer").innerHTML = `
                <div class="certificate">
                    <h2>🎓 תְּעוּדַת הִצְטַיְּנוּת 🎓</h2>
                    <h1 style="color: #6c5ce7; margin: 20px 0;">מָזָל טוֹב, ${userName}! 🎉</h1>
                    <div class="score-display">${score}/12 (${percentage}%)</div>
                    <p style="font-size: 1.3em; margin: 20px 0;">
                        סִיַּמְתָּ בְּהַצְלָחָה אֶת מִשְׂחַק אַרְבַּע לְשׁוֹנוֹת הַגְּאֻלָּה! 💖
                    </p>
                    <div style="background: white; padding: 20px; border-radius: 15px; margin: 20px 0;">
                        <p style="font-size: 1.2em; color: #2d3436;">
                            <strong>״כָּל מִי שֶׁלָּמַד בְּאַהֲבָה - פָּתַח שַׁעַר בְּלִבּוֹ אֶל הַשֵּׁם״ 💫</strong>
                        </p>
                        <p style="font-size: 1.1em; color: #636e72; margin-top: 15px;">
                            ״וְאָהַבְתָּ אֵת ה׳ אֱלֹקֶיךָ בְּכָל לְבָבְךָ וּבְכָל נַפְשְׁךָ וּבְכָל מְאֹדֶךָ״
                        </p>
                    </div>
                    <div style="background: #dfe6e9; padding: 20px; border-radius: 10px; margin: 20px 0;">
                        <h3 style="color: #2d3436;">💭 שְׁאֵלוֹת לְמַחְשָׁבָה:</h3>
                        <p style="text-align: right; margin: 10px 0;">1. אֵיךְ אוּכַל לְהָבִיא יוֹתֵר אַהֲבַת ה׳ לַלִּמּוּד הַבָּא שֶׁלִּי?</p>
                        <p style="text-align: right; margin: 10px 0;">2. אֵיזוֹ מִצְוָה אֲנִי רוֹצֶה לְקַיֵּם הַיּוֹם מִתּוֹךְ שִׂמְחָה?</p>
                        <p style="text-align: right; margin: 10px 0;">3. אֵיךְ אֲנִי מַרְגִּישׁ אֶת אַהֲבַת הַשֵּׁם בְּחַיַּי?</p>
                    </div>
                    <div style="background: linear-gradient(135deg, #a29bfe 0%, #6c5ce7 100%); padding: 20px; border-radius: 15px; margin: 20px 0; color: white;">
                        <h3>🎉 מָזָל טוֹב, ${userName}! 🎁</h3>
                        <p style="font-size: 1.2em; margin: 15px 0;">
                            נִכְנַסְתָּ לְהַגְרָלָה נוֹשֵׂאַת פְּרָסִים!
                        </p>
                        <a href="https://forms.gle/A66uubei4XSX6SG2A" target="_blank" style="display: inline-block; background: white; color: #6c5ce7; padding: 15px 30px; border-radius: 50px; text-decoration: none; font-weight: bold; margin: 10px 0;">
                            📋 לְחַץ כָּאן לְרִישּׁוּם לְהַגְרָלָה!
                        </a>
                    </div>
                    <div style="margin-top: 30px; padding: 20px; background: #f8f9fa; border-radius: 10px;">
                        <p style="font-size: 1.1em; color: #2d3436;">
                            נִבְנָה בְּאַהֲבָה עַל יְדֵי:<br>
                            <strong>הָרַב יְהוּדָה טָאוּב מִקִּרְיַת אַתָּא</strong><br>
                            📞 לִפְרָטִים: 0527139520
                        </p>
                    </div>
                </div>
            `;
            
            sendScoreToTeacher();
        }
        
        renderIntro();
    </script>
</body>
</html>
