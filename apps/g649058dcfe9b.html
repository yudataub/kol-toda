        function playSound(frequencies, durations) {
            let startTime = audioContext.currentTime;
            frequencies.forEach((freq, index) => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = freq;
                oscillator.type = 'sine';
                
                const duration = durations[index] || 0.2;
                gainNode.gain.setValueAtTime(0.3, startTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
                
                oscillator.start(startTime);
                oscillator.stop(startTime + duration);
                
                startTime += duration;
            });
        }

            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }

            questionsContainer.appendChild(questionDiv);
            
            // הוספת כפתורים עם event listeners (במקום onclick)

                button.className = 'answer-btn';
                button.textContent = ans.text;
                button.addEventListener('click', function() {
                    checkAnswer(lessonIndex, questionIndex, ans.index);

                answersContainer.appendChild(button);
            });

                score: `${score}/12`,

                gameName: document.title,
                date: now.toLocaleDateString('he-IL'),
                time: now.toLocaleTimeString('he-IL')
            };
            
            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain'
                    },
                    body: JSON.stringify(data)
                });
                console.log('✅ הַנְּתוּנִים נִשְׁלְחוּ בְּהַצְלָחָה!');
            } catch (error) {
                console.error('❌ שְׁגִיאָה בְּשִׁלּוּחַ:', error);
            }
        }
