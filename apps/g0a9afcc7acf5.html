    <style>
        * {

        h1 {

        }

            50% { transform: scale(1.05); }

            color: #721c24;
            border-right: 5px solid #dc3545;

    <script>
        // Web Audio API
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        // פונקציה להשמעת צליל
        function playSound(frequencies, duration = 0.2) {
            frequencies.forEach((freq, index) => {
                setTimeout(() => {
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    oscillator.frequency.value = freq;
                    oscillator.type = 'sine';
                    
                    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
                    
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + duration);
                }, index * duration * 1000);
            });
        }

        // ערבוב מערך (Fisher-Yates)
        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

                            "הָעָם כָּעַס וְרָצָה לְהִשָּׁאֵר בְּמִצְרַיִם"
                        ],
                        correct: 0,
                        explanation: "'וַיַּאֲמֵן הָעָם' 🙏 - הֵם הֶאֱמִינוּ, קָדוּ וְהִשְׁתַּחֲווּ בְּאֱמוּנָה שְׁלֵמָה!"
                    },
                    {
                        question: "מָה פֵּרוּשׁ 'פָּקַד ה' אֶת בְּנֵי יִשְׂרָאֵל'?",
                        answers: [
                            "הַשֵּׁם זָכַר אוֹתָם וְלֹא שָׁכַח אוֹתָם",
                            "הַשֵּׁם בָּדַק אוֹתָם אִם הֵם טוֹבִים",
                            "הַשֵּׁם מִנָּה אוֹתָם כְּדֵי לָדַעַת כַּמָּה הֵם",
                            "הַשֵּׁם נָתַן לָהֶם צְבָא גָּדוֹל"
                        ],
                        correct: 0,
                        explanation: "'פָּקַד' זֶה זָכַר 💖! הַשֵּׁם זוֹכֵר אוֹתָנוּ תָּמִיד וְלֹא שׁוֹכֵחַ!"
                    }
                ]
            }
        ];

        // פונקציה להצגת מסך הפתיחה
        function renderIntro() {
            const container = document.getElementById('gameContainer');
            container.innerHTML = `
                <h1>מַסַּע הַגְּאֻלָּה 🌟<br>מָשֶׁה רַבֵּנוּ בֵּין פַּחַד לִגְבוּרָה 💪</h1>
                
                <div class="intro-box">
                    <p style="font-size: 1.3em; text-align: center; margin-bottom: 15px;">🎮 <strong>שָׁלוֹם וּבְרָכָה!</strong> 💖</p>
                    
                    <p>הִגַּעְתָּ לְמִשְׂחַק לְמִידָה מְיֻחָד עַל <span class="highlight">פֶּרֶק ד' בְּסֵפֶר שְׁמוֹת</span> ✨</p>
                    
                    <p>נָצָא יַחַד לְמַסַּע מְרַתֵּק 🚶 - כֵּיצַד מָשֶׁה רַבֵּנוּ קִבֵּל אֶת הַשְּׁלִיחוּת הַגְּדוֹלָה לְגָאֵל אֶת עַם יִשְׂרָאֵל מִמִּצְרַיִם! 🎺</p>
                    
                    <p>נִלְמַד עַל חֲשָׁשׁוֹת 😰, אוֹתוֹת מֻפְלָאִים ✨, אֱמוּנָה 🙏, וְאַהֲבַת הַשֵּׁם 💖!</p>
                    
                    <p style="text-align: center; margin-top: 20px; font-size: 1.2em;"><strong>הָאִם אַתָּה מוּכָן לְהַתְחִיל? 🎯</strong></p>
                </div>
                
                <button class="start-btn" onclick="startGame()">בּוֹא נַתְחִיל! 🚀</button>
            `;
        }

        // פונקציה להתחלת המשחק
        function startGame() {
            currentLesson = 0;
            currentQuestion = 0;
            score = 0;
            lessonScore = 0;
            renderLesson();
        }

        // פונקציה להצגת שיעור
        function renderLesson() {
            const lesson = lessons[currentLesson];
            const container = document.getElementById('gameContainer');
            
            const progress = ((currentLesson) / lessons.length * 100).toFixed(0);
            
            container.innerHTML = `
                <h1>${lesson.title}</h1>
                
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${progress}%">
                        ${progress}% 📊
                    </div>
                </div>
                
                <div class="score-display">נִקּוּד: ${score} / ${totalQuestions} 🌟</div>
                
                <div class="lesson-box">
                    <div class="lesson-content">
                        ${lesson.content}
                    </div>
                    
                    <div class="inspiration-box">
                        💭 <strong>שְׁאֵלָה לְמַחְשָׁבָה:</strong><br>
                        ${lesson.inspiration}
                    </div>
                </div>
                
                <button class="next-btn" onclick="startQuestions()">בּוֹא נַעֲנֶה עַל שְׁאֵלוֹת! 🎯</button>
            `;
        }

        // פונקציה להתחלת שאלות
        function startQuestions() {
            currentQuestion = 0;
            lessonScore = 0;
            renderQuestion();
        }

        // פונקציה להצגת שאלה
        function renderQuestion() {
            const lesson = lessons[currentLesson];
            const question = lesson.questions[currentQuestion];
            const container = document.getElementById('gameContainer');
            
            // ערבוב התשובות
            const shuffledAnswers = shuffleArray(question.answers.map((ans, idx) => ({text: ans, index: idx})));
            
            const progress = ((currentLesson + (currentQuestion / lesson.questions.length)) / lessons.length * 100).toFixed(0);
            
            container.innerHTML = `
                <h1>${lesson.title}</h1>
                
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${progress}%">
                        ${progress}% 📊
                    </div>
                </div>
                
                <div class="score-display">נִקּוּד: ${score} / ${totalQuestions} 🌟</div>
                
                <div class="question-box">
                    <div class="question-text">
                        ❓ שְׁאֵלָה ${currentQuestion + 1} מִתּוֹךְ ${lesson.questions.length}:<br>
                        ${question.question}
                    </div>
                    
                    <div id="answersContainer">
                        ${shuffledAnswers.map((ans, idx) => `
                            <button class="answer-btn" onclick="checkAnswer(${ans.index}, ${question.correct})" id="answer${idx}">
                                ${ans.text}
                            </button>
                        `).join('')}
                    </div>
                    
                    <div id="feedbackContainer"></div>
                </div>
            `;
        }

        // פונקציה לבדיקת תשובה
        function checkAnswer(selectedIndex, correctIndex) {
            const lesson = lessons[currentLesson];
            const question = lesson.questions[currentQuestion];
            const feedbackContainer = document.getElementById('feedbackContainer');
            const buttons = document.querySelectorAll('.answer-btn');
            
            // נעילת כל הכפתורים
            buttons.forEach(btn => btn.disabled = true);
            
            totalQuestions++;
            
            if (selectedIndex === correctIndex) {
                // תשובה נכונה
                score++;
                lessonScore++;
                
                event.target.classList.add('correct');
                playSound([261.63, 329.63, 392.00]); // C-E-G
                
                const encouragements = [
                    "מְצֻיָּן! ⭐",
                    "נִפְלָא! 💪",
                    "כָּל הַכָּבוֹד! 🎯",
                    "מַמָּשׁ יָפֶה! 🌟",
                    "פַּצְצָה! 💥"
                ];
                const randomEncouragement = encouragements[Math.floor(Math.random() * encouragements.length)];
                
                const inspirations = [
                    "הַשֵּׁם שָׂמֵחַ כְּשֶׁרוֹאֶה אֶת אַהֲבָתוֹ בְּלִבְּךָ 💖",
                    "הַשֵּׁם אוֹהֵב אוֹתְךָ כְּשֶׁאַתָּה לוֹמֵד 📚",
                    "הַשֵּׁם גֵּאֶה בְּךָ! אַתָּה נִפְלָא! 🌟",
                    "הַשֵּׁם מְבָרֵךְ אוֹתְךָ בְּאַהֲבָה 💫",
                    "אַתָּה מַצְלִיחַ! הַשֵּׁם אִתְּךָ! 💪"
                ];
                const randomInspiration = inspirations[Math.floor(Math.random() * inspirations.length)];
                
                feedbackContainer.innerHTML = `
                    <div class="feedback correct">
                        <strong>${randomEncouragement}</strong><br>
                        ${question.explanation}<br>
                        <em>${randomInspiration}</em>
                    </div>
                `;
            } else {
                // תשובה שגויה
                event.target.classList.add('wrong');
                
                feedbackContainer.innerHTML = `
                    <div class="feedback wrong">
                        <strong>לֹא בְּדִיּוּק... 🤔</strong><br>
                        ${question.explanation}<br>
                        <em>גַּם כְּשֶׁטּוֹעִים - לוֹמְדִים! הַשֵּׁם אוֹהֵב אוֹתְךָ! 💡💖</em>
                    </div>
                `;
            }
            
            // כפתור להמשך
            setTimeout(() => {
                if (currentQuestion < lesson.questions.length - 1) {
                    feedbackContainer.innerHTML += `
                        <button class="next-btn" onclick="nextQuestion()">שְׁאֵלָה הַבָּאָה ➡️</button>
                    `;
                } else {
                    feedbackContainer.innerHTML += `
                        <button class="next-btn" onclick="finishLesson()">סִיּוּם הַשִּׁיעוּר 🏁</button>
                    `;
                }
            }, 500);
        }

        // פונקציה למעבר לשאלה הבאה
        function nextQuestion() {
            currentQuestion++;
            renderQuestion();
        }

        // פונקציה לסיום שיעור
        function finishLesson() {
            const lesson = lessons[currentLesson];
            const container = document.getElementById('gameContainer');
            const percentage = (lessonScore / lesson.questions.length * 100).toFixed(0);
            
            let feedbackTitle = "";
            let feedbackText = "";
            let canProgress = false;
            
            if (lessonScore === 3) {
                feedbackTitle = "מַדְהִים! 🏆";
                feedbackText = "עָנִיתָ נָכוֹן עַל כָּל הַשְּׁאֵלוֹת! אַתָּה שׁוֹלֵט! אַתָּה חַי בְּאַהֲבַת ה'! 🎉💖";
                playSound([523.25, 659.25, 783.99, 1046.50, 783.99, 659.25], 0.15); // C-E-G-C-G-E
                canProgress = true;
            } else if (lessonScore >= 2) {
                feedbackTitle = "כִּמְעַט מֻשְׁלָם! 💪";
                feedbackText = "עָנִיתָ נָכוֹן עַל רֹב הַשְּׁאֵלוֹת! מַמָּשׁ כְּמוֹ בְּאַהֲבָה - מַמְשִׁיךְ לִצְמוֹחַ 🌱💖";
                canProgress = true;
            } else {
                feedbackTitle = "בּוֹא נְנַסֶּה שׁוּב 🔄";
                feedbackText = "נִרְאֶה שֶׁהַשִּׁיעוּר קָשֶׁה קְצָת. בּוֹא נַחֲזוֹר עָלָיו יַחַד, בְּאַהֲבָה וּבְסַבְלָנוּת 💖";
                canProgress = false;
            }
            
            container.innerHTML = `
                <h1>${lesson.title}</h1>
                
                <div class="lesson-box">
                    <div class="lesson-title" style="font-size: 2.5em; margin: 30px 0;">
                        ${feedbackTitle}
                    </div>
                    
                    <div class="lesson-content" style="text-align: center; font-size: 1.3em;">
                        <p>${feedbackText}</p>
                        <p style="margin: 20px 0; font-size: 1.5em;">
                            <strong>הַנִּקּוּד שֶׁלְּךָ: ${lessonScore} / ${lesson.questions.length}</strong> (${percentage}%)
                        </p>
                    </div>
                </div>
                
                ${canProgress ? (currentLesson < lessons.length - 1 ? 
                    `<button class="next-btn" onclick="nextLesson()">שִׁיעוּר הַבָּא 🚀</button>` : 
                    `<button class="finish-btn" onclick="showCertificate()">סִיּוּם הַמִּשְׂחָק 🎓</button>`) : 
                    `<button class="next-btn" onclick="currentQuestion = 0; lessonScore = 0; renderQuestion()">נַחֲזוֹר עַל הַשִּׁיעוּר 🔄</button>`
                }
            `;
        }

        // פונקציה למעבר לשיעור הבא
        function nextLesson() {
            currentLesson++;
            renderLesson();
        }

        // פונקציה להצגת תעודה
        function showCertificate() {
            const container = document.getElementById('gameContainer');
            const finalPercentage = (score / totalQuestions * 100).toFixed(0);
            
            playSound([523.25, 659.25, 783.99, 1046.50, 783.99, 659.25], 0.15);
            
            container.innerHTML = `
                <div class="certificate">
                    <div class="certificate-title">
                        🎓 תְּעוּדַת הִצְטַיְּנוּת 🎓
                    </div>
                    
                    <div class="certificate-content">
                        <p><strong>כָּל הַכָּבוֹד!</strong> 🌟</p>
                        
                        <p>סִיַּמְתָּ בְּהַצְלָחָה אֶת מִשְׂחַק הַלְּמִידָה:<br>
                        <span class="highlight">"מַסַּע הַגְּאֻלָּה - מָשֶׁה רַבֵּנוּ"</span></p>
                        
                        <p style="font-size: 1.5em; margin: 20px 0;">
                            <strong>הַנִּקּוּד הַסּוֹפִי: ${score} / ${totalQuestions}</strong><br>
                            (${finalPercentage}%)
                        </p>
                        
                        <p>💖 <strong>אַתָּה לָמַדְתָּ עַל:</strong></p>
                        <p>אֱמוּנָה, אַהֲבַת הַשֵּׁם, שְׁמִירַת הַלָּשׁוֹן,<br>וְקִיּוּם מִצְווֹת בִּזְמַנָּן! 🎯</p>
                    </div>
                    
                    <div class="verse-box">
                        📜 <strong>פָּסוּק לְזִכָּרוֹן:</strong><br>
                        <span style="font-size: 1.3em;">"וְאָהַבְתָּ אֵת ה' אֱלֹהֶיךָ<br>בְּכָל לְבָבְךָ וּבְכָל נַפְשְׁךָ וּבְכָל מְאֹדֶךָ"</span><br>
                        (דברים ו, ה)
                    </div>
                </div>
                
                <div class="reflection-questions">
                    <h2 style="text-align: center; color: #764ba2; margin-bottom: 15px;">💭 שְׁאֵלוֹת לְמַחְשָׁבָה:</h2>
                    <p>🤔 <strong>אֵיךְ אוּכַל לְהָבִיא יוֹתֵר אַהֲבַת ה' לַלִּמּוּד הַבָּא שֶׁלִּי?</strong></p>
                    <p>🤔 <strong>אֵיזוֹ מִצְוָה אֲנִי רוֹצֶה לְקַיֵּם הַיּוֹם מִתּוֹךְ שִׂמְחָה?</strong></p>
                    <p>🤔 <strong>אֵיךְ אֲנִי יָכוֹל לִשְׁמוֹר עַל לְשׁוֹנִי וּלְדַבֵּר טוֹב עַל אֲחֵרִים?</strong></p>
                </div>
                
                <div style="text-align: center; margin: 30px 0;">
                    <p style="font-size: 1.4em; margin-bottom: 20px;">
                        🎉 <strong>כָּל הַכָּבוֹד! זָכִיתָ לְסַיֵּם אֶת הַמַּסַּע בְּאַהֲבַת ה'!</strong> 💖
                    </p>
                    <p style="font-size: 1.2em; margin-bottom: 20px;">
                        הִנֵּה תְּעוּדַת הַהִצְטַיְּנוּת שֶׁלְּךָ 🎓<br>
                        <strong>וְאַתָּה נִכְנָס לְהַגְרָלָה נוֹשֵׂאת פְּרָסִים! 🎁</strong>
                    </p>
                    <a href="https://forms.gle/A66uubei4XSX6SG2A" target="_blank" class="raffle-link">
                        לְהַרְשָׁמָה לְהַגְרָלָה - לַחֲצוּ כָּאן! 🎯
                    </a>
                </div>
                
                <div class="contact-box">
                    <p style="font-size: 1.3em; margin-bottom: 15px;">
                        <strong>נִבְנָה בְּאַהֲבָה עַל יְדֵי:</strong>
                    </p>
                    <p style="font-size: 1.2em;">
                        <strong>הָרַב יְהוּדָה טָאוּב</strong><br>
                        מִקִּרְיַת אַתָּא 🏡
                    </p>
                    <p style="font-size: 1.2em; margin-top: 15px;">
                        📞 <strong>לִפְרָטִים:</strong> 0527139520
                    </p>
                </div>
            `;
        }

        // הפעלת המשחק
        window.onload = renderIntro;
    </script>
