<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;700&display=swap');

        :root {
            --primary-color: #005f73;
            --secondary-color: #0a9396;
            --accent-color: #ee9b00;
            --light-bg: #fdfcdc;
            --text-color: #333;
            --correct-green: #2a9d8f;
            --incorrect-red: #e76f51;
            --white: #ffffff;
        }

        html, body {
            margin: 0;
            padding: 0;
            font-family: 'Heebo', sans-serif;
            background: linear-gradient(135deg, #e0fbfc 0%, #edf2f4 100%);
            color: var(--text-color);
            font-size: 1.2em;
            line-height: 1.8;
            text-align: right;
            min-height: 100vh;
        }

        #gameContainer {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border: 1px solid #ddd;
        }

        h1, h2, h3, h4 {
            color: var(--primary-color);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        h1 {
            font-size: 2.5em;
            text-align: center;
            margin-bottom: 0.5em;
            color: var(--secondary-color);
        }
        
        h2 {
            font-size: 1.8em;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 0.3em;
            margin-top: 1.5em;
        }
        
        h3 {
            font-size: 1.4em;
            color: var(--primary-color);
        }

        p, ul li {
            font-size: 1.1rem;
            color: #444;
        }

        ul {
            list-style-type: '📖 ';
            padding-right: 20px;
        }
        
        .transition-text {
            font-style: italic;
            color: var(--secondary-color);
            text-align: center;
            font-size: 1.2rem;
            margin-bottom: 1.5em;
            border: 1px dashed var(--secondary-color);
            padding: 0.5em;
            border-radius: 10px;
        }

        .highlight {
            background-color: #fff3b0;
            padding: 2px 5px;
            border-radius: 5px;
        }

        .question-block {
            margin-top: 2.5rem;
            padding: 1.5rem;
            background-color: #f8f9fa;
            border-radius: 10px;
            border: 1px solid #e9ecef;
        }

        .answer-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 1rem;
        }

        .answer-btn {
            padding: 15px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 15px;
            background: linear-gradient(145deg, #ffffff, #e6e6e6);
            box-shadow: 5px 5px 10px #bebebe, -5px -5px 10px #ffffff;
            transition: all 0.2s ease-in-out;
            color: var(--primary-color);
        }

        .answer-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 7px 7px 15px #bebebe, -7px -7px 15px #ffffff;
        }

        .answer-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .correct-answer {
            background: linear-gradient(145deg, #57cc99, #80ed99);
            color: var(--white);
            box-shadow: inset 5px 5px 10px #4caf50, inset -5px -5px 10px #a5d6a7;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        .incorrect-answer {
            background: linear-gradient(145deg, #ff7b54, #ffb26b);
            color: var(--white);
            box-shadow: inset 5px 5px 10px #f44336, inset -5px -5px 10px #ffcdd2;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        .feedback {
            display: none;
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 10px;
            background-color: var(--light-bg);
            border: 2px solid var(--accent-color);
        }
        
        .feedback h4 {
            margin-top: 0;
            color: var(--secondary-color);
        }
        
        .feedback .explanation {
            font-style: italic;
        }
        
        .feedback .message {
            font-weight: bold;
            margin-top: 0.5em;
            color: var(--primary-color);
        }

        .next-btn, .start-btn {
            display: block;
            width: 50%;
            margin: 2rem auto 0;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            background-color: var(--accent-color);
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .next-btn:hover, .start-btn:hover {
            background-color: #ca6702;
        }

        .inspiration-box {
            margin-top: 2rem;
            padding: 1rem;
            background-color: #e0fbfc;
            border-right: 5px solid var(--secondary-color);
            border-radius: 5px;
        }
        
        .inspiration-box h4 {
            color: var(--secondary-color);
            margin-top: 0;
            font-size: 1.2em;
        }

        .final-screen h2 {
            text-align: center;
        }

        .final-screen .verse {
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            color: var(--primary-color);
            margin: 2rem 0;
            padding: 1rem;
            background-color: #e9f5db;
            border-radius: 10px;
        }

        .final-screen a {
            display: block;
            text-align: center;
            margin: 2rem 0;
            padding: 1rem;
            background-color: var(--correct-green);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            transition: transform 0.2s;
        }
        
        .final-screen a:hover {
            transform: scale(1.05);
        }

        .contact-info {
            text-align: center;
            margin-top: 2rem;
            font-size: 1rem;
            color: #555;
        }

        @media (max-width: 600px) {
            body {
                font-size: 1em;
            }
            #gameContainer {
                margin: 1rem;
                padding: 1rem;
            }
            h1 {
                font-size: 1.8em;
            }
            h2 {
                font-size: 1.5em;
            }
            .answer-btn, .next-btn, .start-btn {
                font-size: 1rem;
                padding: 12px;
            }
            .answer-buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

            gameContainer.innerHTML = `
                <h1>כֹּחָהּ שֶׁל תְּהִלָּה 🕎</h1>
                <p>שָׁלוֹם ${userName}! 💖 בָּרוּךְ הַבָּא לְמַסָּע קָצָר בְּאוּרָם שֶׁל יְמֵי הַחֲנֻכָּה הַקְּדוֹשִׁים. בַּיָּמִים הַנִּפְלָאִים הָאֵלֶּה, נְגַלֶּה יַחַד אֶת הַכֹּחַ הָעָצוּם שֶׁמִּסְתַּתֵּר בְּמִלָּה אַחַת פְּשׁוּטָה: "תּוֹדָה". 🌟</p>
                <p>יַחַד נִלְמַד לָמָּה הַמַּטָּרָה הָעִקָּרִית שֶׁלָּנוּ בָּעוֹלָם הִיא לְשַׁבֵּחַ, וְאֵיךְ הַהוֹדָאָה הַקְּטַנָּה בַּיּוֹתֵר יְכוֹלָה לִפְתֹּחַ שְׁעָרִים שֶׁל שֶׁפַע וִישׁוּעָה.</p>
                <p>מוּכָן לְהַתְחִיל? 💪 בְּהַצְלָחָה! ✨</p>
                <button class="start-btn">כֵּן, נַתְחִיל!</button>
            `;
            document.querySelector('.start-btn').addEventListener('click', () => {
                renderLesson();
            });
        }
        
        function renderLesson() {
            const lesson = lessons[currentLessonIndex];
            
            let transitionHTML = '';
            if (currentLessonIndex === 2) { // Before lesson 3
                transitionHTML = `<p class="transition-text">וְאֵין זְמַן טוֹב יוֹתֵר לְהִתְבּוֹנֵן בָּזֶה מִיְּמֵי הַחֲנֻכָּה הַנִּפְלָאִים הָאֵלֶּה...</p>`;
            }
            
            gameContainer.innerHTML = `
                ${transitionHTML}
                <h2>${lesson.title}</h2>
                <ul>
                    ${lesson.content.map(point => `<li>${point.replace(lesson.highlightedText, `<span class="highlight">${lesson.highlightedText}</span>`)}</li>`).join('')}
                </ul>
                <div class="inspiration-box">
                    <h4>רֶגַע לְהִתְבּוֹנְנוּת...</h4>
                    <p>${lesson.inspirationQuestion}</p>
                    <p><strong>${lesson.reinforcingSentences[0]}</strong><br><em>${lesson.reinforcingSentences[1]}</em></p>
                </div>
                <div id="questionsContainer"></div>
                <button class="next-btn" id="start-quiz-btn">הַתְחֵל בַּשְּׁאֵלוֹן</button>
            `;

            document.getElementById('start-quiz-btn').addEventListener('click', (e) => {
                e.target.style.display = 'none'; // Hide the start quiz button
                currentQuestionIndex = 0;
                renderQuestion();
            });
        }
        
        function renderQuestion() {
            const lesson = lessons[currentLessonIndex];
            const question = lesson.questions[currentQuestionIndex];
            const questionsContainer = document.getElementById('questionsContainer');
            
            questionsContainer.innerHTML = ''; // Clear previous question

            const questionBlock = document.createElement('div');
            questionBlock.className = 'question-block';
            questionBlock.id = `question-${currentLessonIndex}-${currentQuestionIndex}`;

            const shuffledAnswers = shuffleArray([...question.answers]);

            questionBlock.innerHTML = `
                <h3>שְׁאֵלָה ${currentQuestionIndex + 1}/${lesson.questions.length}:</h3>
                <p>${question.questionText}</p>
                <div class="answer-buttons">
                    ${shuffledAnswers.map((answer, index) => `
                        <button class="answer-btn" data-correct="${answer.isCorrect}">${answer.text}</button>
                    `).join('')}
                </div>
                <div class="feedback">
                    <h4 class="feedback-title"></h4>
                    <p class="explanation">${question.explanation}</p>
                    <p class="message">${question.message}</p>
                    <button class="next-btn">הַבָּא</button>
                </div>
            `;
            
            questionsContainer.appendChild(questionBlock);

            const answerButtons = questionBlock.querySelectorAll('.answer-btn');
            answerButtons.forEach(button => {
                button.addEventListener('click', handleAnswerClick);
            });
        }
        
        function handleAnswerClick(event) {
            const clickedButton = event.target;
            const isCorrect = clickedButton.dataset.correct === 'true';
            const questionBlock = clickedButton.closest('.question-block');
            const feedbackDiv = questionBlock.querySelector('.feedback');
            const feedbackTitle = feedbackDiv.querySelector('.feedback-title');

            if (isCorrect) {
                score++;
                clickedButton.classList.add('correct-answer');
                feedbackTitle.textContent = `מְצֻיָּן, ${userName}! ⭐`;
            } else {
                clickedButton.classList.add('incorrect-answer');
                feedbackTitle.textContent = `לֹא בְּדִיּוּק, ${userName}... 🤔`;
                questionBlock.querySelector('.answer-btn[data-correct="true"]').classList.add('correct-answer');
            }

            questionBlock.querySelectorAll('.answer-btn').forEach(btn => {
                btn.disabled = true;
            });

            feedbackDiv.style.display = 'block';
            feedbackDiv.querySelector('.next-btn').addEventListener('click', proceedToNext);
        }

        function proceedToNext() {
            currentQuestionIndex++;
            if (currentQuestionIndex < lessons[currentLessonIndex].questions.length) {
                renderQuestion();
            } else {
                currentLessonIndex++;
                if (currentLessonIndex < lessons.length) {
                    renderLesson();
                } else {
                    renderFinalScreen();
                }
            }
        }
        
        function renderFinalScreen() {
            gameContainer.innerHTML = `
                <div class="final-screen">
                    <h2>🏆 תְּעוּדַת סִיּוּם 🏆</h2>
                    <p style="text-align: center; font-size: 1.2rem;">כָּל הַכָּבוֹד, ${userName}! סִיַּמְתָּ אֶת הַמַּסָּע וְקִבַּלְתָּ צִיּוּן <strong>${score}/${lessons.flatMap(l => l.questions).length}</strong>.</p>
                    
                    <div class="verse">
                        "עַם זוּ יָצַרְתִּי לִי, תְּהִלָּתִי יְסַפֵּרוּ."
                    </div>

                    <h3>שְׁאֵלוֹת לְמַחְשָׁבָה וְהִתְבּוֹנְנוּת:</h3>
                    <ul>
                        <li>מַהוּ הַדָּבָר הָאֶחָד, שֶׁלֹּא חָשַׁבְתִּי עָלָיו קֹדֶם, שֶׁעָלָיו אֲנִי רוֹצֶה לְהוֹדוֹת לַה' הַיּוֹם בְּפֵרוּט?</li>
                        <li>כֵּיצַד אוּכַל לַהֲפֹךְ אֶת אֲמִירַת הַ"תּוֹדָה" לְחֵלֶק טִבְעִי יוֹתֵר מֵהַשִׂיחַ שֶׁלִּי עִם הַסּוֹבְבִים אוֹתִי וְעִם בּוֹרֵא עוֹלָם?</li>
                        <li>אִם הָיִיתִי צָרִיךְ לִכְתֹּב "עַל הַנִּסִּים" אִישִׁי עַל חַיַּי, מָה הָיָה הַנֵּס הַמֶּרְכָּזִי שֶׁהָיִיתִי מְצַיֵּן בּוֹ?</li>
                    </ul>

                    <a href="https://forms.gle/A66uubei4XSX6SG2A" target="_blank">לִכְנִיסָה לַהַגְרָלָה לַחֲצוּ כָּאן</a>

                    <div class="contact-info">
                        <p>לְשִׁעוּרִים נוֹסָפִים וּפְרָטִים: הָרַב יְהוּדָה טַאוּב, 📞 0527139520</p>
                    </div>
                </div>
            `;
            sendScore();
        }

        // Start the game
        askName();
        renderWelcomeScreen();

    </script>
</body>
</html>
