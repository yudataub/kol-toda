    const grid = document.getElementById('cardsGrid');

    cards.forEach((c) => {
      const card = document.createElement('div');
      card.className = 'card';

      const pasukHTML  = c.pasuk
        ? `<div class="pasuk">${c.pasuk}</div>` : '';
      const rashiHTML  = c.rashi
        ? `<div class="rashi-box"><strong>📖 רש"י</strong>${c.rashi}</div>` : '';
      const connHTML   = c.connection
        ? `<div class="connection-box"><strong>${c.connection}</strong></div>` : '';

      card.innerHTML = `
        <span class="card-badge">${c.badge}</span>
        <div class="card-img-wrap">
          <span class="emoji-bg">${c.emoji}</span>
          <div class="gradient-overlay"></div>
        </div>
        <div class="card-body">
          <span class="card-tag">${c.tag}</span>
          <div class="card-title">${c.title}</div>
          <div class="card-desc-short">${c.shortDesc}</div>
          <div class="card-desc-full">${c.fullDesc.replace(/\n/g,'<br/>')}${pasukHTML}${rashiHTML}${connHTML}</div>
        </div>
        <div class="card-footer">
          <span class="card-time">${c.time}</span>
          <button class="btn-read-more" onclick="toggleCard(this)">קרא עוד ▾</button>
        </div>
      `;
      grid.appendChild(card);
    });

    function toggleCard(btn) {
      const card = btn.closest('.card');
      const isExpanded = card.classList.toggle('expanded');
      btn.textContent = isExpanded ? 'סגור ▴' : 'קרא עוד ▾';
    }
  </script>
