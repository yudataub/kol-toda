<!DOCTYPE html>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Assistant', 'Noto Sans Hebrew', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 25px;
            padding: 35px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .emoji-header {
            font-size: 5em;
            text-align: center;
            margin-bottom: 15px;
            animation: glow 2s ease infinite;
        }

        @keyframes glow {
            0%, 100% {
                filter: drop-shadow(0 0 10px rgba(251, 191, 36, 0.5));
            }
            50% {
                filter: drop-shadow(0 0 20px rgba(251, 191, 36, 0.8));
            }
        }

        h1 {
            font-size: 2.3em;
            color: #7e22ce;
            text-align: center;
            margin-bottom: 10px;
            line-height: 1.3;
            text-shadow: 2px 2px 4px rgba(126, 34, 206, 0.1);

            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);

            padding: 22px;

            border: 3px solid #f59e0b;
            text-align: center;
            box-shadow: 0 5px 15px rgba(245, 158, 11, 0.2);
        }

        .week-info p {
            font-size: 1.35em;
            color: #92400e;
            font-weight: bold;
            margin: 8px 0;
        }

        .chanukah-special {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            border-radius: 15px;
            padding: 25px;
            margin: 25px 0;
            border: 4px solid #d97706;
            text-align: center;
            box-shadow: 0 8px 20px rgba(251, 191, 36, 0.4);
            animation: pulse 2s ease infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.02);
            }
        }

        .chanukah-special p {
            font-size: 1.4em;
            color: white;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            margin: 8px 0;

            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
        }

        .parasha-button::before {
            content: "📖 ";
            font-size: 1.3em;
            margin-left: 10px;

        .chanukah-button {

            padding: 22px 30px;

            text-align: center;
            border: 3px solid #059669;
            box-shadow: 0 5px 15px rgba(5, 150, 105, 0.2);

        .footer p {
            font-size: 1.3em;
            color: #065f46;
            margin: 10px 0;
            font-weight: 600;

            }

            .chanukah-button, .parasha-button {
                font-size: 1.1em;
                padding: 18px 25px;
            }

                font-size: 1.2em;
            }
        }
