        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(frequencies, durations) {
            let startTime = audioContext.currentTime;
            frequencies.forEach((freq, index) => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = freq;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.3, startTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + durations[index]);
                
                oscillator.start(startTime);
                oscillator.stop(startTime + durations[index]);
                
                startTime += durations[index];
            });
        }

                            "וְאָהַבְתָּ אֵת ה' אֱלֹקֶיךָ בְּכָל לְבָבְךָ 💖",
                            "בָּרוּךְ אַתָּה ה' אֱלֹקֵינוּ מֶלֶךְ הָעוֹלָם 👑",

                        ],

                        explanation: "הַפָּסוּק 'שַׂבְּעֵנוּ בַבֹּקֶר חַסְדֶּךָ' מְלַמֵּד אוֹתָנוּ שֶׁכְּשֶׁנּוֹדֶה, נִשְׂמַח וְנִרְאֶה עוֹד חֶסֶד מֵהַשֵּׁם! 🌟"

        // פונקציות עיקריות
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function renderIntro() {

                        <p>הַמָּשָׁל הַזֶּה יְלַמֵּד אוֹתָנוּ עַל <span class="emoji-large">כֹּחַ הַהוֹדָיָה</span> 🙏 - כַּמָּה חָשׁוּב לְהוֹדוֹת לַשֵּׁם עַל כָּל מַה שֶּׁהוּא נוֹתֵן לָנוּ! 🌈</p>

                        <p>בּוֹאוּ נַתְחִיל בַּמַּסָּע הַמֶּרְתֵּק הַזֶּה! 🚀✨</p>
                    </div>

            `;
        }

        function startGame() {
            currentLesson = 0;
            lessonScore = 0;
            currentQuestion = 0;
            renderLesson();
        }

        function renderLesson() {
            const lesson = lessons[currentLesson];
            const container = document.getElementById('gameContainer');
            
            container.innerHTML = `
                <h1>${lesson.title}</h1>
                <div class="progress-container">
                    <div class="progress-bar" style="width: ${((currentLesson) / lessons.length) * 100}%">
                        שִׁיעוּר ${currentLesson + 1} מִתּוֹךְ ${lessons.length}
                    </div>
                </div>
                <div class="score-display">נִקּוּד כּוֹלֵל: ${totalScore} 🌟 | נִקּוּד שִׁיעוּר: ${lessonScore}/3 ⭐</div>
                <div class="lesson-section">
                    <div class="lesson-content">
                        ${lesson.content}
                    </div>
                    <div class="inspiration-box">
                        <strong>שְׁאֵלָה לְהַשְׁרָאָה:</strong> 💭<br>
                        ${lesson.inspiration}
                    </div>
                </div>
                <button class="btn-primary" onclick="startQuiz()">בּוֹאוּ נַעֲנֶה עַל שְׁאֵלוֹת! 🎯</button>
            `;
        }

        function startQuiz() {
            currentQuestion = 0;
            lessonScore = 0;
            renderQuestion();
        }

        function renderQuestion() {
            const lesson = lessons[currentLesson];
            const question = lesson.questions[currentQuestion];
            const container = document.getElementById('gameContainer');
            
            // ערבוב התשובות
            const shuffledAnswers = question.answers.map((answer, index) => ({
                text: answer,
                isCorrect: index === question.correct
            }));
            const shuffled = shuffleArray(shuffledAnswers);
            
            container.innerHTML = `
                <h1>${lesson.title}</h1>
                <div class="progress-container">
                    <div class="progress-bar" style="width: ${((currentLesson * 3 + currentQuestion) / totalQuestions) * 100}%">
                        שְׁאֵלָה ${currentQuestion + 1} מִתּוֹךְ 3
                    </div>
                </div>
                <div class="score-display">נִקּוּד כּוֹלֵל: ${totalScore} 🌟 | נִקּוּד שִׁיעוּר: ${lessonScore}/3 ⭐</div>
                <div class="question-container">
                    <div class="question-text">${question.q}</div>
                    ${shuffled.map((answer, index) => 
                        `<button class="answer-btn" onclick="checkAnswer(${answer.isCorrect}, ${index})">${answer.text}</button>`
                    ).join('')}
                    <div id="feedback"></div>
                </div>
            `;
        }

        function checkAnswer(isCorrect, buttonIndex) {
            const buttons = document.querySelectorAll('.answer-btn');
            buttons.forEach(btn => btn.disabled = true);
            
            const feedbackDiv = document.getElementById('feedback');
            const lesson = lessons[currentLesson];
            const question = lesson.questions[currentQuestion];
            
            const encouragements = [
                "מְצֻיָּן! ⭐",
                "נִפְלָא! 💪",
                "כָּל הַכָּבוֹד! 🎯",
                "פַּצָּצָה! 🌟",
                "מֻמְחֶה! 💎"
            ];
            
            if (isCorrect) {
                playCorrectSound();
                lessonScore++;
                totalScore += 10;
                
                const randomEncouragement = encouragements[Math.floor(Math.random() * encouragements.length)];
                
                feedbackDiv.innerHTML = `
                    <div class="feedback correct-feedback">
                        <p style="font-size: 1.4em;"><strong>${randomEncouragement}</strong></p>
                        <p>${question.explanation}</p>
                        <p class="highlight">הַשֵּׁם שָׂמֵחַ כְּשֶׁרוֹאֶה אוֹתְךָ לוֹמֵד בְּאַהֲבָה! 💖</p>
                    </div>
                `;
                
                setTimeout(() => {
                    if (currentQuestion < 2) {
                        currentQuestion++;
                        renderQuestion();
                    } else {
                        endLesson();
                    }
                }, 3000);
            } else {
                playWrongSound();
                buttons[buttonIndex].classList.add('shake');
                
                feedbackDiv.innerHTML = `
                    <div class="feedback wrong-feedback">
                        <p style="font-size: 1.3em;"><strong>לֹא בְּדִיּוּק... 🤔</strong></p>
                        <p>${question.explanation}</p>
                        <p class="highlight">גַּם כְּשֶׁטּוֹעִים - לוֹמְדִים! הַשֵּׁם אוֹהֵב אוֹתְךָ! 💡</p>
                    </div>
                `;
                
                setTimeout(() => {
                    if (currentQuestion < 2) {
                        currentQuestion++;
                        renderQuestion();
                    } else {
                        endLesson();
                    }
                }, 3500);
            }
        }

        function endLesson() {
            const container = document.getElementById('gameContainer');
            const percentage = (lessonScore / 3) * 100;
            
            let message, emoji, soundEffect;
            if (lessonScore === 3) {
                message = "מַדְהִים! 🏆 אַתָּה שׁוֹלֵט! אַתָּה חַי בְּאַהֲבַת ה'! 🎉";
                emoji = "🌟⭐✨";
                soundEffect = playVictorySound;
            } else if (lessonScore >= 2) {
                message = "כִּמְעַט מֻשְׁלָם! 💪 מַמָּשׁ כְּמוֹ בְּאַהֲבָה - מַמְשִׁיךְ לִצְמֹחַ! 🌱";
                emoji = "💪🌱";
                soundEffect = playCorrectSound;
            } else {
                message = "בּוֹא נְנַסֶּה שׁוּב, בְּאַהֲבָה וּבְסַבְלָנוּת! 💖";
                emoji = "💝🙏";
                soundEffect = playWrongSound;
            }
            
            soundEffect();
            
            if (percentage >= 66) {
                if (currentLesson < lessons.length - 1) {
                    container.innerHTML = `
                        <h1>סִיּוּם שִׁיעוּר ${currentLesson + 1} 🎊</h1>

                            <h2>${emoji}</h2>

                            <p style="font-size: 1.3em;">נִקּוּד כּוֹלֵל: <strong>${totalScore} נְקֻדּוֹת</strong> 🌟</p>

                    renderFinalCertificate();

                        <h2>💝</h2>
                        <p style="font-size: 1.5em;">${message}</p>
                        <p style="font-size: 1.3em;">הִשַּׂגְתָּ: <strong>${lessonScore} מִתּוֹךְ 3</strong> (${percentage.toFixed(0)}%)</p>
                        <p style="font-size: 1.2em;">צָרִיךְ לְפָחוֹת 2 מִתּוֹךְ 3 כְּדֵי לְהַמְשִׁיךְ (66%) 📊</p>

                            <p>בּוֹא נְנַסֶּה שׁוּב - פַּעַם זוֹ תַּצְלִיחַ! 💪</p>
                        </div>
                    </div>
                    <button class="btn-primary" onclick="startQuiz()">בּוֹא נְנַסֶּה שׁוּב! 🔄</button>
                `;
            }
        }

            currentLesson++;
            renderLesson();

                <div class="thinking-questions">

                    <ul>
                        <li>אֵיךְ אוּכַל לְהָבִיא יוֹתֵר אַהֲבַת ה' לַלִּימּוּד הַבָּא שֶׁלִּי? 📚</li>
                        <li>אֵיזוֹ מִצְוָה אֲנִי רוֹצֶה לְקַיֵּם הַיּוֹם מִתּוֹךְ שִׂמְחָה? ✨</li>

                    <h2>🎁 הִזְדַּמְּנוּת מְיֻחֶדֶת! 🎁</h2>

                    <p style="font-size: 1.3em;"><strong>נִבְנָה בְּאַהֲבָה עַל יְדֵי:</strong> 💝</p>
                    <p style="font-size: 1.2em;">הָרַב יְהוּדָה טָאוּב מִקִּרְיַת אַתָּא 🌟</p>
                    <p style="font-size: 1.2em;">📞 לִפְרָטִים: 0527139520</p>
                    <p style="font-size: 1.1em; margin-top: 15px;">הַשֵּׁם יְבָרֵךְ אוֹתְךָ וְיִשְׁמְרֶךָ! 💖✨</p>
                </div>
            `;

        renderIntro();
