<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>חומש דברים – שיעור 2 הקדמה</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Heebo', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      padding: 40px 20px;
      color: #fff;
    }

    h1.page-title {
      text-align: center;
      font-size: 2.2rem;
      font-weight: 900;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #f9ca24, #f0932b, #eb4d4b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p.page-sub {
      text-align: center;
      color: #a0b4c8;
      margin-bottom: 36px;
      font-size: 1rem;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 18px;
      max-width: 1600px;
      margin: 0 auto;
    }

    @media (max-width: 1400px) { .cards-grid { grid-template-columns: repeat(4, 1fr); } }
    @media (max-width: 1000px) { .cards-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 700px)  { .cards-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 440px)  { .cards-grid { grid-template-columns: 1fr; } }

    .card {
      background: linear-gradient(145deg, #1e2d40, #162032);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
    }

    .card:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 16px 48px rgba(0,0,0,0.6);
      border-color: rgba(249,202,36,0.35);
    }

    .card-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: linear-gradient(135deg, #f9ca24, #f0932b);
      color: #1a1a2e;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
      z-index: 2;
    }

    .card-img-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: linear-gradient(135deg, #0f3460, #533483);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      position: relative;
    }

    .card-img-wrap .emoji-bg {
      font-size: 4rem;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
      transition: transform 0.3s ease;
    }
    .card:hover .emoji-bg { transform: scale(1.15) rotate(5deg); }

    .card-img-wrap .gradient-overlay {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 40%;
      background: linear-gradient(to top, rgba(14,25,40,0.9), transparent);
    }

    .card-body {
      padding: 14px 14px 10px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card-tag {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #f9ca24;
    }

    .card-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: #e8edf2;
      line-height: 1.35;
    }

    .card-desc-short {
      font-size: 0.75rem;
      color: #8a9bb0;
      line-height: 1.5;
    }

    .card-desc-full {
      display: none;
      font-size: 0.75rem;
      color: #a8bbd0;
      line-height: 1.6;
      margin-top: 4px;
      border-top: 1px solid rgba(255,255,255,0.07);
      padding-top: 8px;
    }

    .card-footer {
      padding: 0 14px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-time {
      font-size: 0.68rem;
      color: #5a7a9a;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .card-time::before { content: "⏱"; font-size: 0.7rem; }

    .btn-read-more {
      background: linear-gradient(135deg, #f9ca24, #f0932b);
      color: #1a1a2e;
      border: none;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Heebo', sans-serif;
      transition: opacity 0.2s, transform 0.2s;
      white-space: nowrap;
    }
    .btn-read-more:hover { opacity: 0.85; transform: scale(1.05); }

    .card.expanded .card-desc-full { display: block; }
    .card.expanded .card-img-wrap { aspect-ratio: unset; min-height: 80px; }
  </style>
</head>
<body>

  <h1 class="page-title">📖 חומש דברים – שיעור 2</h1>
  <p class="page-sub">הקדמה לחומש הדברים · מפגש עם המילים הראשונות</p>

  <div class="cards-grid" id="cardsGrid"></div>

  <script>
    const cards = [
      {
        emoji: "👋",
        badge: "פתיחה",
        tag: "ברכה ומבוא",
        title: "שלום תלמידות ותלמידים",
        shortDesc: "פתיחת השיעור בברכה חמה וסקירה על שמות החומש.",
        fullDesc: "המורה פותח בברכת שלום לתלמידים ומזכיר כי אתמול למדו את שני שמות החומש החמישי: 'חומש דברים' ו'משנה תורה'. היום מתחילים ממש לקרוא את המילים הראשונות של החומש.",
        time: "00:00–00:16"
      },
      {
        emoji: "📜",
        badge: "ראשית",
        tag: "פסוקים ראשונים",

        time: "00:16–00:27"
      },
      {
        emoji: "🧩",
        badge: "פעילות",
        tag: "אנשים · מקומות · זמנים",
        title: "מצאו: מי, היכן ומתי?",
        shortDesc: "התלמידים מתבקשים לסמן בפסוקים אנשים, מקומות וזמנים.",
        fullDesc: "המורה מעודד חשיבה פעילה: בתוך הפסוקים הראשונים של חומש דברים ישנן מילים המתייחסות לאנשים, מקומות וזמנים. אפשר לצבוע, לסמן, או לחשוב על כך בראש – ואז לבדוק אם חשבתם אותו דבר.",
        time: "00:27–01:10"
      },
      {
        emoji: "🧑‍🏫",
        badge: "אנשים",
        tag: "מי מדבר ולמי?",

        time: "01:10–02:04"
      },
      {
        emoji: "🗺️",
        badge: "מקומות",
        tag: "עבר הירדן",

        time: "02:18–02:59"
      },
      {
        emoji: "📅",
        badge: "זמן",
        tag: "שנה 40 לחודש 11",

        shortDesc: "שנה 40 ליציאת מצרים, חודש 11 (שבט), ב-1 לחודש.",
        fullDesc: "נאום משה מתקיים בשנה ה-40 ליציאת מצרים, בחודש ה-12 בלשון התורה שהוא חודש ה-11 (שבט), ב-1 לחודש. זהו כחודש לפני מותו של משה (שמת בז' באדר) – כלומר, אנחנו בחודש האחרון של חייו.",
        time: "02:59–04:03"
      },
      {
        emoji: "🔄",
        badge: "מעבר",
        tag: "בין הדורות",
        title: "זמן מעבר – מדור המדבר לדור הכיבוש",
        shortDesc: "משה מינה את יהושע אך עדיין חי. מעבר בין שני דורות.",

        time: "04:03–04:30"
      },
      {
        emoji: "⚔️",
        badge: "עתיד",

        time: "05:06–05:35"
      },
      {
        emoji: "🎁",
        badge: "מתנה",
        tag: "מה משה מוריש?",
        title: "המתנה הגדולה – הדברים",
        shortDesc: "כמו אב הנפרד מילדו – הוא מניח בליבו דברי מוסר ולקח.",
        fullDesc: "תחשבו על אב הנפרד מילדו לזמן ארוך – מה המתנה הכי גדולה שהוא יכול לתת? דברים. דברי מוסר ולקח שישארו בלב הילד. כך משה מניח על לב כל אחד מבני ישראל את 'הדברים' – שילוו אותם גם אחרי מותו.",
        time: "05:49–06:28"
      },
      {
        emoji: "💛",
        badge: "מסר",
        tag: "ירושת הדברים",
        title: "משהו ממשה עובר איתם",
        shortDesc: "משה לא יעבור את הירדן, אך הדברים שלו כן יעברו.",
        fullDesc: "משה לא יעבור את הירדן אל ארץ ישראל – אבל משהו ממנו כן עובר: הדברים. הדברים שהוא אמר לבני ישראל ישארו בליבם לזמן ארוך ורחוק, גם אחרי מותו. זוהי המתנה הגדולה שמניח משה לעם.",
        time: "06:17–06:37"
      },
      {
        emoji: "📚",
        badge: "הבא",
        tag: "המשך הלימוד",
        title: "מה בדיוק יהיו הדברים?",
        shortDesc: "הסיום פותח סקרנות – מה תוכן הדברים שיאמר משה?",
        fullDesc: "בסיום השיעור המורה שואל: ומה עם הדברים בדיוק – מה הם יהיו? את זה נתחיל ללמוד בשיעור הבא. הסיום פתוח ומזמין המשך.",
        time: "06:37–06:40"
      },
      {
        emoji: "🌟",
        badge: "סיכום",
        tag: "מה למדנו",
        title: "סיכום – הקדמה לחומש דברים",
        shortDesc: "משה · בני ישראל · עבר הירדן · שנה 40 · מעבר דורות.",
        fullDesc: "• מי: משה מדבר אל כל ישראל (הדור החדש)\n• היכן: עבר הירדן המזרחי, על הגבול לארץ ישראל\n• מתי: שנה 40 ליציאת מצרים, חודש 11, 1 לחודש\n• למה: לצייד את בני ישראל בכוח רוחני לפני הכניסה\n• מה: הדברים – מתנת משה לדורות",
        time: "00:00–06:40"
      }
    ];

    const grid = document.getElementById('cardsGrid');

    cards.forEach((c, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <span class="card-badge">${c.badge}</span>
        <div class="card-img-wrap">
          <span class="emoji-bg">${c.emoji}</span>
          <div class="gradient-overlay"></div>
        </div>
        <div class="card-body">
          <span class="card-tag">${c.tag}</span>
          <div class="card-title">${c.title}</div>
          <div class="card-desc-short">${c.shortDesc}</div>
          <div class="card-desc-full">${c.fullDesc.replace(/\n/g,'<br/>')}</div>
        </div>
        <div class="card-footer">
          <span class="card-time">${c.time}</span>
          <button class="btn-read-more" onclick="toggleCard(this)">קרא עוד ▾</button>
        </div>
      `;
      grid.appendChild(card);
    });

    function toggleCard(btn) {
      const card = btn.closest('.card');
      const isExpanded = card.classList.toggle('expanded');
      btn.textContent = isExpanded ? 'סגור ▴' : 'קרא עוד ▾';
    }
  </script>
</body>
</html>
