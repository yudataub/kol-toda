
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7 רעיונות חווייתיים — דברים א׳ | תוכחה, רמז וזמן הנכון</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0f1117;
    --surface:   #1a1d27;
    --surface2:  #22263a;
    --border:    #2e3348;
    --accent:    #f5a623;
    --accent2:   #e05c34;
    --gold:      #d4a843;
    --text:      #e8eaf0;
    --muted:     #8890a8;
    --radius:    16px;
    --shadow:    0 8px 32px rgba(0,0,0,0.45);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Heebo', Arial, sans-serif;
    direction: rtl;
    min-height: 100vh;
    padding: 48px 24px 80px;
  }

  /* ── HEADER ── */
  .page-header {
    text-align: center;
    margin-bottom: 56px;
  }
  .page-header .eyebrow {
    display: inline-block;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 6px 18px;
    border-radius: 100px;
    margin-bottom: 16px;
  }
  .page-header h1 {
    font-size: clamp(26px, 4vw, 42px);
    font-weight: 900;
    line-height: 1.2;
    background: linear-gradient(135deg, #fff 40%, var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
  }
  .page-header p {
    color: var(--muted);
    font-size: 15px;
    max-width: 560px;
    margin: 0 auto;
    line-height: 1.7;
  }

  /* ── GRID ── */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px;
    max-width: 1400px;
    margin: 0 auto;
  }

  /* ── CARD ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    cursor: default;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow);
    border-color: var(--accent);
  }

  /* ── CARD IMAGE / EMOJI BANNER ── */
  .card-image {
    width: 100%;
    aspect-ratio: 16/9;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 72px;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }
  .card-image::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.55));
  }

  /* per-card gradient backgrounds */
  .card:nth-child(1) .card-image { background: linear-gradient(135deg, #1a0a2e, #3b1f6a); }
  .card:nth-child(2) .card-image { background: linear-gradient(135deg, #0a1a2e, #1f3b6a); }
  .card:nth-child(3) .card-image { background: linear-gradient(135deg, #1a2a0a, #3b6a1f); }
  .card:nth-child(4) .card-image { background: linear-gradient(135deg, #2a1a0a, #6a3b1f); }
  .card:nth-child(5) .card-image { background: linear-gradient(135deg, #0a2a2a, #1f6a6a); }
  .card:nth-child(6) .card-image { background: linear-gradient(135deg, #2a0a1a, #6a1f3b); }
  .card:nth-child(7) .card-image { background: linear-gradient(135deg, #1a1a0a, #4a4a1f); }

  /* ── BADGE overlaid on image ── */
  .rank-badge {
    position: absolute;
    top: 12px;
    right: 12px;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    z-index: 2;
    letter-spacing: 0.5px;
  }
  .stars-badge {
    position: absolute;
    bottom: 10px;
    left: 10px;
    font-size: 13px;
    z-index: 2;
    letter-spacing: -1px;
  }

  /* ── CARD BODY ── */
  .card-body {
    padding: 20px 18px 0;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .method-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 10px;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    width: fit-content;
    letter-spacing: 0.3px;
  }

  .card-title {
    font-size: 17px;
    font-weight: 800;
    color: #fff;
    line-height: 1.35;
  }

  .card-desc {
    font-size: 13.5px;
    color: var(--muted);
    line-height: 1.7;
  }

  /* ── META ROW ── */
  .meta-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    padding-top: 2px;
  }
  .meta-pill {
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--surface2);
    border-radius: 6px;
    padding: 3px 9px;
    font-size: 11px;
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .meta-pill.accent { border-color: var(--accent); color: var(--accent); }

  /* ── SENTENCE ── */
  .sentence-box {
    background: linear-gradient(135deg, rgba(245,166,35,0.08), rgba(224,92,52,0.06));
    border: 1px solid rgba(245,166,35,0.2);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 600;
    color: var(--gold);
    line-height: 1.5;
  }
  .sentence-box::before {
    content: '🧠 ';
  }

  /* ── EXPAND AREA ── */
  .expand-content {
    display: none;
    flex-direction: column;
    gap: 10px;
    padding-top: 4px;
  }
  .expand-content.open { display: flex; }

  .expand-section {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .expand-section h4 {
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .expand-section p {
    font-size: 13px;
    color: var(--text);
    line-height: 1.7;
  }

  /* ── CARD FOOTER / BUTTON ── */
  .card-footer {
    padding: 14px 18px 18px;
    margin-top: auto;
  }
  .btn-expand {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 0;
    color: var(--text);
    font-family: 'Heebo', Arial, sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: background 0.2s, border-color 0.2s, color 0.2s;
  }
  .btn-expand:hover {
    background: rgba(245,166,35,0.1);
    border-color: var(--accent);
    color: var(--accent);
  }
  .btn-expand .arrow {
    display: inline-block;
    transition: transform 0.25s ease;
    font-style: normal;
  }
  .btn-expand.open .arrow { transform: rotate(180deg); }

  /* ── TOP BAR ── */
  .top-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 1400px;
    margin: 0 auto 24px;
  }
  .top-label span {
    font-size: 13px;
    color: var(--muted);
  }
  .count-badge {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 14px;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
  }

  /* ── DIVIDER ── */
  .card-divider {
    height: 1px;
    background: var(--border);
    margin: 0 18px;
  }
</style>
</head>
<body>

<header class="page-header">
  <div class="eyebrow">חינוך יהודי חווייתי</div>
  <h1>7 רעיונות חווייתיים<br>לדברים א׳ — תוכחה, רמז וזמן הנכון</h1>
  <p>ממוינים מהחזק לחלש לפי עוצמת החוויה הרגשית · כיתות ד׳-ו׳ · שיעור 45 דקות</p>
</header>

<div class="top-label">
  <span>מיון: עוצמת חוויה ↓</span>
  <span class="count-badge">7 רעיונות</span>
</div>

<div class="cards-grid" id="grid"></div>

<script>

    heartmoment: "׳כשמישהו בוחר לומר לך משהו קשה — זה דווקא אומר שהוא אוהב אותך.׳"
  },
  {
    rank: 4,
    emoji: "🔨",
    method: "🔨 שיטת הבנייה",
    stars: "⭐⭐⭐⭐",
    title: "איך אומרים בלי לפגוע?",
    desc: "דף עם 3 עמודות: מה רוצים להגיד / איך אפשר לפגוע / איך אפשר לרמוז. ממלאים עם מצב אמיתי מחיי הכיתה.",

    gear: "דף + עט לכל ילד",
    sentence: "לפעמים לרמוז — חזק יותר מלצעוק.",
    why: "הילד בונה בעצמו את כלי התוכחה — ומבין מבפנים מדוע משה בחר בדרך הרמז. החוכמה הופכת לכלי חיים אישי.",

    heartmoment: "׳עכשיו אתם יודעים מה שמשה ידע — שלפעמים רמז מגיע ללב יותר עמוק מצעקה.׳"
  },
  {
    rank: 5,
    emoji: "🏆",
    method: "🏆 שיטת התחרות",
    stars: "⭐⭐⭐⭐",

    desc: "הכיתה מתחלקת: ׳עדיף לתוכח ישירות׳ מול ׳עדיף לרמוז׳. ויכוח חי 3 דקות. רש״י מגיע כ׳פסיקת השופט׳.",

    gear: "בלי ציוד",
    sentence: "כשמוכיחים — צריך לחשוב על כבוד השני יותר מאשר על הצדקת עצמנו.",
    why: "הילדים מגנים על עמדה לפני שהם שומעים את רש״י — כך כשרש״י מגיע הוא תשובה לדיון שהם ניהלו, לא שיעור מלמעלה.",
    howto: "חצי כיתה: ׳צריך להגיד ישירות: חטאתם!׳. חצי: ׳עדיף לרמוז.׳ כל צד מנמק 2 דקות. ויכוח. ואז קוראים רש״י כשופט.",
    heartmoment: "׳מה הייתם מעדיפים לשמוע אם מישהו רוצה להגיד לכם משהו קשה?׳"
  },
  {
    rank: 6,
    emoji: "💃",
    method: "💃 שיטת השמחה",
    stars: "⭐⭐⭐",
    title: "משחק הזמנים",
    desc: "המורה קורא 4 מצבים בקצב. הכיתה מגיבה בגוף: יד למעלה = ׳מוכן לשמוע ביקורת׳, ניד ראש = ׳לא עכשיו.׳",
    time: "6-8 דקות",
    gear: "בלי ציוד",
    sentence: "לא רק מה אומרים — מתי אומרים זה הכל.",
    why: "תנועת גוף + קצב הופכים את הרעיון הפילוסופי של ׳תזמון תוכחה׳ לחוויה אינסטינקטיבית. הגוף מבין לפני השכל.",
    howto: "קוראים: א. אחרי הפסד במשחק. ב. לפני ארוחת ערב כשעייפים. ג. כשרגועים ושמחים. ד. כשנפרדים ממישהו. כולם מגיבים. ואז: ׳משה בחר ד׳.׳",

  },
  {
    rank: 7,
    emoji: "✉️",
    method: "🔨 שיטת הבנייה",
    stars: "⭐⭐⭐",
    title: "מכתב רמז",
    desc: "כל ילד כותב מכתב רמז לחבר/לאח — במקום ׳אתה לא נחמד׳ כותב ׳כשהייתי בסיטואציה X הרגשתי Y.׳",
    time: "8-10 דקות",
    gear: "דף + עט",
    sentence: "רמז טוב — מגיע ללב יותר עמוק מצעקה.",
    why: "הילד מתרגל את כלי הרמז בחייו שלו — ולוקח הביתה לא רק ידע על משה, אלא מיומנות חיים אמיתית.",
    howto: "מסבירים: ׳לכתוב רגש, לא האשמה.׳ כותבים. שיתוף מרצון. המורה מסכם: ׳זו אומנות התוכחה של משה רבנו — שאתם עכשיו יודעים לעשות.׳",
    heartmoment: "׳מה הרגשתם כשכתבתם? קשה לכתוב ככה — ולכן משה בחר בדרך הזו.׳"
  }
];

const grid = document.getElementById('grid');

ideas.forEach((idea, i) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-image">
      <span class="rank-badge">#${idea.rank} בדירוג</span>
      <span style="position:relative;z-index:1;font-size:64px">${idea.emoji}</span>
      <span class="stars-badge">${idea.stars}</span>
    </div>

    <div class="card-body">
      <span class="method-tag">${idea.method}</span>
      <h2 class="card-title">${idea.title}</h2>
      <p class="card-desc">${idea.desc}</p>

      <div class="meta-row">
        <span class="meta-pill">⏱️ ${idea.time}</span>
        <span class="meta-pill accent">🧰 ${idea.gear}</span>
      </div>

      <div class="sentence-box">${idea.sentence}</div>

      <div class="expand-content" id="expand-${i}">
        <div class="expand-section">
          <h4>⚡ למה זה עובד</h4>
          <p>${idea.why}</p>
        </div>
        <div class="expand-section">
          <h4>📋 איך מבצעים</h4>
          <p>${idea.howto}</p>
        </div>
        <div class="expand-section">
          <h4>💛 רגע הלב</h4>
          <p>${idea.heartmoment}</p>
        </div>
      </div>
    </div>

    <div class="card-divider"></div>
    <div class="card-footer">
      <button class="btn-expand" data-target="expand-${i}">
        <span>קרא עוד</span>
        <i class="arrow">▾</i>
      </button>
    </div>
  `;
  grid.appendChild(card);
});

// Toggle logic
document.querySelectorAll('.btn-expand').forEach(btn => {
  btn.addEventListener('click', () => {
    const targetId = btn.getAttribute('data-target');
    const content = document.getElementById(targetId);
    const isOpen = content.classList.contains('open');
    content.classList.toggle('open');
    btn.classList.toggle('open');
    btn.querySelector('span').textContent = isOpen ? 'קרא עוד' : 'סגור';
  });
});
</script>
</body>
</html>
