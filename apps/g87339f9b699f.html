        // פונקציות צליל
        function playTone(frequency, duration, delay = 0) {
            setTimeout(() => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = frequency;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + duration);
            }, delay);
        }
        
        function playCorrectSound() {
            playTone(523.25, 0.2, 0);    // C5
            playTone(659.25, 0.2, 200);  // E5
            playTone(783.99, 0.3, 400);  // G5

                        explanation: "פַּצְצָה! 🎯 זֶה בְּדִיּוּק הַהֶבְדֵּל! <strong>חֶסֶד שֶׁל אַהֲבָה</strong> נוֹבֵעַ מִ<strong>מָּנוֹעַ פְּנִימִי חָזָק</strong> (כְּמוֹ אַבְרָהָם), עִם שִׂמְחָה וְזְרִיזוּת! 🏃‍♂️💖 <strong>חֶסֶד שֶׁל הֶרְגֵּל</strong> הוּא <strong>חִיצוֹנִי</strong> (כְּמוֹ לוֹט), נַעֲשֶׂה כִּי 'צָּרִיךְ'. 📝 כְּשֶׁעוֹשִׂים מֵאַהֲבָה - זֶה מְקָרֵב לַשֵּׁם וּמְמַלֵּא אוֹתָנוּ בְּשִׂמְחָה! 🌟 הַשֵּׁם שָׂמֵחַ מֵאִתְּךָ! 🎉"
                    }
                ]
            }
        ];
        
        // פונקציית ערבוב מערך
        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }
        
        // שאלת שם
        function askUserName() {
            const name = prompt("אֵיזֶה שֵׁם נִרְשֹׁם לְךָ בִּתְעוּדָה? 💫");
            userName = name && name.trim() ? name.trim() : "תַּלְמִיד יָקָר";
        }
        
        // שליחת נתונים
        async function sendScoreToTeacher() {
            const now = new Date();
            const data = {
                name: userName,
                score: `${score}/12`,
                percentage: `${Math.round((score/12)*100)}%`,
                gameName: document.title,
                date: now.toLocaleDateString('he-IL'),
                time: now.toLocaleTimeString('he-IL')
            };
            
            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'text/plain'},
                    body: JSON.stringify(data)
                });
                console.log('✅ הַנְּתוּנִים נִשְׁלְחוּ בְּהַצְלָחָה!');
            } catch (error) {
                console.error('❌ שְׁגִיאָה בְּשִׁלּוּחַ:', error);
            }
        }
        
        // מסך פתיחה
        function renderIntro() {
            document.getElementById('gameContainer').innerHTML = `
                <h1>🌟 חֶסֶד שֶׁל אֱמֶת - אַבְרָהָם וְלוֹט 💖</h1>
                <div class="intro-text">
                    <p>שָׁלוֹם חֲבֵרִים יְקָרִים! 💫✨</p>
                    <p>הַיּוֹם נִלְמַד מַשֶּׁהוּ מְיֻחָד וְנִפְלָא - <span class="highlight">אֵיךְ לַעֲשׂוֹת חֶסֶד מֵאַהֲבָה</span>! 💖</p>
                    <p>נִכִּיר שְׁתֵּי דְּמֻיּוֹת: <strong>אַבְרָהָם אָבִינוּ</strong> שֶׁהָיָה 'אוֹהֵב חֶסֶד', וְאֶת <strong>לוֹט אָחִיָינוֹ</strong> שֶׁגַּם הוּא עָשָׂה חֶסֶד, אֲבָל... אַחֶרֶת. 🤔</p>
                    <p>מָה הַהֶבְדֵּל בֵּינֵיהֶם? אֵיךְ אֶפְשָׁר לַעֲשׂוֹת חֶסֶד שֶׁהַשֵּׁם באֱמֶת אוֹהֵב? 🌈</p>
                    <p>בּוֹאוּ נִלְמַד וְנִגְלֶה יַחַד! 🎯💕</p>
                    <p style="font-size: 1.3em; margin-top: 30px;"><strong>זִכְרוּ:</strong> הַשֵּׁם אוֹהֵב אוֹתְכֶם וְשָׂמֵחַ שֶׁאַתֶּם לוֹמְדִים! 🙏✨</p>
                </div>
                <button class="action-btn" onclick="startGame()">בּוֹאוּ נַתְחִיל! 🚀</button>
            `;
        }
        
        // התחלת משחק
        function startGame() {
            askUserName();
            currentLesson = 0;
            renderLesson(0);
        }
        
        // הצגת שיעור
        function renderLesson(index) {
            currentQuestionIndex = 0;
            lessonScore = 0;
            
            const lesson = lessons[index];
            const progress = Math.round(((index) / lessons.length) * 100);
            
            document.getElementById('gameContainer').innerHTML = `
                <div class="progress-container">
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${progress}%">${progress}%</div>
                    </div>
                    <div class="score-display">נִקּוּד: ${score}/12 ⭐</div>
                </div>
                
                <h2>${lesson.title}</h2>
                <div class="lesson-content">${lesson.content}</div>
                
                <div id="questionArea"></div>
            `;
            
            showQuestion(0);
        }
        
        // הצגת שאלה
        function showQuestion(qIndex) {
            const lesson = lessons[currentLesson];
            const question = lesson.questions[qIndex];
            const shuffledAnswers = shuffleArray(question.answers.map((a, i) => ({text: a, index: i})));
            
            const questionArea = document.getElementById('questionArea');
            questionArea.innerHTML = `
                <div class="question">${question.q}</div>
                <div class="answers" id="answers">
                    ${shuffledAnswers.map((answer, i) => `
                        <button class="answer-btn" onclick="checkAnswer(${qIndex}, ${answer.index})" id="answer${i}">
                            ${answer.text}
                        </button>
                    `).join('')}
                </div>
                <div id="feedback"></div>
            `;
        }
        
        // בדיקת תשובה
        function checkAnswer(qIndex, selectedIndex) {
            const lesson = lessons[currentLesson];
            const question = lesson.questions[qIndex];
            const isCorrect = selectedIndex === question.correct;
            
            // נעילת כפתורים
            const buttons = document.querySelectorAll('.answer-btn');
            buttons.forEach(btn => btn.disabled = true);
            
            // סימון התשובה
            buttons.forEach(btn => {
                if (btn.textContent.includes(question.answers[selectedIndex])) {
                    btn.classList.add(isCorrect ? 'correct' : 'wrong');
                }
                if (!isCorrect && btn.textContent.includes(question.answers[question.correct])) {
                    btn.classList.add('correct');
                }
            });
            
            // משוב
            const encouragements = ["מְצֻיָּן! ⭐", "נִפְלָא! 💪", "כָּל הַכָּבוֹד! 🎯", "פַּצְצָה! 🏆", "מְעֻלֶּה! 🌟"];
            const randomEncouragement = encouragements[Math.floor(Math.random() * encouragements.length)];
            
            const feedbackDiv = document.getElementById('feedback');
            if (isCorrect) {
                playCorrectSound();
                score++;
                lessonScore++;
                feedbackDiv.className = 'feedback correct';
                feedbackDiv.innerHTML = `
                    <p><strong>${randomEncouragement}</strong></p>
                    <p>${question.explanation}</p>
                    <p><strong>הַשֵּׁם שָׂמֵחַ מֵאִתְּךָ וְאוֹהֵב אוֹתְךָ! 💖</strong></p>
                `;
            } else {
                feedbackDiv.className = 'feedback wrong';
                feedbackDiv.innerHTML = `
                    <p><strong>לֹא בְּדִיּוּק... 🤔</strong></p>
                    <p>${question.explanation}</p>
                    <p><strong>גַּם כְּשֶׁטּוֹעִים - לוֹמְדִים! הַשֵּׁם אוֹהֵב אוֹתְךָ! 💡</strong></p>
                `;
            }
            
            // כפתור המשך
            setTimeout(() => {
                feedbackDiv.innerHTML += `
                    <button class="action-btn" onclick="nextQuestion()">הַמְשֵׁךְ ➡️</button>
                `;
            }, 1000);
        }
        
        // שאלה הבאה
        function nextQuestion() {
            const lesson = lessons[currentLesson];
            currentQuestionIndex++;
            
            if (currentQuestionIndex < lesson.questions.length) {
                showQuestion(currentQuestionIndex);
            } else {
                endLesson();
            }
        }
        
        // סיום שיעור
        function endLesson() {
            const passed = lessonScore >= 2;
            
            if (passed) {
                playVictorySound();
                const messages = [
                    "מַדְהִים! 🏆 אַתָּה שׁוֹלֵט! אַתָּה חַי בְּאַהֲבַת ה'! 🎉",
                    "כִּמְעַט מוּשְׁלָם! 💪 מַמָּשׁ כְּמוֹ בְּאַהֲבָה - מַמְשִׁיךְ לִצְמֹחַ! 🌱"
                ];
                const message = lessonScore === 3 ? messages[0] : messages[1];
                
                document.getElementById('questionArea').innerHTML = `
                    <div class="feedback correct">
                        <h2>${message}</h2>
                        <p style="font-size: 1.3em; margin: 20px 0;">צִיּוּן שִׁיעוּר: ${lessonScore}/3 ⭐</p>
                        <button class="action-btn" onclick="nextLesson()">
                            ${currentLesson < lessons.length - 1 ? 'לְשִׁיעוּר הַבָּא 🚀' : 'לְסִיּוּם הַמִּשְׂחָק 🎓'}
                        </button>
                    </div>
                `;
            } else {
                document.getElementById('questionArea').innerHTML = `
                    <div class="feedback wrong">
                        <h2>בּוֹא נְנַסֶּה שׁוּב 💪</h2>
                        <p>בְּאַהֲבָה וּבְסַבְלָנוּת - נִלְמַד עוֹד פַּעַם! 💖</p>
                        <p style="font-size: 1.3em; margin: 20px 0;">צִיּוּן שִׁיעוּר: ${lessonScore}/3</p>
                        <button class="action-btn" onclick="renderLesson(${currentLesson})">נְנַסֶּה שׁוּב 🔄</button>
                    </div>
                `;
            }
        }
        
        // שיעור הבא
        function nextLesson() {
            currentLesson++;
            if (currentLesson < lessons.length) {
                renderLesson(currentLesson);
            } else {
                showCertificate();
            }
        }
        
        // תעודה וסיום
        function showCertificate() {
            playVictorySound();
            const percentage = Math.round((score / 12) * 100);
            
            document.getElementById('gameContainer').innerHTML = `
                <div class="certificate">
                    <h2>🏆 תְּעוּדַת הִצְטַיְּנוּת 🏆</h2>
                    <p style="font-size: 1.5em;">מְאֻשֶּׁרֶת בְּזֹאת כִּי</p>
                    <div class="name">${userName} 💫</div>
                    <p style="font-size: 1.3em;">סִיֵּם/הִ בְּהַצְלָחָה אֶת הַלִּמּוּד עַל</p>
                    <p style="font-size: 1.5em; font-weight: bold; color: #c2185b;">חֶסֶד שֶׁל אֱמֶת 💖</p>
                    <p style="font-size: 2em; margin: 20px 0;">צִיּוּן סוֹפִי: ${score}/12 (${percentage}%) ⭐</p>
                    <div class="verse">
                        "וְאָהַבְתָּ אֶת ה' אֱלֹקֶיךָ בְּכָל לְבָבְךָ וּבְכָל נַפְשְׁךָ וּבְכָל מְאֹדֶךָ" 💕
                    </div>
                </div>
                
                <div class="reflection-questions">
                    <h3>💭 שְׁאֵלוֹת לְמַחְשָׁבָה:</h3>
                    <ul>
                        <li>אֵיךְ אוּכַל לְהָבִיא יוֹתֵר אַהֲבַת ה' לַלִּמּוּד הַבָּא שֶׁלִּי?</li>
                        <li>אֵיזוֹ מִצְוָה אֲנִי רוֹצֶה לְקַיֵּם הַיּוֹם מִתּוֹךְ שִׂמְחָה?</li>
                        <li>אֵיךְ אֲנִי יָכוֹל לִהְיוֹת יוֹתֵר כְּמוֹ אַבְרָהָם - לְחַפֵּשׂ הַזְדַּמְּנוּיּוֹת לַעֲזֹר?</li>
                    </ul>
                </div>
                
                <div style="text-align: center; margin: 30px 0;">
                    <p style="font-size: 1.4em; margin-bottom: 15px;">🎁 <strong>כָּל הַכָּבוֹד! זָכִיתָ לְהִכָּנֵס לְהַגְרָלָה נוֹשֵׂאת פְּרָסִים!</strong> 🎁</p>
                    <a href="https://forms.gle/A66uubei4XSX6SG2A" target="_blank" class="lottery-link">
                        לַהַגְרָלָה! 🎉
                    </a>
                </div>
                
                <div class="contact-info">
                    <p style="font-size: 1.3em; margin-bottom: 10px;"><strong>נִבְנָה בְּאַהֲבָה עַל יְדֵי:</strong></p>
                    <p style="font-size: 1.2em;">הָרַב יְהוּדָה טָאוּב מִקִּרְיַת אַתָּא 💚</p>
                    <p style="font-size: 1.2em;">📞 לִפְרָטִים: 0527139520</p>
                </div>
            `;
            
            // שליחה אוטומטית של נתונים
            sendScoreToTeacher();
        }
        
        // התחלה
        renderIntro();
    </script>
</body>
</html>
