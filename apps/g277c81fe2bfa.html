        // Web Audio API - יצירת הקשר רק אחרי אינטראקציה ראשונה
        let audioContext = null;
        
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        
        // משתנים גלובליים
        let userName = "";

        let score = 0;

        let answeredQuestions = 0;
        
        // פונקציה להשמעת צליל
        function playTone(frequency, duration) {
            initAudio();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = frequency;
            oscillator.type = "sine";
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + duration);
        }
        
        // צליל הצלחה (3 תווים)
        function playSuccessSound() {
            playTone(523.25, 0.2); // C5
            setTimeout(() => playTone(659.25, 0.2), 200); // E5
            setTimeout(() => playTone(783.99, 0.3), 400); // G5
        }

            notes.forEach((note, i) => {
                setTimeout(() => playTone(note, durations[i]), i * 150);
            });
        }
        
        // ערבוב מערך
        function shuffleArray(arr) {
            const shuffled = [...arr];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];

            return shuffled;

                    <div class="lesson-title">${lesson.title}</div>
                    <div class="lesson-content">${lesson.content}</div>
                    <button class="btn-primary" onclick="renderQuestions()">בּוֹא נַעֲנֶה עַל שְׁאֵלוֹת! 🎯</button>
                </div>
            `;
        }
        
        // הצגת שאלות
        function renderQuestions() {
            const lesson = lessons[currentLesson];
            const container = document.getElementById("gameContainer");
            
            const progressPercent = ((currentLesson + 0.5) / lessons.length) * 100;
            
            let questionsHTML = "";
            lesson.questions.forEach((q, index) => {
                const shuffledAnswers = shuffleArray(q.answers.map((ans, i) => ({text: ans, index: i})));
                
                questionsHTML += `
                    <div class="question-section" id="question${index}">
                        <div class="question-text">שְׁאֵלָה ${index + 1}: ${q.question}</div>
                        <div class="answers-grid" id="answers${index}">
                            ${shuffledAnswers.map(ans => `
                                <button class="answer-btn" onclick="checkAnswer(${index}, ${ans.index})">
                                    ${ans.text}
                                </button>
                            `).join("")}
                        </div>
                        <div id="feedback${index}"></div>
                    </div>
                `;
            });
            
            container.innerHTML = `
                <h1>כֹּה תֹאמַר לְבֵית יַעֲקֹב 💖</h1>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${progressPercent}%">
                        ${Math.round(progressPercent)}%
                    </div>
                </div>
                <div class="score-display">נִקּוּד: ${score} / 12 ⭐ | שִׁיעוּר ${currentLesson + 1} / ${lessons.length}</div>
                ${questionsHTML}
            `;
        }
        
        // בדיקת תשובה
        function checkAnswer(questionIndex, selectedAnswer) {
            const lesson = lessons[currentLesson];
            const question = lesson.questions[questionIndex];
            const feedbackDiv = document.getElementById(`feedback${questionIndex}`);
            const answersDiv = document.getElementById(`answers${questionIndex}`);
            
            // נטרול כפתורים
            const buttons = answersDiv.querySelectorAll("button");
            buttons.forEach(btn => btn.disabled = true);
            
            answeredQuestions++;
            
            const encouragements = [
                `מְצֻיָּן, ${userName}!`,
                `כָּל הַכָּבוֹד, ${userName}!`,
                `נִפְלָא, ${userName}!`,
                `פַּצְצָה, ${userName}!`,
                `מֻמְחֶה, ${userName}!`
            ];
            
            if (selectedAnswer === question.correct) {
                currentLessonScore++;
                score++;
                playSuccessSound();
                
                const randomEncouragement = encouragements[Math.floor(Math.random() * encouragements.length)];
                
                feedbackDiv.innerHTML = `
                    <div class="feedback correct">
                        <strong>${randomEncouragement} ⭐</strong><br>
                        ${question.explanation}<br>
                        <em>הַשֵּׁם שָׂמֵחַ כְּשֶׁרוֹאֶה אֶת אַהֲבָתוֹ בְּלִבְּךָ, ${userName}! 💖</em>
                    </div>
                `;
            } else {
                feedbackDiv.innerHTML = `
                    <div class="feedback incorrect">
                        <strong>לֹא בְּדִיּוּק, ${userName}... 🤔</strong><br>
                        ${question.explanation}<br>
                        <em>נַסֶּה שׁוּב, ${userName} - גַּם כְּשֶׁטּוֹעִים, אֲנַחְנוּ לוֹמְדִים! הַשֵּׁם אוֹהֵב אוֹתְךָ! 💡</em>
                    </div>
                `;
            }
            
            // אם ענו על כל השאלות
            if (answeredQuestions === lesson.questions.length) {
                setTimeout(() => {
                    showLessonResult();
                }, 2000);
            }
        }
        
        // הצגת תוצאות שיעור
        function showLessonResult() {
            const container = document.getElementById("gameContainer");
            const lesson = lessons[currentLesson];
            
            const progressPercent = ((currentLesson + 1) / lessons.length) * 100;
            
            let resultMessage = "";
            let canContinue = false;
            
            if (currentLessonScore === 3) {
                playPerfectSound();
                resultMessage = `
                    <div class="feedback correct">
                        <h2>מַדְהִים, ${userName}! 🏆</h2>
                        <p>עָנִיתָ נָכוֹן עַל כָּל הַשְּׁאֵלוֹת! אַתָּה שׁוֹלֵט! 💪</p>
                        <p class="highlight">אַתָּה חַי בְּאַהֲבַת הַשֵּׁם! 💖</p>
                    </div>
                `;
                canContinue = true;
            } else if (currentLessonScore >= 2) {
                playPerfectSound();
                resultMessage = `
                    <div class="feedback correct">
                        <h2>כִּמְעַט מוּשְׁלָם, ${userName}! 💪</h2>
                        <p>עָנִיתָ נָכוֹן עַל ${currentLessonScore} מִתּוֹךְ 3!</p>
                        <p class="highlight">מַמָּשׁ כְּמוֹ בְּאַהֲבָה - מַמְשִׁיךְ לִצְמֹחַ! 🌱</p>
                    </div>
                `;
                canContinue = true;
            } else {
                resultMessage = `
                    <div class="feedback incorrect">
                        <h2>בּוֹא נְנַסֶּה שׁוּב, ${userName} 💪</h2>
                        <p>עָנִיתָ נָכוֹן עַל ${currentLessonScore} בִּלְבַד.</p>
                        <p>צָרִיךְ לְפָחוֹת 2 נְכוֹנוֹת כְּדֵי לְהַמְשִׁיךְ.</p>
                        <p class="highlight">בְּאַהֲבָה וּבְסַבְלָנוּת - נַצְלִיחַ! 💖</p>
                    </div>
                `;
            }
            
            let buttonHTML = "";
            if (canContinue) {
                if (currentLesson < lessons.length - 1) {
                    buttonHTML = `<button class="btn-primary" onclick="renderLesson(${currentLesson + 1})">לַשִּׁיעוּר הַבָּא! 🚀</button>`;
                } else {
                    buttonHTML = `<button class="btn-primary" onclick="showCertificate()">לִרְאוֹת אֶת הַתְּעוּדָה! 🎓</button>`;
                }
            } else {
                buttonHTML = `<button class="btn-primary" onclick="renderLesson(${currentLesson})">נְנַסֶּה שׁוּב! 🔄</button>`;
            }
            
            container.innerHTML = `
                <h1>כֹּה תֹאמַר לְבֵית יַעֲקֹב 💖</h1>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${progressPercent}%">
                        ${Math.round(progressPercent)}%
                    </div>
                </div>
                <div class="score-display">נִקּוּד כּוֹלֵל: ${score} / 12 ⭐</div>
                ${resultMessage}
                ${buttonHTML}
            `;
        }
        
        // הצגת תעודה
        function showCertificate() {
            const container = document.getElementById("gameContainer");
            const percentage = Math.round((score / 12) * 100);
            
            container.innerHTML = `
                <div class="certificate">
                    <h2>🏆 תְּעוּדַת הִצְטַיְּנוּת 🏆</h2>
                    <p style="font-size: 1.5em;">מוֹעֲנֶקֶת בְּזֶה לְ:</p>
                    <div class="certificate-name">${userName} 💫</div>
                    <p style="font-size: 1.3em; margin: 20px 0;">
                        שֶׁסִּיֵּם/ה בְּהַצְלָחָה אֶת מַסַּע הַלִּימּוּד:<br>
                        <strong>״כֹּה תֹאמַר לְבֵית יַעֲקֹב״</strong>
                    </p>
                    <div style="font-size: 1.8em; color: #e65100; margin: 20px 0;">
                        צִיּוּן: ${score} / 12 (${percentage}%) ⭐
                    </div>
                    <p style="font-size: 1.2em; color: #5d4037; margin: 20px 0;">
                        ״וְאָהַבְתָּ אֵת ה' אֱלֹקֶיךָ בְּכָל לְבָבְךָ וּבְכָל נַפְשְׁךָ וּבְכָל מְאֹדֶךָ״ 💖
                    </p>
                    
                    <div class="reflection-questions">
                        <h3>שְׁאֵלוֹת לְמַחְשָׁבָה: 💭</h3>
                        <ol>
                            <li>אֵיךְ אוּכַל לְהָבִיא יוֹתֵר אַהֲבַת הַשֵּׁם לַלִּימּוּד הַבָּא שֶׁלִּי?</li>
                            <li>אֵיזוֹ מִצְוָה אֲנִי רוֹצֶה לְקַיֵּם הַיּוֹם מִתּוֹךְ שִׂמְחָה?</li>
                            <li>אֵיךְ אֲנִי יָכוֹל לְהַשְׁפִּיעַ לְטוֹבָה עַל הַבַּיִת שֶׁלִּי?</li>
                        </ol>
                    </div>
                    
                    <a href="https://forms.gle/A66uubei4XSX6SG2A" target="_blank" class="lottery-link">
                        🎉 מַזָּל טוֹב, ${userName}! נִכְנַסְתָּ לְהַגְרָלָה! 🎁<br>
                        לְרִישׁוּם לְחַץ/י כָּאן! 📋
                    </a>
                    
                    <div class="contact-info">
                        <p><strong>נִבְנָה בְּאַהֲבָה עַל יְדֵי:</strong></p>
                        <p>הָרַב יְהוּדָה טָאוּב מִקִּרְיַת אַתָּא</p>
                        <p>📞 לִפְרָטִים: 0527139520</p>
                    </div>
                </div>
            `;
            
            // שליחה אוטומטית של הציון
            sendScoreToTeacher();
        }
        
        // התחלה
        renderIntro();
    </script>
</body>
</html>
