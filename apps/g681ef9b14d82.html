        @keyframes shake {
            0%, 100% { transform: translateX(0); }

        @keyframes float {
            0%, 100% { transform: translateY(0); }

        // ===== ערבוב מערך =====
        function shuffleArray(arr) {
            const shuffled = [...arr];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // ===== צלילים =====
        function playCorrectSound() {
            try {
                const ctx = getAudioContext();
                const notes = [261.63, 329.63, 392.00];
                notes.forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.frequency.value = freq;
                    osc.type = "sine";
                    gain.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.2);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.2 + 0.3);
                    osc.start(ctx.currentTime + i * 0.2);
                    osc.stop(ctx.currentTime + i * 0.2 + 0.3);
                });
            } catch(e) {}
        }

        function playCompletionSound() {
            try {
                const ctx = getAudioContext();
                const notes = [523.25, 659.25, 783.99, 1046.50, 783.99, 659.25];
                notes.forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.frequency.value = freq;
                    osc.type = "sine";
                    gain.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.15);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.15 + 0.3);
                    osc.start(ctx.currentTime + i * 0.15);
                    osc.stop(ctx.currentTime + i * 0.15 + 0.3);
                });
            } catch(e) {}
        }

                gameName: document.title || "הוֹדָיָה מֵהַלֵּב",
                date: now.toLocaleDateString("he-IL"),
                time: now.toLocaleTimeString("he-IL")
            };

            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify(data)
                });
                console.log("✅ הַצִּיּוּן נִשְׁלַח לַמּוֹרֶה!");
            } catch (error) {
                console.error("❌ שְׁגִיאָה בַּשְּׁלִיחָה:", error);
            }
        }

                const indices = [0, 1, 2, 3];
                const shuffledIndices = shuffleArray(indices);

                let answersHTML = "";
                shuffledIndices.forEach((origIdx) => {
                    answersHTML += `<button class="answer-btn" data-question="${qIndex}" data-answer="${origIdx}">${q.answers[origIdx]}</button>`;
                });

                questionsHTML += `
                    <div class="question-card" id="question-${qIndex}" style="${qIndex > 0 ? 'display:none;' : ''}">

                        <div id="feedback-${qIndex}"></div>

                        <div class="quiz-section">

                        </div>
                        <div id="lessonResult"></div>
                    </div>
                </div>
            `;

            // חיבור אירועים לכפתורים
            const answerBtns = document.querySelectorAll(".answer-btn");
            answerBtns.forEach(btn => {
                btn.addEventListener("click", function() {
                    const qIdx = parseInt(this.getAttribute("data-question"));
                    const aIdx = parseInt(this.getAttribute("data-answer"));
                    checkAnswer(qIdx, aIdx, this);
                });
            });
        }

        function checkAnswer(qIndex, answerIndex, clickedBtn) {
            const lesson = lessons[currentLesson];
            const question = lesson.questions[qIndex];
            const feedbackDiv = document.getElementById("feedback-" + qIndex);
            const answersDiv = document.getElementById("answers-" + qIndex);

            // מנע לחיצה כפולה
            const btns = answersDiv.querySelectorAll(".answer-btn");
            btns.forEach(b => b.classList.add("disabled"));

            const isCorrect = answerIndex === question.correct;

            if (isCorrect) {
                clickedBtn.classList.add("correct");
                score++;
                lessonScore++;
                playCorrectSound();

                const msg = correctMessages[Math.floor(Math.random() * correctMessages.length)];
                const love = loveMessages[Math.floor(Math.random() * loveMessages.length)];

                feedbackDiv.innerHTML = `
                    <div class="feedback-box feedback-correct">
                        <strong>${msg[0]}, ${userName}! ${msg[1]}</strong><br>
                        ${question.explanation}<br>
                        <em>${love}, ${userName} 💖</em>
                    </div>
                    <div class="depth-line">
                        🌟 אֵיךְ אֶפְשָׁר לִרְאוֹת כָּאן אֶת אַהֲבַת הַשֵּׁם?
                    </div>
                `;
            } else {
                clickedBtn.classList.add("wrong");
                // הראה את הנכונה
                btns.forEach(b => {
                    if (parseInt(b.getAttribute("data-answer")) === question.correct) {
                        b.classList.add("show-correct");
                    }
                });

                const wMsg = wrongMessages[Math.floor(Math.random() * wrongMessages.length)];

                feedbackDiv.innerHTML = `
                    <div class="feedback-box feedback-wrong">
                        <strong>${wMsg} 🤔</strong><br>
                        ${question.explanation}<br>
                        <em>גַּם כְּשֶׁטּוֹעִים - לוֹמְדִים! הַשֵּׁם אוֹהֵב אוֹתְךָ, ${userName}! 💡</em>
                    </div>
                `;
            }

            // עדכן ניקוד
            const scoreDisplay = document.querySelector(".score-display");
            if (scoreDisplay) scoreDisplay.textContent = "⭐ נִקּוּד: " + score + " / " + totalQuestions;

            answeredInLesson++;

            // אחרי עיכוב קצר הראה שאלה הבאה או סיכום
            setTimeout(() => {
                if (answeredInLesson < lesson.questions.length) {
                    // הראה שאלה הבאה
                    const nextQ = document.getElementById("question-" + answeredInLesson);
                    if (nextQ) {
                        nextQ.style.display = "block";
                        nextQ.scrollIntoView({ behavior: "smooth", block: "center" });
                    }
                } else {
                    showLessonResult();
                }
            }, 1800);
        }

                    // החזר ניקוד
