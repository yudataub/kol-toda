<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e22ce 100%);
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
            text-align: right;
            line-height: 2;
            font-size: 1.2em;
        }

        .game-container {
            max-width: 900px;
            margin: 0 auto;
            background: linear-gradient(135deg, #fffef7 0%, #fff8e1 100%);
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.3);
            animation: fadeIn 0.8s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        h1 {
            color: #1e3c72;
            font-size: 2.5em;
            margin-bottom: 30px;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        h2 {
            color: #7e22ce;
            font-size: 2em;
            margin: 30px 0 20px 0;
            text-align: center;
        }

        .intro-screen, .lesson-content, .question-container, .certificate {
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin: 20px 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .highlight {
            background: linear-gradient(120deg, #fef3c7 0%, #fde68a 100%);
            padding: 15px;
            border-right: 5px solid #f59e0b;
            border-radius: 8px;
            margin: 15px 0;
            font-weight: bold;
        }

        .inspiration-box {
            background: linear-gradient(120deg, #dbeafe 0%, #bfdbfe 100%);
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            border: 3px dashed #3b82f6;
            text-align: center;
            font-size: 1.1em;
            font-style: italic;
        }

        .btn {
            background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%);
            color: white;
            padding: 18px 40px;
            border: none;
            border-radius: 50px;
            font-size: 1.3em;
            cursor: pointer;
            margin: 15px 10px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4);
            font-weight: bold;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.6);
        }

        .btn:active {
            transform: translateY(0);
        }

        .answer-btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            color: #1f2937;
            padding: 20px;
            margin: 12px 0;
            border: 3px solid #d1d5db;
            border-radius: 15px;
            font-size: 1.15em;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: right;
        }

        .answer-btn:hover {
            background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%);
            border-color: #3b82f6;
            transform: translateX(-5px);
        }

        .answer-btn.correct {
            background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%);
            border-color: #10b981;
            animation: pulse 0.5s ease;
        }

        .answer-btn.wrong {
            background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
            border-color: #ef4444;
            animation: shake 0.5s ease;
        }

        .feedback {
            padding: 25px;
            margin: 20px 0;
            border-radius: 15px;
            font-size: 1.2em;
            animation: fadeIn 0.5s ease;
        }

        .feedback.correct {
            background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%);
            border: 3px solid #10b981;
            color: #065f46;
        }

        .feedback.wrong {
            background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
            border: 3px solid #ef4444;
            color: #991b1b;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e5e7eb;
            border-radius: 15px;
            overflow: hidden;
            margin: 25px 0;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981 0%, #059669 100%);
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .score-display {
            text-align: center;
            font-size: 1.5em;
            color: #1e3c72;
            margin: 20px 0;
            font-weight: bold;
        }

        .certificate {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 50%, #fbbf24 100%);
            border: 8px double #92400e;
            text-align: center;
            padding: 50px;
        }

        .certificate h2 {
            color: #92400e;
            font-size: 2.5em;
            margin-bottom: 30px;
        }

        .certificate-name {
            font-size: 2.2em;
            color: #7e22ce;
            margin: 25px 0;
            font-weight: bold;
        }

        .contact-info {
            background: linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 100%);
            padding: 25px;
            border-radius: 15px;
            margin: 30px 0;
            text-align: center;
            border: 3px solid #6366f1;
        }

        @media (max-width: 600px) {
            body {
                font-size: 1em;
                padding: 10px;
            }

                padding: 20px;
            }
            
            h1 {
                font-size: 1.8em;
            }
            
            h2 {
                font-size: 1.5em;
            }
            
            .btn {
                padding: 15px 30px;
                font-size: 1.1em;
            }
        }
    </style>
</head>

                        question: "מַה מְשֻׁתָּף לִשְׁנֵי הַמִּנְהָגִים - הָאַשְׁכְּנַזִּי וְהַסְּפָרַדִּי? 🌍",
                        answers: [
                            "בִּשְׁנֵיהֶם מוֹסִיפִים נֵר בְּכָל לַיְלָה וּמְבַטְּאִים אַהֲבַת הַשֵּׁם בְּשִׂמְחָה",
                            "בִּשְׁנֵיהֶם רַק הַגְּבָרִים מַדְלִיקִים וְהַנָּשִׁים רַק צוֹפוֹת מֵרָחוֹק",
                            "בִּשְׁנֵיהֶם חַיָּבִים לְהַדְלִיק דַּוְקָא בְּשֶׁמֶן זַיִת וְלֹא בְּנֵרוֹת אֲחֵרִים",
                            "בִּשְׁנֵיהֶם מַדְלִיקִים תָּמִיד שְׁמוֹנָה נֵרוֹת בְּכָל לַיְלָה מֵהַהַתְחָלָה"
                        ],
                        correct: 0,
                        explanation: "נִפְלָא! 🌟 גַּם אַשְׁכְּנַזִים וְגַם סְפָרַדִּים מוֹסִיפִים נֵר בְּכָל לַיְלָה! הָעִקָּר - לַעֲשׂוֹת זֹאת בְּאַהֲבָה וּבְשִׂמְחָה!"
                    }
                ]
            }
        ];

        // פונקציות עזר
        function shuffleArray(arr) {
            const newArr = [...arr];
            for (let i = newArr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
            }
            return newArr;
        }

        function playSound(frequencies, duration = 200) {
            frequencies.forEach((freq, index) => {
                setTimeout(() => {
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    oscillator.frequency.value = freq;
                    oscillator.type = 'sine';
                    
                    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration / 1000);
                    
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + duration / 1000);
                }, index * duration);
            });
        }

        async function sendScoreToTeacher() {
            const now = new Date();
            const data = {
                name: userName,
                score: `${score}/12`,
                percentage: `${Math.round((score/12)*100)}%`,
                gameName: document.title,
                date: now.toLocaleDateString('he-IL'),
                time: now.toLocaleTimeString('he-IL')
            };
            
            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'text/plain'},
                    body: JSON.stringify(data)
                });
                console.log('✅ הַנְּתוּנִים נִשְׁלְחוּ בְּהַצְלָחָה!');
            } catch (error) {
                console.error('❌ שְׁגִיאָה בְּשִׁלּוּחַ:', error);
            }
        }

                            בּוֹאוּ נִלְמַד יַחַד עַל נֵרוֹת חֲנֻכָּה!<br>
                            נְגַלֶּה סוֹדוֹת מְיֻחָדִים עַל הַדְלָקַת הַנֵּרוֹת 🕯️<br>
                            וְנַרְגִּישׁ אֶת אַהֲבַת הַשֵּׁם בְּכָל שִׁיעוּר! 💖
                        </p>
                    </div>
                    <div class="inspiration-box">
                        🙏 הַשֵּׁם שָׂמֵחַ כְּשֶׁאֲנַחְנוּ לוֹמְדִים תּוֹרָה!<br>
                        כָּל מִלָּה שֶׁנִּלְמַד מַאִירָה אֶת הָעוֹלָם! ✨
                    </div>
                    <div style="text-align: center; margin-top: 30px;">
                        <button class="btn" onclick="startGame()">בּוֹאוּ נַתְחִיל! 🎯</button>

            `;

        function startGame() {
            userName = prompt("מָה שִׁמְךָ? 💫");
            if (!userName || userName.trim() === "") {
                userName = "תַּלְמִיד יָקָר";
            }
            currentLesson = 0;
            score = 0;
            renderLesson(0);
        }

        function renderLesson(index) {
            if (index >= lessons.length) {
                showCertificate();
                return;
            }

            currentLesson = index;
            lessonScore = 0;
            answeredQuestions = [];
            
            const lesson = lessons[index];
            const container = document.getElementById('gameContainer');
            
            container.innerHTML = `
                <h1>${lesson.title}</h1>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${((index + 1) / lessons.length) * 100}%">
                        שִׁיעוּר ${index + 1} מִתּוֹךְ ${lessons.length}
                    </div>
                </div>
                <div class="score-display">
                    נִקּוּד: ${score} 🌟
                </div>
                <div class="lesson-content">
                    ${lesson.content}
                </div>
                <div style="text-align: center; margin: 30px 0;">
                    <button class="btn" onclick="startQuiz(${index})">בּוֹא נַעֲנֶה עַל שְׁאֵלוֹת! 🎯</button>
                </div>
            `;
        }

        function startQuiz(lessonIndex) {
            const lesson = lessons[lessonIndex];
            answeredQuestions = new Array(lesson.questions.length).fill(false);
            renderQuestion(lessonIndex, 0);
        }

        function renderQuestion(lessonIndex, questionIndex) {
            const lesson = lessons[lessonIndex];
            const question = lesson.questions[questionIndex];
            const container = document.getElementById('gameContainer');
            
            const shuffledAnswers = shuffleArray(question.answers.map((answer, idx) => ({
                text: answer,
                isCorrect: idx === question.correct
            })));
            
            container.innerHTML = `
                <h2>שְׁאֵלָה ${questionIndex + 1} מִתּוֹךְ ${lesson.questions.length}</h2>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${((questionIndex + 1) / lesson.questions.length) * 100}%">
                        ${questionIndex + 1}/${lesson.questions.length}
                    </div>
                </div>
                <div class="question-container">
                    <h3 style="margin-bottom: 30px; font-size: 1.4em;">${question.question}</h3>
                    <div id="answersContainer">
                        ${shuffledAnswers.map((answer, idx) => `
                            <button class="answer-btn" onclick="checkAnswer(${lessonIndex}, ${questionIndex}, ${answer.isCorrect})" id="answer-${idx}">
                                ${answer.text}
                            </button>
                        `).join('')}
                    </div>
                    <div id="feedback"></div>
                </div>
            `;
        }

        function checkAnswer(lessonIndex, questionIndex, isCorrect) {
            const lesson = lessons[lessonIndex];
            const question = lesson.questions[questionIndex];
            const feedbackDiv = document.getElementById('feedback');
            const buttons = document.querySelectorAll('.answer-btn');
            
            buttons.forEach(btn => btn.disabled = true);
            
            const encouragingWords = [
                `מְצֻיָּן, ${userName}!`,
                `נִפְלָא, ${userName}!`,
                `כָּל הַכָּבוֹד, ${userName}!`,
                `פַּצְצָה, ${userName}!`
            ];
            
            if (isCorrect) {
                score++;
                lessonScore++;
                answeredQuestions[questionIndex] = true;
                playSound([523.25, 659.25, 783.99]); // C-E-G
                
                const randomEncouragement = encouragingWords[Math.floor(Math.random() * encouragingWords.length)];
                
                feedbackDiv.innerHTML = `
                    <div class="feedback correct">
                        <div style="font-size: 1.5em; margin-bottom: 15px;">${randomEncouragement} ⭐</div>
                        <p>${question.explanation}</p>
                        <p style="margin-top: 20px; font-style: italic;">
                            💖 הַשֵּׁם שָׂמֵחַ כְּשֶׁרוֹאֶה אֶת אַהֲבָתוֹ בְּלִבְּךָ, ${userName}!
                        </p>
                    </div>
                `;
            } else {
                feedbackDiv.innerHTML = `
                    <div class="feedback wrong">
                        <div style="font-size: 1.3em; margin-bottom: 15px;">לֹא בְּדִיּוּק, ${userName}... 🤔</div>
                        <p>${question.explanation}</p>
                        <p style="margin-top: 20px; font-style: italic;">
                            💡 נַסֶּה שׁוּב, ${userName} — לִפְעָמִים גַּם בְּדֶרֶךְ לַטְּעוּת אָנוּ לוֹמְדִים לְאַהֵב אֶת הַשֵּׁם!
                        </p>
                    </div>
                `;
            }
            
            setTimeout(() => {
                if (questionIndex < lesson.questions.length - 1) {
                    renderQuestion(lessonIndex, questionIndex + 1);
                } else {
                    showLessonSummary(lessonIndex);
                }
            }, 3500);
        }

        function showLessonSummary(lessonIndex) {
            const container = document.getElementById('gameContainer');
            const lesson = lessons[lessonIndex];
            const percentage = (lessonScore / lesson.questions.length) * 100;
            
            let message, emoji, soundFreqs;
            
            if (lessonScore === lesson.questions.length) {
                message = `מַדְהִים, ${userName}! 🏆 אַתָּה שׁוֹלֵט! אַתָּה חַי בְּאַהֲבַת ה׳! 🎉`;

                soundFreqs = [523.25, 659.25, 783.99, 1046.50, 783.99, 659.25];

            } else if (percentage >= 66) {
                message = `כִּמְעַט מֻשְׁלָם, ${userName}! 💪 מַמָּשׁ כְּמוֹ בְּאַהֲבָה — מַמְשִׁיךְ לִצְמֹחַ 🌱`;

                        </button>
                    </div>
                </div>
            `;
        }

                        📞 לִפְרָטִים: 0527139520
                    </p>
                </div>
            `;
            
            // שליחת הציון למורה
            sendScoreToTeacher();
        }

        // התחלת המשחק
        renderIntro();
