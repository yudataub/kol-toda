<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>רבי עקיבא - ספר דיגיטלי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf3e6;
    --ink:#2e2a25;
    --gold:#c9a15a;
    --card:#f2e8d3;
    --gold-dark:#a9824a;
    --shadow: rgba(46,42,37,0.25);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Frank Ruhl Libre', serif;
    background:
      radial-gradient(ellipse at top, rgba(201,161,90,0.08), transparent 60%),
      var(--bg);
    color:var(--ink);
    min-height:100vh;
  }
  /* ===== דף בית ===== */
  #home{
    max-width:1100px;
    margin:0 auto;
    padding:40px 24px 80px;
    text-align:center;
  }
  .main-title{
    font-size:2.6rem;
    font-weight:900;
    color:var(--gold-dark);
    letter-spacing:1px;
    margin-bottom:6px;
    text-shadow:0 1px 0 rgba(255,255,255,0.4);
  }
  .sub-title{
    font-size:1.15rem;
    color:var(--ink);
    opacity:0.75;
    margin-bottom:36px;
  }
  .ornament{
    width:160px;
    height:14px;
    margin:0 auto 40px;
    border-top:2px solid var(--gold);
    border-bottom:2px solid var(--gold);
    opacity:0.7;
  }
  .cards{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(260px,1fr));
    gap:26px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--gold);
    border-radius:14px;
    padding:26px 20px 22px;
    cursor:pointer;
    text-align:right;
    position:relative;
    transition:transform .25s ease, box-shadow .25s ease;
    box-shadow:0 4px 10px var(--shadow);
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute; inset:6px;
    border:1px solid rgba(201,161,90,0.4);
    border-radius:9px;
    pointer-events:none;
  }
  .card:hover{
    transform:translateY(-6px);
    box-shadow:0 12px 24px var(--shadow);
  }
  .card-num{
    display:inline-block;
    width:38px;height:38px;
    line-height:38px;
    text-align:center;
    border-radius:50%;
    background:var(--gold);
    color:var(--bg);
    font-weight:700;
    margin-bottom:14px;
  }
  .card h3{
    margin:0 0 10px;
    font-size:1.3rem;
    color:var(--gold-dark);
  }
  .card p{
    margin:0;
    font-size:.95rem;
    line-height:1.6;
    opacity:0.85;
  }
  .card .icon{
    font-size:1.6rem;
    position:absolute;
    top:20px; left:20px;
  }
  .source-link{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:var(--gold-dark);
    text-decoration:none;
    border-bottom:1px dotted var(--gold-dark);
  }
  .source-link:hover{opacity:.7;}

  /* ===== מצב קורא ===== */
  #reader{
    display:none;
    position:fixed; inset:0;
    background:var(--bg);
    z-index:100;
    flex-direction:column;
  }
  #reader.active{display:flex;}
  .reader-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 20px;
    border-bottom:2px solid var(--gold);
    background:var(--card);
    gap:12px;
    flex-wrap:wrap;
  }
  .btn{
    background:transparent;
    border:1.5px solid var(--gold);
    color:var(--gold-dark);
    padding:8px 16px;
    border-radius:8px;
    cursor:pointer;
    font-family:inherit;
    font-size:.95rem;
    transition:.2s;
  }
  .btn:hover{background:var(--gold); color:var(--bg);}
  .reader-title{
    font-weight:700;
    color:var(--gold-dark);
    font-size:1.1rem;
    text-align:center;
    flex:1;
  }
  .top-actions{display:flex; gap:8px; align-items:center;}
  #searchBox{
    font-family:inherit;
    border:1.5px solid var(--gold);
    background:var(--bg);
    color:var(--ink);
    border-radius:8px;
    padding:7px 12px;
    font-size:.9rem;
    width:180px;
  }
  .progress-wrap{
    height:6px;
    background:rgba(201,161,90,0.25);
  }
  .progress-bar{
    height:100%;
    background:var(--gold);
    width:0%;
    transition:width .3s;
  }
  .reader-body{
    flex:1;
    display:flex;
    position:relative;
    overflow:hidden;
  }
  /* TOC */
  #toc{
    width:280px;
    background:var(--card);
    border-left:2px solid var(--gold);
    transform:translateX(100%);
    transition:transform .3s ease;
    position:absolute;
    right:0; top:0; bottom:0;
    overflow-y:auto;
    z-index:20;
    padding:16px;
  }
  #toc.open{transform:translateX(0);}
  #toc h4{
    color:var(--gold-dark);
    border-bottom:1px solid var(--gold);
    padding-bottom:8px;
    margin-top:0;
  }
  .toc-item{
    padding:10px 8px;
    border-radius:6px;
    cursor:pointer;
    font-size:.92rem;
    margin-bottom:4px;
    display:flex;
    justify-content:space-between;
  }
  .toc-item:hover{background:rgba(201,161,90,0.2);}
  .toc-item.current{
    background:var(--gold);
    color:var(--bg);
    font-weight:700;
  }
  /* עמוד */
  .page-stage{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    perspective:1600px;
  }
  .page{
    background:var(--card);
    border:2px solid var(--gold);
    border-radius:16px;
    max-width:680px;
    width:100%;
    min-height:480px;
    max-height:78vh;
    overflow-y:auto;
    padding:40px 44px;
    box-shadow:0 10px 30px var(--shadow);
    position:relative;
    animation:flipIn .45s ease;
  }
  @keyframes flipIn{
    from{opacity:0; transform:rotateY(8deg) scale(.97);}
    to{opacity:1; transform:rotateY(0) scale(1);}
  }
  .page::before{
    content:"";
    position:absolute; inset:8px;
    border:1px solid rgba(201,161,90,0.4);
    border-radius:11px;
    pointer-events:none;
  }
  .page h2{
    color:var(--gold-dark);
    text-align:center;
    margin-top:6px;
    font-size:1.5rem;
    border-bottom:2px solid var(--gold);
    padding-bottom:14px;
  }
  .page p{
    font-size:1.08rem;
    line-height:2;
    text-align:justify;
  }
  .page mark{
    background:var(--gold);
    color:var(--bg);
    border-radius:3px;
    padding:0 2px;
  }
  .page-num{
    text-align:center;
    color:var(--gold-dark);
    font-size:.85rem;
    opacity:.7;
    margin-top:18px;
  }
  .nav-arrow{
    position:absolute;
    top:50%; transform:translateY(-50%);
    background:var(--card);
    border:2px solid var(--gold);
    color:var(--gold-dark);
    width:48px;height:48px;
    border-radius:50%;
    font-size:1.4rem;
    cursor:pointer;
    z-index:10;
    display:flex; align-items:center; justify-content:center;
    transition:.2s;
    box-shadow:0 3px 8px var(--shadow);
  }
  .nav-arrow:hover{background:var(--gold); color:var(--bg);}
  .nav-arrow.prev{right:16px;}
  .nav-arrow.next{left:16px;}
  .nav-arrow:disabled{opacity:.25; cursor:default;}

  #searchResults{
    position:absolute;
    top:60px; left:20px; right:20px;
    max-width:400px;
    margin:0 auto;
    background:var(--card);
    border:1.5px solid var(--gold);
    border-radius:10px;
    max-height:300px;
    overflow-y:auto;
    z-index:30;
    display:none;
    box-shadow:0 8px 20px var(--shadow);
  }
  .search-result-item{
    padding:10px 14px;
    border-bottom:1px solid rgba(201,161,90,0.3);
    cursor:pointer;
    font-size:.9rem;
  }
  .search-result-item:hover{background:rgba(201,161,90,0.2);}
  .search-result-item b{color:var(--gold-dark);}

  @media(max-width:640px){
    #toc{width:82%;}
    .page{padding:28px 20px;}
    .nav-arrow{width:38px;height:38px; font-size:1.1rem;}
    #searchBox{width:120px;}
    .reader-title{font-size:.95rem;}
  }
</style>
</head>
<body>

<div id="home">
  <div class="main-title">רַבִּי עֲקִיבָא</div>
  <div class="sub-title">מֵרוֹעֶה פָּשׁוּט לְגָדוֹל הַדּוֹר — חֲמִשָּׁה סִפּוּרִים</div>
  <div class="ornament"></div>
  <div class="cards" id="cardsContainer"></div>
</div>

<div id="reader">
  <div class="reader-top">
    <button class="btn" onclick="goHome()">⟵ חזרה לדף הבית</button>
    <div class="reader-title" id="readerTitle"></div>
    <a class="btn" id="readerSourceLink" href="#" target="_blank">🔗 מקור</a>
    <div class="top-actions">
      <input type="text" id="searchBox" placeholder="חיפוש בספר..." oninput="doSearch(this.value)">
      <button class="btn" onclick="toggleTOC()">☰ תוכן</button>
    </div>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
  <div class="reader-body">
    <div id="searchResults"></div>
    <button class="nav-arrow prev" id="prevBtn" onclick="prevPage()">›</button>
    <div class="page-stage">
      <div class="page" id="pageContent"></div>
    </div>
    <button class="nav-arrow next" id="nextBtn" onclick="nextPage()">‹</button>
    <div id="toc">
      <h4>תוכן העניינים</h4>
      <div id="tocList"></div>
    </div>
  </div>
</div>

<script>
const books = [
  {
    icon:"💧",
    title:"רַבִּי עֲקִיבָא וְהָאֶבֶן הַקָּשָׁה",
    desc:"עֲקִיבָא הָרוֹעֶה שֶׁלֹּא יָדַע לִקְרֹא, גִּלָּה לְיַד הַבְּאֵר אֵיךְ טִפּוֹת מַיִם חוֹרְצוֹת אֶבֶן קָשָׁה — וְהֵבִין שֶׁגַּם הוּא יָכוֹל לְהִשְׁתַּנּוֹת.",
    source:"https://gamma.app/docs/x4abppd1n19lzn9",
    pages:[
      {h:"רוֹעֶה בֶּהָרִים", t:"בִּימֵי קֶדֶם חַי בְּאֶרֶץ יִשְׂרָאֵל רוֹעֶה צֹאן בְּשֵׁם עֲקִיבָא. כָּל הַיּוֹם הָיָה מוֹלִיךְ אֶת הַצֹּאן בֵּין הֶהָרִים, שׁוֹמֵר עֲלֵיהֶם מִזְּאֵבִים, וּמַשְׁקֶה אוֹתָם מִן הַמַּעְיָנוֹת. עֲקִיבָא הָיָה כְּבָר בֶּן אַרְבָּעִים שָׁנָה, וְעֲדַיִן לֹא יָדַע לִקְרֹא אֲפִלּוּ אוֹת אַחַת מִן הָאָלֶף-בֵּית."},
      {h:"הַבּוּשָׁה", t:"לִבּוֹ שֶׁל עֲקִיבָא כָּאַב. הוּא רָאָה יְלָדִים קְטַנִּים הוֹלְכִים לְבֵית הַסֵּפֶר, לוֹמְדִים תּוֹרָה, וְהוּא — אִישׁ מְבֻגָּר — לֹא יָדַע דָּבָר. 'הַאִם אֲנִי חֲסַר תַּקָּנָה?' חָשַׁב לְעַצְמוֹ. 'הַאִם מְאֻחָר מִדַּי בִּשְׁבִילִי לִלְמֹד?'"},
      {h:"לְיַד הַבְּאֵר", t:"יוֹם אֶחָד יָשַׁב עֲקִיבָא לְיַד בְּאֵר מַיִם וְהִסְתַּכֵּל בָּאֶבֶן הַגְּדוֹלָה שֶׁעָמְדָה בְּפִי הַבְּאֵר. הוּא שָׂם לֵב שֶׁבָּאֶבֶן יֵשׁ חוֹר עָמֹק. 'מִי חָצַב אֶת הַחוֹר הַזֶּה בָּאֶבֶן הַקָּשָׁה?' שָׁאַל אֶת עַצְמוֹ בְּפֶלֶא."},
      {h:"טִפּוֹת שֶׁחוֹרְצוֹת אֶבֶן", t:"אָמְרוּ לוֹ אֲנָשִׁים שֶׁעָמְדוּ שָׁם: 'לֹא אָדָם עָשָׂה זֹאת — טִפּוֹת הַמַּיִם הַנּוֹפְלוֹת מֵעַל בְּמֶשֶׁךְ שָׁנִים רַבּוֹת, טִפָּה אַחַר טִפָּה, הֵן שֶׁחָרְצוּ אֶת הָאֶבֶן הַקָּשָׁה הַזֹּאת.' עֲקִיבָא נִדְהַם. אֶבֶן קָשָׁה כָּל כָּךְ — נִשְׁבְּרָה רַק מִטִּפּוֹת מַיִם רַכּוֹת!"},
      {h:"הַתּוֹבָנָה הַגְּדוֹלָה", t:"'וּמָה אִם הַמַּיִם הָרַכִּים חוֹרְצִים אֶת הָאֶבֶן הַקָּשָׁה — הֲרֵי דִּבְרֵי תוֹרָה שֶׁהֵם קָשִׁים כְּבַרְזֶל, יָכוֹל שֶׁיֵּחָקְקוּ בְּלִבִּי הָרַךְ!' קָרָא עֲקִיבָא בְּשִׂמְחָה גְּדוֹלָה. הוּא הֵבִין: אִם יַתְמִיד, קְצָת קְצָת, יוֹם אַחַר יוֹם — גַּם הוּא יוּכַל לִלְמֹד."},
      {h:"אֶל בֵּית הַסֵּפֶר", t:"בְּלֵב נִחוּשׁ הָלַךְ עֲקִיבָא, יַחַד עִם בְּנוֹ הַקָּטָן, אֶל הַמְלַמֵּד. הוּא יָשַׁב בֵּין הַיְלָדִים הַקְּטַנִּים, וְהֵחֵל לִלְמֹד אֶת הָאוֹתִיּוֹת — אָלֶ״ף בֵּי״ת — כְּמוֹ יֶלֶד קָטָן. הַיְלָדִים הִבִּיטוּ בּוֹ בְּפֶלֶא, אֲבָל עֲקִיבָא לֹא הִתְבַּיֵּשׁ."},
      {h:"טִפָּה אַחַר טִפָּה", t:"בְּכָל יוֹם לָמַד עֲקִיבָא עוֹד קְצָת — אוֹת, מִלָּה, פָּסוּק. הוּא זָכַר אֶת הָאֶבֶן וְאֶת הַמַּיִם, וְהִתְמִיד בְּלִי לְהִתְיָאֵשׁ. שָׁנָה אַחַר שָׁנָה, עֲקִיבָא לָמַד וְהִתְעַלָּה, עַד שֶׁהָיָה לְאֶחָד מִגְּדוֹלֵי הַחֲכָמִים בְּיִשְׂרָאֵל."},
      {h:"מִסָּפֵק לְרַבִּי", t:"מִי שֶׁפַּעַם לֹא יָדַע לִקְרֹא אַף אוֹת, הָיָה לְרַבִּי עֲקִיבָא — מוֹרֵם שֶׁל אֲלָפִים תַּלְמִידִים, מִגְּדוֹלֵי הַתַּנָּאִים בְּיִשְׂרָאֵל. וְכָל זֶה הֵחֵל מֵרֶגַע אֶחָד לְיַד בְּאֵר מַיִם, כְּשֶׁהֵבִין: לְעוֹלָם לֹא מְאֻחָר מִדַּי לְהַתְחִיל."}
    ]
  },
  {
    icon:"👰",
    title:"רַבִּי עֲקִיבָא — מֵרוֹעֶה לִגְדוֹל הַדּוֹר",
    desc:"סִפּוּר אַהֲבָתָם שֶׁל עֲקִיבָא וְרָחֵל, הַקָּרְבָּן וְהַהַמְתָּנָה שֶׁל 24 שָׁנִים, וְהַהֲפִיכָה לְגָדוֹל הַדּוֹר.",
    source:"https://gamma.app/docs/3sm3kuhleiispb5",
    pages:[
      {h:"רָחֵל מַאֲמִינָה בּוֹ", t:"רָחֵל, בִּתּוֹ שֶׁל כַּלְבָּא שָׂבוּעַ הֶעָשִׁיר, רָאֲתָה בְּעֲקִיבָא הָרוֹעֶה הֶעָנִי מַשֶּׁהוּ שֶׁאַף אֶחָד אַחֵר לֹא רָאָה. 'רוֹאָה אֲנִי בְּךָ צְנִיעוּת מְבֹרֶכֶת,' אָמְרָה לוֹ, 'אִם תֵּלֵךְ לִלְמֹד תּוֹרָה — אֶנָּשֵׂא לְךָ.'"},
      {h:"הַהַחְלָטָה הַקָּשָׁה", t:"אָבִיהָ שֶׁל רָחֵל כָּעַס מְאֹד עַל הַהַצָּעָה שֶׁלָּהּ. הוּא נִדָּה אוֹתָהּ וְסֵרֵב לָתֵת לָהּ פְּרוּטָה. אַךְ רָחֵל לֹא חָזְרָה בָּהּ. הִיא הֶאֱמִינָה בְּעֲקִיבָא יוֹתֵר מֵאֲשֶׁר הֶאֱמִינָה בְּכֶסֶף אוֹ בְּנוֹחוּת."},

let currentBook = 0, currentPage = 0;

function renderHome(){
  const container = document.getElementById('cardsContainer');
  container.innerHTML = books.map((b,i)=>`
    <div class="card" onclick="openBook(${i})">
      <div class="icon">${b.icon}</div>
      <div class="card-num">${i+1}</div>
      <h3>${b.title}</h3>
      <p>${b.desc}</p>
      <a class="source-link" href="${b.source}" target="_blank" onclick="event.stopPropagation()">🔗 למקור המצגת המלאה ב-Gamma</a>
    </div>
  `).join('');
}

function openBook(i){
  currentBook = i;
  currentPage = 0;
  document.getElementById('reader').classList.add('active');
  document.getElementById('readerTitle').textContent = books[i].title;
  document.getElementById('readerSourceLink').href = books[i].source;
  renderTOC();
  renderPage();
}

function goHome(){
  document.getElementById('reader').classList.remove('active');
  document.getElementById('toc').classList.remove('open');
  document.getElementById('searchBox').value='';
  document.getElementById('searchResults').style.display='none';
}

function renderTOC(){
  const list = document.getElementById('tocList');
  list.innerHTML = books[currentBook].pages.map((p,i)=>`
    <div class="toc-item ${i===currentPage?'current':''}" onclick="jumpToPage(${i})">
      <span>${p.h}</span><span>${i+1}</span>
    </div>
  `).join('');
}

function jumpToPage(i){
  currentPage = i;
  renderPage();
  document.getElementById('toc').classList.remove('open');
}

function toggleTOC(){
  document.getElementById('toc').classList.toggle('open');
}

function renderPage(highlightTerm){
  const book = books[currentBook];
  const page = book.pages[currentPage];
  let text = page.t.replace(/\n/g,'</p><p>');
  if(highlightTerm){
    const re = new RegExp('('+highlightTerm.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    text = text.replace(re, '<mark>$1</mark>');
  }
  document.getElementById('pageContent').innerHTML = `
    <h2>${page.h}</h2>
    <p>${text}</p>
    <div class="page-num">עמוד ${currentPage+1} מתוך ${book.pages.length}</div>
  `;
  document.getElementById('prevBtn').disabled = currentPage === 0;
  document.getElementById('nextBtn').disabled = currentPage === book.pages.length-1;
  const pct = ((currentPage+1)/book.pages.length)*100;
  document.getElementById('progressBar').style.width = pct+'%';
  renderTOC();
}

function nextPage(){
  const book = books[currentBook];
  if(currentPage < book.pages.length-1){ currentPage++; renderPage(); }
}
function prevPage(){
  if(currentPage > 0){ currentPage--; renderPage(); }
}

function doSearch(term){
  const resultsBox = document.getElementById('searchResults');
  if(!term.trim()){ resultsBox.style.display='none'; return; }
  const book = books[currentBook];
  const matches = [];
  book.pages.forEach((p,i)=>{
    const full = p.h + ' ' + p.t;
    if(full.toLowerCase().includes(term.toLowerCase())){
      matches.push({idx:i, title:p.h});
    }
  });
  if(matches.length===0){
    resultsBox.innerHTML = '<div class="search-result-item">אין תוצאות</div>';
  } else {
    resultsBox.innerHTML = matches.map(m=>
      `<div class="search-result-item" onclick="jumpToSearchResult(${m.idx}, '${term.replace(/'/g,"")}')"><b>עמוד ${m.idx+1}:</b> ${m.title}</div>`
    ).join('');
  }
  resultsBox.style.display='block';
}

function jumpToSearchResult(idx, term){
  currentPage = idx;
  renderPage(term);
  document.getElementById('searchResults').style.display='none';
  document.getElementById('searchBox').value='';
}

// מקלדת
document.addEventListener('keydown', (e)=>{
  if(!document.getElementById('reader').classList.contains('active')) return;
  if(e.key === 'ArrowLeft') nextPage();
  if(e.key === 'ArrowRight') prevPage();
  if(e.key === 'Escape') goHome();
});

// מגע - swipe
let touchStartX = 0;
document.addEventListener('touchstart', e=>{ touchStartX = e.changedTouches[0].screenX; });
document.addEventListener('touchend', e=>{
  if(!document.getElementById('reader').classList.contains('active')) return;
  const touchEndX = e.changedTouches[0].screenX;
  const diff = touchEndX - touchStartX;
  if(Math.abs(diff) > 50){
    if(diff > 0) prevPage();
    else nextPage();
  }
});

renderHome();
</script>
