<html dir="rtl" lang="he">
<head>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
            text-align: right;
            line-height: 2;
        }

        .game-container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.8s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        h1 {
            font-size: 2.5em;
            color: #764ba2;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            animation: pulse 2s infinite;
        }

        h2 {
            font-size: 2em;
            color: #667eea;
            margin: 30px 0 20px;
            padding: 15px;
            background: linear-gradient(135deg, #fff5e6 0%, #ffe6cc 100%);
            border-radius: 15px;
            border-right: 5px solid #764ba2;
        }

        .intro-text, .lesson-content {
            font-size: 1.3em;
            line-height: 2.2;
            margin-bottom: 25px;
            padding: 20px;

            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .highlight {
            background: #ffeb3b;
            padding: 3px 8px;
            border-radius: 5px;
            font-weight: bold;
        }

        .thinking-box {
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);

            border-radius: 12px;
            margin: 25px 0;
            border-right: 5px solid #2196f3;
            font-size: 1.2em;
            font-style: italic;
        }

        .question-container {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            margin: 25px 0;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.1);

        .question-text {

            margin-bottom: 20px;
            padding: 15px;
            background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%);

            font-size: 1.2em;
            font-weight: bold;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);

            border-radius: 12px;

            transition: all 0.3s ease;
            text-align: right;

            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }

        .answer-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

            padding: 25px;
            border-radius: 12px;
            font-size: 1.3em;
            animation: fadeIn 0.5s ease-in;
        }

        .feedback.correct {
            background: #d4edda;
            color: #155724;
            border: 3px solid #28a745;
        }

        .feedback.incorrect {
            background: #f8d7da;
            color: #721c24;
            border: 3px solid #dc3545;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e0e0e0;
            border-radius: 15px;
            margin: 25px 0;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.2);
        }

            height: 100%;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 1.4em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);

            margin: 30px auto;

            border-radius: 20px;

            text-align: center;

            color: #1565c0;
            margin: 20px 0;

            color: #6a1b9a;
            margin: 30px 0;
            padding: 20px;

            border-radius: 12px;

            margin-top: 30px;
            padding: 20px;
            background: #f3e5f5;
            border-radius: 12px;
            font-size: 1.2em;

            padding: 15px 30px;
            background: linear-gradient(135deg, #ff6b6b 0%, #feca57 100%);
            color: white;

            border-radius: 50px;
            font-size: 1.3em;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .lottery-link:hover {

        }

            .question-text { font-size: 1.2em; }
            .answer-btn { font-size: 1.1em; padding: 15px 20px; }
            .game-container { padding: 20px; }

    </style>
</head>

        function playSound(frequencies, duration = 200) {
            frequencies.forEach((freq, index) => {
                setTimeout(() => {
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    oscillator.frequency.value = freq;
                    oscillator.type = 'sine';
                    
                    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration/1000);
                    
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + duration/1000);
                }, index * duration);
            });
        }

        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function updateProgressBar() {
            const totalLessons = lessons.length;
            const progress = ((currentLesson + 1) / totalLessons) * 100;
            const progressText = `שִׁיעוּר ${currentLesson + 1} מִתּוֹךְ ${totalLessons}`;
            
            return `
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${progress}%">${progressText}</div>
                </div>
            `;
        }

        async function sendScoreToTeacher() {
            const now = new Date();
            const data = {
                name: userName,
                score: `${score}/${totalQuestions}`,
                percentage: `${Math.round((score/totalQuestions)*100)}%`,
                gameName: document.title,
                date: now.toLocaleDateString('he-IL'),
                time: now.toLocaleTimeString('he-IL')
            };
            
            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'text/plain'},
                    body: JSON.stringify(data)
                });
                console.log('✅ הַצִּיּוּן נִשְׁלַח לַמּוֹרֶה!');
            } catch (error) {
                console.error('❌ שְׁגִיאָה בַּשְּׁלִיחָה:', error);
            }
        }

        function startGame() {
            currentLesson = 0;
            score = 0;
            lessonScores = [0, 0, 0, 0];
            renderLesson(0);
        }

        function renderLesson(lessonIndex) {
            if (lessonIndex >= lessons.length) {
                showCertificate();
                return;
            }

            currentLesson = lessonIndex;
            currentQuestionIndex = 0;
            const lesson = lessons[lessonIndex];
            
            const container = document.getElementById('gameContainer');
            container.innerHTML = `
                ${updateProgressBar()}
                
                <h2>${lesson.title}</h2>
                
                <div class="lesson-content">
                    ${lesson.content}
                </div>
                
                <div id="questionsContainer"></div>
                
                <div style="text-align: center; margin-top: 30px;">
                    <p style="font-size: 1.3em;">נִקּוּד כּוֹלֵל: ${score} 🌟</p>
                </div>
            `;

            renderQuestion(0);
        }

        function renderQuestion(questionIndex) {
            const lesson = lessons[currentLesson];
            if (questionIndex >= lesson.questions.length) {
                checkLessonCompletion();
                return;
            }

            const question = lesson.questions[questionIndex];
            const shuffledAnswers = shuffleArray(question.answers.map((ans, idx) => ({text: ans, index: idx})));
            
            const questionsContainer = document.getElementById('questionsContainer');
            questionsContainer.innerHTML = `
                <div class="question-container">
                    <div class="question-text">
                        שְׁאֵלָה ${questionIndex + 1}: ${question.question}
                    </div>
                    
                    <div id="answersContainer">
                        ${shuffledAnswers.map((ans, idx) => `
                            <button class="answer-btn" onclick="checkAnswer(${questionIndex}, ${ans.index})" id="answer-${idx}">
                                ${ans.text}
                            </button>
                        `).join('')}
                    </div>
                    
                    <div id="feedback-${questionIndex}"></div>
                </div>
            `;
        }

        function checkAnswer(questionIndex, selectedAnswer) {
            const lesson = lessons[currentLesson];
            const question = lesson.questions[questionIndex];
            const isCorrect = selectedAnswer === question.correct;
            
            // נעילת כל הכפתורים
            const buttons = document.querySelectorAll('.answer-btn');
            buttons.forEach(btn => btn.disabled = true);
            
            const feedbackDiv = document.getElementById(`feedback-${questionIndex}`);
            
            if (isCorrect) {
                score++;
                lessonScores[currentLesson]++;
                playSound([261.63, 329.63, 392.00]); // C-E-G
                
                const encouragements = [
                    `מְצֻיָּן, ${userName}! ⭐`,
                    `נִפְלָא, ${userName}! 💪`,
                    `כָּל הַכָּבוֹד, ${userName}! 🎯`,
                    `פַּצְצָה, ${userName}! 🌟`
                ];
                const randomEncouragement = encouragements[Math.floor(Math.random() * encouragements.length)];
                
                feedbackDiv.innerHTML = `
                    <div class="feedback correct">
                        <p style="font-size: 1.5em; font-weight: bold;">${randomEncouragement}</p>
                        <p>${question.explanation}</p>
                        <p style="font-size: 1.3em; margin-top: 15px;">הַשֵּׁם שָׂמֵחַ וְגֵאֶה בְּךָ, ${userName}! 💖🙏</p>

                    </div>
                `;
            }
            
            setTimeout(() => {
                currentQuestionIndex++;
                renderQuestion(currentQuestionIndex);
            }, 4000);
        }
