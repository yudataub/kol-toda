        function initAudio() {
            if (!audioInitialized) {
                audioContext.resume();
                audioInitialized = true;
            }
        }

        function playSound(frequencies, duration = 0.2) {
            initAudio();
            frequencies.forEach((freq, index) => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                oscillator.frequency.value = freq;
                oscillator.type = "sine";
                const startTime = audioContext.currentTime + (index * duration);
                gainNode.gain.setValueAtTime(0.3, startTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
                oscillator.start(startTime);
                oscillator.stop(startTime + duration);
            });
        }

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {

                    { question: "מָה הַמֶּסֶר הַמְּשֻׁתָּף מִשְּׁתֵּי הַדֵּעוֹת? 💭", answers: ["ה׳ אִתָּנוּ תָּמִיד - גַּם בְּנִסִּים גְּלוּיִים וְגַם בְּנִסִּים נִסְתָּרִים", "צָרִיךְ תָּמִיד לִלְחֹם בַּאוֹיְבִים וְגַם לְהַדְלִיק נֵרוֹת", "חֲשׁוּב לָדַעַת הַלָּכוֹת שֶׁל חֲנֻכָּה וּלְקַיֵּם אוֹתָן נָכוֹן", "כָּל אֶחָד יָכוֹל לִבְחֹר אֵיזֶה נֵס הוּא מַעֲדִיף יוֹתֵר"], correct: 0, explanation: "וַאו, הֵבַנְתָּ לְעֹמֶק! 🌟🎉 שְׁתֵּי הַדֵּעוֹת מְלַמְּדוֹת אוֹתָנוּ שֶׁה׳ תָּמִיד אִתָּנוּ - גַּם בְּנִסִּים גְּדוֹלִים (כְּמוֹ הַנִּצָּחוֹן) וְגַּם בְּנִסִּים קְטַנִּים (כְּמוֹ הַשֶּׁמֶן). כָּל יוֹם ה׳ עוֹשֶׂה נִסִּים וְשׁוֹמֵר עָלֵינוּ בְּאַהֲבָה! פָּתַחְתָּ אֶת הַלֵּב לִרְאוֹת אֶת זֶה! הַשֵּׁם אוֹהֵב אוֹתְךָ מְאֹד! 🌈💕🙏" }
                ]
            }
        ];

        async function sendScoreToTeacher() {
            const now = new Date();
            const totalQuestions = lessons.length * 3;
            const data = {
                name: userName,
                score: `${score}/${totalQuestions}`,
                percentage: `${Math.round((score/totalQuestions)*100)}%`,
                gameName: document.title,
                date: now.toLocaleDateString("he-IL"),
                time: now.toLocaleTimeString("he-IL")
            };
            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: "POST",
                    headers: {"Content-Type": "text/plain"},
                    body: JSON.stringify(data)
                });
                console.log("✅ הַנְּתוּנִים נִשְׁלְחוּ בְּהַצְלָחָה!");
            } catch (error) {
                console.error("❌ שְׁגִיאָה בְּשִׁלּוּחַ:", error);
            }
        }

        function askUserName() {
            userName = prompt("מָה שִׁמְךָ? 💫");
            if (!userName || userName.trim() === "") userName = "תַּלְמִיד יָקָר";
        }

        function displayIntro() {
            document.getElementById("content").innerHTML = `
                <div class="intro-screen">
                    <h2>🕯️ בָּרוּךְ הַבָּא לְמַסַּע חֲנֻכָּה! 🕯️</h2>
                    <p>הִתְכּוֹנֵן לִלְמֹד עַל הַנִּסִּים הַנִּפְלָאִים שֶׁל חֲנֻכָּה! 🌟</p>
                    <p>נִלְמַד עַל הַגְּזֵרוֹת, הַמִּלְחָמָה, נֵס פַּךְ הַשֶּׁמֶן, וְנַעֲמִיק בַּשְּׁאֵלוֹת הַמְּרַתְּקוֹת שֶׁל גְּדוֹלֵי יִשְׂרָאֵל! 📚✨</p>
                    <p><strong>בַּמַּסָּע נִלְמַד לִרְאוֹת אֶת אַהֲבַת ה׳ בְּכָל פְּרָט!</strong> 💖🙏</p>
                    <button class="start-btn" onclick="startGame()">🚀 בּוֹא נַתְחִיל!</button>
                </div>
            `;
        }

        function startGame() {
            initAudio();
            askUserName();
            currentLesson = 0;
            displayLesson();
        }

        function displayLesson() {
            const lesson = lessons[currentLesson];
            document.getElementById("content").innerHTML = `
                <div class="lesson-content">
                    <h2>${lesson.title}</h2>
                    ${lesson.content}
                    <button class="start-btn" onclick="startQuiz()">📝 בּוֹא נִבְחַן אֶת עַצְמֵנוּ!</button>
                </div>
            `;
            updateProgress();
        }

        function startQuiz() {
            currentQuestion = 0;
            currentLessonCorrect = 0;
            displayQuestion();
        }

        function displayQuestion() {
            const lesson = lessons[currentLesson];
            const question = lesson.questions[currentQuestion];
            const shuffledAnswers = shuffleArray(question.answers.map((text, index) => ({text, index})));
            document.getElementById("content").innerHTML = `
                <div class="quiz-container">
                    <div class="question">${question.question}</div>
                    <div class="answers">
                        ${shuffledAnswers.map((answer, btnIndex) => `
                            <button class="answer-btn" onclick="checkAnswer(${answer.index === question.correct}, ${btnIndex})">
                                ${answer.text}
                            </button>
                        `).join("")}
                    </div>
                    <div class="feedback" id="feedback"></div>
                    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">➡️ הַשְּׁאֵלָה הַבָּאָה</button>
                </div>
            `;
            updateProgress();
            updateScoreDisplay();
        }

        function checkAnswer(isCorrect, buttonIndex) {
            const buttons = document.querySelectorAll(".answer-btn");
            buttons.forEach(btn => btn.disabled = true);
            buttons[buttonIndex].classList.add(isCorrect ? "correct" : "wrong");
            if (isCorrect) {
                score++;
                currentLessonCorrect++;
                playSound([523, 659, 784]);
            }
            const lesson = lessons[currentLesson];
            const question = lesson.questions[currentQuestion];
            const feedback = document.getElementById("feedback");
            if (isCorrect) {
                feedback.innerHTML = `<div style="font-size: 1.4em; margin-bottom: 15px;">מְצֻיָּן, ${userName}! ⭐</div><div style="font-size: 1.1em;">${question.explanation}</div><div style="font-size: 1.15em; margin-top: 15px; color: #d84315;">הַשֵּׁם שָׂמֵחַ מִמְּךָ וְאוֹהֵב אוֹתְךָ, ${userName}! 💖</div>`;
                feedback.className = "feedback correct show";
            } else {
                feedback.innerHTML = `<div style="font-size: 1.3em; margin-bottom: 15px;">לֹא בְּדִיּוּק, ${userName}... 🤔</div><div style="font-size: 1.1em;">${question.explanation}</div><div style="font-size: 1.15em; margin-top: 15px; color: #5d4037;">גַּם כְּשֶׁטּוֹעִים - לוֹמְדִים, ${userName}! הַשֵּׁם אוֹהֵב אוֹתְךָ! 💡💖</div>`;
                feedback.className = "feedback wrong show";
            }
            document.getElementById("nextBtn").classList.add("show");
            updateScoreDisplay();
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < 3) {
                displayQuestion();
            } else {
                endLesson();
            }
        }

        function endLesson() {
            const percentage = (currentLessonCorrect / 3) * 100;
            const content = document.getElementById("content");
            if (percentage >= 66) {
                if (currentLesson < lessons.length - 1) {
                    content.innerHTML = `<div style="text-align: center; padding: 60px 40px;"><h2 style="color: #4caf50; font-size: 2.5em;">${percentage === 100 ? `כָּל הַכָּבוֹד, ${userName}! 🏆` : `מְעוֹלֶה, ${userName}! 💪`}</h2><p style="font-size: 1.5em; margin: 25px 0;">הִשַּׂגְתָּ ${currentLessonCorrect} מִתּוֹךְ 3 (${percentage.toFixed(0)}%)</p><p style="font-size: 1.4em; color: #667eea; margin: 35px 0;">${percentage === 100 ? `אַתָּה שׁוֹלֵט! עוֹבְרִים לְשִׁיעוּר הַבָּא! 🎉` : `יָפֶה מְאֹד! עוֹבְרִים קָדִימָה! 🌟`}</p><p style="font-size: 1.2em; color: #d84315; font-weight: bold;">הַשֵּׁם גֵּאֶה בְּךָ, ${userName}! 💖</p><button class="start-btn" onclick="nextLesson()">➡️ הַמְשֵׁךְ לְשִׁיעוּר הַבָּא</button></div>`;
                    if (percentage === 100) playSound([523, 659, 784, 1047, 784, 659]);
                } else {
                    showFinalScreen();
                }
            } else {
                content.innerHTML = `<div style="text-align: center; padding: 60px 40px;"><h2 style="color: #ff9800; font-size: 2.2em;">בּוֹא נְנַסֶּה שׁוּב, ${userName} 🌱</h2><p style="font-size: 1.4em; margin: 25px 0;">הִשַּׂגְתָּ ${currentLessonCorrect} מִתּוֹךְ 3 (${percentage.toFixed(0)}%)</p><p style="font-size: 1.3em; color: #666; margin: 35px 0;">צָרִיךְ לְפָחוֹת 2 מִתּוֹךְ 3 כְּדֵי לְהַמְשִׁיךְ.<br>חֲזֹר עַל הַחֹמֶר וְנַסֶּה שׁוּב, ${userName}! 💪</p><p style="font-size: 1.2em; color: #d84315; font-weight: bold;">הַשֵּׁם אוֹהֵב אוֹתְךָ וּמַאֲמִין בְּךָ! 💖</p><button class="start-btn" onclick="retryLesson()">🔄 חֲזָרָה לַשִּׁיעוּר</button></div>`;
            }
        }

        function nextLesson() {
            currentLesson++;
            displayLesson();
        }

        function retryLesson() {
            currentQuestion = 0;
            currentLessonCorrect = 0;
            displayLesson();
        }

        function showFinalScreen() {
            const totalQuestions = lessons.length * 3;
            const finalPercentage = Math.round((score / totalQuestions) * 100);
            document.getElementById("content").innerHTML = `<div style="text-align: center; padding: 40px;"><h2 style="color: #667eea; font-size: 2.8em; margin-bottom: 30px;">🎉 כָּל הַכָּבוֹד, ${userName}! סִיַּמְתָּ אֶת הַמַּסָּע! 🎉</h2><div class="certificate"><h3>🏆 תְּעוּדַת הִצְטַיְּנוּת 🏆</h3><p style="font-size: 1.4em; margin: 20px 0;"><strong>${userName}</strong><br>סִיֵּם בְּהַצְלָחָה אֶת מַסַּע הַלִּמּוּד<br><strong style="font-size: 1.2em;">"נֵס חֲנֻכָּה: מַסַּע שֶׁל אַהֲבָה וְאוֹר"</strong></p><p style="font-size: 2em; color: #d84315; font-weight: bold; margin: 25px 0;">צִיּוּן סוֹפִי: ${score}/${totalQuestions} (${finalPercentage}%)</p><p style="font-size: 1.2em; color: #5d4037; font-style: italic; margin-top: 20px;">"וְאָהַבְתָּ אֵת ה' אֱלֹקֶיךָ בְּכָל לְבָבְךָ וּבְכָל נַפְשְׁךָ וּבְכָל מְאֹדֶךָ"</p></div><div class="reflection"><h4>💭 שְׁאֵלוֹת לְמַחְשָׁבָה עֲמֻקָּה:</h4><p style="text-align: right;">• אֵיךְ תַּדְלִיק הַלַּיְלָה אֶת הַנֵּרוֹת אַחֶרֶת, עִם הֲבָנָה חֲדָשָׁה? 🕯️<br><br>• אֵיזוֹ הוֹדָיָה אִישִׁית אַתָּה מַרְגִּישׁ עַכְשָׁיו עַל נֵס חֲנֻכָּה? 🙏<br><br>• מָה הַהֶבְדֵּל בֵּין "לְקַיֵּם מִצְוָה" לְ"לִחְיוֹת אֶת הַמִּצְוָה"? 💖</p></div><p style="font-size: 1.5em; color: #f5576c; font-weight: bold; margin: 40px 0;">🎉 מַזָּל טוֹב, ${userName}! נִכְנַסְתָּ לְהַגְרָלָה נוֹשֵׂאת פְּרָסִים! 🎁</p><a href="https://forms.gle/A66uubei4XSX6SG2A" target="_blank" class="raffle-link">👉 לְרִשּׁוּם לְהַגְרָלָה לְחַץ כָּאן</a><div class="credits"><hr style="margin: 30px 0; border: none; border-top: 3px solid #667eea;"><p><strong>נִבְנָה בְּאַהֲבָה עַל יְדֵי:</strong><br><strong style="font-size: 1.5em; color: #667eea;">הָרַב יְהוּדָה טָאוּב מִקִּרְיַת אַתָּא</strong><br>📞 <strong>לִפְרָטִים: 0527139520</strong></p></div></div>`;
            sendScoreToTeacher();
            playSound([523, 659, 784, 1047, 784, 659], 0.3);
        }

        function updateProgress() {
            const totalLessons = lessons.length;
            const progress = ((currentLesson + (currentQuestion / 3)) / totalLessons) * 100;
            const progressFill = document.getElementById("progressFill");
            progressFill.style.width = progress + "%";
            progressFill.textContent = Math.round(progress) + "%";
        }

        function updateScoreDisplay() {
            const display = document.getElementById("scoreDisplay");
            if (currentLesson >= 0) {
                display.textContent = `📊 צִיּוּן: ${score} | שִׁיעוּר נוֹכְחִי: ${currentLessonCorrect}/${currentQuestion + 1}`;
            }
        }

        window.onload = function() {
            displayIntro();
        };
    </script>
</body>
</html>
