                setTimeout(() => {
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);

                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + duration / 1000);
                }, index * duration);
            });

        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

            if (lessonIndex >= lessons.length) {
                showCertificate();
                return;

            const lesson = lessons[lessonIndex];
            const container = document.getElementById('gameContainer');
            
            const progress = ((lessonIndex) / lessons.length) * 100;
            
            container.innerHTML = `

        // פונקציה להצגת שאלות
        function renderQuestions(lessonIndex) {
            const lesson = lessons[lessonIndex];
            const container = document.getElementById('questionsContainer');
            let questionsHTML = '';

            lesson.questions.forEach((q, qIndex) => {
                const shuffledAnswers = shuffleArray(q.answers.map((ans, idx) => ({ text: ans, originalIndex: idx })));
                
                questionsHTML += `
                    <div class="question-container" id="question-${qIndex}">
                        <div class="question-text">
                            <strong>שְׁאֵלָה ${qIndex + 1} מִתּוֹךְ 3:</strong><br>
                            ${q.q}
                        </div>
                        
                        <div class="answers-grid">
                            ${shuffledAnswers.map((ans, idx) => `
                                <button class="answer-btn" onclick="checkAnswer(${lessonIndex}, ${qIndex}, ${ans.originalIndex})">
                                    ${ans.text}
                                </button>
                            `).join('')}
                        </div>
                        
                        <div class="feedback" id="feedback-${qIndex}"></div>
                    </div>
                `;
            });

            container.innerHTML = questionsHTML;
        }

        // משתנה לשמירת תשובות נכונות בשיעור הנוכחי
        let currentLessonCorrect = 0;
        let currentLessonAnswered = 0;

        // פונקציה לבדיקת תשובה
        function checkAnswer(lessonIndex, questionIndex, selectedAnswer) {
            const lesson = lessons[lessonIndex];
            const question = lesson.questions[questionIndex];
            const isCorrect = selectedAnswer === question.correct;

            // עדכון ספירה
            currentLessonAnswered++;
            if (isCorrect) {
                currentLessonCorrect++;
                score++;
            }

            // השבתת כל הכפתורים של השאלה הנוכחית
            const questionDiv = document.getElementById(`question-${questionIndex}`);
            const buttons = questionDiv.querySelectorAll('.answer-btn');
            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === Array.from(buttons).findIndex(b => b.textContent.includes(question.answers[selectedAnswer]))) {
                    btn.classList.add(isCorrect ? 'correct' : 'incorrect');
                }
            });

            // הצגת משוב
            const feedback = document.getElementById(`feedback-${questionIndex}`);
            feedback.style.display = 'block';
            feedback.className = `feedback ${isCorrect ? 'correct' : 'incorrect'}`;

            const encouragements = {
                correct: ['מְצֻיָּן! ⭐', 'נִפְלָא! 💪', 'כָּל הַכָּבוֹד! 🎯', 'פַּצְצָה! 🎊', 'מֻמְחֶה! 🌟'],
                incorrect: ['לֹא בְּדִיּוּק... 🤔', 'כִּמְעַט! 💭', 'נִסָּיוֹן טוֹב! 🌱']
            };

            const randomEncouragement = isCorrect 
                ? encouragements.correct[Math.floor(Math.random() * encouragements.correct.length)]
                : encouragements.incorrect[Math.floor(Math.random() * encouragements.incorrect.length)];

            feedback.innerHTML = `
                <div class="feedback-title">${randomEncouragement}</div>
                <p>${question.explanation}</p>
                ${!isCorrect ? '<p><strong>גַּם כְּשֶׁטּוֹעִים - לוֹמְדִים! הַשֵּׁם אוֹהֵב אוֹתְךָ! 💡</strong></p>' : ''}
            `;

            // השמעת צליל
            if (isCorrect) {
                playSound(sounds.correct);
            }

            // בדיקה אם ענינו על כל השאלות
            if (currentLessonAnswered === lesson.questions.length) {
                // בדיקה אם עברנו את השיעור (2 מתוך 3)
                if (currentLessonCorrect >= 2) {
                    document.getElementById('nextBtn').style.display = 'inline-block';
                } else {
                    // צריך לנסות שוב
                    setTimeout(() => {
                        alert('בּוֹא נְנַסֶּה שׁוּב! 💪 צָרִיךְ לַעֲנוֹת נָכוֹן עַל לְפָחוֹת 2 מִתּוֹךְ 3 שְׁאֵלוֹת כְּדֵי לְהַמְשִׁיךְ.');
                        currentLessonCorrect = 0;
                        currentLessonAnswered = 0;
                        renderQuestions(lessonIndex);
                    }, 1000);
                }
            }
        }
