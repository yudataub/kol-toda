<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מבחן אמריקאי עם תעודת סיום</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Bellefair&display=swap');
        
        body {
            font-family: 'Heebo', sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        .header {
            padding: 20px;
            border-bottom: 1px solid #e2e8f0;
            background-color: #4a5568;
            color: white;
        }
        
        .content {
            padding: 20px;
        }
        
        h1, h2, h3 {
            color: #2d3748;
        }
        
        .header h1 {
            color: white;
            margin: 0;
        }
        
        .question {
            margin-bottom: 30px;
        }
        
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .option {
            padding: 15px;
            background-color: #f3f4f6;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .option:hover {
            background-color: #e5e7eb;
        }
        
        .option.selected {
            background-color: #4f46e5;
            color: white;
        }
        
        .option.correct {
            background-color: #10b981;
            color: white;
        }
        
        .option.incorrect {
            background-color: #ef4444;
            color: white;
        }
        
        .explanation {
            padding: 15px;
            background-color: #f9fafb;
            border-radius: 6px;
            border: 1px solid #e5e7eb;
            margin-top: 15px;
            display: none;
        }
        
        .button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .button:hover {
            background-color: #4338ca;
        }
        
        .button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }
        
        .navigation {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        
        .result {
            text-align: center;
            padding: 40px 20px;
        }
        
        .score {
            font-size: 2rem;
            font-weight: bold;
            color: #4f46e5;
            margin-bottom: 10px;
        }
        
        .percentage {
            font-size: 1.5rem;
            color: #8b5cf6;
            margin-bottom: 20px;
        }
        
        .message {
            font-size: 1.25rem;
            color: #4b5563;
            margin-bottom: 30px;
        }
        
        .progress {
            height: 10px;
            background-color: #e5e7eb;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(to right, #4f46e5, #8b5cf6);
            transition: width 0.3s ease;
        }
        
        .intro {
            padding: 20px;
            background-color: #f9fafb;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        
        /* Certificate styles */
        .certificate {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            background-image: linear-gradient(to bottom right, #f1f9ff, #dcf1ff);
            border: 15px solid #4a5568;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .certificate:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%234a5568' fill-opacity='0.05' fill-rule='evenodd'%3E%3Cpath d='M0 38.59l2.83-2.83 1.41 1.41L1.41 40H0v-1.41zM0 1.4l2.83 2.83 1.41-1.41L1.41 0H0v1.41zM38.59 40l-2.83-2.83 1.41-1.41L40 38.59V40h-1.41zM40 1.41l-2.83 2.83-1.41-1.41L38.59 0H40v1.41zM20 18.6l2.83-2.83 1.41 1.41L21.41 20l2.83 2.83-1.41 1.41L20 21.41l-2.83 2.83-1.41-1.41L18.59 20l-2.83-2.83 1.41-1.41L20 18.59z'/%3E%3C/g%3E%3C/svg%3E");
            opacity: 0.1;
            z-index: 0;
        }
        
        .certificate-title {
            font-family: 'Bellefair', serif;
            font-size: 40px;
            color: #2d3748;
            margin-top: 20px;
            text-shadow: 1px 1px 1px rgba(0,0,0,0.1);
            position: relative;
        }
        
        .certificate-subtitle {
            font-size: 20px;
            color: #4a5568;
            margin-bottom: 20px;
            position: relative;
        }
        
        .student-name {
            font-family: 'Bellefair', serif;
            font-size: 30px;
            font-weight: bold;
            color: #4f46e5;
            margin: 30px 0;
            border-bottom: 2px solid #4f46e5;
            display: inline-block;
            padding: 0 10px 5px;
            position: relative;
        }
        
        .certificate-text {
            font-size: 16px;
            color: #4b5563;
            margin: 20px 0;
            position: relative;
        }
        
        .score-display {
            font-size: 24px;
            font-weight: bold;
            color: #10b981;
            margin: 20px 0;
            position: relative;
        }
        
        .achievement {
            font-family: 'Bellefair', serif;
            font-size: 28px;
            color: #8b5cf6;
            margin: 20px 0;
            position: relative;
        }
        
        .certificate-date {
            font-size: 14px;
            color: #6b7280;
            margin-top: 30px;
            position: relative;
        }
        
        .stamp {
            position: absolute;
            bottom: 30px;
            right: 40px;
            width: 100px;
            height: 100px;
            background-color: rgba(239, 68, 68, 0.1);
            border: 2px solid rgba(239, 68, 68, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: rotate(-15deg);
            font-family: 'Bellefair', serif;
            color: rgba(239, 68, 68, 0.7);
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            line-height: 1.2;
        }
        
        .name-input {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 300px;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>מבחן אמריקאי בנושא מצוות פורים</h1>
            <div class="progress">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>
        
        <div class="content" id="quiz-content">
            <!-- Quiz content will be loaded here by JavaScript -->
        </div>
    </div>

    <script>
        // Quiz questions data
        const questions = [
            {
                question: "מהו המקור בגמרא לחיוב קריאת המגילה פעמיים - בלילה וביום?",
                options: [
                    "\"חייב אדם לקרוא את המגילה בלילה ולשנותה ביום\" - רבי יהושע בן לוי",
                    "\"חייב אדם לקרוא את המגילה בלילה ולשנותה ביום\" - רבי חלבו בשם עולא בירה",
                    "\"אם קרא את המגילה באדר ראשון ובאדר שני יצא ידי חובתו\" - רבי מאיר",
                    "\"מגילה נקראת באחד עשר, בשנים עשר, בשלושה עשר, בארבעה עשר ובחמישה עשר\" - משנה ריש מסכת מגילה"
                ],
                correct: 1,
                explanation: "המקור לחובת קריאת המגילה פעמיים הוא דברי רבי חלבו בשם עולא בירה שאמר \"חייב אדם לקרוא את המגילה בלילה ולשנותה ביום\". מימרא זו היא המקור העיקרי לחובה לקרוא את המגילה פעמיים - פעם בלילה ופעם ביום."
            },
            {
                question: "מהו הפסוק שממנו לומדים את החובה לקרוא את המגילה בלילה וביום?",
                options: [
                    "\"להגיד בבוקר חסדך ואמונתך בלילות\"",
                    "\"ממזרח שמש עד מבואו מהולל שם ה'\"",
                    "\"למען יזמרך כבוד ולא ידום, ה' אלוקי לעולם אודך\"",
                    "\"והימים האלה נזכרים ונעשים בכל דור ודור\""
                ],
                correct: 2,
                explanation: "הפסוק ממנו לומדים את החובה לקרוא את המגילה פעמיים הוא \"למען יזמרך כבוד ולא ידום, ה' אלוקי לעולם אודך\". כאשר \"יזמרך כבוד\" מתייחס לקריאה ביום ו\"לא ידום\" מתייחס לקריאה בלילה."
            }
            // אפשר להוסיף כאן עוד שאלות כראות עיניך
        ];

        // Quiz state variables
        let currentQuestion = 0;
        let score = 0;
        let selectedOption = null;
        let showingExplanation = false;
        let quizCompleted = false;
        let studentName = "";

        // Sound effects using Web Audio API
        let audioContext;
        let sounds = {};

        // Initialize audio
        function initAudio() {
            try {
                // Create audio context
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                // Start Sound (Tibetan bowl)
                sounds.start = function() {
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    
                    oscillator.type = 'sine';
                    oscillator.frequency.value = 196.0; // G3
                    
                    gainNode.gain.setValueAtTime(0, audioContext.currentTime);
                    gainNode.gain.linearRampToValueAtTime(0.3, audioContext.currentTime + 0.1);
                    gainNode.gain.linearRampToValueAtTime(0, audioContext.currentTime + 2.5);
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    oscillator.start();
                    setTimeout(() => oscillator.stop(), 2500);
                };
                
                // Select option sound (piano key)
                sounds.select = function() {
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    
                    oscillator.type = 'sine';
                    oscillator.frequency.value = 440; // A4
                    
                    gainNode.gain.value = 0.1;
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    oscillator.start();
                    setTimeout(() => oscillator.stop(), 200);
                };
                
                // Correct answer sound (major chord)
                sounds.correct = function() {
                    const playNote = (freq, delay, duration) => {
                        setTimeout(() => {
                            const osc = audioContext.createOscillator();
                            const gain = audioContext.createGain();
                            
                            osc.type = 'sine';
                            osc.frequency.value = freq;
                            
                            gain.gain.setValueAtTime(0.2, audioContext.currentTime);
                            gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
                            
                            osc.connect(gain);
                            gain.connect(audioContext.destination);
                            
                            osc.start();
                            setTimeout(() => osc.stop(), duration * 1000);
                        }, delay);
                    };
                    
                    // C major chord (C, E, G)
                    playNote(261.63, 0, 0.8);    // C4
                    playNote(329.63, 50, 0.8);   // E4
                    playNote(392.00, 100, 0.8);  // G4
                };
                
                // Incorrect answer sound (minor tone)
                sounds.incorrect = function() {
                    const osc1 = audioContext.createOscillator();
                    const osc2 = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    
                    osc1.type = 'sine';
                    osc2.type = 'sine';
                    
                    osc1.frequency.value = 220;    // A3
                    osc2.frequency.value = 233.08; // A#3
                    gainNode.gain.value = 0.1;
                    
                    osc1.connect(gainNode);
                    osc2.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    osc1.start();
                    osc2.start();
                    
                    setTimeout(() => {
                        osc1.stop();
                        osc2.stop();
                    }, 400);
                };
                
                // Next question sound (ascending notes)
                sounds.next = function() {
                    const playNote = (freq, delay) => {
                        setTimeout(() => {
                            const osc = audioContext.createOscillator();
                            const gain = audioContext.createGain();
                            
                            osc.type = 'sine';
                            osc.frequency.value = freq;
                            
                            gain.gain.value = 0.1;
                            
                            osc.connect(gain);
                            gain.connect(audioContext.destination);
                            
                            osc.start();
                            setTimeout(() => osc.stop(), 150);
                        }, delay);
                    };
                    
                    // Ascending scale
                    playNote(523.25, 0);   // C5
                    playNote(587.33, 150); // D5
                    playNote(659.25, 300); // E5
                };
                
                // Completion sound (celebratory fanfare)
                sounds.complete = function() {
                    const playNote = (freq, delay, duration) => {
                        setTimeout(() => {
                            const osc = audioContext.createOscillator();
                            const gain = audioContext.createGain();
                            
                            osc.type = 'sine';
                            osc.frequency.value = freq;
                            
                            gain.gain.setValueAtTime(0.2, audioContext.currentTime);
                            gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
                            
                            osc.connect(gain);
                            gain.connect(audioContext.destination);
                            
                            osc.start();
                            setTimeout(() => osc.stop(), duration * 1000);
                        }, delay);
                    };
                    
                    // Celebratory fanfare
                    playNote(392.00, 0, 0.3);    // G4
                    playNote(392.00, 300, 0.3);  // G4
                    playNote(523.25, 600, 0.5);  // C5
                    
                    // Major chord
                    playNote(523.25, 1200, 1);   // C5
                    playNote(659.25, 1200, 1);   // E5
                    playNote(783.99, 1200, 1);   // G5
                };
                
                // Certificate sound
                sounds.certificate = function() {
                    // Paper sound (white noise)
                    const paperDuration = 1;
                    const noiseNode = audioContext.createBufferSource();
                    const noiseBuffer = audioContext.createBuffer(1, audioContext.sampleRate * paperDuration, audioContext.sampleRate);
                    const noiseData = noiseBuffer.getChannelData(0);
                    
                    for (let i = 0; i < noiseBuffer.length; i++) {
                        noiseData[i] = Math.random() * 2 - 1;
                    }
                    
                    const noiseGain = audioContext.createGain();
                    noiseGain.gain.setValueAtTime(0.05, audioContext.currentTime);
                    noiseGain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + paperDuration);
                    
                    const filter = audioContext.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.frequency.value = 2000;
                    filter.Q.value = 1.5;
                    
                    noiseNode.buffer = noiseBuffer;
                    noiseNode.connect(filter);
                    filter.connect(noiseGain);
                    noiseGain.connect(audioContext.destination);
                    
                    noiseNode.start();
                    
                    // Chord after paper sound
                    setTimeout(() => {
                        const playNote = (freq, delay, duration) => {
                            setTimeout(() => {
                                const osc = audioContext.createOscillator();
                                const gain = audioContext.createGain();
                                
                                osc.type = 'sine';
                                osc.frequency.value = freq;
                                
                                gain.gain.setValueAtTime(0.15, audioContext.currentTime);
                                gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
                                
                                osc.connect(gain);
                                gain.connect(audioContext.destination);
                                
                                osc.start();
                                setTimeout(() => osc.stop(), duration * 1000);
                            }, delay);
                        };
                        
                        // Festive chord (D major)
                        playNote(293.66, 0, 2);    // D4
                        playNote(369.99, 100, 2);  // F#4
                        playNote(440.00, 200, 2);  // A4
                        playNote(587.33, 300, 2);  // D5
                    }, 1000);
                };

                return true;
            } catch (error) {
                console.error("Web Audio API is not supported in this browser", error);
                return false;
            }
        }

        // DOM Element references
        const quizContent = document.getElementById('quiz-content');
        const progressBar = document.getElementById('progress-bar');

        // Show intro screen
        function showIntro() {
            quizContent.innerHTML = `
                <div class="intro">
                    <h2>ברוכים הבאים למבחן בנושא מצוות פורים</h2>
                    <p>לפניכם מבחן קצר המבוסס על ההרצאה "ה' אלוקי לעולם אודך".</p>
                    <p>עליכם לבחור את התשובה הנכונה ביותר לכל שאלה.</p>
                    <p>בסיום המבחן תקבלו תעודה אישית!</p>
                    <p>אנא הזינו את שמכם:</p>
                    <input type="text" id="student-name" class="name-input" placeholder="השם שלך" />
                    <p></p>
                    <button class="button" onclick="beginQuiz()">התחל את המבחן</button>
                </div>
            `;

            // הפעלת הסאונד + פתיחת אודיו
            const audioInited = initAudio();
            if (audioInited && sounds.start) {
                sounds.start();
            }
        }

        // Begin the quiz
        function beginQuiz() {
            studentName = document.getElementById('student-name').value || "תלמיד חכם";
            currentQuestion = 0;
            score = 0;
            selectedOption = null;
            showingExplanation = false;
            quizCompleted = false;
            showQuestion();
            if (sounds.next) sounds.next();
        }

        // Display the current question
        function showQuestion() {
            if (quizCompleted) {
                showResults();
                return;
            }

            // Update progress bar
            progressBar.style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;
            
            const question = questions[currentQuestion];
            
            // Create HTML for the question
            let html = `
                <div class="question">
                    <h2>שאלה ${currentQuestion + 1} מתוך ${questions.length}</h2>
                    <p>${question.question}</p>
                    
                    <div class="options">
            `;
            
            // Add options
            question.options.forEach((option, index) => {
                html += `
                    <div class="option" onclick="selectOption(${index})">
                        ${option}
                    </div>
                `;
            });
            
            html += `
                    </div>
                    
                    <div class="explanation" id="explanation">
                        <p><strong>הסבר:</strong> ${question.explanation}</p>
                    </div>
                    
                    <div class="navigation">
                        <button class="button" id="check-button" onclick="checkAnswer()" disabled>בדוק תשובה</button>
                        <button class="button" id="next-button" onclick="nextQuestion()" style="display: none;">לשאלה הבאה</button>
                    </div>
                </div>
            `;
            
            quizContent.innerHTML = html;
        }

        // Handle option selection
        function selectOption(index) {
            if (showingExplanation) return;
            
            selectedOption = index;
            if (sounds.select) sounds.select();
            
            // Update UI
            const options = document.querySelectorAll('.option');
            options.forEach((option, i) => {
                if (i === index) {
                    option.classList.add('selected');
                } else {
                    option.classList.remove('selected');
                }
            });
            
            // Enable check button
            document.getElementById('check-button').disabled = false;
        }

        // Check if the selected answer is correct
        function checkAnswer() {
            if (selectedOption === null || showingExplanation) return;
            
            showingExplanation = true;
            
            const question = questions[currentQuestion];
            const isCorrect = selectedOption === question.correct;
            
            // Update UI
            const options = document.querySelectorAll('.option');
            options.forEach((option, i) => {
                if (i === question.correct) {
                    option.classList.add('correct');
                } else if (i === selectedOption) {
                    option.classList.remove('selected');
                    if (i !== question.correct) {
                        option.classList.add('incorrect');
                    }
                }
            });
            
            // Show explanation
            document.getElementById('explanation').style.display = 'block';
            
            // Update buttons
            document.getElementById('check-button').style.display = 'none';
            document.getElementById('next-button').style.display = 'block';
            
            // Update score and play sound
            if (isCorrect) {
                score++;
                if (sounds.correct) sounds.correct();
            } else {
                if (sounds.incorrect) sounds.incorrect();
            }
        }

        // Move to the next question
        function nextQuestion() {
            selectedOption = null;
            showingExplanation = false;
            
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                showQuestion();
                if (sounds.next) sounds.next();
            } else {
                quizCompleted = true;
                showResults();
                if (sounds.complete) sounds.complete();
            }
        }

        // Get achievement based on score
        function getAchievement(percentage) {
            if (percentage === 100) {
                return "מומחה בהלכות פורים";
            } else if (percentage >= 70) {
                return "יודע היטב את הלכות פורים";
            } else {
                return "מתמיד בלימוד הלכות פורים";
            }
        }

        // Show quiz results with certificate
        function showResults() {
            const percentage = Math.round((score / questions.length) * 100);
            const achievement = getAchievement(percentage);
            
            let html = `
                <div class="result">
                    <h2>סיימת את המבחן!</h2>
                    
                    <div class="score">
                        ${score} מתוך ${questions.length}
                    </div>
                    
                    <div class="percentage">
                        ${percentage}%
                    </div>
                    
                    <p>מיד תקבל את התעודה האישית שלך...</p>
                    
                    <button class="button" onclick="showCertificate()">הצג תעודה</button>
                </div>
            `;
            
            quizContent.innerHTML = html;
            progressBar.style.width = '100%';
        }
        
        // Show certificate
        function showCertificate() {
            const percentage = Math.round((score / questions.length) * 100);
            const achievement = getAchievement(percentage);
            const currentDate = new Date();
            const dateString = currentDate.toLocaleDateString('he-IL', { 
                day: 'numeric', 
                month: 'long', 
                year: 'numeric' 
            });
            
            if (sounds.certificate) sounds.certificate();

            let html = `
                <div class="certificate">
                    <div class="certificate-title">תעודת הצטיינות</div>
                    <div class="certificate-subtitle">מוענקת בזאת ל:</div>
                    <div class="student-name">${studentName}</div>
                    <div class="certificate-text">
                        על השתתפות במבחן בנושא מצוות קריאת המגילה בפורים
                        <br>וגילוי ידע והבנה בהלכות ובמנהגים
                    </div>
                    <div class="score-display">ציון: ${score} מתוך ${questions.length} (${percentage}%)</div>
                    <div class="achievement">${achievement}</div>
                    <div class="certificate-date">ניתן בתאריך: ${dateString}</div>
                    <div class="stamp">מאושר<br>רשמית</div>
                </div>
                <br>
                <div style="text-align: center;">
                    <button class="button" onclick="window.print()">הדפס תעודה</button>
                    <button class="button" onclick="window.location.reload()">חזרה לתחילת המבחן</button>
                </div>
            `;
            
            quizContent.innerHTML = html;
        }

        // Show intro on page load
        document.addEventListener("DOMContentLoaded", showIntro);
    </script>
</body>
</html>
