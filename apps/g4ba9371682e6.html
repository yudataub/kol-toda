<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>משחק קריאת שמע — מצאי את המקום הנכון</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Heebo:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #101b36;
    --bg-deep: #0a1327;
    --panel: #17264a;
    --panel-2: #1d2e58;
    --gold: #e7bb56;
    --gold-soft: #f3d999;
    --parchment: #f6efe0;
    --parchment-dim: #cdd3e6;
    --a: #ef7f66;
    --a-soft: #f6b39f;
    --b: #3fc2b0;
    --b-soft: #9be3d8;
    --g: #b78ae8;
    --g-soft: #d9c1f5;
    --line: rgba(231,187,86,0.25);
    --ok: #6bd06b;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    font-family:'Heebo',sans-serif;
    direction:rtl;
    color: var(--parchment);
    background:
      radial-gradient(ellipse 60% 40% at 15% 0%, rgba(231,187,86,0.10), transparent 60%),
      radial-gradient(ellipse 50% 40% at 100% 10%, rgba(63,194,176,0.08), transparent 60%),
      linear-gradient(180deg, var(--bg-deep) 0%, var(--bg) 14%, var(--bg) 100%);
    min-height:100vh;
    overflow-x:hidden;
    user-select:none;
  }

  /* -------- header -------- */
  header{ text-align:center; padding: 30px 16px 10px; }
  .eyebrow{
    display:inline-block; font-weight:700; letter-spacing:.13em; font-size:12px;
    color: var(--gold); background: rgba(231,187,86,0.08); border:1px solid var(--line);
    padding:5px 16px; border-radius:999px; margin-bottom:14px;
  }
  h1{
    font-family:'Frank Ruhl Libre',serif; font-weight:900;
    font-size: clamp(24px,5vw,36px); margin:0 0 6px; color:var(--parchment);
  }
  h1 em{ font-style:normal; color:var(--gold); }
  .instructions{
    max-width:520px; margin: 8px auto 0; color:var(--parchment-dim); font-size:14.5px; line-height:1.6;
  }

  /* -------- parasha tabs / progress -------- */
  .tabs{
    display:flex; justify-content:center; gap:10px; margin: 22px auto 0; max-width: 640px; padding: 0 16px;
  }
  .tab{
    flex:1; text-align:center; padding:10px 8px; border-radius:14px;
    background: var(--panel); border:1px solid var(--line);
    font-weight:700; font-size:13.5px; color: var(--parchment-dim);
    position:relative; transition: all .25s ease;
  }
  .tab.active{ background: linear-gradient(135deg,var(--panel-2),var(--panel)); color: var(--gold-soft); border-color: var(--gold); box-shadow: 0 8px 20px rgba(0,0,0,.3); }
  .tab .dots{ display:flex; gap:5px; justify-content:center; margin-top:7px; }
  .tab .dots i{ width:7px;height:7px;border-radius:50%; background: rgba(255,255,255,.15); display:block; }
  .tab .dots i.done{ background: var(--ok); }
  .tab .dots i.cur{ background: var(--gold); }

  /* -------- stage -------- */
  #stage{ max-width: 680px; margin: 26px auto; padding: 0 16px 60px; position:relative; }

  .group-card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 22px 20px 26px;
    box-shadow: 0 20px 50px rgba(0,0,0,.35);
    animation: fadeIn .35s ease;
  }
  @keyframes fadeIn{ from{ opacity:0; transform: translateY(10px);} to{opacity:1; transform:none;} }

  .group-title{ display:flex; align-items:center; gap:12px; margin-bottom:20px; }
  .group-title .ico{
    font-size:22px; width:42px; height:42px; border-radius:12px; flex:none;
    display:flex; align-items:center; justify-content:center; background: rgba(231,187,86,.12);
  }
  .group-title h2{ font-family:'Frank Ruhl Libre'; font-weight:700; font-size:19px; margin:0; color:var(--gold-soft); }
  .group-title .sub{ font-size:11.5px; color:var(--parchment-dim); font-weight:400; }

  .slots{ display:grid; grid-template-columns: repeat(3,1fr); gap:12px; margin-bottom: 22px; }
  .slot{
    min-height: 96px;
    border-radius:16px;
    border: 2.5px dashed rgba(255,255,255,.18);
    background: rgba(255,255,255,.02);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 10px 8px;
    position:relative;
    transition: border-color .18s ease, background .18s ease, transform .12s ease;
  }
  .slot .label{
    position:absolute; top:8px; font-size:10.5px; font-weight:700; letter-spacing:.05em;
    color: var(--parchment-dim); opacity:.7;
  }
  .slot[data-part="0"] .label{ color: var(--a-soft); }
  .slot[data-part="1"] .label{ color: var(--b-soft); }
  .slot[data-part="2"] .label{ color: var(--g-soft); }
  .slot.hover{ border-color: var(--gold); background: rgba(231,187,86,.08); transform: scale(1.03); }
  .slot.filled{ border-style: solid; }
  .slot[data-part="0"].filled{ border-color: var(--a); background: rgba(239,127,102,.10); }
  .slot[data-part="1"].filled{ border-color: var(--b); background: rgba(63,194,176,.10); }
  .slot[data-part="2"].filled{ border-color: var(--g); background: rgba(183,138,232,.10); }
  .slot .check{ position:absolute; top:6px; left:8px; font-size:14px; opacity:0; transition: opacity .2s; }
  .slot.filled .check{ opacity:1; }

  .tray{ display:grid; grid-template-columns: repeat(3,1fr); gap:12px; min-height: 96px; }
  .card{
    border-radius:14px; padding:14px 10px;
    background: linear-gradient(160deg, var(--panel-2), var(--panel));
    border:1px solid var(--line);
    box-shadow: 0 8px 18px rgba(0,0,0,.3);
    display:flex; align-items:center; justify-content:center; text-align:center;
    font-family:'Frank Ruhl Libre'; font-weight:500; font-size: 16px; line-height:1.6;
    color: var(--parchment);
    cursor: grab;
    touch-action: none;
    min-height: 96px;
  }
  .card:active{ cursor:grabbing; }
  .card.dragging{
    position: fixed; z-index: 500; pointer-events:none;
    box-shadow: 0 22px 40px rgba(0,0,0,.5);
    transition: none !important;
    opacity: .97;
  }
  .card.returning{ transition: left .28s cubic-bezier(.2,.8,.3,1.2), top .28s cubic-bezier(.2,.8,.3,1.2); }
  .card.snapping{ transition: left .25s ease, top .25s ease; }
  .card.placed{ position:static !important; box-shadow:none; cursor:default; opacity:.98; }
  .card.wrong-shake{ animation: shake .35s ease; }
  @keyframes shake{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  .placeholder{ visibility:hidden; }

  .next-hint{
    text-align:center; margin-top:18px; font-size:13.5px; color: var(--ok); font-weight:700;
    opacity:0; transition:opacity .3s;
  }
  .next-hint.show{ opacity:1; }

  /* -------- interstitial -------- */
  .overlay{
    position:fixed; inset:0; z-index:900;
    background: rgba(8,13,28,.88);
    backdrop-filter: blur(4px);
    display:flex; align-items:center; justify-content:center;
    padding: 20px;
    opacity:0; pointer-events:none; transition: opacity .3s;
  }
  .overlay.show{ opacity:1; pointer-events:all; }
  .overlay-card{
    background: linear-gradient(160deg,var(--panel-2),var(--panel));
    border:1px solid var(--gold); border-radius: 26px;
    padding: 40px 32px; max-width: 420px; text-align:center;
    box-shadow: 0 30px 80px rgba(0,0,0,.6);
    transform: scale(.9); transition: transform .3s;
  }
  .overlay.show .overlay-card{ transform: scale(1); }
  .overlay-emoji{ font-size:56px; margin-bottom:10px; }
  .overlay-card h2{ font-family:'Frank Ruhl Libre'; font-size:26px; color:var(--gold-soft); margin: 0 0 10px; }
  .overlay-card p{ color:var(--parchment-dim); font-size:14.5px; line-height:1.6; margin: 0 0 24px; }
  .btn{
    display:inline-block; font-family:'Heebo'; font-weight:700; font-size:15px;
    background: var(--gold); color: var(--bg-deep); border:none; border-radius: 999px;
    padding: 13px 30px; cursor:pointer; box-shadow: 0 10px 24px rgba(231,187,86,.3);
    transition: transform .15s ease;
  }
  .btn:hover{ transform: translateY(-2px); }
  .btn.ghost{ background: transparent; border: 1.5px solid var(--gold); color: var(--gold-soft); box-shadow:none; margin-inline-start:10px; }

  /* -------- explanation overlay -------- */
  .explain-overlay{ align-items:flex-start; padding: 20px 12px; overflow-y:auto; }
  .explain-card{
    background: linear-gradient(160deg,var(--panel-2),var(--panel));
    border:1px solid var(--gold); border-radius: 24px;
    max-width: 620px; width:100%; margin: 20px auto;
    padding: 30px 26px 26px;
    box-shadow: 0 30px 80px rgba(0,0,0,.6);
    transform: scale(.95); transition: transform .3s;
    text-align: right;
  }
  .explain-overlay.show .explain-card{ transform: scale(1); }
  .explain-card.wide{ max-width: 880px; }

  /* -------- summary table -------- */
  .summary-head{ text-align:center; margin-bottom: 22px; }
  .summary-head .badge{
    display:inline-block; font-size:12px; font-weight:700; letter-spacing:.1em;
    color: var(--bg-deep); background: var(--gold); padding: 4px 14px; border-radius:999px; margin-bottom:12px;
  }
  .summary-head h2{ font-family:'Frank Ruhl Libre'; font-weight:900; font-size: 26px; margin:0 0 6px; color: var(--parchment); }
  .summary-head .sub{ font-family:'Frank Ruhl Libre'; font-size:16px; color: var(--gold-soft); }

  .summary-legend{
    display:flex; justify-content:center; gap:14px; margin-bottom: 20px; flex-wrap:wrap;
  }
  .summary-legend span{
    display:flex; align-items:center; gap:7px; font-size:12.5px; color: var(--parchment-dim);
  }
  .summary-legend i{ width:12px; height:12px; border-radius:50%; display:block; }
  .summary-legend i.a{ background: var(--a); } .summary-legend i.b{ background: var(--b); } .summary-legend i.g{ background: var(--g); }

  .table-scroll{ overflow-x:auto; padding-bottom: 4px; margin-bottom: 6px; }
  .summary-table{
    width:100%; min-width: 620px;
    border-collapse: separate; border-spacing: 0 10px;
  }
  .summary-table thead th{
    font-family:'Frank Ruhl Libre'; font-weight:700; font-size:13px; color: var(--gold-soft);
    padding: 0 12px 4px; text-align:center;
  }
  .summary-table thead th:first-child{ text-align:right; width: 30%; }
  .summary-table tbody tr{ background: rgba(255,255,255,.025); }
  .summary-table tbody tr td:first-child{
    border-radius: 12px 0 0 12px;
    text-align:right; padding-right: 16px;
  }
  .summary-table tbody tr td:last-child{ border-radius: 0 12px 12px 0; }
  .summary-table td{
    padding: 14px 10px; font-family:'Frank Ruhl Libre'; font-weight:500; font-size: 14.5px;
    color: var(--parchment); text-align:center; vertical-align:middle; line-height:1.55;
  }
  .summary-table td.topic{
    font-weight:700; color: var(--gold-soft); font-size:14px; white-space:nowrap;
  }
  .summary-table td.topic .ico{ margin-inline-end:6px; }
  .summary-table td.a{ background: rgba(239,127,102,.09); border-top:2px solid var(--a); border-bottom:2px solid var(--a); }
  .summary-table td.b{ background: rgba(63,194,176,.09); border-top:2px solid var(--b); border-bottom:2px solid var(--b); }
  .summary-table td.g{ background: rgba(183,138,232,.09); border-top:2px solid var(--g); border-bottom:2px solid var(--g); }

  .summary-continue{ text-align:center; margin-top: 20px; }

  .explain-head{ text-align:center; margin-bottom: 20px; }
  .explain-head .badge{
    display:inline-block; font-size:12px; font-weight:700; letter-spacing:.1em;
    color: var(--bg-deep); background: var(--gold); padding: 4px 14px; border-radius:999px; margin-bottom:12px;
  }
  .explain-head h2{ font-family:'Frank Ruhl Libre'; font-weight:900; font-size: 26px; margin:0; color: var(--parchment); }
  .explain-head .preface-verse{
    font-family:'Frank Ruhl Libre'; font-weight:500; font-size: 15.5px; color: var(--gold-soft);
    margin-top: 10px; line-height:1.6;
  }

  .verse-box{
    background: rgba(231,187,86,.08);
    border: 1.5px solid var(--gold);
    border-radius: 16px;
    padding: 18px 20px;
    text-align:center;
    margin: 18px 0;
  }
  .verse-box p{
    font-family:'Frank Ruhl Libre'; font-weight:700; font-size: 22px; color: var(--gold-soft); margin:0; line-height:1.6;
  }
  .verse-note{
    text-align:center; font-size:13px; color: var(--parchment-dim); margin: -10px 0 18px; font-style: italic;
  }

  .intro-box{
    background: rgba(255,255,255,.03);
    border-right: 4px solid var(--b);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 18px;
  }
  .intro-box p{ margin:0; font-size:14.5px; line-height:1.8; color: var(--parchment-dim); }

  .klali-label{
    font-size: 12.5px; font-weight:700; color: var(--gold); letter-spacing:.05em;
    margin: 22px 0 4px; display:flex; align-items:center; gap:8px;
  }
  .klali-label::before{ content:"›"; font-size:16px; }
  .klali-text{ font-family:'Frank Ruhl Libre'; font-weight:700; font-size:17px; color:var(--parchment); margin: 0 0 18px; }

  .subtopics-label{ font-size:12.5px; font-weight:700; color: var(--parchment-dim); letter-spacing:.05em; margin-bottom: 12px; }

  .part-block{
    border-radius: 14px;
    padding: 14px 16px 16px;
    margin-bottom: 12px;
    background: rgba(255,255,255,.025);
    border-top: 3px solid var(--a);
  }
  .part-block.b{ border-top-color: var(--b); }
  .part-block.g{ border-top-color: var(--g); }
  .part-block .row1{ display:flex; align-items:center; gap:10px; margin-bottom:6px; flex-wrap:wrap; }
  .part-block .num{
    font-size:11px; font-weight:700; padding:3px 10px; border-radius:999px;
    color: var(--bg-deep); background: var(--a-soft);
  }
  .part-block.b .num{ background: var(--b-soft); }
  .part-block.g .num{ background: var(--g-soft); }
  .part-block .phrase{ font-family:'Frank Ruhl Libre'; font-weight:700; font-size:17px; color: var(--parchment); }
  .part-block .subtitle{ font-size: 13px; color: var(--gold-soft); font-weight:700; margin-bottom:8px; }
  .part-block ul{ margin:0; padding-inline-start: 20px; }
  .part-block li{ font-size: 13.5px; line-height:1.75; color: var(--parchment-dim); margin-bottom:4px; }

  .goal-box{
    background: rgba(63,194,176,.07);
    border-right: 4px solid var(--b);
    border-radius: 12px;
    padding: 16px 18px;
    margin: 20px 0 6px;
  }
  .goal-box .goal-title{
    font-family:'Frank Ruhl Libre'; font-weight:700; font-size:15.5px; color: var(--b-soft); margin-bottom:10px;
  }
  .goal-box .goal-item{ font-size:13.5px; line-height:1.75; color: var(--parchment-dim); margin-bottom:8px; }
  .goal-box .goal-item:last-child{ margin-bottom:0; }
  .goal-box .goal-item strong{ color: var(--parchment); }

  .checklist-title{
    font-family:'Frank Ruhl Libre'; font-weight:700; font-size:16px; color: var(--gold-soft);
    margin: 22px 0 12px; display:flex; align-items:center; gap:8px;
  }
  .check-item{
    display:flex; align-items:flex-start; gap:10px; cursor:pointer;
    background: rgba(255,255,255,.025); border-radius:12px; padding:10px 12px; margin-bottom:8px;
    transition: background .15s ease;
  }
  .check-item:hover{ background: rgba(255,255,255,.05); }
  .check-item .box{
    width:20px; height:20px; border-radius:6px; border:2px solid var(--gold); flex:none; margin-top:1px;
    display:flex; align-items:center; justify-content:center; font-size:13px; color: var(--bg-deep);
    transition: background .15s ease;
  }
  .check-item.checked .box{ background: var(--gold); }
  .check-item span.txt{ font-size: 13.5px; line-height:1.65; color: var(--parchment-dim); transition: color .15s ease; }
  .check-item.checked span.txt{ color: var(--parchment-dim); text-decoration: line-through; opacity:.7; }

  .explain-continue{ text-align:center; margin-top: 24px; }

  .confetti{ position:fixed; top:-20px; z-index:950; font-size: 22px; pointer-events:none; animation: fall linear forwards; }
  @keyframes fall{ to{ transform: translateY(105vh) rotate(360deg); opacity: .3; } }

  footer{ text-align:center; color:var(--parchment-dim); font-size:12.5px; padding: 10px 20px 30px; }
</style>
</head>
<body>

<header>
  <span class="eyebrow">משחק למידה</span>
  <h1>מִי שַׁיָּךְ לְאָן? <em>גררי את הכרטיסים</em></h1>
  <p class="instructions">בכל נושא יש שלושה כרטיסים. גררי כל כרטיס לתא הנכון — חלק א, חלק ב או חלק ג. כשכל הכרטיסים במקום, עוברים אוטומטית לנושא הבא.</p>
</header>

<div class="tabs" id="tabs"></div>

<div id="stage"></div>

<div class="overlay" id="overlay">
  <div class="overlay-card">
    <div class="overlay-emoji" id="overlayEmoji">🎉</div>
    <h2 id="overlayTitle"></h2>
    <p id="overlayText"></p>
    <button class="btn" id="overlayBtn"></button>
  </div>
</div>

<div class="overlay explain-overlay" id="explainOverlay">
  <div class="explain-card" id="explainCard"></div>
</div>

<div class="overlay explain-overlay" id="summaryOverlay">
  <div class="explain-card wide" id="summaryCard"></div>
</div>

<footer>שלושה חלקים, קשר אחד — קריאת שמע ❤</footer>

<script>
/* ================== DATA ================== */
const PARASHOT = [
  {
    name: "פרשה ראשונה",
    subtitle: "וְאָהַבְתָּ",
    groups: [
      { icon:"💛", title:"אֵיךְ אוֹהֲבִים אֶת ה׳", sub:"שלוש דרגות של אהבה",
        items:["בְּכָל לְבָבְךָ","וּבְכָל נַפְשְׁךָ","וּבְכָל מְאֹדֶךָ"] },
      { icon:"📜", title:"הַמִּצְוָה שֶׁעַל הַלֵּב", sub:"והיו הדברים האלה...",
        items:["אֲשֶׁר אָנֹכִי מְצַוְּךָ","הַיּוֹם","עַל לְבָבֶךָ"] },
      { icon:"👨‍👩‍👧", title:"מָתַי מְלַמְּדִים אֶת הַיְלָדִים", sub:"ושננתם לבניך ודברת בם",
        items:["בְּשִׁבְתְּךָ בְּבֵיתֶךָ","וּבְלֶכְתְּךָ בַדֶּרֶךְ","וּבְשָׁכְבְּךָ וּבְקוּמֶךָ"] },
      { icon:"✋", title:"הַפְּעֻלּוֹת הַמַּעֲשִׂיּוֹת", sub:"תפילין ומזוזה",
        items:["וּקְשַׁרְתָּם לְאוֹת עַל יָדֶךָ","וְהָיוּ לְטֹטָפֹת בֵּין עֵינֶיךָ","וּכְתַבְתָּם עַל מְזֻזוֹת בֵּיתֶךָ וּבִשְׁעָרֶיךָ"] },
    ]
  },
  {
    name: "פרשה שנייה",
    subtitle: "וְהָיָה אִם שָׁמֹעַ",
    groups: [
      { icon:"💛", title:"הַדֶּרֶךְ לְקִיּוּם הַמִּצְווֹת", sub:"וְהָיָה אִם שָׁמֹעַ תִּשְׁמְעוּ אֶל מִצְוֹתַי אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם",

/* ================== SOUND ================== */
let actx;
function ctx(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); return actx; }
function tone(freq, start, dur, type='sine', gain=0.16){
  const c = ctx();
  const o = c.createOscillator();
  const g = c.createGain();
  o.type = type; o.frequency.value = freq;
  o.connect(g); g.connect(c.destination);
  const t0 = c.currentTime + start;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gain, t0 + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function playCorrect(){ tone(880,0,.16,'sine',.15); tone(1318.5,.09,.22,'sine',.14); }
function playGroupDone(){ tone(659,0,.12,'sine',.13); tone(880,.1,.12,'sine',.13); tone(1318.5,.2,.28,'sine',.15); }
function playWrong(){ tone(220,0,.12,'sine',.08); }
function playClick(){ tone(740,0,.07,'sine',.09); }

/* ================== STATE ================== */
let pIndex = 0, gIndex = 0;
const progress = PARASHOT.map(p => p.groups.map(()=>false));

/* ================== RENDER TABS ================== */
function renderTabs(){
  const wrap = document.getElementById('tabs');
  wrap.innerHTML = '';
  PARASHOT.forEach((p, pi) => {
    const tab = document.createElement('div');
    tab.className = 'tab' + (pi===pIndex ? ' active' : '');
    tab.innerHTML = `${p.name}<div class="dots">${p.groups.map((_,gi)=>{
      let cls = '';
      if(progress[pi][gi]) cls='done';
      else if(pi===pIndex && gi===gIndex) cls='cur';
      return `<i class="${cls}"></i>`;
    }).join('')}</div>`;
    wrap.appendChild(tab);
  });
}

/* ================== GAME RENDER ================== */
function shuffleOnce(arr){
  const a = arr.map((t,i)=>({t,i}));
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

// remembers the last order shown for each group, and guarantees a different order next time
const lastOrderByGroup = {};
function shuffled(arr, groupKey){
  const lastSig = lastOrderByGroup[groupKey];
  let a, sig, tries = 0;
  do{
    a = shuffleOnce(arr);
    sig = a.map(o=>o.i).join(',');
    tries++;
  } while (sig === lastSig && tries < 25);
  lastOrderByGroup[groupKey] = sig;
  return a;
}

function renderGroup(){
  renderTabs();
  const parasha = PARASHOT[pIndex];
  const group = parasha.groups[gIndex];
  const stage = document.getElementById('stage');

  const order = shuffled(group.items, pIndex+'-'+gIndex);

  stage.innerHTML = `
    <div class="group-card">
      <div class="group-title">
        <span class="ico">${group.icon}</span>
        <div>
          <h2>${group.title}</h2>
          ${group.sub ? `<div class="sub">${group.sub}</div>` : ''}
        </div>
      </div>
      <div class="slots" id="slots">
        ${[0,1,2].map(i => `
          <div class="slot" data-part="${i}" data-filled="0">
            <span class="label">${PART_LABELS[i]}</span>
            <span class="check">✅</span>
          </div>`).join('')}
      </div>
      <div class="tray" id="tray"></div>
      <div class="next-hint" id="nextHint">כל הכבוד! עוברים לנושא הבא...</div>
    </div>
  `;

  const tray = document.getElementById('tray');
  order.forEach(o => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.answer = o.i; // correct part index
    card.textContent = o.t;
    tray.appendChild(card);
    attachDrag(card);
  });
}

/* ================== DRAG LOGIC ================== */
let dragCard = null, offX=0, offY=0, placeholder=null, homeParent=null, homeNextSibling=null;

function attachDrag(card){
  card.addEventListener('pointerdown', (e) => {
    if(card.classList.contains('placed')) return;
    dragCard = card;
    const rect = card.getBoundingClientRect();
    offX = e.clientX - rect.left;
    offY = e.clientY - rect.top;

    // placeholder keeps the tray slot's size while dragging
    placeholder = document.createElement('div');
    placeholder.className = 'card placeholder';
    placeholder.style.width = rect.width+'px';
    placeholder.style.height = rect.height+'px';
    homeParent = card.parentNode;
    homeNextSibling = card.nextSibling;
    homeParent.insertBefore(placeholder, card);

    card.classList.add('dragging');
    card.style.width = rect.width+'px';
    card.style.left = rect.left+'px';
    card.style.top = rect.top+'px';
    document.body.appendChild(card);
    card.setPointerCapture(e.pointerId);
  });

  card.addEventListener('pointermove', (e) => {
    if(dragCard !== card) return;
    card.style.left = (e.clientX - offX) + 'px';
    card.style.top = (e.clientY - offY) + 'px';

    document.querySelectorAll('.slot').forEach(s => s.classList.remove('hover'));
    card.style.pointerEvents = 'none';
    const under = document.elementFromPoint(e.clientX, e.clientY);
    card.style.pointerEvents = '';
    const slot = under && under.closest('.slot');
    if(slot && slot.dataset.filled === '0') slot.classList.add('hover');
  });

  card.addEventListener('pointerup', (e) => {
    if(dragCard !== card) return;
    document.querySelectorAll('.slot').forEach(s => s.classList.remove('hover'));

    card.style.pointerEvents = 'none';
    const under = document.elementFromPoint(e.clientX, e.clientY);
    card.style.pointerEvents = '';
    const slot = under && under.closest('.slot');

    if(slot && slot.dataset.filled === '0' && slot.dataset.part === card.dataset.answer){
      // correct!
      const r = slot.getBoundingClientRect();
      card.classList.add('snapping');
      card.style.left = (r.left + (r.width-card.offsetWidth)/2) + 'px';
      card.style.top = (r.top + (r.height-card.offsetHeight)/2) + 'px';
      slot.dataset.filled = '1';
      slot.classList.add('filled');
      playCorrect();
      setTimeout(() => {
        card.classList.remove('dragging','snapping');
        card.classList.add('placed');
        card.style.position='static'; card.style.left=''; card.style.top=''; card.style.width='';
        slot.appendChild(card);
        placeholder.remove();
        checkGroupComplete();
      }, 260);
    } else if(slot && slot.dataset.filled === '0'){
      // wrong slot
      playWrong();
      returnCard(card);
      card.classList.add('wrong-shake');
      setTimeout(()=>card.classList.remove('wrong-shake'), 400);
    } else {
      // dropped nowhere useful
      returnCard(card);
    }
    dragCard = null;
  });

  card.addEventListener('pointercancel', () => { if(dragCard===card){ returnCard(card); dragCard=null; } });
}

function returnCard(card){
  const r = placeholder.getBoundingClientRect();
  card.classList.add('returning');
  card.style.left = r.left+'px';
  card.style.top = r.top+'px';
  setTimeout(() => {
    card.classList.remove('dragging','returning');
    card.style.position='static'; card.style.left=''; card.style.top=''; card.style.width='';
    homeParent.insertBefore(card, homeNextSibling);
    placeholder.remove();
  }, 280);
}

function checkGroupComplete(){
  const allFilled = [...document.querySelectorAll('.slot')].every(s => s.dataset.filled==='1');
  if(!allFilled) return;
  progress[pIndex][gIndex] = true;
  renderTabs();
  playGroupDone();
  spawnConfetti(16);

  const key = pIndex+'-'+gIndex;
  const explanation = EXPLANATIONS[key];

  if(explanation){
    setTimeout(() => showExplanation(explanation), 500);
  } else {
    document.getElementById('nextHint').classList.add('show');
    setTimeout(() => { advance(); }, 1100);
  }
}

    ` : ''}
    <div class="checklist-title">${data.checklistTitle || '✅ נקודות לביצוע'}</div>
    ${data.checklist.map(t => `
      <div class="check-item" onclick="this.classList.toggle('checked'); playClick();">
        <span class="box">✓</span>
        <span class="txt">${t}</span>
      </div>
    `).join('')}
    <div class="explain-continue">
      <button class="btn" onclick="closeExplanation();">המשך למשחק ←</button>
    </div>
  `;
  document.getElementById('explainOverlay').classList.add('show');
}

function closeExplanation(){
  document.getElementById('explainOverlay').classList.remove('show');
  advance();
}

function advance(){
  const parasha = PARASHOT[pIndex];
  if(gIndex < parasha.groups.length - 1){
    gIndex++;
    renderGroup();
  } else {
    showSummary(pIndex);
  }
}

/* ================== SUMMARY TABLE ================== */
function showSummary(finishedPIndex){
  const parasha = PARASHOT[finishedPIndex];
  const card = document.getElementById('summaryCard');

  const rows = parasha.groups.map(g => `
    <tr>
      <td class="topic"><span class="ico">${g.icon}</span>${g.title}</td>
      <td class="a">${g.items[0]}</td>
      <td class="b">${g.items[1]}</td>
      <td class="g">${g.items[2]}</td>
    </tr>
  `).join('');

  card.innerHTML = `
    <div class="summary-head">
      <span class="badge">סיכום</span>
      <h2>מבנה ${parasha.name}</h2>
      <div class="sub">${parasha.subtitle}</div>
    </div>
    <div class="summary-legend">
      <span><i class="a"></i> חלק א</span>
      <span><i class="b"></i> חלק ב</span>
      <span><i class="g"></i> חלק ג</span>
    </div>
    <div class="table-scroll">
      <table class="summary-table">
        <thead>
          <tr><th>נושא</th><th>חלק א</th><th>חלק ב</th><th>חלק ג</th></tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="summary-continue">
      <button class="btn" id="summaryBtn"></button>
    </div>
  `;

  const btn = document.getElementById('summaryBtn');
  if(finishedPIndex < PARASHOT.length - 1){
    btn.textContent = `להתחיל את ${PARASHOT[finishedPIndex+1].name} ←`;
    btn.onclick = () => {
      document.getElementById('summaryOverlay').classList.remove('show');
      pIndex++; gIndex=0; renderGroup();
    };
  } else {
    btn.textContent = 'סיימתי — לחגוג! 🏆';
    btn.onclick = () => {
      document.getElementById('summaryOverlay').classList.remove('show');
      showOverlay('all-done');
    };
  }

  document.getElementById('summaryOverlay').classList.add('show');
  spawnConfetti(20);
}

/* ================== OVERLAYS ================== */
function showOverlay(kind){
  const ov = document.getElementById('overlay');
  const emoji = document.getElementById('overlayEmoji');
  const title = document.getElementById('overlayTitle');
  const text = document.getElementById('overlayText');
  const btn = document.getElementById('overlayBtn');

  emoji.textContent = '🏆';
  title.textContent = 'סיימת את כל המשחק!';
  text.textContent = 'הצלחת לחבר את כל שלושת החלקים בכל נושא, בשתי הפרשות של קריאת שמע. יישר כח!';
  btn.textContent = 'לשחק שוב מההתחלה';
  btn.onclick = () => { pIndex=0; gIndex=0; progress.forEach(p=>p.fill(false)); hideOverlay(); renderGroup(); };

  ov.classList.add('show');
  spawnConfetti(28);
}
function hideOverlay(){ document.getElementById('overlay').classList.remove('show'); }

function spawnConfetti(n){
  const emojis = ['🎉','⭐','✨','💛','🌸'];
  for(let i=0;i<n;i++){
    const el = document.createElement('div');
    el.className = 'confetti';
    el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    el.style.left = Math.random()*100+'vw';
    el.style.animationDuration = (2.2+Math.random()*1.6)+'s';
    el.style.fontSize = (16+Math.random()*14)+'px';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 4000);
  }
}

/* ================== INIT ================== */
renderGroup();
</script>
