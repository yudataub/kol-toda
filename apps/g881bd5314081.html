            let startTime = audioContext.currentTime;

                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = freq;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.3, startTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + durations[index]);
                
                oscillator.start(startTime);
                oscillator.stop(startTime + durations[index]);
                
                startTime += durations[index];
            });
        }

        function startGame() {
            currentLesson = 0;
            totalScore = 0;
            renderLesson();
        }

        function renderLesson() {
            if (currentLesson >= lessons.length) {
                renderCertificate();
                return;
            }

            lessonScore = 0;
            questionsAnswered = 0;
            correctAnswers = 0;

            const lesson = lessons[currentLesson];
            const container = document.getElementById('gameContainer');
            
            const progressPercent = ((currentLesson + 1) / lessons.length) * 100;
            
            container.innerHTML = `
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${progressPercent}%">
                        שִׁיעוּר ${currentLesson + 1} מִתּוֹךְ ${lessons.length}
                    </div>
                </div>
                
                <h2>${lesson.title}</h2>
                
                <div class="lesson-content">
                    ${lesson.content}
                </div>
                
                <div class="score-display">
                    נִקּוּד: ${totalScore} נְקֻדּוֹת ⭐
                </div>
                
                <div id="questionsArea"></div>
            `;

            renderQuestion(0);
        }

        function shuffle(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function renderQuestion(questionIndex) {
            const lesson = lessons[currentLesson];
            if (questionIndex >= lesson.questions.length) {
                checkLessonComplete();
                return;
            }

            const question = lesson.questions[questionIndex];
            const questionsArea = document.getElementById('questionsArea');
            
            // ערבוב התשובות
            const shuffledAnswers = question.answers.map((answer, index) => ({
                text: answer,
                originalIndex: index
            }));
            
            // Fisher-Yates shuffle
            for (let i = shuffledAnswers.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffledAnswers[i], shuffledAnswers[j]] = [shuffledAnswers[j], shuffledAnswers[i]];
            }
            
            let buttonsHtml = '';
            shuffledAnswers.forEach((item, index) => {
                buttonsHtml += `
                    <button class="answer-btn" onclick="checkAnswer(${questionIndex}, ${item.originalIndex})">
                        ${item.text}
                    </button>
                `;
            });
            
            questionsArea.innerHTML = `
                <div class="question-container">
                    <div class="question-text">
                        שְׁאֵלָה ${questionIndex + 1} מִתּוֹךְ ${lesson.questions.length}: ${question.question}
                    </div>
                    ${buttonsHtml}
                    <div id="feedback-${questionIndex}"></div>
                </div>
            `;
        }

        function checkAnswer(questionIndex, answerIndex) {
            const lesson = lessons[currentLesson];
            const question = lesson.questions[questionIndex];
            const feedbackDiv = document.getElementById(`feedback-${questionIndex}`);
            
            // Disable all buttons
            const buttons = document.querySelectorAll('.answer-btn');
            buttons.forEach(btn => btn.disabled = true);
            
            const isCorrect = answerIndex === question.correct;
            questionsAnswered++;
            
            if (isCorrect) {
                correctAnswers++;
                lessonScore += 10;
                totalScore += 10;
                correctSound();
                
                const encouragements = [
                    'מְצֻיָּן! ⭐',
                    'נִפְלָא! 💪',
                    'כָּל הַכָּבוֹד! 🎯',
                    'פַּצְצָה! 🌟',
                    'אֶלּוּף! 🏆'
                ];
                const randomEncouragement = encouragements[Math.floor(Math.random() * encouragements.length)];
                
                const loveMessages = [
                    'הַשֵּׁם שָׂמֵחַ כְּשֶׁאַתָּה לוֹמֵד! 💖',
                    'הַשֵּׁם אוֹהֵב אוֹתְךָ! 💕',
                    'הַשֵּׁם גֵּאֶה בְּךָ! 🌟',
                    'אַתָּה מְאִיר אֶת הָעוֹלָם! ✨'
                ];
                const randomLove = loveMessages[Math.floor(Math.random() * loveMessages.length)];
                
                feedbackDiv.innerHTML = `
                    <div class="feedback correct">
                        <p style="font-size: 1.4em; font-weight: bold;">${randomEncouragement}</p>
                        <p>${question.explanation}</p>
                        <p style="font-size: 1.2em; margin-top: 15px;">${randomLove}</p>
                    </div>
                `;
            } else {
                feedbackDiv.innerHTML = `
                    <div class="feedback incorrect">
                        <p style="font-size: 1.4em; font-weight: bold;">לֹא בְּדִיּוּק... 🤔</p>
                        <p>${question.explanation}</p>
                        <p style="font-size: 1.2em; margin-top: 15px;">גַּם כְּשֶׁטּוֹעִים - לוֹמְדִים! הַשֵּׁם אוֹהֵב אוֹתְךָ! 💡</p>
                    </div>
                `;
            }
            
            setTimeout(() => {
                renderQuestion(questionIndex + 1);
            }, 3500);
        }

        function checkLessonComplete() {
            const questionsArea = document.getElementById('questionsArea');
            const passed = correctAnswers >= 2;
            
            if (passed) {
                completeSound();
                
                const messages = [
                    'מַדְהִים! 🏆 אַתָּה שׁוֹלֵט! אַתָּה חַי בְּאַהֲבַת ה\'! 🎉',

                ];

                    <button class="btn-primary" onclick="renderLesson()">
                        נְנַסֶּה שׁוּב! 🔄
                    </button>
                `;
            }
        }

        function nextLesson() {
            currentLesson++;
            renderLesson();
