        function playTone(frequency, duration) {
            initAudio();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = frequency;
            oscillator.type = "sine";
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + duration);
        }

                        explanation: "כָּל הַכָּבוֹד! 🎉 אָדָם עָנָו מַכִּיר בְּגָדְלוּת הַשֵּׁם! הוּא יוֹדֵעַ שֶׁהַכֹּל מֵהַשֵּׁם, וְזֶה עוֹשֶׂה אוֹתוֹ שָׂמֵחַ וּמָלֵא הוֹדָיָה! הַשֵּׁם אוֹהֵב אוֹתְךָ! 💝🌈"
                    }
                ]
            }
        ];

        // שליחת ציונים ל-Google Sheets
        async function sendScoreToTeacher() {
            const now = new Date();
            const data = {
                name: userName,
                score: `${score}/12`,
                percentage: `${Math.round((score/12)*100)}%`,
                gameName: document.title,
                date: now.toLocaleDateString("he-IL"),
                time: now.toLocaleTimeString("he-IL")
            };
            
            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: "POST",
                    headers: {"Content-Type": "text/plain"},
                    body: JSON.stringify(data)
                });
                console.log("✅ הציון נשלח למורה!");
            } catch (error) {
                console.error("❌ שגיאה בשליחה:", error);
            }
        }

        // מסך פתיחה
        function renderIntro() {
            const container = document.getElementById("gameContainer");
            container.innerHTML = `
                <h1>🌟 יֵשׁ לִי כֹּל! 🌟</h1>
                <div class="intro-screen">
                    <h2>מַסַּע לְאַהֲבַת ה' דֶּרֶךְ פָּרָשַׁת וַיִּשְׁלַח 💖</h2>
                    <div class="intro-content">
                        <p>🎭 שָׁלוֹם חֲבֵרִים יְקָרִים! 💫</p>
                        <p>🌈 הַיּוֹם נֵלַךְ בְּמַסַּע מְיֻחָד עִם יַעֲקֹב אָבִינוּ וְנִלְמַד מִמֶּנּוּ אֵיךְ <span class="highlight">לִחְיוֹת בְּשִׂמְחָה</span> וּלְהַרְגִּישׁ שֶׁיֵּשׁ לָנוּ <strong>הַכֹּל!</strong> ✨</p>
                        <p>💖 כָּל שִׁיעוּר יֵשׁ בּוֹ חוֹכְמָה עֲמֻקָּה וְשִׂמְחָה גְּדוֹלָה! 🎯</p>
                        <p>🏆 אַחֲרֵי הַמִּשְׂחָק - תְּקַבְּלוּ תְּעוּדָה מְיֻחֶדֶת וְתִכָּנְסוּ לְהַגְרָלָה עַל פְּרָסִים! 🎁</p>
                        <p>🙏 בּוֹאוּ נִתְחִיל בְּאַהֲבַת ה' וּבְשִׂמְחָה! 🌟</p>
                    </div>
                    <button class="start-btn" onclick="startGame()">🚀 בּוֹא נַתְחִיל! 💫</button>
                </div>
            `;
        }

        // התחלת משחק
        function startGame() {
            userName = prompt("מָה שִׁמְךָ? 💫");
            if (!userName || userName.trim() === "") {
                userName = "תַּלְמִיד יָקָר";
            }
            currentLesson = 0;
            score = 0;
            renderLesson(0);
        }

        // הצגת שיעור
        function renderLesson(lessonIndex) {
            currentLesson = lessonIndex;
            currentQuestionIndex = 0;
            lessonScore = 0;
            answeredQuestions = [];
            
            const lesson = lessons[lessonIndex];
            const container = document.getElementById("gameContainer");
            
            const progress = ((lessonIndex) / lessons.length) * 100;
            
            container.innerHTML = `
                <h1>יֵשׁ לִי כֹּל! 💖</h1>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${progress}%">
                        ${Math.round(progress)}%
                    </div>
                </div>
                <div class="score-display">
                    שָׁלוֹם ${userName}! 💫 | נִקּוּד: ${score} 🌟
                </div>
                <div class="lesson-header">
                    <h2>${lesson.title}</h2>
                </div>
                <div class="lesson-content">
                    ${lesson.content}
                </div>
                <div class="inspiration-box">
                    ${lesson.inspiration}
                </div>
                <button class="next-btn" onclick="startQuestions()">🎯 בּוֹא נַתְחִיל לִשְׁאוֹל! 💪</button>
            `;
        }

        // התחלת שאלות
        function startQuestions() {
            showQuestion(0);
        }

        // הצגת שאלה
        function showQuestion(questionIndex) {
            currentQuestionIndex = questionIndex;
            const lesson = lessons[currentLesson];
            const question = lesson.questions[questionIndex];
            
            const shuffledAnswers = shuffleArray(question.answers.map((answer, index) => ({
                text: answer,
                originalIndex: index
            })));
            
            const container = document.getElementById("gameContainer");
            const progress = ((currentLesson * 4 + questionIndex) / 12) * 100;
            
            container.innerHTML = `
                <h1>יֵשׁ לִי כֹּל! 💖</h1>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${progress}%">
                        ${Math.round(progress)}%
                    </div>
                </div>
                <div class="score-display">
                    שָׁלוֹם ${userName}! 💫 | נִקּוּד: ${score} 🌟 | שְׁאֵלָה ${questionIndex + 1} מִתּוֹךְ 4
                </div>
                <div class="question-container">
                    <div class="question-text">${question.question}</div>
                    <div class="answers-grid">
                        ${shuffledAnswers.map((answer, index) => `
                            <button class="answer-btn" onclick="checkAnswer(${questionIndex}, ${answer.originalIndex})">
                                ${answer.text}
                            </button>
                        `).join("")}
                    </div>
                    <div id="feedback"></div>
                </div>
            `;
        }

        // בדיקת תשובה
        function checkAnswer(questionIndex, selectedAnswer) {
            const lesson = lessons[currentLesson];
            const question = lesson.questions[questionIndex];
            const isCorrect = selectedAnswer === question.correct;
            
            // נעילת כפתורים
            const buttons = document.querySelectorAll(".answer-btn");
            buttons.forEach((btn, index) => {
                btn.disabled = true;
                const answerIndex = parseInt(btn.onclick.toString().match(/checkAnswer\(\d+,\s*(\d+)\)/)[1]);
                if (answerIndex === question.correct) {
                    btn.classList.add("correct");
                } else if (answerIndex === selectedAnswer && !isCorrect) {
                    btn.classList.add("incorrect");
                }
            });
            
            // משוב
            const feedbackDiv = document.getElementById("feedback");
            
            if (isCorrect) {
                score++;
                lessonScore++;
                playCorrectSound();
                
                const encouragements = [
                    `מְצֻיָּן, ${userName}! ⭐`,
                    `נִפְלָא, ${userName}! 💪`,
                    `כָּל הַכָּבוֹד, ${userName}! 🎯`,
                    `מַדְהִים, ${userName}! 🌟`,
                    `פַּצָּצָה, ${userName}! 🎉`
                ];
                const randomEncouragement = encouragements[Math.floor(Math.random() * encouragements.length)];
                
                feedbackDiv.innerHTML = `
                    <div class="feedback correct">
                        <strong>${randomEncouragement}</strong><br><br>
                        ${question.explanation}<br><br>
                        💖 <strong>הַשֵּׁם שָׂמֵחַ כְּשֶׁאַתָּה לוֹמֵד בְּאַהֲבָה!</strong> ✨
                    </div>
                `;
            } else {
                feedbackDiv.innerHTML = `
                    <div class="feedback incorrect">
                        <strong>לֹא בְּדִיּוּק, ${userName}... 🤔</strong><br><br>
                        ${question.explanation}<br><br>
                        💡 <strong>גַּם כְּשֶׁטּוֹעִים - לוֹמְדִים! הַשֵּׁם אוֹהֵב אוֹתְךָ!</strong> 💖
                    </div>
                `;
            }
            
            answeredQuestions.push(questionIndex);
            
            // כפתור המשך
            setTimeout(() => {
                if (questionIndex < 3) {
                    feedbackDiv.innerHTML += `
                        <button class="next-btn" onclick="showQuestion(${questionIndex + 1})">
                            ➡️ שְׁאֵלָה הַבָּאָה
                        </button>
                    `;
                } else {
                    feedbackDiv.innerHTML += `
                        <button class="next-btn" onclick="finishLesson()">
                            🏁 סִיּוּם הַשִּׁיעוּר
                        </button>
                    `;
                }
            }, 500);
        }

        // סיום שיעור
        function finishLesson() {
            const container = document.getElementById("gameContainer");
            const passed = lessonScore >= 3;
            
            if (passed) {
                playCelebrationSound();
                const messages = [
                    `מַדְהִים, ${userName}! 🏆 אַתָּה שׁוֹלֵט! אַתָּה חַי בְּאַהֲבַת ה'! 🎉`,
                    `כִּמְעַט מֻשְׁלָם, ${userName}! 💪 מַמָּשׁ כְּמוֹ בְּאַהֲבָה - מַמְשִׁיךְ לִצְמֹחַ! 🌱`
                ];
                
                const message = lessonScore === 4 ? messages[0] : messages[1];
                
                container.innerHTML = `
                    <h1>יֵשׁ לִי כֹּל! 💖</h1>
                    <div class="lesson-header" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
                        <h2>🎉 כָּל הַכָּבוֹד! 🎉</h2>
                    </div>
                    <div class="lesson-content" style="text-align: center; font-size: 1.4em;">
                        <p>${message}</p>
                        <p style="font-size: 2.5em; margin: 30px 0;">
                            ${lessonScore}/4 ✨
                        </p>
                        <p>💖 הַשֵּׁם גֵּאֶה בְּךָ, ${userName}! 🌟</p>
                    </div>
                    <button class="next-btn" onclick="nextLesson()">
                        ${currentLesson < lessons.length - 1 ? "➡️ שִׁיעוּר הַבָּא" : "🏆 סִיּוּם הַמִּשְׂחָק"}
                    </button>
                `;
            } else {
                container.innerHTML = `
                    <h1>יֵשׁ לִי כֹּל! 💖</h1>
                    <div class="lesson-content" style="text-align: center;">
                        <p style="font-size: 1.4em;">בּוֹא נְנַסֶּה שׁוּב, ${userName}! 💪</p>
                        <p style="font-size: 1.2em;">בְּאַהֲבָה וּבְסַבְלָנוּת - נַצְלִיחַ! 💖</p>
                        <p style="font-size: 2em; margin: 30px 0;">
                            ${lessonScore}/4
                        </p>
                    </div>
                    <button class="next-btn" onclick="renderLesson(${currentLesson})">
                        🔄 נְנַסֶּה שׁוּב
                    </button>
                `;
            }
        }

        // שיעור הבא
        function nextLesson() {
            if (currentLesson < lessons.length - 1) {
                renderLesson(currentLesson + 1);
            } else {
                showCertificate();
            }
        }

        // תעודת סיום
        function showCertificate() {
            playCelebrationSound();
            sendScoreToTeacher();
            
            const percentage = Math.round((score / 12) * 100);
            const container = document.getElementById("gameContainer");
            
            container.innerHTML = `
                <div class="certificate">
                    <h2>🎓 תְּעוּדַת הִצְטַיְּנוּת 🎓</h2>
                    <p style="font-size: 1.4em;">מוֹעֲנֶקֶת בְּזֹאת לְ:</p>
                    <div class="student-name">💫 ${userName} 💫</div>
                    <p style="font-size: 1.3em;">שֶׁסִּיֵּם בְּהַצְלָחָה אֶת</p>
                    <p style="font-size: 1.4em; font-weight: bold;">מַסַּע ״יֵשׁ לִי כֹּל!״ 🌟</p>
                    <div class="score-big">${score}/12 🏆</div>
                    <p style="font-size: 1.5em; color: #2e7d32; font-weight: bold;">${percentage}%</p>
                    <div class="verse">
                        ״וְאָהַבְתָּ אֵת ה' אֱלֹקֶיךָ<br>
                        בְּכָל־לְבָבְךָ וּבְכָל־נַפְשְׁךָ<br>
                        וּבְכָל־מְאֹדֶךָ״<br>
                        💖✨
                    </div>
                    <div class="reflection-questions">
                        <h3>💭 שְׁאֵלוֹת לְמַחְשָׁבָה:</h3>
                        <ul>
                            <li>🌟 אֵיךְ אוּכַל לְהָבִיא יוֹתֵר אַהֲבַת ה' לַלִּמּוּד הַבָּא שֶׁלִּי?</li>
                            <li>💖 אֵיזוֹ מִצְוָה אֲנִי רוֹצֶה לְקַיֵּם הַיּוֹם מִתּוֹךְ שִׂמְחָה?</li>
                            <li>🙏 עַל אֵיזֶה חֶסֶד שֶׁל הַשֵּׁם אֲנִי רוֹצֶה לְהוֹדוֹת הַיּוֹם?</li>
                        </ul>
                    </div>
                    <div class="lottery-box">
                        <h3>🎉 מַזָּל טוֹב, ${userName}! 🎉</h3>
                        <p style="font-size: 1.2em;">נִכְנַסְתָּ לְהַגְרָלָה נוֹשֵׂאַת פְּרָסִים! 🎁</p>
                        <a href="https://forms.gle/A66uubei4XSX6SG2A" target="_blank">
                            📋 לְרִישׁוּם לַהַגְרָלָה - לְחַץ כָּאן!
                        </a>
                    </div>
                    <div class="contact-info">
                        <strong>נִבְנָה בְּאַהֲבָה עַל יְדֵי:</strong><br>
                        הָרַב יְהוּדָה טָאוּב מִקִּרְיַת אַתָּא<br>
                        📞 לִפְרָטִים: 0527139520
                    </div>
                </div>
            `;
        }

        // אתחול המשחק
        renderIntro();
    </script>
</body>
</html>
