        function playSound(frequencies, duration = 200) {
            frequencies.forEach((freq, index) => {
                setTimeout(() => {
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    oscillator.frequency.value = freq;
                    oscillator.type = "sine";
                    
                    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration / 1000);
                    
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + duration / 1000);
                }, index * duration);
            });
        }

        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

                gameName: document.title,
                date: now.toLocaleDateString("he-IL"),
                time: now.toLocaleTimeString("he-IL")
            };

            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify(data)

        }

        function startGame() {
            userName = prompt("מָה שִׁמְךָ? 💫");
            if (!userName || userName.trim() === "") {
                userName = "תַּלְמִיד יָקָר";
            }
            currentLesson = 0;
            score = 0;
            renderLesson(0);
        }

        function renderLesson(lessonIndex) {
            if (lessonIndex >= lessons.length) {
                showCertificate();
                return;
            }

            currentLesson = lessonIndex;
            currentQuestionIndex = 0;
            lessonScore = 0;
            answeredQuestions = [];

            const lesson = lessons[lessonIndex];
            const container = document.getElementById("gameContainer");

            const progressPercent = ((lessonIndex / lessons.length) * 100).toFixed(0);

            container.innerHTML = `
                <div class="lesson-screen">
                    <h1>🕎 מָדוּעַ שָׁרִים אַחֲרֵי הַדְלָקַת נֵרוֹת חֲנֻכָּה? 🎵</h1>
                    
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${progressPercent}%">
                            ${progressPercent}% הִשְׁלַמְנוּ! 🎯
                        </div>
                    </div>

                    <div class="score-display">
                        שָׁלוֹם ${userName}! 💖 הַצִּיּוּן שֶׁלְּךָ: ${score} / ${lessonIndex * 3} ⭐
                    </div>

                    <div class="lesson-title">${lesson.title}</div>

                    <div class="lesson-content">${lesson.content}</div>

                    <div class="inspiration-box">
                        💭 ${lesson.inspiration}
                    </div>

                    <div id="questionContainer"></div>
                </div>
            `;

            renderQuestion();
        }

        function renderQuestion() {
            const lesson = lessons[currentLesson];
            const question = lesson.questions[currentQuestionIndex];
            const container = document.getElementById("questionContainer");

            const shuffledAnswers = shuffleArray(
                question.answers.map((answer, index) => ({ text: answer, originalIndex: index }))
            );

            let answersHTML = "";
            shuffledAnswers.forEach((answer, displayIndex) => {
                answersHTML += `
                    <button class="answer-button" onclick="checkAnswer(${displayIndex}, ${answer.originalIndex})" id="answer-${displayIndex}">
                        ${answer.text}
                    </button>
                `;
            });

            container.innerHTML = `
                <div class="question-box">
                    <div class="question-text">
                        ❓ שְׁאֵלָה ${currentQuestionIndex + 1} מִתּוֹךְ 3:
                        <br><br>
                        ${question.question}
                    </div>
                    ${answersHTML}
                    <div id="feedbackContainer"></div>
                </div>
            `;
        }

        function checkAnswer(displayIndex, originalIndex) {
            if (answeredQuestions.includes(currentQuestionIndex)) {
                return;
            }

            answeredQuestions.push(currentQuestionIndex);

            const lesson = lessons[currentLesson];
            const question = lesson.questions[currentQuestionIndex];
            const isCorrect = originalIndex === question.correct;

            const allButtons = document.querySelectorAll(".answer-button");
            allButtons.forEach(btn => btn.disabled = true);

            const selectedButton = document.getElementById(`answer-${displayIndex}`);

            if (isCorrect) {
                selectedButton.classList.add("correct");
                score++;
                lessonScore++;
                playSound([261.63, 329.63, 392.00]);

                const encouragements = [
                    `מְצֻיָּן, ${userName}! ⭐`,
                    `נִפְלָא, ${userName}! 💪`,
                    `כָּל הַכָּבוֹד, ${userName}! 🎯`,
                    `פַּצְצָה, ${userName}! 🏆`
                ];
                const randomEncouragement = encouragements[Math.floor(Math.random() * encouragements.length)];

                const loveMessages = [
                    `הַשֵּׁם שָׂמֵחַ כְּשֶׁרוֹאֶה אֶת אַהֲבָתוֹ בְּלִבְּךָ, ${userName}! 💖`,
                    `הַשֵּׁם אוֹהֵב אוֹתְךָ וְגֵאֶה בְּךָ, ${userName}! 💕`,
                    `הַשֵּׁם נוֹתֵן לְךָ חִיּוּךְ מִשָּׁמַיִם, ${userName}! 🌟`
                ];
                const randomLove = loveMessages[Math.floor(Math.random() * loveMessages.length)];

                document.getElementById("feedbackContainer").innerHTML = `
                    <div class="feedback correct">
                        <strong>${randomEncouragement}</strong><br>
                        ${question.explanation}<br>
                        <em>${randomLove}</em>
                    </div>
                `;
            } else {
                selectedButton.classList.add("incorrect");

                document.getElementById("feedbackContainer").innerHTML = `
                    <div class="feedback incorrect">
                        <strong>לֹא בְּדִיּוּק, ${userName}... 🤔</strong><br>
                        ${question.explanation}<br>
                        <em>גַּם כְּשֶׁטּוֹעִים - לוֹמְדִים! הַשֵּׁם אוֹהֵב אוֹתְךָ, ${userName}! 💡</em>
                    </div>
                `;
            }

            setTimeout(() => {
                if (currentQuestionIndex < 2) {
                    currentQuestionIndex++;
                    renderQuestion();
                } else {
                    showLessonSummary();
                }
            }, 3500);
        }

        function showLessonSummary() {
            const container = document.getElementById("questionContainer");
            const passingScore = 2;

            if (lessonScore >= passingScore) {
                if (lessonScore === 3) {
                    playSound([523.25, 659.25, 783.99, 1046.50, 783.99, 659.25]);
                    container.innerHTML = `
                        <div class="feedback correct" style="font-size: 1.4em; padding: 30px;">
                            <strong>מַדְהִים, ${userName}! 🏆</strong><br>
                            עָנִית נָכוֹן עַל כָּל הַשְּׁאֵלוֹת! 🎉<br>
                            אַתָּה שׁוֹלֵט בַּחוֹמֶר! 💪<br>
                            אַתָּה חַי בְּאַהֲבַת ה'! 💖✨<br><br>
                            <button class="next-button" onclick="renderLesson(${currentLesson + 1})">
                                הַשִּׁיעוּר הַבָּא 🚀
                            </button>
                        </div>
                    `;
                } else {
                    playSound([523.25, 659.25, 783.99]);
                    container.innerHTML = `
                        <div class="feedback correct" style="font-size: 1.3em; padding: 25px;">
                            <strong>כִּמְעַט מוּשְׁלָם, ${userName}! 💪</strong><br>
                            עָנִית נָכוֹן עַל ${lessonScore} מִתּוֹךְ 3! 🌱<br>
                            מַמְשִׁיכִים לִצְמֹחַ בְּאַהֲבָה! 🌟<br><br>
                            <button class="next-button" onclick="renderLesson(${currentLesson + 1})">
                                הַשִּׁיעוּר הַבָּא 🚀
                            </button>
                        </div>
                    `;
                }
            } else {
                container.innerHTML = `
                    <div class="feedback incorrect" style="font-size: 1.3em; padding: 25px;">
                        <strong>בּוֹא נְנַסֶּה שׁוּב, ${userName}! 🤗</strong><br>
                        לִפְעָמִים צְרִיכִים עוֹד נִסָּיוֹן אֶחָד... 💡<br>
                        בְּאַהֲבָה וּבְסַבְלָנוּת - הַכֹּל אֶפְשָׁרִי! 💖<br><br>
                        <button class="retry-button" onclick="renderLesson(${currentLesson})">
                            נְנַסֶּה שׁוּב בְּאַהֲבָה 🔄
                        </button>
                    </div>
                `;
            }
        }

        function showCertificate() {
            playSound([523.25, 659.25, 783.99, 1046.50, 783.99, 659.25]);

            const finalPercentage = Math.round((score / 12) * 100);
            const container = document.getElementById("gameContainer");

            container.innerHTML = `
                <div class="certificate-screen">
                    <div class="certificate">
                        <h2>🏆 תְּעוּדַת הִצְטַיְּנוּת 🏆</h2>
                        
                        <div class="certificate-name">
                            ${userName}
                        </div>

                        <div class="certificate-score">
                            הַצִּיּוּן שֶׁלְּךָ: ${score} / 12 (${finalPercentage}%)
                        </div>

                        <div class="verse">
                            "בְּנֵי בִינָה יְמֵי שְׁמוֹנָה קָבְעוּ שִׁיר וְרַנָּנִים"<br>
                            💖 כָּל מִי שֶׁלָּמַד בְּאַהֲבָה - פָּתַח שַׁעַר בְּלִבּוֹ אֶל הַשֵּׁם! 💫
                        </div>

                        <div class="reflection-questions">
                            <h3>💭 שְׁאֵלוֹת לְמַחְשָׁבָה:</h3>
                            <p>✨ אֵיךְ אוּכַל לְהָבִיא יוֹתֵר אַהֲבַת ה' לַלִּמּוּד הַבָּא שֶׁלִּי?</p>
                            <p>🌟 אֵיזוֹ מִצְוָה אֲנִי רוֹצֶה לְקַיֵּם הַיּוֹם מִתּוֹךְ שִׂמְחָה?</p>
                            <p>💖 אֵיךְ הַנֵּרוֹת יְכוֹלִים לְהָאִיר אֶת הַנְּשָׁמָה שֶׁלִּי?</p>
                        </div>

                        ${finalPercentage >= 66 ? `
                            <div style="margin: 30px 0; padding: 25px; background: linear-gradient(135deg, #fff9e6 0%, #ffe6f0 100%); border-radius: 15px; border: 3px solid #ffd700;">
                                <h3 style="color: #e74c3c; margin-bottom: 15px;">🎉 מַזָּל טוֹב, ${userName}! 💖</h3>
                                <p style="font-size: 1.2em; color: #2c3e50; line-height: 2;">
                                    זָכִיתָ לְסַיֵּם אֶת הַמַּסָּע בְּאַהֲבַת ה'!<br>
                                    הִנֵּה תְּעוּדַת הַהִצְטַיְּנוּת שֶׁלְּךָ! 🎓<br><br>
                                    🎁 נִכְנַסְתָּ לְהַגְרָלָה נוֹשֵׂאת פְּרָסִים! 🎁
                                </p>
                                <a href="https://forms.gle/A66uubei4XSX6SG2A" target="_blank" class="lottery-link">
                                    📋 לְרִשּׁוּם לַהַגְרָלָה לְחַץ כָּאן! 🎉
                                </a>
                            </div>
                        ` : ""}

                        <div class="contact-info">
                            נִבְנָה בְּאַהֲבָה עַל יְדֵי:<br>
                            <strong>הָרַב יְהוּדָה טָאוּב מִקִּרְיַת אַתָּא</strong><br>
                            📞 לִפְרָטִים: 0527139520
                        </div>
                    </div>
                </div>
            `;

            sendScoreToTeacher();
        }

        renderIntro();
    </script>
</body>
</html>
