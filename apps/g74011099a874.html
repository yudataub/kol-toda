        // Web Audio API
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(frequencies, durations) {
            let startTime = audioContext.currentTime;
            frequencies.forEach((freq, index) => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = freq;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.3, startTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + durations[index]);
                
                oscillator.start(startTime);
                oscillator.stop(startTime + durations[index]);
                
                startTime += durations[index];
            });
        }

                </div>

                <div class="inspiration-box">
                    💖 זִכְרוּ: הַשֵּׁם אוֹהֵב אוֹתָנוּ וּמַרְגִּישׁ אוֹתָנוּ תָּמִיד! כָּל מָה שֶׁנִּלְמַד פֹּה יְחַזֵּק אֶת הַקֶּשֶׁר שֶׁלָּנוּ אֶל הַשֵּׁם! 🌟
                </div>

                <button class="btn-primary" onclick="getUserName()">🎮 בּוֹא נַתְחִיל!</button>
            `;
        }

        function getUserName() {
            const name = prompt("מַה שִּׁמְךָ? 😊");
            if (name && name.trim()) {
                userName = name.trim();
                startGame();
            } else {
                userName = "תַּלְמִיד יָקָר";
                startGame();
            }
        }

        function startGame() {
            currentLesson = 0;
            currentQuestion = 0;
            lessonScore = 0;
            totalScore = 0;
            renderLesson();
        }

        function renderLesson() {
            const lesson = lessons[currentLesson];
            const progress = ((currentLesson) / lessons.length) * 100;
            
            gameContainer.innerHTML = `
                <h1>🔥 כִּי יָדַעְתִּי אֶת מַכְאוֹבָיו 💙</h1>
                
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${progress}%">
                        ${Math.round(progress)}%
                    </div>
                </div>
                
                <div class="score-display">
                    🏆 נִקּוּד כּוֹלֵל: ${totalScore} | 📚 שִׁיעוּר ${currentLesson + 1} מִתּוֹךְ ${lessons.length}
                </div>
                
                <div class="lesson-header">
                    ${lesson.title}
                </div>
                
                <div class="lesson-content">
                    ${lesson.content}
                </div>
                
                <div class="inspiration-box">
                    ${lesson.inspiration}
                </div>
                
                <button class="btn-primary" onclick="startQuestions()">📝 בּוֹא נַתְחִיל אֶת הַשְּׁאֵלוֹת!</button>
            `;
        }

        function startQuestions() {
            currentQuestion = 0;
            lessonScore = 0;
            renderQuestion();
        }

        function renderQuestion() {
            const lesson = lessons[currentLesson];
            const question = lesson.questions[currentQuestion];
            
            // ערבוב התשובות
            const shuffledAnswers = question.answers
                .map((answer, index) => ({ answer, index }))
                .sort(() => Math.random() - 0.5);
            
            const progress = ((currentLesson) / lessons.length) * 100;
            
            gameContainer.innerHTML = `
                <h1>🔥 כִּי יָדַעְתִּי אֶת מַכְאוֹבָיו 💙</h1>
                
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${progress}%">
                        ${Math.round(progress)}%
                    </div>
                </div>
                
                <div class="score-display">
                    🏆 נִקּוּד: ${totalScore} | 📋 שְׁאֵלָה ${currentQuestion + 1} מִתּוֹךְ ${lesson.questions.length}
                </div>
                
                <div class="lesson-header">
                    ${lesson.title}
                </div>
                
                <div class="question-box">
                    <div class="question-text">
                        ${question.q}
                    </div>
                    ${shuffledAnswers.map((item, btnIndex) => `
                        <button class="answer-btn" onclick="checkAnswer(${item.index}, ${btnIndex})" id="btn${btnIndex}">
                            ${item.answer}
                        </button>
                    `).join('')}
                    <div id="feedback"></div>
                </div>
            `;
        }

        function checkAnswer(selectedIndex, btnIndex) {
            const lesson = lessons[currentLesson];
            const question = lesson.questions[currentQuestion];
            const isCorrect = selectedIndex === question.correct;
            
            // השבתת כל הכפתורים
            document.querySelectorAll('.answer-btn').forEach(btn => {
                btn.disabled = true;
            });
            
            const selectedBtn = document.getElementById(`btn${btnIndex}`);
            const feedbackDiv = document.getElementById('feedback');
            
            if (isCorrect) {
                selectedBtn.classList.add('correct');
                lessonScore++;
                totalScore++;
                
                const encouragements = [
                    'מְצֻיָּן! ⭐',
                    'נִפְלָא! 💪',
                    'כָּל הַכָּבוֹד! 🎯',
                    'מַמָּשׁ פַּצְצָה! 🔥',
                    'יוֹפִי! 🌟'
                ];
                const randomEncouragement = encouragements[Math.floor(Math.random() * encouragements.length)];
                
                feedbackDiv.className = 'feedback correct';
                feedbackDiv.innerHTML = `
                    <p style="font-size: 1.4em; font-weight: bold;">${randomEncouragement}</p>
                    <p>${question.explanation}</p>
                    <p style="margin-top: 15px;">💖 <strong>הַשֵּׁם שָׂמֵחַ כְּשֶׁאַתָּה לוֹמֵד בְּאַהֲבָה וּבְשִׂמְחָה!</strong> 🌟</p>
                    <button class="btn-primary" onclick="nextQuestion()">➡️ הַשְּׁאֵלָה הַבָּאָה</button>
                `;
                
                // צליל נכון
                playSound([523.25, 659.25, 783.99], [0.15, 0.15, 0.3]);
                
            } else {
                selectedBtn.classList.add('wrong');
                
                feedbackDiv.className = 'feedback wrong';
                feedbackDiv.innerHTML = `
                    <p style="font-size: 1.4em; font-weight: bold;">לֹא בְּדִיּוּק... 🤔</p>
                    <p>${question.explanation}</p>
                    <p style="margin-top: 15px;">💡 <strong>זֶה בְּסֵדֶר! גַּם כְּשֶׁטּוֹעִים - לוֹמְדִים! הַשֵּׁם אוֹהֵב אוֹתְךָ!</strong> 💖</p>
                    <button class="btn-primary" onclick="nextQuestion()">➡️ הַשְּׁאֵלָה הַבָּאָה</button>
                `;
            }
        }

        function nextQuestion() {
            const lesson = lessons[currentLesson];
            
            if (currentQuestion < lesson.questions.length - 1) {
                currentQuestion++;
                renderQuestion();
            } else {
                showLessonSummary();
            }
        }

        function showLessonSummary() {
            const lesson = lessons[currentLesson];
            const percentage = (lessonScore / lesson.questions.length) * 100;
            const passed = lessonScore >= 2;
            
            let summaryHTML = '';
            
            if (lessonScore === 3) {
                summaryHTML = `
                    <div class="feedback correct" style="text-align: center; padding: 40px;">
                        <p style="font-size: 2.5em;">🏆</p>
                        <p style="font-size: 1.8em; font-weight: bold;">מַדְהִים! אַתָּה שׁוֹלֵט!</p>
                        <p style="font-size: 1.4em; margin: 20px 0;">עָנִיתָ נָכוֹן עַל כָּל הַשְּׁאֵלוֹת! 🎉</p>
                        <p style="font-size: 1.3em;">💖 <strong>אַתָּה חַי בְּאַהֲבַת ה׳! הַשֵּׁם גֵּאֶה בְךָ!</strong> 🌟</p>
                    </div>
                `;
                playSound([523.25, 659.25, 783.99, 1046.50, 783.99, 659.25], [0.15, 0.15, 0.15, 0.2, 0.15, 0.3]);
            } else if (passed) {
                summaryHTML = `
                    <div class="feedback correct" style="text-align: center; padding: 40px;">
                        <p style="font-size: 2em;">💪</p>
                        <p style="font-size: 1.6em; font-weight: bold;">כִּמְעַט מֻשְׁלָם!</p>
                        <p style="font-size: 1.3em; margin: 20px 0;">עָנִיתָ נָכוֹן עַל ${lessonScore} מִתּוֹךְ 3!</p>
                        <p style="font-size: 1.2em;">🌱 <strong>מַמָּשׁ כְּמוֹ בְּאַהֲבָה - מַמְשִׁיךְ לִצְמֹחַ!</strong> 💖</p>
                    </div>
                `;
                playSound([523.25, 659.25, 783.99, 1046.50], [0.15, 0.15, 0.15, 0.3]);
            } else {
                summaryHTML = `
                    <div class="feedback wrong" style="text-align: center; padding: 40px;">
                        <p style="font-size: 2em;">😊</p>
                        <p style="font-size: 1.6em; font-weight: bold;">בּוֹא נְנַסֶּה שׁוּב</p>
                        <p style="font-size: 1.3em; margin: 20px 0;">עָנִיתָ נָכוֹן רַק עַל ${lessonScore} מִתּוֹךְ 3</p>
                        <p style="font-size: 1.2em;">💖 <strong>בְּאַהֲבָה וּבְסַבְלָנוּת - נִלְמַד שׁוּב!</strong> 🌟</p>
                    </div>
                `;
            }
            
            const progress = ((currentLesson + 1) / lessons.length) * 100;
            
            gameContainer.innerHTML = `
                <h1>🔥 כִּי יָדַעְתִּי אֶת מַכְאוֹבָיו 💙</h1>
                
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${progress}%">
                        ${Math.round(progress)}%
                    </div>
                </div>
                
                <div class="score-display">
                    🏆 נִקּוּד כּוֹלֵל: ${totalScore}
                </div>
                
                <div class="lesson-header">
                    סִיּוּם שִׁיעוּר ${currentLesson + 1}
                </div>
                
                ${summaryHTML}
                
                ${passed ? 
                    (currentLesson < lessons.length - 1 ? 
                        '<button class="btn-primary" onclick="nextLesson()">🎯 לְשִׁיעוּר הַבָּא!</button>' :
                        '<button class="btn-primary" onclick="showFinalCertificate()">🏆 לִרְאוֹת אֶת הַתְּעוּדָה!</button>'
                    ) :
                    '<button class="btn-primary" onclick="startQuestions()">🔄 לְנַסּוֹת שׁוּב</button>'
                }
            `;
        }

        function nextLesson() {
            currentLesson++;
            renderLesson();
        }

        function showFinalCertificate() {
            const maxScore = lessons.reduce((sum, lesson) => sum + lesson.questions.length, 0);
            const percentage = Math.round((totalScore / maxScore) * 100);
            
            gameContainer.innerHTML = `
                <h1>🏆 סִיַּמְתָּ אֶת הַמִּשְׂחָק! 🏆</h1>
                
                <div class="certificate">
                    <h2>🎓 תְּעוּדַת הִצְטַיְּנוּת 🎓</h2>
                    <p style="font-size: 1.5em; margin: 20px 0;">הוֹעֲנְקָה בְּגַאֲוָה לְ:</p>
                    <div class="name">⭐ ${userName} ⭐</div>
                    <p style="font-size: 1.4em; margin: 25px 0;">עַל לִימּוּד הַסִּפּוּר הַמַּרְתֵּק</p>
                    <p style="font-size: 1.6em; font-weight: bold; color: #d63031;">כִּי יָדַעְתִּי אֶת מַכְאוֹבָיו</p>
                    <p style="font-size: 1.5em; margin: 20px 0;">מֹשֶׁה וְהַסְּנֶה הַבּוֹעֵר 🔥</p>
                    <div class="score-cert">
                        💯 הַנִּקּוּד שֶׁלְּךָ: ${totalScore} מִתּוֹךְ ${maxScore} (${percentage}%)
                    </div>
                    <div class="verse">
                        "וְאָהַבְתָּ אֵת ה׳ אֱלֹהֶיךָ<br>בְּכָל־לְבָבְךָ וּבְכָל־נַפְשְׁךָ וּבְכָל־מְאֹדֶךָ"<br>
                        💙 דברים ו', ה' 💙
                    </div>
                    <p style="font-size: 1.2em; margin-top: 20px;">🌟 מִי שֶׁלָּמַד בְּאַהֲבָה - פָּתַח שַׁעַר בְּלִבּוֹ אֶל הַשֵּׁם! 💖</p>
                </div>
                
                <div class="reflection-questions">
                    <h3>💭 שְׁאֵלוֹת לְמַחְשָׁבָה:</h3>
                    <p><strong>1.</strong> אֵיךְ אוּכַל לְהָבִיא יוֹתֵר אַהֲבַת ה׳ לַלִּימּוּד הַבָּא שֶׁלִּי? 📚</p>
                    <p><strong>2.</strong> אֵיזוֹ מִצְוָה אֲנִי רוֹצֶה לְקַיֵּם הַיּוֹם מִתּוֹךְ שִׂמְחָה? 🌈</p>
                    <p><strong>3.</strong> אֵיךְ אֲנִי יָכוֹל לְהַרְגִּישׁ יוֹתֵר אֶת אֶמְפַּתְיָה כְּלַפֵּי אֲחֵרִים? 💙</p>
                </div>
                
                <div style="text-align: center; margin: 30px 0;">
                    <p style="font-size: 1.5em; font-weight: bold; margin-bottom: 20px;">🎉 מַזָּל טוֹב! זָכִיתָ לְסַיֵּם אֶת הַמָּסָע! 🎉</p>
                    <p style="font-size: 1.3em; margin-bottom: 25px;">💖 עַכְשָׁיו אַתָּה נִכְנָס לְהַגְרָלָה נוֹשֵׂאת פְּרָסִים! 🎁</p>
                    <a href="https://forms.gle/A66uubei4XSX6SG2A" target="_blank" class="raffle-link">
                        🎲 לְהַגְרָלָה - לְחַץ כָּאן! 🎲
                    </a>
                </div>
                
                <div class="contact-box">
                    <p style="font-weight: bold; font-size: 1.3em; margin-bottom: 15px;">נִבְנָה בְּאַהֲבָה עַל־יְדֵי:</p>
                    <p style="font-size: 1.2em;">הָרַב יְהוּדָה טָאוּב מִקִּרְיַת אַתָּא</p>
                    <p style="font-size: 1.2em; margin-top: 10px;">📞 לִפְרָטִים: 0527139520</p>
                </div>
            `;
            
            // צליל חגיגי
            playSound([523.25, 659.25, 783.99, 1046.50, 783.99, 659.25], [0.15, 0.15, 0.15, 0.2, 0.15, 0.4]);
        }

        // התחלה
        renderIntro();
    </script>
</body>
</html>
