    <script>
        // Web Audio API - תיקון נוסף: הוספת בדיקה למצב ההקשר
        var audioContext = null;
        
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            // התחלת ההקשר אם הוא מושהה
            if (audioContext.state === 'suspended') {
                audioContext.resume().then(function() {
                    console.log('Audio context resumed');
                });
            }
        }
        
        function playTone(frequency, duration, delay) {
            setTimeout(function() {
                initAudio();
                var oscillator = audioContext.createOscillator();
                var gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = frequency;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + duration);
            }, delay);
        }
        
        function playCorrectSound() {
            playTone(523.25, 0.2, 0);    // C5
            playTone(659.25, 0.2, 200);  // E5
            playTone(783.99, 0.3, 400);  // G5
        }
        
        function playCompleteSound() {
            playTone(523.25, 0.2, 0);    // C5
            playTone(659.25, 0.2, 200);  // E5
            playTone(783.99, 0.2, 400);  // G5

        // פונקציות עזר - שימוש ב-function רגיל
        function shuffleArray(array) {
            var newArray = array.slice();
            for (var i = newArray.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var temp = newArray[i];
                newArray[i] = newArray[j];
                newArray[j] = temp;
            }
            return newArray;
        }

        function renderIntro() {
            var container = document.getElementById('gameContainer');
            var html = '<h1>מַדּוּעַ אֵלִיָּהוּ הַנָּבִיא מַגִּיעַ לִבְרִית מִילָה? 💖</h1>' +
                       '<div class="intro-text">' +
                       '<p>שָׁלוֹם יְלָדִים יְקָרִים! 🌟</p>' +
                       '<p>הַיּוֹם נִלְמַד יַחַד דָּבָר נִפְלָא עַל בְּרִית מִילָה וְעַל אֵלִיָּהוּ הַנָּבִיא! ' +
                       'זֶה סִפּוּר מְרַתֵּק שֶׁיַּרְאֶה לָכֶם כַּמָּה הַשֵּׁם אוֹהֵב אוֹתָנוּ! 💙</p>' +
                       '<div class="highlight">' +
                       'בַּמִּשְׂחָק הַזֶּה יֵשׁ 4 שִׁיעוּרִים מְעַנְיְנִים, וּבְכָל שִׁיעוּר תַּעֲנוּ עַל 3 שְׁאֵלוֹת. ' +
                       'אִם תַּעֲנוּ נָכוֹן עַל לְפָחוֹת 2 שְׁאֵלוֹת - תַּעַבְרוּ לַשִּׁיעוּר הַבָּא! 🎯' +
                       '</div>' +
                       '<p>בְּכָל שִׁיעוּר נִלְמַד מַשֶּׁהוּ חָדָשׁ וּמַרְגִּשׁ עַל הַקֶּשֶׁר הַמְּיֻחָד שֶׁלָּנוּ עִם הַקָּדוֹשׁ בָּרוּךְ הוּא. ' +
                       'תִּרְאוּ כַּמָּה נִפְלָא לִהְיוֹת יְהוּדִי וְלִהְיוֹת בִּבְרִית עִם בּוֹרֵא עוֹלָם! ✨</p>' +
                       '<p><strong>מוּכָנִים לְהַתְחִיל? בּוֹאוּ נִלְמַד בְּשִׂמְחָה! 🎉</strong></p>' +
                       '</div>' +
                       '<div class="btn-container">' +
                       '<button class="btn-primary" id="startBtn">בּוֹאוּ נַתְחִיל! 🚀</button>' +
                       '</div>';
            container.innerHTML = html;
            
            var startBtn = document.getElementById('startBtn');
            if (startBtn) {
                startBtn.addEventListener('click', startGame);
            }
        }
        
        // פונקציית התחלת המשחק
        function startGame() {
            gameState.currentLesson = 0;
            renderLesson(0);
        }

        // פונקציית הצגת שיעור
        function renderLesson(index) {
            if (index >= lessons.length) {
                renderCertificate();
                return;
            }
            gameState.currentLesson = index;
            gameState.currentQuestionIndex = 0;
            gameState.lessonScore = 0;
            var lesson = lessons[index];
            var html = '<h2>' + lesson.title + '</h2>' +
                       '<div class="lesson-content">' + lesson.content + '</div>' +
                       '<div class="progress-bar"><div class="progress-fill" style="width: 0%;">0%</div></div>' +
                       '<div class="btn-container">' +
                       '<button class="btn-primary" onclick="startQuestions(' + index + ')">התחל שאלות 🎯</button>' +
                       '</div>';
            document.getElementById('gameContainer').innerHTML = html;
        }

        // פונקציית התחלת שאלות בשיעור
        function startQuestions(lessonIndex) {
            gameState.currentQuestionIndex = 0;
            renderQuestion(lessonIndex, 0);
        }

        // פונקציית הצגת שאלה
        function renderQuestion(lessonIndex, qIndex) {
            var lesson = lessons[lessonIndex];
            var q = lesson.questions[qIndex];
            var shuffledAnswers = shuffleArray(q.answers.slice());
            var correctOriginal = q.answers[q.correct];
            var correctIndex = shuffledAnswers.indexOf(correctOriginal);
            
            var progress = Math.round(((qIndex + 1) / lesson.questions.length) * 100);
            var html = '<h2>שיעור ' + (lessonIndex + 1) + ' - שאלה ' + (qIndex + 1) + '/' + lesson.questions.length + '</h2>' +
                       '<div class="progress-bar"><div class="progress-fill" style="width: ' + progress + '%">' + progress + '%</div></div>' +
                       '<div class="question-container">' +
                       '<div class="question-text">' + q.q + '</div>' +
                       '<div class="answers-grid">';
            
            for (var i = 0; i < shuffledAnswers.length; i++) {
                html += '<button class="answer-btn" onclick="selectAnswer(' + lessonIndex + ', ' + qIndex + ', ' + i + ', ' + correctIndex + ', \'' + q.explanation.replace(/'/g, "\\'") + '\')">' + shuffledAnswers[i] + '</button>';
            }
            
            html += '</div></div>';
            document.getElementById('gameContainer').innerHTML = html;
        }

        // פונקציית בדיקת תשובה
        function selectAnswer(lessonIndex, qIndex, selected, correct, explanation) {
            var buttons = document.querySelectorAll('.answer-btn');
            buttons.forEach(function(btn, i) {
                btn.disabled = true;
                if (i === correct) {
                    btn.classList.add('correct');
                }
                if (i === selected && i !== correct) {
                    btn.classList.add('wrong');
                }
            });
            
            var container = document.getElementById('gameContainer');
            var feedback = document.createElement('div');
            feedback.className = 'feedback';
            
            if (selected === correct) {
                feedback.classList.add('correct');
                gameState.lessonScore++;
                playCorrectSound();
                feedback.innerHTML = 'כל הכבוד! 🎉<br>' + explanation;
            } else {
                feedback.classList.add('wrong');
                feedback.innerHTML = 'לא נכון 😔<br>התשובה הנכונה: ' + buttons[correct].innerText + '<br>' + explanation;
            }
            
            container.appendChild(feedback);
            
            // כפתור להמשך אחרי 3 שניות
            setTimeout(function() {
                if (qIndex + 1 < lessons[lessonIndex].questions.length) {
                    renderQuestion(lessonIndex, qIndex + 1);
                } else {
                    endLesson(lessonIndex);
                }
            }, 3000);
        }

        // סיום שיעור
        function endLesson(index) {
            var score = gameState.lessonScore;
            var total = lessons[index].questions.length;
            gameState.score += score;
            gameState.totalQuestions += total;
            
            var html = '<h2>סיום שיעור ' + (index + 1) + '</h2>' +
                       '<div class="score-display">ציון: ' + score + '/' + total + '</div>' +
                       '<div class="progress-bar"><div class="progress-fill" style="width: 100%">100%</div></div>';
            
            if (score >= 2) {
                html += '<div class="feedback correct"><p>כל הכבוד! עוברים לשיעור הבא. 🌟</p></div>' +
                        '<div class="btn-container">' +
                        '<button class="btn-primary" onclick="renderLesson(' + (index + 1) + ')">שיעור הבא 🚀</button>' +
                        '</div>';
            } else {
                html += '<div class="feedback wrong"><p>כמעט! נסה שוב. 💪</p></div>' +
                        '<div class="btn-container">' +
                        '<button class="btn-primary" onclick="startQuestions(' + index + ')">חזור לשיעור</button>' +
                        '</div>';
            }
            
            document.getElementById('gameContainer').innerHTML = html;
        }

        // תעודה בסוף
        function renderCertificate() {
            playCompleteSound();
            var finalScore = Math.round((gameState.score / gameState.totalQuestions) * 100);
            var html = '<div class="certificate">' +
                       '<h2>מזל טוב! 🎉</h2>' +
                       '<p>סיימת את המשחק בהצלחה גדולה!</p>' +
                       '<p>ציון סופי: ' + gameState.score + '/' + gameState.totalQuestions + ' (' + finalScore + '%)</p>' +
                       '<div class="highlight">אתה עכשיו מומחה לפרשת ברכת אברהם ולסודות הברית! 💖</div>' +
                       '<div class="btn-container">' +
                       '<button class="btn-primary" onclick="renderIntro()">שחק שוב</button>' +
                       '</div></div>' +
                       '<div class="contact-info">' +
                       '<p>תודה ששיחקת! אם יש שאלות, כתוב לנו. 🙏</p>' +
                       '</div>';
            document.getElementById('gameContainer').innerHTML = html;
        }
        
        // אתחול - הוסף console.log לבדיקה
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded');
            renderIntro();
        });
    </script>
</body>
</html>
