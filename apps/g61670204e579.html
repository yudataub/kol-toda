                    <p>
                        הצטרף אלינו למסע מרגש בעקבות פרופסור בן ציון טבגר,<br>
                        גיבור שהפך חלום לגאולה באמצעות אומץ, נחישות ואמונה.
                    </p>
                    <p>
                        המשחק כולל <strong>10 שיעורים מרתקים</strong> עם <strong>30 שאלות</strong><br>
                        שילמדו אותך על מורשת, אחריות ואהבת הארץ. 🇮🇱
                    </p>
                    <p style="font-size: 1.3em; color: #f5576c; font-weight: bold;">
                        בכל שאלה תקבל הסבר מפורט ומסר מחזק! 💖
                    </p>
                    <button class="btn-primary" onclick="startGame()">
                        🚀 בואו נתחיל את המסע!
                    </button>
                </div>
            `;
        };

        const renderQuestion = () => {
            const lesson = lessons[currentLesson];
            const question = lesson.questions[currentQuestion];
            const progress = ((currentLesson * 3 + currentQuestion) / 30) * 100;
            
            return `
                <div class="lesson-title">${lesson.title}</div>
                <div class="progress">
                    <div class="progress-bar" style="width: ${progress}%">
                        ${Math.round(progress)}%
                    </div>
                </div>
                <div class="score-display">ניקוד: ${totalScore} 💎</div>
                <div class="question-card">
                    <div class="question-number">
                        שאלה ${currentLesson * 3 + currentQuestion + 1} מתוך 30
                    </div>
                    <div class="question-text">${question.question}</div>
                    <div class="answers">
                        ${question.answers.map((answer, index) => `
                            <button 
                                class="answer-btn ${selectedAnswer === index ? (index === question.correct ? 'correct' : 'wrong') : ''} ${showingFeedback ? 'disabled' : ''}"
                                onclick="selectAnswer(${index})"
                                ${showingFeedback ? 'disabled' : ''}
                            >
                                ${String.fromCharCode(1488 + index)}. ${answer}
                            </button>
                        `).join('')}
                    </div>
                    ${showingFeedback ? `
                        <div class="feedback ${selectedAnswer === question.correct ? 'correct' : 'wrong'}">
                            <div class="feedback-title">
                                ${selectedAnswer === question.correct ? '🎉 מצוין! תשובה נכונה!' : '🤔 לא בדיוק... בוא נלמד יחד'}
                            </div>
                            ${selectedAnswer !== question.correct ? `
                                <div class="feedback-section">
                                    <div class="feedback-label">💡 התשובה הנכונה היא:</div>
                                    ${question.answers[question.correct]}
                                </div>
                            ` : ''}
                            <div class="feedback-section">
                                <div class="feedback-label">📚 הסבר:</div>
                                ${question.explanation}
                            </div>
                            <div class="feedback-section">
                                <div class="feedback-label">✨ מסר מחזק:</div>
                                ${question.message}
                            </div>
                        </div>
                        <button class="btn-primary" onclick="nextQuestion()">
                            ${currentLesson === 9 && currentQuestion === 2 ? '🏆 לסיום המשחק' : '➡️ לשאלה הבאה'}
                        </button>
                    ` : ''}
                </div>
            `;
        };

        const renderComplete = () => {
            const percentage = Math.round((totalScore / 30) * 100);
            return `
                <div class="certificate">
                    <div class="trophy">🏆</div>
                    <h2>כל הכבוד! סיימת את המסע!</h2>
                    <div class="score-display" style="font-size: 2em; margin: 20px 0;">
                        ניקוד כולל: ${totalScore} 💎<br>
                        מתוך 30 שאלות (${percentage}%)
                    </div>
                    ${totalScore >= 20 ? `
                        <p style="font-size: 1.3em; color: #11998e; font-weight: bold;">
                            🌟 מדהים! אתה מומחה אמיתי בסיפור טבגר!
                        </p>
                    ` : totalScore >= 15 ? `
                        <p style="font-size: 1.3em; color: #667eea; font-weight: bold;">
                            💪 כל הכבוד! ידע מרשים!
                        </p>
                    ` : `
                        <p style="font-size: 1.3em; color: #764ba2; font-weight: bold;">
                            🌱 התחלה טובה! כדאי לחזור על החומר
                        </p>
                    `}
                </div>
                
                <div class="inspiration-card">
                    <div class="emoji">💖</div>
                    <p>
                        <strong>"ואהבת את ה' אלוקיך בכל לבבך ובכל נפשך ובכל מאודך"</strong><br>
                        הסיפור של פרופסור טבגר מלמד אותנו שאהבת הארץ והעם<br>
                        מתבטאת במעשים קטנים וגדולים של אחריות ומסירות.
                    </p>
                </div>
                
                <div style="text-align: center; margin: 30px 0;">
                    <a href="https://forms.gle/A66uubei4XSX6SG2A" 
                       target="_blank" 
                       rel="noopener noreferrer"
                       class="btn-primary"
                       style="display: inline-block; text-decoration: none;">
                        🎁 להרשמה להגרלה
                    </a>
                </div>
                
                <div class="contact">
                    <h3>🌟 נבנה באהבה על ידי:</h3>
                    <p>
                        <strong>הרב יהודה טאוב מקרית אתא</strong><br>
                        📞 לפרטים: 0527139520<br>
                        💙 בעזרת השם יתברך
                    </p>
                </div>
                
                <button class="btn-primary" onclick="restartGame()">
                    🔄 לשחק שוב
                </button>
            `;
        };

        const render = () => {
            const app = document.getElementById('app');
            if (currentLesson === -1) {
                app.innerHTML = renderIntro();
            } else if (currentLesson < 10) {
                app.innerHTML = renderQuestion();
            } else {
                app.innerHTML = renderComplete();
            }
        };

        const startGame = () => {
            currentLesson = 0;
            currentQuestion = 0;
            render();
        };

        const selectAnswer = (index) => {
            if (showingFeedback) return;
            
            const lesson = lessons[currentLesson];
            const question = lesson.questions[currentQuestion];
            selectedAnswer = index;
            showingFeedback = true;
            
            if (index === question.correct) {
                totalScore++;
                playSound([261.63, 329.63, 392.0]);
            } else {
                playSound([293.66]);
            }
            
            render();
        };

        const nextQuestion = () => {
            selectedAnswer = null;
            showingFeedback = false;
            
            if (currentQuestion < 2) {
                currentQuestion++;
            } else {
                currentQuestion = 0;
                currentLesson++;
            }
            
            render();
        };

        const restartGame = () => {
            currentLesson = -1;
            currentQuestion = 0;
            totalScore = 0;
            selectedAnswer = null;
            showingFeedback = false;
            render();
        };

        // Initialize
        currentLesson = -1;
        render();
    </script>
</body>
</html>
