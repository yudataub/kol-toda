        // Web Audio API Setup
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(frequencies, durations) {
            let startTime = audioContext.currentTime;
            frequencies.forEach((freq, index) => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = freq;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.3, startTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + durations[index]);
                
                oscillator.start(startTime);
                oscillator.stop(startTime + durations[index]);
                
                startTime += durations[index];
            });
        }

        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

            userName = nameInput ? nameInput.value.trim() : "";
            
            if (!userName) {
                alert("בְּבַקָּשָׁה הַכְנֵס אֶת שִׁמְךָ כְּדֵי לְהַתְחִיל! 😊");
                return;
            }
            
            currentLesson = 0;
            totalScore = 0;
            renderLesson();
        }

        function renderLesson() {
            if (currentLesson >= lessons.length) {
                renderComplete();
                return;
            }

            const lesson = lessons[currentLesson];
            currentQuestion = 0;
            lessonScore = 0;
            answeredQuestions = 0;

            const container = document.getElementById('gameContainer');
            container.innerHTML = `
                <div class="progress-container">
                    <div class="progress-bar" style="width: 0%">0%</div>
                </div>
                <div class="score-display">
                    נִקּוּד כּוֹלֵל: ${totalScore} 🌟 | שָׁלוֹם ${userName}! 💖
                </div>
                <div class="lesson-content fade-in">
                    <div class="lesson-title">${lesson.title}</div>
                    ${lesson.content}
                    <div class="inspiration-box">
                        ${lesson.inspirationQuestion}
                    </div>
                </div>
                <div id="questionsContainer"></div>
            `;

            updateProgress();
            renderQuestion();
        }

        function renderQuestion() {
            const lesson = lessons[currentLesson];
            if (currentQuestion >= lesson.questions.length) {
                return;
            }

            const question = lesson.questions[currentQuestion];
            const shuffledAnswers = shuffleArray(question.answers);
            const correctAnswerText = question.answers[question.correct];
            const correctIndex = shuffledAnswers.indexOf(correctAnswerText);

            const questionsContainer = document.getElementById('questionsContainer');
            const questionDiv = document.createElement('div');
            questionDiv.className = 'question-box fade-in';
            questionDiv.id = `question-${currentQuestion}`;
            questionDiv.innerHTML = `
                <div class="question-text">
                    שְׁאֵלָה ${currentQuestion + 1} מִתּוֹךְ ${lesson.questions.length}: ${question.q}
                </div>
                ${shuffledAnswers.map((answer, index) => `
                    <button class="answer-btn" onclick="checkAnswer(${index}, ${correctIndex}, '${question.explanation.replace(/'/g, "\\'")}', ${currentQuestion})" id="answer-${currentQuestion}-${index}">
                        ${answer}
                    </button>
                `).join('')}
                <div id="feedback-${currentQuestion}" class="hidden"></div>
                <div id="next-btn-${currentQuestion}" class="hidden"></div>
            `;

            questionsContainer.appendChild(questionDiv);
        }

        function checkAnswer(selectedIndex, correctIndex, explanation, questionNumber) {
            answeredQuestions++;
            const feedbackDiv = document.getElementById(`feedback-${questionNumber}`);
            const nextBtnDiv = document.getElementById(`next-btn-${questionNumber}`);
            const buttons = document.querySelectorAll(`#question-${questionNumber} .answer-btn`);
            
            // השבתת כל הכפתורים
            buttons.forEach(btn => btn.disabled = true);

            // סימון התשובה הנכונה והשגויה
            buttons[correctIndex].classList.add('correct');
            if (selectedIndex !== correctIndex) {
                buttons[selectedIndex].classList.add('incorrect');
                buttons[selectedIndex].classList.add('shake');
            }

            feedbackDiv.classList.remove('hidden');

            if (selectedIndex === correctIndex) {
                lessonScore++;
                totalScore += 10;
                playCorrectSound();
                
                const encouragements = [
                    "מְצֻיָּן! ⭐",
                    "נִפְלָא! 💪",
                    "כָּל הַכָּבוֹד! 🎯",
                    "פַּצְצָה! 🚀",
                    "יוֹפִי! 🌟",
                    "מֻשְׁלָם! 🏆",
                    "מְדֻיָּק! ✨"
                ];
                const randomEncouragement = encouragements[Math.floor(Math.random() * encouragements.length)];
                
                feedbackDiv.className = 'feedback correct fade-in';
                feedbackDiv.innerHTML = `
                    <div style="font-size: 1.5em; margin-bottom: 10px;">${randomEncouragement}</div>
                    <div class="explanation">
                        <strong>הֶסְבֵּר:</strong> ${explanation}
                    </div>
                    <div class="love-message" style="margin-top: 15px;">
                        💖 הַשֵּׁם שָׂמֵחַ כְּשֶׁרוֹאֶה אוֹתְךָ לוֹמֵד בְּאַהֲבָה! 💖
                    </div>
                `;
            } else {
                feedbackDiv.className = 'feedback incorrect fade-in';
                feedbackDiv.innerHTML = `
                    <div style="font-size: 1.5em; margin-bottom: 10px;">לֹא בְּדִיּוּק... 🤔</div>
                    <div class="explanation">
                        <strong>הֶסְבֵּר:</strong> ${explanation}
                    </div>
                    <div class="love-message" style="margin-top: 15px;">
                        💡 גַּם כְּשֶׁטּוֹעִים – לוֹמְדִים! הַשֵּׁם אוֹהֵב אוֹתְךָ תָּמִיד! 💡
                    </div>
                `;
            }

            // עדכון הציון בזמן אמת
            const scoreDisplay = document.querySelector('.score-display');
            if (scoreDisplay) {
                scoreDisplay.innerHTML = `נִקּוּד כּוֹלֵל: ${totalScore} 🌟 | שָׁלוֹם ${userName}! 💖`;
            }

            // הוספת כפתור המשך
            nextBtnDiv.classList.remove('hidden');
            if (currentQuestion < lessons[currentLesson].questions.length - 1) {
                nextBtnDiv.innerHTML = `
                    <button class="next-question-btn" onclick="nextQuestion()">
                        הַמְשֵׁךְ לַשְּׁאֵלָה הַבָּאָה 📝
                    </button>
                `;
            } else {
                nextBtnDiv.innerHTML = `
                    <button class="next-question-btn" onclick="checkLessonComplete()">
                        בּוֹא נִרְאֶה אֶת הַתּוֹצָאוֹת! 🎯
                    </button>
                `;
            }
        }

        function nextQuestion() {
            currentQuestion++;
            renderQuestion();
        }

        function checkLessonComplete() {
            const container = document.getElementById('gameContainer');
            const questionsContainer = document.getElementById('questionsContainer');
            
            const requiredScore = lessons[currentLesson].questions.length;
            const percentage = (lessonScore / requiredScore) * 100;

            if (percentage === 100) {
                playCompleteSound();
                questionsContainer.innerHTML += `
                    <div class="feedback correct fade-in" style="margin-top: 30px;">
                        <div style="font-size: 2em;">🏆 מַדְהִים! 🏆</div>
                        <div style="font-size: 1.5em; margin: 15px 0;">
                            עָנִיתָ נָכוֹן עַל כָּל הַשְּׁאֵלוֹת! ${lessonScore}/${requiredScore} ✨
                        </div>
                        <div class="love-message">
                            💫 אַתָּה חַי בְּאַהֲבַת ה'! הַשֵּׁם גֵּאֶה בְּךָ! 💫
                        </div>
                        <button class="continue-btn" onclick="nextLesson()">
                            הַמְשֵׁךְ לַשִּׁיעוּר הַבָּא! 🚀
                        </button>
                    </div>
                `;
            } else {
                questionsContainer.innerHTML += `
                    <div class="feedback incorrect fade-in" style="margin-top: 30px;">
                        <div style="font-size: 1.8em;">💪 כִּמְעַט מֻשְׁלָם! 💪</div>
                        <div style="font-size: 1.3em; margin: 15px 0;">
                            עָנִיתָ נָכוֹן עַל ${lessonScore} מִתּוֹךְ ${requiredScore} שְׁאֵלוֹת.
                        </div>
                        <div>צָרִיךְ לַעֲנוֹת נָכוֹן עַל <strong>כָּל 3 הַשְּׁאֵלוֹת (100%)</strong> כְּדֵי לַעֲבוֹר הָלְאָה! 🎯</div>
                        <div class="love-message">
                            💖 בּוֹא נְנַסֶּה שׁוּב, בְּאַהֲבָה וּבְסַבְלָנוּת! הַשֵּׁם תָּמִיד אִתְּךָ! 💖
                        </div>
                        <button class="retry-btn" onclick="renderLesson()">
                            בּוֹא נְנַסֶּה שׁוּב! 🔄
                        </button>
                    </div>
                `;
            }
        }

        function nextLesson() {
            currentLesson++;
            renderLesson();
        }

        function renderComplete() {
            playCompleteSound();
            
            // שליחת נתונים לגוגל
            sendScoreToTeacher();
            
            const container = document.getElementById('gameContainer');
            const finalPercentage = Math.round((totalScore / (lessons.length * 30)) * 100);
            
            container.innerHTML = `
                <h1 class="animate-pulse">סִיַּמְתָּ בְּהַצְלָחָה! 🎉</h1>
                
                <div class="certificate fade-in">
                    <h2>🏆 תְּעוּדַת הִצְטַיְּנוּת 🏆</h2>
                    <p style="font-size: 1.8em; margin: 20px 0;">
                        <strong>${userName}</strong> 🎊
                    </p>
                    <p style="font-size: 1.3em;">
                        סִיַּמְתָּ אֶת כָּל שִׁיעוּרֵי "סוֹד הַתְּפִלָּה שֶׁעוֹבֶדֶת"! 📚
                    </p>
                    <div class="score-display" style="font-size: 2em; color: #e17055; margin: 25px 0;">
                        נִקּוּד סוֹפִי: ${totalScore} נְקֻדּוֹת (${finalPercentage}%) 🌟
                    </div>
                    <div class="quote">
                        "וְאָהַבְתָּ אֵת ה' אֱלֹקֶיךָ בְּכָל לְבָבְךָ וּבְכָל נַפְשְׁךָ וּבְכָל מְאֹדֶךָ" 💝
                    </div>
                    <p style="margin-top: 20px; font-size: 1.2em;">
                        עַכְשָׁיו אַתָּה יוֹדֵעַ לְהִתְפַּלֵּל בְּדֶרֶךְ שֶׁמַּגִּיעָה לַשָּׁמַיִם! ✨
                    </p>
                </div>

                <div class="reflection-questions fade-in">
                    <h3>שְׁאֵלוֹת לְמַחְשָׁבָה 💭</h3>
                    <ol>
                        <li>אֵיךְ אוּכַל לְהָבִיא יוֹתֵר אַהֲבַת ה' לַלִּמּוּד הַבָּא שֶׁלִּי?</li>
                        <li>אֵיזוֹ מִצְוָה אֲנִי רוֹצֶה לְקַיֵּם הַיּוֹם מִתּוֹךְ שִׂמְחָה?</li>
                        <li>מָה אֲנִי יָכוֹל לַעֲשׂוֹת כְּדֵי לְהוֹדוֹת לַשֵּׁם לִפְנֵי כָּל תְּפִלָּה?</li>
                    </ol>
                </div>

                <div style="text-align: center; margin: 30px 0;" class="fade-in">
                    <p style="font-size: 1.4em; margin-bottom: 15px; font-weight: bold;">
                        🎁 זָכִיתָ לְהִכָּנֵס לְהַגְרָלָה נוֹשֵׂאת פְּרָסִים! 🎁
                    </p>
                    <a href="https://forms.gle/A66uubei4XSX6SG2A" target="_blank" class="raffle-link">
                        לַחֲצוּ כָּאן לְהִרָשֵׁם לְהַגְרָלָה! 🎉
                    </a>
                </div>

                <div class="contact-info fade-in">
                    <p style="font-size: 1.4em; margin-bottom: 10px;">
                        <strong>נִבְנָה בְּאַהֲבָה עַל יְדֵי:</strong>
                    </p>
                    <p style="font-size: 1.3em;">
                        הָרַב יְהוּדָה טָאוּב מִקִּרְיַת אַתָּא 🌟
                    </p>
                    <p style="font-size: 1.2em; margin-top: 10px;">
                        📞 לִפְרָטִים: 0527139520
                    </p>
                </div>

                <div class="love-message fade-in" style="margin-top: 30px; font-size: 1.4em;">
                    💝 זְכוֹר: כְּשֶׁמִּתְפַּלְּלִים מִתּוֹךְ הַכָּרַת הַטּוֹב וְאַהֲבַת ה' - הַתְּפִלָּה מַגַּעַת יָשָׁר לַשָּׁמַיִם! 💝
                </div>
            `;
        }

    // אתחול
        renderIntro();
    </script>
</body>
