        function playSound(frequencies, durations) {
            let startTime = audioContext.currentTime;
            frequencies.forEach((freq, index) => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
               
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
               
                oscillator.frequency.value = freq;
                oscillator.type = "sine";
               
                gainNode.gain.setValueAtTime(0.3, startTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + durations[index]);
               
                oscillator.start(startTime);
                oscillator.stop(startTime + durations[index]);
               
                startTime += durations[index];
            });
        }

            `;

        }

        // הצגת שאלה
        function renderQuestion(qIndex) {
            if (qIndex >= lessons[currentLesson].questions.length) {
                checkLessonComplete();
                return;
            }
           
            currentQuestionIndex = qIndex;
            const question = lessons[currentLesson].questions[qIndex];
            const shuffledAnswers = shuffleArray(question.answers.map((ans, idx) => ({text: ans, index: idx})));
           
            const container = document.getElementById("questionsContainer");
            container.innerHTML = `
                <div class="question-box">
                    <div class="question-text">שְׁאֵלָה ${qIndex + 1} מִתּוֹךְ 3: 📝</div>
                    <div class="question-text">${question.q}</div>
                    <div id="answersContainer">
                        ${shuffledAnswers.map((ans, idx) => `
                            <button class="answer-btn" onclick="checkAnswer(${qIndex}, ${ans.index})" id="answer-${idx}">
                                ${ans.text}
                            </button>
                        `).join("")}
                    </div>
                    <div id="feedback-${qIndex}"></div>
                </div>
            `;
        }

        // בדיקת תשובה
        function checkAnswer(qIndex, selectedIndex) {
            if (answeredQuestions.has(qIndex)) return;
           
            answeredQuestions.add(qIndex);
            const question = lessons[currentLesson].questions[qIndex];
            const isCorrect = selectedIndex === question.correct;
           
            const buttons = document.querySelectorAll(".answer-btn");
            buttons.forEach(btn => btn.disabled = true);
           
            const feedbackDiv = document.getElementById(`feedback-${qIndex}`);
            
            const encouragements = [
                `מְצֻיָּן, ${userName}! ⭐`,
                `נִפְלָא, ${userName}! 💪`,
                `כָּל הַכָּבוֹד, ${userName}! 🎯`,
                `פַּצָּצָה, ${userName}! 💣`,
                `מַמָּשׁ יוֹפִי, ${userName}! 🌟`
            ];
            
            if (isCorrect) {
                const randomEncouragement = encouragements[Math.floor(Math.random() * encouragements.length)];
                feedbackDiv.innerHTML = `
                    <div class="feedback correct">
                        <strong>${randomEncouragement}</strong><br><br>
                        ${question.explanation}<br><br>
                        <em>הַשֵּׁם שָׂמֵחַ כְּשֶׁרוֹאֶה אוֹתְךָ לוֹמֵד בְּאַהֲבָה! 💖</em>
                    </div>
                `;
                lessonScore++;
                score++;
                playCorrectSound();
            } else {
                feedbackDiv.innerHTML = `
                    <div class="feedback incorrect">
                        <strong>לֹא בְּדִיּוּק, ${userName}... 🤔</strong><br><br>
                        הַתְּשׁוּבָה הַנְּכוֹנָה: ${question.answers[question.correct]}<br><br>
                        <em>גַּם כְּשֶׁטּוֹעִים - לוֹמְדִים! הַשֵּׁם אוֹהֵב אוֹתְךָ, ${userName}! 💡💖</em>
                    </div>
                `;
            }

            document.querySelector(".score-display").textContent = `נִיקּוּד כּוֹלֵל: ${score} / ${currentLesson * 3 + answeredQuestions.size} 🌟`;

            setTimeout(() => {
                if (answeredQuestions.size < lessons[currentLesson].questions.length) {
                    renderQuestion(answeredQuestions.size);
                } else {
                    checkLessonComplete();
                }
            }, 2500);
        }

        // סיום שיעור
        function checkLessonComplete() {
            const progress = ((currentLesson + 1) / lessons.length) * 100;
            document.querySelector(".progress-fill").style.width = `${progress}%`;
            document.querySelector(".progress-fill").textContent = `${Math.round(progress)}%`;
            document.querySelector(".score-display").textContent = `נִיקּוּד כּוֹלֵל: ${score} / ${(currentLesson + 1) * 3} 🌟`;
            
            if (lessonScore >= 2) {
                const container = document.getElementById("questionsContainer");
                const nextBtn = document.createElement("div");
                nextBtn.style.textAlign = "center";
                nextBtn.style.marginTop = "30px";
                nextBtn.innerHTML = `<button class="btn-primary" onclick="renderLesson(${currentLesson + 1})">לְשִׁיעוּר הַבָּא ➜</button>`;
                container.appendChild(nextBtn);
            } else {
                const container = document.getElementById("questionsContainer");
                const retryBtn = document.createElement("div");
                retryBtn.style.textAlign = "center";
                retryBtn.style.marginTop = "30px";
                retryBtn.innerHTML = `
                    <div class="feedback incorrect">
                        <strong>בּוֹא נְנַסֶּה שׁוּב, ${userName}! 🤗</strong><br>
                        צָרִיךְ לַעֲנוֹת נָכוֹן לְפָחוֹת עַל 2 מִתּוֹךְ 3 שְׁאֵלוֹת.<br>
                        אַל תִּתְיָאֵשׁ - הַשֵּׁם אוֹהֵב אוֹתְךָ! 💖
                    </div>
                    <button class="btn-primary" onclick="renderLesson(${currentLesson})">נְנַסֶּה שׁוּב! 🔄</button>
                `;
                container.appendChild(retryBtn);
            }
        }

        // תעודת סיום
        function showCertificate() {
            playCompleteSound();
            const container = document.getElementById("gameContainer");
            const percentage = Math.round((score / 12) * 100);
            
            container.innerHTML = `
                <div class="certificate">
                    <h2>🎓 תְּעוּדַת הִצְטַיְּנוּת 🎓</h2>
                    <p class="name">${userName}</p>
                    <p style="font-size: 1.3em;">הִשְׁלַמְתָּ בְּהַצְלָחָה אֶת כָּל אַרְבַּעַת הַשִּׁעוּרִים!</p>
                    <p style="font-size: 1.2em;">לָמַדְתָּ אֶת סוֹד אַרְבַּע לְשׁוֹנוֹת הַגְּאֻלָּה<br>
                    וְהִבַּנְתָּ אֶת אַהֲבַת ה׳ אֵלֵינוּ! 💖</p>
                    <div class="verse">
                        ״וְלָקַחְתִּי אֶתְכֶם לִי לְעָם וְהָיִיתִי לָכֶם לֵאלֹהִים״ 👑
                    </div>
                    <p style="font-size: 1.5em; margin: 20px 0;">
                        נִיקּוּד סוֹפִי: <strong>${score} / 12 (${percentage}%) 🌟</strong>
                    </p>
                </div>
                
                <div class="raffle-box">
                    <h3>🎉 מַזָּל טוֹב, ${userName}! 🎉</h3>
                    <p style="font-size: 1.2em; margin: 15px 0;">נִכְנַסְתָּ לְהַגְרָלָה נוֹשֵׂאת פְּרָסִים! 🎁</p>
                    <a href="https://forms.gle/A66uubei4XSX6SG2A" target="_blank" class="raffle-link">
                        📋 לְרִישׁוּם לַהַגְרָלָה לַחַץ כָּאן! 🎯
                    </a>
                </div>
                
                <div class="reflection-questions">
                    <h3>שְׁאֵלוֹת לְמַחְשָׁבָה: 💭</h3>
                    <ul>
                        <li>אֵיזוֹ לָשׁוֹן גְּאֻלָּה הִכִּי נָגְעָה לְלִבְּךָ וְלָמָּה? 💖</li>
                        <li>אֵיךְ אֶפְשָׁר לְהַרְגִּישׁ אֶת אַהֲבַת ה׳ בְּחַיֵּינוּ הַיּוֹם? 🌟</li>
                        <li>מָה תַּעֲשֶׂה מָחָר כְּדֵי לְהוֹדוֹת לַשֵּׁם עַל הַטּוֹבוֹת שֶׁלּוֹ? 🙏</li>
                    </ul>
                </div>
                
                <div class="contact-info">
                    <strong>נוֹצַר בְּאַהֲבָה עַל יְדֵי:</strong><br>
                    הָרַב יְהוּדָה טָאוּב מִקִּרְיַת אַתָּא<br>
                    📞 לִפְרָטִים וּשְׁאֵלוֹת: 0527139520
                </div>
                
                <div style="text-align: center; margin-top: 20px;">
                    <button class="btn-primary" onclick="location.reload()">🔄 לְשַׂחֵק שׁוּב</button>
                </div>
            `;

            // שליחה אוטומטית לגוגל שיטס
            sendScoreToTeacher();
        }

        // שליחה לגוגל שיטס
        async function sendScoreToTeacher() {
            const now = new Date();
            const data = {
                name: userName,
                score: `${score}/12`,
                percentage: `${Math.round((score/12)*100)}%`,
                gameName: document.title,
                date: now.toLocaleDateString("he-IL"),
                time: now.toLocaleTimeString("he-IL")
            };
            
            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: "POST",
                    headers: {"Content-Type": "text/plain"},
                    body: JSON.stringify(data)
                });
                console.log("✅ הַנְּתוּנִים נִשְׁלְחוּ בְּהַצְלָחָה!");
            } catch (error) {
                console.error("❌ שְׁגִיאָה בְּשִׁלּוּחַ:", error);
            }
        }

        // הפעלה ראשונית
        window.onload = renderIntro;
    </script>
</body>
</html>
