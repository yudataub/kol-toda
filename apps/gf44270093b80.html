<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>שְׁבִירַת הַלּוּחוֹת וְשִׂמְחַת הַמִּצְוָה 💎</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Secular+One&family=Heebo:wght@300;400;500;700;900&display=swap');

:root {
  --gold: #D4AF37;
  --gold-light: #F5E577;
  --deep-blue: #0D1B3E;
  --mid-blue: #1A3A6B;
  --sky-blue: #2E6DB4;
  --light-blue: #B8D4F0;
  --cream: #FDF8EE;
  --warm-white: #FFFEF9;
  --green: #1E7E4A;
  --green-light: #D4EDDA;
  --red: #8B1A1A;
  --red-light: #FFE4E4;
  --shadow: rgba(13,27,62,0.25);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Heebo', Arial, sans-serif;
  background: linear-gradient(160deg, #0D1B3E 0%, #1A3A6B 40%, #0D1B3E 100%);
  min-height: 100vh;
  padding: 20px;
  direction: rtl;
  text-align: right;
  position: relative;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background:
    radial-gradient(ellipse at 20% 20%, rgba(212,175,55,0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 80%, rgba(46,109,180,0.12) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

.stars {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
  z-index: 0;
}

.star {
  position: absolute;
  width: 2px; height: 2px;
  background: var(--gold-light);
  border-radius: 50%;
  animation: twinkle var(--d, 3s) infinite var(--delay, 0s);
}

@keyframes twinkle {
  0%, 100% { opacity: 0.2; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.5); }
}

.game-container {
  max-width: 820px;
  margin: 0 auto;
  position: relative;
  z-index: 1;
}

/* ===== WELCOME SCREEN ===== */
.welcome-screen {
  text-align: center;
  padding: 20px 10px 40px;
  animation: fadeInUp 0.9s ease;
}

.welcome-title {
  font-family: 'Secular One', sans-serif;
  font-size: 2.4em;
  color: var(--gold);
  text-shadow: 0 0 30px rgba(212,175,55,0.5), 2px 2px 4px rgba(0,0,0,0.4);
  margin-bottom: 8px;
  line-height: 1.3;
}

.welcome-subtitle {
  font-size: 1.15em;
  color: var(--light-blue);
  margin-bottom: 10px;
  line-height: 1.8;
}

.parasha-badge {
  display: inline-block;
  background: linear-gradient(135deg, var(--gold) 0%, #B8860B 100%);
  color: var(--deep-blue);
  font-family: 'Secular One', sans-serif;
  font-size: 1em;
  padding: 6px 20px;
  border-radius: 50px;
  margin-bottom: 20px;
  box-shadow: 0 4px 15px rgba(212,175,55,0.4);
}

.tablets-art {
  font-size: 4em;
  margin: 10px 0 20px;
  animation: float 3s ease-in-out infinite;
  display: block;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

.name-input-box {
  background: rgba(255,255,255,0.96);
  border-radius: 24px;
  padding: 32px 28px;
  margin: 20px auto;
  max-width: 440px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.35), 0 0 0 1px rgba(212,175,55,0.3);
  position: relative;
  overflow: hidden;
}

.name-input-box::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold));
}

.name-input-box label {
  display: block;
  font-size: 1.3em;
  font-weight: 700;
  margin-bottom: 16px;
  color: var(--deep-blue);
}

.name-input-box input {
  width: 85%;
  padding: 14px 18px;
  font-size: 1.25em;
  font-family: 'Heebo', sans-serif;
  border: 2.5px solid var(--sky-blue);
  border-radius: 14px;
  text-align: center;
  direction: rtl;
  outline: none;
  transition: border-color 0.3s, box-shadow 0.3s;
  background: var(--warm-white);
  color: var(--deep-blue);
}

.name-input-box input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(212,175,55,0.2);
}

.start-btn {
  display: block;
  margin: 18px auto 0;
  padding: 15px 44px;
  font-size: 1.25em;
  font-family: 'Secular One', sans-serif;
  background: linear-gradient(135deg, #D4AF37 0%, #B8860B 100%);
  color: var(--deep-blue);
  border: none;
  border-radius: 50px;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 6px 20px rgba(212,175,55,0.4);
  animation: pulse 2.5s infinite;
}

.start-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 30px rgba(212,175,55,0.5);
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.04); }
}

/* ===== PROGRESS BAR ===== */
.progress-wrapper {
  background: rgba(255,255,255,0.1);
  border-radius: 50px;
  padding: 6px 8px;
  margin-bottom: 20px;
  box-shadow: inset 0 2px 6px rgba(0,0,0,0.2);
}

.progress-bar {
  height: 12px;
  background: linear-gradient(90deg, var(--gold), var(--gold-light));
  border-radius: 50px;
  transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
  box-shadow: 0 0 10px rgba(212,175,55,0.6);
  min-width: 3%;
}

.progress-labels {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 4px 2px;
  color: var(--light-blue);
  font-size: 0.9em;
}

/* ===== SCORE BADGE ===== */
.score-badge {
  background: linear-gradient(135deg, rgba(212,175,55,0.2), rgba(212,175,55,0.05));
  border: 1px solid rgba(212,175,55,0.4);
  border-radius: 50px;
  padding: 6px 18px;
  color: var(--gold-light);
  font-family: 'Secular One', sans-serif;
  font-size: 1em;
}

/* ===== LESSON CARD ===== */
.lesson-card {
  background: var(--warm-white);
  border-radius: 22px;
  overflow: hidden;
  box-shadow: 0 15px 50px var(--shadow);
  animation: fadeInUp 0.6s ease;
  margin-bottom: 20px;
}

.lesson-header {
  background: linear-gradient(135deg, var(--deep-blue) 0%, var(--mid-blue) 100%);
  padding: 22px 28px;
  position: relative;
  overflow: hidden;
}

.lesson-header::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}

.lesson-number {
  font-size: 0.85em;
  color: var(--gold);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 6px;
  font-family: 'Secular One', sans-serif;
}

.lesson-title {
  font-family: 'Secular One', sans-serif;
  font-size: 1.7em;
  color: white;
  line-height: 1.3;
}

.lesson-body {
  padding: 28px;
}

.lesson-text {
  font-size: 1.15em;
  line-height: 2.1;
  color: #1a1a2e;
  margin-bottom: 20px;
}

.lesson-text p { margin-bottom: 14px; }

.highlight-box {
  background: linear-gradient(135deg, #FFF9E6, #FFF3CC);
  border-right: 5px solid var(--gold);
  border-radius: 0 14px 14px 0;
  padding: 16px 20px;
  margin: 16px 0;
  font-size: 1.05em;
  color: #4a3800;
  line-height: 1.9;
}

.source-box {
  background: linear-gradient(135deg, #E8F0FF, #D8E8FF);
  border-right: 5px solid var(--sky-blue);
  border-radius: 0 14px 14px 0;
  padding: 14px 18px;
  margin: 14px 0;
  font-size: 1em;
  color: #1a3a6b;
  line-height: 1.9;
  font-style: italic;
}

.inspire-box {
  background: linear-gradient(135deg, #FFF0F5, #FFE4EE);
  border: 1.5px solid rgba(180,40,80,0.2);
  border-radius: 14px;
  padding: 16px 20px;
  margin: 16px 0;
  font-size: 1em;
  color: #6B1A35;
  line-height: 1.9;
  text-align: center;
}

/* ===== QUESTIONS ===== */
.question-section {
  padding: 0 28px 28px;
}

.question-card {
  background: linear-gradient(135deg, #F0F4FF, #E8EFFF);
  border-radius: 16px;
  padding: 22px;
  margin-bottom: 18px;
  border: 1.5px solid rgba(46,109,180,0.2);
}

.question-text {
  font-size: 1.15em;
  font-weight: 700;
  color: var(--deep-blue);
  margin-bottom: 18px;
  line-height: 1.7;
}

.answers-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

@media (max-width: 560px) {
  .answers-grid { grid-template-columns: 1fr; }
}

.answer-btn {
  background: white;
  border: 2px solid rgba(46,109,180,0.3);
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 1em;
  font-family: 'Heebo', sans-serif;
  color: #1a1a2e;
  cursor: pointer;
  transition: all 0.2s ease;
  text-align: right;
  direction: rtl;
  line-height: 1.6;
  min-height: 56px;
  display: flex;
  align-items: center;
}

.answer-btn:hover:not(:disabled) {
  background: linear-gradient(135deg, #E8F0FF, #D8E8FF);
  border-color: var(--sky-blue);
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(46,109,180,0.2);
}

.answer-btn.correct {
  background: var(--green-light);
  border-color: var(--green);
  color: #0d4024;
  font-weight: 700;
}

.answer-btn.wrong {
  background: var(--red-light);
  border-color: var(--red);
  color: var(--red);
  animation: shake 0.4s ease;
}

.answer-btn:disabled { cursor: default; }

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

/* ===== FEEDBACK ===== */
.feedback-box {
  border-radius: 14px;
  padding: 16px 20px;
  margin-top: 14px;
  font-size: 1.05em;
  line-height: 1.8;
  animation: fadeInUp 0.4s ease;
}

.feedback-box.correct-fb {
  background: var(--green-light);
  border-right: 5px solid var(--green);
  color: #0d4024;
}

.feedback-box.wrong-fb {
  background: var(--red-light);
  border-right: 5px solid var(--red);
  color: var(--red);
}

.feedback-divine {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid rgba(0,0,0,0.1);
  font-style: italic;
  color: #5a3470;
}

/* ===== NAVIGATION ===== */
.nav-btn {
  display: block;
  margin: 22px auto 0;
  padding: 14px 40px;
  font-size: 1.15em;
  font-family: 'Secular One', sans-serif;
  background: linear-gradient(135deg, var(--deep-blue) 0%, var(--mid-blue) 100%);
  color: var(--gold-light);
  border: 2px solid rgba(212,175,55,0.4);
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.25s ease;
  box-shadow: 0 6px 20px rgba(13,27,62,0.4);
}

.nav-btn:hover {
  background: linear-gradient(135deg, var(--mid-blue), var(--sky-blue));
  transform: translateY(-3px);
  box-shadow: 0 10px 30px rgba(13,27,62,0.5);
  border-color: var(--gold);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: default;
  transform: none;
}

/* ===== RETRY ===== */
.retry-section {
  text-align: center;
  padding: 20px;
  background: linear-gradient(135deg, #FFF8E8, #FFF3D0);
  border-radius: 16px;
  border: 2px dashed rgba(212,175,55,0.5);
  margin: 16px 0;
}

.retry-section p {
  font-size: 1.1em;
  color: #5a3800;
  margin-bottom: 14px;
  line-height: 1.8;
}

.retry-btn {
  display: inline-block;
  padding: 12px 34px;
  font-size: 1.1em;
  font-family: 'Secular One', sans-serif;
  background: linear-gradient(135deg, #D4AF37, #B8860B);
  color: var(--deep-blue);
  border: none;
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 4px 14px rgba(212,175,55,0.35);
}

.retry-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(212,175,55,0.45); }

/* ===== CERTIFICATE ===== */
.certificate-wrapper {
  animation: fadeInUp 0.8s ease;
}

.certificate {
  background: var(--warm-white);
  border-radius: 24px;
  overflow: hidden;
  box-shadow: 0 20px 60px var(--shadow), 0 0 0 1px rgba(212,175,55,0.3);
  position: relative;
}

.certificate::before, .certificate::after {
  content: '';
  position: absolute;
  left: 0; right: 0;
  height: 6px;
}

.certificate::before { top: 0; background: linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold)); }
.certificate::after { bottom: 0; background: linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold)); }

.cert-header {
  background: linear-gradient(160deg, var(--deep-blue) 0%, var(--mid-blue) 100%);
  padding: 36px 28px;
  text-align: center;
  position: relative;
}

.cert-emoji { font-size: 3.5em; display: block; margin-bottom: 12px; }

.cert-title {
  font-family: 'Secular One', sans-serif;
  font-size: 2em;
  color: var(--gold);
  text-shadow: 0 0 20px rgba(212,175,55,0.4);
  margin-bottom: 8px;
}

.cert-subtitle { color: var(--light-blue); font-size: 1.1em; }

.cert-body {
  padding: 32px 28px;
  text-align: center;
}

.cert-name-display {
  font-family: 'Secular One', sans-serif;
  font-size: 2.2em;
  color: var(--deep-blue);
  margin: 12px 0;
}

.cert-score {
  font-size: 3em;
  font-family: 'Secular One', sans-serif;
  background: linear-gradient(135deg, var(--gold), #B8860B);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin: 10px 0;
}

.cert-verse {
  background: linear-gradient(135deg, #F0F4FF, #E8F0FF);
  border: 1.5px solid rgba(46,109,180,0.2);
  border-radius: 16px;
  padding: 20px;
  margin: 20px 0;
  font-style: italic;
  color: var(--deep-blue);
  font-size: 1.1em;
  line-height: 1.8;
}

.reflection-section {
  background: linear-gradient(135deg, #FFF8E8, #FFF3D0);
  border-radius: 16px;
  padding: 22px;
  margin: 18px 0;
  text-align: right;
}

.reflection-section h3 {
  font-family: 'Secular One', sans-serif;
  color: #8B6914;
  font-size: 1.2em;
  margin-bottom: 16px;
}

.reflection-q {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 12px;
  font-size: 1em;
  color: #5a3800;
  line-height: 1.8;
}

.reflection-q::before { content: '💭'; flex-shrink: 0; }

.lottery-box {
  background: linear-gradient(135deg, #0D1B3E, #1A3A6B);
  border-radius: 18px;
  padding: 24px;
  margin: 20px 0;
  text-align: center;
  border: 2px solid rgba(212,175,55,0.3);
}

.lottery-box h3 { color: var(--gold); font-family: 'Secular One', sans-serif; font-size: 1.3em; margin-bottom: 12px; }
.lottery-box p { color: var(--light-blue); margin-bottom: 16px; line-height: 1.7; }

.lottery-link {
  display: inline-block;
  background: linear-gradient(135deg, var(--gold), #B8860B);
  color: var(--deep-blue);
  text-decoration: none;
  padding: 12px 30px;
  border-radius: 50px;
  font-family: 'Secular One', sans-serif;
  font-size: 1.1em;
  box-shadow: 0 4px 14px rgba(212,175,55,0.35);
  transition: all 0.2s;
}

.lottery-link:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(212,175,55,0.5); }

.contact-footer {
  text-align: center;
  padding: 18px;
  border-top: 1px solid rgba(212,175,55,0.2);
  color: #7a8aaa;
  font-size: 0.9em;
  line-height: 1.8;
}

/* ===== LESSON SUMMARY ===== */
.lesson-result {
  text-align: center;
  padding: 24px;
  border-radius: 18px;
  margin: 16px 0;
  animation: fadeInUp 0.5s ease;
}

.lesson-result.great { background: linear-gradient(135deg, #D4EDDA, #B8DCC4); border: 2px solid var(--green); }
.lesson-result.good { background: linear-gradient(135deg, #D8E8FF, #C0D8F8); border: 2px solid var(--sky-blue); }
.lesson-result.retry-res { background: linear-gradient(135deg, #FFF3D0, #FFE8A8); border: 2px dashed rgba(212,175,55,0.6); }

.lesson-result h3 { font-family: 'Secular One', sans-serif; font-size: 1.4em; margin-bottom: 10px; }
.lesson-result p { font-size: 1.05em; line-height: 1.8; }

/* ===== ANIMATIONS ===== */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(24px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes celebrationPop {
  0% { transform: scale(0.5); opacity: 0; }
  70% { transform: scale(1.1); }
  100% { transform: scale(1); opacity: 1; }
}

.celebrate { animation: celebrationPop 0.5s ease forwards; }

/* ===== RESPONSIVE ===== */
@media (max-width: 600px) {
  .welcome-title { font-size: 1.7em; }
  .lesson-title { font-size: 1.3em; }
  .lesson-body, .question-section { padding: 18px; }
  .name-input-box input { width: 95%; font-size: 1.1em; }
  .cert-title { font-size: 1.5em; }
  .cert-score { font-size: 2.2em; }
}
</style>
</head>

<div class="stars" id="starsContainer"></div>

<div class="game-container" id="gameContainer"></div>

<script>

// ===== SHUFFLE =====
function shuffleArray(arr) {
  const s = [...arr];
  for (let i = s.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [s[i], s[j]] = [s[j], s[i]];
  }
  return s;
}

// ===== AUDIO =====
function playCorrectSound() {
  try {
    const ctx = getAudioContext();
    const notes = [261.63, 329.63, 392.00];
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.2);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.2 + 0.3);
      osc.start(ctx.currentTime + i * 0.2);
      osc.stop(ctx.currentTime + i * 0.2 + 0.35);
    });
  } catch(e) {}
}

function playWrongSound() {
  try {
    const ctx = getAudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = 200;
    osc.type = 'sawtooth';
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.4);
  } catch(e) {}
}

function playCompletionSound() {
  try {
    const ctx = getAudioContext();
    const notes = [523.25, 659.25, 783.99, 1046.50, 783.99, 659.25];
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.15);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.15 + 0.3);
      osc.start(ctx.currentTime + i * 0.15);
      osc.stop(ctx.currentTime + i * 0.15 + 0.35);
    });
  } catch(e) {}
}

// ===== RENDER LESSON =====
function renderLesson(idx) {
  lessonScore = 0;
  lessonAttempt = 0;
  const lesson = lessons[idx];
  const progressPct = Math.round((idx / lessons.length) * 100);
  const container = document.getElementById('gameContainer');

  // Build shuffled questions
  const shuffledQs = lesson.questions.map((q, qi) => {
    const shuffledAnswers = shuffleArray(q.answers.map((a, ai) => ({ text: a, origIdx: ai })));
    const newCorrectIdx = shuffledAnswers.findIndex(a => a.origIdx === q.correct);
    return { ...q, shuffledAnswers, newCorrectIdx, qi };
  });

  let questionsHTML = '';
  shuffledQs.forEach((q, displayIdx) => {
    const answersHTML = q.shuffledAnswers.map((a, ai) =>
      `<button class="answer-btn" id="ans_${displayIdx}_${ai}" onclick="checkAnswer(${displayIdx},${ai},${q.newCorrectIdx},'${escapeHTML(q.explanation)}')">${a.text}</button>`
    ).join('');
    questionsHTML += `
      <div class="question-card" id="qcard_${displayIdx}">
        <div class="question-text">❓ ${q.q}</div>
        <div class="answers-grid">${answersHTML}</div>
        <div id="feedback_${displayIdx}"></div>
      </div>
    `;
  });

  container.innerHTML = `
    <div class="progress-wrapper">
      <div class="progress-bar" id="progressBar" style="width:${progressPct}%"></div>
    </div>
    <div class="progress-labels">
      <span>שִׁיעוּר ${idx + 1} מִתּוֹךְ ${lessons.length}</span>
      <span class="score-badge">⭐ ${totalScore} נְקֻדּוֹת</span>
    </div>

    <div class="lesson-card">
      <div class="lesson-header">
        <div class="lesson-number">שִׁיעוּר ${idx + 1} ✦ פָּרָשַׁת כִּי תִשָּׂא</div>
        <div class="lesson-title">${lesson.emoji} ${lesson.title}</div>
      </div>
      <div class="lesson-body">
        <div class="lesson-text">${lesson.content}</div>
        <div class="inspire-box">💭 <strong>לְחִשָּׁבוֹן הַנֶּפֶשׁ:</strong> ${lesson.insight}</div>
      </div>

      <div class="question-section">
        <div style="font-family:'Secular One',sans-serif;font-size:1.15em;color:#1a3a6b;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid rgba(46,109,180,0.15);">
          💡 בּוֹחֵן הֲבָנָה — עֲנֵה עַל 3 שְׁאֵלוֹת
        </div>
        ${questionsHTML}
        <div id="lessonResult"></div>
      </div>
    </div>
  `;

  // Store shuffled data
  container._shuffledQs = shuffledQs;
  container._answeredCount = 0;
  container._correctCount = 0;
}

function escapeHTML(str) {
  return str.replace(/'/g, "\\'").replace(/"/g, "&quot;");
}

// ===== CHECK ANSWER =====
function checkAnswer(displayIdx, selectedAi, correctAi, explanation) {
  const container = document.getElementById('gameContainer');
  const qcard = document.getElementById('qcard_' + displayIdx);
  if (!qcard) return;

  // Disable all buttons in this question
  const btns = qcard.querySelectorAll('.answer-btn');
  btns.forEach(b => b.disabled = true);

  const isCorrect = selectedAi === correctAi;
  btns[selectedAi].classList.add(isCorrect ? 'correct' : 'wrong');
  if (!isCorrect) btns[correctAi].classList.add('correct');

  const praises = [
    "מְצֻיָּן", "נִפְלָא", "כָּל הַכָּבוֹד", "פִּצְצָה", "מַמָּשׁ יָפֶה", "עוֹד פַּעַם!"
  ];
  const divineMessages = [
    "הַשֵּׁם שָׂמֵחַ כְּשֶׁאַתָּה לוֹמֵד בְּשִׂמְחָה",
    "הַשֵּׁם אוֹהֵב אוֹתְךָ תָּמִיד",
    "הַשֵּׁם גֵּאֶה בְּלִמּוּדְךָ",
    "הַשֵּׁם רוֹאֶה אֶת הַמַּאֲמָץ שֶׁלְּךָ"
  ];

  const feedbackDiv = document.getElementById('feedback_' + displayIdx);
  const divine = divineMessages[Math.floor(Math.random() * divineMessages.length)];

  if (isCorrect) {
    playCorrectSound();
    totalScore++;
    container._correctCount = (container._correctCount || 0) + 1;
    document.getElementById('progressBar') && updateScoreBadge();
    const praise = praises[Math.floor(Math.random() * praises.length)];
    feedbackDiv.innerHTML = `
      <div class="feedback-box correct-fb">
        <strong>✅ ${praise}, ${userName}!</strong><br>
        ${explanation}
        <div class="feedback-divine">💖 ${divine}, ${userName}!</div>
      </div>
    `;
  } else {
    playWrongSound();
    feedbackDiv.innerHTML = `
      <div class="feedback-box wrong-fb">
        <strong>🤔 לֹא בְּדִיּוּק, ${userName}...</strong><br>
        ${explanation}
        <div class="feedback-divine">💡 גַּם כְּשֶׁטּוֹעִים — לוֹמְדִים! הַשֵּׁם אוֹהֵב אוֹתְךָ, ${userName}! 💖</div>
      </div>
    `;
  }

  container._answeredCount = (container._answeredCount || 0) + 1;
  if (container._answeredCount >= lessons[currentLesson].questions.length) {
    setTimeout(() => showLessonResult(container._correctCount), 700);
  }
}

  if (badge) badge.textContent = '⭐ ' + totalScore + ' נְקֻדּוֹת';

  const resultDiv = document.getElementById('lessonResult');
  if (!resultDiv) return;

  updateScoreBadge();

  if (correct >= 2) {
    const isAll = correct === total;
    playCorrectSound();
    const isLastLesson = currentLesson >= lessons.length - 1;
    const resultClass = isAll ? 'great' : 'good';
    const msg = isAll
      ? `מַדְהִים, ${userName}! 🏆 שָׁלֹשׁ מִתּוֹךְ שָׁלֹשׁ! אַתָּה שׁוֹלֵט בַּחוֹמֶר! 🎉`
      : `כִּמְעַט מוּשְׁלָם, ${userName}! 💪 מַמָּשׁ כְּמוֹ בְּאַהֲבָה — מְמַשִּׁיכִים לִצְמֹחַ! 🌱`;

    resultDiv.innerHTML = `
      <div class="lesson-result ${resultClass}">
        <h3>${msg}</h3>
        <p>עָנִיתָ נָכוֹן עַל ${correct} מִתּוֹךְ ${total} שְׁאֵלוֹת ✨</p>
        ${!isLastLesson
          ? `<button class="nav-btn" onclick="goNextLesson()">הַמְשֵׁךְ לְשִׁיעוּר הַבָּא ➡️</button>`
          : `<button class="nav-btn" onclick="showCertificate()">🏆 לְתְּעוּדָה וְסִיּוּם!</button>`
        }
      </div>
    `;
  } else {
    resultDiv.innerHTML = `
      <div class="retry-section">
        <p>בּוֹא נְנַסֶּה שׁוּב, ${userName} 💖<br>
        עָנִיתָ נָכוֹן עַל ${correct} מִתּוֹךְ ${total}. צָרִיךְ לְפָחוֹת 2 נְכוֹנוֹת לְהַמְשִׁיךְ!</p>
        <p style="margin-bottom:10px">גַּם כְּשֶׁחוֹזְרִים — לוֹמְדִים יוֹתֵר! 🌟 הַשֵּׁם אוֹהֵב אֶת הַנִּסָּיוֹן שֶׁלְּךָ!</p>
        <button class="retry-btn" onclick="retryLesson()">🔄 נְנַסֶּה שׁוּב!</button>
      </div>
    `;
  }
}

function goNextLesson() {
  currentLesson++;
  if (currentLesson < lessons.length) {
    renderLesson(currentLesson);
  } else {
    showCertificate();
  }
}

function retryLesson() {
  renderLesson(currentLesson);
}
