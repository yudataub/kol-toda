                console.log('✅ הַנְּתוּנִים נִשְׁלְחוּ בְּהַצְלָחָה!');
            } catch (error) {
                console.error('❌ שְׁגִיאָה בַּשְּׁלִיחָה:', error);
            }
        }
        
        // ================== מסך פתיחה ==================
        function renderIntro() {
            const container = document.getElementById('gameContainer');
            container.innerHTML = `
                <div class="intro-screen">
                    <h1>🍇 שֶׁבַח פֵּירוֹת אֶרֶץ יִשְׂרָאֵל 🍇</h1>
                    <p>🌟 שָׁלוֹם יְלָדִים יְקָרִים!</p>
                    <p>הַיּוֹם נִלְמַד עַל מַשֶּׁהוּ מְיֻחָד מְאוֹד:</p>
                    <p><span class="highlight">פֵּירוֹת אֶרֶץ יִשְׂרָאֵל</span> וְאֵיךְ הֵם מְקָרְבִים אוֹתָנוּ לַהַשֵּׁם! 💖</p>
                    <p>נִלְמַד עַל שִׁבְעַת הַמִּינִים, עַל הַבַּת עַיִן וְעוֹד צַדִּיקִים 🌳</p>
                    <p>וּנְגַלֶּה אֵיךְ כָּל פְּרִי יָפֶה מְרַאֶה לָנוּ אֶת <span class="highlight">אַהֲבַת הַשֵּׁם</span>!</p>
                    
                    <div class="love-hashem">
                        💖 הַקָּדוֹשׁ בָּרוּךְ הוּא אוֹהֵב אוֹתָנוּ וְרוֹצֶה שֶׁנֵּהָנֶה מֵהָעוֹלָם הַיָּפֶה שֶׁבָּרָא! 💖
                    </div>
                    
                    <p>🎯 בַּמִּשְׂחָק יֵשׁ <strong>3 שִׁיעוּרִים</strong> עִם <strong>4 שְׁאֵלוֹת</strong> בְּכָל אֶחָד</p>
                    <p>📊 צָרִיךְ לַעֲנוֹת נָכוֹן עַל <strong>3 מִתּוֹךְ 4</strong> (75%) כְּדֵי לַעֲבֹר!</p>
                    
                    <button class="nav-btn start-btn" onclick="askUserName()">🚀 בּוֹאוּ נַתְחִיל! 🚀</button>

        // ================== בקשת שם ==================
        function askUserName() {
            initAudio();
            userName = prompt("מַה שִׁמְךָ? 💫");
            if (!userName || userName.trim() === "") {
                userName = "תַּלְמִיד יָקָר";
            }
            userName = userName.trim();
            startGame();
        }
        
        // ================== התחלת המשחק ==================
        function startGame() {
            currentLesson = 0;
            currentQuestion = 0;
            score = 0;
            lessonScore = 0;
            answeredQuestions = [];
            renderLesson();
        }
        
        // ================== הצגת שיעור ==================
        function renderLesson() {
            const lesson = lessons[currentLesson];
            const container = document.getElementById('gameContainer');
            const progress = ((currentLesson * 4 + currentQuestion) / (lessons.length * 4)) * 100;
            
            container.innerHTML = `
                <div class="progress-container">
                    <div class="progress-bar" style="width: ${progress}%">
                        ${Math.round(progress)}%
                    </div>
                </div>
                
                <div class="score-display">
                    ⭐ ${userName} - נִיקוּד: ${score}/${lessons.length * 4} ⭐
                </div>
                
                <h2><span class="lesson-number">${currentLesson + 1}</span> ${lesson.title}</h2>
                
                <div class="lesson-content">
                    ${lesson.content}
                </div>
                
                <div class="love-hashem">
                    ${lesson.loveHashem}
                </div>
                
                <div class="inspiration-box">
                    💭 <strong>שְׁאֵלָה לְמַחְשָׁבָה:</strong> ${lesson.inspiration}
                </div>
                
                <button class="nav-btn" onclick="startQuestions()">📝 בּוֹאוּ נִבְדֹּק מָה לָמַדְנוּ! 📝</button>
            `;
        }
        
        // ================== התחלת שאלות ==================
        function startQuestions() {
            currentQuestion = 0;
            lessonScore = 0;
            answeredQuestions = [];
            renderQuestion();
        }
        
        // ================== הצגת שאלה ==================
        function renderQuestion() {
            const lesson = lessons[currentLesson];
            const question = lesson.questions[currentQuestion];
            const container = document.getElementById('gameContainer');
            const progress = ((currentLesson * 4 + currentQuestion) / (lessons.length * 4)) * 100;
            
            // יצירת מערך עם אינדקסים מעורבבים
            const indices = question.answers.map((_, i) => i);
            const shuffledIndices = shuffleArray(indices);
            
            // שמירת המיפוי לבדיקה מאוחר יותר
            window.currentShuffledIndices = shuffledIndices;
            window.correctOriginalIndex = question.correct;
            
            const answersHTML = shuffledIndices.map((origIndex, displayIndex) => `
                <button class="answer-btn" onclick="checkAnswer(${displayIndex})" id="answer-${displayIndex}">
                    ${question.answers[origIndex]}
                </button>
            `).join('');
            
            container.innerHTML = `
                <div class="progress-container">
                    <div class="progress-bar" style="width: ${progress}%">
                        ${Math.round(progress)}%
                    </div>
                </div>
                
                <div class="score-display">
                    ⭐ ${userName} - נִיקוּד: ${score}/${lessons.length * 4} | שִׁיעוּר ${currentLesson + 1}: ${lessonScore}/4 ⭐
                </div>
                
                <h2>📝 שְׁאֵלָה ${currentQuestion + 1} מִתּוֹךְ 4</h2>
                
                <div class="question-container">
                    <div class="question-text">${question.question}</div>
                    <div class="answers-grid">
                        ${answersHTML}
                    </div>
                    <div class="feedback" id="feedback"></div>
                </div>
            `;
        }
        
        // ================== בדיקת תשובה ==================
        function checkAnswer(selectedDisplayIndex) {
            const lesson = lessons[currentLesson];
            const question = lesson.questions[currentQuestion];
            const feedback = document.getElementById('feedback');
            
            // מציאת האינדקס המקורי שנבחר
            const selectedOriginalIndex = window.currentShuffledIndices[selectedDisplayIndex];
            const isCorrect = selectedOriginalIndex === window.correctOriginalIndex;
            
            // מציאת האינדקס של התשובה הנכונה בתצוגה
            const correctDisplayIndex = window.currentShuffledIndices.indexOf(window.correctOriginalIndex);
            
            // חסימת כפתורים
            const buttons = document.querySelectorAll('.answer-btn');
            buttons.forEach(btn => btn.disabled = true);
            
            // סימון התשובה שנבחרה
            const selectedBtn = document.getElementById('answer-' + selectedDisplayIndex);
            
            if (isCorrect) {
                selectedBtn.classList.add('correct');
                playCorrectSound();
                score++;
                lessonScore++;
                
                const praises = [
                    "מְצֻיָּן, " + userName + "! ⭐",
                    "נִפְלָא, " + userName + "! 💪",
                    "כָּל הַכָּבוֹד, " + userName + "! 🎯",
                    "מַדְהִים, " + userName + "! 🌟",
                    "פְּצָצָה, " + userName + "! 🏆"
                ];
                const randomPraise = praises[Math.floor(Math.random() * praises.length)];
                
                feedback.innerHTML = `
                    <strong>${randomPraise}</strong><br><br>
                    ${question.explanation}<br><br>
                    <em>💖 הַשֵּׁם שָׂמֵחַ לִרְאוֹת שֶׁאַתָּה לוֹמֵד בְּאַהֲבָה, ${userName}! 💖</em>
                `;
                feedback.className = 'feedback correct';
            } else {
                selectedBtn.classList.add('wrong');
                const correctBtn = document.getElementById('answer-' + correctDisplayIndex);
                correctBtn.classList.add('correct');
                playWrongSound();
                
                feedback.innerHTML = `
                    <strong>לֹא בְּדִיּוּק, ${userName}... 🤔</strong><br><br>
                    ${question.explanation}<br><br>
                    <em>💡 גַּם כְּשֶׁטּוֹעִים - לוֹמְדִים! הַשֵּׁם אוֹהֵב אוֹתְךָ תָּמִיד, ${userName}! 💖</em>
                `;
                feedback.className = 'feedback wrong';
            }
            
            feedback.style.display = 'block';
            
            // כפתור המשך
            setTimeout(() => {
                const continueBtn = document.createElement('button');
                continueBtn.className = 'nav-btn';
                continueBtn.textContent = '➡️ הַמְשֵׁךְ ➡️';
                continueBtn.onclick = nextQuestion;
                feedback.appendChild(document.createElement('br'));
                feedback.appendChild(continueBtn);
            }, 1000);
        }
        
        // ================== שאלה הבאה ==================
        function nextQuestion() {
            currentQuestion++;
            
            if (currentQuestion >= 4) {
                // סיום שיעור - בדיקת מעבר
                checkLessonPass();
            } else {
                renderQuestion();
            }
        }
        
        // ================== בדיקת מעבר שיעור ==================
        function checkLessonPass() {
            const container = document.getElementById('gameContainer');
            const passed = lessonScore >= 3; // 75% = 3 מתוך 4
            
            if (passed) {
                if (currentLesson >= lessons.length - 1) {
                    // סיום המשחק
                    showCertificate();
                } else {
                    // מעבר לשיעור הבא
                    container.innerHTML = `
                        <div class="intro-screen">

                            <p>עָנִיתָ נָכוֹן עַל <strong>${lessonScore} מִתּוֹךְ 4</strong> שְׁאֵלוֹת! 🌟</p>
                            
                            <div class="love-hashem">
                                💖 הַשֵּׁם שָׂמֵחַ לִרְאוֹת שֶׁאַתָּה לוֹמֵד אֶת הַתּוֹרָה שֶׁלּוֹ בְּאַהֲבָה! 💖
                            </div>
                            
                            <p>מוּכָן לַשִּׁיעוּר הַבָּא? 🚀</p>
                            <button class="nav-btn" onclick="goToNextLesson()">➡️ לַשִּׁיעוּר הַבָּא! ➡️</button>
                        </div>
                    `;
                    playCorrectSound();
                }
            } else {
                // צריך לנסות שוב
                container.innerHTML = `
                    <div class="retry-section">
                        <h1>🤔 כִּמְעַט, ${userName}! 🤔</h1>
                        <p>עָנִיתָ נָכוֹן עַל <strong>${lessonScore} מִתּוֹךְ 4</strong> שְׁאֵלוֹת.</p>
                        <p>צָרִיךְ <strong>3 מִתּוֹךְ 4</strong> (75%) כְּדֵי לַעֲבֹר.</p>
                        
                        <div class="love-hashem">
                            💡 אַל תִּתְיָאֵשׁ, ${userName}! גַּם גְּדוֹלֵי יִשְׂרָאֵל נָפְלוּ וְקָמוּ!<br>
                            הַשֵּׁם אוֹהֵב אוֹתְךָ וּמַאֲמִין בְּךָ! 💖
                        </div>
                        
                        <p>בּוֹא נִקְרָא שׁוּב אֶת הַשִּׁיעוּר וְנַנְסֶה שׁוּב! 📖</p>
                        <button class="nav-btn" onclick="retryLesson()">🔄 נַנְסֶה שׁוּב! 🔄</button>
                    </div>
                `;
            }
        }
        
        // ================== מעבר לשיעור הבא ==================
        function goToNextLesson() {
            currentLesson++;
            currentQuestion = 0;
            lessonScore = 0;
            renderLesson();
        }
        
        // ================== ניסיון חוזר ==================
        function retryLesson() {
            score -= lessonScore; // הורדת הנקודות של השיעור הזה
            currentQuestion = 0;
            lessonScore = 0;
            renderLesson();
        }
        
        // ================== תעודת סיום ==================

                    <div class="verse">

                        (דְּבָרִים ח, י)
                    </div>
                </div>
                
                <div class="love-hashem">
                    💖 ${userName}, הַשֵּׁם אוֹהֵב אוֹתְךָ מְאוֹד וְשָׂמֵחַ שֶׁלָּמַדְתָּ עַל אֶרֶץ יִשְׂרָאֵל וּפֵירוֹתֶיהָ הַקְּדוֹשִׁים! 💖
                </div>
                
                <div class="reflection-questions">
                    <h3>💭 שְׁאֵלוֹת לְמַחְשָׁבָה:</h3>
                    <ul>
                        <li>🍎 אֵיזֶה פְּרִי מֵאֶרֶץ יִשְׂרָאֵל אֲנִי רוֹצֶה לֶאֱכֹל הַיּוֹם וּלְהוֹדוֹת לַהַשֵּׁם?</li>
                        <li>💖 אֵיךְ אֲנִי יָכוֹל לְהַרְגִּישׁ יוֹתֵר אֶת אַהֲבַת הַשֵּׁם כְּשֶׁאֲנִי אוֹכֵל?</li>
                        <li>🙏 אֵיךְ אֲנִי יָכוֹל לְבָרֵךְ בִּרְכַּת הַמָּזוֹן בְּיוֹתֵר כַּוָּנָה וְאַהֲבָה?</li>
                    </ul>
                </div>
                
                <div class="lottery-section">
                    <h2>🎁 נִכְנַסְתָּ לְהַגְרָלָה! 🎁</h2>
                    <p>כָּל הַכָּבוֹד, ${userName}! זָכִיתָ לְסַיֵּם אֶת הַמִּשְׂחָק בְּהַצְלָחָה!</p>
                    <p>לְחַץ כָּאן לְהִרָשֵׁם לְהַגְרָלָה נוֹשֵׂאת פְּרָסִים:</p>
                    <a href="https://forms.gle/A66uubei4XSX6SG2A" target="_blank" class="lottery-link">
                        📋 לְחַץ כָּאן לְהִרָשֵׁם! 📋
                    </a>

                <div class="contact-info">
                    <p>🏗️ נִבְנָה בְּאַהֲבָה עַל יְדֵי:</p>
                    <p><strong>הָרַב יְהוּדָה טָאוּב מִקִּרְיַת אַתָּא</strong></p>
                    <p>📞 לִפְרָטִים: 0527139520</p>
                </div>
                
                <button class="nav-btn" onclick="location.reload()">🔄 לְשַׂחֵק שׁוּב! 🔄</button>
            `;
            
            // שליחת הציון אוטומטית
            sendScoreToTeacher();

        // ================== התחלה ==================
        renderIntro();
    </script>
