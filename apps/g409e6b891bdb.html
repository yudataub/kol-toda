var ALL = [];
for(var i=0; i<F.length; i++) {
    ALL.push({n: F[i][0], u: F[i][1], t: 1});
}

var sb = document.getElementById("statsBar");
var rs = document.getElementById("results");
var si = document.getElementById("searchInput");

sb.textContent = "סה\"כ תיקיות: " + ALL.length.toLocaleString();

function render(q){
    if(!q){
        rs.innerHTML = "<p class='no-results'>הקלד שם לחיפוש...</p>";
        return;
    }
    q = q.toLowerCase();
    var res = [];
    for(var i=0; i<ALL.length && res.length<500; i++){
        if(ALL[i].n.toLowerCase().indexOf(q) >= 0) res.push(ALL[i]);
    }
    var html = "";
    for(var i=0; i<res.length; i++){
        var it = res[i];
        html += `<a class="item" href="${it.u}" target="_blank"><span class="icon">📁</span><span class="name">${it.n}</span><span class="type-badge type-folder">תיקייה</span></a>`;
    }
    rs.innerHTML = html || `<p class="no-results">לא נמצאו תוצאות עבור "${q}"</p>`;
}

var timer;
si.addEventListener("input", function(){
    clearTimeout(timer);
    timer = setTimeout(() => render(this.value.trim()), 120);
});

render("");
