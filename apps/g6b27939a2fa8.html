        // פונקציית אתחול AudioContext
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        
        // פונקציית ערבוב מערך
        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }
        
        // פונקציית השמעת צליל
        function playSound(frequencies, duration = 0.2) {
            initAudio();
            const now = audioContext.currentTime;
            
            frequencies.forEach((freq, index) => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = freq;
                oscillator.type = 'sine';
                
                const startTime = now + (index * duration);
                gainNode.gain.setValueAtTime(0.3, startTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
                
                oscillator.start(startTime);
                oscillator.stop(startTime + duration);
            });
        }

                    <div class="reflection-box">
                        💫 זִכְרוּ: כָּל שְׁאֵלָה שֶׁאַתֶּם עוֹנִים עָלֶיהָ - הַשֵּׁם שָׂמֵחַ וְאוֹהֵב אֶתְכֶם! 💖
                    </div>
                    
                    <p style="text-align: center; font-size: 1.5em; margin-top: 30px;">
                        בְּהַצְלָחָה! 🌟
                    </p>
                </div>
                
                <button class="btn-primary pulse" onclick="startGame()">בּוֹאוּ נַתְחִיל! 🚀</button>
            `;
        }
        
        // פונקציה לתחילת המשחק
        function startGame() {
            userName = prompt("מַה שִׁמְךָ? 💫");
            if (!userName || userName.trim() === "") {
                userName = "תַּלְמִיד יָקָר";
            }
            initAudio();
            renderLesson(0);
        }
        
        // פונקציה להצגת שיעור
        function renderLesson(lessonIndex) {
            currentLesson = lessonIndex;
            currentQuestionIndex = 0;
            lessonScore = 0;
            
            const lesson = lessons[lessonIndex];
            const container = document.getElementById('gameContainer');
            
            const progressPercent = ((lessonIndex) / lessons.length) * 100;
            
            container.innerHTML = `
                <h1>${lesson.title}</h1>
                
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${progressPercent}%">
                        שִׁיעוּר ${lessonIndex + 1} מִתּוֹךְ ${lessons.length}
                    </div>
                </div>
                
                <div class="lesson-content">
                    ${lesson.content}
                </div>
                
                <button class="btn-primary" onclick="startQuestions()">בּוֹאוּ נַתְחִיל בַּשְּׁאֵלוֹת! 🎯</button>
            `;
        }
        
        // פונקציה להתחלת שאלות
        function startQuestions() {
            showQuestion(0);
        }
        
        // פונקציה להצגת שאלה
        function showQuestion(questionIndex) {
            currentQuestionIndex = questionIndex;
            const lesson = lessons[currentLesson];
            const question = lesson.questions[questionIndex];
            
            // ערבוב התשובות
            const shuffledAnswers = shuffleArray(
                question.answers.map((answer, index) => ({text: answer, originalIndex: index}))
            );
            
            const container = document.getElementById('gameContainer');
            const progressPercent = ((currentLesson + (questionIndex / 3)) / lessons.length) * 100;
            
            let html = `
                <h1>${lesson.title}</h1>
                
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${progressPercent}%">
                        שְׁאֵלָה ${questionIndex + 1} מִתּוֹךְ 3
                    </div>
                </div>
                
                <div class="question-container">
                    <div class="question-text">${question.question}</div>
            `;
            
            shuffledAnswers.forEach((answer, index) => {
                html += `
                    <button class="answer-btn" onclick="checkAnswer(${answer.originalIndex}, ${index})">
                        ${answer.text}
                    </button>
                `;
            });
            
            html += `</div>`;
            
            container.innerHTML = html;
        }
        
        // פונקציה לבדיקת תשובה
        function checkAnswer(originalIndex, buttonIndex) {
            const lesson = lessons[currentLesson];
            const question = lesson.questions[currentQuestionIndex];
            const isCorrect = originalIndex === question.correct;
            
            // השבתת כל הכפתורים
            const buttons = document.querySelectorAll('.answer-btn');
            buttons.forEach(btn => btn.disabled = true);
            
            if (isCorrect) {
                lessonScore++;
                score++;
                playSound([523.25, 659.25, 783.99]); // C-E-G
                
                const feedbackMessages = [
                    `מְצֻיָּן, ${userName}! ⭐`,
                    `נִפְלָא, ${userName}! 💪`,
                    `כָּל הַכָּבוֹד, ${userName}! 🎯`,
                    `פְּצָצָה, ${userName}! 🌟`
                ];
                const randomMessage = feedbackMessages[Math.floor(Math.random() * feedbackMessages.length)];
                
                showFeedback(
                    `${randomMessage}<br><br>${question.explanation}<br><br><span class="highlight">הַשֵּׁם שָׂמֵחַ וְאוֹהֵב אוֹתְךָ, ${userName}! 💖</span>`,
                    true
                );
            } else {
                playSound([392, 349.23]); // G-F
                
                showFeedback(
                    `לֹא בְּדִיּוּק, ${userName}... 🤔<br><br>${question.explanation}<br><br><span class="highlight">גַּם כְּשֶׁטּוֹעִים - לוֹמְדִים! הַשֵּׁם אוֹהֵב אוֹתְךָ, ${userName}! 💡</span>`,
                    false
                );
            }
        }
        
        // פונקציה להצגת משוב
        function showFeedback(message, isCorrect) {
            const container = document.getElementById('gameContainer');
            const feedbackDiv = document.createElement('div');
            feedbackDiv.className = `feedback ${isCorrect ? 'correct' : 'incorrect'}`;
            feedbackDiv.innerHTML = message;
            
            container.appendChild(feedbackDiv);
            
            setTimeout(() => {
                if (currentQuestionIndex < 2) {
                    showQuestion(currentQuestionIndex + 1);
                } else {
                    finishLesson();
                }
            }, 4000);
        }
        
        // פונקציה לסיום שיעור
        function finishLesson() {
            const container = document.getElementById('gameContainer');
            const lesson = lessons[currentLesson];
            const passed = lessonScore >= 2;
            
            let html = `<h1>${lesson.title}</h1>`;
            
            if (lessonScore === 3) {
                playSound([523.25, 659.25, 783.99, 1046.50, 783.99, 659.25]); // C-E-G-C-G-E
                html += `
                    <div class="feedback correct">
                        <h2>מַדְהִים, ${userName}! 🏆</h2>
                        <p>עָנִיתָ נָכוֹן עַל כָּל הַשְּׁאֵלוֹת!</p>
                        <p class="highlight">אַתָּה שׁוֹלֵט! אַתָּה חַי בְּאַהֲבַת הַשֵּׁם! 💖🎉</p>
                        <div class="score-display">ציּוּן: ${lessonScore}/3 ✨</div>
                    </div>
                `;
            } else if (passed) {
                playSound([523.25, 659.25, 783.99, 1046.50]); // C-E-G-C
                html += `
                    <div class="feedback correct">
                        <h2>כִּמְעַט מוּשְׁלָם, ${userName}! 💪</h2>
                        <p>עָבַרְתָּ אֶת הַשִּׁיעוּר בְּהַצְלָחָה!</p>
                        <p class="highlight">מַמָּשׁ כְּמוֹ בְּאַהֲבָה - מַמְשִׁיךְ לִצְמֹחַ! 🌱💖</p>
                        <div class="score-display">ציּוּן: ${lessonScore}/3 ⭐</div>
                    </div>
                `;
            } else {
                html += `
                    <div class="feedback incorrect">
                        <h2>בּוֹא נְנַסֶּה שׁוּב, ${userName} 💙</h2>
                        <p>צָרִיךְ לְהַצְלִיחַ בְּ-2 שְׁאֵלוֹת לְפָחוֹת כְּדֵי לַעֲבוֹר הָלְאָה.</p>
                        <p class="highlight">בְּאַהֲבָה וּבְסַבְלָנוּת נַצְלִיחַ! הַשֵּׁם מַאֲמִין בְּךָ! 💖</p>
                        <div class="score-display">ציּוּן: ${lessonScore}/3</div>
                    </div>
                `;
            }
            
            if (passed) {
                if (currentLesson < lessons.length - 1) {
                    html += `<button class="btn-primary pulse" onclick="renderLesson(${currentLesson + 1})">לַשִּׁיעוּר הַבָּא! 🚀</button>`;
                } else {
                    html += `<button class="btn-primary pulse" onclick="showCertificate()">לִסְיוּם הַמִּשְׂחָק! 🎓</button>`;
                }
            } else {
                html += `<button class="btn-primary" onclick="renderLesson(${currentLesson})">נְנַסֶּה שׁוּב 🔄</button>`;
            }
            
            container.innerHTML = html;
        }
        
        // פונקציה להצגת תעודה
        function showCertificate() {
            sendScoreToTeacher(); // שליחה אוטומטית!
            
            const container = document.getElementById('gameContainer');
            const percentage = Math.round((score / 12) * 100);
            
            let message = "";
            if (percentage === 100) {
                message = "מוּשְׁלָם לְגַמְרֵי! אַתָּה אֲלוּף! 👑";
            } else if (percentage >= 90) {
                message = "מְעוֹלֶה מְאוֹד! 🌟";
            } else if (percentage >= 75) {
                message = "יָפֶה מְאוֹד! 💪";
            } else {
                message = "כָּל הַכָּבוֹד! 🎯";
            }
            
            container.innerHTML = `
                <div class="certificate">
                    <h2>🎓 תְּעוּדַת הִצְטַיְּנוּת 🎓</h2>
                    
                    <div class="name">${userName}</div>
                    
                    <p style="font-size: 1.3em; margin: 20px 0;">
                        סִיַּמְתָּ בְּהַצְלָחָה אֶת הַמִּשְׂחָק:<br>
                        <strong>"סוֹד שִׁבְעִים הַנֶּפֶשׁ"</strong>
                    </p>
                    
                    <div class="score-display">
                        ציּוּן: ${score}/12 (${percentage}%)<br>
                        ${message}
                    </div>
                    
                    <p style="font-size: 1.2em; margin: 25px 0; font-style: italic; color: #6a1b9a;">
                        "כָּל אֶחָד וְאֶחָד מִיִּשְׂרָאֵל חַיָּב לוֹמַר:<br>
                        בִּשְׁבִילִי נִבְרָא הָעוֹלָם" 💫
                    </p>
                    
                    <div style="background: white; padding: 20px; border-radius: 15px; margin: 25px 0;">
                        <h3 style="color: #e65100; margin-bottom: 15px;">💭 שְׁאֵלוֹת לְמַחְשָׁבָה:</h3>
                        <p style="text-align: right; line-height: 2; font-size: 1.1em;">
                            1️⃣ אֵיךְ אֲנִי יָכוֹל לְהָבִיא יוֹתֵר אַהֲבַת ה' לַלִּמּוּד הַבָּא שֶׁלִּי?<br><br>
                            2️⃣ אֵיזוֹ מִצְוָה אֲנִי רוֹצֶה לְקַיֵּם הַיּוֹם מִתּוֹךְ שִׂמְחָה?<br><br>
                            3️⃣ אֵיפֹה אֲנִי רוֹאֶה אֶת הַהַשְׁגָּחָה שֶׁל הַשֵּׁם בְּחַיַּי?
                        </p>
                    </div>
                    
                    ${percentage >= 75 ? `
                        <div style="background: linear-gradient(135deg, #c8e6c9 0%, #a5d6a7 100%); padding: 20px; border-radius: 15px; margin: 25px 0; border: 3px solid #4caf50;">
                            <h3 style="color: #2e7d32; margin-bottom: 10px;">🎉 מַזָּל טוֹב, ${userName}! 🎉</h3>
                            <p style="font-size: 1.2em; color: #1b5e20;">
                                נִכְנַסְתָּ לְהַגְרָלָה נוֹשֵׂאת פְּרָסִים! 🎁
                            </p>
                            <a href="https://forms.gle/A66uubei4XSX6SG2A" target="_blank" style="display: inline-block; background: linear-gradient(135deg, #4caf50 0%, #66bb6a 100%); color: white; padding: 15px 30px; border-radius: 50px; text-decoration: none; margin-top: 15px; font-size: 1.2em; box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);">
                                📋 לְרִישׂוּם לַהַגְרָלָה - לְחַץ כָּאן!
                            </a>
                        </div>
                    ` : ''}
                    
                    <p style="margin-top: 30px; font-size: 1.1em; color: #555;">
                        נִבְנָה בְּאַהֲבָה עַל יְדֵי:<br>
                        <strong>הָרַב יְהוּדָה טָאוּב מִקִּרְיַת אַתָּא</strong><br>
                        📞 לִפְרָטִים: 0527139520
                    </p>
                </div>
            `;
        }
        
        // התחלה
        renderIntro();
    </script>
</body>
</html>
