        // Web Audio API
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(frequencies, duration = 0.3) {
            const now = audioContext.currentTime;
            frequencies.forEach((freq, index) => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = freq;
                oscillator.type = 'sine';
                
                const startTime = now + (index * duration);
                gainNode.gain.setValueAtTime(0.3, startTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
                
                oscillator.start(startTime);
                oscillator.stop(startTime + duration);
            });
        }

                    <p>כְּדֵי לַעֲבֹר לְשִׁיעוּר הַבָּא, צָרִיךְ לַעֲנוֹת נָכוֹן עַל <strong>לְפָחוֹת 2 מִתּוֹךְ 3</strong> שְׁאֵלוֹת. 🎯</p>
                    
                    <p>זִכְרוּ: <span class="highlight">הַשֵּׁם אוֹהֵב אֶתְכֶם וְשָׂמֵחַ בְּכָל צַעַד שֶׁאַתֶּם לוֹמְדִים! 🙏💖</span></p>
                    
                    <p style="text-align: center; font-size: 1.3em; margin-top: 20px;">בּוֹאוּ נַתְחִיל! 🚀🌈</p>
                </div>
                <button class="continue-btn" onclick="startGame()">הַתְחֵל אֶת הַמִּשְׂחָק! 🎮</button>
            `;
        }

        function startGame() {
            currentLesson = 0;
            renderLesson();
        }

        function renderLesson() {
            const lesson = lessons[currentLesson];
            const container = document.getElementById('gameContainer');
            
            const progress = ((currentLesson) / lessons.length) * 100;
            
            container.innerHTML = `
                <h1>פַּרְעֹה שֶׁבַּלֵּב 💖</h1>
                <div class="progress-container">
                    <div class="progress-bar" style="width: ${progress}%">
                        שִׁיעוּר ${currentLesson + 1} מִתּוֹךְ ${lessons.length}
                    </div>
                </div>
                <div class="score-display">נִקּוּד כּוֹלֵל: ${score} / ${totalQuestions} ⭐</div>
                <div class="lesson-content">
                    <h2 class="lesson-title">${lesson.title}</h2>
                    ${lesson.content}
                    <div class="inspiration-box">
                        <strong>💭 שְׁאֵלָה לְמַחְשָׁבָה:</strong><br>
                        ${lesson.inspirationQuestion}
                    </div>
                </div>
                <button class="continue-btn" onclick="startQuiz()">בּוֹא נַתְחִיל אֶת הַחִידוֹן! 🎯</button>
            `;
        }

        function startQuiz() {
            currentQuestion = 0;
            lessonScore = 0;
            renderQuestion();
        }

        function renderQuestion() {
            const lesson = lessons[currentLesson];
            const question = lesson.questions[currentQuestion];
            const container = document.getElementById('gameContainer');
            
            const progress = ((currentLesson + (currentQuestion / lesson.questions.length)) / lessons.length) * 100;
            
            // ערבוב תשובות
            const shuffledAnswers = shuffleArray(question.answers.map((ans, idx) => ({text: ans, index: idx})));
            
            container.innerHTML = `
                <h1>פַּרְעֹה שֶׁבַּלֵּב 💖</h1>
                <div class="progress-container">
                    <div class="progress-bar" style="width: ${progress}%">
                        שְׁאֵלָה ${currentQuestion + 1} מִתּוֹךְ ${lesson.questions.length}
                    </div>
                </div>
                <div class="score-display">נִקּוּד כּוֹלֵל: ${score} / ${totalQuestions} ⭐</div>
                <div class="question-container">
                    <div class="question-text">${question.question}</div>
                    ${shuffledAnswers.map(ans => 
                        `<button class="answer-btn" onclick="checkAnswer(${ans.index})">${ans.text}</button>`
                    ).join('')}
                </div>
                <div id="feedback"></div>
            `;
        }

        function checkAnswer(answerIndex) {
            const lesson = lessons[currentLesson];
            const question = lesson.questions[currentQuestion];
            const isCorrect = answerIndex === question.correct;
            
            totalQuestions++;
            
            // השבת כפתורים
            const buttons = document.querySelectorAll('.answer-btn');
            buttons.forEach(btn => btn.disabled = true);
            
            const feedbackDiv = document.getElementById('feedback');
            
            if (isCorrect) {
                score++;
                lessonScore++;
                const encouragement = encouragements[Math.floor(Math.random() * encouragements.length)];
                playSound([261.63, 329.63, 392.00]); // C-E-G
                
                feedbackDiv.innerHTML = `
                    <div class="feedback correct">
                        <div style="font-size: 1.5em; margin-bottom: 10px;">${encouragement}</div>
                        <div>${question.explanation}</div>
                    </div>
                `;
            } else {
                feedbackDiv.innerHTML = `
                    <div class="feedback incorrect">
                        <div style="font-size: 1.3em; margin-bottom: 10px;">לֹא בְּדִיּוּק... 🤔</div>
                        <div>${question.wrongExplanation}</div>
                    </div>
                `;
            }
            
            feedbackDiv.innerHTML += `
                <button class="continue-btn" onclick="nextQuestion()">הַמְשֵׁךְ ➡️</button>
            `;
        }

        function nextQuestion() {
            currentQuestion++;
            const lesson = lessons[currentLesson];
            
            if (currentQuestion < lesson.questions.length) {
                renderQuestion();
            } else {
                checkLessonCompletion();
            }
        }

        function checkLessonCompletion() {
            const container = document.getElementById('gameContainer');
            const passed = lessonScore >= 2;
            
            if (passed) {
                if (lessonScore === 3) {
                    playSound([523.25, 659.25, 783.99, 1046.50, 783.99, 659.25]); // C-E-G-C-G-E
                    container.innerHTML = `
                        <h1>פַּרְעֹה שֶׁבַּלֵּב 💖</h1>
                        <div class="lesson-content" style="text-align: center;">
                            <h2 style="color: #28a745;">מַדְהִים! 🏆</h2>
                            <p style="font-size: 1.5em;">עָנִיתָ נָכוֹן עַל כָּל הַשְּׁאֵלוֹת! ✨</p>
                            <p style="font-size: 1.3em;">אַתָּה שׁוֹלֵט! אַתָּה חַי בְּאַהֲבַת ה'! 🎉💖</p>
                            <p style="font-size: 1.2em;">הַשֵּׁם כָּל כָּךְ גֵּאֶה בְּךָ! 🌟</p>
                        </div>
                        <button class="continue-btn" onclick="moveToNextLesson()">לְשִׁיעוּר הַבָּא! 🚀</button>
                    `;
                } else {
                    playSound([261.63, 329.63, 392.00]); // C-E-G
                    container.innerHTML = `
                        <h1>פַּרְעֹה שֶׁבַּלֵּב 💖</h1>
                        <div class="lesson-content" style="text-align: center;">
                            <h2 style="color: #28a745;">כִּמְעַט מֻשְׁלָם! 💪</h2>
                            <p style="font-size: 1.4em;">עָנִיתָ נָכוֹן עַל ${lessonScore} מִתּוֹךְ 3 שְׁאֵלוֹת! ✨</p>
                            <p style="font-size: 1.2em;">מַמָּשׁ כְּמוֹ בְּאַהֲבָה - מַמְשִׁיךְ לִצְמֹחַ! 🌱💖</p>
                            <p>הַשֵּׁם שָׂמֵחַ מֵאִתְּךָ! 🌈</p>
                        </div>
                        <button class="continue-btn" onclick="moveToNextLesson()">לְשִׁיעוּר הַבָּא! 🚀</button>
                    `;
                }
            } else {
                container.innerHTML = `
                    <h1>פַּרְעֹה שֶׁבַּלֵּב 💖</h1>
                    <div class="lesson-content" style="text-align: center;">
                        <h2 style="color: #ff6b6b;">בּוֹא נְנַסֶּה שׁוּב 💝</h2>
                        <p style="font-size: 1.3em;">עָנִיתָ נָכוֹן עַל ${lessonScore} מִתּוֹךְ 3 שְׁאֵלוֹת.</p>
                        <p style="font-size: 1.2em;">צָרִיךְ לְפָחוֹת 2 נְכוֹנוֹת כְּדֵי לְהַמְשִׁיךְ. 📚</p>
                        <p style="font-size: 1.2em;">אֲבָל אַל תִּדְאַג! גַּם כְּשֶׁטּוֹעִים - לוֹמְדִים! 💡</p>
                        <p>בּוֹא נְנַסֶּה שׁוּב בְּאַהֲבָה וּבְסַבְלָנוּת! 💖</p>
                        <p style="font-size: 1.1em;">הַשֵּׁם אוֹהֵב אוֹתְךָ וּמְאַמֵּן בְּךָ! 🌟</p>
                    </div>
                    <button class="continue-btn" onclick="startQuiz()">נְנַסֶּה שׁוּב! 💪</button>
                `;
            }
        }

        function moveToNextLesson() {
            currentLesson++;
            if (currentLesson < lessons.length) {
                renderLesson();
            } else {
                showCertificate();
            }
        }

        function showCertificate() {
            playSound([523.25, 659.25, 783.99, 1046.50, 783.99, 659.25]); // C-E-G-C-G-E
            const container = document.getElementById('gameContainer');
            const percentage = Math.round((score / totalQuestions) * 100);
            
            container.innerHTML = `
                <h1>🎉 סִיַּמְתָּ אֶת הַמִּשְׂחָק! 🎉</h1>
                
                <div class="certificate">
                    <h2>תְּעוּדַת הִצְטַיְּנוּת 🏆</h2>
                    <div class="certificate-text">
                        <p><strong>מַזָּל טוֹב!</strong> 🌟</p>
                        <p>סִיַּמְתָּ בְּהַצְלָחָה אֶת מִשְׂחַק הַלְּמִידָה</p>
                        <p style="font-size: 1.6em; color: #764ba2;"><strong>"פַּרְעֹה שֶׁבַּלֵּב"</strong></p>
                        <p style="margin: 20px 0;">הַנִּקּוּד שֶׁלְּךָ: <strong style="font-size: 1.8em; color: #28a745;">${score}/${totalQuestions}</strong> (${percentage}%) 📊</p>
                        <p style="font-size: 1.2em; line-height: 2;">
                            "כָּל מִי שֶׁלָּמַד בְּאַהֲבָה -<br>
                            פָּתַח שַׁעַר בְּלִבּוֹ אֶל הַשֵּׁם" 💫
                        </p>
                        <p style="margin-top: 20px; font-size: 1.3em;">
                            <strong>פָּסוּק לְחִזּוּק:</strong><br>
                            "וְאָהַבְתָּ אֵת ה' אֱלֹקֶיךָ<br>
                            בְּכָל לְבָבְךָ וּבְכָל נַפְשְׁךָ וּבְכָל מְאֹדֶךָ" 💖
                        </p>
                    </div>
                </div>

                <div class="final-questions">
                    <h3 style="text-align: center; color: #2e7d32; margin-bottom: 15px;">💭 שְׁאֵלוֹת לְמַחְשָׁבָה</h3>
                    <ol style="margin-right: 20px; line-height: 2.2;">
                        <li>אֵיךְ אוּכַל לְהָבִיא יוֹתֵר אַהֲבַת ה' לַלִּמּוּד הַבָּא שֶׁלִּי? 📚💖</li>
                        <li>אֵיזוֹ מִצְוָה אֲנִי רוֹצֶה לְקַיֵּם הַיּוֹם מִתּוֹךְ שִׂמְחָה? 🎯✨</li>
                        <li>מָתַי הַיּוֹם אֲנִי יָכוֹל לְהַקְדִּישׁ חָמֵשׁ דַּקּוֹת לְהִתְבּוֹנֵן בְּחַסְדֵי הַשֵּׁם? 🕐🙏</li>
                    </ol>
                </div>

                <div style="text-align: center; margin: 30px 0;">
                    <p style="font-size: 1.3em; margin-bottom: 15px;">🎁 <strong>כָּל הַכָּבוֹד!</strong> 🎁</p>
                    <p style="font-size: 1.2em;">זָכִיתָ לְסַיֵּם אֶת הַמַּסָּע בְּאַהֲבַת ה'!</p>
                    <p style="font-size: 1.2em; margin: 15px 0;">אַתָּה נִכְנָס לְהַגְרָלָה נוֹשֵׂאת פְּרָסִים! 🎉</p>
                    <a href="https://forms.gle/A66uubei4XSX6SG2A" target="_blank" class="raffle-link">
                        לַהִרָּשֵׁם לְהַגְרָלָה! 🎁
                    </a>
                </div>

                <div class="contact-info">
                    <p><strong>נִבְנָה בְּאַהֲבָה עַל יְדֵי:</strong></p>
                    <p style="font-size: 1.2em; margin: 10px 0;">הָרַב יְהוּדָה טָאוּב מִקִּרְיַת אַתָּא</p>
                    <p style="font-size: 1.1em;">📞 לִפְרָטִים: <strong>0527139520</strong></p>
                </div>
            `;
        }

        // התחלת המשחק
        renderIntro();
    </script>
