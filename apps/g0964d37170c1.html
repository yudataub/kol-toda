<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מִשְׂחַק חֲנֻכָּה: כֹּחָהּ שֶׁל הַהוֹדָיָה 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #003366;
            --secondary-color: #FFD700;
            --light-bg: #f0f8ff;
            --dark-text: #333;
            --light-text: #ffffff;
            --correct-green: #28a745;
            --incorrect-red: #dc3545;
            --highlight-yellow: #fffacd;
        }

        body {
            font-family: 'Assistant', sans-serif;
            background: linear-gradient(135deg, #0a2463, #3e88b5);
            color: var(--dark-text);
            margin: 0;
            padding: 20px;
            text-align: right;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #gameContainer {
            background-color: var(--light-bg);
            max-width: 800px;
            width: 100%;
            margin: auto;
            padding: 25px 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            border: 2px solid var(--secondary-color);
        }

        h1, h2, h3, h4 {
            color: var(--primary-color);
            margin-top: 0;
        }
        
        h1 {
            font-size: 2.5em;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        h2 {
            font-size: 2em;
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        
        h3 {
             font-size: 1.6em;
        }
        
        h4 {
            font-size: 1.3em;
            margin-bottom: 15px;
        }

        p {
            line-height: 2;
            font-size: 1.2em;
            margin-bottom: 1em;
        }

        button {
            background-color: var(--primary-color);
            color: var(--light-text);
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 1.1em;
            font-family: 'Assistant', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin: 5px;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 10px rgba(0, 0, 0, 0.15);
            background-color: #004a99;
        }

        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        input[type="text"] {
            width: calc(100% - 24px);
            padding: 12px;
            font-size: 1.1em;
            border-radius: 8px;
            border: 2px solid #ccc;
            margin-bottom: 20px;
            font-family: 'Assistant', sans-serif;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
            outline: none;
        }
        
        .question {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            border: 1px solid #ddd;
        }
        
        .answers-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .answers-container button {
            width: 100%;
            background-color: #3e88b5;
            text-align: right;
        }

        .answers-container button.correct {
            background-color: var(--correct-green);
            color: white;
            box-shadow: 0 0 10px var(--correct-green);
        }

        .answers-container button.incorrect {
            background-color: var(--incorrect-red);
            color: white;
            box-shadow: 0 0 10px var(--incorrect-red);
        }

        .feedback {
            display: none;
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            background-color: #e9ecef;
            border-left: 5px solid var(--primary-color);
        }
        
        .feedback p {
            margin: 0;
            font-size: 1.1em;
        }
        
        .feedback p strong {
            color: var(--primary-color);
        }

        .highlight {
            background-color: var(--highlight-yellow);
            padding: 10px;
            border-radius: 5px;
            display: inline-block;
            border-right: 4px solid var(--secondary-color);
        }

        #progressBarContainer {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        #progressBar {
            width: 0%;
            height: 20px;
            background-color: var(--secondary-color);
            text-align: center;
            line-height: 20px;
            color: var(--primary-color);
            font-weight: bold;
            transition: width 0.5s ease-in-out;
        }

        .certificate {
            border: 5px solid var(--secondary-color);
            padding: 30px;
            background-color: #fff;
            text-align: center;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        .certificate h2 {
            font-size: 2.8em;
            color: var(--primary-color);
        }
        
        .certificate p {
            font-size: 1.4em;
        }

        .certificate a {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;
            background-color: var(--correct-green);
            color: white;
            text-decoration: none;
            font-size: 1.2em;
            border-radius: 10px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        
        .certificate a:hover {
             background-color: #218838;
        }
        
        .certificate .contact-info {
            margin-top: 30px;
            font-size: 1em;
            color: #666;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            #gameContainer {
                padding: 20px;
            }
            h1 { font-size: 2em; }
            h2 { font-size: 1.7em; }
            p { font-size: 1.1em; }
            button, input[type="text"] { font-size: 1em; }
        }
    </style>
</head>

            nameInput.placeholder = 'הַכְנֵס אֶת שִׁמְךָ...';

            const startBtn = document.createElement('button');
            startBtn.id = 'startGameBtn';
            startBtn.textContent = 'הַתְחֵל לִלְמֹד!';

            gameContainer.append(title, introP, nameH3, nameInput, startBtn);

            const handleStart = () => {
                userName = nameInput.value.trim();
                if (userName) {
                    startLessons();
                } else {
                    alert('נָא לְהַכְנִיס שֵׁם כְּדֵי שֶׁנּוּכַל לְהַתְחִיל!');
                }
            };
            
            startBtn.addEventListener('click', handleStart);
            nameInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    handleStart();
                }
            });
        }

        function startLessons() {
            currentLessonIndex++;
            if (currentLessonIndex < lessons.length) {

                displayFinalScreen();

        function displayQuestion(questionObj, parentContainer) {
            const questionContainer = document.createElement('div');
            questionContainer.className = 'question';

            const questionText = document.createElement('h4');
            questionText.textContent = questionObj.questionText;
            questionContainer.appendChild(questionText);

            const answersContainer = document.createElement('div');
            answersContainer.className = 'answers-container';

            const correctAnswer = questionObj.answers[0];
            const shuffledAnswers = shuffleArray([...questionObj.answers]);

            const feedbackDiv = document.createElement('div');
            feedbackDiv.className = 'feedback';

            shuffledAnswers.forEach(answer => {
                const button = document.createElement('button');
                button.textContent = answer;
                button.addEventListener('click', () => checkAnswer(button, correctAnswer, feedbackDiv, questionContainer, questionObj));
                answersContainer.appendChild(button);
            });

            questionContainer.appendChild(answersContainer);

            const correctAnswerP = document.createElement('p');
            const correctAnswerStrong = document.createElement('strong');
            correctAnswerStrong.textContent = 'תְּשׁוּבָה נְכוֹנָה: ';
            correctAnswerP.append(correctAnswerStrong, correctAnswer);

            const explanationP = document.createElement('p');
            const explanationStrong = document.createElement('strong');
            explanationStrong.textContent = 'הֶסְבֵּר: ';
            explanationP.append(explanationStrong, questionObj.explanation);

            const encouragementP = document.createElement('p');
            encouragementP.className = 'encouragement';
            encouragementP.style.marginTop = '10px';
            encouragementP.style.fontWeight = 'bold';

            feedbackDiv.append(correctAnswerP, explanationP, encouragementP);
            questionContainer.appendChild(feedbackDiv);
            parentContainer.appendChild(questionContainer);
        }

        function checkAnswer(clickedButton, correctAnswer, feedbackDiv, questionContainer, questionObj) {
            const allButtons = questionContainer.querySelectorAll('.answers-container button');
            allButtons.forEach(btn => btn.disabled = true);

            const encouragementP = feedbackDiv.querySelector('.encouragement');

            if (clickedButton.textContent === correctAnswer) {
                clickedButton.classList.add('correct');
                score++;
                playSound('correct');
                let personalizedEncouragement = questionObj.encouragement.replace('!', `, ${userName}!`);
                encouragementP.innerHTML = `מְצֻיָּן, ${userName}! ⭐ <br/> ${personalizedEncouragement}`;
            } else {
                clickedButton.classList.add('incorrect');
                playSound('incorrect');
                allButtons.forEach(btn => {
                    if (btn.textContent === correctAnswer) {
                        btn.classList.add('correct');
                    }
                });
                 encouragementP.innerHTML = `לֹא בְּדִיּוּק, ${userName}... 🤔 <br/> גַּם כְּשֶׁטּוֹעִים לוֹמְדִים! הַשֵּׁם אוֹהֵב אוֹתְךָ! 💡`;
            }

            feedbackDiv.style.display = 'block';
            
            questionsAnsweredInLesson++;
            if (questionsAnsweredInLesson === lessons[currentLessonIndex].questions.length) {
                document.getElementById('nextLessonBtn').style.display = 'block';
            }
        }

            contactP.textContent = 'לְכָל שְׁאֵלָה וְהֶאָרָה: הָרַב יְהוּדָה טָאוּב, 📞 0527139520';

            certificateDiv.append(certTitle, certAwardP, scoreH3, hr, verseH4, verseP, questionsH4, questionsOl, br, raffleLink, contactP);
            gameContainer.appendChild(certificateDiv);
            playSound('correct');
        }

        function shuffleArray(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function playSound(type) {
            if (!audioContext) return;
            
            const now = audioContext.currentTime;
            
            if (type === 'correct') {
                const freqs = [392, 493.88, 587.33]; // G4, B4, D5
                freqs.forEach((freq, i) => {
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(freq, now + i * 0.1);
                    gainNode.gain.setValueAtTime(0.2, now + i * 0.1);
                    gainNode.gain.exponentialRampToValueAtTime(0.00001, now + i * 0.1 + 0.15);
                    
                    oscillator.start(now + i * 0.1);
                    oscillator.stop(now + i * 0.1 + 0.2);
                });
            } else if (type === 'incorrect') {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.type = 'square';
                oscillator.frequency.setValueAtTime(150, now);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.00001, now + 0.3);
                
                oscillator.start(now);
                oscillator.stop(now + 0.3);
            }
        }

        initGame();
    </script>
</body>
