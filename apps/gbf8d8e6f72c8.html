        function initAudio() {

        function playNote(frequency, duration, startTime) {
            if (!audioContext) return;
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            oscillator.frequency.value = frequency;
            oscillator.type = "sine";
            gainNode.gain.setValueAtTime(0.3, startTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
            oscillator.start(startTime);
            oscillator.stop(startTime + duration);
        }

                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];

            `;
        }
        
        function checkAnswer(selectedIndex, buttonElement) {
            const lesson = lessons[currentLesson];
            const questionData = lesson.questions[currentQuestion];
            const isCorrect = selectedIndex === questionData.correct;
            
            const buttons = document.querySelectorAll(".btn-answer");
            buttons.forEach(btn => {
                btn.disabled = true;
                const btnIndex = parseInt(btn.getAttribute("data-index"));
                if (btnIndex === questionData.correct) {
                    btn.classList.add("btn-correct");
                } else if (btn === buttonElement && !isCorrect) {
                    btn.classList.add("btn-wrong");
                }
            });
            
            const feedbackContainer = document.getElementById("feedbackContainer");
            const randomPraise = praises[Math.floor(Math.random() * praises.length)];
            
            if (isCorrect) {
                playCorrectSound();
                score++;
                lessonScore++;
                feedbackContainer.innerHTML = `
                    <div class="feedback feedback-correct">
                        <p style="font-size: 1.4em; font-weight: bold;">${randomPraise} ${userName}!</p>
                        <p>${questionData.explanation}</p>
                        <p style="color: #e84393; font-weight: bold;">הַשֵּׁם שָׂמֵחַ בְּךָ, ${userName}! 💖✨</p>
                    </div>
                `;
            } else {
                playWrongSound();
                feedbackContainer.innerHTML = `
                    <div class="feedback feedback-wrong">
                        <p style="font-size: 1.3em;">לֹא בְּדִיּוּק, ${userName}... 🤔</p>
                        <p>${questionData.explanation}</p>
                        <p style="color: #6c5ce7; font-weight: bold;">גַּם כְּשֶׁטּוֹעִים - לוֹמְדִים! הַשֵּׁם אוֹהֵב אוֹתְךָ, ${userName}! 💖</p>
                    </div>
                `;
            }
            
            lessonAnswers.push(isCorrect);
            
            setTimeout(() => {
                feedbackContainer.innerHTML += `
                    <button class="btn btn-primary" onclick="nextQuestion()">▶️ הַמְשֵׁךְ</button>
                `;
            }, 1500);
        }
        
        function nextQuestion() {
            currentQuestion++;
            
            if (currentQuestion >= QUESTIONS_PER_LESSON) {
                showLessonSummary();
            } else {
                renderQuestion();
            }
        }
        
        function showLessonSummary() {
            const container = document.getElementById("gameContainer");
            const passed = lessonScore >= PASSING_SCORE;
            
            if (passed) {
                if (currentLesson < lessons.length - 1) {
                    playCelebrationSound();
                    container.innerHTML = `
                        <div class="lesson-content">
                            <h1>כָּל הַכָּבוֹד, ${userName}! 🎉</h1>
                            ${renderLessonIndicator()}
                            <div class="content-box" style="text-align: center;">
                                <p style="font-size: 1.5em;">עָנִיתָ נָכוֹן עַל <span class="highlight">${lessonScore} מִתּוֹךְ ${QUESTIONS_PER_LESSON}</span> שְׁאֵלוֹת!</p>
                                <p style="font-size: 1.3em; color: #e84393;">הַשֵּׁם גֵּאֶה בְּךָ, ${userName}! 💖🌟</p>
                            </div>
                            <button class="btn btn-primary" onclick="nextLesson()">▶️ לַשִּׁיעוּר הַבָּא!</button>
                        </div>
                    `;
                } else {
                    showCertificate();
                }
            } else {
                container.innerHTML = `
                    <div class="lesson-content">
                        <h1>בּוֹא נְנַסֶּה שׁוּב, ${userName}! 💪</h1>
                        <div class="retry-message">
                            <p style="font-size: 1.3em;">עָנִיתָ נָכוֹן עַל ${lessonScore} מִתּוֹךְ ${QUESTIONS_PER_LESSON} שְׁאֵלוֹת.</p>
                            <p>צָרִיךְ לַעֲנוֹת נָכוֹן עַל לְפָחוֹת ${PASSING_SCORE} שְׁאֵלוֹת כְּדֵי לְהַמְשִׁיךְ.</p>
                            <p style="color: #e84393; font-weight: bold; font-size: 1.2em;">אַל תִּדְאַג, ${userName}! גַּם מִטְּעוּיוֹת לוֹמְדִים! 💖</p>
                            <p>הַשֵּׁם אוֹהֵב אוֹתְךָ תָּמִיד! 🌈</p>
                        </div>
                        <button class="btn btn-primary" onclick="retryLesson()">🔄 נְנַסֶּה שׁוּב!</button>
                    </div>
                `;
            }
        }
        
        function retryLesson() {
            score -= lessonAnswers.filter(a => a).length;
            renderLesson();
        }
        
        function nextLesson() {
            currentLesson++;
            currentQuestion = 0;
            lessonScore = 0;
            lessonAnswers = [];
            renderLesson();
        }
        
        async function sendScoreToTeacher() {
            const now = new Date();
            const data = {
                name: userName,
                score: `${score}/${TOTAL_QUESTIONS}`,
                percentage: `${Math.round((score/TOTAL_QUESTIONS)*100)}%`,
                gameName: document.title || "הַחִיּוּךְ שֶׁמַּצִּיל נְפָשׁוֹת",
                date: now.toLocaleDateString("he-IL"),
                time: now.toLocaleTimeString("he-IL")
            };
            
            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: "POST",
                    headers: {"Content-Type": "text/plain"},
                    body: JSON.stringify(data)
                });
                console.log("✅ הַנְּתוּנִים נִשְׁלְחוּ בְּהַצְלָחָה!");
            } catch (error) {
                console.error("❌ שְׁגִיאָה בְּשִׁלּוּחַ:", error);
            }
        }
        
        function showCertificate() {
            playCelebrationSound();
            const container = document.getElementById("gameContainer");
            const percentage = Math.round((score / TOTAL_QUESTIONS) * 100);
            
            container.innerHTML = `
                <div class="lesson-content">
                    <div class="certificate" style="animation: celebrate 1s ease;">
                        <h2>🏆 תְּעוּדַת הִצְטַיְּנוּת 🏆</h2>
                        <p style="font-size: 1.2em;">מֻעֶנֶקֶת בְּזֶה לְ:</p>
                        <div class="certificate-name">✨ ${userName} ✨</div>
                        <div class="certificate-score">
                            <p>סִיֵּם אֶת הַמִּשְׂחָק בְּהַצְלָחָה!</p>
                            <p style="font-size: 1.8em;">🌟 ${score} / ${TOTAL_QUESTIONS} 🌟</p>
                            <p>${percentage}%</p>
                        </div>
                        <div class="pasuk">
                            ״וְאָהַבְתָּ אֵת ה׳ אֱ-לֹהֶיךָ בְּכָל לְבָבְךָ וּבְכָל נַפְשְׁךָ וּבְכָל מְאֹדֶךָ״
                        </div>
                        <p style="color: #e84393; font-weight: bold; font-size: 1.2em;">
                            💖 הַשֵּׁם אוֹהֵב אוֹתְךָ וְגֵאֶה בְּךָ, ${userName}! 💖
                        </p>
                    </div>
                    
                    <div class="thinking-questions">
                        <h3>🤔 שְׁאֵלוֹת לְמַחְשָׁבָה:</h3>
                        <ul>
                            <li>💭 לְמִי אֲנִי רוֹצֶה לְחַיֵּךְ הַיּוֹם כְּדֵי לְשַׂמֵּחַ אוֹתוֹ?</li>
                            <li>💭 אֵיךְ אֲנִי יָכוֹל לְהָבִיא יוֹתֵר אַהֲבַת הַשֵּׁם לַחַיִּים שֶׁלִּי?</li>
                            <li>💭 אֵיזוֹ מִצְוָה אֲנִי רוֹצֶה לְקַיֵּם הַיּוֹם מִתּוֹךְ שִׂמְחָה?</li>
                        </ul>
                    </div>
                    
                    <div class="inspiration-box">
                        🎉 מַזָּל טוֹב, ${userName}! נִכְנַסְתָּ לְהַגְרָלָה נוֹשֵׂאת פְּרָסִים! 🎁
                    </div>
                    
                    <a href="https://forms.gle/A66uubei4XSX6SG2A" target="_blank" class="lottery-link">
                        📋 לְהִרָשֵׁם לְהַגְרָלָה לְחַץ כָּאן!
                    </a>
                    
                    <div class="contact">
                        <p style="font-weight: bold; font-size: 1.1em;">נִבְנָה בְּאַהֲבָה עַל יְדֵי:</p>
                        <p>הָרַב יְהוּדָה טָאוּב מִקִּרְיַת אַתָּא</p>
                        <p>📞 לִפְרָטִים: 0527139520</p>
                    </div>
                    
                    <button class="btn btn-primary" onclick="renderIntro()">🔄 לְשַׂחֵק שׁוּב!</button>
                </div>
            `;
            
            sendScoreToTeacher();
        }
        
        renderIntro();
    </script>
</body>
</html>
