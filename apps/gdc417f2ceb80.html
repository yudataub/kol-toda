<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌈 קטלוג המצגות לנוער וילדים</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&family=Varela+Round&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fef9f0; --bg-card:#ffffff; --bg-hover:#fff8ed;
  --shadow-soft:0 2px 16px rgba(0,0,0,.06); --shadow-hover:0 6px 28px rgba(0,0,0,.1);
  --radius:18px; --text:#2d2a3e; --text-dim:#7a7590; --border:#efe8dd;
  --coral:#ff6b6b; --orange:#ffa34d; --gold:#ffd43b; --lime:#69db7c; --teal:#38d9a9;
  --sky:#4dabf7; --blue:#5c7cfa; --purple:#9775fa; --pink:#f783ac; --rose:#e64980;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Heebo','Varela Round',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

/* HERO */
.hero{text-align:center;padding:44px 20px 28px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#fff1e6 0%,#e8f5e9 25%,#e3f2fd 50%,#f3e5f5 75%,#fff8e1 100%)}
.hero::before{content:'';position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(circle at 15% 30%,rgba(255,107,107,.12) 0%,transparent 40%),
  radial-gradient(circle at 85% 25%,rgba(77,171,247,.12) 0%,transparent 40%),
  radial-gradient(circle at 50% 80%,rgba(105,219,124,.12) 0%,transparent 40%)}
.hero-emoji{font-size:3em;position:relative;display:inline-block;animation:bounce 2s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.hero h1{font-size:2.5em;font-weight:900;position:relative;margin:8px 0;line-height:1.3;
  background:linear-gradient(135deg,var(--coral),var(--purple),var(--sky),var(--teal));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero p{font-size:1.1em;color:var(--text-dim);position:relative;font-weight:400}
.stats-row{display:flex;gap:14px;justify-content:center;margin-top:18px;flex-wrap:wrap;position:relative}
.stat-pill{background:#fff;padding:8px 22px;border-radius:50px;box-shadow:var(--shadow-soft);
  font-weight:700;font-size:.95em;display:flex;align-items:center;gap:8px}
.stat-pill .num{font-size:1.35em;background:linear-gradient(135deg,var(--coral),var(--orange));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

/* STICKY TOOLBAR */
.toolbar{position:sticky;top:0;z-index:120;background:rgba(254,249,240,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);padding:14px 16px 10px}
.search-wrap{position:relative;max-width:560px;margin:0 auto}
.search-box{width:100%;padding:14px 48px 14px 44px;font-size:1.05em;font-family:'Heebo',sans-serif;
  background:#fff;border:2px solid var(--border);border-radius:50px;color:var(--text);outline:none;
  box-shadow:var(--shadow-soft);transition:all .3s}
.search-box:focus{border-color:var(--sky);box-shadow:0 0 0 4px rgba(77,171,247,.15)}
.search-box::placeholder{color:#bbb}
.search-icon{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:1.15em;pointer-events:none}
.search-clear{position:absolute;left:14px;top:50%;transform:translateY(-50%);border:none;background:#efe8dd;
  color:#7a7590;width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:1em;line-height:1;
  display:none;align-items:center;justify-content:center;transition:all .2s}
.search-clear:hover{background:#e64980;color:#fff}
.search-clear.show{display:flex}

.controls{max-width:1100px;margin:10px auto 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.ctrl-btn{padding:7px 16px;border:1.5px solid var(--border);background:#fff;border-radius:50px;
  font-family:'Heebo',sans-serif;font-size:.84em;font-weight:600;color:var(--text-dim);cursor:pointer;
  transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.ctrl-btn:hover{border-color:var(--sky);color:var(--sky);transform:translateY(-1px)}
.search-count{flex:1;text-align:center;font-size:.84em;font-weight:600;color:var(--text-dim);min-width:160px}

/* GROUP QUICK-NAV */
.groupnav{max-width:1100px;margin:14px auto 4px;padding:0 16px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.gnav-btn{padding:8px 18px;border-radius:50px;font-family:'Heebo',sans-serif;font-size:.86em;font-weight:700;
  cursor:pointer;border:none;color:#fff;transition:all .25s;box-shadow:0 2px 10px rgba(0,0,0,.1);white-space:nowrap}
.gnav-btn:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 5px 16px rgba(0,0,0,.18)}

/* CONTAINER + GROUPS */
.container{max-width:1100px;margin:0 auto;padding:8px 16px 80px}
.group{margin-top:26px;scroll-margin-top:86px}
.group-header{display:flex;align-items:center;gap:12px;margin:0 4px 12px;padding-bottom:10px;
  border-bottom:2px dashed var(--border)}
.group-emoji{font-size:1.5em}
.group-header h2{font-size:1.28em;font-weight:900;letter-spacing:-.01em}
.group-total{margin-inline-start:auto;font-size:.74em;font-weight:700;color:var(--text-dim);
  background:#fff;border:1.5px solid var(--border);padding:3px 12px;border-radius:50px}

/* CATEGORY */
.category{margin-bottom:12px;border-radius:var(--radius);overflow:hidden;background:var(--bg-card);
  box-shadow:var(--shadow-soft);border:2px solid transparent;transition:border-color .3s;scroll-margin-top:90px}
.category:hover{border-color:#ececec}
.category.flash{animation:flash 1.1s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(77,171,247,.45)}100%{box-shadow:0 0 0 14px rgba(77,171,247,0)}}
.category-header{padding:15px 20px;display:flex;align-items:center;gap:14px;cursor:pointer;user-select:none;transition:background .2s}
.category-header:hover{background:#fafafa}
.category-header:focus-visible{outline:3px solid var(--sky);outline-offset:-3px}
.cat-icon{font-size:1.55em;width:46px;height:46px;display:flex;align-items:center;justify-content:center;border-radius:14px;flex-shrink:0}
.category-header h3{font-size:1.13em;font-weight:700;flex:1}
.cat-count{padding:4px 13px;border-radius:50px;font-size:.76em;font-weight:700;color:#fff}
.cat-toggle{font-size:1em;color:#c4c4c4;transition:transform .3s;flex-shrink:0}
.category.collapsed .cat-toggle{transform:rotate(-90deg)}
.category.collapsed .cat-body{display:none}
.cat-body{padding:0 10px 12px}

/* TABLE */
.p-table{width:100%;border-collapse:separate;border-spacing:0 3px}
.p-row{transition:background .15s,transform .15s;border-radius:12px}
.p-row:hover{background:var(--bg-hover);transform:translateX(-2px)}
.p-row.hit{background:#fff7d6}
.p-row.hit:hover{background:#fff1b8}
.p-row td{padding:10px 12px;vertical-align:middle}
.p-row td:first-child{border-radius:0 12px 12px 0;width:34px;text-align:center;font-size:.76em;font-weight:700;color:#c0bccb}
.p-row td:last-child{border-radius:12px 0 0 12px;width:86px;text-align:center}
.p-name{font-weight:500;font-size:.94em;color:var(--text);line-height:1.4}
.p-link{display:inline-flex;align-items:center;gap:5px;padding:7px 17px;color:#fff;text-decoration:none;
  border-radius:50px;font-size:.8em;font-weight:700;transition:transform .2s,box-shadow .2s;white-space:nowrap}
.p-link:hover{transform:scale(1.07);box-shadow:0 4px 16px rgba(0,0,0,.2)}

/* CATEGORY COLORS (keyed to original index) */
.cat-0 .cat-icon{background:rgba(255,107,107,.12)}.cat-0 h3{color:var(--coral)}.cat-0 .cat-count{background:var(--coral)}.cat-0 .p-link{background:linear-gradient(135deg,#ff6b6b,#ee5a5a)}
.cat-1 .cat-icon{background:rgba(255,163,77,.12)}.cat-1 h3{color:#e8590c}.cat-1 .cat-count{background:var(--orange)}.cat-1 .p-link{background:linear-gradient(135deg,#ffa34d,#f08c00)}
.cat-2 .cat-icon{background:rgba(77,171,247,.12)}.cat-2 h3{color:var(--sky)}.cat-2 .cat-count{background:var(--sky)}.cat-2 .p-link{background:linear-gradient(135deg,#4dabf7,#339af0)}
.cat-3 .cat-icon{background:rgba(255,212,59,.15)}.cat-3 h3{color:#e67700}.cat-3 .cat-count{background:#fab005;color:#333}.cat-3 .p-link{background:linear-gradient(135deg,#fab005,#f59f00);color:#333}
.cat-4 .cat-icon{background:rgba(105,219,124,.12)}.cat-4 h3{color:#2b8a3e}.cat-4 .cat-count{background:var(--lime);color:#1b5e20}.cat-4 .p-link{background:linear-gradient(135deg,#51cf66,#40c057)}
.cat-5 .cat-icon{background:rgba(151,117,250,.12)}.cat-5 h3{color:var(--purple)}.cat-5 .cat-count{background:var(--purple)}.cat-5 .p-link{background:linear-gradient(135deg,#9775fa,#845ef7)}
.cat-6 .cat-icon{background:rgba(56,217,169,.12)}.cat-6 h3{color:#099268}.cat-6 .cat-count{background:var(--teal);color:#004d40}.cat-6 .p-link{background:linear-gradient(135deg,#38d9a9,#20c997)}
.cat-7 .cat-icon{background:rgba(247,131,172,.12)}.cat-7 h3{color:var(--pink)}.cat-7 .cat-count{background:var(--pink)}.cat-7 .p-link{background:linear-gradient(135deg,#f783ac,#e64980)}
.cat-8 .cat-icon{background:rgba(92,124,250,.12)}.cat-8 h3{color:var(--blue)}.cat-8 .cat-count{background:var(--blue)}.cat-8 .p-link{background:linear-gradient(135deg,#5c7cfa,#4263eb)}
.cat-9 .cat-icon{background:rgba(255,107,107,.08)}.cat-9 h3{color:#c92a2a}.cat-9 .cat-count{background:#fa5252}.cat-9 .p-link{background:linear-gradient(135deg,#fa5252,#e03131)}
.cat-10 .cat-icon{background:rgba(56,217,169,.08)}.cat-10 h3{color:#087f5b}.cat-10 .cat-count{background:#12b886}.cat-10 .p-link{background:linear-gradient(135deg,#12b886,#0ca678)}
.cat-11 .cat-icon{background:rgba(255,163,77,.08)}.cat-11 h3{color:#d9480f}.cat-11 .cat-count{background:#ff922b}.cat-11 .p-link{background:linear-gradient(135deg,#ff922b,#f76707)}
.cat-12 .cat-icon{background:rgba(230,73,128,.1)}.cat-12 h3{color:var(--rose)}.cat-12 .cat-count{background:var(--rose)}.cat-12 .p-link{background:linear-gradient(135deg,#e64980,#d6336c)}
.cat-13 .cat-icon{background:rgba(255,212,59,.1)}.cat-13 h3{color:#c2255c}.cat-13 .cat-count{background:#f06595}.cat-13 .p-link{background:linear-gradient(135deg,#f06595,#e64980)}
.cat-14 .cat-icon{background:rgba(92,124,250,.08)}.cat-14 h3{color:#364fc7}.cat-14 .cat-count{background:#748ffc}.cat-14 .p-link{background:linear-gradient(135deg,#748ffc,#5c7cfa)}
.cat-15 .cat-icon{background:rgba(105,219,124,.08)}.cat-15 h3{color:#2f9e44}.cat-15 .cat-count{background:#51cf66;color:#1b5e20}.cat-15 .p-link{background:linear-gradient(135deg,#51cf66,#40c057)}
.cat-16 .cat-icon{background:rgba(151,117,250,.08)}.cat-16 h3{color:#6741d9}.cat-16 .cat-count{background:#7950f2}.cat-16 .p-link{background:linear-gradient(135deg,#7950f2,#6741d9)}
.cat-17 .cat-icon{background:rgba(134,142,150,.1)}.cat-17 h3{color:#495057}.cat-17 .cat-count{background:#868e96}.cat-17 .p-link{background:linear-gradient(135deg,#868e96,#495057)}

/* NO RESULTS */
.no-results{text-align:center;padding:50px 20px;color:var(--text-dim);font-size:1.15em;display:none}
.no-results.show{display:block}
.no-results .big-emoji{font-size:3em;display:block;margin-bottom:10px}

/* SITE CTA */
.site-cta{max-width:1100px;margin:8px auto 0;padding:0 16px}
.site-cta a{display:flex;align-items:center;gap:18px;text-decoration:none;color:#fff;border-radius:22px;
  padding:24px 26px;background:linear-gradient(135deg,#5c7cfa,#9775fa 55%,#e64980);
  box-shadow:0 8px 30px rgba(92,124,250,.3);transition:transform .25s,box-shadow .25s}
.site-cta a:hover{transform:translateY(-3px);box-shadow:0 14px 38px rgba(92,124,250,.4)}
.site-cta .cta-emoji{font-size:2.6em;flex-shrink:0;filter:drop-shadow(0 2px 4px rgba(0,0,0,.2))}
.site-cta .cta-txt{flex:1}
.site-cta .cta-txt b{display:block;font-size:1.22em;font-weight:900;margin-bottom:3px}
.site-cta .cta-txt span{font-size:.92em;opacity:.92;font-weight:500}
.site-cta .cta-arrow{font-size:1.6em;flex-shrink:0;transition:transform .25s}
.site-cta a:hover .cta-arrow{transform:translateX(-6px)}

/* BACK TO TOP */
.totop{position:fixed;bottom:22px;left:22px;width:50px;height:50px;border-radius:50%;border:none;
  background:linear-gradient(135deg,var(--sky),var(--purple));color:#fff;font-size:1.3em;cursor:pointer;
  box-shadow:0 6px 20px rgba(0,0,0,.22);opacity:0;pointer-events:none;transform:translateY(12px);
  transition:all .3s;z-index:130}
.totop.show{opacity:1;pointer-events:auto;transform:translateY(0)}
.totop:hover{transform:translateY(-3px) scale(1.06)}

/* FOOTER */
.footer{text-align:center;padding:26px 16px 10px;color:#bbb;font-size:.78em}

/* CONFETTI */
.confetti{position:absolute;width:8px;height:8px;border-radius:2px;opacity:.5;animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(-20px) rotate(0);opacity:.7}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

/* MOBILE */
@media (max-width:600px){
  .hero h1{font-size:1.7em}
  .stats-row{gap:8px}.stat-pill{padding:6px 14px;font-size:.82em}
  .group-header h2{font-size:1.08em}
  .category-header{padding:12px 14px;gap:10px}.category-header h3{font-size:1em}
  .cat-icon{width:40px;height:40px;font-size:1.3em}
  .p-row td{padding:8px 8px}.p-link{padding:6px 13px;font-size:.75em}
  .gnav-btn{padding:7px 13px;font-size:.78em}
  .site-cta a{padding:18px;gap:12px}.site-cta .cta-emoji{font-size:2em}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* PRINT */
@media print{
  .toolbar,.groupnav,.totop,.confetti,.hero-emoji,.site-cta .cta-arrow{display:none!important}
  .category.collapsed .cat-body{display:block!important}
  .category{break-inside:avoid;box-shadow:none;border:1px solid #ddd}
  .p-link{color:#333!important;background:none!important;border:1px solid #999}
}
</style>
</head>

/* ===== Macro-groups: map original category indices into clear topic areas ===== */
const groups = [
  { name:'יציאת מצרים ופרשות שמות', emoji:'🔥', color:'#ff6b6b', cats:[0,1,2,3] },
  { name:'מידות טובות ועבודת ה׳',     emoji:'💛', color:'#f59f00', cats:[4,7,10,5] },
  { name:'פלא הבריאה והתבוננות',      emoji:'✨', color:'#5c7cfa', cats:[8,9] },
  { name:'חגים, מועדים וטבע',         emoji:'🍃', color:'#20c997', cats:[6,13] },
  { name:'סיפורי צדיקים והלכה',       emoji:'📜', color:'#f76707', cats:[11,14] },
  { name:'חינוך, מדע וכלים',          emoji:'🛠️', color:'#868e96', cats:[12,15,16,17] },
];

/* nikud + punctuation-insensitive normaliser */
function norm(s){
  return (s||'').toLowerCase()
    .replace(/[\u0591-\u05C7]/g,'')
    .replace(/["'\u05F3\u05F4\u2018\u2019\u201C\u201D`]/g,'')
    .replace(/[-\u2013\u2014]/g,' ')
    .replace(/\s+/g,' ').trim();
}

const container = document.getElementById('container');
const gnav = document.getElementById('groupnav');
let totalItems = 0;

groups.forEach((g, gi) => {
  // quick-nav chip
  const chip = document.createElement('button');
  chip.className = 'gnav-btn';
  chip.textContent = g.emoji + ' ' + g.name;
  chip.style.background = g.color;
  chip.onclick = () => document.getElementById('grp-' + gi)
        .scrollIntoView({ behavior:'smooth', block:'start' });
  gnav.appendChild(chip);

  // group section
  const section = document.createElement('section');
  section.className = 'group';
  section.id = 'grp-' + gi;

  let gTotal = 0;
  g.cats.forEach(ci => { if (categories[ci]) gTotal += categories[ci].items.length; });

  const head = document.createElement('div');
  head.className = 'group-header';
  head.innerHTML = `<span class="group-emoji">${g.emoji}</span>
      <h2>${g.name}</h2>
      <span class="group-total">${gTotal} מצגות</span>`;
  section.appendChild(head);

  g.cats.forEach(ci => {
    const cat = categories[ci];
    if (!cat) return;
    totalItems += cat.items.length;

    const div = document.createElement('div');
    div.className = 'category cat-' + ci + ' collapsed';   /* collapsed by default */
    div.id = 'cat-' + ci;
    div.dataset.group = gi;

    div.innerHTML = `
      <div class="category-header" role="button" tabindex="0" aria-expanded="false">
        <div class="cat-icon">${cat.icon}</div>
        <h3>${cat.title}</h3>
        <span class="cat-count">${cat.items.length}</span>
        <span class="cat-toggle">▼</span>
      </div>
      <div class="cat-body">
        <table class="p-table"><tbody>
          ${cat.items.map((item,i) => `
            <tr class="p-row" data-search="${norm(item.name)} ${norm(cat.title)} ${norm(g.name)}">
              <td>${i + 1}</td>
              <td><span class="p-name">${item.name}</span></td>
              <td><a href="${item.url}" target="_blank" rel="noopener" class="p-link">▶ פתיחה</a></td>
            </tr>`).join('')}
        </tbody></table>
      </div>`;
    section.appendChild(div);
  });

  container.appendChild(section);
});

/* counts */
document.getElementById('totalCount').textContent = totalItems;
document.getElementById('catCount').textContent = categories.length;
document.getElementById('grpCount').textContent = groups.length;

/* toggle helpers */
function setOpen(cat, open){
  cat.classList.toggle('collapsed', !open);
  const h = cat.querySelector('.category-header');
  if (h) h.setAttribute('aria-expanded', open ? 'true' : 'false');
}
document.querySelectorAll('.category-header').forEach(h => {
  const cat = h.closest('.category');
  h.addEventListener('click', () => setOpen(cat, cat.classList.contains('collapsed')));
  h.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault();
      setOpen(cat, cat.classList.contains('collapsed')); }
  });
});

/* open / close all (respect current search visibility) */
document.getElementById('openAll').onclick = () =>
  document.querySelectorAll('.category').forEach(c => { if (c.style.display !== 'none') setOpen(c, true); });
document.getElementById('closeAll').onclick = () =>
  document.querySelectorAll('.category').forEach(c => setOpen(c, false));

/* search */
const searchInput = document.getElementById('searchInput');
const searchCount = document.getElementById('searchCount');
const searchClear = document.getElementById('searchClear');
const noResults   = document.getElementById('noResults');

function runSearch(){
  const tokens = norm(searchInput.value).split(' ').filter(Boolean);
  searchClear.classList.toggle('show', tokens.length > 0);
  let total = 0, visCats = 0, visGroups = new Set();

  document.querySelectorAll('.category').forEach(cat => {
    let cv = 0;
    cat.querySelectorAll('.p-row').forEach(row => {
      const hay = row.dataset.search;
      const match = tokens.length === 0 || tokens.every(t => hay.includes(t));
      row.style.display = match ? '' : 'none';
      row.classList.toggle('hit', tokens.length > 0 && match);
      if (match && tokens.length) { cv++; total++; }
    });
    if (tokens.length === 0){
      cat.style.display = ''; setOpen(cat, false);          // reset to initial collapsed state
    } else {
      cat.style.display = cv > 0 ? '' : 'none';
      if (cv > 0){ visCats++; visGroups.add(cat.dataset.group); setOpen(cat, true); }
    }
  });

  document.querySelectorAll('.group').forEach(sec => {
    if (tokens.length === 0){ sec.style.display = ''; return; }
    const anyVisible = [...sec.querySelectorAll('.category')].some(c => c.style.display !== 'none');
    sec.style.display = anyVisible ? '' : 'none';
  });

  searchCount.textContent = tokens.length
    ? `🎯 ${total} מצגות · ${visCats} נושאים · ${visGroups.size} תחומים`
    : '';
  noResults.classList.toggle('show', tokens.length > 0 && total === 0);
}
searchInput.addEventListener('input', runSearch);
searchClear.addEventListener('click', () => { searchInput.value=''; runSearch(); searchInput.focus(); });

/* back to top */
const totop = document.getElementById('totop');
window.addEventListener('scroll', () =>
  totop.classList.toggle('show', window.scrollY > 500), { passive:true });
totop.onclick = () => window.scrollTo({ top:0, behavior:'smooth' });

/* confetti */
const hero = document.getElementById('hero');
const cc = ['#ff6b6b','#ffa34d','#ffd43b','#69db7c','#4dabf7','#9775fa','#f783ac'];
for (let i=0;i<20;i++){
  const c=document.createElement('div'); c.className='confetti';
  c.style.left=Math.random()*100+'%'; c.style.top=Math.random()*100+'%';
  c.style.background=cc[Math.floor(Math.random()*cc.length)];
  c.style.animationDuration=(4+Math.random()*6)+'s'; c.style.animationDelay=Math.random()*5+'s';
  c.style.width=(5+Math.random()*6)+'px'; c.style.height=(5+Math.random()*6)+'px';
  c.style.borderRadius=Math.random()>0.5?'50%':'2px';
  hero.appendChild(c);
}
</script>
