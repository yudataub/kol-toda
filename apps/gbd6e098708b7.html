<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>שִׁבְעַת הַמִּינִים 🌾🍇 טוּ בִּשְׁבָט</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
            text-align: right;
        }

        .game-container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: 2.5em;
            color: #2d5016;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            line-height: 1.4;
        }

        .intro-text {
            font-size: 1.3em;
            line-height: 2;
            color: #333;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #fff9c4 0%, #fff59d 100%);
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .lesson-content {
            font-size: 1.25em;
            line-height: 2;
            color: #333;
            margin-bottom: 25px;
            padding: 25px;
            background: linear-gradient(135deg, #c8e6c9 0%, #a5d6a7 100%);
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .highlight {
            background-color: #ffeb3b;
            padding: 3px 8px;
            border-radius: 5px;
            font-weight: bold;
        }

        .seven-species-box {
            background: linear-gradient(135deg, #fff9c4 0%, #fff59d 100%);
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            border: 3px solid #f57f17;
            text-align: center;
            font-size: 1.3em;
            line-height: 1.8;
        }

        .reflection-box {
            background: linear-gradient(135deg, #e1bee7 0%, #ce93d8 100%);
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            border-right: 5px solid #7b1fa2;
            font-size: 1.2em;
            line-height: 1.8;
        }

        .question-container {
            margin: 30px 0;
        }

        .question-text {
            font-size: 1.35em;
            font-weight: bold;
            color: #1565c0;
            margin-bottom: 20px;
            padding: 15px;
            background: #e1f5fe;
            border-radius: 10px;
            border-right: 4px solid #0288d1;
        }

        .answers-grid {
            display: grid;
            gap: 15px;
            margin-bottom: 20px;
        }

        .answer-btn {
            padding: 18px 25px;
            font-size: 1.2em;
            background: linear-gradient(135deg, #81c784 0%, #66bb6a 100%);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: right;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            line-height: 1.6;
        }

        .answer-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
            background: linear-gradient(135deg, #66bb6a 0%, #4caf50 100%);
        }

        .answer-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .feedback {
            padding: 20px;
            margin: 20px 0;
            border-radius: 12px;
            font-size: 1.25em;
            line-height: 1.8;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }

            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
            color: #155724;
            border-right: 5px solid #28a745;
        }

        .incorrect {
            background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
            color: #721c24;
            border-right: 5px solid #dc3545;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e0e0e0;
            border-radius: 15px;
            margin: 20px 0;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4caf50 0%, #8bc34a 100%);
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .nav-btn {
            padding: 15px 40px;
            font-size: 1.3em;
            background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .nav-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .certificate {
            text-align: center;
            padding: 40px;
            background: linear-gradient(135deg, #fff9c4 0%, #fff176 100%);
            border-radius: 20px;
            border: 5px solid #f57f17;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);

        .certificate h2 {
            font-size: 2.5em;
            color: #f57f17;
            margin-bottom: 20px;
        }

        .certificate p {
            font-size: 1.4em;
            line-height: 2;
            margin: 15px 0;
        }

        .score-display {
            font-size: 2em;
            color: #2e7d32;
            font-weight: bold;
            margin: 20px 0;
        }

        .reflection-questions {
            text-align: right;

            padding: 25px;

            border-radius: 15px;

        }

            margin-top: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
            font-size: 1.1em;
        }

            display: inline-block;

            background: linear-gradient(135deg, #e91e63 0%, #c2185b 100%);

            text-decoration: none;

            }

            .nav-btn {

                font-size: 1.1em;
            }

            0%, 100% { transform: scale(1); }

        }

        .pulse {
            animation: pulse 2s infinite;
        }

</head>
<body>
    <div class="game-container" id="gameContainer"></div>

    <script>
        // ===============================
        // הגדרות ומשתנים גלובליים
        // ===============================
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby-wgLUmHzqneFw1r4S_pdkcc398yoLMlJfu3CJUvbcZTMI8QZMkGB_42Evl7L0BJxF/exec";
        
        let audioContext = null;
        let userName = "";
        let currentLesson = -1;
        let score = 0;
        let lessonScore = 0;
        let currentQuestionIndex = 0;

        // ===============================
        // פונקציות אודיו
        // ===============================
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playTone(frequency, duration, delay = 0) {
            initAudio();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = frequency;
            oscillator.type = "sine";
            
            const startTime = audioContext.currentTime + delay;
            gainNode.gain.setValueAtTime(0.3, startTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
            
            oscillator.start(startTime);
            oscillator.stop(startTime + duration);
        }

        function playSuccessSound() {
            playTone(523.25, 0.15, 0);    // C5
            playTone(659.25, 0.15, 0.15); // E5
            playTone(783.99, 0.3, 0.3);   // G5
        }

        function playCompletionSound() {
            playTone(523.25, 0.2, 0);     // C5
            playTone(659.25, 0.2, 0.2);   // E5
            playTone(783.99, 0.2, 0.4);   // G5
            playTone(1046.5, 0.2, 0.6);   // C6
            playTone(783.99, 0.2, 0.8);   // G5
            playTone(659.25, 0.4, 1.0);   // E5
        }

        // ===============================
        // פונקציית ערבוב מערך
        // ===============================
        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        // ===============================
        // שליחת ציונים לגוגל
        // ===============================
        async function sendScoreToTeacher() {
            const now = new Date();
            const data = {
                name: userName,
                score: `${score}/12`,
                percentage: `${Math.round((score/12)*100)}%`,
                gameName: document.title,
                date: now.toLocaleDateString("he-IL"),
                time: now.toLocaleTimeString("he-IL")
            };
            
            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: "POST",
                    headers: {"Content-Type": "text/plain"},
                    body: JSON.stringify(data)
                });
                console.log("✅ הנתונים נשלחו בהצלחה!");
            } catch (error) {
                console.error("❌ שגיאה בשליחה:", error);
            }
        }

        // ===============================
        // נתוני שיעורים
        // ===============================

                    <div class="seven-species-box">

        // הצגת מבוא
        // ===============================
        function renderIntro() {
            const container = document.getElementById("gameContainer");
            container.innerHTML = `
                <h1>🌾 שִׁבְעַת הַמִּינִים 🍇</h1>
                <h2 style="text-align: center; color: #2d5016; font-size: 1.8em; margin-bottom: 20px;">מִשְׂחַק טוּ בִּשְׁבָט מְיֻחָד!</h2>
                <div class="intro-text">
                    <p>🌟 שָׁלוֹם וּבָרוּךְ הַבָּא! 💖</p>
                    <p>הַיּוֹם נִלְמַד עַל הַמַּתָּנָה הַכִי מְיֻחֶדֶת שֶׁל אֶרֶץ יִשְׂרָאֵל! 🎁</p>
                    <p>מָה זֶה שִׁבְעַת הַמִּינִים? 🤔</p>
                    <p>לָמָּה הֵם כָּל כָּךְ חֲשׁוּבִים? ⭐</p>
                    <p>וְאֵיךְ הַשֵּׁם מְבָרֵךְ אוֹתָנוּ דַּרְכָּם? 💚</p>
                    <p>תִּתְכּוֹנֵן לְמַסָּע מָתוֹק וּמְרַגֵּשׁ! ✨</p>
                    <p style="margin-top: 20px; font-size: 1.1em;">📚 <strong>4 שִׁיעוּרִים</strong> טְעִימִים</p>
                    <p>❓ <strong>12 שְׁאֵלוֹת</strong> מְעַנְיְנוֹת</p>
                    <p>💖 הַרְבֵּה <strong>אַהֲבַת הַשֵּׁם!</strong></p>
                </div>
                <div style="text-align: center; margin-top: 30px;">
                    <button class="nav-btn pulse" onclick="askUserName()">בּוֹא נַתְחִיל! 🚀</button>
                </div>
            `;
        }

        // ===============================
        // בקשת שם
        // ===============================
        function askUserName() {
            userName = prompt("מָה שִׁמְךָ? 💫");
            if (!userName || userName.trim() === "") {
                userName = "תַּלְמִיד יָקָר";
            }
            startGame();
        }

        // ===============================
        // התחלת משחק
        // ===============================
        function startGame() {
            currentLesson = 0;
            score = 0;
            renderLesson(0);
        }

        // ===============================
        // הצגת שיעור
        // ===============================
        function renderLesson(lessonIndex) {
            lessonScore = 0;
            currentQuestionIndex = 0;
            
            const lesson = lessons[lessonIndex];
            const container = document.getElementById("gameContainer");
            
            const progressPercent = ((lessonIndex) / lessons.length) * 100;
            
            container.innerHTML = `
                <h1>${lesson.title}</h1>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${progressPercent}%">
                        שִׁיעוּר ${lessonIndex + 1} מִתּוֹךְ ${lessons.length}
                    </div>
                </div>
                <div class="lesson-content">
                    ${lesson.content}
                </div>
                <div class="reflection-box">
                    ${lesson.reflection}
                </div>
                <div style="text-align: center; margin-top: 30px;">
                    <button class="nav-btn" onclick="startQuestions()">בּוֹא נַעֲנֶה עַל שְׁאֵלוֹת! 📝</button>
                </div>
            `;
        }

        // ===============================
        // התחלת שאלות
        // ===============================
        function startQuestions() {
            currentQuestionIndex = 0;
            showQuestion();
        }

        // ===============================
        // הצגת שאלה
        // ===============================
        function showQuestion() {
            const lesson = lessons[currentLesson];
            const question = lesson.questions[currentQuestionIndex];
            const container = document.getElementById("gameContainer");
            
            const shuffledAnswers = shuffleArray(question.answers.map((ans, idx) => ({text: ans, index: idx})));
            
            const progressPercent = ((currentLesson * 3 + currentQuestionIndex) / 12) * 100;
            
            container.innerHTML = `
                <h1>${lesson.title}</h1>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${progressPercent}%">
                        ${currentLesson * 3 + currentQuestionIndex + 1} / 12 שְׁאֵלוֹת
                    </div>
                </div>
                <div class="question-container">
                    <div class="question-text">
                        ❓ שְׁאֵלָה ${currentQuestionIndex + 1}:<br>
                        ${question.question}
                    </div>
                    <div class="answers-grid">
                        ${shuffledAnswers.map(ans => `
                            <button class="answer-btn" onclick="checkAnswer(${ans.index})">${ans.text}</button>
                        `).join("")}
                    </div>
                </div>
                <div id="feedbackArea"></div>
            `;
        }

        // ===============================
        // בדיקת תשובה
        // ===============================
        function checkAnswer(selectedIndex) {
            initAudio();
            
            const lesson = lessons[currentLesson];
            const question = lesson.questions[currentQuestionIndex];
            const isCorrect = selectedIndex === question.correct;
            
            const buttons = document.querySelectorAll(".answer-btn");
            buttons.forEach(btn => btn.disabled = true);
            
            const feedbackArea = document.getElementById("feedbackArea");
            
            if (isCorrect) {
                score++;
                lessonScore++;
                playSuccessSound();
                
                const praises = [
                    `מְצֻיָּן, ${userName}! ⭐`,
                    `נִפְלָא, ${userName}! 💪`,
                    `כָּל הַכָּבוֹד, ${userName}! 🎯`,
                    `פְּצָצָה, ${userName}! 🔥`
                ];
                const randomPraise = praises[Math.floor(Math.random() * praises.length)];
                
                feedbackArea.innerHTML = `
                    <div class="feedback correct">
                        <strong>${randomPraise}</strong><br>
                        ${question.explanation}<br>
                        <em style="margin-top: 10px; display: block;">הַשֵּׁם שָׂמֵחַ כְּשֶׁאַתָּה לוֹמֵד בְּאַהֲבָה! 💖</em>
                    </div>
                `;
            } else {
                playTone(200, 0.3, 0);
                
                feedbackArea.innerHTML = `
                    <div class="feedback incorrect">
                        <strong>לֹא בְּדִיּוּק, ${userName}... 🤔</strong><br>
                        ${question.explanation}<br>
                        <em style="margin-top: 10px; display: block;">גַּם כְּשֶׁטּוֹעִים - לוֹמְדִים! הַשֵּׁם אוֹהֵב אוֹתְךָ! 💡</em>
                    </div>
                `;
            }
            
            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex < lesson.questions.length) {
                    showQuestion();
                } else {
                    showLessonSummary();
                }
            }, 4000);
        }

        // ===============================
        // סיכום שיעור
        // ===============================
        function showLessonSummary() {
            const container = document.getElementById("gameContainer");
            const lesson = lessons[currentLesson];
            
            const passThreshold = 2;
            const passed = lessonScore >= passThreshold;
            
            if (passed) {
                if (lessonScore === 3) {
                    playCompletionSound();
                    container.innerHTML = `
                        <h1>🏆 מַדְהִים, ${userName}! 🏆</h1>
                        <div class="feedback correct" style="text-align: center; font-size: 1.4em;">
                            <p>עָנִיתָ נָכוֹן עַל כָּל הַשְּׁאֵלוֹת!</p>
                            <p style="font-size: 2em; margin: 20px 0;">3/3 ⭐⭐⭐</p>
                            <p>אַתָּה שׁוֹלֵט בַּנּוֹשֵׂא!</p>
                            <p>אַתָּה חַי בְּאַהֲבַת ה'! 💖</p>
                        </div>
                        <div style="text-align: center; margin-top: 30px;">
                            <button class="nav-btn" onclick="nextLesson()">יַלָּה לַשִּׁיעוּר הַבָּא! 🚀</button>
                        </div>
                    `;
                } else {
                    playSuccessSound();
                    container.innerHTML = `
                        <h1>💪 כִּמְעַט מֻשְׁלָם, ${userName}! 💪</h1>
                        <div class="feedback correct" style="text-align: center; font-size: 1.4em;">
                            <p>עָנִיתָ נָכוֹן עַל ${lessonScore} מִתּוֹךְ 3 שְׁאֵלוֹת!</p>
                            <p style="font-size: 2em; margin: 20px 0;">${lessonScore}/3 ⭐</p>
                            <p>מַמָּשׁ כְּמוֹ בְּאַהֲבָה - מַמְשִׁיךְ לִצְמֹחַ! 🌱</p>
                            <p>הַשֵּׁם גֵּאֶה בְּךָ! 💖</p>
                        </div>
                        <div style="text-align: center; margin-top: 30px;">
                            <button class="nav-btn" onclick="nextLesson()">יַלָּה לַשִּׁיעוּר הַבָּא! 🚀</button>
                        </div>
                    `;
                }
            } else {
                container.innerHTML = `
                    <h1>💡 בּוֹא נְנַסֶּה שׁוּב, ${userName}! 💡</h1>
                    <div class="feedback incorrect" style="text-align: center; font-size: 1.4em;">
                        <p>עָנִיתָ נָכוֹן עַל ${lessonScore} מִתּוֹךְ 3 שְׁאֵלוֹת</p>
                        <p>צָרִיךְ לְפָחוֹת 2 תְּשׁוּבוֹת נְכוֹנוֹת כְּדֵי לְהַמְשִׁיךְ</p>
                        <p>אֲבָל זֶה בְּסֵדֶר! גַּם כְּשֶׁטּוֹעִים - לוֹמְדִים! 💚</p>
                        <p>הַשֵּׁם אוֹהֵב אוֹתְךָ בְּאַהֲבָה וְסַבְלָנוּת! 💖</p>
                    </div>
                    <div style="text-align: center; margin-top: 30px;">
                        <button class="nav-btn" onclick="renderLesson(${currentLesson})">בּוֹא נְנַסֶּה שׁוּב! 🔄</button>
                    </div>
                `;
            }
        }

        // ===============================
        // מעבר לשיעור הבא
        // ===============================
        function nextLesson() {
            currentLesson++;
            if (currentLesson < lessons.length) {
                renderLesson(currentLesson);
            } else {
                showCertificate();
            }
        }

        // ===============================
        // הצגת תעודה
        // ===============================
        function showCertificate() {
            playCompletionSound();
            
            const container = document.getElementById("gameContainer");
            const percentage = Math.round((score / 12) * 100);
            
            let grade = "";
            if (percentage === 100) grade = "מֻשְׁלָם! 🏆";
            else if (percentage >= 90) grade = "מְעֻלֶּה! ⭐";
            else if (percentage >= 75) grade = "טוֹב מְאֹד! 💪";
            else grade = "יָפֶה! 💚";
            
            container.innerHTML = `
                <div class="certificate">
                    <h2>🎓 תְּעוּדַת הִצְטַיְּנוּת 🎓</h2>
                    <p style="font-size: 1.8em; margin: 20px 0;">
                        <strong>${userName}</strong>
                    </p>
                    <p>סִיַּמְתָּ בְּהַצְלָחָה אֶת</p>
                    <p style="font-size: 1.5em; color: #2d5016;"><strong>מִשְׂחַק שִׁבְעַת הַמִּינִים 🌾🍇</strong></p>
                    <div class="score-display">
                        ${score} / 12 נְכוֹנוֹת (${percentage}%)
                    </div>
                    <p style="font-size: 1.6em; color: #f57f17; margin: 20px 0;">
                        <strong>${grade}</strong>
                    </p>
                    <div class="seven-species-box" style="margin: 30px 0;">
                        <p style="font-size: 1.3em; margin-bottom: 15px;"><strong>שִׁבְעַת הַמִּינִים:</strong></p>
                        <p>🌾 חִטָּה • 🌾 שְׂעֹרָה • 🍇 גֶּפֶן</p>
                        <p>🫐 תְּאֵנָה • 🍎 רִמּוֹן • 🫒 זַיִת • 🌴 תָּמָר</p>
                    </div>
                    <p style="font-size: 1.2em; margin: 20px 0; line-height: 1.8;">
                        💫 <em>"אֶרֶץ חִטָּה וּשְׂעֹרָה וְגֶפֶן וּתְאֵנָה וְרִמּוֹן,<br>אֶרֶץ זֵית שֶׁמֶן וּדְבָשׁ"</em> 💫
                    </p>
                    <p style="margin-top: 20px;">הַשֵּׁם שָׂמֵחַ מִמְּךָ! אַתָּה יוֹדֵעַ אֶת הַמַּתָּנוֹת שֶׁלּוֹ! 🌈</p>
                </div>
                
                <div class="reflection-questions">
                    <h3>💭 שְׁאֵלוֹת לְמַחְשָׁבָה:</h3>
                    <p>🌟 אֵיזֶה מִין מִשִּׁבְעַת הַמִּינִים אֲנִי הַכִי אוֹהֵב? לָמָּה?</p>
                    <p>🍇 אֵיךְ אֲנִי יָכוֹל לְהוֹדוֹת לַשֵּׁם עַל שִׁבְעַת הַמִּינִים?</p>
                    <p>💖 מָה אֲנִי מַרְגִּישׁ כְּשֶׁאֲנִי מְבָרֵךְ עַל פֵּרוֹת אֶרֶץ יִשְׂרָאֵל?</p>
                </div>
                
                <div style="text-align: center; margin: 30px 0;">
                    <p style="font-size: 1.3em; color: #e91e63; font-weight: bold;">🎉 מַזָּל טוֹב, ${userName}! נִכְנַסְתָּ לְהַגְרָלָה נוֹשֵׂאת פְּרָסִים! 🎁</p>
                    <a href="https://forms.gle/A66uubei4XSX6SG2A" target="_blank" class="lottery-link">
                        📋 לְרִישׁוּם לַהַגְרָלָה - לְחַץ כָּאן!
                    </a>
                </div>
                
                <div class="contact-info">
                    <p><strong>נִבְנָה בְּאַהֲבָה עַל יְדֵי:</strong></p>
                    <p>הָרַב יְהוּדָה טָאוּב מִקִּרְיַת אַתָּא</p>
                    <p>📞 לִפְרָטִים: 0527139520</p>
                </div>
            `;
            
            sendScoreToTeacher();
        }

        // ===============================
        // התחלה
        // ===============================
        renderIntro();
    </script>
</body>
</html>
