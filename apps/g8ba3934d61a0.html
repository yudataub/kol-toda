<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>קְרִיעַת יַם סוּף - סוֹד שְׁנֵי הַפְּסוּקִים 💖</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700;900&family=Heebo:wght@300;400;700&display=swap');

:root {
  --deep-sea: #0a1628;
  --sea-mid: #0d2b55;
  --sea-light: #1a4a8a;
  --wave-blue: #2563eb;
  --gold: #f5c842;
  --gold-light: #fde68a;
  --white-foam: #f0f8ff;
  --green-ok: #22c55e;
  --red-soft: #ef4444;
  --text-light: #e2f0ff;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Heebo', Arial, sans-serif;
  background: var(--deep-sea);
  min-height: 100vh;
  direction: rtl;
  text-align: right;
  overflow-x: hidden;
  position: relative;
}

/* ======= ANIMATED SEA BACKGROUND ======= */
.sea-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  background: linear-gradient(180deg,
    #0a1628 0%,
    #0d2b55 30%,
    #1a4a8a 60%,
    #0d2b55 100%);
  overflow: hidden;
}

.wave-layer {
  position: absolute;
  bottom: 0;
  left: -100%;
  width: 300%;
  height: 200px;
  opacity: 0.15;
  animation: waveMove 8s linear infinite;
}
.wave-layer:nth-child(2) { animation-delay: -3s; opacity: 0.1; bottom: 20px; }
.wave-layer:nth-child(3) { animation-delay: -5s; opacity: 0.08; bottom: 40px; }

.wave-layer svg { width: 100%; height: 100%; }

@keyframes waveMove {
  0% { transform: translateX(0); }
  100% { transform: translateX(33.33%); }
}

.stars {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 50%;
}
.star {
  position: absolute;
  width: 3px; height: 3px;
  background: white;
  border-radius: 50%;
  animation: twinkle 3s ease-in-out infinite;
}
@keyframes twinkle {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 1; }
}

/* ======= CONTAINER ======= */
#gameContainer {
  position: relative;
  z-index: 10;
  max-width: 820px;
  margin: 0 auto;
  padding: 20px 16px 40px;
}

/* ======= WELCOME SCREEN ======= */
.welcome-screen {
  text-align: center;
  padding: 30px 10px;
  animation: fadeInUp 0.9s ease;
}

.welcome-logo {
  font-size: 5em;
  margin-bottom: 10px;
  animation: floatBob 3s ease-in-out infinite;
  display: block;
}
@keyframes floatBob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}

.welcome-title {
  font-family: 'Frank Ruhl Libre', serif;
  font-size: 2.6em;
  font-weight: 900;
  color: var(--gold);
  text-shadow: 0 2px 20px rgba(245,200,66,0.4), 0 0 60px rgba(245,200,66,0.2);
  line-height: 1.3;
  margin-bottom: 8px;
}

.welcome-subtitle {
  font-size: 1.15em;
  color: var(--text-light);
  margin-bottom: 8px;
  line-height: 1.9;
  opacity: 0.9;
}

.pasuk-preview {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(245,200,66,0.3);
  border-radius: 16px;
  padding: 16px 20px;
  margin: 14px auto;
  max-width: 600px;
  font-family: 'Frank Ruhl Libre', serif;
  font-size: 1.05em;
  color: var(--gold-light);
  line-height: 2;
  direction: rtl;
}

.name-input-box {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 24px;
  padding: 28px 30px;
  margin: 20px auto;
  max-width: 440px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
}

.name-input-box label {
  display: block;
  font-size: 1.25em;
  margin-bottom: 14px;
  color: var(--gold-light);
  font-weight: 700;
}

.name-input-box input {
  width: 85%;
  padding: 14px 18px;
  font-size: 1.2em;
  font-family: 'Heebo', sans-serif;
  background: rgba(255,255,255,0.12);
  border: 2px solid rgba(255,255,255,0.2);
  border-radius: 14px;
  text-align: center;
  direction: rtl;
  outline: none;
  color: white;
  transition: border-color 0.3s, box-shadow 0.3s;
}
.name-input-box input::placeholder { color: rgba(255,255,255,0.45); }
.name-input-box input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 20px rgba(245,200,66,0.25);
}

.start-btn {
  display: block;
  margin: 18px auto 0;
  padding: 14px 44px;
  font-size: 1.25em;
  font-family: 'Heebo', sans-serif;
  font-weight: 700;
  background: linear-gradient(135deg, var(--gold) 0%, #e8a020 100%);
  color: var(--deep-sea);
  border: none;
  border-radius: 50px;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  animation: pulseBtn 2.2s ease-in-out infinite;
  box-shadow: 0 4px 20px rgba(245,200,66,0.35);
}
.start-btn:hover {
  transform: translateY(-3px) scale(1.03);
  box-shadow: 0 8px 30px rgba(245,200,66,0.5);
}
@keyframes pulseBtn {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.04); }
}

/* ======= PROGRESS BAR ======= */
.progress-area {
  margin-bottom: 16px;
  animation: fadeInUp 0.5s ease;
}
.progress-label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}
.progress-label span {
  color: var(--text-light);
  font-size: 0.9em;
  opacity: 0.8;
}
.score-badge {
  background: rgba(245,200,66,0.2);
  border: 1px solid rgba(245,200,66,0.4);
  color: var(--gold);
  font-weight: 700;
  padding: 3px 14px;
  border-radius: 20px;
  font-size: 0.95em;
}
.progress-track {
  height: 10px;
  background: rgba(255,255,255,0.1);
  border-radius: 10px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--wave-blue), var(--gold));
  border-radius: 10px;
  transition: width 0.5s ease;
}

/* ======= LESSON CARD ======= */
.lesson-card {
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 24px;
  padding: 28px 28px 24px;
  margin-bottom: 16px;
  animation: fadeInUp 0.6s ease;
  box-shadow: 0 4px 30px rgba(0,0,0,0.2);
}

.lesson-badge {
  display: inline-block;
  background: linear-gradient(135deg, var(--wave-blue), #1e40af);
  color: white;
  font-size: 0.8em;
  font-weight: 700;
  padding: 4px 16px;
  border-radius: 20px;
  margin-bottom: 12px;
  letter-spacing: 0.5px;
}

.lesson-title {
  font-family: 'Frank Ruhl Libre', serif;
  font-size: 1.75em;
  font-weight: 900;
  color: var(--gold);
  margin-bottom: 16px;
  line-height: 1.4;
}

.lesson-body {
  color: var(--text-light);
  font-size: 1.1em;
  line-height: 2;
}
.lesson-body p { margin-bottom: 12px; }

.highlight-box {
  background: rgba(245,200,66,0.12);
  border-right: 4px solid var(--gold);
  border-radius: 0 12px 12px 0;
  padding: 12px 16px;
  margin: 14px 0;
  color: var(--gold-light);
  font-weight: 700;
  font-size: 1.05em;
  line-height: 1.9;
}

.pasuk-box {
  background: rgba(37,99,235,0.18);
  border: 1px solid rgba(37,99,235,0.4);
  border-radius: 14px;
  padding: 14px 18px;
  margin: 14px 0;
  font-family: 'Frank Ruhl Libre', serif;
  font-size: 1.1em;
  color: #bfdbfe;
  line-height: 2;
  direction: rtl;
}

.inspiration-line {
  background: rgba(245,200,66,0.08);
  border-radius: 12px;
  padding: 10px 16px;
  margin: 12px 0;
  color: var(--gold-light);
  font-style: italic;
  font-size: 0.98em;
  text-align: center;
}

/* ======= QUESTION CARD ======= */
.question-card {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 22px 24px;
  margin-bottom: 14px;
  animation: fadeInUp 0.5s ease;
}

.question-num {
  font-size: 0.82em;
  color: rgba(255,255,255,0.5);
  margin-bottom: 8px;
  font-weight: 700;
  letter-spacing: 1px;
}

.question-text {
  font-family: 'Frank Ruhl Libre', serif;
  font-size: 1.22em;
  color: white;
  margin-bottom: 18px;
  line-height: 1.7;
  font-weight: 700;
}

.answers-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
@media (max-width: 560px) {
  .answers-grid { grid-template-columns: 1fr; }
}

.answer-btn {
  background: rgba(255,255,255,0.07);
  border: 2px solid rgba(255,255,255,0.15);
  border-radius: 14px;
  padding: 13px 16px;
  color: var(--text-light);
  font-size: 1em;
  font-family: 'Heebo', sans-serif;
  cursor: pointer;
  transition: all 0.22s ease;
  text-align: right;
  direction: rtl;
  line-height: 1.6;
}
.answer-btn:hover {
  background: rgba(37,99,235,0.25);
  border-color: rgba(37,99,235,0.6);
  transform: translateY(-2px);
  color: white;
}
.answer-btn.correct {
  background: rgba(34,197,94,0.2);
  border-color: var(--green-ok);
  color: #bbf7d0;
  pointer-events: none;
}
.answer-btn.wrong {
  background: rgba(239,68,68,0.15);
  border-color: var(--red-soft);
  color: #fecaca;
  pointer-events: none;
  animation: shake 0.4s ease;
}
.answer-btn.disabled {
  pointer-events: none;
  opacity: 0.55;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

/* ======= FEEDBACK ======= */
.feedback-box {
  border-radius: 16px;
  padding: 16px 20px;
  margin-top: 12px;
  animation: fadeInUp 0.4s ease;
  line-height: 1.8;
}
.feedback-box.correct-fb {
  background: rgba(34,197,94,0.12);
  border: 1px solid rgba(34,197,94,0.35);
  color: #bbf7d0;
}
.feedback-box.wrong-fb {
  background: rgba(239,68,68,0.1);
  border: 1px solid rgba(239,68,68,0.3);
  color: #fecaca;
}
.feedback-title {
  font-size: 1.1em;
  font-weight: 700;
  margin-bottom: 6px;
}
.feedback-explain {
  font-size: 0.97em;
  opacity: 0.9;
}
.feedback-love {
  margin-top: 8px;
  font-style: italic;
  color: var(--gold-light);
  font-size: 0.95em;
}

/* ======= LESSON COMPLETE ======= */
.lesson-complete {
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 24px;
  padding: 32px 28px;
  text-align: center;
  animation: fadeInUp 0.6s ease;
}
.lesson-complete .big-emoji { font-size: 4em; display: block; margin-bottom: 10px; }
.lesson-complete h2 {
  font-family: 'Frank Ruhl Libre', serif;
  font-size: 1.9em;
  color: var(--gold);
  margin-bottom: 10px;
}
.lesson-complete p { color: var(--text-light); font-size: 1.05em; line-height: 1.9; }
.next-btn {
  display: inline-block;
  margin-top: 20px;
  padding: 13px 40px;
  font-size: 1.15em;
  font-family: 'Heebo', sans-serif;
  font-weight: 700;
  background: linear-gradient(135deg, var(--gold) 0%, #e8a020 100%);
  color: var(--deep-sea);
  border: none;
  border-radius: 50px;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 4px 18px rgba(245,200,66,0.35);
}
.next-btn:hover { transform: translateY(-3px); box-shadow: 0 7px 28px rgba(245,200,66,0.5); }

/* ======= RETRY ======= */
.retry-area {
  background: rgba(239,68,68,0.08);
  border: 1px solid rgba(239,68,68,0.25);
  border-radius: 20px;
  padding: 22px;
  text-align: center;
  margin-top: 14px;
  animation: fadeInUp 0.5s ease;
}
.retry-area p { color: #fca5a5; margin-bottom: 14px; font-size: 1.05em; line-height: 1.8; }
.retry-btn {
  padding: 11px 34px;
  font-size: 1.1em;
  font-family: 'Heebo', sans-serif;
  font-weight: 700;
  background: rgba(239,68,68,0.3);
  border: 2px solid rgba(239,68,68,0.5);
  color: #fca5a5;
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.2s;
}
.retry-btn:hover { background: rgba(239,68,68,0.45); transform: translateY(-2px); }

/* ======= CERTIFICATE ======= */
.certificate {
  background: linear-gradient(145deg, rgba(13,43,85,0.95), rgba(10,22,40,0.98));
  border: 2px solid rgba(245,200,66,0.5);
  border-radius: 28px;
  padding: 36px 30px;
  text-align: center;
  position: relative;
  overflow: hidden;
  animation: fadeInUp 0.8s ease;
  box-shadow: 0 0 60px rgba(245,200,66,0.15), inset 0 0 80px rgba(37,99,235,0.08);
}
.cert-corner {
  position: absolute;
  font-size: 2.5em;
  opacity: 0.25;
}
.cert-corner.tl { top: 14px; right: 14px; }
.cert-corner.tr { top: 14px; left: 14px; }
.cert-corner.bl { bottom: 14px; right: 14px; }
.cert-corner.br { bottom: 14px; left: 14px; }

.cert-title {
  font-family: 'Frank Ruhl Libre', serif;
  font-size: 1.9em;
  font-weight: 900;
  color: var(--gold);
  margin-bottom: 6px;
  text-shadow: 0 0 30px rgba(245,200,66,0.4);
}
.cert-subtitle { color: var(--text-light); font-size: 1em; margin-bottom: 18px; opacity: 0.8; }
.cert-name {
  font-family: 'Frank Ruhl Libre', serif;
  font-size: 2.4em;
  font-weight: 900;
  color: white;
  margin: 10px 0;
  text-shadow: 0 2px 12px rgba(255,255,255,0.2);
}
.cert-score {
  font-size: 3.2em;
  font-weight: 900;
  color: var(--gold);
  font-family: 'Frank Ruhl Libre', serif;
  margin: 6px 0;
}
.cert-pasuk {
  font-family: 'Frank Ruhl Libre', serif;
  font-size: 1.05em;
  color: var(--gold-light);
  margin: 16px auto;
  max-width: 480px;
  line-height: 1.9;
  opacity: 0.9;
  padding: 12px 16px;
  border-top: 1px solid rgba(245,200,66,0.2);
  border-bottom: 1px solid rgba(245,200,66,0.2);
}
.cert-questions {
  background: rgba(255,255,255,0.04);
  border-radius: 16px;
  padding: 18px 20px;
  margin: 18px 0;
  text-align: right;
}
.cert-questions h3 {
  color: var(--gold-light);
  font-size: 1em;
  margin-bottom: 12px;
  font-weight: 700;
}
.cert-questions li {
  color: var(--text-light);
  font-size: 0.95em;
  margin-bottom: 8px;
  line-height: 1.7;
  opacity: 0.85;
  list-style: none;
  padding-right: 4px;
}
.cert-questions li::before { content: "💭 "; }

.lottery-box {
  background: rgba(245,200,66,0.1);
  border: 1px solid rgba(245,200,66,0.3);
  border-radius: 18px;
  padding: 16px 20px;
  margin: 16px 0;
}
.lottery-box p { color: var(--gold-light); font-size: 1.0em; line-height: 1.8; margin-bottom: 8px; }
.lottery-link {
  display: inline-block;
  background: linear-gradient(135deg, var(--gold), #e8a020);
  color: var(--deep-sea);
  font-weight: 700;
  font-size: 1.05em;
  padding: 10px 28px;
  border-radius: 50px;
  text-decoration: none;
  transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 3px 14px rgba(245,200,66,0.3);
}
.lottery-link:hover { transform: translateY(-2px); box-shadow: 0 6px 22px rgba(245,200,66,0.45); }

.contact-box {
  color: rgba(255,255,255,0.5);
  font-size: 0.85em;
  margin-top: 14px;
  line-height: 1.8;
}

/* ======= ANIMATIONS ======= */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(22px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes bloom {
  0% { transform: scale(0.5); opacity: 0; }
  60% { transform: scale(1.12); opacity: 1; }
  100% { transform: scale(1); }
}

/* ======= RESPONSIVE ======= */
@media (max-width: 600px) {
  .welcome-title { font-size: 1.9em; }
  .lesson-title { font-size: 1.45em; }
  .name-input-box input { width: 90%; font-size: 1.1em; }
  .start-btn { padding: 12px 30px; font-size: 1.1em; }
  .lesson-card, .question-card { padding: 18px 16px; }
  .cert-name { font-size: 1.9em; }
  .cert-score { font-size: 2.5em; }
}
</style>
</head>
<body>

<!-- Animated sea background -->
<div class="sea-bg" aria-hidden="true">
  <div class="stars" id="starsContainer"></div>
  <div class="wave-layer">
    <svg viewBox="0 0 1200 120" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,60 C200,100 400,20 600,60 C800,100 1000,20 1200,60 L1200,120 L0,120 Z" fill="#2563eb"/>
    </svg>
  </div>
  <div class="wave-layer">
    <svg viewBox="0 0 1200 120" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,40 C300,90 600,10 900,50 C1050,70 1150,30 1200,50 L1200,120 L0,120 Z" fill="#1d4ed8"/>
    </svg>
  </div>
  <div class="wave-layer">
    <svg viewBox="0 0 1200 120" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,70 C150,30 350,90 550,55 C750,20 950,80 1200,45 L1200,120 L0,120 Z" fill="#1e40af"/>
    </svg>
  </div>
</div>

<div class="game-container" id="gameContainer"></div>

<script>
// ======= GLOBAL =======
const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby-wgLUmHzqneFw1r4S_pdkcc398yoLMlJfu3CJUvbcZTMI8QZMkGB_42Evl7L0BJxF/exec';

let audioContext = null;
function getAudioContext() {
  if (!audioContext) {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  return audioContext;
}

let userName = "";
let currentLesson = 0;
let score = 0;
let currentLessonScore = 0;
let currentQuestion = 0;
let answeredQuestions = [];
let gamePhase = "welcome"; // welcome | lesson | questions | lessonComplete | retry | certificate

// Stars
(function buildStars() {
  const c = document.getElementById('starsContainer');
  if (!c) return;
  for (let i = 0; i < 55; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = (Math.random() * 4) + 's';
    s.style.animationDuration = (2 + Math.random() * 3) + 's';
    s.style.opacity = Math.random() * 0.6 + 0.2;
    c.appendChild(s);
  }
})();

// ======= LESSONS DATA =======
const lessons = [
  {
    id: 0,
    badge: "חֵלֶק א׳",
    title: "לָמָּה הַפָּסוּק חוֹזֵר פַּעֲמַיִם? 🌊",
    emoji: "📖",
    content: `
      <p>בְּפָרָשַׁת בְּשַׁלַּח, כְּשֶׁבְּנֵי יִשְׂרָאֵל יוֹצְאִים מִמִּצְרַיִם, קוֹרֶה מַשֶּׁהוּ מִדְהִים — הַיָּם נִבְקָע! 🌊✨</p>

function playCorrectSound() {
  const ctx = getAudioContext();
  [261.63, 329.63, 392.00].forEach((freq, i) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = freq;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.18);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.18 + 0.3);
    osc.start(ctx.currentTime + i * 0.18);
    osc.stop(ctx.currentTime + i * 0.18 + 0.35);
  });
}

// ======= HELPERS =======
function shuffleArray(arr) {
  const s = [...arr];
  for (let i = s.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [s[i], s[j]] = [s[j], s[i]];
  }
  return s;
}

function getContainer() { return document.getElementById('gameContainer'); }

function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function msg(template) { return template.replace('{name}', userName); }

function getProgressPct() {
  const total = lessons.length * 3;
  return Math.round((score / total) * 100);
}

// ======= RENDER LESSON =======
function showLesson(idx) {
  const lesson = lessons[idx];
  currentLessonScore = 0;
  currentQuestion = 0;
  answeredQuestions = new Array(lesson.questions.length).fill(null);

  // Pre-shuffle answers
  const shuffled = lesson.questions.map(q => {
    const indexed = q.answers.map((a, i) => ({ ...a, origIdx: i }));
    return shuffleArray(indexed);
  });
  lessonData[idx] = { score: 0, shuffled };

  const totalQ = lessons.length * 3;
  const done = idx * 3;

  const c = getContainer();
  c.innerHTML = `
    <div class="progress-area">
      <div class="progress-label">
        <span>שִׁיעוּר ${idx + 1} מִתּוֹךְ ${lessons.length} 🌊</span>
        <span class="score-badge">⭐ ${score} / ${totalQ}</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:${Math.round((done/totalQ)*100)}%"></div></div>
    </div>

    <div class="lesson-card" id="lessonCard">
      <span class="lesson-badge">${lesson.badge}</span>
      <h2 class="lesson-title">${lesson.emoji} ${lesson.title}</h2>
      <div class="lesson-body">${lesson.content}</div>
      <div class="inspiration-line">💬 <em>${lesson.inspiration}</em></div>
      <div style="text-align:center; margin-top: 20px;">
        <button class="next-btn" id="toQuestionsBtn">לְשָׁאֵלוֹת 🎯</button>
      </div>
    </div>
  `;

  document.getElementById('toQuestionsBtn').addEventListener('click', () => {
    showQuestionsView(idx);
  });
}

        <span class="score-badge">⭐ ${score} / ${totalQ}</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:${Math.round(((lessonIdx*3)/totalQ)*100)}%"></div></div>
    </div>
    ${qHtml}
    <div id="lessonResultArea"></div>
  `;

  // Bind answer buttons
  document.querySelectorAll('.answer-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      const qi = parseInt(this.dataset.qi);
      const correct = this.dataset.correct === 'true';
      handleAnswer(lessonIdx, qi, correct, this);
    });
  });
}

// ======= HANDLE ANSWER =======
function handleAnswer(lessonIdx, qi, correct, btnEl) {
  if (answeredQuestions[qi] !== null) return;
  answeredQuestions[qi] = correct;

  const lesson = lessons[lessonIdx];
  const grid = document.getElementById('agrid-' + qi);
  const fbArea = document.getElementById('feedback-' + qi);

  // Disable all in this question
  grid.querySelectorAll('.answer-btn').forEach(b => {
    b.classList.add('disabled');
    if (b.dataset.correct === 'true') b.classList.add('correct');
  });
  if (!correct) {
    btnEl.classList.remove('disabled');
    btnEl.classList.add('wrong');
  }

  if (correct) {
    score++;
    currentLessonScore++;
    lessonData[lessonIdx].score++;
    playCorrectSound();
    const title = msg(rand(correctMessages));
    const explain = lesson.questions[qi].explanation;
    const love = lesson.questions[qi].loveMsg;
    fbArea.innerHTML = `
      <div class="feedback-box correct-fb">
        <div class="feedback-title">${title}</div>
        <div class="feedback-explain">✅ ${explain}</div>
        <div class="feedback-love">💫 ${love}</div>
      </div>
    `;
    // Update score badge
    const sb = document.getElementById('progressFill');
    if (sb) sb.style.width = Math.round((score / (lessons.length * 3)) * 100) + '%';
    document.querySelectorAll('.score-badge').forEach(el => el.textContent = '⭐ ' + score + ' / ' + (lessons.length * 3));
  } else {
    playWrongSound();
    const title = msg(rand(wrongMessages));
    const explain = lesson.questions[qi].explanation;
    fbArea.innerHTML = `
      <div class="feedback-box wrong-fb">
        <div class="feedback-title">${title}</div>
        <div class="feedback-explain">💡 ${explain}</div>
        <div class="feedback-love">נַסֶּה שׁוּב, ${userName} — גַּם בְּדֶרֶךְ לְטָעוּת אֲנַחְנוּ לוֹמְדִים לֶאֱהֹב אֶת הַשֵּׁם! 🌊</div>
      </div>
    `;
  }

  // Check if all answered
  if (answeredQuestions.every(a => a !== null)) {
    setTimeout(() => showLessonResult(lessonIdx), 700);
  }
}

// ======= LESSON RESULT =======
function showLessonResult(lessonIdx) {
  const ls = lessonData[lessonIdx].score;
  const total = lessons.length * 3;
  const resultArea = document.getElementById('lessonResultArea');
  if (!resultArea) return;

  if (ls >= 2) {
    // Pass
    playCompletionSound();
    const isLast = lessonIdx === lessons.length - 1;
    let msg3 = ls === 3
      ? `מַדְהִים, ${userName}! 🏆 אַתָּה שׁוֹלֵט! אַתָּה חַי בְּאַהֲבַת ה'! 🎉`
      : `כִּמְעַט מֻשְׁלָם, ${userName}! 💪 מַמָּשׁ כְּמוֹ בְּאַהֲבָה — מַמְשִׁיךְ לִצְמֹחַ! 🌱`;

    resultArea.innerHTML = `
      <div class="lesson-complete">
        <span class="big-emoji">${ls === 3 ? '🏆' : '💪'}</span>
        <h2>${msg3}</h2>
        <p>עָנִיתָ נָכוֹן עַל <strong>${ls}</strong> מִתּוֹךְ <strong>3</strong> שְׁאֵלוֹת בַּשִּׁיעוּר הַזֶּה! 🌊</p>
        ${!isLast
          ? `<button class="next-btn" id="nextLessonBtn">שִׁיעוּר הַבָּא ➡️</button>`
          : `<button class="next-btn" id="nextLessonBtn">לְתְּעוּדָה 🎓</button>`
        }
      </div>
    `;
    document.getElementById('nextLessonBtn').addEventListener('click', () => {
      if (isLast) showCertificate();
      else showLesson(lessonIdx + 1);
    });
  } else {
    // Fail - retry
    resultArea.innerHTML = `
      <div class="retry-area">
        <p>בֹּא נְנַסֶּה שׁוּב, ${userName}, בְּאַהֲבָה וְסַבְלָנוּת! 💖<br>
        עָנִיתָ נָכוֹן עַל ${ls} מִתּוֹךְ 3. צָרִיךְ לְפָחוֹת 2 כְּדֵי לְהַמְשִׁיךְ!</p>
        <button class="retry-btn" id="retryBtn">🔄 נְנַסֶּה שׁוּב!</button>
      </div>
    `;
    // Reset lesson score for retry
    score -= ls;
    lessonData[lessonIdx].score = 0;
    document.getElementById('retryBtn').addEventListener('click', () => {
      showLesson(lessonIdx);
    });
  }
  resultArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// ======= CERTIFICATE =======
async function sendScoreToTeacher() {
  const now = new Date();
  const data = {
    name: userName,
    score: score + "/" + (lessons.length * 3),
    percentage: Math.round((score / (lessons.length * 3)) * 100) + "%",
    gameName: document.title || "קריעת ים סוף — סוד שני הפסוקים",
    date: now.toLocaleDateString('he-IL'),
    time: now.toLocaleTimeString('he-IL')
  };
  try {
    await fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(data)
    });
    console.log('✅ הציון נשלח למורה!');
  } catch (e) {
    console.error('שגיאה:', e);
  }
}
