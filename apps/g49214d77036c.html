                        explanation: "כָּל הַכָּבוֹד! 💪 <span class='highlight'>כַּוָּנַת הַלֵּב בְּשעַת הַהַדְלָקָה</span> 🕯️💖 לְהוֹדוֹת עַל הַנִּסִּים - זֶה עִיקַּר הַמִּצְוָה!"
                    }
                ]
            }
        ];

        // ============================================
        // פונקציות עזר
        // ============================================
        
        function playSound(frequencies, duration = 200) {
            frequencies.forEach((freq, index) => {
                setTimeout(() => {
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    oscillator.frequency.value = freq;
                    oscillator.type = 'sine';
                    
                    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration/1000);
                    
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + duration/1000);
                }, index * duration);
            });
        }

        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function updateProgressBar() {
            const totalLessons = lessons.length;
            const progress = ((currentLesson + 1) / totalLessons) * 100;
            const progressText = `שִׁיעוּר ${currentLesson + 1} מִתּוֹךְ ${totalLessons}`;
            
            return `
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${progress}%">${progressText}</div>
                </div>
            `;
        }

        async function sendScoreToTeacher() {
            const now = new Date();
            const data = {
                name: userName,
                score: `${score}/${totalQuestions}`,
                percentage: `${Math.round((score/totalQuestions)*100)}%`,
                gameName: document.title,
                date: now.toLocaleDateString('he-IL'),
                time: now.toLocaleTimeString('he-IL')
            };
            
            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'text/plain'},
                    body: JSON.stringify(data)
                });
                console.log('✅ הַצִּיּוּן נִשְׁלַח לַמּוֹרֶה!');
            } catch (error) {
                console.error('❌ שְׁגִיאָה בַּשְּׁלִיחָה:', error);
            }
        }

        // ============================================
        // מסכי המשחק
        // ============================================

        function renderIntro() {
            const container = document.getElementById('gameContainer');
            container.innerHTML = `
                <h1>🕎 מַאי חֲנֻכָּה? - מַסָּע לְעֹמֶק הַחַג ✨</h1>
                
                <div class="intro-text">
                    <p>שָׁלוֹם חֲבֵרִים יְקָרִים! 💖 הַיּוֹם נֵלֵךְ בְּמַסָּע מְרַתֵּק לִשְׁאֵלָה שֶׁהַגְּמָרָא שׁוֹאֶלֶת: <span class="highlight">"מַאי חֲנֻכָּה?"</span> 🤔🕯️</p>
                    
                    <p>נִלְמַד דְּבָרִים מֻפְלָאִים מֵהַמַּהַר״ל 📚 וּמֵהַגָּאוֹן רַבִּי שְׁלֹמֹה זַלְמָן אוֹיֶרְבַּאךְ זַצַ״ל 🎓 - וּנְגַלֶּה יַחַד: <span class="highlight">מָה בֶּאֱמֶת עִיקַּר חַג הַחֲנֻכָּה?</span> 🎯✨</p>
                    
                    <p>נִרְאֶה שְׁאֵלוֹת מְעוֹרְרוֹת: 🔍 לָמָּה הַגְּמָרָא לֹא מַזְכִּירָה נֵרוֹת? 🕯️❓ מָה הַקֶּשֶׁר בֵּין נֵס הַשֶּׁמֶן לְנִצָּחוֹן עַל הַיְּוָנִים? ⚔️💫 וְהַאִם הַהַדְלָקָה הִיא רַק סִימָן אוֹ מַשֶּׁהוּ יוֹתֵר עָמֹק? 🤔💖</p>
                    
                    <p style="font-size: 1.5em; text-align: center; margin-top: 30px;">הַשֵּׁם אוֹהֵב אוֹתְךָ וְשָׂמֵחַ שֶׁאַתָּה כָּאן! 💕🌟</p>
                </div>
                
                <button class="btn-primary" onclick="askUserName()">בּוֹא נַתְחִיל! 🚀</button>
            `;
        }

        function askUserName() {
            userName = prompt("מָה שִׁמְךָ? 💫");
            if (!userName || userName.trim() === '') {
                userName = "תַּלְמִיד יָקָר";
            }
            startGame();
        }

        function startGame() {
            currentLesson = 0;
            score = 0;
            lessonScores = [0, 0, 0];
            renderLesson(0);
        }

        function renderLesson(lessonIndex) {
            if (lessonIndex >= lessons.length) {
                showCertificate();
                return;
            }

            currentLesson = lessonIndex;
            currentQuestionIndex = 0;
            const lesson = lessons[lessonIndex];
            
            const container = document.getElementById('gameContainer');
            container.innerHTML = `
                ${updateProgressBar()}
                
                <h2>${lesson.title}</h2>
                
                <div class="lesson-content">
                    ${lesson.content}
                </div>
                
                <div id="questionsContainer"></div>
                
                <div style="text-align: center; margin-top: 30px;">
                    <p style="font-size: 1.3em;">נִקּוּד כּוֹלֵל: ${score} 🌟</p>
                </div>
            `;

            renderQuestion(0);
        }

        function renderQuestion(questionIndex) {
            const lesson = lessons[currentLesson];
            if (questionIndex >= lesson.questions.length) {
                checkLessonCompletion();
                return;
            }

            const question = lesson.questions[questionIndex];
            const shuffledAnswers = shuffleArray(question.answers.map((ans, idx) => ({text: ans, index: idx})));
            
            const questionsContainer = document.getElementById('questionsContainer');
            questionsContainer.innerHTML = `
                <div class="question-container">
                    <div class="question-text">
                        שְׁאֵלָה ${questionIndex + 1}: ${question.question}
                    </div>
                    
                    <div id="answersContainer">
                        ${shuffledAnswers.map((ans, idx) => `
                            <button class="answer-btn" onclick="checkAnswer(${questionIndex}, ${ans.index})" id="answer-${idx}">
                                ${ans.text}
                            </button>
                        `).join('')}
                    </div>
                    
                    <div id="feedback-${questionIndex}"></div>
                </div>
            `;
        }

        function checkAnswer(questionIndex, selectedAnswer) {
            const lesson = lessons[currentLesson];
            const question = lesson.questions[questionIndex];
            const isCorrect = selectedAnswer === question.correct;
            
            const buttons = document.querySelectorAll('.answer-btn');
            buttons.forEach(btn => btn.disabled = true);
            
            const feedbackDiv = document.getElementById(`feedback-${questionIndex}`);
            
            if (isCorrect) {
                score++;
                lessonScores[currentLesson]++;
                playSound([261.63, 329.63, 392.00]);
                
                const encouragements = [
                    `מְצֻיָּן, ${userName}! ⭐`,
                    `נִפְלָא, ${userName}! 💪`,
                    `כָּל הַכָּבוֹד, ${userName}! 🎯`,
                    `פַּצְצָה, ${userName}! 🌟`
                ];
                const randomEncouragement = encouragements[Math.floor(Math.random() * encouragements.length)];
                
                feedbackDiv.innerHTML = `
                    <div class="feedback correct">
                        <p style="font-size: 1.5em; font-weight: bold;">${randomEncouragement}</p>
                        <p>${question.explanation}</p>
                        <p style="font-size: 1.3em; margin-top: 15px;">הַשֵּׁם שָׂמֵחַ וְגֵאֶה בְּךָ, ${userName}! 💖🙏</p>
                    </div>
                `;
            } else {
                feedbackDiv.innerHTML = `
                    <div class="feedback incorrect">
                        <p style="font-size: 1.5em; font-weight: bold;">לֹא בְּדִיּוּק, ${userName}... 🤔</p>
                        <p>${question.explanation}</p>
                        <p style="font-size: 1.3em; margin-top: 15px;">גַּם כְּשֶׁטּוֹעִים - לוֹמְדִים, ${userName}! הַשֵּׁם אוֹהֵב אוֹתְךָ! 💡💖</p>
                    </div>
                `;
            }
            
            setTimeout(() => {
                currentQuestionIndex++;
                renderQuestion(currentQuestionIndex);
            }, 4000);
        }

        function checkLessonCompletion() {
            const lessonScore = lessonScores[currentLesson];
            const questionsCount = lessons[currentLesson].questions.length;
            const percentage = (lessonScore / questionsCount) * 100;
            
            const container = document.getElementById('gameContainer');
            
            if (percentage >= 66) {
                playSound([261.63, 329.63, 392.00, 523.25, 392.00, 329.63]);
                
                let message = '';
                if (lessonScore === questionsCount) {
                    message = `מַדְהִים, ${userName}! 🏆 אַתָּה שׁוֹלֵט! אַתָּה חַי בְּאַהֲבַת ה'! 🎉`;
                } else {
                    message = `כִּמְעַט מֻשְׁלָם, ${userName}! 💪 מַמָּשׁ כְּמוֹ בְּאַהֲבָה - מַמְשִׁיךְ לִצְמֹחַ 🌱`;
                }
                
                container.innerHTML += `
                    <div style="background: #d4edda; padding: 30px; border-radius: 15px; text-align: center; margin-top: 30px; border: 3px solid #28a745;">
                        <h2 style="color: #155724;">${message}</h2>
                        <p style="font-size: 1.4em; margin: 20px 0;">סִיַּמְתָּ ${lessonScore} מִתּוֹךְ ${questionsCount} נָכוֹן! 🌟</p>
                        ${currentLesson < lessons.length - 1 ? 
                            `<button class="btn-primary" onclick="renderLesson(${currentLesson + 1})">הַמְשֵׁךְ לַשִּׁיעוּר הַבָּא! 🚀</button>` :
                            `<button class="btn-primary" onclick="showCertificate()">סִיּוּם הַמִּשְׂחָק! 🎓</button>`
                        }
                    </div>
                `;
            } else {
                container.innerHTML += `
                    <div style="background: #f8d7da; padding: 30px; border-radius: 15px; text-align: center; margin-top: 30px; border: 3px solid #dc3545;">
                        <h2 style="color: #721c24;">בּוֹא נְנַסֶּה שׁוּב, ${userName}! 💪</h2>
                        <p style="font-size: 1.4em; margin: 20px 0;">עָנִיתָ נָכוֹן עַל ${lessonScore} מִתּוֹךְ ${questionsCount}. צָרִיךְ לְפַחוֹת 2 נְכוֹנוֹת. 📚</p>
                        <p style="font-size: 1.2em;">גַּם בְּדֶרֶךְ לְהִתְעַלּוּת יֵשׁ נְפִילוֹת - זֶה חֵלֶק מֵהַדֶּרֶךְ! 🌈</p>
                        <button class="btn-primary" onclick="renderLesson(${currentLesson})">נַסֶּה שׁוּב בְּאַהֲבָה 💖</button>
                    </div>
                `;
            }
        }

        function showCertificate() {
            const percentage = Math.round((score / totalQuestions) * 100);
            
            sendScoreToTeacher();
            
            const container = document.getElementById('gameContainer');
            container.innerHTML = `
                <div class="certificate">
                    <h2>🏆 תְּעוּדַת הִצְטַיְּנוּת 🏆</h2>
                    
                    <p style="font-size: 1.8em; margin: 20px 0;">מוֹעֲנֶקֶת בְּזֹאת ל:</p>
                    <p class="name">${userName}</p>
                    
                    <p style="font-size: 1.5em; margin: 20px 0;">עַל הַשְׁלָמָה מְוֻפְלָאָה שֶׁל</p>
                    <p style="font-size: 1.6em; font-weight: bold; color: #c2185b;">מַאי חֲנֻכָּה? - מַסָּע לְעֹמֶק הַחַג 🕎</p>
                    
                    <p class="score">צִיּוּן: ${score} מִתּוֹךְ ${totalQuestions} (${percentage}%) ⭐</p>
                    
                    <div class="verse">
                        "לְהוֹדוֹת וּלְהַלֵּל לְשִׁמְךָ הַגָּדוֹל" 💖
                    </div>
                    
                    <div class="reflection-questions">
                        <h3>💭 שְׁאֵלוֹת לְמַחְשָׁבָה:</h3>
                        <p>🌟 כְּשֶׁאֲנִי מַדְלִיק נֵר חֲנֻכָּה, אֵיךְ אוּכַל לְהַרְגִּישׁ שֶׁאֲנִי מוֹדֶה לַשֵּׁם?</p>
                        <p>🌟 מָה הַנִּסִּים שֶׁהַשֵּׁם עוֹשֶׂה עִמִּי בְּכָל יוֹם?</p>
                        <p>🌟 אֵיךְ אוּכַל לְחַזֵּק אֶת הַהַכָּרַת טוֹבָה שֶׁלִּי לַשֵּׁם?</p>
                    </div>
                    
                    ${percentage >= 75 ? `
                        <div style="background: linear-gradient(135deg, #ff6b6b 0%, #feca57 100%); padding: 25px; border-radius: 15px; margin: 25px 0; color: white;">
                            <h3 style="font-size: 1.8em; margin-bottom: 15px;">🎉 מַזָּל טוֹב, ${userName}! 🎁</h3>
                            <p style="font-size: 1.3em;">נִכְנַסְתָּ לְהַגְרָלָה נוֹשֵׂאת פְּרָסִים!</p>
                            <a href="https://forms.gle/A66uubei4XSX6SG2A" target="_blank" class="lottery-link">
                                📋 לְרִישׁוּם לַחֲצוּ כָּאן!
                            </a>
                        </div>
                    ` : ''}
                    
                    <div class="contact-info">
                        <p style="font-size: 1.3em; font-weight: bold; margin-bottom: 10px;">נִבְנָה בְּאַהֲבָה עַל יְדֵי:</p>
                        <p style="font-size: 1.2em;">הָרַב יְהוּדָה טָאוּב מִקִּרְיַת אַתָּא</p>
                        <p style="font-size: 1.3em; margin-top: 10px;">📞 לִפְרָטִים: 0527139520</p>
                    </div>
                </div>
            `;
        }

        renderIntro();
    </script>
