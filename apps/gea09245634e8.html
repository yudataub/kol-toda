        }

            margin: 0 auto;
        }

        .welcome-screen {
            text-align: center;

        }

        .welcome-title {
            font-size: 2.6em;
            color: #ffd700;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.4);
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .welcome-subtitle {
            font-size: 1.25em;
            color: rgba(255,255,255,0.92);
            margin-bottom: 30px;
            line-height: 2;
        }

        .name-input-box {
            background: rgba(255,255,255,0.97);
            border-radius: 22px;
            padding: 32px 28px;
            margin: 20px auto;
            max-width: 430px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.25);
        }

        .name-input-box label {
            display: block;
            font-size: 1.45em;
            margin-bottom: 16px;
            color: #3a006f;
            font-weight: bold;
        }

        .name-input-box input {
            width: 82%;
            padding: 14px;
            font-size: 1.3em;
            border: 3px solid #6a0dad;
            border-radius: 14px;
            text-align: center;
            direction: rtl;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
            font-family: Arial, sans-serif;
        }

        .name-input-box input:focus {
            border-color: #ffd700;
            box-shadow: 0 0 16px rgba(255,215,0,0.4);
        }

        .start-btn {
            display: block;
            margin: 22px auto 0;
            padding: 15px 42px;
            font-size: 1.3em;
            background: linear-gradient(135deg, #6a0dad 0%, #ffd700 100%);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;

        .progress-bar {

            border-radius: 12px;
            transition: width 0.5s ease;
        }

        .progress-text {
            text-align: center;
            color: rgba(255,255,255,0.9);
            font-size: 0.95em;
            margin-bottom: 12px;
        }

        /* ===== כרטיס שיעור ===== */
        .lesson-card {
            background: rgba(255,255,255,0.97);
            border-radius: 20px;
            padding: 30px 28px;
            margin-bottom: 22px;
            box-shadow: 0 8px 28px rgba(0,0,0,0.18);
            animation: fadeIn 0.7s ease;
            direction: rtl;
        }

        .lesson-title {
            font-size: 1.75em;
            font-weight: bold;
            color: #3a006f;
            margin-bottom: 18px;
            line-height: 1.5;
            text-align: center;
        }

        .lesson-content {
            font-size: 1.18em;
            line-height: 2.1;
            color: #2c2c2c;
            direction: rtl;
        }

        .lesson-content p {
            margin-bottom: 14px;
        }

            background: linear-gradient(135deg, #fff9c4, #ffe0b2);
            border-right: 5px solid #ffd700;
            border-radius: 10px;
            padding: 14px 18px;
            margin: 18px 0;
            font-size: 1.1em;
            font-weight: bold;
            color: #4a2000;
            line-height: 2;
        }

        .love-box {
            background: linear-gradient(135deg, #fce4ec, #e1bee7);
            border-right: 5px solid #c62828;
            border-radius: 10px;
            padding: 14px 18px;
            margin: 16px 0;
            font-size: 1.05em;
            color: #4a0030;
            line-height: 2;
        }

        .inspiration-q {
            background: linear-gradient(135deg, #e3f2fd, #e8eaf6);
            border: 2px dashed #5c6bc0;
            border-radius: 10px;
            padding: 14px 18px;
            margin: 18px 0;
            font-size: 1.05em;
            color: #1a237e;
            line-height: 2;
            text-align: center;
        }

            margin-top: 22px;
        }

        .question-card {
            background: #f3e5f5;
            border-radius: 14px;
            padding: 20px 22px;
            margin-bottom: 20px;
            border-right: 5px solid #7b1fa2;
        }

        .question-text {
            font-size: 1.2em;
            font-weight: bold;
            color: #3a006f;
            margin-bottom: 16px;
            line-height: 1.8;
        }

        .question-num {
            background: #7b1fa2;
            color: white;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1em;
            margin-left: 10px;
            vertical-align: middle;
        }

        .answer-btn {
            display: block;
            width: 100%;
            padding: 12px 18px;
            margin-bottom: 10px;
            font-size: 1.1em;
            background: white;
            border: 2px solid #ba68c8;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: right;
            direction: rtl;
            font-family: Arial, sans-serif;
            color: #2c2c2c;
            line-height: 1.7;
        }

        .answer-btn:hover:not(:disabled) {
            background: #f3e5f5;
            border-color: #7b1fa2;
            transform: translateX(-3px);
        }

        .answer-btn.correct {
            background: #d4edda;
            border-color: #28a745;
            color: #1a5228;
        }

        .answer-btn.wrong {
            background: #f8d7da;
            border-color: #dc3545;
            color: #7b1c22;
        }

        .answer-btn.reveal-correct {
            background: #d4edda;
            border-color: #28a745;
            color: #1a5228;
        }

            padding: 14px 18px;
            margin-top: 12px;
            font-size: 1.05em;
            line-height: 1.9;

            border-right: 5px solid #28a745;
            color: #1a5228;
        }

        .feedback-box.wrong {
            background: #f8d7da;
            border-right: 5px solid #dc3545;
            color: #7b1c22;
        }

        .next-btn {
            display: block;
            margin: 24px auto 10px;
            padding: 15px 44px;
            font-size: 1.25em;
            background: linear-gradient(135deg, #6a0dad 0%, #c62828 100%);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: Arial, sans-serif;
        }

        .next-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 22px rgba(106,13,173,0.4);
        }

            border-radius: 18px;
            padding: 28px;
            text-align: center;
            margin-bottom: 20px;

            font-size: 1.8em;
            color: #3a006f;
            margin-bottom: 14px;

            font-size: 1.15em;
            color: #2c2c2c;
            line-height: 2;
        }

        .score-display {
            font-size: 2.5em;
            font-weight: bold;
            color: #6a0dad;
            margin: 12px 0;
        }

        /* ===== תעודה ===== */
        .certificate {
            background: linear-gradient(135deg, #fffde7, #fff8e1, #fff3e0);
            border: 4px solid #ffd700;
            border-radius: 22px;
            padding: 36px 30px;
            text-align: center;
            margin-bottom: 24px;

            color: #3a006f;
            margin-bottom: 10px;

        .certificate .cert-name {
            font-size: 2em;
            color: #c62828;
            font-weight: bold;
            margin: 14px 0;
        }

            font-size: 1.7em;
            color: #1a5228;
            font-weight: bold;
            margin: 10px 0;
        }

            font-size: 1.1em;
            color: #4a2000;
            font-style: italic;
            margin: 18px 0;
            line-height: 2;
            border: 2px solid #ffd700;
            border-radius: 10px;
            padding: 12px;
            background: rgba(255,215,0,0.1);
        }

        .lottery-box {
            background: linear-gradient(135deg, #e3f2fd, #bbdefb);
            border-radius: 14px;
            padding: 20px;
            margin: 18px 0;
            font-size: 1.1em;
            color: #0d47a1;
            line-height: 2;
        }

        .lottery-link {
            display: inline-block;
            background: linear-gradient(135deg, #1565c0, #0d47a1);
            color: white;
            padding: 12px 32px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 1.15em;
            margin-top: 10px;
            transition: transform 0.2s;
        }

        .lottery-link:hover {
            transform: translateY(-2px);
        }

        .contact-box {
            background: rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 16px;
            margin-top: 16px;
            color: rgba(255,255,255,0.9);
            font-size: 1em;
            text-align: center;
            line-height: 2;
        }

        /* ===== Score Header ===== */
        .score-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.12);
            border-radius: 12px;
            padding: 10px 18px;
            margin-bottom: 16px;
            color: white;
            font-size: 1em;
        }

        /* ===== Reflection Questions ===== */
        .reflection-box {
            background: rgba(255,255,255,0.97);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 18px;
        }

        .reflection-box h3 {
            font-size: 1.3em;
            color: #3a006f;
            margin-bottom: 14px;
        }

        .reflection-q {
            background: #f3e5f5;
            border-right: 4px solid #7b1fa2;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 10px;
            font-size: 1.05em;
            color: #2c2c2c;
            line-height: 1.8;
        }

        /* ===== אנימציות ===== */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .shake { animation: shake 0.4s ease; }
        .bounce { animation: bounce 0.5s ease; }

        /* ===== רספונסיבי ===== */
        @media (max-width: 600px) {
            .welcome-title { font-size: 1.9em; }
            .lesson-title { font-size: 1.4em; }
            .name-input-box input { width: 92%; font-size: 1.1em; }
            .start-btn { padding: 13px 32px; font-size: 1.1em; }
            .lesson-card { padding: 20px 16px; }
            .answer-btn { font-size: 1em; }
        }
    </style>
</head>

    <div class="game-container" id="gameContainer"></div>

                    <div class="highlight-box">

                        אִם הַדַּיָּן הוּא צַדִּיק עִם יִרְאַת שָׁמַיִם — לָמָּה לֹא נִסְמֹךְ עָלָיו?

        // ===== פונקציות עזר =====
        function shuffleArray(arr) {
            const s = [...arr];
            for (let i = s.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [s[i], s[j]] = [s[j], s[i]];
            }
            return s;
        }

        // ===== Web Audio =====
        function playCorrectSound() {
            try {
                const ctx = getAudioContext();
                const notes = [261.63, 329.63, 392.00];
                notes.forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.frequency.value = freq;
                    osc.type = 'sine';
                    gain.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.2);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.2 + 0.3);
                    osc.start(ctx.currentTime + i * 0.2);
                    osc.stop(ctx.currentTime + i * 0.2 + 0.3);
                });
            } catch(e) {}
        }

        function playCompletionSound() {
            try {
                const ctx = getAudioContext();
                const notes = [523.25, 659.25, 783.99, 1046.50, 783.99, 659.25];
                notes.forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.frequency.value = freq;
                    osc.type = 'sine';
                    gain.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.15);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.15 + 0.3);
                    osc.start(ctx.currentTime + i * 0.15);
                    osc.stop(ctx.currentTime + i * 0.15 + 0.3);
                });
            } catch(e) {}
        }

            lessonScore = 0;

            const progressPct = (index / lessons.length) * 100;

            // בניית שאלות עם ערבוב
            const shuffledQuestions = lesson.questions.map((q, qIdx) => {
                const answersWithIndex = q.answers.map((a, i) => ({ text: a, originalIndex: i }));
                const shuffled = shuffleArray(answersWithIndex);
                const newCorrect = shuffled.findIndex(a => a.originalIndex === q.correct);
                return {
                    question: q.question,
                    shuffledAnswers: shuffled,
                    correctIndex: newCorrect,
                    explanation: q.explanation,
                    originalQIdx: qIdx
                };
            });

            // שמירה לשימוש בבדיקת תשובות
            window.currentShuffledQuestions = shuffledQuestions;

            let questionsHTML = '';

                    answersHTML += `<button class="answer-btn" id="ans-${qIdx}-${aIdx}" onclick="checkAnswer(${qIdx}, ${aIdx})">${ans.text}</button>`;
                });
                questionsHTML += `

                            <span class="question-num">${qIdx + 1}</span>
                            ${q.question}
                        </div>
                        <div id="answers-${qIdx}">
                            ${answersHTML}
                        </div>
                        <div id="feedback-${qIdx}"></div>

            container.innerHTML = `

        // ===== בדיקת תשובה =====
        function checkAnswer(qIdx, selectedAIdx) {
            const q = window.currentShuffledQuestions[qIdx];

            // אם כבר ענה על שאלה זו — התעלם
            if (lessonAnswers[qIdx] !== undefined) return;

            const isCorrect = (selectedAIdx === q.correctIndex);
            lessonAnswers[qIdx] = isCorrect;
            answeredInLesson++;
            if (isCorrect) {
                lessonScore++;
                score++;
                playCorrectSound();
            }

            // נעל את כל הכפתורים של השאלה הזו
            q.shuffledAnswers.forEach((_, aIdx) => {
                const btn = document.getElementById("ans-" + qIdx + "-" + aIdx);
                if (btn) {
                    btn.disabled = true;
                    if (aIdx === q.correctIndex) {
                        btn.classList.add('reveal-correct');
                    } else if (aIdx === selectedAIdx && !isCorrect) {
                        btn.classList.add('wrong');
                    }
                }
            });

            // משוב
            const feedbackEl = document.getElementById("feedback-" + qIdx);
            const encouragements = [
                "מְצֻיָּן, " + userName + "! ⭐",
                "נִפְלָא, " + userName + "! 💪",

                "פַּצָּצָה, " + userName + "! 💥"
            ];
            const randomEncouragement = encouragements[Math.floor(Math.random() * encouragements.length)];

            if (isCorrect) {
                feedbackEl.innerHTML = `
                    <div class="feedback-box correct bounce">
                        ${randomEncouragement}<br>
                        <strong>✅ ${q.explanation}</strong><br>
                        💖 הַשֵּׁם שָׂמֵחַ כְּשֶׁאַתָּה לוֹמֵד בְּאַהֲבָה, ${userName}!

            } else {
