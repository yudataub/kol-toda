        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(frequencies, duration = 0.3) {
            frequencies.forEach((freq, index) => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = freq;
                oscillator.type = 'sine';
                
                const startTime = audioContext.currentTime + (index * duration);
                gainNode.gain.setValueAtTime(0.3, startTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
                
                oscillator.start(startTime);
                oscillator.stop(startTime + duration);
            });
        }

                        <input type="text" id="nameInput" class="name-input" placeholder="הַקְלֵד/י אֶת שִׁמְךָ כָּאן...">
                    </div>
                    
                    <button class="btn-primary" onclick="startGame()">בּוֹאוּ נַתְחִיל! 🚀</button>
                </div>
            `;
        }

        // התחלת המשחק
        function startGame() {
            const nameInput = document.getElementById('nameInput');
            userName = nameInput ? nameInput.value.trim() : '';
            
            if (!userName) {
                alert('אָנָּא הַזֵּן/הַזִּינִי אֶת שִׁמְךָ לִפְנֵי הַהַתְחָלָה! 💫');
                return;
            }
            
            currentLesson = 0;
            renderLesson(0);
        }

        // הצגת שיעור
        function renderLesson(lessonIndex) {
            if (lessonIndex >= lessons.length) {
                showCertificate();
                return;
            }
            
            currentLesson = lessonIndex;
            currentQuestionIndex = 0;
            lessonScore = 0;
            answeredQuestions = [];
            
            const lesson = lessons[lessonIndex];
            const container = document.getElementById('gameContainer');
            
            container.innerHTML = `
                <h1>שִׁיעוּר ${lessonIndex + 1} מִתּוֹךְ 4</h1>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${((lessonIndex) / lessons.length) * 100}%">
                        ${Math.round(((lessonIndex) / lessons.length) * 100)}%
                    </div>
                </div>
                
                <h2>${lesson.title}</h2>
                
                <div class="lesson-content">
                    ${lesson.content}
                </div>
                
                <div class="thinking-box">
                    ${lesson.thinkingQuestion}
                </div>
                
                <div id="questionsArea"></div>
            `;
            
            renderQuestion(0);
        }

        // הצגת שאלה
        function renderQuestion(questionIndex) {
            if (questionIndex >= 3) {
                checkLessonCompletion();
                return;
            }
            
            currentQuestionIndex = questionIndex;
            const lesson = lessons[currentLesson];
            const question = lesson.questions[questionIndex];
            
            // ערבוב תשובות
            const shuffledAnswers = shuffleArray(question.answers.map((ans, idx) => ({ text: ans, index: idx })));
            
            const questionsArea = document.getElementById('questionsArea');
            questionsArea.innerHTML = `
                <div class="question-container">
                    <div class="question-text">שְׁאֵלָה ${questionIndex + 1} מִתּוֹךְ 3:</div>
                    <div class="question-text">${question.q}</div>
                    <div id="answersArea">
                        ${shuffledAnswers.map((ans, idx) => `
                            <button class="answer-btn" onclick="checkAnswer(${ans.index})" id="btn${idx}">
                                ${ans.text}
                            </button>
                        `).join('')}
                    </div>
                    <div id="feedbackArea"></div>
                </div>
            `;
        }

        // בדיקת תשובה
        function checkAnswer(selectedIndex) {
            const lesson = lessons[currentLesson];
            const question = lesson.questions[currentQuestionIndex];
            const isCorrect = selectedIndex === question.correct;
            
            // השבתת כפתורים
            const buttons = document.querySelectorAll('.answer-btn');
            buttons.forEach(btn => btn.disabled = true);
            
            // סימון התשובה
            buttons.forEach((btn, idx) => {
                const answerText = btn.textContent.trim();
                const answerIndex = question.answers.findIndex(a => a.trim() === answerText);
                if (answerIndex === selectedIndex) {
                    btn.classList.add(isCorrect ? 'correct' : 'wrong');
                }
                if (answerIndex === question.correct && !isCorrect) {
                    btn.classList.add('correct');
                }
            });
            
            // הצגת משוב
            const feedbackArea = document.getElementById('feedbackArea');
            const encouragements = [
                'מְצֻיָּן! ⭐',
                'נִפְלָא! 💪',
                'כָּל הַכָּבוֹד! 🎯',
                'מַדְהִים! 🏆',
                'פַּצְצָה! 🌟'
            ];
            
            if (isCorrect) {
                score++;
                lessonScore++;
                const encouragement = encouragements[Math.floor(Math.random() * encouragements.length)];
                feedbackArea.innerHTML = `
                    <div class="feedback correct">
                        <strong>${encouragement}</strong><br><br>
                        ${question.explanation}<br><br>
                        <em>הַשֵּׁם שָׂמֵחַ כְּשֶׁאַתָּה/אַתְּ לוֹמֵד/ת בְּאַהֲבָה! 💖</em>
                    </div>
                `;
                playSound([523.25, 659.25, 783.99]); // C-E-G
            } else {
                feedbackArea.innerHTML = `
                    <div class="feedback wrong">
                        <strong>לֹא בְּדִיּוּק... 🤔</strong><br><br>
                        ${question.explanation}<br><br>
                        <em>גַּם כְּשֶׁטּוֹעִים - לוֹמְדִים! הַשֵּׁם אוֹהֵב אוֹתְךָ! 💡💖</em>
                    </div>
                `;
            }
            
            answeredQuestions.push(isCorrect);
            
            // כפתור המשך
            setTimeout(() => {
                feedbackArea.innerHTML += `
                    <button class="btn-primary" onclick="nextQuestion()">הַמְשֵׁךְ ⬅️</button>
                `;
            }, 1000);
        }

        // שאלה הבאה
        function nextQuestion() {
            renderQuestion(currentQuestionIndex + 1);
        }

        // בדיקת סיום שיעור
        function checkLessonCompletion() {
            const questionsArea = document.getElementById('questionsArea');
            
            if (lessonScore >= 2) {
                // הצלחה!
                questionsArea.innerHTML = `
                    <div class="feedback correct" style="font-size: 1.3em; text-align: center; padding: 30px;">
                        <strong>🏆 מַדְהִים! ${lessonScore}/3 נָכוֹן! 🏆</strong><br><br>
                        ${lessonScore === 3 ? 
                            'אַתָּה/אַתְּ שׁוֹלֵט/ת! אַתָּה/אַתְּ חַי/חַיָּה בְּאַהֲבַת ה\'! 🎉💖✨' :
                            'כִּמְעַט מֻשְׁלָם! 💪 מַמָּשׁ כְּמוֹ בְּאַהֲבָה — מַמְשִׁיךְ/מַמְשִׁיכָה לִצְמֹחַ! 🌱💖'}
                        <br><br>
                        ${currentLesson < lessons.length - 1 ?
                            '<button class="btn-primary" onclick="nextLesson()">לְשִׁיעוּר הַבָּא! 🚀</button>' :
                            '<button class="btn-primary" onclick="showCertificate()">לִתְעוּדַת הַסִּיּוּם! 🎓</button>'}
                    </div>
                `;
                if (lessonScore === 3) {
                    playSound([523.25, 659.25, 783.99, 1046.50, 783.99, 659.25]); // C-E-G-C-G-E
                }
            } else {
                // צריך לנסות שוב
                questionsArea.innerHTML = `
                    <div class="feedback wrong" style="font-size: 1.3em; text-align: center; padding: 30px;">
                        <strong>בּוֹא נְנַסֶּה שׁוּב 🤗</strong><br><br>
                        קִבַּלְתָּ/קִבַּלְתְּ ${lessonScore}/3 נָכוֹן.<br>
                        צָרִיךְ לְפָחוֹת 2 נְכוֹנוֹת כְּדֵי לְהַמְשִׁיךְ.<br><br>
                        <em>לִפְעָמִים גַּם בַּדֶּרֶךְ לִטְעוֹת אָנוּ לוֹמְדִים לְאַהֵב אֶת הַשֵּׁם 💖</em><br><br>
                        <button class="btn-primary" onclick="renderLesson(${currentLesson})">נַסֶּה שׁוּב בְּאַהֲבָה 💪</button>
                    </div>
                `;
            }
        }

        // שיעור הבא
        function nextLesson() {
            renderLesson(currentLesson + 1);
        }

        // הצגת תעודה
        function showCertificate() {
            playSound([523.25, 659.25, 783.99, 1046.50, 783.99, 659.25]); // C-E-G-C-G-E
            
            const container = document.getElementById('gameContainer');
            const percentage = Math.round((score / 12) * 100);
            
            container.innerHTML = `
                <div class="certificate">
                    <h2>📜 תְּעוּדַת סִיּוּם 📜</h2>
                    
                    <p style="font-size: 1.5em; margin: 20px 0;">מוּעֶנֶקֶת בָּזֹאת לְ:</p>
                    
                    <div class="student-name">${userName}</div>
                    
                    <p style="font-size: 1.2em; margin: 20px 0;">
                        עַל סִיּוּם מוּצְלָח שֶׁל הַמִּשְׂחָק<br>
                        "הַהוֹדָיָה הִיא הַדֶּלֶת אֶל הַשֵּׁם"
                    </p>
                    
                    <div class="score-display">
                        הַצִּיּוּן שֶׁלְּךָ: ${score}/12 (${percentage}%) 🌟
                    </div>
                    
                    <p style="font-size: 1.1em; margin: 20px 0;">
                        יְהִי רָצוֹן שֶׁתָּמִיד תִּמְצָא/תִּמְצְאִי אֶת הַשַּׁעַר פָּתוּחַ<br>
                        לְהִתְקָרֵב אֶל הַטּוֹב 💖
                    </p>
                    
                    <div class="verse">
                        "פִּתְחוּ-לִי שַׁעֲרֵי-צֶדֶק; אָבֹא-בָם, אוֹדֶה יָ-הּ"<br>
                        (תְּהִלִּים קי"ח, יט) 🙏
                    </div>
                    
                    <div class="reflection-questions">
                        <h3>שְׁאֵלוֹת לְמַחְשָׁבָה 💭</h3>
                        <ul>
                            <li>אֵיךְ אוּכַל לְהָבִיא יוֹתֵר אַהֲבַת ה' לַלִּמּוּד הַבָּא שֶׁלִּי? 📚</li>
                            <li>אֵיזוֹ מִצְוָה אֲנִי רוֹצֶה/רוֹצָה לְקַיֵּם הַיּוֹם מִתּוֹךְ שִׂמְחָה? 🎊</li>
                            <li>עַל מָה אֲנִי יָכוֹל/יְכוֹלָה לְהוֹדוֹת לַשֵּׁם בָּרֶגַע הַזֶּה? 💖</li>
                        </ul>
                    </div>
                    
                    ${percentage >= 75 ? `
                        <div style="background: linear-gradient(135deg, #00b894 0%, #00cec9 100%); padding: 20px; border-radius: 15px; margin: 20px 0; color: white;">
                            <p style="font-size: 1.3em; margin: 0;"><strong>🎉 כָּל הַכָּבוֹד! 🎉</strong></p>
                            <p style="font-size: 1.2em; margin: 10px 0;">זָכִיתָ/זָכִית לְהִכָּנֵס לְהַגְרָלָה!</p>
                            <a href="https://forms.gle/A66uubei4XSX6SG2A" target="_blank" class="lottery-link">
                                לְטוֹפֶס הַהַגְרָלָה 🎁
                            </a>
                        </div>
                    ` : ''}
                    
                    <div class="contact-info">
                        <p><strong>נִבְנָה בְּאַהֲבָה עַל יְדֵי:</strong></p>
                        <p>הָרַב יְהוּדָה טָאוּב מִקִּרְיַת אַתָּא</p>
                        <p>📞 לִפְרָטִים: 0527139520</p>
                    </div>
                </div>
            `;
            
            // שליחת נתונים
            sendScoreToTeacher();
        }

        // התחלה
        renderIntro();
    </script>
</body>
</html>
