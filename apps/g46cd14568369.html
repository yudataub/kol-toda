            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = frequency;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + duration);
            } catch (e) {
                console.log('Sound not available');
            }
        };

            setTimeout(() => playSound(baseFreq * 1.25, 0.1), 100);

                                </div>
                            </div>
                            <div className="options-container">
                                {allOptions.map((option, idx) => (
                                    <button
                                        key={idx}
                                        onClick={() => handleAnswer(option)}
                                        disabled={showFeedback}
                                        className="option-button"
                                    >
                                        {option}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {showFeedback && (
                            <div className={`card feedback-card ${isCorrect ? 'feedback-correct' : 'feedback-wrong'}`}>
                                <div className="feedback-emoji">
                                    {isCorrect ? '🎉' : '💭'}
                                </div>
                                <div className="feedback-text">
                                    {feedbackMessage}
                                </div>
                                {isCorrect && (
                                    <div className="feedback-score">
                                        +10 נְקֻדּוֹת! ⭐
                                    </div>
                                )}
                                <div style={{marginTop: '30px'}}>
                                    <button
                                        onClick={nextStep}
                                        className="button"
                                    >
                                        {isCorrect ? 'הַבָּאָה! 👉' : 'נְנַסֶּה שׁוּב 🔄'}
                                    </button>
                                </div>
                            </div>
                        )}

                        {earnedBadges.length > 0 && !showFeedback && (
                            <div className="card badges-card">
                                <div className="badges-container">
                                    <span style={{fontSize: '1.3rem', fontWeight: 'bold', color: '#78350f'}}>
                                        הַבַּאדְג'ִים שֶׁלִּי:
                                    </span>
                                    {earnedBadges.map(level => {
                                        const badge = badges.find(b => b.level === level);
                                        if (!badge) return null;
                                        return (
                                            <div key={level} className="badge">
                                                <span className="badge-icon">{badge.icon}</span>
                                                {badge.name}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            // סיום סיטואציה
            return (
                <div className="container" style={{display: 'flex', alignItems: 'center', justifyContent: 'center', minHeight: '100vh'}}>
                    <div className="card final-card">
                        <div className="final-header" style={{background: 'linear-gradient(135deg, #d1fae5 0%, #bfdbfe 100%)'}}>
                            <div className="final-emoji">🎊</div>
                            <div className="final-title" style={{color: '#065f46'}}>
                                כָּל הַכָּבוֹד! סִיַּמְתְּ סִיטוּאַצְיָה! 🌟
                            </div>
                        </div>
                        <div className="final-content" style={{textAlign: 'center'}}>
                            <button
                                onClick={nextStep}
                                className="button"
                            >
                                {currentSituation < situations.length - 1 ? 'לַסִּיטוּאַצְיָה הַבָּאָה! 🎯' : 'לְסִיּוּם! 👑'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<Game />, document.getElementById('root'));
    </script>
</body>
</html>
