        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function playSound(frequencies, duration = 200) {
            frequencies.forEach((freq, index) => {
                setTimeout(() => {
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    oscillator.frequency.value = freq;
                    oscillator.type = "sine";
                    
                    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration / 1000);
                    
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + duration / 1000);
                }, index * duration);
            });
        }

            playSound([261.63, 329.63, 392.00]); // C-E-G

                playCorrectSound();
                
                const encouragements = [
                    `מְצֻיָּן, ${userName}! ⭐`,
                    `נִפְלָא, ${userName}! 💪`,
                    `כָּל הַכָּבוֹד, ${userName}! 🎯`,
                    `פַּצַּצָה, ${userName}! 🏆`
                ];
                const randomEncouragement = encouragements[Math.floor(Math.random() * encouragements.length)];
                
                feedbackDiv.innerHTML = `
                    <div class="feedback correct">
                        <strong>${randomEncouragement}</strong><br><br>
                        ${question.explanation}<br><br>
                        <em>💖 הַשֵּׁם שָׂמֵחַ וְאוֹהֵב אוֹתְךָ, ${userName}! 💖</em>
                    </div>
                `;
            } else {
                feedbackDiv.innerHTML = `
                    <div class="feedback incorrect">
                        <strong>לֹא בְּדִיּוּק, ${userName}... 🤔</strong><br><br>
                        ${question.explanation}<br><br>
                        <em>💡 גַּם כְּשֶׁטּוֹעִים - לוֹמְדִים! הַשֵּׁם אוֹהֵב אוֹתְךָ, ${userName}! 💡</em>
                    </div>
                `;
            }

            answeredQuestions++;
            
            setTimeout(() => {
                if (answeredQuestions < 3) {
                    renderQuestion(questionIndex + 1);
                } else {
                    checkLessonCompletion();
                }
            }, 3000);
        }

        function checkLessonCompletion() {
            const container = document.getElementById("questionsContainer");
            
            if (lessonScore >= 2) {
                playCompleteSound();
                container.innerHTML += `
                    <div class="feedback correct" style="margin-top: 30px; font-size: 1.3em;">
                        <strong>🏆 כָּל הַכָּבוֹד, ${userName}! 🏆</strong><br><br>
                        עָנִיתָ נָכוֹן עַל ${lessonScore} מִתּוֹךְ 3!<br>
                        אַתָּה שׁוֹלֵט בַּחֹמֶר! 🌟<br><br>
                        <em>💖 הַשֵּׁם גָּאֶה בְּךָ, ${userName}! 💖</em>
                    </div>
                    <div style="text-align: center; margin-top: 20px;">
                        <button class="btn-primary" onclick="nextLesson()">➡️ לַשִּׁיעוּר הַבָּא</button>
                    </div>
                `;
            } else {
                container.innerHTML += `
                    <div class="feedback incorrect" style="margin-top: 30px; font-size: 1.3em;">
                        <strong>בּוֹא נְנַסֶּה שׁוּב, ${userName} 💪</strong><br><br>
                        עָנִיתָ נָכוֹן רַק עַל ${lessonScore} מִתּוֹךְ 3.<br>
                        אֲבָל בְּוַדַּאי תַּצְלִיחַ בַּפַּעַם הַבָּאָה! 🌱<br><br>
                        <em>💖 הַשֵּׁם אוֹהֵב אוֹתְךָ וּמַאֲמִין בְּךָ, ${userName}! 💖</em>
                    </div>
                    <div style="text-align: center; margin-top: 20px;">
                        <button class="btn-primary" onclick="retryLesson()">🔄 נְנַסֶּה שׁוּב</button>
                    </div>
                `;
            }
        }

        function nextLesson() {
            currentLesson++;
            renderLesson(currentLesson);
        }

        function retryLesson() {
            renderLesson(currentLesson);
        }

        function showCertificate() {
            playCompleteSound();
            
            const percentage = Math.round((score / 12) * 100);
            const container = document.getElementById("gameContainer");
            
            container.innerHTML = `
                <div class="certificate">
                    <h2>🎓 תְּעוּדַת הִצְטַיְּנוּת 🎓</h2>
                    <p style="font-size: 1.8em; margin: 20px 0;">
                        <strong>${userName}</strong>
                    </p>
                    <p style="font-size: 1.3em;">
                        סִיַּמְתָּ בְּהַצְלָחָה אֶת הַמִּשְׂחָק:<br>
                        <strong>״הוֹדָאָה אִישִׁית מֵהַלֵּב״</strong><br>
                        <strong>חֲנֻכָּה - חֵלֶק ב׳</strong>
                    </p>
                    <div class="score">
                        ${score}/12 (${percentage}%)
                    </div>
                    <p style="font-size: 1.2em; margin: 20px 0; font-style: italic; color: #8e44ad;">
                        ״רַחֲמָנָא לִבָּא בָּעֵי״ - הַקָּדוֹשׁ בָּרוּךְ הוּא מְבַקֵּשׁ אֶת הַלֵּב
                    </p>
                    <p style="font-size: 1.1em;">
                        💖 הַשֵּׁם אוֹהֵב אוֹתְךָ וְשָׂמֵחַ מִהוֹדָאָתְךָ הָאִישִׁית! 💖
                    </p>
                </div>

                ${percentage >= 70 ? `
                    <div class="lottery-box">
                        <h2>🎉 מַזָּל טוֹב, ${userName}! 🎉</h2>
                        <p style="font-size: 1.2em; margin: 15px 0;">
                            נִכְנַסְתָּ לְהַגְרָלָה נוֹשֵׂאת פְּרָסִים! 🎁
                        </p>
                        <a href="https://forms.gle/A66uubei4XSX6SG2A" target="_blank">
                            📋 לְרִשּׁוּם לַחֲצוּ כָּאן
                        </a>
                    </div>
                ` : ""}

                <div class="reflection-questions">
                    <h3>🤔 שְׁאֵלוֹת לְמַחְשָׁבָה:</h3>
                    <ul>
                        <li>כֵּיצַד אוּכַל לְהוֹדוֹת יוֹתֵר מֵהַלֵּב וּבְעַצְמִי?</li>
                        <li>מָתַי בַּיּוֹם אֲנִי יָכוֹל לָתֵת זְמַן לְהוֹדָאָה אֲמִתִּית?</li>
                        <li>אֵיזֶה טוֹב קָטָן אֲנִי יָכוֹל לְהוֹדוֹת עָלָיו עַכְשָׁיו?</li>
                    </ul>
                </div>

                <div class="contact-info">
                    <p style="font-size: 1.2em;">
                        <strong>נִבְנָה בְּאַהֲבָה עַל יְדֵי:</strong><br>
                        הָרַב יְהוּדָה טָאוּב מִקִּרְיַת אַתָּא<br>
                        📞 לִפְרָטִים: 0527139520
                    </p>
                </div>
            `;

            // שליחה אוטומטית
            sendScoreToTeacher();
        }

        // התחלה
        renderIntro();
    </script>
</body>
</html>
