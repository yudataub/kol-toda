<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>

  <title>מבחן אמריקאי בנושא "להודות על הישועה העתידה"</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Bellefair&display=swap');
    
    body {
      font-family: 'Heebo', sans-serif;
      background-color: #f0f4f8;
      margin: 0;
      padding: 20px;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }
    
    .header {
      padding: 20px;
      border-bottom: 1px solid #e2e8f0;
      background-color: #4a5568;
      color: white;
    }
    
    .content {
      padding: 20px;
    }
    
    h1, h2, h3 {
      color: #2d3748;
    }
    
    .header h1 {
      color: white;
      margin: 0;
    }
    
    .question {
      margin-bottom: 30px;
    }
    
    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }
    
    .option {
      padding: 15px;
      background-color: #f3f4f6;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .option:hover {
      background-color: #e5e7eb;
    }
    
    .option.selected {
      background-color: #4f46e5;
      color: white;
    }
    
    .option.correct {
      background-color: #10b981;
      color: white;
    }
    
    .option.incorrect {
      background-color: #ef4444;
      color: white;
    }
    
    .explanation {
      padding: 15px;
      background-color: #f9fafb;
      border-radius: 6px;
      border: 1px solid #e5e7eb;
      margin-top: 15px;
      display: none;
    }
    
    .button {
      display: inline-block;
      padding: 10px 20px;
      background-color: #4f46e5;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }
    
    .button:hover {
      background-color: #4338ca;
    }
    
    .button:disabled {
      background-color: #9ca3af;
      cursor: not-allowed;
    }
    
    .navigation {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }
    
    .result {
      text-align: center;
      padding: 40px 20px;
    }
    
    .score {
      font-size: 2rem;
      font-weight: bold;
      color: #4f46e5;
      margin-bottom: 10px;
    }
    
    .percentage {
      font-size: 1.5rem;
      color: #8b5cf6;
      margin-bottom: 20px;
    }
    
    .message {
      font-size: 1.25rem;
      color: #4b5563;
      margin-bottom: 30px;
    }
    
    .progress {
      height: 10px;
      background-color: #e5e7eb;
      border-radius: 5px;
      margin-bottom: 20px;
      overflow: hidden;
    }
    
    .progress-bar {
      height: 100%;
      background: linear-gradient(to right, #4f46e5, #8b5cf6);
      transition: width 0.3s ease;
    }
    
    .intro {
      padding: 20px;
      background-color: #f9fafb;
      border-radius: 6px;
      margin-bottom: 20px;
    }
    
    /* Certificate styles */
    .certificate {
      width: 100%;

      margin: 0 auto;

      position: relative;
      overflow: hidden;

      opacity: 0.1;
      z-index: 0;
    }
    
    .certificate-title {
      font-family: 'Bellefair', serif;
      font-size: 40px;
      color: #2d3748;
      margin-top: 20px;

    }
    
    .certificate-subtitle {

      color: #4a5568;
      margin-bottom: 20px;
      position: relative;
    }
    
    .student-name {
      font-family: 'Bellefair', serif;
      font-size: 30px;
      font-weight: bold;
      color: #4f46e5;
      margin: 30px 0;

    }
    
    .score-display {

      color: #10b981;

    .achievement {

      color: #8b5cf6;
      margin: 20px 0;
      position: relative;
    }
    
    .certificate-date {
      font-size: 14px;
      color: #6b7280;
      margin-top: 30px;

    .stamp {
      position: absolute;
      bottom: 30px;

    .name-input {
      padding: 10px;

      margin-bottom: 15px;

    }
    
    .hidden {
      display: none;
    }

<body>
  <div class="container">

      <div class="progress">
        <div class="progress-bar" id="progress-bar"></div>

  <script>
    // נתוני השאלות – 10 שאלות עם אפשרויות, תשובה נכונה והסבר
    const questions = [
      {
        question: "מהו הכוח שהפיל את המן לפי ההרצאה?",
        options: [
          "תפילותיהם של בני ישראל ותעניתם",
          "מסירות נפשה של אסתר",
          "לימוד הלכות קורבן העומר והודיה על הישועה העתידה",
          "קריאת המלך בספר הזכרונות"
        ],
        correct: 2,
        explanation: "בהרצאה מודגש שהכוח שהפיל את המן היה העובדה שמרדכי ותלמידיו עסקו בלימוד הלכות קורבן העומר – קרבן של הודיה, שהביע ביטחון בישועת ה'."
      },
      {
        question: "מהו היסוד שמביא המרצה מדברי אור החיים הקדוש על הפסוק \"מה תצעק אלי דבר אל בני ישראל ויסעו\"?",
        options: [
          "יש כוח גדול יותר מתפילה - והוא הביטחון בה'",
          "תפילה היא הכוח החזק ביותר להבאת ישועה",
          "הישועה תבוא רק לאחר תקופת סבל וייסורים",
          "עם ישראל נדרש לשוב בתשובה לפני הישועה"
        ],
        correct: 0,
        explanation: "המרצה מציין שבמקום להתמקד רק בתפילה, יש כוח גדול יותר – הביטחון בה', שמאפשר להגיע לישועה."
      },
      {
        question: "כיצד מתבטא מעשה של ביטחון לפי ההרצאה?",
        options: [
          "בהתמדה בתפילה עד לישועה",
          "בקיום תעניות וסיגופים",
          "בהכנת כלי נשק להילחם באויב",
          "בהודיה לה' על ישועה שעוד לא הגיעה"
        ],
        correct: 3,
        explanation: "ההרצאה מדגישה שמעשה של ביטחון מתבטא בכך שהאדם מודה לה' על ישועה שעוד לא התרחשה, ומאמין בכך באופן מוחלט."
      },
      {
        question: "מה היה הדבר שהפתיע את המן כשהגיע לבית המדרש?",
        options: [
          "שמרדכי היה עטוף בשק ואפר",
          "שמרדכי ותלמידיו למדו הלכות קידוש השם",
          "שמרדכי ותלמידיו למדו הלכות קורבן העומר במקום לבכות ולהתאבל",
          "שמרדכי הכין את העם למלחמה"
        ],
        correct: 2,
        explanation: "המקרה שבו המן מצא את מרדכי ותלמידיו לומדים הלכות קורבן העומר – קרבן של הודיה – במקום לבכות ולהתאבל, הפתיע אותו והראה את ביטחונם המלא בה'."
      },
      {
        question: "מה הייתה המחלוקת העקרונית בין מרדכי לאסתר לפי ההרצאה?",
        options: [
          "האם להתפלל לה' או לפנות למלך אחשוורוש",
          "האם להילחם או לברוח",
          "האם להביא ישועה על ידי סיגופים ותעניות או על ידי שמחה ובטחון בה'",
          "האם להסתמך על נס או על השתדלות טבעית"
        ],
        correct: 2,
        explanation: "המחלוקת העקרונית עסקה בשאלה האם הישועה תגיע באמצעות סיגופים ותעניות, או על ידי שמחה וביטחון מלא בה'."
      },
      {
        question: "לפי דברי המרצה, מה צריך לעשות אחרי התפילה והתענית?",
        options: [
          "להמשיך בתפילה עד שתבוא הישועה",
          "להיות בשמחה עצומה כאילו כבר באה הישועה",
          "להגביר את הסיגופים והתעניות",
          "להתכונן לגזירות נוספות"
        ],
        correct: 1,
        explanation: "ההרצאה מדגישה שלאחר התפילה והתענית יש להתמלא בשמחה עצומה, כאילו כבר התרחשה הישועה, וזהו סימן לביטחון מלא בה'."
      },
      {
        question: "מה הסמליות בכך שמרדכי ותלמידיו עסקו דווקא בהלכות קורבן העומר?",
        options: [
          "זה רמז לכך שהעם צריך להקריב את עצמו למען ה'",
          "זה היה יום ט\"ז בניסן, היום בו מקריבים את קורבן העומר",
          "קורבן העומר מסמל את האביב ואת התחדשות הטבע",
          "קורבן העומר הוא קרבן של הודיה, המבטא את הביטחון בישועת ה'"
        ],
        correct: 3,
        explanation: "על פי ההרצאה, קורבן העומר היה למעשה קרבן תודה – ביטוי לביטחון מלא בישועת ה', והעיסוק בו בזמן צרה העמיד את העם בעמדת הודיה."
      },
      {
        question: "מה הייתה משמעות הנהגתו של הקב\"ה שדווקא המן יוביל את מרדכי ברחובות העיר?",
        options: [
          "להשפיל את המן בפני העם",
          "להראות לדורות עולם שאחרי התפילה חייבים להיות בשמחה עצומה",
          "להעניש את המן על מזימותיו",
          "ללמד את מרדכי ענווה"
        ],
        correct: 1,
        explanation: "הקב\"ה רצה להראות לדורות עולם, שכשאדם מתפלל ומתענית – עליו להיות בשמחה עצומה, כאילו כבר הגיעה הישועה."
      },
      {
        question: "איזה מסר עמוק עולה מהסיפור על \"נדדה שנת המלך\" באותו לילה גורלי?",
        options: [
          "שיש השגחה פרטית על עם ישראל",
          "שהקב\"ה משלם שכר למי שעושה טוב",
          "שהשמחה והביטחון בה' מביאים לישועה גם במצבים הקשים ביותר",
          "שהאדם צריך להיות ערני כל הזמן"
        ],
        correct: 2,
        explanation: "הסיפור מדגיש שהשמחה והביטחון בה' מובילים לישועה גם בזמנים הקשים ביותר – גם כשנראה שהכל אבוד."
      },
      {
        question: "מהו המסר המרכזי של ההרצאה לדורנו?",
        options: [
          "לעסוק בתורה בעת צרה",
          "להרבות בתפילה ותחנונים",
          "להודות לה' על הישועה העתידה כאילו היא כבר התרחשה, כדי לבטל גזרות",
          "להשתדל יותר בדרכים טבעיות"
        ],
        correct: 2,
        explanation: "המסר המרכזי הוא שאם נודה לה' על הישועה העתידה כאילו היא כבר התרחשה, נבטל גזרות ונביא את הישועה בעזרת האמונה המוחלטת."
      }
    ];
    
    // משתני מצב
    let currentQuestion = 0;
    let score = 0;
    let selectedOption = null;
    let showingExplanation = false;
    let quizCompleted = false;
    let studentName = "";
    
    // Sound effects באמצעות Web Audio API
    let audioContext;
    let sounds = {};
    
    // אתחול הסאונד
    function initAudio() {
      try {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        // צליל פתיחת המבחן (קערת טיבט)
        sounds.start = function() {
          const oscillator = audioContext.createOscillator();
          const gainNode = audioContext.createGain();
          
          oscillator.type = 'sine';
          oscillator.frequency.value = 196.0; // G3
          
          gainNode.gain.setValueAtTime(0, audioContext.currentTime);
          gainNode.gain.linearRampToValueAtTime(0.3, audioContext.currentTime + 0.1);
          gainNode.gain.linearRampToValueAtTime(0, audioContext.currentTime + 2.5);
          
          oscillator.connect(gainNode);
          gainNode.connect(audioContext.destination);
          
          oscillator.start();
          setTimeout(() => oscillator.stop(), 2500);
        };
        
        // צליל בחירת תשובה (מפתח פסנתר)
        sounds.select = function() {
          const oscillator = audioContext.createOscillator();
          const gainNode = audioContext.createGain();
          
          oscillator.type = 'sine';
          oscillator.frequency.value = 440; // A4
          
          gainNode.gain.value = 0.1;
          
          oscillator.connect(gainNode);
          gainNode.connect(audioContext.destination);
          
          oscillator.start();
          setTimeout(() => oscillator.stop(), 200);
        };
        
        // צליל תשובה נכונה (מותאם לאקורד מזמין)
        sounds.correct = function() {
          const playNote = (freq, delay, duration) => {
            setTimeout(() => {
              const osc = audioContext.createOscillator();
              const gain = audioContext.createGain();
              
              osc.type = 'sine';
              osc.frequency.value = freq;
              
              gain.gain.setValueAtTime(0.2, audioContext.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
              
              osc.connect(gain);
              gain.connect(audioContext.destination);
              
              osc.start();
              setTimeout(() => osc.stop(), duration * 1000);
            }, delay);
          };
          
          playNote(261.63, 0, 0.8);    // C4
          playNote(329.63, 50, 0.8);   // E4
          playNote(392.00, 100, 0.8);  // G4
        };
        
        // צליל תשובה שגויה
        sounds.incorrect = function() {
          const osc1 = audioContext.createOscillator();
          const osc2 = audioContext.createOscillator();
          const gainNode = audioContext.createGain();
          
          osc1.type = 'sine';
          osc2.type = 'sine';
          
          osc1.frequency.value = 220;    // A3
          osc2.frequency.value = 233.08; // A#3
          gainNode.gain.value = 0.1;
          
          osc1.connect(gainNode);
          osc2.connect(gainNode);
          gainNode.connect(audioContext.destination);
          
          osc1.start();
          osc2.start();
          
          setTimeout(() => {
            osc1.stop();
            osc2.stop();
          }, 400);
        };
        
        // צליל מעבר לשאלה הבאה (סולם עולה)
        sounds.next = function() {
          const playNote = (freq, delay) => {
            setTimeout(() => {
              const osc = audioContext.createOscillator();
              const gain = audioContext.createGain();
              
              osc.type = 'sine';
              osc.frequency.value = freq;
              
              gain.gain.value = 0.1;
              
              osc.connect(gain);
              gain.connect(audioContext.destination);
              
              osc.start();
              setTimeout(() => osc.stop(), 150);
            }, delay);
          };
          
          playNote(523.25, 0);   // C5
          playNote(587.33, 150); // D5
          playNote(659.25, 300); // E5
        };
        
        // צליל סיום המבחן (פנף חגיגי)
        sounds.complete = function() {
          const playNote = (freq, delay, duration) => {
            setTimeout(() => {
              const osc = audioContext.createOscillator();
              const gain = audioContext.createGain();
              
              osc.type = 'sine';
              osc.frequency.value = freq;
              
              gain.gain.setValueAtTime(0.2, audioContext.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
              
              osc.connect(gain);
              gain.connect(audioContext.destination);
              
              osc.start();
              setTimeout(() => osc.stop(), duration * 1000);
            }, delay);
          };
          
          playNote(392.00, 0, 0.3);    // G4
          playNote(392.00, 300, 0.3);  // G4
          playNote(523.25, 600, 0.5);  // C5
          playNote(523.25, 1200, 1);   // C5
          playNote(659.25, 1200, 1);   // E5
          playNote(783.99, 1200, 1);   // G5
        };
        
        // צליל תעודה (צליל נפרש עם רעש לבן)
        sounds.certificate = function() {
          const paperDuration = 1;
          const noiseNode = audioContext.createBufferSource();
          const noiseBuffer = audioContext.createBuffer(1, audioContext.sampleRate * paperDuration, audioContext.sampleRate);
          const noiseData = noiseBuffer.getChannelData(0);
          
          for (let i = 0; i < noiseBuffer.length; i++) {
            noiseData[i] = Math.random() * 2 - 1;
          }
          
          const noiseGain = audioContext.createGain();
          noiseGain.gain.setValueAtTime(0.05, audioContext.currentTime);
          noiseGain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + paperDuration);
          
          const filter = audioContext.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.value = 2000;
          filter.Q.value = 1.5;
          
          noiseNode.buffer = noiseBuffer;
          noiseNode.connect(filter);
          filter.connect(noiseGain);
          noiseGain.connect(audioContext.destination);
          
          noiseNode.start();
          
          setTimeout(() => {
            const playNote = (freq, delay, duration) => {
              setTimeout(() => {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                
                osc.type = 'sine';
                osc.frequency.value = freq;
                
                gain.gain.setValueAtTime(0.15, audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(audioContext.destination);
                
                osc.start();
                setTimeout(() => osc.stop(), duration * 1000);
              }, delay);
            };
            
            playNote(293.66, 0, 2);    // D4
            playNote(369.99, 100, 2);  // F#4
            playNote(440.00, 200, 2);  // A4
            playNote(587.33, 300, 2);  // D5
          }, 1000);
        };
        
        return true;
      } catch (error) {
        console.error("Web Audio API is not supported in this browser", error);
        return false;
      }
    }
    
    // הפניות לאלמנטים ב-DOM
    const quizContent = document.getElementById('quiz-content');
    const progressBar = document.getElementById('progress-bar');
    
    // מסך פתיחה
    function showIntro() {
      quizContent.innerHTML = `
        <div class="intro">
          <h2>ברוכים הבאים למבחן בנושא "להודות על הישועה העתידה"</h2>
          <p>לפניכם מבחן קצר המבוסס על ההרצאה. בחרו את התשובות הנכונות לכל שאלה.</p>
          <p>בסיום המבחן תקבלו תעודה אישית!</p>
          <p>אנא הזינו את שמכם:</p>
          <input type="text" id="student-name" class="name-input" placeholder="השם שלך" />
          <p></p>
          <button class="button" onclick="beginQuiz()">התחל את המבחן</button>
        </div>
      `;
      const audioInited = initAudio();
      if (audioInited && sounds.start) {
        sounds.start();
      }
    }
    
    // התחלת המבחן
    function beginQuiz() {
      studentName = document.getElementById('student-name').value || "תלמיד חכם";
      currentQuestion = 0;
      score = 0;
      selectedOption = null;
      showingExplanation = false;
      quizCompleted = false;
      showQuestion();
      if (sounds.next) sounds.next();
    }
    
    // הצגת שאלה נוכחית
    function showQuestion() {
      if (quizCompleted) {
        showResults();
        return;
      }
      
      progressBar.style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;
      const question = questions[currentQuestion];
      
      let html = `
        <div class="question">
          <h2>שאלה ${currentQuestion + 1} מתוך ${questions.length}</h2>
          <p>${question.question}</p>
          <div class="options">
      `;
      
      question.options.forEach((option, index) => {
        html += `
          <div class="option" onclick="selectOption(${index})">
            ${option}
          </div>
        `;
      });
      
      html += `
          </div>
          <div class="explanation" id="explanation">
            <p><strong>הסבר:</strong> ${question.explanation}</p>
          </div>
          <div class="navigation">
            <button class="button" id="check-button" onclick="checkAnswer()" disabled>בדוק תשובה</button>
            <button class="button" id="next-button" onclick="nextQuestion()" style="display: none;">לשאלה הבאה</button>
          </div>
        </div>
      `;
      
      quizContent.innerHTML = html;
    }
    
    // טיפול בבחירת תשובה
    function selectOption(index) {
      if (showingExplanation) return;
      selectedOption = index;
      if (sounds.select) sounds.select();
      
      const options = document.querySelectorAll('.option');
      options.forEach((option, i) => {
        if (i === index) {
          option.classList.add('selected');
        } else {
          option.classList.remove('selected');
        }
      });
      
      document.getElementById('check-button').disabled = false;
    }
    
    // בדיקת התשובה
    function checkAnswer() {
      if (selectedOption === null || showingExplanation) return;
      showingExplanation = true;
      
      const question = questions[currentQuestion];
      const isCorrect = selectedOption === question.correct;
      
      const options = document.querySelectorAll('.option');
      options.forEach((option, i) => {
        if (i === question.correct) {
          option.classList.add('correct');
        } else if (i === selectedOption) {
          option.classList.remove('selected');
          if (i !== question.correct) {
            option.classList.add('incorrect');
          }
        }
      });
      
      document.getElementById('explanation').style.display = 'block';
      document.getElementById('check-button').style.display = 'none';
      document.getElementById('next-button').style.display = 'block';
      
      if (isCorrect) {
        score++;
        if (sounds.correct) sounds.correct();
      } else {
        if (sounds.incorrect) sounds.incorrect();
      }
    }
    
    // מעבר לשאלה הבאה
    function nextQuestion() {
      selectedOption = null;
      showingExplanation = false;
      
      if (currentQuestion < questions.length - 1) {
        currentQuestion++;
        showQuestion();
        if (sounds.next) sounds.next();
      } else {
        quizCompleted = true;
        showResults();
        if (sounds.complete) sounds.complete();
      }
    }
    
    // קבלת תיאור הישג על בסיס הציון
    function getAchievement(percentage) {
      if (percentage === 100) {
        return "מומחה בהלכות הישועה העתידה";
      } else if (percentage >= 70) {
        return "יודע היטב את דרכי ההודיה";
      } else {
        return "מתמיד בלימוד אמונת הישועה";
      }
    }
    
    // הצגת תוצאות המבחן עם תעודה
    function showResults() {
      const percentage = Math.round((score / questions.length) * 100);
      const achievement = getAchievement(percentage);
      
      let html = `
        <div class="result">
          <h2>סיימת את המבחן!</h2>
          <div class="score">${score} מתוך ${questions.length}</div>
          <div class="percentage">${percentage}%</div>
          <p>מיד תקבל את התעודה האישית שלך...</p>
          <button class="button" onclick="showCertificate()">הצג תעודה</button>
        </div>
      `;
      
      quizContent.innerHTML = html;
      progressBar.style.width = '100%';
    }
    
    // הצגת התעודה
    function showCertificate() {
      const percentage = Math.round((score / questions.length) * 100);
      const achievement = getAchievement(percentage);
      const currentDate = new Date();
      const dateString = currentDate.toLocaleDateString('he-IL', { 
        day: 'numeric', 
        month: 'long', 
        year: 'numeric' 
      });
      
      if (sounds.certificate) sounds.certificate();
      
      let html = `
        <div class="certificate">
          <div class="certificate-title">תעודת הצטיינות</div>
          <div class="certificate-subtitle">מוענקת בזאת ל:</div>
          <div class="student-name">${studentName}</div>
          <div class="certificate-text">
            על השתתפות במבחן בנושא "להודות על הישועה העתידה"<br>
            והבנה מעמיקה במסר ההודיה והאמונה
          </div>
          <div class="score-display">ציון: ${score} מתוך ${questions.length} (${percentage}%)</div>
          <div class="achievement">${achievement}</div>
          <div class="certificate-date">ניתן בתאריך: ${dateString}</div>
          <div class="stamp">מאושר<br>רשמית</div>
        </div>
        <br>
        <div style="text-align: center;">
          <button class="button" onclick="window.print()">הדפס תעודה</button>
          <button class="button" onclick="window.location.reload()">חזרה לתחילת המבחן</button>
        </div>
      `;
      
      quizContent.innerHTML = html;
    }
    
    // הפעלת מסך הפתיחה עם טעינת הדף
    document.addEventListener("DOMContentLoaded", showIntro);
  </script>
</body>
</html>
