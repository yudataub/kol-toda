*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}

/* ─── HERO HEADER ─── */

  text-align:center;
  padding:40px 20px 30px;
  overflow:hidden;
}
#hero::before {

  background:

    radial-gradient(ellipse 50% 60% at 75% 40%, rgba(21,40,72,0.8) 0%, transparent 65%);
}
.stars {
  position:absolute;inset:0;
  background-image:
    radial-gradient(1px 1px at 10% 15%, rgba(245,216,122,0.6) 0%, transparent 100%),

    radial-gradient(1px 1px at 90% 55%, rgba(245,216,122,0.3) 0%, transparent 100%),
    radial-gradient(2px 2px at 40% 80%, rgba(245,216,122,0.2) 0%, transparent 100%),
    radial-gradient(1px 1px at 60% 45%, rgba(245,216,122,0.45) 0%, transparent 100%);
}
.hero-ornament {
  position:relative;
  color:var(--gold2);
  font-size:28px;
  letter-spacing:12px;
  margin-bottom:12px;
  opacity:0.7;
}
#hero h1 {
  position:relative;
  font-family:'Frank Ruhl Libre',serif;
  font-weight:900;
  font-size:clamp(26px, 4vw, 44px);

  line-height:1.2;
  margin-bottom:8px;
}
#hero h1 span {color:var(--gold2)}

}

}

/* ─── SEARCH BAR ─── */
.search-wrap {

}
#search {

  color:rgba(255,255,255,0.4);
  pointer-events:none;
}
.search-clear {
  position:absolute;
  left:46px;top:50%;

/* Detect parasha name embedded in a filename and return Hebrew name */
function extractParashaFromFilename(name) {
  const lower = name.toLowerCase().replace(/[^a-z]/g,'');
  for (const [en, he] of Object.entries(PARASHA_HE_MAP)) {
    if (lower.includes(en)) return he;
  }
  return null;
}

/* Extract human author from URL — only named contributor folders */
const GENERIC_FOLDERS = new Set(['parshasummaries','parsha','kevatzim','mychomer',
  'mahalo','files','upload','docs','documents','resources','content']);

function extractFolderAuthor(decoded) {
  const m = decoded.match(/kevatzim\/([^\/]+)\//i);
  if (m) {
    const name = m[1].trim();
    if (!GENERIC_FOLDERS.has(name.toLowerCase())) return name;
  }
  return null;
}

const CODE_PREFIX = /^(TH|PQ|YM|AN|VM|BK|QA|SH|LE|EX|NK)\s*/i;

function smartName(lk) {
  const raw = (lk.name || '').trim();
  if (raw.length > 5 && !TRIVIAL_NAMES.has(raw.toLowerCase())) return raw;
  try {
    const decoded = decodeURIComponent(lk.url.replace(/\+/g,' '));
    const path = decoded.split('?')[0].split('#')[0];
    const parts = path.split('/').filter(p => p.length > 1);
    const last = parts[parts.length - 1] || '';
    const nameBase = last.replace(/\.(docx?|pdf|pptx?|mp3|xlsx?|doc)$/i,'').replace(/[_+]/g,' ').trim();

    /* If filename looks like a code prefix + parasha, decode it */
    if (CODE_PREFIX.test(nameBase)) {
      const parasha = extractParashaFromFilename(nameBase);
      const author = extractFolderAuthor(decoded);
      if (parasha && author) return `${author} — ${parasha}`;
      if (parasha) return `פרשת ${parasha}`;
      if (author) return `${author} — ${nameBase.replace(CODE_PREFIX,'').trim()}`;
    }

    if (nameBase.length > 3) return nameBase;
    if (parts.length >= 2) return parts[parts.length - 2].replace(/[_+]/g,' ');
  } catch(e) {}
  return raw || lk.url;
}

/* ─── EXTRACT AUTHOR FROM URL ─── */
function extractAuthor(url) {
  try {
    const decoded = decodeURIComponent(url);
    const m = decoded.match(/kevatzim\/([^\/]+)\//i);
    if (m) return m[1].trim();
  } catch(e) {}
  return null;
}

/* ─── SMART CHUNK TITLE ─── */
function smartChunkTitle(links, baseTitle, start, end, totalChunks) {
  if (totalChunks === 1) return baseTitle;

  // Dominant author?
  const authorCounts = {};
  links.forEach(lk => {
    const a = extractAuthor(lk.url);
    if (a) authorCounts[a] = (authorCounts[a]||0)+1;
  });
  const topAuthor = Object.entries(authorCounts).sort((a,b)=>b[1]-a[1])[0];
  if (topAuthor && topAuthor[1] >= links.length * 0.5) {
    return `${baseTitle} — ${topAuthor[0]}`;
  }

  // Parasha names in chunk?
  const foundParashiyot = [];
  PARASHA_BOOKS.forEach(book => book.parashiyot.forEach(p => {
    if (!foundParashiyot.find(f=>f.he===p.he) && links.some(lk => linkMatchesParasha(lk, p)))
      foundParashiyot.push(p);
  }));
  if (foundParashiyot.length > 0 && foundParashiyot.length <= 5) {
    return foundParashiyot.map(p=>p.he).join(' · ');
  }

  // Fallback: numbered
  const letters = ['א','ב','ג','ד','ה','ו','ז','ח','ט','י','יא','יב','יג','יד','טו','טז','יז','יח','יט','כ'];
  const chunkNum = Math.round(start / 30);
  return `${baseTitle}  ·  חלק ${letters[chunkNum]||chunkNum+1}׳`;
}

/* ─── BUILD SIDEBAR ─── */
function buildSidebar() {
  const nav = document.getElementById('sidebar');
  nav.innerHTML = `<div class="sidebar-header">נושאים</div>`;

  allData.forEach((sec, si) => {
    const total = sec.subsections.reduce((a,s) => a + s.links.length, 0);
    const group = document.createElement('div');
    group.className = 'nav-group';
    group.dataset.si = si;

    const header = document.createElement('div');
    header.className = 'nav-item';
    header.dataset.idx = si;
    header.innerHTML = `
      <span class="nav-icon">${SECTION_ICONS[sec.title]||'📚'}</span>
      <span class="nav-label">${sec.title}</span>
      <span class="nav-count">${total.toLocaleString()}</span>
      <span class="nav-arrow">›</span>`;
    header.addEventListener('click', () => {
      const wasExpanded = group.classList.contains('expanded');
      document.querySelectorAll('.nav-group').forEach(g => g.classList.remove('expanded'));
      document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
      if (!wasExpanded) {
        group.classList.add('expanded');
        header.classList.add('active');
        document.getElementById(`sec-${si}`)?.scrollIntoView({behavior:'smooth',block:'start'});
      }
    });

    const subList = document.createElement('div');
    subList.className = 'nav-sublist';
    sec.subsections.forEach((sub, ssi) => {
      const shortTitle = niceTitle(sub.title);
      const a = document.createElement('a');
      a.className = 'nav-sub-item';
      a.textContent = shortTitle;
      a.title = shortTitle;
      a.href = `#subsec-${si}-${ssi}`;
      a.addEventListener('click', e => {
        e.preventDefault();
        document.querySelectorAll('.nav-sub-item').forEach(x=>x.classList.remove('active'));
        a.classList.add('active');
        document.getElementById(`subsec-${si}-${ssi}`)?.scrollIntoView({behavior:'smooth',block:'start'});
      });
      subList.appendChild(a);
    });

    group.appendChild(header);
    group.appendChild(subList);
    nav.appendChild(group);
  });
}

/* ─── BUILD HERO STATS ─── */
function buildStats() {
  const totalLinks = allData.reduce((a,s)=>a+s.subsections.reduce((b,ss)=>b+ss.links.length,0),0);
  const totalSubs = allData.reduce((a,s)=>a+s.subsections.length,0);
  document.getElementById('hero-stats').innerHTML = `
    <div class="stat-pill"><strong>${totalLinks.toLocaleString()}</strong> קישורים</div>
    <div class="stat-pill"><strong>${allData.length}</strong> קטגוריות</div>
    <div class="stat-pill"><strong>${totalSubs}</strong> נושאים</div>
    <div class="stat-pill">עודכן <strong>19.06.2026</strong></div>`;
}

/* ─── TYPE BADGE HTML ─── */
function typeBadge(type) {
  const t = TYPE_INFO[type] || {cls:'type-Other', icon:'•', label:type};
  return `<span class="type-badge ${t.cls}">${t.icon} ${t.label}</span>`;
}

/* ─── LINK NAME (with possible search highlight) ─── */
function hlText(text, q) {
  if (!q) return escHtml(text);
  const re = new RegExp(escRe(q), 'gi');
  return escHtml(text).replace(re, m => `<mark class="hl">${m}</mark>`);
}
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

/* ─── BUILD LINK ROWS ─── */
function buildRows(links, q, filter) {
  return links.map(lk => {
    const name = smartName(lk);
    const show = (!filter || lk.type === filter) &&
                 (!q || name.toLowerCase().includes(q) ||
                  lk.url.toLowerCase().includes(q) ||
                  lk.type.toLowerCase().includes(q) ||
                  (lk.name||'').toLowerCase().includes(q));
    const nameHtml = hlText(name, q);
    const shortUrl = (() => {
      try {
        const d = decodeURIComponent(lk.url);
        return d.length > 72 ? d.substring(0,72)+'…' : d;
      } catch(e) {
        return lk.url.length > 72 ? lk.url.substring(0,72)+'…' : lk.url;
      }
    })();
    return `<tr class="${show?'':'hidden-row'}">
      <td style="width:92px;vertical-align:middle">${typeBadge(lk.type)}</td>
      <td>
        <a class="link-title" href="${escHtml(lk.url)}" target="_blank" rel="noopener">${nameHtml}</a>
        <div class="link-sub-url">${escHtml(shortUrl)}</div>
      </td>
    </tr>`;
  }).join('');
}

/* ─── HONORIFIC DISPLAY NAMES ─── */
const SUBSEC_NICE = {
  'חמ"ד - נריה':            'הרב משה צבי נריה זצ"ל',
  'חמ"ד - ניסים':           'הרב יצחק ניסים זצ"ל',

  'חמ"ד - קאפח':            'הרב יוסף קאפח זצ"ל',
  'חמ"ד - ישראלי':          'הרב שאול ישראלי זצ"ל',

  'חמ"ד - קוק ומאיר תשפ"א':'הראי"ה קוק והרב מאיר — תשפ"א',

function niceTitle(rawTitle) {
  return SUBSEC_NICE[rawTitle] || rawTitle.replace(/^[^ ]+ [-–] /, '');
}

/* ─── MAKE CHUNKS (≤40 = single, else ~30) ─── */
function makeChunks(links) {
  if (links.length <= 40) return [links];
  const chunks = [];
  for (let i = 0; i < links.length; i += MAX_SHOW) {
    const remaining = links.length - (i + MAX_SHOW);
    if (remaining > 0 && remaining <= 10) {
      chunks.push(links.slice(i));
      break;
    }
    chunks.push(links.slice(i, i + MAX_SHOW));
  }
  return chunks;
}

/* ─── BUILD PARASHA PANEL ─── */
function buildParashaPanel() {
  const div = document.createElement('div');
  div.className = 'parasha-panel';
  div.id = 'parasha-panel';

  const clearBtn = activeParasha
    ? `<button class="parasha-clear-btn" onclick="setParasha(null)">✕ נקה בחירה</button>` : '';

  div.innerHTML = `
    <div class="parasha-panel-title">
      <span>✡ סנן לפי פרשה</span>
      ${clearBtn}
    </div>
    ${PARASHA_BOOKS.map(book => `
      <div class="parasha-book">
        <div class="parasha-book-name">${book.name}</div>
        <div class="parasha-chips">
          ${book.parashiyot.map((p, pi) => `
            <span class="parasha-chip${activeParasha && activeParasha.he===p.he?' active':''}"
              onclick="setParashaByIdx(${PARASHA_BOOKS.indexOf(book)},${pi})">${p.he}</span>
          `).join('')}
        </div>
      </div>
    `).join('')}`;
  return div;
}

function setParasha(p) {
  activeParasha = p;
  buildMain();
}
function setParashaByIdx(bookIdx, parashaIdx) {
  setParasha(PARASHA_BOOKS[bookIdx].parashiyot[parashaIdx]);
}

/* ─── BUILD ONE CARD ─── */
function buildCard(links, title, types, anchorId, q) {
  const card = document.createElement('div');
  card.className = 'subsection-card';
  if (anchorId) card.id = anchorId;

  const typeFilters = types.map(t => {
    const info = TYPE_INFO[t] || {cls:'type-Other', icon:'•', label:t};
    const dotColor = DOT_COLORS[t] || '#94a3b8';
    const isActive = activeFilter === t;
    return `<span class="filter-chip${isActive?' active':''}" onclick="setFilter(event,'${escHtml(t)}')" data-type="${escHtml(t)}">
      <span class="filter-dot" style="background:${dotColor}"></span>${info.label}
    </span>`;
  }).join('');
  const clearChip = activeFilter && types.includes(activeFilter)
    ? `<span class="filter-chip" onclick="setFilter(event,null)" style="color:#b91c1c">✕ הצג הכל</span>` : '';

  const rows = buildRows(links, q, null);

  card.innerHTML = `
    <div class="subsection-head" onclick="toggleCard(this)">
      <span class="subsection-title">${escHtml(title)}</span>
      <div class="subsection-meta">
        <span class="sub-count">${links.length} פריטים</span>
        <span class="chevron">▲</span>
      </div>
    </div>
    ${types.length > 1 ? `<div class="filter-bar">${typeFilters}${clearChip}</div>` : ''}
    <div class="subsection-body">
      <table class="links-table">
        <thead><tr>
          <th style="width:92px">סוג</th>
          <th>שם וקישור</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  return card;
}

/* ─── BUILD MAIN CONTENT ─── */
function buildMain() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  const q = searchTerm.toLowerCase().trim();

  allData.forEach((sec, si) => {
    const secEl = document.createElement('div');
    secEl.className = 'section';
    secEl.id = `sec-${si}`;

    const totalSec = sec.subsections.reduce((a,s) => a + s.links.length, 0);
    secEl.innerHTML = `
      <div class="section-header">
        <div class="section-icon">${SECTION_ICONS[sec.title] || '📚'}</div>
        <h2 class="section-title">${escHtml(sec.title)}</h2>
        <span class="section-total">${totalSec.toLocaleString()} קישורים</span>
      </div>`;

    const isParashaSection = sec.title === 'פרשת שבוע';
    if (isParashaSection) secEl.appendChild(buildParashaPanel());

    if (isParashaSection && activeParasha) {
      const allSecLinks = sec.subsections.flatMap(s => s.links);
      const matching = allSecLinks.filter(lk =>
        linkMatchesParasha(lk, activeParasha) &&
        (!activeFilter || lk.type === activeFilter) &&
        (!q || smartName(lk).toLowerCase().includes(q) || lk.url.toLowerCase().includes(q))
      );
      if (matching.length === 0) {
        const empty = document.createElement('div');
        empty.style.cssText = 'text-align:center;padding:30px;color:var(--text3);font-size:15px';
        empty.textContent = `לא נמצאו קישורים לפרשת ${activeParasha.he}`;
        secEl.appendChild(empty);
      } else {
        const types = [...new Set(matching.map(l => l.type))];
        const chunks = makeChunks(matching);
        chunks.forEach((chunk, ci) => {
          const label = chunks.length > 1
            ? smartChunkTitle(chunk, `פרשת ${activeParasha.he}`, ci*MAX_SHOW+1,
                Math.min((ci+1)*MAX_SHOW, matching.length), chunks.length)
            : `פרשת ${activeParasha.he}`;
          secEl.appendChild(buildCard(chunk, label, types, null, q));
        });
      }
    } else {
      sec.subsections.forEach((sub, ssi) => {
        const visibleLinks = sub.links.filter(lk =>
          (!activeFilter || lk.type === activeFilter) &&
          (!q || smartName(lk).toLowerCase().includes(q) ||
           lk.url.toLowerCase().includes(q) || lk.type.toLowerCase().includes(q))
        );
        if (visibleLinks.length === 0 && (q || activeFilter)) return;

        const displayLinks = q || activeFilter ? visibleLinks : sub.links;
        const baseTitle = niceTitle(sub.title);
        const types = [...new Set(sub.links.map(l => l.type))];
        const chunks = makeChunks(displayLinks);
        const anchorId = `subsec-${si}-${ssi}`;

        chunks.forEach((chunk, ci) => {
          const title = chunks.length > 1
            ? smartChunkTitle(chunk, baseTitle, ci*MAX_SHOW+1,
                Math.min((ci+1)*MAX_SHOW, displayLinks.length), chunks.length)
            : baseTitle;
          secEl.appendChild(buildCard(chunk, title, types, ci===0 ? anchorId : null, q));
        });
      });
    }

    const hasCards = secEl.querySelectorAll('.subsection-card').length > 0;
    if (!hasCards && (q || activeFilter)) return;
    main.appendChild(secEl);
  });
}

/* ─── TOGGLE CARD ─── */
function toggleCard(header) {
  const card = header.closest('.subsection-card');
  card.classList.toggle('collapsed');
}

/* ─── SET FILTER ─── */
function setFilter(e, type) {
  e.stopPropagation();
  activeFilter = type;
  buildMain();
}

/* ─── SEARCH ─── */
let searchTimer;
document.getElementById('search').addEventListener('input', function() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    searchTerm = this.value;
    document.getElementById('clear-btn').style.display = searchTerm ? 'block' : 'none';
    buildMain();
    updateResultsBanner();
  }, 200);
});

function clearSearch() {
  document.getElementById('search').value = '';
  searchTerm = '';
  document.getElementById('clear-btn').style.display = 'none';
  activeFilter = null;
  activeParasha = null;
  buildMain();
  updateResultsBanner();
}

function updateResultsBanner() {
  const banner = document.getElementById('results-banner');
  if (!searchTerm && !activeFilter) { banner.style.display='none'; return; }

  const visRows = document.querySelectorAll('.links-table tbody tr:not(.hidden-row)').length;
  const secCount = [...document.querySelectorAll('.section')]
    .filter(s => s.querySelectorAll('.links-table tbody tr:not(.hidden-row)').length > 0).length;

  banner.style.display = 'block';
  let html = `נמצאו <strong>${visRows.toLocaleString()}</strong> תוצאות`;
  if (searchTerm) html += ` עבור "<strong>${escHtml(searchTerm)}</strong>"`;
  if (activeFilter) html += ` · סוג: <strong>${escHtml(activeFilter)}</strong>`;
  if (secCount > 0) html += ` · ב-<strong>${secCount}</strong> נושאים`;

  if (visRows > 0 && searchTerm) {
    html += ` <button onclick="scrollToFirstResult()" style="margin-right:10px;background:var(--navy);color:var(--gold2);border:none;border-radius:20px;padding:3px 12px;font-size:12px;cursor:pointer;font-family:inherit">↓ קפוץ לראשונה</button>`;
  }
  banner.innerHTML = html;
}

function scrollToFirstResult() {
  const firstVisible = document.querySelector('.links-table tbody tr:not(.hidden-row)');
  firstVisible?.closest('.subsection-card')?.scrollIntoView({behavior:'smooth', block:'start'});
}

/* ─── SCROLLSPY ─── */
const observer = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      const idx = e.target.id.replace('sec-','');
      document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
      const navItem = document.querySelector(`.nav-item[data-idx="${idx}"]`);
      if (navItem) navItem.classList.add('active');
    }
  });
}, {rootMargin:'-20% 0px -70% 0px'});

/* ─── BACK TO TOP ─── */
window.addEventListener('scroll', () => {
  const btn = document.getElementById('back-top');
  btn.classList.toggle('visible', window.scrollY > 500);
});

/* ─── INIT ─── */
buildStats();
buildSidebar();
buildMain();

document.querySelectorAll('.section').forEach(s => observer.observe(s));

setTimeout(() => {
  document.querySelectorAll('.section').forEach(s => observer.observe(s));
}, 100);
</script>
