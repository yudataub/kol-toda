    <style>

        .answer-btn {

            border: 2px solid var(--parchment-dark);
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 1em;
            font-family: 'Frank Ruhl Libre', serif;

        .feedback-box {
            border-radius: 14px;

            margin-top: 14px;
            animation: fadeUp 0.4s ease both;
            line-height: 1.9;
            font-family: 'Frank Ruhl Libre', serif;
        }
        .feedback-correct { background: #d4edda; border: 2px solid var(--green-ok); color: #155724; }
        .feedback-wrong { background: #f8d7da; border: 2px solid #e57373; color: #721c24; }
        .feedback-title { font-size: 1.2em; font-weight: 900; margin-bottom: 6px; }
        .next-btn {
            display: block; width: 100%; margin-top: 14px; padding: 14px 24px;
            font-size: 1.15em; font-family: 'Frank Ruhl Libre', serif; font-weight: 700;
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
            color: var(--deep-blue); border: none; border-radius: 12px;
            cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(201,150,26,0.3);

        .next-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(201,150,26,0.4); }
        .lesson-result { text-align: center; padding: 28px 20px; animation: fadeUp 0.5s ease both; }
        .result-icon { font-size: 3.5em; margin-bottom: 12px; display: block; }
        .result-title { font-family: 'Frank Ruhl Libre', serif; font-size: 1.7em; font-weight: 900; color: var(--deep-blue); margin-bottom: 8px; }
        .result-score { font-size: 3em; font-weight: 900; font-family: 'Frank Ruhl Libre', serif; margin: 10px 0; }
        .score-good { color: var(--green-ok); }
        .score-bad { color: var(--warm-red); }
        .result-message { font-size: 1.05em; color: #444; margin-bottom: 20px; line-height: 1.9; font-family: 'Frank Ruhl Libre', serif; }
        .action-btn {
            display: inline-block; padding: 14px 36px; font-size: 1.15em;
            font-family: 'Frank Ruhl Libre', serif; font-weight: 700;
            background: linear-gradient(135deg, var(--blue-mid) 0%, var(--deep-blue) 100%);
            color: white; border: none; border-radius: 50px;
            cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 6px 20px rgba(45,74,138,0.35);
        }
        .action-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(45,74,138,0.45); }
        .certificate-wrap { animation: fadeUp 0.7s ease both; }
        .certificate {
            background: var(--parchment);
            border-radius: 20px;
            padding: 36px 32px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.35);
            border: 3px solid var(--gold);
            position: relative;
            overflow: hidden;
        }
        .cert-top { font-size: 0.8em; letter-spacing: 3px; color: var(--gold); font-weight: 700; font-family: 'Heebo', sans-serif; margin-bottom: 8px; }
        .cert-title { font-family: 'Frank Ruhl Libre', serif; font-size: 2.2em; font-weight: 900; color: var(--deep-blue); margin-bottom: 6px; }
        .cert-name { font-family: 'Frank Ruhl Libre', serif; font-size: 2em; font-weight: 900; color: var(--gold); margin: 10px 0; padding: 8px 20px; border-bottom: 2px solid var(--gold); border-top: 2px solid var(--gold); display: inline-block; }
        .cert-score { font-size: 1.4em; font-weight: 700; color: var(--blue-mid); margin: 14px 0; font-family: 'Frank Ruhl Libre', serif; }
        .cert-pasuk { background: rgba(45,74,138,0.06); border-radius: 12px; padding: 14px 20px; margin: 18px 0; font-family: 'Frank Ruhl Libre', serif; font-size: 1.1em; color: var(--text-dark); line-height: 2; font-style: italic; }
        .lottery-box { background: linear-gradient(135deg, var(--deep-blue), var(--blue-mid)); color: white; border-radius: 16px; padding: 20px 24px; margin: 18px 0; text-align: center; }
        .lottery-title { font-family: 'Frank Ruhl Libre', serif; font-size: 1.4em; font-weight: 900; margin-bottom: 8px; }
        .lottery-link { display: inline-block; margin-top: 12px; padding: 12px 30px; background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%); color: var(--deep-blue); text-decoration: none; border-radius: 50px; font-weight: 700; font-size: 1.1em; font-family: 'Frank Ruhl Libre', serif; transition: transform 0.2s; }
        .lottery-link:hover { transform: translateY(-2px); }
        .contact-info { margin-top: 20px; font-size: 0.95em; color: #666; font-family: 'Heebo', sans-serif; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.06); } 100% { transform: scale(1); } }
        .shake { animation: shake 0.5s ease; }
        .pop { animation: pop 0.4s ease; }
        @media (max-width: 600px) {
            .welcome-title { font-size: 2em; }
            .lesson-title { font-size: 1.3em; }
            .answers-grid { grid-template-columns: 1fr; }
            .lesson-body { padding: 18px 16px; }
            .lesson-header { padding: 18px 18px; }
            .cert-title { font-size: 1.6em; }
            .cert-name { font-size: 1.5em; }
        }
    </style>
</head>
<body>
<div id="gameContainer"></div>
<script>
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby-wgLUmHzqneFw1r4S_pdkcc398yoLMlJfu3CJUvbcZTMI8QZMkGB_42Evl7L0BJxF/exec';
    let audioContext = null;
    function getAudioContext() {
        if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
        return audioContext;
    }
    let userName = "";
    let currentLesson = 0;
    let score = 0;
    let lessonScore = 0;
    let answeredQuestions = [];
    let corrCount = 0;
    let lovCount = 0;

    const lessons = [
        {
            number: "שִׁיעוּר א",
            title: "🐕 מַה כָּתוּב בַּתּוֹרָה עַל הַכֶּלֶב?",
            content: "<p>בְּפָרָשַׁת הַשָּׁבוּעַ כָּתוּב פָּסוּק מְיֻחָד מְאֹד: <strong>\"וּבָשָׂר בַּשָּׂדֶה טְרֵפָה לֹא תֹאכֵלוּ, לַכֶּלֶב תַּשְׁלִכוּן אֹתוֹ\"</strong> (שמות כב, ל). 🌟</p><p>הַתּוֹרָה מְצַוָּה: אִם יֵשׁ לְךָ בָּשָׂר שֶׁנִּטְרַף — תֵּן אֹתוֹ לַכֶּלֶב! לָמָּה דַּוְקָא לַכֶּלֶב? לָמָּה לֹא לַגּוֹי?</p><div class='highlight-box'>💡 <strong>תְּשׁוּבַת רַשִׁ\"י:</strong> גַּם לַגּוֹי מֻתָּר לִמְכֹּר! אֶלָּא שֶׁהַתּוֹרָה אָמְרָה לָתֵת דַּוְקָא לַכֶּלֶב. לָמָּה? כִּי <em>אֵין הַקָּדוֹשׁ בָּרוּךְ הוּא מְקַפֵּחַ שְׂכַר כָּל בְּרִיָּה</em> — כָּל יְצוּר שֶׁעָשָׂה טוֹבָה מְקַבֵּל שְׂכָרוֹ! 🏆</div><p>בְּלֵיל מַכַּת בְּכוֹרוֹת — כָּל הַמִּצְרִים בָּכוּ וְצָרְחוּ. הַכְּלָבִים נוֹבְחִים תָּמִיד כְּשֶׁיֵּשׁ הָמוֹן. אַךְ כְּשֶׁהַמַּלְאָךְ עָבַר עַל יִשְׂרָאֵל — הַכְּלָבִים שָׁתְקוּ לְגַמְרֵי! 🤫</p><div class='love-box'>💖 הַשֵּׁם אוֹמֵר לָנוּ: גַּם לַכֶּלֶב שֶׁשָּׁתַק מְגִיעַ שָׂכָר!<br>כָּל כָּךְ חָשׁוּב לַשֵּׁם שֶׁנַּכִּיר טוֹבָה לְכָל דָּבָר.<br>אֵיךְ אַתָּה מַרְגִּישׁ אֶת אַהֲבַת הַשֵּׁם בְּיַחַס הַזֶּה? 💫</div>",
            questions: [
                {
                    q: "לָמָּה הַתּוֹרָה מְצַוָּה לָתֵת אֶת הַטְּרֵפָה דַּוְקָא לַכֶּלֶב?",
                    answers: ["כִּי הַכֶּלֶב שָׁתַק בְּלֵיל מַכַּת בְּכוֹרוֹת", "כִּי לַגּוֹי אָסוּר לֶאֱכֹל בָּשָׂר טָרף", "כִּי הַכֶּלֶב שׁוֹמֵר עַל הַבַּיִת כָּל הַלֵּילוֹת", "כִּי בָּשָׂר טָרף מַזִּיק לִבְנֵי אָדָם בִּלְבַד"],
                    correct: 0,
                    explanation: "רַשִׁ\"י מְסַבִּיר שֶׁהַכֶּלֶב שָׁתַק בְּלֵיל מַכַּת בְּכוֹרוֹת, וְהַשֵּׁם מְשַׁלֵּם שָׂכָר לְכָל בְּרִיָּה שֶׁעָשְׂתָה טוֹבָה."
                },
                {
                    q: "מָה אוֹמֵר רַשִׁ\"י לְגַבֵּי מְכִירַת הַטְּרֵפָה לַגּוֹי?",
                    answers: ["מֻתָּר לִמְכֹּר לַגּוֹי, אַךְ מִצְוָה לָתֵת לַכֶּלֶב", "לְגוֹי אָסוּר, לַכֶּלֶב בִּלְבַד מֻתָּר", "חַיָּב לִזְרֹק לָאַשְׁפָּה כְּדֵי שֶׁלֹּא יֹאכְלוּ גּוֹיִים", "אָסוּר לִמְכֹּר לְגוֹי וְגַם אָסוּר לָתֵת לַכֶּלֶב"],
                    correct: 0,
                    explanation: "רַשִׁ\"י אוֹמֵר שֶׁגַּם לַגּוֹי מֻתָּר לִמְכֹּר. אֶלָּא שֶׁאִם אֵין לְךָ שִׁמּוּשׁ — מִצְוָה לָתֵת לַכֶּלֶב בִּגְלַל הַכָּרַת הַטּוֹב."
                },

    function getCorrectText() {
        var t = correctTexts[corrCount % correctTexts.length];
        corrCount++;
        return t.replace('{name}', userName);
    }
    function getLoveText() {
        var t = loveTexts[lovCount % loveTexts.length];
        lovCount++;
        return t.replace('{name}', userName);
    }

    function playCorrectSound() {
        try {
            var ctx = getAudioContext();
            [261.63, 329.63, 392.00].forEach(function(freq, i) {
                var osc = ctx.createOscillator(), gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.frequency.value = freq; osc.type = 'sine';
                gain.gain.setValueAtTime(0.25, ctx.currentTime + i * 0.18);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.18 + 0.35);
                osc.start(ctx.currentTime + i * 0.18);
                osc.stop(ctx.currentTime + i * 0.18 + 0.35);
            });
        } catch(e) {}
    }

    function playWrongSound() {
        try {
            var ctx = getAudioContext();
            var osc = ctx.createOscillator(), gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.frequency.value = 180; osc.type = 'sine';
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
            osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.5);
        } catch(e) {}
    }

    function playCompletionSound() {
        try {
            var ctx = getAudioContext();
            [523.25, 659.25, 783.99, 1046.50, 783.99, 659.25].forEach(function(freq, i) {
                var osc = ctx.createOscillator(), gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.frequency.value = freq; osc.type = 'sine';
                gain.gain.setValueAtTime(0.28, ctx.currentTime + i * 0.15);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.15 + 0.3);
                osc.start(ctx.currentTime + i * 0.15);
                osc.stop(ctx.currentTime + i * 0.15 + 0.3);
            });
        } catch(e) {}
    }

    function shuffleArray(arr) {
        var s = arr.slice();
        for (var i = s.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var tmp = s[i]; s[i] = s[j]; s[j] = tmp;
        }
        return s;
    }

    async function sendScoreToTeacher() {
        var now = new Date();
        var data = {
            name: userName,
            score: score + "/12",
            percentage: Math.round((score / 12) * 100) + "%",
            gameName: document.title,
            date: now.toLocaleDateString('he-IL'),
            time: now.toLocaleTimeString('he-IL')
        };
        try {
            await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify(data)
            });
            console.log('הציון נשלח למורה!');
        } catch(e) { console.error('שגיאה:', e); }
    }

    function renderHUD() {
        return '<div class="game-hud">' +
            '<div class="hud-item"><div class="hud-label">שִׁיעוּר</div><div class="hud-value">' + (currentLesson + 1) + '/4</div></div>' +

            '<div class="hud-item"><div class="hud-label">נְקֻדּוֹת</div><div class="hud-value">' + score + '/12</div></div>' +
            '</div>';
    }

    function renderLesson(index) {
        currentLesson = index;
        lessonScore = 0;
        answeredQuestions = [];
        var lesson = lessons[index];
        var progress = (index / lessons.length) * 100;

        var questionsHTML = lesson.questions.map(function(q, qi) {
            var shuffled = shuffleArray(q.answers.map(function(a, ai) { return { text: a, origIndex: ai }; }));
            var answersHTML = shuffled.map(function(ans) {
                return '<button class="answer-btn" onclick="checkAnswer(' + index + ',' + qi + ',' + ans.origIndex + ',this)">' + ans.text + '</button>';
            }).join('');
            return '<div class="question-block" id="qblock_' + qi + '">' +
                '<div class="question-number">שְׁאֵלָה ' + (qi + 1) + ' מִתּוֹךְ 3</div>' +
                '<div class="question-header">' + q.q + '</div>' +
                '<div class="answers-grid">' + answersHTML + '</div>' +
                '<div id="feedback_' + qi + '"></div>' +
                '</div>';
        }).join('<hr class="divider">');

        document.getElementById('gameContainer').innerHTML =
            renderHUD() +
            '<div class="lesson-card">' +
            '<div class="lesson-header">' +
            '<div class="lesson-number">' + lesson.number + '</div>' +
            '<div class="lesson-title">' + lesson.title + '</div>' +
            '<div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:' + progress + '%"></div></div>' +
            '</div>' +
            '<div class="lesson-body">' +
            '<div class="lesson-text">' + lesson.content + '</div>' +
            '<hr class="divider">' +
            '<div class="question-section">' + questionsHTML + '</div>' +
            '</div></div>';
    }

    function checkAnswer(lessonIdx, questionIdx, selectedOrigIndex, btn) {
        if (answeredQuestions.indexOf(questionIdx) !== -1) return;
        answeredQuestions.push(questionIdx);
        var q = lessons[lessonIdx].questions[questionIdx];
        var isCorrect = (selectedOrigIndex === q.correct);

        var allBtns = btn.closest('.answers-grid').querySelectorAll('.answer-btn');
        allBtns.forEach(function(b) {
            b.disabled = true;
            if (b.textContent.trim() === q.answers[q.correct]) b.classList.add('correct');
        });

        var feedbackEl = document.getElementById('feedback_' + questionIdx);
        if (isCorrect) {
            btn.classList.add('correct', 'pop');
            score++; lessonScore++;
            playCorrectSound();
            feedbackEl.innerHTML = '<div class="feedback-box feedback-correct">' +
                '<div class="feedback-title">' + getCorrectText() + '</div>' +
                '<div>' + q.explanation + '</div>' +
                '<div style="margin-top:8px;font-style:italic">' + getLoveText() + '</div>' +
                '</div>';
        } else {
            btn.classList.add('wrong');
            playWrongSound();
            var block = btn.closest('.question-block');
            block.classList.add('shake');
            setTimeout(function() { block.classList.remove('shake'); }, 500);
            feedbackEl.innerHTML = '<div class="feedback-box feedback-wrong">' +
                '<div class="feedback-title">לֹא בְּדִיּוּק... 🤔</div>' +
                '<div>' + q.explanation + '</div>' +
                '<div style="margin-top:8px;font-style:italic">' +
                'נַסֶּה שׁוּב, ' + userName + ' — גַּם בְּדֶרֶךְ לַטָּעוּת לוֹמְדִים לְאַהֵב אֶת הַשֵּׁם 💡' +
                '</div></div>';
        }
        if (answeredQuestions.length === lessons[lessonIdx].questions.length) {
            setTimeout(function() { showLessonResult(lessonIdx); }, 1500);
        }
    }

    function showLessonResult(lessonIdx) {
        var isGood = (lessonScore >= 2);
        var isPerfect = (lessonScore === 3);
        var isLast = (lessonIdx === lessons.length - 1);
        var icon, title, message, btnText, btnAction;

        if (isPerfect) {
            icon = '🏆'; title = 'מַדְהִים, ' + userName + '!';
            message = 'כָּל 3 שְׁאֵלוֹת נְכוֹנוֹת! אַתָּה חַי בְּאַהֲבַת ה\'! 🎉<br><em>הַשֵּׁם גֵּאֶה בְּךָ כָּעֵת!</em>';
            playCompletionSound();
        } else if (isGood) {
            icon = '💪'; title = 'כִּמְעַט מֻשְׁלָם, ' + userName + '!';
            message = 'מַמָּשׁ כְּמוֹ בָּאַהֲבָה — מְמַשִּׁיכִים לִצְמֹחַ 🌱';
        } else {
            icon = '💖'; title = 'בּוֹא נְנַסֶּה שׁוּב!';
            message = 'בּוֹא נְנַסֶּה שׁוּב, ' + userName + ', בְּאַהֲבָה וְסַבְלָנוּת 💖';
        }

        if (isGood && isLast) { btnText = '🎓 לַתְּעוּדָה!'; btnAction = 'showCertificate()'; }
        else if (isGood) { btnText = 'לַשִּׁיעוּר הַבָּא ➡️'; btnAction = 'renderLesson(' + (lessonIdx + 1) + ')'; }
        else { btnText = '🔄 נְנַסֶּה שׁוּב!'; btnAction = 'renderLesson(' + lessonIdx + ')'; }

        document.getElementById('gameContainer').innerHTML =
            renderHUD() +
            '<div class="lesson-card"><div class="lesson-body"><div class="lesson-result">' +
            '<span class="result-icon">' + icon + '</span>' +
            '<div class="result-title">' + title + '</div>' +
            '<div class="result-score ' + (isGood ? 'score-good' : 'score-bad') + '">' + lessonScore + '/3</div>' +
            '<div class="result-message">' + message + '</div>' +
            '<button class="action-btn" onclick="' + btnAction + '">' + btnText + '</button>' +
            '</div></div></div>';
    }

    function showCertificate() {
        playCompletionSound();
        var pct = Math.round((score / 12) * 100);
        var stars = pct === 100 ? '⭐⭐⭐⭐⭐' : pct >= 80 ? '⭐⭐⭐⭐' : pct >= 66 ? '⭐⭐⭐' : '⭐⭐';
