<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>יום השואה והגבורה</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;700;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Frank Ruhl Libre', 'David', serif;
      background: linear-gradient(135deg, #1a0a00 0%, #3d1a00 40%, #1a0a00 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }

    .container {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,200,80,0.25);
      border-radius: 20px;
      padding: 50px 40px;
      max-width: 700px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(6px);
      box-shadow: 0 0 60px rgba(200,100,0,0.3);
    }

    .candle-wrap {
      margin-bottom: 20px;
    }

    .candle {
      display: inline-block;
      font-size: 72px;
      animation: flicker 2s ease-in-out infinite alternate;
      filter: drop-shadow(0 0 18px #ff9900);
    }

    @keyframes flicker {
      0%   { transform: scaleX(1)   rotate(-1deg); filter: drop-shadow(0 0 12px #ff6600); }
      25%  { transform: scaleX(0.97) rotate(1deg); filter: drop-shadow(0 0 22px #ffaa00); }
      50%  { transform: scaleX(1.02) rotate(0deg); filter: drop-shadow(0 0 16px #ff7700); }
      75%  { transform: scaleX(0.98) rotate(-1deg); filter: drop-shadow(0 0 25px #ffcc00); }
      100% { transform: scaleX(1)   rotate(1deg); filter: drop-shadow(0 0 14px #ff8800); }
    }

    .title {
      color: #f5d77a;
      font-size: 2.6rem;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 8px;
      text-shadow: 0 0 20px rgba(255,180,0,0.6);
    }

    .subtitle {
      color: #c9a85c;
      font-size: 1.15rem;
      margin-bottom: 10px;
      font-weight: 400;
      letter-spacing: 1px;
    }

    .divider {
      width: 60%;
      height: 2px;
      background: linear-gradient(to left, transparent, #c9853a, transparent);
      margin: 18px auto 30px;
      border: none;
    }

    .stars {
      color: #e8c44a;
      font-size: 1.3rem;
      margin-bottom: 28px;
      letter-spacing: 8px;
    }

    .links-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 30px;
    }

    .link-card {
      display: block;
      text-decoration: none;
      background: linear-gradient(145deg, rgba(80,30,0,0.7), rgba(50,15,0,0.9));
      border: 1px solid rgba(255,180,60,0.3);
      border-radius: 14px;
      padding: 22px 16px;
      color: #f0d090;
      font-size: 1.2rem;
      font-weight: 700;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .link-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(to left, transparent, #e8a020, transparent);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .link-card:hover {
      background: linear-gradient(145deg, rgba(120,50,0,0.85), rgba(80,25,0,0.95));
      border-color: rgba(255,200,80,0.7);
      color: #ffe89a;
      transform: translateY(-4px);
      box-shadow: 0 8px 25px rgba(200,100,0,0.4);
    }

    .link-card:hover::before {
      opacity: 1;
    }

    .link-card .icon {
      font-size: 2.2rem;
      display: block;
      margin-bottom: 10px;
    }

    .link-card.wide {
      grid-column: 1 / -1;
    }

    .footer-text {
      color: #8a6030;
      font-size: 0.9rem;
      margin-top: 10px;
    }

    .star-of-david {
      color: #c9853a;
      font-size: 1.6rem;
      margin: 0 6px;
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="candle-wrap">
      <span class="candle">🕯️</span>
    </div>

    <h1 class="title">יום השואה והגבורה</h1>
    <p class="subtitle">הנצחה · לימוד · זיכרון</p>
    <hr class="divider">
    <div class="stars">✦ ✦ ✦</div>

    <div class="links-grid">

      <a class="link-card"
         href="../p/2236.html"
         target="_blank">
        <span class="icon">🕯️</span>
        נֵר נְשָׁמָה
      </a>

      <a class="link-card"
         href="https://gamma.app/docs/-1kc9urdl90iq7cj?mode=doc"
         target="_blank">
        <span class="icon">✨</span>
        כּוֹחוֹ שֶׁל נֵר נְשָׁמָה
      </a>

      <a class="link-card"
         href="../p/2237.html"
         target="_blank">
        <span class="icon">📖</span>
        תְּהִלִּים פ"ג
      </a>

      <a class="link-card"
         href="../p/2235.html"
         target="_blank">
        <span class="icon">🎞️</span>
        מצגות נוספות
      </a>

      <a class="link-card wide"
         href="https://gamma.app/docs/-57x074ubfjworr6?mode=doc"
         target="_blank">
        <span class="icon">📚</span>
        מַדְרִיךְ חִינוּכִי לְמוֹרִים וְרַבָּנִים
      </a>

    </div>

    <p class="footer-text">
      <span class="star-of-david">✡</span>
      זִכְרוֹ יִהְיֶה בָּרוּךְ
      <span class="star-of-david">✡</span>
    </p>

  </div>

</body>
</html>
