const FILE_ICONS = { pdf:'📕', docx:'📝', doc:'📝', html:'🌐', pptx:'📊', xlsx:'📈' };

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const filesGrid = document.getElementById('filesGrid');
const filesStats = document.getElementById('filesStats');
function renderFiles(filter) {
  filesGrid.innerHTML = '';
  const f = (filter || '').toLowerCase();
  let shown = 0;
  for (const file of FILES) {
    const desc = FILE_DESC[file.name] || '';
    if (f && !file.name.toLowerCase().includes(f) && !desc.toLowerCase().includes(f)) continue;
    shown++;
    const ext = file.name.split('.').pop().toLowerCase();
    const icon = FILE_ICONS[ext] || '📄';
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = '<div class="icon">' + icon + '</div>' +
      '<a class="title" href="' + encodeURI(file.path) + '" target="_blank">' + escapeHtml(file.name) + '</a>' +
      '<div class="meta">' + file.size.toLocaleString('he-IL') + ' KB</div>' +
      (desc ? '<div class="desc">' + escapeHtml(desc) + '</div>' : '');
    filesGrid.appendChild(card);
  }
  filesStats.textContent = shown + ' קבצים';
}

const contactsList = document.getElementById('contactsList');
const contactsStats = document.getElementById('contactsStats');
function normalizePhone(s) { return s.replace(/[^0-9]/g, ''); }
function renderContacts(filter) {
  const q = (filter || '').trim();
  const qPhone = normalizePhone(q);
  contactsList.innerHTML = '';
  let matches = CONTACTS;
  if (q) {
    matches = CONTACTS.filter(c => {
      if (c.name.toLowerCase().includes(q.toLowerCase())) return true;
      if (qPhone && c.tels.some(t => normalizePhone(t).includes(qPhone))) return true;
      return false;
    });
  }
  if (matches.length === 0) {
    contactsList.innerHTML = '<div class="no-results">לא נמצאו תוצאות</div>';
  } else {
    for (const c of matches) {
      const row = document.createElement('div');
      row.className = 'contact';
      const telsHtml = c.tels.map(t => '<a href="tel:' + t.replace(/\s+/g,'') + '">' + escapeHtml(t) + '</a>').join('');
      row.innerHTML = '<span class="contact-name">' + escapeHtml(c.name) + '</span><span class="contact-tels">' + telsHtml + '</span>';
      contactsList.appendChild(row);
    }
  }
  contactsStats.textContent = q ? ('נמצאו ' + matches.length + ' מתוך ' + CONTACTS.length) : ('סה"כ ' + CONTACTS.length + ' אנשי קשר');
}

const categoriesEl = document.getElementById('categories');
const linksStats = document.getElementById('linksStats');
let totalLinks = 0;
for (const cat in CATEGORIES) totalLinks += CATEGORIES[cat].length;
linksStats.textContent = 'סה"כ ' + totalLinks + ' קישורים מתוארים ב-' + Object.keys(CATEGORIES).length + ' קטגוריות';

const sortedCats = Object.entries(CATEGORIES).sort((a,b) => b[1].length - a[1].length);
for (const [cat, items] of sortedCats) {
  const det = document.createElement('details');
  det.className = 'category';
  const summary = document.createElement('summary');
  summary.innerHTML = '<span>' + escapeHtml(cat) + '</span><span class="badge">' + items.length + '</span>';
  det.appendChild(summary);

  const search = document.createElement('input');
  search.className = 'cat-search';
  search.placeholder = 'סינון בתוך קטגוריה זו...';

  const list = document.createElement('div');
  list.className = 'cat-list';

  function renderList(filter) {
    const f = (filter || '').toLowerCase();
    list.innerHTML = '';
    for (const item of items) {
      if (f && !item.desc.toLowerCase().includes(f) && !item.url.toLowerCase().includes(f)) continue;
      const wrap = document.createElement('div');
      wrap.className = 'link-item';
      const a = document.createElement('a');
      a.href = item.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = item.url;
      const d = document.createElement('div');
      d.className = 'link-desc';
      d.textContent = item.desc;
      wrap.appendChild(d);
      wrap.appendChild(a);
      list.appendChild(wrap);
    }
  }
  search.addEventListener('input', () => renderList(search.value));
  renderList('');

  det.appendChild(search);
  det.appendChild(list);
  categoriesEl.appendChild(det);
}

document.querySelectorAll('nav.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tabpanel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

document.getElementById('globalSearch').addEventListener('input', (e) => {
  const v = e.target.value;
  renderFiles(v);
  renderContacts(v);
  if (v.trim()) {
    document.querySelectorAll('details.category').forEach(d => d.open = true);
    document.querySelectorAll('.cat-search').forEach(s => { s.value = v; s.dispatchEvent(new Event('input')); });
  } else {
    document.querySelectorAll('details.category').forEach(d => d.open = false);
    document.querySelectorAll('.cat-search').forEach(s => { s.value = ''; s.dispatchEvent(new Event('input')); });
  }
});

renderFiles('');
renderContacts('');
