        // פוּנְקְצִיּוֹת עֶזֶר
        function playSound(frequency, duration) {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = frequency;
            oscillator.type = "sine";
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + duration);
        }

        function playSuccessSound() {
            playSound(523.25, 0.2);
            setTimeout(() => playSound(659.25, 0.2), 200);
            setTimeout(() => playSound(783.99, 0.3), 400);
        }

        function playCompletionSound() {
            const notes = [523.25, 659.25, 783.99, 1046.50, 783.99, 659.25];
            const durations = [0.15, 0.15, 0.15, 0.2, 0.15, 0.3];
            let delay = 0;
            
            notes.forEach((note, i) => {
                setTimeout(() => playSound(note, durations[i]), delay);
                delay += durations[i] * 1000;
            });
        }

        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function updateProgressBar() {
            const totalQuestions = lessons.length * 3;
            const progress = (score / totalQuestions) * 100;
            return `

                        ${Math.round(progress)}%
                    </div>
                </div>
                <div class="score-display">נִקּוּד: ${score} מִתּוֹךְ ${totalQuestions} 🌟</div>
            `;
        }

            try {

                    method: "POST",
                    headers: {"Content-Type": "text/plain"},
                    body: JSON.stringify(data)

        function renderQuestion(questionIndex) {

            `;

            if (questionIndex === 0) {

        function checkAnswer(questionIndex, selectedAnswer, buttonIndex) {
            const lesson = lessons[currentLesson];

            const isCorrect = selectedAnswer === question.correct;

            const answersDiv = document.getElementById(`answers-${questionIndex}`);

            const feedbackDiv = document.getElementById(`feedback-${questionIndex}`);

            setTimeout(() => {
