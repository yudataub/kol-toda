            let startTime = audioContext.currentTime;
            frequencies.forEach((freq, index) => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = freq;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.3, startTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + durations[index]);
                
                oscillator.start(startTime);
                oscillator.stop(startTime + durations[index]);
                
                startTime += durations[index];
            });
        }

        async function sendScoreToTeacher() {
            if (!userName) return;
            
            const now = new Date();
            const data = {
                name: userName,
                score: `${totalScore}/${lessons.length * 30}`,
                percentage: `${Math.round((totalScore / (lessons.length * 30)) * 100)}%`,
                gameName: document.title,
                date: now.toLocaleDateString('he-IL'),
                time: now.toLocaleTimeString('he-IL')
            };
            
            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain'
                    },
                    body: JSON.stringify(data)
                });
                console.log('✅ הַנְּתוּנִים נִשְׁלְחוּ בְּהַצְלָחָה!');

                console.error('❌ שְׁגִיאָה בְּשִׁלּוּחַ:', error);
            }
        }

        // פונקציות עזר
        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function updateProgress() {
            const progress = ((currentLesson + 1) / lessons.length) * 100;
            const progressBar = document.querySelector('.progress-bar');
            if (progressBar) {
                progressBar.style.width = progress + '%';
                progressBar.textContent = Math.round(progress) + '%';
            }
        }

                    <p>הַיּוֹם אָנוּ נוֹסְעִים בְּמַסָּע מַדְהִים 🚀 לְגַלּוֹת אֶת סוֹד הַתְּפִלָּה שֶׁפּוֹתַחַת שַׁעֲרֵי שָׁמַיִם! ✨</p>
                    <p>נִלְמַד עַל תְּפִלַּת לוֹט 🙏, עַל י״ג מִדּוֹת הָרַחֲמִים 💖, וְעַל הַסּוֹד שֶׁל הַכָּרַת הַטּוֹב! 🌈</p>
                    <p style="text-align: center; margin-top: 15px;">
                        <strong>כְּדֵי לְעָבוֹר לַשִּׁיעוּר הַבָּא - צָרִיךְ לַעֲנוֹת נָכוֹן עַל כָּל 3 הַשְּׁאֵלוֹת! 🎯</strong>
                    </p>
                    <p style="text-align: center; font-size: 1.3em; margin-top: 10px;">
                        אֲבָל אַל תִּדְאֲגוּ - הַשֵּׁם אוֹהֵב אֶתְכֶם וְאֲנַחְנוּ כָּאן לָלֶכֶת בְּאַהֲבָה! 💕
                    </p>
                    <p style="text-align: center; font-size: 1.2em; margin-top: 10px;">
                        מוּכָנִים? בּוֹאוּ נַתְחִיל! 🎉
                    </p>
                </div>
                
                <div class="name-input-container fade-in">
                    <p style="font-size: 1.4em; margin-bottom: 15px; font-weight: bold;">
                        אֵיזֶה שֵׁם נִרְשֹׁם לְךָ בִּתְעוּדָה? 💫
                    </p>
                    <input type="text" id="nameInput" class="name-input" placeholder="הַכְנֵס אֶת שִׁמְךָ כָּאן..." />
                </div>
                
                <button class="start-btn" onclick="startGame()">🚀 בּוֹאוּ נַתְחִיל בְּשִׂמְחָה! 💖</button>
            `;
        }

        function startGame() {
            const nameInput = document.getElementById('nameInput');
            userName = nameInput ? nameInput.value.trim() : "";
            
            if (!userName) {
                alert("בְּבַקָּשָׁה הַכְנֵס אֶת שִׁמְךָ כְּדֵי לְהַתְחִיל! 😊");
                return;
            }
            
            currentLesson = 0;
            totalScore = 0;
            renderLesson();
        }

        function renderLesson() {
            if (currentLesson >= lessons.length) {
                renderComplete();
                return;
            }

            const lesson = lessons[currentLesson];
            currentQuestion = 0;
            lessonScore = 0;

            const container = document.getElementById('gameContainer');
            container.innerHTML = `
                <div class="progress-container">
                    <div class="progress-bar" style="width: 0%">0%</div>
                </div>
                <div class="score-display">
                    נִקּוּד כּוֹלֵל: ${totalScore} 🌟 | שָׁלוֹם ${userName}! 💖
                </div>
                <div class="lesson-content fade-in">
                    <div class="lesson-title">${lesson.title}</div>
                    ${lesson.content}
                    <div class="inspiration-box">
                        ${lesson.inspirationQuestion}
                    </div>
                </div>
                <div style="text-align: center; margin: 20px 0;">
                    <p style="font-size: 1.3em; font-weight: bold; color: #6c5ce7;">
                        📝 מוּכָנִים לַשְּׁאֵלוֹת? בּוֹא נִרְאֶה! 💪
                    </p>
                </div>
                <div id="questionsContainer"></div>
            `;

            updateProgress();
            renderQuestion();
        }

        function renderQuestion() {
            const lesson = lessons[currentLesson];
            if (currentQuestion >= lesson.questions.length) {
                return;
            }

            const question = lesson.questions[currentQuestion];
            const shuffledAnswers = shuffleArray(question.answers);
            const correctAnswerText = question.answers[question.correct];
            const correctIndex = shuffledAnswers.indexOf(correctAnswerText);

            const questionsContainer = document.getElementById('questionsContainer');
            const questionDiv = document.createElement('div');
            questionDiv.className = 'question-box fade-in';
            questionDiv.id = `question-${currentQuestion}`;
            questionDiv.innerHTML = `
                <div class="question-text">
                    שְׁאֵלָה ${currentQuestion + 1} מִתּוֹךְ ${lesson.questions.length}: ${question.q}
                </div>
                ${shuffledAnswers.map((answer, index) => `
                    <button class="answer-btn" onclick="checkAnswer(${index}, ${correctIndex}, ${currentQuestion})" id="answer-${currentQuestion}-${index}">
                        ${answer}
                    </button>
                `).join('')}
                <div id="feedback-${currentQuestion}" class="hidden"></div>
                <div id="next-btn-${currentQuestion}" class="hidden"></div>
            `;

            questionsContainer.appendChild(questionDiv);
        }

        function checkAnswer(selectedIndex, correctIndex, questionNumber) {
            const lesson = lessons[currentLesson];
            const question = lesson.questions[currentQuestion];
            const feedbackDiv = document.getElementById(`feedback-${questionNumber}`);
            const nextBtnDiv = document.getElementById(`next-btn-${questionNumber}`);
            const buttons = document.querySelectorAll(`#question-${questionNumber} .answer-btn`);
            
            // השבתת כל הכפתורים
            buttons.forEach(btn => btn.disabled = true);

            // סימון התשובה הנכונה והשגויה
            buttons[correctIndex].classList.add('correct');
            if (selectedIndex !== correctIndex) {
                buttons[selectedIndex].classList.add('incorrect');
                buttons[selectedIndex].classList.add('shake');
            }

            feedbackDiv.classList.remove('hidden');

            if (selectedIndex === correctIndex) {
                lessonScore++;
                totalScore += 10;
                playCorrectSound();
                
                const encouragements = [
                    "מְצֻיָּן! ⭐",
                    "נִפְלָא! 💪",
                    "כָּל הַכָּבוֹד! 🎯",
                    "מְעֻלֶּה! 🏆",
                    "פְּצַצָּה! 💥"
                ];
                const randomEncouragement = encouragements[Math.floor(Math.random() * encouragements.length)];
                
                feedbackDiv.className = 'feedback correct fade-in';
                feedbackDiv.innerHTML = `
                    <div style="font-size: 1.5em; margin-bottom: 10px;">${randomEncouragement}</div>
                    <div class="explanation">
                        ${question.correctFeedback}
                    </div>
                `;
            } else {
                feedbackDiv.className = 'feedback incorrect fade-in';
                feedbackDiv.innerHTML = `
                    <div style="font-size: 1.5em; margin-bottom: 10px;">לֹא בְּדִיּוּק... 🤔</div>
                    <div class="explanation">
                        ${question.incorrectFeedback}
                    </div>
                `;
            }

            // עדכון הציון בזמן אמת
            const scoreDisplay = document.querySelector('.score-display');
            if (scoreDisplay) {
                scoreDisplay.innerHTML = `נִקּוּד כּוֹלֵל: ${totalScore} 🌟 | שָׁלוֹם ${userName}! 💖`;
            }

            // הוספת כפתור המשך
            nextBtnDiv.classList.remove('hidden');
            if (currentQuestion < lessons[currentLesson].questions.length - 1) {
                nextBtnDiv.innerHTML = `
                    <button class="next-question-btn" onclick="nextQuestion()">
                        הַמְשֵׁךְ לַשְּׁאֵלָה הַבָּאָה 📝
                    </button>
                `;
            } else {
                nextBtnDiv.innerHTML = `
                    <button class="next-question-btn" onclick="checkLessonComplete()">
                        בּוֹא נִרְאֶה אֶת הַתּוֹצָאוֹת! 🎯
                    </button>
                `;
            }
        }

        function nextQuestion() {
            currentQuestion++;
            renderQuestion();
        }

        function checkLessonComplete() {
            const container = document.getElementById('gameContainer');
            const questionsContainer = document.getElementById('questionsContainer');
            
            const requiredScore = lessons[currentLesson].questions.length;
            const percentage = (lessonScore / requiredScore) * 100;

            if (percentage === 100) {
                playCompleteSound();
                questionsContainer.innerHTML += `
                    <div class="feedback correct fade-in" style="margin-top: 30px;">
                        <div style="font-size: 2em;">🎉 מַדְהִים! אַתָּה שׁוֹלֵט! 🏆</div>
                        <div style="font-size: 1.5em; margin: 15px 0;">
                            סִיַּמְתָּ אֶת הַשִּׁיעוּר בְּהַצְלָחָה מוּחְלֶטֶת! 💯
                        </div>
                        <div style="font-size: 1.3em; margin: 10px 0;">
                            ⭐⭐⭐
                        </div>
                        <div style="font-size: 1.4em; margin: 15px 0; font-weight: bold;">
                            ${lessonScore}/${requiredScore} נָכוֹן!
                        </div>
                        <div class="love-message">
                            💫 אַתָּה חַי בְּאַהֲבַת ה'! הַשֵּׁם שָׂמֵחַ וְגֵאֶה בְּךָ! 🌟
                        </div>
                        <button class="continue-btn" onclick="nextLesson()">
                            ➡️ לַשִּׁיעוּר הַבָּא בְּשִׂמְחָה! 💫
                        </button>
                    </div>
                `;
            } else {
                questionsContainer.innerHTML += `
                    <div class="feedback incorrect fade-in" style="margin-top: 30px;">
                        <div style="font-size: 1.8em;">💪 כִּמְעַט שָׁם! בּוֹא נְנַסֶּה שׁוּב! 🌈</div>
                        <div style="font-size: 1.3em; margin: 15px 0;">
                            עָנִיתָ נָכוֹן עַל ${lessonScore} מִתּוֹךְ ${requiredScore} שְׁאֵלוֹת 📊
                        </div>
                        <div style="font-size: 1.2em; margin: 15px 0;">
                            🤗
                        </div>
                        <div style="font-size: 1.15em; margin: 15px 0;">
                            כְּדֵי לְעָבוֹר לַשִּׁיעוּר הַבָּא, צָרִיךְ לַעֲנוֹת נָכוֹן עַל כָּל 3 הַשְּׁאֵלוֹת 🎯
                        </div>
                        <div style="font-size: 1.1em; margin: 10px 0;">
                            אֲבָל אַל תִּדְאַג! 💕
                        </div>
                        <div class="love-message">
                            🌱 גַּם כְּשֶׁטּוֹעִים - לוֹמְדִים וְצוֹמְחִים!<br>
                            הַשֵּׁם אוֹהֵב אוֹתְךָ וּמַאֲמִין בְּךָ! ✨<br>
                            בּוֹא נְנַסֶּה שׁוּב בְּאַהֲבָה וּבְשִׂמְחָה! 🌟
                        </div>
                        <button class="retry-btn" onclick="renderLesson()">
                            🔄 בּוֹא נְנַסֶּה שׁוּב בְּאַהֲבָה! 💖
                        </button>
                    </div>
                `;
            }
        }

        function nextLesson() {
            currentLesson++;
            renderLesson();
        }

        function renderComplete() {
            playCompleteSound();
            
            // שליחת נתונים לגוגל
            sendScoreToTeacher();
            
            const container = document.getElementById('gameContainer');
            const finalPercentage = Math.round((totalScore / (lessons.length * 30)) * 100);
            
            container.innerHTML = `
                <h1 class="animate-pulse">🎉 מַזָּל טוֹב! סִיַּמְתָּ אֶת הַמַּסָּע! 🏆</h1>
                
                <div class="certificate fade-in">
                    <h2>🎓 תְּעוּדַת הִצְטַיְּנוּת 🌟</h2>
                    <p style="font-size: 1.8em; margin: 20px 0;">
                        ⭐⭐⭐
                    </p>
                    <p style="font-size: 1.5em; margin: 15px 0;">
                        <strong>${userName}</strong>
                    </p>
                    <p style="font-size: 1.3em; margin: 15px 0;">
                        הוֹכַחְתָּ שֶׁאַתָּה מַכִּיר אֶת סוֹד הַתְּפִלָּה!
                    </p>
                    <p style="font-size: 1.2em; margin: 10px 0;">
                        עָנִיתָ נָכוֹן עַל כָּל הַשְּׁאֵלוֹת בְּכָל הַשִּׁיעוּרִים! 💯
                    </p>
                    <div class="score-display" style="font-size: 2em; color: #e17055; margin: 25px 0;">
                        נִקּוּד סוֹפִי: ${totalScore} נְקֻדּוֹת (${finalPercentage}%) 🌟
                    </div>
                    <p style="font-size: 1.2em; margin: 15px 0;">
                        אַתָּה יוֹדֵעַ לִחְיוֹת בְּאַהֲבַת ה׳! 💖
                    </p>
                    <div class="quote">
                        "וְאָהַבְתָּ אֵת ה׳ אֱלֹקֶיךָ בְּכָל לְבָבְךָ וּבְכָל נַפְשְׁךָ וּבְכָל מְאֹדֶךָ"
                    </div>
                </div>

                <div class="reflection-questions fade-in">
                    <h3>💭 שְׁאֵלוֹת לְמַחְשָׁבָה</h3>
                    <ol>
                        <li>אֵיךְ אוּכַל לְהָבִיא יוֹתֵר אַהֲבַת ה׳ לַלִּמּוּד הַבָּא שֶׁלִּי?</li>
                        <li>אֵיזוֹ מִצְוָה אֲנִי רוֹצֶה לְקַיֵּם הַיּוֹם מִתּוֹךְ שִׂמְחָה?</li>
                        <li>כַּמָּה חֲסָדִים אֲנִי יָכוֹל לִמְנוֹת עַל יָדִי הַיּוֹם?</li>
                    </ol>
                </div>

                <div style="text-align: center; margin: 30px 0;" class="fade-in">
                    <p style="font-size: 1.4em; margin-bottom: 15px; font-weight: bold;">
                        🎁 לַהִרָשֵׁם לְהַגְרָלַת פְּרָסִים! 🎉
                    </p>
                    <a href="https://forms.gle/A66uubei4XSX6SG2A" target="_blank" class="raffle-link">
                        לַחֲצוּ כָּאן לְהִרָשֵׁם לְהַגְרָלָה! 🎉
                    </a>
                </div>

                <div class="contact-info fade-in">
                    <p style="font-size: 1.4em; margin-bottom: 10px;">
                        <strong>נִבְנָה בְּאַהֲבָה עַל יְדֵי:</strong>
                    </p>
                    <p style="font-size: 1.3em;">
                        הָרַב יְהוּדָה טָאוּב מִקִּרְיַת אַתָּא 💫
                    </p>
                    <p style="font-size: 1.2em; margin-top: 10px;">
                        📞 לִפְרָטִים: 0527139520
                    </p>
                </div>

                <div class="love-message fade-in" style="margin-top: 30px; font-size: 1.3em;">
                    זְכוּת הַלִּמּוּד תָּגֵן עָלֵינוּ! 🙏✨
                </div>
            `;
        }

        // אתחול
        renderIntro();
    </script>
</body>
