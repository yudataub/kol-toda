            line-height: 2;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);

            font-size: 1.2em;
            line-height: 2.2;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);

            font-size: 1.15em;
            line-height: 2;
        }

            margin: 20px 0;

            font-weight: bold;

            box-shadow: 0 5px 15px rgba(0,0,0,0.3);

            font-size: 1.2em;
            line-height: 2;

        }

            background: #f8d7da;

            color: #721c24;
        }

            border: none;

            height: 30px;
            background: #e0e0e0;
            border-radius: 15px;
            margin: 20px 0;

            color: #e91e63;
            margin: 15px 0;
            font-weight: bold;

            border-radius: 10px;
            font-size: 1.1em;

    </style>

            notes.forEach((note, i) => {
                setTimeout(() => playSound(note, durations[i]), delay);
                delay += durations[i] * 1000;
            });
        }

        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function updateProgressBar() {
            const totalQuestions = lessons.length * 3;
            const progress = (score / totalQuestions) * 100;
            return `
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${progress}%">
                        ${Math.round(progress)}%
                    </div>
                </div>
                <div class="score-display">נִקּוּד: ${score} מִתּוֹךְ ${totalQuestions} 🌟</div>
            `;
        }

        async function sendScoreToTeacher() {
            const now = new Date();
            const data = {
                name: userName,
                score: `${score}/12`,
                percentage: `${Math.round((score/12)*100)}%`,
                gameName: document.title,
                date: now.toLocaleDateString("he-IL"),
                time: now.toLocaleTimeString("he-IL")
            };
            
            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: "POST",
                    headers: {"Content-Type": "text/plain"},
                    body: JSON.stringify(data)
                });
                console.log("✅ הַנְּתוּנִים נִשְׁלְחוּ בְּהַצְלָחָה!");
            } catch (error) {
                console.error("❌ שְׁגִיאָה בְּשִׁלּוּחַ:", error);
            }
        }

        // פוּנְקְצִיּוֹת רִינְדּוּר
        function renderIntro() {
            document.getElementById("gameContainer").innerHTML = `
                <h1 class="pulse">כִּי אִשְּׁרוּנִי בָנוֹת 💖</h1>
                <div class="intro">
                    <p style="font-size: 1.4em; text-align: center;">🌟 בָּרוּכִים הַבָּאִים לְמִשְׂחָק מְיֻחָד! 🌟</p>
                    <p>הַיּוֹם נִלְמַד עַל הוֹדָיָה וְשִׂמְחָה! 🎉</p>
                    <p>נְגַלֶּה <span class="highlight">שְׁנֵי סוֹדוֹת נִפְלָאִים</span> מִפָּרָשַׁת וַיֵּצֵא:</p>
                    <p>✨ סוֹד הַמִּלָּה <strong>"זֶבֶד"</strong> וְהַקֶּשֶׁר לְדִינָה</p>
                    <p>✨ <strong>"כִּי אִשְּׁרוּנִי בָנוֹת"</strong> – הָאֹשֶׁר שֶׁבְּשֵׁבֶט אָשֵׁר</p>
                    <p style="font-size: 1.3em; margin-top: 20px;">נִלְמַד מִ<span class="highlight">לֵאָה אִמֵּנוּ</span> כֵּיצַד לְהוֹדוֹת לַה' עַל <strong>כָּל מַתָּנָה</strong>! 💝</p>
                    <p style="text-align: center; margin-top: 20px;">מוּכָן לְהַתְחִיל? 🚀</p>
                </div>
                <button class="btn-primary" onclick="startGame()">בּוֹא נַתְחִיל! 🎯</button>
            `;
        }

        function startGame() {
            userName = prompt("מָה שִׁמְךָ? 💫");
            if (!userName || userName.trim() === "") {
                userName = "תַּלְמִיד יָקָר";
            }
            currentLesson = 0;
            score = 0;
            renderLesson(0);
        }

        function renderLesson(lessonIndex) {
            const lesson = lessons[lessonIndex];
            lessonScore = 0;
            answeredQuestions = [];

            const container = document.getElementById("gameContainer");
            container.innerHTML = `
                <h1>שִׁיעוּר ${lessonIndex + 1} מִתּוֹךְ 4 📚</h1>
                ${updateProgressBar()}
                <h2>${lesson.title}</h2>
                <div class="lesson-content">
                    ${lesson.content}
                </div>
                <div class="reflection-box">
                    ${lesson.reflection}
                </div>
                <div id="questionsContainer"></div>
            `;

            renderQuestion(0);
        }

        function renderQuestion(questionIndex) {
            const lesson = lessons[currentLesson];
            const question = lesson.questions[questionIndex];
            
            const shuffledAnswers = shuffleArray(question.answers.map((answer, index) => ({
                text: answer,
                originalIndex: index
            })));

            const questionsContainer = document.getElementById("questionsContainer");
            const questionHTML = `
                <div class="question-container">
                    <h3 style="color: #e91e63; margin-bottom: 15px;">שְׁאֵלָה ${questionIndex + 1} מִתּוֹךְ 3</h3>
                    <div class="question">${question.question}</div>
                    <div id="answers-${questionIndex}">
                        ${shuffledAnswers.map((answer, idx) => `
                            <button class="answer-btn" onclick="checkAnswer(${questionIndex}, ${answer.originalIndex}, ${idx})">
                                ${answer.text}
                            </button>
                        `).join("")}
                    </div>
                    <div id="feedback-${questionIndex}"></div>
                </div>
            `;

            if (questionIndex === 0) {
                questionsContainer.innerHTML = questionHTML;
            } else {
                questionsContainer.innerHTML += questionHTML;
            }
        }

        function checkAnswer(questionIndex, selectedAnswer, buttonIndex) {
            const lesson = lessons[currentLesson];
            const question = lesson.questions[questionIndex];
            const isCorrect = selectedAnswer === question.correct;

            // נְעִילַת כָּל הַכַּפְתּוֹרִים
            const answersDiv = document.getElementById(`answers-${questionIndex}`);
            const buttons = answersDiv.querySelectorAll("button");
            buttons.forEach(btn => btn.disabled = true);

            const feedbackDiv = document.getElementById(`feedback-${questionIndex}`);
            
            const encouragements = [
                `מְצֻיָּן, ${userName}! ⭐`,
                `נִפְלָא, ${userName}! 💪`,
                `כָּל הַכָּבוֹד, ${userName}! 🎯`,
                `פְּצָצָה, ${userName}! 🏆`
            ];

            if (isCorrect) {
                score++;
                lessonScore++;
                playSuccessSound();
                
                const randomEncouragement = encouragements[Math.floor(Math.random() * encouragements.length)];
                
                feedbackDiv.innerHTML = `
                    <div class="feedback correct">
                        <p style="font-size: 1.3em; font-weight: bold;">${randomEncouragement}</p>
                        <p>${question.explanation}</p>
                        <p style="margin-top: 15px; font-size: 1.2em;">
                            💖 <strong>הַשֵּׁם שָׂמֵחַ כְּשֶׁאַתָּה לוֹמֵד בְּאַהֲבָה, ${userName}!</strong> 💖
                        </p>
                    </div>
                `;
            } else {
                feedbackDiv.innerHTML = `
                    <div class="feedback incorrect">
                        <p style="font-size: 1.2em;">לֹא בְּדִיּוּק, ${userName}... 🤔</p>
                        <p>${question.explanation}</p>
                        <p style="margin-top: 15px; font-size: 1.15em;">
                            💡 <strong>גַּם כְּשֶׁטּוֹעִים – לוֹמְדִים! הַשֵּׁם אוֹהֵב אוֹתְךָ, ${userName}! 💡</strong>
                        </p>
                    </div>
                `;
            }

            answeredQuestions.push(questionIndex);

            setTimeout(() => {
                if (questionIndex < 2) {
                    renderQuestion(questionIndex + 1);
                } else {
                    showLessonSummary();
                }
            }, 3500);
        }

        function showLessonSummary() {
            const container = document.getElementById("gameContainer");
            const passThreshold = 2;

            let summaryHTML = "";
            
            if (lessonScore === 3) {
                playCompletionSound();
                summaryHTML = `
                    <div class="feedback correct" style="font-size: 1.3em; text-align: center;">
                        <h2>מַדְהִים, ${userName}! 🏆</h2>
                        <p>עָנִיתָ נָכוֹן עַל כָּל הַשְּׁאֵלוֹת!</p>
                        <p style="font-size: 1.4em; margin: 20px 0;">
                            🌟 אַתָּה שׁוֹלֵט! אַתָּה חַי בְּאַהֲבַת ה'! 🎉
                        </p>
                    </div>
                `;
            } else if (lessonScore >= passThreshold) {
                playCompletionSound();
                summaryHTML = `
                    <div class="feedback correct" style="text-align: center;">
                        <h2>כִּמְעַט מֻשְׁלָם, ${userName}! 💪</h2>
                        <p>עָנִיתָ נָכוֹן עַל ${lessonScore} מִתּוֹךְ 3 שְׁאֵלוֹת!</p>
                        <p style="font-size: 1.2em; margin: 15px 0;">
                            🌱 מַמָּשׁ כְּמוֹ בָּאַהֲבָה – מַמְשִׁיךְ לִצְמֹחַ! 🌱
                        </p>
                    </div>
                `;
            } else {
                summaryHTML = `
                    <div class="feedback incorrect" style="text-align: center;">
                        <h2>בּוֹא נְנַסֶּה שׁוּב, ${userName}! 💖</h2>
                        <p>עָנִיתָ נָכוֹן עַל ${lessonScore} מִתּוֹךְ 3 שְׁאֵלוֹת.</p>
                        <p style="font-size: 1.2em; margin: 15px 0;">
                            💡 בְּאַהֲבָה וּבְסַבְלָנוּת נַצְלִיחַ! הַשֵּׁם אִתְּךָ! 💡
                        </p>
                        <button class="btn-primary" onclick="renderLesson(${currentLesson})">
                            בּוֹא נְנַסֶּה שׁוּב 🔄
                        </button>
                    </div>
                `;
            }

            container.innerHTML += summaryHTML;

            if (lessonScore >= passThreshold) {
                if (currentLesson < lessons.length - 1) {
                    container.innerHTML += `
                        <button class="btn-primary pulse" onclick="nextLesson()">
                            לַשִּׁיעוּר הַבָּא! 🚀
                        </button>
                    `;
                } else {
                    setTimeout(showCertificate, 2000);
                }
            }
        }

        function nextLesson() {
            currentLesson++;
            renderLesson(currentLesson);
        }

        function showCertificate() {
            playCompletionSound();
            
            const percentage = Math.round((score / 12) * 100);
            let grade = "";
            
            if (percentage >= 90) grade = "מְעֻלֶּה! 🌟";
            else if (percentage >= 80) grade = "טוֹב מְאֹד! ⭐";
            else if (percentage >= 70) grade = "טוֹב! 💫";
            else grade = "יָפֶה! ✨";

            document.getElementById("gameContainer").innerHTML = `
                <div class="certificate">
                    <h2>תְּעוּדַת הִצְטַיְּנוּת 🎓</h2>
                    <div class="name">${userName}</div>
                    <p style="font-size: 1.4em; margin: 20px 0;">
                        סִיַּמְתָּ אֶת הַמִּשְׂחָק<br>
                        <strong>"כִּי אִשְּׁרוּנִי בָנוֹת"</strong>
                    </p>
                    <p style="font-size: 1.5em; color: #e91e63; font-weight: bold;">
                        נִקּוּד: ${score} מִתּוֹךְ 12 (${percentage}%)
                    </p>
                    <p style="font-size: 1.6em; margin: 20px 0;">
                        ${grade}
                    </p>
                    <div class="verse">
                        "זְבָדַנִי אֱלֹהִים אֹתִי זֶבֶד טוֹב"<br>
                        (בְּרֵאשִׁית ל', כ')
                    </div>
                    <p style="font-size: 1.2em; margin-top: 20px; line-height: 2;">
                        💖 כָּל יֶלֶד וְיַלְדָּה הֵם מַתָּנָה יְקָרָה מֵהַה'!<br>
                        תָּמִיד נִזְכֹּר לְהוֹדוֹת וּלְשַׂמֵּחַ! 🌈
                    </p>
                </div>

                <div class="reflection-questions">
                    <h3>שְׁאֵלוֹת לְמַחְשָׁבָה 💭</h3>
                    <p>🌟 אֵיךְ אוּכַל לְהָבִיא יוֹתֵר אַהֲבַת ה' לַלִּמּוּד הַבָּא שֶׁלִּי?</p>
                    <p>💝 אֵיזוֹ מִצְוָה אֲנִי רוֹצֶה לְקַיֵּם הַיּוֹם מִתּוֹךְ שִׂמְחָה?</p>
                    <p>🎁 כֵּיצַד אֲנִי יָכוֹל לְשַׂמֵּחַ אֲחֵרִים בְּמַתָּנוֹת שֶׁה' נוֹתֵן לָהֶם?</p>
                </div>

                ${percentage >= 70 ? `
                    <div style="text-align: center; margin: 30px 0; padding: 25px; background: linear-gradient(135deg, #ffeaa7 0%, #fdcb6e 100%); border-radius: 15px;">
                        <p style="font-size: 1.4em; margin-bottom: 15px;">🎉 <strong>מַזָּל טוֹב, ${userName}!</strong> 🎉</p>
                        <p style="font-size: 1.2em; margin-bottom: 15px;">נִכְנַסְתָּ לְהַגְרָלָה נוֹשֵׂאת פְּרָסִים! 🎁</p>
                        <a href="https://forms.gle/A66uubei4XSX6SG2A" target="_blank" class="lottery-link">
                            📋 לְרִישׁוּם לַחֲצוּ כָּאן
                        </a>
                    </div>
                ` : ""}

                <div class="contact-info">
                    <p><strong>נִבְנָה בְּאַהֲבָה עַל יְדֵי:</strong></p>
                    <p>הָרַב יְהוּדָה טָאוּב מִקִּרְיַת אַתָּא</p>
                    <p>📞 לִפְרָטִים: 0527139520</p>
                </div>
            `;

            // שִׁלּוּחַ אוֹטוֹמָטִי שֶׁל הַנְּתוּנִים
            sendScoreToTeacher();
        }

        // הַתְחָלָה
        renderIntro();
    </script>
</body>
</html>
