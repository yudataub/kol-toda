            let questionsHtml = '';
            
            lesson.questions.forEach((q, index) => {
                const shuffledAnswers = shuffleArray([...q.answers]);
                let answersHtml = '';
                shuffledAnswers.forEach(answer => {
                    // הערה: שימוש בגרש בודד (') עבור onclick מאפשר העברת ערך בוליאני (true/false) ישירות לפונקציה.
                    answersHtml += `<button class="answer-btn" onclick='checkAnswer(this, ${answer.isCorrect}, ${lessonIndex}, ${index})'>${answer.text}</button>`;
                });

                questionsHtml += `
                    <div class="question-card">
                        <h2>שאלה ${index + 1} מתוך ${lesson.questions.length}</h2>

                        <div id="answers-${lessonIndex}-${index}">${answersHtml}</div>

            const nextButtonText = (lessonIndex === gameData.length - 1) ? "לסיום ולתעודה!" : "לשיעור הבא!";

            gameContainer.innerHTML = `

        // פונקציית עזר לערבוב מערכים (אלגוריתם פישר-ייטס)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // בדיקת תשובה ומתן משוב
        function checkAnswer(button, isCorrect, lessonIndex, questionIndex) {
            const answerContainer = document.getElementById(`answers-${lessonIndex}-${questionIndex}`);
            const allButtons = answerContainer.getElementsByTagName('button');
            const explanationElement = document.getElementById(`explanation-${lessonIndex}-${questionIndex}`);
            
            for (let btn of allButtons) {
                btn.disabled = true;
            }

            if (isCorrect) {
                button.classList.add('correct');
                explanationElement.classList.add('correct');
                score += 10;
                playSound(true);
            } else {
                button.classList.add('incorrect');
                explanationElement.classList.add('incorrect');
                for (let btn of allButtons) {
                     const originalAnswer = gameData[lessonIndex].questions[questionIndex].answers.find(a => a.text === btn.innerText);
                     if (originalAnswer && originalAnswer.isCorrect) {
                         btn.classList.add('correct');
                     }
                }
                playSound(false);
            }
            
            explanationElement.style.display = 'block';

            const answeredInThisLesson = Array.from(gameContainer.querySelectorAll('.question-card .explanation'))

            if (answeredInThisLesson === gameData[currentLesson].questions.length) {
                document.getElementById('nextLessonBtn').style.display = 'block';
            }
        }

        // נגינת צליל באמצעות Web Audio API
        function playSound(isCorrect) {
            if (!audioContext) return;
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            
            if (isCorrect) {
                const notes = [261.63, 329.63, 392.00]; // C4, E4, G4
                let startTime = audioContext.currentTime;
                notes.forEach(note => {
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);

                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(note, startTime);
                    gainNode.gain.setValueAtTime(0.3, startTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + 0.2);

                    oscillator.start(startTime);
                    oscillator.stop(startTime + 0.2);
                    startTime += 0.1;
                });
            }
        }
