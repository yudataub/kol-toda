        function playTone(frequency, duration, delay = 0) {
            setTimeout(() => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = frequency;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + duration);
            }, delay);
        }

        function shuffle(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function renderQuestion() {
            const lesson = lessons[currentLesson];
            const question = lesson.questions[currentQuestion];
            const container = document.getElementById('gameContainer');
            
            const shuffledAnswers = shuffle(question.answers.map((ans, idx) => ({text: ans, originalIndex: idx})));
            
            const progress = ((currentLesson) / lessons.length) * 100;
            
            container.innerHTML = `
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${progress}%">
                        שִׁיעוּר ${currentLesson + 1} מִתּוֹךְ ${lessons.length}
                    </div>
                </div>
                <div class="score-display">נִקּוּד כּוֹלֵל: ${totalScore} נְקֻדּוֹת 🏆</div>
                <h2>${lesson.title}</h2>
                <div class="question-container">
                    <div class="question-text">
                        שְׁאֵלָה ${currentQuestion + 1} מִתּוֹךְ ${lesson.questions.length}:<br>

                    <div class="answers-grid" id="answersGrid">

        function checkAnswer(correctIndex, selectedIndex) {
            const lesson = lessons[currentLesson];
            const question = lesson.questions[currentQuestion];
            const answersGrid = document.getElementById('answersGrid');
            const allButtons = answersGrid.querySelectorAll('.answer-btn');
            
            allButtons.forEach(btn => btn.disabled = true);
            
            const selectedButton = document.getElementById(`answer-${selectedIndex}`);
            const feedbackDiv = document.getElementById('feedback');
            
            const isCorrect = correctIndex === question.correct;
            
            if (isCorrect) {
                selectedButton.classList.add('correct');
                lessonScore++;
                totalScore += 10;
                playCorrectSound();
                
                const randomEncouragement = encouragements[Math.floor(Math.random() * encouragements.length)];
                const randomLoveMessage = loveMessages[Math.floor(Math.random() * loveMessages.length)];
                
                feedbackDiv.innerHTML = `
                    <div class="feedback correct">
                        <strong>${randomEncouragement}</strong><br>
                        ${question.explanation}<br>
                        <strong>${randomLoveMessage}</strong>
                    </div>
                    <button class="btn btn-continue" onclick="continueToNext()">הַמְשֵׁךְ ➡️</button>

                selectedButton.classList.add('incorrect');
                
                feedbackDiv.innerHTML = `

                        <strong>גַּם כְּשֶׁטּוֹעִים - לוֹמְדִים! הַשֵּׁם אוֹהֵב אוֹתְךָ! 💡✨</strong>

            answeredQuestions++;

                renderQuestion();

                showLessonResult();

                <div class="feedback ${resultClass}">
                    <p style="font-size: 1.5em;"><strong>${resultMessage}</strong></p>
                    <p>עָנִיתָ נָכוֹן עַל ${lessonScore} מִתּוֹךְ ${lesson.questions.length} שְׁאֵלוֹת!</p>
                    <p>נִקּוּד כּוֹלֵל: ${totalScore} נְקֻדּוֹת 🏆</p>
                </div>
                ${passed && currentLesson < lessons.length - 1 ? `
                    <button class="btn" onclick="startLesson(${currentLesson + 1})">מַמְשִׁיכִים לַשִּׁיעוּר הַבָּא! 🚀</button>
                ` : passed && currentLesson === lessons.length - 1 ? `
                    <button class="btn" onclick="showFinalCertificate()">לִתְעוּדַת הַהִצְטַיְּנוּת! 🎓✨</button>
                ` : `
                    <button class="btn" onclick="startLesson(${currentLesson})">נְנַסֶּה שׁוּב 🔄💪</button>
                `}
            `;
        }

        // פונקציה לשליחת ציון למורה
        async function sendScoreToTeacher() {
            const now = new Date();
            const data = {
                name: userName,
                score: `${totalScore}/120`,
                percentage: `${Math.round((totalScore/120)*100)}%`,
                gameName: document.title,
                date: now.toLocaleDateString('he-IL'),
                time: now.toLocaleTimeString('he-IL')
            };
            
            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain'
                    },
                    body: JSON.stringify(data)
                });
                console.log('✅ הַנְּתוּנִים נִשְׁלְחוּ בְּהַצְלָחָה!');
            } catch (error) {
                console.error('❌ שְׁגִיאָה בְּשִׁלּוּחַ:', error);
            }
        }

        function showFinalCertificate() {
            const container = document.getElementById('gameContainer');
            playCompleteSound();
            
            // שליחת הציון אוטומטית
            sendScoreToTeacher();
            
            const percentage = Math.round((totalScore/120)*100);
            
            container.innerHTML = `
                <div class="certificate">
                    <h2>🏆 תְּעוּדַת הִצְטַיְּנוּת 🏆</h2>
                    <p style="font-size: 1.8em;">מַזָּל טוֹב ${userName}! 🎉</p>
                    <p>סִיַּמְתָּ בְּהַצְלָחָה אֶת מִשְׂחַק הַלְּמִידָה</p>
                    <p style="font-size: 1.5em;"><strong>עֲקֵדַת יִצְחָק</strong></p>
                    <p>נִקּוּד סוֹפִי: <strong>${totalScore}/120 נְקֻדּוֹת (${percentage}%)!</strong> 🏆</p>
                    <p style="margin-top: 20px; font-size: 1.3em; font-style: italic;">
                        "וְאָהַבְתָּ אֵת ה' אֱלֹקֶיךָ<br>
                        בְּכָל לְבָבְךָ וּבְכָל נַפְשְׁךָ וּבְכָל מְאֹדֶךָ"
                    </p>
                    <p style="margin-top: 15px;">💖🌟✨</p>
                </div>
                
                <div class="reflection-questions">
                    <h3>שְׁאֵלוֹת לְמַחְשָׁבָה 💭</h3>
                    <p>🌟 אֵיךְ אֲנִי יָכוֹל לְהָבִיא יוֹתֵר אַהֲבַת ה' לַלִּמּוּד הַבָּא שֶׁלִּי?</p>
                    <p>💫 אֵיזוֹ מִצְוָה אֲנִי רוֹצֶה לְקַיֵּם הַיּוֹם מִתּוֹךְ שִׂמְחָה?</p>
                    <p>✨ מָתַי אֲנִי יָכוֹל לְבַטֵּל אֶת רְצוֹנִי וְלַעֲשׂוֹת רְצוֹן הַשֵּׁם בְּאַהֲבָה?</p>
                </div>
                
                <div style="text-align: center; margin: 30px 0;">
                    <p style="font-size: 1.4em; margin-bottom: 20px;">
                        <strong>כָּל הַכָּבוֹד ${userName}! 💖 זָכִיתָ לְסַיֵּם אֶת הַמַּסָּע בְּאַהֲבַת ה'!</strong>
                    </p>
                    <a href="https://forms.gle/A66uubei4XSX6SG2A" target="_blank" class="raffle-link">
                        🎁 לְהַגְרָלָה נוֹשֵׂאת פְּרָסִים! 🎁
                    </a>
                    <p style="font-size: 1.1em; margin-top: 15px; color: #666;">
                        (הַצִּיּוּן שֶׁלְּךָ נִשְׁלַח אוֹטוֹמָטִית לַמּוֹרֶה! ✅)
                    </p>
                </div>
                
                <div class="contact-info">
                    <p><strong>נִבְנָה בְּאַהֲבָה עַל יְדֵי:</strong></p>
                    <p>הָרַב יְהוּדָה טָאוּב מִקִּרְיַת אַתָּא</p>
                    <p>📞 לִפְרָטִים: 0527139520</p>
                </div>
            `;
        }

        // אתחול המשחק
        renderIntro();
    </script>
