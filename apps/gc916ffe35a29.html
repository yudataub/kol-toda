    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Heebo', sans-serif;
      background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 50%, #16213e 100%);

      padding: 40px 20px;
      color: #fff;
    }

    h1.page-title {
      text-align: center;
      font-size: 2.2rem;
      font-weight: 900;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #a29bfe, #fd79a8, #fdcb6e);

      -webkit-text-fill-color: transparent;

    }

    p.page-sub {
      text-align: center;
      color: #7a7aaa;
      margin-bottom: 36px;
      font-size: 1rem;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 18px;
      max-width: 1600px;
      margin: 0 auto;
    }

    @media (max-width: 1400px) { .cards-grid { grid-template-columns: repeat(4, 1fr); } }
    @media (max-width: 1000px) { .cards-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 700px)  { .cards-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 440px)  { .cards-grid { grid-template-columns: 1fr; } }

    .card {
      background: linear-gradient(145deg, #12122a, #0a0a1e);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.07);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
    }

    .card:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 16px 48px rgba(0,0,0,0.7);
      border-color: rgba(162,155,254,0.4);
    }

    .card-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
      z-index: 2;
    }

    .card-img-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

      font-size: 4rem;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.6));
      transition: transform 0.3s ease;
      z-index: 1;
    }
    .card:hover .emoji-bg { transform: scale(1.15) rotate(5deg); }

    .card-img-wrap .gradient-overlay {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 40%;
      background: linear-gradient(to top, rgba(10,10,30,0.97), transparent);
    }

    .card:nth-child(2)  .card-img-wrap { background: linear-gradient(135deg, #2a1a3a, #160a22); }
    .card:nth-child(3)  .card-img-wrap { background: linear-gradient(135deg, #1a2a4a, #0a1428); }
    .card:nth-child(4)  .card-img-wrap { background: linear-gradient(135deg, #3a2a1a, #20140a); }
    .card:nth-child(5)  .card-img-wrap { background: linear-gradient(135deg, #1a3a2a, #0a2018); }
    .card:nth-child(6)  .card-img-wrap { background: linear-gradient(135deg, #4a1a1a, #280a0a); }
    .card:nth-child(7)  .card-img-wrap { background: linear-gradient(135deg, #2a1a4a, #120a28); }
    .card:nth-child(8)  .card-img-wrap { background: linear-gradient(135deg, #1a3a4a, #081e2a); }
    .card:nth-child(9)  .card-img-wrap { background: linear-gradient(135deg, #3a3a1a, #20200a); }
    .card:nth-child(10) .card-img-wrap { background: linear-gradient(135deg, #4a2a1a, #281408); }
    .card:nth-child(11) .card-img-wrap { background: linear-gradient(135deg, #1a4a3a, #0a2820); }
    .card:nth-child(12) .card-img-wrap { background: linear-gradient(135deg, #2a2a4a, #12122a); }

    .card-body {
      padding: 14px 14px 10px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card-tag {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #a29bfe;
    }

    .card-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: #e8e8ff;
      line-height: 1.35;
    }

    .card-desc-short {
      font-size: 0.75rem;
      color: #6a6a9a;
      line-height: 1.5;
    }

    .card-desc-full {
      display: none;
      font-size: 0.75rem;
      color: #b0b0d8;
      line-height: 1.6;
      margin-top: 4px;
      border-top: 1px solid rgba(162,155,254,0.15);
      padding-top: 8px;
    }

    .card-footer {
      padding: 0 14px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-time {
      font-size: 0.68rem;
      color: #5a5a8a;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-read-more {
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      color: #fff;
      border: none;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Heebo', sans-serif;
      transition: opacity 0.2s, transform 0.2s;
      white-space: nowrap;
    }
    .btn-read-more:hover { opacity: 0.85; transform: scale(1.05); }

    .card.expanded .card-desc-full { display: block; }
    .card.expanded .card-img-wrap { aspect-ratio: unset; min-height: 80px; }

    .pasuk {
      background: rgba(162,155,254,0.08);
      border-right: 3px solid #a29bfe;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.76rem;
      color: #ccc8ff;
      font-style: italic;
      line-height: 1.6;
      margin-top: 8px;
    }

    .lesson-box {
      background: rgba(253,203,110,0.08);
      border: 1px solid rgba(253,203,110,0.22);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.72rem;
      color: #f0d898;
      line-height: 1.6;
      margin-top: 8px;

      color: #55efc4;
      display: block;
      margin-bottom: 3px;
    }

        time: "07:35–08:08",
        pasuk: "\"גַּם כִּי אֵלֵךְ בְּגֵיא צַלְמָוֶת לֹא אִירָא רָע כִּי אַתָּה עִמָּדִי\" (תהילים כג, ד)"
      },
      {
        emoji: "🏕️",
        badge: "הלכה",
        tag: "ה' במחנה ישראל",
        title: "כי ה' אלוהיך מתהלך בקרב מחניך",
        shortDesc: "ה' נמצא בתוך מחנה ישראל – ולכן יש קדושה במחנה ואמונה בלב הלוחמים.",
        fullDesc: `המורה מצטט פסוק מדברים כג:\n"כִּי ה' אֱלֹהֶיךָ מִתְהַלֵּךְ בְּקֶרֶב מַחֲנֶךָ"\n\nה' נמצא פיזית ורוחנית בתוך מחנה ישראל.\nלכן:\n✅ יש קדושה במחנה ישראל\n✅ מחנה ישראל מלא באמונה\n✅ הלוחמים יודעים: אנחנו לא לבד\n\nזו הסיבה שמשה מזכיר את מעשה המרגלים עכשיו – כדי לחזק בלב הדור החדש את תחושת ה' ההולך עמם.`,
        time: "08:17–08:45",
        pasuk: "\"כִּי ה' אֱלֹהֶיךָ מִתְהַלֵּךְ בְּקֶרֶב מַחֲנֶךָ\" (דברים כג, טו)"
      },
      {
        emoji: "🌟",

        shortDesc: "הדור החדש נכנס לארץ – עליו לזכור: ה' הולך לפניהם. זה נכון גם לכל יהודי בכל דור.",
        fullDesc: `שאלה: למה משה מזכיר את מעשה המרגלים עכשיו?\n\nתשובה: בני ישראל עומדים שוב לפני אותו אתגר – כניסה לארץ עם ערים בצורות ועמים חזקים.\nהם חייבים ללמוד מהטעות של הדור הקודם:\n\n❌ אז: ראו עם עיניים של פחד → לא נכנסו\n✅ עכשיו: לראות עם לב של אמונה → ה' הולך לפנינו\n\n📌 גם היום:\n"כמו שמשה אומר את הדבר הזה על עם ישראל – דוד המלך אומר את הדבר הזה על כל יהודי שנמצא בצרה ומרגיש לבד."\n\nהמסר לכל הדורות: בכל קושי – ראה שה' הולך לפניך.`,
        time: "07:14–09:20",
        lesson: "לשיעור הבא: מעשה המאפילים – בני ישראל שניסו לעלות לארץ ישראל בכוח עצמם, ללא רשות ה'."
      }
    ];

    const grid = document.getElementById('cardsGrid');

    cards.forEach((c) => {
      const card = document.createElement('div');
      card.className = 'card';

      const pasukHTML   = c.pasuk
        ? `<div class="pasuk">${c.pasuk}</div>` : '';
      const lessonHTML  = c.lesson
        ? `<div class="lesson-box"><strong>💡 מסר / לקח</strong>${c.lesson}</div>` : '';
      const connectHTML = c.connect
        ? `<div class="connect-box"><strong>🔗 קישור</strong>${c.connect}</div>` : '';

      card.innerHTML = `
        <span class="card-badge">${c.badge}</span>
        <div class="card-img-wrap">
          <span class="emoji-bg">${c.emoji}</span>
          <div class="gradient-overlay"></div>
        </div>
        <div class="card-body">
          <span class="card-tag">${c.tag}</span>
          <div class="card-title">${c.title}</div>
          <div class="card-desc-short">${c.shortDesc}</div>
          <div class="card-desc-full">${c.fullDesc.replace(/\n/g,'<br/>')}${pasukHTML}${lessonHTML}${connectHTML}</div>
        </div>
        <div class="card-footer">
          <span class="card-time">${c.time}</span>
          <button class="btn-read-more" onclick="toggleCard(this)">קרא עוד ▾</button>
        </div>
      `;
      grid.appendChild(card);
    });

    function toggleCard(btn) {
      const card = btn.closest('.card');
      const isExpanded = card.classList.toggle('expanded');
      btn.textContent = isExpanded ? 'סגור ▴' : 'קרא עוד ▾';
    }
  </script>
</body>
</html>
