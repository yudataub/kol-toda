        // Initialize audio context on first user interaction

            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        
        // Play sound effects
        function playSound(frequencies, durations) {
            initAudio();
            if (!audioContext) return;
            
            let startTime = audioContext.currentTime;
            frequencies.forEach((freq, i) => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = freq;
                oscillator.type = "sine";
                
                gainNode.gain.setValueAtTime(0.3, startTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + durations[i]);
                
                oscillator.start(startTime);
                oscillator.stop(startTime + durations[i]);
                
                startTime += durations[i] * 0.8;
            });
        }

            const shuffled = [...arr];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];

                summaryHTML += `</div>`;
                
                if (currentLesson < lessons.length - 1) {
                    summaryHTML += `<button class="btn-primary" onclick="nextLesson()">לַשִּׁיעוּר הַבָּא! ➡️</button>`;
                } else {
                    summaryHTML += `<button class="btn-primary" onclick="showCertificate()">לַתְּעוּדָה! 🎓</button>`;
                }
            } else {
                summaryHTML += `
                    <p style="font-size: 2em;">💪🤗💪</p>
                    <p style="font-size: 1.4em; color: #f57c00; font-weight: 700;">בּוֹא נְנַסֶּה שׁוּב, ${userName}!</p>
                    <p style="font-size: 1.2em;">עָנִיתָ נָכוֹן עַל ${lessonScore} מִתּוֹךְ 3 שְׁאֵלוֹת.</p>
                    <p>צָרִיךְ לְפָחוֹת 2 נְכוֹנוֹת כְּדֵי לְהַמְשִׁיךְ.</p>
                    <p style="margin-top: 15px;">בְּאַהֲבָה וּבְסַבְלָנוּת - תַּצְלִיחַ! 💖</p>
                    </div>
                    <button class="btn-primary" onclick="retryLesson()">לִנְסוֹת שׁוּב! 🔄</button>
                `;
            }
            
            document.getElementById("gameContent").innerHTML = summaryHTML;
        }
        
        // Retry lesson
        function retryLesson() {
            score -= lessonScore; // Remove points from failed attempt
            startQuestions();
        }
        
        // Next lesson
        function nextLesson() {
            currentLesson++;
            currentQuestion = 0;
            lessonScore = 0;
            answeredQuestions = [];
            renderLesson();
        }
        
        // Show certificate
        function showCertificate() {
            playVictorySound();
            
            const percentage = Math.round((score / totalQuestions) * 100);
            let gradeText = "";
            let gradeEmoji = "";
            
            if (percentage >= 90) {
                gradeText = "מְצֻיָּן!";
                gradeEmoji = "🏆🌟🏆";
            } else if (percentage >= 75) {
                gradeText = "טוֹב מְאוֹד!";
                gradeEmoji = "⭐💪⭐";
            } else {
                gradeText = "כָּל הַכָּבוֹד!";
                gradeEmoji = "💪🌟💪";
            }
            
            document.getElementById("gameContent").innerHTML = `
                <div class="certificate">
                    <p style="font-size: 2.5em;">${gradeEmoji}</p>
                    <h2>תְּעוּדַת הִצְטַיְּנוּת</h2>
                    <p style="font-size: 1.2em;">מוּעֶנֶקֶת בְּזֹאת לְ:</p>
                    <p class="student-name">🌟 ${userName} 🌟</p>
                    <p class="score-final">${gradeText} ${score}/${totalQuestions} (${percentage}%)</p>
                    <div class="verse">
                        ״וְאָהַבְתָּ אֵת ה׳ אֱלֹקֶיךָ בְּכָל לְבָבְךָ וּבְכָל נַפְשְׁךָ וּבְכָל מְאֹדֶךָ״ 💖
                    </div>
                    <p>סִיַּמְתָּ בְּהַצְלָחָה אֶת הַמִּשְׂחָק עַל<br><strong>טוּ בִּשְׁבָט וְאַהֲבַת אֶרֶץ יִשְׂרָאֵל!</strong></p>
                </div>
                
                <div class="thinking-questions">
                    <h3>💭 שְׁאֵלוֹת לְמַחֲשָׁבָה:</h3>
                    <ul>
                        <li>🌳 אֵיךְ אוּכַל לְהָבִיא יוֹתֵר אַהֲבַת ה׳ לַלִּימוּד הַבָּא שֶׁלִּי?</li>
                        <li>🇮🇱 מָה אֲנִי יָכוֹל לַעֲשׂוֹת כְּדֵי לְחַזֵּק אֶת הַקֶּשֶׁר שֶׁלִּי לְאֶרֶץ יִשְׂרָאֵל?</li>
                        <li>💖 אֵיזוֹ מִצְוָה אֲנִי רוֹצֶה לְקַיֵּם הַיּוֹם מִתּוֹךְ שִׂמְחָה וְאַהֲבָה?</li>
                    </ul>
                </div>
                
                <div class="raffle-section">
                    <p style="font-size: 1.4em; font-weight: 700;">🎉 מַזָּל טוֹב, ${userName}!</p>
                    <p style="font-size: 1.2em;">נִכְנַסְתָּ לְהַגְרָלָה נוֹשֵׂאת פְּרָסִים! 🎁</p>
                    <p style="margin-top: 15px;">📋 לְרִישׁוּם לַחֲצוּ כָּאן:</p>
                    <a href="https://forms.gle/A66uubei4XSX6SG2A" target="_blank">לְחִיצָה לְהַגְרָלָה! 🎯</a>
                </div>
                
                <div class="contact-info">
                    נִבְנָה בְּאַהֲבָה עַל יְדֵי:<br>
                    <strong>הָרַב יְהוּדָה טָאוּב מִקִּרְיַת אַתָּא</strong><br>
                    📞 לִפְרָטִים: 0527139520
                </div>
                
                <button class="btn-primary" onclick="renderIntro()">לְשַׂחֵק שׁוּב! 🔄</button>
            `;
            
            // Send score to teacher
            sendScoreToTeacher();
        }
        
        // Send score to Google Sheets
        async function sendScoreToTeacher() {
            const now = new Date();
            const data = {
                name: userName,
                score: `${score}/${totalQuestions}`,
                percentage: `${Math.round((score / totalQuestions) * 100)}%`,
                gameName: document.title || "טו בשבט ואהבת ארץ ישראל",
                date: now.toLocaleDateString("he-IL"),
                time: now.toLocaleTimeString("he-IL")
            };
            
            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify(data)
                });
                console.log("✅ הַנְּתוּנִים נִשְׁלְחוּ בְּהַצְלָחָה!");
            } catch (error) {
                console.error("❌ שְׁגִיאָה בְּשִׁלּוּחַ:", error);
            }
        }
        
        // Initialize game
        renderIntro();
    </script>
</body>
</html>
