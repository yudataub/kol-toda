<body>

    <script>
        // הגדרות
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby-wgLUmHzqneFw1r4S_pdkcc398yoLMlJfu3CJUvbcZTMI8QZMkGB_42Evl7L0BJxF/exec";
        let audioContext = null;
        let userName = "";
        let currentLesson = -1;
        let score = 0;
        let lessonScore = 0;
        const totalQuestions = 12;

        // פונקציה לאתחול אודיו (רק אחרי אינטראקציה)
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // פונקציה לניגון צליל
        function playSound(frequencies, durations) {
            initAudio();
            let startTime = audioContext.currentTime;
            
            frequencies.forEach((freq, index) => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = freq;
                oscillator.type = "sine";
                
                gainNode.gain.setValueAtTime(0.3, startTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + durations[index]);
                
                oscillator.start(startTime);
                oscillator.stop(startTime + durations[index]);
                
                startTime += durations[index];
            });
        }

        // צלילי הצלחה
        function playCorrectSound() {
            playSound([523.25, 659.25, 783.99], [0.15, 0.15, 0.3]);
        }

        function playFinishSound() {
            playSound([523.25, 659.25, 783.99, 1046.50, 783.99, 659.25], [0.15, 0.15, 0.15, 0.2, 0.15, 0.3]);
        }

        // ערבוב מערך
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // שליחת ציון למורה
        async function sendScoreToTeacher() {
            const now = new Date();
            const data = {
                name: userName,
                score: `${score}/${totalQuestions}`,
                percentage: `${Math.round((score/totalQuestions)*100)}%`,
                gameName: document.title,
                date: now.toLocaleDateString("he-IL"),
                time: now.toLocaleTimeString("he-IL")
            };
            
            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: "POST",
                    headers: {"Content-Type": "text/plain"},
                    body: JSON.stringify(data)
                });
                console.log("✅ הַנְּתוּנִים נִשְׁלְחוּ בְּהַצְלָחָה!");
            } catch (error) {
                console.error("❌ שְׁגִיאָה בַּשִּׁלּוּחַ:", error);
            }
        }

                        answers: [

                            "כִּי תִּינוֹקוֹת חֲכָמִים יוֹתֵר מִמְּבוּגָרִים בְּעִנְיַן הַלִּימוּד",
                            "כִּי כָּל הַתִּינוֹקוֹת בַּסּוֹף לוֹמְדִים לָלֶכֶת בְּלִי בְּעָיוֹת",
                            "כִּי הָאִמָּא תָּמִיד תּוֹפֶסֶת אוֹתָם לִפְנֵי שֶׁהֵם נוֹפְלִים"

                        correct: 0,
                        explanation: "יָפֶה מְאֹד! 🌟 בְּדִיּוּק כְּמוֹ תִּינוֹק שֶׁנּוֹפֵל וְהָאִמָּא מְחַיֶּכֶת - כָּךְ גַּם הַשֵּׁם! 💕 הוּא רוֹאֶה שֶׁאֲנַחְנוּ מְנַסִּים, וְזֶה מַה שֶּׁחָשׁוּב לוֹ! גַּם אִם נוֹפְלִים - עוֹד נִנְסֶה! 💪"

                    {

                        answers: [
                            "הַשֵּׁם אוֹהֵב אוֹתָנוּ גַּם כְּשֶׁטּוֹעִים, וְרוֹצֶה שֶׁנִּלְמַד וְנִנְסֶה שׁוּב",
                            "אָסוּר לִטְעוֹת בְּכָל מַצָּב כִּי זֶה גּוֹרֵם לְהַשֵּׁם עֶצֶב",
                            "הַטְּעוּיוֹת שֶׁלָּנוּ לֹא קְשׁוּרוֹת לַשֵּׁם אֶלָּא רַק לָנוּ",
                            "צָרִיךְ לִהְיוֹת מוּשְׁלָם תָּמִיד כְּדֵי שֶׁהַשֵּׁם יֶאֱהַב אוֹתָנוּ"
                        ],
                        correct: 0,
                        explanation: "נִפְלָא! 🏆 הַשֵּׁם אוֹהֵב אוֹתָנוּ תָּמִיד - גַּם כְּשֶׁמַּצְלִיחִים וְגַּם כְּשֶׁטּוֹעִים! 🌈 הוּא רוֹצֶה שֶׁנִּלְמַד מִן הַטָּעוּיוֹת וְנִנְסֶה שׁוּב, לֹא שֶׁנִּפֹּל לְעַצְבוּת! 💖✨"
                    }
                ]
            }
        ];

        // הצגת מבוא
        function renderIntro() {
            const container = document.getElementById("gameContainer");
            container.innerHTML = `
                <h1>🌟 הַשֵּׁם תָּמִיד לְיָדִי 💖</h1>
                <div class="intro-text">
                    <p>שָׁלוֹם יָקָר! 💫</p>
                    <p>הַיּוֹם נִלְמַד מַסָּע מְיֻחָד עַל <span class="highlight">אֵיךְ הַשֵּׁם תָּמִיד לְיָדֵנוּ</span> 🌈</p>
                    <p>נִלְמַד מִסִּפּוּר יוֹסֵף וְהַבּוֹר 🌟, מָה זֶה אוֹמֵר "לִפְנֵי מִי אֲנִי עוֹמֵד" 💭, וּמָה קוֹרֶה כְּשֶׁאֲנַחְנוּ טוֹעִים 💪</p>
                    <p class="highlight">זִכְרוּ: הַשֵּׁם אוֹהֵב אֶתְכֶם וְרוֹצֶה שֶׁתִּפְנוּ אֵלָיו בְּכָל רֶגַע! 💖</p>
                    <p>בַּמַּסָּע יֵשׁ 3 שִׁיעוּרִים, וּבְכָל שִׁיעוּר 4 שְׁאֵלוֹת ✨</p>
                    <p>בּוֹאוּ נַתְחִיל! 🚀</p>
                </div>
                <button class="btn" onclick="askNameAndStart()">בּוֹא נַתְחִיל! 🎯</button>
            `;
        }

        // שאלת שם והתחלה
        function askNameAndStart() {
            initAudio(); // אתחול אודיו אחרי אינטראקציה ראשונה
            userName = prompt("מַה שִּׁמְךָ, יָקָר? 💫");
            if (!userName || userName.trim() === "") {
                userName = "תַּלְמִיד יָקָר";
            }
            startGame();
        }

        // התחלת משחק
        function startGame() {
            currentLesson = 0;
            score = 0;
            renderLesson(0);
        }

        // הצגת שיעור
        function renderLesson(lessonIndex) {
            if (lessonIndex >= lessons.length) {
                showCertificate();
                return;
            }

            const lesson = lessons[lessonIndex];
            lessonScore = 0;
            const container = document.getElementById("gameContainer");
            
            const progress = Math.round(((lessonIndex) / lessons.length) * 100);
            
            container.innerHTML = `
                <h1>💖 ${userName} - שִׁיעוּר ${lessonIndex + 1} מִתּוֹךְ 3</h1>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${progress}%">${progress}%</div>
                </div>
                <h2>${lesson.title}</h2>
                <div class="lesson-content">
                    ${lesson.content}
                </div>
                <div class="reflection-box">
                    ${lesson.reflection}
                </div>
                <div id="questionsContainer"></div>
            `;

            renderQuestions(lessonIndex);
        }

        // הצגת שאלות
        function renderQuestions(lessonIndex) {
            const lesson = lessons[lessonIndex];
            const container = document.getElementById("questionsContainer");
            let questionsHTML = "";

            lesson.questions.forEach((q, qIndex) => {
                const shuffledAnswers = shuffleArray([...q.answers]);
                const correctAnswerText = q.answers[q.correct];
                const correctIndexInShuffled = shuffledAnswers.indexOf(correctAnswerText);

                questionsHTML += `
                    <div class="question-container" id="question-${qIndex}">
                        <div class="question-text">${q.question}</div>
                        <div class="answers">
                            ${shuffledAnswers.map((answer, aIndex) => `
                                <button class="answer-btn" onclick="checkAnswer(${lessonIndex}, ${qIndex}, ${aIndex}, ${correctIndexInShuffled}, '${answer.replace(/'/g, "\\'")}')">
                                    ${answer}
                                </button>
                            `).join("")}
                        </div>
                        <div id="feedback-${qIndex}"></div>
                    </div>
                `;
            });

            container.innerHTML = questionsHTML;
        }

        // בדיקת תשובה
        function checkAnswer(lessonIndex, questionIndex, selectedIndex, correctIndex, selectedText) {
            const lesson = lessons[lessonIndex];
            const question = lesson.questions[questionIndex];
            const feedbackDiv = document.getElementById(`feedback-${questionIndex}`);
            const questionDiv = document.getElementById(`question-${questionIndex}`);
            const buttons = questionDiv.querySelectorAll(".answer-btn");
            
            // נטרול כל הכפתורים
            buttons.forEach(btn => btn.disabled = true);

            const isCorrect = selectedIndex === correctIndex;
            
            const encouragements = [
                `מְצֻיָּן, ${userName}! ⭐`,
                `נִפְלָא, ${userName}! 💪`,
                `כָּל הַכָּבוֹד, ${userName}! 🎯`,
                `פְּצָצָה, ${userName}! 🌟`
            ];

            if (isCorrect) {
                score++;
                lessonScore++;
                playCorrectSound();
                
                const randomEncouragement = encouragements[Math.floor(Math.random() * encouragements.length)];
                
                feedbackDiv.className = "feedback correct";
                feedbackDiv.innerHTML = `
                    <p><strong>${randomEncouragement}</strong></p>
                    <p>${question.explanation}</p>
                    <p class="highlight">הַשֵּׁם שָׂמֵחַ כְּשֶׁאַתָּה לוֹמֵד בְּאַהֲבָה, ${userName}! 💖</p>
                `;
            } else {
                feedbackDiv.className = "feedback incorrect";
                feedbackDiv.innerHTML = `
                    <p><strong>לֹא בְּדִיּוּק, ${userName}... 🤔</strong></p>
                    <p>${question.explanation}</p>
                    <p class="highlight">גַּם כְּשֶׁטּוֹעִים - לוֹמְדִים! הַשֵּׁם אוֹהֵב אוֹתְךָ, ${userName}! 💡</p>
                `;
            }

            // בדיקה אם כל השאלות נענו
            const allAnswered = lesson.questions.every((_, idx) => {
                return document.getElementById(`feedback-${idx}`).innerHTML !== "";
            });

            if (allAnswered) {
                setTimeout(() => {
                    if (lessonScore >= 3) {
                        if (lessonScore === 4) {
                            playFinishSound();
                            showLessonCompletion(`מָדְהִים, ${userName}! 🏆 אַתָּה שׁוֹלֵט! אַתָּה חַי בְּאַהֲבַת הַשֵּׁם! 🎉`);
                        } else {
                            showLessonCompletion(`כִּמְעַט מוּשְׁלָם, ${userName}! 💪 מַמָּשׁ כְּמוֹ בְּאַהֲבָה - מַמְשִׁיךְ לִצְמֹחַ! 🌱`);
                        }
                    } else {
                        showLessonCompletion(`בּוֹא נְנַסֶּה שׁוּב, ${userName}, בְּאַהֲבָה וְסַבְלָנוּת 💖`);
                    }
                }, 2000);
            }
        }

        // השלמת שיעור
        function showLessonCompletion(message) {
            const container = document.getElementById("gameContainer");
            container.innerHTML += `
                <div class="certificate" style="margin-top: 30px;">
                    <h2>✨ סִיּוּם שִׁיעוּר ✨</h2>
                    <p style="font-size: 1.5em; margin: 20px 0;">${message}</p>
                    <p style="font-size: 1.3em;">צְבָרְתָּ: ${lessonScore} מִתּוֹךְ 4 נְקֻדּוֹת בַּשִּׁיעוּר! 🌟</p>
                    ${lessonScore >= 3 ? `
                        <button class="btn" onclick="nextLesson()">🚀 לַשִּׁיעוּר הַבָּא</button>
                    ` : `
                        <button class="btn" onclick="retryLesson()">🔄 נְנַסֶּה שׁוּב</button>
                    `}
                </div>
            `;
        }

        // שיעור הבא
        function nextLesson() {
            currentLesson++;
            renderLesson(currentLesson);
            window.scrollTo(0, 0);
        }

        // ניסיון חוזר
        function retryLesson() {
            lessonScore = 0;
            renderLesson(currentLesson);
            window.scrollTo(0, 0);
        }

        // תעודת סיום
        function showCertificate() {
            playFinishSound();
            
            // שליחה אוטומטית של הציון
            sendScoreToTeacher();

            const percentage = Math.round((score / totalQuestions) * 100);
            const container = document.getElementById("gameContainer");
            
            container.innerHTML = `
                <div class="certificate">
                    <h2>🏆 תְּעוּדַת הִצְטַיְּנוּת 🏆</h2>
                    <div class="name">💖 ${userName} 💖</div>
                    <div class="score">
                        <p>סִיַּמְתָּ אֶת הַמַּסָּע בְּהַצְלָחָה! 🌟</p>
                        <p><strong>הַצִּיּוּן שֶׁלְּךָ: ${score} מִתּוֹךְ ${totalQuestions} (${percentage}%)</strong></p>
                    </div>
                    <div class="verse">
                        <p>״וְאָהַבְתָּ אֵת ה' אֱלֹהֶיךָ בְּכָל לְבָבְךָ וּבְכָל נַפְשְׁךָ וּבְכָל מְאֹדֶךָ״</p>
                        <p style="font-size: 0.8em; margin-top: 10px;">(דברים ו', ה')</p>
                    </div>
                </div>

                <div class="reflection-questions">
                    <h3>🌟 שְׁאֵלוֹת לְמַחְשָׁבָה:</h3>
                    <ul>
                        <li>💭 אֵיךְ אוּכַל לִזְכֹּר לִפְנוֹת לַשֵּׁם גַּם בְּרְגָעִים קָשִׁים?</li>
                        <li>🙏 מָה אֲנִי יָכוֹל לַעֲשׂוֹת הַיּוֹם כְּדֵי לְהַרְגִּישׁ אֶת אַהֲבַת הַשֵּׁם?</li>
                        <li>💪 אֵיךְ אֲנִי יָכוֹל לְעוֹדֵד חָבֵר שֶׁטָּעָה שֶׁהַשֵּׁם עוֹד אוֹהֵב אוֹתוֹ?</li>
                    </ul>
                </div>

                ${score >= 9 ? `
                    <div style="text-align: center; margin: 30px 0;">
                        <h3 style="color: #e84393;">🎉 מַזָּל טוֹב, ${userName}! 🎉</h3>
                        <p style="font-size: 1.3em; margin: 15px 0;">נִכְנַסְתָּ לְהַגְרָלָה נוֹשֵׂאת פְּרָסִים! 🎁</p>
                        <a href="https://forms.gle/A66uubei4XSX6SG2A" target="_blank" class="lottery-link">
                            📋 לְחַץ כָּאן לְרִישׁוּם לְהַגְרָלָה! 🎯
                        </a>
                    </div>
                ` : ""}

                <div class="contact-info">
                    <p><strong>נִבְנָה בְּאַהֲבָה עַל יְדֵי:</strong></p>
                    <p>הָרַב יְהוּדָה טָאוּב מִקִּרְיַת אַתָּא</p>
                    <p>📞 לִפְרָטִים: 0527139520</p>
                    <p style="margin-top: 15px;">💖 הַשֵּׁם תָּמִיד לְיָדֵנוּ! 💖</p>
                </div>
            `;

            window.scrollTo(0, 0);
        }

        // התחלה
        renderIntro();
    </script>
