        function playSound(frequencies, durations) {
            let startTime = audioContext.currentTime;
            frequencies.forEach((freq, index) => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = freq;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.3, startTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + durations[index]);
                
                oscillator.start(startTime);
                oscillator.stop(startTime + durations[index]);
                
                startTime += durations[index];
            });
        }

            answeredQuestions++;
            
            if (isCorrect) {
                lessonScore++;
                totalScore += 10;
                button.classList.add('correct');
                playCorrectSound();
                
                const encouragements = [
                    "מְצֻיָּן! ⭐",
                    "נִפְלָא! 💪",
                    "כָּל הַכָּבוֹד! 🎯",
                    "מַמָּשׁ מְעֻלֶּה! 🌟",
                    "פַּצְצָה! 🎊"
                ];
                const randomEncouragement = encouragements[Math.floor(Math.random() * encouragements.length)];
                
                button.insertAdjacentHTML('afterend', `
                    <div class="feedback correct">
                        <strong>${randomEncouragement}</strong><br>
                        ${question.explanation}<br>
                        <em>${question.godLove}</em>
                    </div>
                `);
            } else {
                button.classList.add('wrong');
                playWrongSound();
                
                button.insertAdjacentHTML('afterend', `
                    <div class="feedback wrong">
                        <strong>לֹא בְּדִיּוּק... 🤔</strong><br>
                        ${question.explanation}<br>
                        <em>גַּם כְּשֶׁטּוֹעִים - לוֹמְדִים! הַשֵּׁם אוֹהֵב אוֹתְךָ! 💡</em>
                    </div>
                `);
            }
            
            setTimeout(() => {
                if (currentQuestion < lesson.questions.length - 1) {
                    currentQuestion++;
                    renderQuestion();
                } else {
                    showLessonSummary();
                }
            }, 3000);
        }

        function showLessonSummary() {
            const lesson = lessons[currentLesson];
            const container = document.getElementById('gameContainer');
            const percentage = (lessonScore / lesson.questions.length) * 100;
            const passed = percentage >= 66;
            
            let message = '';
            if (lessonScore === 3) {
                message = '<h2>מַדְהִים! 🏆</h2><p>אַתָּה שׁוֹלֵט! אַתָּה חַי בְּאַהֲבַת ה\'! 🎉</p>';
                playVictorySound();
            } else if (lessonScore === 2) {
                message = '<h2>כִּמְעַט מֻשְׁלָם! 💪</h2><p>מַמָּשׁ כְּמוֹ בָּאַהֲבָה - מַמְשִׁיךְ לִצְמֹחַ! 🌱</p>';
                playVictorySound();
            } else {
                message = '<h2>בּוֹא נְנַסֶּה שׁוּב! 💖</h2><p>בָּאַהֲבָה וּבְסַבְלָנוּת נַצְלִיחַ! 🌈</p>';
            }
            
            if (passed) {
                container.innerHTML = `
                    <h1>מִשְׂחַק הַהוֹדָיָה וְהַשֶּׁפַע 💖</h1>
                    ${updateProgress()}
                    <div class="score-display">נִקּוּד כּוֹלֵל: ${totalScore} 🌟</div>
                    <div class="certificate">
                        ${message}
                        <p class="certificate-text">עָנִיתָ נָכוֹן עַל ${lessonScore} מִתּוֹךְ ${lesson.questions.length} שְׁאֵלוֹת!</p>
                    </div>
                    ${currentLesson < lessons.length - 1 ? 
                        '<button class="next-btn" onclick="nextLesson()">לַשִּׁיעוּר הַבָּא! 🚀</button>' :
                        '<button class="next-btn" onclick="showFinalCertificate()">לַסִּיּוּם הַמִּשְׂחָק! 🎊</button>'
                    }
                `;
            } else {
                container.innerHTML = `
                    <h1>מִשְׂחַק הַהוֹדָיָה וְהַשֶּׁפַע 💖</h1>
                    ${updateProgress()}
                    <div class="score-display">נִקּוּד כּוֹלֵל: ${totalScore} 🌟</div>
                    <div class="certificate">
                        ${message}
                        <p class="certificate-text">נְנַסֶּה שׁוּב אֶת הַשִּׁיעוּר הַזֶּה! 💪</p>
                    </div>
                    <button class="next-btn" onclick="startQuiz()">נְנַסֶּה שׁוּב! 🔄</button>
                `;
            }
        }

        function nextLesson() {
            currentLesson++;
            currentQuestion = 0;
            lessonScore = 0;
            answeredQuestions = 0;
            renderLesson();
        }

        function showFinalCertificate() {
            const container = document.getElementById('gameContainer');
            playVictorySound();
            
            container.innerHTML = `
                <h1>סִיַּמְתָּ אֶת הַמִּשְׂחָק! 🎊</h1>
                <div class="certificate">
                    <h2>תְּעוּדַת הִצְטַיְּנוּת! 🏆</h2>
                    <p class="certificate-text">כָּל הַכָּבוֹד! 💖</p>
                    <p class="certificate-text">סִיַּמְתָּ בְּהַצְלָחָה אֶת מִשְׂחַק הַהוֹדָיָה וְהַשֶּׁפַע!</p>
                    <p class="certificate-text">נִקּוּד סוֹפִי: <strong>${totalScore} נְקֻדּוֹת! 🌟</strong></p>
                    <p class="certificate-text" style="font-size: 2em; margin: 20px 0;">💫 ❤️ 🙏 ✨</p>
                </div>
                
                <div class="final-quote">
                    <p><strong>"וְאָהַבְתָּ אֵת ה\' אֱלֹהֶיךָ בְּכָל לְבָבְךָ וּבְכָל נַפְשְׁךָ וּבְכָל מְאֹדֶךָ"</strong></p>
                    <p style="margin-top: 15px;">כָּל מִי שֶׁלָּמַד בְּאַהֲבָה - פָּתַח שַׁעַר בְּלִבּוֹ אֶל הַשֵּׁם! 💫</p>
                </div>
                
                <div class="reflection-questions">
                    <h3>שְׁאֵלוֹת לְמַחְשָׁבָה 💭</h3>
                    <ul>
                        <li>אֵיךְ אוּכַל לְהָבִיא יוֹתֵר אַהֲבַת ה\' לַלִּמּוּד הַבָּא שֶׁלִּי? 📚</li>
                        <li>אֵיזוֹ מִצְוָה אֲנִי רוֹצֶה לְקַיֵּם הַיּוֹם מִתּוֹךְ שִׂמְחָה? 🎯</li>
                        <li>עַל מָה אֲנִי רוֹצֶה לְהוֹדוֹת לַשֵּׁם עַכְשָׁיו? 🙏</li>
                    </ul>
                </div>
                
                <div style="text-align: center; margin: 30px 0;">
                    <p style="font-size: 1.3em; margin-bottom: 15px;"><strong>כָּל הַכָּבוֹד! 💖 זָכִיתָ לְסַיֵּם אֶת הַמַּסָּע בְּאַהֲבַת ה\'!</strong></p>
                    <p style="font-size: 1.2em; margin-bottom: 20px;">הִנֵּה תְּעוּדַת הַהִצְטַיְּנוּת שֶׁלְּךָ 🎓 – וְאַתָּה נִכְנָס לְהַגְרָלָה נוֹשֵׂאת פְּרָסִים!</p>
                    <a href="https://forms.gle/A66uubei4XSX6SG2A" target="_blank" class="raffle-link">
                        לַהַגְרָלָה וּפְרָסִים! 🎁
                    </a>
                </div>
                
                <div class="contact-info">
                    <p><strong>נִבְנָה בְּאַהֲבָה עַל יְדֵי:</strong></p>
                    <p>הָרַב יְהוּדָה טָאוּב מִקִּרְיַת אַתָּא</p>
                    <p>📞 לִפְרָטִים: 0527139520</p>
                    <p style="margin-top: 15px;">💖 הַשֵּׁם אוֹהֵב אוֹתְךָ תָּמִיד! 💖</p>

            `;
        }

        // Initialize the game
        renderIntro();
    </script>
