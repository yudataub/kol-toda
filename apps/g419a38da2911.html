        // פונקציה ליצירת AudioContext רק אחרי אינטראקציה ראשונה
        function ensureAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // פונקציה לניגון צליל
        function playSound(frequencies, duration = 0.15) {
            ensureAudioContext();
            
            frequencies.forEach((freq, index) => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = freq;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime + index * duration);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + index * duration + duration);
                
                oscillator.start(audioContext.currentTime + index * duration);
                oscillator.stop(audioContext.currentTime + index * duration + duration);
            });
        }

        // ערבוב מערך
        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

                gameName: document.title,

                time: now.toLocaleTimeString('he-IL')
            };
            
            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'text/plain'},
                    body: JSON.stringify(data)
                });
                console.log('✅ הַצִּיּוּן נִשְׁלַח לַמּוֹרֶה!');
            } catch (error) {

            if (lessonIndex >= lessons.length) {
                showCertificate();
                return;
            }

            currentLesson = lessonIndex;
            currentQuestionIndex = 0;
            lessonScore = 0;
            answeredQuestions = 0;

            const lesson = lessons[lessonIndex];

            container.innerHTML = `

        // הצגת שאלה
        function renderQuestion(questionIndex) {
            const lesson = lessons[currentLesson];
            const question = lesson.questions[questionIndex];
            const questionsContainer = document.getElementById('questionsContainer');

            const shuffledAnswers = shuffleArray(question.answers.map((answer, index) => ({
                text: answer,
                index: index
            })));

            let questionHTML = `
                <div class="question-container">
                    <div class="question-text">❓ ${question.question}</div>
            `;

            shuffledAnswers.forEach((answer) => {
                questionHTML += `
                    <button class="answer-btn" onclick="checkAnswer(${questionIndex}, ${answer.index})">
                        ${answer.text}
                    </button>
                `;
            });

            questionHTML += `
                    <div class="feedback" id="feedback-${questionIndex}"></div>
                </div>
            `;

            questionsContainer.innerHTML += questionHTML;
        }

        // בדיקת תשובה
        function checkAnswer(questionIndex, selectedAnswer) {
            const lesson = lessons[currentLesson];
            const question = lesson.questions[questionIndex];
            const feedbackDiv = document.getElementById(`feedback-${questionIndex}`);
            
            const buttons = document.querySelectorAll(`#questionsContainer .question-container:nth-child(${questionIndex + 1}) .answer-btn`);
            buttons.forEach(btn => btn.disabled = true);

            answeredQuestions++;
            
            if (selectedAnswer === question.correct) {
                score++;
                lessonScore++;
                updateScoreDisplay();
                
                const encouragements = [
                    `מְצֻיָּן, ${userName}! ⭐`,
                    `נִפְלָא, ${userName}! 💪`,

                    `פַּצָּצָה, ${userName}! 💖`

                const randomEncouragement = encouragements[Math.floor(Math.random() * encouragements.length)];
                
                feedbackDiv.className = 'feedback correct';
                feedbackDiv.style.display = 'block';
                feedbackDiv.innerHTML = `
                    <strong>${randomEncouragement}</strong><br>
                    ${question.explanation}<br>
                    <strong>הַשֵּׁם שָׂמֵחַ כְּשֶׁרוֹאֶה אֶת אַהֲבָתוֹ בְּלִבְּךָ, ${userName}! 💖</strong>

                playSound([523.25, 659.25, 783.99]); // C-E-G
            } else {

                `;
            }

            if (answeredQuestions === lesson.questions.length) {
                setTimeout(() => {
                    if (lessonScore >= 2) {
                        showLessonComplete();
                    } else {
                        showRetryLesson();
                    }
                }, 3000);
            } else {
                setTimeout(() => {
                    renderQuestion(questionIndex + 1);
                }, 2000);
            }
        }
