        * {

            margin: 0;
            padding: 0;
        }

        body {

            padding: 20px;
            direction: rtl;
            text-align: right;
            line-height: 2;
            font-size: 1.2em;

        .game-container {

            padding: 40px;

        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }

            color: #4a148c;

            text-align: center;

        }

            border-right: 5px solid #fbc02d;
            border-radius: 8px;
            margin: 15px 0;
            font-weight: bold;
        }

        .inspiration-box {

            margin: 20px 0;
            border: 3px dashed #8e24aa;
            text-align: center;
            font-size: 1.1em;

            padding: 18px 40px;
            border: none;
            border-radius: 50px;
            font-size: 1.3em;
            cursor: pointer;
            margin: 15px 10px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(106, 27, 154, 0.4);
            font-weight: bold;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(106, 27, 154, 0.6);
        }

        .btn:active {
            transform: translateY(0);
        }

        .answer-btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            color: #1f2937;
            padding: 20px;
            margin: 12px 0;
            border: 3px solid #d1d5db;
            border-radius: 15px;
            font-size: 1.15em;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: right;
        }

        .answer-btn:hover {
            background: linear-gradient(135deg, #e1bee7 0%, #ce93d8 100%);
            border-color: #8e24aa;
            transform: translateX(-5px);
        }

        .answer-btn.correct {
            background: linear-gradient(135deg, #c8e6c9 0%, #a5d6a7 100%);
            border-color: #388e3c;
            animation: pulse 0.5s ease;
        }

        .answer-btn.wrong {
            background: linear-gradient(135deg, #ffccbc 0%, #ffab91 100%);
            border-color: #d84315;
            animation: shake 0.5s ease;
        }

        .feedback {
            padding: 25px;
            margin: 20px 0;
            border-radius: 15px;
            font-size: 1.2em;
            animation: fadeIn 0.5s ease;
        }

        .feedback.correct {
            background: linear-gradient(135deg, #c8e6c9 0%, #a5d6a7 100%);
            border: 3px solid #388e3c;
            color: #1b5e20;
        }

        .feedback.wrong {
            background: linear-gradient(135deg, #ffccbc 0%, #ffab91 100%);
            border: 3px solid #d84315;
            color: #bf360c;
        }

            width: 100%;
            height: 30px;
            background: #e5e7eb;
            border-radius: 15px;
            overflow: hidden;
            margin: 25px 0;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #8e24aa 0%, #6a1b9a 100%);
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;

        .score-display {
            text-align: center;
            font-size: 1.5em;
            color: #4a148c;
            margin: 20px 0;
            font-weight: bold;

            padding: 50px;

            margin: 30px 0;
            text-align: center;

                padding: 15px 30px;
                font-size: 1.1em;
            }
        }
    </style>
</head>

        // פונקציות עזר
        function shuffleArray(arr) {
            const newArr = [...arr];
            for (let i = newArr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
            }
            return newArr;
        }

        function playSound(frequencies, duration = 200) {
            frequencies.forEach((freq, index) => {
                setTimeout(() => {
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    oscillator.frequency.value = freq;
                    oscillator.type = 'sine';
                    
                    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration / 1000);
                    
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + duration / 1000);
                }, index * duration);
            });
        }

            };
            
            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'text/plain'},
                    body: JSON.stringify(data)
                });
                console.log('✅ הַנְּתוּנִים נִשְׁלְחוּ בְּהַצְלָחָה!');

        }
