<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אהבת חסד - משחק למידה אינטראקטיבי</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .progress-section {
            padding: 20px 30px;
            background: #f8f9fa;
            border-bottom: 3px solid #e9ecef;
        }

        .progress-bar-container {
            background: #e9ecef;
            border-radius: 50px;
            height: 30px;
            overflow: hidden;
            position: relative;
            margin-bottom: 15px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            border-radius: 50px;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .stat-item {
            background: white;
            padding: 10px 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .content {
            padding: 40px;
        }

        .lesson-content {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            border-right: 5px solid #667eea;
            line-height: 1.8;
            font-size: 1.1em;
        }

        .question-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .question-text {
            font-size: 1.3em;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .answers-grid {
            display: grid;
            gap: 15px;
        }

        .answer-button {
            padding: 20px;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.05em;
            text-align: right;
            line-height: 1.5;
        }

        .answer-button:hover:not(:disabled) {
            border-color: #667eea;
            background: #f8f9ff;
            transform: translateX(-5px);
        }

        .answer-button:disabled {
            cursor: not-allowed;
        }

        .answer-button.correct {
            border-color: #4CAF50;
            background: #e8f5e9;
            animation: correctPulse 0.6s ease;
        }

        .answer-button.wrong {
            border-color: #f44336;
            background: #ffebee;
            animation: wrongShake 0.5s ease;
        }

        @keyframes correctPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes wrongShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
        }

        .feedback {
            margin-top: 25px;
            padding: 25px;
            border-radius: 12px;
            animation: fadeIn 0.5s ease;
        }

        .feedback.correct {
            background: #e8f5e9;
            border-right: 5px solid #4CAF50;
        }

        .feedback.wrong {
            background: #fff3e0;
            border-right: 5px solid #ff9800;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feedback-title {
            font-size: 1.4em;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .feedback-content {
            line-height: 1.7;
            font-size: 1.05em;
        }

        .next-button {
            margin-top: 20px;
            padding: 15px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .next-button:hover {
            transform: scale(1.05);
        }

        .lesson-complete {
            text-align: center;
            padding: 40px;
        }

        .lesson-complete h2 {
            font-size: 2.5em;
            margin-bottom: 20px;
            color: #4CAF50;
        }

        .final-screen {
            text-align: center;
            padding: 40px;
        }

        .final-screen h1 {
            font-size: 3em;
            margin-bottom: 30px;
            color: #4CAF50;
        }

        .score-display {
            font-size: 4em;
            font-weight: bold;
            color: #667eea;
            margin: 30px 0;
        }

        .feedback-journey {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 15px;
            margin: 30px 0;
            text-align: right;
        }

        .feedback-levels {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        .feedback-level-dot {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: all 0.3s;
        }

        .feedback-level-dot.completed {
            background: linear-gradient(135deg, #4CAF50, #8BC34A);
            color: white;
        }

        .certificate {
            background: linear-gradient(135deg, #fff9e6 0%, #ffe6f0 100%);
            border: 5px solid gold;
            border-radius: 20px;
            padding: 40px;
            margin: 30px 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .certificate h2 {
            color: #d4af37;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .signature {
            margin-top: 40px;
            padding: 30px;
            background: white;
            border-radius: 15px;
            border-right: 5px solid #667eea;
        }

        .signature h3 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .prize-link {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 40px;
            background: linear-gradient(135deg, #ff6b6b 0%, #feca57 100%);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: bold;
            transition: transform 0.3s;
        }

        .prize-link:hover {
            transform: scale(1.1);
        }

        @media (max-width: 768px) {
            .content {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 1.8em;
            }
            
            .question-text {
                font-size: 1.1em;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

                content: `עכשיו זה הזמן שלך! 🌟 אתה יכול לבחור כל יום להיות אדם של \"אהבת חסד\" ולפעול מתוך שמחה ורצון פנימי. איך? יוזמה - לראות תלמיד עומד לבד ולגשת אליו. זריזות - לעזוב מיד את המשחק כדי לעזור. התלהבות - להגיד \"בשמחה!\" עם חיוך. שאל את עצמך: \"האם אני עושה את זה כי אני רוצה, או כי אני חייב?\" הרגשת השמחה היא סימן שהמעשה נובע מ\"אהבת חסד\" פנימית. אתה יכול! 💪`,
                questions: [
                    {
                        question: "איזו מהפעולות הבאות היא דוגמה ל\"יוזמה\" בחסד?",
                        options: [
                            "לעזור לחבר רק אחרי שהוא מבקש שלוש פעמים",
                            "לראות תלמיד חדש עומד לבד בהפסקה ולגשת להזמין אותו לשחק",
                            "להסכים לעזור לאמא אחרי שהיא מבטיחה לך פרס",
                            "לחכות שהמורה תגיד לך לעזור לחבר שמתקשה"
                        ],
                        correct: 1,
                        explanation: "זוהי יוזמה, כי אתה פועל באופן אקטיבי כדי לעזור למישהו, מבלי שהוא ביקש זאת.",
                        encouragement: "דוגמה מצוינת! אתה יודע לתרגם את רעיון ה\"יוזמה\" למצב אמיתי מחיי היום-יום."
                    },
                    {
                        question: "בתרחיש \"חבר מבקש ממך להסביר לו חומר שלא הבין\", מהי תגובה של \"חסד של אברהם\"?",
                        options: [
                            "להגיד לו \"אין לי זמן עכשיו, אולי מחר\"",
                            "להסביר לו מהר ובלי סבלנות כדי לסיים עם זה",
                            "להגיד \"עכשיו אני לא יכול, תשאל מישהו אחר\"",
                            "להגיד \"בטח, בוא נשב עכשיו ואסביר לך בשמחה כל מה שצריך\""
                        ],
                        correct: 3,
                        explanation: "זוהי דוגמה ל\"חסד של אברהם\" כי היא משלבת התלהבות (\"בשמחה\"), זריזות (\"עכשיו\") ונדיבות (\"כל מה שצריך\").",
                        encouragement: "ניתוח מושלם! אתה מזהה את כל המרכיבים של חסד אמיתי בתשובה אחת."
                    },
                    {
                        question: "מהי המטרה הסופית של לימוד ההבדל בין אברהם ללוט?",
                        options: [
                            "לדעת יותר סיפורים מהתורה",
                            "לזכור את כל הפרטים הקטנים על כל דמות",
                            "לבחור כל יום להיות אנשים של \"אהבת חסד\" ולפעול מתוך שמחה ורצון פנימי",
                            "לדעת לשפוט אחרים אם החסד שלהם אמיתי או לא"
                        ],
                        correct: 2,
                        explanation: "המטרה היא לא רק לצבור ידע, אלא להפוך את הידע הזה לכלי לצמיחה אישית, וליישם את מידותיו של אברהם בחיינו.",
                        encouragement: "הבנת את המטרה הסופית! כל הכבוד. אתה מבין שלמידה אמיתית היא כזו שמשנה אותנו והופכת אותנו לאנשים טובים יותר."
                    }
                ]
            }
        ];

        // Audio Context for playing sounds
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        const playSound = (frequencies, duration = 0.3) => {
            frequencies.forEach((freq, index) => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = freq;
                oscillator.type = 'sine';
                
                const startTime = audioContext.currentTime + (index * 0.15);
                gainNode.gain.setValueAtTime(0.3, startTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
                
                oscillator.start(startTime);
                oscillator.stop(startTime + duration);
            });
        };

        const getFeedbackLevel = (totalAnswered) => {
            return Math.min(Math.ceil(totalAnswered / 1), 10);
        };

        const getFeedbackText = (isCorrect, level) => {
            const correctMessages = {
                1: "נכון ✓",
                2: "הצלחת! ✓",
                3: "מצוין ⭐",
                4: "כל הכבוד! 🎯",
                5: "אני רואה שהשקעת מחשבה! 💪",
                6: "עוד צעד במסע שלך! 🌟 אתה מתקדם!",
                7: "מדהים לראות את ההתמדה שלך! 🎉 זה באמת מרשים",
                8: "פצצה! 🚀 רוצה לדעת פרט מעניין על זה?",
                9: "וואו! 💫 אתה כבר שולט בזה כמו מקצוען!",
                10: "בזכותך העולם קצת יותר חכם היום! 🌍 אתה מדהים!"
            };
            
            const wrongMessages = {
                1: "לא מדויק",
                2: "טעות, נסה שוב",
                3: "לא בדיוק 🤔",
                4: "כמעט, חשוב על...",
                5: "נראה שהמושג הזה מאתגר, בוא נחשוב ביחד",
                6: "הטעות הזו מלמדת אותך משהו חשוב",
                7: "אני מבין שזה מורכב. רוצה רמז נוסף?",
                8: "יש לך שאלה על החומר? אני כאן בשבילך",
                9: "זו הזדמנות מעולה ללמוד - מה הבלבל אותך?",
                10: "כל טעות היא צעד לעבר הצלחה. ממשיכים! 🌱"
            };
            
            return isCorrect ? correctMessages[level] : wrongMessages[level];
        };

        const AhavatChesedGame = () => {
            const [currentLesson, setCurrentLesson] = useState(0);
            const [currentQuestion, setCurrentQuestion] = useState(0);
            const [selectedAnswer, setSelectedAnswer] = useState(null);
            const [showFeedback, setShowFeedback] = useState(false);
            const [lessonScore, setLessonScore] = useState(0);
            const [totalScore, setTotalScore] = useState(0);
            const [totalQuestionsAnswered, setTotalQuestionsAnswered] = useState(0);
            const [gameComplete, setGameComplete] = useState(false);
            const [showLesson, setShowLesson] = useState(true);
            const [randomizedOptions, setRandomizedOptions] = useState([]);

            useEffect(() => {
                // Randomize options when question changes
                const lesson = lessons[currentLesson];
                const question = lesson.questions[currentQuestion];
                const options = [...question.options];
                
                // Fisher-Yates shuffle
                for (let i = options.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [options[i], options[j]] = [options[j], options[i]];
                }
                
                setRandomizedOptions(options);
            }, [currentLesson, currentQuestion]);

            const handleAnswer = (answerIndex) => {
                if (showFeedback) return;

                const lesson = lessons[currentLesson];
                const question = lesson.questions[currentQuestion];
                const selectedText = randomizedOptions[answerIndex];
                const isCorrect = selectedText === question.options[question.correct];

                setSelectedAnswer(answerIndex);
                setShowFeedback(true);
                setTotalQuestionsAnswered(prev => prev + 1);

                const feedbackLevel = getFeedbackLevel(totalQuestionsAnswered + 1);

                if (isCorrect) {
                    setLessonScore(prev => prev + 1);
                    setTotalScore(prev => prev + 1);
                    
                    // Play sound from level 4+
                    if (feedbackLevel >= 4) {
                        if (feedbackLevel === 10) {
                            playSound([523, 659, 784, 1047, 784, 659], 1.8); // Celebratory
                        } else {
                            playSound([523, 659, 784], 0.4); // C-E-G chord
                        }
                    }
                }
            };

            const handleNext = () => {
                const lesson = lessons[currentLesson];
                
                if (currentQuestion < lesson.questions.length - 1) {
                    // Next question in same lesson
                    setCurrentQuestion(prev => prev + 1);
                    setSelectedAnswer(null);
                    setShowFeedback(false);
                } else {
                    // End of lesson
                    const percentage = (lessonScore / lesson.questions.length) * 100;
                    
                    if (percentage >= 66) {
                        // Pass to next lesson
                        if (currentLesson < lessons.length - 1) {
                            setCurrentLesson(prev => prev + 1);
                            setCurrentQuestion(0);
                            setSelectedAnswer(null);
                            setShowFeedback(false);
                            setLessonScore(0);
                            setShowLesson(true);
                            
                            // Celebration sound
                            if (percentage === 100) {
                                playSound([523, 659, 784, 1047, 784, 659], 1.8);
                            }
                        } else {
                            // Game complete
                            setGameComplete(true);
                            playSound([523, 659, 784, 1047, 1319, 1568], 2.5);
                        }
                    } else {
                        // Retry lesson
                        setCurrentQuestion(0);
                        setSelectedAnswer(null);
                        setShowFeedback(false);
                        setLessonScore(0);
                        setShowLesson(true);
                    }
                }
            };

            const startLesson = () => {
                setShowLesson(false);
            };

            const totalQuestions = lessons.length * 3;
            const progressPercent = ((currentLesson * 3 + currentQuestion) / totalQuestions) * 100;
            const feedbackLevel = getFeedbackLevel(totalQuestionsAnswered);

            if (gameComplete) {
                const finalScore = Math.round((totalScore / totalQuestions) * 100);
                const maxFeedbackLevel = Math.min(totalQuestionsAnswered, 10);
                
                return (
                    <div className="container">
                        <div className="header">
                            <h1>🎉 כל הכבוד! 🎉</h1>
                        </div>
                        <div className="final-screen">
                            <h1>סיימת את המשחק!</h1>
                            <div className="score-display">{finalScore}%</div>
                            <p style={{fontSize: '1.3em', marginBottom: '20px'}}>
                                ענית נכון על {totalScore} מתוך {totalQuestions} שאלות
                            </p>
                            
                            <div className="feedback-journey">
                                <h2 style={{marginBottom: '15px'}}>המסע שלך דרך רמות הפידבק 🌟</h2>
                                <p style={{fontSize: '1.2em', lineHeight: '1.8'}}>
                                    התחלת ב-"נכון/שגוי" פשוט, ועברת דרך <strong>{maxFeedbackLevel}</strong> רמות של פידבק
                                    {maxFeedbackLevel === 10 && " - הגעת לרמה הגבוהה ביותר! 🏆"}
                                </p>
                                <div className="feedback-levels">
                                    {[...Array(10)].map((_, i) => (
                                        <div 
                                            key={i} 
                                            className={`feedback-level-dot ${i < maxFeedbackLevel ? 'completed' : ''}`}
                                        >
                                            {i + 1}
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {finalScore >= 80 && (
                                <div className="certificate">
                                    <h2>🏆 תעודת הצטיינות 🏆</h2>
                                    <p style={{fontSize: '1.5em', margin: '20px 0'}}>
                                        מוענקת בזאת ל
                                    </p>
                                    <p style={{fontSize: '2em', fontWeight: 'bold', color: '#667eea', margin: '20px 0'}}>
                                        ______________________
                                    </p>
                                    <p style={{fontSize: '1.2em', lineHeight: '1.8'}}>
                                        על השלמת מסע הלמידה "אהבת חסד"<br/>
                                        ועל ההבנה העמוקה של מידות אברהם אבינו
                                    </p>
                                    <div style={{marginTop: '30px', fontSize: '1.1em'}}>
                                        <p>🌟 יוזמה • זריזות • התלהבות • נדיבות 🌟</p>
                                    </div>
                                </div>
                            )}

                            <div style={{background: '#fff3e0', padding: '30px', borderRadius: '15px', margin: '30px 0'}}>
                                <h2 style={{color: '#ff6b6b', marginBottom: '20px', fontSize: '2em'}}>
                                    🎁 הגרלה נושאת פרסים! 🎁
                                </h2>
                                <p style={{fontSize: '1.3em', lineHeight: '1.8', marginBottom: '20px'}}>
                                    מזל טוב! נכנסת להגרלה נושאת פרסים!<br/>
                                    השאר את פרטיך ותהיה שותף בהגרלה 🎉
                                </p>
                                <a 
                                    href="https://forms.gle/A66uubei4XSX6SG2A"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="prize-link"
                                >
                                    לחץ כאן לרישום להגרלה 🎯
                                </a>
                            </div>

                            <div className="signature">
                                <h3>נבנה על ידי:</h3>
                                <p style={{fontSize: '1.3em', fontWeight: 'bold', color: '#667eea'}}>
                                    הרב יהודה טאוב מקרית אתא
                                </p>
                                <p style={{fontSize: '1.2em', marginTop: '10px'}}>
                                    📞 לפרטים: 0527139520
                                </p>
                            </div>
                        </div>
                    </div>
                );
            }

            const lesson = lessons[currentLesson];
            const question = lesson.questions[currentQuestion];
            const selectedText = selectedAnswer !== null ? randomizedOptions[selectedAnswer] : null;
            const isCorrect = selectedText === question.options[question.correct];

            if (showLesson) {
                return (
                    <div className="container">
                        <div className="header">
                            <h1>אהבת חסד 💫</h1>
                            <p style={{fontSize: '1.2em'}}>מסע לימוד אינטראקטיבי</p>
                        </div>
                        <div className="progress-section">
                            <div className="progress-bar-container">
                                <div className="progress-bar" style={{width: `${progressPercent}%`}}>
                                    {Math.round(progressPercent)}%
                                </div>
                            </div>
                            <div className="stats">
                                <div className="stat-item">
                                    <span>📚 שיעור:</span>
                                    <strong>{currentLesson + 1}/{lessons.length}</strong>
                                </div>
                                <div className="stat-item">
                                    <span>🎯 ציון כולל:</span>
                                    <strong>{totalScore}/{totalQuestions}</strong>
                                </div>
                                <div className="stat-item">
                                    <span>🌟 רמת פידבק:</span>
                                    <strong>{feedbackLevel}/10</strong>
                                </div>
                            </div>
                        </div>
                        <div className="content">
                            <h2 style={{color: '#667eea', marginBottom: '20px', fontSize: '2em'}}>
                                {lesson.title}
                            </h2>
                            <div className="lesson-content">
                                {lesson.content}
                            </div>
                            <button onClick={startLesson} className="next-button">
                                בואו נתחיל! 🚀
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="container">
                    <div className="header">
                        <h1>אהבת חסד 💫</h1>
                        <p style={{fontSize: '1.2em'}}>{lesson.title}</p>
                    </div>
                    <div className="progress-section">
                        <div className="progress-bar-container">
                            <div className="progress-bar" style={{width: `${progressPercent}%`}}>
                                {Math.round(progressPercent)}%
                            </div>
                        </div>
                        <div className="stats">
                            <div className="stat-item">
                                <span>❓ שאלה:</span>
                                <strong>{currentQuestion + 1}/3</strong>
                            </div>
                            <div className="stat-item">
                                <span>✅ נכונות בשיעור:</span>
                                <strong>{lessonScore}/{currentQuestion + (showFeedback ? 1 : 0)}</strong>
                            </div>
                            <div className="stat-item">
                                <span>🌟 רמת פידבק:</span>
                                <strong>{feedbackLevel}/10</strong>
                            </div>
                        </div>
                    </div>
                    <div className="content">
                        <div className="question-card">
                            <div className="question-text">
                                {question.question}
                            </div>
                            <div className="answers-grid">
                                {randomizedOptions.map((option, index) => {
                                    const isSelected = selectedAnswer === index;
                                    const isThisCorrect = option === question.options[question.correct];
                                    let className = 'answer-button';
                                    
                                    if (showFeedback) {
                                        if (isSelected) {
                                            className += isCorrect ? ' correct' : ' wrong';
                                        }
                                        if (isThisCorrect && !isSelected) {
                                            className += ' correct';
                                        }
                                    }
                                    
                                    return (
                                        <button
                                            key={index}
                                            className={className}
                                            onClick={() => handleAnswer(index)}
                                            disabled={showFeedback}
                                        >
                                            {option}
                                        </button>
                                    );
                                })}
                            </div>
                            
                            {showFeedback && (
                                <div className={`feedback ${isCorrect ? 'correct' : 'wrong'}`}>
                                    <div className="feedback-title">
                                        {getFeedbackText(isCorrect, feedbackLevel)}
                                    </div>
                                    <div className="feedback-content">
                                        <p><strong>נימוק:</strong> {question.explanation}</p>
                                        <p style={{marginTop: '15px'}}>
                                            <strong>מסר מחזק:</strong> {question.encouragement}
                                        </p>
                                    </div>
                                    <button onClick={handleNext} className="next-button">
                                        {currentQuestion < lesson.questions.length - 1 ? 'לשאלה הבאה ←' : 'סיום שיעור →'}
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<AhavatChesedGame />, document.getElementById('root'));
    </script>
</body>
</html>
