        // אתחול AudioContext רק לאחר אינטראקציית משתמש
        function initAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        
        // פונקציה לניגון צליל
        function playSound(frequencies, duration = 0.15) {
            initAudioContext();
            frequencies.forEach((freq, index) => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = freq;
                oscillator.type = 'sine';
                
                const startTime = audioContext.currentTime + (index * duration);
                gainNode.gain.setValueAtTime(0.3, startTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
                
                oscillator.start(startTime);
                oscillator.stop(startTime + duration);
            });
        }
        
        // ערבוב מערך
        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        // פונקציה לשליחת ציונים
        async function sendScoreToTeacher() {
            const now = new Date();
            const data = {
                name: userName,
                score: `${score}/12`,
                percentage: `${Math.round((score/12)*100)}%`,
                gameName: document.title,
                date: now.toLocaleDateString('he-IL'),
                time: now.toLocaleTimeString('he-IL')
            };
            
            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'text/plain'},
                    body: JSON.stringify(data)
                });
                console.log('✅ הַנְּתוּנִים נִשְׁלְחוּ בְּהַצְלָחָה!');
            } catch (error) {
                console.error('❌ שְׁגִיאָה בַּשִּׁלּוּחַ:', error);
            }
        }
