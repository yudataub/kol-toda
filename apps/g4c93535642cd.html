

<style>
:root {
  --carib-teal: #1D9E75;
  --carib-teal-light: #9FE1CB;
  --carib-teal-xlight: #E1F5EE;
  --carib-blue: #378ADD;
  --carib-blue-light: #B5D4F4;
  --carib-blue-xlight: #E6F1FB;
  --carib-amber: #EF9F27;
  --carib-amber-light: #FAC775;
  --carib-amber-xlight: #FAEEDA;
  --carib-teal-dark: #085041;
  --carib-blue-dark: #0C447C;
}
* { box-sizing: border-box; margin: 0; padding: 0; direction: rtl; }
body { font-family: var(--font-sans, Arial, sans-serif); }
.catalog-wrap { padding: 1.25rem 1rem 2rem; }
.catalog-header {
  text-align: center;
  padding: 1.5rem 1rem 1.25rem;
  background: linear-gradient(135deg, #E1F5EE 0%, #E6F1FB 50%, #FAEEDA 100%);
  border-radius: var(--border-radius-lg, 12px);
  margin-bottom: 1.25rem;
  border: 0.5px solid var(--carib-teal-light);
}
.catalog-header h1 {
  font-size: 22px;
  font-weight: 500;
  color: var(--carib-teal-dark);
  margin-bottom: 4px;
}
.catalog-header p {
  font-size: 14px;
  color: #0F6E56;
}
.tabs-bar {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 1rem;
  border-bottom: 2px solid var(--carib-teal-light);
  padding-bottom: 0;
}
.tab-btn {
  background: transparent;
  border: none;
  padding: 10px 16px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  border-radius: 8px 8px 0 0;
  color: #0F6E56;
  border: 0.5px solid transparent;
  border-bottom: none;
  position: relative;
  bottom: -2px;
  transition: background 0.15s;
}
.tab-btn:hover { background: var(--carib-teal-xlight); }
.tab-btn.active {
  background: var(--carib-teal-xlight);
  border-color: var(--carib-teal-light);
  border-bottom: 2px solid var(--carib-teal-xlight);
  color: var(--carib-teal-dark);
}
.tab-icon { font-size: 16px; vertical-align: -2px; margin-left: 5px; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }
.section-title {
  font-size: 15px;
  font-weight: 500;
  color: var(--carib-blue-dark);
  margin: 1rem 0 0.65rem;
  padding-right: 10px;
  border-right: 3px solid var(--carib-teal);
}
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 10px;
}
.link-card {
  background: var(--color-background-primary, #fff);
  border: 0.5px solid var(--carib-teal-light);
  border-radius: var(--border-radius-md, 8px);
  padding: 12px 14px;
  text-decoration: none;
  display: flex;
  flex-direction: column;
  gap: 5px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.link-card:hover {
  background: var(--carib-teal-xlight);
  border-color: var(--carib-teal);
}
.link-card.external { border-color: var(--carib-amber-light); }
.link-card.external:hover { background: var(--carib-amber-xlight); border-color: var(--carib-amber); }
.link-card .card-name {
  font-size: 14px;
  font-weight: 500;
  color: var(--carib-teal-dark);
  line-height: 1.4;
}
.link-card.external .card-name { color: var(--carib-blue-dark); }
.link-card .card-tag {
  font-size: 11px;
  padding: 2px 7px;
  border-radius: 20px;
  display: inline-block;
  width: fit-content;
}
.tag-netlify { background: var(--carib-blue-xlight); color: var(--carib-blue-dark); }
.tag-gamma { background: var(--carib-amber-xlight); color: #412402; }
.tag-sites { background: var(--carib-teal-xlight); color: var(--carib-teal-dark); }
.tag-game { background: #FBEAF0; color: #4B1528; }
.count-badge {
  display: inline-block;
  background: var(--carib-teal);
  color: #fff;
  font-size: 11px;
  border-radius: 20px;
  padding: 1px 8px;
  margin-right: 6px;
  font-weight: 500;
  vertical-align: middle;
}
.search-row {
  display: flex;
  gap: 8px;
  margin-bottom: 1rem;
  align-items: center;
}
.search-row input {
  flex: 1;
  font-size: 14px;
}
.empty-state {
  text-align: center;
  padding: 2rem;
  color: var(--color-text-secondary);
  font-size: 14px;
}
</style>

<div class="catalog-wrap">
  <div class="catalog-header">
    <h1><i class="ti ti-books" aria-hidden="true" style="color: var(--carib-teal);"></i> קטלוג סיפורים במצגת</h1>
    <p>כל הקישורים למדור סיפורי התנאים – ממוינים ומאורגנים</p>
  </div>

  <div class="search-row">
    <i class="ti ti-search" aria-hidden="true" style="font-size:18px; color:var(--carib-teal);"></i>
    <input type="text" id="searchInput" placeholder="חיפוש קישור..." oninput="filterCards()" />
  </div>

  <div class="tabs-bar" id="tabsBar">
    <button class="tab-btn active" onclick="switchTab('all', this)">
      <i class="ti ti-layout-grid tab-icon" aria-hidden="true"></i>הכל
    </button>
    <button class="tab-btn" onclick="switchTab('collections', this)">
      <i class="ti ti-book tab-icon" aria-hidden="true"></i>אוספים
    </button>
    <button class="tab-btn" onclick="switchTab('tannaim', this)">
      <i class="ti ti-user tab-icon" aria-hidden="true"></i>תנאים
    </button>
    <button class="tab-btn" onclick="switchTab('stories', this)">
      <i class="ti ti-feather tab-icon" aria-hidden="true"></i>סיפורים נוספים
    </button>
    <button class="tab-btn" onclick="switchTab('games', this)">
      <i class="ti ti-puzzle tab-icon" aria-hidden="true"></i>משחקים
    </button>
  </div>

  <div id="panel-all" class="tab-panel active">
    <div id="all-grid" class="cards-grid"></div>
    <div id="empty-all" class="empty-state" style="display:none"><i class="ti ti-mood-empty" style="font-size:24px; display:block; margin-bottom:8px;" aria-hidden="true"></i>לא נמצאו תוצאות</div>
  </div>
  <div id="panel-collections" class="tab-panel"></div>
  <div id="panel-tannaim" class="tab-panel"></div>
  <div id="panel-stories" class="tab-panel"></div>
  <div id="panel-games" class="tab-panel"></div>
</div>

<script>
const LINKS = [
  { name: "סיפורי התנאים כתובים", url: "https://sipury1.netlify.app/", type: "netlify", cat: "collections" },
  { name: "סיפורים כתובים חלק ב", url: "https://sipury.netlify.app/", type: "netlify", cat: "collections" },
  { name: "סיפורי ראשונים ואחרונים", url: "https://stalwart-belekoy-eb5f17.netlify.app/", type: "netlify", cat: "collections" },
  { name: "הראשונים והאחרונים – סיפורים", url: "https://zingy-puffpuff-279d04.netlify.app/", type: "netlify", cat: "collections" },
  { name: "ח\"א – גדולי ישראל – כל הסיפורים", url: "https://gregarious-pavlova-c8db37.netlify.app/", type: "netlify", cat: "collections" },
  { name: "גדולי ישראל חלק ב – עם קטלוג", url: "https://lighthearted-concha-83fcb6.netlify.app/", type: "netlify", cat: "collections" },
  { name: "כולל כל הסיפורים כתובים וערוכים", url: "https://prismatic-cactus-33a4c4.netlify.app/", type: "netlify", cat: "collections" },
  { name: "הסיפורים במלואם", url: "../p/2333.html", type: "sites", cat: "collections" },
  { name: "הסיפורים במלואם מעוצב", url: "../p/2320.html", type: "sites", cat: "collections" },
  { name: "קטלוג תוכנית לכיתה א", url: "../p/2340.html", type: "sites", cat: "collections" },
  { name: "קטלוג תוכנית חלק ב", url: "../p/2339.html", type: "sites", cat: "collections" },

  { name: "ר' יוחנן בן זכאי", url: "https://gamma.app/docs/-jecvvfsk5bgkb0j", type: "gamma", cat: "tannaim" },
  { name: "ר יוחנן בן זכאי – Sites", url: "../p/2341.html", type: "sites", cat: "tannaim" },
  { name: "שמאי הזקן – קנאות למצוות", url: "../p/2343.html", type: "sites", cat: "tannaim" },
  { name: "הלל הזקן: מסירות, ענווה ושלום", url: "../p/2332.html", type: "sites", cat: "tannaim" },
  { name: "חנן הנחבא והענווה", url: "../p/2336.html", type: "sites", cat: "tannaim" },
  { name: "אבא חלקיה ותפילת הגשם", url: "../p/2330.html", type: "sites", cat: "tannaim" },
  { name: "חוני המעגל ועץ החרוב", url: "../p/2334.html", type: "sites", cat: "tannaim" },
  { name: "חנינא בן דוסא והעיזים", url: "../p/2335.html", type: "sites", cat: "tannaim" },
  { name: "בית המקדש ועשרת הניסים", url: "../p/2331.html", type: "sites", cat: "tannaim" },

  { name: "דניאל", url: "../p/2318.html", type: "sites", cat: "stories" },
  { name: "נחום איש גם זו", url: "../p/2327.html", type: "sites", cat: "stories" },
  { name: "שמעון הצדיק", url: "../p/2366.html", type: "sites", cat: "stories" },
  { name: "נקדימון בן גוריון", url: "../p/2328.html", type: "sites", cat: "stories" },
  { name: "אבא חלקיה וענני הישועה", url: "../p/2316.html", type: "sites", cat: "stories" },
  { name: "כי גבר עלינו חסדו", url: "../p/2323.html", type: "sites", cat: "stories" },
  { name: "רבי אריה לוין", url: "../p/2365.html", type: "sites", cat: "stories" },
  { name: "סוד החסה", url: "../p/2329.html", type: "sites", cat: "stories" },
  { name: "כליה או כליה", url: "../p/2325.html", type: "sites", cat: "stories" },
  { name: "כליה או כליה – מעולה!", url: "../p/2326.html", type: "sites", cat: "stories" },
  { name: "תהלים במלחמה! סיפור הלל", url: "../p/2367.html", type: "sites", cat: "stories" },
  { name: "אגם ברגר", url: "../p/2317.html", type: "sites", cat: "stories" },
  { name: "כוחה של שירה", url: "../p/2322.html", type: "sites", cat: "stories" },
  { name: "העין שחזרה לתחיה", url: "../p/2321.html", type: "sites", cat: "stories" },
  { name: "הנשק של הגיבורים", url: "../p/2319.html", type: "sites", cat: "stories" },
  { name: "כיצד למצוא חומרים על התנאים", url: "../p/2324.html", type: "sites", cat: "stories" },

  { name: "משחק על רבי יוחנן בן זכאי", url: "../p/2337.html", type: "game", cat: "games" },
  { name: "משחקים על פרשיות השבוע", url: "../p/2338.html", type: "game", cat: "games" },
];

const TAG_MAP = {
  netlify: { label: "Netlify", cls: "tag-netlify" },
  gamma: { label: "Gamma", cls: "tag-gamma" },
  sites: { label: "Google Sites", cls: "tag-sites" },
  game: { label: "משחק", cls: "tag-game" },
};

function makeCard(item) {
  const tag = TAG_MAP[item.type];
  const isExt = item.type === "netlify" || item.type === "gamma";
  return `<a class="link-card${isExt ? ' external' : ''}" href="${item.url}" target="_blank" data-name="${item.name}" data-cat="${item.cat}">
    <span class="card-name">${item.name}</span>
    <span class="card-tag ${tag.cls}"><i class="ti ${item.type === 'netlify' ? 'ti-cloud' : item.type === 'gamma' ? 'ti-presentation' : item.type === 'game' ? 'ti-puzzle' : 'ti-brand-google'}" style="font-size:11px; vertical-align:-1px; margin-left:3px;" aria-hidden="true"></i>${tag.label}</span>
  </a>`;
}

const CAT_LABELS = {
  collections: { label: "אוספים", icon: "ti-book" },
  tannaim: { label: "תנאים ואמוראים", icon: "ti-user" },
  stories: { label: "סיפורים נוספים", icon: "ti-feather" },
  games: { label: "משחקים", icon: "ti-puzzle" },
};

function renderPanel(panelId, items) {
  const panel = document.getElementById(panelId);
  if (!items.length) { panel.innerHTML = '<div class="empty-state"><i class="ti ti-mood-empty" style="font-size:24px; display:block; margin-bottom:8px;" aria-hidden="true"></i>אין קישורים</div>'; return; }
  panel.innerHTML = items.map(makeCard).join('');
}

function buildAllPanel() {
  const cats = ["collections", "tannaim", "stories", "games"];
  const grid = document.getElementById("all-grid");
  grid.innerHTML = '';
  cats.forEach(cat => {
    const items = LINKS.filter(l => l.cat === cat);
    const cl = CAT_LABELS[cat];
    const section = document.createElement("div");
    section.style.marginBottom = "1rem";
    section.innerHTML = `<div class="section-title"><i class="ti ${cl.icon}" style="font-size:15px; vertical-align:-2px; margin-left:5px;" aria-hidden="true"></i>${cl.label} <span class="count-badge">${items.length}</span></div><div class="cards-grid">${items.map(makeCard).join('')}</div>`;
    grid.appendChild(section);
  });
}

function switchTab(tab, btn) {
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById("panel-" + tab).classList.add("active");
  document.getElementById("searchInput").value = "";
  document.getElementById("empty-all").style.display = "none";
  if (tab === "all") buildAllPanel();
}

function filterCards() {
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const activePanel = document.querySelector(".tab-panel.active");
  const cards = activePanel.querySelectorAll(".link-card");
  let found = 0;
  cards.forEach(card => {
    const match = card.dataset.name.toLowerCase().includes(q);
    card.style.display = match ? "" : "none";
    if (match) found++;
  });
  if (activePanel.id === "panel-all") {
    document.getElementById("empty-all").style.display = (found === 0) ? "block" : "none";
  }
}

renderPanel("panel-collections", LINKS.filter(l => l.cat === "collections"));
renderPanel("panel-tannaim", LINKS.filter(l => l.cat === "tannaim"));
renderPanel("panel-stories", LINKS.filter(l => l.cat === "stories"));
renderPanel("panel-games", LINKS.filter(l => l.cat === "games"));
buildAllPanel();
</script>
