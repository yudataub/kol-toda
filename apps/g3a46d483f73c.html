        function playNote(frequency, duration) {
            if (!audioContext) return;
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            oscillator.frequency.value = frequency;
            oscillator.type = 'sine';
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + duration);
        }

            "הַשֵּׁם אוֹהֵב אוֹתְךָ! 💕",
            "הַשֵּׁם גֵּאֶה בְּךָ! 🌟",
            "הַשֵּׁם מְחַיֵּךְ אֵלֶיךָ! 😊",
            "הַלֵּב שֶׁלְּךָ מֵאִיר! ✨"
        ];
        
        // Check answer
        function checkAnswer(isCorrect, button, explanation) {
            const buttons = document.querySelectorAll('.answer-btn');
            buttons.forEach(btn => btn.disabled = true);
            
            const feedbackBox = document.getElementById('feedbackBox');
            feedbackBox.style.display = 'block';
            
            if (isCorrect) {
                button.classList.add('correct');
                playCorrectSound();
                score++;
                lessonScore++;
                
                const correctMsg = correctMessages[Math.floor(Math.random() * correctMessages.length)].replace('NAME', userName);
                const loveMsg = loveMessages[Math.floor(Math.random() * loveMessages.length)];
                
                feedbackBox.className = 'feedback-box correct';
                feedbackBox.innerHTML = `
                    <p><strong>${correctMsg}</strong></p>
                    <p>${explanation}</p>
                    <p><em>${loveMsg}</em></p>
                `;
            } else {
                button.classList.add('wrong');
                
                // Find and highlight correct answer
                buttons.forEach(btn => {
                    if (btn.textContent.includes('✓') || lessons[currentLesson].questions[currentQuestion].answers.find(a => a.correct && btn.textContent.includes(a.text.substring(0, 20)))) {
                        // We need to check by comparing the answer text
                    }
                });
                
                feedbackBox.className = 'feedback-box wrong';
                feedbackBox.innerHTML = `
                    <p><strong>לֹא בְּדִיּוּק, ${userName}... 🤔</strong></p>
                    <p>${explanation}</p>
                    <p><em>גַּם כְּשֶׁטּוֹעִים - לוֹמְדִים! הַשֵּׁם אוֹהֵב אוֹתְךָ! 💖</em></p>
                `;
            }
            
            answeredQuestions.push(currentQuestion);
            
            // Update score display
            document.querySelector('.score-display').innerHTML = `⭐ נִקּוּד: ${score}/${totalQuestions} | שִׁיעוּר זֶה: ${lessonScore}/3`;
            
            // Add next button
            setTimeout(() => {
                feedbackBox.innerHTML += `
                    <button class="next-btn" onclick="nextQuestion()">הַמְשֵׁךְ ➡️</button>
                `;
            }, 1000);
        }
        
        // Next question
        function nextQuestion() {
            currentQuestion++;
            
            if (currentQuestion >= 3) {
                // End of lesson
                showLessonComplete();
            } else {
                renderQuestion();
            }
        }
        
        // Show lesson complete
        function showLessonComplete() {
            const container = document.getElementById('questionsContainer');
            
            if (lessonScore >= 2) {
                // Passed
                let message = "";
                if (lessonScore === 3) {
                    message = `מַדְהִים, ${userName}! 🏆 שָׁלַטְתָּ בַּשִּׁיעוּר! 🎉`;
                    playVictorySound();
                } else {
                    message = `כִּמְעַט מֻשְׁלָם, ${userName}! 💪 מַמְשִׁיכִים לִצְמֹחַ! 🌱`;
                }
                
                container.innerHTML = `
                    <div class="lesson-complete">
                        <h2>🎊 סִיַּמְתָּ אֶת הַשִּׁיעוּר! 🎊</h2>
                        <p style="font-size: 1.3em;">${message}</p>
                        <p>צִיּוּן בַּשִּׁיעוּר: ${lessonScore}/3 ✨</p>
                        <button class="next-btn" onclick="nextLesson()">
                            ${currentLesson < 3 ? 'לַשִּׁיעוּר הַבָּא! ➡️' : 'לַתְּעוּדָה! 🎓'}
                        </button>
                    </div>
                `;
            } else {
                // Need to retry
                container.innerHTML = `
                    <div class="retry-message">
                        <h2>בּוֹא נְנַסֶּה שׁוּב, ${userName}! 💖</h2>
                        <p>צִיּוּן בַּשִּׁיעוּר: ${lessonScore}/3</p>
                        <p>צָרִיךְ לְפָחוֹת 2 מִתּוֹךְ 3 כְּדֵי לְהַמְשִׁיךְ 💪</p>
                        <p><em>אַל תִּדְאַג! גַּם גְּדוֹלֵי יִשְׂרָאֵל לָמְדוּ שׁוּב וְשׁוּב! 🌟</em></p>
                        <button class="next-btn" onclick="retryLesson()">נְנַסֶּה שׁוּב! 🔄</button>
                    </div>
                `;
            }
        }
        
        // Retry lesson
        function retryLesson() {
            score -= lessonScore; // Remove points from this lesson
            currentQuestion = 0;
            lessonScore = 0;
            answeredQuestions = [];
            renderLesson();
        }
        
        // Next lesson
        function nextLesson() {
            currentLesson++;
            currentQuestion = 0;
            lessonScore = 0;
            answeredQuestions = [];
            
            if (currentLesson >= 4) {
                showCertificate();
            } else {
                renderLesson();
            }
        }
        
        // Show certificate
        function showCertificate() {
            playVictorySound();
            sendScoreToTeacher();
            
            const percentage = Math.round((score / totalQuestions) * 100);
            const container = document.getElementById('gameContainer');
            
            let gradeMessage = "";
            if (percentage >= 90) {
                gradeMessage = "מְצֻיָּן! 🌟🏆⭐";
            } else if (percentage >= 75) {
                gradeMessage = "טוֹב מְאוֹד! 💪✨";
            } else {
                gradeMessage = "כָּל הַכָּבוֹד! 💖";
            }
            
            container.innerHTML = `
                <div class="certificate">
                    <h2>🎓 תְּעוּדַת הִצְטַיְּנוּת 🎓</h2>
                    <p style="font-size: 1.2em;">מֻעֶנֶקֶת בְּזֶה לְ:</p>
                    <div class="name">💫 ${userName} 💫</div>
                    <p class="score">צִיּוּן: ${score}/${totalQuestions} (${percentage}%)</p>
                    <p style="font-size: 1.5em;">${gradeMessage}</p>
                    <div class="verse">
                        <p>📜 "וְאָהַבְתָּ אֵת ה' אֱלֹקֶיךָ בְּכָל לְבָבְךָ וּבְכָל נַפְשְׁךָ וּבְכָל מְאֹדֶךָ" 📜</p>
                    </div>
                    <p style="margin-top: 20px;">🗡️🏹 לָמַדְתָּ שֶׁהַתְּפִילָּה הִיא הַכֹּחַ הָאֲמִתִּי שֶׁלָּנוּ! 💖</p>
                </div>
                
                <div class="reflection-questions">
                    <h3>💭 שְׁאֵלוֹת לְמַחְשָׁבָה:</h3>
                    <ul>
                        <li>🤔 אֵיךְ אוּכַל לְהַכְנִיס יוֹתֵר רֶגֶשׁ לַתְּפִילָּה שֶׁלִּי?</li>
                        <li>💖 עַל מָה אֲנִי רוֹצֶה לְהוֹדוֹת לַשֵּׁם הַיּוֹם?</li>
                        <li>🌟 מָה אֲנִי רוֹצֶה לְבַקֵּשׁ מֵהַשֵּׁם בַּמִּלִּים שֶׁלִּי?</li>
                    </ul>
                </div>
                
                ${percentage >= 75 ? `
                <div style="text-align: center; margin: 20px 0;">
                    <p style="font-size: 1.3em;">🎉 מַזָּל טוֹב, ${userName}! נִכְנַסְתָּ לְהַגְרָלָה! 🎁</p>
                    <a href="https://forms.gle/A66uubei4XSX6SG2A" target="_blank" class="lottery-link">
                        📋 לְהִרָשֵׁם לְהַגְרָלָה! 🎁
                    </a>
                </div>
                ` : `
                <div style="text-align: center; margin: 20px 0; padding: 15px; background: #fff3e0; border-radius: 15px;">
                    <p>💪 הַמְשֵׁךְ לְהִתְאַמֵּן! בְּפַעַם הַבָּאָה תַּגִּיעַ לְהַגְרָלָה! 🌟</p>
                </div>
                `}
                
                <div class="contact-info">
                    <p>💖 נִבְנָה בְּאַהֲבָה עַל יְדֵי:</p>
                    <p><strong>הָרַב יְהוּדָה טָאוּב מִקִּרְיַת אַתָּא</strong></p>
                    <p>📞 לִפְרָטִים: 0527139520</p>
                </div>
                
                <button class="start-btn" onclick="renderIntro()">🔄 לְשַׂחֵק שׁוּב! 🌟</button>
            `;
        }
        
        // Initialize game
        renderIntro();
    </script>
</body>
</html>
