        // פונקציה לערבוב מערך
        function shuffleArray(arr) {
            const newArr = [...arr];
            for (let i = newArr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
            }
            return newArr;
        }

        // פונקציה לניגון תווים
        function playNotes(frequencies, duration = 0.2) {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            frequencies.forEach((freq, index) => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = freq;
                oscillator.type = 'sine';
                
                const startTime = audioContext.currentTime + (index * duration);
                gainNode.gain.setValueAtTime(0.3, startTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
                
                oscillator.start(startTime);
                oscillator.stop(startTime + duration);
            });
        }

                <div class="score-display">
                    ${userName} 💫 | שִׁיעוּר ${lessonIndex + 1} מִתּוֹךְ ${lessons.length} | נִקּוּד: ${score}/12
                </div>
                
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${((lessonIndex) / lessons.length) * 100}%">
                        ${Math.round(((lessonIndex) / lessons.length) * 100)}%
                    </div>
                </div>
                
                <div class="lesson-title">${lesson.title}</div>
                <div class="lesson-content">${lesson.content}</div>
                <div class="inspiration-box">${lesson.inspiration}</div>
                
                <div id="questionsContainer"></div>
            `;
            
            renderQuestion(0);
        }

        // פונקציה להצגת שאלה
        function renderQuestion(qIndex) {
            if (qIndex >= lessons[currentLesson].questions.length) {
                checkLessonCompletion();
                return;
            }

            const question = lessons[currentLesson].questions[qIndex];
            const shuffledAnswers = shuffleArray(question.answers.map((ans, idx) => ({ text: ans, index: idx })));
            
            const questionsContainer = document.getElementById('questionsContainer');
            questionsContainer.innerHTML = `
                <div class="question-box">
                    <div class="question-text">❓ שְׁאֵלָה ${qIndex + 1}: ${question.question}</div>
                    <div class="answers-container" id="answersContainer${qIndex}">
                        ${shuffledAnswers.map((ans, idx) => `
                            <button class="answer-btn" onclick="checkAnswer(${qIndex}, ${ans.index})" id="answer${qIndex}_${idx}">
                                ${ans.text}
                            </button>
                        `).join('')}
                    </div>
                    <div id="feedback${qIndex}"></div>
                </div>
            `;
        }

        // פונקציה לבדיקת תשובה
        function checkAnswer(qIndex, selectedAnswer) {
            const question = lessons[currentLesson].questions[qIndex];
            const isCorrect = selectedAnswer === question.correct;
            const feedbackDiv = document.getElementById(`feedback${qIndex}`);
            const answersContainer = document.getElementById(`answersContainer${qIndex}`);
            
            // השבתת כל הכפתורים
            const buttons = answersContainer.querySelectorAll('.answer-btn');
            buttons.forEach(btn => btn.disabled = true);
            
            if (isCorrect) {
                score++;
                lessonScore++;
                playNotes([261.63, 329.63, 392.00]); // C-E-G
                
                const encouragements = [
                    `מְצֻיָּן, ${userName}! ⭐`,
                    `נִפְלָא, ${userName}! 💪`,
                    `כָּל הַכָּבוֹד, ${userName}! 🎯`,
                    `פַּצְצָה, ${userName}! 🏆`
                ];
                const randomEncouragement = encouragements[Math.floor(Math.random() * encouragements.length)];
                
                feedbackDiv.className = 'feedback correct';
                feedbackDiv.innerHTML = `
                    <div style="font-size: 1.3em; font-weight: bold; margin-bottom: 10px;">${randomEncouragement}</div>
                    <div>${question.explanation}</div>
                    <div style="margin-top: 15px; font-weight: bold; color: #e17055;">
                        הַשֵּׁם שָׂמֵחַ בְּךָ וְגֵאֶה בְּךָ, ${userName}! 💖
                    </div>
                `;
            } else {
                playNotes([196.00, 174.61, 146.83]); // G-F-D (descending)
                
                feedbackDiv.className = 'feedback incorrect';
                feedbackDiv.innerHTML = `
                    <div style="font-size: 1.3em; font-weight: bold; margin-bottom: 10px;">לֹא בְּדִיּוּק, ${userName}... 🤔</div>
                    <div>${question.explanation}</div>
                    <div style="margin-top: 15px; font-weight: bold; color: #6c5ce7;">
                        נַסֶּה שׁוּב, ${userName}! גַּם כְּשֶׁטּוֹעִים - לוֹמְדִים! הַשֵּׁם אוֹהֵב אוֹתְךָ! 💡
                    </div>
                `;
            }
            
            // מעבר לשאלה הבאה
            setTimeout(() => {
                currentQuestionIndex++;
                renderQuestion(currentQuestionIndex);
            }, 3000);
        }

        // פונקציה לבדיקת סיום שיעור
        function checkLessonCompletion() {
            const questionsContainer = document.getElementById('questionsContainer');
            const requiredScore = 2; // צריך 2 מתוך 3 נכון
            
            if (lessonScore >= requiredScore) {
                // הצלחה
                playNotes([261.63, 329.63, 392.00, 523.25, 392.00, 329.63]); // C-E-G-C-G-E
                
                const successMessages = [
                    `מַדְהִים, ${userName}! 🏆 אַתָּה שׁוֹלֵט! אַתָּה חַי בְּאַהֲבַת ה'! 🎉`,
                    `כִּמְעַט מֻשְׁלָם, ${userName}! 💪 מַמָּשׁ כְּמוֹ בָּאַהֲבָה — מַמְשִׁיךְ לִצְמוֹחַ! 🌱`
                ];
                
                questionsContainer.innerHTML = `
                    <div class="feedback correct" style="text-align: center; font-size: 1.4em;">
                        <div style="margin-bottom: 20px;">${successMessages[lessonScore === 3 ? 0 : 1]}</div>
                        <div>עָנִיתָ נָכוֹן עַל ${lessonScore} מִתּוֹךְ 3 שְׁאֵלוֹת! ✨</div>
                    </div>
                    <button class="btn-primary" onclick="renderLesson(${currentLesson + 1})">
                        🚀 מוּכָן לְשִׁיעוּר הַבָּא! 🚀
                    </button>
                `;
            } else {
                // צריך לחזור
                questionsContainer.innerHTML = `
                    <div class="feedback incorrect" style="text-align: center; font-size: 1.4em;">
                        <div style="margin-bottom: 20px;">בּוֹא נְנַסֶּה שׁוּב, ${userName}! 💪</div>
                        <div>עָנִיתָ נָכוֹן עַל ${lessonScore} מִתּוֹךְ 3. צָרִיךְ לְפַחוֹת 2 נְכוֹנוֹת.</div>
                        <div style="margin-top: 15px;">בָּאַהֲבָה וּבְסַבְלָנוּת - נַצְלִיחַ! הַשֵּׁם אוֹהֵב אוֹתְךָ! 💖</div>
                    </div>
                    <button class="btn-primary" onclick="renderLesson(${currentLesson})">
                        🔄 בּוֹא נְנַסֶּה שׁוּב בְּאַהֲבָה! 🔄
                    </button>
                `;
            }
        }

        // פונקציה להצגת תעודה
        function showCertificate() {
            playNotes([261.63, 329.63, 392.00, 523.25, 392.00, 329.63]); // C-E-G-C-G-E
            
            const percentage = Math.round((score / 12) * 100);
            const container = document.getElementById('gameContainer');
            
            container.innerHTML = `
                <div class="certificate">
                    <h2>🏆 תְּעוּדַת הִצְטַיְּנוּת 🏆</h2>
                    <div style="font-size: 1.5em; margin: 20px 0;">
                        מוּעֲנֶקֶת בְּגַאֲוָה לְ:
                    </div>
                    <div class="name">${userName}</div>
                    <div style="font-size: 1.3em; margin: 20px 0; color: #2d3436;">
                        שֶׁסִּיֵּם בְּהַצְלָחָה אֶת מִשְׂחַק הַלִּמּוּד
                    </div>
                    <div style="font-size: 1.5em; font-weight: bold; color: #764ba2;">
                        ״נַעֲשֶׂה וְנִשְׁמָע - סוֹד הָאֱמוּן בְּאַבָּא״
                    </div>
                    <div class="score">
                        הַצִּיּוּן שֶׁלְּךָ: ${score}/12 (${percentage}%)
                    </div>
                    <div style="margin: 25px 0; padding: 20px; background: rgba(255,255,255,0.7); border-radius: 10px;">
                        <div style="font-size: 1.2em; font-weight: bold; color: #0984e3; margin-bottom: 10px;">
                            💫 פָּסוּק לְזִכָּרוֹן 💫
                        </div>
                        <div style="font-size: 1.3em; color: #2d3436;">
                            ״וְאָהַבְתָּ אֵת ה' אֱלֹקֶיךָ בְּכָל לְבָבְךָ וּבְכָל נַפְשְׁךָ וּבְכָל מְאֹדֶךָ״
                        </div>
                    </div>
                </div>
                
                <div class="reflection-questions">
                    <h3>🤔 שְׁאֵלוֹת לְמַחְשָׁבָה:</h3>
                    <ul>
                        <li>אֵיךְ אוּכַל לְהָבִיא יוֹתֵר אַהֲבַת ה' לַלִּמּוּד הַבָּא שֶׁלִּי?</li>
                        <li>אֵיזוֹ מִצְוָה אֲנִי רוֹצֶה לְקַיֵּם הַיּוֹם מִתּוֹךְ שִׂמְחָה?</li>
                        <li>אֵיךְ אֲנִי מַרְגִּישׁ אֶת הָאֱמוּן שֶׁלִּי בַּקָּדוֹשׁ בָּרוּךְ הוּא?</li>
                    </ul>
                </div>
                
                <div class="lottery-box">
                    <div style="font-size: 1.8em; font-weight: bold; margin-bottom: 15px;">
                        🎉 מַזָּל טוֹב, ${userName}! 🎉
                    </div>
                    <div style="font-size: 1.3em; margin-bottom: 10px;">
                        נִכְנַסְתָּ לְהַגְרָלָה נוֹשֵׂאת פְּרָסִים! 🎁
                    </div>
                    <a href="https://forms.gle/A66uubei4XSX6SG2A" target="_blank">
                        📋 לְרִשּׁוּם לַהַגְרָלָה - לְחַץ כָּאן! 🎯
                    </a>
                </div>
                
                <div class="contact-info">
                    נִבְנָה בְּאַהֲבָה עַל יְדֵי:<br>
                    הָרַב יְהוּדָה טָאוּב מִקִּרְיַת אַתָּא<br>
                    📞 לִפְרָטִים: 0527139520
                </div>
            `;
            
            // שליחת ציון אוטומטית
            sendScoreToTeacher();
        }

        // התחלה
        renderIntro();
    </script>
</body>
