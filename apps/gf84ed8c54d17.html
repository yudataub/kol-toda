        // --- פונקציות עזר ---
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        async function sendScore() {
            if (!SCRIPT_URL) {
                console.log("Score sending skipped (no URL). Name: " + userName + ", Score: " + score);
                return;
            }
            try {
                // Note: The Google Apps Script endpoint must be deployed to allow requests from this origin and handle the POST data.
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    cache: 'no-cache',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: userName, score: score, total: gameData.reduce((sum, lesson) => sum + lesson.questions.length, 0) })
                });
                console.log("Score sent successfully.");
            } catch (error) {
                console.error('Error sending score:', error);
            }
        }
        
        function updateProgressBar() {
            const totalQuestions = gameData.reduce((acc, lesson) => acc + lesson.questions.length, 0);
            const answeredQuestions = gameData.slice(0, currentLessonIndex).reduce((acc, lesson) => acc + lesson.questions.length, 0) + currentQuestionIndex;
            const progress = (answeredQuestions / totalQuestions) * 100;
            const progressBar = document.querySelector('.progress-bar');
            if (progressBar) {
                progressBar.style.width = `${progress}%`;
            }
        }

        // --- לוגיקת תצוגה ---
        function displayWelcomeScreen() {
            gameContainer.innerHTML = `

                    <input type="text" id="nameInput" placeholder="הַכְנֵס אֶת שִׁמְךָ...">
                    <button class="primary-button" id="startBtn">בּוֹא נַתְחִיל! 💪</button>
                    <div id="introContainer" style="display: none; margin-top: 1.5em;"></div>
                </div>
            `;

            const startBtn = document.getElementById('startBtn');
            const nameInput = document.getElementById('nameInput');
            const introContainer = document.getElementById('introContainer');

            startBtn.addEventListener('click', () => {
                userName = nameInput.value.trim();
                if (userName === '') {
                    alert('נָא לְהַכְנִיס שֵׁם כְּדֵי לְהַתְחִיל.');
                    return;
                }
                nameInput.style.display = 'none';
                startBtn.style.display = 'none';
                
                introContainer.innerHTML = `
                    <p>בָּרוּךְ הַבָּא, <strong>${userName}</strong>! 🌟 הָיִיתָ מַאֲמִין שֶׁהָאֹכֶל שֶׁלְּךָ הוּא מַפְתֵּחַ סוֹדִי לִבְרָכָה וְאַהֲבָה? 💖 בַּמִּשְׂחָק הַזֶּה נְגַלֶּה יַחַד אֵיךְ יִצְחָק אָבִינוּ רָצָה לְהִתְחַבֵּר לְבָנָיו דֶּרֶךְ הָאֹכֶל, וְאֵיךְ גַּם אֲנַחְנוּ יְכוֹלִים לְהָפוֹךְ כָּל אֲרוּחָה לְהִזְדַּמְּנוּת שֶׁל קְרָבָה וְשֶׁפַע. מוּכָן לְהַרְפַּתְקָה טְעִימָה וְרוּחָנִית? ✨</p>
                    <button class="primary-button" id="continueToLessonBtn">הֵבַנּוּ, נַמְשִׁיךְ לַשִּׁעוּר הָרִאשׁוֹן</button>

                introContainer.style.display = 'block';

                document.getElementById('continueToLessonBtn').addEventListener('click', () => {
                    displayLesson(currentLessonIndex);
                });
            });
        }
        
        function displayLesson(lessonIndex) {
            const lesson = gameData[lessonIndex];
            gameContainer.innerHTML = `
                <div class="lesson-container">
                    <h2>שִׁעוּר ${lessonIndex + 1}/${gameData.length}: ${lesson.title}</h2>
                    <div class="progress-bar-container"><div class="progress-bar"></div></div>
                    <p>${lesson.content}</p>
                    <div class="inspirational-question">
                        <strong>שְׁאֵלָה לְהַשְׁרָאָה:</strong>
                        <p>${lesson.inspirationalQuestion}</p>
                    </div>
                     <h3>מִשְׁפָּטִים לְחִזּוּק:</h3>
                    <ul class="reinforcing-sentences">
                        ${lesson.reinforcingSentences.map(sentence => `<li>${sentence}</li>`).join('')}
                    </ul>
                    <button class="primary-button" id="startQuestionsBtn">אֲנִי מוּכָן לַשְּׁאֵלוֹת! 🤓</button>
                </div>
            `;
             updateProgressBar();
            
            document.getElementById('startQuestionsBtn').addEventListener('click', () => {
                displayQuestion(lessonIndex, 0);
            });
        }
        
        function displayQuestion(lessonIndex, questionIndex) {
            const lesson = gameData[lessonIndex];
            const question = lesson.questions[questionIndex];
            
            const answersWithStatus = question.answers.map((answer, index) => ({
                text: answer,
                isCorrect: index === 0
            }));
            shuffleArray(answersWithStatus);

            gameContainer.innerHTML = `
                <div class="question-container">
                    <h2>שִׁעוּר ${lessonIndex + 1}/${gameData.length}: ${lesson.title}</h2>
                    <div class="progress-bar-container"><div class="progress-bar"></div></div>
                    <h3>שְׁאֵלָה ${questionIndex + 1}/${lesson.questions.length}</h3>
                    <p>${question.questionText}</p>
                    <div id="answersContainer">
                        ${answersWithStatus.map(answer => `
                            <button class="answer-btn" data-correct="${answer.isCorrect}">${answer.text}</button>
                        `).join('')}
                    </div>
                    <div id="feedbackContainer"></div>
                </div>
            `;
            updateProgressBar();
            
            const answerButtons = document.querySelectorAll('.answer-btn');
            answerButtons.forEach(button => {
                button.addEventListener('click', (e) => {
                    handleAnswerClick(e, question.explanation, question.message);
                });
            });
        }
        
        function handleAnswerClick(event, explanation, message) {
            const clickedButton = event.target;
            const isCorrect = clickedButton.dataset.correct === 'true';
            const feedbackContainer = document.getElementById('feedbackContainer');
            const allButtons = document.querySelectorAll('.answer-btn');
            
            allButtons.forEach(btn => {
                btn.disabled = true;
                if (btn.dataset.correct === 'true') {
                    btn.classList.add('correct-answer');
                }
            });
            
            let feedbackHTML;
            if (isCorrect) {
                score++;
                clickedButton.classList.add('correct-selection');
                feedbackHTML = `
                    <div class="feedback correct">
                        <h4>${message}</h4>
                        <p>${explanation}</p>
                    </div>`;
            } else {
                clickedButton.classList.add('incorrect-selection');
                feedbackHTML = `
                    <div class="feedback incorrect">
                        <h4>תְּשׁוּבָה שְׁגוּיָה... 😔</h4>
                        <p>${explanation}</p>
                    </div>`;
            }
            feedbackContainer.innerHTML = feedbackHTML;

            // Add self-paced navigation button
            const isLastQuestionInLesson = currentQuestionIndex === gameData[currentLessonIndex].questions.length - 1;
            const isLastLesson = currentLessonIndex === gameData.length - 1;

            let nextButtonText = 'לַשְּׁאֵלָה הַבָּאָה';
            if (isLastQuestionInLesson && !isLastLesson) {
                nextButtonText = 'נַמְשִׁיךְ לַשִּׁעוּר הַבָּא';
            } else if (isLastQuestionInLesson && isLastLesson) {
                nextButtonText = 'לְסִיּוּם הַמִּשְׂחָק';
            }
            
            const feedbackDiv = feedbackContainer.querySelector('.feedback');
            feedbackDiv.innerHTML += `<button class="primary-button" id="nextBtn" style="margin-top: 1em;">${nextButtonText}</button>`;

            document.getElementById('nextBtn').addEventListener('click', () => {
                currentQuestionIndex++;
                if (currentQuestionIndex < gameData[currentLessonIndex].questions.length) {
                    displayQuestion(currentLessonIndex, currentQuestionIndex);
                } else {
                    currentLessonIndex++;
                    currentQuestionIndex = 0;
                    if (currentLessonIndex < gameData.length) {
                        displayLesson(currentLessonIndex);
                    } else {
                        displayFinalScreen();
                    }
                }
            });
        }

        function displayFinalScreen() {
            const totalQuestions = gameData.reduce((sum, lesson) => sum + lesson.questions.length, 0);
            gameContainer.innerHTML = `
                <div class="final-screen">
                    <div class="certificate">
                        <h1>כָּל הַכָּבוֹד, ${userName}! 🎉</h1>
                        <p>סִיַּמְתָּ אֶת הַמִּשְׂחָק בְּהַצְלָחָה וְגִלִּיתָ אֶת הַסּוֹדוֹת הַמֻּפְלָאִים שֶׁל הַקֶּשֶׁר בֵּין אֹכֶל, אַהֲבָה וּבְרָכָה.</p>
                        <div class="final-score">הַצִּיּוּן שֶׁלְּךָ: ${score}/${totalQuestions}</div>

                            <li>אֶת מִי אֲנִי רוֹצֶה לְבָרֵךְ 'מִכָּל הַלֵּב' הַשָּׁבוּעַ, וְאֵיךְ אֶעֱשֶׂה זֹאת?</li>

                    <p><strong>נִכְנַסְתָּ לְהַגְרָלָה נוֹשֵׂאת פְּרָסִים!</strong> 🎁</p>
                    <a href="https://forms.gle/A66uubei4XSX6SG2A" target="_blank" class="lottery-link">
                        📋 לְרִישׁוּם לַהַגְרָלָה - לְחַץ כָּאן!
                    </a>
                </div>
                                        
                        <div class="contact-info">
                            <p>לִשְׁאֵלוֹת וּלְהֶאָרוֹת: הָרַב יְהוּדָה טַאוּבּ, 📞 0527139520</p>
                        </div>
                    </div>
                </div>
            `;
            sendScore();
        }

        // --- התחלת המשחק ---
        window.onload = displayWelcomeScreen;
