<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f0f4f8;color:#1e293b;direction:rtl}
header{background:linear-gradient(135deg,#1e3a5f,#2d6a9f);color:#fff;padding:20px 24px;text-align:center}

.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tab{padding:6px 14px;border:2px solid #e2e8f0;border-radius:20px;cursor:pointer;font-size:.85rem;transition:all .2s;background:#f8fafc;color:#475569;white-space:nowrap}
.tab:hover{border-color:#2d6a9f;color:#2d6a9f}
.tab.active{background:#2d6a9f;color:#fff;border-color:#2d6a9f}
.tab.truma{border-color:#d97706}
.tab.truma.active{background:#d97706;border-color:#d97706}
.tab.tetzave{border-color:#7c3aed}
.tab.tetzave.active{background:#7c3aed;border-color:#7c3aed}
#status{margin-top:8px;font-size:.82rem;color:#64748b}
.page{max-width:1400px;margin:0 auto;padding:16px}
.section{margin-bottom:28px}
.section-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:8px 14px;border-radius:8px;color:#fff;font-weight:bold;font-size:1rem}
.section-header .badge{background:rgba(255,255,255,.25);border-radius:12px;padding:2px 10px;font-size:.8rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.card{background:#fff;border-radius:10px;padding:12px 14px;border:1px solid #e2e8f0;transition:box-shadow .2s,transform .2s;cursor:pointer;text-decoration:none;display:block;color:inherit}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.12);transform:translateY(-2px)}
.card-top{display:flex;align-items:flex-start;gap:8px}
.card-icon{font-size:1.4rem;line-height:1;flex-shrink:0;margin-top:2px}
.card-title{font-size:.88rem;line-height:1.4;word-break:break-word;flex:1}
.card-badges{margin-top:8px;display:flex;gap:5px;flex-wrap:wrap}
.badge-p{font-size:.72rem;padding:2px 8px;border-radius:10px;font-weight:bold}
.badge-truma{background:#fef3c7;color:#92400e}
.badge-tetzave{background:#ede9fe;color:#5b21b6}
.badge-cat{font-size:.72rem;padding:2px 8px;border-radius:10px;background:#f1f5f9;color:#475569}
#nores{display:none;text-align:center;padding:60px 20px;color:#94a3b8;font-size:1.1rem}

function setFilter(v, btn) {
  activeFilter = v;
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function fileUrl(id) { return 'https://drive.google.com/file/d/' + id + '/view'; }

var EXT_ICON = {pdf:'📜',doc:'📝',docx:'📝',docm:'📝',
  ppt:'📊',pptx:'📊',jpg:'🖼',jpeg:'🖼',gif:'🖼',
  png:'🖼',mp3:'🎵',mp4:'🎬',rtf:'📝'};
function icon(ext){ return EXT_ICON[(ext||'').toLowerCase()] || '📄'; }

function render() {
  var q = document.getElementById('search').value.trim().toLowerCase();
  var items = DATA.filter(function(f) {
    if (activeFilter === 'truma' && f.parasha !== 'תרומה') return false;
    if (activeFilter === 'tetzave' && f.parasha !== 'תצוה') return false;
    if (activeFilter !== 'all' && activeFilter !== 'truma' && activeFilter !== 'tetzave') {
      if (f.category !== activeFilter) return false;
    }
    if (q) return f.title.toLowerCase().indexOf(q) !== -1;
    return true;
  });

  document.getElementById('status').textContent = 'מוצגים ' + items.length + ' קבצים';

  if (!items.length) {
    document.getElementById('container').innerHTML = '';
    document.getElementById('nores').style.display = 'block';
    return;
  }
  document.getElementById('nores').style.display = 'none';

  var bySection = {};
  items.forEach(function(f) {
    var key = f.parasha + ' | ' + f.category;
    if (!bySection[key]) bySection[key] = {parasha: f.parasha, category: f.category, files: []};
    bySection[key].files.push(f);
  });

  var html = '';
  Object.keys(bySection).sort().forEach(function(k) {
    var sec = bySection[k];
    var col = CAT_COLOR[sec.category] || '#374151';
    var pcls = sec.parasha === 'תרומה' ? 'תרומה' : 'תצוה';
    html += '<div class="section">';
    html += '<div class="section-header" style="background:' + col + '">';
    html += '<span>' + sec.parasha + ' &mdash; ' + sec.category + '</span>';
    html += '<span class="badge">' + sec.files.length + '</span></div>';
    html += '<div class="grid">';
    sec.files.forEach(function(f) {
      var pbadge = sec.parasha === 'תרומה'
        ? '<span class="badge-p badge-truma">תרומה</span>'
        : '<span class="badge-p badge-tetzave">תצוה</span>';
      html += '<a class="card" href="' + fileUrl(f.id) + '" target="_blank">';
      html += '<div class="card-top">';
      html += '<span class="card-icon">' + icon(f.ext) + '</span>';
      html += '<span class="card-title">' + f.title + '</span></div>';
      html += '<div class="card-badges">' + pbadge;
      html += '<span class="badge-cat">' + f.category + '</span></div>';
      html += '</a>';
    });
    html += '</div></div>';
  });
  document.getElementById('container').innerHTML = html;
}

render();
</script>
</body>
</html>
