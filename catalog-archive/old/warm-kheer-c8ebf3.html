const categories = [
"תפילה ואמונה","שירי בוקר והשכמה","שירי שמחה וזמר","שירי ילדים ובית ספר",
"חגים - חנוכה","חגים - פורים ואדר","חגים - סוכות ותשרי","חגים - אלול וימים נוראים",
"חגים - ניסן ופסח","ירושלים וארץ ישראל","אזעקות ותרגולים","חיזוק ותפילה למלחמה",
"שבוע השפה העברית","הנני - תפילה באהבה","ראש חודש וחודשי השנה","עין טובה",
"שבוע עליה","שבת","מסמכים"
];

const container = document.getElementById('container');
const catNav = document.getElementById('catNav');
const totalLine = document.getElementById('totalLine');
const countsEl = document.getElementById('counts');
totalLine.textContent = `סה"כ ${files.length} פריטים ב-${categories.length} קטגוריות`;
container.innerHTML = '';
catNav.innerHTML = '';

// group
const allTracks = [];
const groups = {};
categories.forEach(c=>groups[c]=[]);
files.forEach(f=>{
  const cat = f[2];
  if(!groups[cat]) groups[cat]=[];
  groups[cat].push(f);
});

categories.forEach((cat,idx)=>{
  const items = groups[cat];
  if(!items || items.length===0) return;
  const catDiv = document.createElement('div');
  catDiv.className = 'category cat-'+(idx%20);
  catDiv.dataset.cat = cat;

  const header = document.createElement('div');
  header.className='category-header';
  header.innerHTML = `<span>${cat}</span><span class="hdrRight"><button class="catPlayBtn" data-cat="${cat}">▶ נגן קטגוריה</button><span class="cnt">${items.length} פריטים</span></span>`;
  catDiv.appendChild(header);
  catDiv.id = 'cat-'+idx;

  const gradients = [
    'linear-gradient(135deg,#ff7e5f,#feb47b)','linear-gradient(135deg,#36d1dc,#5b86e5)',
    'linear-gradient(135deg,#42e695,#3bb2b8)','linear-gradient(135deg,#f6d365,#fda085)',
    'linear-gradient(135deg,#a18cd1,#fbc2eb)','linear-gradient(135deg,#84fab0,#8fd3f4)',
    'linear-gradient(135deg,#fa709a,#fee140)','linear-gradient(135deg,#30cfd0,#330867)',
    'linear-gradient(135deg,#ff9a9e,#fad0c4)','linear-gradient(135deg,#a8edea,#fed6e3)',
    'linear-gradient(135deg,#ffecd2,#fcb69f)','linear-gradient(135deg,#667eea,#764ba2)',
    'linear-gradient(135deg,#f093fb,#f5576c)','linear-gradient(135deg,#4facfe,#00f2fe)',
    'linear-gradient(135deg,#43e97b,#38f9d7)','linear-gradient(135deg,#fbc2eb,#a6c1ee)',
    'linear-gradient(135deg,#fdcbf1,#e6dee9)','linear-gradient(135deg,#c79081,#dfa579)',
    'linear-gradient(135deg,#ee9ca7,#ffdde1)','linear-gradient(135deg,#2c3e50,#4ca1af)'
  ];
  const chip = document.createElement('span');
  chip.className = 'chip';
  chip.style.background = gradients[idx%20];
  chip.innerHTML = `${cat}<span class="n"> (${items.length})</span>`;
  chip.addEventListener('click', ()=>{
    document.getElementById('cat-'+idx).scrollIntoView({block:'start'});
  });
  catNav.appendChild(chip);

  const itemsDiv = document.createElement('div');
  itemsDiv.className='category-items';

  items.forEach(it=>{
    const [title,id,,isPdf,lyrics] = it;
    const item = document.createElement('div');
    item.className='item';
    item.dataset.search = (title+' '+cat+' '+(lyrics||'')).toLowerCase();
    const badge = isPdf ? '<span class="badge-doc">מסמך</span>' : '';
    const lyricsHtml = lyrics ? `<div class="lyrics">${lyrics}</div>` : '';
    const playBtnHtml = isPdf ? '' : `<button class="playBtn" title="נגן מכאן">▶</button>`;
    item.innerHTML = `<div class="title-wrap"><span class="title">${badge}${title}</span>${lyricsHtml}</div><div class="btnGroup">${playBtnHtml}<a class="play" target="_blank" href="https://drive.google.com/file/d/${id}/view">${isPdf?'📄 פתח בדרייב':'פתח בדרייב'}</a></div>`;

// ---- player ----
const audioPlayer = document.getElementById('audioPlayer');
const playerFrame = document.getElementById('playerFrame');
const playerBar = document.getElementById('playerBar');
const pTitle = document.getElementById('pTitle');
const pCat = document.getElementById('pCat');
const pStatus = document.getElementById('pStatus');
const pPos = document.getElementById('pPos');
const prevBtn = document.getElementById('prevBtn');
const toggleBtn = document.getElementById('toggleBtn');
const nextBtn = document.getElementById('nextBtn');
const closeBtn = document.getElementById('closeBtn');

let queue = [];
let queueIndex = -1;
let fallbackTimer = null;

// modern direct-content link that bypasses Drive's "can't scan for viruses" interstitial
function driveDirectUrl(id){ return `https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t`; }
function driveEmbedUrl(id){ return `https://drive.google.com/file/d/${id}/preview`; }

// best-effort: parse a clip length in seconds from the title, used only as a safety-net
// for the manual-click fallback (real playback uses the actual 'ended' event)
function parseDurationSeconds(title){
  let m = title.match(/(\d+)\s*שניות/);
  if(m) return Math.min(Math.max(+m[1],5),300);
  m = title.match(/(\d+)\s*דקות/);
  if(m) return Math.min(Math.max(+m[1]*60,5),300);
  if(/דקה\s*וחצי/.test(title)) return 90;
  if(/דקה/.test(title)) return 60;
  m = title.match(/(\d+)\s*$/);
  if(m) return Math.min(Math.max(+m[1],5),300);
  return 35;
}

function clearPlayingHighlight(){
  document.querySelectorAll('.item.playing').forEach(el=>el.classList.remove('playing'));
}

function playQueue(list, startIndex){
  queue = list;
  queueIndex = startIndex;
  playCurrent();
}

function useFallbackFrame(track){
  playerFrame.classList.add('show');
  playerFrame.src = driveEmbedUrl(track.id);
  document.body.classList.add('frameShown');
  pStatus.textContent = 'לא ניתן לנגן אוטומטית - לחץ ▶ בנגן שמופיע למטה';
  clearTimeout(fallbackTimer);
  const secs = parseDurationSeconds(track.title);
  fallbackTimer = setTimeout(playNext, (secs+3)*1000);
}

function playCurrent(){
  clearTimeout(fallbackTimer);
  if(queueIndex < 0 || queueIndex >= queue.length){ stopPlayer(); return; }
  const track = queue[queueIndex];
  clearPlayingHighlight();
  track.el.classList.add('playing');
  pTitle.textContent = track.title;
  pCat.textContent = track.cat;
  pStatus.textContent = 'מתחבר...';
  pPos.textContent = `${queueIndex+1} / ${queue.length}`;
  playerBar.classList.add('show');
  document.body.classList.add('playerActive');
  document.body.classList.remove('frameShown');
  playerFrame.classList.remove('show');
  playerFrame.src = '';
  toggleBtn.textContent = '⏸';

  audioPlayer.src = driveDirectUrl(track.id);
  const playPromise = audioPlayer.play();
  if(playPromise) playPromise.catch(()=>{ useFallbackFrame(track); });
}

function playNext(){
  if(queueIndex < queue.length-1){ queueIndex++; playCurrent(); }
  else { stopPlayer(); }
}
function playPrev(){
  if(queueIndex > 0){ queueIndex--; playCurrent(); }
}
function stopPlayer(){
  clearTimeout(fallbackTimer);
  audioPlayer.pause();
  audioPlayer.removeAttribute('src');
  playerFrame.src = '';
  clearPlayingHighlight();
  playerBar.classList.remove('show');
  document.body.classList.remove('playerActive','frameShown');
  queue = []; queueIndex = -1;
}

audioPlayer.addEventListener('ended', playNext);
audioPlayer.addEventListener('error', ()=>{
  if(queueIndex>=0 && queue[queueIndex]) useFallbackFrame(queue[queueIndex]);
});
audioPlayer.addEventListener('playing', ()=>{ pStatus.textContent = 'מנגן'; toggleBtn.textContent='⏸'; });
audioPlayer.addEventListener('pause', ()=>{ if(!audioPlayer.ended) toggleBtn.textContent='▶'; });
toggleBtn.addEventListener('click', ()=>{
  if(audioPlayer.paused){ audioPlayer.play().catch(()=>{}); }
  else { audioPlayer.pause(); }
});
prevBtn.addEventListener('click', playPrev);
nextBtn.addEventListener('click', playNext);
closeBtn.addEventListener('click', stopPlayer);

// category "play all" (event delegation, buttons created per category)
container.addEventListener('click', (e)=>{
  const btn = e.target.closest('.catPlayBtn');
  if(!btn) return;
  const cat = btn.dataset.cat;
  const catTracks = allTracks.filter(t=>t.cat===cat);
  if(catTracks.length) playQueue(catTracks, 0);
});

// global "play all visible" button
document.getElementById('playAllBtn').addEventListener('click', ()=>{
  const visibleTracks = allTracks.filter(t=>!t.el.classList.contains('hidden'));
  if(visibleTracks.length) playQueue(visibleTracks, 0);
});

const searchInput = document.getElementById('search');
function updateCounts(){
  const visible = document.querySelectorAll('.item:not(.hidden)').length;
  countsEl.textContent = `מציג ${visible} מתוך ${files.length} פריטים`;
}
searchInput.addEventListener('input', ()=>{
  const q = searchInput.value.trim().toLowerCase();
  document.querySelectorAll('.category').forEach(catDiv=>{
    let anyVisible = false;
    catDiv.querySelectorAll('.item').forEach(item=>{
      const match = item.dataset.search.includes(q);
      item.classList.toggle('hidden', !match);
      if(match) anyVisible = true;
    });
    catDiv.classList.toggle('hidden', !anyVisible);
  });
  updateCounts();
});
updateCounts();
</script>
