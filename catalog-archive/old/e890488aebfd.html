<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>קטלוג חומש דברים | שיעורי וידאו</title>
<style>
  :root {
    --sky-deep:    #1A6FB5;
    --sky-mid:     #3A9BD5;
    --sky-light:   #8FCFEE;
    --sky-pale:    #D6EFFA;
    --cloud-white: #F5FBFF;
    --sun-gold:    #F7C335;
    --sun-warm:    #FDAA1A;
    --slides-green:#1DA462;
    --slides-light:#D4F4E5;
    --text-dark:   #0D2E4A;
    --text-mid:    #2C5F7F;
    --text-muted:  #5A8BA8;
    --radius-sm:   6px;
    --radius-md:   12px;
    --shadow-card: 0 2px 12px rgba(26,111,181,0.10);
    --shadow-hover:0 6px 24px rgba(26,111,181,0.20);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI','Arial Hebrew',Arial,sans-serif; background: var(--cloud-white); color: var(--text-dark); min-height:100vh; }

  /* HERO */
  .hero {
    background: linear-gradient(160deg, var(--sky-deep) 0%, var(--sky-mid) 55%, var(--sky-light) 100%);
    padding: 48px 24px 56px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content:'';
    position:absolute; bottom:-2px; left:0; right:0;
    height:48px; background:var(--cloud-white);
    clip-path: ellipse(55% 100% at 50% 100%);
  }
  .hero::after {
    content:'☀';
    position:absolute; top:18px; left:32px;
    font-size:52px; color:var(--sun-gold);
    opacity:0.85; text-shadow:0 0 30px var(--sun-warm); line-height:1;
  }
  .hero-badge {
    display:inline-block; background:var(--sun-gold); color:var(--text-dark);
    font-size:13px; font-weight:700; letter-spacing:.08em;
    padding:4px 14px; border-radius:20px; margin-bottom:14px;
  }
  .hero h1 { font-size:clamp(28px,5vw,44px); font-weight:800; color:#fff; line-height:1.2; text-shadow:0 2px 8px rgba(0,0,0,.18); margin-bottom:10px; }
  .hero-sub { font-size:16px; color:var(--sky-pale); }

  /* SEARCH */
  .search-wrap { max-width:640px; margin:-28px auto 0; padding:0 20px; position:relative; z-index:10; }
  .search-wrap input {
    width:100%; padding:14px 18px 14px 48px;
    border:2px solid var(--sky-light); border-radius:40px;
    font-size:15px; background:#fff; color:var(--text-dark);
    direction:rtl; box-shadow:var(--shadow-card); outline:none;
    transition: border-color .2s, box-shadow .2s;
  }
  .search-wrap input:focus { border-color:var(--sky-mid); box-shadow:var(--shadow-hover); }
  .search-icon { position:absolute; left:36px; top:50%; transform:translateY(-50%); color:var(--sky-mid); font-size:18px; pointer-events:none; }

  /* STATS */
  .stats-bar { display:flex; justify-content:center; gap:32px; padding:28px 20px 0; flex-wrap:wrap; }
  .stat { text-align:center; }
  .stat-num { font-size:28px; font-weight:800; color:var(--sky-deep); line-height:1; }
  .stat-label { font-size:12px; color:var(--text-muted); margin-top:2px; }

  /* FILTERS */
  .filters { display:flex; flex-wrap:wrap; gap:8px; padding:22px 20px 8px; max-width:900px; margin:0 auto; justify-content:center; }
  .pill {
    background:var(--sky-pale); color:var(--text-mid);
    border:2px solid transparent; border-radius:20px;
    padding:6px 16px; font-size:13px; font-weight:600;
    cursor:pointer; transition:all .18s; white-space:nowrap;
  }
  .pill:hover, .pill.active { background:var(--sky-deep); color:#fff; border-color:var(--sky-deep); }

  /* GRID */
  .grid { max-width:980px; margin:24px auto 48px; padding:0 20px; display:grid; grid-template-columns:repeat(auto-fill, minmax(270px,1fr)); gap:16px; }

  /* CARD */
  .card {
    background:#fff; border-radius:var(--radius-md);
    box-shadow:var(--shadow-card); transition:transform .18s, box-shadow .18s;
    overflow:hidden; display:flex; flex-direction:column;
    border:1.5px solid var(--sky-pale);
  }
  .card:hover { transform:translateY(-3px); box-shadow:var(--shadow-hover); }
  .card-header {
    background:linear-gradient(120deg, var(--sky-deep) 0%, var(--sky-mid) 100%);
    padding:12px 16px 10px; display:flex; align-items:center; gap:10px;
  }
  .chapter-badge {
    background:var(--sun-gold); color:var(--text-dark);
    font-size:11px; font-weight:800; padding:2px 9px;
    border-radius:10px; white-space:nowrap; flex-shrink:0;
  }
  .card-title { color:#fff; font-size:13.5px; font-weight:700; line-height:1.35; flex:1; }
  .card-body { padding:12px 16px; flex:1; display:flex; flex-direction:column; gap:8px; }
  .verses-tag {
    display:inline-flex; align-items:center; gap:4px;
    background:var(--sky-pale); color:var(--text-mid);
    font-size:12px; font-weight:600; padding:3px 10px;
    border-radius:8px; width:fit-content;
  }
  .card-footer { padding:0 16px 14px; display:flex; flex-direction:column; gap:7px; }

  /* BUTTONS */
  .btn-row { display:flex; gap:7px; }
  .watch-btn, .slides-btn {
    display:flex; align-items:center; justify-content:center; gap:6px;
    text-decoration:none; padding:9px 10px;
    border-radius:var(--radius-sm); font-size:13px; font-weight:700;
    transition:background .18s, transform .12s; flex:1;
  }
  .watch-btn { background:var(--sky-mid); color:#fff; }
  .watch-btn:hover { background:var(--sky-deep); transform:scale(1.02); }
  .slides-btn { background:var(--slides-green); color:#fff; }
  .slides-btn:hover { background:#168A50; transform:scale(1.02); }

  /* no-slides label */
  .no-slides {
    display:inline-flex; align-items:center; gap:5px;
    font-size:11.5px; color:var(--text-muted);
    padding:4px 10px; border-radius:8px;
    background:#f0f0f0; width:fit-content;
  }

  /* SECTION LABELS */
  .section-label { grid-column:1/-1; display:flex; align-items:center; gap:10px; margin-top:12px; margin-bottom:4px; }
  .section-label-text { font-size:15px; font-weight:800; color:var(--sky-deep); white-space:nowrap; }
  .section-label-line { flex:1; height:2px; background:linear-gradient(to left, transparent, var(--sky-light)); border-radius:2px; }

  /* EMPTY */
  .empty-state { grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--text-muted); }

  /* LEGEND */
  .legend { display:flex; gap:16px; justify-content:center; flex-wrap:wrap; padding:14px 20px 0; font-size:12px; color:var(--text-mid); }
  .legend-item { display:flex; align-items:center; gap:5px; }
  .legend-dot { width:10px; height:10px; border-radius:3px; flex-shrink:0; }

  footer { text-align:center; padding:24px; font-size:12px; color:var(--text-muted); border-top:1px solid var(--sky-pale); }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-badge">📖 ספר דברים</div>
  <h1>קטלוג שיעורי וידאו<br>חומש דברים</h1>
  <p class="hero-sub">מרצה: יאיר ליברמן | כיתה ו</p>
</div>

<div class="search-wrap">
  <span class="search-icon">🔍</span>
  <input type="text" id="searchInput" placeholder="חפש נושא, פרק, פסוק..." oninput="filterCards()">
</div>

<div class="stats-bar">
  <div class="stat"><div class="stat-num" id="totalCount">0</div><div class="stat-label">שיעורים</div></div>
  <div class="stat"><div class="stat-num" id="slidesCount">0</div><div class="stat-label">עם מצגת</div></div>
  <div class="stat"><div class="stat-num" id="visibleCount">0</div><div class="stat-label">מוצגים</div></div>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:var(--sky-mid)"></div> סרטון יוטיוב</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--slides-green)"></div> מצגת Google Slides</div>
</div>

<div class="filters" id="filters">

  <span class="pill" onclick="filterPill(this,'ה-ח')">פרקים ה–ח</span>
  <span class="pill" onclick="filterPill(this,'ט-יב')">פרקים ט–יב</span>
  <span class="pill" onclick="filterPill(this,'יג-יז')">פרקים יג–יז</span>
  <span class="pill" onclick="filterPill(this,'יח-כב')">פרקים יח–כב</span>
  <span class="pill" onclick="filterPill(this,'כג-כו')">פרקים כג–כו</span>
  <span class="pill" onclick="filterPill(this,'כז-לד')">פרקים כז–לד</span>
  <span class="pill" onclick="filterPill(this,'slides-only')">✅ עם מצגת בלבד</span>
</div>

<div class="grid" id="cardsGrid"></div>
<footer>קטלוג שיעורי חומש דברים — בית ספר נועם, קריית אתא</footer>

  { ch:"כד", range:"יז", topic:"מתנות עניים", url:"https://youtu.be/9_O_ZBx2_-o", slides:"", group:"כג-כו" },
  { ch:"כד-כה", range:"מצוות שונות", topic:"מצוות שונות", url:"https://youtu.be/eu08SX6GAxk", slides:"", group:"כג-כו" },
  { ch:"כה", range:"יא", topic:"תשלומי בושת ויושר במסחר", url:"https://youtu.be/0aKxu0V118s", slides:"", group:"כג-כו" },
  { ch:"כו", range:"א", topic:"מצוות ביכורים", url:"https://youtu.be/SGPqwkIWp_Q", slides:"https://docs.google.com/presentation/d/1THVzivPfmHdjsTTwqXDAchfQEWi7MTWZ/edit?usp=sharing", group:"כג-כו" },
  { ch:"כו", range:"טז", topic:"מערכת המשפט", url:"https://youtu.be/sPzdDefbSEo", slides:"", group:"כג-כו" },
  { ch:"כט-לא", range:"ניצבים-וילך", topic:"סיכום פרשיות ניצבים וילך", url:"https://www.youtube.com/watch?v=UOULXKOTeAk", slides:"https://docs.google.com/presentation/d/19YXrSKlrDV15P3vXywn3pz7Bd0eh87Mk/edit?usp=sharing", group:"כז-לד" },
  { ch:"לב", range:"האזינו", topic:"סיכום פרשת האזינו", url:"https://www.youtube.com/watch?v=o1NgHmsG9B0", slides:"https://docs.google.com/presentation/d/1ptgZ0yYVjc0Zrxf_O8RwdpmfQzVNgnFS/edit?usp=sharing", group:"כז-לד" },
  { ch:"לג", range:"א", topic:"סיכום פרשת וזאת הברכה", url:"https://youtu.be/7WM_ozCvL-E", slides:"https://docs.google.com/presentation/d/1GhhrxJv5HN68Jnmi1OYDQGFn548fOoDq/edit?usp=sharing", group:"כז-לד" },
];

const withSlides = LESSONS.filter(l => l.slides).length;
document.getElementById('totalCount').textContent  = LESSONS.length;
document.getElementById('slidesCount').textContent = withSlides;
document.getElementById('visibleCount').textContent = LESSONS.length;

let activeGroup = 'all';
let searchTerm  = '';

function playIcon() {
  return `<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
}
function slidesIcon() {
  return `<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3l5 9H7l5-9z"/></svg>`;
}

function renderCards() {
  const grid = document.getElementById('cardsGrid');
  grid.innerHTML = '';

  const filtered = LESSONS.filter(l => {
    const matchGroup = activeGroup === 'all' || l.group === activeGroup ||
                       (activeGroup === 'slides-only' && l.slides);
    const q = searchTerm.toLowerCase();
    const matchSearch = !q || l.topic.includes(q) || l.ch.includes(q) || l.range.includes(q);
    return matchGroup && matchSearch;
  });

  document.getElementById('visibleCount').textContent = filtered.length;

  if (!filtered.length) {
    grid.innerHTML = `<div class="empty-state"><div style="font-size:40px;margin-bottom:8px">☁️</div><div style="font-size:16px;font-weight:700;margin-bottom:4px">לא נמצאו תוצאות</div><div>נסה מילת חיפוש אחרת</div></div>`;
    return;
  }

  let lastCh = null;
  filtered.forEach(l => {
    if (activeGroup === 'all' && l.ch !== lastCh) {
      lastCh = l.ch;
      const lbl = document.createElement('div');
      lbl.className = 'section-label';
      lbl.innerHTML = `<span class="section-label-text">פרק ${l.ch}</span><div class="section-label-line"></div>`;
      grid.appendChild(lbl);
    }

    const slidesBtn = l.slides
      ? `<a class="slides-btn" href="${l.slides}" target="_blank" rel="noopener">${slidesIcon()} מצגת</a>`
      : `<span class="no-slides">אין מצגת</span>`;

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-header">
        <span class="chapter-badge">פרק ${l.ch}</span>
        <span class="card-title">${l.topic}</span>
      </div>
      <div class="card-body">
        <span class="verses-tag">📌 ${l.range}</span>
      </div>
      <div class="card-footer">
        <div class="btn-row">
          <a class="watch-btn" href="${l.url}" target="_blank" rel="noopener">${playIcon()} צפה בסרטון</a>
          ${slidesBtn}
        </div>
      </div>`;
    grid.appendChild(card);
  });
}

function filterCards() {
  searchTerm = document.getElementById('searchInput').value;
  renderCards();
}
function filterPill(el, group) {
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  activeGroup = group;
  renderCards();
}

renderCards();
</script>
</body>
</html>
