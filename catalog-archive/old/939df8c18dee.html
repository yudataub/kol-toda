<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🗂️ קטלוגים מדהימים</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --lavender:      #C9B8E8;
    --lavender-light:#E8DEFF;
    --lavender-deep: #9B7FD4;
    --purple:        #7B5EA7;
    --purple-dark:   #4E3578;
    --pink:          #F2C4D0;
    --pink-soft:     #FAE8EE;
    --cream:         #FAF8FF;
    --white:         #FFFFFF;
    --text-dark:     #2D1B5E;
    --text-mid:      #5A4080;
    --text-light:    #9B8AB8;
    --shadow-soft:   0 4px 24px rgba(123,94,167,0.13);
    --shadow-card:   0 2px 12px rgba(123,94,167,0.10);
    --radius:        18px;
    --radius-sm:     10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Heebo', sans-serif;
    background: linear-gradient(135deg, #F5F0FF 0%, #FFF0F5 50%, #F0EAFF 100%);
    min-height: 100vh;
    color: var(--text-dark);
  }

  /* ═══ HEADER ═══ */
  .hero {
    background: linear-gradient(135deg, var(--purple-dark) 0%, var(--purple) 50%, var(--lavender-deep) 100%);
    padding: 48px 24px 36px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 30% 50%, rgba(242,196,208,0.25) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 30%, rgba(201,184,232,0.2) 0%, transparent 50%);
  }
  .hero-petal {
    position: absolute;
    border-radius: 50% 0 50% 0;
    opacity: 0.10;
    background: var(--lavender-light);
  }
  .hero-petal:nth-child(1) { width:160px; height:160px; top:-40px; right:-30px; transform:rotate(25deg); }
  .hero-petal:nth-child(2) { width:100px; height:100px; bottom:-20px; left:40px; transform:rotate(-15deg); }
  .hero-petal:nth-child(3) { width:200px; height:80px; top:20px; left:-60px; transform:rotate(40deg); border-radius:50%; }

  .hero-content { position: relative; z-index: 1; }
  .hero-emoji { font-size: 52px; display:block; margin-bottom: 12px; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.2)); }
  .hero-title {
    font-size: clamp(26px, 5vw, 42px);
    font-weight: 900;
    color: var(--white);
    letter-spacing: -0.5px;
    line-height: 1.2;
  }
  .hero-sub {
    margin-top: 10px;
    font-size: 15px;
    font-weight: 300;
    color: var(--lavender-light);
    letter-spacing: 0.5px;
  }
  .hero-badge {
    display: inline-block;
    margin-top: 16px;
    background: rgba(255,255,255,0.18);
    border: 1px solid rgba(255,255,255,0.3);
    color: var(--white);
    font-size: 13px;
    padding: 5px 16px;
    border-radius: 20px;
    backdrop-filter: blur(8px);
  }

  /* ═══ TABS WRAPPER ═══ */
  .tabs-wrapper {
    max-width: 960px;
    margin: 0 auto;
    padding: 0 16px 60px;
  }

  /* ═══ TAB NAV ═══ */
  .tab-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 24px 0 0;
    justify-content: center;
  }

  .tab-btn {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 10px 20px;
    border: 2px solid transparent;
    border-radius: 40px;
    font-family: 'Heebo', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s ease;
    background: var(--white);
    color: var(--text-mid);
    box-shadow: var(--shadow-card);
    white-space: nowrap;
  }
  .tab-btn:hover {
    background: var(--lavender-light);
    color: var(--purple);
    border-color: var(--lavender);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(123,94,167,0.18);
  }
  .tab-btn.active {
    background: linear-gradient(135deg, var(--purple) 0%, var(--lavender-deep) 100%);
    color: var(--white);
    border-color: transparent;
    box-shadow: 0 6px 24px rgba(123,94,167,0.38);
    transform: translateY(-2px);
  }
  .tab-count {
    background: rgba(255,255,255,0.25);
    border-radius: 20px;
    padding: 1px 8px;
    font-size: 11px;
    font-weight: 700;
  }
  .tab-btn:not(.active) .tab-count {
    background: var(--lavender-light);
    color: var(--purple);
  }

  /* ═══ TAB PANELS ═══ */
  .tab-panel {
    display: none;
    animation: fadeIn 0.3s ease;
  }
  .tab-panel.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ═══ SECTION HEADER ═══ */
  .section-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 28px 0 16px;
    padding: 14px 20px;
    background: linear-gradient(135deg, var(--lavender-light) 0%, var(--pink-soft) 100%);
    border-radius: var(--radius-sm);
    border-right: 4px solid var(--lavender-deep);
  }
  .section-header-emoji { font-size: 22px; }
  .section-header-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--purple-dark);
  }
  .section-header-count {
    margin-right: auto;
    font-size: 12px;
    color: var(--text-light);
    background: var(--white);
    padding: 2px 10px;
    border-radius: 12px;
    font-weight: 600;
  }

  /* ═══ CARDS GRID ═══ */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 14px;
    margin-bottom: 8px;
  }

  .link-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: var(--white);
    border-radius: var(--radius-sm);
    text-decoration: none;
    color: var(--text-dark);
    box-shadow: var(--shadow-card);
    border: 1.5px solid transparent;
    transition: all 0.22s ease;
    position: relative;
    overflow: hidden;
  }
  .link-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--lavender-light) 0%, var(--pink-soft) 100%);
    opacity: 0;
    transition: opacity 0.22s ease;
  }
  .link-card:hover {
    border-color: var(--lavender);
    transform: translateY(-3px);
    box-shadow: 0 8px 28px rgba(123,94,167,0.18);
    color: var(--purple-dark);
  }
  .link-card:hover::before { opacity: 1; }

  .link-card-icon {
    position: relative;
    z-index: 1;
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--lavender) 0%, var(--pink) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    transition: transform 0.22s ease;
  }
  .link-card:hover .link-card-icon { transform: scale(1.1) rotate(-3deg); }

  .link-card-text {
    position: relative;
    z-index: 1;
    flex: 1;
    min-width: 0;
  }
  .link-card-title {
    font-size: 13.5px;
    font-weight: 600;
    line-height: 1.4;
    word-break: break-word;
  }
  .link-card-arrow {
    position: relative;
    z-index: 1;
    color: var(--lavender-deep);
    font-size: 16px;
    flex-shrink: 0;
    opacity: 0;
    transform: translateX(4px);
    transition: all 0.22s ease;
  }
  .link-card:hover .link-card-arrow {
    opacity: 1;
    transform: translateX(0);
  }

  /* External badge */
  .link-card-external {
    position: relative;
    z-index: 1;
    font-size: 9px;
    background: var(--pink);
    color: var(--purple-dark);
    padding: 2px 6px;
    border-radius: 6px;
    font-weight: 700;
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* ═══ DIVIDER ═══ */
  .petal-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 28px 0 0;
    color: var(--lavender);
    font-size: 18px;
  }
  .petal-divider::before, .petal-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--lavender), transparent);
  }

  /* ═══ RESPONSIVE ═══ */
  @media (max-width: 600px) {
    .cards-grid { grid-template-columns: 1fr; }
    .tab-btn { font-size: 12px; padding: 8px 14px; }
    .hero { padding: 32px 16px 28px; }
  }

  /* ═══ FOOTER ═══ */
  .footer {
    text-align: center;
    padding: 24px;
    color: var(--text-light);
    font-size: 12px;
    font-weight: 300;
  }
  .footer span { color: var(--lavender-deep); font-weight: 600; }
</style>

    function makeCard(item, base) {
      const url = item.external ? item.url : (base + item.path);
      const external = item.external
        ? `<span class="link-card-external">חיצוני</span>`
        : '';
      return `
        <a href="${url}" target="_blank" rel="noopener" class="link-card">
          <div class="link-card-icon">${item.icon}</div>
          <div class="link-card-text">
            <div class="link-card-title">${item.title}</div>
          </div>
          ${external}
          <span class="link-card-arrow">←</span>
        </a>`;
    }

    function makeSection(key) {
      const sec = DATA[key];
      const cards = sec.items.map(i => makeCard(i, BASE)).join('');
      return `
        <div class="section-header">
          <span class="section-header-emoji">${sec.emoji}</span>
          <span class="section-header-title">${sec.label}</span>
          <span class="section-header-count">${sec.items.length} קישורים</span>
        </div>
        <div class="cards-grid">${cards}</div>`;
    }

    function buildAll() {
      const keys = ['shinuyim','torah','alfonin','whatsapp','ezer','direct'];

      // Panel: all
      const allPanel = document.getElementById('panel-all');
      allPanel.innerHTML = keys.map((k,i) => {
        const divider = i > 0 ? `<div class="petal-divider">🌸</div>` : '';
        return divider + makeSection(k);
      }).join('');

      // Individual panels
      keys.forEach(k => {
        const panel = document.getElementById('panel-' + k);
        if (panel) panel.innerHTML = makeSection(k);
      });
    }

    function showTab(id) {
      // Hide all panels
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

      // Show selected
      document.getElementById('panel-' + id).classList.add('active');
      // Find the button that called this tab
      document.querySelectorAll('.tab-btn').forEach(b => {
        if (b.getAttribute('onclick') === `showTab('${id}')`) b.classList.add('active');
      });
    }

    window.addEventListener('DOMContentLoaded', buildAll);
  </script>
