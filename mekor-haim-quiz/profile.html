<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ההתקדמות שלי – חידוני הלכה</title>
<meta name="description" content="כמה הלכות למדתי וכמה נשארו – חידוני הלכה">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2340;--soft:#6b6385;--bg:#fff8f0}
*{box-sizing:border-box}
body{margin:0;font-family:Rubik,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.8}
.top{background:linear-gradient(120deg,#ff9a3c,#ff5e7e 55%,#7b5cff);color:#fff;text-align:center;padding:26px 16px;border-radius:0 0 28px 28px;position:relative}
.top h1{margin:0;font-size:1.8em}
.home-btn{position:absolute;top:10px;left:12px;background:rgba(255,255,255,.92);color:#5a3fd6;font-weight:700;font-size:.8em;
  text-decoration:none;padding:5px 12px;border-radius:30px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 40px}
.box{background:#fff;border-radius:18px;padding:18px 20px;margin:14px 0;box-shadow:0 4px 16px rgba(60,40,120,.10)}
.big{font-size:1.3em;font-weight:800;text-align:center}
.bar{height:22px;border-radius:12px;background:#f1edfa;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7b5cff,#ff5e7e);border-radius:12px;transition:width .6s}
.bar.q i{background:linear-gradient(90deg,#f59e0b,#7b5cff)}
.sub{text-align:center;color:var(--soft)}
.series{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f1edfa}
.series:last-child{border-bottom:0}
.series .t{flex:1}
.series .mini{height:9px;border-radius:5px;background:#f1edfa;overflow:hidden;margin-top:5px}
.series .mini i{display:block;height:100%;width:0;background:#7b5cff}
.series a.cta{flex:none;background:#7b5cff;color:#fff;text-decoration:none;padding:7px 14px;border-radius:30px;font-size:.85em;font-weight:700;white-space:nowrap}
.series .done{flex:none;color:#1d6b30;font-weight:700;white-space:nowrap}
.cta-big{display:block;text-align:center;background:linear-gradient(120deg,#7b5cff,#ff5e7e);color:#fff;text-decoration:none;
  font-weight:800;font-size:1.1em;padding:14px;border-radius:16px;margin-top:14px}
.prize{background:linear-gradient(135deg,#fff7e0,#ffe9c7);border:2px solid #f3c969;text-align:center}
.prize h2{margin-top:0}
.prize input{width:100%;padding:11px;border-radius:10px;border:1px solid #ddd;margin:8px 0;font-size:1.05em;box-sizing:border-box}
.prize button{background:#2f855a;color:#fff;border:0;padding:11px 26px;border-radius:30px;font-weight:700;font-size:1.05em;cursor:pointer}
.prize button:disabled{opacity:.6}
.prize .msg{font-weight:700;margin-top:10px;min-height:1.4em}
.empty{text-align:center;padding:36px 10px}
.empty a{color:#7b5cff;font-weight:700}
.kol-toda-sign{margin:26px 0 0;padding:16px 18px;border-radius:16px;background:linear-gradient(120deg,#eaf6ff,#f3ecff);border:2px solid #cfe0ff;text-align:center}
.kol-toda-sign a{color:#3d4fd6;font-weight:700}
</style>
<meta property="og:title" content="ההתקדמות שלי – חידוני הלכה">
<meta property="og:description" content="כמה הלכות למדתי וכמה נשארו – חידוני הלכה">
<meta property="og:image" content="https://yudataub.github.io/kol-toda-og/og/sr-mekor-haim-quiz-profile.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://www.kol-toda.co.il/mekor-haim-quiz/profile.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="הקול החמישי – יהודה טאוב">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://www.kol-toda.co.il/mekor-haim-quiz/profile.html">
<script async src="https://www.kol-toda.co.il/a.js"></script>
</head>
<body>
<header class="top">
  <a class="home-btn" href="./" title="חֲזָרָה לְכָל הַחִידוֹנִים">🏠 כָּל הַחִידוֹנִים</a>
  <h1>👤 הַהִתְקַדְּמוּת שֶׁלִּי</h1>
</header>
<main class="wrap">
  <div class="empty" id="empty" style="display:none">
    עֲדַיִן לֹא נִכְנַסְתָּ לְשׁוּם חִידוֹן 🙂<br><br>
    <a href="./">לְכוּ לִבְחֹר חִידוֹן רִאשׁוֹן ←</a>
  </div>
  <div id="content" style="display:none">
    <div class="box">
      <div class="big" id="headline"></div>
      <div class="bar"><i id="barH"></i></div>
      <div class="sub" id="halSub"></div>
      <div class="bar q" style="margin-top:16px"><i id="barQ"></i></div>
      <div class="sub" id="qSub"></div>
      <a class="cta-big" id="nextBtn" href="#"></a>
    </div>
    <div class="box prize" id="prizeBox" style="display:none"></div>
    <div class="box">
      <h2 style="margin-top:0">📚 לְפִי נוֹשֵׂא</h2>
      <div id="seriesList"></div>
    </div>
  </div>
  <div class="kol-toda-sign">📚 עוֹד חָמְרֵי לִמּוּד עַל הֲלָכָה – חִנָּם, בַּמַּאֲגָר הַקּוֹל הַחֲמִישִׁי:
    <a href="https://www.kol-toda.co.il/halacha/">kol-toda.co.il/halacha</a><br>
    הַמַּאֲגָר הַמָּלֵא: <a href="https://www.kol-toda.co.il/">kol-toda.co.il</a></div>
</main>
<script>
var API_URL = "https://script.google.com/macros/s/AKfycbxnmfZcen-MXI1Af0a61_m2awo_WIz19wcbWnl_pgywOYpj2f7kgT9T08icGmRV8Oa7/exec";
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function encourage(pct) {
  if (pct >= 100) return "סִיַּמְתָּ אֶת הַכֹּל!! 🏆";
  if (pct >= 90) return "עוֹד קֵטֶע קָטָן וְתַשְׁלִים הַכֹּל! 🔥";
  if (pct >= 75) return "כְּבָר שָׁלֹשׁ רְבִיעִיּוֹת מֵהַדֶּרֶךְ! 💪";
  if (pct >= 50) return "חֲצִי הַדֶּרֶךְ מֵאָחוֹר – יָפֶה מְאֹד! 🌟";
  if (pct >= 25) return "מַמְשִׁיכִים קָדִימָה, כֹּל הַכָּבוֹד! 🚀";
  if (pct > 0) return "הַתְחָלָה מְצֻיֶּנֶת!";
  return "בּוֹא נַתְחִיל לִלְמֹד הֲלָכוֹת! 📜";
}
(function () {
  var me = null;
  try { me = JSON.parse(localStorage.getItem("hq-me") || "null"); } catch (e) {}
  if (!me || !me.name || !API_URL) { document.getElementById("empty").style.display = "block"; return; }
  Promise.all([
    fetch(API_URL + "?action=me&name=" + encodeURIComponent(me.name) + "&cls=" + encodeURIComponent(me.cls || "") + "&school=" + encodeURIComponent(me.school || ""))
      .then(function (r) { return r.json(); }),
    fetch("progress.json").then(function (r) { return r.json(); })
  ]).then(function (res) {
    var d = res[0], p = res[1];
    if (!d || !d.ok) { document.getElementById("empty").style.display = "block"; return; }
    var done = d.games || {};

    function learnedSet(ids) {
      var s = {};
      ids.forEach(function (qid) { if (qid in done) (p.halachot[qid] || []).forEach(function (h) { s[h] = 1; }); });
      return s;
    }
    var learnedN = Object.keys(learnedSet(p.quizIds)).length;
    var totalQ = p.quizIds.length, doneQ = p.quizIds.filter(function (q) { return q in done; }).length;
    var pctH = p.total ? Math.round(100 * learnedN / p.total) : 0;

    document.getElementById("content").style.display = "block";
    document.getElementById("headline").textContent = "שָׁלוֹם, " + me.name + "! 🌟 " + encourage(pctH);
    document.getElementById("barH").style.width = pctH + "%";
    document.getElementById("halSub").textContent = "📜 " + learnedN + " מִתּוֹךְ " + p.total + " הֲלָכוֹת לָמַדְתָּ (" + pctH + "%)";
    document.getElementById("barQ").style.width = Math.round(100 * doneQ / totalQ) + "%";
    document.getElementById("qSub").textContent = "🎯 " + doneQ + " מִתּוֹךְ " + totalQ + " חִידוֹנִים הִשְׁלַמְתָּ";

    var next = p.quizIds.filter(function (q) { return !(q in done); })[0];
    var nextBtn = document.getElementById("nextBtn");
    if (next) {
      nextBtn.href = next + ".html";
      nextBtn.textContent = "✨ לַחִידוֹן הַבָּא: " + (p.quizTitles[next] || next);
    } else {
      nextBtn.style.display = "none";
      showPrize();
    }

    var list = document.getElementById("seriesList");
    p.series.forEach(function (s) {
      var sLearnedN = Object.keys(learnedSet(s.quizIds)).length;
      var sPct = s.full ? Math.round(100 * sLearnedN / s.full) : 100;
      var sNext = s.quizIds.filter(function (q) { return !(q in done); })[0];
      var row = document.createElement("div");
      row.className = "series";
      row.innerHTML = "<div class='t'><b>" + esc(s.title) + "</b><div class='mini'><i style='width:" + sPct + "%'></i></div></div>"
        + (sNext ? "<a class='cta' href='" + esc(sNext) + ".html'>הֶמְשֵׁךְ ←</a>" : "<span class='done'>✅ הוֹשְׁלַם</span>");
      list.appendChild(row);
    });
  }).catch(function () { document.getElementById("empty").style.display = "block"; });

  function showPrize() {
    var box = document.getElementById("prizeBox");
    box.style.display = "block";
    box.innerHTML = "<h2>🎉 סִיַּמְתָּ אֶת כֹּל הַחִידוֹנִים!</h2>"
      + "<p>אֵיזֶה כֹּחַ! עַכְשָׁו מַגִּיע לְךָ פְּרָס מְיֻחָד 🎁<br>כִּתְבוּ טֵלֵפוֹן שֶׁל הוֹרֶה כְּדֵי שֶׁנּוּכַל לְהַעֲבִיר אוֹתוֹ.</p>"
      + "<input id='pzPhone' type='tel' placeholder='טֵלֵפוֹן הוֹרֶה'>"
      + "<div><button id='pzSend'>שְׁלַח וְקַבֵּל פְּרָס 🎁</button></div>"
      + "<div class='msg' id='pzMsg'></div>";
    document.getElementById("pzSend").onclick = function () {
      var phone = document.getElementById("pzPhone").value.trim();
      var msg = document.getElementById("pzMsg"), btn = document.getElementById("pzSend");
      if (phone.replace(/\D/g, "").length < 7) { msg.style.color = "#c53030"; msg.textContent = "צָרִיךְ מִסְפָּר טֵלֵפוֹן תָּקִין"; return; }
      btn.disabled = true; msg.style.color = ""; msg.textContent = "שׁוֹלֵחַ...";
      fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ action: "prize", name: me.name, cls: me.cls || "", school: me.school || "", phone: phone }) })
        .then(function (r) { return r.json(); })
        .then(function (r) {
          if (r && r.ok) {
            msg.style.color = "#1d6b30";
            msg.textContent = r.already ? "כְּבָר קִבַּלְנוּ אֶת הַבַּקָּשָׁה שֶׁלְּךָ – תּוֹדָה! 💌" : "קִבַּלְנוּ! נִשְׁלַח אֶת הַפְּרָס בְּקָרוֹב 💌";
            btn.style.display = "none";
          } else {
            msg.style.color = "#c53030"; msg.textContent = "אֵרְעָה תְּקָלָה, נַסֵּה שׁוּב"; btn.disabled = false;
          }
        })
        .catch(function () { msg.style.color = "#c53030"; msg.textContent = "אֵין חִבּוּר, נַסֵּה שׁוּב"; btn.disabled = false; });
    };
  }
})();
</script>
</body>
</html>
