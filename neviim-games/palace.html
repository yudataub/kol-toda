ל מותני איש, כן הדבקתי אליי את כל בית ישראל... להיות לי לעם ולשם ולתהילה ולתפארת״.","url":"yirmiyahu/11.html"},{"key":"yirmiyahu","n":12,"title":"בונים: נמצאו דבריך ואוכלם","emoji":"📖","chapters":"ירמיהו פרקים יד-טו","know":"בימי בצורת קשה התפלל ירמיהו על העם: ״אם עוונינו ענו בנו, ה׳ עשה למען שמך״. ״מקווה ישראל, מושיעו בעת צרה... ואתה בקרבנו ה׳, ושמך עלינו נקרא, אל תניחנו״. ועל עצמו אמר: ״נמצאו דבריך ואוכלם, ויהי דברך לי לששון ולשמחת לבבי״.","url":"yirmiyahu/12.html"},{"key":"yirmiyahu","n":13,"title":"מיון: ברוך הגבר","emoji":"🌳","chapters":"ירמיהו פרק יז","know":"ירמיהו מתאר שני אנשים. ״ארור הגבר אשר יבטח באדם... והיה כערער בערבה״, שיח בודד במדבר. ״ברוך הגבר אשר יבטח בה׳... והיה כעץ שתול על מים, ועל יובל ישלח שורשיו... והיה עלהו רענן, ובשנת בצורת לא ידאג, ולא ימיש מעשות פרי״.","url":"yirmiyahu/13.html"},{"key":"yirmiyahu","n":14,"title":"מי רוצה להיות מיליונר: רפאני ה׳ וארפא","emoji":"💊","chapters":"ירמיהו פרקים טז-יז","know":"״רפאני ה׳ וארפא, הושיעני ואיוושעה, כי תהילתי אתה״. הפסוק הזה הוא המקור לברכת ״רפאנו״ בתפילת העמידה. ירמיהו מלמד גם על ה׳ ש״חוקר לב, בוחן כליות״, על שמירת השבת בשערי ירושלים, ועל גאולה עתידית שתהיה גדולה אפילו מיציאת מצרים.","url":"yirmiyahu/14.html"},{"key":"yirmiyahu","n":15,"title":"מסע: בבית היוצר","emoji":"🏺","chapters":"ירמיהו פרק יח","know":"ה׳ שלח את ירמיהו לבית היוצר, הקדר. היוצר עבד על האובניים, והכלי שעשה התקלקל בידו. הוא לא זרק את החומר, אלא ״שב ויעשהו כלי אחר״. ה׳ אמר: ״הנה כחומר ביד היוצר, כן אתם בידי בית ישראל״. אם עם שב מרעתו, ה׳ מבטל את הגזרה.","url":"yirmiyahu/15.html"},{"key":"yirmiyahu","n":16,"title":"חיבור נקודות: הבקבוק ופשחור","emoji":"🧴","chapters":"ירמיהו פרקים יט-כ","know":"ירמיהו קנה בקבוק חרס, יצא עם זקני העם אל גיא בן הינום, ושבר אותו לעיניהם: כלי חרס שנשבר אי אפשר לתקן. פשחור בן אימר הכהן, הפקיד בבית ה׳, היכה את ירמיהו ושם אותו במהפכת בשער בנימין. למחרת שחרר אותו, וירמיהו קרא לו: ״מגור מסביב״.","url":"yirmiyahu/16.html"},{"key":"yirmiyahu","n":17,"title":"שרידות: כאש בוערת בעצמותיי","emoji":"🔥","chapters":"ירמיהו פרק כ","know":"ירמיהו סבל מלעג כל היום, ורצה להפסיק: ״ואמרתי לא אזכרנו ולא אדבר עוד בשמו״. אבל לא הצליח: ״והיה בלבי כאש בוערת, עצור בעצמותיי, ונלאיתי כלכל ולא אוכל״. ועם כל הקושי הוא אומר: ״וה׳ אותי כגיבור עריץ״, ״שירו לה׳, הללו את ה׳, כי הציל את נפש אביון״.","url":"yirmiyahu/17.html"},{"key":"yirmiyahu","n":18,"title":"חיבור קווים: מלכי יהודה בימי ירמיהו","emoji":"👑","chapters":"ירמיהו פרקים כא-כב","know":"ירמיהו ניבא בימי חמישה מלכים. על יאשיהו הצדיק אמר: ״דן דין עני ואביון, אז טוב. הלוא היא הדעת אותי״. על שלום (יהואחז): ״בכו בכו להולך, כי לא ישוב עוד״. על יהויקים שבנה ארמון בעוול: ״הוי בונה ביתו בלא צדק״. ולבית המלך כולו: ״עשו משפט וצדקה, והצילו גזול מיד עושק״.","url":"yirmiyahu/18.html"},{"key":"yirmiyahu","n":19,"title":"בינגו: צמח צדיק","emoji":"🌿","chapters":"ירמיהו פרק כג","know":"״הוי רועים מאבדים ומפיצים את צאן מרעיתי״. ה׳ מבטיח לקבץ את שארית הצאן ולהקים רועים טובים. ״והקימותי לדוד צמח צדיק, ומלך מלך והשכיל... וזה שמו אשר יקראו: ה׳ צדקנו״. ועל נביאי השקר: ״מה לתבן את הבר?״ ״הלוא כה דברי כאש, וכפטיש יפוצץ סלע״.","url":"yirmiyahu/19.html"},{"key":"yirmiyahu","n":20,"title":"החלק: שני דודאי תאנים","emoji":"🧺","chapters":"ירמיהו פרק כד","know":"אחרי שנבוכדנאצר הגלה את יכניה (יהויכין) מלך יהודה, את השרים, החרש והמסגר, הראה ה׳ לירמיהו שני סלי תאנים לפני היכל ה׳: באחד תאנים טובות מאוד, ובשני רעות מאוד שאי אפשר לאכול. הטובות הן הגולים בבבל: ״ושמתי עיני עליהם לטובה... ונתתי להם לב לדעת אותי״. הרעות הן צדקיהו ושריו והנשארים.","url":"yirmiyahu/20.html"},{"key":"yirmiyahu","n":21,"title":"חדר בריחה: שבעים שנה","emoji":"⏳","chapters":"ירמיהו פרק כה","know":"בשנה הרביעית ליהויקים, היא השנה הראשונה לנבוכדנאצר מלך בבל, סיכם ירמיהו: עשרים ושלוש שנה אני מדבר אליכם ״ולא שמעתם״. לכן הארץ תהיה לחורבה, והגויים יעבדו את מלך בבל שבעים שנה. אחר כך גם בבל תיענש. ה׳ נתן לירמיהו ״כוס יין״ להשקות בה את כל הגויים.","url":"yirmiyahu/21.html"},{"key":"yirmiyahu","n":22,"title":"לוח משחק: משפטו של ירמיהו","emoji":"⚖️","chapters":"ירמיהו פרק כו","know":"בתחילת מלכות יהויקים עמד ירמיהו בחצר בית ה׳ ואמר: אם לא תשמעו, ״ונתתי את הבית הזה כשילה״. הכהנים והנביאים תפסו אותו: ״מות תמות״. ירמיהו ענה לשרים: ״ה׳ שלחני... ואני הנני בידכם״. השרים והעם פסקו: ״אין לאיש הזה משפט מוות״. זקנים הזכירו שגם מיכה המורשתי ניבא כך בימי חזקיהו ולא נענש. אחיקם בן שפן הגן על ירמיהו.","url":"yirmiyahu/22.html"},{"key":"yirmiyahu","n":23,"title":"סדר נכון: המוטות וחנניה בן עזור","emoji":"🐂","chapters":"ירמיהו פרקים כז-כח","know":"ה׳ ציווה על ירמיהו לשאת מוטות על צווארו, סימן שצריך לקבל את עול מלך בבל. חנניה בן עזור מגבעון, נביא שקר, הכריז בבית ה׳ שבעוד שנתיים ישובו כלי המקדש. ירמיהו ענה: ״אמן, כן יעשה ה׳״, אבל הזהיר שזו לא האמת. חנניה שבר את המוטה. ה׳ אמר: ״מוטות עץ שברת, ועשית תחתיהן מוטות ברזל״.","url":"yirmiyahu/23.html"},{"key":"yirmiyahu","n":24,"title":"אלבום: האיגרת לגולים","emoji":"✉️","chapters":"ירמיהו פרק כט","know":"ירמיהו שלח מירושלים מכתב לגולים בבבל: ״בנו בתים ושבו, ונטעו גנות... ודרשו את שלום העיר אשר הגליתי אתכם שמה, והתפללו בעדה אל ה׳״. ״לפי מלאת לבבל שבעים שנה אפקוד אתכם״. ״כי אנוכי ידעתי את המחשבות... מחשבות שלום ולא לרעה, לתת לכם אחרית ותקווה״.","url":"yirmiyahu/24.html"},{"key":"yirmiyahu","n":25,"title":"חשיפה: עת צרה ליעקב וממנה ייוושע","emoji":"🛟","chapters":"ירמיהו פרק ל","know":"כאן מתחיל ״ספר הנחמה״ של ירמיהו. ה׳ מצווה: ״כתוב לך את כל הדברים... אל ספר״. ״ועת צרה היא ליעקב, וממנה ייוושע״. ״ואתה אל תירא עבדי יעקב... כי הנני מושיעך מרחוק״. ״כי אעלה ארוכה לך וממכותייך ארפאך״. ״ונבנתה עיר על תילה״. ״והייתם לי לעם, ואנוכי אהיה לכם לאלוהים״.","url":"yirmiyahu/25.html"},{"key":"yirmiyahu","n":26,"title":"מדליקים נרות: אהבת עולם אהבתיך","emoji":"❤️","chapters":"ירמיהו פרק לא","know":"״מרחוק ה׳ נראה לי: ואהבת עולם אהבתיך, על כן משכתיך חסד״. ״עוד אבנך ונבנית, בתולת ישראל... עוד תטעי כרמים בהרי שומרון״. ה׳ יביא את בניו מארץ צפון, גם את העיוור והפיסח. ״מזרה ישראל יקבצנו, ושמרו כרועה עדרו״. ״כי הייתי לישראל לאב, ואפרים בכורי הוא״.","url":"yirmiyahu/26.html"},{"key":"yirmiyahu","n":27,"title":"מסע: רחל מבכה על בניה","emoji":"🕊️","chapters":"ירמיהו פרק לא","know":"״קול ברמה נשמע, נהי בכי תמרורים: רחל מבכה על בניה, מיאנה להינחם״. ה׳ עונה לה: ״מנעי קולך מבכי ועינייך מדמעה, כי יש שכר לפעולתך... ושבו בנים לגבולם״. ועל אפרים: ״הבן יקיר לי אפרים... זכור אזכרנו עוד, על כן המו מעיי לו, רחם ארחמנו״. את הפרק קוראים בהפטרת יום שני של ראש השנה.","url":"yirmiyahu/27.html"},{"key":"yirmiyahu","n":28,"title":"דיג: ברית חדשה","emoji":"📜","chapters":"ירמיהו פרק לא","know":"״הנה ימים באים... וכרתי את בית ישראל ואת בית יהודה ברית חדשה״. במה היא חדשה? ״נתתי את תורתי בקרבם, ועל לבם אכתבנה״. לא יצטרכו ללמד זה את זה ״דעו את ה׳״, ״כי כולם ידעו אותי, למקטנם ועד גדולם״. וה׳ נשבע: כמו שחוקי השמש, הירח והכוכבים לא ימושו, כך זרע ישראל לא יחדל להיות גוי.","url":"yirmiyahu/28.html"},{"key":"yirmiyahu","n":29,"title":"לוח משחק: קניית השדה בענתות","emoji":"🧾","chapters":"ירמיהו פרק לב","know":"בשנה העשירית לצדקיהו, כשירושלים במצור וירמיהו כלוא בחצר המטרה, בא אליו חנמאל בן דודו והציע לו לקנות את שדהו בענתות. ירמיהו קנה בשבעה עשר שקלי כסף, כתב ספר מקנה, חתם והעיד עדים, ונתן את הספרים לברוך בן נריה לשמור בכלי חרס. הסיבה: ״עוד ייקנו בתים ושדות וכרמים בארץ הזאת״.","url":"yirmiyahu/29.html"},{"key":"yirmiyahu","n":30,"title":"זוגות זיכרון: קול ששון וקול שמחה","emoji":"💒","chapters":"ירמיהו פרק לג","know":"ירמיהו עדיין עצור, וה׳ אומר לו: ״קרא אליי ואענך, ואגידה לך גדולות ובצורות לא ידעתם״. במקום שנראה חרב ״עוד יישמע... קול ששון וקול שמחה, קול חתן וקול כלה, קול אומרים הודו את ה׳ צבאות כי טוב ה׳, כי לעולם חסדו״. את המילים האלה שרים בכל חתונה.","url":"yirmiyahu/30.html"},{"key":"yirmiyahu","n":31,"title":"מצא את הטעות: שחרור העבדים","emoji":"⛓️","chapters":"ירמיהו פרק לד","know":"בזמן המצור כרת המלך צדקיהו ברית עם העם בירושלים ״לקרוא דרור״: כל אחד ישחרר את עבדו העברי ואת שפחתו. השרים והעם שמעו ושחררו. אבל אחר כך התחרטו, החזירו את העבדים וכבשו אותם שוב. ה׳ אמר: עשיתם את הישר בעיניי, ואז חיללתם את שמי.","url":"yirmiyahu/31.html"},{"key":"yirmiyahu","n":32,"title":"מי אני: בני רכב","emoji":"🍷","chapters":"ירמיהו פרק לה","know":"ה׳ שלח את ירמיהו להביא את בני רכב ללשכה בבית ה׳ ולהגיש להם יין. הם סירבו: ״לא נשתה יין, כי יונדב בן רכב אבינו ציווה עלינו״. הם גם לא בנו בתים ולא נטעו כרמים, וגרו באוהלים. ה׳ אמר: בני יונדב שומעים בקול אביהם, והעם הזה לא שומע אליי. שכרם: ״לא ייכרת איש ליונדב בן רכב עומד לפניי כל הימים״.","url":"yirmiyahu/32.html"},{"key":"yirmiyahu","n":33,"title":"סדר נכון: מגילת הספר","emoji":"🔥","chapters":"ירמיהו פרק לו","know":"בשנה הרביעית ליהויקים ציווה ה׳ לכתוב את כל הנבואות במגילה. ברוך בן נריה כתב מפי ירמיהו וקרא אותה באוזני העם בבית ה׳ ביום צום. השרים נבהלו והביאו את הדבר למלך. יהויקים ישב בבית החורף ליד האח, וכל כמה עמודים חתך בתער והשליך לאש. ה׳ ציווה לכתוב מגילה חדשה, ״ועוד נוסף עליהם דברים רבים״.","url":"yirmiyahu/33.html"},{"key":"yirmiyahu","n":34,"title":"מרוץ: המלך ששרף את המגילה","emoji":"👑","chapters":"ירמיהו פרק לו","know":"סיפור המגילה מלא דמויות: ברוך הסופר, מיכיהו שסיפר לשרים, יהודי שקרא לפני המלך, ושלושה שרים שהתחננו למלך שלא ישרוף. המלך ועבדיו ״לא פחדו ולא קרעו את בגדיהם״. כמה שונה מאביו יאשיהו, שקרע את בגדיו כששמע את דברי ספר התורה.","url":"yirmiyahu/34.html"},{"key":"yirmiyahu","n":35,"title":"כרטיסיות: נפילה אל הכשדים?","emoji":"🚪","chapters":"ירמיהו פרק לז","know":"הכשדים הפסיקו את המצור לזמן קצר, כי חיל פרעה יצא ממצרים. ירמיהו יצא מירושלים ללכת לארץ בנימין. בשער בנימין תפס אותו יראייה והאשים: ״אל הכשדים אתה נופל!״ ירמיהו ענה: ״שקר״. השרים היכו אותו ואסרו אותו בבית יהונתן הסופר. צדקיהו שאל אותו בסתר: ״היש דבר מאת ה׳?״ ונתן לו כיכר לחם ליום.","url":"yirmiyahu/35.html"},{"key":"yirmiyahu","n":36,"title":"מי רוצה להיות מיליונר: בור הטיט","emoji":"🕳️","chapters":"ירמיהו פרק לח","know":"השרים אמרו למלך: ״יומת נא את האיש הזה״, כי הוא מרפה את ידי הלוחמים. צדקיהו ענה: ״הנה הוא בידכם״. הם הורידו את ירמיהו בחבלים לבור מלכיהו. בבור לא היו מים אלא טיט, וירמיהו טבע בטיט. עבד מלך הכושי, מעבדי המלך, שמע, דיבר אל המלך, לקח שלושים אנשים ובלויי בגדים, והעלה את ירמיהו בעדינות.","url":"yirmiyahu/36.html"},{"key":"yirmiyahu","n":37,"title":"החלק: צדקיהו שואל בסתר","emoji":"🤫","chapters":"ירמיהו פרקים לח-לט","know":"צדקיהו קרא לירמיהו בסתר ונשבע שלא יפגע בו. ירמיהו אמר: אם תצא אל שרי מלך בבל, תחיה אתה וביתך והעיר לא תישרף. צדקיהו ענה: ״אני דואג את היהודים אשר נפלו אל הכשדים״, שמא יתעללו בי. הוא פחד מדעת הבריות ולא שמע. לעבד מלך הובטח: ״מלט אמלטך... כי בטחת בי״.","url":"yirmiyahu/37.html"},{"key":"yirmiyahu","n":38,"title":"ציר זמן: חורבן ירושלים","emoji":"🏚️","chapters":"ירמיהו פרקים לט, נב","know":"בשנה התשיעית לצדקיהו, בחודש העשירי, בא נבוכדנאצר וצר על ירושלים. בשנה האחת עשרה, בחודש הרביעי, בתשעה לחודש, הובקעה העיר. צדקיהו ברח בלילה, נתפס בערבות יריחו והובא לרבלה. בחודש החמישי שרף נבוזראדן רב הטבחים את בית ה׳. את ירמיהו ציווה נבוכדנאצר לשמור ולא לפגוע בו.","url":"yirmiyahu/38.html"},{"key":"yirmiyahu","n":39,"title":"אלבום: גדליה בן אחיקם","emoji":"🍇","chapters":"ירמיהו פרקים מ-מא","know":"נבוזראדן שחרר את ירמיהו ברמה ונתן לו לבחור. ירמיהו בחר להישאר בארץ עם גדליה בן אחיקם, שמונה במצפה על הנשארים. גדליה אמר לעם: ״שבו בארץ... ואספו יין וקיץ ושמן״. יוחנן בן קרח הזהיר אותו שבעליס מלך בני עמון שלח את ישמעאל בן נתניה להרוג אותו. גדליה לא האמין. בחודש השביעי הרג אותו ישמעאל בזמן סעודה.","url":"yirmiyahu/39.html"},{"key":"yirmiyahu","n":40,"title":"בינגו: הירידה למצרים","emoji":"🐫","chapters":"ירמיהו פרקים מב-מד","know":"אחרי רצח גדליה פחד העם מהכשדים. הם ביקשו מירמיהו לשאול את ה׳ והבטיחו: ״אם טוב ואם רע, בקול ה׳ נשמע״. אחרי עשרה ימים בא דבר ה׳: ״אם שוב תשבו בארץ הזאת, ובניתי אתכם... אל תיראו מפני מלך בבל״. הם ענו: ״שקר אתה מדבר״, וירדו למצרים, לתחפנחס, ולקחו איתם את ירמיהו ואת ברוך.","url":"yirmiyahu/40.html"},{"key":"yirmiyahu","n":41,"title":"בונים: ברוך בן נריה","emoji":"✍️","chapters":"ירמיהו פרקים לב, לו, מה","know":"ברוך בן נריה היה הסופר והתלמיד הנאמן של ירמיהו. הוא כתב את המגילה מפיו, קרא אותה בבית ה׳, שמר את ספר המקנה של השדה וירד איתו למצרים. כשהתלונן ״אוי נא לי... ומנוחה לא מצאתי״, ה׳ ענה לו: ״ואתה תבקש לך גדולות? אל תבקש... ונתתי לך את נפשך לשלל על כל המקומות אשר תלך שם״.","url":"yirmiyahu/41.html"},{"key":"yirmiyahu","n":42,"title":"מהירות: נבואות על הגויים","emoji":"🌍","chapters":"ירמיהו פרקים מו-מט","know":"ירמיהו נקרא ״נביא לגויים״. בפרקים אלה נבואות על מצרים, פלשתים, מואב, עמון, אדום, דמשק, קדר ועילם. פרעה נכו הוכה בכרכמיש על נהר פרת בידי נבוכדנאצר. ובתוך הנבואות, מילים לישראל: ״ואתה אל תירא עבדי יעקב... כי אתך אני... ואותך לא אעשה כלה״.","url":"yirmiyahu/42.html"},{"key":"yirmiyahu","n":43,"title":"בועות: נפלה בבל","emoji":"🌊","chapters":"ירמיהו פרקים נ-נא","know":"שני פרקים ארוכים על סוף בבל, המעצמה שהחריבה את המקדש. ״צאן אובדות היו עמי״, אבל ״גואלם חזק, ה׳ צבאות שמו״. ״בימים ההם... יבוקש את עוון ישראל ואיננו״. ירמיהו נתן ספר לשריה בן נריה, שהלך לבבל: קרא אותו, קשור אליו אבן והשלך אותו לפרת, ואמור: ״ככה תשקע בבל ולא תקום״.","url":"yirmiyahu/43.html"},{"key":"yirmiyahu","n":44,"title":"שרידות: הפרק האחרון","emoji":"📕","chapters":"ירמיהו פרק נב","know":"הפרק האחרון חוזר ומתאר את החורבן: המצור, הרעב, בריחת צדקיהו, שריפת בית ה׳ ולקיחת כלי המקדש ועמודי הנחושת לבבל. אבל הספר מסתיים בנקודת אור: בשנת שלושים ושבע לגלות יהויכין, אוויל מרודך מלך בבל הוציא אותו מבית הכלא, דיבר איתו טובות ונתן את כסאו מעל כסא המלכים האחרים.","url":"yirmiyahu/44.html"},{"key":"yirmiyahu","n":45,"title":"חיבור קווים: מעשים שמדברים","emoji":"🎭","chapters":"ירמיהו כל הספר","know":"ירמיהו לא רק דיבר. הוא עשה מעשים סמליים שהעם ראה בעיניו: חגורה שנרקבה, בקבוק שנשבר, מוטות על הצוואר, שדה שנקנה בזמן מצור, אבנים שנטמנו במצרים וספר שהושלך לנהר. לכל מעשה היה מסר.","url":"yirmiyahu/45.html"},{"key":"yirmiyahu","n":46,"title":"מי אני: מי אמר למי?","emoji":"💬","chapters":"ירמיהו כל הספר","know":"בספר ירמיהו שיחות רבות: ה׳ וירמיהו, ירמיהו והמלך, נביא האמת מול נביא השקר. נסו לזהות מי אמר כל משפט.","url":"yirmiyahu/46.html"},{"key":"yirmiyahu","n":47,"title":"סדר נכון: חמישה מלכים ופקיד אחד","emoji":"👑","chapters":"ירמיהו כל הספר","know":"ירמיהו ניבא יותר מארבעים שנה. הוא התחיל בימי יאשיהו הצדיק. אחריו מלך יהואחז (שלום) שלושה חודשים, ואחריו יהויקים אחת עשרה שנה. יהויכין (כניהו) מלך שלושה חודשים והוגלה. צדקיהו היה המלך האחרון, ואחרי החורבן מינה מלך בבל את גדליה על הנשארים. סדרו לפי הזמן.","url":"yirmiyahu/47.html"},{"key":"yirmiyahu","n":48,"title":"מיון: עוזרים ומתנגדים","emoji":"🤝","chapters":"ירמיהו כל הספר","know":"ירמיהו סבל הרבה: היכו אותו, אסרו אותו והשליכו אותו לבור. אבל ה׳ שלח לו גם אנשים טובים שעמדו לצידו. מיינו: מי עזר לירמיהו, ומי התנגד לו?","url":"yirmiyahu/48.html"},{"key":"yirmiyahu","n":49,"title":"זוגות זיכרון: פסוקים שכולם מכירים","emoji":"🎵","chapters":"ירמיהו כל הספר","know":"פסוקים רבים מספר ירמיהו נכנסו לתפילה, לשירים ולחיים: ״רפאני ה׳ וארפא״ בתפילת העמידה, ״קול ששון וקול שמחה״ בחתונות, ״הבן יקיר לי אפרים״ בתפילת ראש השנה, ״ושבו בנים לגבולם״ בשירים על שיבת ציון.","url":"yirmiyahu/49.html"},{"key":"yirmiyahu","n":50,"title":"מצא את הטעות: סיכום ספר ירמיהו","emoji":"🔍","chapters":"ירמיהו כל הספר","know":"ספר ירמיהו, 52 פרקים. ירמיהו בן חלקיהו מענתות ניבא מימי יאשיהו ועד אחרי החורבן. הוא הזהיר, בכה, סבל, ונשאר עם עמו. ובלב הספר, ״ספר הנחמה״: אהבת עולם, ברית חדשה ושיבת הבנים לגבולם.","url":"yirmiyahu/50.html"},{"key":"yechezkel","n":1,"title":"מסע: מראה המרכבה","emoji":"⚡","chapters":"יחזקאל פרק א","know":"יחזקאל בן בוזי הכהן היה בין הגולים בבבל, על נהר כבר. שם ״נפתחו השמים״ והוא ראה מראות אלוהים: רוח סערה באה מן הצפון, ענן גדול ואש, ובתוכה ארבע חיות. לכל אחת ארבעה פנים וארבע כנפים, ולידן אופנים. מעל ראשיהן רקיע, ומעליו דמות כסא. ״הוא מראה דמות כבוד ה׳. ואראה ואפול על פניי״.","url":"yechezkel/01.html"},{"key":"yechezkel","n":2,"title":"זוגות זיכרון: פרטי המרכבה","emoji":"🦅","chapters":"יחזקאל פרק א","know":"במראה המרכבה כל פרט מתואר בדיוק: ארבעת הפנים של החיות הם פני אדם, פני אריה מימין, פני שור משמאל ופני נשר. האופנים נראו ״כאשר יהיה האופן בתוך האופן״. הרקיע ״כעין הקרח הנורא״, והכסא ״כמראה אבן ספיר״. את הפרק קוראים בהפטרת חג השבועות.","url":"yechezkel/02.html"},{"key":"yechezkel","n":3,"title":"מהירות: בן אדם, אכול את המגילה","emoji":"📜","chapters":"יחזקאל פרקים ב-ג","know":"ה׳ קורא ליחזקאל ״בן אדם״ ומעמיד אותו על רגליו: ״שולח אני אותך אל בני ישראל״. בין שישמעו ובין שלא, ״וידעו כי נביא היה בתוכם״. יד שלוחה הושיטה לו מגילה כתובה משני צדדיה, ״קינים והגה והי״. ה׳ אמר: ״אכול את המגילה הזאת״. יחזקאל אכל, ״ותהי בפי כדבש למתוק״.","url":"yechezkel/03.html"},{"key":"yechezkel","n":4,"title":"החלק: צופה לבית ישראל","emoji":"🎺","chapters":"יחזקאל פרקים ג, לג","know":"״בן אדם, צופה נתתיך לבית ישראל״. צופה עומד על החומה, וכשהוא רואה סכנה הוא תוקע בשופר. אם הנביא מזהיר את הרשע והרשע לא שב, ״אתה את נפשך הצלת״. אם לא הזהיר, ״דמו מידך אבקש״. והמטרה: ״חי אני... אם אחפוץ במות הרשע, כי אם בשוב רשע מדרכו וחיה״.","url":"yechezkel/04.html"},{"key":"yechezkel","n":5,"title":"בינגו: לבנה, מחבת ותער","emoji":"🧱","chapters":"יחזקאל פרקים ד-ה","know":"יחזקאל נצטווה לעשות מעשים סמליים על המצור הקרוב. הוא חקק את ירושלים על לבנה ושם עליה מצור, עם מחבת ברזל כחומה. הוא שכב על צדו השמאלי 390 יום ועל הימני 40 יום, ״יום לשנה״. הוא אכל לחם במשקל ושתה מים במשורה. ולבסוף גילח את שערו בתער וחילק אותו לשלושה חלקים, ומעט שערות צרר בכנף בגדו.","url":"yechezkel/05.html"},{"key":"yechezkel","n":6,"title":"חדר בריחה: כבוד ה׳ עוזב את המקדש","emoji":"🕊️","chapters":"יחזקאל פרקים ח-יא","know":"בשנה השישית, כשזקני יהודה ישבו לפני יחזקאל בביתו, נשאה אותו הרוח במראה אל ירושלים. הוא ראה את התועבות שנעשו במקדש. איש לבוש בדים וקסת הסופר במותניו נצטווה לסמן תו על מצחות ״האנשים הנאנחים והנאנקים״ על העוולות. ואז ראה יחזקאל את כבוד ה׳ יוצא מהבית בשלבים, עד שעמד ״על ההר אשר מקדם לעיר״.","url":"yechezkel/06.html"},{"key":"yechezkel","n":7,"title":"מדליקים נרות: מקדש מעט ולב בשר","emoji":"💗","chapters":"יחזקאל פרק יא","know":"יושבי ירושלים אמרו על הגולים: ״רחקו מעל ה׳״. ה׳ ענה: ״כי הרחקתים בגויים... ואהי להם למקדש מעט בארצות אשר באו שם״. חז״ל אמרו: אלו בתי כנסיות ובתי מדרשות. וה׳ הבטיח: ״וקיבצתי אתכם מן העמים... ונתתי להם לב אחד, ורוח חדשה אתן בקרבכם, והסירותי לב האבן מבשרם ונתתי להם לב בשר״.","url":"yechezkel/07.html"},{"key":"yechezkel","n":8,"title":"סדר נכון: כלי גולה","emoji":"🎒","chapters":"יחזקאל פרק יב","know":"ה׳ ציווה על יחזקאל להציג לפני הגולים הצגה: להוציא ביום ״כלי גולה״, חבילה של יוצא לגלות, ובערב לחתור בקיר ולצאת דרכו, כשהוא נושא את החבילה על כתפו בחושך ומכסה את פניו. כששאלו ״מה אתה עושה?״, הסביר: כך ייצא הנשיא שבירושלים, צדקיהו, לגלות.","url":"yechezkel/08.html"},{"key":"yechezkel","n":9,"title":"בועות: שועלים בחורבות","emoji":"🦊","chapters":"יחזקאל פרק יג","know":"יחזקאל מוכיח את נביאי השקר: ״כשועלים בחורבות נביאיך ישראל היו״. במקום לתקן את הגדר, הם טחים על קיר רעוע טיח תפל ואומרים ״שלום״, ״ואין שלום״. כשיבוא גשם שוטף, הקיר ייפול. נביא אמת, לעומתם, עולה ״בפרצות״ וגודר גדר.","url":"yechezkel/09.html"},{"key":"yechezkel","n":10,"title":"כרטיסיות: בדמייך חיי","emoji":"👶","chapters":"יחזקאל פרק טז","know":"ה׳ מספר את תולדות ירושלים במשל: תינוקת עזובה בשדה, שאיש לא טיפל בה. ״ואעבור עלייך ואראך... ואומר לך: בדמייך חיי״. ה׳ גידל אותה, הלביש אותה בגדי רקמה ונתן לה עטרת תפארת. היא שכחה את ימי נעוריה ובטחה ביופייה. ולמרות הכל: ״וזכרתי אני את בריתי אותך בימי נעורייך, והקימותי לך ברית עולם״.","url":"yechezkel/10.html"},{"key":"yechezkel","n":11,"title":"חיבור קווים: משל הנשרים והארז","emoji":"🌲","chapters":"יחזקאל פרק יז","know":"חידה ומשל: נשר גדול בא אל הלבנון, קטף את צמרת הארז והביא אותה לארץ רחוקה. אחר כך זרע גפן בארץ. הגפן פנתה אל נשר שני. הפתרון: הנשר הראשון הוא מלך בבל, שהגלה את יהויכין והמליך את צדקיהו. צדקיהו הפר את שבועתו ופנה לפרעה. בסוף ה׳ עצמו ייטע ענף רך על הר גבוה, והוא יהיה ״לארז אדיר״.","url":"yechezkel/11.html"},{"key":"yechezkel","n":12,"title":"מי רוצה להיות מיליונר: הנפש החוטאת","emoji":"⚖️","chapters":"יחזקאל פרק יח","know":"העם אמר משל: ״אבות יאכלו בוסר ושיני הבנים תקהינה״, כלומר אנחנו נענשים על חטאי אבותינו. ה׳ עונה: לא כך. כל אדם אחראי למעשיו. ורשע שישוב ״חיה יחיה״, כל פשעיו לא ייזכרו לו. ״החפוץ אחפוץ מות רשע?... הלוא בשובו מדרכיו וחיה״. ״ועשו לכם לב חדש ורוח חדשה, ולמה תמותו בית ישראל... והשיבו וחיו״.","url":"yechezkel/12.html"},{"key":"yechezkel","n":13,"title":"דיג: והעברתי אתכם תחת השבט","emoji":"🐑","chapters":"יחזקאל פרק כ","know":"זקני ישראל באו לדרוש את ה׳, ויחזקאל סיפר להם את ההיסטוריה: ה׳ בחר בישראל במצרים, נתן להם חוקים ״אשר יעשה אותם האדם וחי בהם״, ואת השבתות ״להיות לאות ביני וביניהם״. למרות המרידות, ה׳ פעל ״למען שמי״. ולעתיד: ״והעברתי אתכם תחת השבט, והבאתי אתכם במסורת הברית״.","url":"yechezkel/13.html"},{"key":"yechezkel","n":14,"title":"חיבור נקודות: מי יעמוד בפרץ","emoji":"🧱","chapters":"יחזקאל פרקים יד, כב","know":"ה׳ אומר: ״ואבקש מהם איש גודר גדר ועומד בפרץ לפניי בעד הארץ, לבלתי שחתה, ולא מצאתי״. איש אחד שיתפלל ויתקן יכול להציל ארץ שלמה. במקום אחר מזכיר יחזקאל שלושה צדיקים מופלאים: נח, דניאל ואיוב, שכל אחד מהם ניצל בצדקתו.","url":"yechezkel/14.html"},{"key":"yechezkel","n":15,"title":"שרידות: היום שבו התחיל המצור","emoji":"📅","chapters":"יחזקאל פרק כד","know":"״בן אדם, כתוב לך את שם היום, את עצם היום הזה: סמך מלך בבל אל ירושלים״. זה היה בעשרה בטבת, ויחזקאל בבבל ידע זאת בנבואה. באותו יום גם אמר לו ה׳ דבר קשה: אשתו, ״מחמד עיניך״, תמות, והוא לא יתאבל בגלוי. כך יהיה יחזקאל ״מופת״ לעם: כשייחרב המקדש, מחמד עיניהם, יהיה הצער גדול מכל אבל.","url":"yechezkel/15.html"},{"key":"yechezkel","n":16,"title":"לוח משחק: צור, האונייה המפוארת","emoji":"⛵","chapters":"יחזקאל פרקים כו-כח","know":"צור הייתה עיר נמל עשירה, ״רוכלת העמים״. כשירושלים נפלה, צור שמחה ואמרה: ״האח!... אימלאה החרבה״. יחזקאל מתאר אותה כאונייה מפוארת, עם תורן מארז הלבנון ומשוטים מאלוני הבשן, שנשברת בלב ים. נגיד צור התגאה ואמר ״אל אני״, והנביא עונה: ״ואתה אדם ולא אל״.","url":"yechezkel/16.html"},{"key":"yechezkel","n":17,"title":"בונים: פרעה, התנין הגדול","emoji":"🐊","chapters":"יחזקאל פרקים כט-לב","know":"פרעה מלך מצרים נמשל ל״תנים הגדול הרובץ בתוך יאוריו״, שאומר: ״לי יאורי ואני עשיתיני״. הוא חושב שברא את עצמו ואת הנילוס. מצרים הייתה לישראל ״משענת קנה״: מי שנשען עליה נפצע. פרעה נמשל גם לארז גבוה בלבנון שרם לבבו ונפל. ובתוך הנבואות, הבטחה: ״ביום ההוא אצמיח קרן לבית ישראל״.","url":"yechezkel/17.html"},{"key":"yechezkel","n":18,"title":"חשיפה: בא הפליט","emoji":"🏃","chapters":"יחזקאל פרק לג","know":"בשנה השתים עשרה לגלות בא אל יחזקאל פליט מירושלים ואמר: ״הוכתה העיר״. מאותו רגע נפתח פיו של יחזקאל, והנבואות מתחילות להיות נבואות נחמה. אבל ה׳ מעיר לו: העם בא לשמוע אותך כמו שבאים לשמוע ״שיר עגבים, יפה קול ומטיב נגן״. ״ושמעו את דבריך, ועושים אינם אותם״.","url":"yechezkel/18.html"},{"key":"yechezkel","n":19,"title":"מיון: הרועים והרועה","emoji":"🧑‍🌾","chapters":"יחזקאל פרק לד","know":"״הוי רועי ישראל אשר היו רועים אותם! הלוא הצאן ירעו הרועים?״ המנהיגים דאגו לעצמם: אכלו את החלב ולבשו את הצמר, ולא טיפלו בחלשים. לכן ה׳ אומר: ״הנני אני, ודרשתי את צאני וביקרתים״. ״את האובדת אבקש, ואת הנידחת אשיב, ולנשברת אחבוש, ואת החולה אחזק״.","url":"yechezkel/19.html"},{"key":"yechezkel","n":20,"title":"מרוץ: צאן מרעיתי","emoji":"🐏","chapters":"יחזקאל פרק לד","know":"ה׳ מבטיח לאסוף את צאנו ״מכל המקומות אשר נפוצו שם ביום ענן וערפל״ ולהביא אותו אל הרי ישראל. ״והקימותי עליהם רועה אחד... את עבדי דוד״. ״וכרתי להם ברית שלום״. ״והורדתי הגשם בעתו, גשמי ברכה יהיו״. ״ואתן צאני, צאן מרעיתי, אדם אתם, אני אלוהיכם״.","url":"yechezkel/20.html"},{"key":"yechezkel","n":21,"title":"אלבום: הרי ישראל, ענפכם תיתנו","emoji":"🍑","chapters":"יחזקאל פרק לו","know":"נבואה מיוחדת שנאמרת אל ההרים עצמם: ״ואתם הרי ישראל, ענפכם תיתנו ופריכם תישאו לעמי ישראל, כי קרבו לבוא״. הארץ השוממה תיעבד ותיזרע, הערים ייבנו ויתמלאו אדם. חז״ל אמרו (סנהדרין צח): ״אין לך קץ מגולה מזה״. כשארץ ישראל נותנת פירות בעין יפה, זה סימן שהגאולה קרובה.","url":"yechezkel/21.html"},{"key":"yechezkel","n":22,"title":"סדר נכון: סדר הגאולה","emoji":"🪜","chapters":"יחזקאל פרק לו","know":"ה׳ מתאר את הגאולה שלב אחר שלב: ״ולקחתי אתכם מן הגויים, וקיבצתי אתכם מכל הארצות, והבאתי אתכם אל אדמתכם. וזרקתי עליכם מים טהורים וטהרתם... ונתתי לכם לב חדש... ואת רוחי אתן בקרבכם... וישבתם בארץ אשר נתתי לאבותיכם, והייתם לי לעם״. שימו לב: קודם השיבה לארץ, ואחר כך הטהרה והלב החדש.","url":"yechezkel/22.html"},{"key":"yechezkel","n":23,"title":"מי אני: לב חדש ורוח חדשה","emoji":"💖","chapters":"יחזקאל פרק לו","know":"כשישראל בגלות, הגויים אומרים: ״עם ה׳ אלה, ומארצו יצאו״, וזה חילול שם ה׳. לכן ה׳ גואל: ״לא למענכם אני עושה... כי אם לשם קודשי״. הוא מבטיח לב בשר במקום לב האבן, וארץ שתפרח: ״הארץ הלזו הנשמה הייתה כגן עדן״. את הפרק קוראים בהפטרת שבת פרה.","url":"yechezkel/23.html"},{"key":"yechezkel","n":24,"title":"ציר זמן: חזון העצמות היבשות","emoji":"🦴","chapters":"יחזקאל פרק לז","know":"יד ה׳ הניחה את יחזקאל בבקעה מלאה עצמות ״יבשות מאוד״. ה׳ שאל: ״התחיינה העצמות האלה?״ וציווה עליו להינבא. העצמות התקרבו ״עצם אל עצמו״, עלו עליהן גידים, בשר ועור, ולבסוף באה בהן הרוח, ״ויחיו ויעמדו על רגליהם, חיל גדול מאוד מאוד״. את הפרק קוראים בשבת חול המועד פסח.","url":"yechezkel/24.html"},{"key":"yechezkel","n":25,"title":"מי רוצה להיות מיליונר: אבדה תקוותנו?","emoji":"🌬️","chapters":"יחזקאל פרק לז","know":"ה׳ מסביר את החזון: ״העצמות האלה כל בית ישראל המה. הנה אומרים: יבשו עצמותינו ואבדה תקוותנו״. והתשובה: ״הנה אני פותח את קברותיכם, והעליתי אתכם מקברותיכם עמי, והבאתי אתכם אל אדמת ישראל... ונתתי רוחי בכם וחייתם״. ההמנון ״התקווה״ עונה לפסוק הזה: ״עוד לא אבדה תקוותנו״.","url":"yechezkel/25.html"},{"key":"yechezkel","n":26,"title":"חשיפה: שני העצים","emoji":"🪵","chapters":"יחזקאל פרק לז","know":"״קח לך עץ אחד וכתוב עליו: ליהודה... ולקח עץ אחד וכתוב עליו: ליוסף, עץ אפרים... וקרב אותם אחד אל אחד... והיו לאחדים בידך״. ממלכת יהודה וממלכת ישראל, שנפרדו אחרי שלמה, יחזרו להיות עם אחד: ״ועשיתי אותם לגוי אחד בארץ... ומלך אחד יהיה לכולם״. את הפרק קוראים בהפטרת פרשת ויגש.","url":"yechezkel/26.html"},{"key":"yechezkel","n":27,"title":"מהירות: גוג מארץ המגוג","emoji":"🌩️","chapters":"יחזקאל פרקים לח-לט","know":"באחרית הימים, כשעם ישראל כבר ״מקובץ מעמים רבים״ ויושב לבטח על הרי ישראל, יבוא עליו גוג מארץ המגוג עם עמים רבים, ״כענן לכסות הארץ״. ה׳ בעצמו יילחם בו. המטרה: ״והתגדלתי והתקדשתי, ונודעתי לעיני גויים רבים״. ״ולא אסתיר עוד פניי מהם, אשר שפכתי את רוחי על בית ישראל״. את הפרק קוראים בשבת חול המועד סוכות.","url":"yechezkel/27.html"},{"key":"yechezkel","n":28,"title":"מסע: מודדים את הבית","emoji":"📏","chapters":"יחזקאל פרקים מ-מב","know":"בשנת עשרים וחמש לגלות, ״ארבע עשרה שנה אחר אשר הוכתה העיר״, הביא ה׳ את יחזקאל במראה אל ארץ ישראל והניח אותו על הר גבוה מאוד. שם חיכה לו איש שמראהו כנחושת, ובידו פתיל פשתים וקנה מידה. האיש מדד לפניו את בית המקדש העתידי: שערים, חצרות, לשכות והיכל, ואמר: ״הגד את כל אשר אתה רואה לבית ישראל״.","url":"yechezkel/28.html"},{"key":"yechezkel","n":29,"title":"חיבור נקודות: כבוד ה׳ שב אל הבית","emoji":"🌄","chapters":"יחזקאל פרק מג","know":"יחזקאל ראה בעבר את כבוד ה׳ יוצא מהמקדש לכיוון מזרח. עכשיו הוא רואה אותו חוזר: ״והנה כבוד אלוהי ישראל בא מדרך הקדים, וקולו כקול מים רבים, והארץ האירה מכבודו״. ״והנה מלא כבוד ה׳ הבית״. וה׳ אומר: ״את מקום כסאי... אשר אשכון שם בתוך בני ישראל לעולם״.","url":"yechezkel/29.html"},{"key":"yechezkel","n":30,"title":"מצא את הטעות: השער, הנשיא והכהנים","emoji":"🚪","chapters":"יחזקאל פרקים מד-מו","know":"במקדש העתידי השער החיצון הפונה קדים יהיה סגור, ״כי ה׳ אלוהי ישראל בא בו״. הכהנים המשרתים יהיו בני צדוק, שנשארו נאמנים. שער החצר הפנימית יהיה סגור בששת ימי המעשה וייפתח ביום השבת וביום החודש. מי שנכנס להשתחוות דרך שער צפון יוצא דרך שער נגב, ולהפך.","url":"yechezkel/30.html"},{"key":"yechezkel","n":31,"title":"דיג: הנחל היוצא מהמקדש","emoji":"🏞️","chapters":"יחזקאל פרק מז","know":"מתחת למפתן הבית יוצאים מים ופונים מזרחה. האיש מודד אלף אמה: המים עד הקרסוליים. עוד אלף: עד הברכיים. עוד אלף: עד המותניים. עוד אלף: נחל שאי אפשר לעבור. המים יורדים לערבה ונכנסים לים המלח, ומימיו נרפאים ומתמלאים דגים. על שפת הנחל עצי מאכל שאינם נובלים: ״פריו למאכל ועלהו לתרופה״.","url":"yechezkel/31.html"},{"key":"yechezkel","n":32,"title":"מדליקים נרות: ה׳ שמה","emoji":"🏙️","chapters":"יחזקאל פרקים מז-מח","know":"הספר מסתיים בחלוקת הארץ לשבטים. גם הגרים שגרים בתוך ישראל יקבלו נחלה: ״והיו לכם כאזרח בבני ישראל״. לעיר יהיו שנים עשר שערים, על שמות שבטי ישראל, שלושה לכל רוח. והמילים האחרונות בספר: ״ושם העיר מיום: ה׳ שמה״. ספר שהתחיל בגלות, על נהר כבר, נגמר בעיר שה׳ שוכן בה.","url":"yechezkel/32.html"},{"key":"yechezkel","n":33,"title":"חיבור קווים: נביא שמציג","emoji":"🎭","chapters":"יחזקאל כל הספר","know":"יחזקאל, כמו ירמיהו, לא רק דיבר אלא גם עשה. הגולים בבבל ראו אותו חוקק עיר על לבנה, שוכב על צדו, מגלח את שערו, יוצא עם חבילה דרך חור בקיר ומחבר שני עצים לאחד. כל מעשה היה נבואה.","url":"yechezkel/33.html"},{"key":"yechezkel","n":34,"title":"זוגות זיכרון: משלים ונמשלים","emoji":"🧩","chapters":"יחזקאל כל הספר","know":"יחזקאל הוא נביא המשלים. העם אפילו אמר עליו: ״הלוא ממשל משלים הוא״. נשר, ארז, גפן, תנין, אונייה, צאן ורועה: לכל משל יש נמשל. מצאו את הזוגות.","url":"yechezkel/34.html"},{"key":"yechezkel","n":35,"title":"ציר זמן: ציר הזמן של יחזקאל","emoji":"🗓️","chapters":"יחזקאל כל הספר","know":"יחזקאל מציין תאריכים מדויקים, לפי השנים לגלות המלך יהויכין. בשנה החמישית ראה את המרכבה. בשישית נישא במראה לירושלים. בתשיעית התחיל המצור. בשתים עשרה בא הפליט ובישר על החורבן. ובעשרים וחמש ראה את המקדש העתידי. סדרו את האירועים.","url":"yechezkel/35.html"},{"key":"yechezkel","n":36,"title":"כרטיסיות: שפת יחזקאל","emoji":"🗣️","chapters":"יחזקאל כל הספר","know":"ליחזקאל יש ביטויים שחוזרים שוב ושוב. ה׳ קורא לו ״בן אדם״ כתשעים פעם. הנבואות נפתחות ב״ותהי עליי יד ה׳״ או ״ויהי דבר ה׳ אליי לאמר״, ורבות מהן מסתיימות ב״וידעו כי אני ה׳״. את המלך הוא מכנה ״נשיא״, ואת העם ״בית המרי״.","url":"yechezkel/36.html"},{"key":"yechezkel","n":37,"title":"בינגו: הפטרות מספר יחזקאל","emoji":"📖","chapters":"יחזקאל כל הספר","know":"פרקים רבים מספר יחזקאל נבחרו להפטרות. מראה המרכבה נקרא בשבועות, העצמות היבשות בשבת חול המועד פסח, מלחמת גוג בשבת חול המועד סוכות, שני העצים בפרשת ויגש ו״מים טהורים״ בשבת פרה. בכל פעם יש קשר בין הפרשה או החג לבין הנבואה.","url":"yechezkel/37.html"},{"key":"yechezkel","n":38,"title":"מיון: שלושה נביאים גדולים","emoji":"👥","chapters":"ישעיהו, ירמיהו, יחזקאל","know":"שלושה ספרי נבואה גדולים, שלושה נביאים. ישעיהו בן אמוץ ניבא בירושלים בימי חזקיהו. ירמיהו בן חלקיהו מענתות ראה את החורבן. יחזקאל בן בוזי ניבא בגולה, בבבל. כל אחד בדרכו הוכיח, ניחם והבטיח גאולה. מיינו: מי הנביא?","url":"yechezkel/38.html"},{"key":"yechezkel","n":39,"title":"בועות: מי ומה בספר יחזקאל","emoji":"🙋","chapters":"יחזקאל כל הספר","know":"בספר יחזקאל מעט דמויות, והרבה מקומות ומראות. הנביא עצמו, בן בוזי הכהן. המלך יהויכין, שלפי גלותו נמנות השנים. נבוכדנאצר מלך בבל. גוג מארץ המגוג. ודוד, המלך והרועה שלעתיד.","url":"yechezkel/39.html"},{"key":"yechezkel","n":40,"title":"החלק: סיכום ספר יחזקאל","emoji":"✅","chapters":"יחזקאל כל הספר","know":"ספר יחזקאל, 48 פרקים: מראה המרכבה והשליחות, נבואות תוכחה לפני החורבן, נבואות על הגויים, ואחרי בוא הפליט נבואות נחמה: הרועה הטוב, לב חדש, עצמות יבשות, שני העצים, גוג, והמקדש העתידי. הספר מסתיים במילים ״ה׳ שמה״.","url":"yechezkel/40.html"},{"key":"treasar","n":1,"title":"מהירות: הושע: לא עמי ועמי אתה","emoji":"💔","chapters":"הושע פרקים א-ב","know":"הושע בן בארי ניבא בימי עזיהו, יותם, אחז ויחזקיהו מלכי יהודה, ובימי ירבעם בן יואש מלך ישראל. שמות ילדיו היו מסר לעם: יזרעאל, לא רוחמה ולא עמי. אבל מיד באה הנחמה: ״והיה מספר בני ישראל כחול הים... ייאמר להם: בני אל חי״. ״ואמרתי ללא עמי: עמי אתה, והוא יאמר: אלוהיי״.","url":"treasar/01.html"},{"key":"treasar","n":2,"title":"זוגות זיכרון: הושע: ואירשתיך לי לעולם","emoji":"💍","chapters":"הושע פרק ב","know":"ה׳ מדבר אל ישראל כמו חתן אל כלה: ״הנה אנוכי מפתיה והולכתיה המדבר, ודיברתי על לבה״. ״ונתתי לה... את עמק עכור לפתח תקווה״. ״ואירשתיך לי לעולם, ואירשתיך לי בצדק ובמשפט ובחסד וברחמים, ואירשתיך לי באמונה, וידעת את ה׳״. את הפסוקים האלה אומרים בכל בוקר כשכורכים את רצועת התפילין על האצבע.","url":"treasar/02.html"},{"key":"treasar","n":3,"title":"בועות: הושע: חסד חפצתי ולא זבח","emoji":"🌧️","chapters":"הושע פרקים ד-י","know":"הושע מוכיח: ״אין אמת ואין חסד ואין דעת אלוהים בארץ״. הוא קורא: ״לכו ונשובה אל ה׳... ונדעה, נרדפה לדעת את ה׳״, שיבוא אלינו ״כגשם״. ה׳ אומר: ״כי חסד חפצתי ולא זבח, ודעת אלוהים מעולות״. ״זרעו לכם לצדקה, קצרו לפי חסד... ועת לדרוש את ה׳״.","url":"treasar/03.html"},{"key":"treasar","n":4,"title":"מדליקים נרות: הושע: בעבותות אהבה","emoji":"🧸","chapters":"הושע פרקים יא-יב","know":"ה׳ נזכר בישראל כילד קטן: ״כי נער ישראל ואוהבהו, וממצרים קראתי לבני״. ״ואנוכי תרגלתי לאפרים״, לימדתי אותו ללכת. ״בחבלי אדם אמשכם, בעבותות אהבה״. וכשמגיע הזמן להעניש: ״איך אתנך אפרים... נהפך עליי לבי, יחד נכמרו ניחומיי... כי אל אנוכי ולא איש״.","url":"treasar/04.html"},{"key":"treasar","n":5,"title":"מסע: הושע: שובה ישראל","emoji":"🕊️","chapters":"הושע פרק יד","know":"״שובה ישראל עד ה׳ אלוהיך, כי כשלת בעוונך. קחו עמכם דברים ושובו אל ה׳״. לא צריך להביא קרבן, צריך להביא מילים: ״ונשלמה פרים שפתינו״. ה׳ עונה: ״ארפא משובתם, אוהבם נדבה... אהיה כטל לישראל, יפרח כשושנה״. זו ההפטרה של שבת שובה, בין ראש השנה ליום הכיפורים.","url":"treasar/05.html"},{"key":"treasar","n":6,"title":"לוח משחק: יואל: מכת הארבה","emoji":"🦗","chapters":"יואל פרק א","know":"יואל בן פתואל מתאר מכת ארבה שלא הייתה כמוה: ״יתר הגזם אכל הארבה, ויתר הארבה אכל הילק, ויתר הילק אכל החסיל״. ארבעה גלים, והשדות נשארו ריקים. הנביא מבקש: ״עליה לבניכם ספרו״. והוא קורא לכולם: ״קדשו צום, קראו עצרה, אספו זקנים... וזעקו אל ה׳״.","url":"treasar/06.html"},{"key":"treasar","n":7,"title":"חדר בריחה: יואל: קרעו לבבכם","emoji":"💓","chapters":"יואל פרק ב","know":"״תקעו שופר בציון״. ואז קריאה מיוחדת: ״וגם עתה, נאום ה׳, שובו עדיי בכל לבבכם... וקרעו לבבכם ואל בגדיכם, ושובו אל ה׳ אלוהיכם, כי חנון ורחום הוא, ארך אפיים ורב חסד״. הכהנים בוכים ״בין האולם ולמזבח״: ״חוסה ה׳ על עמך״. והתשובה: ״ויקנא ה׳ לארצו ויחמול על עמו״.","url":"treasar/07.html"},{"key":"treasar","n":8,"title":"חשיפה: יואל: אשפוך את רוחי","emoji":"🌬️","chapters":"יואל פרקים ב-ג","know":"אחרי התשובה באה ברכה: ״אל תיראי אדמה, גילי ושמחי״. ״ושילמתי לכם את השנים אשר אכל הארבה״. ״ואכלתם אכול ושבוע, והיללתם את שם ה׳״. ״וידעתם כי בקרב ישראל אני״. ועוד הבטחה גדולה: ״והיה אחרי כן, אשפוך את רוחי על כל בשר, וניבאו בניכם ובנותיכם״.","url":"treasar/08.html"},{"key":"treasar","n":9,"title":"חיבור נקודות: יואל: עמק יהושפט","emoji":"⛰️","chapters":"יואל פרק ד","know":"באחרית הימים יקבץ ה׳ את הגויים ל״עמק יהושפט״ וישפוט אותם על מה שעשו לישראל. ״וה׳ מציון ישאג... וה׳ מחסה לעמו ומעוז לבני ישראל״. ״והיה ביום ההוא, ייטפו ההרים עסיס, והגבעות תלכנה חלב... ומעיין מבית ה׳ ייצא״. ״ויהודה לעולם תשב, וירושלים לדור ודור״.","url":"treasar/09.html"},{"key":"treasar","n":10,"title":"בינגו: עמוס: על שלושה ועל ארבעה","emoji":"🦁","chapters":"עמוס פרקים א-ב","know":"עמוס היה מהנוקדים, רועי הצאן, מתקוע. הוא ניבא בימי עזיהו מלך יהודה וירבעם בן יואש מלך ישראל, ״שנתיים לפני הרעש״. הוא פותח בנבואות על העמים: דמשק, עזה, צור, אדום, עמון ומואב. בכל פעם: ״על שלושה פשעי... ועל ארבעה לא אשיבנו״. ואז הוא מגיע ליהודה ולישראל, שחטאו ״על מכרם בכסף צדיק, ואביון בעבור נעליים״.","url":"treasar/10.html"},{"key":"treasar","n":11,"title":"חיבור קווים: עמוס: אריה שאג, מי לא יירא","emoji":"❓","chapters":"עמוס פרק ג","know":"״רק אתכם ידעתי מכל משפחות האדמה, על כן אפקוד עליכם״. דווקא בגלל הקרבה, ה׳ מקפיד. עמוס שואל סדרה של שאלות שהתשובה עליהן ברורה: ״הילכו שניים יחדיו בלתי אם נועדו?״ ״אם ייתקע שופר בעיר ועם לא יחרדו?״ ומסיים: ״אריה שאג, מי לא יירא? אדוני ה׳ דיבר, מי לא יינבא?״","url":"treasar/11.html"},{"key":"treasar","n":12,"title":"כרטיסיות: עמוס: דרשוני וחיו","emoji":"🌊","chapters":"עמוס פרקים ד-ו","know":"״היכון לקראת אלוהיך ישראל״. ״דרשוני וחיו״. ״דרשו טוב ואל רע, למען תחיו... שנאו רע ואהבו טוב, והציגו בשער משפט״. ה׳ אינו רוצה חגים וקרבנות כשאין צדק: ״ויגל כמים משפט, וצדקה כנחל איתן״. ו״הוי השאננים בציון״, מי ששוכב על מיטות שן ואינו כואב את צרת העם.","url":"treasar/12.html"},{"key":"treasar","n":13,"title":"מי רוצה להיות מיליונר: עמוס מול אמציה","emoji":"🐄","chapters":"עמוס פרק ז","know":"ה׳ הראה לעמוס מראות של פורענות: ארבה ואש. עמוס התפלל: ״סלח נא! מי יקום יעקב, כי קטן הוא?״ וה׳ ניחם. אמציה, כהן בית אל, אמר לו: ״חוזה, לך ברח לך אל ארץ יהודה... ובית אל לא תוסיף עוד להינבא״. עמוס ענה: ״לא נביא אנוכי ולא בן נביא אנוכי, כי בוקר אנוכי ובולס שקמים. וייקחני ה׳ מאחרי הצאן״.","url":"treasar/13.html"},{"key":"treasar","n":14,"title":"דיג: עמוס: רעב לדבר ה׳","emoji":"🧺","chapters":"עמוס פרק ח","know":"ה׳ הראה לעמוס ״כלוב קיץ״, סל של פירות קיץ, ואמר: ״בא הקץ אל עמי ישראל״. למה? בגלל מי ש״שואפים אביון״, מקטינים את האיפה, מגדילים את השקל ומרמים במאזניים. ואז נבואה מיוחדת: ״הנה ימים באים... והשלחתי רעב בארץ. לא רעב ללחם ולא צמא למים, כי אם לשמוע את דברי ה׳״.","url":"treasar/14.html"},{"key":"treasar","n":15,"title":"בונים: עמוס: סוכת דוד הנופלת","emoji":"⛺","chapters":"עמוס פרק ט","know":"הספר מסתיים בנחמה גדולה. העם יינוע בין הגויים ״כאשר יינוע בכברה, ולא ייפול צרור ארץ״. ״ביום ההוא אקים את סוכת דוד הנופלת״. ״וניגש חורש בקוצר״, כל כך הרבה יבול. ״ושבתי את שבות עמי ישראל, ובנו ערים נשמות וישבו... ונטעתים על אדמתם, ולא יינתשו עוד מעל אדמתם״.","url":"treasar/15.html"},{"key":"treasar","n":16,"title":"אלבום: עובדיה: אם תגביה כנשר","emoji":"🦅","chapters":"עובדיה פרק א","know":"ספר עובדיה הוא הקצר ביותר בתנ״ך: פרק אחד, עשרים ואחד פסוקים, וכולו על אדום, צאצאי עשיו. אדום ישב בהרים גבוהים והתגאה: ״מי יורידני ארץ?״ ה׳ עונה: ״אם תגביה כנשר, ואם בין כוכבים שים קינך, משם אורידך״. החטא העיקרי: ״מחמס אחיך יעקב״. כשירושלים נפלה, אדום עמד מנגד ושמח.","url":"treasar/16.html"},{"key":"treasar","n":17,"title":"מרוץ: עובדיה: ועלו מושיעים בהר ציון","emoji":"🏔️","chapters":"עובדיה פרק א","know":"הספר הקצר מסתיים בתקווה גדולה: ״ובהר ציון תהיה פליטה, והיה קודש״. ״והיה בית יעקב אש, ובית יוסף להבה, ובית עשיו לקש״. והפסוק האחרון, שאנחנו אומרים בכל יום בסוף שירת הים: ״ועלו מושיעים בהר ציון לשפוט את הר עשיו, והייתה לה׳ המלוכה״. את הספר קוראים בהפטרת פרשת וישלח.","url":"treasar/17.html"},{"key":"treasar","n":18,"title":"מסע: יונה: הבריחה לתרשיש","emoji":"🚢","chapters":"יונה פרק א","know":"״ויהי דבר ה׳ אל יונה בן אמיתי: קום לך אל נינוה העיר הגדולה וקרא עליה״. יונה קם, אבל לא לנינוה. הוא ברח ״תרשישה מלפני ה׳״, לכיוון ההפוך. הוא ירד ליפו, מצא אונייה שהולכת לתרשיש, שילם את שכרה וירד בה.","url":"treasar/18.html"},{"key":"treasar","n":19,"title":"סדר נכון: יונה: הסערה","emoji":"🌊","chapters":"יונה פרק א","know":"ה׳ הטיל רוח גדולה אל הים, והאונייה כמעט נשברה. המלחים זעקו כל אחד אל אלוהיו והשליכו את הכלים לים. יונה ירד לירכתי הספינה ונרדם. רב החובל העיר אותו. הם הפילו גורלות, והגורל נפל על יונה. הוא אמר: ״שאוני והטילוני אל הים״. המלחים ניסו לחתור אל היבשה, ולא יכלו. לבסוף הטילו אותו, והים עמד מזעפו.","url":"treasar/19.html"},{"key":"treasar","n":20,"title":"שרידות: יונה: עברי אנוכי","emoji":"⚓","chapters":"יונה פרק א","know":"המלחים שאלו את יונה: ״מה מלאכתך, ומאין תבוא, מה ארצך, ואי מזה עם אתה?״ הוא ענה במשפט אחד: ״עברי אנוכי, ואת ה׳ אלוהי השמים אני ירא, אשר עשה את הים ואת היבשה״. המלחים יראו ״יראה גדולה״. הם התפללו אל ה׳: ״אל נא נאבדה בנפש האיש הזה״.","url":"treasar/20.html"},{"key":"treasar","n":21,"title":"דיג: יונה: במעי הדג","emoji":"🐋","chapters":"יונה פרק ב","know":"״וימן ה׳ דג גדול לבלוע את יונה, ויהי יונה במעי הדג שלושה ימים ושלושה לילות״. משם התפלל: ״קראתי מצרה לי אל ה׳ וייענני״. ״כל משבריך וגליך עליי עברו״. ״בהתעטף עליי נפשי, את ה׳ זכרתי, ותבוא אליך תפילתי״. ״ישועתה לה׳״. ״ויאמר ה׳ לדג, ויקא את יונה אל היבשה״.","url":"treasar/21.html"},{"key":"treasar","n":22,"title":"ציר זמן: יונה: נינוה שבה","emoji":"🏙️","chapters":"יונה פרק ג","know":"דבר ה׳ בא אל יונה ״שנית״, והפעם הוא הלך. נינוה הייתה עיר ענקית, ״מהלך שלושת ימים״. יונה קרא: ״עוד ארבעים יום ונינוה נהפכת״. אנשי נינוה האמינו, קראו צום ולבשו שקים. המלך קם מכסאו, כיסה שק וישב על האפר. הוא ציווה: ״וישובו איש מדרכו הרעה ומן החמס אשר בכפיהם״. ה׳ ראה את מעשיהם, וניחם.","url":"treasar/22.html"},{"key":"treasar","n":23,"title":"מי רוצה להיות מיליונר: יונה: עוד ארבעים יום","emoji":"⏰","chapters":"יונה פרק ג","know":"יונה אמר רק חמש מילים, ועיר שלמה השתנתה: ״מגדולם ועד קטנם״. אפילו הבהמות לא אכלו ולא שתו. המלך אמר: ״מי יודע, ישוב וניחם האלוהים, ושב מחרון אפו ולא נאבד״. את ספר יונה קוראים ביום הכיפורים בתפילת מנחה.","url":"treasar/23.html"},{"key":"treasar","n":24,"title":"בועות: יונה: הקיקיון","emoji":"🌿","chapters":"יונה פרק ד","know":"יונה כעס שנינוה ניצלה. הוא יצא מהעיר, עשה לו סוכה וחיכה לראות מה יקרה. ה׳ זימן קיקיון שהצל על ראשו, ויונה שמח ״שמחה גדולה״. למחרת זימן ה׳ תולעת, והקיקיון יבש. השמש היכתה על ראש יונה. ה׳ אמר: ״אתה חסת על הקיקיון אשר לא עמלת בו... ואני לא אחוס על נינוה העיר הגדולה?״","url":"treasar/24.html"},{"key":"treasar","n":25,"title":"חיבור קווים: יונה: ארבע פעמים ״וימן״","emoji":"🎁","chapters":"יונה כל הספר","know":"בספר יונה המילה ״וימן״ חוזרת ארבע פעמים: ה׳ זימן דג גדול, קיקיון, תולעת ורוח קדים. הכל שליחים שלו: הרוח, הים, הדג, הצמח והתולעת. כולם עושים את רצונו מיד. רק הנביא ניסה לברוח.","url":"treasar/25.html"},{"key":"treasar","n":26,"title":"מיון: יונה: איפה זה קרה?","emoji":"📍","chapters":"יונה כל הספר","know":"ארבעה פרקים, ארבעה מקומות: באונייה בלב ים, במעי הדג, בתוך נינוה, ומחוץ לעיר, בסוכה שמתחת לקיקיון. מיינו כל אירוע למקום שבו קרה.","url":"treasar/26.html"},{"key":"treasar","n":27,"title":"החלק: יונה: נכון או לא נכון","emoji":"✅","chapters":"יונה כל הספר","know":"סיכום ספר יונה: נביא שברח, סערה, דג, תפילה, עיר ששבה בתשובה, קיקיון ושאלה אחת בסוף. המסרים: אי אפשר לברוח מה׳, תשובה מתקבלת, ורחמי ה׳ על כל מעשיו.","url":"treasar/27.html"},{"key":"treasar","n":28,"title":"אלבום: מיכה: ציון שדה תיחרש","emoji":"🚜","chapters":"מיכה פרקים א-ג","know":"מיכה המורשתי ניבא בימי יותם, אחז ויחזקיהו מלכי יהודה, באותה תקופה כמו ישעיהו. הוא הוכיח את בעלי הכוח: ״הוי חושבי אוון... וחמדו שדות וגזלו״, ואת הראשים ״שונאי טוב ואוהבי רע״. הוא הזהיר: ״ציון שדה תיחרש, וירושלים עיין תהיה״. מאה שנה אחר כך, הנבואה הזאת הצילה את חיי ירמיהו במשפטו, כי חזקיהו שמע אותה ושב.","url":"treasar/28.html"},{"key":"treasar","n":29,"title":"מדליקים נרות: מיכה: איש תחת גפנו","emoji":"🍇","chapters":"מיכה פרק ד","know":"מיכה חוזר על חזון ישעיהו: ״והיה באחרית הימים... וכיתתו חרבותיהם לאתים״. והוא מוסיף תמונה משלו: ״וישבו איש תחת גפנו ותחת תאנתו, ואין מחריד״. ״כי כל העמים ילכו איש בשם אלוהיו, ואנחנו נלך בשם ה׳ אלוהינו לעולם ועד״. ה׳ מבטיח לאסוף את ״הצולעה״ ואת ״הנידחה״.","url":"treasar/29.html"},{"key":"treasar","n":30,"title":"חיבור נקודות: מיכה: ואתה בית לחם","emoji":"👑","chapters":"מיכה פרק ה","know":"״ואתה בית לחם אפרתה, צעיר להיות באלפי יהודה, ממך לי ייצא להיות מושל בישראל״. מהעיר הקטנה של דוד ייצא גם המלך העתידי. ״ועמד ורעה בעוז ה׳... והיה זה שלום״. ״והיה שארית יעקב בקרב עמים רבים כטל מאת ה׳, כרביבים עלי עשב״.","url":"treasar/30.html"},{"key":"treasar","n":31,"title":"מי אני: מיכה: מה ה׳ דורש ממך","emoji":"⚖️","chapters":"מיכה פרק ו","know":"ה׳ פונה אל העם כמו בוויכוח בין אוהבים: ״עמי, מה עשיתי לך ומה הלאיתיך? ענה בי!״ הוא מזכיר: העליתיך ממצרים, שלחתי לפניך את משה, אהרון ומרים. העם שואל: ״במה אקדם ה׳?״ בעולות? באלפי אילים? והתשובה: ״הגיד לך אדם מה טוב, ומה ה׳ דורש ממך: כי אם עשות משפט, ואהבת חסד, והצנע לכת עם אלוהיך״.","url":"treasar/31.html"},{"key":"treasar","n":32,"title":"חשיפה: מיכה: מי אל כמוך","emoji":"🌊","chapters":"מיכה פרק ז","know":"מיכה מסיים בתקווה: ״אל תשמחי אויבתי לי. כי נפלתי, קמתי. כי אשב בחושך, ה׳ אור לי״. ״כימי צאתך מארץ מצרים אראנו נפלאות״. ״מי אל כמוך, נושא עוון ועובר על פשע... כי חפץ חסד הוא. ישוב ירחמנו, יכבוש עוונותינו, ותשליך במצולות ים כל חטאותם. תיתן אמת ליעקב, חסד לאברהם״. את הפסוקים האלה אומרים בתשליך.","url":"treasar/32.html"},{"key":"treasar","n":33,"title":"חדר בריחה: נחום: טוב ה׳ למעוז","emoji":"🛡️","chapters":"נחום פרק א","know":"נחום האלקושי ניבא ״משא נינוה״: סופה של בירת אשור, שהגלתה את עשרת השבטים. ה׳ ״ארך אפיים וגדול כוח״, אבל רשע אינו נשאר בלי משפט. ובתוך הסערה: ״טוב ה׳, למעוז ביום צרה, ויודע חוסי בו״. ולבשורה ליהודה: ״הנה על ההרים רגלי מבשר, משמיע שלום. חוגי יהודה חגייך״.","url":"treasar/33.html"},{"key":"treasar","n":34,"title":"מיון: יונה ונחום: שתי נבואות על נינוה","emoji":"↔️","chapters":"יונה, נחום","know":"שני ספרים בתרי עשר עוסקים בנינוה. בספר יונה העיר שבה מדרכה הרעה וה׳ חס עליה. בספר נחום, דורות אחר כך, נינוה חזרה לרשעה, ״עיר דמים, כולה כחש״, ונגזר עליה חורבן. מיינו: מה שייך לספר יונה ומה לספר נחום?","url":"treasar/34.html"},{"key":"treasar","n":35,"title":"כרטיסיות: חבקוק: עד אנה ה׳","emoji":"🙋","chapters":"חבקוק פרק א","know":"חבקוק הוא נביא שמעז לשאול. ״עד אנה ה׳ שיוועתי ולא תשמע?״ למה יש חמס ועוול? ה׳ עונה שהוא מקים את הכשדים, ״הגוי המר והנמהר״, שסוסיו ״קלו מנמרים״. חבקוק שואל שוב: ״טהור עיניים מראות רע... למה תביט בוגדים, תחריש בבלע רשע צדיק ממנו?״","url":"treasar/35.html"},{"key":"treasar","n":36,"title":"מרוץ: חבקוק: וצדיק באמונתו יחיה","emoji":"🗼","chapters":"חבקוק פרק ב","know":"חבקוק מחכה לתשובה: ״על משמרתי אעמודה... ואצפה לראות מה ידבר בי״. ה׳ עונה: ״כתוב חזון ובאר על הלוחות, למען ירוץ קורא בו. כי עוד חזון למועד... אם יתמהמה, חכה לו, כי בוא יבוא, לא יאחר״. ״וצדיק באמונתו יחיה״. חז״ל אמרו: בא חבקוק והעמיד את כל המצוות על אחת, על האמונה.","url":"treasar/36.html"},{"key":"treasar","n":37,"title":"בינגו: חבקוק: אבן מקיר תזעק","emoji":"🧱","chapters":"חבקוק פרק ב","know":"חמש פעמים ״הוי״ על מי שבונה את עושרו מגזל. ״הוי המרבה לא לו״. ״כי אבן מקיר תזעק, וכפיס מעץ יעננה״: אפילו קירות הבית שנבנה בעוול צועקים. ולעומת זה: ״כי תימלא הארץ לדעת את כבוד ה׳, כמים יכסו על ים״. והפרק מסתיים בשקט: ״וה׳ בהיכל קודשו, הס מפניו כל הארץ״.","url":"treasar/37.html"},{"key":"treasar","n":38,"title":"בונים: חבקוק: ואני בה׳ אעלוזה","emoji":"🦌","chapters":"חבקוק פרק ג","know":"הפרק האחרון הוא תפילה ושיר: ״ה׳, שמעתי שמעך, יראתי... ברוגז רחם תזכור״. ובסוף, אחד מפסוקי האמונה היפים ביותר: גם אם ״תאנה לא תפרח ואין יבול בגפנים... ואין בקר ברפתים, ואני בה׳ אעלוזה, אגילה באלוהי ישעי. ה׳ אדוני חילי, וישם רגליי כאיילות״.","url":"treasar/38.html"},{"key":"treasar","n":39,"title":"מהירות: צפניה: בקשו ענווה","emoji":"🕯️","chapters":"צפניה פרקים א-ב","know":"צפניה בן כושי ניבא בימי יאשיהו מלך יהודה. הוא מזהיר: ״קרוב יום ה׳ הגדול״, ״יום שופר ותרועה״. ה׳ יחפש את ירושלים ״בנרות״, וימצא את מי שאומר בלבו ״לא ייטיב ה׳ ולא ירע״, כאילו לא אכפת לה׳. ויש דרך: ״בקשו את ה׳ כל ענווי הארץ... בקשו צדק, בקשו ענווה״.","url":"treasar/39.html"},{"key":"treasar","n":40,"title":"מצא את הטעות: צפניה: שפה ברורה","emoji":"🗣️","chapters":"צפניה פרק ג","know":"לעתיד לבוא: ״כי אז אהפוך אל עמים שפה ברורה, לקרוא כולם בשם ה׳, לעובדו שכם אחד״. ובירושלים יישאר ״עם עני ודל, וחסו בשם ה׳״. ״שארית ישראל לא יעשו עוולה ולא ידברו כזב, ולא יימצא בפיהם לשון תרמית״.","url":"treasar/40.html"},{"key":"treasar","n":41,"title":"זוגות זיכרון: צפניה: יחריש באהבתו","emoji":"🥰","chapters":"צפניה פרק ג","know":"סוף ספר צפניה הוא שיר שמחה: ״רוני בת ציון, הריעו ישראל, שמחי ועלזי בכל לב״. ״מלך ישראל ה׳ בקרבך, לא תיראי רע עוד״. ואז פסוק מיוחד במינו: ״ה׳ אלוהייך בקרבך, גיבור יושיע. ישיש עלייך בשמחה, יחריש באהבתו, יגיל עלייך ברינה״. לא רק אנחנו שמחים בה׳. ה׳ שמח בנו.","url":"treasar/41.html"},{"key":"treasar","n":42,"title":"סדר נכון: חגי: עלו ההר ובנו הבית","emoji":"🪓","chapters":"חגי פרק א","know":"שבי ציון חזרו מבבל, אבל בניין בית המקדש נעצר. העם אמר: ״לא עת בוא, עת בית ה׳ להיבנות״. בשנת שתיים לדריוש אמר חגי: ״העת לכם אתם לשבת בבתיכם ספונים, והבית הזה חרב?״ ״שימו לבבכם על דרכיכם״: זרעתם הרבה והבאתם מעט. ״עלו ההר, והבאתם עץ, ובנו הבית״. זרובבל, יהושע הכהן הגדול והעם שמעו והתחילו לבנות.","url":"treasar/42.html"},{"key":"treasar","n":43,"title":"לוח משחק: חגי: גדול יהיה כבוד הבית","emoji":"🏛️","chapters":"חגי פרק ב","know":"הזקנים שזכרו את בית המקדש של שלמה הסתכלו על הבניין החדש, והוא נראה בעיניהם ״כאין״. חגי חיזק: ״ועתה חזק זרובבל... וחזק יהושע... וחזק כל עם הארץ, ועשו, כי אני אתכם״. ״ורוחי עומדת בתוככם, אל תיראו״. ״לי הכסף ולי הזהב״. ״גדול יהיה כבוד הבית הזה האחרון מן הראשון... ובמקום הזה אתן שלום״.","url":"treasar/43.html"},{"key":"treasar","n":44,"title":"מי אני: חגי: מן היום הזה אברך","emoji":"🌾","chapters":"חגי פרק ב","know":"בעשרים וארבעה לחודש התשיעי, יום ייסוד היכל ה׳, אמר חגי: ״שימו נא לבבכם מן היום הזה ומעלה״. עד עכשיו השדות לא הצליחו. ״מן היום הזה אברך״. ולזרובבל, נצר לבית דוד, אמר ה׳: ״אקחך זרובבל... עבדי, ושמתיך כחותם, כי בך בחרתי״.","url":"treasar/44.html"},{"key":"treasar","n":45,"title":"מהירות: זכריה: חומת אש סביב","emoji":"🔥","chapters":"זכריה פרקים א-ב","know":"זכריה בן ברכיה ניבא יחד עם חגי, בשנת שתיים לדריוש. הוא פותח: ״שובו אליי... ואשוב אליכם״. הוא רואה מראות לילה: רוכב על סוס אדום בין ההדסים, ואיש עם חבל מידה שבא למדוד את ירושלים. מלאך אומר: ״פרזות תשב ירושלים... ואני אהיה לה חומת אש סביב״. ״כי הנוגע בכם נוגע בבבת עינו״.","url":"treasar/45.html"},{"key":"treasar","n":46,"title":"החלק: זכריה: אוד מוצל מאש","emoji":"👘","chapters":"זכריה פרק ג","know":"זכריה רואה את יהושע הכהן הגדול עומד לפני מלאך ה׳, והשטן עומד על ימינו לשטנו. ה׳ גוער בשטן: ״הלוא זה אוד מוצל מאש!״ יהושע לבוש בגדים צואים. המלאך מצווה להסיר אותם, להלביש אותו ״מחלצות״ ולשים ״צניף טהור״ על ראשו. ״ראה, העברתי מעליך עוונך״. והבטחה: ״הנני מביא את עבדי צמח״.","url":"treasar/46.html"},{"key":"treasar","n":47,"title":"מי רוצה להיות מיליונר: זכריה: לא בחיל ולא בכוח","emoji":"🕎","chapters":"זכריה פרק ד","know":"המלאך מעיר את זכריה והוא רואה: ״מנורת זהב כולה, וגולה על ראשה, ושבעה נרותיה עליה״, ושני זיתים לצידיה. פירוש המראה: ״זה דבר ה׳ אל זרובבל: לא בחיל ולא בכוח, כי אם ברוחי, אמר ה׳ צבאות״. ״ידי זרובבל ייסדו הבית הזה, וידיו תבצענה״. ״כי מי בז ליום קטנות״. זו ההפטרה של שבת חנוכה. המנורה והזיתים מופיעים בסמל מדינת ישראל.","url":"treasar/47.html"},{"key":"treasar","n":48,"title":"חדר בריחה: זכריה: ילדים משחקים ברחובות","emoji":"🧒","chapters":"זכריה פרק ח","know":"״עוד יישבו זקנים וזקנות ברחובות ירושלים, ואיש משענתו בידו מרוב ימים. ורחובות העיר יימלאו ילדים וילדות משחקים ברחובותיה״. מה ה׳ מבקש? ״דברו אמת איש את רעהו, אמת ומשפט שלום שפטו בשעריכם״. ״והאמת והשלום אהבו״. ולעתיד: עשרה אנשים מכל הגויים יחזיקו ״בכנף איש יהודי״ ויאמרו: ״נלכה עמכם, כי שמענו אלוהים עמכם״.","url":"treasar/48.html"},{"key":"treasar","n":49,"title":"חיבור קווים: זכריה: הצומות לששון ולשמחה","emoji":"📅","chapters":"זכריה פרקים ז-ח","know":"אנשים שאלו את הנביא: האם להמשיך לצום על החורבן, עכשיו כשהבית נבנה? ה׳ ענה קודם כול: ״משפט אמת שפוטו, וחסד ורחמים עשו״. ואחר כך הבטיח: ״צום הרביעי וצום החמישי וצום השביעי וצום העשירי יהיה לבית יהודה לששון ולשמחה ולמועדים טובים״.","url":"treasar/49.html"},{"key":"treasar","n":50,"title":"בועות: זכריה: גילי מאוד בת ציון","emoji":"🫏","chapters":"זכריה פרק ט","know":"״גילי מאוד בת ציון, הריעי בת ירושלים! הנה מלכך יבוא לך, צדיק ונושע הוא, עני ורוכב על חמור״. המלך המשיח אינו בא על סוס מלחמה אלא על חמור, בענווה. הוא ידבר שלום לגויים, ״ומושלו מים עד ים״. והעם נקרא ״אסירי התקווה״.","url":"treasar/50.html"},{"key":"treasar","n":51,"title":"דיג: זכריה: ה׳ אחד ושמו אחד","emoji":"🌍","chapters":"זכריה פרק יד","know":"הפרק האחרון מתאר את היום הגדול: ״לעת ערב יהיה אור״. ״ייצאו מים חיים מירושלים״. ״והיה ה׳ למלך על כל הארץ, ביום ההוא יהיה ה׳ אחד ושמו אחד״. הפסוק הזה חותם את תפילת ״עלינו לשבח״. וכל הגויים יעלו לירושלים ״לחוג את חג הסוכות״. את הפרק קוראים בהפטרת היום הראשון של סוכות.","url":"treasar/51.html"},{"key":"treasar","n":52,"title":"מי אני: מלאכי: אהבתי אתכם","emoji":"💞","chapters":"מלאכי פרק א","know":"מלאכי הוא אחרון הנביאים. ספרו נפתח בשלוש מילים: ״אהבתי אתכם, אמר ה׳״. העם שואל: ״במה אהבתנו?״ וה׳ עונה: ״ואוהב את יעקב״. ואחר כך שאלה של אב: ״בן יכבד אב, ועבד אדוניו. ואם אב אני, איה כבודי?״ הכהנים הביאו קרבנות פגומים, דבר שלא היו מעיזים להגיש לפחה.","url":"treasar/52.html"},{"key":"treasar","n":53,"title":"חיבור נקודות: מלאכי: תורת אמת הייתה בפיהו","emoji":"📚","chapters":"מלאכי פרק ב","know":"מלאכי מתאר את הכהן האידיאלי, כמו אהרון: ״תורת אמת הייתה בפיהו, ועוולה לא נמצא בשפתיו. בשלום ובמישור הלך איתי, ורבים השיב מעוון. כי שפתי כהן ישמרו דעת, ותורה יבקשו מפיהו, כי מלאך ה׳ צבאות הוא״. והוא שואל את כולם: ״הלוא אב אחד לכולנו, הלוא אל אחד בראנו. מדוע נבגוד איש באחיו?״","url":"treasar/53.html"},{"key":"treasar","n":54,"title":"בונים: מלאכי: ובחנוני נא בזאת","emoji":"🪟","chapters":"מלאכי פרק ג","know":"״כי אני ה׳ לא שניתי, ואתם בני יעקב לא כליתם״. ״שובו אליי ואשובה אליכם״. על המעשרות אומר ה׳ דבר נדיר: ״ובחנוני נא בזאת... אם לא אפתח לכם את ארובות השמים, והריקותי לכם ברכה עד בלי די״. וכשיראי ה׳ מדברים זה עם זה, ״ויקשב ה׳ וישמע, וייכתב ספר זיכרון לפניו״. ״וחמלתי עליהם כאשר יחמול איש על בנו״.","url":"treasar/54.html"},{"key":"treasar","n":55,"title":"מדליקים נרות: מלאכי: והשיב לב אבות על בנים","emoji":"👨‍👦","chapters":"מלאכי פרק ג","know":"הפסוקים האחרונים של הנביאים: ״וזרחה לכם, יראי שמי, שמש צדקה ומרפא בכנפיה״. ״זכרו תורת משה עבדי״. ״הנה אנוכי שולח לכם את אליה הנביא, לפני בוא יום ה׳ הגדול והנורא. והשיב לב אבות על בנים, ולב בנים על אבותם״. את הפרק קוראים בהפטרת שבת הגדול, לפני פסח.","url":"treasar/55.html"},{"key":"treasar","n":56,"title":"סדר נכון: שנים עשר נביאים בסדר","emoji":"🔢","chapters":"תרי עשר","know":"״תרי עשר״ בארמית פירושו שנים עשר. אלה שנים עשר ספרי נבואה קצרים שנאספו לספר אחד, כדי שלא יאבדו מרוב קוטנם. הראשונים, הושע, עמוס ומיכה, ניבאו בימי בית ראשון. האחרונים, חגי, זכריה ומלאכי, ניבאו בימי שיבת ציון ובניין הבית השני. סדרו את שנים עשר הספרים לפי סדרם בתנ״ך.","url":"treasar/56.html"},{"key":"treasar","n":57,"title":"מצא את הטעות: סיכום תרי עשר","emoji":"🔍","chapters":"תרי עשר","know":"לכל נביא בתרי עשר יש פסוק שמזוהה איתו: הושע ו״שובה ישראל״, יואל והארבה, עמוס ו״דרשוני וחיו״, עובדיה ואדום, יונה והדג, מיכה ו״הצנע לכת״, נחום ונינוה, חבקוק ו״צדיק באמונתו יחיה״, צפניה ו״יחריש באהבתו״, חגי ובניין הבית, זכריה והמנורה, מלאכי ואליהו הנביא.","url":"treasar/57.html"}];
const BK=[["yehoshua", "יהושע"], ["shoftim", "שופטים"], ["shmuel", "שמואל"], ["melachim", "מלכים"], ["yeshayahu", "ישעיהו"], ["yirmiyahu", "ירמיהו"], ["yechezkel", "יחזקאל"], ["treasar", "תרי עשר"]];

const isDone=id=>(id in SRV)||lget('ktp-'+id)==='1';

window.KT&&KT.init({id:PID,title:'הארמון – '+B[1],home:'index.html#'+key,homeTxt:'🎲 לכל משחקי '+B[1]});

  }).join('');
  const done=games.filter(r=>isDone(gid(r))).length;

  $('pb').style.width=Math.round(done/N*100)+'%';

    :ready?'<div class="cap">השער פתוח – הגעתם!</div><div class="sub">בונוס '+BONUS+' נקודות מחכה לכם בפנים</div><button class="go" id="enter" type="button">🚪 כניסה אל הארמון</button>'
    :'<div class="cap">ארמון מלך העולם</div><div class="sub">השער ייפתח אחרי '+N+' תחנות. עוד '+left+'…</div>');
  if($('enter'))$('enter').onclick=()=>ceremony(true);
  if($('again'))$('again').onclick=()=>ceremony(false);
  // הדרך: השורה העליונה = המשחקים האחרונים
  const rows=[];
  for(let i=0;i<N;i+=K)rows.push(games.slice(i,i+K));
  $('road').innerHTML=rows.map((g,ri)=>({g,ri})).reverse().map(({g,ri})=>
    '<div class="row '+(ri%2?'o':'e')+(ri===rows.length-1?' top':'')+'">'+g.map((r,j)=>{
      const i=ri*K+j, d=isDone(gid(r)), nx=i===nextI;
      return '<button type="button" class="st'+(d?' done':nx?' next':'')+'" data-i="'+i+'" aria-label="תחנה '+(i+1)+': '+esc(r.title)+(d?' – הושלם':'')+'">'+
        (nx?'<span class="me">🚶</span>':'')+(d?'<span class="em">'+esc(r.emoji||'⭐')+'</span>':(i+1))+'</button>';
    }).join('')+'</div>').join('');
  $('road').querySelectorAll('.st').forEach(b=>b.onclick=()=>sheet(+b.dataset.i));
}
function sheet(i){
  const r=games[i], id=gid(r), d=isDone(id);
  const sc=SRV[id];
  $('sb').innerHTML='<h3>'+esc(r.emoji||'')+' תחנה '+(i+1)+': '+esc(r.title)+'</h3><div class="ch">'+esc(r.chapters||'')+'</div><p>'+esc(r.know||'')+'</p>'+
    (d?'<p>✅ כבר עברתם את התחנה הזאת'+(sc?' (⭐ '+sc+')':'')+'. אפשר לשפר או סתם ליהנות שוב.</p>':'')+
    '<a class="go" style="display:inline-block;text-decoration:none" href="'+esc(r.url)+'">'+(d?'שוב ▶':'▶ יוצאים לדרך')+'</a>';
  $('sheet').classList.add('on');
}
$('sx').onclick=()=>$('sheet').classList.remove('on');

function load(){
  const m=meInfo();
  if(window.KT&&KT.api&&real(m)){
    fetch(KT.api+'?action=me&name='+encodeURIComponent(m.name)+'&cls='+encodeURIComponent(m.cls)+'&school='+encodeURIComponent(m.school))
      .then(r=>r.json()).then(d=>{if(d&&d.ok){SRV=d.games||{};ENTERED=(PID in SRV)||lget('ktp-'+PID)==='1';draw();}}).catch(()=>{});
  }
  ENTERED=ENTERED||lget('ktp-'+PID)==='1';
  draw();
  champs();
}
function champs(){
  const m=meInfo();
  fetch(KT.api+'?action=board&limit=50&game='+PID).then(r=>r.json()).then(d=>{
    const t=d.top||[];
    $('champs').innerHTML=t.length?t.map(x=>'<li class="'+(real(m)&&nk(x.name)===nk(m.name)&&nk(x.cls)===nk(m.cls)&&nk(x.school)===nk(m.school)?'me':'')+'">👑 '+esc(x.name)+' <span>'+esc([x.cls,x.school].filter(Boolean).join(', '))+'</span></li>').join('')
      :'<li>עוד אף אחד לא הגיע לארמון דרך '+esc(B[1])+'. אולי אתם הראשונים? 🙂</li>';
  }).catch(()=>{$('champs').innerHTML='<li>הרשימה לא נטענת כרגע</li>'});
}

/* ---------- טקס הכניסה ---------- */
function say(t,ms){if(window.KT&&KT.tone&&localStorage.getItem('hq-mute')!=='1')KT.tone(t,ms)}
function confetti(){
  const e=['⭐','✨','👑','🎉','🌟','📜'];
  for(let i=0;i<34;i++){const s=document.createElement('span');s.className='fall';s.textContent=e[i%e.length];
    s.style.left=Math.random()*100+'%';s.style.animationDuration=(2.5+Math.random()*3)+'s';s.style.animationDelay=(Math.random()*1.5)+'s';
    $('cer').appendChild(s);setTimeout(()=>s.remove(),7500);}
}
function ceremony(first){
  const m=meInfo();
  if(first&&!real(m)){alert('כדי לקבל את הבונוס ולהיכנס לרשימת האלופים צריך להירשם: שם, כיתה ובית ספר. לוחצים על 👤 למעלה.');if(window.KT)KT.openReg();return;}
  const nm=m.name||'חבר יקר';
  const steps=[
    ['<span class="big">🚪</span><br>השער נפתח!<br>'+esc(nm)+', עברתם את כל הדרך של '+esc(B[1])],
    ['כל אחד מ-'+N+' המשחקים הוסיף עוד צעד, ועכשיו אתם כאן, בפנים.'],
    ['מי שלומד את דברי הנביאים לומד להכיר את המלך ולאהוב אותו.'],
    ['<span class="big">👑</span><br>ברוכים הבאים אל ארמון מלך העולם!'],
    first?['<span class="big">⭐</span><br>בונוס מיוחד: '+BONUS+' נקודות!<br><small id="bs">שומר…</small>']:['שמכם כתוב ברשימת האלופים של הארמון.'],
    ['שמכם נכנס לרשימת אלופי הארמון.<br>כל הכבוד, '+esc(nm)+'! 🌟']
  ];
  if(!first)steps.splice(4,1);
  let k=0; const c=$('cer');
  c.classList.add('on');c.classList.remove('open');
  if(window.KT&&KT.grand&&localStorage.getItem('hq-mute')!=='1')KT.grand();
  setTimeout(()=>c.classList.add('open'),400);
  confetti();
  function show(){
    $('ct').innerHTML=steps[k][0]; $('cn').textContent=k===steps.length-1?'סיום ✔':'המשך ▶';
    if(k>0){say([659,784,1047],.12);if(k===3)confetti();}
    if(first&&k===4)bonus();
  }
  $('cn').onclick=()=>{ if(k<steps.length-1){k++;show();} else {c.classList.remove('on');location.reload();} };
  show();
}
let posting=false;
function bonus(){
  if(posting||(PID in SRV))return; posting=true;
  const m=meInfo();
  fetch(KT.api,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({name:m.name,cls:m.cls,school:m.school,game:PID,score:BONUS,a:0,b:0,c:0})})
    .then(r=>r.json()).then(d=>{
      if(d&&d.ok){lput('ktp-'+PID,'1');SRV[PID]=BONUS;ENTERED=true;if($('bs'))$('bs').textContent='✅ הנקודות נשמרו!';}
      else{posting=false;if($('bs'))$('bs').textContent='לא הצלחנו לשמור כרגע. נסו שוב מאוחר יותר.';}
    }).catch(()=>{posting=false;if($('bs'))$('bs').textContent='לא הצלחנו לשמור כרגע. נסו שוב מאוחר יותר.'});
}

window.addEventListener('hashchange',()=>location.reload());
let lastMe=lget('hq-me');
setInterval(()=>{const x=lget('hq-me');if(x!==lastMe){lastMe=x;load();}},1500);   // נרשמו / החליפו שם: הדרך נטענת מחדש
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
load();
</script>
