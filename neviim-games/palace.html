<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="הדרך אל הארמון: בכל ספר של הנביאים כל משחק מקרב אתכם עוד צעד אל ארמון מלך העולם. מי שמגיע לארמון מקבל בונוס נקודות ונכנס לרשימת האלופים – הקול החמישי, הרב יהודה טאוב">
<title>הדרך אל הארמון</title>
<style>
:root{--ink:#3b2a4a;--gold:#f59e0b;--gold2:#fde68a;--road:#c9a26b;--done:#f59e0b;--next:#16a34a;--todo:#cbd5e1}
*{box-sizing:border-box}
body{margin:0;font-family:Rubik,'Segoe UI',Arial,sans-serif;color:var(--ink);background:linear-gradient(#bfe3ff 0,#e8f6ff 260px,#bfe8a8 600px,#8fd17a 100%);min-height:100vh;padding-bottom:30px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{padding:58px 0 8px;text-align:center}
h1{margin:0;font-size:1.7rem}
header p{margin:4px 0 0;color:#5b4a6b}
.tabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0}
.tabs a{padding:6px 11px;border-radius:999px;background:#fff;color:#4b32c3;font-weight:700;font-size:.88rem;text-decoration:none;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.tabs a.on{background:#4b32c3;color:#fff}
.tabs a small{opacity:.75;font-weight:500}
.prog{background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 3px 10px rgba(0,0,0,.1);margin-bottom:10px;text-align:center}
.bar{height:14px;border-radius:99px;background:#e5e7eb;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#fbbf24,#f59e0b);border-radius:99px;transition:width .8s}
/* הארמון */
.palace{position:relative;text-align:center;margin:10px 0 0;padding:6px 0 0}
.palace .castle{font-size:96px;line-height:1;filter:grayscale(1) opacity(.55);transition:filter .6s}
.palace.ready .castle{filter:none;animation:glow 1.6s ease-in-out infinite}
.palace.in .castle{filter:none;text-shadow:0 0 28px #fbbf24}
@keyframes glow{50%{text-shadow:0 0 34px #fbbf24,0 0 12px #fff;transform:scale(1.05)}}
.palace .cap{font-weight:800;font-size:1.05rem}
.palace .sub{font-size:.92rem;color:#5b4a6b;margin:2px 0 8px}
.go{border:0;border-radius:999px;padding:12px 22px;font:inherit;font-weight:800;font-size:1.05rem;color:#5b3a00;background:linear-gradient(135deg,#fde68a,#f59e0b);box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
.go.alt{background:#fff;color:#4b32c3;font-size:.95rem;padding:8px 16px}
/* הדרך */
.road{margin:22px 0 6px}
.row{position:relative;display:flex;gap:6px;margin-bottom:34px;padding:0 4px}
.row.o{flex-direction:row-reverse}
.row::before{content:"";position:absolute;left:0;right:0;top:50%;height:16px;margin-top:-8px;border-radius:9px;background:var(--road);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.row:not(.top)::after{content:"";position:absolute;top:-36px;height:40px;width:16px;background:var(--road)}
.row.e:not(.top)::after{left:14px}
.row.o:not(.top)::after{right:14px}
.st{position:relative;flex:0 0 calc((100% - 24px)/5);max-width:calc((100% - 24px)/5);aspect-ratio:1;border:0;border-radius:50%;font:inherit;font-weight:800;font-size:1.05rem;color:#475569;background:var(--todo);box-shadow:0 3px 0 #94a3b8,0 5px 8px rgba(0,0,0,.2);cursor:pointer;padding:0}
.st.done{background:radial-gradient(circle at 35% 30%,#fde68a,var(--done));color:#5b3a00;box-shadow:0 3px 0 #b45309,0 5px 8px rgba(0,0,0,.25)}
.st.done::after{content:"✓";position:absolute;right:-3px;top:-5px;width:20px;height:20px;border-radius:50%;background:#16a34a;color:#fff;font-size:.78rem;line-height:20px}
.st.next{background:radial-gradient(circle at 35% 30%,#86efac,var(--next));color:#fff;box-shadow:0 3px 0 #166534,0 5px 8px rgba(0,0,0,.25);animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.14)}}
.st .me{position:absolute;top:-30px;left:50%;transform:translateX(-50%);font-size:26px;animation:hop 1s ease-in-out infinite;pointer-events:none}
@keyframes hop{50%{top:-36px}}
.st .em{font-size:1.25rem;line-height:1}
.start{text-align:center;font-weight:800;margin:-14px 0 4px}
/* כרטיס תחנה */
.sheet{position:fixed;inset:auto 0 0 0;z-index:50;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.3);padding:16px 18px 20px;transform:translateY(110%);transition:transform .25s;max-width:560px;margin:0 auto}
.sheet.on{transform:none}
.sheet h3{margin:0 0 2px}
.sheet .ch{color:#7c6a8c;font-size:.88rem}
.sheet p{margin:8px 0;line-height:1.6}
.sheet .x{position:absolute;left:12px;top:10px;border:0;background:none;font-size:1.4rem;cursor:pointer}
/* אלופים */
.champs{background:#fff;border-radius:18px;padding:14px 16px;margin-top:18px;box-shadow:0 3px 10px rgba(0,0,0,.1)}
.champs h2{margin:0 0 8px;font-size:1.15rem}
.champs ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.champs li{background:#fef3c7;border:1px solid #fcd34d;border-radius:999px;padding:4px 11px;font-size:.9rem;font-weight:700}
.champs li.me{background:#fde68a;border-color:#f59e0b}
.champs li span{font-weight:400;color:#7c6a8c}
/* טקס כניסה */
.cer{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 35%,#4c1d95,#1e1b4b);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;color:#fff;overflow:hidden}
.cer.on{display:flex}
.gate{position:relative;width:200px;height:150px;margin-bottom:10px;perspective:600px}
.gate .l,.gate .r{position:absolute;top:0;width:50%;height:100%;background:linear-gradient(#b45309,#78350f);border:3px solid #fbbf24;transition:transform 1.6s}
.gate .l{right:0;transform-origin:right;border-radius:0 90px 0 0}
.gate .r{left:0;transform-origin:left;border-radius:90px 0 0 0}
.gate .in{position:absolute;inset:0;background:radial-gradient(circle,#fff7c2,#fbbf24 60%,#b45309);font-size:70px;display:flex;align-items:center;justify-content:center}
.cer.open .gate .l{transform:rotateY(-110deg)}
.cer.open .gate .r{transform:rotateY(110deg)}
.cer .t{font-size:1.45rem;font-weight:800;line-height:1.5;min-height:5.6em;max-width:480px;display:flex;align-items:center;justify-content:center}
.cer .big{font-size:2.4rem}
.fall{position:absolute;top:-40px;font-size:26px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.sign{margin-top:18px}
@media (prefers-reduced-motion:reduce){.st.next,.st .me,.palace.ready .castle,.fall{animation:none}}
</style>

<script>
const ROWS=[{"key":"yehoshua","n":1,"title":"חזק ואמץ","emoji":"💪","chapters":"פרק א׳ פסוקים א-ט","know":"אחרי מות משה ה׳ פונה ליהושע ומבטיח: עמך בכל אשר תלך. סוד ההצלחה הוא ספר התורה שלא זז מהפה.","url":"yehoshua/01.html"},{"key":"yehoshua","n":2,"title":"שבטי עבר הירדן עונים ליהושע","emoji":"🤝","chapters":"פרק א׳ פסוקים יב-יח","know":"ראובן, גד וחצי מנשה קיבלו נחלה בעבר הירדן, ובכל זאת הבטיחו ליהושע לצאת חמושים לפני אחיהם. אחדות היא חלק מאהבת ה׳.","url":"yehoshua/02.html"},{"key":"yehoshua","n":3,"title":"המרגלים בבית רחב","emoji":"🕵️","chapters":"פרק ב׳","know":"יהושע שולח שני מרגלים ליריחו. רחב מסתירה אותם ומבקשת חסד. המעשה הקטן שלה הציל משפחה שלמה.","url":"yehoshua/03.html"},{"key":"yehoshua","n":4,"title":"מי אמר? רחב והמרגלים","emoji":"💬","chapters":"פרק ב׳","know":"רחב מצהירה: ה׳ אלהיכם הוא אלהים בשמים ממעל ועל הארץ מתחת. היא מבקשת חסד וקובעת סימן: חוט השני.","url":"yehoshua/04.html"},{"key":"yehoshua","n":5,"title":"סדר ההכנות לחציית הירדן","emoji":"📋","chapters":"פרק ג׳ פסוקים א-ז","know":"לפני החציה העם התקדש ויצא אחרי ארון הברית. יהושע אומר: מחר יעשה ה׳ בקרבכם נפלאות.","url":"yehoshua/05.html"},{"key":"yehoshua","n":6,"title":"הארון והירדן נעצר","emoji":"🌊","chapters":"פרק ג׳","know":"כשכפות רגלי הכהנים נחו במי הירדן, המים העליונים עמדו נד אחד והעם עבר ביבשה.","url":"yehoshua/06.html"},{"key":"yehoshua","n":7,"title":"בונים את אבני הגלגל","emoji":"🧱","chapters":"פרק ד׳ פסוקים א-ט","know":"לקחו שתים עשרה אבנים מהירדן, אחת לכל שבט, והציבו אותן בגלגל כזיכרון לנס.","url":"yehoshua/07.html"},{"key":"yehoshua","n":8,"title":"זוגות זיכרון: אבני זיכרון","emoji":"🗿","chapters":"פרק ד׳","know":"אבני הגלגל הן זיכרון ״למען דעת כל עמי הארץ את יד ה׳״. מי שמזכיר את הנס מחזק את האמונה.","url":"yehoshua/08.html"},{"key":"yehoshua","n":9,"title":"כרטיסיות: מילה בגלגל","emoji":"✂️","chapters":"פרק ה׳ פסוקים א-ט","know":"בגלגל יהושע מל את הדור שנולד במדבר. ה׳ אמר: היום גללתי את חרפת מצרים מעליכם.","url":"yehoshua/09.html"},{"key":"yehoshua","n":10,"title":"מצא את הטעות: פסח, מן ושר צבא ה׳","emoji":"⚔️","chapters":"פרק ה׳ פסוקים י-טו","know":"בגלגל עשו פסח, אכלו מפרי הארץ והמן פסק. אז יהושע פגש את שר צבא ה׳ ולמד שה׳ הוא המנהיג האמיתי.","url":"yehoshua/10.html"},{"key":"yehoshua","n":11,"title":"ציר זמן: שבעת ימי יריחו","emoji":"📯","chapters":"פרק ו׳ פסוקים א-טז","know":"שישה ימים מקיפים את יריחו בשתיקה, ובשביעי שבע הקפות, שופרות, תרועה והחומה נופלת. הנצחון בא מהאמונה ולא מהנשק.","url":"yehoshua/11.html"},{"key":"yehoshua","n":12,"title":"מרוץ: נפילת החומה והחרם","emoji":"🏃","chapters":"פרק ו׳ פסוקים טז-כז","know":"יריחו הייתה חרם לה׳: אין לקחת שלל. רק רחב ובית אביה ניצלו. הכסף והזהב הוכנסו לאוצר בית ה׳.","url":"yehoshua/12.html"},{"key":"yehoshua","n":13,"title":"הישרדות: מעל עכן","emoji":"❤️","chapters":"פרק ז׳ פסוקים א-ט","know":"עכן לקח מהחרם, וישראל נחלו בעי. יהושע נפל על פניו, וה׳ הסביר: ישראל חטא.","url":"yehoshua/13.html"},{"key":"yehoshua","n":14,"title":"חשיפת תמונה: עמק עכור","emoji":"🏞️","chapters":"פרק ז׳ פסוקים י-כו","know":"הגורל הגיע לעכן. הוא הודה: ראיתי ואחמד ואקח. העונש היה בעמק עכור, ושב ה׳ מחרון אפו.","url":"yehoshua/14.html"},{"key":"yehoshua","n":15,"title":"חידון מהירות: ה׳ מעודד ביציאה לעי","emoji":"⚡","chapters":"פרק ח׳ פסוקים א-ט","know":"אחרי התיקון ה׳ אומר ליהושע: אל תירא ואל תחת. יש תוכנית: אורב מאחורי העיר.","url":"yehoshua/15.html"},{"key":"yehoshua","n":16,"title":"משחק לוח: האורב בעי","emoji":"🎲","chapters":"פרק ח׳ פסוקים י-כט","know":"האורב יצא כשיהושע הושיט את הכידון. העי נשרפה. אנשי העי ראו עשן ולא ידעו לאן לברוח.","url":"yehoshua/16.html"},{"key":"yehoshua","n":17,"title":"בועות: ברכות וקללות בהר עיבל","emoji":"⛰️","chapters":"פרק ח׳ פסוקים ל-לה","know":"יהושע בנה מזבח בהר עיבל, כתב את התורה על אבנים, והעם עמד מול הר גריזים והר עיבל לשמוע ברכה וקללה.","url":"yehoshua/17.html"},{"key":"yehoshua","n":18,"title":"דיג מילים: הגבעונים מערימים","emoji":"🎣","chapters":"פרק ט׳ פסוקים א-טו","know":"הגבעונים התחפשו לבאים מרחוק עם לחם יבש ונעליים בלויות. ישראל כרתו להם ברית בלי לשאול את פי ה׳.","url":"yehoshua/18.html"},{"key":"yehoshua","n":19,"title":"אלבום כרטיסים: שמירת השבועה","emoji":"🃏","chapters":"פרק ט׳ פסוקים טז-כז","know":"אחרי שלושה ימים התברר שהגבעונים שכנים. ישראל לא פגעו בהם בגלל השבועה, והפכו אותם לחוטבי עצים ושואבי מים.","url":"yehoshua/19.html"},{"key":"yehoshua","n":20,"title":"בינגו: חמשת המלכים","emoji":"👑","chapters":"פרק י׳ פסוקים א-יא","know":"חמשת מלכי האמורי התאחדו נגד גבעון. יהושע עלה בלילה מהגלגל, ה׳ הפיל אבני ברד והם ניצחו.","url":"yehoshua/20.html"},{"key":"yehoshua","n":21,"title":"מדליקים נרות: השמש עומדת בגבעון","emoji":"☀️","chapters":"פרק י׳ פסוקים יב-טו","know":"יהושע ביקש: שמש בגבעון דום. ה׳ שמע בקול איש, ושמע לתפילה כי ה׳ נלחם לישראל.","url":"yehoshua/21.html"},{"key":"yehoshua","n":22,"title":"חיבור נקודות: מערת מקדה","emoji":"🕳️","chapters":"פרק י׳ פסוקים טז-כז","know":"המלכים התחבאו במערה במקדה. יהושע ציווה לגלול אבנים ולהציב שומרים. אחר כך אמר: חזקו ואמצו.","url":"yehoshua/22.html"},{"key":"yehoshua","n":23,"title":"חיבור קווים: מי מרום וחצור","emoji":"🔥","chapters":"פרק י״א","know":"מלכי הצפון התאספו עם יבין מלך חצור במי מרום. ה׳ אמר: אל תירא, ויהושע ניצח ושרף את חצור.","url":"yehoshua/23.html"},{"key":"yehoshua","n":24,"title":"מיון: מלכי הדרום ומלכי הצפון","emoji":"🗂️","chapters":"פרקים י׳ ו-י״א","know":"בפרק י נלחם יהושע בדרום (ירושלים, חברון, ירמות, לכיש, עגלון). בפרק יא נלחם בצפון (חצור ובעלי בריתה).","url":"yehoshua/24.html"},{"key":"yehoshua","n":25,"title":"כרטיסיות: חלוקת הארץ","emoji":"🗺️","chapters":"פרקים י״ג-י״ד","know":"הארץ חולקה בגורל, בהנהגת יהושע ואלעזר. לשבט לוי אין נחלה כי ה׳ הוא נחלתו.","url":"yehoshua/25.html"},{"key":"yehoshua","n":26,"title":"נכון או לא נכון: כלב מבקש חברון","emoji":"🦁","chapters":"פרק י״ד פסוקים ו-טו","know":"כלב בן יפונה, בן שמונים וחמש, ביקש את חברון כי ה׳ הבטיח לו, ואמר: מלאתי אחרי ה׳.","url":"yehoshua/26.html"},{"key":"yehoshua","n":27,"title":"מי רוצה להיות מיליונר תורני: כלב מלא אחרי ה׳","emoji":"💎","chapters":"פרק י״ד","know":"כלב היה מלא אחרי ה׳, ולכן חברון הייתה לו נחלה. המילים ״מלא אחרי ה׳״ מתארות אהבה בלי פשרות.","url":"yehoshua/27.html"},{"key":"yehoshua","n":28,"title":"מצא את הטעות: עתניאל ועכסה","emoji":"💧","chapters":"פרק ט״ו","know":"עתניאל בן קנז כבש את קרית ספר וקיבל את עכסה. עכסה ביקשה גלת מים, וכלב נתן לה גלות עליות ותחתיות.","url":"yehoshua/28.html"},{"key":"yehoshua","n":29,"title":"מי אמר? בנות צלפחד ובני יוסף","emoji":"👭","chapters":"פרק י״ז","know":"בנות צלפחד ביקשו נחלה כפי שה׳ ציווה את משה. בני יוסף התלוננו שנחלתם קטנה, ויהושע ענה להם.","url":"yehoshua/29.html"},{"key":"yehoshua","n":30,"title":"סדר ההתקדמות: שילה וכתיבת הארץ","emoji":"⛺","chapters":"פרק י״ח","know":"אחרי שהוקם המשכן בשילה, יהושע דחק בשבטים הנותרים לקחת נחלה. שלושה אנשים לכל שבט כתבו את הארץ.","url":"yehoshua/30.html"},{"key":"yehoshua","n":31,"title":"ציר זמן: בורחים לעיר מקלט","emoji":"🏙️","chapters":"פרק כ׳","know":"ה׳ ציווה שש ערי מקלט, כדי שמי שהרג בשגגה יוכל לברוח ולהיות מוגן עד שיוכרע דינו.","url":"yehoshua/31.html"},{"key":"yehoshua","n":32,"title":"חיבור קווים: ערי הלוויים וערי המקלט","emoji":"🏘️","chapters":"פרקים כ׳-כ״א","know":"ללוויים ניתנו ארבעים ושמונה ערים, ובהן שש ערי מקלט. בסוף הפרק כתוב: לא נפל דבר מכל הדבר הטוב אשר דבר ה׳.","url":"yehoshua/32.html"},{"key":"yehoshua","n":33,"title":"מסע: המזבח בעבר הירדן","emoji":"🏛️","chapters":"פרק כ״ב פסוקים א-יב","know":"בני ראובן, גד וחצי מנשה חזרו הביתה ובנו מזבח גדול בגלילות הירדן. שאר ישראל נבהלו ורצו להילחם.","url":"yehoshua/33.html"},{"key":"yehoshua","n":34,"title":"מרוץ: פינחס והשלום על המזבח","emoji":"🕊️","chapters":"פרק כ״ב פסוקים יג-לד","know":"בני ראובן וגד הסבירו שהמזבח הוא ״עד״ שהם חלק מעם ה׳, ולא להקרבה. פינחס אמר: היום ידענו כי בתוכנו ה׳.","url":"yehoshua/34.html"},{"key":"yehoshua","n":35,"title":"בריחה מחדר: נאום הפרידה של יהושע","emoji":"🗝️","chapters":"פרק כ״ג","know":"יהושע זקן מסכם: ה׳ הוא הנלחם לכם, חזקו מאוד לשמור את התורה, ונשמרתם מאד לנפשותיכם לאהבה את ה׳ אלהיכם.","url":"yehoshua/35.html"},{"key":"yehoshua","n":36,"title":"חידון מהירות: בחרו לכם היום","emoji":"🌟","chapters":"פרק כ״ד פסוקים א-טו","know":"בשכם יהושע מספר את תולדות העם ומבקש שיבחרו את ה׳. הוא אומר: ואנכי וביתי נעבד את ה׳.","url":"yehoshua/36.html"},{"key":"yehoshua","n":37,"title":"הישרדות: ואנכי וביתי נעבד את ה׳","emoji":"🏠","chapters":"פרק כ״ד פסוקים טז-כח","know":"יהושע בודק את העם: ״לא תוכלו לעבד את ה׳״, והעם עונה: ״לא כי את ה׳ נעבד״. יהושע כורת ברית ומקים אבן לעדות.","url":"yehoshua/37.html"},{"key":"yehoshua","n":38,"title":"בינגו: מות יהושע ועצמות יוסף","emoji":"🌿","chapters":"פרק כ״ד פסוקים כט-לג","know":"יהושע מת בן מאה ועשר ונקבר בתמנת סרח. עצמות יוסף נקברו בשכם, ואלעזר הכהן נקבר בגבעת פינחס.","url":"yehoshua/38.html"},{"key":"yehoshua","n":39,"title":"אלבום דמויות: ספר יהושע","emoji":"📚","chapters":"כל הספר","know":"דמויות מרכזיות: יהושע המנהיג, כלב המלא אחרי ה׳, רחב שהצטרפה לעם, עכן שחטא, פינחס ואלעזר הכהנים.","url":"yehoshua/39.html"},{"key":"yehoshua","n":40,"title":"חשיפת תמונה: מפת מקומות בספר יהושע","emoji":"🗺️","chapters":"כל הספר","know":"מקומות מפתח: גלגל, יריחו, העי, הר עיבל, גבעון, חברון, שילה, שכם. מי שמכיר מקומות מבין טוב יותר את הסיפור.","url":"yehoshua/40.html"},{"key":"yehoshua","n":41,"title":"חיבור נקודות: ניסים בספר יהושע","emoji":"✨","chapters":"כל הספר","know":"בספר יהושע יש ניסים גדולים: הירדן, חומת יריחו, ברד ושמש בגבעון, ופסק המן. כולם באו כדי שנדע שה׳ נלחם לישראל.","url":"yehoshua/41.html"},{"key":"yehoshua","n":42,"title":"מיון: מי עשה מה?","emoji":"🧩","chapters":"כל הספר","know":"שלוש דמויות, שלוש מעשים: יהושע מנהיג ומכריז, רחב מסתירה ומאמינה, כלב מבקש את ההר.","url":"yehoshua/42.html"},{"key":"yehoshua","n":43,"title":"מדליקים נרות: יהושע האיש","emoji":"🕯️","chapters":"כל הספר","know":"יהושע בן נון משבט אפרים, משרת משה, נער שלא מש מהאוהל. בסוף נקרא ״עבד ה׳״.","url":"yehoshua/43.html"},{"key":"yehoshua","n":44,"title":"בועות: רחב ביריחו","emoji":"🧵","chapters":"פרקים ב׳, ו׳","know":"רחב גרה בחומת יריחו, הצטרפה לעם ישראל בזכות אמונתה. חוט השני הציל אותה ואת משפחתה.","url":"yehoshua/44.html"},{"key":"yehoshua","n":45,"title":"דיג מילים: משפטים בספר יהושע","emoji":"📜","chapters":"כל הספר","know":"משפטים חשובים בספר: חזק ואמץ, אל תירא, בחרו לכם היום, ואנכי וביתי נעבד את ה׳, לא נפל דבר.","url":"yehoshua/45.html"},{"key":"yehoshua","n":46,"title":"משחק לוח: מה קרה אחרי מה?","emoji":"🎲","chapters":"כל הספר","know":"סדר האירועים בספר: מינוי יהושע, מרגלים, חציית הירדן, מילה ופסח, יריחו, עכן, העי, עיבל, גבעונים, מלחמות, חלוקה, ערי מקלט, מזבח, נאום ופרידה.","url":"yehoshua/46.html"},{"key":"yehoshua","n":47,"title":"מי אמר למי? סיכום ספר יהושע","emoji":"🗣️","chapters":"כל הספר","know":"ציטוטים חשובים: ״חזק ואמץ״ (ה׳ ליהושע), ״ידעתי כי נתן ה׳״ (רחב), ״של נעלך״ (שר צבא ה׳), ״שמש בגבעון דום״ (יהושע).","url":"yehoshua/47.html"},{"key":"yehoshua","n":48,"title":"זוגות זיכרון: מקומות ואירועים","emoji":"📍","chapters":"כל הספר","know":"יריחו, גלגל, עיבל, גבעון, שילה, שכם: כל מקום קשור לאירוע חשוב בספר.","url":"yehoshua/48.html"},{"key":"yehoshua","n":49,"title":"מי רוצה להיות מיליונר: אהבת ה׳ בספר יהושע","emoji":"💖","chapters":"כל הספר","know":"אהבת ה׳ בספר: ״ונשמרתם מאד לנפשותיכם לאהבה את ה׳״, כלב ״מלא אחרי ה׳״, ורחב שהאמינה.","url":"yehoshua/49.html"},{"key":"yehoshua","n":50,"title":"ציר זמן: כל ספר יהושע","emoji":"📖","chapters":"כל הספר","know":"הספר בקווים: ה׳ מחזק את יהושע, המרגלים ורחב, חציית הירדן, נפילת יריחו וחטא עכן, חלוקת הארץ ושילה, נאום ופרידה וברית בשכם.","url":"yehoshua/50.html"},{"key":"shoftim","n":1,"title":"כרטיסיות: אחרי יהושע, מי עולה ראשון?","emoji":"🦁","chapters":"פרק א׳ פסוקים א-טז","know":"אחרי מות יהושע שאלו בני ישראל מי יעלה ראשון נגד הכנעני. ה׳ ענה: יהודה יעלה. יהודה ביקש מאחיו שמעון לעלות איתו.","url":"shoftim/01.html"},{"key":"shoftim","n":2,"title":"נכון או לא: שבטים שלא הורישו","emoji":"🏘️","chapters":"פרק א׳ פסוקים יח-לו","know":"שבטים רבים לא הצליחו או לא רצו להוריש את הכנענים. זה הרקע לבעיות בספר.","url":"shoftim/02.html"},{"key":"shoftim","n":3,"title":"מי אמר? מלאך ה׳ בבוכים","emoji":"😢","chapters":"פרק ב׳ פסוקים א-ה","know":"מלאך ה׳ עלה מהגלגל לבוכים: ה׳ הזכיר את הבטחתו ואת הציווי שלא לכרות ברית עם יושבי הארץ. העם בכה.","url":"shoftim/03.html"},{"key":"shoftim","n":4,"title":"סדר: מות יהושע ודור חדש","emoji":"🌅","chapters":"פרק ב׳ פסוקים ו-יג","know":"כל ימי יהושע וזקני דורו עבדו את ה׳. אחריהם קם דור שלא ידע את ה׳, והוא התחיל לעבוד את הבעלים.","url":"shoftim/04.html"},{"key":"shoftim","n":5,"title":"ציר זמן: מעגל השופטים","emoji":"🔄","chapters":"פרק ב׳ פסוקים יא-כג","know":"המעגל שחוזר בספר: חטא, צרה, זעקה, מושיע ושקט, ואחר כך חוזרים לחטוא. כך מבינים כל סיפור בספר.","url":"shoftim/05.html"},{"key":"shoftim","n":6,"title":"מצא את הטעות: למה נשארו גויים?","emoji":"🧪","chapters":"פרק ג׳ פסוקים א-ו","know":"ה׳ השאיר גויים בארץ כדי לנסות את ישראל: האם ישמעו למצוות. ישראל התחתנו איתם ועבדו את אלהיהם.","url":"shoftim/06.html"},{"key":"shoftim","n":7,"title":"מסע: עתניאל מציל מכושן רשעתים","emoji":"🛡️","chapters":"פרק ג׳ פסוקים ז-יא","know":"בני ישראל עבדו את הבעלים. ה׳ נתן אותם ביד כושן רשעתים שמונה שנים. הם זעקו ועתניאל בן קנז הציל אותם, ושקטה הארץ ארבעים שנה.","url":"shoftim/07.html"},{"key":"shoftim","n":8,"title":"בריחה מחדר: אהוד בן גרא","emoji":"🗡️","chapters":"פרק ג׳ פסוקים יב-ל","know":"עגלון מלך מואב לחץ את ישראל שמונה עשרה שנים. אהוד בן גרא מבנימין, אטר יד ימינו, הביא מנחה, הרג את עגלון ואסף את העם.","url":"shoftim/08.html"},{"key":"shoftim","n":9,"title":"חידון מהירות: שמגר בן ענת","emoji":"🐂","chapters":"פרק ג׳ פסוק לא","know":"שמגר בן ענת הכה שש מאות פלשתים במלמד הבקר, מקל להנהגת שוורים, והושיע גם הוא את ישראל.","url":"shoftim/09.html"},{"key":"shoftim","n":10,"title":"מי רוצה להיות מיליונר: דבורה הנביאה","emoji":"🌴","chapters":"פרק ד׳ פסוקים א-ה","know":"דבורה הנביאה, אשת לפידות, שפטה את ישראל תחת התמר בהר אפרים. יבין מלך כנען לחץ את ישראל עשרים שנה.","url":"shoftim/10.html"},{"key":"shoftim","n":11,"title":"מרוץ: דבורה וברק בהר תבור","emoji":"🏔️","chapters":"פרק ד׳ פסוקים ו-טז","know":"דבורה שלחה את ברק בן אבינועם להתאסף בהר תבור עם עשרת אלפים איש. ברק ביקש שדבורה תלך איתו, וה׳ המם את סיסרא ומחנהו.","url":"shoftim/11.html"},{"key":"shoftim","n":12,"title":"הישרדות: יעל וסיסרא","emoji":"⛺","chapters":"פרק ד׳ פסוקים יז-כב","know":"סיסרא נמלט לאוהל יעל אשת חבר הקיני. היא נתנה לו חלב, כיסתה אותו, והרגה אותו ביתד. ברק מצא את סיסרא מת.","url":"shoftim/12.html"},{"key":"shoftim","n":13,"title":"חיבור קווים: שירת דבורה","emoji":"🎶","chapters":"פרק ה׳","know":"דבורה וברק שרו שיר הודיה: ה׳ יצא לעזרה, הכוכבים נלחמו וקישון גרף את האויבים. השיר מסתיים: ואוהביו כצאת השמש בגבורתו.","url":"shoftim/13.html"},{"key":"shoftim","n":14,"title":"משחק לוח: מדין לוחץ את ישראל","emoji":"🐫","chapters":"פרק ו׳ פסוקים א-י","know":"ישראל עשו הרע ונתנו ביד מדין שבע שנים. הם זעקו, וה׳ שלח נביא שהזכיר: אני ה׳ אלהיכם ולא שמעתם בקולי.","url":"shoftim/14.html"},{"key":"shoftim","n":15,"title":"בונים: מלאך ה׳ מופיע לגדעון","emoji":"🌾","chapters":"פרק ו׳ פסוקים יא-כד","know":"גדעון חבט חיטים בגת, ומלאך ה׳ אמר לו: ה׳ עמך גבור החיל. גדעון הרגיש קטן, אך ה׳ אמר: כי אהיה עמך.","url":"shoftim/15.html"},{"key":"shoftim","n":16,"title":"חשיפת תמונה: הרס מזבח הבעל","emoji":"🏺","chapters":"פרק ו׳ פסוקים כה-לב","know":"ה׳ ציווה את גדעון להרוס את מזבח הבעל של אביו ולבנות מזבח לה׳. הוא עשה זאת בלילה, ואביו הגן עליו: אם אלהים הוא ירב לו.","url":"shoftim/16.html"},{"key":"shoftim","n":17,"title":"בועות: גיזת הצמר","emoji":"🐑","chapters":"פרק ו׳ פסוקים לג-מ","know":"גדעון ביקש אות: גיזת צמר רטובה והארץ יבשה, ובלילה השני להפך. ה׳ ענה לשניהם בסבלנות.","url":"shoftim/17.html"},{"key":"shoftim","n":18,"title":"דיג מילים: שלוש מאות איש","emoji":"💧","chapters":"פרק ז׳ פסוקים א-ח","know":"ה׳ הקטין את הצבא מ-32,000 ל-300 כדי שלא יתפארו ״ידי הושיעה לי״. הבחינה הייתה לפי אופן שתיית המים.","url":"shoftim/18.html"},{"key":"shoftim","n":19,"title":"בינגו: חלום לחם השעורים","emoji":"🍞","chapters":"פרק ז׳ פסוקים ט-כה","know":"גדעון שמע חלום על לחם שעורים שנופל על אוהל מדין, והבין שה׳ נתן אותם בידו. עם שופרות וכדים ריקים ולפידים ניצחו השלוש מאות.","url":"shoftim/19.html"},{"key":"shoftim","n":20,"title":"אלבום כרטיסים: אפרים, זבח וצלמונע","emoji":"🤲","chapters":"פרק ח׳ פסוקים א-כא","know":"אפרים התלונן על גדעון, והוא ענה בענווה ושיבח אותם. אחר כך רדף אחרי זבח וצלמונע, מלכי מדין.","url":"shoftim/20.html"},{"key":"shoftim","n":21,"title":"מדליקים נרות: ה׳ ימשול בכם","emoji":"👑","chapters":"פרק ח׳ פסוקים כב-לה","know":"העם הציע לגדעון למלוך, והוא ענה: לא אמשול אני ולא ימשול בני בכם, ה׳ ימשול בכם.","url":"shoftim/21.html"},{"key":"shoftim","n":22,"title":"חיבור נקודות: אבימלך ומשל יותם","emoji":"🌳","chapters":"פרק ט׳ פסוקים א-כא","know":"אבימלך בן גדעון מתמנה מלך בשכם בעזרת אנשי שכם. יותם, בנו הצעיר של גדעון, מספר משל על העצים שבוחרים מלך.","url":"shoftim/22.html"},{"key":"shoftim","n":23,"title":"מיון: משל יותם","emoji":"🌿","chapters":"פרק ט׳","know":"במשל יותם שלושה עצים טובים מסרבים למלוך כי הם עסוקים ביצירה, והאטד הקוצני מסכים. המסר: מי שיש לו תרומה אינו מחפש שררה.","url":"shoftim/23.html"},{"key":"shoftim","n":24,"title":"זוגות זיכרון: סוף אבימלך","emoji":"🏰","chapters":"פרק ט׳ פסוקים כב-נז","know":"אחרי שלוש שנים הסתכסכו אבימלך ואנשי שכם. בסוף נפל אבימלך בתבץ כשאשה השליכה עליו פלח ריחיים, וקללת יותם התקיימה.","url":"shoftim/24.html"},{"key":"shoftim","n":25,"title":"מי אמר? ישראל זועקים בימי יפתח","emoji":"📣","chapters":"פרק י׳ פסוקים ו-יח","know":"ישראל שוב עבדו אלילים. פלשתים ובני עמון לחצו אותם. הם הודו ״חטאנו״ והסירו את אלהי הנכר. ״ותקצר נפשו בעמל ישראל״.","url":"shoftim/25.html"},{"key":"shoftim","n":26,"title":"חידון מהירות: יפתח הגלעדי","emoji":"🏞️","chapters":"פרק י״א פסוקים א-יא","know":"יפתח הגלעדי היה גבור חיל. אחיו גירשו אותו, אך כשבא איום, זקני גלעד חזרו לבקש ממנו להיות ראש. יפתח אמר: אם יתן ה׳ אותם לפני, אהיה לכם לראש.","url":"shoftim/26.html"},{"key":"shoftim","n":27,"title":"סדר: יפתח ומלך בני עמון","emoji":"✉️","chapters":"פרק י״א פסוקים יב-כח","know":"יפתח שלח שליחים למלך עמון: מה לי ולך? הוא הסביר שישראל לא לקחו את ארץ עמון, וה׳ נתן להם את הארץ. מלך עמון לא שמע.","url":"shoftim/27.html"},{"key":"shoftim","n":28,"title":"נכון או לא: הנדר של יפתח","emoji":"🤲","chapters":"פרק י״א פסוקים כט-מ","know":"יפתח נדר נדר לה׳ לפני המלחמה. אחרי הנצחון הנדר גרם לצער גדול. הסיפור מלמד אותנו לחשוב היטב לפני שנודרים.","url":"shoftim/28.html"},{"key":"shoftim","n":29,"title":"מסע: אפרים ושיבולת","emoji":"🌾","chapters":"פרק י״ב פסוקים א-ז","know":"אפרים כעס כי לא נקראו למלחמה. יפתח ענה שהוא קרא ולא באו. שומרי הגלעד בחנו את אנשי אפרים במעברות הירדן בעזרת המילה שיבולת.","url":"shoftim/29.html"},{"key":"shoftim","n":30,"title":"מי רוצה להיות מיליונר: לידת שמשון","emoji":"👶","chapters":"פרק י״ג פסוקים א-כה","know":"פלשתים לחצו את ישראל ארבעים שנה. מלאך ה׳ בישר לאשת מנוח שתלד בן נזיר אלהים מן הבטן שיתחיל להושיע את ישראל.","url":"shoftim/30.html"},{"key":"shoftim","n":31,"title":"מרוץ: מנוח והמנחה","emoji":"🔥","chapters":"פרק י״ג פסוקים ח-כה","know":"מנוח התפלל שהמלאך יחזור ללמד אותם. המלאך חזר, והם הקריבו מנחה, והמלאך עלה בלהבת המזבח.","url":"shoftim/31.html"},{"key":"shoftim","n":32,"title":"הישרדות: שמשון והאריה","emoji":"🦁","chapters":"פרק י״ד פסוקים א-ט","know":"שמשון ירד לתמנתה. בדרך פגש כפיר אריות, ורוח ה׳ צלחה עליו והוא שסע אותו בידיו. אחר כך מצא בגופה דבורים ודבש.","url":"shoftim/32.html"},{"key":"shoftim","n":33,"title":"משחק לוח: חידת שמשון","emoji":"🍯","chapters":"פרק י״ד פסוקים י-כ","know":"בשבעת ימי המשתה הציג שמשון חידה לשלושים שושבינים: מהאוכל יצא מאכל ומעז יצא מתוק. הם לא פתרו אלא בעזרת אשתו.","url":"shoftim/33.html"},{"key":"shoftim","n":34,"title":"בריחה מחדר: שועלים ולחי חמור","emoji":"🦊","chapters":"פרק ט״ו פסוקים א-יז","know":"שמשון תפס שלוש מאות שועלים וקשר לפידים בין זנבותיהם כדי לשרוף את שדות הפלשתים. אחר כך הכה אלף איש בלחי חמור.","url":"shoftim/34.html"},{"key":"shoftim","n":35,"title":"בונים: מים מהלחי","emoji":"💦","chapters":"פרק ט״ו פסוקים יח-כ","know":"אחרי הניצחון שמשון צמא מאד וקרא אל ה׳. ה׳ בקע מכתש בלחי ויצאו מים. שמשון שתה ורוחו שבה.","url":"shoftim/35.html"},{"key":"shoftim","n":36,"title":"חשיפת תמונה: שמשון בעזה","emoji":"🚪","chapters":"פרק ט״ז פסוקים א-ג","know":"שמשון הגיע לעזה, אנשי העיר סגרו את השער וארבו לו. הוא קם בחצות, עקר את דלתות השער והעלה אותן להר.","url":"shoftim/36.html"},{"key":"shoftim","n":37,"title":"בועות: סוד הכוח","emoji":"💇","chapters":"פרק ט״ז פסוקים ד-כא","know":"שמשון גילה לדלילה שנזירותו לה׳ היא סוד כוחו, וסימנה הוא השיער. כשהתגלח, ה׳ סר מעליו. זו אזהרה לשמור על מה שמקדשים.","url":"shoftim/37.html"},{"key":"shoftim","n":38,"title":"דיג מילים: תפילת שמשון","emoji":"🙏","chapters":"פרק ט״ז פסוקים כב-לא","know":"שערו של שמשון החל לצמוח. בבית דגון הפלשתים חגגו. שמשון קרא לה׳: זכרני נא וחזקני נא אך הפעם הזאת. הוא שפט את ישראל עשרים שנה.","url":"shoftim/38.html"},{"key":"shoftim","n":39,"title":"בינגו: פסל מיכה ושבט דן","emoji":"🗿","chapters":"פרקים י״ז-י״ח","know":"מיכה בנה בית אלהים עם פסל ואפוד ותרפים, ושכר לוי לכהן. שבט דן לקח את הפסל והכהן והקים את עיר דן. הכתוב מסביר: אין מלך בישראל.","url":"shoftim/39.html"},{"key":"shoftim","n":40,"title":"אלבום: אין מלך בישראל","emoji":"👑","chapters":"פרקים י״ז-כ״א","know":"בסוף ספר שופטים חוזר המשפט: בימים ההם אין מלך בישראל, איש הישר בעיניו יעשה. זה מכין את הספר הבא, שמואל, ואת מלכות ישראל.","url":"shoftim/40.html"},{"key":"shoftim","n":41,"title":"מדליקים נרות: כאיש אחד","emoji":"🤝","chapters":"פרקים כ׳-כ״א","know":"בסוף הספר ישראל נקהלו כאיש אחד, שאלו באלהים, בכו לפני ה׳ בבית אל, ובסוף ביקשו להחזיר שלום ולבנות מחדש.","url":"shoftim/41.html"},{"key":"shoftim","n":42,"title":"חיבור נקודות: מי מהיכן?","emoji":"📍","chapters":"כל הספר","know":"כל שופט בא ממקום ומשבט: אהוד מבנימין, גדעון מעפרה, יפתח מגלעד, שמשון מצרעה, דבורה מהר אפרים, עתניאל בן קנז.","url":"shoftim/42.html"},{"key":"shoftim","n":43,"title":"חיבור קווים: המושיעים","emoji":"🦸","chapters":"כל הספר","know":"לכל מושיע היה סימן ייחודי: עתניאל ניצח את כושן, אהוד היה אטר יד ימינו, שמגר השתמש במלמד הבקר, גדעון נלחם בשלוש מאות, שמשון היה נזיר.","url":"shoftim/43.html"},{"key":"shoftim","n":44,"title":"ציר זמן: סדר השופטים","emoji":"📅","chapters":"כל הספר","know":"סדר השופטים העיקריים: עתניאל, אהוד, דבורה וברק, גדעון, יפתח, שמשון.","url":"shoftim/44.html"},{"key":"shoftim","n":45,"title":"מיון: מי הציל מאיזה אויב","emoji":"🗂️","chapters":"כל הספר","know":"מכל אויב ה׳ הציל באמצעות מושיע אחר: מארם נהרים וכנען, ממואב ומדין, ומהפלשתים.","url":"shoftim/45.html"},{"key":"shoftim","n":46,"title":"זוגות זיכרון: כלים ואותות","emoji":"🧰","chapters":"כל הספר","know":"בכל סיפור יש כלי או אות מיוחד: שיבולת, גיזת צמר, שופרות וכדים, מלמד הבקר, לחי חמור.","url":"shoftim/46.html"},{"key":"shoftim","n":47,"title":"כרטיסיות: מושגי יסוד בשופטים","emoji":"🃏","chapters":"כל הספר","know":"מושגי יסוד: שופט הוא מנהיג מושיע שה׳ מקים, המעגל חוזר: חטא, צרה, זעקה, מושיע, שקט.","url":"shoftim/47.html"},{"key":"shoftim","n":48,"title":"מצא את הטעות: מי עשה מה בשופטים","emoji":"🧠","chapters":"כל הספר","know":"סיכום עובדות: דבורה שפטה תחת התמר, גדעון בחר שלוש מאות, שמשון היה נזיר, אהוד היה אטר יד ימינו, עתניאל בן קנז.","url":"shoftim/48.html"},{"key":"shoftim","n":49,"title":"מי רוצה להיות מיליונר: אהבת ה׳ בשופטים","emoji":"💖","chapters":"כל הספר","know":"בספר שופטים, בכל מעגל ה׳ שומע זעקה ושולח מושיע. ״ותקצר נפשו בעמל ישראל״ מראה שה׳ אוהב.","url":"shoftim/49.html"},{"key":"shoftim","n":50,"title":"ציר זמן: כל ספר שופטים","emoji":"📖","chapters":"כל הספר","know":"הספר בקווים: מות יהושע ודור חדש, עתניאל ואהוד, דבורה וברק, גדעון, יפתח ושמשון, ובסוף: אין מלך בישראל.","url":"shoftim/50.html"},{"key":"shmuel","n":1,"title":"כרטיסיות: אלקנה וחנה בשילה","emoji":"🕍","chapters":"שמואל א פרק א","know":"אלקנה עלה מדי שנה לשילה להשתחוות ולזבוח לה׳. לחנה לא היו ילדים, ולפנינה היו. חנה בכתה ולא אכלה, ואלקנה אמר לה: הלוא אנכי טוב לך מעשרה בנים.","url":"shmuel/01.html"},{"key":"shmuel","n":2,"title":"החלק: תפילת חנה","emoji":"🙏","chapters":"שמואל א פרק א","know":"חנה התפללה בלב, שפתיה נעות וקולה לא נשמע. עלי חשב שהיא שיכורה, והיא הסבירה: אני אשה קשת רוח, ואשפך את נפשי לפני ה׳. היא נדרה להקדיש את בנה לה׳.","url":"shmuel/02.html"},{"key":"shmuel","n":3,"title":"מי אני: דמויות בפרק א-ב","emoji":"🕵️","chapters":"שמואל א פרקים א-ב","know":"הדמויות: חנה האם, אלקנה האב, עלי הכהן, פנינה, חפני ופנחס בני עלי, ושמואל הנער המשרת לפני ה׳.","url":"shmuel/03.html"},{"key":"shmuel","n":4,"title":"סדר נכון: מתפילה ללידה","emoji":"👶","chapters":"שמואל א פרק א","know":"הסדר: חנה בוכה בשילה, מתפללת, עלי מברך אותה, חנה חוזרת הביתה, ה׳ זוכר אותה, נולד שמואל, והיא מעלה אותו לשילה.","url":"shmuel/04.html"},{"key":"shmuel","n":5,"title":"מי רוצה להיות מיליונר: שירת חנה","emoji":"🎵","chapters":"שמואל א פרק ב","know":"חנה שרה: עלץ לבי בה׳, רמה קרני בה׳. אין קדוש כה׳ כי אין בלתיך ואין צור כאלהינו. ה׳ ממית ומחיה, מוריד שאול ויעל.","url":"shmuel/05.html"},{"key":"shmuel","n":6,"title":"מסע: שמואל קם בלילה","emoji":"🌙","chapters":"שמואל א פרק ג","know":"שמואל שכב בהיכל ה׳, וה׳ קרא לו. הוא רץ אל עלי שלוש פעמים. בפעם הרביעית עלי הבין שה׳ קורא ואמר: אם יקרא אליך ואמרת דבר ה׳ כי שומע עבדך.","url":"shmuel/06.html"},{"key":"shmuel","n":7,"title":"זוגות: מי ומה בספר שמואל","emoji":"🧩","chapters":"שמואל א א-ג","know":"התאמות: חנה עם תפילה, עלי עם משכן שילה, שמואל עם נער משרת, פנינה עם כעס, חפני ופנחס עם עבירות.","url":"shmuel/07.html"},{"key":"shmuel","n":8,"title":"מצא את הטעות: בית עלי","emoji":"🔍","chapters":"שמואל א פרק ב","know":"בני עלי לא הקפידו בקרבנות ולקחו בכוח מעבר למגיע להם. עלי הזהיר אותם, אך הם לא שמעו. איש אלהים בא לעלי ובישר שבניו ימותו ביום אחד.","url":"shmuel/08.html"},{"key":"shmuel","n":9,"title":"ציר זמן: מלידת שמואל עד נבואתו","emoji":"🕰️","chapters":"שמואל א א-ג","know":"הציר: חנה מתפללת, נולד שמואל, נשלח לשילה, שרה שירה, ה׳ קורא לו, כל ישראל יודעים כי נאמן שמואל לנביא לה׳.","url":"shmuel/09.html"},{"key":"shmuel","n":10,"title":"חדר בריחה: דבר ה׳ אל שמואל","emoji":"🗝️","chapters":"שמואל א פרק ג","know":"ה׳ גילה לשמואל שהוא יעניש את בית עלי על כך שבניו לא נכנעו להוראה. בבוקר עלי ביקש שיספר הכל, ושמואל לא הסתיר. עלי אמר: ה׳ הוא, הטוב בעיניו יעשה.","url":"shmuel/10.html"},{"key":"shmuel","n":11,"title":"מהירות: מלחמה באפק","emoji":"⚔️","chapters":"שמואל א פרק ד","know":"ישראל נלחמו בפלשתים ונוצחו. הזקנים אמרו: נקחה אלינו משילה את ארון ברית ה׳. המחנה קרא בשמחה, אך הפלשתים התחזקו ונצחו שוב. הארון נלקח, וחפני ופנחס מתו.","url":"shmuel/11.html"},{"key":"shmuel","n":12,"title":"שרידות: עלי ואשת פנחס","emoji":"💔","chapters":"שמואל א פרק ד","know":"איש בנימין בא לשילה וסיפר. עלי ישב על הכסא ליד הדרך, ושמע על ארון האלהים, ונפל אחורנית ומת. הוא היה בן תשעים ושמונה ושפט ארבעים שנה. כלתו ילדה וקראה לבן איכבוד: גלה כבוד מישראל.","url":"shmuel/12.html"},{"key":"shmuel","n":13,"title":"מי אני: אשדוד וגת","emoji":"🏺","chapters":"שמואל א פרק ה","know":"הפלשתים הכניסו את הארון לבית דגון באשדוד. דגון נפל לפניו. אחר כך הארון הוצא לגת ולעקרון, ובכל מקום פגעה בהם מכה.","url":"shmuel/13.html"},{"key":"shmuel","n":14,"title":"סדר נכון: הארון בארץ פלשתים","emoji":"📦","chapters":"שמואל א ה-ו","know":"הסדר: הפלשתים לוקחים את הארון לאשדוד, דגון נופל, הארון עובר לגת, ואחר כך לעקרון. שבעה חודשים בארץ פלשתים, ואז מחליטים להחזיר אותו.","url":"shmuel/14.html"},{"key":"shmuel","n":15,"title":"מרוץ: הפרות והארון","emoji":"🐄","chapters":"שמואל א פרק ו","know":"הפלשתים הכינו עגלה חדשה, ושתי פרות עליות שלא עלה עליהן עול. הפרות הלכו ישר בדרך בית שמש, גועות, ולא סרו ימין ושמאל. זה היה הסימן שהמכה מה׳.","url":"shmuel/15.html"},{"key":"shmuel","n":16,"title":"לוח משחק: בית שמש","emoji":"🌾","chapters":"שמואל א פרק ו","know":"אנשי בית שמש קצרו חיטים ושמחו כשראו את הארון. העגלה עצרה בשדה יהושע הבית שמשי, ושם אבן גדולה. הם שרפו את העגלה והעלו את הפרות עולה לה׳. הפלשתים חזרו לעקרון.","url":"shmuel/16.html"},{"key":"shmuel","n":17,"title":"בועות: כבוד לארון","emoji":"📜","chapters":"שמואל א פרק ו","know":"אנשי בית שמש הביטו בארון ה׳, ועל כך מתו רבים. הם אמרו: מי יוכל לעמוד לפני ה׳ האלהים הקדוש הזה. שלחו לקרית יערים להעלות אותו אליהם.","url":"shmuel/17.html"},{"key":"shmuel","n":18,"title":"דיג: קרית יערים","emoji":"🏡","chapters":"שמואל א ז פסוקים א-ב","know":"אנשי קרית יערים לקחו את הארון והביאו אותו אל בית אבינדב בגבעה. את אלעזר בנו קידשו לשמור אותו. הארון ישב שם עשרים שנה, ובית ישראל נהו אחרי ה׳.","url":"shmuel/18.html"},{"key":"shmuel","n":19,"title":"בינגו: תשובה במצפה","emoji":"💧","chapters":"שמואל א פרק ז","know":"שמואל קרא: אם בכל לבבכם אתם שבים אל ה׳ הסירו את אלהי הנכר מתוככם. כינס את העם במצפה, ושאבו מים ושפכו לפני ה׳ וצמו ואמרו: חטאנו לה׳.","url":"shmuel/19.html"},{"key":"shmuel","n":20,"title":"אלבום: אבן העזר","emoji":"🪨","chapters":"שמואל א פרק ז","know":"הפלשתים עלו על ישראל במצפה. שמואל העלה עולה כליל וזעק אל ה׳. ה׳ הרעים בקול גדול על פלשתים והממם. ישראל רדפו. שמואל שם אבן ואמר: עד הנה עזרנו ה׳.","url":"shmuel/20.html"},{"key":"shmuel","n":21,"title":"מי אני: זקנת שמואל ובקשת מלך","emoji":"👴","chapters":"שמואל א פרק ח","know":"שמואל זקן, ובניו יואל ואביה שפטו בבאר שבע ולא הלכו בדרכיו. זקני ישראל באו לרמה ואמרו: שימה לנו מלך לשפטנו ככל הגויים.","url":"shmuel/21.html"},{"key":"shmuel","n":22,"title":"החלק: למה ביקשו מלך","emoji":"🤴","chapters":"שמואל א פרק ח","know":"העם ביקש מלך ככל הגויים. ה׳ אמר לשמואל: שמע בקולם כי לא אותך מאסו כי אותי מאסו ממלוך עליהם. שמואל התרה בהם על משפט המלך, והם סירבו לשמוע.","url":"shmuel/22.html"},{"key":"shmuel","n":23,"title":"מי רוצה להיות מיליונר: משפט המלך","emoji":"📃","chapters":"שמואל א פרק ח","know":"שמואל הזהיר: המלך יקח את בניכם לצבא ולרכב, את בנותיכם לרקחות, את שדותיכם ואת הצאן. ביום ההוא תזעקו מלפני מלככם. העם אמר: לא כי אם מלך יהיה עלינו.","url":"shmuel/23.html"},{"key":"shmuel","n":24,"title":"ציר זמן: משפט המלך ועד המלכת שאול","emoji":"📆","chapters":"שמואל א ח-י","know":"הסדר: הזקנים מבקשים מלך, שמואל מתפלל, שאול יוצא לחפש אתונות, פוגש את שמואל, נמשח, ובסוף מוכרז כמלך במצפה.","url":"shmuel/24.html"},{"key":"shmuel","n":25,"title":"כרטיסיות: האתונות של שאול","emoji":"🫏","chapters":"שמואל א פרק ט","know":"שאול בן קיש מבנימין, גבוה משכמו ומעלה, יצא עם נער לחפש אתונות אבודות. הם הגיעו לארץ צוף, והנער הציע לשאול את איש האלהים בעיר.","url":"shmuel/25.html"},{"key":"shmuel","n":26,"title":"מסע: שאול פוגש את שמואל","emoji":"🧭","chapters":"שמואל א פרק ט","know":"ה׳ גילה לשמואל יום קודם: מחר כעת אשלח אליך איש מארץ בנימין. כששמואל ראה את שאול, ה׳ ענה: הנה האיש. שמואל אמר לשאול: האתונות נמצאו, ולמי כל חמדת ישראל, הלוא לך.","url":"shmuel/26.html"},{"key":"shmuel","n":27,"title":"זוגות: שאול והאותות","emoji":"🧩","chapters":"שמואל א פרק י","know":"שמואל משח את שאול בפך שמן, ונתן שלושה אותות: שני אנשים בקבר רחל, שלושה אנשים באלון תבור, וחבל נביאים בגבעת האלהים. רוח אלהים צלחה על שאול.","url":"shmuel/27.html"},{"key":"shmuel","n":28,"title":"מצא את הטעות: שאול נבחר","emoji":"🔎","chapters":"שמואל א פרק י","know":"שמואל כינס את העם במצפה. הוטל גורל: שבט בנימין, משפחת מטרי, שאול בן קיש. שאול נחבא אל הכלים. העם צעק: יחי המלך. שמואל כתב משפט המלוכה והניח לפני ה׳.","url":"shmuel/28.html"},{"key":"shmuel","n":29,"title":"חיבור: מי הוא מי בשאול","emoji":"🔗","chapters":"שמואל א ח-י","know":"שאול מבנימין, שמואל מרמה, אתונות הובילו אותו, הגורל במצפה, פך שמן, גבעה היא עירו.","url":"shmuel/29.html"},{"key":"shmuel","n":30,"title":"מיון: מי עשה מה","emoji":"🗂️","chapters":"שמואל א ח-י","know":"הפעולות שייכות לשלוש דמויות: ה׳ מוביל, שמואל נביא ומשיח, והעם מבקש ובוחר.","url":"shmuel/30.html"},{"key":"shmuel","n":31,"title":"מהירות: נחש העמוני ויבש גלעד","emoji":"🛡️","chapters":"שמואל א פרק יא","know":"נחש העמוני עלה על יבש גלעד ודרש להוציא את עין ימין של כולם. שאול שמע, רוח אלהים צלחה עליו, חתך צמד בקר ושלח בכל גבול ישראל. העם יצא כאיש אחד וניצחו.","url":"shmuel/31.html"},{"key":"shmuel","n":32,"title":"שרידות: נאום הפרידה של שמואל","emoji":"🎤","chapters":"שמואל א פרק יב","know":"שמואל נאם בגלגל: את שור מי לקחתי, וחמור מי לקחתי? העם העיד שלא עשק. הוא הזכיר את חסדי ה׳ ואמר: אל תסורו מאחרי ה׳, ועבדתם את ה׳ בכל לבבכם.","url":"shmuel/32.html"},{"key":"shmuel","n":33,"title":"מי אני: שאול ויונתן","emoji":"🧑‍🤝‍🧑","chapters":"שמואל א פרקים יג-יד","know":"שאול מלך, ובנו יונתן הלך עם נושא כליו וניצח את מצב הפלשתים במכמש. שאול חטא כשהקריב עולה בלי שמואל. שמואל אמר: ועתה ממלכתך לא תקום.","url":"shmuel/33.html"},{"key":"shmuel","n":34,"title":"החלק: ניצחון במכמש","emoji":"⛰️","chapters":"שמואל א פרק יד","know":"יונתן ונושא כליו טיפסו אל הפלשתים. חרדה נפלה על המחנה, וה׳ הושיע. שאול נשבע שלא יאכל עד ערב, ויונתן לא שמע ואכל מדבש. העם הציל את יונתן מהמוות.","url":"shmuel/34.html"},{"key":"shmuel","n":35,"title":"מסע: מלחמת עמלק","emoji":"🗡️","chapters":"שמואל א פרק טו","know":"שמואל שלח את שאול להכות את עמלק ולא לחמול. שאול חמל על אגג ועל מיטב הצאן. שמואל אמר: הנה שמוע מזבח טוב, להקשיב מחלב אילים. ה׳ נחם על שהמליך את שאול.","url":"shmuel/35.html"},{"key":"shmuel","n":36,"title":"סדר נכון: מחטא שאול למשיחת דוד","emoji":"📋","chapters":"שמואל א טו-טז","know":"הסדר: שאול חומל על עמלק, שמואל מוכיח אותו, שאול מתחנן ולא מקבל, שמואל מתאבל, ה׳ שולח אותו לבית לחם, שמואל משח את דוד.","url":"shmuel/36.html"},{"key":"shmuel","n":37,"title":"מי רוצה להיות מיליונר: ה׳ יראה ללבב","emoji":"❤️","chapters":"שמואל א פרק טז","know":"שמואל בא לבית לחם לבית ישי. הוא חשב שאליאב הוא המשיח, אך ה׳ אמר: אל תבט אל מראהו ואל גבה קומתו כי לא כאשר יראה האדם, כי האדם יראה לעינים וה׳ יראה ללבב.","url":"shmuel/37.html"},{"key":"shmuel","n":38,"title":"בועות: דוד מנגן לשאול","emoji":"🎶","chapters":"שמואל א פרק טז","know":"רוח ה׳ סרה מעם שאול, ורוח רעה מבעתתו. עבדיו הציעו נגן. דוד בן ישי בית הלחמי, יודע נגן, גבור חיל ואיש מלחמה ונבון דבר, וה׳ עמו. כשדוד ניגן, רוח רעה סרה מעליו.","url":"shmuel/38.html"},{"key":"shmuel","n":39,"title":"דיג: דוד וגלית","emoji":"🪨","chapters":"שמואל א פרק יז","know":"גלית הפלשתי הציב אתגר ארבעים יום. דוד בא ושמע וקנא: מי הפלשתי הערל הזה כי חרף מערכות אלהים חיים. הוא אמר: אתה בא אלי בחרב ובחנית ובכידון, ואנכי בא אליך בשם ה׳ צבאות.","url":"shmuel/39.html"},{"key":"shmuel","n":40,"title":"בינגו: דוד ויונתן","emoji":"🤝","chapters":"שמואל א פרקים יח-כ","know":"נפש יהונתן נקשרה בנפש דוד, ויכרת ברית. שאול התקנא כששמע שירת הנשים: הכה שאול באלפיו ודוד ברבבותיו. יהונתן הציל את דוד מהרצח וגילה לו את דעת אביו.","url":"shmuel/40.html"},{"key":"shmuel","n":41,"title":"חדר בריחה: דוד חס על שאול בעין גדי","emoji":"🕳️","chapters":"שמואל א פרק כד","know":"שאול רדף אחרי דוד עם שלושת אלפים איש. שאול נכנס למערה בעין גדי, ודוד כרת כנף מעילו ולא הרג אותו. דוד אמר: חלילה לי מה׳ לשלוח ידי במשיח ה׳. שאול בכה ואמר: צדיק אתה ממני.","url":"shmuel/41.html"},{"key":"shmuel","n":42,"title":"מרוץ: החנית וצפחת המים","emoji":"💧","chapters":"שמואל א פרק כו","know":"דוד ואבישי נכנסו ללילה למחנה שאול. הכל ישנו כי תרדמת ה׳ נפלה עליהם. אבישי ביקש להכות, ודוד אמר: מי שלח ידו במשיח ה׳ ונקה. הוא לקח את החנית וצפחת המים.","url":"shmuel/42.html"},{"key":"shmuel","n":43,"title":"חשיפה: אביגיל","emoji":"🌸","chapters":"שמואל א פרק כה","know":"דוד שלח נערים לנבל הכרמלי לבקש מזון, ונבל סירב בזלזול. דוד עלה עם ארבע מאות איש. אביגיל אשת נבל, טובת שכל, יצאה לפגוש אותו עם מנחה ופייסה אותו. דוד ברך את ה׳ שמנע אותו משפיכות דמים.","url":"shmuel/43.html"},{"key":"shmuel","n":44,"title":"מדליקים נרות: קינת דוד על שאול ויונתן","emoji":"🕯️","chapters":"שמואל א לא, שמואל ב א","know":"שאול ויהונתן נפלו בהר הגלבוע. דוד קונן: הצבי ישראל על במותיך חלל, איך נפלו גבורים. לא שמח על נפילת שאול אלא בכה. אנשי יבש גלעד קברו אותם.","url":"shmuel/44.html"},{"key":"shmuel","n":45,"title":"חיבור נקודות: דוד המלך","emoji":"🏙️","chapters":"שמואל ב פרק ה","know":"דוד נמשח למלך על יהודה בחברון, ואחר כך על כל ישראל. שבע שנים וחצי מלך בחברון ושלושים ושלוש בירושלים. הוא כבש את מצודת ציון והיא נקראה עיר דוד.","url":"shmuel/45.html"},{"key":"shmuel","n":46,"title":"בניית ארון: עליית הארון","emoji":"🎺","chapters":"שמואל ב פרק ו","know":"דוד אסף שלשים אלף איש להעלות את ארון האלהים מבית אבינדב. העגלה נטתה, ועזה נגע בארון ומת. דוד פחד ושם את הארון בבית עובד אדום שלושה חודשים. אחר כך העלו אותו בשמחה, ודוד כרכר בכל עוז לפני ה׳.","url":"shmuel/46.html"},{"key":"shmuel","n":47,"title":"אלבום: ברית בית דוד","emoji":"👑","chapters":"שמואל ב פרק ז","know":"דוד רצה לבנות בית לה׳. ה׳ אמר לנתן: לא אתה תבנה לי בית, אך בנך. ה׳ יבנה לדוד בית: ונאמן ביתך וממלכתך עד עולם לפניך, כסאך יהיה נכון עד עולם. דוד התפלל: מי אנכי אדני ה׳.","url":"shmuel/47.html"},{"key":"shmuel","n":48,"title":"כרטיסיות: חסד לבית שאול","emoji":"🤲","chapters":"שמואל ב פרק ט","know":"דוד שאל: היש עוד איש לבית שאול ואעשה עמו חסד אלהים. נמצא מפיבשת בן יהונתן, נכה רגליים. דוד החזיר לו את כל שדה שאול, והוא אכל על שולחנו תמיד.","url":"shmuel/48.html"},{"key":"shmuel","n":49,"title":"מצא את הטעות: נתן ודוד","emoji":"🔔","chapters":"שמואל ב פרק יב","know":"נתן הנביא בא לדוד בשליחות ה׳ וסיפר משל על עשיר ועני עם כבשה אחת. דוד התרגז, ונתן אמר: אתה האיש. דוד אמר: חטאתי לה׳. נתן ענה: גם ה׳ העביר חטאתך לא תמות. דוד בכה והתפלל.","url":"shmuel/49.html"},{"key":"shmuel","n":50,"title":"ציר זמן: ספר שמואל בקצרה","emoji":"📖","chapters":"שמואל א-ב","know":"הציר: חנה ושמואל, הארון והפלשתים, בקשת מלך ושאול, חטא שאול ומשיחת דוד, גלית, רדיפת שאול, מות שאול, דוד מלך, ירושלים והארון, ברית בית דוד.","url":"shmuel/50.html"},{"key":"melachim","n":1,"title":"כרטיסיות: שלמה מבקש לב שומע","emoji":"💭","chapters":"מלכים א פרק ג","know":"שלמה הקריב אלף עולות בגבעון. ה׳ נראה אליו בחלום: שאל מה אתן לך. שלמה ביקש לב שומע לשפוט את עמך. ה׳ נתן לו חכמה וגם עושר וכבוד.","url":"melachim/01.html"},{"key":"melachim","n":2,"title":"מי אני: משפט שלמה","emoji":"⚖️","chapters":"מלכים א פרק ג","know":"שתי נשים באו לשלמה, ושתיהן אמרו שהילד החי שלהן. שלמה אמר: קחו לי חרב, גזרו את הילד החי. האם האמיתית אמרה: תנו לה את הילד ואל תמיתוהו. כך הכיר שלמה את האם.","url":"melachim/02.html"},{"key":"melachim","n":3,"title":"סדר נכון: בניין בית המקדש","emoji":"🏛️","chapters":"מלכים א ה-ח","know":"הסדר: שלמה שולח לחירם מלך צור לעצי ארז, מתחיל לבנות בשנה הרביעית, בונה שבע שנים, מכניס את הארון, הענן ממלא את הבית, ושלמה מתפלל.","url":"melachim/03.html"},{"key":"melachim","n":4,"title":"החלק: תפילת שלמה","emoji":"🙌","chapters":"מלכים א פרק ח","know":"שלמה אמר: הנה השמים ושמי השמים לא יכלכלוך אף כי הבית הזה. הוא ביקש: ושמעת השמים. התפלל גם על הנכרי: ועשית ככל אשר יקרא אליך הנכרי, למען ידעון כל עמי הארץ את שמך.","url":"melachim/04.html"},{"key":"melachim","n":5,"title":"מי רוצה להיות מיליונר: חכמת שלמה","emoji":"📚","chapters":"מלכים א פרק ה","know":"ה׳ נתן חכמה לשלמה ורוחב לב כחול שעל שפת הים. שלמה דבר שלושת אלפים משל ושירו חמישה ואלף. הוא דבר על העצים ועל הבהמה ועל העוף. באו מכל העמים לשמוע חכמתו.","url":"melachim/05.html"},{"key":"melachim","n":6,"title":"מסע: מלכת שבא","emoji":"🐪","chapters":"מלכים א פרק י","know":"מלכת שבא שמעה את שמע שלמה לשם ה׳ ובאה לנסותו בחידות. היא ראתה את חכמתו ואת בית ה׳. אמרה: יהי ה׳ אלהיך ברוך אשר חפץ בך לתתך על כסא ישראל, כי אהב ה׳ את ישראל לעולם.","url":"melachim/06.html"},{"key":"melachim","n":7,"title":"זוגות: כלי המקדש","emoji":"🕎","chapters":"מלכים א ו-ז","know":"בבית המקדש היו כלים מיוחדים: מנורות זהב, שולחן הפנים, מזבח הזהב, הים הנחושת על שנים עשר בקר, ושני עמודים יכין ובועז.","url":"melachim/07.html"},{"key":"melachim","n":8,"title":"מצא את הטעות: חטא שלמה","emoji":"⚠️","chapters":"מלכים א פרק יא","know":"שלמה אהב נשים נכריות רבות. בזקנתו הטו נשיו את לבבו אחרי אלהים אחרים. ה׳ התאנף בו, וביקש לקרוע את הממלכה, אך לא בימיו, למען דוד עבדו.","url":"melachim/08.html"},{"key":"melachim","n":9,"title":"ציר זמן: שלמה המלך","emoji":"⏳","chapters":"מלכים א א-יא","know":"הציר: שלמה מוכתר, מבקש חכמה בגבעון, שופט בין הנשים, בונה בית המקדש, מלכת שבא באה, וחוטא בזקנתו.","url":"melachim/09.html"},{"key":"melachim","n":10,"title":"חדר בריחה: ה׳ נראה לשלמה","emoji":"🌠","chapters":"מלכים א פרק ט","know":"אחרי שחנך שלמה את הבית, ה׳ נראה אליו שנית: שמעתי תפילתך. הקדשתי הבית הזה לשום שמי שם עד עולם, והיו עיני ולבי שם כל הימים. אם תלך לפני כדוד אביך, אקים כסא ממלכתך.","url":"melachim/10.html"},{"key":"melachim","n":11,"title":"מרוץ: רחבעם בשכם","emoji":"🗣️","chapters":"מלכים א פרק יב","know":"אחרי שלמה בא רחבעם לשכם. העם ביקש להקל את העול. הזקנים יעצו להקשיב לעם, אך הילדים יעצו להכביד. רחבעם ענה בקשיחות, ועשרת השבטים פרשו.","url":"melachim/11.html"},{"key":"melachim","n":12,"title":"שרידות: ירבעם והעגלים","emoji":"🐂","chapters":"מלכים א פרק יב","know":"ירבעם מלך על עשרת השבטים. הוא פחד שהעם יעלה לירושלים, ועשה שני עגלי זהב. הציב אחד בבית אל ואחד בדן ואמר: הנה אלהיך ישראל. זה היה חטא גדול.","url":"melachim/12.html"},{"key":"melachim","n":13,"title":"מי אני: איש האלהים מיהודה","emoji":"🧙","chapters":"מלכים א פרק יג","know":"איש אלהים מיהודה בא לבית אל וקרא על המזבח. ה׳ ציווה: אל תאכל ואל תשתה ולא תשוב בדרך שבאת. הוא האזין לנביא זקן ואכל, ואחר כך אריה הרג אותו. הלקח: לשמוע בקול ה׳.","url":"melachim/13.html"},{"key":"melachim","n":14,"title":"בועות: אליהו ואחאב","emoji":"☀️","chapters":"מלכים א פרק יז","know":"אליהו התשבי אמר לאחאב: חי ה׳ אלהי ישראל אשר עמדתי לפניו אם יהיה השנים האלה טל ומטר כי אם לפי דברי. ה׳ שלח אותו להסתתר בנחל כרית.","url":"melachim/14.html"},{"key":"melachim","n":15,"title":"דיג: נחל כרית","emoji":"🐦‍⬛","chapters":"מלכים א פרק יז","know":"אליהו התיישב בנחל כרית. העורבים הביאו לו לחם ובשר בבוקר ובערב, והוא שתה מהנחל. אחרי זמן הנחל התייבש כי לא היה גשם.","url":"melachim/15.html"},{"key":"melachim","n":16,"title":"לוח משחק: האלמנה בצרפת","emoji":"🫙","chapters":"מלכים א פרק יז","know":"בצרפת בצידון פגש אליהו אלמנה. היה לה מעט קמח בכד ומעט שמן בצלוחית. היא הכינה לו עוגה קודם. כד הקמח לא כלתה וצפחת השמן לא חסרה. בנה חלה ואליהו התפלל, והבן חי.","url":"melachim/16.html"},{"key":"melachim","n":17,"title":"מהירות: הכרמל","emoji":"🔥","chapters":"מלכים א פרק יח","know":"בשנה השלישית אליהו הלך לאחאב. אחאב אמר: אתה עוכר ישראל. אליהו ענה: לא עכרתי אלא אתה, בעזבכם מצוות ה׳. הוא קרא לאסוף את העם ואת ארבע מאות וחמישים נביאי הבעל להר הכרמל.","url":"melachim/17.html"},{"key":"melachim","n":18,"title":"בינגו: ה׳ הוא האלהים","emoji":"🌩️","chapters":"מלכים א פרק יח","know":"אליהו אמר: עד מתי אתם פסחים על שתי הסעיפים, אם ה׳ האלהים לכו אחריו ואם הבעל לכו אחריו. הוא בנה מזבח משתים עשרה אבנים, שפך מים, והתפלל. ירדה אש מה׳. העם נפל ואמר: ה׳ הוא האלהים.","url":"melachim/18.html"},{"key":"melachim","n":19,"title":"מדליקים נרות: קול דממה דקה","emoji":"🌬️","chapters":"מלכים א פרק יט","know":"אליהו ברח מאיזבל ובא להר חורב. ה׳ אמר: צא ועמדת בהר לפני ה׳. רוח גדולה, רעש ואש עברו, ה׳ לא היה בהם. אחרי האש בא קול דממה דקה, ושם ה׳ דיבר אליו.","url":"melachim/19.html"},{"key":"melachim","n":20,"title":"אלבום: כרם נבות","emoji":"🍇","chapters":"מלכים א פרק כא","know":"נבות היזרעאלי היה בעל כרם ליד ארמון אחאב. אחאב רצה לקנותו, ונבות סירב: חלילה לי מה׳ מתתי נחלת אבותי לך. איזבל גרמה למות נבות, ואליהו הוכיח את אחאב.","url":"melachim/20.html"},{"key":"melachim","n":21,"title":"מסע: אלישע בן שפט נקרא","emoji":"🐂","chapters":"מלכים א פרק יט","know":"אליהו מצא את אלישע בן שפט חורש בשנים עשר צמדי בקר. אליהו השליך עליו את אדרתו. אלישע שחט את הבקר, בישל אותו בכלי המחרשה, נתן לעם ואכלו, וקם והלך אחרי אליהו.","url":"melachim/21.html"},{"key":"melachim","n":22,"title":"כרטיסיות: אליהו עולה בסערה","emoji":"🌪️","chapters":"מלכים ב פרק ב","know":"אליהו ואלישע הלכו מגלגל לבית אל, ליריחו ולירדן. אליהו הכה את המים ונחצו. אלישע ביקש: ויהי נא פי שנים ברוחך אלי. רכב אש וסוסי אש הפרידו ביניהם, ואליהו עלה בסערה השמיימה.","url":"melachim/22.html"},{"key":"melachim","n":23,"title":"בועות: כד שמן","emoji":"🫗","chapters":"מלכים ב פרק ד","know":"אלמנת אחד מבני הנביאים באה לאלישע, כי הנושה בא לקחת את שני ילדיה. אלישע אמר: מה יש לך בבית. היא אמרה: רק אסוך שמן. הוא אמר: שאלי כלים ריקים מן החוצה. השמן זרם עד שלא נותרו כלים.","url":"melachim/23.html"},{"key":"melachim","n":24,"title":"שרידות: האשה השונמית","emoji":"🛏️","chapters":"מלכים ב פרק ד","know":"אשה גדולה בשונם הכינה לאלישע עלייה קטנה עם מיטה, שולחן, כסא ומנורה. אלישע בירך אותה בבן. כשהבן חלה ומת, היא רצה לאלישע, והוא התפלל, והבן חי.","url":"melachim/24.html"},{"key":"melachim","n":25,"title":"סדר נכון: נעמן בירדן","emoji":"🌊","chapters":"מלכים ב פרק ה","know":"הסדר: נערה שבויה מישראל מספרת על נביא בשומרון, נעמן יוצא עם מכתב, אלישע שולח אותו לירדן, נעמן כועס, משכנעים אותו, הוא טובל שבע פעמים ומתרפא.","url":"melachim/25.html"},{"key":"melachim","n":26,"title":"מי אני: ההר מלא סוסים ורכב אש","emoji":"🐎","chapters":"מלכים ב פרק ו","know":"מלך ארם שלח צבא לדותן לתפוס את אלישע. נערו פחד. אלישע אמר: אל תירא כי רבים אשר אתנו מאשר אתם. ה׳ פתח את עיני הנער, והוא ראה הר מלא סוסים ורכב אש.","url":"melachim/26.html"},{"key":"melachim","n":27,"title":"מי רוצה להיות מיליונר: ארבעה מצורעים","emoji":"🏰","chapters":"מלכים ב פרק ז","know":"בשומרון היה רעב גדול. אלישע אמר: מחר כעת סאה סלת בשקל. ארבעה אנשים מצורעים ישבו בפתח השער ואמרו: מה אנחנו יושבים פה עד מותנו. הלכו למחנה ארם ומצאו אותו ריק, כי ה׳ השמיע קול רכב וסוס.","url":"melachim/27.html"},{"key":"melachim","n":28,"title":"החלק: נעמן והגיחזי","emoji":"✨","chapters":"מלכים ב פרק ה","know":"נעמן, שר צבא ארם, היה מצורע. אלישע שלח לו: לך ורחצת שבע פעמים בירדן. נעמן טבל, ובשרו כבשר נער קטן. הוא אמר: הנה נא ידעתי כי אין אלהים בכל הארץ כי אם בישראל. אלישע לא לקח מתנה.","url":"melachim/28.html"},{"key":"melachim","n":29,"title":"מצא את הטעות: אליהו ואלישע","emoji":"🔍","chapters":"מלכים א-ב","know":"סיכום: אליהו התשבי עמד בכרמל, חי בנחל כרית ובצרפת. אלישע בן שפט המשיך אחריו. עלה אליהו בסערה, ואלישע לקח את האדרת.","url":"melachim/29.html"},{"key":"melachim","n":30,"title":"ציר זמן: אליהו ואלישע","emoji":"📅","chapters":"מלכים א יז - מלכים ב ז","know":"הציר: אליהו מכריז על בצורת, נחל כרית, צרפת, הכרמל, חורב, אלישע נקרא, אליהו עולה, אלישע מרפא את נעמן ומציל בשומרון.","url":"melachim/30.html"},{"key":"melachim","n":31,"title":"מי אני: מיכיהו בן ימלה","emoji":"📢","chapters":"מלכים א פרק כב","know":"יהושפט מלך יהודה ביקש לשאול בה׳ לפני המלחמה עם אחאב. ארבע מאות נביאים אמרו עלה והצלח. מיכיהו בן ימלה אמר: חי ה׳ כי את אשר יאמר ה׳ אלי אתו אדבר. הוא ניבא שאחאב יפול.","url":"melachim/31.html"},{"key":"melachim","n":32,"title":"כרטיסיות: יואש ותיקון הבית","emoji":"🔨","chapters":"מלכים ב פרק יב","know":"יואש מלך בן שבע שנים, ויהוידע הכהן לימדו. יואש הורה לאסוף כסף לבדק הבית. יהוידע שם ארון עם חור בדלתו, והעם הביא כסף. הכסף ניתן לנגרים ולבנאים, והם עשו באמונה.","url":"melachim/32.html"},{"key":"melachim","n":33,"title":"שרידות: סנחריב וחזקיהו","emoji":"🛡️","chapters":"מלכים ב פרקים יח-יט","know":"סנחריב מלך אשור עלה על ירושלים, ורבשקה לגלג על ה׳. חזקיהו פרש מכתב לפני ה׳ והתפלל. ישעיהו ניבא שה׳ יגן על העיר. מלאך ה׳ הכה במחנה אשור מאה שמונים וחמישה אלף.","url":"melachim/33.html"},{"key":"melachim","n":34,"title":"מסע: חזקיהו חולה","emoji":"🧱","chapters":"מלכים ב פרק כ","know":"חזקיהו חלה למות. ישעיהו אמר: צו לביתך כי מת אתה. חזקיהו הפך פניו אל הקיר והתפלל ובכה. ה׳ אמר: שמעתי תפילתך ראיתי דמעתך, והוספתי על ימיך חמש עשרה שנה. האות: צל המעלות.","url":"melachim/34.html"},{"key":"melachim","n":35,"title":"לוח משחק: ספר התורה בימי יאשיהו","emoji":"📜","chapters":"מלכים ב פרק כב","know":"יאשיהו מלך בן שמונה שנים, ועשה הישר בעיני ה׳. בשנת שמונה עשרה תיקנו את בית ה׳, וחלקיהו הכהן מצא את ספר התורה. כששמע יאשיהו את דברי התורה, קרע את בגדיו. חולדה הנביאה אמרה שבגללו ה׳ ירחם.","url":"melachim/35.html"},{"key":"melachim","n":36,"title":"בועות: פסח יאשיהו","emoji":"🐑","chapters":"מלכים ב פרק כג","know":"יאשיהו כינס את כל העם, קרא באוזניהם את ספר הברית וכרת ברית לפני ה׳ ללכת אחרי ה׳ בכל לב. אחר כך ציווה: עשו פסח לה׳ אלהיכם, ולא נעשה כפסח הזה מימי השופטים.","url":"melachim/36.html"},{"key":"melachim","n":37,"title":"דיג: נפילת שומרון","emoji":"🏚️","chapters":"מלכים ב פרק יז","know":"מלך אשור עלה על שומרון, צר עליה שלוש שנים, ולכד אותה. ישראל הוגלו לאשור. הכתוב מסביר: ויהי כי חטאו בני ישראל לה׳ אלהיהם המעלה אתם מארץ מצרים.","url":"melachim/37.html"},{"key":"melachim","n":38,"title":"אלבום: חורבן בית ראשון","emoji":"🔥","chapters":"מלכים ב פרק כה","know":"נבוכדנצר מלך בבל עלה על ירושלים בימי צדקיהו. אחרי מצור בא נבוזראדן ושרף את בית ה׳ ואת ארמון המלך. רוב העם הוגלה, ונשארו דלי הארץ. גדליהו בן אחיקם מונה על הנשארים.","url":"melachim/38.html"},{"key":"melachim","n":39,"title":"בינגו: תקווה אחרי הגלות","emoji":"🌅","chapters":"מלכים ב פרק כה","know":"בגלות בבל שלושים ושבע שנים אחרי גלות יהויכין, אויל מרודך מלך בבל נשא את ראשו והוציאו מבית כלא, ונתן לו כסא ואכל לחם לפניו תמיד. זהו סיום ספר מלכים בתקווה.","url":"melachim/39.html"},{"key":"melachim","n":40,"title":"חדר בריחה: מיכיהו והמלחמה","emoji":"🗝️","chapters":"מלכים א פרק כב","know":"אחאב ויהושפט ישבו בשער שומרון. הנביאים אמרו עלה. יהושפט שאל: האין פה נביא לה׳ עוד. אחאב אמר: יש איש אחד, מיכיהו, אך אני שונאו כי אינו מתנבא עלי טוב. יהושפט אמר: אל יאמר המלך כן.","url":"melachim/40.html"},{"key":"melachim","n":41,"title":"חיבור קווים: נביאים ומאורעות","emoji":"🔗","chapters":"מלכים א-ב","know":"לכל נביא ומלך יש מאורע מרכזי: אליהו בכרמל, אלישע בנעמן, חזקיהו בסנחריב, יאשיהו בספר התורה, שלמה בבית המקדש, ישעיהו בחזקיהו החולה.","url":"melachim/41.html"},{"key":"melachim","n":42,"title":"מיון: מלכי יהודה ומלכי ישראל","emoji":"👑","chapters":"מלכים א-ב","know":"אחרי הפילוג היו שתי ממלכות: יהודה בירושלים עם בית דוד, וישראל בשומרון עם מלכים רבים מבתים שונים.","url":"melachim/42.html"},{"key":"melachim","n":43,"title":"זוגות זיכרון: מקומות בספר מלכים","emoji":"🗺️","chapters":"מלכים א-ב","know":"בספר מלכים מקומות רבים: גבעון, נחל כרית, הכרמל, חורב, ירדן, דותן.","url":"melachim/43.html"},{"key":"melachim","n":44,"title":"חיבור נקודות: מי איפה","emoji":"📍","chapters":"מלכים א-ב","know":"אליהו ואלישע היו בעיקר בצפון: גלעד, כרמל, שונם, דותן, שומרון. ירושלים הייתה בירת יהודה.","url":"melachim/44.html"},{"key":"melachim","n":45,"title":"חשיפה: חזקיהו הצדיק","emoji":"🌟","chapters":"מלכים ב פרק יח","know":"חזקיהו הסיר את הבמות, שבר את המצבות וכתת את נחש הנחשת. נאמר: בה׳ אלהי ישראל בטח, ואחריו לא היה כמוהו בכל מלכי יהודה. הוא דבק בה׳.","url":"melachim/45.html"},{"key":"melachim","n":46,"title":"בניית נחש: למה כתתו נחש הנחשת","emoji":"🐍","chapters":"מלכים ב פרק יח","know":"נחש הנחשת נעשה בימי משה והציל מנשיכת נחשים. בימי חזקיהו העם הקטיר לו וקראו לו נחושתן. חזקיהו כתת אותו כדי שלא יעבדו אותו.","url":"melachim/46.html"},{"key":"melachim","n":47,"title":"מהירות: מלכי יהודה","emoji":"⚡","chapters":"מלכים א-ב","know":"מלכי יהודה הטובים: אסא, יהושפט, יואש, חזקיהו, יאשיהו. הם עשו הישר בעיני ה׳.","url":"melachim/47.html"},{"key":"melachim","n":48,"title":"סדר נכון: מלכי יהודה","emoji":"📚","chapters":"מלכים א-ב","know":"הסדר: רחבעם, אסא, יהושפט, יואש, חזקיהו, יאשיהו.","url":"melachim/48.html"},{"key":"melachim","n":49,"title":"מדליקים נרות: אהבת ה׳ בספר מלכים","emoji":"❤️","chapters":"כל הספר","know":"בספר מלכים ה׳ אוהב את עמו: שומע תפילות, שולח נביאים, מרפא ומציל, ובסוף מקים מחדש בתקווה.","url":"melachim/49.html"},{"key":"melachim","n":50,"title":"מי רוצה להיות מיליונר: סיכום ספר מלכים","emoji":"🏆","chapters":"כל הספר","know":"הספר מתחיל בשלמה ובבית המקדש, ממשיך בפילוג, אליהו ואלישע, חזקיהו ויאשיהו, ומסתיים בחורבן ובתקווה.","url":"melachim/50.html"},{"key":"yeshayahu","n":1,"title":"מהירות: חזון ישעיהו בן אמוץ","emoji":"📜","chapters":"ישעיהו פרק א","know":"ישעיהו בן אמוץ התנבא על יהודה וירושלים בימי ארבעה מלכים: עזיהו, יותם, אחז ויחזקיהו. הנבואה הראשונה היא תוכחה: ״ידע שור קונהו וחמור אבוס בעליו, ישראל לא ידע״. אבל מיד באה גם הבטחה: ״אם יהיו חטאיכם כשנים, כשלג ילבינו״.","url":"yeshayahu/01.html"},{"key":"yeshayahu","n":2,"title":"החלק: רחצו הזכו","emoji":"🫧","chapters":"ישעיהו פרק א","know":"ה׳ אומר לעם שקרבנות בלי מעשים טובים אינם רצויים: ״למה לי רוב זבחיכם״. מה ה׳ מבקש? ״רחצו הזכו... חדלו הרע, למדו היטב, דרשו משפט, אשרו חמוץ, שפטו יתום, ריבו אלמנה״.","url":"yeshayahu/02.html"},{"key":"yeshayahu","n":3,"title":"מי רוצה להיות מיליונר: והיה באחרית הימים","emoji":"⛰️","chapters":"ישעיהו פרק ב","know":"ישעיהו רואה את העתיד: הר בית ה׳ יהיה נכון בראש ההרים, וכל הגויים ינהרו אליו ללמוד את דרכי ה׳. ״כי מציון תצא תורה ודבר ה׳ מירושלים״. ואז יהיה שלום: ״וכתתו חרבותם לאתים וחניתותיהם למזמרות״.","url":"yeshayahu/03.html"},{"key":"yeshayahu","n":4,"title":"סדר נכון: משל הכרם","emoji":"🍇","chapters":"ישעיהו פרק ה","know":"ישעיהו שר שיר על כרם: בעל הכרם השקיע בו הכל, קיווה לענבים טובים וקיבל באושים. הנמשל: ״כי כרם ה׳ צבאות בית ישראל, ואיש יהודה נטע שעשועיו״. ה׳ קיווה למשפט ולצדקה.","url":"yeshayahu/04.html"},{"key":"yeshayahu","n":5,"title":"מיון: הוי האומרים לרע טוב","emoji":"⚖️","chapters":"ישעיהו פרק ה","know":"אחרי משל הכרם ישעיהו מפרט מה התקלקל: אנשים שמוסיפים בית לבית ושדה לשדה, רודפי שכר מהבוקר, חכמים בעיני עצמם, ומי שהופך את היוצרות: ״האומרים לרע טוב ולטוב רע, שמים חושך לאור ואור לחושך״.","url":"yeshayahu/05.html"},{"key":"yeshayahu","n":6,"title":"מסע: מראה השרפים","emoji":"🔥","chapters":"ישעיהו פרק ו","know":"בשנת מות המלך עזיהו ראה ישעיהו את ה׳ יושב על כסא רם ונישא. שרפים עמדו ממעל, לכל אחד שש כנפים: בשתים כיסה את פניו, בשתים את רגליו ובשתים עופף. הם קראו זה אל זה: ״קדוש קדוש קדוש ה׳ צבאות, מלוא כל הארץ כבודו״.","url":"yeshayahu/06.html"},{"key":"yeshayahu","n":7,"title":"מי אני: הנני שלחני","emoji":"✋","chapters":"ישעיהו פרק ו","know":"ישעיהו נבהל: ״אוי לי... כי איש טמא שפתים אנוכי״. אחד השרפים לקח גחלת במלקחיים מעל המזבח, נגע בפיו ואמר: ״וסר עוונך וחטאתך תכופר״. ואז שמע ישעיהו את קול ה׳: ״את מי אשלח ומי ילך לנו״, וענה מיד: ״הנני שלחני״.","url":"yeshayahu/07.html"},{"key":"yeshayahu","n":8,"title":"חדר בריחה: אחז והאות","emoji":"👑","chapters":"ישעיהו פרק ז","know":"רצין מלך ארם ופקח בן רמליהו מלך ישראל עלו להילחם על ירושלים. לב אחז והעם נע ״כנוע עצי יער מפני רוח״. ישעיהו יצא אליו עם בנו שאר ישוב ואמר: ״הישמר והשקט, אל תירא״. הוא הציע לאחז לבקש אות, ואחז סירב. הנביא נתן אות: ״הנה העלמה הרה ויולדת בן וקראת שמו עמנו אל״.","url":"yeshayahu/08.html"},{"key":"yeshayahu","n":9,"title":"חיבור קווים: שמות עם מסר","emoji":"🏷️","chapters":"ישעיהו פרקים ז-ט","know":"בנבואות ישעיהו שמות נושאים מסר. בנו הראשון נקרא שאר ישוב, והשני מהר שלל חש בז. ״ואנוכי והילדים אשר נתן לי ה׳ לאותות ולמופתים בישראל״. גם הילד שייוולד נקרא בשמות מיוחדים: ״פלא יועץ... שר שלום״.","url":"yeshayahu/09.html"},{"key":"yeshayahu","n":10,"title":"בועות: אשור שבט אפי","emoji":"🪓","chapters":"ישעיהו פרק י","know":"ה׳ השתמש באשור כמקל להעניש: ״הוי אשור שבט אפי״. אבל מלך אשור התגאה וחשב שהכל בכוחו: ״בכוח ידי עשיתי ובחכמתי״. הנביא עונה: ״היתפאר הגרזן על החוצב בו?״ הגרזן הוא רק כלי. בסוף ״שאר ישוב, שאר יעקב, אל אל גיבור״.","url":"yeshayahu/10.html"},{"key":"yeshayahu","n":11,"title":"זוגות זיכרון: וגר זאב עם כבש","emoji":"🐺","chapters":"ישעיהו פרק יא","know":"ישעיהו מתאר את ימות המשיח: מלך מבית דוד, ״חוטר מגזע ישי״, שרוח ה׳ נחה עליו. בימיו יהיה שלום אפילו בין החיות: ״וגר זאב עם כבש, ונמר עם גדי ירבץ... ונער קטן נוהג בם״. ״לא ירעו ולא ישחיתו בכל הר קודשי, כי מלאה הארץ דעה את ה׳ כמים לים מכסים״.","url":"yeshayahu/11.html"},{"key":"yeshayahu","n":12,"title":"מדליקים נרות: חוטר מגזע ישי","emoji":"🌱","chapters":"ישעיהו פרק יא","know":"על המלך המשיח נאמר: ״ונחה עליו רוח ה׳, רוח חכמה ובינה, רוח עצה וגבורה, רוח דעת ויראת ה׳״. הוא ישפוט בצדק את הדלים. ה׳ ירים נס לגויים ״ואסף נדחי ישראל ונפוצות יהודה יקבץ מארבע כנפות הארץ״, ולא תהיה עוד קנאה בין אפרים ליהודה.","url":"yeshayahu/12.html"},{"key":"yeshayahu","n":13,"title":"דיג: שיר ההודיה","emoji":"🎶","chapters":"ישעיהו פרק יב","know":"פרק קצר שכולו שיר תודה ליום הגאולה: ״הנה אל ישועתי, אבטח ולא אפחד״. ״ושאבתם מים בששון ממעייני הישועה״. ״צהלי ורוני יושבת ציון, כי גדול בקרבך קדוש ישראל״. פסוקים מהפרק נאמרים בהבדלה במוצאי שבת.","url":"yeshayahu/13.html"},{"key":"yeshayahu","n":14,"title":"בינגו: משאות על העמים","emoji":"🌍","chapters":"ישעיהו פרקים יג-כג","know":"בפרקים אלה ישעיהו מתנבא על העמים: בבל, מואב, דמשק, מצרים, צור ועוד. על מלך בבל הגאה נאמר: ״איך נפלת משמים הילל בן שחר״. ובסוף גם לעמים יש תקווה: ״ברוך עמי מצרים, ומעשה ידי אשור, ונחלתי ישראל״.","url":"yeshayahu/14.html"},{"key":"yeshayahu","n":15,"title":"חשיפה: בלע המוות לנצח","emoji":"🕊️","chapters":"ישעיהו פרקים כה-כז","know":"בפרקים אלה שירי ביטחון וגאולה. ״בילע המוות לנצח, ומחה ה׳ אלוהים דמעה מעל כל פנים״. ״בטחו בה׳ עדי עד״. ״פתחו שערים ויבוא גוי צדיק שומר אמונים״. ובסוף: ״והיה ביום ההוא ייתקע בשופר גדול, ובאו האובדים בארץ אשור והנידחים בארץ מצרים״.","url":"yeshayahu/15.html"},{"key":"yeshayahu","n":16,"title":"כרטיסיות: בשובה ונחת","emoji":"🤲","chapters":"ישעיהו פרקים כח-לב","know":"בימי האיום האשורי רצו שרי יהודה להישען על מצרים. ישעיהו הזהיר: ״הוי היורדים מצרים לעזרה, על סוסים יישענו״. הדרך הנכונה: ״בשובה ונחת תיוושעון, בהשקט ובביטחה תהיה גבורתכם״. הוא גם הוכיח על תפילה מהשפה ולחוץ: ״בפיו ובשפתיו כיבדוני ולבו רחק ממני״.","url":"yeshayahu/16.html"},{"key":"yeshayahu","n":17,"title":"חיבור נקודות: יששום מדבר וציה","emoji":"🌷","chapters":"ישעיהו פרק לה","know":"נבואת נחמה קצרה ויפה: המדבר יפרח ״כחבצלת״. ״חזקו ידיים רפות וברכיים כושלות אמצו. אמרו לנמהרי לב: חזקו אל תיראו״. העיוורים יראו, החירשים ישמעו, הפיסח ידלג כאייל. ״ופדויי ה׳ ישובון ובאו ציון ברינה... ונסו יגון ואנחה״.","url":"yeshayahu/17.html"},{"key":"yeshayahu","n":18,"title":"שרידות: רבשקה מול החומה","emoji":"🏰","chapters":"ישעיהו פרק לו","know":"בשנת ארבע עשרה למלך חזקיהו עלה סנחריב מלך אשור על ערי יהודה הבצורות. הוא שלח את רבשקה מלכיש לירושלים. רבשקה עמד ליד תעלת הבריכה העליונה ודיבר בקול גדול ביהודית, כדי להפחיד את העם שעל החומה. שרי חזקיהו ביקשו שידבר ארמית. העם שתק, כי המלך ציווה: ״לא תענוהו״.","url":"yeshayahu/18.html"},{"key":"yeshayahu","n":19,"title":"ציר זמן: תפילת חזקיהו","emoji":"🙏","chapters":"ישעיהו פרק לז","know":"חזקיהו שמע את דברי רבשקה, קרע את בגדיו ובא אל בית ה׳. כשקיבל מכתב איומים מסנחריב, פרש אותו לפני ה׳ והתפלל: ״אתה הוא האלוהים לבדך... הושיענו מידו״. ישעיהו בישר: ״לא יבוא אל העיר הזאת ולא יורה שם חץ״. מלאך ה׳ היכה במחנה אשור מאה שמונים וחמישה אלף.","url":"yeshayahu/19.html"},{"key":"yeshayahu","n":20,"title":"מרוץ: מפלת סנחריב","emoji":"⚔️","chapters":"ישעיהו פרק לז","know":"סנחריב התגאה ושאל: מי מאלוהי הגויים הציל את ארצו מידי? חזקיהו התפלל אל ״ה׳ צבאות אלוהי ישראל יושב הכרובים״. בלילה היכה מלאך ה׳ במחנה אשור מאה שמונים וחמישה אלף. סנחריב שב לנינוה, ושם הרגו אותו בניו בבית אלוהיו.","url":"yeshayahu/20.html"},{"key":"yeshayahu","n":21,"title":"לוח משחק: מחלת חזקיהו","emoji":"🌡️","chapters":"ישעיהו פרק לח","know":"חזקיהו חלה למות, וישעיהו אמר לו: ״צו לביתך כי מת אתה״. חזקיהו הסב את פניו אל הקיר, התפלל ובכה בכי גדול. ה׳ ענה: ״שמעתי את תפילתך, ראיתי את דמעתך, הנני יוסיף על ימיך חמש עשרה שנה״. האות: הצל במעלות אחז שב עשר מעלות אחורנית.","url":"yeshayahu/21.html"},{"key":"yeshayahu","n":22,"title":"מצא את הטעות: שליחי מלך בבל","emoji":"🎁","chapters":"ישעיהו פרק לט","know":"מרודך בלאדן מלך בבל שמע שחזקיהו חלה והחלים, ושלח לו ספרים ומנחה. חזקיהו שמח והראה לשליחים את כל אוצרותיו. ישעיהו אמר: ״הנה ימים באים ונישא כל אשר בביתך... בבלה״. חזקיהו ענה: ״טוב דבר ה׳ אשר דיברת״.","url":"yeshayahu/22.html"},{"key":"yeshayahu","n":23,"title":"אלבום: חזקיהו וסנחריב: כל הסיפור","emoji":"📚","chapters":"ישעיהו פרקים לו-לט","know":"ארבעה פרקים בלב הספר מספרים על חזקיהו מלך יהודה: האיום של סנחריב, נאום רבשקה, התפילה והישועה, המחלה והרפואה, והביקור של שליחי בבל. בכל המצבים ישעיהו הנביא עומד לצד המלך.","url":"yeshayahu/23.html"},{"key":"yeshayahu","n":24,"title":"מסע: נחמו נחמו עמי","emoji":"💙","chapters":"ישעיהו פרק מ","know":"כאן נפתח חלק הנחמה של הספר: ״נחמו נחמו עמי, יאמר אלוהיכם. דברו על לב ירושלים״. ״קול קורא: במדבר פנו דרך ה׳״. ״יבש חציר נבל ציץ, ודבר אלוהינו יקום לעולם״. ה׳ מתואר כרועה: ״כרועה עדרו ירעה, בזרועו יקבץ טלאים ובחיקו יישא״. זו ההפטרה של שבת נחמו.","url":"yeshayahu/24.html"},{"key":"yeshayahu","n":25,"title":"מהירות: שאו מרום עיניכם","emoji":"✨","chapters":"ישעיהו פרק מ","know":"ישעיהו מתאר את גדולת הבורא: ״מי מדד בשועלו מים ושמים בזרת תיכן״. הגויים לפניו ״כמר מדלי״. ״שאו מרום עיניכם וראו מי ברא אלה... לכולם בשם יקרא״. והגדול הזה נותן כוח לעייפים: ״וקווי ה׳ יחליפו כוח, יעלו אבר כנשרים, ירוצו ולא ייגעו״.","url":"yeshayahu/25.html"},{"key":"yeshayahu","n":26,"title":"מדליקים נרות: אל תירא כי עמך אני","emoji":"🫶","chapters":"ישעיהו פרק מא","know":"ה׳ פונה לישראל במילים חמות: ״ואתה ישראל עבדי, יעקב אשר בחרתיך, זרע אברהם אוהבי״. ״אל תירא כי עמך אני... אימצתיך אף עזרתיך אף תמכתיך בימין צדקי״. גם כשישראל מרגיש קטן, ״תולעת יעקב״, ה׳ אומר: ״אני עזרתיך״.","url":"yeshayahu/26.html"},{"key":"yeshayahu","n":27,"title":"בועות: הן עבדי אתמוך בו","emoji":"🕯️","chapters":"ישעיהו פרק מב","know":"ה׳ מתאר את עבדו: ״הן עבדי אתמוך בו, בחירי רצתה נפשי״. הוא עדין: ״קנה רצוץ לא ישבור ופשתה כהה לא יכבנה״. יש לו תפקיד בעולם: ״ואתנך לברית עם, לאור גויים, לפקוח עיניים עיוורות״. ״ה׳ חפץ למען צדקו, יגדיל תורה ויאדיר״.","url":"yeshayahu/27.html"},{"key":"yeshayahu","n":28,"title":"דיג: קראתי בשמך לי אתה","emoji":"💌","chapters":"ישעיהו פרק מג","know":"אחד הפרקים האוהבים ביותר בנביאים: ״אל תירא כי גאלתיך, קראתי בשמך, לי אתה. כי תעבור במים אתך אני... כי תלך במו אש לא תיכווה״. ״מאשר יקרת בעיניי נכבדת, ואני אהבתיך״. ה׳ מבטיח לקבץ את בניו מכל הרוחות, ואומר: ״אתם עדיי״.","url":"yeshayahu/28.html"},{"key":"yeshayahu","n":29,"title":"מיון: פסל או בורא","emoji":"🪵","chapters":"ישעיהו פרק מד","know":"ישעיהו מראה כמה עבודת הפסלים מגוחכת: אדם כורת עץ, בחציו מסיק אש ומתחמם, ומהשארית עושה פסל ומשתחווה לו. לעומת זאת ה׳ הוא ״ראשון ואחרון, ומבלעדיי אין אלוהים״, והוא גם סולח: ״מחיתי כעב פשעיך וכענן חטאותיך, שובה אליי כי גאלתיך״.","url":"yeshayahu/29.html"},{"key":"yeshayahu","n":30,"title":"מי רוצה להיות מיליונר: כורש משיח ה׳","emoji":"🏛️","chapters":"ישעיהו פרקים מד-מה","know":"ישעיהו מזכיר בשמו את כורש מלך פרס, שנים רבות לפני שנולד: ״האומר לכורש רועי... ולאמר לירושלים תיבנה והיכל תיווסד״. ה׳ קורא לו ״משיחו״ ומחזיק בימינו. הכל כדי שיידעו ״כי אני ה׳ ואין עוד, יוצר אור ובורא חושך, עושה שלום״.","url":"yeshayahu/30.html"},{"key":"yeshayahu","n":31,"title":"בונים: ועד זקנה אני הוא","emoji":"🧱","chapters":"ישעיהו פרקים מו-מח","know":"אלילי בבל, בל ונבו, כורעים ונישאים על בהמות עייפות. ה׳ הפוך מהם: הוא נושא אותנו. ״ועד זקנה אני הוא, ועד שיבה אני אסבול, אני עשיתי ואני אשא״. ״אני ה׳ אלוהיך מלמדך להועיל, מדריכך בדרך תלך״. והקריאה: ״צאו מבבל״.","url":"yeshayahu/31.html"},{"key":"yeshayahu","n":32,"title":"כרטיסיות: התשכח אישה עולה","emoji":"🤱","chapters":"ישעיהו פרק מט","know":"ציון מרגישה נטושה: ״עזבני ה׳ ואדוני שכחני״. ה׳ עונה במשל: ״התשכח אישה עולה... גם אלה תשכחנה ואנוכי לא אשכחך. הן על כפיים חקותיך״. ואז ציון רואה את בניה חוזרים: ״שאי סביב עינייך וראי, כולם נקבצו באו לך״. זו ההפטרה השנייה של שבע דנחמתא.","url":"yeshayahu/32.html"},{"key":"yeshayahu","n":33,"title":"חיבור נקודות: הביטו אל צור חוצבתם","emoji":"🪨","chapters":"ישעיהו פרקים נ-נא","know":"ה׳ מחזק את רודפי הצדק: ״הביטו אל אברהם אביכם ואל שרה תחוללכם, כי אחד קראתיו ואברכהו וארבהו״. אם מאדם אחד צמח עם שלם, גם ציון החרבה תפרח: ״וישם מדברה כעדן... ששון ושמחה יימצא בה, תודה וקול זמרה״. ״אנוכי אנוכי הוא מנחמכם״.","url":"yeshayahu/33.html"},{"key":"yeshayahu","n":34,"title":"מרוץ: מה נאוו על ההרים","emoji":"🏃","chapters":"ישעיהו פרק נב","know":"״עורי עורי לבשי עוזך ציון... התנערי מעפר קומי״. ואז מגיע הרץ: ״מה נאוו על ההרים רגלי מבשר, משמיע שלום, מבשר טוב, משמיע ישועה, אומר לציון: מלך אלוהייך״. הצופים על החומה רואים ״עין בעין״ את שוב ה׳ לציון.","url":"yeshayahu/34.html"},{"key":"yeshayahu","n":35,"title":"החלק: עבד ה׳ הסובל","emoji":"🐑","chapters":"ישעיהו פרקים נב-נג","know":"״הנה ישכיל עבדי, ירום ונישא וגבה מאוד״. העבד מתואר כמי שסבל ונבזה, ״איש מכאובות״, ״כשה לטבח יובל״, ובסוף ירום ויצליח. לפי רש״י ורוב המפרשים, עבד ה׳ כאן הוא עם ישראל, שסבל בגלות בין האומות, ולעתיד לבוא כולם יכירו בצדקתו.","url":"yeshayahu/35.html"},{"key":"yeshayahu","n":36,"title":"חשיפה: רוני עקרה","emoji":"⛺","chapters":"ישעיהו פרק נד","know":"ציון נמשלת לאישה בלי ילדים שפתאום מתמלאת בנים: ״רוני עקרה... הרחיבי מקום אוהלך״. ה׳ אומר: ״ברגע קטן עזבתיך, וברחמים גדולים אקבצך״. ״כי ההרים ימושו והגבעות תמוטינה, וחסדי מאתך לא ימוש״. ״וכל בנייך לימודי ה׳, ורב שלום בנייך״.","url":"yeshayahu/36.html"},{"key":"yeshayahu","n":37,"title":"חדר בריחה: הוי כל צמא","emoji":"💧","chapters":"ישעיהו פרק נה","know":"ה׳ מזמין את כולם: ״הוי כל צמא לכו למים... בלוא כסף ובלוא מחיר״. חז״ל דרשו: אין מים אלא תורה. ״דרשו ה׳ בהימצאו, קראוהו בהיותו קרוב״. כמו שהגשם לא חוזר לשמים בלי להצמיח, כך דבר ה׳ ״לא ישוב אליי ריקם״. ״כי בשמחה תצאו ובשלום תובלון״.","url":"yeshayahu/37.html"},{"key":"yeshayahu","n":38,"title":"לוח משחק: בית תפילה לכל העמים","emoji":"🕍","chapters":"ישעיהו פרק נו","know":"״שמרו משפט ועשו צדקה, כי קרובה ישועתי לבוא״. הנביא מרגיע את בן הנכר שהצטרף אל ה׳ ואת מי שאין לו ילדים: מי ששומר שבת ומחזיק בברית יקבל ״יד ושם טוב מבנים ומבנות״. ״והביאותים אל הר קודשי ושימחתים בבית תפילתי... כי ביתי בית תפילה ייקרא לכל העמים״.","url":"yeshayahu/38.html"},{"key":"yeshayahu","n":39,"title":"שרידות: שלום לרחוק ולקרוב","emoji":"☮️","chapters":"ישעיהו פרק נז","know":"הנביא מוכיח את הדור, ואז מנחם: ״סולו סולו פנו דרך, הרימו מכשול מדרך עמי״. ה׳ ״מרום וקדוש״ שוכן דווקא ״את דכא ושפל רוח, להחיות רוח שפלים״. ״שלום שלום לרחוק ולקרוב, אמר ה׳, ורפאתיו״. לעומת זאת ״הרשעים כים נגרש, כי השקט לא יוכל״.","url":"yeshayahu/39.html"},{"key":"yeshayahu","n":40,"title":"מיון: הצום שה׳ בוחר","emoji":"🍞","chapters":"ישעיהו פרק נח","know":"העם שאל: ״למה צמנו ולא ראית?״ הנביא נשלח לקרוא ״בגרון... כשופר״: צום של ראש כפוף, שק ואפר, בלי לתקן את היחס לזולת, אינו הצום שה׳ בוחר. ״הלוא זה צום אבחרהו: פתח חרצובות רשע... הלוא פרוס לרעב לחמך״. ״אז תקרא וה׳ יענה״. זו ההפטרה של יום הכיפורים בבוקר.","url":"yeshayahu/40.html"},{"key":"yeshayahu","n":41,"title":"בונים: וקראת לשבת עונג","emoji":"🕯️","chapters":"ישעיהו פרק נח","know":"בסוף פרק הצום מדבר ישעיהו על השבת: ״אם תשיב משבת רגלך, עשות חפציך ביום קודשי, וקראת לשבת עונג, לקדוש ה׳ מכובד, וכיבדתו...״. השכר: ״אז תתענג על ה׳, והרכבתיך על במותי ארץ, והאכלתיך נחלת יעקב אביך״. מכאן למדו חז״ל כבוד שבת ועונג שבת.","url":"yeshayahu/41.html"},{"key":"yeshayahu","n":42,"title":"בינגו: ובא לציון גואל","emoji":"🚪","chapters":"ישעיהו פרק נט","know":"העם שואל למה הישועה מתעכבת, והנביא עונה: ״הן לא קצרה יד ה׳ מהושיע ולא כבדה אוזנו משמוע, כי אם עוונותיכם היו מבדילים״. הפרק מסתיים בהבטחה: ״ובא לציון גואל, ולשבי פשע ביעקב״, ובברית: ״רוחי אשר עליך ודבריי אשר שמתי בפיך לא ימושו מפיך ומפי זרעך ומפי זרע זרעך״.","url":"yeshayahu/42.html"},{"key":"yeshayahu","n":43,"title":"אלבום: קומי אורי","emoji":"🌅","chapters":"ישעיהו פרק ס","know":"״קומי אורי כי בא אורך, וכבוד ה׳ עלייך זרח״. חושך יכסה את הארץ, אבל על ירושלים יזרח ה׳, והגויים ילכו לאורה. בניה יבואו מרחוק ״כעב תעופינה וכיונים אל ארובותיהם״. ״ועמך כולם צדיקים, לעולם יירשו ארץ״. ״הקטן יהיה לאלף... אני ה׳ בעתה אחישנה״.","url":"yeshayahu/43.html"},{"key":"yeshayahu","n":44,"title":"חיבור קווים: פאר תחת אפר","emoji":"👘","chapters":"ישעיהו פרק סא","know":"הנביא אומר: ״רוח אדוני ה׳ עליי... לבשר ענווים שלחני, לחבוש לנשברי לב, לקרוא לשבויים דרור״. לאבלי ציון ה׳ נותן החלפות: ״פאר תחת אפר, שמן ששון תחת אבל, מעטה תהילה תחת רוח כהה״. ״ואתם כוהני ה׳ תיקראו״. ״שוש אשיש בה׳, תגל נפשי באלוהיי״.","url":"yeshayahu/44.html"},{"key":"yeshayahu","n":45,"title":"זוגות זיכרון: למען ציון לא אחשה","emoji":"🧱","chapters":"ישעיהו פרק סב","know":"״למען ציון לא אחשה, ולמען ירושלים לא אשקוט״. ירושלים תקבל שמות חדשים: לא עוד ״עזובה״ ו״שממה״, אלא ״חפצי בה״ ו״בעולה״. ״ומשוש חתן על כלה, ישיש עלייך אלוהייך״. ״על חומותייך ירושלים הפקדתי שומרים, כל היום וכל הלילה תמיד לא יחשו״.","url":"yeshayahu/45.html"},{"key":"yeshayahu","n":46,"title":"מי אני: כי אתה אבינו","emoji":"👨‍👦","chapters":"ישעיהו פרקים סג-סד","know":"תפילה ארוכה של הנביא בשם העם. הוא מזכיר את חסדי ה׳: ״בכל צרתם לו צר... באהבתו ובחמלתו הוא גאלם״. והוא מבקש: ״כי אתה אבינו... אתה ה׳ אבינו, גואלנו מעולם שמך״. ״ועתה ה׳ אבינו אתה, אנחנו החומר ואתה יוצרנו, ומעשה ידך כולנו״.","url":"yeshayahu/46.html"},{"key":"yeshayahu","n":47,"title":"מסע: שמים חדשים וארץ חדשה","emoji":"🌈","chapters":"ישעיהו פרק סה","know":"ה׳ מבטיח עולם מתוקן: ״כי הנני בורא שמים חדשים וארץ חדשה... וגלתי בירושלים וששתי בעמי״. לא יישמע בה עוד קול בכי. ״ובנו בתים וישבו, ונטעו כרמים ואכלו פריים״. ״והיה טרם יקראו ואני אענה, עוד הם מדברים ואני אשמע״. ״זאב וטלה ירעו כאחד״.","url":"yeshayahu/47.html"},{"key":"yeshayahu","n":48,"title":"מהירות: כאיש אשר אמו תנחמנו","emoji":"🤗","chapters":"ישעיהו פרק סו","know":"הפרק האחרון: ״השמים כסאי והארץ הדום רגליי״, ובכל זאת ה׳ מביט ״אל עני ונכה רוח וחרד על דברי״. ״שמחו את ירושלים וגילו בה כל אוהביה״. ״הנני נוטה אליה כנהר שלום״. ״כאיש אשר אמו תנחמנו, כן אנוכי אנחמכם, ובירושלים תנוחמו״. זו ההפטרה של שבת ראש חודש.","url":"yeshayahu/48.html"},{"key":"yeshayahu","n":49,"title":"סדר נכון: שבע דנחמתא","emoji":"7️⃣","chapters":"ישעיהו פרקים מ-סא","know":"בשבע השבתות שאחרי תשעה באב קוראים שבע הפטרות נחמה, וכולן מספר ישעיהו. חז״ל הסבירו את הסדר כשיחה: ה׳ שולח לנחם, ציון עונה שהיא מרגישה עזובה, עד שבסוף היא עצמה אומרת ״שוש אשיש בה׳״. סדרו את ההפטרות לפי סדר הקריאה.","url":"yeshayahu/49.html"},{"key":"yeshayahu","n":50,"title":"מצא את הטעות: סיכום ספר ישעיהו","emoji":"🔍","chapters":"ישעיהו כל הספר","know":"ספר ישעיהו, 66 פרקים: תוכחה ליהודה וירושלים, חזון אחרית הימים, סיפור חזקיהו וסנחריב, ומפרק מ ואילך נבואות נחמה וגאולה. ישעיהו נקרא ״נביא הנחמה״, ורוב הפטרות הנחמה לקוחות מספרו.","url":"yeshayahu/50.html"},{"key":"yirmiyahu","n":1,"title":"מהירות: אל תאמר נער אנוכי","emoji":"👦","chapters":"ירמיהו פרק א","know":"ירמיהו בן חלקיהו היה מן הכהנים אשר בענתות, בארץ בנימין. הוא התחיל להתנבא בשנת שלוש עשרה למלך יאשיהו. ה׳ אמר לו: ״בטרם אצורך בבטן ידעתיך... נביא לגויים נתתיך״. ירמיהו ענה: ״הנה לא ידעתי דבר, כי נער אנוכי״. ה׳ השיב: ״אל תאמר נער אנוכי... אל תירא מפניהם כי אתך אני להצילך״.","url":"yirmiyahu/01.html"},{"key":"yirmiyahu","n":2,"title":"חיבור קווים: מקל שקד וסיר נפוח","emoji":"🌸","chapters":"ירמיהו פרק א","know":"ה׳ הראה לירמיהו שני מראות. הראשון: מקל שקד, ״כי שוקד אני על דברי לעשותו״. השני: סיר נפוח שפניו מצד צפון, ״מצפון תיפתח הרעה״. ה׳ חיזק אותו: ״נתתיך היום לעיר מבצר ולעמוד ברזל ולחומות נחושת... ונלחמו אליך ולא יוכלו לך״. התפקיד: ״לנתוש ולנתוץ... לבנות ולנטוע״.","url":"yirmiyahu/02.html"},{"key":"yirmiyahu","n":3,"title":"מדליקים נרות: חסד נעורייך","emoji":"💍","chapters":"ירמיהו פרק ב","know":"הנבואה הראשונה לירושלים נפתחת באהבה: ״זכרתי לך חסד נעורייך, אהבת כלולותייך, לכתך אחריי במדבר בארץ לא זרועה״. ״קודש ישראל לה׳, ראשית תבואתו״. ואחר כך הכאב: ״שתים רעות עשה עמי: אותי עזבו, מקור מים חיים, לחצוב להם בורות נשברים אשר לא יכילו המים״.","url":"yirmiyahu/03.html"},{"key":"yirmiyahu","n":4,"title":"כרטיסיות: שובו בנים שובבים","emoji":"↩️","chapters":"ירמיהו פרקים ג-ד","know":"ה׳ קורא לעמו לחזור: ״שובה משובה ישראל... כי חסיד אני, לא אטור לעולם״. ״שובו בנים שובבים, ארפא משובותיכם״. הוא מבטיח: ״ונתתי לכם רועים כלבי, ורעו אתכם דעה והשכל״. ״אם תשוב ישראל... אליי תשוב״.","url":"yirmiyahu/04.html"},{"key":"yirmiyahu","n":5,"title":"בועות: שאלו לנתיבות עולם","emoji":"🧭","chapters":"ירמיהו פרקים ה-ו","know":"ה׳ אומר: ״שוטטו בחוצות ירושלים... אם תמצאו איש, אם יש עושה משפט, מבקש אמונה, ואסלח לה״. העם ״עיניים להם ולא יראו״. הנביא מציע דרך: ״עמדו על דרכים וראו, ושאלו לנתיבות עולם, אי זה דרך הטוב ולכו בה, ומצאו מרגוע לנפשכם״. והוא מזהיר ממי שאומר ״שלום שלום ואין שלום״.","url":"yirmiyahu/05.html"},{"key":"yirmiyahu","n":6,"title":"חדר בריחה: היכל ה׳ היכל ה׳","emoji":"🏛️","chapters":"ירמיהו פרק ז","know":"ה׳ שלח את ירמיהו לעמוד בשער בית ה׳. העם חשב שהמקדש מגן עליו בכל מקרה, וחזר ואמר: ״היכל ה׳, היכל ה׳, היכל ה׳״. ירמיהו אמר: אי אפשר לגנוב ולהישבע לשקר ואז לבוא לעמוד בבית הזה. ״המערת פריצים היה הבית הזה?״ ״לכו נא אל מקומי אשר בשילו״. ״היטיבו דרכיכם ומעלליכם ואשכנה אתכם במקום הזה״.","url":"yirmiyahu/06.html"},{"key":"yirmiyahu","n":7,"title":"מרוץ: במה יתהלל המתהלל","emoji":"🏅","chapters":"ירמיהו פרק ט","know":"״אל יתהלל חכם בחכמתו, ואל יתהלל הגיבור בגבורתו, אל יתהלל עשיר בעושרו. כי אם בזאת יתהלל המתהלל: השכל וידוע אותי, כי אני ה׳ עושה חסד משפט וצדקה בארץ, כי באלה חפצתי״. חכמה, כוח וכסף הם מתנות. הדבר שראוי להתגאות בו הוא ההיכרות עם ה׳.","url":"yirmiyahu/07.html"},{"key":"yirmiyahu","n":8,"title":"חשיפה: הצרי אין בגלעד","emoji":"😢","chapters":"ירמיהו פרקים ח-ט","know":"ירמיהו נקרא ״הנביא הבוכה״. הוא רואה את הצרה שתבוא וכואב את כאב עמו: ״הצרי אין בגלעד, אם רופא אין שם?״ ״מי ייתן ראשי מים ועיני מקור דמעה, ואבכה יומם ולילה״. הוא מתפלא: ״גם חסידה בשמים ידעה מועדיה... ועמי לא ידעו את משפט ה׳״.","url":"yirmiyahu/08.html"},{"key":"yirmiyahu","n":9,"title":"דיג: ה׳ אלוהים אמת","emoji":"🌴","chapters":"ירמיהו פרק י","know":"ירמיהו מלגלג על הפסלים: ״כתומר מקשה המה ולא ידברו, נשוא יינשאו כי לא יצעדו. אל תיראו מהם״. לעומתם: ״וה׳ אלוהים אמת, הוא אלוהים חיים ומלך עולם״. ״לא כאלה חלק יעקב, כי יוצר הכל הוא״. ותפילה קצרה: ״יסרני ה׳ אך במשפט, אל באפך״.","url":"yirmiyahu/09.html"},{"key":"yirmiyahu","n":10,"title":"מי אני: אנשי ענתות","emoji":"🐑","chapters":"ירמיהו פרקים יא-יב","know":"אפילו אנשי עירו של ירמיהו, אנשי ענתות, רצו לפגוע בו ואמרו: ״לא תינבא בשם ה׳ ולא תמות בידנו״. ירמיהו לא ידע על כך: ״ואני ככבש אלוף יובל לטבוח״, עד שה׳ הודיע לו. הוא שאל את ה׳ בכנות: ״מדוע דרך רשעים צלחה?״ ה׳ ענה: ״את רגלים רצתה וילאוך, ואיך תתחרה את הסוסים?״","url":"yirmiyahu/10.html"},{"key":"yirmiyahu","n":11,"title":"סדר נכון: אזור הפשתים","emoji":"🩹","chapters":"ירמיהו פרק יג","know":"ה׳ ציווה על ירמיהו מעשה סמלי: לקנות אזור (חגורה) פשתים, לחגור אותו, ואחר כך לטמון אותו בנקיק סלע ליד פרת. כעבור זמן רב האזור נשחת. הנמשל: ״כאשר ידבק האזור א
