function quizRun(skin){
 var items=shuf(G.items),n=items.length,i=0,ok=0,wrong=0,st={streak:0,pos:0,dice:0,code:[],cards:[],marks:[],words:[],used:{}},timer=null,finished=false;
 var dice=[2,3,1,3,2,2,3,1,3,2,2,3,1,2,3];
 for(var k=0;k<n;k++)st.code.push(1+Math.floor(Math.random()*9));
 var order=[0,4,8,2,6,1,3,5,7];
 var life={fifty:1,hint:1,friend:1};
 function vizHtml(){return '<div class="viz">'+(VIZ[skin]?VIZ[skin](n,i,ok,st):'')+'</div>'}
 function ask(){
  if(i>=n||(skin==='survive'&&wrong>=3)){return end()}
  var it=items[i],right=it[1],opts=shuf([{t:it[1],c:1},{t:it[2],c:0},{t:it[3],c:0},{t:it[4],c:0}]);
  var h='<div class="card">'+head(i,n,ok,skin==='speed'?'<span id="tm">⏱ 15</span>':'')+vizHtml()+'<div class="q">'+esc(it[0])+'</div>';
  if(skin==='millionaire')h+='<div class="row"><button class="btn2" id="l1"'+(life.fifty?'':' disabled')+'>50:50</button><button class="btn2" id="l2"'+(life.hint?'':' disabled')+'>רמז</button><button class="btn2" id="l3"'+(life.friend?'':' disabled')+'>שאל חבר</button></div>';
  if(skin==='bubbles'||skin==='fish'){h+='<div class="bub" id="bub">';for(var k=0;k<4;k++)h+='<button class="opt" data-k="'+k+'">'+(skin==='fish'?'🐟 ':'')+esc(opts[k].t)+'</button>';h+='</div>'}
  else{h+='<div class="opts">';for(var k=0;k<4;k++)h+='<button class="opt" data-k="'+k+'">'+esc(opts[k].t)+'</button>';h+='</div>'}
  h+='<div id="fb"></div></div>';
  app.innerHTML=h;
  var btns=[].slice.call(app.querySelectorAll('.opt')),answered=false;
  if(skin==='bubbles'||skin==='fish'){var slots=[[3,4],[53,4],[3,56],[53,56],[3,28],[53,28]],mv=function(){var s=shuf(slots);btns.forEach(function(b,k){b.style.right=s[k][0]+'%';b.style.top=s[k][1]+'%'})};mv();var mi=setInterval(function(){if(answered||!document.getElementById('bub'))return clearInterval(mi);mv()},2400)}
  function resolve(good,idx){
   if(answered)return;answered=true;if(timer)clearInterval(timer);
   btns.forEach(function(b,k){b.disabled=true;if(opts[k].c)b.classList.add('good');else if(k===idx)b.classList.add('bad');else b.classList.add('dim')});
   var msg;
   if(good){ok++;st.streak++;msg='✔ '+love();if(skin==='board'){st.dice=dice[i%dice.length];st.pos=Math.min(13,st.pos+st.dice)}if(skin==='bingo'){var m=order[st.marks.length];st.marks.push(m);st.words.push(String(right).split(' ').slice(0,2).join(' '))}if(skin==='album')st.cards.push(String(right).split(' ').slice(0,3).join(' '));if(skin==='speed'&&st.streak>=3)msg+=' (בונוס רצף!)'}
   else{wrong++;st.streak=0;msg='התשובה הנכונה: '+right+'. '+enc()}
   i++;
   var f=document.getElementById('fb');f.innerHTML='<div class="fb'+(good?' g':'')+'">'+esc(msg)+'</div><div class="row"><button id="nx">'+((i>=n||(skin==='survive'&&wrong>=3))?'לסיום':'המשך')+'</button></div>';
   document.getElementById('nx').onclick=ask;document.getElementById('nx').focus();
  }
  btns.forEach(function(b,k){b.onclick=function(){resolve(!!opts[k].c,k)}});
  if(skin==='speed'){var t=15;timer=setInterval(function(){t--;var e=document.getElementById('tm');if(e)e.textContent='⏱ '+t;if(t<=0){clearInterval(timer);resolve(false,-1)}},1000)}
  if(skin==='millionaire'){
   var l1=document.getElementById('l1'),l2=document.getElementById('l2'),l3=document.getElementById('l3');
   l1.onclick=function(){if(answered)return;life.fifty=0;l1.disabled=true;var c=0;btns.forEach(function(b,k){if(!opts[k].c&&c<2){c++;b.disabled=true;b.classList.add('dim')}})};
   l2.onclick=function(){if(answered)return;life.hint=0;l2.disabled=true;document.getElementById('fb').innerHTML='<div class="fb">רמז: התשובה מתחילה במילה "'+esc(String(right).split(' ')[0])+'"</div>'};
   l3.onclick=function(){if(answered)return;life.friend=0;l3.disabled=true;btns.forEach(function(b,k){if(opts[k].c)b.style.boxShadow='0 0 0 4px var(--accent2)'});document.getElementById('fb').innerHTML='<div class="fb">החבר אומר: אני כמעט בטוח בתשובה המסומנת</div>'};
  }
 }
 function end(){
  var ex='';if(skin==='bingo'&&st.marks.length>=3)ex='בינגו! השלמת שורה';if(skin==='escape'&&ok>=Math.ceil(n*0.6))ex='הדלת נפתחה! הקוד: '+st.code.slice(0,ok).join('');if(skin==='race')ex=ok>=Math.round(n*0.78)?'ניצחת במרוץ!':'כמעט הגעת לפני הצב';if(skin==='board')ex='הגעת למשבצת '+(st.pos+1);if(skin==='survive'&&wrong>=3)ex='נגמרו הלבבות, נסה שוב ותגיע רחוק יותר';
  finish(ok,n,ex)
 }
 ask();
}
function cardsRun(){
 var items=shuf(G.items),q=items.slice(),hard=[],i=0,seen=0,know=0,tot=items.length,pass=0;
 function show(){
  if(i>=q.length){if(hard.length&&pass<1){pass++;q=hard;hard=[];i=0;return show()}return finish(know,tot)}
  var it=q[i];
  app.innerHTML='<div class="card">'+head(seen,tot+hard.length,know)+'<div class="card fl" id="fl" tabindex="0" role="button">'+esc(it[0])+'<br><small>(לחצו כדי להפוך)</small></div><div id="r"></div></div>';
  var fl=document.getElementById('fl');
  var flip=function(){fl.innerHTML='<div>'+esc(it[1])+'</div>';document.getElementById('r').innerHTML='<div class="row"><button id="k">ידעתי ✔</button><button class="btn2" id="h">עוד קצת</button></div>';
   document.getElementById('k').onclick=function(){if(!pass)window.KT&&KT.ok(1,'c'+it[0]);know++;seen++;i++;show()};
   document.getElementById('h').onclick=function(){hard.push(it);seen++;i++;show()}};
  fl.onclick=flip;fl.onkeydown=function(e){if(e.key==='Enter'||e.key===' ')flip()};
 }
 q=items;show();
}
/* ---------- P kinds ---------- */
function memoryRun(){
 var pairs=G.items.slice(0,6),cards=[];
 pairs.forEach(function(p,k){cards.push({k:k,t:p[0]});cards.push({k:k,t:p[1]})});cards=shuf(cards);
 var open=[],done=0,moves=0,lock=false;
 function draw(){
  var h='<div class="card"><div class="top"><span>'+esc(pname)+'</span><span>מהלכים: '+moves+'</span><span>זוגות: '+done+'/'+pairs.length+'</span></div>'+bar(done/pairs.length)+'<div class="grid mem" style="margin-top:10px">';
  cards.forEach(function(c,k){h+='<button class="mc'+(c.open?' open':'')+(c.done?' done':'')+'" data-k="'+k+'">'+((c.open||c.done)?esc(c.t):'❓')+'</button>'});
  h+='</div><div id="fb"></div></div>';app.innerHTML=h;
  [].slice.call(app.querySelectorAll('.mc')).forEach(function(b){b.onclick=function(){flip(+b.getAttribute('data-k'))}});
 }
 function flip(k){
  var c=cards[k];if(lock||c.open||c.done)return;c.open=true;open.push(k);draw();
  if(open.length===2){moves++;lock=true;var a=cards[open[0]],b=cards[open[1]];
   if(a.k===b.k){setTimeout(function(){a.open=b.open=false;a.done=b.done=true;done++;open=[];lock=false;draw();document.getElementById('fb').innerHTML='<div class="fb g">✔ '+esc(love())+'</div>';if(done===pairs.length)setTimeout(function(){finish(pairs.length,Math.max(pairs.length,moves),'סיימת ב-'+moves+' מהלכים')},1800)},500)}
   else setTimeout(function(){a.open=b.open=false;open=[];lock=false;draw()},900)}
 }
 draw();
}
function matchRun(){
 var pairs=G.items.slice(0,6),L=shuf(pairs.map(function(p,k){return {k:k,t:p[0]}})),R=shuf(pairs.map(function(p,k){return {k:k,t:p[1]}})),sel=-1,done={},cnt=0,tries=0;
 function draw(msg){
  var h='<div class="card"><div class="top"><span>'+esc(pname)+'</span><span>חיבורים: '+cnt+'/'+pairs.length+'</span></div>'+bar(cnt/pairs.length)+'<div class="cols"><div>';
  L.forEach(function(x,i){h+='<button class="chip'+(done[x.k]?' ok':'')+(sel===i?' sel':'')+'" data-l="'+i+'">'+esc(x.t)+'</button>'});
  h+='</div><div>';R.forEach(function(x,i){h+='<button class="chip'+(done[x.k]?' ok':'')+'" data-r="'+i+'">'+esc(x.t)+'</button>'});
  h+='</div></div><div id="fb">'+(msg||'')+'</div></div>';app.innerHTML=h;
  [].slice.call(app.querySelectorAll('[data-l]')).forEach(function(b){b.onclick=function(){var i=+b.getAttribute('data-l');if(done[L[i].k])return;sel=i;draw()}});
  [].slice.call(app.querySelectorAll('[data-r]')).forEach(function(b){b.onclick=function(){var j=+b.getAttribute('data-r');if(sel<0||done[R[j].k])return;tries++;
   if(L[sel].k===R[j].k){done[R[j].k]=1;cnt++;sel=-1;if(cnt===pairs.length)return finish(pairs.length,Math.max(pairs.length,tries),'סיימת ב-'+tries+' ניסיונות');draw('<div class="fb g">✔ '+esc(love())+'</div>')}
   else{sel=-1;draw('<div class="fb shake">'+esc(enc())+'</div>')}}});
 }
 draw();
}
function sortRun(){
 var cats=G.cats,items=shuf(G.items),i=0,ok=0,tries=0;
 function show(msg){
  if(i>=items.length)return finish(ok,items.length);
  var it=items[i];
  var h='<div class="card">'+head(i,items.length,ok)+'<div class="q" style="text-align:center;margin:10px 0">'+esc(it[0])+'</div><div class="opts">';
  cats.forEach(function(c,k){h+='<button class="opt" data-k="'+k+'">📦 '+esc(c)+'</button>'});
  h+='</div><div id="fb">'+(msg||'')+'</div></div>';app.innerHTML=h;
  [].slice.call(app.querySelectorAll('.opt')).forEach(function(b){b.onclick=function(){var k=+b.getAttribute('data-k');
   if(k===it[1]){ok++;i++;show('<div class="fb g">✔ '+esc(love())+'</div>')}else{i++;show('<div class="fb">'+esc(it[0])+' שייך ל"'+esc(cats[it[1]])+'". '+esc(enc())+'</div>')}}});
 }
 show();
}
/* ---------- O kinds ---------- */
function orderRun(skin){
 var steps=G.items.slice(),pool=shuf(steps.map(function(t,k){return {k:k,t:t}})),ans=[],checked=false;
 function draw(res){
  var h='<div class="card"><div class="top"><span>'+esc(pname)+'</span></div><p>'+(skin==='timeline'?'לחצו על האירועים לפי הסדר מהמוקדם למאוחר:':'לחצו על הפריטים לפי הסדר הנכון:')+'</p><div>';
  for(var s=0;s<steps.length;s++){var a=ans[s],cl='slot'+(res?(a&&a.k===s?' ok':' no'):'');h+='<div class="'+cl+'" data-s="'+s+'">'+(skin==='timeline'?'<strong>'+(s+1)+'.</strong> ':'<strong>'+(s+1)+'.</strong> ')+(a?esc(a.t):'')+'</div>'}
  h+='</div><div class="opts">';pool.forEach(function(p,i){h+='<button class="opt" data-p="'+i+'">'+esc(p.t)+'</button>'});
  h+='</div><div class="row">'+(pool.length===0&&!res?'<button id="ck">בדיקה</button>':'')+(ans.length?'<button class="btn2" id="un">בטל אחרון</button>':'')+'</div><div id="fb"></div></div>';
  app.innerHTML=h;
  [].slice.call(app.querySelectorAll('[data-p]')).forEach(function(b){b.onclick=function(){ans.push(pool.splice(+b.getAttribute('data-p'),1)[0]);draw()}});
  var un=document.getElementById('un');if(un)un.onclick=function(){pool.push(ans.pop());draw()};
  var ck=document.getElementById('ck');if(ck)ck.onclick=function(){
   var good=0;ans.forEach(function(a,s){if(a.k===s)good++});
   if(good===steps.length){window.KT&&KT.ok(steps.length-1);draw(true);document.getElementById('fb').innerHTML='<div class="fb g">✔ '+esc(love())+'</div><div class="row"><button id="fin">לסיום</button></div>';document.getElementById('fin').onclick=function(){finish(steps.length,steps.length)}}
   else{draw(true);document.getElementById('fb').innerHTML='<div class="fb">'+good+' מתוך '+steps.length+' במקום הנכון. '+esc(enc())+'</div><div class="row"><button id="rt">נסה שוב</button></div>';document.getElementById('rt').onclick=function(){pool=shuf(steps.map(function(t,k){return {k:k,t:t}}));ans=[];draw()}}
  };
 }
 draw();
}
/* ---------- T kinds ---------- */
function swipeRun(){
 var items=shuf(G.items),i=0,ok=0;
 function show(msg){
  if(i>=items.length)return finish(ok,items.length);
  var it=items[i];
  app.innerHTML='<div class="card">'+head(i,items.length,ok)+'<div class="card swipe" id="sw">'+esc(it[0])+'</div><div class="row"><button id="no" style="background:#dc2626">❌ לא נכון</button><button id="yes" style="background:#059669">✔ נכון</button></div><div id="fb">'+(msg||'')+'</div></div>';
  function ans(v){var good=(v===(it[1]?1:0));if(good)ok++;i++;show('<div class="fb'+(good?' g':'')+'">'+(good?'✔ '+esc(love()):'לא בדיוק. '+esc(enc()))+'<br>'+esc(it[2]||'')+'</div>')}
  document.getElementById('yes').onclick=function(){ans(1)};document.getElementById('no').onclick=function(){ans(0)};
  var sw=document.getElementById('sw'),x0=null;
  sw.onpointerdown=function(e){x0=e.clientX};
  sw.onpointerup=function(e){if(x0===null)return;var d=e.clientX-x0;x0=null;if(d>60)ans(0);else if(d<-60)ans(1)};
 }
 show();
}
function mistakeRun(){
 var tr=shuf(G.items.filter(function(x){return x[1]})),fl=shuf(G.items.filter(function(x){return !x[1]})),rounds=Math.min(fl.length,Math.floor(tr.length/3)),i=0,ok=0;
 function show(msg){
  if(i>=rounds)return finish(ok,rounds);
  var opts=shuf([{t:fl[i][0],c:0,e:fl[i][2]}].concat(tr.slice(i*3,i*3+3).map(function(x){return {t:x[0],c:1}})));
  var h='<div class="card">'+head(i,rounds,ok)+'<div class="q">איזה משפט שגוי?</div><div class="opts">';
  opts.forEach(function(o,k){h+='<button class="opt" data-k="'+k+'">'+esc(o.t)+'</button>'});
  h+='</div><div id="fb">'+(msg||'')+'</div></div>';app.innerHTML=h;
  [].slice.call(app.querySelectorAll('.opt')).forEach(function(b){b.onclick=function(){var o=opts[+b.getAttribute('data-k')],good=!o.c;if(good)ok++;
   var wr=opts.filter(function(x){return !x.c})[0];i++;
   show('<div class="fb'+(good?' g':'')+'">'+(good?'✔ '+esc(love()):'המשפט השגוי היה: '+esc(wr.t)+' '+esc(enc()))+'<br>'+esc(wr.e||'')+'</div>')}});
 }
 show();
}
var RUN={};
['speed','survive','race','journey','build','reveal','millionaire','board','escape','bingo','album','lamp','bubbles','fish','who','dots'].forEach(function(m){RUN[m]=function(){quizRun(m)}});
RUN.cards=cardsRun;RUN.memory=memoryRun;RUN.match=matchRun;RUN.sort=sortRun;
RUN.order=function(){orderRun('order')};RUN.timeline=function(){orderRun('timeline')};RUN.swipe=swipeRun;RUN.mistake=mistakeRun;
window.KT&&KT.init({id:'yechezkel-31',title:"יחזקאל: דיג: הנחל היוצא מהמקדש",home:'../index.html',homeTxt:'🎲 לכל משחקי הנביאים',praise:window.KT_PRAISE,again:function(){start()}});
start();
</script></body></html>
