בה: ״על משמרתי אעמודה... ואצפה לראות מה ידבר בי״. ה׳ עונה: ״כתוב חזון ובאר על הלוחות, למען ירוץ קורא בו. כי עוד חזון למועד... אם יתמהמה, חכה לו, כי בוא יבוא, לא יאחר״. ״וצדיק באמונתו יחיה״. חז״ל אמרו: בא חבקוק והעמיד את כל המצוות על אחת, על האמונה.", "emoji": "🗼", "mechHe": "מרוץ", "url": "treasar/36.html", "pic": "https://yudataub.github.io/kol-toda-img-4/neviim-games/treasar/img/treasar-36.webp"}, {"key": "treasar", "n": 37, "book": "תרי עשר", "title": "בינגו: חבקוק: אבן מקיר תזעק", "chapters": "חבקוק פרק ב", "mech": "bingo", "know": "חמש פעמים ״הוי״ על מי שבונה את עושרו מגזל. ״הוי המרבה לא לו״. ״כי אבן מקיר תזעק, וכפיס מעץ יעננה״: אפילו קירות הבית שנבנה בעוול צועקים. ולעומת זה: ״כי תימלא הארץ לדעת את כבוד ה׳, כמים יכסו על ים״. והפרק מסתיים בשקט: ״וה׳ בהיכל קודשו, הס מפניו כל הארץ״.", "emoji": "🧱", "mechHe": "בינגו", "url": "treasar/37.html", "pic": "https://yudataub.github.io/kol-toda-img-4/neviim-games/treasar/img/treasar-37.webp"}, {"key": "treasar", "n": 38, "book": "תרי עשר", "title": "בונים: חבקוק: ואני בה׳ אעלוזה", "chapters": "חבקוק פרק ג", "mech": "build", "know": "הפרק האחרון הוא תפילה ושיר: ״ה׳, שמעתי שמעך, יראתי... ברוגז רחם תזכור״. ובסוף, אחד מפסוקי האמונה היפים ביותר: גם אם ״תאנה לא תפרח ואין יבול בגפנים... ואין בקר ברפתים, ואני בה׳ אעלוזה, אגילה באלוהי ישעי. ה׳ אדוני חילי, וישם רגליי כאיילות״.", "emoji": "🦌", "mechHe": "בנייה", "url": "treasar/38.html", "pic": "https://yudataub.github.io/kol-toda-img-4/neviim-games/treasar/img/treasar-38.webp"}, {"key": "treasar", "n": 39, "book": "תרי עשר", "title": "מהירות: צפניה: בקשו ענווה", "chapters": "צפניה פרקים א-ב", "mech": "speed", "know": "צפניה בן כושי ניבא בימי יאשיהו מלך יהודה. הוא מזהיר: ״קרוב יום ה׳ הגדול״, ״יום שופר ותרועה״. ה׳ יחפש את ירושלים ״בנרות״, וימצא את מי שאומר בלבו ״לא ייטיב ה׳ ולא ירע״, כאילו לא אכפת לה׳. ויש דרך: ״בקשו את ה׳ כל ענווי הארץ... בקשו צדק, בקשו ענווה״.", "emoji": "🕯️", "mechHe": "מהירות", "url": "treasar/39.html", "pic": "https://yudataub.github.io/kol-toda-img-4/neviim-game const PIC={"yehoshua":'<img class="bimg" src="https://yudataub.github.io/kol-toda-img-4/neviim-games/yehoshua/img/yehoshua.webp" alt="יהושע">',"shoftim":'<img class="bimg" src="https://yudataub.github.io/kol-toda-img-4/neviim-games/shoftim/img/shoftim.webp" alt="שופטים">',"shmuel":'<img class="bimg" src="https://yudataub.github.io/kol-toda-img-4/neviim-games/shmuel/img/shmuel.webp" alt="שמואל">',"melachim":'<img class="bimg" src="https://yudataub.github.io/kol-toda-img-4/neviim-games/melachim/img/melachim.webp" alt="מלכים">',"yeshayahu":'<img class="bimg" src="https://yudataub.github.io/kol-toda-img-4/neviim-games/yeshayahu/img/yeshayahu.webp" alt="ישעיהו">',"yirmiyahu":'<img class="bimg" src="https://yudataub.github.io/kol-toda-img-4/neviim-games/yirmiyahu/img/yirmiyahu.webp" alt="ירמיהו">',"yechezkel":'<img class="bimg" src="https://yudataub.github.io/kol-toda-img-4/neviim-games/yechezkel/img/yechezkel.webp" alt="יחזקאל">',"treasar":'<img class="bimg" src="https://yudataub.github.io/kol-toda-img-4/neviim-games/treasar/img/treasar.webp" alt="תרי עשר">'};
const ROAD=b=>'<a class="road" href="palace.html#'+b+'">🏰 הדרך אל הארמון – כמה כבר עברתי?</a>';
function draw(){document.getElementById('pic').innerHTML=(PIC[cur]||'')+ROAD(cur);tabs.innerHTML=BK.map(b=>`<button class="tab ${b[0]==cur?'on':''}" data-k="${b[0]}">${b[1]} (${b[2]})</button>`).join('');
const t=q.value.trim();const r=ROWS.filter(x=>x.key==cur&&(!t||(x.title+x.chapters+x.mechHe+x.know).includes(t)));
cnt.textContent=r.length+' משחקים';
list.innerHTML=r.map(x=>`<div class="card">${x.pic?'<img class="th" src="'+x.pic+'" alt="" loading="lazy">':'<div class="e">'+esc(x.emoji||'🎮')+'</div>'}<div><h3>${x.n}. ${esc(x.title)}</h3><div class="meta">${esc(x.chapters)} · ${esc(x.mechHe)}</div><p>${esc(x.know)}</p><a class="play" href="${x.url}">שחק</a></div></div>`).join('')}
tabs.onclick=e=>{const k=e.target.dataset.k;if(k){cur=k;history.replaceState(null,'','#'+k);draw()}};q.oninput=draw;draw();
</script></body></html>
