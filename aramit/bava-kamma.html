}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.6;direction:rtl;margin:0}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:linear-gradient(135deg,#4b0082,#6a0dad 60%,#8e44ad);color:#fff;border-radius:22px;padding:22px 22px 18px;position:relative;overflow:hidden}
header.top::after{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,#ffd70055,transparent 70%)}
.eyebrow{font-size:.8rem;letter-spacing:.08em;opacity:.85;font-weight:500}
h1{font-family:var(--f-aram);font-weight:900;font-size:clamp(1.9rem,6vw,2.6rem);margin:2px 0 4px;line-height:1.15;text-wrap:balance}
h1 .gold{color:#ffd700}
.sub{margin:0;opacity:.92;font-size:.98rem;max-width:56ch}
.howto{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{background:#ffffff22;border:1px solid #ffffff33;border-radius:999px;padding:3px 12px;font-size:.85rem}

h2{font-family:var(--f-aram);font-size:1.35rem;margin:26px 0 10px;color:var(--c1)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.daf{display:flex;flex-direction:column;gap:2px;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;color:var(--ink);font:inherit;transition:transform .12s,border-color .12s}
.daf:hover{transform:translateY(-2px);border-color:var(--c2)}
.daf:focus-visible,.btn:focus-visible,.ans:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.daf b{font-family:var(--f-aram);font-size:1.25rem;color:var(--c1)}
.daf small{color:var(--muted);font-size:.8rem}
.stars{color:var(--gold);letter-spacing:2px;font-size:.95rem;min-height:1.2em}
.stars .off{color:var(--line)}
.allbtn{margin-top:14px;width:100%;display:flex;justify-content:space-between;align-items:center;background:var(--surface2);border:2px dashed var(--c3);border-radius:14px;padding:14px 16px;cursor:pointer;font:inherit;color:var(--ink)}
.allbtn b{font-family:var(--f-aram);font-size:1.2rem;color:var(--c1)}

.chaps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.chap{display:flex;flex-direction:column;gap:4px;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;cursor:pointer;color:var(--ink);font:inherit;transition:transform .12s,border-color .12s}

.chap:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.chap b{font-family:var(--f-aram);font-size:1.7rem;font-weight:900;color:var(--c1);line-height:1.2}
.chap small{color:var(--muted);font-size:.82rem}
.cnum{font-size:.75rem;letter-spacing:.08em;font-weight:700;color:var(--c3)}
.cbar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:6px}
.cbar i{display:block;height:100%;background:linear-gradient(90deg,var(--c2),var(--gold))}
header.top.slim{padding:16px 20px 14px}
header.top.slim h1{font-size:clamp(1.6rem,5vw,2.2rem)}
/* game */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--surface2);color:var(--c1)}
.btn.primary{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff}
.btn.gold{background:var(--gold);color:var(--goldInk)}
.where{font-family:var(--f-aram);font-weight:700;font-size:1.15rem;color:var(--c1)}
.prog{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-bottom:6px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--c2),var(--gold));width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.88rem;font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px 20px 22px;margin-top:14px;text-align:center;box-shadow:0 10px 30px -18px #4b008266}
.lbl{font-size:.78rem;letter-spacing:.1em;color:var(--muted);font-weight:700}

.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.ans{border:2px solid transparent;border-radius:16px;padding:16px 10px;font:inherit;font-size:1.2rem;font-weight:800;cursor:pointer;color:#fff}
.ans.t{background:var(--ok)} .ans.f{background:var(--bad)}
.ans:disabled{opacity:.45;cursor:default}
.ans kbd{display:block;font-size:.7rem;font-weight:500;opacity:.85;font-family:var(--f-ui)}
.fb{margin-top:16px;border-radius:14px;padding:12px 14px;text-align:right;font-size:1rem}
.fb.good{background:var(--okBg);color:var(--ink);border-right:5px solid var(--ok)}
.fb.wrong{background:var(--badBg);color:var(--ink);border-right:5px solid var(--bad)}
.fb strong{font-family:var(--f-aram);font-size:1.1rem}
.next{margin-top:14px;width:100%}
.streak{color:var(--gold);font-weight:800}

.timerow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.clock{font-size:1.2rem}
.tprog{flex:1;height:12px;background:var(--surface2);border-radius:99px;overflow:hidden}

.tprog i.hurry{background:var(--bad)}
.timer{font-family:var(--f-aram);font-weight:900;font-size:1.5rem;color:var(--c1);font-variant-numeric:tabular-nums;min-width:3.2ch;text-align:left}
.timer.hurry{color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.45}}
.gradebox{display:flex;align-items:baseline;justify-content:center;gap:12px;margin-top:6px}
.gw{font-family:var(--f-aram);font-weight:700;font-size:1.4rem;color:var(--c2)}
.stats{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:6px 0 4px}

.miss.bad{border-right:5px solid var(--bad)}
.note{color:var(--muted);font-size:.82rem;margin-top:14px}
.next small{font-weight:400;opacity:.8}
.grade{font-weight:800;color:var(--c2);font-size:.85rem}

.result{text-align:center}
.big{font-family:var(--f-aram);font-size:3.4rem;font-weight:900;color:var(--c1);line-height:1;font-variant-numeric:tabular-nums}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.pop{animation:pop .35s ease}

.kt-foot{max-width:760px;margin:26px auto 0;padding:0 16px 34px;text-align:center;font-family:var(--f-ui);font-size:14.5px}

["וּרְמִינְהִי", "וּמַקְשִׁים (סְתִירָה) מִמָּקוֹם אַחֵר", "וְרִמּוּ אוֹתָם"],
["הָא דַּאֲתַי לִידֵיהּ", "זֶה – שֶׁבָּא לְיָדוֹ", "זֶה – שֶׁלֹּא בָּא לְיָדוֹ"],
["דַּאֲתַי לִידֵיהּ מַשְׁמַע", "שֶׁבָּא לְיָדוֹ מַשְׁמָע", "שֶׁלֹּא בָּא לְיָדוֹ מַשְׁמָע"],
["בְּתוֹרַת שְׁמִירָה", "בְּתוֹר (לְשֵׁם) שְׁמִירָה", "בְּתוֹרַת הַשּׁוֹמְרִים"],
["הָהוּא אַרְנְקָא דִצְדָקָה", "אוֹתוֹ אַרְנָק שֶׁל צְדָקָה", "אוֹתוֹ אָרוֹן שֶׁל צְדָקָה"],
["אַפְקְדַהּ רַב יוֹסֵף גַּבֵּי הָהוּא גַּבְרָא", "הִפְקִיד אוֹתוֹ רַב יוֹסֵף אֵצֶל אָדָם אֶחָד", "הִפְקִיר אוֹתוֹ רַב יוֹסֵף אֵצֶל אָדָם אֶחָד"],
["פְּשַׁע בַּהּ", "פָּשַׁע בּוֹ (לֹא שָׁמַר כָּרָאוּי)", "פָּשַׁט בּוֹ"],
["אֲתוֹ גַּנָּבֵי גַּנְבוּהָ", "בָּאוּ גַּנָּבִים וּגְנָבוּהוּ", "בָּאוּ גַּנָּנִים וּגְנָנוּהוּ"],
["חַיְּיבֵיהּ רַב יוֹסֵף", "חִיֵּב אוֹתוֹ רַב יוֹסֵף", "פָּטַר אוֹתוֹ רַב יוֹסֵף"],
["עַנְיֵי דְפוּמְבְּדִיתָא מִיקָּץ קִיץ לְהוּ", "עֲנִיֵּי פּוּמְבְּדִיתָא – קָצוּב קָצוּב לָהֶם (סְכוּם קָבוּעַ)", "עֲנִיֵּי פּוּמְבְּדִיתָא – קַיִץ קַיִץ לָהֶם"]
]
}}];
const D={},CHOF={};
CH.forEach(c=>{c.keys=Object.keys(c.D);c.keys.forEach(k=>{D[k]=c.D[k];CHOF[k]=c})});
const KEYS=CH.flatMap(c=>c.keys);
function heb(n){const u=["","א","ב","ג","ד","ה","ו","ז","ח","ט"],t=["","י","כ","ל","מ","נ","ס","ע","פ","צ"];const s=n===15?"טו":n===16?"טז":t[Math.floor(n/10)]+u[n%10];return s.length>1?s.slice(0,-1)+"״"+s.slice(-1):s+"׳"}
const isTest=k=>k.startsWith("all");
const testCh=k=>k==="all"?null:CH.find(c=>"all-"+c.id===k);
const label=k=>k==="all"?"מבחן כל המסכת":isTest(k)?`מבחן פרק ${testCh(k).name}`:`דף ${heb(parseInt(k))} ${k.slice(-1)==="a"?"ע״א":"ע״ב"}`;
const short=k=>`${heb(parseInt(k))}${k.slice(-1)==="a"?".":":"}`;
const range=c=>`${short(c.keys[0])} – ${short(c.keys[c.keys.length-1])}`;
const backHash=k=>k==="all"?"":isTest(k)?testCh(k).id:CHOF[k].id;
const $=s=>document.querySelector(s);
const app=$("#app");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let best={};
try{best=JSON.parse(localStorage.getItem("bk-best")||"{}")||{}}catch(e){best={}}
const saveBest=()=>{try{localStorage.setItem("bk-best",JSON.stringify(best))}catch(e){}};
const starsOf=p=>p==null?0:p>=1?3:p>=.8?2:p>=.5?1:0;
const starHTML=(n,cls="")=>`<span class="${cls}">${"★".repeat(n)}<span class="off">${"★".repeat(3-n)}</span></span>`;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

let audio=null;
function beep(good){
  try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();
    const notes=good?[660,880]:[300,220];
    notes.forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;o.type="sine";
      g.gain.setValueAtTime(.12,audio.currentTime+i*.1);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+i*.1+.18);
      o.connect(g).connect(audio.destination);o.start(audio.currentTime+i*.1);o.stop(audio.currentTime+i*.1+.2)});
  }catch(e){}
}

/* ---------- home ---------- */
const gradeOf=k=>best[k]!=null?starHTML(starsOf(best[k]))+` <span class="grade">${Math.round(best[k]*100)}</span>`:"";
function home(){
  document.title="בבא קמא · נכון או לא נכון";
  const done=KEYS.filter(k=>best[k]!=null).length;
  app.innerHTML=`
  <header class="top">
    <div class="eyebrow">מסכת בבא קמא · פרקים א׳–ג׳, ו׳, ח׳</div>
    <h1>בָּבָא קַמָּא <span class="gold">נָכוֹן / לֹא נָכוֹן</span></h1>
    <p class="sub">מילים בארמית מתוך הגמרא של כל עמוד, ולידן פירוש. האם הפירוש נכון? יש לכם דקה אחת. בסוף מקבלים ציון ורשימה של המילים שנכשלתם בהן.</p>
    <div class="howto"><span class="chip">⏱ דקה לכל משחק</span><span class="chip">✔ נכון · מקש →</span><span class="chip">✘ לא נכון · מקש ←</span><span class="chip">${done}/${KEYS.length} עמודים שוחקו</span></div>
  </header>
  <h2>בחרו פרק</h2>
  <div class="chaps">${CH.map(c=>{const d=c.keys.filter(k=>best[k]!=null).length,w=c.keys.reduce((n,k)=>n+D[k].length,0);return `
    <button class="chap" data-h="${c.id}">
      <span class="cnum">פרק ${c.n}</span>
      <b>${c.name}</b>
      <small>דפים ${range(c)} · ${c.keys.length} עמודים · ${w} מילים</small>
      <span class="cbar"><i style="width:${d/c.keys.length*100}%"></i></span>
      <small>${d}/${c.keys.length} עמודים שוחקו</small>
    </button>`}).join("")}</div>
  <button class="allbtn" data-h="all"><span><b>מבחן כל המסכת</b><br><small>20 מילים אקראיות מכל הפרקים</small></span><span class="stars">${best.all!=null?gradeOf("all"):"←"}</span></button>
  <p class="foot">המילים והפירושים נלקחו מנוסח הגמרא המנוקד (מהדורת וויליאם דוידסון) ומפירוש רש״י.</p>`;
  app.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{location.hash=b.dataset.h});
}
function chapter(c){
  document.title=`פרק ${c.name.replace(/[֑-ׇ]/g,"")} · בבא קמא`;
  app.innerHTML=`
  <div class="bar"><button class="btn" id="back">→ לכל הפרקים</button><span class="where">פרק ${c.n}</span></div>
  <header class="top slim">
    <div class="eyebrow">בבא קמא · פרק ${c.n} · דפים ${range(c)}</div>
    <h1>${c.name}</h1>
  </header>
  <h2>בחרו עמוד</h2>
  <div class="grid">${c.keys.map(k=>`
    <button class="daf" data-h="d${k}" aria-label="${label(k)}">
      <b>${short(k)}</b><small>${label(k)} · ${D[k].length} מילים</small>
      <span class="stars">${gradeOf(k)}</span>
    </button>`).join("")}</div>
  <button class="allbtn" data-h="all-${c.id}"><span><b>מבחן פרק ${c.name}</b><br><small>20 מילים אקראיות מכל עמודי הפרק</small></span><span class="stars">${best["all-"+c.id]!=null?gradeOf("all-"+c.id):"←"}</span></button>`;
  $("#back").onclick=()=>{location.hash=""};
  app.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{location.hash=b.dataset.h});
}

/* ---------- game ---------- */
const LIMIT=60;               // שניות לכל משחק
let G=null;
const gradeWord=g=>g===100?"מושלם!":g>=90?"מצוין":g>=80?"טוב מאוד":g>=65?"טוב":g>=55?"מספיק":"צריך חיזוק";
function stopTimers(){if(G){clearInterval(G.tick);clearTimeout(G.adv)}}
function start(k,custom){
  stopTimers();
  let pool=custom||(isTest(k)?shuffle((testCh(k)?testCh(k).keys:KEYS).flatMap(x=>D[x].map(w=>[...w,x]))).slice(0,20):shuffle(D[k].map(w=>[...w,k])));
  const half=shuffle(pool.map((_,i)=>i)).slice(0,Math.round(pool.length/2));
  G={k,retry:!!custom,items:pool.map((w,i)=>({w:w[0],right:w[1],wrong:w[2],src:w[3],truth:half.includes(i)})),
     i:0,score:0,streak:0,miss:[],answered:0,left:LIMIT,t0:Date.now(),locked:false,over:false};
  document.title=label(k)+" · בבא קמא";
  render();
  G.tick=setInterval(()=>{
    G.left=Math.max(0,LIMIT-Math.floor((Date.now()-G.t0)/1000));
    paintTimer();
    if(G.left<=0)finish(true);
  },250);
}
function paintTimer(){
  const t=$("#timer"),b=$("#tbar");if(!t)return;
  t.textContent=`0:${String(G.left).padStart(2,"0")}`;
  t.classList.toggle("hurry",G.left<=10);
  b.style.width=(G.left/LIMIT*100)+"%";
  b.classList.toggle("hurry",G.left<=10);
}
function render(){
  const it=G.items[G.i],n=G.items.length;
  const shown=it.truth?it.right:it.wrong;
  app.innerHTML=`
  <div class="bar"><button class="btn" id="back">→ חזרה</button><span class="where">${label(G.k)}${G.retry?" · תרגול טעויות":""}</span></div>
  <div class="timerow"><span class="clock" aria-hidden="true">⏱</span><div class="tprog"><i id="tbar"></i></div><span class="timer" id="timer" role="timer" aria-live="off"></span></div>
  <div class="prog"><i style="width:${G.i/n*100}%"></i></div>
  <div class="meta"><span>מילה ${G.i+1} מתוך ${n}</span><span>נכונות: ${G.score}${G.streak>=3?` · <span class="streak">🔥 ${G.streak} ברצף</span>`:""}</span></div>
  <div class="card pop">
    <div class="lbl">${isTest(G.k)?"מתוך "+label(it.src):"המילה בגמרא"}</div>
    <div class="word">${esc(it.w)}</div>
    <div class="eq"><span>פירושו:</span>${esc(shown)}</div>
    <div class="answers">
      <button class="ans t" id="yes">✔ נכון<kbd>→</kbd></button>
      <button class="ans f" id="no">✘ לא נכון<kbd>←</kbd></button>
    </div>
    <div id="fb"></div>
  </div>`;
  paintTimer();
  $("#back").onclick=()=>{location.hash=backHash(G.k)};
  $("#yes").onclick=()=>answer(true);
  $("#no").onclick=()=>answer(false);
}
function answer(said){
  if(G.locked||G.over)return;G.locked=true;
  const it=G.items[G.i],ok=said===it.truth;
  G.answered++;
  if(ok){G.score++;G.streak++}else{G.streak=0;G.miss.push(it)}
  beep(ok);
  $("#yes").disabled=$("#no").disabled=true;
  const praise=["מצוין!","יישר כח!","בדיוק!","אלוף!","נכון מאוד!"][Math.floor(Math.random()*5)];
  $("#fb").innerHTML=`<div class="fb ${ok?"good":"wrong"}">
    ${ok?`<b>${praise}</b> `:`<b>לא מדויק.</b> `}
    <strong>${esc(it.w)}</strong> = ${esc(it.right)}</div>
    <button class="btn primary next" id="nx">${G.i+1<G.items.length?"הבאה ←":"לציון ←"} <small>(Enter)</small></button>`;
  $("#nx").onclick=next;
  G.adv=setTimeout(next,ok?900:2000);   // ממשיך לבד כדי לא לבזבז זמן
}
function next(){
  if(G.over)return;clearTimeout(G.adv);
  G.locked=false;G.i++;
  G.i<G.items.length?render():finish(false);
}
function finish(timeUp){
  if(G.over)return;G.over=true;stopTimers();
  const n=G.items.length;
  const from=G.locked?G.i+1:G.i;               // מילים שלא נענו
  const skipped=G.items.slice(from);
  const grade=Math.round(100*G.score/n);
  const used=Math.min(LIMIT,Math.round((Date.now()-G.t0)/1000));
  const s=starsOf(G.score/n);
  if(!G.retry&&(best[G.k]==null||G.score/n>best[G.k])){best[G.k]=G.score/n;saveBest()}
  const idx=KEYS.indexOf(G.k),nk=idx>=0&&idx<KEYS.length-1?KEYS[idx+1]:null;
  const toPractice=[...G.miss,...skipped];
  const head=timeUp?"⏰ נגמר הזמן!":`סיימת ב־${used} שניות`;
  const msg=grade===100?"שלטת בכל מילות העמוד.":grade>=80?"עוד חזרה קצרה על הרשימה למטה ותגיע ל־100.":grade>=55?"עבור על המילים למטה ונסה שוב, בדרך כלל הציון קופץ כבר בסבב השני.":"כדאי ללמוד את המילים שלמטה ואז לשחק שוב.";
  app.innerHTML=`
  <div class="bar"><button class="btn" id="back">→ חזרה</button><span class="where">${label(G.k)}</span></div>
  <div class="card result pop">
    <div class="lbl">${head}</div>
    <div class="gradebox"><span class="big">${grade}</span><span class="gw">${gradeWord(grade)}</span></div>
    <div class="bigstars">${starHTML(s)}</div>
    <div class="stats">
      <span><b>${G.score}</b> נכונות</span><span><b>${G.miss.length}</b> שגויות</span><span><b>${skipped.length}</b> לא הספקת</span><span><b>${used}</b> שניות</span>
    </div>
    <p>${msg}</p>
    ${G.miss.length?`<div class="miss bad"><h3>❌ מילים שנכשלת בהן (${G.miss.length})</h3><ul>${G.miss.map(m=>`<li><b>${esc(m.w)}</b> = ${esc(m.right)}</li>`).join("")}</ul></div>`:""}
    ${skipped.length?`<div class="miss"><h3>⏳ מילים שלא הספקת (${skipped.length})</h3><ul>${skipped.map(m=>`<li><b>${esc(m.w)}</b> = ${esc(m.right)}</li>`).join("")}</ul></div>`:""}
    <div class="actions">
      <button class="btn primary" id="again">שחק שוב ⏱ דקה</button>
      ${toPractice.length?`<button class="btn gold" id="retry">תרגל את ${toPractice.length} המילים האלה</button>`:""}
      ${nk&&!G.retry?`<button class="btn" id="nextk">לעמוד הבא: ${short(nk)} ←</button>`:""}
    </div>
    <p class="note">הציון מחושב מכל ${n} המילים: ${G.score} נכונות מתוך ${n}. מילה שלא הספקת נחשבת כטעות.</p>
  </div>`;
  $("#back").onclick=()=>{location.hash=backHash(G.k)};
  $("#again").onclick=()=>start(G.k);
  if(nk&&!G.retry)$("#nextk").onclick=()=>{location.hash="d"+nk};
  const r=$("#retry");if(r)r.onclick=()=>start(G.k,shuffle(toPractice.map(x=>[x.w,x.right,x.wrong,x.src])));
}

document.addEventListener("keydown",e=>{
  if(!G||G.over)return;
  if(e.key==="Enter"&&G.locked&&$("#nx")){e.preventDefault();next();return}
  if(!$("#yes")||G.locked)return;
  if(e.key==="ArrowRight"){e.preventDefault();answer(true)}
  else if(e.key==="ArrowLeft"){e.preventDefault();answer(false)}
});

function route(){
  stopTimers();
  const h=location.hash.replace("#","");
  const c=CH.find(x=>x.id===h);
  if(c){G=null;chapter(c)}
  else if(h==="all"||testCh(h))start(h);
  else if(h.startsWith("d")&&D[h.slice(1)])start(h.slice(1));
  else{G=null;home()}
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
