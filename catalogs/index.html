.res .tx{min-width:0;flex:1}

h2{font-size:21px;margin:26px 0 12px;display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}

.card .name{font-weight:800;font-size:17px;text-decoration:none}
.card .cnt{color:var(--mute);font-size:13.5px}
.card .row{display:flex;gap:8px;margin-top:auto;padding-top:6px}
.btn{font:inherit;font-size:14px;border-radius:999px;padding:6px 14px;text-decoration:none;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--ink)}

function rowHtml(r) {
  const ic = FMT[r.f] || "🔗";
  const th = r.im ? `<img src="${esc(r.im)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.textContent='${ic}'">` : "";
  return `<a class="res" href="${esc(r.u)}" target="_blank" rel="noopener"><span class="th">${th || ic}</span>
    <span class="tx"><span class="t">${esc(r.t)}</span><span class="m"><span class="badge">${r.c.e} ${esc(r.c.n)}</span>${esc(r.s)}${r.s ? " · " : ""}${FNAME[r.f] || ""}</span></span></a>`;
}
function draw() {
  const res = $("results");
  res.innerHTML = lastHits.slice(0, shown).map(rowHtml).join("") + (lastHits.length > shown ? `<button class="more" id="more">עוד ${fmtCount(Math.min(60, lastHits.length - shown))} תוצאות</button>` : "");
  const m = $("more"); if (m) m.onclick = () => { shown += 60; draw(); };
}
let seq = 0;
async function run() {
  const q = norm($("q").value).trim(), k = $("scope").value;
  history.replaceState(null, "", q || k ? "#" + new URLSearchParams({q: $("q").value, c: k}) : location.pathname);
  const my = ++seq;
  if (q.length < 2) { $("status").textContent = k ? `חיפוש ב${byK[k].n} – הקלידו לפחות 2 אותיות` : ""; $("results").innerHTML = ""; return; }
  const cats = k ? [byK[k]] : searchable;
  let done = 0;
  $("status").textContent = `טוען ${cats.length > 1 ? "את הקטלוגים" : byK[k].n}…`;
  const all = await Promise.all(cats.map(c => load(c).catch(() => []).then(r => { done++; if (my === seq && cats.length > 1) $("status").textContent = `טוען קטלוגים… ${done} מתוך ${cats.length}`; return r; })));
  if (my !== seq) return;
  const words = q.split(" ").filter(Boolean);
  const hits = [];
  for (const rows of all) for (const r of rows) if (words.every(w => r.n.includes(w))) hits.push(r);
  // a title that starts with / holds the whole phrase first; then the catalog with the most hits (the one that is
  // about the subject – "רחל אמנו" is a whole tab in the special-days catalog), then the catalog's own order
  const per = {}; hits.forEach(h => per[h.c.n] = (per[h.c.n] || 0) + 1);
  const score = r => { const t = norm(r.t); return t.startsWith(q) ? 2 : t.includes(q) ? 1 : 0; };
  hits.forEach((h, i) => { h._s = score(h); h._i = i; });
  hits.sort((a, b) => b._s - a._s || per[b.c.n] - per[a.c.n] || a._i - b._i);
  lastHits = hits; shown = 60;
  const top = Object.entries(per).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([n, v]) => `${n} ${fmtCount(v)}`).join(" · ");
  $("status").textContent = hits.length ? `${fmtCount(hits.length)} תוצאות${k ? "" : " – " + top}` : "לא נמצאו חומרים. נסו מילה אחרת או קטלוג אחר.";
  draw();
}
let timer; $("q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(run, 280); });
$("scope").addEventListener("change", run);
const h = new URLSearchParams(location.hash.slice(1));
if (h.get("c") && byK[h.get("c")]) $("scope").value = h.get("c");
if (h.get("q")) { $("q").value = h.get("q"); run(); }
</script>
</body>
</html>
