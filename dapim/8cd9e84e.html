  // Timer effect

    } else if (timeLeft === 0 && !showResult) {
      // Time's up - show correct answer
      setShowResult(true);
      setAnswerFeedback('timeout');
      setShowCorrectAnswer(true);
      playSound('wrong');

          setCurrentQuestion(currentQuestion + 1);
          setSelectedAnswer(null);
          setShowResult(false);
          setShowCorrectAnswer(false);
          setAnswerFeedback('');
          setTimeLeft(45);
        } else {
          setQuizCompleted(true);
          playSound('complete');

      }, 3000);

    return () => clearTimeout(timer);

  // יצירת צלילים
  const playSound = type => {
    try {
      if (type === 'correct') {
        // צליל תשובה נכונה - מנגינה שמחה
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const notes = [523.25, 659.25, 783.99]; // C5, E5, G5

        notes.forEach((freq, index) => {
          const oscillator = audioContext.createOscillator();
          const gainNode = audioContext.createGain();
          oscillator.connect(gainNode);
          gainNode.connect(audioContext.destination);
          oscillator.frequency.setValueAtTime(freq, audioContext.currentTime + index * 0.1);
          gainNode.gain.setValueAtTime(0.3, audioContext.currentTime + index * 0.1);
          gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + index * 0.1 + 0.3);

          oscillator.stop(audioContext.currentTime + index * 0.1 + 0.3);

          gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + index * 0.2 + 0.4);
          oscillator.start(audioContext.currentTime + index * 0.2);
          oscillator.stop(audioContext.currentTime + index * 0.2 + 0.4);
        });
      }
    } catch (error) {
      console.log('Audio not supported');
    }
  };

    setSelectedAnswer(answerIndex);
    setShowResult(true);
    setTimerActive(false);
    const isCorrect = answerIndex === questions[currentQuestion].correct;
    if (isCorrect) {
      setScore(score + 1);
      setAnswerFeedback('correct');
      playSound('correct');
    } else {
      setAnswerFeedback('wrong');
      playSound('wrong');
      setShowCorrectAnswer(true);

        setTimerActive(true);

    setShowCorrectAnswer(false);
    setAnswerFeedback('');

    setTimerActive(true);

      message: "מדהים! אתה מאסטר מוחלט בשלום בית!",

      color: "text-yellow-600",
      level: "מאסטר שלום בית"
    };
