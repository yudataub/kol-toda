<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>בונים יחד - ויקהל</title>
<style>
:root{--ink:#2b2140;--bg1:#fff7e8;--bg2:#ffe9f0;--card:#ffffff;--main:#7b4fd6;--main2:#ff7a59;--gold:#f5b82e;--ok:#1e9b5a;--bad:#d9822b;--line:#e6dcf5}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Arial,"Segoe UI",Tahoma,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));min-height:100vh;line-height:1.55;font-size:18px}
.wrap{max-width:980px;margin:0 auto;padding:12px 14px 40px}
header.top{background:linear-gradient(120deg,#7b4fd6,#e0508f 55%,#ff9a3c);color:#fff;border-radius:22px;padding:18px 16px;text-align:center;box-shadow:0 6px 18px rgba(123,79,214,.28)}
header.top h1{margin:0;font-size:clamp(24px,5vw,38px)}
header.top p{margin:6px 0 0;font-size:clamp(15px,3vw,19px);opacity:.96}
.back{display:inline-flex;align-items:center;min-height:44px;margin:10px 2px;color:#5a34b5;font-weight:bold;text-decoration:none;padding:6px 10px;border-radius:12px}
.back:hover,.back:focus-visible{background:#fff;outline:3px solid #b79af0}
.screen{background:var(--card);border-radius:22px;padding:18px 16px;box-shadow:0 4px 14px rgba(60,30,110,.12);border:2px solid var(--line)}
.hidden{display:none!important}
.love{background:#fff3d6;border:2px dashed var(--gold);border-radius:16px;padding:12px 14px;font-size:1.05em;font-weight:bold;text-align:center}
.howto{margin:14px 0;padding-inline-start:22px}
.howto li{margin:4px 0}
.btn{font:inherit;font-weight:bold;min-height:48px;min-width:48px;padding:10px 22px;border:0;border-radius:16px;cursor:pointer;color:#fff;background:linear-gradient(120deg,var(--main),#c04fd0);box-shadow:0 4px 0 #53309e;transition:transform .12s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #53309e}
.btn.alt{background:linear-gradient(120deg,#ff8a4c,#f5b82e);color:#3a2300;box-shadow:0 4px 0 #b9741a}
.btn:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:4px solid #2a6df4;outline-offset:2px}
.center{text-align:center}
.hud{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
.pill{background:#f3ecff;border-radius:999px;padding:6px 14px;font-weight:bold;min-height:36px;display:inline-flex;align-items:center;gap:6px}
.prog{flex:1 1 160px;height:16px;background:#eadff9;border-radius:999px;overflow:hidden}
.prog>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#46c284,#f5b82e);transition:width .4s}
.fb{min-height:54px;margin:10px 0;padding:10px 14px;border-radius:14px;background:#f7f3fd;font-weight:bold;text-align:center;display:flex;align-items:center;justify-content:center}
.fb.good{background:#dff7ea;color:#0d5e35}
.fb.soft{background:#fff0dc;color:#7a4300}
.fb.info{background:#e8f0ff;color:#1a3f8a}
.opts{display:grid;grid-template-columns:1fr;gap:10px;margin:12px 0}
@media(min-width:640px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{font:inherit;text-align:center;min-height:52px;padding:10px 14px;border-radius:16px;border:3px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;font-weight:bold;transition:transform .12s,background .2s}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:#b79af0;background:#faf6ff}
.opt.right{background:#c9f2dc;border-color:var(--ok);color:#0d5e35}
.opt.wrong{background:#ffe6cc;border-color:var(--bad);color:#7a4300}
.opt:disabled{cursor:default}
.q{font-size:1.2em;font-weight:bold;margin:8px 0}
.fact{background:#eef7ff;border-right:5px solid #4a90e2;border-radius:10px;padding:8px 12px;margin:8px 0;font-size:.95em}
.fact b{color:#1a4f9a}
.endbox{text-align:center}
.stars{font-size:46px;letter-spacing:6px;margin:6px 0}
.bigscore{font-size:1.6em;font-weight:bold;color:var(--main)}
.bless{background:#fff3d6;border-radius:16px;padding:12px;margin:12px 0;font-weight:bold}
.talk{background:#e8f6ff;border-radius:16px;padding:12px;margin:12px 0;text-align:right}
.sign{margin-top:16px;color:#6a5a8a;font-weight:bold}
.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.teams{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.team{flex:1 1 120px;border-radius:14px;padding:8px 10px;color:#fff;font-weight:bold;text-align:center;border:4px solid transparent;opacity:.65;min-height:56px}
.team.on{opacity:1;border-color:#2b2140;transform:scale(1.04);box-shadow:0 4px 10px rgba(0,0,0,.25)}
.team small{display:block;font-weight:normal}
.t0{background:#2f6fd6}.t1{background:#d6403f}.t2{background:#1f8f55}.t3{background:#d9741a}
.boardsrow{display:flex;gap:5px;justify-content:center;margin:10px 0;direction:ltr}
.bd{width:min(9vw,44px);height:70px;border-radius:6px;border:3px dashed #cdbbee;background:#f6f1fd}
.bd.on{background:linear-gradient(180deg,#f2c94c,#d49a10);border:3px solid #a67c00;animation:pop .5s}
.pick{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.goal{text-align:center;font-weight:bold}
.helpnote{background:#e8f0ff;border-radius:12px;padding:8px 12px;margin:8px 0;font-weight:bold}

</style>

</head>
<body>
<div class="wrap">
<header class="top"><h1>🤝 בונים יחד את המשכן</h1><p>משחק קבוצתי לפרשת ויקהל - חידושי הרב יהודה טאוב</p></header>
<a class="back" href="index.html" aria-label="חזרה לכל הפרשות">← חזרה לכל הפרשות</a>

<main>
<section id="intro" class="screen" aria-label="פתיחה">
  <div class="love" id="loveLine"></div>
  <ul class="howto" id="howto"></ul>
  <div class="center">
    <button class="btn" id="startBtn" aria-label="התחלת המשחק">▶ מתחילים!</button>
    <p id="bestLine" class="sign"></p>
  </div>
</section>

<section id="game" class="screen hidden" aria-label="המשחק">
  <div class="hud">
    <span class="pill" aria-live="polite">⭐ ניקוד: <span id="scoreVal">0</span></span>
    <div class="prog" id="progBar" role="progressbar" aria-label="התקדמות" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="progFill"></i></div>
    <span id="extraHud"></span>
  </div>
  <div id="fb" class="fb" aria-live="polite"></div>
  <div id="stage"></div>
</section>

<section id="end" class="screen endbox hidden" aria-label="סיום">
  <h2>סיימנו! 🎉</h2>
  <div class="bigscore" id="endScore"></div>
  <div class="stars" id="endStars" role="img"></div>
  <div id="bestMsg" class="sign"></div>
  <div class="bless" id="endBless"></div>
  <div class="talk"><b>שיחה קצרה בבית או בכיתה:</b><br><span id="talkQ"></span></div>
  <button class="btn alt" id="againBtn" aria-label="לשחק שוב">🔁 לשחק שוב</button>
  <p class="sign">הקול החמישי - הרב יהודה טאוב</p>
  <p><a class="back" href="index.html" aria-label="חזרה לכל הפרשות">← חזרה לכל הפרשות</a></p>
</section>
</main>
</div>
<script src="kt-game.js"></script>
<script>
const CONFIG = {
  "slug": "vayakhel",
  "love": "ה' אוהב לשכון בין אנשים שאוהבים זה את זה ובונים יחד. כשכולנו ביחד, הוא קרוב אלינו במיוחד!",
  "howto": [
    "בוחרים 2 עד 4 קבוצות. כולן על אותו מסך.",
    "כל קבוצה בתורה עונה על שאלה. תשובה נכונה מוסיפה קרש למשכן המשותף.",
    "אם קבוצה טעתה, הקבוצה הבאה עוזרת ועונה על אותה שאלה. אנחנו עוזרים זה לזה!",
    "היעד המשותף: לבנות שמונה קרשים לפני שנגמרות השאלות. כולם מנצחים ביחד!"
  ],
  "talk": "איך אפשר להיות \"תואמים\" עם מי שאיננו מסכימים איתו לגמרי? מה עושים בבית כדי שכולם ירגישו שהם חלק מהבניין?"
};
// DATA: חידושים מעמוד ויקהל. o[0] היא התשובה הנכונה.
const DATA = [
  { q: 'משה הקהיל את כולם לפני בניית המשכן. מה הרעיון?', o: ['שיהיו כולם יחד, ולא רק ישמעו', 'שישמעו את הציווי, וכל אחד יחזור לאוהל שלו', 'שילמדו לבנות'], exp: 'השראת השכינה תלויה באחדות העם, והחידוש הוא שכל עדת בני ישראל יהיו יחד.' },
  { q: 'איפה עם ישראל חנו "כאיש אחד בלב אחד"?', o: ['בהר סיני', 'במצרים', 'בירושלים'], exp: 'מי שרוצה שה\' ישכון בינינו, מתחיל באחדות.' },
  { q: 'השבת מבטאת כבוד של מי, והמשכן כבוד של מי?', o: ['השבת - כבוד ה\', המשכן - כבוד ישראל', 'שניהם כבוד ה\'', 'השבת - כבוד ישראל, המשכן - כבוד הקב״ה'], exp: '"פארו עלי ופארי עליו": כל צד מכבד את השני, וה\' מקדים את כבודנו.' },
  { q: 'במשכן ובשבת, מה העיקר לפי החידוש?', o: ['המחשבה', 'הכוח', 'המהירות'], exp: 'גם מקום השכינה (המשכן) וגם זמן השכינה (השבת) תלויים במחשבה ובכוונה.' },
  { q: 'כמה מלאכות שבת נלמדות מעבודת המשכן?', o: ['שלושים ותשע', 'עשר', 'שבע'], exp: 'ל"ט המלאכות נלמדות מן המשכן.' },
  { q: 'כתוב "יביאה את תרומת ה\'". מה רומזת האות ה\'?', o: ['השכינה באה יחד עם התרומה', 'המספר חמש', 'שהתרומה צריכה להיות מחמישה סוגים שונים'], exp: 'ה\' מקבל מאיתנו את הלב ומחזיר לנו את עצמו.' },
  { q: 'מה הופך חומר ל"תרומת ה\'"?', o: ['נדיבות הלב', 'המחיר', 'הגודל'], exp: 'הרב אליהו דסקין מסביר: הלב הוא שהופך את החומר לתרומת ה\'.' },
  { q: 'מי שרצה לקיים מצווה ולא הצליח כי נאנס, נחשב...', o: ['כמי שקיים', 'כמי שלא ניסה', 'כמי שנכשל'], exp: 'ה\' רואה את הרצון הטוב שלנו ומקבל אותו באהבה גדולה.' },
  { q: 'מה חסר בשם של הנשיאים ("והנשאם") ולמה?', o: ['חסרה אות יו"ד, כי התעצלו בהתחלה', 'חסרה אות נ\', כי הם ברחו', 'שום דבר לא חסר'], exp: 'כשיש הזדמנות למצווה, לא מחכים לרגע המושלם. מי שאוהב, ממהר.' },
  { q: 'מה חשבו הנשיאים שיקרה, לפי רבינו בחיי?', o: ['שישראל יביאו הכול בלעדיהם', 'שהם יצטרכו לתת הרבה יותר מכל העם', 'שהמשכן יהיה קטן'], exp: 'הם סמכו על "אולי" וחיכו, ולכן לא נשאר להם חלק גדול במצווה.' },
  { q: 'הקרשים היו "תואמים" למטה. מה פירוש המילה?', o: ['שניים שהתחברו', 'שניים שרבו', 'שניים שברחו'], exp: 'די להיות "תואמים": לעמוד זה לצד זה ולכבד, ומשם צומחת השלמות.' },
  { q: 'מה קורה כשהאחדות נבנית למטה אצלנו?', o: ['נעשית אחדות שלמה למעלה', 'האחדות נשארת רק אצלנו, למטה בעולם הזה', 'הכול מתפרק'], exp: 'כשאנחנו מתחברים כאן למטה, אנחנו מאחדים את שם ה\' למעלה. כל שלום בית הוא מתנה לבורא.' }
];
const TEAMS = ['הכחולים', 'האדומים', 'הירוקים', 'הכתומים'];
const GOAL = 8;

const $ = (s, r) => (r || document).querySelector(s);
const PRAISE = [
  'נכון! ה\' אוהב אותך ושמח בך 💛',
  'יפה מאוד! אהבת ה\' מלווה אותך 🌟',
  'מצוין! ה\' מחייך אליך כשאתה לומד תורה 😊',
  'כל הכבוד! ה\' אוהב כל חידוש שלומדים בשמחה 📖',
  'נהדר! הלב שלך מלא אור, וה\' אוהב את זה ✨',
  'בדיוק! ה\' אוהב אותך כמו אבא אוהב את הילד שלו 🤗',
  'וואו! כל תשובה נכונה היא מתנה שאתה נותן לה\' 🎁',
  'תשובה מצוינת! ה\' תמיד קרוב אליך 💫'
];
const RETRY = [
  'כמעט! נסה שוב, ה\' איתך 💛',
  'לא נורא, גם טעות היא חלק מהלמידה. ה\' אוהב אותך באותה מידה 🌈',
  'עוד רגע תצליח! ה\' מאמין בך 💪',
  'קרוב מאוד! קח נשימה ונסה שוב, ה\' איתך 🌸'
];
let _lp = -1, _lr = -1;
function pickFrom(arr, which) {
  let i, last = which === 'p' ? _lp : _lr;
  do { i = Math.floor(Math.random() * arr.length); } while (i === last && arr.length > 1);
  if (which === 'p') _lp = i; else _lr = i;
  return arr[i];
}
function praise() { return pickFrom(PRAISE, 'p'); }
function retry() { return pickFrom(RETRY, 'r'); }
function shuffle(a) {
  const b = a.slice();
  for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = b[i]; b[i] = b[j]; b[j] = t; }
  return b;
}
const Store = {
  get(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { window.localStorage.setItem(k, v); } catch (e) { /* storage blocked */ } }
};
const BEST_KEY = 'kol-toda-game-' + CONFIG.slug;
function show(id) {
  ['intro', 'game', 'end'].forEach(function (x) { $('#' + x).classList.toggle('hidden', x !== id); });
  window.scrollTo(0, 0);
}
function setProgress(n, total) { $('#progFill').style.width = Math.round(100 * n / total) + '%'; $('#progBar').setAttribute('aria-valuenow', String(Math.round(100 * n / total))); }
function setScore(s) { $('#scoreVal').textContent = String(s); }
function say(msg, kind) { const f = $('#fb'); f.textContent = msg; f.className = 'fb ' + (kind || ''); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function finish(score, max, extraLine, opt) {
  const ratio = max > 0 ? score / max : 0;
  let n = ratio >= 0.75 ? 3 : ratio >= 0.4 ? 2 : 1;
  if (opt && opt.stars) n = opt.stars;
  $('#endScore').textContent = (opt && opt.text) ? opt.text : score + ' מתוך ' + max;
  $('#endStars').textContent = '⭐'.repeat(n) + '☆'.repeat(3 - n);
  $('#endStars').setAttribute('aria-label', n + ' כוכבים מתוך 3');
  const bl = [
    'איזו התחלה יפה! ה\' אוהב אותך מאוד, ובכל פעם שתשחק תגלה עוד אור. שבת שלום ולב מלא שמחה 💛',
    'כל הכבוד! ה\' שמח בך ואוהב את הלימוד שלך. שתמיד יהיה לך לב פתוח ומחייך 🌟',
    'מושלם! ה\' אוהב אותך אהבה גדולה, והלב שלך זורח. ברכה והצלחה בכל מה שתעשה ✨'
  ];
  $('#endBless').textContent = bl[n - 1] + (extraLine ? ' ' + extraLine : '');
  $('#talkQ').textContent = CONFIG.talk;
  let best = parseInt(Store.get(BEST_KEY) || '0', 10) || 0;
  if (score > best) { best = score; Store.set(BEST_KEY, String(score)); $('#bestMsg').textContent = 'שיא חדש! 🎉'; }
  else { $('#bestMsg').textContent = best > 0 ? 'השיא שלך: ' + best : ''; }
  show('end');
  window.KT&&KT.end();
}
function initShell() {
  $('#loveLine').textContent = CONFIG.love;
  const ul = $('#howto');
  CONFIG.howto.forEach(function (t) { const li = document.createElement('li'); li.textContent = t; ul.appendChild(li); });
  const b = parseInt(Store.get(BEST_KEY) || '0', 10) || 0;
  $('#bestLine').textContent = b > 0 ? 'השיא שלך: ' + b : '';
  $('#startBtn').addEventListener('click', function () { startGame(); });
  $('#againBtn').addEventListener('click', function () { show('intro'); const bb = parseInt(Store.get(BEST_KEY) || '0', 10) || 0; $('#bestLine').textContent = bb > 0 ? 'השיא שלך: ' + bb : ''; });
}


let order, qi, nTeams, cur, boards, contrib, helped, phase, startTeam;

function startGame() {
  setScore(0); setProgress(0, GOAL);
  $('#extraHud').textContent = '';
  say('כמה קבוצות משחקות היום?', 'info');
  $('#stage').innerHTML = '<div class="pick" role="group" aria-label="בחירת מספר קבוצות"></div>';
  [2, 3, 4].forEach(function (n) {
    const b = document.createElement('button');
    b.className = 'btn'; b.textContent = n + ' קבוצות'; b.setAttribute('aria-label', n + ' קבוצות');
    b.addEventListener('click', function () { begin(n); });
    $('#stage .pick').appendChild(b);
  });
  show('game');
}

function begin(n) {
  nTeams = n; order = shuffle(DATA); qi = 0; boards = 0; cur = 0; helped = 0;
  contrib = []; for (let i = 0; i < n; i++) contrib.push(0);
  $('#stage').innerHTML = '<div class="goal" id="goal"></div><div class="boardsrow" id="brow" aria-hidden="true"></div><div class="teams" id="teams"></div><div id="qbox"></div>';
  askQ();
}

function renderBoard() {
  let h = '';
  for (let i = 0; i < GOAL; i++) h += '<span class="bd' + (i < boards ? ' on' : '') + '"></span>';
  $('#brow').innerHTML = h;
  $('#goal').textContent = 'יעד משותף: ' + boards + ' מתוך ' + GOAL + ' קרשים. כולנו בונים ביחד!';
  $('#teams').innerHTML = '';
  for (let i = 0; i < nTeams; i++) {
    const d = document.createElement('div');
    d.className = 'team t' + i + (i === cur ? ' on' : '');
    d.innerHTML = '<span></span><small></small>';
    d.firstChild.textContent = TEAMS[i];
    d.lastChild.textContent = 'תרומה: ' + contrib[i];
    $('#teams').appendChild(d);
  }
  setScore(boards * 10); setProgress(boards, GOAL);
}

function askQ(second, prevWrong) {
  if (boards >= GOAL || qi >= order.length) { endNow(); return; }
  renderBoard();
  const it = order[qi];
  phase = second ? 2 : 1;
  const box = $('#qbox');
  box.innerHTML = '<div class="q"></div><div class="opts" id="opts"></div><div id="expBox"></div>';
  box.querySelector('.q').textContent = 'תור ' + TEAMS[cur] + ': ' + it.q;
  say(second ? 'עזרה הדדית! ' + TEAMS[cur] + ', עוזרים לחברים. ה\' אוהב אנשים שעוזרים 💛' : TEAMS[cur] + ', תורכם! בהצלחה 💛', 'info');
  shuffle(it.o).forEach(function (t) {
    const b = document.createElement('button');
    b.className = 'opt'; b.textContent = t; b.setAttribute('aria-label', 'תשובה: ' + t);
    if (second && t === prevWrong) { b.disabled = true; b.classList.add('wrong'); }
    b.addEventListener('click', function () { pickAns(b, t, it); });
    $('#opts').appendChild(b);
  });
}

function nextTeam() { cur = (cur + 1) % nTeams; qi++; }

function pickAns(btn, t, it) {
  const ok = t === it.o[0];
  if (!ok && phase === 1) {
    // עזרה הדדית: הקבוצה הבאה עונה על אותה שאלה
    const prevWrong = t; window.KT&&KT.bad();
    say('כמעט! לא נורא, הקבוצה הבאה תעזור לנו. ה\' אוהב אותנו גם כשטועים 💛', 'soft');
    btn.classList.add('wrong', 'shake');
    [].forEach.call(document.querySelectorAll('#opts .opt'), function (b) { b.disabled = true; });
    const ex = $('#expBox');
    const nb = document.createElement('button');
    nb.className = 'btn alt'; nb.textContent = 'הקבוצה הבאה עוזרת ←'; nb.setAttribute('aria-label', 'הקבוצה הבאה עוזרת');
    nb.addEventListener('click', function () { cur = (cur + 1) % nTeams; askQ(true, prevWrong); });
    ex.appendChild(nb); nb.focus();
    return;
  }
  [].forEach.call(document.querySelectorAll('#opts .opt'), function (b) {
    b.disabled = true;
    if (b.textContent === it.o[0]) b.classList.add('right');
  });
  const ex = $('#expBox');
  if (ok) {
    btn.classList.add('pop');
    boards++; contrib[cur]++; window.KT&&KT.ok();
    if (phase === 2) helped++;
    say(praise() + (phase === 2 ? ' תודה על העזרה, ' + TEAMS[cur] + '!' : ' קרש חדש במשכן!'), 'good');
  } else {
    window.KT&&KT.bad();
    say('גם יחד לא הצלחנו הפעם, וזה בסדר גמור. התשובה הנכונה מסומנת בירוק, ה\' אוהב אתכם 💛', 'soft');
  }
  renderBoard();
  ex.innerHTML = '<div class="fact"><b>ידעת?</b> <span></span></div>';
  ex.querySelector('span').textContent = it.exp;
  const nb = document.createElement('button');
  nb.className = 'btn';
  nb.textContent = boards >= GOAL ? 'לסיום ←' : 'לשאלה הבאה ←';
  nb.setAttribute('aria-label', 'המשך');
  nb.addEventListener('click', function () { nextTeam(); askQ(); });
  ex.appendChild(nb); nb.focus();
}

function endNow() {
  const won = boards >= GOAL;
  const line = won ? 'הגענו ליעד המשותף: ' + GOAL + ' קרשים! כל הקבוצות ניצחו ביחד. 🏆' : 'בנינו ' + boards + ' קרשים ביחד. בפעם הבאה נשלים את היעד!';
  const stars = won ? 3 : boards >= 5 ? 2 : 1;
  finish(boards * 10, GOAL * 10, line + (helped > 0 ? ' עזרנו זה לזה ' + helped + ' פעמים.' : ''), { stars: stars, text: boards + ' קרשים מתוך ' + GOAL });
}

initShell();

window.KT&&KT.init({id:"vayakhel",title:"בונים יחד – ויקהל",again:()=>{startGame();}});
</script>
