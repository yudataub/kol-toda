<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>תשבץ - ויקרא</title>
<style>
:root{--ink:#2b2140;--bg1:#fff7e8;--bg2:#ffe9f0;--card:#ffffff;--main:#7b4fd6;--main2:#ff7a59;--gold:#f5b82e;--ok:#1e9b5a;--bad:#d9822b;--line:#e6dcf5}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Arial,"Segoe UI",Tahoma,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));min-height:100vh;line-height:1.55;font-size:18px}
.wrap{max-width:980px;margin:0 auto;padding:12px 14px 40px}
header.top{background:linear-gradient(120deg,#7b4fd6,#e0508f 55%,#ff9a3c);color:#fff;border-radius:22px;padding:18px 16px;text-align:center;box-shadow:0 6px 18px rgba(123,79,214,.28)}
header.top h1{margin:0;font-size:clamp(24px,5vw,38px)}
header.top p{margin:6px 0 0;font-size:clamp(15px,3vw,19px);opacity:.96}
.back{display:inline-flex;align-items:center;min-height:44px;margin:10px 2px;color:#5a34b5;font-weight:bold;text-decoration:none;padding:6px 10px;border-radius:12px}
.back:hover,.back:focus-visible{background:#fff;outline:3px solid #b79af0}
.screen{background:var(--card);border-radius:22px;padding:18px 16px;box-shadow:0 4px 14px rgba(60,30,110,.12);border:2px solid var(--line)}
.hidden{display:none!important}
.love{background:#fff3d6;border:2px dashed var(--gold);border-radius:16px;padding:12px 14px;font-size:1.05em;font-weight:bold;text-align:center}
.howto{margin:14px 0;padding-inline-start:22px}
.howto li{margin:4px 0}
.btn{font:inherit;font-weight:bold;min-height:48px;min-width:48px;padding:10px 22px;border:0;border-radius:16px;cursor:pointer;color:#fff;background:linear-gradient(120deg,var(--main),#c04fd0);box-shadow:0 4px 0 #53309e;transition:transform .12s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #53309e}
.btn.alt{background:linear-gradient(120deg,#ff8a4c,#f5b82e);color:#3a2300;box-shadow:0 4px 0 #b9741a}
.btn:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:4px solid #2a6df4;outline-offset:2px}
.center{text-align:center}
.hud{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
.pill{background:#f3ecff;border-radius:999px;padding:6px 14px;font-weight:bold;min-height:36px;display:inline-flex;align-items:center;gap:6px}
.prog{flex:1 1 160px;height:16px;background:#eadff9;border-radius:999px;overflow:hidden}
.prog>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#46c284,#f5b82e);transition:width .4s}
.fb{min-height:54px;margin:10px 0;padding:10px 14px;border-radius:14px;background:#f7f3fd;font-weight:bold;text-align:center;display:flex;align-items:center;justify-content:center}
.fb.good{background:#dff7ea;color:#0d5e35}
.fb.soft{background:#fff0dc;color:#7a4300}
.fb.info{background:#e8f0ff;color:#1a3f8a}
.opts{display:grid;grid-template-columns:1fr;gap:10px;margin:12px 0}
@media(min-width:640px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{font:inherit;text-align:center;min-height:52px;padding:10px 14px;border-radius:16px;border:3px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;font-weight:bold;transition:transform .12s,background .2s}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:#b79af0;background:#faf6ff}
.opt.right{background:#c9f2dc;border-color:var(--ok);color:#0d5e35}
.opt.wrong{background:#ffe6cc;border-color:var(--bad);color:#7a4300}
.opt:disabled{cursor:default}
.q{font-size:1.2em;font-weight:bold;margin:8px 0}
.fact{background:#eef7ff;border-right:5px solid #4a90e2;border-radius:10px;padding:8px 12px;margin:8px 0;font-size:.95em}
.fact b{color:#1a4f9a}
.endbox{text-align:center}
.stars{font-size:46px;letter-spacing:6px;margin:6px 0}
.bigscore{font-size:1.6em;font-weight:bold;color:var(--main)}
.bless{background:#fff3d6;border-radius:16px;padding:12px;margin:12px 0;font-weight:bold}
.talk{background:#e8f6ff;border-radius:16px;padding:12px;margin:12px 0;text-align:right}
.sign{margin-top:16px;color:#6a5a8a;font-weight:bold}
.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}


.cw{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:900px){.cw{grid-template-columns:auto 1fr;align-items:start}}
.grid{display:grid;direction:rtl;gap:3px;justify-content:center;background:#e9defa;padding:8px;border-radius:14px;width:max-content;max-width:100%;margin:0 auto}
.cell{width:var(--cs);height:var(--cs);position:relative;border-radius:6px;background:transparent}
.cell.on{background:#fff;border:2px solid #9b7fe0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:calc(var(--cs)*.58);font-weight:bold;color:#2b2140;user-select:none}
.cell.word{background:#efe6ff}
.cell.sel{background:#ffe9a8;border-color:#e0a000}
.cell.bad{background:#ffe0c2;border-color:#d9822b}
.cell.done{background:#cbf3dc;border-color:#1e9b5a}
.cell.hint{color:#1a56c4}
.cell .num{position:absolute;top:0;right:2px;font-size:calc(var(--cs)*.28);color:#7b4fd6;font-weight:bold;line-height:1}
:root{--cs:min(7.4vw,44px)}
.clues{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:600px){.clues{grid-template-columns:1fr 1fr}}
.clues h3{margin:0 0 4px;font-size:1em;color:#53309e}
.clues ol{list-style:none;margin:0;padding:0}
.clues li button{font:inherit;font-size:15px;width:100%;min-height:44px;text-align:right;background:#faf7ff;border:2px solid transparent;border-radius:10px;padding:4px 10px;cursor:pointer;color:var(--ink);margin-bottom:4px}
.clues li button.act{border-color:#e0a000;background:#fff6d6}
.clues li button.ok{background:#dff7ea;text-decoration:line-through;color:#4b6b5a}
.keys{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:12px 0;direction:rtl}
.key{font:inherit;font-weight:bold;font-size:18px;min-width:44px;min-height:44px;border-radius:10px;border:2px solid var(--line);background:#fff;cursor:pointer}
.key:hover{background:#f3ecff}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}
</style>

<body>
<div class="wrap">
<header class="top"><h1>🧩 תשבץ ויקרא</h1><p>חידושים לפרשת ויקרא - הרב יהודה טאוב</p></header>
<a class="back" href="index.html" aria-label="חזרה לכל הפרשות">← חזרה לכל הפרשות</a>

<main>
<section id="intro" class="screen" aria-label="פתיחה">
  <div class="love" id="loveLine"></div>
  <ul class="howto" id="howto"></ul>
  <div class="center">
    <button class="btn" id="startBtn" aria-label="התחלת המשחק">▶ מתחילים!</button>
    <p id="bestLine" class="sign"></p>
  </div>
</section>

<section id="game" class="screen hidden" aria-label="המשחק">
  <div class="hud">
    <span class="pill" aria-live="polite">⭐ ניקוד: <span id="scoreVal">0</span></span>
    <div class="prog" id="progBar" role="progressbar" aria-label="התקדמות" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="progFill"></i></div>
    <span id="extraHud"></span>
  </div>
  <div id="fb" class="fb" aria-live="polite"></div>
  <div id="stage"></div>
</section>

<section id="end" class="screen endbox hidden" aria-label="סיום">
  <h2>סיימנו! 🎉</h2>
  <div class="bigscore" id="endScore"></div>
  <div class="stars" id="endStars" role="img"></div>
  <div id="bestMsg" class="sign"></div>
  <div class="bless" id="endBless"></div>
  <div class="talk"><b>שיחה קצרה בבית או בכיתה:</b><br><span id="talkQ"></span></div>
  <button class="btn alt" id="againBtn" aria-label="לשחק שוב">🔁 לשחק שוב</button>
  <p class="sign">הקול החמישי - הרב יהודה טאוב</p>
  <p><a class="back" href="index.html" aria-label="חזרה לכל הפרשות">← חזרה לכל הפרשות</a></p>
</section>
</main>
</div>

};
// DATA: מילים, מיקום (r=שורה, c=עמודה מימין) וכיוון (A=אופקי מימין לשמאל, D=אנכי). הגדרות מחידושי עמוד ויקרא.
const WORDS = [
 {

  "fact": "\"ויקרא\" היא קריאה של חיבה. כשניגשים למצווה באהבה, היא נהיית פגישה עם ה'."
 },

 },

  "fact": "הקרבן מלמד שה' רוצה את הלב, את הרצון ואת הגעגוע שמאחורי המעשה."
 },
 {
  "w": "לב",
  "r": 7,
  "c": 6,
  "d": "A",
  "clue": "ה' רוצה אותו, לא רק את המעשה.",
  "fact": "ה' מחפש את הלב, את הרצון ואת הגעגוע מאחורי המעשה."
 },
 {
  "w": "נחת",
  "r": 2,
  "c": 3,
  "d": "A",
  "clue": "\"ריח ניחוח\" הוא ___ רוח, כמו אבא שמח שהילד עשה מה שביקש.",
  "fact": "כשאנחנו מקיימים מצווה, ה' שמח כמו אבא שהילד עשה מה שביקש."
 },

 },

 },
 {

 },
 {
  "w": "גאווה",
  "r": 4,

 },
 {

 },

];
const $ = (s, r) => (r || document).querySelector(s);
const PRAISE = [
  'נכון! ה\' אוהב אותך ושמח בך 💛',
  'יפה מאוד! אהבת ה\' מלווה אותך 🌟',
  'מצוין! ה\' מחייך אליך כשאתה לומד תורה 😊',
  'כל הכבוד! ה\' אוהב כל חידוש שלומדים בשמחה 📖',
  'נהדר! הלב שלך מלא אור, וה\' אוהב את זה ✨',
  'בדיוק! ה\' אוהב אותך כמו אבא אוהב את הילד שלו 🤗',
  'וואו! כל תשובה נכונה היא מתנה שאתה נותן לה\' 🎁',
  'תשובה מצוינת! ה\' תמיד קרוב אליך 💫'
];
const RETRY = [
  'כמעט! נסה שוב, ה\' איתך 💛',
  'לא נורא, גם טעות היא חלק מהלמידה. ה\' אוהב אותך באותה מידה 🌈',
  'עוד רגע תצליח! ה\' מאמין בך 💪',
  'קרוב מאוד! קח נשימה ונסה שוב, ה\' איתך 🌸'
];
let _lp = -1, _lr = -1;
function pickFrom(arr, which) {
  let i, last = which === 'p' ? _lp : _lr;
  do { i = Math.floor(Math.random() * arr.length); } while (i === last && arr.length > 1);
  if (which === 'p') _lp = i; else _lr = i;
  return arr[i];
}
function praise() { return pickFrom(PRAISE, 'p'); }
function retry() { return pickFrom(RETRY, 'r'); }
function shuffle(a) {
  const b = a.slice();
  for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = b[i]; b[i] = b[j]; b[j] = t; }
  return b;
}
const Store = {
  get(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { window.localStorage.setItem(k, v); } catch (e) { /* storage blocked */ } }
};
const BEST_KEY = 'kol-toda-game-' + CONFIG.slug;
function show(id) {
  ['intro', 'game', 'end'].forEach(function (x) { $('#' + x).classList.toggle('hidden', x !== id); });
  window.scrollTo(0, 0);
}
function setProgress(n, total) { $('#progFill').style.width = Math.round(100 * n / total) + '%'; $('#progBar').setAttribute('aria-valuenow', String(Math.round(100 * n / total))); }
function setScore(s) { $('#scoreVal').textContent = String(s); }
function say(msg, kind) { const f = $('#fb'); f.textContent = msg; f.className = 'fb ' + (kind || ''); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function finish(score, max, extraLine, opt) {
  const ratio = max > 0 ? score / max : 0;
  let n = ratio >= 0.75 ? 3 : ratio >= 0.4 ? 2 : 1;
  if (opt && opt.stars) n = opt.stars;
  $('#endScore').textContent = (opt && opt.text) ? opt.text : score + ' מתוך ' + max;
  $('#endStars').textContent = '⭐'.repeat(n) + '☆'.repeat(3 - n);
  $('#endStars').setAttribute('aria-label', n + ' כוכבים מתוך 3');
  const bl = [
    'איזו התחלה יפה! ה\' אוהב אותך מאוד, ובכל פעם שתשחק תגלה עוד אור. שבת שלום ולב מלא שמחה 💛',
    'כל הכבוד! ה\' שמח בך ואוהב את הלימוד שלך. שתמיד יהיה לך לב פתוח ומחייך 🌟',
    'מושלם! ה\' אוהב אותך אהבה גדולה, והלב שלך זורח. ברכה והצלחה בכל מה שתעשה ✨'
  ];
  $('#endBless').textContent = bl[n - 1] + (extraLine ? ' ' + extraLine : '');
  $('#talkQ').textContent = CONFIG.talk;
  let best = parseInt(Store.get(BEST_KEY) || '0', 10) || 0;
  if (score > best) { best = score; Store.set(BEST_KEY, String(score)); $('#bestMsg').textContent = 'שיא חדש! 🎉'; }
  else { $('#bestMsg').textContent = best > 0 ? 'השיא שלך: ' + best : ''; }
  show('end');
}
function initShell() {
  $('#loveLine').textContent = CONFIG.love;
  const ul = $('#howto');
  CONFIG.howto.forEach(function (t) { const li = document.createElement('li'); li.textContent = t; ul.appendChild(li); });
  const b = parseInt(Store.get(BEST_KEY) || '0', 10) || 0;
  $('#bestLine').textContent = b > 0 ? 'השיא שלך: ' + b : '';
  $('#startBtn').addEventListener('click', function () { startGame(); });
  $('#againBtn').addEventListener('click', function () { show('intro'); const bb = parseInt(Store.get(BEST_KEY) || '0', 10) || 0; $('#bestLine').textContent = bb > 0 ? 'השיא שלך: ' + bb : ''; });
}


const FIN = { 'ך': 'כ', 'ם': 'מ', 'ן': 'נ', 'ף': 'פ', 'ץ': 'צ' };
const FINALS = 'ךםןףץ';
function norm(s) { return s.replace(/[ךםןףץ]/g, function (c) { return FIN[c]; }); }

let cells, wordCells, numOf, curDir, selKey, solved, hints, gridW, gridH;

function key(r, c) { return r + ',' + c; }
function cellsOf(w) {
  const out = [];
  for (let i = 0; i < w.w.length; i++) out.push(w.d === 'A' ? key(w.r, w.c + i) : key(w.r + i, w.c));
  return out;
}

function buildModel() {
  cells = {}; wordCells = []; numOf = {};
  gridW = 0; gridH = 0;
  WORDS.forEach(function (w, wi) {
    const ks = cellsOf(w); wordCells.push(ks);
    ks.forEach(function (k, i) {
      const p = k.split(',').map(Number);
      gridH = Math.max(gridH, p[0] + 1); gridW = Math.max(gridW, p[1] + 1);
      if (!cells[k]) cells[k] = { k: k, r: p[0], c: p[1], ans: norm(w.w[i]), val: '', locked: false, words: [], finalOK: true, hint: false };
      cells[k].words.push(wi);
      if (FINALS.indexOf(w.w[i]) < 0 && 'כמנפצ'.indexOf(cells[k].ans) >= 0) cells[k].finalOK = false;
    });
  });
  // מספור לפי סדר קריאה
  const starts = WORDS.map(function (w, wi) { return { wi: wi, r: w.r, c: w.c }; }).sort(function (a, b) { return a.r - b.r || a.c - b.c; });
  let n = 0;
  starts.forEach(function (s) {
    const k = key(s.r, s.c);
    if (!numOf[k]) numOf[k] = ++n;
    WORDS[s.wi].num = numOf[k];
  });
}

function disp(cell) {
  if (!cell.val) return '';
  if (cell.finalOK) {
    for (let i = 0; i < cell.words.length; i++) {
      const w = WORDS[cell.words[i]];
      const idx = wordCells[cell.words[i]].indexOf(cell.k);
      const orig = w.w[idx];
      if (FINALS.indexOf(orig) >= 0 && norm(orig) === cell.val) return orig;
    }
  }
  return cell.val;
}

function startGame() {
  buildModel();
  WORDS.forEach(function (w) { w.done = false; });
  Object.keys(cells).forEach(function (k) { const c = cells[k]; c.val = ''; c.locked = false; c.hint = false; });
  solved = 0; hints = 0; curDir = 'A'; selKey = null;
  setScore(0); setProgress(0, WORDS.length);
  $('#extraHud').textContent = '';
  const st = $('#stage');
  st.innerHTML = '<div class="cw"><div><div class="grid" id="grid" role="grid" aria-label="לוח התשבץ"></div>' +
    '<div class="tools"><button class="btn alt" id="hintBtn" aria-label="גלה אות אחת">💡 רמז</button><button class="btn" id="chkBtn" aria-label="בדיקת האותיות">✔ בדיקה</button></div>' +
    '<div class="keys" id="keys" role="group" aria-label="מקלדת אותיות"></div></div>' +
    '<div><div id="fact"></div><div class="clues"><div><h3>אופקי (מימין לשמאל)</h3><ol id="clA"></ol></div><div><h3>אנכי (מלמעלה למטה)</h3><ol id="clD"></ol></div></div></div></div>';
  const g = $('#grid');
  g.style.gridTemplateColumns = 'repeat(' + gridW + ', var(--cs))';
  for (let r = 0; r < gridH; r++) for (let c = 0; c < gridW; c++) {
    const k = key(r, c), d = document.createElement('div');
    d.id = 'c_' + r + '_' + c;
    if (cells[k]) {
      d.className = 'cell on'; d.tabIndex = 0; d.setAttribute('role', 'gridcell');
      d.setAttribute('aria-label', 'משבצת ' + (numOf[k] ? 'מספר ' + numOf[k] : (r + 1) + ',' + (c + 1)));
      if (numOf[k]) { const n = document.createElement('span'); n.className = 'num'; n.textContent = numOf[k]; d.appendChild(n); }
      const t = document.createElement('span'); t.className = 'ch'; d.appendChild(t);
      d.addEventListener('mousedown', function () { d._was = (selKey === k); });
      d.addEventListener('click', function () { selectCell(k, !!d._was); d._was = false; });
      d.addEventListener('focus', function () { if (selKey !== k) selectCell(k, false); });
    } else d.className = 'cell';
    g.appendChild(d);
  }
  'אבגדהוזחטיכלמנסעפצקרשת'.split('').forEach(function (ch) {
    const b = document.createElement('button');
    b.className = 'key'; b.textContent = ch; b.setAttribute('aria-label', 'האות ' + ch);
    b.addEventListener('click', function () { typeLetter(ch); });
    $('#keys').appendChild(b);
  });
  const bs = document.createElement('button');
  bs.className = 'key'; bs.textContent = '⌫'; bs.setAttribute('aria-label', 'מחיקה');
  bs.addEventListener('click', backspace); $('#keys').appendChild(bs);
  ['A', 'D'].forEach(function (d) {
    WORDS.map(function (w, wi) { return { w: w, wi: wi }; }).filter(function (x) { return x.w.d === d; })
      .sort(function (a, b) { return a.w.num - b.w.num; }).forEach(function (x) {
        const li = document.createElement('li'), b = document.createElement('button');
        b.id = 'cl_' + x.wi; b.textContent = x.w.num + '. ' + x.w.clue + ' (' + x.w.w.length + ' אותיות)';
        b.setAttribute('aria-label', 'הגדרה ' + x.w.num + ': ' + x.w.clue);
        b.addEventListener('click', function () { curDir = d; selectCell(wordCells[x.wi][0], false, true); });
        li.appendChild(b); $(d === 'A' ? '#clA' : '#clD').appendChild(li);
      });
  });
  $('#hintBtn').addEventListener('click', giveHint);
  $('#chkBtn').addEventListener('click', checkAll);
  show('game');
  say('לוחצים על משבצת ומתחילים. ה\' אוהב את מי שמנסה 💛', 'info');
  const first = WORDS[0];
  curDir = first.d; selectCell(wordCells[0][0], false, true);
}

function activeWordIdx() {
  const c = cells[selKey]; if (!c) return -1;
  let found = -1;
  c.words.forEach(function (wi) { if (WORDS[wi].d === curDir) found = wi; });
  if (found < 0) found = c.words[0];
  return found;
}

function selectCell(k, toggle, noFocus) {
  const c = cells[k]; if (!c) return;
  if (toggle && selKey === k && c.words.length > 1) curDir = curDir === 'A' ? 'D' : 'A';
  else if (!c.words.some(function (wi) { return WORDS[wi].d === curDir; })) curDir = WORDS[c.words[0]].d;
  selKey = k;
  paint();
  if (!noFocus) { /* פוקוס נשאר במשבצת שנלחצה */ }
  else { const el = document.getElementById('c_' + c.r + '_' + c.c); if (el) el.focus({ preventScroll: true }); }
}

function paint() {
  const aw = activeWordIdx();
  Object.keys(cells).forEach(function (k) {
    const c = cells[k], el = document.getElementById('c_' + c.r + '_' + c.c);
    el.className = 'cell on' + (aw >= 0 && wordCells[aw].indexOf(k) >= 0 ? ' word' : '') + (k === selKey ? ' sel' : '') +
      (c.locked ? ' done' : '') + (c.bad ? ' bad' : '') + (c.hint ? ' hint' : '');
    el.querySelector('.ch').textContent = disp(c);
  });
  WORDS.forEach(function (w, wi) {
    const b = document.getElementById('cl_' + wi);
    b.className = (wi === aw ? 'act ' : '') + (w.done ? 'ok' : '');
  });
}

function moveInWord(step) {
  const aw = activeWordIdx(); if (aw < 0) return;
  const ks = wordCells[aw], i = ks.indexOf(selKey), j = i + step;
  if (j >= 0 && j < ks.length) { selKey = ks[j]; }
}

function typeLetter(ch) {
  if ($('#game').classList.contains('hidden') || !selKey) return;
  const c = cells[selKey];
  if (!c.locked) { c.val = norm(ch); c.bad = false; c.hint = false; }
  const wis = c.words.slice();
  moveInWord(1);
  paint();
  wis.forEach(checkWord);
}

function backspace() {
  if (!selKey) return;
  let c = cells[selKey];
  if (!c.val || c.locked) { moveInWord(-1); c = cells[selKey]; }
  if (!c.locked) { c.val = ''; c.bad = false; c.hint = false; }
  paint();
}

function checkWord(wi) {
  const w = WORDS[wi]; if (w.done) return;
  const ks = wordCells[wi];
  if (!ks.every(function (k) { return cells[k].val; })) return;
  if (ks.every(function (k) { return cells[k].val === cells[k].ans; })) {
    w.done = true; solved++;
    ks.forEach(function (k) { cells[k].locked = true; cells[k].bad = false; });
    updateScore();
    say(praise(), 'good');
    const f = $('#fact');
    f.innerHTML = '<div class="fact"><b>ידעת?</b> <span></span></div>';
    f.querySelector('span').textContent = w.w + ': ' + w.fact;
    if (solved >= WORDS.length) {
      const nb = document.createElement('button');
      nb.className = 'btn'; nb.textContent = 'לסיום ←'; nb.setAttribute('aria-label', 'לסיום');
      nb.addEventListener('click', endNow);
      f.appendChild(nb); nb.focus();
    }
    paint();
  } else {
    say(retry() + ' בדקו את האותיות במילה.', 'soft');
  }
}

function updateScore() {
  setScore(Math.max(0, solved * 10 - hints * 2));
  setProgress(solved, WORDS.length);
}

function giveHint() {
  const aw = activeWordIdx();
  if (aw < 0 || WORDS[aw].done) { say('בחרו מילה שעוד לא פתרתם ונסו שוב 🙂', 'info'); return; }
  const ks = wordCells[aw];
  for (let i = 0; i < ks.length; i++) {
    const c = cells[ks[i]];
    if (c.val !== c.ans) {
      c.val = c.ans; c.hint = true; c.bad = false; hints++;
      selKey = ks[i];
      updateScore(); paint();
      say('הנה אות לעזרה! כל רמז הוא עזרה מה\' דרך חבר טוב 💡', 'info');
      c.words.forEach(checkWord);
      return;
    }
  }
}

function checkAll() {
  let wrong = 0, any = 0;
  Object.keys(cells).forEach(function (k) {
    const c = cells[k];
    if (c.val && !c.locked) { any++; c.bad = c.val !== c.ans; if (c.bad) wrong++; }
  });
  paint();
  if (wrong > 0) say('כמעט! ' + (wrong === 1 ? 'יש אות אחת' : 'יש ' + wrong + ' אותיות') + ' שצריך לתקן (בכתום). ה\' איתך 💛', 'soft');
  else say(any ? 'הכול נכון עד עכשיו! ממשיכים בשמחה 🌟' : 'עוד לא כתבתם אותיות. לוחצים על משבצת ומתחילים 🙂', 'good');
}

function endNow() {
  const sc = Math.max(0, solved * 10 - hints * 2);
  finish(sc, WORDS.length * 10, hints === 0 ? 'פתרתם בלי רמזים! ' : 'השתמשתם ב-' + hints + ' רמזים, וזה בסדר גמור.');
}

document.addEventListener('keydown', function (e) {
  if ($('#game').classList.contains('hidden') || !selKey) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^[א-ת]$/.test(e.key)) { e.preventDefault(); typeLetter(e.key); return; }
  if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); backspace(); return; }
  const dirs = { ArrowRight: [0, 1], ArrowLeft: [0, -1], ArrowDown: [1, 0], ArrowUp: [-1, 0] };
  if (dirs[e.key]) {
    e.preventDefault();
    const c = cells[selKey], d = dirs[e.key];
    // בתצוגה מימין לשמאל: עמודה 0 היא הימנית ביותר, חץ ימינה מקטין את העמודה
    const nk = key(c.r + d[0], c.c - d[1]);
    if (cells[nk]) { if (d[0] !== 0) curDir = 'D'; else curDir = 'A'; selectCell(nk, false, true); }
  }
});

initShell();

</script>
