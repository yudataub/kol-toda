<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>משחקי פרשת השבוע</title>
<style>
  :root{--a:#7c3aed;--b:#ec4899;--c:#f59e0b;--bg:#fffaf0;--ink:#2d2a4a}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
  header{background:linear-gradient(135deg,var(--a),var(--b) 60%,var(--c));color:#fff;text-align:center;padding:36px 16px 44px}
  header h1{margin:0 0 8px;font-size:clamp(1.8rem,5vw,2.8rem)}
  header p{margin:0 auto;max-width:640px;font-size:1.1rem}
  main{max-width:1000px;margin:-24px auto 0;padding:0 16px 40px}
  .book{background:#fff;border-radius:20px;box-shadow:0 6px 20px rgba(60,40,120,.12);padding:18px 18px 22px;margin:0 0 22px}
  .book h2{margin:0 0 12px;color:var(--a);font-size:1.5rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
  a.card{display:block;padding:12px 14px;border-radius:14px;text-decoration:none;color:var(--ink);background:#f6f1ff;border:2px solid #e3d8ff;transition:transform .15s,box-shadow .15s}
  a.card:hover,a.card:focus-visible{transform:translateY(-3px);box-shadow:0 6px 14px rgba(124,58,237,.25);outline:3px solid var(--c)}
  a.card b{display:block;font-size:1.1rem}
  a.card span{font-size:.88rem;color:#5b4b8a}
  footer{text-align:center;padding:20px 16px 36px;color:#5b4b8a}
  @media (prefers-reduced-motion:reduce){a.card{transition:none}}
</style>
<meta property="og:title" content="משחקי פרשת השבוע">
<meta property="og:description" content="משחקי פרשת השבוע">
<meta property="og:image" content="https://yudataub.github.io/kol-toda-og/og/sr-parasha-games-index.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://www.kol-toda.co.il/parasha-games/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="הקול החמישי – יהודה טאוב">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://www.kol-toda.co.il/parasha-games/">
<script async src="https://www.kol-toda.co.il/a.js"></script>
</head>
<body>
<header>
  <h1>משחקי פרשת השבוע</h1>
  <p>משחק אחר לכל פרשה, מתוך החידושים של הרב יהודה טאוב. משחקים בשמחה ולומדים לאהוב את ה' עוד יותר.</p>
  <p style="margin-top:12px"><a href="guide.html" style="color:#fff;font-weight:700;background:rgba(255,255,255,.2);padding:8px 16px;border-radius:12px;text-decoration:none;display:inline-block">מדריך המשחקים והפרומפטים</a></p>
</header>
<main id="root" aria-live="polite"></main>
<footer><div style="max-width:640px;margin:0 auto 14px;background:#f6f1ff;border:2px solid #e3d8ff;border-radius:14px;padding:12px 16px;line-height:1.7">📚 עוד חומרי לימוד על פרשת השבוע – חינם, במאגר הקול החמישי: <a href="https://www.kol-toda.co.il/t/parasha.html" style="color:#7c3aed;font-weight:700">פרשת השבוע</a><br>המאגר המלא: <a href="https://www.kol-toda.co.il/" style="color:#7c3aed;font-weight:700">www.kol-toda.co.il</a></div>
הקול החמישי - הרב יהודה טאוב</footer>
<script>
const BOOKS = [
  {name:"ספר בראשית", items:[
    ["bereshit","בראשית","סידור בגרירה"],["noach","נח","זוגות זיכרון"],["lech-lecha","לך לך","מסע על מפה"],
    ["vayera","וירא","מה היית עושה?"],["chayei-sara","חיי שרה","תפזורת"],["toldot","תולדות","מי אני?"],
    ["vayetze","ויצא","מבוך"],["vayishlach","וישלח","השלמת משפט"],["vayeshev","וישב","סיפור אינטראקטיבי"],
    ["miketz","מקץ","גלגל מזל"],["vayigash","ויגש","חיבור קווים"],["vayechi","ויחי","נכון או לא נכון"]]},
  {name:"ספר שמות", items:[
    ["shemot","שמות","מרוץ"],["vaera","וארא","תפוס את הנכון"],["bo","בא","בריחה מחדר"],
    ["beshalach","בשלח","דייג מילים"],["yitro","יתרו","פאזל תמונה"],["mishpatim","משפטים","מיון לקטגוריות"],
    ["teruma","תרומה","בונים את המשכן"],["tetzave","תצוה","הישרדות"],["ki-tisa","כי תשא","מיליונר תורני"],
    ["vayakhel","ויקהל","משחק קבוצתי"],["pekudei","פקודי","זיכרון רצף"]]},
  {name:"ספר ויקרא", items:[
    ["vayikra","ויקרא","תשבץ"],["tzav","צו","בונים מזבח באותיות"],["shemini","שמיני","חידון מהירות"],
    ["tazria","תזריע","חשיפת תמונה"],["metzora","מצורע","דו-קרב זוגי"],["acharei-mot","אחרי מות","משפט מבולבל"],
    ["kedoshim","קדושים","כרטיסיות לימוד"],["emor","אמור","ציר זמן"],["behar","בהר","משחק משק"],
    ["bechukotai","בחוקותי","משחק ריצה"]]},
  {name:"ספר במדבר", items:[
    ["naso","נשא","שיבוץ אותיות"],["behaalotcha","בהעלותך","הדלקת המנורה"],["shelach","שלח","חפש בתמונה"],
    ["korach","קרח","מצא את הטעות"],["chukat","חוקת","ראשי תיבות"],["balak","בלק","הפוך לברכה"],
    ["pinchas","פינחס","מפת חלוקה"],["matot","מטות","בונה משפט"],["masei","מסעי","משחק לוח"]]},
  {name:"ספר דברים", items:[
    ["devarim","דברים","השלם תרשים"],["vaetchanan","ואתחנן","מי אמר למי?"],["ekev","עקב","קטיף וספירה"],
    ["ree","ראה","אתגר שבועי"],["shoftim","שופטים","בית דין"],["ki-tetze","כי תצא","אלבום כרטיסים"],
    ["ki-tavo","כי תבוא","בינגו"],["nitzavim","נצבים","חיבור נקודות"],["vayelech","וילך","הקלדה והשלמה"],
    ["haazinu","האזינו","זוגות הפוכים"],["vezot-habracha","וזאת הברכה","חידות מילוליות"]]}
];
const root = document.getElementById("root");
BOOKS.forEach(function(b){
  const sec = document.createElement("section");
  sec.className = "book";
  const h = document.createElement("h2"); h.textContent = b.name; sec.appendChild(h);
  const g = document.createElement("div"); g.className = "grid";
  b.items.forEach(function(it){
    const a = document.createElement("a");
    a.className = "card"; a.href = it[0] + ".html";
    a.setAttribute("aria-label", "פרשת " + it[1] + ", " + it[2]);
    a.innerHTML = "<b></b><span></span>";
    a.querySelector("b").textContent = it[1];
    a.querySelector("span").textContent = it[2];
    g.appendChild(a);
  });
  sec.appendChild(g); root.appendChild(sec);
});
</script>
</body>
</html>
