<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מי רוצה להיות מיליונר תורני - כי תשא</title>
<style>
:root{--ink:#2b2140;--bg1:#fff7e8;--bg2:#ffe9f0;--card:#ffffff;--main:#7b4fd6;--main2:#ff7a59;--gold:#f5b82e;--ok:#1e9b5a;--bad:#d9822b;--line:#e6dcf5}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Arial,"Segoe UI",Tahoma,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));min-height:100vh;line-height:1.55;font-size:18px}
.wrap{max-width:980px;margin:0 auto;padding:12px 14px 40px}
header.top{background:linear-gradient(120deg,#7b4fd6,#e0508f 55%,#ff9a3c);color:#fff;border-radius:22px;padding:18px 16px;text-align:center;box-shadow:0 6px 18px rgba(123,79,214,.28)}
header.top h1{margin:0;font-size:clamp(24px,5vw,38px)}
header.top p{margin:6px 0 0;font-size:clamp(15px,3vw,19px);opacity:.96}
.back{display:inline-flex;align-items:center;min-height:44px;margin:10px 2px;color:#5a34b5;font-weight:bold;text-decoration:none;padding:6px 10px;border-radius:12px}
.back:hover,.back:focus-visible{background:#fff;outline:3px solid #b79af0}
.screen{background:var(--card);border-radius:22px;padding:18px 16px;box-shadow:0 4px 14px rgba(60,30,110,.12);border:2px solid var(--line)}
.hidden{display:none!important}
.love{background:#fff3d6;border:2px dashed var(--gold);border-radius:16px;padding:12px 14px;font-size:1.05em;font-weight:bold;text-align:center}
.howto{margin:14px 0;padding-inline-start:22px}
.howto li{margin:4px 0}
.btn{font:inherit;font-weight:bold;min-height:48px;min-width:48px;padding:10px 22px;border:0;border-radius:16px;cursor:pointer;color:#fff;background:linear-gradient(120deg,var(--main),#c04fd0);box-shadow:0 4px 0 #53309e;transition:transform .12s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #53309e}
.btn.alt{background:linear-gradient(120deg,#ff8a4c,#f5b82e);color:#3a2300;box-shadow:0 4px 0 #b9741a}
.btn:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:4px solid #2a6df4;outline-offset:2px}
.center{text-align:center}
.hud{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
.pill{background:#f3ecff;border-radius:999px;padding:6px 14px;font-weight:bold;min-height:36px;display:inline-flex;align-items:center;gap:6px}
.prog{flex:1 1 160px;height:16px;background:#eadff9;border-radius:999px;overflow:hidden}
.prog>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#46c284,#f5b82e);transition:width .4s}
.fb{min-height:54px;margin:10px 0;padding:10px 14px;border-radius:14px;background:#f7f3fd;font-weight:bold;text-align:center;display:flex;align-items:center;justify-content:center}
.fb.good{background:#dff7ea;color:#0d5e35}
.fb.soft{background:#fff0dc;color:#7a4300}
.fb.info{background:#e8f0ff;color:#1a3f8a}
.opts{display:grid;grid-template-columns:1fr;gap:10px;margin:12px 0}
@media(min-width:640px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{font:inherit;text-align:center;min-height:52px;padding:10px 14px;border-radius:16px;border:3px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;font-weight:bold;transition:transform .12s,background .2s}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:#b79af0;background:#faf6ff}
.opt.right{background:#c9f2dc;border-color:var(--ok);color:#0d5e35}
.opt.wrong{background:#ffe6cc;border-color:var(--bad);color:#7a4300}
.opt:disabled{cursor:default}
.q{font-size:1.2em;font-weight:bold;margin:8px 0}
.fact{background:#eef7ff;border-right:5px solid #4a90e2;border-radius:10px;padding:8px 12px;margin:8px 0;font-size:.95em}
.fact b{color:#1a4f9a}
.endbox{text-align:center}
.stars{font-size:46px;letter-spacing:6px;margin:6px 0}
.bigscore{font-size:1.6em;font-weight:bold;color:var(--main)}
.bless{background:#fff3d6;border-radius:16px;padding:12px;margin:12px 0;font-weight:bold}
.talk{background:#e8f6ff;border-radius:16px;padding:12px;margin:12px 0;text-align:right}
.sign{margin-top:16px;color:#6a5a8a;font-weight:bold}
.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}


.mil{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:760px){.mil{grid-template-columns:1fr 210px}}
.ladder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column-reverse;gap:4px}
.ladder li{display:flex;justify-content:space-between;padding:5px 12px;border-radius:10px;background:#f1eafc;font-weight:bold;font-size:15px;min-height:30px}
.ladder li.safe{color:#b9741a}
.ladder li.cur{background:linear-gradient(90deg,#f5b82e,#ff8a4c);color:#3a2300;transform:scale(1.04)}
.ladder li.past{background:#c9f2dc;color:#0d5e35}
.life{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.life .btn{padding:8px 14px;min-height:46px;font-size:16px}
.life .btn.used{opacity:.35;text-decoration:line-through}
.opt.lab{display:flex;gap:10px;align-items:center;justify-content:flex-start;text-align:right}
.opt .ltr{background:#7b4fd6;color:#fff;border-radius:50%;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 30px}
.opt.gone{visibility:hidden}
.opt.friendpick{outline:4px dashed #2a6df4}
.stopbar{margin-top:10px;text-align:center}
</style>

</head>
<body>
<div class="wrap">
<header class="top"><h1>💎 מי רוצה להיות מיליונר תורני?</h1><p>חידושים לפרשת כי תשא - הרב יהודה טאוב</p></header>
<a class="back" href="index.html" aria-label="חזרה לכל הפרשות">← חזרה לכל הפרשות</a>

<main>
<section id="intro" class="screen" aria-label="פתיחה">
  <div class="love" id="loveLine"></div>
  <ul class="howto" id="howto"></ul>
  <div class="center">
    <button class="btn" id="startBtn" aria-label="התחלת המשחק">▶ מתחילים!</button>
    <p id="bestLine" class="sign"></p>
  </div>
</section>

<section id="game" class="screen hidden" aria-label="המשחק">
  <div class="hud">
    <span class="pill" aria-live="polite">⭐ ניקוד: <span id="scoreVal">0</span></span>
    <div class="prog" id="progBar" role="progressbar" aria-label="התקדמות" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="progFill"></i></div>
    <span id="extraHud"></span>
  </div>
  <div id="fb" class="fb" aria-live="polite"></div>
  <div id="stage"></div>
</section>

<section id="end" class="screen endbox hidden" aria-label="סיום">
  <h2>סיימנו! 🎉</h2>
  <div class="bigscore" id="endScore"></div>
  <div class="stars" id="endStars" role="img"></div>
  <div id="bestMsg" class="sign"></div>
  <div class="bless" id="endBless"></div>
  <div class="talk"><b>שיחה קצרה בבית או בכיתה:</b><br><span id="talkQ"></span></div>
  <button class="btn alt" id="againBtn" aria-label="לשחק שוב">🔁 לשחק שוב</button>
  <p class="sign">הקול החמישי - הרב יהודה טאוב</p>
  <p><a class="back" href="index.html" aria-label="חזרה לכל הפרשות">← חזרה לכל הפרשות</a></p>
</section>
</main>
</div>
<script>
const CONFIG = {
  "slug": "ki-tisa",
  "love": "ה' אוהב אותך אהבה גדולה, ואפילו כשהעם טעה בחטא העגל הוא נתן לוחות חדשים מתוך אהבה. עכשיו תעלו בסולם ותגלו עוד אהבה!",
  "howto": [
    "עולים בסולם של 11 שאלות, ועם כל שלב מקבלים יותר נקודות.",
    "יש שלושה גלגלי עזר, אפשר להשתמש בכל אחד פעם אחת: 50:50, רמז ושאל חבר.",
    "יש שתי תחנות בטוחות. אם טועים, שומרים את הנקודות של התחנה האחרונה.",
    "אפשר גם לעצור באמצע ולשמור את מה שהגעתם אליו."
  ],
  "talk": "משה התפלל ארבעים יום על כל עם ישראל. על מי היית רוצה להתפלל היום? ומה עוזר לנו לעשות מצווה בשמחה?"
};
// DATA: חידושים מעמוד כי תשא, מסודרים בשלוש רמות קושי (4 קלות, 4 בינוניות, 3 קשות). o[0] נכונה. h = רמז.
const DATA = [
  { q: 'איפה התורה שמה את חטא העגל?', o: ['בין ציווי המשכן לעשייתו', 'בסוף התורה', 'לפני בריאת העולם', 'בתוך ספר בראשית'], h: 'זה קורה באמצע, בין שני דברים על המשכן.', exp: 'התורה מלמדת שיש פער בין מה שיודעים לבין מה שעושים, וצריך עמל ולב כדי לגשר עליו.' },
  { q: 'כמה ימים התפלל משה על עם ישראל?', o: ['ארבעים', 'שבעה', 'שלושה', 'מאה'], h: 'אותו מספר כמו ימי משה בהר סיני.', exp: 'התפילה על הציבור מקרבת לחן בעיני ה\'.' },
  { q: 'מה עושה שמחה של מצווה?', o: ['מחדירה דברים ללב', 'מרחיקה את התורה', 'עוצרת את הלימוד', 'עושה רעש בלבד'], h: 'חשבו על איפה השמחה מרגישים.', exp: 'שמחה מחדירה דברים ללב, ולכן שמחה במצווה מועילה מאוד.' },
  { q: 'בסעודת מצווה, מה השטן לא מוצא כנגד השמחה?', o: ['קטרוג', 'לחם', 'מקום', 'זמן'], h: 'זו מילה שקשורה במי שמאשים.', exp: 'שמחה של מצווה היא שמחה טהורה, ואין לשטן מה להגיד נגדה.' },
  { q: 'שמחת חתן וכלה צריכה להיות עם...', o: ['דברים ותוכן, ולא רק מחולות', 'רק מחולות', 'רק אוכל', 'רק שקט'], h: 'מה שמחזק את השמחה הוא דברי תורה וברכה.', exp: 'השמחה צריכה תוכן, ולכן שמחים את החתן והכלה בדברים טובים ולא רק בריקודים.' },
  { q: 'שברו את הלוחות הראשונים. מה זה יצר?', o: ['צורך בחזרה ועמל', 'שכחה גמורה', 'משחק חדש', 'חג חדש'], h: '"ישר כוחך ששברת" - מה קורה כשצריך לחזור וללמוד שוב?', exp: 'החזרה היא שמחדירה את התורה ללב.' },
  { q: '"חרות על הלוחות" - אל תקרא "חרות" אלא...', o: ['חירות', 'חרוץ', 'חרדה', 'חרבה'], h: 'המילה הזאת רומזת לחופש.', exp: 'חירות מהיצר כשהתורה חקוקה בלב.' },
  { q: 'מה שמרו בארון, לפי "זקן ששכח תלמודו"?', o: ['גם את שברי הלוחות', 'רק לוחות שלמים', 'רק זהב', 'רק קרבנות'], h: 'לא זורקים משהו שהיה קדוש.', exp: 'לימוד שנקלט בנשמה אינו נמחק לגמרי, גם כשלא זוכרים.' },
  { q: 'פרה אדומה היא דוגמה למצווה שאנחנו עושים...', o: ['באמונה, כי ה\' ציווה', 'רק כשמבינים', 'רק כשיש זמן', 'רק בחג'], h: 'לא תמיד מבינים, ובכל זאת עושים.', exp: 'יש לעשות מצווה משום שה\' ציווה, ולא רק מתוך הבנה.' },
  { q: 'לפי החידוש על סעודת אחשורוש, במה היה החטא?', o: ['שנהנו מן הרשע', 'שאכלו הרבה', 'שבנו ארמון', 'שהלכו לטייל'], h: 'השמחה מגלה למה אדם מחובר.', exp: 'השמחה מראה למה אנחנו קשורים. ולכן חשוב לשמוח במה שטוב.' },
  { q: 'לפי המלבי"ם, "הראני נא את כבודך" - מהו כבוד ה\'?', o: ['טובו המתגלה בעולם', 'הכוח שלו בלבד', 'הענן', 'ההר'], h: 'משהו שרואים בעולם ומרגישים שהוא טוב.', exp: 'כבוד ה\' הוא הטוב שלו שמתגלה בעולם כולו.' }
];
const LADDER = [100, 200, 300, 500, 1000, 2000, 4000, 8000, 16000, 32000, 1000000];
const SAFE = [3, 7]; // אינדקסים של תחנות בטוחות (500 ו-8,000)
const $ = (s, r) => (r || document).querySelector(s);
const PRAISE = [
  'נכון! ה\' אוהב אותך ושמח בך 💛',
  'יפה מאוד! אהבת ה\' מלווה אותך 🌟',
  'מצוין! ה\' מחייך אליך כשאתה לומד תורה 😊',
  'כל הכבוד! ה\' אוהב כל חידוש שלומדים בשמחה 📖',
  'נהדר! הלב שלך מלא אור, וה\' אוהב את זה ✨',
  'בדיוק! ה\' אוהב אותך כמו אבא אוהב את הילד שלו 🤗',
  'וואו! כל תשובה נכונה היא מתנה שאתה נותן לה\' 🎁',
  'תשובה מצוינת! ה\' תמיד קרוב אליך 💫'
];
const RETRY = [
  'כמעט! נסה שוב, ה\' איתך 💛',
  'לא נורא, גם טעות היא חלק מהלמידה. ה\' אוהב אותך באותה מידה 🌈',
  'עוד רגע תצליח! ה\' מאמין בך 💪',
  'קרוב מאוד! קח נשימה ונסה שוב, ה\' איתך 🌸'
];
let _lp = -1, _lr = -1;
function pickFrom(arr, which) {
  let i, last = which === 'p' ? _lp : _lr;
  do { i = Math.floor(Math.random() * arr.length); } while (i === last && arr.length > 1);
  if (which === 'p') _lp = i; else _lr = i;
  return arr[i];
}
function praise() { return pickFrom(PRAISE, 'p'); }
function retry() { return pickFrom(RETRY, 'r'); }
function shuffle(a) {
  const b = a.slice();
  for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = b[i]; b[i] = b[j]; b[j] = t; }
  return b;
}
const Store = {
  get(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { window.localStorage.setItem(k, v); } catch (e) { /* storage blocked */ } }
};
const BEST_KEY = 'kol-toda-game-' + CONFIG.slug;
function show(id) {
  ['intro', 'game', 'end'].forEach(function (x) { $('#' + x).classList.toggle('hidden', x !== id); });
  window.scrollTo(0, 0);
}
function setProgress(n, total) { $('#progFill').style.width = Math.round(100 * n / total) + '%'; $('#progBar').setAttribute('aria-valuenow', String(Math.round(100 * n / total))); }
function setScore(s) { $('#scoreVal').textContent = String(s); }
function say(msg, kind) { const f = $('#fb'); f.textContent = msg; f.className = 'fb ' + (kind || ''); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function finish(score, max, extraLine, opt) {
  const ratio = max > 0 ? score / max : 0;
  let n = ratio >= 0.75 ? 3 : ratio >= 0.4 ? 2 : 1;
  if (opt && opt.stars) n = opt.stars;
  $('#endScore').textContent = (opt && opt.text) ? opt.text : score + ' מתוך ' + max;
  $('#endStars').textContent = '⭐'.repeat(n) + '☆'.repeat(3 - n);
  $('#endStars').setAttribute('aria-label', n + ' כוכבים מתוך 3');
  const bl = [
    'איזו התחלה יפה! ה\' אוהב אותך מאוד, ובכל פעם שתשחק תגלה עוד אור. שבת שלום ולב מלא שמחה 💛',
    'כל הכבוד! ה\' שמח בך ואוהב את הלימוד שלך. שתמיד יהיה לך לב פתוח ומחייך 🌟',
    'מושלם! ה\' אוהב אותך אהבה גדולה, והלב שלך זורח. ברכה והצלחה בכל מה שתעשה ✨'
  ];
  $('#endBless').textContent = bl[n - 1] + (extraLine ? ' ' + extraLine : '');
  $('#talkQ').textContent = CONFIG.talk;
  let best = parseInt(Store.get(BEST_KEY) || '0', 10) || 0;
  if (score > best) { best = score; Store.set(BEST_KEY, String(score)); $('#bestMsg').textContent = 'שיא חדש! 🎉'; }
  else { $('#bestMsg').textContent = best > 0 ? 'השיא שלך: ' + best : ''; }
  show('end');
}
function initShell() {
  $('#loveLine').textContent = CONFIG.love;
  const ul = $('#howto');
  CONFIG.howto.forEach(function (t) { const li = document.createElement('li'); li.textContent = t; ul.appendChild(li); });
  const b = parseInt(Store.get(BEST_KEY) || '0', 10) || 0;
  $('#bestLine').textContent = b > 0 ? 'השיא שלך: ' + b : '';
  $('#startBtn').addEventListener('click', function () { startGame(); });
  $('#againBtn').addEventListener('click', function () { show('intro'); const bb = parseInt(Store.get(BEST_KEY) || '0', 10) || 0; $('#bestLine').textContent = bb > 0 ? 'השיא שלך: ' + bb : ''; });
}


const FRIEND = ['נראה לי שזו', 'אני די בטוח שזו', 'אני חושב שזו', 'הלב אומר לי שזו'];
let order, level, used, hidden, hintShown;

function fmt(n) { return n.toLocaleString('he-IL'); }

function startGame() {
  // מערבבים בתוך שלוש רמות קושי, כדי שהסולם ימשיך לעלות בקושי
  order = shuffle(DATA.slice(0, 4)).concat(shuffle(DATA.slice(4, 8)), shuffle(DATA.slice(8)));
  level = 0; used = { f: false, h: false, c: false };
  setScore(0); setProgress(0, LADDER.length);
  $('#stage').innerHTML = '<div class="mil"><div id="qa"></div><ol class="ladder" id="ladder" aria-label="סולם הנקודות"></ol></div>';
  show('game');
  render();
}

function renderLadder() {
  $('#ladder').innerHTML = LADDER.map(function (v, i) {
    const cls = (i === level ? 'cur ' : i < level ? 'past ' : '') + (SAFE.indexOf(i) >= 0 ? 'safe' : '');
    return '<li class="' + cls + '"><span>' + (i + 1) + (SAFE.indexOf(i) >= 0 ? ' 🛡️' : '') + '</span><span>' + fmt(v) + '</span></li>';
  }).join('');
}

function safeValue() {
  let v = 0;
  for (let i = 0; i < SAFE.length; i++) if (level > SAFE[i]) v = LADDER[SAFE[i]];
  return v;
}

function render() {
  hidden = []; hintShown = false;
  renderLadder();
  const it = order[level];
  const letters = ['א', 'ב', 'ג', 'ד'];
  const opts = shuffle(it.o);
  const qa = $('#qa');
  qa.innerHTML = '<div class="q"></div>' +
    '<div class="life" role="group" aria-label="גלגלי עזר">' +
    '<button class="btn alt' + (used.f ? ' used' : '') + '" id="lf" aria-label="גלגל עזר חמישים חמישים"' + (used.f ? ' disabled' : '') + '>50:50</button>' +
    '<button class="btn alt' + (used.h ? ' used' : '') + '" id="lh" aria-label="גלגל עזר רמז"' + (used.h ? ' disabled' : '') + '>💡 רמז</button>' +
    '<button class="btn alt' + (used.c ? ' used' : '') + '" id="lc" aria-label="גלגל עזר שאל חבר"' + (used.c ? ' disabled' : '') + '>📞 שאל חבר</button></div>' +
    '<div class="opts two" id="opts"></div><div id="extra"></div><div class="stopbar" id="stopbar"></div>';
  qa.querySelector('.q').textContent = 'שאלה ' + (level + 1) + ' בשווי ' + fmt(LADDER[level]) + ' נקודות: ' + it.q;
  opts.forEach(function (t, i) {
    const b = document.createElement('button');
    b.className = 'opt lab'; b.setAttribute('data-t', t); b.setAttribute('aria-label', 'תשובה ' + letters[i] + ': ' + t);
    b.innerHTML = '<span class="ltr" aria-hidden="true">' + letters[i] + '</span><span></span>';
    b.lastChild.textContent = t;
    b.addEventListener('click', function () { lock(b, t === it.o[0], it); });
    $('#opts').appendChild(b);
  });
  say(level === 0 ? 'מתחילים! ה\' אוהב אותך, בהצלחה 💛' : 'עלינו שלב! ממשיכים בשמחה 🌟', 'info');
  $('#lf').addEventListener('click', function () {
    used.f = true; this.disabled = true; this.classList.add('used');
    const wrong = [].filter.call(document.querySelectorAll('#opts .opt'), function (b) { return b.getAttribute('data-t') !== it.o[0]; });
    shuffle(wrong).slice(0, 2).forEach(function (b) { b.classList.add('gone'); b.disabled = true; });
    say('הורדנו שתי תשובות לא נכונות. נשארו שתיים!', 'info');
  });
  $('#lh').addEventListener('click', function () {
    used.h = true; this.disabled = true; this.classList.add('used');
    $('#extra').innerHTML = '<div class="fact"><b>רמז:</b> <span></span></div>';
    $('#extra').querySelector('span').textContent = it.h;
    say('הנה רמז קטן, ה\' איתך 💡', 'info');
  });
  $('#lc').addEventListener('click', function () {
    used.c = true; this.disabled = true; this.classList.add('used');
    const visible = [].filter.call(document.querySelectorAll('#opts .opt'), function (b) { return !b.classList.contains('gone'); });
    let pick = visible.filter(function (b) { return b.getAttribute('data-t') === it.o[0]; })[0];
    if (Math.random() < 0.15) pick = shuffle(visible)[0];
    pick.classList.add('friendpick');
    say('החבר שלך אומר: "' + FRIEND[Math.floor(Math.random() * FRIEND.length)] + ' התשובה ' + pick.querySelector('.ltr').textContent + '. תחליט בעצמך, אני מאמין בך!" 📞', 'info');
  });
  if (level > 0) {
    const s = document.createElement('button');
    s.className = 'btn'; s.textContent = 'לעצור כאן ולשמור ' + fmt(LADDER[level - 1]) + ' נקודות';
    s.setAttribute('aria-label', 'לעצור ולשמור את הנקודות');
    s.addEventListener('click', function () { endAt(LADDER[level - 1], 'בחרתם לעצור בזמן. החלטה חכמה!'); });
    $('#stopbar').appendChild(s);
  }
}

function lock(btn, ok, it) {
  [].forEach.call(document.querySelectorAll('#opts .opt'), function (b) {
    b.disabled = true;
    if (b.getAttribute('data-t') === it.o[0]) b.classList.add('right');
  });
  ['lf', 'lh', 'lc'].forEach(function (id) { $('#' + id).disabled = true; });
  $('#stopbar').innerHTML = '';
  const ex = $('#extra');
  ex.innerHTML = '<div class="fact"><b>ידעת?</b> <span></span></div>';
  ex.querySelector('span').textContent = it.exp;
  const nb = document.createElement('button');
  nb.className = 'btn';
  if (ok) {
    btn.classList.add('pop');
    setScore(LADDER[level]); setProgress(level + 1, LADDER.length);
    say(praise(), 'good');
    if (level + 1 >= LADDER.length) {
      nb.textContent = 'לסיום ←';
      nb.addEventListener('click', function () { endAt(LADDER[level], 'הגעתם לפסגה! מיליונר תורני!'); });
    } else {
      nb.textContent = 'לשאלה הבאה ←';
      nb.addEventListener('click', function () { level++; render(); });
    }
  } else {
    btn.classList.add('wrong', 'shake');
    const keep = safeValue();
    say('כמעט! התשובה הנכונה מסומנת בירוק. ה\' אוהב אותך, וכל לימוד הוא הצלחה 💛', 'soft');
    nb.textContent = 'לסיום ←';
    nb.addEventListener('click', function () { endAt(keep, keep > 0 ? 'שמרתם את התחנה הבטוחה!' : 'בפעם הבאה תעלו עוד יותר!'); });
  }
  nb.setAttribute('aria-label', 'המשך');
  ex.appendChild(nb); nb.focus();
}

function endAt(points, line) {
  setScore(points);
  const st = points >= 16000 ? 3 : points >= 500 ? 2 : 1;
  finish(points, LADDER[LADDER.length - 1], line, { stars: st, text: fmt(points) + ' נקודות' });
}

initShell();

</script>
</body>
</html>
