  if (pend) { add(d); add(pend); deepIn = true; } else add(d);
  if ($("q").value) run();
});
const deepP = Promise.all([fetch("deep.json").then(r => r.json()), nodesP]).then(([d]) => {
  if (!I) { pend = d; return; }
  add(d); deepIn = true;
  if ($("q").value) run();
});
Promise.all([itemsP, deepP]).catch(() => $("status").textContent = "הטעינה נכשלה – נסו לרענן את הדף.");

// ---------- urls and pictures
const abs = (c, u) => !u ? "" : u[0] === "~" ? "https://drive.google.com/open?id=" + u.slice(1) : /^https?:/.test(u) ? u : new URL(u, CATS[c].u).href;
const THUMB = {pdf: 1, word: 1, ppt: 1, excel: 1, image: 1, video: 1};
function pic(r, c) {
  const im = r[4] || (r[3][0] === "~" && THUMB[r[1]] ? 1 : ""); if (!im) return "";
  if (im === 1) { const m = r[3][0] === "~" ? r[3].slice(1) : (r[3].match(/[?&]id=([\w-]{20,})|\/d\/([\w-]{20,})/) || []).slice(1).find(Boolean); return m ? `https://drive.google.com/thumbnail?id=${m}&sz=w160` : ""; }
  if (im[0] === "y" && im.length === 12) return `https://i.ytimg.com/vi/${im.slice(1)}/mqdefault.jpg`;
  if (im[0] === "d" && im.length > 20 && !im.includes("/")) return `https://drive.google.com/thumbnail?id=${im.slice(1)}&sz=w160`;
  return abs(c, im);
}

// ---------- matching: every word in the title or in its path (catalog › topic › …), at least one in the title
let words = [], wordRes = [];
// כתיב מלא / חסר: when the exact spelling finds little, a second pass without ו and י inside words
// ("אמנו" finds "אימנו", "שבת" finds "שבות" too – so only as a fallback). It also folds a word-final ת into ה
// (13.10: "שמחת חול המועד" did not find "שמחה בחול המועד"; so תורת/תורה, מצות/מצוה)
const loose = s => s.replace(/(\S)[וי]+/g, "$1").replace(/(\S)[וי]+/g, "$1").replace(/(\S{2})ת(?![א-ת])/g, "$1ה");
let LN = null, LP = null, LI = null, LIn = 0;
function looseArrays() {
  if (!LN) { LN = NN.map(loose); LP = NP.map(loose); }
  if (!LI || LIn !== IT.length) { LI = IT.map(loose); LIn = IT.length; }
}
let inLoose = false;
// where w starts a word of t, or -1: a guessed form (a prefix letter dropped, a short word without ו/י) must
// not be found inside another word – "קל" inside "שוקולד" (שקלד) is not a hit
function at(t, w, title) {
  if (t.startsWith(w)) return 0;
  const p = t.indexOf(" " + w);
  if (p >= 0 || !inLoose || !title || w.length < 2) return p < 0 ? -1 : p + 1;
  // the other spelling: a word of the title (not of its path) may carry a prefix letter ("בחול" for "חול")
  const m = new RegExp("(^| )[בהוכלמש]" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).exec(t);
  return m ? m.index + m[1].length : -1;
}
function match(t, path) {
  let inT = 0, start = 0;
  for (const w of words) {
    let p = inLoose ? at(t, w, true) : t.indexOf(w);
    // a word with a prefix letter ("בקול", "והלשון") also finds the bare word, at the start of a word
    // (in the other-spelling pass a word is shorter by its ו/י: "בחול" is "בחל" there)
    const b = p < 0 && w.length > (inLoose ? 2 : 3) && "בהוכלמש".includes(w[0]) ? w.slice(1) : "";
    if (b) p = at(t, b);
    if (p >= 0) { inT++; if (p === 0 || t[p - 1] === " ") start++; }
    else if (!path.includes(w) && !(b && at(path, b) >= 0)) return -1;
  }
  return inT ? inT * 10 + start * 6 : -1;
}
function hl(s) {
  let h = esc(s);
  for (const re of wordRes) h = h.replace(re, "<mark>$&</mark>");
  return h;
}
function mkRes(ws) {
  const gap = "[\\u0591-\\u05C7״\"׳'`]*";
  return ws.filter(w => w.length > 1).sort((a, b) => b.length - a.length).map(w =>
    new RegExp([...w].map(ch => ch === " " ? "\\s+" : ch.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join(gap), "gi"));
}

// ---------- state
const S = {scope: "", sec: "", fmt: "", nShow: 12, fShow: 8, iShow: 50, last: ""};
// a topic that is only a folder (Drive / OneDrive / Gamma) is listed apart from the catalogs' own topics (21.10, the user)
const isFolder = i => N[i][1] === 3 || /drive\.google\.com\/drive|1drv\.ms\/f\/|gamma\.app\/folders/.test(N[i][4] || "");
let nodeHits = [], itemHits = [], t0 = 0;
function crumbs(n, withCat) {
  const out = []; let p = n;
  while (p >= 0 && N[p][1] > 0) { out.unshift(p); p = N[p][3]; }
  const c = N[n][2];
  const cb = withCat ? `<a class="cb" href="${esc(CATS[c].u)}" target="_blank" rel="noopener">${CATS[c].e} ${esc(CATS[c].n)}</a>` : "";
  return cb + out.map(i => ` › <a href="${esc(abs(c, N[i][4]))}" target="_blank" rel="noopener">${esc(N[i][0])}</a>`).join("");
}
function nodeHtml(i) {
  const [name, lv, c, par, u, e, cnt] = N[i];
  const path = []; let p = par; while (p >= 0 && N[p][1] > 0) { path.unshift(N[p][0]); p = N[p][3]; }
  const dir = isFolder(i), icon = dir ? "📁" : e || (lv === 0 ? CATS[c].e : lv === 1 ? "📂" : "🔖");
  return `<a class="node lv${dir ? 3 : lv}" style="--sc:${secColor(c)}" href="${esc(abs(c, u))}" target="_blank" rel="noopener">
    <span class="hd"><span class="pill">${dir ? LEVEL[3] : LEVEL[lv]}</span><span>${cnt ? num(cnt) + " חומרים" : ""}</span></span>
    <span class="nm">${icon} ${hl(name)}</span>
    <span class="pa">${lv ? esc([CATS[c].n, ...path].join(" › ")) : esc(GNAME[CATS[c].g] || "")}</span></a>`;
}
function itemHtml(i) {
  const r = I[i], n = r[2], c = N[n][2], [ic, fl, fc] = fmtOf(r[1]);
  const u = abs(c, r[3]), im = pic(r, c);
  const img = im ? `<img src="${esc(im)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : "";
  const kind = KINDS[r[5]] ? ` · <span class="k">${esc(KINDS[r[5]])}</span>` : "";
  // the same material elsewhere in the same catalog (a video in several playlists) is one result (19.10)
  const more = r[7] ? ` · <span class="k">${r[7] === 1 ? "מופיע עוד פעם אחת" : `מופיע עוד ${num(r[7])} פעמים`}</span>` : "";
  return `<div class="it" style="--sc:${secColor(c)};--fc:${fc}"><a class="th" href="${esc(u)}" target="_blank" rel="noopener">${ic}${img}<span class="fb">${fl}</span></a>
    <div class="tx"><a class="t" href="${esc(u)}" target="_blank" rel="noopener">${hl(r[0])}</a>
    <div class="crumbs">${crumbs(n, true)}${kind}${more}</div></div></div>`;
}
function facetBtn(kind, key, label, color, n) {
  return `<button class="facet${S[kind] === key ? " on" : ""}" style="--fc:${color}" data-f="${kind}" data-k="${esc(key)}"><i></i>${esc(label)} <b>${num(n)}</b></button>`;
}

function draw() {
  const o = [];
  const catHits = nodeHits.filter(i => !isFolder(i)), dirHits = nodeHits.filter(isFolder);
  if (catHits.length) {
    o.push(`<h2>🧭 נושאים בקטלוגים של האתר <small>${num(catHits.length)} – לחיצה פותחת את הנושא בקטלוג</small></h2><div class="nodes">`);
    o.push(catHits.slice(0, S.nShow).map(nodeHtml).join(""));
    if (catHits.length > S.nShow) o.push(`<button class="morebtn" id="moreN">עוד ${num(Math.min(24, catHits.length - S.nShow))} נושאים</button>`);
    o.push("</div>");
  }
  if (dirHits.length) {
    o.push(`<h2 class="dirs">📁 תיקיות בדרייב <small>${num(dirHits.length)} – תיקיות קבצים כמו שהן, בלי דף משלהן באתר</small></h2><div class="nodes">`);
    o.push(dirHits.slice(0, S.fShow).map(nodeHtml).join(""));
    if (dirHits.length > S.fShow) o.push(`<button class="morebtn" id="moreF">עוד ${num(Math.min(24, dirHits.length - S.fShow))} תיקיות</button>`);
    o.push("</div>");
  }
  if (!I) o.push(`<div class="empty">⏳ טוען את החומרים… (הנושאים כבר כאן)</div>`);
  else if (!deepIn) o.push(`<p class="hint">⏳ עוד רגע מצטרפים גם הקבצים שבתוך תיקיות הדרייב…</p>`);
  else {
    // the facets count the hits of the other filter, so a click never leads to an empty list
    const bySec = {}, byFmt = {};
    for (const i of itemHits) {
      const c = N[I[i][2]][2], g = CATS[c].g, f = I[i][1];
      if (!S.fmt || f === S.fmt) bySec[g] = (bySec[g] || 0) + 1;
      if (!S.sec || g === S.sec) byFmt[f] = (byFmt[f] || 0) + 1;
    }
    const shown = itemHits.filter(i => (!S.sec || CATS[N[I[i][2]][2]].g === S.sec) && (!S.fmt || I[i][1] === S.fmt));
    o.push(`<h2>📚 חומרים <small>${num(shown.length)}${shown.length !== itemHits.length ? " מתוך " + num(itemHits.length) : ""}</small></h2>`);
    if (itemHits.length) {
      o.push(`<div class="facets">${REG.groups.filter(([g]) => bySec[g] || S.sec === g).map(([g, l]) => facetBtn("sec", g, l, SEC[g], bySec[g] || 0)).join("")}</div>`);
      o.push(`<div class="facets">${Object.entries(byFmt).sort((a, b) => b[1] - a[1]).map(([f, n]) => facetBtn("fmt", f, fmtOf(f)[0] + " " + fmtOf(f)[1], fmtOf(f)[2], n)).join("")}</div>`);
    }
    o.push(`<div class="items">${shown.slice(0, S.iShow).map(itemHtml).join("")}`);
    if (shown.length > S.iShow) o.push(`<button class="morebtn" id="moreI">עוד ${num(Math.min(50, shown.length - S.iShow))} חומרים</button>`);
    if (!S.scope || CATS[S.scope].k === "site") o.push(`<p class="hint">📄 מחפשים מילה מתוך הטקסט של מאמר או דף באתר? <a href="${SITE}catalog.html?q=${encodeURIComponent($("q").value)}">חיפוש בתוך הטקסט של דפי האתר ←</a></p>`);
    if (!shown.length && !nodeHits.length) o.push(`<div class="empty">לא נמצא כלום. נסו מילה אחת פחות, כתיב אחר (מלא / חסר), או "בכל הקטלוגים".</div>`);
    o.push("</div>");
  }
  $("out").innerHTML = o.join("");
  const mn = $("moreN"); if (mn) mn.onclick = () => { S.nShow += 24; draw(); };
  const mf = $("moreF"); if (mf) mf.onclick = () => { S.fShow += 24; draw(); };
  const mi = $("moreI"); if (mi) mi.onclick = () => { S.iShow += 50; draw(); };
  const ms = Math.round(performance.now() - t0);
  $("status").innerHTML = (S.loose ? "🔤 לא נמצא בכתיב הזה – מוצגות תוצאות בכתיב מלא/חסר · " : "") + `<b>${num(nodeHits.length)}</b> נושאים ותיקיות · <b>${I ? num(itemHits.length) : "…"}</b> חומרים${S.scope ? " ב" + esc(CATS[S.scope].n) : ""} · ${ms} אלפיות שנייה`;
}
$("out").addEventListener("click", e => {
  const b = e.target.closest(".facet"); if (b) { S[b.dataset.f] = S[b.dataset.f] === b.dataset.k ? "" : b.dataset.k; S.iShow = 50; draw(); return; }
  const c = e.target.closest(".cat[data-c]"); if (c) { $("scope").value = c.dataset.c; S.scope = c.dataset.c; $("q").focus(); home(); }
});

function run() {
  if (!N) return;
  if (!search(false)) return;
  if (I && itemHits.length + nodeHits.length < 8 && words.some(w => /[וי]/.test(w.slice(1)) || /..ת$/.test(w))) {
    // the exact-spelling hits stay first; the other spelling only adds after them
    const strict = [nodeHits, itemHits], had = strict[0].length + strict[1].length;
    search(true);
    const sn = new Set(strict[0]), si = new Set(strict[1]);
    nodeHits = strict[0].concat(nodeHits.filter(i => !sn.has(i)));
    itemHits = strict[1].concat(itemHits.filter(i => !si.has(i)));
    S.loose = !had && nodeHits.length + itemHits.length > 0;
  }
  draw();
}
function search(isLoose) {
  S.loose = false; inLoose = isLoose;
  const raw = $("q").value;
  let q = norm(raw);
  S.scope = $("scope").value;
  if (!isLoose && raw + "|" + S.scope !== S.last) { S.sec = S.fmt = ""; S.last = raw + "|" + S.scope; }   // a new search: no old filter
  if (!isLoose) t0 = performance.now(), history.replaceState(null, "", raw || S.scope ? "#" + new URLSearchParams({q: raw, c: S.scope ? CATS[S.scope].k : ""}) : location.pathname);
  if (q.length < 2) { home(); return false; }
  words = q.split(" ").filter(Boolean); wordRes = mkRes(words);
  if (isLoose) { looseArrays(); words = words.map(loose); q = loose(q); }
  const nn = isLoose ? LN : NN, np = isLoose ? LP : NP, it = isLoose ? LI : IT;
  const sc = S.scope === "" ? -1 : +S.scope;
  // topics: the catalog, a topic, a sub-topic first; a whole-name match before a part of one
  const nh = [];
  for (let i = 0; i < N.length; i++) {
    if (sc >= 0 && N[i][2] !== sc) continue;
    const m = match(nn[i], np[i]); if (m < 0) continue;
    const lv = N[i][1], t = nn[i];
    nh.push([i, m + (t === q ? 60 : t.startsWith(q) ? 25 : t.includes(q) ? 10 : 0) + [30, 24, 16, 4][lv] + Math.min(12, Math.log2(1 + N[i][6]) * 1.5)]);
  }
  nh.sort((a, b) => b[1] - a[1] || a[0] - b[0]);
  nodeHits = nh.map(x => x[0]);
  itemHits = [];
  if (I) {
    const ih = [];
    for (let i = 0; i < I.length; i++) {
      const n = I[i][2];
      if (sc >= 0 && N[n][2] !== sc) continue;
      const k = I[i][5], m = match(it[i], k ? np[n] + " " + KN[k] : np[n]); if (m < 0) continue;
      const t = it[i];
      ih.push(i, m + (t === q ? 40 : t.startsWith(q) ? 18 : t.includes(q) ? 8 : 0));
    }
    const idx = []; for (let j = 0; j < ih.length; j += 2) idx.push(j);
    // the user's own materials first (r[6] = 1, catalog-kit/mine.py), then by how well they match
    const own = j => I[ih[j]][6] || 0;
    idx.sort((a, b) => own(b) - own(a) || ih[b + 1] - ih[a + 1] || ih[a] - ih[b]);
    itemHits = idx.map(j => ih[j]);
  }
  S.nShow = 12; S.fShow = 8; S.iShow = 50;
  return true;
}

// ---------- the empty page: the catalogs, and what the colours mean
function home() {
  const sc = $("scope").value;
  const cnt = c => N ? N.find(n => n[1] === 0 && n[2] === c)[6] : 0;
  $("status").textContent = sc ? `חיפוש ב${CATS[sc].n} – הקלידו לפחות 2 אותיות` : "";
  const leg = `<div class="legend"><b style="color:var(--ink)">מה רואים בתוצאות:</b>
    ${[0, 1, 2, 3].map(l => `<span><span class="pill lv${l}" style="--sc:#4f46e5">${LEVEL[l]}</span></span>`).join("")}
    <span><span class="pill mat">חומר</span></span> · הצבע בצד = המדור:
    ${REG.groups.map(([g, l]) => `<span><i style="width:10px;height:10px;border-radius:50%;background:${SEC[g]};display:inline-block"></i>${esc(l)}</span>`).join("")}</div>`;
  const cats = REG.groups.map(([g, l]) => {
    const cs = CATS.map((c, i) => [c, i]).filter(([c]) => c.g === g);
    return cs.length ? `<h2>${esc(l)}</h2><div class="cats">${cs.map(([c, i]) => `<button class="cat" style="--sc:${SEC[g]}" data-c="${i}"><span class="e">${c.e}</span><span><b>${esc(c.n)}</b><small>${N ? num(cnt(i)) + " חומרים · חיפוש כאן" : "חיפוש כאן"}</small></span></button>`).join("")}</div>` : "";
  }).join("");
  $("out").innerHTML = leg + `<p class="hint">כמה מילים = כולן צריכות להופיע (בשם או בנושא שמעליו): <b>נח מבחן</b>, <b>חנוכה מצגת</b>, <b>הרמב"ם סיפור</b>. <kbd>/</kbd> קופץ לתיבת החיפוש.</p>` + cats;
}

// ---------- scope select, typing, the address
$("scope").innerHTML = `<option value="">🔎 בכל הקטלוגים</option>` + REG.groups.map(([g, l]) => {
  const cs = CATS.map((c, i) => [c, i]).filter(([c]) => c.g === g);
  return cs.length ? `<optgroup label="${esc(l)}">${cs.map(([c, i]) => `<option value="${i}">${c.e} ${esc(c.n)}</option>`).join("")}</optgroup>` : "";
}).join("");
let timer;
$("q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(run, I && I.length > 60000 ? 90 : 40); });
$("q").addEventListener("keydown", e => { if (e.key === "Enter") { clearTimeout(timer); run(); } });
$("scope").addEventListener("change", run);
document.addEventListener("keydown", e => { if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); } });
const prm = new URLSearchParams(location.hash.slice(1) || location.search.slice(1));
const ck = prm.get("c");
if (ck) { const i = /^\d+$/.test(ck) ? +ck : CATS.findIndex(c => c.k === ck); if (CATS[i]) $("scope").value = String(i); }
if (prm.get("q")) $("q").value = prm.get("q");
</script>
</body>
</html>
