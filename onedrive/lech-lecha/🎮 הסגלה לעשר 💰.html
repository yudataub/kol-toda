        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(frequencies, durations) {
            let startTime = audioContext.currentTime;
            frequencies.forEach((freq, index) => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = freq;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.3, startTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + durations[index]);
                
                oscillator.start(startTime);
                oscillator.stop(startTime + durations[index]);
                
                startTime += durations[index];
            });
        }

                    <p class="highlight">אֵיךְ לְהָבִיא שֶׁפַע וּבְרָכָה לַבַּיִת? 💎</p>
                    <p>נִלְמַד מֵ<strong>אַבְרָהָם אָבִינוּ</strong> וּמֵ<strong>הַגְּמָרָא הַקְּדוֹשָׁה</strong>:</p>
                    <p>✨ מָה עָשָׂה אַבְרָהָם שֶׁהִפְכוֹ לְעָשִׁיר?</p>
                    <p>✨ אֵיךְ כִּבּוּד הָאִשָּׁה מֵבִיא עֹשֶׁר?</p>
                    <p>✨ אֵיךְ לְיַשֵּׂם אֶת זֶה בְּחַיֵּינוּ?</p>
                    <div class="inspiration-box" style="margin-top: 25px;">
                        <strong>💡 זִכְרוּ תָּמִיד:</strong><br>
                        הַשֵּׁם אוֹהֵב אוֹתָנוּ וְרוֹצֶה שֶׁנִּהְיֶה שְׂמֵחִים וּמְבֹרָכִים! 💖<br>
                        כְּשֶׁנּוֹדֶה וּנְכַבֵּד - הַשֵּׁם מְבָרֵךְ אוֹתָנוּ בְּאַהֲבָה! 🌈
                    </div>
                </div>
                <div style="text-align: center; margin-top: 30px;">
                    <button class="btn-primary" onclick="startGame()">
                        בּוֹאוּ נַתְחִיל! 🚀
                    </button>
                </div>
            `;
        }

        // התחלת המשחק
        function startGame() {
            currentLesson = 0;
            totalScore = 0;
            renderLesson();
        }

        // הצגת שיעור
        function renderLesson() {
            if (currentLesson >= lessons.length) {
                renderFinal();
                return;
            }

            lessonScore = 0;
            currentQuestionIndex = 0;
            answeredQuestions = 0;

            const lesson = lessons[currentLesson];
            const container = document.getElementById('gameContainer');
            
            const progress = ((currentLesson + 1) / lessons.length) * 100;
            
            container.innerHTML = `
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${progress}%">
                        שִׁיעוּר ${currentLesson + 1} מִתּוֹךְ ${lessons.length}
                    </div>
                </div>
                <div class="score-display">
                    נִקּוּד כּוֹלֵל: ${totalScore} נְקֻדּוֹת ⭐
                </div>
                <div class="lesson-header">
                    ${lesson.title}
                </div>
                <div class="lesson-content">
                    ${lesson.content}
                </div>
                <div id="questionsContainer"></div>
            `;

            renderQuestion();
        }

        // הצגת שאלה
        function renderQuestion() {
            const lesson = lessons[currentLesson];
            if (currentQuestionIndex >= lesson.questions.length) {
                checkLessonCompletion();
                return;
            }

            const question = lesson.questions[currentQuestionIndex];
            const shuffledAnswers = shuffleArray(question.answers.map((ans, idx) => ({ text: ans, originalIndex: idx })));
            
            const questionsContainer = document.getElementById('questionsContainer');
            questionsContainer.innerHTML = `
                <div class="question-box">
                    <div class="question-text">
                        שְׁאֵלָה ${currentQuestionIndex + 1}: ${question.question}
                    </div>
                    <div id="answersContainer">
                        ${shuffledAnswers.map((ans, idx) => `
                            <button class="answer-btn" onclick="checkAnswer(${ans.originalIndex}, ${idx})">
                                ${ans.text}
                            </button>
                        `).join('')}
                    </div>
                    <div id="feedbackContainer"></div>
                </div>
            `;
        }

        // בדיקת תשובה
        function checkAnswer(originalIndex, buttonIndex) {
            answeredQuestions++;
            const lesson = lessons[currentLesson];
            const question = lesson.questions[currentQuestionIndex];
            const isCorrect = originalIndex === question.correct;
            
            const buttons = document.querySelectorAll('.answer-btn');
            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === buttonIndex) {
                    btn.classList.add(isCorrect ? 'correct' : 'wrong');
                }
            });

            const feedbackContainer = document.getElementById('feedbackContainer');
            
            if (isCorrect) {
                lessonScore++;
                totalScore += 10;
                
                const encouragements = [
                    "מְצֻיָּן! ⭐",
                    "נִפְלָא! 💪",
                    "כָּל הַכָּבוֹד! 🎯",
                    "מוּמְחֶה! 🏆",
                    "פַּצְצָה! 💥"
                ];
                const randomEncouragement = encouragements[Math.floor(Math.random() * encouragements.length)];
                
                feedbackContainer.innerHTML = `
                    <div class="feedback correct">
                        <strong>${randomEncouragement}</strong><br><br>
                        ${question.explanation}<br><br>
                        <em>${question.inspiration}</em>
                    </div>
                `;
                
                playSound([261.63, 329.63, 392.00], [0.2, 0.2, 0.3]);
            } else {
                feedbackContainer.innerHTML = `
                    <div class="feedback wrong">
                        <strong>לֹא בְּדִיּוּק... 🤔</strong><br><br>
                        ${question.explanation}<br><br>
                        <em>גַּם כְּשֶׁטּוֹעִים - לוֹמְדִים! הַשֵּׁם אוֹהֵב אוֹתְךָ! 💡</em>
                    </div>
                `;
            }

            document.getElementById('questionsContainer').innerHTML += `
                <div style="text-align: center; margin-top: 20px;">
                    <button class="btn-primary" onclick="nextQuestion()">
                        ${currentQuestionIndex < lesson.questions.length - 1 ? 'הַשְּׁאֵלָה הַבָּאָה ➡️' : 'סִיּוּם הַשִּׁיעוּר 🎓'}
                    </button>
                </div>
            `;

            // עדכון ניקוד
            const scoreDisplay = document.querySelector('.score-display');
            scoreDisplay.textContent = `נִקּוּד כּוֹלֵל: ${totalScore} נְקֻדּוֹת ⭐`;
        }

        // שאלה הבאה
        function nextQuestion() {
            currentQuestionIndex++;
            renderQuestion();
        }

        // בדיקת סיום שיעור
        function checkLessonCompletion() {
            const lesson = lessons[currentLesson];
            const percentage = (lessonScore / lesson.questions.length) * 100;
            const passed = percentage >= 66;

            const container = document.getElementById('gameContainer');
            
            let message, sound;
            if (lessonScore === 3) {
                message = `
                    <h2 style="color: #28a745;">מַדְהִים! 🏆</h2>
                    <p style="font-size: 1.3em;">אַתָּה שׁוֹלֵט! אַתָּה חַי בְּאַהֲבַת ה'! 🎉</p>
                `;
                sound = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63];
                playSound(sound, [0.15, 0.15, 0.15, 0.2, 0.15, 0.2]);
            } else if (passed) {
                message = `
                    <h2 style="color: #20c997;">כִּמְעַט מֻשְׁלָם! 💪</h2>
                    <p style="font-size: 1.3em;">מַמָּשׁ כְּמוֹ בְּאַהֲבָה - מַמְשִׁיכִים לִצְמֹחַ! 🌱</p>
                `;
            } else {
                message = `
                    <h2 style="color: #dc3545;">בּוֹא נְנַסֶּה שׁוּב 💖</h2>
                    <p style="font-size: 1.3em;">בְּאַהֲבָה וּבְסַבְלָנוּת - נַצְלִיחַ!</p>
                `;
            }

            container.innerHTML = `
                <div class="certificate" style="background: ${passed ? 'linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%)' : 'linear-gradient(135deg, #fa709a 0%, #fee140 100%)'};">
                    ${message}
                    <div class="certificate-content">
                        <p style="font-size: 1.4em; margin: 20px 0;">
                            עָנִיתָ נָכוֹן עַל <strong>${lessonScore}</strong> מִתּוֹךְ <strong>3</strong> שְׁאֵלוֹת
                        </p>
                        <p style="font-size: 1.2em; color: #5a4fcf;">
                            נִקּוּד כּוֹלֵל: <strong>${totalScore}</strong> נְקֻדּוֹת ⭐
                        </p>
                    </div>
                    <div style="margin-top: 25px;">
                        ${passed ? `
                            <button class="btn-primary" onclick="currentLesson++; renderLesson();">
                                לַשִּׁיעוּר הַבָּא! 🚀
                            </button>
                        ` : `
                            <button class="btn-primary" onclick="renderLesson();">
                                נְנַסֶּה שׁוּב בְּאַהֲבָה 💖
                            </button>
                        `}
                    </div>
                </div>
            `;
        }

        // סיום משחק
        function renderFinal() {
            const maxScore = lessons.length * 30;
            const percentage = Math.round((totalScore / maxScore) * 100);
            
            playSound([261.63, 329.63, 392.00, 523.25, 392.00, 329.63], [0.15, 0.15, 0.15, 0.25, 0.15, 0.25]);

            const container = document.getElementById('gameContainer');
            container.innerHTML = `
                <div class="certificate">
                    <h2>🎓 תְּעוּדַת הִצְטַיְּנוּת 🎓</h2>
                    <div class="certificate-content">
                        <h3 style="color: #5a4fcf; font-size: 2em; margin: 20px 0;">
                            כָּל הַכָּבוֹד! 🏆
                        </h3>
                        <p style="font-size: 1.4em; line-height: 2;">
                            סִיַּמְתָּ בְּהַצְלָחָה אֶת כָּל הַשִּׁיעוּרִים!<br>
                            נִקּוּד סוֹפִי: <strong style="font-size: 1.3em; color: #667eea;">${totalScore}</strong> נְקֻדּוֹת<br>
                            אָחוּז הַצְלָחָה: <strong style="font-size: 1.3em; color: #28a745;">${percentage}%</strong>
                        </p>
                        <div style="background: #ffecd2; padding: 20px; border-radius: 12px; margin: 25px 0;">
                            <p style="font-size: 1.3em; line-height: 2; color: #2c3e50;">
                                <strong>💫 פָּסוּק לְהַשְׁרָאָה:</strong><br>
                                "וְאָהַבְתָּ אֵת ה' אֱלֹהֶיךָ<br>
                                בְּכָל לְבָבְךָ וּבְכָל נַפְשְׁךָ<br>
                                וּבְכָל מְאֹדֶךָ"
                            </p>
                        </div>
                        <p style="font-size: 1.2em; line-height: 2; margin: 25px 0;">
                            <strong>✨ זִכְרוּ תָּמִיד:</strong><br>
                            כָּל מִי שֶׁלָּמַד בְּאַהֲבָה -<br>
                            פָּתַח שַׁעַר בְּלִבּוֹ אֶל הַשֵּׁם! 💖
                        </p>
                    </div>
                    
                    <div style="background: white; padding: 25px; border-radius: 15px; margin: 25px 0;">
                        <h3 style="color: #667eea; margin-bottom: 15px;">💭 שְׁאֵלוֹת לְמַחְשָׁבָה:</h3>
                        <p style="text-align: right; line-height: 2; font-size: 1.1em;">
                            📌 אֵיךְ אוּכַל לְהָבִיא יוֹתֵר אַהֲבַת ה' לַלִּמּוּד הַבָּא שֶׁלִּי?<br>
                            📌 אֵיזוֹ מִצְוָה אֲנִי רוֹצֶה לְקַיֵּם הַיּוֹם מִתּוֹךְ שִׂמְחָה?<br>
                            📌 אֵיךְ אֲנִי יָכוֹל לְכַבֵּד אֶת הָאִשָּׁה בְּחַיַּי הַיּוֹם?
                        </p>
                    </div>

                    <div style="margin: 30px 0;">
                        <h3 style="color: white; font-size: 1.8em; margin-bottom: 20px;">
                            🎁 זָכִיתָ לְהִכָּנֵס לְהַגְרָלָה! 🎁
                        </h3>
                        <p style="font-size: 1.3em; color: white; margin: 15px 0;">
                            הִשְׁתַּתֵּף בְּהַגְרָלָה נוֹשֵׂאת פְּרָסִים!
                        </p>
                        <a href="https://forms.gle/A66uubei4XSX6SG2A" target="_blank" class="btn-link">
                            לַהַגְרָלָה! 🎯
                        </a>
                    </div>
                </div>

                <div class="contact-info">
                    <p style="font-size: 1.3em; margin: 15px 0;">
                        <strong>נִבְנָה בְּאַהֲבָה עַל יְדֵי:</strong><br>
                        הָרַב יְהוּדָה טָאוּב מִקִּרְיַת אַתָּא 💙<br>
                        📞 לִפְרָטִים: <strong style="font-size: 1.2em;">0527139520</strong>
                    </p>
                    <p style="font-size: 1.1em; margin-top: 20px;">
                        שִׁתּוּף הַמִּשְׂחָק עוֹזֵר לְהַפִּיץ אַהֲבַת ה'! 🌟
                    </p>
                </div>
            `;
        }

        // התחלה
        window.onload = function() {
            renderIntro();
        };
    </script>
</body>
