        // פונקציה לנגינת צלילים
        function playSound(frequencies, duration = 0.2) {
            const now = audioContext.currentTime;
            frequencies.forEach((freq, index) => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = freq;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.3, now + index * duration);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + (index + 1) * duration);
                
                oscillator.start(now + index * duration);
                oscillator.stop(now + (index + 1) * duration);
            });
        }

        function shuffle(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

                isCorrect: index === question.correct

            container.innerHTML = `

                    <div class="progress-fill" style="width: ${((currentLesson + 1) / lessons.length) * 100}%">

        // בדיקת תשובה

            const buttons = document.querySelectorAll('.answer-btn');
            const feedback = document.getElementById('feedback');
            
            // נטרול כל הכפתורים
            buttons.forEach(btn => btn.disabled = true);
            
            answeredQuestions++;
            
            if (isCorrect) {
                buttons[buttonIndex].classList.add('correct');
                lessonScore++;
                score++;
                
                playSound([261.63, 329.63, 392.00]); // C-E-G
                
                const encouragements = [

                    "מְעֻלֶּה! 💫"

                const randomEncouragement = encouragements[Math.floor(Math.random() * encouragements.length)];
                
                feedback.className = 'feedback correct';
                feedback.innerHTML = `

                currentQuestion++;
                if (currentQuestion < lessons[currentLesson].questions.length) {
                    renderQuestion();
                } else {

                }

        }
