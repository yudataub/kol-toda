    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>כרטיסי יוסף הצדיק</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'David', serif;
            background: white;
        }
        
        .page {
            width: 21cm;
            height: 29.7cm;
            margin: 0 auto 2cm;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 1cm;
            padding: 1.5cm;
            box-sizing: border-box;
            page-break-after: always;
        }
        
        .card {
            border: 3px solid #8B4513;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: #fefefe;
            position: relative;
            min-height: 120px;
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            bottom: 8px;
            border: 2px solid #D2691E;
            border-radius: 8px;
            pointer-events: none;
        }
        
        .card::after {
            content: '';
            position: absolute;
            top: -8px;
            left: -8px;
            width: 16px;
            height: 16px;
            background: radial-gradient(circle, #8B4513 2px, transparent 2px);
            background-size: 4px 4px;
        }
        
        .card-content {
            font-size: 28px;
            font-weight: bold;
            color: #2F4F4F;
            line-height: 1.3;
            z-index: 1;
            position: relative;
        }
        
        /* Corner decorations */
        .card::before {
            background-image: 
                radial-gradient(circle at top left, #D2691E 1px, transparent 1px),
                radial-gradient(circle at top right, #D2691E 1px, transparent 1px),
                radial-gradient(circle at bottom left, #D2691E 1px, transparent 1px),
                radial-gradient(circle at bottom right, #D2691E 1px, transparent 1px);
            background-size: 8px 8px;
            background-position: 0 0, 100% 0, 0 100%, 100% 100%;
            background-repeat: no-repeat;
        }
        
        @media print {
            body { margin: 0; padding: 0; }
            .page { margin: 0; page-break-after: always; }
        }
    </style>
