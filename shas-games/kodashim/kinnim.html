<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מסכת קינים — למעלה או למטה? · סדר קינים</title>
<style>
:root{--c1:#4b0082;--c2:#6a0dad;--c3:#8e44ad;--accent:#ffd700;--accent2:#ffb700;--box:#fdf6ff;--boxBorder:#d9b3ff;--hl:#fff8d6;--hlBorder:#f0c419;--insp:#e8f1ff;--inspBorder:#5b8def;--ok:#28a745;--okBg:#d4edda;--bad:#dc3545;--badBg:#f8d7da;--txt:#2d1b3d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","Arial Hebrew",Arial,sans-serif;background:linear-gradient(135deg,var(--c1),var(--c2) 50%,var(--c3));background-attachment:fixed;min-height:100vh;padding:14px;color:var(--txt);font-size:18px;line-height:1.7;direction:rtl;text-align:right}
.wrap{max-width:860px;margin:0 auto}
header.top{color:#fff;text-align:center;padding:18px 8px}
header.top h1{font-size:1.9em;line-height:1.3}header.top h1 span{color:var(--accent)}
.card{background:#fff;border-radius:22px;padding:22px;box-shadow:0 14px 40px rgba(0,0,0,.3);margin-bottom:16px}
h2{color:var(--c1);font-size:1.4em;margin-bottom:8px}
h3{color:var(--c2);margin:12px 0 6px}
.grp{color:#fff;font-weight:800;margin:16px 4px 8px;font-size:1.1em}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:#fff;border:0;border-radius:16px;padding:14px 10px;cursor:pointer;font:inherit;text-align:center;box-shadow:0 6px 16px rgba(0,0,0,.22);position:relative;color:var(--txt)}
.tile:hover{transform:translateY(-2px)}
.tile .n{display:inline-flex;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c3));color:var(--accent);font-weight:800;align-items:center;justify-content:center}
.tile b{display:block;color:var(--c1);margin-top:4px}
.tile small{color:#6b5a7a;display:block;line-height:1.3}
.tile.done::after{content:"✓";position:absolute;top:6px;left:10px;color:var(--ok);font-weight:900;font-size:1.2em}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.bar h2{flex:1;margin:0}
.btn{border:0;cursor:pointer;font:inherit;font-weight:800;padding:10px 20px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--c1);margin:4px}
.btn.sec{background:var(--box);border:2px solid var(--boxBorder);color:var(--c1)}
.btn:disabled{opacity:.4;cursor:default}
.prog{height:12px;background:var(--box);border:1.5px solid var(--boxBorder);border-radius:99px;overflow:hidden;margin:8px 0 14px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .3s}
.q{font-size:1.25em;font-weight:700;color:var(--c1);margin:10px 0}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--boxBorder);background:var(--box);border-radius:14px;padding:12px 16px;font:inherit;font-size:1.05em;cursor:pointer;text-align:right;color:var(--txt)}
.opt:hover{border-color:var(--c3)}
.opt.ok{background:var(--okBg);border-color:var(--ok)}.opt.no{background:var(--badBg);border-color:var(--bad)}
.opt.gone{visibility:hidden}
.fb{border-radius:14px;padding:12px 16px;margin-top:12px;font-weight:600}
.fb.ok{background:var(--okBg);border:2px solid var(--ok)}.fb.no{background:var(--badBg);border:2px solid var(--bad)}
.hl{background:var(--hl);border:2px solid var(--hlBorder);border-radius:14px;padding:12px 16px;margin:12px 0}
.insp{background:var(--insp);border:2px solid var(--inspBorder);border-radius:14px;padding:12px 16px;margin:12px 0}
.center{text-align:center}
.big{font-size:3em;line-height:1.2}
.chipz{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{background:var(--box);border:2px solid var(--boxBorder);border-radius:99px;padding:4px 14px;font-weight:700;font:inherit;color:var(--txt)}
button.chip{cursor:pointer}
.chip.ok{background:var(--okBg);border-color:var(--ok)}.chip.no{background:var(--badBg);border-color:var(--bad)}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mc{aspect-ratio:1/1;border-radius:12px;border:0;font:inherit;font-size:.82em;line-height:1.25;cursor:pointer;background:linear-gradient(135deg,var(--c1),var(--c3));color:transparent;padding:4px;overflow:hidden}
.mc.up{background:var(--box);color:var(--txt);border:2px solid var(--boxBorder)}
.mc.hit{background:var(--okBg);color:var(--txt);border:2px solid var(--ok)}
.track{display:flex;gap:4px;direction:ltr;margin:10px 0}
.cell{flex:1;height:44px;border-radius:8px;background:var(--box);border:1.5px solid var(--boxBorder);display:flex;align-items:center;justify-content:center;font-size:1.4em}
.cell.goal{background:var(--hl);border-color:var(--hlBorder)}
.slots{display:flex;gap:6px;justify-content:center;margin:12px 0;flex-wrap:wrap}
.slot{width:44px;height:52px;border-radius:10px;border:2px dashed var(--c3);display:flex;align-items:center;justify-content:center;font-size:1.5em;font-weight:800;background:#fff}
.lt{width:46px;height:46px;border-radius:10px;border:0;background:linear-gradient(135deg,var(--c2),var(--c3));color:#fff;font:inherit;font-size:1.3em;font-weight:800;cursor:pointer;margin:3px}
.lt:disabled{opacity:.25}
.floors{display:flex;flex-direction:column-reverse;gap:4px;width:70px;float:left;margin-right:14px}
.floor{height:30px;border-radius:6px;background:var(--box);border:1.5px solid var(--boxBorder);text-align:center;line-height:28px}
.floor.open{background:var(--okBg);border-color:var(--ok)}
table.board{width:100%;border-collapse:separate;border-spacing:6px;table-layout:fixed}
table.board th{background:var(--c1);color:#fff;border-radius:10px;padding:6px 2px;font-size:.78em;line-height:1.3}
table.board td button{width:100%;padding:12px 0;border-radius:10px;border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--c1);font:inherit;font-weight:800;cursor:pointer}
table.board td button:disabled{background:#e8e0f0;color:#b9a9cc}
.row{display:flex;align-items:center;gap:8px;background:var(--box);border:2px solid var(--boxBorder);border-radius:12px;padding:6px 12px;margin:6px 0}
.row span{flex:1;font-weight:700}
.row.ok{background:var(--okBg);border-color:var(--ok)}.row.no{background:var(--badBg);border-color:var(--bad)}
.arr{border:0;background:var(--c3);color:#fff;border-radius:8px;width:38px;height:34px;cursor:pointer;font-size:1em}
.baskets{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.item{font-size:1.4em;font-weight:800;text-align:center;background:var(--hl);border:2px solid var(--hlBorder);border-radius:14px;padding:16px;margin:10px 0}
.seg{cursor:pointer;border-radius:6px;padding:1px 3px}.seg:hover{background:var(--hl)}
.seg.fixed{background:var(--okBg);font-weight:700;cursor:default}
.path{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.st{width:64px;height:64px;border-radius:50%;border:3px solid var(--boxBorder);background:var(--box);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.72em;text-align:center;line-height:1.1;font-family:inherit;color:var(--txt)}
.st.done{background:var(--okBg);border-color:var(--ok)}.st.cur{background:var(--accent);border-color:var(--accent2);cursor:pointer}
.ring{display:flex;gap:6px;justify-content:center;margin:12px 0}
.ring i{width:40px;height:40px;border-radius:50%;border:3px solid var(--boxBorder);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800}
.ring i.done{background:var(--ok);border-color:var(--ok);color:#fff}
input.t,textarea.t{width:100%;font:inherit;padding:10px 12px;border:2px solid var(--boxBorder);border-radius:12px}
.heart{border:3px solid var(--boxBorder);border-radius:18px;padding:18px;background:var(--box);margin:10px 0}
.heart b{color:var(--c1);font-size:1.15em}
.keypad{direction:ltr}
.keypad button{width:56px;height:50px;margin:3px;border-radius:10px;border:0;background:var(--c3);color:#fff;font:inherit;font-size:1.2em;font-weight:800;cursor:pointer}
.code{font-size:2em;letter-spacing:10px;direction:ltr;text-align:center;font-weight:800;color:var(--c1)}
.sheet{border:2px dashed var(--c3);border-radius:14px;padding:16px;margin:12px 0}
.boxes{display:flex;gap:8px;justify-content:center;margin:10px 0}.boxes i{width:54px;height:60px;border:3px solid var(--c1);border-radius:8px;display:block}
#hub.hide,#stage.hide{display:none}
@media(max-width:560px){body{font-size:16px;padding:8px}.card{padding:16px}.mem{gap:5px}.mc{font-size:.68em}.baskets{grid-template-columns:1fr 1fr}}
@media print{@page{size:A4;margin:14mm}body{background:#fff;padding:0}.noprint,header.top{display:none!important}.card{box-shadow:none;padding:0}.sheet,.heart{break-inside:avoid}.pb{break-before:page}.hearts{display:grid;grid-template-columns:1fr 1fr;gap:8px}}

<script>
"use strict";
var C={"id":"kinnim","title":"קינים","sub":"דיני קורבנות העוף ותערובותיהם · המשחקים על פרק א׳","intro":"מסכת קינים עוסקת בקורבנות העוף: קן הוא זוג עופות, אחד לחטאת ואחד לעולה. המסכת דנה במה שקורה כשעופות של קורבנות שונים מתערבבים. המשחקים כאן על פרק א׳ בלבד, שבו כללי היסוד.","src":"המשנה: נוסח ספריא (תורת אמת).","end":{"hl":"«חטאת העוף נעשית למטה... עולת העוף נעשית למעלה» (א, א).","q":"קורבן העוף הוא הקטן שבקורבנות, ובכל זאת מסכת שלמה עוסקת בו בדיוק רב. איזה דבר קטן שאני נותן ראוי לכל תשומת הלב שלי?"},"games":[{"type":"sort","name":"למעלה או למטה?","desc":"שני סיבובים קצרים של מיון לפי המשנה הראשונה.","learn":"«חטאת העוף נעשית למטה, וחטאת בהמה למעלה. עולת העוף נעשית למעלה, ועולת הבהמה למטה. אם שינה בזה ובזה, פסול».\u003cbr>«איזהו נדר, האומר הרי עלי עולה. ואיזו היא נדבה, האומר הרי זו עולה. מה בין נדרים לנדבות? אלא שהנדרים, מתו או נגנבו, חייבים באחריותם. ונדבות, מתו או נגנבו, אין חייבים באחריותן» (א, א).","rounds":[{"title":"היכן נעשה הקורבן?","baskets":["למעלה","למטה"],"items":[["חטאת העוף",1,"«חטאת העוף נעשית למטה» (א, א)."],["חטאת בהמה",0,"«וחטאת בהמה למעלה» (א, א)."],["עולת העוף",0,"«עולת העוף נעשית למעלה» (א, א)."],["עולת בהמה",1,"«ועולת הבהמה למטה» (א, א)."]]},{"title":"נדר או נדבה?","baskets":["נדר","נדבה"],"items":[["האומר «הרי עלי עולה»",0,"«איזהו נדר, האומר הרי עלי עולה» (א, א)."],["האומר «הרי זו עולה»",1,"«ואיזו היא נדבה, האומר הרי זו עולה» (א, א)."],["מתו או נגנבו — חייב באחריותם",0,"«שהנדרים, מתו או נגנבו, חייבים באחריותם» (א, א)."],["מתו או נגנבו — אינו חייב באחריותן",1,"«ונדבות, מתו או נגנבו, אין חייבים באחריותן» (א, א)."]]}]},{"type":"quiz","name":"סדר קינים","desc":"שמונה שאלות על פרק א׳.","learn":"«סדר קינים כך הוא. החובה, אחד חטאת ואחד עולה. בנדרים ונדבות, כולן עולות» (א, א).\u003cbr>«חטאת שנתערבה בעולה ועולה בחטאת, אפילו אחד בריבוא, ימותו כולם» (א, ב).\u003cbr>חובה שנתערבה זו בזו: «אחת לזו ואחת לזו... מחצה כשר ומחצה פסול. אחת לזו ושתיים לזו... המועט כשר» (א, ג).","items":[["מהו סדר הקינים בחובה?","אחד חטאת ואחד עולה",["שניהם לשם חטאות","שניהם לשם עולות","אחד עולה ואחד אשם"],"«החובה, אחד חטאת ואחד עולה» (א, א)."],["ומה בנדרים ונדבות?","כולן עולות",["כולן חטאות","כולן שלמים","חצי וחצי"],"«בנדרים ונדבות, כולן עולות» (א, א)."],["עשה את חטאת העוף למעלה במקום למטה. מה הדין?","פסול",["כשר","ספק","ימות"],"«אם שינה בזה ובזה, פסול» (א, א)."],["חטאת שנתערבה בעולה, אפילו אחד בריבוא.","ימותו כולם",["יקרבו כולם","המועט כשר","מחצה כשר"],"«אפילו אחד בריבוא, ימותו כולם» (א, ב)."],["חובה שנתערבה בחובה: אחת לזו ואחת לזו.","מחצה כשר ומחצה פסול",["ימותו כולם, ואין תקנה","כולם כשרים לכתחילה","המועט כשר והשאר פסול"],"«מחצה כשר ומחצה פסול» (א, ג)."],["חובה שנתערבה בחובה: אחת לזו ושתיים לזו.","המועט כשר",["המרובה כשר","ימותו כולם","כולם כשרים"],"«אחת לזו ושתיים לזו... המועט כשר» (א, ג)."],["איזהו נדר?","האומר «הרי עלי עולה»",["האומר «הרי זו עולה»","האומר «הרי זו חטאת»","האומר «הרי עלי אשם»"],"«איזהו נדר, האומר הרי עלי עולה» (א, א)."],["מה בין נדרים לנדבות?","בנדרים חייב באחריותם",["בנדבות חייב באחריותן","נדרים קרבים רק בלילה","נדבות באות רק מן העוף"],"«שהנדרים, מתו או נגנבו, חייבים באחריותם» (א, א)."]]}]};
var stage=document.getElementById('stage'),hub=document.getElementById('hub');
document.getElementById('ttl').innerHTML='מסכת '+C.title+' — <span>שני משחקים</span>';document.getElementById('sub').textContent=C.sub;
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function $(s){return stage.querySelector(s)}
function $$(s){return [].slice.call(stage.querySelectorAll(s))}
function load(k,d){try{var v=localStorage.getItem(C.id+'_'+k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(C.id+'_'+k,JSON.stringify(v))}catch(e){}}
var timers=[];function later(f,ms){timers.push(setTimeout(f,ms))}function clearT(){timers.forEach(clearTimeout);timers=[]}
function head(g){return '<div class="bar noprint"><h2>'+g.name+'</h2><button class="btn sec" id="home">לתפריט</button></div>'}
function prog(p){return '<div class="prog noprint"><i style="width:'+Math.round(p*100)+'%"></i></div>'}
function bindHome(){var h=$('#home');if(h)h.onclick=showHub}
/* שאלה: התשובות מתערבבות בכל הצגה */
function ask(box,Q,cb){var o=sh([Q[1]].concat(Q[2])),first=true,lock=false;
  box.innerHTML='<div class="q">'+Q[0]+'</div><div class="opts">'+o.map(function(x){return '<button class="opt">'+x+'</button>'}).join('')+'</div><div id="fbx"></div>';
  [].forEach.call(box.querySelectorAll('.opt'),function(b,i){b.onclick=function(){if(lock)return;
    if(o[i]===Q[1]){lock=true;if(first){window.KT&&KT.ok();}b.classList.add('ok');box.querySelector('#fbx').innerHTML='<div class="fb ok">נכון. '+Q[3]+'</div><div class="center"><button class="btn" id="nx">המשך</button></div>';box.querySelector('#nx').onclick=function(){cb(first)}}
    else{window.KT&&KT.bad();first=false;b.classList.add('no');b.disabled=true;box.querySelector('#fbx').innerHTML='<div class="fb no">לא בדיוק. נסה שוב.</div>'}}});
}
function learnBtn(g){return g.learn?'<details class="noprint"><summary><b>להציץ בלימוד</b></summary><div class="hl">'+g.learn+'</div></details>':''}
function intro(g,go){stage.innerHTML=head(g)+(g.learn?'<h3>לומדים לפני שמשחקים</h3><div class="hl">'+g.learn+'</div>':'')+'<p>'+g.desc+'</p><div class="center"><button class="btn" id="go">מתחילים</button></div>';bindHome();$('#go').onclick=go}
function end(g,gi,msg){clearT();window.KT&&KT.end();var d=load('done',{});d[gi]=1;save('done',d);
  stage.innerHTML=head(g)+'<img class="mimg" src="https://yudataub.github.io/kol-toda-img-4/shas-games/kodashim/img/kinnim.webp" alt="מסכת קינים" width="1200" height="800"><div class="center"><div class="big">🎉</div><h2>'+msg+'</h2></div><div class="hl"><b>לזכור: </b>'+C.end.hl+'</div><div class="insp"><b>ומה זה אומר עליי? </b>'+C.end.q+'</div><div class="center"><button class="btn" id="ag">לשחק שוב</button></div>';bindHome();$('#ag').onclick=function(){run(gi)}}

var T={};
T.journey=function(g,gi){var N=g.stations.length,pos=load('pos'+gi,0),score=load('sc'+gi,0),tot=0;g.stations.forEach(function(s){tot+=s.q.length});if(pos>N){pos=0;score=0}
  function map(){ if(pos>=N)return g.order?order():fin();
    stage.innerHTML=head(g)+prog(pos/(N+1))+'<p>'+g.desc+' לחץ על התחנה הצהובה. ההתקדמות נשמרת.</p><div class="path">'+g.stations.map(function(s,i){return '<button class="st'+(i<pos?' done':i===pos?' cur':'')+'" '+(i===pos?'id="cur"':'disabled')+'>'+(i<pos?'✓ ':'')+s.t+'</button>'}).join('')+'</div>';bindHome();$('#cur').onclick=station}
  function station(){var s=g.stations[pos],k=0;
    function d(){ if(k>=s.q.length){pos++;save('pos'+gi,pos);save('sc'+gi,score);return map()}
      stage.innerHTML=head(g)+prog((pos+k/s.q.length)/(N+1))+'<h3>תחנה '+(pos+1)+': '+s.t+' <small>('+s.r+')</small></h3><div class="hl">'+s.x+'</div>'+(s.more?'<details><summary><b>'+s.more[0]+'</b></summary>'+s.more[1]+'</details>':'')+'<div id="qb"></div>';bindHome();
      ask($('#qb'),s.q[k],function(f){if(f)score++;k++;d()})} d()}
  function order(){var want=g.order,cur=sh(want);if(cur.join()===want.join())cur.reverse();
    function d(marks,msg){stage.innerHTML=head(g)+prog(N/(N+1))+'<h3>האתגר האחרון</h3><p>'+g.orderTitle+'</p>'+cur.map(function(x,k){return '<div class="row'+(marks?(x===want[k]?' ok':' no'):'')+'"><span>'+x+'</span><button class="arr" data-k="'+k+'" data-d="-1">▲</button><button class="arr" data-k="'+k+'" data-d="1">▼</button></div>'}).join('')+'<div class="center"><button class="btn" id="ck">בדיקה</button></div><div id="fbx">'+(msg||'')+'</div>';bindHome();
      $$('.arr').forEach(function(b){b.onclick=function(){var k=+b.dataset.k,j=k+(+b.dataset.d);if(j<0||j>=cur.length)return;var t=cur[k];cur[k]=cur[j];cur[j]=t;d()}});
      $('#ck').onclick=function(){var n=cur.filter(function(x,k){return x===want[k]}).length;if(n===cur.length){window.KT&&KT.ok();fin()}else d(true,'<div class="fb no">'+n+' מתוך '+cur.length+' במקומם. הירוקים במקומם — הזז את האדומים.</div>')}} d()}
  function fin(){var sc=score;save('pos'+gi,0);save('sc'+gi,0);end(g,gi,'השלמת את המסע! '+sc+' מתוך '+tot+' תשובות נכונות בניסיון הראשון.')}
  map();
};
T.quiz=function(g,gi){var items=sh(g.items),i=0,score=0;
  function nx(){ if(i>=items.length)return end(g,gi,score+' מתוך '+items.length+' תשובות נכונות בניסיון הראשון.');
    stage.innerHTML=head(g)+prog(i/items.length)+'<p>שאלה '+(i+1)+' מתוך '+items.length+'</p><div id="qb"></div>'+learnBtn(g);bindHome();ask($('#qb'),items[i],function(f){if(f)score++;i++;nx()})}
  intro(g,nx);
};
T.who=function(g,gi){var items=sh(g.items).slice(0,g.pick||8),r=0,score=0;
  function riddle(){ if(r>=items.length)return end(g,gi,'צברת '+score+' נקודות מתוך '+items.length*3+'.');var w=items[r],n=1,opts=sh([w].concat(sh(g.items.filter(function(x){return x!==w})).slice(0,5)));
    function d(msg){stage.innerHTML=head(g)+prog(r/items.length)+'<p>חידה '+(r+1)+' מתוך '+items.length+' · ניקוד: '+score+' · ניחוש עכשיו שווה <b>'+(4-n)+'</b> נקודות</p>'+w.c.slice(0,n).map(function(c,k){return '<div class="hl">רמז '+(k+1)+': '+c+'</div>'}).join('')+'<div class="center"><button class="btn sec" id="more" '+(n>=3?'disabled':'')+'>עוד רמז</button></div><div class="chipz">'+opts.map(function(o,i){return '<button class="chip" data-i="'+i+'">'+o.a+'</button>'}).join('')+'</div><div id="fbx">'+(msg||'')+'</div>';bindHome();
      $('#more').onclick=function(){n++;d()};
      $$('button.chip').forEach(function(b){b.onclick=function(){if(opts[+b.dataset.i]===w){window.KT&&KT.ok();score+=4-n;$('#fbx').innerHTML='<div class="fb ok"><b>'+w.a+'.</b> '+w.e+'</div><div class="center"><button class="btn" id="nx">המשך</button></div>';$$('button.chip').forEach(function(x){x.disabled=true});$('#more').disabled=true;$('#nx').onclick=function(){r++;riddle()}}
        else{window.KT&&KT.bad();b.classList.add('no');b.disabled=true;if(n<3){n++;d('<div class="fb no">לא אני. קיבלת עוד רמז.</div>')}else $('#fbx').innerHTML='<div class="fb no">לא אני. נסה שוב.</div>'}}});
    } d()}
  intro(g,riddle);
};
T.sort=function(g,gi){var r=0,score=0,tot=0;g.rounds.forEach(function(x){tot+=x.items.length});
  function round(){ if(r>=g.rounds.length)return end(g,gi,score+' מתוך '+tot+' מוינו נכון בניסיון הראשון.');var R=g.rounds[r],q=sh(R.items.map(function(it){return {it:it,first:true}})),n0=q.length,dn=0;
    function d(msg){ if(!q.length){r++;return round()}
      stage.innerHTML=head(g)+prog((r+dn/n0)/g.rounds.length)+'<p>סיבוב '+(r+1)+' מתוך '+g.rounds.length+' · '+R.title+'</p><div class="item">'+q[0].it[0]+'</div><div class="baskets">'+R.baskets.map(function(b,i){return '<button class="opt center" data-i="'+i+'">'+b+'</button>'}).join('')+'</div><div id="fbx">'+(msg||'')+'</div>'+learnBtn(g);bindHome();
      $$('.opt').forEach(function(b){b.onclick=function(){var x=q.shift();if(+b.dataset.i===x.it[1]){dn++;if(x.first){score++;window.KT&&KT.ok();}d('<div class="fb ok">נכון. '+x.it[2]+'</div>')}else{window.KT&&KT.bad();x.first=false;q.push(x);d('<div class="fb no">לא כאן. '+x.it[2]+' הפריט יחזור בהמשך.</div>')}}});
    } d()}
  intro(g,round);
};
T.pairs=function(g,gi){var ps=sh(g.pairs).slice(0,g.n||8),cards=[];ps.forEach(function(p,i){cards.push({i:i,x:p[0]});cards.push({i:i,x:p[1]})});
  function play(){cards=sh(cards);var open=[],hit=0,tries=0,lock=false;
    stage.innerHTML=head(g)+'<p>ניסיונות: <b id="tr">0</b></p><div class="mem">'+cards.map(function(c,k){return '<button class="mc" data-k="'+k+'">'+c.x+'</button>'}).join('')+'</div><div id="fbx"></div>'+learnBtn(g);bindHome();
    $$('.mc').forEach(function(b){b.onclick=function(){var k=+b.dataset.k;if(lock||b.classList.contains('up')||b.classList.contains('hit'))return;b.classList.add('up');open.push(k);
      if(open.length===2){tries++;$('#tr').textContent=tries;var a=open[0],c=open[1],els=$$('.mc');
        if(cards[a].i===cards[c].i){els[a].className=els[c].className='mc hit';hit++;window.KT&&KT.ok();$('#fbx').innerHTML='<div class="fb ok">'+ps[cards[a].i][2]+'</div>';open=[];if(hit===ps.length)later(function(){end(g,gi,'מצאת את כל הזוגות ב־'+tries+' ניסיונות.')},1600)}
        else{lock=true;later(function(){els[a].classList.remove('up');els[c].classList.remove('up');open=[];lock=false},1200)}}}});
  }
  intro(g,play);
};
T.vault=function(g,gi){var items=sh(g.items),i=0,score=0;
  function nx(){ if(i>=items.length)return end(g,gi,'הכספת נפתחה! '+score+' מתוך '+items.length+' מנעולים נפתחו בניסיון הראשון.');var it=items[i],typed='',err=0;
    function d(msg,solved){var fl='';for(var k=0;k<items.length;k++)fl+='<span class="chip'+(k<i||(solved&&k===i)?' ok':'')+'">'+(k<i||(solved&&k===i)?'🔓':'🔒')+'</span>';
      stage.innerHTML=head(g)+'<div class="chipz">'+fl+'</div><div class="q">'+it[0]+'</div><div class="code">'+(typed||'·')+'</div><div class="center keypad">'+[1,2,3,4,5,6,7,8,9,0].map(function(x){return '<button data-d="'+x+'" '+(solved?'disabled':'')+'>'+x+'</button>'}).join('')+'</div><div class="center"><button class="btn sec" id="cl" '+(solved?'disabled':'')+'>מחק</button><button class="btn" id="ok" '+(solved?'disabled':'')+'>פתח מנעול</button></div><div id="fbx">'+(msg||'')+'</div>'+learnBtn(g);bindHome();
      $$('.keypad button').forEach(function(b){b.onclick=function(){if(typed.length<4){typed+=b.dataset.d;d()}}});
      $('#cl').onclick=function(){typed='';d()};
      $('#ok').onclick=function(){if(typed===it[1]){if(!err){score++;window.KT&&KT.ok();}d('<div class="fb ok">נפתח! '+it[2]+'</div><div class="center"><button class="btn" id="nxt">המשך</button></div>',true);$('#nxt').onclick=function(){i++;nx()}}
        else{window.KT&&KT.bad();err++;typed='';d('<div class="fb no">המנעול לא נפתח.'+(err>=2?' רמז: במספר '+it[1].length+' ספרות. אפשר להציץ בלימוד למטה.':'')+'</div>')}};
    } d()}
  intro(g,nx);
};
T.fade=function(g,gi){var ti=0;
  function text(){ if(ti>=g.texts.length)return end(g,gi,'אמרת את המשנה בעל פה!');var tx=g.texts[ti],W=tx.text.split(' '),steps=[.25,.5,.75,1],r=0;
    function round(){ if(r>=steps.length){ti++;return text()}
      var n=Math.max(1,Math.round(W.length*steps[r])),hid=sh(W.map(function(_,i){return i})).slice(0,n).sort(function(a,b){return a-b}),got=0,peek=false;
      function d(msg){var cur=hid[got],seen={},bank=[];hid.slice(got).forEach(function(i){if(!seen[W[i]]){seen[W[i]]=1;bank.push(W[i])}});bank=sh(bank);
        stage.innerHTML=head(g)+prog((ti+r/steps.length)/g.texts.length)+'<p>'+tx.ref+' · סיבוב '+(r+1)+' מתוך '+steps.length+'. קרא בקול, והשלם את המילה המסומנת.</p><div class="hl" style="font-size:1.15em;line-height:2.3">'+W.map(function(w,i){var k=hid.indexOf(i);if(k<0||k<got||peek)return w;return '<span style="display:inline-block;min-width:3em;border-bottom:3px solid '+(i===cur?'var(--accent2)':'var(--boxBorder)')+';'+(i===cur?'background:#fff;':'')+'">&nbsp;</span>'}).join(' ')+'</div><div class="chipz">'+bank.map(function(w){return '<button class="chip">'+w+'</button>'}).join('')+'</div><button class="btn sec" id="pk">הצצה (3 שניות)</button><div id="fbx">'+(msg||'')+'</div>';bindHome();
        $('#pk').onclick=function(){peek=true;d();later(function(){peek=false;d()},3000)};
        $$('button.chip').forEach(function(b){b.onclick=function(){if(b.textContent===W[cur]){got++;if(got>=hid.length){window.KT&&KT.ok();r++;round()}else d()}else d('<div class="fb no">לא המילה הזו. נסה שוב, או הצץ.</div>')}});
      } d()}
    stage.innerHTML=head(g)+'<h3>'+tx.ref+'</h3><p>קרא את המשנה בקול פעמיים:</p><div class="hl" style="font-size:1.15em;line-height:2.1">'+tx.text+'</div><div class="center"><button class="btn" id="go">קראתי — מתחילים</button></div>';bindHome();$('#go').onclick=round}
  intro(g,text);
};
function summary(){var h='<h2>מסכת '+C.title+' — דף סיכום</h2><p>'+C.intro+'</p>';
  C.games.forEach(function(g){h+='<h3>'+g.name+'</h3>';if(g.type==='journey')h+=g.stations.map(function(s,i){return '<p><b>'+(i+1)+'. '+s.t+'</b> ('+s.r+') — '+s.x+'</p>'+(s.more?s.more[1]:'')}).join('');
    else if(g.type==='who')h+=g.items.map(function(w){return '<p><b>'+w.a+': </b>'+w.e+'</p>'}).join('');
    else if(g.type==='fade')h+=g.texts.map(function(t){return '<p><b>'+t.ref+': </b>'+t.text+'</p>'}).join('')+(g.learn||'');
    else h+=g.learn||''});
  return h+'<div class="insp"><b>ומה זה אומר עליי? </b>'+C.end.q+'</div><p><small>'+C.src+'</small></p>'}
function run(gi){clearT();var g=C.games[gi];hub.classList.add('hide');stage.classList.remove('hide');window.scrollTo(0,0);T[g.type](g,gi)}
function showHub(){clearT();stage.classList.add('hide');hub.classList.remove('hide');var d=load('done',{});
  hub.innerHTML='<div class="card"><img class="mimg noprint" src="https://yudataub.github.io/kol-toda-img-4/shas-games/kodashim/img/kinnim.webp" alt="מסכת קינים" width="1200" height="800"><h2 class="noprint">מה במסכת?</h2><p class="noprint">'+C.intro+'</p><p class="noprint"><small>'+C.src+'</small></p><div class="center noprint"><button class="btn sec" id="pr">דף סיכום להדפסה</button></div><div id="sum" style="display:none">'+summary()+'</div></div><div class="tiles noprint" style="grid-template-columns:repeat(auto-fill,minmax(240px,1fr))">'+C.games.map(function(g,i){return '<button class="tile'+(d[i]?' done':'')+'" data-i="'+i+'"><span class="n">'+(i+1)+'</span><b>'+g.name+'</b><small>'+g.desc+'</small></button>'}).join('')+'</div><div class="card noprint" style="margin-top:16px;text-align:center"><a class="btn sec" href="../index.html" style="text-decoration:none;display:inline-block">🎲 לכל משחקי הש״ס</a><div class="sign">הקול החמישי - הרב יהודה טאוב</div><div class="sign" style="margin-top:10px;font-weight:400;font-size:.95rem">📚 עוד חומרי לימוד במשנה – חינם, במאגר הקול החמישי: <a href="https://www.kol-toda.co.il/mishna/" target="_top">kol-toda.co.il/mishna</a><br>המאגר המלא: <a href="https://www.kol-toda.co.il/" target="_top">www.kol-toda.co.il</a></div></div>';
  [].forEach.call(hub.querySelectorAll('.tile'),function(t){t.onclick=function(){run(+t.dataset.i)}});
  document.getElementById('pr').onclick=function(){var s=document.getElementById('sum');s.style.display='';window.print();setTimeout(function(){s.style.display='none'},500)};window.scrollTo(0,0)}
window.KT&&KT.init({id:'shas-kinnim',title:'מסכת קינים',home:'../index.html',homeTxt:'🎲 לכל משחקי הש״ס',praise:window.KT_PRAISE,again:function(){showHub()}});
showHub();
</script>
