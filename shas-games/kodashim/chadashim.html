<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>סדר קדשים — המשחקים החדשים</title>
<style>
:root{--c1:#4b0082;--c2:#6a0dad;--c3:#8e44ad;--accent:#ffd700;--accent2:#ffb700;--box:#fdf6ff;--boxBorder:#d9b3ff;--hl:#fff8d6;--hlBorder:#f0c419;--insp:#e8f1ff;--inspBorder:#5b8def;--ok:#28a745;--okBg:#d4edda;--bad:#dc3545;--badBg:#f8d7da;--txt:#2d1b3d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","Arial Hebrew",Arial,sans-serif;background:linear-gradient(135deg,var(--c1),var(--c2) 50%,var(--c3));background-attachment:fixed;min-height:100vh;padding:14px;color:var(--txt);font-size:18px;line-height:1.7;direction:rtl;text-align:right}
.wrap{max-width:860px;margin:0 auto}
header.top{color:#fff;text-align:center;padding:18px 8px}
header.top h1{font-size:1.9em;line-height:1.3}header.top h1 span{color:var(--accent)}
.card{background:#fff;border-radius:22px;padding:22px;box-shadow:0 14px 40px rgba(0,0,0,.3);margin-bottom:16px}
h2{color:var(--c1);font-size:1.4em;margin-bottom:8px}
h3{color:var(--c2);margin:12px 0 6px}
.grp{color:#fff;font-weight:800;margin:16px 4px 8px;font-size:1.1em}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:#fff;border:0;border-radius:16px;padding:14px 10px;cursor:pointer;font:inherit;text-align:center;box-shadow:0 6px 16px rgba(0,0,0,.22);position:relative;color:var(--txt)}
.tile:hover{transform:translateY(-2px)}
.tile .n{display:inline-flex;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c3));color:var(--accent);font-weight:800;align-items:center;justify-content:center}
.tile b{display:block;color:var(--c1);margin-top:4px}
.tile small{color:#6b5a7a;display:block;line-height:1.3}
.tile.done::after{content:"✓";position:absolute;top:6px;left:10px;color:var(--ok);font-weight:900;font-size:1.2em}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.bar h2{flex:1;margin:0}
.btn{border:0;cursor:pointer;font:inherit;font-weight:800;padding:10px 20px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--c1);margin:4px}
.btn.sec{background:var(--box);border:2px solid var(--boxBorder);color:var(--c1)}
.btn:disabled{opacity:.4;cursor:default}
.prog{height:12px;background:var(--box);border:1.5px solid var(--boxBorder);border-radius:99px;overflow:hidden;margin:8px 0 14px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .3s}
.q{font-size:1.25em;font-weight:700;color:var(--c1);margin:10px 0}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--boxBorder);background:var(--box);border-radius:14px;padding:12px 16px;font:inherit;font-size:1.05em;cursor:pointer;text-align:right;color:var(--txt)}
.opt:hover{border-color:var(--c3)}
.opt.ok{background:var(--okBg);border-color:var(--ok)}.opt.no{background:var(--badBg);border-color:var(--bad)}
.opt.gone{visibility:hidden}
.fb{border-radius:14px;padding:12px 16px;margin-top:12px;font-weight:600}
.fb.ok{background:var(--okBg);border:2px solid var(--ok)}.fb.no{background:var(--badBg);border:2px solid var(--bad)}
.hl{background:var(--hl);border:2px solid var(--hlBorder);border-radius:14px;padding:12px 16px;margin:12px 0}
.insp{background:var(--insp);border:2px solid var(--inspBorder);border-radius:14px;padding:12px 16px;margin:12px 0}
.center{text-align:center}
.big{font-size:3em;line-height:1.2}
.chipz{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{background:var(--box);border:2px solid var(--boxBorder);border-radius:99px;padding:4px 14px;font-weight:700;font:inherit;color:var(--txt)}
button.chip{cursor:pointer}
.chip.ok{background:var(--okBg);border-color:var(--ok)}.chip.no{background:var(--badBg);border-color:var(--bad)}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mc{aspect-ratio:1/1;border-radius:12px;border:0;font:inherit;font-size:.82em;line-height:1.25;cursor:pointer;background:linear-gradient(135deg,var(--c1),var(--c3));color:transparent;padding:4px;overflow:hidden}
.mc.up{background:var(--box);color:var(--txt);border:2px solid var(--boxBorder)}
.mc.hit{background:var(--okBg);color:var(--txt);border:2px solid var(--ok)}
.track{display:flex;gap:4px;direction:ltr;margin:10px 0}
.cell{flex:1;height:44px;border-radius:8px;background:var(--box);border:1.5px solid var(--boxBorder);display:flex;align-items:center;justify-content:center;font-size:1.4em}
.cell.goal{background:var(--hl);border-color:var(--hlBorder)}
.slots{display:flex;gap:6px;justify-content:center;margin:12px 0;flex-wrap:wrap}
.slot{width:44px;height:52px;border-radius:10px;border:2px dashed var(--c3);display:flex;align-items:center;justify-content:center;font-size:1.5em;font-weight:800;background:#fff}
.lt{width:46px;height:46px;border-radius:10px;border:0;background:linear-gradient(135deg,var(--c2),var(--c3));color:#fff;font:inherit;font-size:1.3em;font-weight:800;cursor:pointer;margin:3px}
.lt:disabled{opacity:.25}
.floors{display:flex;flex-direction:column-reverse;gap:4px;width:70px;float:left;margin-right:14px}
.floor{height:30px;border-radius:6px;background:var(--box);border:1.5px solid var(--boxBorder);text-align:center;line-height:28px}
.floor.open{background:var(--okBg);border-color:var(--ok)}
table.board{width:100%;border-collapse:separate;border-spacing:6px;table-layout:fixed}
table.board th{background:var(--c1);color:#fff;border-radius:10px;padding:6px 2px;font-size:.78em;line-height:1.3}
table.board td button{width:100%;padding:12px 0;border-radius:10px;border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--c1);font:inherit;font-weight:800;cursor:pointer}
table.board td button:disabled{background:#e8e0f0;color:#b9a9cc}
.row{display:flex;align-items:center;gap:8px;background:var(--box);border:2px solid var(--boxBorder);border-radius:12px;padding:6px 12px;margin:6px 0}
.row span{flex:1;font-weight:700}
.row.ok{background:var(--okBg);border-color:var(--ok)}.row.no{background:var(--badBg);border-color:var(--bad)}
.arr{border:0;background:var(--c3);color:#fff;border-radius:8px;width:38px;height:34px;cursor:pointer;font-size:1em}
.baskets{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.item{font-size:1.4em;font-weight:800;text-align:center;background:var(--hl);border:2px solid var(--hlBorder);border-radius:14px;padding:16px;margin:10px 0}
.seg{cursor:pointer;border-radius:6px;padding:1px 3px}.seg:hover{background:var(--hl)}
.seg.fixed{background:var(--okBg);font-weight:700;cursor:default}
.path{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.st{width:64px;height:64px;border-radius:50%;border:3px solid var(--boxBorder);background:var(--box);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.72em;text-align:center;line-height:1.1;font-family:inherit;color:var(--txt)}
.st.done{background:var(--okBg);border-color:var(--ok)}.st.cur{background:var(--accent);border-color:var(--accent2);cursor:pointer}
.ring{display:flex;gap:6px;justify-content:center;margin:12px 0}
.ring i{width:40px;height:40px;border-radius:50%;border:3px solid var(--boxBorder);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800}
.ring i.done{background:var(--ok);border-color:var(--ok);color:#fff}
input.t,textarea.t,select.t{width:100%;font:inherit;padding:10px 12px;border:2px solid var(--boxBorder);border-radius:12px}
.heart{border:3px solid var(--boxBorder);border-radius:18px;padding:18px;background:var(--box);margin:10px 0}
.heart b{color:var(--c1);font-size:1.15em}
.keypad{direction:ltr}
.keypad button{width:56px;height:50px;margin:3px;border-radius:10px;border:0;background:var(--c3);color:#fff;font:inherit;font-size:1.2em;font-weight:800;cursor:pointer}
.code{font-size:2em;letter-spacing:10px;direction:ltr;text-align:center;font-weight:800;color:var(--c1)}
.sheet{border:2px dashed var(--c3);border-radius:14px;padding:16px;margin:12px 0}
.boxes{display:flex;gap:8px;justify-content:center;margin:10px 0}.boxes i{width:54px;height:60px;border:3px solid var(--c1);border-radius:8px;display:block}
#hub.hide,#stage.hide{display:none}
@media(max-width:560px){body{font-size:16px;padding:8px}.card{padding:16px}.mem{gap:5px}.mc{font-size:.68em}.baskets{grid-template-columns:1fr 1fr}}
@media print{@page{size:A4;margin:14mm}body{background:#fff;padding:0}.noprint,header.top{display:none!important}.card{box-shadow:none;padding:0}.sheet,.heart{break-inside:avoid}.pb{break-before:page}.hearts{display:grid;grid-template-columns:1fr 1fr;gap:8px}}
</style>

א מעל» (ה, ד) — מה שאינו שלי אינו שלי לתת."],["השתמשת בחפץ של אח או של חבר? בדוק שלא נפגם, ואמור תודה.","«כל דבר שיש בו פגם, לא מעל עד שיפגום» (ה, א) — המשנה שמה לב גם לפגם קטן."],["הסבר למישהו בבית מה ההבדל בין כוס של זהב לבין חלוק.","כוס של זהב אינה נפגמת בשימוש, וחלוק נפגם (ה, א)."],["תן היום פרוטה לצדקה.","מה שניתן לקודש — שייך לקודש."]]}]},{"id":"tamid","title":"תמיד","sub":"סדר עבודת היום בבית המקדש · כל שבעת הפרקים","intro":"מסכת תמיד מתארת יום שלם של עבודה בבית המקדש: מהשמירה בלילה, דרך הפיס, תרומת הדשן, שחיטת התמיד והקטורת — ועד שירת הלוויים.","src":"המשנה: נוסח ספריא (תורת אמת). הפירושים: רבנו עובדיה מברטנורא.","end":{"hl":"«זה הוא סדר התמיד לעבודת בית אלקינו, יהי רצון שיבנה במהרה בימינו, אמן» (ז, ג).","q":"«מימיו לא נתעצל הכהן מלהוציא את הדשן» (ב, ב) — עבודה שאיש אינו רואה. איזה דבר קטן אני עושה גם כשלא רואים אותי?"},"games":[{"type":"journey","name":"יום במקדש","desc":"12 תחנות, מהלילה ועד שירת הלוויים, ואתגר סידור בסוף.","orderTitle":"סדר את השלבים מהראשון (למעלה) עד האחרון.","order":["שומרים בלילה","הממונה בא ומפיסים","תרומת הדשן","מסדרים את המערכה","«ברקאי»","שחיטת התמיד","קריאת שמע בלשכת הגזית","הקטורת","ברכה, ניסוך ושיר"],"stations":[{"t":"שומרים בלילה","r":"א, א","x":"הלילה במקדש. «בשלושה מקומות הכוהנים שומרים בבית המקדש: בבית אבטינס, בבית הניצוץ ובבית המוקד». פרחי כהונה ישנים «איש כסתו בארץ», ואינם ישנים בבגדי קודש. ברטנורא: השמירה היא «מפני הכבוד, וגדולה היא לבית שלא יהא בלא שומרים».","q":[["בכמה מקומות הכוהנים שומרים בבית המקדש?","שלושה",["שניים","שבעה","חמישה"],"«בבית אבטינס, בבית הניצוץ ובבית המוקד» (א, א)."],["מי ישן בבית המוקד, ומה היה בידם?","זקני בית אב, ומפתחות העזרה",["פרחי כהונה, ושתי אבוקות","הלוויים, וכלי השיר שלהם","הממונה, ומחתת הכסף"],"«וזקני בית אב ישנים שם, ומפתחות העזרה בידם» (א, א)."]]},{"t":"הממונה בא ומפיסים","r":"א, ב","x":"מי שרוצה לתרום את המזבח «משכים וטובל עד שלא יבוא הממונה». «לא כל העתים שוות: פעמים שהוא בא מקריאת הגבר, או סמוך לו». הממונה דופק, והם פותחים לו. הוא אומר: «מי שטבל יבוא ויפיס».","q":[["באיזו שעה בא הממונה?","אין לו שעה קבועה",["תמיד בחצות הלילה","תמיד עם הנץ החמה","אחרי פתיחת השערים"],"«לא כל העתים שוות» (א, ב)."],["מהו «פיס»?","גורל",["טבילה","תפילה","משמרת"],"ברטנורא: «היו מטילין פיס ביניהן, הוא הגורל, ומי שבא לו הגורל הולך ותורם» (א, ב)."]]},{"t":"בודקים את העזרה","r":"א, ג","x":"הממונה פותח את הפשפש ונכנס מבית המוקד לעזרה, והכוהנים אחריו «ושתי אבוקות של אור בידם». «ונחלקו לשתי כיתות: אלו הולכים באכסדרא דרך המזרח, ואלו הולכים באכסדרא דרך המערב», עד שמגיעים למקום בית עושי חביתים.","q":[["איך בדקו הכוהנים את העזרה?","בשתי כיתות, למזרח ולמערב",["בשורה אחת, מצפון לדרום","כוהן אחד, לאור הנר","בשלוש כיתות, עם הלוויים"],"«ונחלקו לשתי כיתות» (א, ג)."],["מה אמרו כשנפגשו שתי הכיתות?","«שלום, הכל שלום»",["«ברקאי, ברקאי»","«הגיע עת, הגיע»","«הקטר, הקטר»"],"«הגיעו אלו ואלו, אמרו שלום, הכל שלום» (א, ג)."]]},{"t":"תרומת הדשן","r":"א, ד","x":"אומרים לזוכה: «היזהר שמא תיגע בכלי, עד שתקדש ידיך ורגליך מן הכיור». «אין אדם נכנס עמו, ולא נר בידו, אלא מהלך לאור המערכה». הוא נוטל את מחתת הכסף, עולה לראש המזבח וחותה מן הגחלים.","q":[["באיזה אור הלך הכוהן שתרם את הדשן?","לאור המערכה",["לאור האבוקות","לאור המנורה","לאור הנרות"],"«ולא נר בידו, אלא מהלך לאור המערכה» (א, ד)."],["במה הזהירו אותו שלא ייגע לפני שיקדש ידיו ורגליו?","בכלי",["במזבח","בכבש","בגחלים"],"«היזהר שמא תיגע בכלי». ברטנורא: «במחתה, שהיא כלי שרת» (א, ד)."]]},{"t":"מסדרים את המערכה","r":"פרק ב","x":"אחיו הכוהנים רצים ובאים, ומעלים את האפר אל התפוח שבאמצע המזבח. ברגלים לא היו מדשנים אותו, «מפני שהוא נוי למזבח». אחר כך מסדרים שתי מערכות. «כל העצים כשרין למערכה, חוץ משל זית ושל גפן. אבל באלו רגילין: במורביות של תאנה ושל אגוז ושל עץ שמן».","q":[["אילו עצים אינם כשרים למערכה?","של זית ושל גפן",["של תאנה ושל אגוז","של עץ שמן ושל ארז","של אגוז ושל גפן"],"«חוץ משל זית ושל גפן» (ב, ג)."],["למה ברגלים לא פינו את האפר מהתפוח?","מפני שהוא נוי למזבח",["מפני שאסור לעבוד ברגל","מפני שהכוהנים התעצלו","מפני שלא היה לו מקום"],"ברטנורא: «שיהיה נראה שקרבנות הרבה היו על גבי המזבח» (ב, ב)."]]},{"t":"«ברקאי»","r":"ג, א–ב","x":"הממונה אומר: «בואו והפיסו: מי שוחט, מי זורק, מי מדשן מזבח הפנימי, מי מדשן את המנורה». אחר כך: «צאו וראו אם הגיע זמן השחיטה». «אם הגיע, הרואה אומר: ברקאי. מתיא בן שמואל אומר: האיר פני כל המזרח». ברטנורא: שחיטה פסולה בלילה.","q":[["מה אומר הרואה כשהגיע זמן השחיטה?","«ברקאי»",["«שלום»","«הין»","«הקטר»"],"ברטנורא: «ברקאי — האיר והבריק השחר» (ג, ב)."],["מה דורש מתיא בן שמואל?","שיאיר פני כל המזרח",["שתזרח החמה כולה","שיאיר כנקודה בלבד","שייפתח השער הגדול"],"ברטנורא: «שאין מספיק כשהבריק כנקודה בלבד. והלכה כמתיא בן שמואל» (ג, ב)."]]},{"t":"מביאים את הטלה","r":"ג, ג–ד","x":"«צאו והביאו טלה מלשכת הטלאים». «נכנסו ללשכת הכלים, והוציאו משם תשעים ושלושה כלי כסף וכלי זהב. השקו את התמיד בכוס של זהב». אף על פי שהוא מבוקר מבערב, «מבקרין אותו לאור האבוקות».","q":[["כמה כלי כסף וזהב הוציאו מלשכת הכלים?","תשעים ושלושה",["שלושים ותשעה","שבעים ושניים","מאה ועשרים"],"«תשעים ושלושה כלי כסף וכלי זהב» (ג, ד)."],["במה השקו את התמיד?","בכוס של זהב",["בכוס של כסף","בכלי של אבן","בכוז של זהב"],"«השקו את התמיד בכוס של זהב» (ג, ד)."]]},{"t":"נפתח השער הגדול","r":"ג, ז–ח","x":"הכוהן נכנס דרך הפשפש הצפוני ופותח את השער הגדול של ההיכל. «לא היה שוחט השוחט, עד ששומע קול שער הגדול שנפתח». «מיריחו היו שומעין קול שער הגדול שנפתח» — וגם את קול המגרפה, החליל, הצלצל, השיר והשופר.","q":[["לאיזה קול חיכה השוחט לפני ששחט?","קול השער הגדול שנפתח",["קול המגרפה שנזרקה","קול השופר של הכוהנים","קול השיר של הלוויים"],"«עד ששומע קול שער הגדול שנפתח» (ג, ז)."],["מהיכן היו שומעים את קול השער הגדול?","מיריחו",["מחברון","ממכוור","משילה"],"«מיריחו היו שומעין» (ג, ח). ברטנורא: «ומירושלים עד יריחו עשר פרסאות»."]]},{"t":"שחיטת התמיד","r":"פרק ד","x":"«לא היו כופתין את הטלה, אלא מעקדין אותו». אחרי השחיטה והזריקה עומדים תשעה כוהנים בשורה: שישה באיברים ובקרביים, «השביעי בסולת, השמיני בחביתין, התשיעי ביין». «הלכו ונתנום מחצי הכבש ולמטה במערבו, ומלחום».","q":[["כמה כוהנים עמדו בשורה כדי להוליך את התמיד לכבש?","תשעה",["שישה","שבעה","שלושה"],"«השביעי בסולת, השמיני בחביתין, התשיעי ביין» (ד, ג)."],["מה עשו באיברים כשהניחו אותם על הכבש?","מלחו אותם",["שרפו אותם","רחצו אותם","כיסו אותם"],"«ונתנום מחצי הכבש ולמטה במערבו, ומלחום» (ד, ג)."]]},{"t":"קריאת שמע בלשכת הגזית","r":"ד, ג – ה, א","x":"«וירדו ובאו להם ללשכת הגזית, לקרות את שמע». הממונה אומר: «ברכו ברכה אחת». «קראו עשרת הדברים, שמע, והיה אם שמוע, ויאמר». אחר כך שלוש ברכות: אמת ויציב, ועבודה, וברכת כוהנים.","q":[["לאן ירדו הכוהנים לקרוא את שמע?","ללשכת הגזית",["לבית המוקד","ללשכת הטלאים","לבית אבטינס"],"«ללשכת הגזית, לקרות את שמע» (ד, ג)."],["מה קראו שם לפני «שמע»?","עשרת הדברים",["שירת הים","פרשת התמיד","שיר של יום"],"«קראו עשרת הדברים, שמע, והיה אם שמוע, ויאמר» (ה, א)."]]},{"t":"הקטורת","r":"ה, ב – ו, ג","x":"הממונה אומר: «חדשים לקטורת בואו והפיסו». ואילו להעלאת האיברים: «חדשים עם ישנים בואו והפיסו». מי שזכה בקטורת נוטל את הכף, ובתוכו הבזך. «לא היה המקטיר מקטיר עד שהממונה אומר לו: הקטר».","q":[["מי נקרא לפיס הקטורת?","«חדשים» בלבד",["«חדשים עם ישנים»","זקני בית אב","פרחי כהונה"],"«חדשים לקטורת בואו והפיסו» (ה, ב)."],["מתי התחיל המקטיר להקטיר?","כשהממונה אמר «הקטר»",["כששמע את המגרפה","כשנפתח השער הגדול","כשסיימו הלוויים"],"«עד שהממונה אומר לו, הקטר» (ו, ג)."]]},{"t":"ברכה, ניסוך ושיר","r":"פרק ז","x":"הכוהנים עומדים על מעלות האולם ומברכים את העם «ברכה אחת, אלא שבמדינה אומרים אותה שלוש ברכות, ובמקדש ברכה אחת». בניסוך היין: «והניף הסגן בסודרין, והקיש בן ארזא בצלצל, ודיברו הלוויים בשיר». «על כל פרק תקיעה, ועל כל תקיעה השתחוויה».","more":["השיר שהיו הלוויים אומרים במקדש (ז, ד)","\u003ctable style=\"width:100%;border-collapse:collapse\" border=\"1\" cellpadding=\"6\">\u003ctr>\u003ctd>\u003cb>ביום הראשון\u003c/b>\u003c/td>\u003ctd>לה׳ הארץ ומלואה, תבל ויושבי בה\u003c/td>\u003ctd>תהילים כד\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>בשני\u003c/b>\u003c/td>\u003ctd>גדול ה׳ ומהולל מאוד, בעיר אלקינו הר קדשו\u003c/td>\u003ctd>תהילים מח\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>בשלישי\u003c/b>\u003c/td>\u003ctd>אלקים ניצב בעדת אל, בקרב אלקים ישפוט\u003c/td>\u003ctd>תהילים פב\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>ברביעי\u003c/b>\u003c/td>\u003ctd>אל נקמות ה׳, אל נקמות הופיע\u003c/td>\u003ctd>תהילים צד\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>בחמישי\u003c/b>\u003c/td>\u003ctd>הרנינו לאלקים עוזנו, הריעו לאלקי יעקב\u003c/td>\u003ctd>תהילים פא\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>בשישי\u003c/b>\u003c/td>\u003ctd>ה׳ מלך גאות לבש\u003c/td>\u003ctd>תהילים צג\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>בשבת\u003c/b>\u003c/td>\u003ctd>מזמור שיר ליום השבת\u003c/td>\u003ctd>תהילים צב\u003c/td>\u003c/tr>\u003c/table>\u003cp>«מזמור שיר לעתיד לבוא, ליום שכולו שבת מנוחה לחיי העולמים» (ז, ד).\u003c/p>"],"q":[["כמה ברכות היא ברכת כוהנים במקדש?","ברכה אחת",["שלוש ברכות","שתי ברכות","שבע ברכות"],"«במדינה אומרים אותה שלוש ברכות, ובמקדש ברכה אחת» (ז, ב)."],["מה היה הסימן ללוויים להתחיל בשיר?","הסגן הניף בסודרים",["הממונה אמר «ברקאי»","נזרקה המגרפה","נפתח השער הגדול"],"«והניף הסגן בסודרין, והקיש בן ארזא בצלצל, ודיברו הלוויים בשיר» (ז, ג)."]]}],"old":true},{"type":"who","name":"מי אני?","desc":"כלים, מקומות ואנשים ממסכת תמיד. שלושה רמזים לכל חידה: מי שמזהה מוקדם מקבל יותר נקודות. 8 חידות מתוך 14.","pick":8,"items":[{"a":"בית המוקד","c":["אני כיפה, ובית גדול.","אני מוקף רובדים של אבן.","זקני בית אב ישנים אצלי, ומפתחות העזרה בידם."],"e":"«בית המוקד, כיפה, ובית גדול היה, מוקף רובדים של אבן» (א, א). ברטנורא: הרובדים הם «אצטבאות סביב של אבני גזית»."},{"a":"הממונה","c":["אין לי שעה קבועה לבוא.","אני דופק על הכוהנים, והם פותחים לי.","אני אומר: «מי שטבל יבוא ויפיס»."],"e":"«הממונה בא ודופק עליהם, והם פתחו לו» (א, ב)."},{"a":"התפוח","c":["אני נמצא באמצע המזבח.","ברגלים לא מפנים אותי, מפני שאני נוי למזבח.","אני ערימה של אפר, ופעמים יש עליי כשלוש מאות כור."],"e":"ברטנורא: «כמין כרי גדול של אפר שהיה באמצע המזבח צבור ועשוי כתפוח». ושלוש מאות כור — «גוזמא» (ב, ב)."},{"a":"ברקאי","c":["אומרים אותי ממקום גבוה שבמקדש.","פירושי: האיר והבריק השחר.","אותי אומר הרואה כשהגיע זמן השחיטה."],"e":"«אם הגיע, הרואה אומר, ברקאי» (ג, ב). ברטנורא: «צאו וראו — על מקום גבוה שהיה להם במקדש»."},{"a":"הטני","c":["אני של זהב, ומחזיק קביים וחצי.","אני דומה לסל, ופי רחב.","לתוכי נותנים את הדשן של המזבח הפנימי."],"e":"«הטני דומה לתרקב גדול של זהב, מחזיק קביים וחצי» (ג, ו). ברטנורא: «לשון ושמת בטנא. דומה לסל ופיו רחב»."},{"a":"הכוז","c":["אני של זהב.","אני דומה לקיתון גדול.","הניחו אותי על המעלה השנייה של האבן שלפני המנורה."],"e":"«והכוז דומה לקיתון גדול של זהב» (ג, ו). «והניח את הכוז על מעלה שנייה ויצא» (ג, ט)."},{"a":"המגרפה","c":["זורקים אותי בין האולם ולמזבח.","אין אדם שומע קול חברו בירושלים מפני קולי.","כוהן ששומע אותי יודע שאחיו נכנסים להשתחוות, והוא רץ ובא."],"e":"ברטנורא: «כלי גדול שהיו זורקים אותו כדי להשמיע קול» (ה, ו). גם את קולה שמעו מיריחו (ג, ח)."},{"a":"הפסכתר","c":["אני כלי גדול, מחזיקה לתך.","יש בי שתי שרשרות.","בשבת כופים אותי על הגחלים ועל השרץ."],"e":"«כופין אותה על גב גחלים ועל השרץ בשבת, ומורידין בה את הדשן מעל גבי המזבח» (ה, ה). ברטנורא: בשבת «אסור לכבות»."},{"a":"הבזך","c":["אני כף קטן.","יש לי כיסוי.","אני מלא וגדוש קטורת, ונתון בתוך הכף."],"e":"«והבזך היה בתוכו, מלא וגדוש קטורת» (ה, ד). ברטנורא: «כף קטן». הוא נתון בכף הגדול כדי שהקטורת לא תתפזר לארץ."},{"a":"בן ארזא","c":["שני כוהנים עם חצוצרות של כסף עומדים מימיני ומשמאלי.","כשהסגן מניף בסודרים — אני מתחיל.","אני מקיש בצלצל."],"e":"«והקיש בן ארזא בצלצל, ודיברו הלוויים בשיר» (ז, ג). ברטנורא: «שם אדם המקיש בצלצל»."},{"a":"גביני כרוז","c":["את קולי שמעו מיריחו.","אני כוהן.","בכל בוקר אני מכריז: «עמדו כוהנים לעבודתכם»."],"e":"«מיריחו היו שומעין קול גביני כרוז» (ג, ח). ברטנורא: «כהן ששמו גביני, שהיה מכריז בכל בוקר בבית המקדש»."},{"a":"בן קטין","c":["הייתי כוהן גדול.","עשיתי גלגל שמשקעים בו את הכיור בבור, כדי שמימיו לא ייפסלו בלינה.","את קול העץ שעשיתי — המוכני לכיור — שמעו מיריחו."],"e":"«קול העץ שעשה בן קטין מוכני לכיור» (א, ד; ג, ח). ברטנורא: «שם אדם וכהן גדול היה»."},{"a":"לשכת הגזית","c":["אליי ירדו הכוהנים אחרי שהציתו את שתי המערכות.","אצלי אמר הממונה: «ברכו ברכה אחת».","אליי באו הכוהנים לקרוא את שמע."],"e":"«וירדו ובאו להם ללשכת הגזית» (ב, ה). «וירדו ובאו להם ללשכת הגזית, לקרות את שמע» (ד, ג)."},{"a":"מחתת הכסף","c":["אני נתונה במקצוע, בין הכבש למזבח.","בי ח     else if(g.type==='fade')h+=g.texts.map(function(t){return '<p><b>'+t.ref+': </b>'+t.text+'</p>'}).join('')+(g.learn||'');
    else h+=g.learn||''});
  return h+'<div class="insp"><b>ומה זה אומר עליי? </b>'+C.end.q+'</div><p><small>'+C.src+'</small></p>'}
function run(gi){clearT();var g=C.games[gi];hub.classList.add('hide');stage.classList.remove('hide');window.scrollTo(0,0);T[g.type](g,gi)}
function showHub(){clearT();stage.classList.add('hide');hub.classList.remove('hide');var d=load('done',{});
  hub.innerHTML='<div class="card"><h2 class="noprint">מה במסכת?</h2><p class="noprint">'+C.intro+'</p><p class="noprint"><small>'+C.src+'</small></p><div class="center noprint"><button class="btn sec" id="pr">דף סיכום להדפסה</button></div><div id="sum" style="display:none">'+summary()+'</div></div><div class="tiles noprint" style="grid-template-columns:repeat(auto-fill,minmax(240px,1fr))">'+C.games.map(function(g,i){return '<button class="tile'+(d[i]?' done':'')+'" data-i="'+i+'"><span class="n">'+(i+1)+'</span><b>'+g.name+'</b><small>'+g.desc+'</small></button>'}).join('')+'</div>';
  [].forEach.call(hub.querySelectorAll('.tile'),function(t){t.onclick=function(){run(+t.dataset.i)}});
  document.getElementById('pr').onclick=function(){var s=document.getElementById('sum');s.style.display='';window.print();setTimeout(function(){s.style.display='none'},500)};window.scrollTo(0,0)}

var KU=["עזרת לי להבין","שמחתי ללמוד איתך","התמדת ולא ויתרת","שאלת שאלה טובה","חיכית לי בסבלנות","שיתפת אותי במשחק","הסברת יפה","פרגנת לאחרים"];
function gl(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function gs(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function head(g){return '<div class="bar noprint"><h2>'+g.name+' <small>· מסכת '+C.title+'</small></h2><button class="btn sec" id="home">לתפריט</button></div>'}
function showHub(){clearT();stage.classList.add('hide');hub.classList.remove('hide');var lit=0,h='';
  ALL.forEach(function(M,mi){var d=gl(M.id+'_done',{}),last=gl(M.id+'_last',0),nw=[];M.games.forEach(function(g,gi){if(!g.old)nw.push(gi)});
    var dn=nw.filter(function(gi){return d[gi]}).length,dim=dn>0&&last&&(Date.now()-last)/864e5>7;if(dn&&!dim)lit++;
    h+='<div class="grp">'+(dim?'🌙':dn?'✨':'')+' מסכת '+M.title+(dim?' — מתעמעמת <button class="btn" data-rv="'+mi+'" style="padding:4px 14px">חזרה קצרה</button>':'')+'</div><div class="tiles" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr));'+(dim?'opacity:.6':'')+'">'+nw.map(function(gi){var g=M.games[gi];return '<button class="tile'+(d[gi]?' done':'')+'" data-m="'+mi+'" data-g="'+gi+'"><b>'+g.name+'</b><small>'+g.desc+'</small></button>'}).join('')+'</div>'});
  var L=gl('kod_kudos',[]);
  hub.innerHTML='<div class="card"><h2>ארץ הידע שלי</h2><p>מסכת ששיחקת בה מוארת ✨. מסכת שלא חזרת אליה שבוע מתעמעמת 🌙, וחזרה קצרה של ארבע שאלות מאירה אותה מחדש. מוארות עכשיו: <b>'+lit+'</b> מתוך 11.</p></div>'+h+
   '<div class="card" style="margin-top:16px"><h2>לוח הפרגונים הכיתתי</h2><p>כל ילד יכול לשלוח שלושה פרגונים בשבוע. הלוח נשמר במחשב הזה בלבד.</p><label>השם שלי: <input class="t" id="kf" maxlength="20"></label><label>למי אני מפרגן: <input class="t" id="kt" maxlength="20"></label><label>הפרגון: <select class="t" id="ks">'+KU.map(function(k,i){return '<option value="'+i+'">'+k+'</option>'}).join('')+'</select></label><div class="center" style="margin-top:8px"><button class="btn" id="kb">שלח פרגון</button><button class="btn sec" id="kc">למורה: ניקוי הלוח</button></div><div id="km"></div><div id="kl" style="margin-top:10px">'+(L.length?L.slice().reverse().map(function(k){return '<div class="row"><span>💛 <b>'+esc(k.to)+'</b> — '+esc(KU[k.k])+'</span><small>מאת '+esc(k.from)+'</small></div>'}).join(''):'<p>עוד אין פרגונים. מי ראשון?</p>')+'</div></div><p style="color:#fff;text-align:center"><small>'+ALL[8].src+'</small></p><div class="card" style="margin-top:16px;text-align:center"><a class="btn sec" style="text-decoration:none;display:inline-block" href="../index.html">🎲 לכל משחקי הש״ס</a><div class="sign">הקול החמישי - הרב יהודה טאוב</div><div class="sign" style="margin-top:10px;font-weight:400;font-size:.95rem">📚 עוד חומרי לימוד במשנה – חינם, במאגר הקול החמישי: <a href="https://www.kol-toda.co.il/mishna/" target="_top">kol-toda.co.il/mishna</a><br>המאגר המלא: <a href="https://www.kol-toda.co.il/" target="_top">www.kol-toda.co.il</a></div></div>';
  [].forEach.call(hub.querySelectorAll('.tile'),function(t){t.onclick=function(){C=ALL[+t.dataset.m];run(+t.dataset.g)}});
  [].forEach.call(hub.querySelectorAll('[data-rv]'),function(b){b.onclick=function(){C=ALL[+b.dataset.rv];review()}});
  document.getElementById('kb').onclick=function(){var f=document.getElementById('kf').value.trim(),t=document.getElementById('kt').value.trim(),m=document.getElementById('km'),L=gl('kod_kudos',[]),d=new Date(),w=d.getFullYear()+'-'+Math.floor((d-new Date(d.getFullYear(),0,1))/6048e5);
    if(f.length<2||t.length<2){m.innerHTML='<div class="fb no">כתבו את שני השמות.</div>';return}
    if(L.filter(function(k){return k.from===f&&k.w===w}).length>=3){m.innerHTML='<div class="fb no">כבר שלחת שלושה פרגונים השבוע. נתראה בשבוע הבא!</div>';return}
    L.push({from:f,to:t,k:+document.getElementById('ks').value,w:w});gs('kod_kudos',L);showHub()};
  document.getElementById('kc').onclick=function(){if(confirm('למחוק את כל הפרגונים מהלוח?')){gs('kod_kudos',[]);showHub()}};
  window.scrollTo(0,0)}
window.KT&&KT.init({id:'shas-kodashim-chadashim',title:'סדר קדשים — המשחקים החדשים',home:'../index.html',homeTxt:'🎲 לכל משחקי הש״ס',praise:window.KT_PRAISE,again:function(){showHub()}});
showHub();
</script>
