<style>
  :root { --c1:#1f4e5f; --c2:#f2b134; --c3:#7a3e9d; --ok:#2e9e6b; --bad:#f4b183; --ink:#1d2b36; --paper:#fffaf0; }

  .sig { background:rgba(255,255,255,.12); border-radius:14px; padding:10px 16px; font-size:15px; margin-top:22px; }
  .sig a { color:#fde68a; }

let AC = null;

    o.connect(g); g.connect(AC.destination); o.start(s); o.stop(s + d);

  good: () => { tone(660, .15); tone(880, .25, "sine", .12, .12); },
  bad: () => tone(196, .3, "sine", .07),

  gold: () => [880, 1109, 1319, 1760].forEach((f, i) => tone(f, .18, "sine", .09, i * .08)),
  seal: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .35, "triangle", .11, i * .16)),

  } else {
    snd.bad(); img = ARI.ok;
    line = P.conf === 1 ? "יָדַעְתָּ שֶׁאֵינְךָ בָּטוּחַ – גַּם זוֹ חָכְמָה. הִנֵּה הַתְּשׁוּבָה:" : P.conf === 3 ? "טוֹב שֶׁבָּדַקְנוּ! בִּשְׁבִיל זֶה חוֹזְרִים לִפְנֵי הַמִּבְחָן:" : "עוֹד לֹא – הִנֵּה הַתְּשׁוּבָה הַנְּכוֹנָה:";
    if (!P.fix) { P.wrongNow.push(q); line += P.practice ? "" : " (הַשְּׁאֵלָה תַּחֲזֹר בְּסוֹף הַתַּחֲנָה)"; }
  }
  snap(true);
  $("#fb").innerHTML = `<div class="fb"><div class="row"><img class="ari" src="${img}" alt=""><div class="ln">${esc(line)}</div></div>
    <div class="ex">${md(q.ex)}</div><div class="m">${md(q.m)}</div><button class="big" id="nx">הָלְאָה ←</button></div>`;
  $("#nx").onclick = next;
  $("#nx").scrollIntoView({ behavior:"smooth", block:"nearest" });
}
function openTiles(n) {
  let d = 0;
  for (const k of P.order) {
    if (n <= 0 || P.open.length >= CAP) break;
    if (P.open.includes(k)) continue;
    P.open.push(k); n--;
    const el = document.querySelector(`.tiles b[data-k="${k}"]`);
    if (el) setTimeout(() => { el.classList.add("o"); snd.tile(); }, 250 + 350 * d++);
  }
  P.guessLock = false;
  const kn = $("#kn"); if (kn && !P.guessed && P.open.length >= 3) kn.disabled = false;
}
function openAll() { P.open = [...Array(NT).keys()]; document.querySelectorAll(".tiles b").forEach((el, k) => setTimeout(() => el.classList.add("o"), 80 * k)); }

/* ---------- ניחוש התמונה ---------- */
function guess(final, then) {
  const s = P.s, opts = shuf([s.cap, ...s.decoys]);
  const c = ov(`<h2>${final ? "🖼️ רֶגַע לִפְנֵי שֶׁהַתְּמוּנָה נִפְתַּחַת" : "💡 מָה מְצֻיָּר בַּתְּמוּנָה?"}</h2><p>${final ? "מָה לְדַעְתְּךָ מְצֻיָּר בָּהּ?" : "נִחוּשׁ נָכוֹן יִפְתַּח אֶת כָּל הַתְּמוּנָה כְּבָר עַכְשָׁו."}</p>
    <div class="opts">${opts.map(o => `<button data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div>${final ? "" : `<button class="ghost" id="cl">עוֹד לֹא, אֶפְתַּח עוֹד חֲלָקִים</button>`}`);
  if (!final) c.querySelector("#cl").onclick = ovClose;
  c.querySelectorAll(".opts button").forEach(b => b.onclick = () => {
    const ok = b.dataset.o === s.cap;
    if (final) { ovClose(); then(ok); return; }
    if (ok) {
      P.guessed = true; ovClose(); openAll(); snd.seal();
      if (S.run) { S.run.guessed = true; S.run.open = P.open.slice(); save(); }
      const kn = $("#kn"); if (kn) { kn.disabled = true; kn.textContent = "✓ נִחַשְׁתָּ"; }
      const g = document.querySelector(".goal"); if (g) g.textContent = "נִחַשְׁתָּ מֻקְדָּם! " + s.cap;
    } else {
      P.guessLock = true; snd.bad(); const kn = $("#kn"); if (kn) kn.disabled = true;
      c.innerHTML = `<div class="row"><img class="ari" src="${ARI.ok}" alt=""><div><b>עוֹד לֹא…</b><br>פְּתַח עוֹד חֵלֶק, וְתוּכַל לְנַחֵשׁ שׁוּב.</div></div><button class="big" id="cl2">מַמְשִׁיכִים</button>`;
      c.querySelector("#cl2").onclick = ovClose;
    }
  });
}

/* ---------- ארי מביא הפתעה ---------- */
function ariSurprise(then) {
  const f = P.ari.shift(); P.ariLast = P.idx;
  const c = ov(`<div class="row"><img class="ari" src="${ARI.hello}" alt=""><h2>תִּרְאֶה מָה מָצָאתִי!</h2></div><p class="q">${md(f.q)}</p><div id="aa"><button class="big" id="sh">🔍 לְגַלּוֹת</button></div>`);
  c.querySelector("#sh").onclick = () => {
    snd.gold();
    c.querySelector("#aa").innerHTML = `<div class="m" style="background:#fff3c9;border-radius:12px;padding:10px 14px">${md(f.a)}</div><button class="big" id="ct">חוֹזְרִים לַשְּׁאֵלוֹת</button>`;
    c.querySelector("#ct").onclick = () => { ovClose(); then(); };
  };
}

/* ---------- הלאה ---------- */
function next() {
  P.idx++;
  if (P.idx < P.queue.length) {
    if (!P.practice && !P.fix && P.ari.length && P.idx - P.ariLast > 2 && P.idx >= 2 && Math.random() < .4) return ariSurprise(renderQ);
    return renderQ();
  }
  if (!P.practice && !P.fix && P.wrongNow.length) {
    P.fix = true; P.queue = P.wrongNow.slice(); P.idx = 0; P.marks = [];
    const n = P.queue.length;
    const c = ov(`<div class="row"><img class="ari" src="${ARI.proud}" alt=""><h2>🔧 סִבּוּב תִּקּוּן</h2></div><p>${n === 1 ? "שְׁאֵלָה אַחַת חוֹזֶרֶת" : n + " שְׁאֵלוֹת חוֹזְרוֹת"} אֵלֶיךָ. עַכְשָׁו כְּבָר רָאִיתָ אֶת הַהֶסְבֵּר – בּוֹא נִרְאֶה מָה נִשְׁאַר בַּזִּכָּרוֹן.</p><button class="big" id="go">קָדִימָה</button>`);
    c.querySelector("#go").onclick = () => { ovClose(); renderQ(); };
    return;
  }
  P.practice ? endPractice() : endStation();
}

/* ---------- סוף תחנה ---------- */
function endStation() {
  const i = P.si, s = P.s, prev = S.st[i], n = s.qs.length;
  const stillWrong = P.wrongNow.map(q => q.id);
  S.st[i] = { done:true, first:Math.max(P.first, prev ? prev.first || 0 : 0), wrong:stillWrong };
  S.run = null; save(); cloudPush(i, P.first); VIEW = "end";
  const show = (g) => {
    window.scrollTo(0, 0);
    const nxt = D.stations[i + 1], all = doneN() === D.stations.length;
    let h = `<div class="top"><div class="ttl">${s.icon} ${esc(s.name)}</div>${sndBtn()}</div>
    <div class="board"><img src="${s.img}" alt=""></div>
    <div class="card"><div class="row"><img class="ari" src="${ARI.joy}" alt=""><div><div class="ln" style="font-weight:700;font-size:21px">${g === true ? "נִחַשְׁתָּ! " : g === false ? "הִנֵּה הַתְּמוּנָה: " : ""}${esc(s.capline)}</div></div></div>
    <p>יָדַעְתָּ <b>${P.first} מִתּוֹךְ ${n}</b> בַּפַּעַם הָרִאשׁוֹנָה${stillWrong.length ? `, וְחָזַרְתָּ עַל הַשְּׁאָר` : ""}.${prev && prev.done && P.first > prev.first ? ` בַּפַּעַם הַקּוֹדֶמֶת יָדַעְתָּ ${prev.first} – הִשְׁתַּפַּרְתָּ!` : ""}</p>
    <p>הַצִּיּוּן בַּתַּחֲנָה: <b style="font-size:24px;color:#1f4e5f">${grd(P.first, n)}</b>${ME ? " · נִשְׁמַר עַל שִׁמְךָ ✓" : ""}</p></div>
    <div class="scroll"><h2>📜 חוֹתָם ${i + 1} נִשְׁבַּר!</h2><div class="seal open new"><span class="n">✓</span><span><span class="v">׳${esc(s.verse)}׳</span> <span class="r">(${esc(s.vref)})</span></span></div></div>`;
    if (nxt) h += `<div class="card"><h2>וּמָה קָרָה אַחַר כָּךְ?</h2><div class="cliff">${esc(s.cliff)}</div>
      <p class="small">🚪 הַהֶמְשֵׁךְ מְחַכֶּה בַּתַּחֲנָה הַבָּאָה: <b>${nxt.icon} ${esc(nxt.name)}</b>. אֶפְשָׁר לְהַמְשִׁיךְ עַכְשָׁו, וְאֶפְשָׁר לַחֲזֹר מָתַי שֶׁתִּרְצֶה. הַמָּקוֹם נִשְׁמָר.</p>
      <button class="big" id="go">מַמְשִׁיכִים לַתַּחֲנָה הַבָּאָה ←</button><button class="ghost" id="bk">חֲזָרָה לַמַּפָּה</button></div>`;
    else h += `<button class="big" id="bk">${all ? "📜 אֶל הַמְּגִלָּה" : "חֲזָרָה לַמַּפָּה"}</button>`;
    $("#app").innerHTML = h; bindSnd(); snd.seal();
    if ($("#go")) $("#go").onclick = () => enter(i + 1);
    $("#bk").onclick = () => (!nxt && all) ? finale() : home();
  };
  if (P.guessed) show(null); else guess(true, show);
}
function endPractice() {
  VIEW = "end";
  const n = P.n, w = P.wrongNow.length;
  $("#app").innerHTML = `<div class="hero"><img class="ari lg" src="${w ? ARI.proud : ARI.joy}" alt=""><h1>${esc(P.title)}</h1></div>
  <div class="card center"><p style="font-size:24px"><b>${P.first} מִתּוֹךְ ${n}</b></p><p>${w ? "כָּל שְׁאֵלָה שֶׁטָּעִיתָ בָּהּ הִיא שְׁאֵלָה שֶׁעַכְשָׁו אַתָּה מַכִּיר טוֹב יוֹתֵר." : "יָדַעְתָּ אֶת הַכֹּל. אַתָּה מוּכָן! 💛"}</p>
  ${w ? `<button class="big" id="ag">🔧 לַחֲזֹר עַל ${w === 1 ? "הַשְּׁאֵלָה" : w + " הַשְּׁאֵלוֹת"} שֶׁטָּעִיתִי</button>` : ""}<button class="ghost" id="bk">חֲזָרָה לַמַּפָּה</button></div>`;
  const ws = P.wrongNow.slice(), t = P.title, fx = P.fixing;
  if ($("#ag")) $("#ag").onclick = () => startPractice(ws, t, fx);
  $("#bk").onclick = home;
}

/* ---------- הסיום: המגילה נפתחת ---------- */
function finale() {
  VIEW = "end"; window.scrollTo(0, 0);
  const tot = ALLQ.length, first = D.stations.reduce((a, s, i) => a + (S.st[i] ? S.st[i].first || 0 : 0), 0), w = wrongAll();
  let h = `<div class="top"><div class="ttl"></div>${sndBtn()}</div><div class="hero"><img class="ari lg" src="${ARI.grown}" alt=""><h1>📜 ${esc(D.scroll_title)} נִפְתְּחָה!</h1></div><div class="scroll">`;
  D.stations.forEach((s, i) => { h += `<div class="seal open new" style="animation-delay:${i * .5}s;animation-fill-mode:backwards"><span class="n">${i + 1}</span><span><span class="v">׳${esc(s.verse)}׳</span> <span class="r">(${esc(s.vref)})</span></span></div>`; });
  h += `</div><div class="card center"><p style="font-size:21px"><b>${esc(D.scroll_end)}</b></p><p style="font-size:22px">הַצִּיּוּן שֶׁלְּךָ: <b style="font-size:34px;color:#1f4e5f">${grd(first, tot)}</b></p><p>עָבַרְתָּ שֶׁבַע תַּחֲנוֹת, וְיָדַעְתָּ <b>${first} מִתּוֹךְ ${tot}</b> שְׁאֵלוֹת בַּפַּעַם הָרִאשׁוֹנָה.${ME ? " הַצִּיּוּן נִשְׁמַר עַל שִׁמְךָ ✓" : ""}</p>
    ${w.length ? `<button class="big" id="pw">🔧 לְתַרְגֵּל אֶת מָה שֶׁטָּעִיתִי (${w.length})</button>` : ""}<button class="ghost" id="bk">חֲזָרָה לַמַּפָּה</button></div>`;
  $("#app").innerHTML = h; bindSnd(); snd.seal();
  if ($("#pw")) $("#pw").onclick = () => startPractice(w.map(id => QBY[id]), "🔧 מְתַקְּנִים אֶת הַטָּעֻיּוֹת", true);
  $("#bk").onclick = home;
}
/* ---------- מצב מבחן (דף נפרד, לא ברשימות): שאלות ברצף, בלי רמזים ובלי משוב; ציון ופירוט הטעויות רק בסוף ---------- */
const EXQ = D.exam ? D.exam.ids.map(id => D.exam.qs.find(q => q.id === id)) : [];
function examHome() {
  ovClose(); VIEW = "exam"; window.scrollTo(0, 0);
  if (!ME) return who();   // מבחן רק עם שם
  const pr = S.exam, mid = !pr && S.ex && Array.isArray(S.ex.order) && S.ex.ans.length > 0 && S.ex.ans.length < EXQ.length;
  $("#app").innerHTML = `<div class="top"><div class="who">👤 ${esc(ME.name) + (ME.cls ? " · " + esc(ME.cls) : "")} <button id="sw">הַחֲלֵף תַּלְמִיד</button></div>${sndBtn()}</div>
  <div class="hero"><h1>${esc(D.title)}</h1><div class="sub">${esc(D.sub)}</div></div>
  <div class="card">${pr ? `<p class="center" style="font-size:22px">כְּבָר נִבְחַנְתָּ. הַצִּיּוּן שֶׁלְּךָ: <b style="font-size:40px;color:#1f4e5f">${pr.grade}</b></p><p class="center">אֶת הַמִּבְחָן עוֹשִׂים פַּעַם אַחַת, וְהַצִּיּוּן נִשְׁמַר עַל שִׁמְךָ.</p>`
    : `<p>לְפָנֶיךָ <b>${EXQ.length} שְׁאֵלוֹת</b>. עוֹנִים עַל כָּל שְׁאֵלָה פַּעַם אַחַת, בְּלִי רְמָזִים. אֶת הַמִּבְחָן עוֹשִׂים <b>פַּעַם אַחַת בִּלְבַד</b>. בַּסּוֹף תְּקַבֵּל צִיּוּן, וְתִרְאֶה אֶת הַהֶסְבֵּר לְכָל שְׁאֵלָה שֶׁטָּעִיתָ בָּהּ.</p>
  <button class="big" id="xs">${mid ? "▶ לְהַמְשִׁיךְ מֵהַמָּקוֹם שֶׁעָצַרְתָּ" : "מַתְחִילִים אֶת הַמִּבְחָן"}</button>`}</div>`;
  bindSnd(); $("#sw").onclick = who;
  const xs = $("#xs"); if (!xs) return;
  /* לכל תלמיד סדר שאלות אקראי משלו (order), שנשמר כדי שהמשך מאמצע יהיה באותו סדר */
  xs.onclick = () => { if (!mid) { S.ex = { ans:[], order:shuf([...Array(EXQ.length).keys()]) }; save(); } examQ(); };
  /* ניסיון אחד: בודקים גם בשרת אם התלמיד כבר נבחן (במחשב אחר). בלי רשת – מאפשרים להתחיל. */
  if (API && !mid) {
    const me = ME, lbl = xs.textContent; xs.disabled = true; xs.textContent = "רֶגַע…";
    const free = () => { if (ME === me && $("#xs") === xs) { xs.disabled = false; xs.textContent = lbl; } };
    const tm = setTimeout(free, 7000);
    try {
      fetch(API + "?action=me&name=" + enc(me.name) + "&cls=" + enc(me.cls) + "&school=" + enc(me.school)).then(r => r.json()).then(d => {
        clearTimeout(tm); const v = d && d.games ? d.games[D.exam.gid] : null;
        if (v == null || ME !== me) return free();
        const right = Math.max(0, Math.min(EXQ.length, Math.round(v / 10)));
        S.exam = { grade:grd(right, EXQ.length), right, n:EXQ.length }; S.ex = null; save(); if (VIEW === "exam" && $("#xs") === xs) examHome();
      }).catch(() => { clearTimeout(tm); free(); });
    } catch (e) { clearTimeout(tm); free(); }
  }
}
function examQ() {
  VIEW = "exam"; window.scrollTo(0, 0);
  const i = S.ex.ans.length, q = EXQ[S.ex.order[i]];
  if (!q) return examEnd();
  const opts = shuf(q.o.map((t, k) => ({ t, k }))), t0 = Date.now();
  $("#app").innerHTML = `<div class="top"><div class="ttl">שְׁאֵלָה ${i + 1} מִתּוֹךְ ${EXQ.length}</div>${sndBtn()}</div>
  <div class="meter"><i style="width:${Math.round(100 * i / EXQ.length)}%"></i></div>
  <div class="card"><div class="q">${md(q.t)}</div><div class="opts" id="op">${opts.map(o => `<button data-k="${o.k}">${md(o.t)}</button>`).join("")}</div></div>`;
  bindSnd();
  document.querySelectorAll("#op button").forEach(b => b.onclick = () => {
    if (Date.now() - t0 < 400 || b.disabled) return;
    document.querySelectorAll("#op button").forEach(x => x.disabled = true); b.classList.add("pick"); snd.tile();
    S.ex.ans.push(+b.dataset.k); save(); setTimeout(examQ, 350);
  });
}
function examEnd() {
  VIEW = "exam"; window.scrollTo(0, 0);
  const ans = S.ex.ans, QS = S.ex.order.map(k => EXQ[k]), right = QS.filter((q, i) => ans[i] === q.c).length, grade = grd(right, EXQ.length);
  S.exam = { grade, right, n:EXQ.length }; S.ex = null; save();
  if (API && ME) try { fetch(API, { method:"POST", headers:{ "Content-Type":"text/plain" }, body: JSON.stringify({ game:D.exam.gid, name:ME.name, cls:ME.cls, school:ME.school, score:right * 10, a:right, b:EXQ.length }) }).catch(() => {}); } catch (e) {}
  let h = `<div class="top"><div class="ttl"></div>${sndBtn()}</div><div class="hero"><img class="ari lg" src="${right === EXQ.length ? ARI.joy : ARI.proud}" alt=""><h1>${esc(D.title)}</h1></div>
  <div class="card center"><p style="font-size:22px">הַצִּיּוּן שֶׁלְּךָ: <b style="font-size:40px;color:#1f4e5f">${grade}</b></p><p>עָנִיתָ נָכוֹן עַל <b>${right} מִתּוֹךְ ${EXQ.length}</b> שְׁאֵלוֹת.${ME ? " הַצִּיּוּן נִשְׁמַר עַל שִׁמְךָ ✓" : ""}</p></div>`;
  QS.forEach((q, i) => { if (ans[i] !== q.c) h += `<div class="card"><span class="tag">שְׁאֵלָה ${i + 1}</span><div class="q">${md(q.t)}</div>
    <div class="opts"><button disabled class="badp">${md(q.o[ans[i]])}</button><button disabled class="good">${md(q.o[q.c])}</button></div><div class="fb"><div class="ex">${md(q.ex)}</div><div class="m">${md(q.m)}</div></div></div>`; });
  h += `<button class="ghost" id="bk">סִיּוּם</button>`;
  $("#app").innerHTML = h; bindSnd(); snd.seal(); $("#bk").onclick = examHome;
}
{ const last = lsGet(KEY + ":me"); if (last && last.name) { loadProfile(last); START(); cloudPull(); } else who(); }
</script>
