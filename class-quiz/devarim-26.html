window.KolBook = { n: PAGES, cur: () => pg, go, lock: b => { locked = !!b; document.body.classList.toggle("lock", locked); }, locked: () => locked };
window.KolQuiz = {
  live(d) {
    d = d || {};
    const r = String(d.run || "");
    if (r && r !== run) {
      const early = run === "" ? mine : null;   // תשובה שנשלחה לפני שהגיעו הנתונים הראשונים – עוברת לריצה
      run = r; loadMine();
      if (early) { Object.assign(mine, early); saveMine(); }
    }
    L = d; render();
  }
};
// בתוך הלוח של המורה (תצוגה מקדימה / מקרן): מודיעים מה התשובות הנכונות, ומקבלים עמוד ונתונים חיים.
if (window.parent !== window) {
  const hello = () => { try { window.parent.postMessage({ kolCQ: { id: CQ.id, t: CQ.title, N, c: CQ.qs.map(Q => Q.c), pod: !!CQ.pod, lb: LB(CQ.qs[0] || {}), sec: CQ.qs.map((Q, i) => secOf(i)) } }, "*"); } catch (e) {} };
  hello(); setTimeout(hello, 1500);
  addEventListener("message", e => {
    const d = e.data && e.data.kolCQ;
    if (!d || e.source !== window.parent) return;
    if (d.hello) hello();
    if (d.live) KolQuiz.live(d.live);
    if (d.pg != null) { KolBook.lock(true); go(d.pg); }
  });
}
// ?class=12345 – עוקבים ישר אחרי הדף המוצמד לכיתה: טאבלט או מקרן בלי התוכנה, וגם התצוגה בלוח
// (לוח ישן שלא שולח עמוד; בקבוצה הדף לא ב-state/lesson, ואז רק הלוח מעביר עמודים).
if (CLS && window.EventSource) {
  const es = new EventSource(`https://kol-kiosk-class-default-rtdb.europe-west1.firebasedatabase.app/classes/${CLS}/state/lesson.json`);
  let les = null;
  const same = u => { try { return new URL(u).pathname === location.pathname; } catch (e) { return false; } };
  const apply = () => { if (les && les.mode === "page" && same(les.url || "")) { KolBook.lock(true); KolQuiz.live({ ...(les.cq || {}), run: les.ts }); go(les.pg || 0); } };
  es.addEventListener("put", e => { const m = JSON.parse(e.data); if (m.path === "/") les = m.data; else if (les) { const k = m.path.slice(1).split("/"); let o = les; for (let i = 0; i < k.length - 1; i++) o = o[k[i]] = o[k[i]] || {}; o[k[k.length - 1]] = m.data; } apply(); });
  es.addEventListener("patch", e => { const m = JSON.parse(e.data); if (les && m.path === "/") Object.assign(les, m.data); apply(); });
}
render();
</script>
