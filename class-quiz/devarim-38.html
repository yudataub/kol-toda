// תלמיד בלי התוכנה: שם פעם אחת (נשמר בדפדפן). "רק צפייה" – למקרן או לצופה (או ?view=1 בקישור).

function go(i) { i = Math.max(0, Math.min(PAGES - 1, +i || 0)); if (SOLO) { pg = i; return; } if (i !== pg) { pg = i; render(); } }   // בתרגול: זוכרים את עמוד המורה, לא מציגים

// לא נשלח לכיתה; השיא נשמר בדפדפן (cq:solo:<id>).
const soloBest = v => { const k = "cq:solo:" + CQ.id; if (v == null) return +ls(k) || 0; if (v > (+ls(k) || 0)) ls(k, String(v)); };
function soloRender() {

      `<div class="sdots">${CQ.qs.map((Q, i) => `<span class="${S.a[i] === Q.c ? "y" : "x"}">${i + 1}</span>`).join("")}</div>` +
      (S.fix ? `<div class="note">🔧 אַחֲרֵי הַתִּקּוּן${S.first != null ? " · בַּסִּבּוּב הָרִאשׁוֹן: " + S.first : ""}</div>` : "") +
      (best ? `<div class="note">${pc > best ? "🎉 שִׂיא חָדָשׁ! (הַקּוֹדֵם: " + best + ")" : "הַשִּׂיא שֶׁלָּכֶם: " + Math.max(best, pc)}</div>` : "") +
      `<div class="sbtns">${wrong.length ? `<button class="solo-go" data-solo="fix">🔧 לְתַקֵּן אֶת הַטָּעֻיּוֹת (${wrong.length})</button>` : ""}<button class="solo-go${wrong.length ? " alt" : ""}" data-solo="start">🔁 עוֹד פַּעַם מֵהַהַתְחָלָה</button><button class="solo-go alt" data-solo="exit">↩ חֲזָרָה לַחִידוֹן</button></div>`;
  } else {
    const Q = CQ.qs[S.q], k = S.a[S.q], done = k != null;

    if (S.learn && Q.L) h += learnHtml(Q.L);
    h += `<div class="q">${rich(Q.t)}</div><div class="opts${done ? "" : " sopts"}">` + Q.o.map((o, j) =>
      `<button class="opt${done ? (j === Q.c ? " right" : j === k ? " wrong" : " dim") : ""}" data-sk="${j}"><span class="l">${LET[j]}</span><span class="tx">${esc(o)}${done && j === Q.c ? " ✔" : ""}</span></button>`).join("") + `</div>`;
    if (!done) h += `<div class="sbtns">${Q.L && !S.learn ? `<button class="solo-go alt" data-solo="learn">📖 לְהַצִּיג אֶת דַּף הַלִּמּוּד</button>` : ""}<button class="solo-go alt" data-solo="exit">✕ יְצִיאָה מֵהַתִּרְגּוּל</button></div>`;
    else h += (k === Q.c ? `<div class="note ok">✔ נָכוֹן! כׇּל הַכָּבוֹד</div>` : `<div class="note bad">✘ לֹא הַפַּעַם – הַתְּשׁוּבָה הַנְּכוֹנָה בַּיָּרֹק</div>`) +
      (Q.ex ? `<div class="box"><h3>💡 לָמָּה זוֹ הַתְּשׁוּבָה?</h3>${rich(Q.ex)}</div>` : "") + (Q.m ? `<div class="box m"><h3>🌱 מָה לוֹמְדִים מִזֶּה?</h3>${rich(Q.m)}</div>` : "") +
      `<button class="solo-go" data-solo="next">${S.pos + 1 < S.list.length ? (S.fix ? "לַטָּעוּת הַבָּאָה ←" : "לַשְּׁאֵלָה הַבָּאָה ←") : "🏁 לַצִּיּוּן"}</button>`;
  }
  if (h !== lastHtml) { lastHtml = h; $("stage").innerHTML = h; $("stage").scrollTop = 0; }
  const st = {}; CQ.qs.forEach((Q, i) => { if (S.a[i] != null) st[i] = S.a[i] === Q.c ? "y" : "x"; });
  const done = Object.keys(S.a).length;
  $("map").innerHTML = mapHtml(S.q < N ? S.q : -1, st, Math.round(done * 100 / N), N - done);
  milestone("solo", Math.round(done * 100 / N));
  layout(false);
}
$("stage").addEventListener("click", e => {
  const b = e.target.closest("[data-solo]");
  if (b) {
    const act = b.dataset.solo;
    if (act === "start" || act === "fix" || act === "exit") { clearTimeout(msT); $("ms").classList.remove("on"); }
    if (act === "start") { SOLO = { q: 0, a: {}, learn: false, list: CQ.qs.map((Q, i) => i), pos: 0 }; document.body.classList.add("solo"); }
    else if (act === "fix" && SOLO) {   // סיבוב תיקון: רק השאלות שטעו בהן; כל תיקון הופך את העיגול לירוק. לא נכנס לשיא.

    }
    else if (act === "exit") { SOLO = null; document.body.classList.remove("solo"); }
    else if (act === "next" && SOLO) { SOLO.pos++; SOLO.q = SOLO.pos < SOLO.list.length ? SOLO.list[SOLO.pos] : N; SOLO.learn = false; }
    else if (act === "learn" && SOLO) SOLO.learn = true;

  }
  const o = SOLO && e.target.closest(".sopts .opt");
  if (o && SOLO.a[SOLO.q] == null) { SOLO.a[SOLO.q] = +o.dataset.sk; sfx(SOLO.a[SOLO.q] === CQ.qs[SOLO.q].c ? "ok" : "bad"); lastHtml = ""; render(); }

if (window.parent !== window) {

// ?class=12345 – עוקבים ישר אחרי הדף המוצמד לכיתה: טאבלט או מקרן בלי התוכנה, וגם התצוגה בלוח
// (לוח ישן שלא שולח עמוד; בקבוצה הדף לא ב-state/lesson, ואז רק הלוח מעביר עמודים).

  let les = null;
  const same = u => { try { return new URL(u).pathname === location.pathname; } catch (e) { return false; } };
