<script>
const CQ = {"id": "devarim-14-cq", "title": "פָּרָשַׁת שְׁמַע", "sub": "חִידוֹן אֶתְגָּר כִּתָּתִי", "source": "חֻמַּשׁ דְּבָרִים, פֶּרֶק ו׳, פְּסוּקִים ד׳–ט׳ – שִׁעוּר 14", "verse": "שְׁמַע יִשְׂרָאֵל ה׳ אֱלֹהֵינוּ ה׳ אֶחָד", "theme": ["#1d4e89", "#f2b134", "#2a9d8f"], "pod": false, "intro": "12 שְׁאֵלוֹת אֶתְגָּר · מִשְּׁלֹשֶׁת הַסְּפָרִים", "sig": {"topic": "פָּרָשַׁת הַשָּׁבוּעַ", "url": "https://www.kol-toda.co.il/t/parasha.html"}, "books": {"a": "https://www.kol-toda.co.il/devarim-quiz/books/devarim-14-a.html", "b": "https://www.kol-toda.co.il/devarim-quiz/books/devarim-14-b.html", "c": "https://www.kol-toda.co.il/devarim-quiz/books/devarim-14-c.html"}, "qs": [{"t": "׳שֶׁלֹּא יִהְיֶה לִבְּךָ חָלוּק עַל הַמָּקוֹם׳ – עַל אֵיזוֹ מִלָּה בַּפָּסוּק כָּתַב רַשִׁ״י אֶת הַפֵּרוּשׁ הַזֶּה?", "o": ["וְהָיוּ הַדְּבָרִים הָאֵלֶּה... עַל לְבָבֶךָ", "בְּכָל מְאֹדֶךָ", "בְּכָל לְבָבְךָ", "בְּכָל נַפְשְׁךָ"], "c": 2, "ex": "עַל ׳בְּכָל לְבָבְךָ׳ יֵשׁ לְרַשִׁ״י **שְׁנֵי פֵּרוּשִׁים**: בִּשְׁנֵי יְצָרֶיךָ – גַּם בַּיֵּצֶר הַטּוֹב וְגַם בְּיֵצֶר הָרָע; וְ׳דָבָר אַחֵר׳: **שֶׁלֹּא יִהְיֶה לִבְּךָ חָלוּק עַל הַמָּקוֹם** – שֶׁהַלֵּב יַסְכִּים עִם מָה שֶׁה׳ עוֹשֶׂה.", "m": "מִי שֶׁאוֹהֵב בֶּאֱמֶת, סוֹמֵךְ עַל הָאָהוּב גַּם כְּשֶׁהוּא לֹא מֵבִין אֶת מַעֲשָׂיו.", "book": "ב"}, {"t": "דָּוִד הַמֶּלֶךְ אָמַר ׳כּוֹס יְשׁוּעוֹת אֶשָּׂא׳ וְגַם ׳צָרָה וְיָגוֹן אֶמְצָא׳. אֶת אֵיזֶה פֵּרוּשׁ שֶׁל רַשִׁ״י זֶה מוֹכִיחַ?", "o": ["׳בְּכָל מְאֹדֶךָ׳ – בְּכָל מָמוֹנְךָ", "׳בְּכָל נַפְשְׁךָ׳ – אֲפִלּוּ הוּא נוֹטֵל אֶת נַפְשְׁךָ", "׳בְּכָל לְבָבְךָ׳ – בִּשְׁנֵי יְצָרֶיךָ", "׳בְּכָל מְאֹדֶךָ׳ – בְּכָל מִדָּה וּמִדָּה שֶׁה׳ מוֹדֵד לְךָ"], "c": 3, "ex": "לְ׳בְּכָל מְאֹדֶךָ׳ יֵשׁ שְׁנֵי פֵּרוּשִׁים. הַשֵּׁנִי, אַחֲרֵי ׳דָּבָר אַחֵר׳: **בְּכָל מִדָּה וּמִדָּה שֶׁה׳ מוֹדֵד לְךָ** – גַּם בְּטוֹב וְגַם בְּקֹשִׁי. דָּוִד קוֹרֵא בְּשֵׁם ה׳ גַּם בְּ׳כּוֹס יְשׁוּעוֹת׳ וְגַם בְּ׳צָרָה וְיָגוֹן׳.", "m": "גַּם כְּשֶׁאֲנִי עָצוּב, אֲנִי יוֹדֵעַ שֶׁאַבָּא שֶׁבַּשָּׁמַיִם אוֹהֵב אוֹתִי 💛", "book": "ב"}, {"t": "׳וְשִׁנַ     return `<button class="${c}" data-k="${k}">${pc >= 0 ? `<span class="fill" style="width:${pc}%"></span>` : ""}<span class="l">${LET[k]}</span><span class="tx">${esc(o)}${mode === "res" && k === Q.c ? " ✔" : ""}</span>${pc >= 0 ? `<span class="pc">${pc}%</span>` : ""}</button>`;
  }).join("") + `</div>`;
}
function render() {
  const w = where(pg);
  let h = "", who = "";
  $("chip").classList.toggle("hidden", !("q" in w));
  if (w.cover) {
    h = `<div class="cover"><div class="sub">🎯 ${esc(CQ.sub)}</div><h1>${esc(CQ.title)}</h1><div class="verse">${esc(CQ.verse || "")}</div></div>
      <div class="big">${esc(CQ.intro || N + " שְׁאֵלוֹת")}</div><div class="wait">הַחִידוֹן יַתְחִיל בְּעוֹד רֶגַע…</div>`;
    who = whoHtml(false);
    $("prog").textContent = "";
  } else if (w.end) {
    const S = L.sum || {}, right = CQ.qs.filter((Q, i) => mine[i] === Q.c).length, ans = Object.keys(mine).length;
    h = `<div class="big">🏁 סִיּוּם הַחִידוֹן</div>` +
      (S.p != null ? `<div class="pct">${+S.p}%</div><div class="note">תְּשׁוּבוֹת נְכוֹנוֹת שֶׁל כָּל הַכִּתָּה</div>` : "") +
      (STUDENT && ans ? `<div class="me">עָנִיתָ נָכוֹן עַל ${right} מִתּוֹךְ ${N} 💛</div>` : "");
    const pod = Array.isArray(S.pod) ? S.pod : [];
    if (CQ.pod && pod.length) h += `<div class="pod">${[1, 0, 2].filter(i => pod[i]).map(i => `<div class="p${i + 1}">${["🥇", "🥈", "🥉"][i]}<br>${esc(pod[i][0])}<small>${+pod[i][1]} מִתּוֹךְ ${N}</small></div>`).join("")}</div>`;
    if (Array.isArray(S.aw) && S.aw.length) h += `<div class="aw">${S.aw.map(a => `<div>${esc(a[0])} <b>${esc(a[1])}</b>${a[2] ? `<small>${esc(a[2])}</small>` : ""}</div>`).join("")}</div>`;
    const sg = CQ.sig || { topic: "חֹמֶר תּוֹרָנִי", url: "https://www.kol-toda.co.il/search/" };
    h += `<div class="sig">📚 עוֹד חָמְרֵי לִמּוּד עַל ${esc(sg.topic)} – חִנָּם, בְּמַאֲגַר הַקּוֹל הַחֲמִישִׁי: <a href="${esc(sg.url)}" target="_blank" rel="noopener">${esc(sg.url.replace("https://www.", ""))}</a> · הַמַּאֲגָר הַמָּלֵא: <a href="https://www.kol-toda.co.il/" target="_blank" rel="noopener">kol-toda.co.il</a></div>`;
    $("prog").textContent = "";
  } else {
    const Q = CQ.qs[w.q];
    $("chip").textContent = ["שְׁאֵלָה", "עוֹנִים", "תּוֹצָאוֹת", "הֶסְבֵּר"][w.s];
    $("prog").textContent = `שְׁאֵלָה ${w.q + 1} מִתּוֹךְ ${N}` + (Q.book ? ` · סֵפֶר ${Q.book}׳` : "");
    h = `<div class="q">${rich(Q.t)}</div>`;
    if (w.s === 0) h += `<div class="wait">⏳ עוֹד רֶגַע יוֹפִיעוּ הַתְּשׁוּבוֹת…</div>`;
    if (w.s >= 2 && STUDENT && !revealed(w.q)) w.s = -1, h += `<div class="wait">⏳ רֶגַע…</div>`;
    if (w.s === 1) {
      h += optsHtml(w.q, "ans");
      if (STUDENT) h += `<div class="note">${mine[w.q] != null ? "✓ הַתְּשׁוּבָה נִשְׁלְחָה – אֶפְשָׁר לְשַׁנּוֹת עַד שֶׁהַמּוֹרֶה יַחְשֹׂף" : "בַּחֲרוּ תְּשׁוּבָה"}</div>`;
      who = whoHtml(true);
    }
    if (w.s === 2) {
      h += optsHtml(w.q, "res");
      const cnt = (L.cnt || {})[w.q], tot = cnt ? cnt.reduce((a, b) => a + (+b || 0), 0) : 0;
      if (tot) { const ok = Math.round((+cnt[Q.c] || 0) * 100 / tot); h += `<div class="big">✔ ${ok}% עָנוּ נָכוֹן · ✘ ${100 - ok}% טָעוּ</div>`; }
      if (STUDENT) h += mine[w.q] == null ? `<div class="note">לֹא עָנִיתָ עַל הַשְּׁאֵלָה הַזֹּאת</div>` : mine[w.q] === Q.c ? `<div class="note ok">✔ צָדַקְתָּ! כׇּל הַכָּבוֹד</div>` : `<div class="note bad">✘ לֹא הַפַּעַם – הַתְּשׁוּבָה הַנְּכוֹנָה בַּיָּרֹק</div>`;
    }
    if (w.s === 3) {
      h += `<div class="opts"><div class="opt right"><span class="l">${LET[Q.c]}</span><span class="tx">${esc(Q.o[Q.c])} ✔</span></div></div>` +
        (Q.ex ? `<div class="box"><h3>💡 לָמָּה זוֹ הַתְּשׁוּבָה?</h3>${rich(Q.ex)}</div>` : "") +
        (Q.m ? `<div class="box m"><h3>🌱 מָה לוֹמְדִים מִזֶּה?</h3>${rich(Q.m)}</div>` : "");
    }
  }
  if (h !== lastHtml) { lastHtml = h; $("stage").innerHTML = h; }   // בלי לבנות מחדש כשאין שינוי (גלילה, ריחוף)
  if ($("who").innerHTML !== who) $("who").innerHTML = who;
  $("who").classList.toggle("hidden", !who);
  $("stage").style.top = (who ? 48 + $("who").offsetHeight : 48) + "px";
  $("cnt").textContent = (pg + 1) + " מִתּוֹךְ " + PAGES;
  $("prv").disabled = pg <= 0; $("nxt").disabled = pg >= PAGES - 1;
}
$("stage").addEventListener("click", e => {
  const b = e.target.closest(".ans .opt"), w = where(pg);
  if (!b || !STUDENT || w.s !== 1 || cntRev(w.q)) return;
  const k = +b.dataset.k;
  mine[w.q] = k; saveMine(); render();
  try { W.postMessage(JSON.stringify({ kk: "cq", id: CQ.id, q: w.q, a: k })); } catch (e) {}
});
function go(i) { i = Math.max(0, Math.min(PAGES - 1, +i || 0)); if (i !== pg) { pg = i; render(); } }
$("nxt").onclick = () => { if (!locked) go(pg + 1); };
$("prv").onclick = () => { if (!locked) go(pg - 1); };
document.addEventListener("keydown", e => {
  if (locked) return;
  if (["ArrowLeft", "PageDown", " "].includes(e.key)) { e.preventDefault(); go(pg + 1); }
  if (["ArrowRight", "PageUp"].includes(e.key)) { e.preventDefault(); go(pg - 1); }
});
window.KolBook = { n: PAGES, cur: () => pg, go, lock: b => { locked = !!b; document.body.classList.toggle("lock", locked); }, locked: () => locked };
window.KolQuiz = {
  live(d) {
    d = d || {};
    const r = String(d.run || "");
    if (r && r !== run) {
      const early = run === "" ? mine : null;   // תשובה שנשלחה לפני שהגיעו הנתונים הראשונים – עוברת לריצה
      run = r; loadMine();
      if (early) { Object.assign(mine, early); saveMine(); }
    }
    L = d; render();
  }
};
// בתוך הלוח של המורה (תצוגה מקדימה / מקרן): מודיעים מה התשובות הנכונות, ומקבלים עמוד ונתונים חיים.
if (window.parent !== window) {
  const hello = () => { try { window.parent.postMessage({ kolCQ: { id: CQ.id, t: CQ.title, N, c: CQ.qs.map(Q => Q.c), pod: !!CQ.pod } }, "*"); } catch (e) {} };
  hello(); setTimeout(hello, 1500);
  addEventListener("message", e => {
    const d = e.data && e.data.kolCQ;
    if (!d || e.source !== window.parent) return;
    if (d.hello) hello();
    if (d.live) KolQuiz.live(d.live);
    if (d.pg != null) { KolBook.lock(true); go(d.pg); }
  });
}
// ?class=12345 – עוקבים ישר אחרי הדף המוצמד לכיתה: טאבלט או מקרן בלי התוכנה, וגם התצוגה בלוח
// (לוח ישן שלא שולח עמוד; בקבוצה הדף לא ב-state/lesson, ואז רק הלוח מעביר עמודים).
if (CLS && window.EventSource) {
  const es = new EventSource(`https://kol-kiosk-class-default-rtdb.europe-west1.firebasedatabase.app/classes/${CLS}/state/lesson.json`);
  let les = null;
  const same = u => { try { return new URL(u).pathname === location.pathname; } catch (e) { return false; } };
  const apply = () => { if (les && les.mode === "page" && same(les.url || "")) { KolBook.lock(true); KolQuiz.live({ ...(les.cq || {}), run: les.ts }); go(les.pg || 0); } };
  es.addEventListener("put", e => { const m = JSON.parse(e.data); if (m.path === "/") les = m.data; else if (les) { const k = m.path.slice(1).split("/"); let o = les; for (let i = 0; i < k.length - 1; i++) o = o[k[i]] = o[k[i]] || {}; o[k[k.length - 1]] = m.data; } apply(); });
  es.addEventListener("patch", e => { const m = JSON.parse(e.data); if (les && m.path === "/") Object.assign(les, m.data); apply(); });
}
render();
</script>
