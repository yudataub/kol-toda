<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="../parasha-games/kt-game.js"></script>
<title>ספר משלי — משחקי למידה</title>
<meta name="description" content="50 משחקי למידה באהבת ה׳ על ספר משלי">
<style>:root{--bg:#fffaf0;--ink:#2d2a4a;--soft:#5b4b8a;--p:#7c3aed;--p2:#ec4899;--a:#f59e0b;--ok:#16a34a;--bad:#e11d48;--card:#fff;--line:#eee6ff;--tint:#f6f1ff;--acc:#b45309;--acc2:#7c3aed}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17142a;--ink:#f1edff;--soft:#c9bdf5;--card:#221d3d;--line:#3a3166;--tint:#2b2450}}
:root[data-theme="dark"]{--bg:#17142a;--ink:#f1edff;--soft:#c9bdf5;--card:#221d3d;--line:#3a3166;--tint:#2b2450}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Rubik",Arial,sans-serif;line-height:1.55;overflow-x:hidden}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;touch-action:manipulation}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--p2);outline-offset:2px}
a{color:var(--p)}
.hdr{background:linear-gradient(135deg,var(--acc),var(--acc2) 60%,var(--a));color:#fff;text-align:center;padding:58px 16px 18px;position:relative}
.hdr h1{margin:0;font-size:clamp(1.5rem,5vw,2.3rem)}
.hdr p{margin:4px 0 0;opacity:.95}
.hdr .home{position:absolute;top:10px;right:12px;color:#fff;text-decoration:none;background:rgba(255,255,255,.2);padding:6px 12px;border-radius:12px;font-size:.9rem}
.wrap{max-width:1040px;margin:0 auto;padding:16px}
.intro{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:14px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.tools input,.tools select{flex:1;min-width:160px;font:inherit;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.stat{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.stat span{background:var(--tint);border-radius:12px;padding:6px 12px;font-weight:700;color:var(--soft)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.gc{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;text-align:right;color:var(--ink);display:flex;flex-direction:column;gap:4px;transition:transform .15s,box-shadow .15s}
.gc:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(80,50,160,.15)}
.gc .n{font-size:.8rem;color:var(--acc);font-weight:800}
.gc .t{font-weight:800;font-size:1.05rem}
.gc .m{font-size:.85rem;color:var(--soft)}
.gc .s{font-size:1rem;letter-spacing:2px}
.screen{max-width:820px;margin:0 auto;padding:14px 16px 40px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 6px 20px rgba(60,40,120,.08)}
.center{text-align:center}
.big{font-size:clamp(1.3rem,4.5vw,1.8rem);font-weight:800;margin:.2em 0}
.btn{background:var(--acc);color:#fff;padding:12px 22px;font-weight:800;font-size:1.05rem;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.alt{background:var(--a);color:#2d2a4a}
.btn.ghost{background:var(--tint);color:var(--soft);box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.hud{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.bar{flex:1;min-width:120px;height:14px;background:var(--tint);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .4s}
.pill{background:var(--tint);color:var(--soft);font-weight:800;border-radius:10px;padding:4px 10px;font-size:.92rem}
.q{font-size:clamp(1.1rem,3.8vw,1.35rem);font-weight:800;margin:6px 0 12px;text-align:center}
.opts{display:grid;gap:10px}
.opt{background:var(--tint);color:var(--ink);padding:13px 14px;font-size:1.05rem;font-weight:700;border:2px solid var(--line);text-align:center}
.opt:hover{border-color:var(--acc)}
.opt.ok{background:#dcfce7;border-color:var(--ok);color:#14532d}
.opt.no{background:#ffe4e6;border-color:var(--bad);color:#881337}
.opt[disabled]{cursor:default}
.vis{margin:0 0 12px}
.verse{font-family:"Frank Ruhl Libre","Times New Roman",serif;font-size:1.35rem;line-height:2}
.fb{position:fixed;inset:auto 0 0 0;z-index:50;display:flex;justify-content:center;padding:12px;animation:up .25s ease}
.fb .in{max-width:620px;width:100%;background:var(--card);border-radius:20px;padding:16px 18px;box-shadow:0 -6px 30px rgba(0,0,0,.25);border-top:6px solid var(--ok)}
.fb.bad .in{border-top-color:var(--a)}
.fb h3{margin:0 0 4px;font-size:1.15rem}
.fb p{margin:4px 0}
.fb .ex{color:var(--soft)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pop .35s ease}
.shake{animation:shake .3s}
.track{display:flex;gap:4px;align-items:center;justify-content:space-between;background:var(--tint);border-radius:16px;padding:10px;overflow:hidden}
.track .st{flex:1;height:34px;border-radius:10px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:1.3rem;border:2px dashed var(--line)}
.track .st.on{border-style:solid;border-color:var(--acc);background:#fff7d6}
.lane{position:relative;height:48px;background:var(--tint);border-radius:14px;margin:6px 0;overflow:hidden}
.lane b{position:absolute;top:6px;font-size:2rem;transition:right .5s;line-height:1}
.lane .fin{position:absolute;left:6px;top:8px;font-size:1.6rem}
.tiles{display:grid;gap:4px;margin:0 auto}
.tile{border-radius:8px;overflow:hidden;position:relative;background:var(--tint)}
.tile .cv{position:absolute;inset:0;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;transition:opacity .5s,transform .5s}
.tile.open .cv{opacity:0;transform:scale(.6)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.mc{min-height:86px;padding:8px;font-weight:700;font-size:.95rem;border:2px solid var(--line);background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.mc.up{background:var(--card);color:var(--ink)}
.mc.up.r{background:#fff7d6;color:#3b2a00}
.mc.done{background:#dcfce7;color:#14532d;border-color:var(--ok)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:28px;position:relative}
.cols .opt{font-size:.95rem;padding:10px}
.cols .opt.sel{border-color:var(--p2);box-shadow:0 0 0 3px rgba(236,72,153,.3)}
.cols svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.slots{display:grid;gap:8px;margin-bottom:12px}
.slot{min-height:46px;border:2px dashed var(--line);border-radius:12px;padding:8px 12px;display:flex;gap:8px;align-items:center;background:var(--card)}
.slot b{color:var(--acc);min-width:24px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:var(--tint);border:2px solid var(--line);padding:9px 12px;font-weight:700;color:var(--ink)}
.chip.sel{border-color:var(--p2);box-shadow:0 0 0 3px rgba(236,72,153,.3)}
.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.box{min-height:110px;border:3px dashed var(--acc);border-radius:16px;padding:8px;background:var(--card);color:var(--ink);font-weight:800;display:flex;flex-direction:column;align-items:center;gap:4px}
.box small{font-weight:600;font-size:.8rem;color:var(--soft)}
.ws{display:grid;gap:3px;direction:rtl;margin:0 auto;max-width:440px;user-select:none}
.ws button{aspect-ratio:1;background:var(--tint);color:var(--ink);font-weight:800;font-size:clamp(.95rem,3.6vw,1.25rem);border-radius:8px;padding:0}
.ws button.s{background:var(--p2);color:#fff}
.ws button.f{background:#bbf7d0;color:#14532d}
.kb{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;direction:rtl;margin-top:10px}
.kb button{width:38px;height:42px;background:var(--tint);color:var(--ink);font-weight:800;font-size:1.1rem}
.kb button[disabled]{opacity:.35}
.word{display:flex;gap:6px;justify-content:center;direction:rtl;margin:10px 0;flex-wrap:wrap}
.word span{width:40px;height:46px;border-bottom:4px solid var(--acc);display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:800}
.inp{font:inherit;font-size:1.2rem;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);text-align:center;width:min(280px,100%)}
.cw{display:grid;gap:8px}
.cw .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--tint);border-radius:12px;padding:8px}
.cw .r p{flex:1;min-width:180px;margin:0;font-weight:700}
.cw .r.done{background:#dcfce7;color:#14532d}
.sign{margin-top:16px;color:var(--soft);font-weight:700}
.stars{font-size:2.4rem;letter-spacing:6px}
.disc{background:#fff3d6;color:#3b2a00;border-radius:14px;padding:10px 14px;margin:12px 0;text-align:right}
.hole{aspect-ratio:1.3;background:radial-gradient(ellipse at 50% 85%,#6b4f2a 0 38%,transparent 40%),var(--tint);border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.hole button{animation:pop .3s;background:var(--a);color:#2d2a4a;font-weight:800;padding:8px;font-size:.92rem;max-width:95%}
.sea{position:relative;height:260px;background:linear-gradient(#bae6fd,#38bdf8 60%,#0369a1);border-radius:18px;overflow:hidden}
.fish{position:absolute;background:#fde68a;color:#3b2a00;font-weight:800;padding:8px 12px;border-radius:30px 12px 12px 30px;white-space:nowrap;font-size:.95rem;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.bingo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bingo button{min-height:70px;background:var(--tint);color:var(--ink);font-weight:700;border:2px solid var(--line);padding:6px;font-size:.92rem}
.bingo button.hit{background:#bbf7d0;color:#14532d;border-color:var(--ok)}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:300px;margin:0 auto}
.pads button{aspect-ratio:1;font-size:2.4rem;opacity:.55;transition:opacity .15s,transform .15s}
.pads button.lit{opacity:1;transform:scale(1.06)}
canvas{max-width:100%;border-radius:16px;background:var(--tint);display:block;margin:0 auto;touch-action:manipulation}
.duel{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duel .side{background:var(--tint);border-radius:16px;padding:10px}
.duel .side h4{margin:0 0 6px;text-align:center}
.ladder{display:flex;flex-direction:column-reverse;gap:3px;font-size:.85rem}
.ladder div{padding:3px 10px;border-radius:8px;background:var(--tint)}
.ladder div.on{background:var(--a);color:#2d2a4a;font-weight:800}
.mil{display:grid;grid-template-columns:1fr 130px;gap:12px}
@media(max-width:560px){.mil{grid-template-columns:1fr}.ladder{flex-direction:row-reverse;flex-wrap:wrap}.cols{gap:14px}.duel{grid-template-columns:1fr}}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.days button{padding:10px 4px;background:var(--tint);color:var(--ink);font-weight:800;border:2px solid var(--line)}
.days button.done{background:#dcfce7;color:#14532d}
.days button[disabled]{opacity:.45}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.album div{border-radius:12px;padding:8px;min-height:92px;text-align:center;font-size:.8rem;font-weight:700;border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center}
.album div.got{border:2px solid var(--a);background:linear-gradient(160deg,#fff7d6,#fde68a);color:#3b2a00;animation:pop .4s}
.album div b{font-size:1.8rem}
.tf{min-height:150px;display:flex;flex-direction:column;justify-content:center;touch-action:pan-y;transition:transform .2s}
.small{font-size:.88rem;color:var(--soft)}
.dice{font-size:2.6rem}
.board{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;direction:rtl}
.board div{aspect-ratio:1;border-radius:8px;background:var(--tint);display:flex;align-items:center;justify-content:center;font-size:1.2rem;position:relative}
.board div.me::after{content:"🧒";position:absolute;font-size:1.5rem}
.board div.end{background:#fde68a}
.teams{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.teams span{padding:6px 12px;border-radius:12px;background:var(--tint);font-weight:800}
.teams span.on{background:var(--a);color:#2d2a4a}
.hide{display:none!important}
.gpic{margin:-6px -6px 12px}.gpic img{width:100%;max-height:260px;object-fit:cover;border-radius:16px;display:block}.gthumb{margin:-4px -4px 8px}.gthumb img{width:100%;height:120px;object-fit:cover;border-radius:12px;display:block}</style><meta property="og:title" content="ספר משלי — משחקי למידה">

function within(arr,g,getCh,n){
 var inR=arr.filter(function(x){var c=getCh(x);return c>=g.f&&c<=g.t});
 inR=shuf(inR);
 if(inR.length>=n)return inR.slice(0,n);
 var used=inR.slice(),lo=g.f,hi=g.t,max=B.chapters;
 while(used.length<n&&(lo>1||hi<max)){lo--;hi++;
  var more=shuf(arr.filter(function(x){var c=getCh(x);return (c===lo||c===hi)&&used.indexOf(x)<0}));
  used=used.concat(more)}
 return used.slice(0,n)}
function pool(g,kind,n){
 var I=B.items;
 if(kind==="q")return within(I,g,function(x){return x.c},n);
 if(kind==="s"){var s=I.filter(function(x){return x.k==="s"});var r=within(s,g,function(x){return x.c},n);if(r.length<n)r=r.concat(within(I.filter(function(x){return r.indexOf(x)<0}),g,function(x){return x.c},n-r.length));return r}
 if(kind==="w")return within(I.filter(function(x){return x.w}),g,function(x){return x.c},n);
 if(kind==="v")return within(B.verses,g,function(x){return x.c},n);
 if(kind==="who")return within(B.who,g,function(x){return x.c},n);
 if(kind==="seq")return within(B.seq,g,function(x){return x.f},n);
 if(kind==="cats")return within(B.cats,g,function(x){return x.f},n);
 if(kind==="said")return within(B.said,g,function(x){return x.c},n);
 if(kind==="syn")return within(B.syn,g,function(x){return x.c},n);
 return []}
function pairsFor(g,pref,n){

 if(pref==="said")P=pool(g,"said",n).map(function(s){return {l:s.s,r:s.q,ex:s.ex||""}});
 if(pref==="syn")P=pool(g,"syn",n).map(function(s){return {l:s.a,r:s.b,ex:s.t?("זוג "+s.t):""}});
 if(pref==="verse")P=pool(g,"v",n).filter(function(v){return v.w.length>3}).map(function(v){return {l:v.w.slice(0,v.h).join(" "),r:v.w.slice(v.h).join(" "),ex:"("+v.r+")",verse:1}});
 if(P.length<n){var used={};P.forEach(function(p){used[p.r]=1});
  pool(g,"q",n*2).forEach(function(x){if(P.length<n&&!used[x.a]){used[x.a]=1;P.push({l:x.q,r:x.a,ex:x.ex})}})}
 return P.slice(0,n)}
