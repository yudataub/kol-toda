<title>לוח ניקוד חיובי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Suez+One&family=Rubik:wght@400;500;600;700&family=Heebo:wght@300;400;500;700&display=swap">
<style>
:root{
  --paper:#efe9db; --paper-2:#e7e0ce;
  --card:#fcfaf3; --card-2:#f5efe1; --card-hi:#eef6f1;
  --line:#ded3bb; --line-soft:#eae2ce;
  --ink:#20302a; --ink-2:#5d6d64; --ink-3:#8a978d;
  --board-1:#17352f; --board-2:#0e2420; --board-line:#2c4d45;
  --chalk:#eaf1ec; --chalk-2:#9db8ad; --chalk-3:#71918a;
  --wood-1:#a97f4c; --wood-2:#7d5a31;
  --teal:#2c8b78; --teal-soft:#dcece6;
  --coral:#cf5f3e; --coral-soft:#f7e2da;
  --gold:#b5842a; --indigo:#4a5fa5; --olive:#688734; --plum:#8a4f78;
  --focus:#c9932f;
  --shadow:0 6px 18px rgba(20,45,38,.09);
  --shadow-lg:0 26px 70px rgba(9,26,22,.34);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f1a17; --paper-2:#0b1412;
    --card:#16241f; --card-2:#1c2c26; --card-hi:#17302a;
    --line:#2b3d35; --line-soft:#21322b;
    --ink:#e3ebe5; --ink-2:#a2b4a9; --ink-3:#7a8c82;
    --board-1:#132a25; --board-2:#0a1917; --board-line:#274942;
    --chalk:#eaf1ec; --chalk-2:#9db8ad; --chalk-3:#7b9a92;
    --wood-1:#6d4f2e; --wood-2:#4a331b;
    --teal:#4fb79f; --teal-soft:#16332c;
    --coral:#e8815f; --coral-soft:#37201a;
    --gold:#d6a341; --indigo:#8b9ade; --olive:#9cc05c; --plum:#c58cb2;
    --focus:#e0b862;
    --shadow:0 6px 18px rgba(0,0,0,.4);
    --shadow-lg:0 26px 70px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --paper:#0f1a17; --paper-2:#0b1412;
  --card:#16241f; --card-2:#1c2c26; --card-hi:#17302a;
  --line:#2b3d35; --line-soft:#21322b;
  --ink:#e3ebe5; --ink-2:#a2b4a9; --ink-3:#7a8c82;
  --board-1:#132a25; --board-2:#0a1917; --board-line:#274942;
  --chalk:#eaf1ec; --chalk-2:#9db8ad; --chalk-3:#7b9a92;
  --wood-1:#6d4f2e; --wood-2:#4a331b;
  --teal:#4fb79f; --teal-soft:#16332c;
  --coral:#e8815f; --coral-soft:#37201a;
  --gold:#d6a341; --indigo:#8b9ade; --olive:#9cc05c; --plum:#c58cb2;
  --focus:#e0b862;
  --shadow:0 6px 18px rgba(0,0,0,.4);
  --shadow-lg:0 26px 70px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  direction:rtl; margin:0; background:var(--paper); color:var(--ink);
  font-family:'Heebo',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:15.5px; line-height:1.7; letter-spacing:-.005em;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}

/* ---------- לוח הכיתה ---------- */
.board{
  position:sticky; top:0; z-index:60;
  background:
    radial-gradient(680px 200px at 78% -30%, rgba(233,241,236,.10), transparent 70%),
    radial-gradient(420px 160px at 12% 120%, rgba(233,241,236,.07), transparent 70%),
    linear-gradient(160deg,var(--board-1),var(--board-2));
  color:var(--chalk);
  border-bottom:1px solid rgba(0,0,0,.35);
}
.board-in{max-width:1180px;margin:0 auto;padding:14px 20px 12px;display:flex;flex-direction:column;gap:12px}
.board-top{display:flex;align-items:flex-start;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{
  font-family:'Suez One',Georgia,serif; font-weight:400; font-size:1.42rem;
  margin:0; letter-spacing:-.01em; text-shadow:0 1px 0 rgba(255,255,255,.14);
}
.brand .sub{font-size:.78rem;color:var(--chalk-2);letter-spacing:.02em}
.board-actions{margin-inline-start:auto;display:flex;gap:8px;align-items:center}
.icon-btn{
  background:rgba(233,241,236,.09); color:var(--chalk); border:1px solid rgba(233,241,236,.18);
  border-radius:9px; padding:6px 11px; font-size:.82rem; cursor:pointer; white-space:nowrap;
  transition:background .15s,border-color .15s;
}
.icon-btn:hover{background:rgba(233,241,236,.17)}

/* מד היחס — משורטט בגיר */
.gauge{min-width:270px;flex:1 1 270px;max-width:400px}
.gauge-head{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.gauge-val{font-family:'Suez One',serif;font-size:1.5rem;line-height:1.1}
.gauge-val small{font-size:.62em;color:var(--chalk-2);font-family:'Rubik',sans-serif}
.gauge-tag{
  font-size:.72rem;font-weight:600;padding:2px 9px;border-radius:999px;
  border:1px solid currentColor; font-family:'Rubik',sans-serif;
}
.tag-good{color:#8fe0c4} .tag-mid{color:#f0cf7e} .tag-low{color:#f6a184}
.gauge-track{
  position:relative;height:11px;border-radius:999px;margin-top:7px;
  background:rgba(255,255,255,.10); border:1px solid rgba(233,241,236,.16);
}
.gauge-fill{position:absolute;top:1px;bottom:1px;right:1px;border-radius:999px;
  background:linear-gradient(90deg,#3aa78f,#7fd3ba);transition:width .35s ease}
.gauge-mark{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--chalk);opacity:.8;border-radius:2px}
.gauge-mark::after{content:'יעד 5:1';position:absolute;top:-17px;right:50%;transform:translateX(50%);
  font-size:.63rem;color:var(--chalk-2);white-space:nowrap;font-family:'Rubik',sans-serif}
.gauge-legend{margin-top:9px;font-size:.76rem;color:var(--chalk-2);display:flex;gap:12px;flex-wrap:wrap}
.gauge-legend b{color:var(--chalk);font-weight:600}

/* צ'יפים של כיתות */
.classes{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.chip{
  background:transparent;border:1px solid rgba(233,241,236,.24);color:var(--chalk-2);
  border-radius:999px;padding:5px 14px;font-size:.86rem;cursor:pointer;font-family:'Rubik',sans-serif;
  display:inline-flex;align-items:center;gap:7px;transition:.15s;
}
.chip:hover{border-color:rgba(233,241,236,.5);color:var(--chalk)}
.chip.on{background:var(--chalk);color:var(--board-2);border-color:var(--chalk);font-weight:600}
.chip .cnt{font-size:.74em;opacity:.7}
.chip-add{border-style:dashed;padding:5px 12px}
.ledge{height:7px;background:linear-gradient(180deg,var(--wood-1),var(--wood-2));
  box-shadow:0 3px 7px rgba(0,0,0,.28)}

/* ---------- סרגל כלים ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:18px 20px 70px}
.tools{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.search{position:relative;flex:1 1 210px;max-width:300px}
.search input{
  width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:8px 34px 8px 12px;font-size:.9rem;
}
.search::before{content:'⌕';position:absolute;right:11px;top:50%;transform:translateY(-50%);
  color:var(--ink-3);font-size:1.1rem;pointer-events:none}
.btn{
  background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 13px;
  font-size:.87rem;cursor:pointer;white-space:nowrap;font-family:'Rubik',sans-serif;
  display:inline-flex;align-items:center;gap:6px;transition:.15s;
}
.btn:hover{background:var(--card-2);border-color:var(--ink-3)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:500}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--card-2);color:var(--ink)}
.btn.danger{color:var(--coral);border-color:var(--coral-soft)}
.btn.danger:hover{background:var(--coral-soft);border-color:var(--coral)}
.btn:disabled{opacity:.45;cursor:not-allowed}
select.btn{padding-inline-end:26px}

/* ---------- במה ---------- */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 292px;gap:26px;align-items:start}
@media (max-width:920px){.stage{grid-template-columns:1fr;gap:20px}}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:12px}
.scard{
  position:relative;background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:15px 10px 12px;text-align:center;cursor:pointer;font-family:inherit;color:inherit;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  transition:transform .13s ease,box-shadow .13s ease,border-color .13s;
}
.scard:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--line)}
.scard:active{transform:translateY(0)}
.scard.hot{background:var(--card-hi);border-color:color-mix(in srgb,var(--teal) 34%,transparent)}
.ava{
  width:60px;height:60px;border-radius:50%;object-fit:cover;display:grid;place-items:center;
  background:var(--card-2);border:2px solid var(--card);box-shadow:0 0 0 1px var(--line-soft);
  font-family:'Rubik',sans-serif;font-weight:600;font-size:1.15rem;color:var(--ink-2);
  overflow:hidden;flex:none;
}
.sname{font-size:.9rem;font-weight:500;line-height:1.35;word-break:break-word}
.spts{font-family:'Suez One',serif;font-size:1.45rem;line-height:1;color:var(--teal);font-variant-numeric:tabular-nums}
.spts.zero{color:var(--ink-3);opacity:.55}
.spts small{font-family:'Rubik',sans-serif;font-size:.42em;color:var(--ink-3);margin-inline-start:3px}
.today-dots{display:flex;gap:3px;height:5px;align-items:center}
.today-dots i{width:5px;height:5px;border-radius:50%;background:var(--teal);display:block}
.today-dots i.n{background:var(--coral)}
.today-dots .more{font-size:.62rem;color:var(--ink-3);line-height:1}

/* עמודת פעולות אחרונות — ללא מסגרת כרטיס */
.side h2{font-family:'Rubik',sans-serif;font-size:.8rem;font-weight:600;letter-spacing:.09em;
  color:var(--ink-3);margin:0 0 4px;display:flex;align-items:center;gap:8px}
.side h2::after{content:'';flex:1;height:1px;background:var(--line-soft)}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;gap:10px;align-items:flex-start;padding:9px 2px;border-bottom:1px solid var(--line-soft)}
.feed .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);margin-top:8px;flex:none}
.feed li.note .dot{background:var(--coral)}
.feed .who{font-weight:500;font-size:.86rem}
.feed .what{font-size:.8rem;color:var(--ink-2);line-height:1.5}
.feed .when{margin-inline-start:auto;font-size:.72rem;color:var(--ink-3);white-space:nowrap;padding-top:2px}
.feed .empty{color:var(--ink-3);font-size:.85rem;padding:10px 2px;border:0}
.side-foot{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}

/* מצב ריק */
.blank{
  background:var(--card);border:1px dashed var(--line);border-radius:18px;
  padding:34px 26px;text-align:center;
}
.blank h3{font-family:'Suez One',serif;font-weight:400;font-size:1.2rem;margin:0 0 6px}
.blank p{color:var(--ink-2);margin:0 auto 16px;max-width:44ch;font-size:.92rem}
.demo-note{
  display:flex;gap:10px;align-items:center;background:var(--card-2);border:1px solid var(--line-soft);
  border-inline-start:4px solid var(--gold);border-radius:11px;padding:9px 14px;margin-bottom:14px;font-size:.84rem;color:var(--ink-2);
}
.demo-note b{color:var(--ink)}

/* ---------- חלונות ---------- */
.veil{position:fixed;inset:0;background:rgba(8,22,19,.55);backdrop-filter:blur(3px);
  z-index:200;display:flex;align-items:center;justify-content:center;padding:18px}
.sheet{
  background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);
  width:min(560px,100%);max-height:88vh;display:flex;flex-direction:column;overflow:hidden;
}
.sheet.wide{width:min(760px,100%)}
.sheet-h{display:flex;align-items:center;gap:13px;padding:16px 20px;border-bottom:1px solid var(--line-soft);background:var(--card-2)}
.sheet-h h3{margin:0;font-family:'Rubik',sans-serif;font-size:1.02rem;font-weight:600;line-height:1.3}
.sheet-h .meta{font-size:.78rem;color:var(--ink-2);font-weight:400}
.sheet-x{margin-inline-start:auto;background:none;border:0;font-size:1.35rem;color:var(--ink-3);cursor:pointer;line-height:1;padding:2px 6px;border-radius:8px}
.sheet-x:hover{color:var(--ink);background:var(--line-soft)}
.sheet-b{padding:16px 20px;overflow:auto}
.sheet-f{padding:12px 20px;border-top:1px solid var(--line-soft);display:flex;gap:9px;align-items:center;background:var(--card-2)}
.sheet-f .spacer{flex:1}
@media (max-width:560px){
  .veil{align-items:flex-end;padding:0}
  .sheet{border-radius:20px 20px 0 0;max-height:93vh;width:100%}
}

.hint{font-size:.82rem;color:var(--ink-2);margin:0 0 12px}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:13px}
.cat{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;
  font-size:.83rem;cursor:pointer;font-family:'Rubik',sans-serif;color:var(--ink-2);transition:.14s}
.cat:hover{border-color:var(--ink-3)}
.cat.on{color:#fff;border-color:transparent;font-weight:500}
.phrases{display:flex;flex-direction:column;gap:7px}
.phrase{
  text-align:start;background:var(--card-2);border:1px solid var(--line-soft);border-radius:12px;
  padding:11px 14px;font-size:.94rem;line-height:1.55;cursor:pointer;
  display:flex;gap:11px;align-items:center;transition:.14s;
}
.phrase:hover{background:var(--card-hi);border-color:var(--teal);transform:translateX(-3px)}
.phrase .plus{font-family:'Rubik',sans-serif;font-weight:600;font-size:.82rem;color:var(--teal);
  border:1px solid currentColor;border-radius:999px;padding:1px 8px;flex:none}
.field{display:flex;gap:8px;margin-top:13px}
.field input,.field select,.field textarea{
  flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:.9rem;
}
.divider{height:1px;background:var(--line-soft);margin:16px 0 12px}
.subtle-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.link-btn{background:none;border:0;color:var(--ink-3);font-size:.82rem;cursor:pointer;padding:3px 2px;text-decoration:underline;text-underline-offset:3px}
.link-btn:hover{color:var(--ink)}
.link-btn.warn:hover{color:var(--coral)}

/* ייבוא */
.rowline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:11px}
.rowline label{font-size:.86rem;color:var(--ink-2)}
.check{display:inline-flex;gap:7px;align-items:center;font-size:.87rem;cursor:pointer}
.preview{
  background:var(--card-2);border:1px solid var(--line-soft);border-radius:12px;padding:11px 13px;
  max-height:230px;overflow:auto;
}
.preview ol{margin:0;padding-inline-start:22px;font-size:.89rem;line-height:1.75}

/* התאמת תמונות */
.match-list{display:flex;flex-direction:column;gap:8px;max-height:44vh;overflow:auto}
.match{display:flex;gap:11px;align-items:center;background:var(--card-2);border:1px solid var(--line-soft);
  border-radius:12px;padding:8px 11px}
.match img{width:44px;height:44px;border-radius:9px;object-fit:cover;flex:none}
.match .fn{font-size:.8rem;color:var(--ink-2);flex:1;min-width:0;word-break:break-all;line-height:1.4}
.match select{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 9px;font-size:.85rem;max-width:170px}
.match.auto{border-color:color-mix(in srgb,var(--teal) 40%,transparent)}

.toast{
  position:fixed;inset-block-end:20px;inset-inline-start:50%;transform:translateX(-50%);
  background:var(--board-1);color:var(--chalk);padding:10px 20px;border-radius:999px;
  font-size:.88rem;box-shadow:var(--shadow-lg);z-index:400;display:flex;gap:12px;align-items:center;
  animation:rise .22s ease;border:1px solid rgba(233,241,236,.14);
}
.toast button{background:none;border:0;color:#8fe0c4;font-weight:600;cursor:pointer;font-size:.86rem;text-decoration:underline;text-underline-offset:3px}
@keyframes rise{from{opacity:0;transform:translateX(-50%) translateY(10px)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.13)}100%{transform:scale(1)}}
.pop{animation:pop .34s ease}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .scard:hover,.phrase:hover{transform:none}
}
/* ---------- מצב רצועה צדדית ---------- */
body.dock{font-size:15px}
body.dock .board-in{padding:9px 12px;gap:7px;max-width:none}
body.dock .board-top{gap:8px;align-items:center}
body.dock .brand h1{font-size:1.02rem}
body.dock .brand .sub{display:none}
body.dock .gauge{flex:1 1 100%;order:3;min-width:0;max-width:none}
body.dock .gauge-head{gap:7px}
body.dock .gauge-val{font-size:1.12rem}
body.dock .gauge-track{margin-top:5px;height:8px}
body.dock .gauge-mark::after{display:none}
body.dock .gauge-legend{margin-top:6px;gap:10px;font-size:.72rem}
body.dock .gauge-legend span:last-child{display:none}
body.dock .icon-btn{padding:5px 9px;font-size:.78rem}
body.dock .classes{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
body.dock .chip{white-space:nowrap;font-size:.8rem;padding:4px 11px}
body.dock .chip .cnt{display:none}

body.dock .wrap{max-width:none;padding:11px 11px 44px}
body.dock .tools{gap:6px;margin-bottom:10px}
body.dock .search{flex:1 1 100%;max-width:none}
body.dock .tools>span[style]{display:none}
body.dock .tools .btn{padding:6px 10px;font-size:.79rem;flex:1 1 auto;justify-content:center}
body.dock .stage{grid-template-columns:1fr;gap:14px}
body.dock aside.side{display:none}
body.dock .foot{margin-top:18px;font-size:.72rem}
body.dock .blank{padding:24px 16px}
body.dock .demo-note{font-size:.79rem;padding:8px 11px}

body.dock .grid{grid-template-columns:1fr;gap:6px}
body.dock .scard{
  flex-direction:row;align-items:center;text-align:start;
  padding:7px 11px;gap:10px;border-radius:11px;
}
body.dock .scard:hover{transform:none;box-shadow:none;border-color:var(--teal)}
body.dock .ava{width:36px;height:36px;font-size:.85rem;border-width:1px}
body.dock .sname{flex:1;min-width:0;font-size:.89rem;order:2}
body.dock .today-dots{order:3;gap:2.5px}
body.dock .today-dots i{width:4px;height:4px}
body.dock .spts{order:4;font-size:1.12rem;min-width:32px;text-align:end}
body.dock .spts small{display:none}
/* רצועה צרה מאוד — לוותר על עוד קישוט */
@media (max-width:340px){
  body.dock .today-dots{display:none}
  body.dock .brand h1{font-size:.94rem}
}

/* מדריך העזרה */
.help h4{font-family:'Rubik',sans-serif;font-size:.96rem;font-weight:600;margin:22px 0 7px;color:var(--ink)}
.help h4:first-child{margin-top:0}
.help p{margin:0 0 10px;font-size:.9rem;color:var(--ink-2);line-height:1.72}

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
"use strict";

/* ==========================================================
   1. תוכן חינוכי — הביטויים שהמורה אומר בקול
   ========================================================== */
const CATS = [
  { id:'seat',  name:'ישיבה ומקום',    color:'var(--teal)', lines:[
    'אני רואה שאתה יושב במקום שלך עם הפנים ללוח.',

    'הכיסא קרוב לשולחן והגב זקוף — ככה נוח ללמוד.',
    'נכנסת לכיתה בשקט והתיישבת. זה עזר לכולם להתחיל.',
    'עברת בין השולחנות בלי להפריע לאף אחד.',
  ]},
  { id:'listen',name:'הקשבה והצבעה',   color:'var(--gold)', lines:[
    'הרמת יד וחיכית בסבלנות עד שקראתי לך.',
    'הקשבת לחבר עד הסוף בלי להתפרץ.',
    'השאלה ששאלת מראה שהקשבת לכל ההסבר.',
    'העיניים שלך היו עליי לאורך כל ההסבר. תודה.',
    'חיכית לתור שלך גם כשידעת את התשובה.',
  ]},
  { id:'work',  name:'עבודה ולמידה',    color:'var(--coral)', lines:[
    'התחלת לעבוד מיד, בלי לחכות לתזכורת.',
    'התאמצת בשאלה הקשה ולא ויתרת.',
    'בדקת את עצמך לפני שהגשת.',
    'כתבת בכתב ברור שאפשר לקרוא בקלות.',
    'ניסית שוב אחרי שטעית — ככה בדיוק לומדים.',
    'סיימת את כל התרגילים בזמן שהיה.',
  ]},
  { id:'help',  name:'עזרה וחברות',     color:'var(--olive)', lines:[
    'עזרת לחבר בלי שביקשו ממך.',
    'הסברת לחבר בסבלנות עד שהבין.',
    'צירפת ילד למשחק — ראיתי כמה הוא שמח.',
    'השאלת ציוד בשמחה.',
    'דיברת יפה גם כשכעסת. זה לא פשוט.',
  ]},
  { id:'order', name:'סדר וציוד',       color:'var(--indigo)', lines:[
    'הוצאת את כל הציוד עוד לפני שהתחלנו.',
    'השולחן שלך מסודר וכל דבר במקומו.',
    'הרמת פסולת מהרצפה בלי שביקשתי.',
    'החזרת את הציוד למקום בסוף השיעור.',
    'הקלסר שלך מסודר לפי הסדר.',
  ]},
];
const NOTE_REASONS = ['הפרעה בזמן הסבר','יציאה מהמקום','דיבור עם חבר','חוסר ציוד','אי־כיבוד חבר','לא התחיל לעבוד'];
const TARGET_RATIO = 5;

/* ==========================================================
   2. שכבת אחסון — ענן (db) עם נפילה נקייה ל-localStorage
   ========================================================== */
function makeLocalDB(){
  const KEY='positive-scoreboard.v1';
  let mem={};
  try{ mem = JSON.parse(localStorage.getItem(KEY)||'{}') || {}; }catch(e){ mem={}; }
  const subs=new Set();
  const META={fromCache:true,hasPendingWrites:false};
  function flush(){
    try{ localStorage.setItem(KEY, JSON.stringify(mem)); }
    catch(e){ toast('אין מקום פנוי לשמירה מקומית. נסו למחוק תמונות ישנות.'); }
    subs.forEach(fn=>{ try{ fn(); }catch(_){} });
  }
  const clone=v=>v===undefined?undefined:JSON.parse(JSON.stringify(v));
  const snap=(path,body)=>({id:path.split('/').pop(),exists:body!==undefined,data:()=>clone(body),metadata:META});
  function docRef(path){
    return {
      id:path.split('/').pop(), path,
      get:async()=>snap(path,mem[path]),
      set:async d=>{ mem[path]=clone(d); flush(); },
      update:async d=>{ if(!mem[path]) throw {code:'invalid_argument',message:'missing'};
                        Object.assign(mem[path],clone(d)); flush(); },
      delete:async()=>{ delete mem[path]; flush(); },
      onSnapshot:next=>{ const fn=()=>next(snap(path,mem[path])); subs.add(fn); setTimeout(fn,0); return ()=>subs.delete(fn); },
      collection:p=>colRef(path+'/'+p),
    };
  }
  function colRef(path){
    const list=()=>Object.keys(mem)
      .filter(k=>k.indexOf(path+'/')===0 && k.slice(path.length+1).indexOf('/')<0)
      .sort().map(k=>snap(k,mem[k]));
    const wrap=()=>{ const d=list(); return {docs:d,size:d.length,empty:!d.length,docChanges:()=>[],metadata:META}; };
    return {
      path,
      doc:id=>docRef(path+'/'+(id||newId('x'))),
      get:async()=>wrap(),
      onSnapshot:next=>{ const fn=()=>next(wrap()); subs.add(fn); setTimeout(fn,0); return ()=>subs.delete(fn); },
    };
  }
  return { doc:docRef, collection:colRef, local:true };
}

let DB=null, CLOUD=false, DOWNLOADS=null;

/* ==========================================================
   3. עזרים
   ========================================================== */
const $  = s=>document.querySelector(s);
const el = (t,c,x)=>{ const n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n; };
const esc = s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function newId(p){ return (p||'i')+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function dayKey(d){ d=d||new Date(); const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function hhmm(ts){ try{ return new Date(ts).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }
function initials(name){
  const parts=String(name||'').trim().split(/\s+/).filter(Boolean);
  return ((parts[0]||'').charAt(0)+(parts[1]||'').charAt(0)) || '★';
}
function toast(msg, actionLabel, onAction){
  const root=$('#toast-root'); if(!root) return;
  root.innerHTML='';
  const t=el('div','toast'); t.appendChild(el('span',null,msg));
  if(actionLabel){ const b=el('button',null,actionLabel); b.onclick=()=>{ root.innerHTML=''; onAction&&onAction(); }; t.appendChild(b); }
  root.appendChild(t);
  clearTimeout(toast._t); toast._t=setTimeout(()=>{ if(root.firstChild===t) root.innerHTML=''; }, actionLabel?7000:3200);
}

/* ==========================================================
   4. מצב האפליקציה
   ========================================================== */
const state = {
  classes:[], activeId:null,
  students:[], photos:{}, day:{items:[]},
  q:'', sort:'order', dock:false,
};
let unsubStudents=null, unsubDay=null;
const todayKey = dayKey();

function applyMode(){
  document.body.classList.toggle('dock', state.dock);
  const b=$('#btn-mode');
  b.textContent = state.dock ? '⇥ מסך מלא' : '⇤ מצב צד';
  b.title = state.dock ? 'חזרה לתצוגה מלאה על כל הרוחב' : 'לכווץ את הלוח לרצועה צדדית, לצד המצגת';
  b.setAttribute('aria-pressed', state.dock ? 'true' : 'false');
}
function toggleMode(){
  state.dock=!state.dock;
  safeSet('psb.dock', state.dock?'1':'0');
  applyMode();
}

/* ==========================================================
   5. הפעלה
   ========================================================== */
(async function boot(){
  const savedDock=safeGet('psb.dock');
  state.dock = savedDock===null ? (window.innerWidth<560) : savedDock==='1';
  applyMode();
  $('#today-label').textContent = new Date().toLocaleDateString('he-IL',{weekday:'long', day:'numeric', month:'long'});
  renderGauge(); renderFeed();
  $('#blank-slot').innerHTML = '<div class="blank"><h3>טוען…</h3><p>מאחזר את הכיתות והניקוד.</p></div>';

  let cloud=null;
  try{ if(window.claude && typeof window.claude.use==='function') cloud = await window.claude.use('db'); }catch(e){}
  if(cloud){ DB=cloud; CLOUD=true; } else { DB=makeLocalDB(); CLOUD=false; }
  try{ if(window.claude && typeof window.claude.use==='function') DOWNLOADS = await window.claude.use('downloads'); }catch(e){}
  $('#btn-export').style.display = DOWNLOADS ? '' : 'none';
  $('#foot').textContent = CLOUD
    ? 'הנתונים נשמרים אוטומטית ונגישים מכל מחשב שנכנס לקישור הזה.'
    : 'שמירה מקומית בדפדפן הזה בלבד — השמירה בענן אינה זמינה בתצוגה הנוכחית.';

  await loadClasses();
})();

async function loadClasses(){
  let snap;
  try{ snap = await DB.collection('classes').get(); }
  catch(e){ fail(e); return; }
  state.classes = snap.docs.map(d=>Object.assign({id:d.id}, d.data())).sort((a,b)=>(a.order||0)-(b.order||0));
  if(!state.classes.length){ await seedDemo(); return; }
  const saved = safeGet('psb.active');
  const pick = state.classes.find(c=>c.id===saved) || state.classes[0];
  await selectClass(pick.id);
}

function safeGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function safeSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

function fail(e){
  console.error(e);
  const code = (e && e.code) || '';
  const msg = code==='quota_exceeded' ? 'המאגר מלא. מחקו כיתה או תלמידים ישנים כדי להוסיף חדשים.'
            : code==='revoked' ? 'ההרשאה לשמירה בוטלה. רעננו את הדף.'
            : code==='resource_exhausted' ? 'יותר מדי פעולות ברצף. המתינו רגע ונסו שוב.'
            : 'הפעולה לא הושלמה. נסו שוב.';
  toast(msg);
}

async function seedDemo(){
  const names=['אבי כהן','נועה לוי','יונתן מזרחי','שירה פרץ','איתמר אזולאי','תמר בן־דוד','מלכי שטרן','דוד אלימלך'];
  const pts=[3,5,2,4,1,6,0,2];
  const cid=newId('c');
  const cls={name:'כיתה לדוגמה', order:0, demo:true, createdAt:Date.now()};
  try{
    await DB.doc('classes/'+cid).set(cls);
    for(let i=0;i<names.length;i++){
      await DB.doc('classes/'+cid+'/students/'+newId('s'))
        .set({name:names[i], points:pts[i], order:i, createdAt:Date.now()});
    }
  }catch(e){ fail(e); }
  state.classes=[Object.assign({id:cid},cls)];
  await selectClass(cid);
}

async function selectClass(cid){
  if(unsubStudents){ unsubStudents(); unsubStudents=null; }
  if(unsubDay){ unsubDay(); unsubDay=null; }
  state.activeId=cid; safeSet('psb.active',cid);
  state.students=[]; state.photos={}; state.day={items:[]};
  renderAll();

  try{
    const ps = await DB.collection('classes/'+cid+'/photos').get();
    if(state.activeId===cid) ps.docs.forEach(d=>{ const v=d.data(); if(v&&v.d) state.photos[d.id]=v.d; });
  }catch(e){}

  unsubStudents = DB.collection('classes/'+cid+'/students').onSnapshot(snap=>{
    if(state.activeId!==cid) return;
    state.students = snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
    renderStudents(); renderClasses();
  }, e=>{ if(e && e.code!=='unavailable') fail(e); });

  unsubDay = DB.doc('classes/'+cid+'/days/'+todayKey).onSnapshot(snap=>{
    if(state.activeId!==cid) return;
    const v = snap.exists ? snap.data() : null;
    state.day = { items: (v && Array.isArray(v.items)) ? v.items : [] };
    renderGauge(); renderFeed(); renderStudents();
  }, e=>{ if(e && e.code!=='unavailable') fail(e); });
}

const activeClass = ()=>state.classes.find(c=>c.id===state.activeId)||null;

/* ==========================================================
   6. תצוגה
   ========================================================== */
function renderAll(){ renderClasses(); renderGauge(); renderStudents(); renderFeed(); }

function renderClasses(){
  const box=$('#classes'); box.innerHTML='';
  state.classes.forEach(c=>{
    const b=el('button','chip'+(c.id===state.activeId?' on':''));
    b.appendChild(el('span',null,c.name));
    if(c.id===state.activeId) b.appendChild(el('span','cnt',state.students.length+' תלמידים'));
    b.onclick=()=>{ if(c.id===state.activeId) openClassMenu(c); else selectClass(c.id); };
    b.title = c.id===state.activeId ? 'לחצו שוב לשינוי שם או מחיקה' : 'מעבר לכיתה';
    box.appendChild(b);
  });
  const add=el('button','chip chip-add','＋ כיתה');
  add.onclick=addClass; box.appendChild(add);
}

function ratioStats(){
  let good=0,bad=0;
  state.day.items.forEach(i=>{ if(i.kind==='note') bad++; else good++; });
  return {good,bad};
}
function renderGauge(){
  const {good,bad}=ratioStats();
  const ratio = bad===0 ? (good?Infinity:0) : good/bad;
  const total = good+bad;
  const pct = total ? Math.round(good/total*100) : 0;
  let tag='tag-low', txt='כדאי להוסיף חיזוקים';
  if(ratio===Infinity && good>0){ tag='tag-good'; txt='מצוין — רק חיזוקים'; }
  else if(ratio>=TARGET_RATIO){ tag='tag-good'; txt='מצוין — ביעד'; }
  else if(ratio>=3){ tag='tag-mid'; txt='קרוב ליעד'; }
  if(total===0){ tag='tag-mid'; txt='עוד לא התחלנו היום'; }
  const shown = total===0 ? '—' : (ratio===Infinity ? good+':0' : (Math.round(ratio*10)/10).toFixed(1)+':1');
  $('#gauge').innerHTML =
    '<div class="gauge-head">'+
      '<span class="gauge-val num">'+esc(shown)+' <small>יחס היום</small></span>'+
      '<span class="gauge-tag '+tag+'">'+esc(txt)+'</span>'+
    '</div>'+
    '<div class="gauge-track">'+
      '<span class="gauge-fill" style="width:'+(total?pct:0)+'%"></span>'+
      '<span class="gauge-mark" style="left:'+(100-Math.round(TARGET_RATIO/(TARGET_RATIO+1)*100))+'%"></span>'+
    '</div>'+
    '<div class="gauge-legend">'+
      '<span><b class="num">'+good+'</b> חיזוקים</span>'+
      '<span><b class="num">'+bad+'</b> הערות</span>'+
      '<span>היעד: 5 חיזוקים על כל הערה</span>'+
    '</div>';
}

function todayFor(sid){
  let g=0,n=0;
  state.day.items.forEach(i=>{ if(i.sid===sid){ i.kind==='note'?n++:g++; } });
  return {g,n};
}

function visibleStudents(){
  let list=state.students.slice();
  const q=state.q.trim();
  if(q) list=list.filter(s=>String(s.name||'').indexOf(q)>=0);
  if(state.sort==='abc') list.sort((a,b)=>String(a.name).localeCompare(String(b.name),'he'));
  else if(state.sort==='pts') list.sort((a,b)=>(b.points||0)-(a.points||0) || String(a.name).localeCompare(String(b.name),'he'));
  else list.sort((a,b)=>(a.order||0)-(b.order||0));
  return list;
}

function renderStudents(){
  const grid=$('#grid'), slot=$('#blank-slot'), noteSlot=$('#demo-note-slot');
  const cls=activeClass();
  noteSlot.innerHTML=''; slot.innerHTML='';

  if(!cls){
    grid.innerHTML='';
    const b=el('div','blank');
    b.innerHTML='<h3>אין כיתות</h3><p>צרו כיתה ראשונה כדי להתחיל לתת חיזוקים.</p>';
    const mk=el('button','btn primary','＋ יצירת כיתה'); mk.onclick=addClass; b.appendChild(mk);
    slot.appendChild(b);
    return;
  }
  if(cls.demo){
    const n=el('div','demo-note');
    n.innerHTML='<span>🎓</span><span><b>זו כיתה לדוגמה</b> — התלמידים והנקודות כאן הם המחשה בלבד. ייבאו את הרשימה האמיתית, או מחקו את הכיתה.</span>';
    noteSlot.appendChild(n);
  }

  const list=visibleStudents();
  if(!list.length){
    grid.innerHTML='';
    const b=el('div','blank');
    if(state.students.length){
      b.innerHTML='<h3>אין תוצאה לחיפוש</h3><p>לא נמצא תלמיד בשם «'+esc(state.q)+'» בכיתה הזו.</p>';
    }else{
      b.innerHTML='<h3>הכיתה עדיין ריקה</h3><p>ייבאו רשימת תלמידים מקובץ אקסל או CSV — מספיקה עמודה אחת עם השמות — או הוסיפו תלמיד ידנית.</p>';
      const row=el('div');
      const i1=el('button','btn primary','📋 ייבוא רשימה מאקסל'); i1.onclick=openImport;
      const i2=el('button','btn','＋ הוספת תלמיד'); i2.onclick=addStudent; i2.style.marginInlineStart='8px';
      row.appendChild(i1); row.appendChild(i2); b.appendChild(row);
    }
    slot.appendChild(b);
    return;
  }

  grid.innerHTML='';
  list.forEach(s=>{
    const t=todayFor(s.id);
    const card=el('button','scard'+((s.points||0)>0?' hot':''));
    card.dataset.sid=s.id;
    const ph=state.photos[s.id];
    if(ph){ const im=document.createElement('img'); im.className='ava'; im.src=ph; im.alt=s.name; card.appendChild(im); }
    else { card.appendChild(el('div','ava',initials(s.name))); }

let closeCurrent=null;
function openSheet(opts){
  closeSheet();
  const veil=el('div','veil');
  const sheet=el('div','sheet'+(opts.wide?' wide':''));
  const head=el('div','sheet-h');
  const h=el('div');
  h.appendChild(el('h3',null,opts.title));
  if(opts.meta) h.appendChild(el('div','meta',opts.meta));
  head.appendChild(h);
  const x=el('button','sheet-x','×'); x.setAttribute('aria-label','סגירה'); x.onclick=()=>closeSheet();
  head.appendChild(x);
  const body=el('div','sheet-b');
  if(opts.body) body.appendChild(opts.body);
  sheet.appendChild(head); sheet.appendChild(body);
  if(opts.footer){ const f=el('div','sheet-f'); f.appendChild(opts.footer); sheet.appendChild(f); }
  veil.appendChild(sheet);
  veil.addEventListener('mousedown',e=>{ if(e.target===veil) closeSheet(); });
  $('#modal-root').appendChild(veil);
  const focusable=sheet.querySelector('input,select,textarea,button.primary');
  if(focusable) setTimeout(()=>{ try{ focusable.focus(); }catch(e){} },30);
  function onKey(e){ if(e.key==='Escape'){ e.preventDefault(); closeSheet(); } }
  document.addEventListener('keydown',onKey);
  closeCurrent=()=>{ veil.remove(); document.removeEventListener('keydown',onKey); closeCurrent=null; };
  return {veil,sheet,body};
}
function closeSheet(){ if(closeCurrent) closeCurrent(); }

function askConfirm(title, text, okLabel, danger){
  return new Promise(res=>{
    const body=el('div'); body.appendChild(el('p','hint',text));
    const foot=el('div'); foot.style.display='flex'; foot.style.gap='9px'; foot.style.width='100%';
    foot.appendChild(el('span','spacer'));
    const no=el('button','btn','ביטול');
    const yes=el('button','btn '+(danger?'danger':'primary'),okLabel||'אישור');
    no.onclick=()=>{ closeSheet(); res(false); };
    yes.onclick=()=>{ closeSheet(); res(true); };
    foot.appendChild(no); foot.appendChild(yes);
    openSheet({title,body,footer:foot});
    setTimeout(()=>{ try{ yes.focus(); }catch(e){} },40);
  });
}
function askText(title, label, value, okLabel){
  return new Promise(res=>{
    const body=el('div');
    body.appendChild(el('p','hint',label));
    const wrap=el('div','field');
    const inp=document.createElement('input'); inp.type='text'; inp.value=value||''; wrap.appendChild(inp);
    body.appendChild(wrap);
    const foot=el('div'); foot.style.display='flex'; foot.style.gap='9px'; foot.style.width='100%';
    foot.appendChild(el('span','spacer'));
    const no=el('button','btn','ביטול'); const yes=el('button','btn primary',okLabel||'שמירה');
    no.onclick=()=>{ closeSheet(); res(null); };
    const done=()=>{ const v=inp.value.trim(); if(!v){ inp.focus(); return; } closeSheet(); res(v); };
    yes.onclick=done;
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); done(); } });
    foot.appendChild(no); foot.appendChild(yes);
    openSheet({title,body,footer:foot});
    setTimeout(()=>{ try{ inp.focus(); inp.select(); }catch(e){} },40);
  });
}

async function record(sid, kind, text, catId){
  const s=state.students.find(x=>x.id===sid); if(!s) return;
  const item={id:newId('e'), sid, name:s.name, kind, text, cat:catId||'', ts:Date.now()};

  const delta = kind==='note' ? 0 : 1;

  await saveDay(items);

  toast(kind==='note' ? 'נרשמה הערה ל'+s.name+'.' : s.name+' — נקודה נוספה.', 'בטל', ()=>undoLast(item.id));

async function undoLast(onlyId){
  const items=state.day.items.slice();
  if(!items.length) return;
  let idx=items.length-1;
  if(onlyId){ idx=items.map(i=>i.id).lastIndexOf(onlyId); if(idx<0) return; }
  const item=items.splice(idx,1)[0];
  const s=state.students.find(x=>x.id===item.sid);
  if(s && item.kind!=='note'){
    s.points=Math.max(0,(s.points||0)-1);
    try{ await DB.doc('classes/'+state.activeId+'/students/'+item.sid).update({points:s.points}); }catch(e){}
  }
  await saveDay(items);
  renderStudents(); renderGauge(); renderFeed();
  toast('הפעולה בוטלה.');
}

function readBuffer(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result); r.onerror=()=>rej(r.error);
    r.readAsArrayBuffer(file);
  });
}
function looksLikeName(v){
  if(typeof v!=='string') return false;
  const t=v.trim();
  return t.length>=2 && t.length<=40 && /[֐-׿A-Za-z]/.test(t);
}
function detectColumn(rows, hasHeader){
  const width=rows.reduce((m,r)=>Math.max(m,r.length),0);
  if(hasHeader && rows[0]){
    for(let c=0;c<width;c++){
      const h=String(rows[0][c]==null?'':rows[0][c]).trim();
      if(/^(שם|שם התלמיד|שם מלא|תלמיד|name|full ?name|student)/i.test(h)) return c;
    }
  }
  let best=0,bestScore=-1;
  for(let c=0;c<width;c++){
    let score=0;
    for(let r=hasHeader?1:0;r<rows.length;r++){
      const v=rows[r][c];
      if(looksLikeName(v)) score += (String(v).indexOf(' ')>0?2:1);
    }
    if(score>bestScore){ bestScore=score; best=c; }
  }
  return best;
}

  const body=el('div');

  const colSel=document.createElement('select'); colSel.className='btn';
  sheetRow.appendChild(colSel);

  const chkLab=el('label','check'); chkLab.setAttribute('for','hdrchk');

  const prevBox=el('div','preview'); opts.appendChild(prevBox);

  const foot=el('div'); foot.style.display='flex'; foot.style.gap='9px'; foot.style.width='100%'; foot.style.alignItems='center';
  const count=el('span'); count.style.fontSize='.83rem'; count.style.color='var(--ink-2)';

  addBtn.disabled=repBtn.disabled=true;
  foot.appendChild(addBtn); foot.appendChild(repBtn);

  let wb=null, rows=[], names=[];

  fileInput.onchange=async()=>{
    const f=fileInput.files && fileInput.files[0]; if(!f) return;
    try{
      const buf=await readBuffer(f);
      wb=XLSX.read(new Uint8Array(buf),{type:'array'});
    }catch(e){ console.error(e); toast('לא הצלחתי לקרוא את הקובץ. ודאו שזה xlsx או csv תקין.'); return; }
    sheetSel.innerHTML='';
    wb.SheetNames.forEach(n=>{ const o=document.createElement('option'); o.value=n; o.textContent=n; sheetSel.appendChild(o); });
    const multi = wb.SheetNames.length>1;
    sheetLbl.style.display = sheetSel.style.display = multi?'':'none';
    opts.style.display='';
    loadSheet(true);
  };
  function loadSheet(autoHeader){
    const ws=wb.Sheets[sheetSel.value||wb.SheetNames[0]];
    rows=XLSX.utils.sheet_to_json(ws,{header:1,blankrows:false,defval:''});
    rows=rows.filter(r=>r.some(c=>String(c==null?'':c).trim()!==''));
    if(autoHeader && rows.length){
      const first=rows[0].map(c=>String(c==null?'':c).trim());
      chk.checked = first.some(h=>/^(שם|שם התלמיד|שם מלא|תלמיד|name|student|מס׳|מספר|#)/i.test(h));
    }
    const width=rows.reduce((m,r)=>Math.max(m,r.length),0);
    const auto=detectColumn(rows, chk.checked);
    colSel.innerHTML='';
    for(let c=0;c<width;c++){
      const o=document.createElement('option'); o.value=String(c);
      const head=chk.checked && rows[0] ? String(rows[0][c]==null?'':rows[0][c]).trim() : '';
      o.textContent='עמודה '+(c+1)+(head?' — '+head:'');
      colSel.appendChild(o);
    }
    colSel.value=String(auto);
    refresh();
  }
  function refresh(){
    const c=parseInt(colSel.value||'0',10);
    names=[];
    for(let r=chk.checked?1:0;r<rows.length;r++){
      const v=String(rows[r][c]==null?'':rows[r][c]).trim();
      if(v) names.push(v);
    }
    prevBox.innerHTML='';
    if(!names.length){ prevBox.appendChild(el('div','hint','לא נמצאו שמות בעמודה הזו. בחרו עמודה אחרת.')); }
    else{
      const ol=document.createElement('ol');
      names.slice(0,60).forEach(n=>ol.appendChild(el('li',null,n)));
      prevBox.appendChild(ol);
      if(names.length>60) prevBox.appendChild(el('div','hint','ועוד '+(names.length-60)+'…'));
    }
    count.textContent = names.length ? names.length+' שמות מוכנים לייבוא' : '';
    addBtn.disabled=repBtn.disabled=!names.length;
  }
  sheetSel.onchange=()=>loadSheet(true);
  chk.onchange=()=>loadSheet(false);
  colSel.onchange=refresh;

  addBtn.onclick=()=>doImport(false);
  repBtn.onclick=async()=>{
    const nm=(activeClass()||{}).name||'';
    const ok=await askConfirm('החלפת הרשימה','כל התלמידים והנקודות שבכיתה «'+nm+'» יימחקו, ובמקומם ייכנסו '+names.length+' השמות החדשים.','החלפה',true);
    if(ok) doImport(true);
  };
  async function doImport(replace){
    const list=names.slice();
    closeSheet();
    const cid=state.activeId;
    try{
      if(replace){
        const st=await DB.collection('classes/'+cid+'/students').get();
        for(const d of st.docs) await DB.doc('classes/'+cid+'/students/'+d.id).delete();
        const ph=await DB.collection('classes/'+cid+'/photos').get();
        for(const d of ph.docs) await DB.doc('classes/'+cid+'/photos/'+d.id).delete();
        state.photos={}; state.students=[];
        await saveDay([]);
      }
      let order = replace?0:state.students.length;
      for(const n of list){
        await DB.doc('classes/'+cid+'/students/'+newId('s'))
          .set({name:n, points:0, order:order++, createdAt:Date.now()});
      }
      const cls=activeClass();
      if(cls && cls.demo){ await DB.doc('classes/'+cid).update({demo:false}); cls.demo=false; }
    }catch(e){ return fail(e); }
    renderAll();
    toast(list.length+' תלמידים יובאו בהצלחה.');
  }

  openSheet({title:'ייבוא רשימת תלמידים', meta:'לכיתה: '+((activeClass()||{}).name||''), body, footer:foot, wide:true});
}

/* ==========================================================
   11. תמונות — בודדת ומרוכזת, עם התאמה לפי שם הקובץ
   ========================================================== */
function compress(file, max, quality){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      const scale=Math.min(1, max/Math.max(img.width,img.height));
      const w=Math.max(1,Math.round(img.width*scale)), h=Math.max(1,Math.round(img.height*scale));
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      const ctx=cv.getContext('2d');
      ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,w,h);
      ctx.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      try{ res(cv.toDataURL('image/jpeg',quality||0.72)); }catch(e){ rej(e); }
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('bad image')); };
    img.src=url;
  });
}

function normName(s){
  return String(s||'')
    .replace(/\.[a-z0-9]{2,5}$/i,'')
    .replace(/[֑-ׇ]/g,'')
    .replace(/["'`׳״]/g,'')
    .replace(/[-_.()\[\]0-9]+/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}
function tokens(s){ return normName(s).split(' ').filter(t=>t.length>1); }
function matchScore(fileName, studentName){
  const a=tokens(fileName), b=tokens(studentName);
  if(!a.length||!b.length) return 0;
  const A=a.join(' '), B=b.join(' ');
  if(A===B) return 100;
  const as=a.slice().sort().join(' '), bs=b.slice().sort().join(' ');
  if(as===bs) return 95;                                   /* סדר שם פרטי/משפחה הפוך */
  const hits=b.filter(t=>a.indexOf(t)>=0).length;
  if(hits===b.length) return 80;
  if(hits===a.length && a.length>1) return 70;
  if(hits>=2) return 60;
  if(A.indexOf(B)>=0 || B.indexOf(A)>=0) return 55;
  if(hits===1 && b.length===1) return 45;
  return 0;
}

function pickSinglePhoto(sid){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='image/*';
  inp.onchange=async()=>{
    const f=inp.files&&inp.files[0]; if(!f) return;
    try{
      const d=await compress(f,240,0.72);
      await DB.doc('classes/'+state.activeId+'/photos/'+sid).set({d, at:Date.now()});
      state.photos[sid]=d; renderStudents(); toast('התמונה עודכנה.');
    }catch(e){ fail(e); }
  };
  inp.click();
}

function openPhotos(){
  if(!state.activeId){ toast('צרו כיתה קודם.'); return; }
  if(!state.students.length){ toast('ייבאו רשימת תלמידים לפני העלאת תמונות.'); return; }
  const body=el('div');
  body.appendChild(el('p','hint','העלו כמה תמונות בבת אחת. ההתאמה נעשית לפי שם הקובץ מול שם התלמיד — גם כששם פרטי ומשפחה מופיעים בסדר הפוך. בדקו את ההתאמות למטה לפני השמירה.'));
  const row=el('div','rowline');
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.multiple=true;
  inp.className='btn'; inp.style.flex='1'; row.appendChild(inp); body.appendChild(row);
  const list=el('div','match-list'); body.appendChild(list);

  const foot=el('div'); foot.style.display='flex'; foot.style.gap='9px'; foot.style.width='100%'; foot.style.alignItems='center';
  const info=el('span'); info.style.fontSize='.83rem'; info.style.color='var(--ink-2)';
  foot.appendChild(info); foot.appendChild(el('span','spacer'));
  const save=el('button','btn primary','שמירת התמונות'); save.disabled=true; foot.appendChild(save);

  let entries=[];
  inp.onchange=async()=>{
    const files=Array.prototype.slice.call(inp.files||[]); if(!files.length) return;
    info.textContent='מכווץ ומתאים תמונות…'; list.innerHTML=''; entries=[];
    const taken={};
    for(const f of files){
      let data=null;
      try{ data=await compress(f,240,0.72); }catch(e){ continue; }
      let best=null,bs=0;
      state.students.forEach(s=>{
        if(taken[s.id]) return;
        const sc=matchScore(f.name,s.name);
        if(sc>bs){ bs=sc; best=s; }
      });
      if(best && bs>=45) taken[best.id]=true; else best=null;
      entries.push({file:f.name, data, sid:best?best.id:'', auto:!!best});
    }
    drawMatches();
  };
  function drawMatches(){
    list.innerHTML='';
    const sorted=state.students.slice().sort((a,b)=>String(a.name).localeCompare(String(b.name),'he'));
    entries.forEach((e,i)=>{
      const r=el('div','match'+(e.auto?' auto':''));
      const im=document.createElement('img'); im.src=e.data; im.alt=''; r.appendChild(im);
      r.appendChild(el('div','fn',e.file));
      const sel=document.createElement('select');
      const none=document.createElement('option'); none.value=''; none.textContent='— לא לשייך —'; sel.appendChild(none);
      sorted.forEach(s=>{ const o=document.createElement('option'); o.value=s.id; o.textContent=s.name; sel.appendChild(o); });
      sel.value=e.sid||'';
      sel.onchange=()=>{ entries[i].sid=sel.value; entries[i].auto=false; r.classList.remove('auto'); updateInfo(); };
      r.appendChild(sel);
      list.appendChild(r);
    });
    updateInfo();
  }
  function updateInfo(){
    const n=entries.filter(e=>e.sid).length;
    info.textContent = entries.length ? n+' מתוך '+entries.length+' תמונות משויכות' : '';
    save.disabled=!n;
  }
  save.onclick=async()=>{
    const batch=entries.slice();
    closeSheet();
    let n=0;
    for(const e of batch){
      if(!e.sid) continue;
      try{
        await DB.doc('classes/'+state.activeId+'/photos/'+e.sid).set({d:e.data, at:Date.now()});
        state.photos[e.sid]=e.data; n++;
      }catch(err){ fail(err); break; }
    }
    renderStudents();
    toast(n+' תמונות נשמרו.');
  };
  openSheet({title:'העלאת תמונות תלמידים', meta:(activeClass()||{}).name||'', body, footer:foot, wide:true});
}

async function exportXlsx(){
  if(!DOWNLOADS) return;
  try{
    const wb=XLSX.utils.book_new();
    wb.Workbook={Views:[{RTL:true}]};
    const used={};
    for(const c of state.classes){
      let students, items=[];
      if(c.id===state.activeId){ students=state.students.slice(); items=state.day.items; }
      else{
        const s=await DB.collection('classes/'+c.id+'/students').get();
        students=s.docs.map(d=>Object.assign({id:d.id},d.data()));
        const dsnap=await DB.doc('classes/'+c.id+'/days/'+todayKey).get();
        const dv=dsnap.exists?dsnap.data():null;
        items=(dv && Array.isArray(dv.items))?dv.items:[];
      }
      students.sort((a,b)=>(b.points||0)-(a.points||0));
      const aoa=[['#','שם התלמיד','סה״כ נקודות','חיזוקים היום','הערות היום']];
      students.forEach((s,i)=>{
        let g=0,n=0; items.forEach(it=>{ if(it.sid===s.id){ it.kind==='note'?n++:g++; } });
        aoa.push([i+1, s.name, s.points||0, g, n]);
      });
      const ws=XLSX.utils.aoa_to_sheet(aoa);
      ws['!cols']=[{wch:5},{wch:26},{wch:14},{wch:14},{wch:13}];
      let nm=String(c.name).replace(/[\\\/\?\*\[\]:]/g,'').slice(0,26)||'כיתה';
      while(used[nm]) nm=nm.slice(0,24)+'_'+(Object.keys(used).length+1);
      used[nm]=1;
      XLSX.utils.book_append_sheet(wb, ws, nm);
    }
    const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
    await DOWNLOADS.save({filename:'לוח ניקוד '+todayKey+'.xlsx', data:buf});
    toast('הקובץ נשמר.');
  }catch(e){
    if(e && e.code==='declined') return;
    console.error(e);
    toast('הייצוא לא הושלם. נסו שוב.');
  }
}
