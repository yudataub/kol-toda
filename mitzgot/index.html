<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>קטלוג המצגות – הקול החמישי</title>
<meta name="description" content="1219 מצגות לימוד בחומש, חגים, גדולי ישראל, תפילה, ארץ ישראל ומעגל החיים – עם חיפוש גם בתוך המצגות.">
<style>
:root{--bg:#f7f4ee;--paper:#fff;--ink:#1f2328;--muted:#6b6f76;--line:#e6e0d4;--acc:#6d4aff;--acc2:#b45309;--shadow:0 4px 18px rgba(40,30,10,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#15161a;--paper:#202227;--ink:#ecedf0;--muted:#a0a4ab;--line:#33363d;--acc:#a48bff;--acc2:#f59e0b;--shadow:0 4px 18px rgba(0,0,0,.35)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI",Heebo,Arial,sans-serif}
header{background:linear-gradient(135deg,#3b2a8f,#6d4aff 60%,#b45309);color:#fff;padding:28px 16px 40px;text-align:center}
header h1{margin:0 0 6px;font-size:clamp(1.7rem,5vw,2.5rem)}header p{margin:0;opacity:.92}
header a{color:#ffe7b3;text-decoration:none;font-size:.9rem;display:inline-block;margin-top:10px}
.bar{max-width:1180px;margin:-22px auto 0;padding:0 16px;position:relative}
#q{width:100%;padding:14px 18px;font-size:17px;border:1px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
#info{color:var(--muted);font-size:.88rem;margin:6px 4px 0;min-height:1.3em}
nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:1180px;margin:14px auto 0;padding:0 16px}
nav a{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:5px 12px;color:var(--ink);text-decoration:none;font-size:.9rem}
main{max-width:1180px;margin:0 auto;padding:0 16px 40px}
section h2{margin:30px 0 12px;font-size:1.3rem;border-bottom:2px solid var(--line);padding-bottom:6px}section h2 small{color:var(--muted);font-weight:400;font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.card>a{color:inherit;text-decoration:none;display:flex;flex-direction:column;flex:1}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#ece7f8;display:block}
.txt{padding:10px 14px;display:flex;flex-direction:column;flex:1}.txt h3{margin:0 0 6px;font-size:1.02rem;line-height:1.35}
.bul{margin:0 0 8px;padding:0 18px 0 0;font-size:.88rem;line-height:1.45;color:var(--muted);flex:1}.bul li{margin:1px 0}.bul li::marker{color:var(--acc2)}
.meta{color:var(--muted);font-size:.8rem;margin-bottom:4px}.go{color:var(--acc);font-weight:700;font-size:.9rem}
.hit{font-size:.84rem;background:rgba(245,158,11,.13);border-radius:8px;padding:6px 8px;margin:0 0 8px}.hit mark{background:#f59e0b;color:#fff;border-radius:3px;padding:0 2px}
.alts{padding:0 14px 10px;font-size:.82rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}.alts a{color:var(--acc);text-decoration:none;border:1px solid var(--line);border-radius:14px;padding:1px 9px}
.rate{display:flex;align-items:center;gap:1px;padding:0 12px 10px}.rate button{border:0;background:none;font-size:1.3rem;line-height:1;color:#d6cbbd;cursor:pointer;padding:2px}
.rate button.on{color:#f59e0b}.rate button.avgon{color:#f7c873}.rate .avg{margin-right:auto;color:var(--muted);font-size:.8rem}
#none{text-align:center;color:var(--muted);display:none;margin:30px}
</style><meta property="og:title" content="קטלוג המצגות – הקול החמישי">
<meta property="og:description" content="1219 מצגות לימוד בחומש, חגים, גדולי ישראל, תפילה, ארץ ישראל ומעגל החיים – עם חיפוש גם בתוך המצגות.">

</head><body>
<header><h1>קטלוג המצגות</h1><p>1219 מצגות לימוד – לחיצה פותחת את המצגת. החיפוש מחפש גם בתוך המצגות.</p>
<a href="/">→ לאתר הקול החמישי</a></header>
<div class="bar"><input id="q" type="search" placeholder="חיפוש: נושא, פרשה, צדיק, חג – או מילה מתוך המצגת…" autocomplete="off"><div id="info"></div></div>
<nav id="chips"></nav><main id="main"></main><p id="none">לא נמצאו מצגות</p>
<script src="data.js"></script>
<script>
(function(){
var S=DATA.sections, I=DATA.items, main=document.getElementById("main"), chips=document.getElementById("chips");
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});};
var norm=function(s){return s.normalize("NFD").replace(/[֑-ׇ]/g,"").toLowerCase();};
var G="https://gamma.app/docs/";
S.forEach(function(s){
  var its=I.filter(function(i){return i.s===s[0];}); if(!its.length) return;
  chips.insertAdjacentHTML("beforeend",'<a href="#'+s[0]+'">'+s[1]+" "+esc(s[2])+" ("+its.length+")</a>");
  var h='<section id="'+s[0]+'"><h2>'+s[1]+" "+esc(s[2])+" <small>"+its.length+'</small></h2><div class="grid">';
  its.forEach(function(i){
    i.k=norm(i.t+" "+(i.b||[]).join(" "));
    h+='<div class="card" data-id="'+i.id+'"><a href="'+G+i.id+'" target="_blank" rel="noopener"><img loading="lazy" src="img/'+i.id+'.webp" alt="">'
      +'<div class="txt"><h3>'+esc(i.t)+'</h3>'+(i.b&&i.b.length?'<ul class="bul">'+i.b.map(function(b){return "<li>"+esc(b)+"</li>";}).join("")+"</ul>":"")
      +'<div class="meta">'+i.n+' שקפים</div><span class="go">פתיחה ב-Gamma ↗</span></div></a>'
      +(i.a&&i.a.length?'<div class="alts">עוד גרסאות: '+i.a.map(function(a,k){return '<a href="'+G+a+'" target="_blank" rel="noopener">גרסה '+(k+2)+"</a>";}).join("")+"</div>":"")
      +'<div class="rate" data-id="'+i.id+'">'+[1,2,3,4,5].map(function(n){return '<button type="button" data-n="'+n+'" aria-label="'+n+' כוכבים">★</button>';}).join("")+'<span class="avg"></span></div></div>';
  });
  main.insertAdjacentHTML("beforeend",h+"</div></section>");
});
var cards={}; [].forEach.call(document.querySelectorAll(".card"),function(c){cards[c.dataset.id]=c;});
var BY={}; I.forEach(function(i){BY[i.id]=i;}); I=[].map.call(document.querySelectorAll(".card"),function(c){return BY[c.dataset.id];});  // page order: excerpts go to the cards on top
var W=null, loading=false, T={}, q=document.getElementById("q"), info=document.getElementById("info");
function loadWords(){ if(W||loading) return; loading=true; info.textContent="טוען את החיפוש בתוך המצגות…";
  fetch("words.json").then(function(r){return r.json();}).then(function(d){W=d; info.textContent=""; run();}).catch(function(){info.textContent="";}); }
function excerpt(id,w){
  var c=cards[id], show=function(t){ var old=c.querySelector(".hit"); if(old) old.remove();
    var k=t.indexOf(w); if(k<0) return; var a=Math.max(0,k-55),e=Math.min(t.length,k+w.length+55),d=document.createElement("div"); d.className="hit";
    d.appendChild(document.createTextNode("בתוך המצגת: "+(a?"…":"")+t.slice(a,k))); var m=document.createElement("mark"); m.textContent=t.slice(k,k+w.length); d.appendChild(m);
    d.appendChild(document.createTextNode(t.slice(k+w.length,e)+(e<t.length?"…":""))); c.querySelector(".txt").insertBefore(d,c.querySelector(".meta")); };
  if(T[id]) return show(T[id]);
  fetch("t/"+id+".txt").then(function(r){return r.text();}).then(function(t){T[id]=t; if(norm(q.value).indexOf(w)>=0) show(t);});
}
function run(){
  var v=norm(q.value.trim()), w=v.split(/\s+/).filter(Boolean), n=0, shown=0;
  if(v.length>=2) loadWords();
  I.forEach(function(i){
    var c=cards[i.id], old=c.querySelector(".hit"); if(old) old.remove();
    var ok=w.every(function(x){return i.k.indexOf(x)>=0||(W&&W[i.id]&&W[i.id].indexOf(x)>=0);});
    c.style.display=ok?"":"none"; if(ok) n++;
    if(ok&&w.length){var x=w.filter(function(x){return i.k.indexOf(x)<0;})[0]; if(x&&shown<60){shown++; excerpt(i.id,x);}}
  });
  [].forEach.call(document.querySelectorAll("section"),function(s){s.style.display=[].some.call(s.querySelectorAll(".card"),function(c){return c.style.display!=="none";})?"":"none";});
  document.getElementById("none").style.display=n?"none":"block";
  if(W||!w.length) info.textContent=w.length?(n+" מצגות"):"";
}
var tm; q.addEventListener("input",function(){clearTimeout(tm); tm=setTimeout(run,150);});
})();
</script>
<script type="module">
// the shared rating of all the catalogs (catalog-kit/template): Firestore gamma-catalog, collection ratings, {sum, count}
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getFirestore, doc, getDocs, collection, query, where, documentId, runTransaction } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
const db = getFirestore(initializeApp({"apiKey": ["AIza", "SyBgjtJk9Wrw-lPpFlPBaQ6RHfqQ58R58LA"].join(""), "authDomain": "gamma-catalog.firebaseapp.com", "projectId": "gamma-catalog", "storageBucket": "gamma-catalog.firebasestorage.app", "messagingSenderId": "184606827021", "appId": "1:184606827021:web:e39a832b5bc12fe87aeb44"}));
const T = {}; let MY = {};
try { MY = JSON.parse(localStorage.getItem("mz_my") || "{}"); } catch (e) {}
const rates = [...document.querySelectorAll(".rate")];
const avg = id => { const x = T[id]; return x && x.count ? x.sum / x.count : 0; };
function paint(list) {
  (list || rates).forEach(r => { const id = r.dataset.id, x = T[id], m = MY[id] || 0, a = Math.round(avg(id));
    r.querySelectorAll("button").forEach(b => { const n = +b.dataset.n; b.classList.toggle("on", m > 0 && n <= m); b.classList.toggle("avgon", !m && n <= a); });
    r.querySelector(".avg").textContent = x && x.count ? "★ " + (x.sum / x.count).toFixed(1) + " · " + x.count : ""; });
}
const seen = new Set();
const io = new IntersectionObserver(async es => {           // ratings only for cards that come into view
  const ids = es.filter(e => e.isIntersecting && !seen.has(e.target.dataset.id)).map(e => (seen.add(e.target.dataset.id), e.target.dataset.id));
  for (let i = 0; i < ids.length; i += 10) {
    try { (await getDocs(query(collection(db, "ratings"), where(documentId(), "in", ids.slice(i, i + 10))))).forEach(d => T[d.id] = d.data()); }
    catch (e) { console.error(e); }
  }
  paint(rates.filter(r => ids.includes(r.dataset.id)));
}, {rootMargin: "300px"});
rates.forEach(r => io.observe(r));
rates.forEach(r => r.addEventListener("click", async ev => {
  const b = ev.target.closest("button"); if (!b) return;
  const id = r.dataset.id, v = +b.dataset.n, old = MY[id] || 0; if (v === old) return;
  MY[id] = v; try { localStorage.setItem("mz_my", JSON.stringify(MY)); } catch (e) {}
  paint([r]);
  try {
    const ref = doc(db, "ratings", id);
    await runTransaction(db, async tx => { const s = await tx.get(ref); let sum = 0, count = 0;
      if (s.exists()) { sum = s.data().sum || 0; count = s.data().count || 0; }
      if (old) sum += v - old; else { sum += v; count += 1; } tx.set(ref, {sum, count}); T[id] = {sum, count}; });
    paint([r]);
  } catch (e) { console.error(e); r.querySelector(".avg").textContent = "הדירוג לא נשמר"; }
}));
</script>
</body></html>
