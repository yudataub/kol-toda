            frequencies.forEach((freq, index) => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = freq;
                oscillator.type = 'sine';
                
                const startTime = audioContext.currentTime + (index * duration);
                gainNode.gain.setValueAtTime(0.3, startTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
                
                oscillator.start(startTime);
                oscillator.stop(startTime + duration);
            });
        }

                </div>
                
                <div class="lesson-content">
                    ${lesson.content}
                </div>
                
                <button class="btn-primary" onclick="startQuiz()">📝 מוּכָנִים לַשְּׁאֵלוֹת? בּוֹא נִרְאֶה! 💪</button>
            `;
        }

        function startQuiz() {
            playSound([659.25, 783.99], 0.2);
            renderQuestion();
        }

        function renderQuestion() {
            const lesson = lessons[currentLesson];
            const question = lesson.questions[currentQuestion];
            const shuffledAnswers = shuffleArray(question.answers);
            
            const container = document.getElementById('gameContainer');
            const lessonContent = container.querySelector('.lesson-content');
            const button = container.querySelector('.btn-primary');
            
            if (button) button.remove();
            
            const questionDiv = document.createElement('div');
            questionDiv.className = 'question-container';
            questionDiv.innerHTML = `
                <div class="score-display">נִקּוּד שִׁיעוּר: ${lessonScore}/${currentQuestion} ⭐</div>
                <div class="question-text">${currentQuestion + 1}. ${question.question}</div>
                <div class="answers-grid">
                    ${shuffledAnswers.map((answer, index) => `
                        <button class="answer-btn" onclick="checkAnswer(${shuffledAnswers.indexOf(question.answers[question.correct])}, ${index})">
                            ${answer}
                        </button>
                    `).join('')}
                </div>
                <div id="feedback"></div>
            `;
            
            container.appendChild(questionDiv);
        }

        function checkAnswer(correctIndex, selectedIndex) {
            const lesson = lessons[currentLesson];
            const question = lesson.questions[currentQuestion];
            const buttons = document.querySelectorAll('.answer-btn');
            const feedbackDiv = document.getElementById('feedback');
            
            buttons.forEach(btn => btn.disabled = true);
            
            answeredQuestions++;
            updateProgress();
            
            if (correctIndex === selectedIndex) {
                buttons[selectedIndex].classList.add('correct');
                lessonScore++;
                playSound([523.25, 659.25, 783.99], 0.3);
                
                const encouragements = [
                    'מְצֻיָּן! ⭐',
                    'נִפְלָא! 💪',
                    'כָּל הַכָּבוֹד! 🎯',
                    'מְעֻלֶּה! 🏆',
                    'פְּצַצָּה! 💥'
                ];
                const randomEncouragement = encouragements[Math.floor(Math.random() * encouragements.length)];
                
                feedbackDiv.className = 'feedback correct';
                feedbackDiv.innerHTML = `
                    <p><strong>${randomEncouragement}</strong></p>
                    <p>${question.explanation}</p>
                `;
            } else {
                buttons[selectedIndex].classList.add('wrong');
                buttons[correctIndex].classList.add('correct');
                playSound([392.00, 349.23], 0.3);
                
                feedbackDiv.className = 'feedback wrong';
                feedbackDiv.innerHTML = `
                    <p><strong>לֹא בְּדִיּוּק... 🤔</strong></p>
                    <p>${question.wrongExplanation}</p>
                `;
            }
            
            setTimeout(() => {
                currentQuestion++;
                if (currentQuestion < lesson.questions.length) {
                    renderQuestion();
                } else {
                    checkLessonCompletion();
                }
            }, 4000);
        }

        function checkLessonCompletion() {
            const lesson = lessons[currentLesson];
            const container = document.getElementById('gameContainer');
            
            if (lessonScore === lesson.questions.length) {
                // 100% - עבר!
                playSound([523.25, 659.25, 783.99, 1046.50, 783.99, 659.25], 0.25);
                
                container.innerHTML = `
                    <h1>🎉 מַדְהִים! אַתָּה שׁוֹלֵט! 🏆</h1>
                    
                    <div style="background: linear-gradient(135deg, #55efc4 0%, #00b894 100%); color: white; padding: 40px; border-radius: 20px; text-align: center; font-size: 1.4em;">
                        <p><strong>סִיַּמְתָּ אֶת הַשִּׁיעוּר בְּהַצְלָחָה מוּחְלֶטֶת!</strong> 💯</p>
                        <p style="font-size: 3em; margin: 20px 0;">⭐⭐⭐</p>
                        <p>${lessonScore}/${lesson.questions.length} נָכוֹן!</p>
                        <p><strong>אַתָּה חַי בְּאַהֲבַת ה׳!</strong> 💖</p>
                        <p>הַשֵּׁם שָׂמֵחַ וְגֵאֶה בְּךָ! 🌟</p>
                    </div>
                    
                    <button class="btn-primary" onclick="nextLesson()">
                        ${currentLesson < lessons.length - 1 ? '➡️ לַשִּׁיעוּר הַבָּא בְּשִׂמְחָה! 💫' : '🎓 לְסִיּוּם הַמַּסָּע! 🎉'}
                    </button>
                `;
            } else {
                // לא עבר - צריך לנסות שוב
                playSound([349.23, 293.66], 0.4);
                
                container.innerHTML = `
                    <h1>💪 כִּמְעַט שָׁם! בּוֹא נְנַסֶּה שׁוּב! 🌈</h1>
                    
                    <div style="background: linear-gradient(135deg, #fdcb6e 0%, #e17055 100%); color: white; padding: 40px; border-radius: 20px; text-align: center; font-size: 1.3em;">
                        <p><strong>עָנִיתָ נָכוֹן עַל ${lessonScore} מִתּוֹךְ ${lesson.questions.length} שְׁאֵלוֹת</strong> 📊</p>
                        <p style="font-size: 2.5em; margin: 20px 0;">🤗</p>
                        <p>כְּדֵי לְעָבוֹר לַשִּׁיעוּר הַבָּא, צָרִיךְ לַעֲנוֹת נָכוֹן עַל <strong>כָּל 3 הַשְּׁאֵלוֹת</strong> 🎯</p>
                        <p><strong>אֲבָל אַל תִּדְאַג!</strong> 💕</p>
                        <p>גַּם כְּשֶׁטּוֹעִים - לוֹמְדִים וְצוֹמְחִים! 🌱</p>
                        <p>הַשֵּׁם אוֹהֵב אוֹתְךָ וּמַאֲמִין בְּךָ! ✨</p>
                        <p>בּוֹא נְנַסֶּה שׁוּב בְּאַהֲבָה וּבְשִׂמְחָה! 🌟</p>
                    </div>
                    
                    <button class="btn-primary" onclick="retryLesson()">🔄 בּוֹא נְנַסֶּה שׁוּב בְּאַהֲבָה! 💖</button>
                `;
            }
        }

        function retryLesson() {
            playSound([523.25, 659.25], 0.2);
            lessonScore = 0;
            currentQuestion = 0;
            renderLesson();
        }

        function nextLesson() {
            totalScore += lessonScore;
            currentLesson++;
            renderLesson();
        }

        function renderCompletion() {
            playSound([523.25, 659.25, 783.99, 1046.50, 783.99, 659.25], 0.3);
            
            const container = document.getElementById('gameContainer');
            container.innerHTML = `
                <h1>🎉 מַזָּל טוֹב! סִיַּמְתָּ אֶת הַמַּסָּע! 🏆</h1>
                
                <div class="certificate">
                    <h2>🎓 תְּעוּדַת הִצְטַיְּנוּת 🌟</h2>
                    <p style="font-size: 1.8em; margin: 25px 0;">⭐⭐⭐</p>
                    <p><strong>הוֹכַחְתָּ שֶׁאַתָּה מַכִּיר אֶת סוֹד הַתְּפִלָּה!</strong></p>
                    <p>עָנִיתָ נָכוֹן עַל כָּל הַשְּׁאֵלוֹת בְּכָל הַשִּׁיעוּרִים! 💯</p>
                    <p><strong>אַתָּה יוֹדֵעַ לָחִיּוֹת בְּאַהֲבַת ה׳!</strong> 💖</p>
                    <p style="font-style: italic; margin-top: 25px; font-size: 1.2em;">"וְאָהַבְתָּ אֵת ה׳ אֱלֹקֶיךָ בְּכָל לְבָבְךָ וּבְכָל נַפְשְׁךָ וּבְכָל מְאֹדֶךָ"</p>
                </div>
                
                <div class="final-questions">
                    <h3>💭 שְׁאֵלוֹת לְמַחְשָׁבָה</h3>
                    <ul>
                        <li>אֵיךְ אוּכַל לְהָבִיא יוֹתֵר אַהֲבַת ה׳ לַלִּמּוּד הַבָּא שֶׁלִּי?</li>
                        <li>אֵיזוֹ מִצְוָה אֲנִי רוֹצֶה לְקַיֵּם הַיּוֹם מִתּוֹךְ שִׂמְחָה?</li>
                        <li>כַּמָּה חֲסָדִים אֲנִי יָכוֹל לִמְנוֹת עַל יָדִי הַיּוֹם?</li>
                    </ul>
                </div>
                
                <a href="https://forms.gle/A66uubei4XSX6SG2A" target="_blank" class="raffle-link">
                    🎁 לַהִרָשֵׁם לְהַגְרָלַת פְּרָסִים! 🎉
                </a>
                
                <div class="contact-info">
                    <p><strong>נִבְנָה בְּאַהֲבָה עַל יְדֵי:</strong></p>
                    <p>הָרַב יְהוּדָה טָאוּב מִקִּרְיַת אַתָּא 💫</p>
                    <p>📞 לִפְרָטִים: 0527139520</p>
                    <p style="margin-top: 15px; font-size: 1.1em;">זְכוּת הַלִּמּוּד תָּגֵן עָלֵינוּ! 🙏✨</p>
                </div>
            `;
        }

        // התחלה
        window.onload = renderIntro;
    </script>
