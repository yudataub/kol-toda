        // Web Audio API Setup
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        function playTone(frequency, duration, delay = 0) {
            setTimeout(() => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = frequency;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + duration);
            }, delay);
        }

        function playSuccessSound() {
            playTone(523.25, 0.2, 0);    // C5

            playTone(783.99, 0.3, 400);  // G5

            container.innerHTML = `

                    <div class="progress-bar" style="width: ${((currentLesson + (currentQuestion / lesson.questions.length)) / lessons.length) * 100}%">

                    <div class="question-text">${question.q}</div>
                    ${shuffledAnswers.map((answer, index) => `

                            ${answer.text}
                        </button>
                    `).join('')}
                    <div id="feedback"></div>
                </div>
            `;
        }

        function checkAnswer(isCorrect, answerIndex) {
            const question = lessons[currentLesson].questions[currentQuestion];
            const allButtons = document.querySelectorAll('.answer-btn');
            const feedbackDiv = document.getElementById('feedback');
            
            allButtons.forEach(btn => btn.disabled = true);
            
            const clickedButton = document.getElementById(`answer-${answerIndex}`);
            
            if (isCorrect) {
                clickedButton.classList.add('correct');
                lessonScore++;
                totalScore += 10;
                playSuccessSound();
                
                feedbackDiv.innerHTML = `
                    <div class="feedback correct">
                        ${question.correctFeedback}
                    </div>
                `;
            } else {
                clickedButton.classList.add('incorrect');
                
                feedbackDiv.innerHTML = `
                    <div class="feedback incorrect">
                        ${question.incorrectFeedback}
                    </div>
                `;
            }
            
            answeredQuestions.push({ correct: isCorrect });
            
            setTimeout(() => {
                currentQuestion++;
                renderQuestion();
            }, 4000);
        }
