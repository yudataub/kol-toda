    <div class="game-container" id="gameContainer">

    <script>
        // משתנים גלובליים
        var gameState = {
            currentLesson: -1,
            currentQuestion: 0,
            score: 0,
            lessonScore: 0,
            answeredQuestions: 0,
            audioContext: null
        };

        // אתחול Audio
        function initAudio() {
            if (!gameState.audioContext) {
                try {
                    gameState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                } catch(e) {
                    console.log('Audio not supported');
                }
            }
            if (gameState.audioContext && gameState.audioContext.state === 'suspended') {
                gameState.audioContext.resume();
            }
        }

        // פונקציה לנגינת צלילים
        function playSound(frequencies) {
            try {
                initAudio();
                if (!gameState.audioContext) return;
                
                var now = gameState.audioContext.currentTime;
                for (var i = 0; i < frequencies.length; i++) {
                    var oscillator = gameState.audioContext.createOscillator();
                    var gainNode = gameState.audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(gameState.audioContext.destination);
                    
                    oscillator.frequency.value = frequencies[i];
                    oscillator.type = 'sine';
                    
                    gainNode.gain.setValueAtTime(0.3, now + i * 0.2);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + (i + 1) * 0.2);
                    
                    oscillator.start(now + i * 0.2);
                    oscillator.stop(now + (i + 1) * 0.2);
                }
            } catch(e) {
                console.log('Sound error:', e);
            }
        }

        // ערבוב מערך
        function shuffle(array) {
            var newArray = array.slice();
            for (var i = newArray.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var temp = newArray[i];
                newArray[i] = newArray[j];
                newArray[j] = temp;
            }
            return newArray;
        }

                '<li>💎 מָה זֶה יִסּוּרִים שֶׁל אַהֲבָה?</li>' +
                '<li>🔥 זִיכּוּךְ הַגּוּף וְהַנֶּפֶשׁ</li>' +
                '<li>💡 כָּל הַיִּסּוּרִים הֵם שֶׁל אַהֲבָה!</li>' +
                '<li>👑 סִיפּוּר וְיִישׁוּם מַעֲשִׂי</li>' +
                '</ul>' +
                '<div class="inspiration-box" style="margin-top: 30px;">' +
                '💡 בְּכָל שִׁיעוּר יֵשׁ 3 שְׁאֵלוֹת!<br>' +
                'צָרִיךְ 2 תְּשׁוּבוֹת נְכוֹנוֹת (66%) כְּדֵי לְהַמְשִׁיךְ! 🎯<br>' +
                'נִלְמַד עַל זִיכּוּךְ הַחוֹמֶר וּדְבוּקוּת! 🌈💖' +
                '</div>' +
                '</div>' +
                '<button class="btn" onclick="startGame()">🚀 בּוֹאוּ נִלְמַד! 💎</button>' +
                '<div class="footer">' +
                '<p><strong>💫 נִבְנָה בְּאַהֲבָה:</strong></p>' +
                '<p>הָרַב יְהוּדָה טָאוּב מִקִּרְיַת אַתָּא</p>' +
                '<p>📞 לִפְרָטִים: 0527139520</p>' +
                '</div>';
        }

        // התחלת משחק
        function startGame() {
            gameState.currentLesson = 0;
            gameState.score = 0;
            renderLesson();
        }

        // רנדור שיעור
        function renderLesson() {
            if (gameState.currentLesson >= lessons.length) {
                renderComplete();
                return;
            }

            var lesson = lessons[gameState.currentLesson];
            gameState.currentQuestion = 0;
            gameState.lessonScore = 0;
            gameState.answeredQuestions = 0;

            var container = document.getElementById('gameContainer');
            var progress = ((gameState.currentLesson + 1) / lessons.length) * 100;
            
            container.innerHTML =
                '<div class="progress-bar">' +
                '<div class="progress-fill" style="width: ' + progress + '%">' +
                'שִׁיעוּר ' + (gameState.currentLesson + 1) + ' מִתּוֹךְ ' + lessons.length +
                '</div></div>' +
                '<div class="score-display">נִקּוּד: ' + gameState.score + ' 🌟</div>' +
                '<h2>' + lesson.title + '</h2>' +
                '<div class="lesson-content">' + lesson.content + '</div>' +
                '<button class="btn" onclick="startQuestions()">📝 לַשְּׁאֵלוֹת! 💪</button>';
        }

        // התחלת שאלות
        function startQuestions() {
            renderQuestion();
        }

        // רנדור שאלה
        function renderQuestion() {
            var lesson = lessons[gameState.currentLesson];
            var question = lesson.questions[gameState.currentQuestion];
            
            // ערבוב תשובות
            var answersWithIndex = [];
            for (var i = 0; i < question.answers.length; i++) {
                answersWithIndex.push({
                    text: question.answers[i],
                    isCorrect: i === question.correct,
                    index: i
                });
            }
            var shuffledAnswers = shuffle(answersWithIndex);

            var container = document.getElementById('gameContainer');
            var progress = ((gameState.currentLesson + 1) / lessons.length) * 100;
            
            var html =
                '<div class="progress-bar">' +
                '<div class="progress-fill" style="width: ' + progress + '%">' +
                'שִׁיעוּר ' + (gameState.currentLesson + 1) + ' - שְׁאֵלָה ' + (gameState.currentQuestion + 1) + '/3' +
                '</div></div>' +
                '<div class="score-display">נִקּוּד: ' + gameState.lessonScore + '/' + gameState.answeredQuestions + ' ✨</div>' +
                '<h2>שְׁאֵלָה ' + (gameState.currentQuestion + 1) + ' מִתּוֹךְ 3</h2>' +
                '<div class="question-container">' +
                '<div class="question-text">' + question.question + '</div>' +
                '<div class="answers" id="answers">';
            
            for (var i = 0; i < shuffledAnswers.length; i++) {
                html += '<button class="answer-btn" onclick="checkAnswer(' + shuffledAnswers[i].isCorrect + ', ' + i + ')">' +
                    shuffledAnswers[i].text + '</button>';
            }
            
            html += '</div><div id="feedback"></div></div>';
            
            container.innerHTML = html;
        }

        // בדיקת תשובה
        function checkAnswer(isCorrect, buttonIndex) {
            var buttons = document.querySelectorAll('.answer-btn');
            var feedback = document.getElementById('feedback');
            
            // נטרול כל הכפתורים
            for (var i = 0; i < buttons.length; i++) {
                buttons[i].disabled = true;
            }
            
            gameState.answeredQuestions++;
            
            var encouragements = ['מְצֻיָּן! ⭐', 'כָּל הַכָּבוֹד! 💪', 'נִפְלָא! 🎯', 'מוֹשְׁלָם! 🏆', 'פֶּצַצָּה! 🎉'];
            
            if (isCorrect) {
                buttons[buttonIndex].classList.add('correct');
                gameState.lessonScore++;
                gameState.score++;
                
                playSound([261.63, 329.63, 392.00]);
                
                var randomEncouragement = encouragements[Math.floor(Math.random() * encouragements.length)];
                
                feedback.className = 'feedback correct';
                feedback.innerHTML =
                    '<strong>' + randomEncouragement + '</strong><br>' +
                    lessons[gameState.currentLesson].questions[gameState.currentQuestion].explanation + '<br>' +
                    '<em>הַשֵּׁם שָׂמֵחַ! 💖</em>';
            } else {
                buttons[buttonIndex].classList.add('wrong');
                
                feedback.className = 'feedback wrong';
                feedback.innerHTML =
                    '<strong>לֹא בְּדִיּוּק... 🤔</strong><br>' +
                    lessons[gameState.currentLesson].questions[gameState.currentQuestion].explanation + '<br>' +
                    '<em>גַּם כְּשֶׁטּוֹעִים - לוֹמְדִים! הַשֵּׁם אוֹהֵב! 💡</em>';
            }
            
            setTimeout(function() {
                gameState.currentQuestion++;
                if (gameState.currentQuestion < lessons[gameState.currentLesson].questions.length) {
                    renderQuestion();
                } else {
                    checkLessonComplete();
                }
            }, 4500);
        }

        // בדיקת השלמת שיעור
        function checkLessonComplete() {
            var container = document.getElementById('gameContainer');
            var percentage = (gameState.lessonScore / 3) * 100;
            
            if (gameState.lessonScore >= 2) {
                playSound([261.63, 329.63, 392.00, 523.25, 392.00, 329.63]);
                
                var message = '';
                if (gameState.lessonScore === 3) {
                    message = 'מַדְהִים! 🏆 אַתָּה שׁוֹלֵט! אַתָּה חַי בְּאַהֲבַת ה\'! 🎉💎';
                } else {
                    message = 'כִּמְעַט מֻשְׁלָם! 💪 מַמְשִׁיךְ לִצְמוֹחַ! 🌱✨';
                }
                
                container.innerHTML =
                    '<h2>✨ סִיּוּם שִׁיעוּר ' + (gameState.currentLesson + 1) + ' ✨</h2>' +
                    '<div class="certificate" style="background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%); border-color: #28a745;">' +
                    '<h2 style="color: #155724;">' + message + '</h2>' +
                    '<p class="certificate-text">' +
                    '<strong>הִצְלַחְתָּ בְּ־' + gameState.lessonScore + ' מִתּוֹךְ 3!</strong><br>' +
                    '(' + Math.round(percentage) + '% הַצְלָחָה) 🌟' +
                    '</p>' +
                    '<p style="font-size: 1.25em; margin-top: 20px;">' +
                    'נִקּוּד כּוֹלֵל: <strong>' + gameState.score + '</strong> ⭐' +
                    '</p>' +
                    '</div>' +
                    '<div class="inspiration-box">' +
                    '💖 הַשֵּׁם גֵּאֶה בְךָ! אַתָּה לוֹמֵד עַל דְּבוּקוּת! 💎✨' +
                    '</div>' +
                    '<button class="btn" onclick="nextLesson()">➡️ הַמְשֵׁךְ! 🚀</button>';
            } else {
                container.innerHTML =
                    '<h2>💪 בּוֹא נְנַסֶּה שׁוּב!</h2>' +
                    '<div class="certificate" style="background: linear-gradient(135deg, #fff3cd 0%, #ffeaa7 100%); border-color: #ffc107;">' +
                    '<h2 style="color: #856404;">הִצְלַחְתָּ בְּ־' + gameState.lessonScore + ' מִתּוֹךְ 3 🤔</h2>' +
                    '<p class="certificate-text">' +
                    'צָרִיךְ לְפָחוֹת 2 תְּשׁוּבוֹת.<br>' +
                    'אֲבָל אַל תִּתְיָאֵשׁ! זֶה זִיכּוּךְ! 💪💎' +
                    '</p>' +
                    '</div>' +
                    '<div class="inspiration-box">' +
                    '💖 נְנַסֶּה שׁוּב בְּאַהֲבָה! הַשֵּׁם אוֹהֵב! 🌈' +
                    '</div>' +
                    '<button class="btn" onclick="retryLesson()">🔄 נְנַסֶּה שׁוּב! 💪</button>';
            }
        }

        // שיעור הבא
        function nextLesson() {
            gameState.currentLesson++;
            renderLesson();
        }

        // ניסיון חוזר
        function retryLesson() {
            renderLesson();
        }

        // השלמת משחק
        function renderComplete() {
            var container = document.getElementById('gameContainer');
            var totalPossible = lessons.length * 3;
            var percentage = Math.round((gameState.score / totalPossible) * 100);
            
            playSound([261.63, 329.63, 392.00, 523.25, 392.00, 329.63]);
            
            container.innerHTML =
                '<div class="certificate">' +
                '<h2>🏆 תְּעוּדַת הִצְטַיְּנוּת 🏆</h2>' +
                '<p class="certificate-text">' +
                '<strong>מַזָּל טוֹב! 🎉</strong><br><br>' +
                'הִשְׁלַמְתָּ אֶת כָּל הַשִּׁיעוּרִים!<br>' +
                'הִצְלַחְתָּ בְּ־<strong>' + gameState.score + '</strong> מִתּוֹךְ ' + totalPossible + '!<br>' +
                '(' + percentage + '% הַצְלָחָה) 🌟💎' +
                '</p>' +
                '<div style="background: white; padding: 25px; border-radius: 12px; margin: 25px 0; border: 3px dashed #ffc107;">' +
                '<p style="font-size: 1.2em; line-height: 2.2; color: #0077be;">' +
                '📜 <strong>פָּסוּק:</strong><br>' +
                'קָרוֹב ה\' לְנִשְׁבְּרֵי לֵב<br>' +
                'וְאֶת דַּכְּאֵי רוּחַ יוֹשִׁיעַ ❤️💫' +
                '</p>' +
                '</div>' +
                '</div>' +
                '<div class="maharal-box">' +
                '<h3 style="text-align: center; color: #6a1b9a; margin-bottom: 20px;">💭 שְׁאֵלוֹת לְמַחְשָׁבָה</h3>' +
                '<ul style="line-height: 2.2; font-size: 1.15em;">' +
                '<li>💎 אֵיךְ אֲנִי יָכוֹל לִרְאוֹת בַּקְּשָׁיִים הִזְדַּמְנוּת?</li>' +
                '<li>🙏 אֵיזֶה דְּבוּקוּת גַּשְׁמִית לְשַׁחְרֵר?</li>' +
                '<li>💖 אֵיךְ לְקַבֵּל יִסּוּרִים בְּאַהֲבָה?</li>' +
                '<li>🌟 מָה הָרְכוּשׁ הַגָּדוֹל שֶׁאֲנִי מְצַפֶּה לוֹ?</li>' +
                '</ul>' +
                '</div>' +
                '<div class="inspiration-box">' +
                '<p style="font-size: 1.35em;"><strong>💖 כָּל הַכָּבוֹד! 🎉</strong></p>' +
                '<p>זָכִיתָ לְסַיֵּם אֶת הַמַּסָּע!<br>' +
                'עַכְשָׁיו אַתָּה נִכְנָס לְהַגְרָלָה! 🎁💎</p>' +
                '<p style="margin-top: 20px;">' +
                '<a href="https://forms.gle/A66uubei4XSX6SG2A" target="_blank" ' +
                'style="display: inline-block; background: linear-gradient(135deg, #4caf50 0%, #45a049 100%); ' +
                'color: white; padding: 18px 40px; border-radius: 50px; text-decoration: none; ' +
                'font-weight: bold; font-size: 1.25em; box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);">' +
                '🎯 לְהַגְרָלָה! 🎁' +
                '</a>' +
                '</p>' +
                '</div>' +
                '<button class="btn" onclick="location.reload()">🔄 מִשְׂחָק חָדָשׁ 🎮</button>' +
                '<div class="footer">' +
                '<p><strong>💫 נִבְנָה בְּאַהֲבָה:</strong></p>' +
                '<p>הָרַב יְהוּדָה טָאוּב מִקִּרְיַת אַתָּא</p>' +
                '<p>📞 לִפְרָטִים: 0527139520</p>' +
                '<p style="margin-top: 25px; font-size: 1.2em;">' +
                '🌟 יְהִי רָצוֹן שֶׁנִּזְכֶּה לְקַבֵּל כָּל יִסּוּר בְּאַהֲבָה! 💖💎' +
                '</p>' +
                '<p style="font-size: 1.15em; margin-top: 15px;">' +
                'וַעֲבָדוּם וְעִנּוּ אוֹתָם → וְאַחֲרֵי כֵן יֵצְאוּ בִּרְכוּשׁ גָּדוֹל 🌈✨' +
                '</p>' +
                '</div>';
        }

        // אתחול
        window.onload = function() {
            renderIntro();
        };
    </script>
