        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(frequencies, durations) {
            let startTime = audioContext.currentTime;
            frequencies.forEach((freq, index) => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = freq;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.3, startTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + durations[index]);
                
                oscillator.start(startTime);
                oscillator.stop(startTime + durations[index]);
                
                startTime += durations[index];
            });
        }

                        q: "מָה יַעֲקֹב אָבִינוּ אָמַר לִפְנֵי שֶׁבִּקֵּשׁ?",
                        answers: [
                            "הוּא אָמַר: 'קָטֹנְתִּי מִכָּל הַחֲסָדִים' – רָאָה כַּמָּה טוֹבָה קִבֵּל",
                            "הוּא אָמַר: 'אֲנִי גִּבּוֹר וְחָזָק וּמַגִּיעַ לִי כָּל הַכָּבוֹד בָּעוֹלָם'",
                            "הוּא אָמַר: 'אֵין לִי כְּלוּם וְאֲנִי עָנִי וְלֹא מַגִּיעַ לִי כְּלָל'",
                            "הוּא אָמַר: 'תֵּן לִי עוֹד וְעוֹד כִּי זֶה מַה שֶּׁאֲנִי רוֹצֶה עַכְשָׁו'"
                        ],
                        correct: 0
                    },
                    {
                        q: "מַה הַצַּעַד הָרִאשׁוֹן לִפְנֵי תְּפִלָּה מְתֻקֶּנֶת?",
                        answers: [
                            "הוֹדֵה קֹדֶם – סַפֵּר לַשֵּׁם עַל כָּל הַחֲסָדִים שֶׁכְּבָר קִבַּלְתָּ",
                            "בַּקֵּשׁ מִיָּד כָּל מַה שֶּׁאַתָּה רוֹצֶה בְּלִי לְחַכּוֹת לְמַשֶּׁהוּ",
                            "תֵּן צְדָקָה גְּדוֹלָה לָעֲנִיִּים וְאָז תּוּכַל לְבַקֵּשׁ כָּל דָּבָר",
                            "הִתְפַּלֵּל עֶשֶׂר פְּעָמִים אֶת אוֹתָהּ תְּפִלָּה כְּדֵי שֶׁתִּתְקַבֵּל"
                        ],
                        correct: 0
                    }
                ]
            }
        ];

        // פונקציות עזר
        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function updateProgress() {
            const progress = ((currentLesson + 1) / lessons.length) * 100;
            const progressBar = document.querySelector('.progress-bar');
            if (progressBar) {
                progressBar.style.width = progress + '%';
                progressBar.textContent = Math.round(progress) + '%';
            }
        }

        function renderIntro() {
            const container = document.getElementById('gameContainer');
            container.innerHTML = `
                <h1 class="animate-pulse">סוֹד הַתְּפִלָּה שֶׁעוֹבֶדֶת 💖✨</h1>
                <div class="intro-text fade-in">
                    <p style="font-size: 1.3em; text-align: center; margin-bottom: 15px;">
                        🌟 שָׁלוֹם וּבְרָכָה חֲבֵרִים יְקָרִים! 🌟
                    </p>
                    <p>הַיּוֹם נִלְמַד סוֹד נִפְלָא מִפָּרָשַׁת וַיֵּרָא! 📖✨</p>
                    <p>לָמָּה תְּפִלַּת לוֹט הִתְקַבְּלָה וּתְפִלַּת אַבְרָהָם אָבִינוּ נִדְחֵית? 🤔</p>
                    <p>נְגַלֶּה אֶת <span class="highlight">הַסּוֹד לִתְפִלָּה שֶׁמַּגִּיעָה יָשָׁר לַשָּׁמַיִם!</span> 🙏💫</p>
                    <p style="text-align: center; font-size: 1.4em; margin-top: 20px;">
                        💝 הַשֵּׁם אוֹהֵב אוֹתְךָ וְרוֹצֶה שֶׁתֵּדַע לְהִתְפַּלֵּל נָכוֹן! 💝
                    </p>
                    <p style="text-align: center; margin-top: 15px;">
                        <strong>חָשׁוּב:</strong> צָרִיךְ לַעֲנוֹת נָכוֹן עַל כָּל 3 הַשְּׁאֵלוֹת (100%) כְּדֵי לַעֲבוֹר לַשִּׁיעוּר הַבָּא! 🎯
                    </p>
                </div>
                <button class="start-btn" onclick="startGame()">בּוֹאוּ נַתְחִיל! 🚀</button>
            `;
        }

        function startGame() {
            currentLesson = 0;
            totalScore = 0;
            renderLesson();
        }

        function renderLesson() {
            if (currentLesson >= lessons.length) {
                renderComplete();
                return;
            }

            const lesson = lessons[currentLesson];
            currentQuestion = 0;
            lessonScore = 0;
            answeredQuestions = 0;

            const container = document.getElementById('gameContainer');
            container.innerHTML = `
                <div class="progress-container">
                    <div class="progress-bar" style="width: 0%">0%</div>
                </div>
                <div class="score-display">
                    נִקּוּד כּוֹלֵל: ${totalScore} 🌟
                </div>
                <div class="lesson-content fade-in">
                    <div class="lesson-title">${lesson.title}</div>
                    ${lesson.content}
                    <div class="inspiration-box">
                        ${lesson.inspirationQuestion}
                    </div>
                </div>
                <div id="questionsContainer"></div>
            `;

            updateProgress();
            renderQuestion();
        }

        function renderQuestion() {
            const lesson = lessons[currentLesson];
            if (currentQuestion >= lesson.questions.length) {
                checkLessonComplete();
                return;
            }

            const question = lesson.questions[currentQuestion];
            const shuffledAnswers = shuffleArray(question.answers);
            const correctAnswerText = question.answers[question.correct];
            const correctIndex = shuffledAnswers.indexOf(correctAnswerText);

            const questionsContainer = document.getElementById('questionsContainer');
            const questionDiv = document.createElement('div');
            questionDiv.className = 'question-box fade-in';
            questionDiv.innerHTML = `
                <div class="question-text">
                    שְׁאֵלָה ${currentQuestion + 1} מִתּוֹךְ ${lesson.questions.length}: ${question.q}
                </div>
                ${shuffledAnswers.map((answer, index) => `
                    <button class="answer-btn" onclick="checkAnswer(${index}, ${correctIndex})" id="answer-${index}">
                        ${answer}
                    </button>
                `).join('')}
                <div id="feedback-${currentQuestion}"></div>
            `;

            questionsContainer.appendChild(questionDiv);
        }

        function checkAnswer(selectedIndex, correctIndex) {
            answeredQuestions++;
            const feedbackDiv = document.getElementById(`feedback-${currentQuestion}`);
            const buttons = document.querySelectorAll('.answer-btn');
            
            buttons.forEach(btn => btn.disabled = true);

            if (selectedIndex === correctIndex) {
                lessonScore++;
                totalScore += 10;
                playCorrectSound();
                
                const encouragements = [
                    "מְצֻיָּן! ⭐",
                    "נִפְלָא! 💪",
                    "כָּל הַכָּבוֹד! 🎯",
                    "פַּצְצָה! 🚀",
                    "יוֹפִי! 🌟"
                ];
                const randomEncouragement = encouragements[Math.floor(Math.random() * encouragements.length)];
                
                feedbackDiv.className = 'feedback correct fade-in';
                feedbackDiv.innerHTML = `
                    <div style="font-size: 1.5em; margin-bottom: 10px;">${randomEncouragement}</div>
                    <div>תְּשׁוּבָה נְכוֹנָה לְגַמְרֵי! אַתָּה לוֹמֵד נֶהֱדָר! 📚✨</div>
                    <div class="love-message" style="margin-top: 15px;">
                        💖 הַשֵּׁם שָׂמֵחַ כְּשֶׁרוֹאֶה אוֹתְךָ לוֹמֵד בְּאַהֲבָה! 💖
                    </div>
                `;
            } else {
                feedbackDiv.className = 'feedback incorrect fade-in';
                feedbackDiv.innerHTML = `
                    <div style="font-size: 1.5em; margin-bottom: 10px;">לֹא בְּדִיּוּק... 🤔</div>
                    <div>אֵין דָּבָר, חָשׁוּב לְנַסּוֹת! חִשְּׁבוּ שׁוּב עַל הַחֹמֶר שֶׁלָּמַדְנוּ. 💭</div>
                    <div class="love-message" style="margin-top: 15px;">
                        💡 גַּם כְּשֶׁטּוֹעִים – לוֹמְדִים! הַשֵּׁם אוֹהֵב אוֹתְךָ תָּמִיד! 💡
                    </div>
                `;
            }

            setTimeout(() => {
                currentQuestion++;
                if (currentQuestion < lessons[currentLesson].questions.length) {
                    renderQuestion();
                } else {
                    checkLessonComplete();
                }
            }, 3000);
        }

        function checkLessonComplete() {
            const container = document.getElementById('gameContainer');
            const questionsContainer = document.getElementById('questionsContainer');
            
            const requiredScore = lessons[currentLesson].questions.length; // צריך 100%
            const percentage = (lessonScore / requiredScore) * 100;

            if (percentage === 100) {
                playCompleteSound();
                questionsContainer.innerHTML += `
                    <div class="feedback correct fade-in" style="margin-top: 30px;">
                        <div style="font-size: 2em;">🏆 מַדְהִים! 🏆</div>
                        <div style="font-size: 1.5em; margin: 15px 0;">
                            עָנִיתָ נָכוֹן עַל כָּל הַשְּׁאֵלוֹת! ${lessonScore}/${requiredScore} ✨
                        </div>
                        <div class="love-message">
                            💫 אַתָּה חַי בְּאַהֲבַת ה'! הַשֵּׁם גֵּאֶה בְּךָ! 💫
                        </div>
                        <button class="continue-btn" onclick="nextLesson()">
                            הַמְשֵׁךְ לַשִּׁיעוּר הַבָּא! 🚀
                        </button>
                    </div>
                `;
            } else {
                questionsContainer.innerHTML += `
                    <div class="feedback incorrect fade-in" style="margin-top: 30px;">
                        <div style="font-size: 1.8em;">💪 כִּמְעַט מֻשְׁלָם! 💪</div>
                        <div style="font-size: 1.3em; margin: 15px 0;">
                            עָנִיתָ נָכוֹן עַל ${lessonScore} מִתּוֹךְ ${requiredScore} שְׁאֵלוֹת.
                        </div>
                        <div>צָרִיךְ לַעֲנוֹת נָכוֹן עַל <strong>כָּל 3 הַשְּׁאֵלוֹת (100%)</strong> כְּדֵי לַעֲבוֹר הָלְאָה! 🎯</div>
                        <div class="love-message">
                            💖 בּוֹא נְנַסֶּה שׁוּב, בְּאַהֲבָה וּבְסַבְלָנוּת! הַשֵּׁם תָּמִיד אִתְּךָ! 💖
                        </div>
                        <button class="retry-btn" onclick="renderLesson()">
                            בּוֹא נְנַסֶּה שׁוּב! 🔄
                        </button>
                    </div>
                `;
            }
        }

        function nextLesson() {
            currentLesson++;
            renderLesson();
        }

        function renderComplete() {
            playCompleteSound();
            const container = document.getElementById('gameContainer');
            container.innerHTML = `
                <h1 class="animate-pulse">סִיַּמְתָּ בְּהַצְלָחָה! 🎉</h1>
                
                <div class="certificate fade-in">
                    <h2>🏆 תְּעוּדַת הִצְטַיְּנוּת 🏆</h2>
                    <p style="font-size: 1.5em; margin: 20px 0;">
                        <strong>מַזָּל טוֹב!</strong> 🎊
                    </p>
                    <p style="font-size: 1.3em;">
                        סִיַּמְתָּ אֶת כָּל שִׁיעוּרֵי "סוֹד הַתְּפִלָּה שֶׁעוֹבֶדֶת"! 📚
                    </p>
                    <div class="score-display" style="font-size: 2em; color: #e17055; margin: 25px 0;">
                        נִקּוּד סוֹפִי: ${totalScore} נְקֻדּוֹת! 🌟
                    </div>
                    <div class="quote">
                        "וְאָהַבְתָּ אֵת ה' אֱלֹקֶיךָ בְּכָל לְבָבְךָ וּבְכָל נַפְשְׁךָ וּבְכָל מְאֹדֶךָ" 💝
                    </div>
                    <p style="margin-top: 20px; font-size: 1.2em;">
                        עַכְשָׁיו אַתָּה יוֹדֵעַ לְהִתְפַּלֵּל בְּדֶרֶךְ שֶׁמַּגִּיעָה לַשָּׁמַיִם! ✨
                    </p>
                </div>

                <div class="reflection-questions fade-in">
                    <h3>שְׁאֵלוֹת לְמַחְשָׁבָה 💭</h3>
                    <ol>
                        <li>אֵיךְ אוּכַל לְהָבִיא יוֹתֵר אַהֲבַת ה' לַלִּמּוּד הַבָּא שֶׁלִּי?</li>
                        <li>אֵיזוֹ מִצְוָה אֲנִי רוֹצֶה לְקַיֵּם הַיּוֹם מִתּוֹךְ שִׂמְחָה?</li>
                        <li>מָה אֲנִי יָכוֹל לַעֲשׂוֹת כְּדֵי לְהוֹדוֹת לַשֵּׁם לִפְנֵי כָּל תְּפִלָּה?</li>
                    </ol>
                </div>

                <div style="text-align: center; margin: 30px 0;" class="fade-in">
                    <p style="font-size: 1.4em; margin-bottom: 15px; font-weight: bold;">
                        🎁 זָכִיתָ לְהִכָּנֵס לְהַגְרָלָה נוֹשֵׂאת פְּרָסִים! 🎁
                    </p>
                    <a href="https://forms.gle/A66uubei4XSX6SG2A" target="_blank" class="raffle-link">
                        לַחֲצוּ כָּאן לְהִרָשֵׁם לְהַגְרָלָה! 🎉
                    </a>
                </div>

                <div class="contact-info fade-in">
                    <p style="font-size: 1.4em; margin-bottom: 10px;">
                        <strong>נִבְנָה בְּאַהֲבָה עַל יְדֵי:</strong>
                    </p>
                    <p style="font-size: 1.3em;">
                        הָרַב יְהוּדָה טָאוּב מִקִּרְיַת אַתָּא 🌟
                    </p>
                    <p style="font-size: 1.2em; margin-top: 10px;">
                        📞 לִפְרָטִים: 0527139520
                    </p>
                </div>

                <div class="love-message fade-in" style="margin-top: 30px; font-size: 1.4em;">
                    💝 זְכוֹר: כְּשֶׁמִּתְפַּלְּלִים מִתּוֹךְ הַכָּרַת הַטּוֹב וְאַהֲבַת ה' - הַתְּפִלָּה מַגַּעַת יָשָׁר לַשָּׁמַיִם! 💝
                </div>
            `;
        }

        // אתחול
        renderIntro();
    </script>
