            { name: "יין", emoji: "🍷", bracha: "הגפן" },
            { name: "מיץ ענבים", emoji: "🍷", bracha: "הגפן" }

        const allBrachot = ["המוציא לחם מן הארץ", "מזונות", "העץ", "האדמה", "שהכל", "הגפן"];

        let currentQuestion = 0;
        let correctAnswers = 0;
        let gameQuestions = [];

        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function getRandomFoods(count) {
            const shuffled = shuffleArray([...foods]);
            return shuffled.slice(0, count);
        }

        function generateQuestion(food) {
            const correctBracha = food.bracha;
            const otherBrachot = allBrachot.filter(b => b !== correctBracha);
            const shuffledOthers = shuffleArray(otherBrachot).slice(0, 3);
            const allOptions = shuffleArray([correctBracha, ...shuffledOthers]);
            
            return {
                name: food.name,
                emoji: food.emoji,
                correct: correctBracha,
                options: allOptions
            };
        }

        function initGame() {
            const selectedFoods = getRandomFoods(15);
            gameQuestions = selectedFoods.map(food => generateQuestion(food));
            currentQuestion = 0;
            correctAnswers = 0;
            document.getElementById('question-container').style.display = 'block';
            document.getElementById('final-score').style.display = 'none';
            showQuestion();
        }

        function showQuestion() {
            const question = gameQuestions[currentQuestion];
            
            document.getElementById('food-image').textContent = question.emoji;
            document.getElementById('food-name').textContent = question.name;
            
            document.getElementById('question-number').textContent = currentQuestion + 1;
            document.getElementById('correct-count').textContent = correctAnswers;
            
            const optionButtons = document.querySelectorAll('.option-btn');
            optionButtons.forEach((btn, index) => {
                btn.textContent = question.options[index];
                btn.disabled = false;
                btn.className = 'option-btn';
                btn.style.display = 'block';
            });
            
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('next-btn').style.display = 'none';
        }

        function selectAnswer(selectedIndex) {
            const question = gameQuestions[currentQuestion];
            const optionButtons = document.querySelectorAll('.option-btn');
            const selectedAnswer = optionButtons[selectedIndex].textContent;
            const isCorrect = selectedAnswer === question.correct;
            
            optionButtons.forEach(btn => btn.disabled = true);
            
            if (isCorrect) {
                correctAnswers++;
                optionButtons[selectedIndex].classList.add('correct');
                showFeedback('🎉 נכון מאוד! כל הכבוד!', 'correct');
                playSuccessSound();
                createConfetti();
            } else {
                optionButtons[selectedIndex].classList.add('wrong');
                
                // הדגש את התשובה הנכונה
                optionButtons.forEach((btn, index) => {
                    if (btn.textContent === question.correct) {
                        btn.classList.add('correct');
                    }
                });
                
                showFeedback(`❌ לא נכון. התשובה הנכונה היא: "${question.correct}"`, 'wrong');
                playErrorSound();
            }
            
            setTimeout(() => {
                document.getElementById('next-btn').style.display = 'inline-block';
            }, 1500);
        }

        function showFeedback(message, type) {
            const feedback = document.getElementById('feedback');
            feedback.textContent = message;
            feedback.className = `feedback ${type} show`;
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < gameQuestions.length) {
                showQuestion();
            } else {
                showFinalScore();
            }
        }

        function showFinalScore() {
            document.getElementById('question-container').style.display = 'none';
            document.getElementById('final-score').style.display = 'block';
            
            const percentage = Math.round((correctAnswers / gameQuestions.length) * 100);
            let message = '';
            
            if (percentage >= 90) {
                message = `🏆 מושלם! ${correctAnswers}/${gameQuestions.length} - אתה מומחה ברכות!`;
                createBigCelebration();
            } else if (percentage >= 70) {
                message = `👏 כל הכבוד! ${correctAnswers}/${gameQuestions.length} - ביצוע מעולה!`;
                createConfetti();
            } else if (percentage >= 50) {
                message = `👍 יפה! ${correctAnswers}/${gameQuestions.length} - אתה בדרך הנכונה!`;
            } else {
                message = `💪 ${correctAnswers}/${gameQuestions.length} - בוא ננסה שוב ונשתפר!`;
            }
            
            document.getElementById('final-text').textContent = message;
        }

        function restartGame() {
            initGame();
        }

        function playSuccessSound() {
            try {
                // בדיקה אם יש תמיכה ב-Web Audio API
                if (!window.AudioContext && !window.webkitAudioContext) {
                    console.log('Web Audio API לא נתמך');
                    return;
                }
                
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                // חשוב: resume context אם הוא suspended
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }
                
                // מנגינה פשוטה יותר שאמורה לעבוד
                const playNote = (frequency, startTime, duration) => {
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(frequency, startTime);
                    
                    gainNode.gain.setValueAtTime(0.2, startTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
                    
                    oscillator.start(startTime);
                    oscillator.stop(startTime + duration);
                };
                
                const now = audioContext.currentTime;
                playNote(523.25, now, 0.3);        // C5
                playNote(659.25, now + 0.2, 0.3);  // E5
                playNote(783.99, now + 0.4, 0.4);  // G5
                
            } catch (error) {
                console.log('שגיאה בהפעלת צליל:', error);
                // fallback - השתמש בצליל מערכת אם יש
                try {
                    const audio = new Audio();
                    audio.src = 'data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmsbBjCKzfPSlTEGH3vJ8OC';
                    audio.play().catch(() => {});
                } catch (e) {
                    console.log('גם צליל fallback לא עבד');
                }
            }
        }

        function playErrorSound() {
            try {
                if (!window.AudioContext && !window.webkitAudioContext) {
                    return;
                }
                
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }
                
                // צליל "אופס" עדין - לא מתסכל אבל בולט

                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    oscillator.type = 'triangle'; // צליל רך יותר
                    oscillator.frequency.setValueAtTime(frequency, startTime);
                    
                    gainNode.gain.setValueAtTime(volume, startTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
                    
                    oscillator.start(startTime);
                    oscillator.stop(startTime + duration);
                };
                
                const now = audioContext.currentTime;
                
                // מנגינה יורדת עדינה - סי-לה-סול
                playNote(493.88, now, 0.2, 0.12);        // B4 - סי
                playNote(440.00, now + 0.15, 0.2, 0.10); // A4 - לה  
                playNote(392.00, now + 0.3, 0.3, 0.08);  // G4 - סול
                
                // צליל נוסף לתשומת לב
                setTimeout(() => {
                    playNote(329.63, audioContext.currentTime, 0.15, 0.06); // E4 - מי נמוך
                }, 200);
                
            } catch (error) {
                console.log('שגיאה בהפעלת צליל שגיאה:', error);
                // צליל חלופי פשוט
                try {
                    const beep = () => {
                        const oscillator = new OscillatorNode(new AudioContext());
                        oscillator.frequency.value = 300;
                        oscillator.connect(new AudioContext().destination);
                        oscillator.start();
                        oscillator.stop(new AudioContext().currentTime + 0.2);
                    };
                    beep();
                } catch (e) {
                    console.log('גם צליל חלופי לא עבד');
                }
            }
        }

        function createConfetti() {
            const celebration = document.getElementById('celebration');
            const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#ffa726', '#ab47bc'];
            
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = Math.random() * 2 + 's';
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                
                celebration.appendChild(confetti);
                
                setTimeout(() => {
                    confetti.remove();
                }, 4000);
            }
        }

        function createBigCelebration() {
            const celebration = document.getElementById('celebration');
            const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#ffa726', '#ab47bc'];
            
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = Math.random() * 3 + 's';
                confetti.style.animationDuration = (Math.random() * 3 + 3) + 's';
                
                celebration.appendChild(confetti);
                
                setTimeout(() => {
                    confetti.remove();
                }, 6000);
            }
        }

        // התחלת המשחק
        initGame();
    </script>
