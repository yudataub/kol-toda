        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(frequencies, duration = 0.3) {
            frequencies.forEach((freq, index) => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = freq;
                oscillator.type = 'sine';
                
                const startTime = audioContext.currentTime + (index * duration);
                gainNode.gain.setValueAtTime(0.3, startTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
                
                oscillator.start(startTime);
                oscillator.stop(startTime + duration);
            });
        }

                        <div class="inspiration-box">
                            🙏 הַשֵּׁם גֵּאֶה בְּךָ! אַתָּה חַי בְּאַהֲבַת ה'! 💖
                        </div>
                    </div>
                    
                    ${currentLesson < lessons.length - 1 ? `
                        <button class="btn-primary" onclick="nextLesson()">
                            בּוֹאוּ נַמְשִׁיךְ לְשִׁיעוּר הַבָּא! 🚀
                        </button>
                    ` : `
                        <button class="btn-primary" onclick="showCertificate()">
                            לְקַבָּלַת תְּעוּדַת הִצְטַיְּנוּת! 🎓✨
                        </button>
                    `}
                `;
            }
        }

        // Show Retry Lesson
        function showRetryLesson() {
            const container = document.getElementById('gameContainer');
            const lesson = lessons[currentLesson];
            
            container.innerHTML = `
                <h1>${lesson.title}</h1>
                
                <div class="lesson-section" style="text-align: center;">
                    <h2 style="color: #dc3545; font-size: 2em;">בּוֹא נְנַסֶּה שׁוּב! 💪</h2>
                    <p style="font-size: 1.3em; margin: 20px 0;">
                        צָרִיךְ לַעֲנוֹת נָכוֹן עַל כָּל 3 הַשְּׁאֵלוֹת כְּדֵי לְהַמְשִׁיךְ. 🎯
                    </p>
                    <p style="font-size: 1.2em;">
                        עָנִיתָ נָכוֹן עַל ${lessonScore} מִתּוֹךְ ${currentQuestion + 1} שְׁאֵלוֹת.
                    </p>
                    
                    <div class="inspiration-box">
                        💡 גַּם בַּדֶּרֶךְ לִטְעוֹת אָנוּ לוֹמְדִים לְאַהֵב אֶת הַשֵּׁם! 💖
                    </div>
                    
                    <p style="font-size: 1.1em; margin-top: 20px;">
                        בּוֹא נַחֲזוֹר עַל הַחוֹמֶר וְנִנְסֶה שׁוּב! 📚
                    </p>
                </div>
                
                <button class="btn-primary" onclick="renderLesson()">
                    בּוֹאוּ נִלְמַד שׁוּב! 📖✨
                </button>
            `;
        }

        // Next Lesson
        function nextLesson() {
            currentLesson++;
            if (currentLesson < lessons.length) {
                renderLesson();
            } else {
                showCertificate();
            }
        }

        // Show Certificate
        function showCertificate() {

            const percentage = Math.round((totalScore / totalQuestions) * 100);
            
            container.innerHTML = `

                            <strong>הִשַּׂגְתָּ ${totalScore} מִתּוֹךְ ${totalQuestions} נְקֻדּוֹת!</strong>

                        </p>
                    </div>
                    
                    <div class="verse">
                        "וְאָהַבְתָּ אֵת ה' אֱלֹקֶיךָ<br>
                        בְּכָל־לְבָבְךָ וּבְכָל־נַפְשְׁךָ וּבְכָל־מְאֹדֶךָ"<br>
                        <span style="font-size: 0.9em;">(דברים ו, ה)</span>
                    </div>
                    
                    <p style="font-size: 1.2em; color: #667eea; margin-top: 20px;">
                        ⭐ כָּל מִי שֶׁלָּמַד בְּאַהֲבָה - פָּתַח שַׁעַר בְּלִבּוֹ אֶל הַשֵּׁם! ⭐
                    </p>
                </div>
                
                <div class="reflection-questions">
                    <h3>💭 שְׁאֵלוֹת לְמַחְשָׁבָה:</h3>
                    <ol style="text-align: right; padding-right: 20px;">
                        <li>אֵיךְ אוּכַל לְהָבִיא יוֹתֵר אַהֲבַת ה' לַלִּמּוּד הַבָּא שֶׁלִּי?</li>
                        <li>אֵיזוֹ מִצְוָה אֲנִי רוֹצֶה לְקַיֵּם הַיּוֹם מִתּוֹךְ שִׂמְחָה?</li>
                        <li>עַל אֵיזֶה נֵס שֶׁקָּרָה לִי אֲנִי רוֹצֶה לְהוֹדוֹת לַשֵּׁם?</li>
                    </ol>

                <div class="lottery-link">

                    אַתָּה נִכְנָס לְהַגְרָלָה נוֹשֵׂאַת פְּרָסִים!<br><br>
                    <a href="https://forms.gle/A66uubei4XSX6SG2A" target="_blank">
                        👉 לַחַץ כָּאן לְהִרָשֵׁם לְהַגְרָלָה! 👈

                    💖 הַשֵּׁם אוֹהֵב אֶתְכֶם! 💖

                <button class="btn-primary" onclick="location.reload()">
                    לְהַתְחִיל מִחָדָשׁ 🔄

        // Initialize game
        window.onload = function() {
            renderIntro();
        };
    </script>
