<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 משחק הרצונות - לכיתה ב'</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 1.2em;
            margin-bottom: 30px;
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 15px;
            color: white;
            font-size: 1.3em;
            font-weight: bold;
        }

        .score-item {
            text-align: center;
        }

        .scenario-card {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .categories {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .category-btn {
            padding: 25px;
            border: none;
            border-radius: 15px;
            font-size: 1.3em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .category-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .category-btn:active {
            transform: translateY(-2px);
        }

        .btn-retzono {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            color: #006400;
        }

        .btn-retzoncha {
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            color: #00008B;
        }

        .btn-batel {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            color: #8B4513;
        }

        .btn-acherim {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            color: #8B0000;
        }

        .feedback {
            text-align: center;
            font-size: 2em;
            font-weight: bold;
            margin: 20px 0;
            min-height: 60px;
            animation: bounce 0.5s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .feedback.correct {
            color: #28a745;
        }

        .feedback.incorrect {
            color: #dc3545;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .final-score {
            text-align: center;
            padding: 40px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 15px;
            color: white;
            margin-top: 30px;
        }

        .final-score h2 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .final-score p {
            font-size: 1.5em;
            margin: 10px 0;
        }

        .restart-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 15px 40px;
            font-size: 1.3em;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
        }

        .restart-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .explanation {
            background: #fff3cd;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            border-right: 5px solid #ffc107;
            font-size: 1.1em;
            line-height: 1.6;
        }

        .level-badge {
            display: inline-block;
            padding: 10px 20px;
            background: #ffd700;
            color: #333;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }

        .signature {
            text-align: center;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #e0e0e0;
            color: #666;
            font-size: 1.1em;
        }

        .signature strong {
            color: #667eea;
            font-size: 1.2em;
        }

        @media (max-width: 768px) {
            .categories {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 1.8em;
            }
            
            .scenario-card {
                font-size: 1.2em;
                padding: 20px;
            }
        }
    </style>

        let currentQuestion = 0;
        let score = 0;
        let correctCount = 0;
        let currentLevel = 1;
        let questionsPerLevel = 10;
        let requiredScore = 8; // 80%
        let levelScenarios = [];

        const levelSettings = {
            1: { questions: 10, required: 8, percent: 80 },  // קל
            2: { questions: 15, required: 13, percent: 85 }, // בינוני
            3: { questions: 20, required: 18, percent: 90 }  // קשה
        };

        function initLevel() {
            // ערבוב השאלות
            levelScenarios = [...scenarios].sort(() => Math.random() - 0.5);
            questionsPerLevel = levelSettings[currentLevel].questions;
            requiredScore = levelSettings[currentLevel].required;
            
            // לקחת רק את מספר השאלות הנדרש
            levelScenarios = levelScenarios.slice(0, questionsPerLevel);
            
            currentQuestion = 0;
            score = 0;
            correctCount = 0;
            
            updateDisplay();
            showQuestion();
        }

        function updateDisplay() {
            document.getElementById('level-badge').textContent = `שלב ${currentLevel} מתוך 3 🌟`;
            document.getElementById('question-num').textContent = `${currentQuestion + 1}/${questionsPerLevel}`;
            document.getElementById('correct-count').textContent = correctCount;
            document.getElementById('score').textContent = score;
            
            const progress = ((currentQuestion + 1) / questionsPerLevel) * 100;
            document.getElementById('progress-fill').style.width = progress + '%';
            document.getElementById('progress-text').textContent = Math.round(progress) + '%';
        }

        function showQuestion() {
            if (currentQuestion >= questionsPerLevel) {
                endLevel();
                return;
            }

            document.getElementById('scenario').textContent = levelScenarios[currentQuestion].text;
            document.getElementById('feedback').textContent = '';
            document.getElementById('explanation').style.display = 'none';
            
            // הפעלת אנימציה
            document.getElementById('scenario').style.animation = 'none';
            setTimeout(() => {
                document.getElementById('scenario').style.animation = 'slideIn 0.5s ease-out';
            }, 10);
        }

        function checkAnswer(userAnswer) {
            const correct = levelScenarios[currentQuestion].answer;
            const explanation = levelScenarios[currentQuestion].explanation;
            
            const feedbackEl = document.getElementById('feedback');
            const explanationEl = document.getElementById('explanation');
            
            if (userAnswer === correct) {
                correctCount++;
                score += 10;
                
                const messages = ['מצוין! ⭐', 'פצצה! 🎯', 'כל הכבוד! 💪', 'מדהים! 🌟', 'יפה מאוד! ✨'];
                feedbackEl.textContent = messages[Math.floor(Math.random() * messages.length)];
                feedbackEl.className = 'feedback correct';
                
                // צליל הצלחה
                playSuccessSound();
            } else {
                feedbackEl.textContent = 'לא בדיוק... חשבי שוב! 🤔';
                feedbackEl.className = 'feedback incorrect';
            }
            
            explanationEl.textContent = explanation;
            explanationEl.style.display = 'block';
            
            updateDisplay();
            
            setTimeout(() => {
                currentQuestion++;
                showQuestion();
            }, 3000);
        }

        function playSuccessSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const notes = [261.63, 329.63, 392.00]; // C, E, G
            
            notes.forEach((freq, i) => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = freq;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime + i * 0.1);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + i * 0.1 + 0.3);
                
                oscillator.start(audioContext.currentTime + i * 0.1);
                oscillator.stop(audioContext.currentTime + i * 0.1 + 0.3);
            });
        }

        function playCelebrationSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const melody = [523.25, 659.25, 783.99, 1046.50, 783.99, 659.25]; // C5, E5, G5, C6, G5, E5
            
            melody.forEach((freq, i) => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = freq;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime + i * 0.3);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + i * 0.3 + 0.25);
                
                oscillator.start(audioContext.currentTime + i * 0.3);
                oscillator.stop(audioContext.currentTime + i * 0.3 + 0.25);
            });
        }

        function endLevel() {
            const percentage = (correctCount / questionsPerLevel) * 100;
            const passed = correctCount >= requiredScore;
            
            document.getElementById('game-area').style.display = 'none';
            document.getElementById('final-screen').style.display = 'block';
            
            const finalTitle = document.getElementById('final-title');
            const finalMessage = document.getElementById('final-message');
            const finalStats = document.getElementById('final-stats');
            
            if (passed) {
                if (currentLevel < 3) {
                    playCelebrationSound();
                    finalTitle.textContent = 'כל הכבוד! עברת לשלב הבא! 🎉';
                    finalMessage.textContent = `השגת ${correctCount} תשובות נכונות מתוך ${questionsPerLevel}!`;
                    finalStats.textContent = `ציון: ${Math.round(percentage)}% | ניקוד: ${score}`;
                    
                    setTimeout(() => {
                        currentLevel++;
                        document.getElementById('final-screen').style.display = 'none';
                        document.getElementById('game-area').style.display = 'block';
                        initLevel();
                    }, 4000);
                } else {
                    // סיים את כל 3 השלבים
                    playCelebrationSound();
                    finalTitle.textContent = 'מדהים! סיימת את כל המשחק! 🏆👑';
                    finalMessage.textContent = 'את באמת שולטת בכל סוגי הרצונות!';
                    finalStats.textContent = `ציון סופי: ${Math.round(percentage)}% | ניקוד כולל: ${score}`;
                }
            } else {
                finalTitle.textContent = 'התחלה טובה! 🌱';
                finalMessage.textContent = `עוד קצת תרגול ותצליחי!`;
                finalStats.textContent = `השגת ${correctCount} מתוך ${questionsPerLevel} (צריך ${requiredScore})`;
            }
        }

        function restartGame() {
            currentLevel = 1;
            document.getElementById('final-screen').style.display = 'none';
            document.getElementById('game-area').style.display = 'block';
            initLevel();
        }

        // התחלת המשחק
        initLevel();
    </script>
</body>
</html>
