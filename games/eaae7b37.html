            let startTime = audioContext.currentTime;
            frequencies.forEach((freq, index) => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = freq;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.3, startTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + durations[index]);
                
                oscillator.start(startTime);
                oscillator.stop(startTime + durations[index]);
                
                startTime += durations[index];
            });

                            <p>לשון הרע היא כמו נחש - מסוכנת וארסית! וגם יש לה תוצאות רעות כמו צרעת. כשאנחנו שומרים על הלשון שלנו, אנחנו מראים אהבה לה' ולאנשים. 👄✨</p>
                            
                            <p><strong>⚖️ שיעור שלישי: ה' מגן על עמו</strong></p>

                            <div class="reflection-box">

                            </div>
                            
                            <p><strong>💪 שיעור רביעי: מנהיג צריך לתקן את עצמו קודם</strong></p>

                        `,
                        reflection: "מה אתה יכול לתקן בעצמך היום כדי להיות אדם טוב יותר? 🌈"
                    }
                ],
                questions: [
                    {
                        question: "מה השיעור החשוב ביותר ששלושת האותות באו ללמד את משה?",
                        answers: [
                            "לתקן את עצמו לפני שהוא הולך להציל את העם, ולהיזהר מלשון הרע",
                            "ללמוד לעשות קסמים ופלאים כמו המצרים",
                            "לפחד מנחשים ומצרעת",
                            "להאמין שאף אחד לא יאמין לו"
                        ],
                        correct: 0,
                        explanation: "מנהיג צריך לתקן את עצמו קודם! משה למד שיעור חשוב על לשון הרע לפני שיצא להציל את העם. 🌟"
                    },
                    {
                        question: "איזה רגש משה היה צריך להרגיש אחרי שראה את שני האותות הראשונים?",
                        answers: [
                            "בושה והבנה - הבנתי שטעיתי בלשון הרע וצריך לתקן",
                            "כעס - למה ה' מראה לי דברים מפחידים",
                            "פחד - אני מפחד מנחשים וצרעת",
                            "שמחה - כיף לראות קסמים ופלאים"
                        ],
                        correct: 0,
                        explanation: "משה היה צריך להרגיש בושה והבנה - זה הרגש שמוביל לתיקון! כשאנחנו מבינים את הטעות, אנחנו יכולים לגדול. 🌱💖"
                    },
                    {
                        question: "למה חשוב שמנהיג ילמד תחילה על עצמו, ורק אחר כך על האויבים?",
                        answers: [
                            "כי מנהיג שמתקן את עצמו קודם יכול להוביל את העם באמת ובאהבה",
                            "כי זה יותר קל ללמוד על עצמך מאשר על אחרים",
                            "כי ה' רצה להעניש את משה קודם",
                            "כי משה ביקש ללמוד על עצמו קודם"
                        ],
                        correct: 0,
                        explanation: "מנהיג אמיתי תמיד מתחיל מעצמו! רק אז הוא יכול להוביל אחרים בדרך הנכונה, בענוה ובאהבה. 👑💫"
                    }
                ]
            }
        ];

        // Shuffle array function
        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        // Update progress bar
        function updateProgress() {
            const totalLessons = lessons.length;
            const progress = ((currentLesson) / totalLessons) * 100;
            const progressBar = document.getElementById('progressBar');
            progressBar.style.width = progress + '%';
            progressBar.textContent = Math.round(progress) + '%';
            
            document.getElementById('scoreDisplay').textContent = `ניקוד: ${score}/${totalQuestions}`;
        }

        // Show lesson content
        function showLessonContent() {
            const lesson = lessons[currentLesson];
            const part = lesson.parts[lessonPart];
            
            const content = document.getElementById('mainContent');
            content.innerHTML = `
                <div class="lesson-content">
                    ${part.content}
                </div>
                <div class="reflection-box">
                    ${part.reflection}
                </div>
                ${lessonPart < lesson.parts.length - 1 ? 
                    '<button class="continue-btn" onclick="continueToNextPart()">המשך לחלק הבא ✨</button>' :
                    '<button class="btn-primary" onclick="startQuiz()">בואו נבדוק מה למדנו! 🎯</button>'
                }
            `;
        }

        // Continue to next part of lesson
        function continueToNextPart() {
            lessonPart++;
            showLessonContent();
        }

        // Start quiz
        function startQuiz() {
            currentQuestion = 0;
            lessonScore = 0;
            lessonPart = 0;
            showQuestion();
        }

        // Show question
        function showQuestion() {
            const lesson = lessons[currentLesson];
            const question = lesson.questions[currentQuestion];
            
            // Shuffle answers
            const shuffledAnswers = shuffleArray(question.answers.map((answer, index) => ({
                text: answer,
                originalIndex: index
            })));
            
            const content = document.getElementById('mainContent');
            content.innerHTML = `
                <div class="question-container">
                    <div class="question-text">
                        שאלה ${currentQuestion + 1} מתוך ${lesson.questions.length}<br>
                        ${question.question}
                    </div>
                    <div class="answers" id="answersContainer">
                        ${shuffledAnswers.map((answer, index) => `
                            <button class="answer-btn" onclick="checkAnswer(${answer.originalIndex}, ${index})" id="answer${index}">
                                ${answer.text}
                            </button>
                        `).join('')}
                    </div>
                    <div id="feedback"></div>
                </div>
            `;
        }

        // Check answer
        function checkAnswer(originalIndex, buttonIndex) {
            const lesson = lessons[currentLesson];
            const question = lesson.questions[currentQuestion];
            const isCorrect = originalIndex === question.correct;
            
            totalQuestions++;
            
            // Disable all buttons
            const buttons = document.querySelectorAll('.answer-btn');
            buttons.forEach(btn => btn.disabled = true);
            
            // Mark the clicked button
            const clickedButton = document.getElementById(`answer${buttonIndex}`);
            
            if (isCorrect) {
                score++;
                lessonScore++;
                clickedButton.classList.add('correct');
                
                // Play success sound
                playSound([523.25, 659.25, 783.99], [0.2, 0.2, 0.3]);
                
                const encouragements = [
                    'מצוין! ⭐ השם שמח כשרואים את אהבתו בלבך 💖',
                    'כל הכבוד! 💪 אתה חי באהבת ה׳! 🎉',
                    'פצצה! 🎯 ממשיך ככה ותגיע רחוק! 🌟',
                    'וואו! 🌈 אתה באמת קולט את המסר של אהבה! 💫'
                ];
                
                document.getElementById('feedback').innerHTML = `
                    <div class="feedback correct">
                        ${encouragements[Math.floor(Math.random() * encouragements.length)]}<br>
                        ${question.explanation}
                    </div>
                `;
            } else {
                clickedButton.classList.add('incorrect');
                
                document.getElementById('feedback').innerHTML = `
                    <div class="feedback incorrect">
                        לא בדיוק... 🤔<br>
                        ${question.explanation}<br>
                        <strong>נסה שוב - לפעמים גם בדרך לטעות אנו לומדים לאהוב את השם 💡</strong>
                    </div>
                `;
            }
            
            updateProgress();
            
            // Show next button
            setTimeout(() => {
                const feedback = document.getElementById('feedback');
                if (currentQuestion < lesson.questions.length - 1) {
                    feedback.innerHTML += '<button class="btn-primary" onclick="nextQuestion()">שאלה הבאה ➡️</button>';
                } else {
                    feedback.innerHTML += '<button class="btn-primary" onclick="finishLesson()">סיים שיעור 🎓</button>';
                }
            }, 500);
        }

        // Next question
        function nextQuestion() {
            currentQuestion++;
            showQuestion();
        }

        // Finish lesson
        function finishLesson() {
            const lesson = lessons[currentLesson];
            const percentage = (lessonScore / lesson.questions.length) * 100;
            
            let message, sound;
            
            if (lessonScore === lesson.questions.length) {
                message = '🏆 מדהים! אתה שולט! אתה חי באהבת ה׳! 🎉';
                sound = [523.25, 659.25, 783.99, 1046.50, 783.99, 659.25];
                playSound(sound, [0.15, 0.15, 0.15, 0.2, 0.15, 0.3]);
            } else if (lessonScore >= 2) {
                message = '💪 כמעט מושלם! ממש כמו באהבה - ממשיך לצמוח 🌱';
                sound = [523.25, 659.25, 783.99];
                playSound(sound, [0.2, 0.2, 0.3]);
            } else {
                message = '💖 בוא ננסה שוב, באהבה וסבלנות. אתה יכול!';
            }
            
            const content = document.getElementById('mainContent');
            
            if (lessonScore >= 2) {
                // Pass - move to next lesson or finish
                if (currentLesson < lessons.length - 1) {
                    content.innerHTML = `
                        <div class="lesson-content">
                            <h2>${message}</h2>
                            <p>ענית נכון על ${lessonScore} מתוך ${lesson.questions.length} שאלות!</p>
                            <div class="reflection-box">
                                💭 רגע של הכרת תודה: מה למדת בשיעור הזה על אהבת ה'?
                            </div>
                            <button class="btn-primary" onclick="nextLesson()">לשיעור הבא! 🚀</button>
                        </div>
                    `;
                } else {
                    showFinalScreen();
                }
            } else {
                // Failed - retry lesson
                content.innerHTML = `
                    <div class="lesson-content">
                        <h2>${message}</h2>
                        <p>ענית נכון על ${lessonScore} מתוך ${lesson.questions.length} שאלות.</p>
                        <p>כדי להמשיך, צריך לענות נכון על לפחות 2 שאלות. 📚</p>
                        <div class="reflection-box">
                            💭 אל תתייאש! כל ניסיון מקרב אותנו לה'. בוא ננסה שוב באהבה! 💫
                        </div>
                        <button class="btn-primary" onclick="retryLesson()">נסה שוב 🔄</button>
                    </div>
                `;
            }
        }

        // Retry lesson
        function retryLesson() {
            currentQuestion = 0;
            lessonScore = 0;
            showLessonContent();
        }

        // Next lesson
        function nextLesson() {
            currentLesson++;
            lessonPart = 0;
            updateProgress();
            showLessonContent();
        }

        // Show final screen
        function showFinalScreen() {
            const percentage = Math.round((score / totalQuestions) * 100);
            
            const content = document.getElementById('mainContent');
            content.innerHTML = `
                <div class="lesson-content">
                    <h2>🎉 סיימת את המסע! 🎉</h2>
                    <p style="font-size: 1.5em;">הציון הסופי שלך: <strong>${score}/${totalQuestions}</strong> (${percentage}%)</p>
                    
                    <div class="reflection-box">
                        <h3>💭 שאלות למחשבה:</h3>
                        <p>• איך אוכל להביא יותר אהבת ה׳ ללימוד הבא שלי?</p>
                        <p>• איזו מצווה אני רוצה לקיים היום מתוך שמחה?</p>
                        <p>• מה הדבר הכי חשוב שלמדתי על אהבת ה' מהסיפור של משה?</p>
                    </div>
                    
                    <p style="text-align: center; font-size: 1.3em; margin: 30px 0;">
                        ✨ <strong>"כל מי שלמד באהבה - פתח שער בליבו אל השם"</strong> 💫
                    </p>
                    
                    <div style="text-align: center;">
                        <label for="nameInput" style="display: block; margin: 20px 0; font-size: 1.2em;">
                            הזן את שמך לתעודת הצטיינות:
                        </label>
                        <input type="text" id="nameInput" class="name-input" placeholder="השם שלי...">
                        <button class="btn-primary" onclick="showCertificate()">קבל תעודה! 🎓</button>
                    </div>
                </div>
            `;
        }

        // Show certificate
        function showCertificate() {
            userName = document.getElementById('nameInput').value.trim() || 'תלמיד יקר';
            const percentage = Math.round((score / totalQuestions) * 100);
            
            // Play celebration sound
            playSound([523.25, 659.25, 783.99, 1046.50, 783.99, 659.25], [0.15, 0.15, 0.15, 0.2, 0.15, 0.3]);
            
            const content = document.getElementById('mainContent');
            content.innerHTML = `
                <div class="certificate">
                    <h2>🏆 תעודת הצטיינות 🏆</h2>
                    <p style="font-size: 1.3em;">מוענקת בזאת ל:</p>
                    <div class="name">${userName}</div>
                    <p style="font-size: 1.2em; margin: 20px 0;">
                        על השלמת מסע הלמידה<br>
                        <strong>"שלושת האותות של משה רבינו"</strong>
                    </p>
                    <p style="font-size: 1.5em; color: #667eea; font-weight: bold;">
                        ציון: ${score}/${totalQuestions} (${percentage}%)
                    </p>
                    <div style="font-size: 3em; margin: 20px 0;">
                        💖✨🌟
                    </div>
                    <div class="verse">
                        "וְאָהַבְתָּ אֵת ה' אֱלֹקֶיךָ<br>
                        בְּכָל־לְבָבְךָ וּבְכָל־נַפְשְׁךָ וּבְכָל־מְאֹדֶךָ"
                    </div>
                </div>
                
                <div class="lesson-content" style="text-align: center;">
                    <h2>💝 כל הכבוד! זכית לסיים את המסע באהבת ה׳! 💝</h2>
                    <p style="font-size: 1.3em; margin: 20px 0;">
                        🎁 <strong>אתה נכנס להגרלה נושאת פרסים!</strong> 🎁
                    </p>
                    <p style="font-size: 1.1em;">
                        הירשם כאן ותהיה שותף בהגרלה:
                    </p>
                    <a href="https://forms.gle/A66uubei4XSX6SG2A" target="_blank">
                        <button class="btn-primary" style="font-size: 1.3em; margin: 20px 0;">
                            הרשמה להגרלה! 🎉
                        </button>
                    </a>
                    <p style="margin-top: 30px; font-size: 1.1em; color: #666;">
                        💫 תודה שלמדת איתנו! ממשיך לגדול באהבת ה'! 💫
                    </p>
                </div>
            `;
        }

        // Initialize game
        function initGame() {
            updateProgress();
            showLessonContent();
        }

        // Start the game when page loads
        window.onload = initGame;
    </script>
