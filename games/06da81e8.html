<script>
// ============ DATA ============
const STORAGE_KEY = 'omer_board_v2';

// Hebrew numbers for Omer
function hebrewOmer(n) {
  const units = ['','אחד','שניים','שלושה','ארבעה','חמישה','שישה','שבעה','שמונה','תשעה',
    'עשרה','אחד עשר','שניים עשר','שלושה עשר','ארבעה עשר','חמישה עשר','שישה עשר',
    'שבעה עשר','שמונה עשר','תשעה עשר','עשרים'];
  if (n <= 20) return units[n];
  if (n < 30) return 'עשרים ו' + units[n-20];
  if (n === 30) return 'שלושים';
  if (n < 40) return 'שלושים ו' + units[n-30];
  if (n === 40) return 'ארבעים';
  if (n < 50) return 'ארבעים ו' + units[n-40];
  return String(n);
}

function sefirahFormula(n) {
  const weeks = Math.floor((n-1)/7);
  const days = (n-1) % 7;
  const weekNames = ['','שבוע','שבועות','שבועות','שבועות','שבועות','שבועות','שבועות'];
  const dayNames = ['','יום אחד','שני ימים','שלושה ימים','ארבעה ימים','חמישה ימים','שישה ימים'];
  
  let text = 'הַיּוֹם ' + hebrewOmer(n) + ' יוֹם';
  if (n >= 7) {
    text += ', שֶׁהֵם ';
    if (weeks > 0) text += hebrewOmer(weeks) + (weeks===1?' שָׁבוּעַ':' שָׁבוּעוֹת');
    if (days > 0) {
      if (weeks > 0) text += ' וְ';
      text += dayNames[days];
    }
  }
  text += ' לָעֹמֶר';
  return text;
}

// 2026: Pesach starts April 1 evening, day 1 omer = April 2
// 6 Sivan (Shavuot) = June 1, 2026 = day 50
const OMER_START = new Date(2026, 3, 2); // April 2, 2026
const SHAVUOT_DATE = new Date(2026, 5, 1); // June 1, 2026

// Tasks from the document (days 8-33 from the doc, starting כג ניסן = day 8)
const TASKS = {

  22: 'הימנע מלדבר לשון הרע',

  24: 'בקש סליחה ממשהו שלא היית מספיק רגיש אליו',

  26: 'הגש עזרה לתלמיד משכבה נמוכה',
  27: 'אמור (או כתוב) לאחד מחבריך למה כיף להיות חבר שלו',
  28: 'התקשר לחבר אחרי הצהריים ושאל לשלומו',
  29: 'הגרל שם של חבר וכתוב לו שתי תכונות שאתה אוהב אצלו',
  30: 'הצע עזרה לחבר בזמן עבודת כיתה',
  31: 'עזור לחבר מבלי שידע על כך',
  32: 'הימנע היום מויכוחים',
  33: 'קנה מתנה קטנה לחבר טוב',
};

// Default tasks for days without specific task
function getTask(day) {
  if (TASKS[day]) return TASKS[day];
  // Generate a generic task based on theme
  const generic = [
    'חייך ל-3 אנשים שאתה פוגש היום',
    'עשה מחווה נחמדה לאחד מחבריך',
    'עזור למישהו שנראה שצריך עזרה',
    'כתוב 3 דברים שאתה אוהב בכיתה שלך',
    'אמור תודה לאמא או לאבא על משהו שעשו בשבילך',
    'שתף חבר בנשנוש שלך',
    'הקשב בשקט ובסבלנות לחבר שמדבר אליך',
  ];
  return generic[day % generic.length];
}

const EMOJIS = ['🌾','⭐','🌟','✨','🌸','🌼','🌻','🎯','🎈','🏆','🌈','💫','🔥','🎊','🎁','🌙','☀️','🌺','🦋','🎵','💎','🌿','🍀','🎠','🏅','🎭','🌍','🔆','🎶','🌞','💫','🌟','⭐'];

// Hebrew date labels (simplified — starting from ט"ז ניסן)
const HEB_MONTHS = {
  1:'א',2:'ב',3:'ג',4:'ד',5:'ה',6:'ו',7:'ז',8:'ח',9:'ט',
  10:'י',11:'י"א',12:'י"ב',13:'י"ג',14:'י"ד',15:'ט"ו',
  16:'ט"ז',17:'י"ז',18:'י"ח',19:'י"ט',20:'כ',21:'כ"א',
  22:'כ"ב',23:'כ"ג',24:'כ"ד',25:'כ"ה',26:'כ"ו',27:'כ"ז',
  28:'כ"ח',29:'כ"ט',30:'ל\'',
};
// Hebrew months for Omer: Nisan 16-30 = days 1-15, Iyar 1-29 = 16-44, Sivan 1-6 = 45-50+
function getHebDate(day) {
  if (day <= 15) return HEB_MONTHS[day+15] + ' ניסן';
  if (day <= 44) { const d = day-15; return (d<=30?HEB_MONTHS[d]:'?') + ' אייר'; }
  const d = day-44;
  return HEB_MONTHS[d] + ' סיוון';
}

// ============ STATE ============
let state = {
  teacher: '',
  className: '',
  countedDays: [], // array of day numbers (1-49) that were counted
  started: false,
};

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (s) state = s;
  } catch(e) {}
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}

// ============ TODAY ============
function getTodayOmerDay() {
  const today = new Date();
  today.setHours(0,0,0,0);
  const start = new Date(OMER_START);
  start.setHours(0,0,0,0);
  const shavuot = new Date(SHAVUOT_DATE);
  shavuot.setHours(0,0,0,0);
  if (today.getTime() === shavuot.getTime()) return 50;
  const diff = Math.round((today - start) / 86400000) + 1;
  if (diff < 1 || diff > 49) return null;
  return diff;
}

// ============ UI ============
let activeDay = null;

function startBoard() {
  const teacher = document.getElementById('input-teacher').value.trim();
  const cls = document.getElementById('input-class').value.trim();
  if (!teacher || !cls) {
    alert('אנא מלאו את שם המורה ושם הכיתה 😊');
    return;
  }
  state.teacher = teacher;
  state.className = cls;
  state.started = true;
  saveState();
  showBoard();
}

function showBoard() {
  document.getElementById('setup-panel').style.display = 'none';
  const bar = document.getElementById('info-bar');
  bar.style.display = 'block';
  document.getElementById('bar-teacher').textContent = state.teacher;
  document.getElementById('bar-class').textContent = state.className;
  document.getElementById('current-count').style.display = 'block';
  document.getElementById('progress-wrap').style.display = 'block';
  document.getElementById('legend').style.display = 'flex';
  renderGrid();
  updateCounter();
}

function renderGrid() {
  const container = document.getElementById('grid-container');
  container.innerHTML = '';
  const today = getTodayOmerDay();

  for (let d = 1; d <= 49; d++) {
    const card = document.createElement('div');
    card.className = 'day-card';
    const isDone = state.countedDays.includes(d);
    const isToday = d === today;
    // Past days (d < today) are clickable too, only FUTURE days (d > today) are locked
    const isFutureLocked = (today !== null && d > today) || (today === null);

    if (isDone) card.classList.add('done');
    else if (isToday) card.classList.add('today');
    else if (isFutureLocked) card.classList.add('locked');
    else card.classList.add('future'); // past, not yet marked

    const emoji = isDone ? '✅' : (isToday ? '🔆' : (isFutureLocked ? '🔒' : EMOJIS[d % EMOJIS.length]));

    card.innerHTML = `
      <div class="card-emoji">${emoji}</div>
      <div class="card-num">${d}</div>
      <div class="card-heb">${getHebDate(d).split(' ')[0]}</div>
      ${isToday && !isDone ? '<div class="today-label">היום!</div>' : ''}
    `;

    if (!isFutureLocked) {
      card.addEventListener('click', () => openModal(d));
    }

    container.appendChild(card);
  }

  // Day 50 — Shavuot special card
  const shavuotDone = state.countedDays.includes(50);
  const shavuotToday = today === 50;
  const shavuotLocked = today !== null && today < 50 && !shavuotToday;

  const shavCard = document.createElement('div');
  shavCard.className = 'day-card shavuot-card';
  if (shavuotDone) shavCard.classList.add('done');
  else if (shavuotToday) shavCard.classList.add('today');
  else if (shavuotLocked) shavCard.classList.add('locked');
  else shavCard.classList.add('future');

  shavCard.innerHTML = `
    <div class="card-emoji">${shavuotDone ? '✅' : (shavuotToday ? '🔥' : (shavuotLocked ? '🔒' : '📜'))}</div>
    <div class="card-num" style="font-size:clamp(0.7rem,1.5vw,0.9rem)">שבועות</div>
    <div class="card-heb">ו' סיוון</div>
    ${shavuotToday && !shavuotDone ? '<div class="today-label">היום!</div>' : ''}
  `;
  if (!shavuotLocked) {
    shavCard.addEventListener('click', () => openModal(50));
  }
  container.appendChild(shavCard);
}

function updateCounter() {
  const n = state.countedDays.length;
  document.getElementById('count-num').textContent = n;
  const pct = Math.round(n / 50 * 100);
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-label').textContent = `${n} מתוך 50 ימים — ${pct}%`;
}

function openModal(day) {
  activeDay = day;
  const today = getTodayOmerDay();
  const isDone = state.countedDays.includes(day);
  const isToday = day === today;

  const emojis = ['🌾','⭐','🌟','✨','🌸','🌼','🌻','🎯','🏆','🌈','💫','🎊','🎁','🌙','☀️','🌺','🦋','💎','🌿','🍀','🎵'];

  // Shavuot special
  if (day === 50) {
    document.getElementById('modal-emoji').textContent = isDone ? '✅' : '📜';
    document.getElementById('modal-day-title').textContent = '🎉 חג שבועות — מתן תורה!';
    document.getElementById('modal-hebrew').textContent = 'ו\' סיוון — סיום ספירת העומר';
    document.getElementById('modal-sefirah').textContent = 'שֶׁבַע שָׁבוּעוֹת תִּסְפָּר לָךְ... וְעָשִׂיתָ חַג שָׁבֻעוֹת לַה\' אֱלֹהֶיךָ 🌟';
    document.getElementById('modal-task').textContent = 'חג שמח! 🎉 היום חוגגים את קבלת התורה. ספר למישהו קרוב אחד דבר שלמדת השנה ואתה גאה בו!';
    const btn = document.getElementById('btn-count');
    if (isDone) {
      btn.textContent = '✅ ישר כח גדול! חג שמח!';
      btn.disabled = true;
    } else {
      btn.textContent = '🎉 חג שמח! סמן את החג';
      btn.disabled = false;
    }
    document.getElementById('modal-overlay').classList.add('open');
    return;
  }

  document.getElementById('modal-emoji').textContent = isDone ? '✅' : emojis[day % emojis.length];
  document.getElementById('modal-day-title').textContent = `יום ${hebrewOmer(day)} לעומר`;
  document.getElementById('modal-hebrew').textContent = getHebDate(day);
  document.getElementById('modal-sefirah').textContent = sefirahFormula(day);
  document.getElementById('modal-task').textContent = getTask(day);

  const btn = document.getElementById('btn-count');
  if (isDone) {
    btn.textContent = '✅ ישר כח גדול! כבר ספרת יום זה';
    btn.disabled = true;
  } else if (isToday) {
    btn.textContent = '🌟 ספרתי! סמן יום ' + day;
    btn.disabled = false;
  } else if (day < (today || 0)) {
    btn.textContent = '✓ סמן כהושלם';
    btn.disabled = false;
  } else {
    btn.textContent = '🔒 טרם הגיע היום';
    btn.disabled = true;
  }

  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  activeDay = null;
}

function countDay() {
  if (activeDay === null) return;
  if (state.countedDays.includes(activeDay)) return;
  state.countedDays.push(activeDay);
  saveState();
  renderGrid();
  updateCounter();
  closeModal();
  launchConfetti();
  // Show success flash
  setTimeout(() => {
    const badge = document.getElementById('count-badge');
    badge.style.background = 'linear-gradient(135deg,rgba(46,204,113,0.4),rgba(46,204,113,0.2))';
    badge.style.borderColor = '#2ecc71';
    setTimeout(() => {
      badge.style.background = '';
      badge.style.borderColor = '';
    }, 1200);
  }, 100);
}

function resetAll() {
  if (confirm('למחוק את כל ההתקדמות ולהתחיל מחדש?')) {
    state = { teacher:'', className:'', countedDays:[], started:false };
    saveState();
    location.reload();
  }
}

// ============ CONFETTI ============
function launchConfetti() {
  const area = document.getElementById('confetti-area');
  const colors = ['#f5c842','#2ecc71','#9b59b6','#e74c3c','#3498db','#e67e22'];
  const emojis = ['🌾','⭐','✨','🎉','🌟','💛'];
  for (let i = 0; i < 40; i++) {
    const el = document.createElement('div');
    const useEmoji = Math.random() > 0.5;
    el.style.cssText = `
      position:absolute;
      left:${Math.random()*100}%;
      top:-30px;
      font-size:${useEmoji?'1.6rem':'10px'};
      ${useEmoji?'':'width:10px;height:10px;background:'+colors[Math.floor(Math.random()*colors.length)]+';border-radius:2px;'}
      animation: fall ${1.5+Math.random()*2}s linear forwards;
      z-index:9999;
    `;
    if (useEmoji) el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    area.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }
  const style = document.getElementById('confetti-style') || document.createElement('style');
  style.id = 'confetti-style';
  style.textContent = `@keyframes fall {
    to { transform: translateY(110vh) rotate(${Math.random()*720}deg); opacity: 0; }
  }`;
  document.head.appendChild(style);
}

// ============ STARS ============
function createStars() {
  const area = document.getElementById('stars');
  for (let i = 0; i < 80; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2.5 + 0.5;
    s.style.cssText = `
      width:${size}px; height:${size}px;
      top:${Math.random()*100}%;
      left:${Math.random()*100}%;
      animation-duration:${2+Math.random()*4}s;
      animation-delay:${Math.random()*4}s;
    `;
    area.appendChild(s);
  }
}

// ============ INIT ============
loadState();
createStars();
if (state.started && state.teacher && state.className) {
  document.getElementById('input-teacher').value = state.teacher;
  document.getElementById('input-class').value = state.className;
  showBoard();
}

// Close modal on overlay click
document.getElementById('modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
</script>
