        // Web Audio API Setup
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(frequencies, durations) {
            let startTime = audioContext.currentTime;
            frequencies.forEach((freq, i) => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = freq;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.3, startTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + durations[i]);
                
                oscillator.start(startTime);
                oscillator.stop(startTime + durations[i]);
                
                startTime += durations[i];
            });
        }

                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${progressPercent}%">
                        שִׁיעוּר ${currentLesson + 1} מִתּוֹךְ ${lessons.length}
                    </div>
                </div>
                
                <div class="score-display">
                    נִקּוּד כּוֹלֵל: ${score} 🌟
                </div>
                
                <div class="lesson-container">
                    <h2 class="lesson-title">${lesson.title}</h2>
                    <div class="lesson-content">
                        ${lesson.content}
                    </div>
                    
                    <div class="inspiration-box">
                        <strong>שְׁאֵלָה לְמַחְשָׁבָה:</strong><br>
                        ${lesson.inspiration}
                    </div>
                    
                    <div class="center-btn">
                        <button class="btn-primary" onclick="startQuiz()">בּוֹאוּ נִבְדֹּק מַה לָּמַדְנוּ! 📝</button>
                    </div>
                </div>
            `;
        }

        function startQuiz() {
            const lesson = lessons[currentLesson];
            lessonScores[currentLesson] = { correct: 0, total: lesson.questions.length };
            renderQuestion(0);
        }

        function renderQuestion(questionIndex) {
            const lesson = lessons[currentLesson];
            const question = lesson.questions[questionIndex];
            const container = document.getElementById('gameContainer');
            
            const shuffledAnswers = shuffle(question.answers.map((answer, index) => ({ text: answer, index })));
            
            container.innerHTML = `
                <h1>מִשְׂחַק פָּרָשַׁת שְׁמוֹת 💖</h1>
                
                <div class="score-display">
                    נִקּוּד כּוֹלֵל: ${score} 🌟
                </div>
                
                <div class="lesson-container">
                    <h2 class="lesson-title">${lesson.title}</h2>
                    
                    <div class="question-container">
                        <div class="question-text">
                            <strong>שְׁאֵלָה ${questionIndex + 1} מִתּוֹךְ ${lesson.questions.length}:</strong><br>
                            ${question.question}
                        </div>
                        
                        <div id="answersContainer">
                            ${shuffledAnswers.map((answer, i) => `
                                <button class="answer-btn" onclick="checkAnswer(${questionIndex}, ${answer.index}, ${i})">
                                    ${answer.text}
                                </button>
                            `).join('')}
                        </div>
                        
                        <div id="feedback"></div>
                    </div>
                </div>
            `;
        }

        function checkAnswer(questionIndex, selectedIndex, buttonIndex) {
            const lesson = lessons[currentLesson];
            const question = lesson.questions[questionIndex];
            const isCorrect = selectedIndex === question.correct;
            
            const buttons = document.querySelectorAll('.answer-btn');
            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === buttonIndex) {
                    btn.classList.add(isCorrect ? 'correct' : 'wrong');
                }
            });
            
            const feedbackDiv = document.getElementById('feedback');
            
            if (isCorrect) {
                playCorrectSound();
                score += 10;
                lessonScores[currentLesson].correct++;
                totalQuestions++;
                
                const encouragements = ["מְצֻיָּן!", "נִפְלָא!", "כָּל הַכָּבוֹד!", "מַמָּשׁ מוּמְחֶה!"];
                const randomEncouragement = encouragements[Math.floor(Math.random() * encouragements.length)];
                
                feedbackDiv.innerHTML = `
                    <div class="feedback correct">
                        <strong style="font-size: 1.3em;">${randomEncouragement} ⭐</strong><br><br>
                        ${question.explanation}
                    </div>
                `;
            } else {
                lessonScores[currentLesson].total++;
                totalQuestions++;
                
                feedbackDiv.innerHTML = `
                    <div class="feedback wrong">
                        <strong style="font-size: 1.3em;">לֹא בְּדִיּוּק... 🤔</strong><br><br>
                        ${question.wrongExplanation}
                    </div>
                `;
            }
            
            setTimeout(() => {
                if (questionIndex < lesson.questions.length - 1) {
                    renderQuestion(questionIndex + 1);
                } else {
                    finishLesson();
                }
            }, 4000);
        }

        function finishLesson() {
            const lessonScore = lessonScores[currentLesson];
            const percentage = (lessonScore.correct / lessonScore.total) * 100;
            const passed = percentage >= 66;
            
            const container = document.getElementById('gameContainer');
            
            if (passed) {
                if (lessonScore.correct === lessonScore.total) {
                    playCompletionSound();
                }
                
                const messages = {
                    3: "מַדְהִים! 🏆 אַתָּה שׁוֹלֵט! אַתָּה חַי בְּאַהֲבַת ה'! 🎉",
                    2: "כִּמְעַט מֻשְׁלָם! 💪 מַמָּשׁ כְּמוֹ בָּאַהֲבָה - מַמְשִׁיךְ לִצְמֹחַ! 🌱"
                };
                
                container.innerHTML = `
                    <h1>מִשְׂחַק פָּרָשַׁת שְׁמוֹת 💖</h1>
                    
                    <div class="lesson-container" style="text-align: center;">
                        <h2 class="lesson-title">סִיּוּם שִׁיעוּר 🎊</h2>
                        
                        <div style="font-size: 3em; margin: 30px 0;">
                            ${lessonScore.correct === 3 ? '🏆' : '💪'}
                        </div>
                        
                        <div style="font-size: 1.5em; line-height: 2; margin: 20px 0;">
                            <p>${messages[lessonScore.correct]}</p>
                            <p style="color: #667eea; font-weight: bold;">
                                עָנִיתָ נָכוֹן עַל ${lessonScore.correct} מִתּוֹךְ ${lessonScore.total} שְׁאֵלוֹת! ✨
                            </p>
                            <p style="background: linear-gradient(135deg, #fff9e6 0%, #ffe4b3 100%); padding: 20px; border-radius: 15px; margin-top: 20px;">
                                💖 הַשֵּׁם שָׂמֵחַ מֵאִתְּךָ וְאוֹהֵב אוֹתְךָ! 💖
                            </p>
                        </div>
                        
                        <div class="score-display" style="font-size: 1.8em;">
                            נִקּוּד כּוֹלֵל: ${score} 🌟
                        </div>
                        
                        <div class="center-btn">
                            ${currentLesson < lessons.length - 1 ? 
                                `<button class="btn-primary" onclick="nextLesson()">לְשִׁיעוּר הַבָּא! 🚀</button>` :
                                `<button class="btn-primary" onclick="finishGame()">לְסִיּוּם הַמִּשְׂחָק! 🎉</button>`
                            }
                        </div>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <h1>מִשְׂחַק פָּרָשַׁת שְׁמוֹת 💖</h1>
                    
                    <div class="lesson-container" style="text-align: center;">
                        <h2 class="lesson-title">בּוֹא נְנַסֶּה שׁוּב! 💪</h2>
                        
                        <div style="font-size: 1.4em; line-height: 2; margin: 30px 0;">
                            <p>עָנִיתָ נָכוֹן עַל ${lessonScore.correct} מִתּוֹךְ ${lessonScore.total} שְׁאֵלוֹת.</p>
                            <p style="color: #764ba2; font-weight: bold;">כְּדֵי לְהַמְשִׁיךְ צָרִיךְ לַעֲנוֹת נָכוֹן עַל לְפָחוֹת 2 שְׁאֵלוֹת. 📚</p>
                            
                            <div style="background: #e8f5e9; padding: 20px; border-radius: 15px; margin-top: 20px;">
                                <p>💡 אַל תִּתְיָאֵשׁ! גַּם כְּשֶׁטּוֹעִים - לוֹמְדִים!</p>
                                <p>בּוֹא נַחֲזֹר עַל הַשִּׁיעוּר וּנְנַסֶּה שׁוּב. 🌱</p>
                                <p style="font-size: 1.2em; margin-top: 15px;">💖 הַשֵּׁם אוֹהֵב אוֹתְךָ וְגֵאֶה בְּךָ! 💖</p>
                            </div>
                        </div>
                        
                        <div class="center-btn">
                            <button class="btn-primary" onclick="renderLesson()">בּוֹא נִלְמַד שׁוּב! 📖</button>
                        </div>
                    </div>
                `;
            }
        }

        function nextLesson() {
            currentLesson++;
            renderLesson();
        }

        function finishGame() {
            playCompletionSound();
            
            const container = document.getElementById('gameContainer');
            container.innerHTML = `
                <h1>מִשְׂחַק פָּרָשַׁת שְׁמוֹת 💖</h1>
                
                <div class="certificate">
                    <h2>🏆 תְּעוּדַת הִצְטַיְּנוּת 🏆</h2>
                    <div class="certificate-content">
                        <p style="font-size: 1.5em; margin: 20px 0;">מַזָּל טוֹב! 🎉</p>
                        <p>סִיַּמְתָּ בְּהַצְלָחָה אֶת מִשְׂחַק הַלִּמּוּד</p>
                        <p style="font-weight: bold; font-size: 1.3em; color: #667eea;">פָּרָשַׁת שְׁמוֹת - בְּנֵי יִשְׂרָאֵל בְּמִצְרַיִם</p>
                        
                        <div style="background: white; padding: 20px; border-radius: 15px; margin: 30px 0;">
                            <p style="font-size: 2em; color: #d4af37;">⭐ ${score} נְקֻדּוֹת! ⭐</p>
                        </div>
                        
                        <p style="font-style: italic; line-height: 2; margin: 20px 0;">
                            "וְאָהַבְתָּ אֵת ה' אֱלֹהֶיךָ<br>
                            בְּכָל לְבָבְךָ וּבְכָל נַפְשְׁךָ וּבְכָל מְאֹדֶךָ"<br>
                            <span style="font-size: 0.9em;">(דברים ו, ה)</span>
                        </p>
                        
                        <p style="font-size: 1.2em; margin-top: 20px;">💖 הַשֵּׁם גֵּאֶה בְךָ וְאוֹהֵב אוֹתְךָ! 💖</p>
                    </div>
                </div>
                
                <div class="final-questions">
                    <h3 style="text-align: center; color: #2e7d32; font-size: 1.5em; margin-bottom: 15px;">
                        💭 שְׁאֵלוֹת לְמַחְשָׁבָה 💭
                    </h3>
                    <ol style="font-size: 1.15em; line-height: 2;">
                        <li>אֵיךְ אוּכַל לְהָבִיא יוֹתֵר אַהֲבַת ה' לַלִּמּוּד הַבָּא שֶׁלִּי?</li>
                        <li>אֵיזוֹ מִצְוָה אֲנִי רוֹצֶה לְקַיֵּם הַיּוֹם מִתּוֹךְ שִׂמְחָה?</li>
                        <li>מַה לָּמַדְתִּי עַל אֱמוּנָה וְעַל אַהֲבַת ה' מֵהַסִּפּוּר שֶׁל בְּנֵי יִשְׂרָאֵל?</li>
                    </ol>
                </div>
                
                <div style="text-align: center; background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%); padding: 25px; border-radius: 15px; margin: 20px 0;">
                    <h3 style="color: #1976d2; margin-bottom: 15px;">🎁 הִשְׁתַּתֵּף בְּהַגְרָלָה! 🎁</h3>
                    <p style="font-size: 1.2em; line-height: 1.8;">
                        כָּל הַכָּבוֹד שֶׁסִּיַּמְתָּ אֶת הַמִּשְׂחָק! 💪<br>
                        עַכְשָׁיו אַתָּה נִכְנָס לְהַגְרָלָה נוֹשֵׂאת פְּרָסִים! 🎉
                    </p>
                    <a href="https://forms.gle/A66uubei4XSX6SG2A" target="_blank" class="btn-primary" style="display: inline-block; margin-top: 15px;">
                        לְהַרְשָׁמָה לְהַגְרָלָה! 🎯
                    </a>
                </div>
                
                <div class="contact-info">
                    <p style="font-size: 1.3em; font-weight: bold; color: #764ba2; margin-bottom: 10px;">
                        ✨ נִבְנָה בְּאַהֲבָה עַל יְדֵי: ✨
                    </p>
                    <p style="font-size: 1.2em;">
                        הָרַב יְהוּדָה טָאוּב מִקִּרְיַת אַתָּא<br>
                        📞 לִפְרָטִים: 0527139520
                    </p>
                </div>
            `;
        }

        // Initialize game
        renderIntro();
    </script>
