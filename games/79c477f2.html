<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>סיפורי צדיקים — ספרייה</title>
<style>
  :root{
    --gold:#c9a227;
    --gold-light:#e8cf7a;
    --cream:#fbf3df;
    --navy:#1e2a3a;
    --navy-light:#2c3e54;
    --accent:#8b5e34;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    font-family:'Segoe UI',Arial,sans-serif;
    background:linear-gradient(160deg,var(--navy) 0%,var(--navy-light) 100%);
    overflow:hidden;
    direction:rtl;
  }
  #app{
    position:relative;
    width:100%;height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  .stage{
    width:min(940px,95vw);
    height:min(660px,88vh);
    background:var(--cream);
    border-radius:22px;
    box-shadow:0 20px 60px rgba(0,0,0,0.45);
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  /* ---- HOME SCREEN ---- */
  .home{
    flex:1;
    overflow-y:auto;
    padding:26px 30px;
  }
  .home h1{
    text-align:center;
    color:var(--navy);
    margin:0 0 4px;
    font-size:clamp(22px,3.2vw,30px);
  }
  .home p.sub{
    text-align:center;
    color:var(--accent);
    margin:0 0 22px;
    font-size:14px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:16px;
  }
  .card{
    background:#fff;
    border-radius:16px;
    padding:18px 16px;
    cursor:pointer;
    border:2px solid transparent;
    box-shadow:0 4px 14px rgba(0,0,0,0.1);
    transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    text-align:center;
  }
  .card:hover{
    transform:translateY(-4px);
    border-color:var(--gold);
    box-shadow:0 8px 22px rgba(0,0,0,0.18);
  }
  .card .icon{font-size:44px;margin-bottom:8px;display:block;}
  .card h3{
    margin:0 0 6px;
    font-size:15px;
    color:var(--navy);
    line-height:1.35;
  }
  .card p{
    margin:0;
    font-size:12.5px;
    color:#777;
    line-height:1.4;
  }
  .card .count{
    display:inline-block;
    margin-top:8px;
    font-size:11px;
    background:var(--cream);
    color:var(--accent);
    padding:2px 10px;
    border-radius:12px;
    font-weight:700;
  }
  /* ---- STORY VIEW (reused pattern) ---- */
  .visual{
    flex:1 1 44%;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    transition:background 0.6s ease;
  }
  .visual .emoji-scene{
    font-size:min(13vw,84px);
    filter:drop-shadow(0 6px 10px rgba(0,0,0,0.25));
    animation:floatIn 0.7s ease;
    text-align:center;
    line-height:1.1;
  }
  .visual .onscreen-text{
    position:absolute;
    bottom:14px;left:20px;right:20px;
    text-align:center;
    font-size:clamp(15px,2.4vw,24px);
    font-weight:700;
    color:#fff;
    background:rgba(30,42,58,0.55);
    padding:10px 16px;
    border-radius:12px;
    backdrop-filter:blur(2px);
    animation:fadeUp 0.8s ease;
  }
  @keyframes floatIn{from{opacity:0;transform:translateY(14px) scale(0.94);}to{opacity:1;transform:translateY(0) scale(1);}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .panel{
    flex:1 1 56%;
    background:#fff;
    padding:16px 26px 8px;
    overflow-y:auto;
    border-top:3px solid var(--gold);
  }
  .slide-counter{font-size:13px;color:var(--accent);font-weight:700;letter-spacing:0.5px;}
  .say-label{display:inline-block;background:var(--gold);color:#3a2a05;font-size:12px;font-weight:800;padding:3px 10px;border-radius:20px;margin:8px 0 6px;}
  .say-text{font-size:clamp(14px,2vw,18px);line-height:1.55;color:var(--navy);white-space:pre-line;}
  .cue-label{display:inline-block;background:var(--navy);color:#fff;font-size:12px;font-weight:800;padding:3px 10px;border-radius:20px;margin:10px 0 6px;}
  .cue-text{font-size:13.5px;color:#555;line-height:1.5;font-style:italic;}
  .nav-bar{position:absolute;bottom:16px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;padding:0 10px;}
  .nav-btn{background:var(--gold);border:none;color:#3a2a05;font-size:15px;font-weight:800;padding:9px 16px;border-radius:30px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,0.3);transition:transform 0.15s ease, background 0.2s ease;}
  .nav-btn:hover{transform:translateY(-2px);background:var(--gold-light);}
  .nav-btn:active{transform:translateY(0);}
  .nav-btn:disabled{opacity:0.35;cursor:not-allowed;transform:none;}
  .nav-btn.home-btn{background:var(--navy);color:#fff;}
  .dots{display:flex;gap:4px;align-items:center;flex-wrap:wrap;max-width:260px;justify-content:center;}
  .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.35);cursor:pointer;transition:background 0.2s, transform 0.2s;}
  .dot.active{background:var(--gold);transform:scale(1.4);}
  .top-bar{width:min(940px,95vw);display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;color:var(--cream);}
  .top-title{font-size:15px;font-weight:700;opacity:0.9;}
  .mem-btn{background:transparent;border:1.5px solid var(--gold);color:var(--gold-light);padding:6px 14px;border-radius:20px;font-size:13px;font-weight:700;cursor:pointer;transition:background 0.2s;}
  .mem-btn:hover{background:rgba(201,162,39,0.15);}
  .mem-overlay{position:fixed;inset:0;background:rgba(10,15,22,0.85);display:none;align-items:center;justify-content:center;z-index:50;}
  .mem-overlay.show{display:flex;}
  .mem-box{background:var(--cream);width:min(700px,92vw);max-height:85vh;overflow-y:auto;border-radius:16px;padding:24px 28px;box-shadow:0 20px 60px rgba(0,0,0,0.5);}
  .mem-box h2{color:var(--navy);margin-top:0;border-bottom:3px solid var(--gold);padding-bottom:8px;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th,td{text-align:right;padding:7px 9px;border-bottom:1px solid #ddd;}
  th{background:var(--gold);color:#3a2a05;}
  tr:nth-child(even){background:#f6ecd0;}
  .close-mem{margin-top:16px;background:var(--navy);color:#fff;border:none;padding:8px 20px;border-radius:20px;cursor:pointer;font-weight:700;}
  @media (max-width:600px){.stage{border-radius:14px;}.panel{padding:12px 14px 6px;}.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}}
</style>

<body>
<div id="app">
  <div class="top-bar">
    <div class="top-title" id="topTitle">📚 ספריית סיפורי צדיקים</div>
    <button class="mem-btn" id="memBtn" style="display:none;">טבלת זיכרון מהירה</button>
  </div>

  <div class="stage">
    <div id="homeScreen" class="home"></div>

    <div id="storyScreen" style="display:none; flex-direction:column; height:100%;">
      <div class="visual" id="visual">
        <div class="emoji-scene" id="emojiScene"></div>
        <div class="onscreen-text" id="onscreenText"></div>
      </div>
      <div class="panel">
        <div class="slide-counter" id="slideCounter"></div>
        <div class="say-label">🗣️ אתה אומר</div>
        <div class="say-text" id="sayText"></div>
        <div class="cue-label">🎭 כיווני ביצוע</div>
        <div class="cue-text" id="cueText"></div>
      </div>
    </div>
  </div>

  <div class="nav-bar" id="navBar" style="display:none;">
    <button class="nav-btn home-btn" id="homeBtn">🏠 תפריט</button>
    <button class="nav-btn" id="prevBtn">◀ הקודם</button>
    <div class="dots" id="dots"></div>
    <button class="nav-btn" id="nextBtn">הבא ▶</button>
  </div>
</div>

<div class="mem-overlay" id="memOverlay">
  <div class="mem-box">
    <h2>🎯 טבלת זיכרון מהירה</h2>
    <table id="memTable"></table>
    <button class="close-mem" id="closeMem">סגור</button>
  </div>
</div>

<script>
const STORIES = {
  arod: {
    icon:"🐍", title:"רבי חנינא בן דוסא והנחש הערוד",
    blurb:"נאמנות, אומץ ודין 'לא הנחש ממית'",
    slides:[
      {bg:"linear-gradient(160deg,#e8cf7a,#c9a227)",emoji:"🏚️✨",onscreen:"עני בכסף, עשיר באמונה",
        say:`ילדים... בואו נתקרב רגע.\n\nאני הולך לספר לכם על מישהו מיוחד. מישהו שהיה כל כך עני, שלא היה לו כמעט מה לאכול. אבל היה לו משהו שאף מלך בעולם לא היה יכול לקנות בכסף. מי מנחש מה?`,
        cue:`טון חם, איטי. עצירה לתשובות (2-3 ילדים).`},
      {bg:"linear-gradient(160deg,#c9a227,#3a2a05)",emoji:"🌟📢",onscreen:"\"כל העולם ניזון בזכות חנינא בני\"",
        say:`בדיוק — אמונה! שמו היה רבי חנינא בן דוסא. וכל בוקר, הייתה יוצאת קריאה מהשמיים ואומרת...\n\n(עצירה, שינוי טון לקול חגיגי ואיטי)\n\n'כל העולם כולו ניזון בזכות חנינא בני!'`,
        cue:`כאן משנים קול — יותר עמוק וחגיגי, כמו הכרזה משמיים.`},
      {bg:"linear-gradient(160deg,#4a6741,#1e2a3a)",emoji:"🐍🕳️",onscreen:"יצור מסוכן במיוחד",
        say:`באחד המקומות בארץ ישראל, היה מסתובב יצור מסוכן במיוחד — נחש ארסי שנקרא 'ערוד'.\n\n(לחישה)\n\nהוא היה מתחבא בחור באדמה, ומי שהוא נשך — לא היה לו סיכוי.`,
        cue:`להנמיך קול ללחישה במילה 'ערוד'.`},
      {bg:"linear-gradient(160deg,#8b5e34,#4a6741)",emoji:"😰❓",onscreen:"מה אתם הייתם עושים?",
        say:`התושבים באו מבוהלים לרבי חנינא. אם הייתם רבי חנינא — מה הייתם עושים?`,
        cue:`לשמוע 2-3 תשובות, לאשר כל תשובה.`},
      {bg:"linear-gradient(160deg,#1e2a3a,#4a6741)",emoji:"🚶‍♂️〰️🏃‍♂️🏃‍♀️",onscreen:"הם מרחוק. הוא קרוב.",
        say:`רבי חנינא לא נבהל. הוא אמר: 'הראו לי את החור שלו.'\n\nוהם הראו לו את החור מרחוק — מרוב פחד. ורבי חנינא לא פחד בכלל.`,
        cue:`אפשר לצעוד צעד קדימה כשמדברים על רבי חנינא, ולהצטמצם לאחור כשמדברים על התושבים.`},
      {bg:"linear-gradient(160deg,#4a6741,#1e2a3a)",emoji:"👣🕳️",onscreen:"",
        say:`(קול נחוש, איטי)\n\nהוא הלך... ישר... לחור. שם את העקב שלו — ממש על הפתח. וחיכה.`,
        cue:`האטה קיצונית בקצב הדיבור.`},
      {bg:"radial-gradient(circle at 50% 60%,#4a6741 0%,#0d1218 85%)",emoji:"🐍",onscreen:"",
        say:`הערוד יצא... (עצירה) ונשך אותו בעקב...\n\n(עצירה ארוכה, שתיקה של ממש)\n\nמה קרה לדעתכם?`,
        cue:`זו השתיקה החשובה בכל הסיפור.`},
      {bg:"linear-gradient(160deg,#3a7d9c,#c9a227)",emoji:"💧✨👣",onscreen:"מעיין נבקע תחת עקבו",
        say:`ואז נבקע מהאדמה מעיין מים! מי שמגיע ראשון למים — נשאר בחיים. וה' דאג שדווקא רבי חנינא יגיע ראשון.`,
        cue:`קול של התפעלות, לא למהר.`},
      {bg:"linear-gradient(160deg,#e8cf7a,#c9a227)",emoji:"🙌🐍",onscreen:"בריא ושלם!",
        say:`והנחש מת. ורבי חנינא עמד שם, בריא ושלם. הוא הביא אותו לבית המדרש ואמר...`,
        cue:`רגע של הקלה בקול.`},
      {bg:"linear-gradient(160deg,#c9a227,#8b5e34)",emoji:"💛",onscreen:"\"אין ערוד ממית, אלא החטא ממית\"",
        say:`(בקול של רבי חנינא עצמו) 'ראו בני — לא הנחש ממית, אלא החטא ממית.'`,
        cue:`תני לזה לשקוע.`},
      {bg:"linear-gradient(160deg,#1e2a3a,#3a7d9c)",emoji:"💭❓",onscreen:"למה דווקא הוא לא פחד?",
        say:`למה דווקא רבי חנינא יכול היה לגשת בלי לפחד?\n\n(לשמוע תשובות)\n\nולמה הוא התכוון ב'לא הנחש ממית, אלא החטא'?`,
        cue:`אל תתני את התשובה!`},
      {bg:"linear-gradient(160deg,#e8cf7a,#3a7d9c)",emoji:"🧑‍🎓📖😰",onscreen:"גם לנו יש \"נחשים\" משלנו",
        say:`לכם אין נחשים מסוכנים. אבל יש דברים שמפחידים — מבחן, לעמוד מול הכיתה. ילד שמשתדל לעשות מצוות — יש לו כוח פנימי מיוחד.`,
        cue:`קול חם ואישי, איטי.`},
      {bg:"linear-gradient(160deg,#e8cf7a,#c9a227)",emoji:"🏚️✨",onscreen:"איפה אתם תהיו כמו רבי חנינא?",
        say:`איפה אתם יכולים להיות קצת כמו רבי חנינא — השבוע?\n\n(לתת לכמה ילדים לשתף)`,
        cue:`נעילה רגועה.`}
    ],
    mem:[["1-2","פתיחה + בת קול","עני אבל אמונה"],["3-4","הבעיה + שאלה","נחש = פחד"],["5","'הראו לי את החור'","הם מרחוק, הוא קרוב"],["6-7","הליכה + שיא","שתיקה!"],["8","נס המעיין","מי מגיע ראשון למים"],["9-10","תוצאה + משפט מרכזי","'לא הנחש, החטא'"],["11","דיון","שאלות, לא תשובות"],["12-13","חיבור + סגירה","'הנחש שלי'"]]
  },

  nechunya:{
    icon:"💧", title:"בתו של נחוניה חופר שיחין",
    blurb:"חסד שמגן — האיל שהציל את הבת",
    slides:[
      {bg:"linear-gradient(160deg,#e8cf7a,#7a4a2b)",emoji:"🏜️🚶‍♂️🕳️",onscreen:"בואו נכיר את נחוניה",
        say:`פעם, כשאנשים היו הולכים ברגל לירושלים — היה חם. היה איש צדיק, ששמו נחוניה, שחפר בורות מים לאורך הדרכים בשביל כל מי שיעבור.`,
        cue:`טון חם, סיפורי.`},
      {bg:"linear-gradient(160deg,#3a7d9c,#1e2a3a)",emoji:"😨🕳️👧",onscreen:"יום אחד קרה משהו נורא",
        say:`בתו של נחוניה נפלה לתוך אחד הבורות העמוקים. עמוק, עמוק. והיא לא הצליחה לצאת משם.`,
        cue:`האטה, קול נמוך יותר.`},
      {bg:"linear-gradient(160deg,#e8cf7a,#8b5e34)",emoji:"❓🏃‍♂️🏃‍♀️",onscreen:"מי חושבים אתם שקראו לו?",
        say:`האנשים ראו וממש נבהלו. מי חושבים אתם שהם רצו לקרוא לו כדי שיעזור?`,
        cue:`אם עונים 'רבי חנינא!' — לחייך ולומר שהם זוכרים אותו.`},
      {bg:"linear-gradient(160deg,#c9a227,#3a2a05)",emoji:"🙏✨",onscreen:"רבי חנינא מתפלל",
        say:`האנשים רצו בבהלה לרבי חנינא בן דוסא. הוא עצם את העיניים והתפלל מעומק הלב.`,
        cue:`אפשר לעצום עיניים כדי להמחיש.`},
      {bg:"linear-gradient(160deg,#1e2a3a,#3a7d9c)",emoji:"⏳",onscreen:"שעה 1: \"שלום לה\"   שעה 2: \"עדיין שלום לה\"",
        say:`בשעה הראשונה אמר: 'שלום לה — היא בריאה ושלמה.' עברה שעה. שוב: 'עדיין שלום לה.' עברה עוד שעה...`,
        cue:`חזרה קצבית — אפשר לתת לילדים לומר איתך 'שלום לה!'`},
      {bg:"radial-gradient(circle at 50% 60%,#3a7d9c 0%,#1e2a3a 80%)",emoji:"🌟",onscreen:"",
        say:`(עצירה ארוכה)\n\nובשעה השלישית פתח עיניים ואמר... 'כעת היא כבר עלתה מן הבור!'`,
        cue:`נקודת השיא הרגשית.`},
      {bg:"linear-gradient(160deg,#e8cf7a,#c9a227)",emoji:"🙌👧☀️",onscreen:"יבשה ובריאה!",
        say:`האנשים רצו לבור... ומצאו את הבת עומדת בחוץ, יבשה ובריאה ושלמה.`,
        cue:`קול שמח, קצב מהיר יותר.`},
      {bg:"linear-gradient(160deg,#c9a227,#8b5e34)",emoji:"🐏🧓✨",onscreen:"מי העלה אותך?",
        say:`היא ענתה: 'עדר כבשים עבר, ובראשו איל גדול. איש זקן הוביל אותם. האיל הושיט לי קרניים, אחזתי בהן והוא משך אותי החוצה.'`,
        cue:`קול של פליאה קלה.`},
      {bg:"linear-gradient(160deg,#8b5e34,#1e2a3a)",emoji:"🤔",onscreen:"רבי, האם אתה נביא?",
        say:`שאלו: 'רבי, איך ידעת בדיוק מתי היא עלתה? האם אתה נביא?'`,
        cue:`להאט כאן.`},
      {bg:"linear-gradient(160deg,#c9a227,#e8cf7a)",emoji:"💛",onscreen:"\"האם המכשול יהיה מהחסד?\"",

let currentStoryKey = null;
let current = 0;

const homeScreen = document.getElementById('homeScreen');
const storyScreen = document.getElementById('storyScreen');
const topTitle = document.getElementById('topTitle');
const memBtn = document.getElementById('memBtn');
const navBar = document.getElementById('navBar');
const emojiScene = document.getElementById('emojiScene');
const onscreenText = document.getElementById('onscreenText');
const visual = document.getElementById('visual');
const sayText = document.getElementById('sayText');
const cueText = document.getElementById('cueText');
const slideCounter = document.getElementById('slideCounter');
const dotsEl = document.getElementById('dots');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const homeBtn = document.getElementById('homeBtn');

function buildHome(){
  homeScreen.innerHTML = `
    <h1>📚 ספריית סיפורי צדיקים</h1>
    <p class="sub">בחרו סיפור להתחיל לספר</p>
    <div class="grid" id="grid"></div>
  `;
  const grid = document.getElementById('grid');
  Object.keys(STORIES).forEach(key => {
    const s = STORIES[key];
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <span class="icon">${s.icon}</span>
      <h3>${s.title}</h3>
      <p>${s.blurb}</p>
      <span class="count">${s.slides.length} כרטיסים</span>
    `;
    card.addEventListener('click', () => openStory(key));
    grid.appendChild(card);
  });
}

function openStory(key){
  currentStoryKey = key;
  current = 0;
  homeScreen.style.display = 'none';
  storyScreen.style.display = 'flex';
  navBar.style.display = 'flex';
  memBtn.style.display = 'inline-block';
  topTitle.textContent = STORIES[key].icon + ' ' + STORIES[key].title;
  renderSlide();
}

function goHome(){
  currentStoryKey = null;
  homeScreen.style.display = 'block';
  storyScreen.style.display = 'none';
  navBar.style.display = 'none';
  memBtn.style.display = 'none';
  topTitle.textContent = '📚 ספריית סיפורי צדיקים';
}

function buildDots(){
  const slides = STORIES[currentStoryKey].slides;
  dotsEl.innerHTML = '';
  slides.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === current ? ' active' : '');
    d.addEventListener('click', () => { current = i; renderSlide(); });
    dotsEl.appendChild(d);
  });
}

function renderSlide(){
  const slides = STORIES[currentStoryKey].slides;
  const s = slides[current];
  visual.style.background = s.bg;
  emojiScene.textContent = s.emoji;
  onscreenText.textContent = s.onscreen;
  onscreenText.style.display = s.onscreen ? 'block' : 'none';
  sayText.textContent = s.say;
  cueText.textContent = s.cue;
  slideCounter.textContent = 'כרטיס ' + (current+1) + ' מתוך ' + slides.length;
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === slides.length - 1;
  nextBtn.textContent = current === slides.length - 1 ? 'סוף הסיפור ✓' : 'הבא ▶';
  buildDots();
  document.querySelector('.panel').scrollTop = 0;
}

prevBtn.addEventListener('click', () => {
  if(current > 0){ current--; renderSlide(); }
});
nextBtn.addEventListener('click', () => {
  const slides = STORIES[currentStoryKey].slides;
  if(current < slides.length - 1){ current++; renderSlide(); }
});
homeBtn.addEventListener('click', goHome);

document.addEventListener('keydown', (e) => {
  if(!currentStoryKey) return;
  const slides = STORIES[currentStoryKey].slides;
  if(e.key === 'ArrowLeft'){
    if(current < slides.length - 1){ current++; renderSlide(); }
  } else if(e.key === 'ArrowRight'){
    if(current > 0){ current--; renderSlide(); }
  }
});

const memOverlay = document.getElementById('memOverlay');
const memTable = document.getElementById('memTable');
const closeMem = document.getElementById('closeMem');
memBtn.addEventListener('click', () => {
  if(!currentStoryKey) return;
  const mem = STORIES[currentStoryKey].mem;
  let html = '<tr><th>#</th><th>רגע</th><th>מילת מפתח</th></tr>';
  mem.forEach(row => {
    html += `<tr><td>${row[0]}</td><td>${row[1]}</td><td>${row[2]}</td></tr>`;
  });
  memTable.innerHTML = html;
  memOverlay.classList.add('show');
});
closeMem.addEventListener('click', () => memOverlay.classList.remove('show'));
memOverlay.addEventListener('click', (e) => {
  if(e.target === memOverlay) memOverlay.classList.remove('show');
});

buildHome();
</script>
</body>
</html>
