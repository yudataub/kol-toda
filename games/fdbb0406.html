            let startTime = audioContext.currentTime;
            
            frequencies.forEach((freq, index) => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = freq;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.3, startTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + durations[index]);
                
                oscillator.start(startTime);
                oscillator.stop(startTime + durations[index]);
                
                startTime += durations[index];
            });

                        answers: [
                            "הַכָּרַת טוֹב אֲמִיתִּית מְבִיאָה לְהוֹסִיף מֵאַהֲבָה",
                            "צָרִיךְ תָּמִיד לַעֲשׂוֹת רַק אֶת הַמִּינִימוּם",
                            "הוֹדָיָה זֶה רַק לוֹמַר מִילִים",

                    }
                ]
            }
        ];

        // Shuffle array function
        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        // Render introduction
        function renderIntro() {
            const container = document.getElementById('gameContainer');
            container.innerHTML = `
                <h1>🎮 סוֹד הַהוֹדָיָה הָאֲמִיתִּית 💖</h1>
                
                <div class="intro-text">
                    <p style="font-size: 1.4em; text-align: center; margin-bottom: 20px;">🌟 שָׁלוֹם יְלָדִים יְקָרִים! 🌟</p>
                    
                    <p>הַיּוֹם נִלְמַד יַחַד סוֹד נִפְלָא: <span class="highlight">מָה זֶה הוֹדָיָה אֲמִיתִּית?</span> 💫</p>
                    
                    <p>נִגְלֶה אֵיךְ <span class="highlight">הַכָּרַת טוֹב</span> מְבִיאָה אוֹתָנוּ לַעֲשׂוֹת דְּבָרִים נִפְלָאִים! 🎁</p>
                    
                    <p>נְסַפֵּר סִפּוּרִים מְעוֹרְרֵי הַשְׁרָאָה וְנִלְמַד עַל חֲנֻכָּה, בִּכּוּרִים וְשַׁבָּת קֹדֶשׁ 🕎🍇🕯️</p>
                    
                    <p style="text-align: center; font-size: 1.3em; margin-top: 20px;">
                        בַּמִּשְׂחָק הַזֶּה יֵשׁ <span class="highlight">4 שִׁיעוּרִים</span> עִם <span class="highlight">3 שְׁאֵלוֹת</span> בְּכָל שִׁיעוּר! 🎯

        // Start game
        function startGame() {
            currentLesson = 0;
            score = 0;
            totalQuestions = 0;
            renderLesson();

        // Render lesson
        function renderLesson() {
            if (currentLesson >= lessons.length) {
                renderFinalResults();
                return;
            }

            const lesson = lessons[currentLesson];
            currentQuestion = 0;
            lessonScore = 0;
            
            const container = document.getElementById('gameContainer');
            container.innerHTML = `
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${((currentLesson) / lessons.length) * 100}%">
                        שִׁיעוּר ${currentLesson + 1} מִתּוֹךְ ${lessons.length}
                    </div>
                </div>
                
                <div class="score-display">

                    <div class="lesson-title">${lesson.title}</div>
                    ${lesson.content}
                </div>
                
                <button class="main-btn" onclick="startQuestions()">🎯 בּוֹא נַתְחִיל אֶת הַשְּׁאֵלוֹת! 🎯</button>
            `;
        }

        // Start questions
        function startQuestions() {
            renderQuestion();

        // Render question
        function renderQuestion() {
            const lesson = lessons[currentLesson];
            const question = lesson.questions[currentQuestion];
            
            // Shuffle answers
            const shuffledAnswers = question.answers.map((answer, index) => ({
                text: answer,
                originalIndex: index
            }));
            const shuffled = shuffleArray(shuffledAnswers);
            
            const container = document.getElementById('gameContainer');
            const questionHTML = `
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${((currentLesson + (currentQuestion / lesson.questions.length)) / lessons.length) * 100}%">
                        שִׁיעוּר ${currentLesson + 1}, שְׁאֵלָה ${currentQuestion + 1}
                    </div>
                </div>
                
                <div class="score-display">
                    ⭐ נִקּוּד: ${score} מִתּוֹךְ ${totalQuestions} | שִׁיעוּר נוֹכְחִי: ${lessonScore} מִתּוֹךְ ${currentQuestion} ⭐
                </div>
                
                <div class="question-box">
                    <div class="question-text">${question.question}</div>
                    <div id="answersContainer">
                        ${shuffled.map((answer, index) => `
                            <button class="answer-btn" onclick="checkAnswer(${answer.originalIndex}, ${question.correct}, ${index})" id="answer${index}">
                                ${answer.text}
                            </button>
                        `).join('')}
                    </div>
                    <div id="feedbackContainer"></div>
                </div>
            `;
            
            container.innerHTML = questionHTML;
        }

        // Check answer
        function checkAnswer(selectedIndex, correctIndex, buttonIndex) {
            const isCorrect = selectedIndex === correctIndex;
            const lesson = lessons[currentLesson];
            const question = lesson.questions[currentQuestion];
            
            // Disable all buttons
            const buttons = document.querySelectorAll('.answer-btn');
            buttons.forEach(btn => btn.disabled = true);
            
            // Highlight the selected button
            const selectedBtn = document.getElementById(`answer${buttonIndex}`);
            selectedBtn.classList.add(isCorrect ? 'correct' : 'wrong');
            
            totalQuestions++;
            
            // Play sound
            if (isCorrect) {
                lessonScore++;
                score++;
                playSound([261.63, 329.63, 392.00], [0.2, 0.2, 0.3]);
                
                const encouragements = [
                    "מְצֻיָּן! ⭐",
                    "נִפְלָא! 💪",
                    "כָּל הַכָּבוֹד! 🎯",
                    "פַּצָּצָה! 🌟",
                    "מוֹשְׁלָם! 🏆"
                ];
                const randomEncouragement = encouragements[Math.floor(Math.random() * encouragements.length)];
                
                const lovePhrases = [
                    "הַשֵּׁם שָׂמֵחַ מִמְּךָ! 💖",
                    "הַשֵּׁם אוֹהֵב אוֹתְךָ! 💕",
                    "אַתָּה מַקְסִים! הַשֵּׁם גֵּאֶה בְּךָ! 🌟",

                ];
                const randomLove = lovePhrases[Math.floor(Math.random() * lovePhrases.length)];
                
                document.getElementById('feedbackContainer').innerHTML = `
                    <div class="feedback correct">
                        <p style="font-size: 1.4em; font-weight: bold;">${randomEncouragement}</p>
                        <p>${question.explanation}</p>
                        <p style="font-size: 1.2em; margin-top: 10px;">${randomLove}</p>
                    </div>
                `;
            } else {
                document.getElementById('feedbackContainer').innerHTML = `
                    <div class="feedback wrong">
                        <p style="font-size: 1.3em; font-weight: bold;">לֹא בְּדִיּוּק... 🤔</p>
                        <p>${question.explanation}</p>
                        <p style="font-size: 1.2em; margin-top: 10px;">גַּם כְּשֶׁטּוֹעִים - לוֹמְדִים! הַשֵּׁם אוֹהֵב אוֹתְךָ וְשָׂמֵחַ שֶׁאַתָּה מְנַסֶּה! 💡💖</p>
                    </div>
                `;
            }
            
            // Add continue button
            setTimeout(() => {
                const feedbackContainer = document.getElementById('feedbackContainer');
                const continueBtn = document.createElement('button');
                continueBtn.className = 'main-btn';
                continueBtn.style.marginTop = '20px';
                continueBtn.textContent = '➡️ הַבָּא ➡️';
                continueBtn.onclick = nextQuestion;
                feedbackContainer.appendChild(continueBtn);
            }, 1000);
        }

        // Next question
        function nextQuestion() {
            const lesson = lessons[currentLesson];
            currentQuestion++;
            
            if (currentQuestion >= lesson.questions.length) {
                showLessonResults();
            } else {
                renderQuestion();
            }
        }

        // Show lesson results
        function showLessonResults() {
            const lesson = lessons[currentLesson];
            const percentage = (lessonScore / lesson.questions.length) * 100;
            const passed = lessonScore >= 2; // Need 2 out of 3
            
            let resultMessage, resultEmoji, soundFreqs;
            
            if (lessonScore === 3) {
                resultMessage = "מַדְהִים! 🏆 אַתָּה שׁוֹלֵט! אַתָּה חַי בְּאַהֲבַת הַשֵּׁם! 🎉";
                resultEmoji = "🌟✨🎊";
                soundFreqs = [[261.63, 329.63, 392.00, 523.25, 392.00, 329.63], [0.15, 0.15, 0.15, 0.2, 0.15, 0.3]];
            } else if (lessonScore === 2) {
                resultMessage = "כִּמְעַט מֻשְׁלָם! 💪 מַמָּשׁ כְּמוֹ בְּאַהֲבָה - מַמְשִׁיךְ לִצְמוֹחַ! 🌱";

                resultEmoji = "🌈💝";
                passed = false;
            }
            
            if (soundFreqs) {
                playSound(soundFreqs[0], soundFreqs[1]);
            }
            
            const container = document.getElementById('gameContainer');
            container.innerHTML = `

                    <p>💖 אֵיזוֹ מִצְוָה אֲנִי רוֹצֶה לְקַיֵּם הַיּוֹם מִתּוֹךְ שִׂמְחָה וְהוֹדָיָה?</p>

                </div>
                
                <div class="inspiration-box" style="font-size: 1.4em;">
                    🎉 זָכִיתָ לְסַיֵּם אֶת הַמַּסָּע בְּאַהֲבַת הַשֵּׁם! 🎉<br>

                    <p style="font-size: 1.3em;">📞 לִפְרָטִים: 0527139520</p>
                    <p style="margin-top: 20px; font-size: 1.2em;">
                        יְהִי רָצוֹן שֶׁנִּזְכֶּה כֻּלָּנוּ לְהִתְמַלֵּא הוֹדָיָה לַשֵּׁם<br>

                        וְלַעֲשׂוֹת אוֹתָן בְּרוֹב שִׂמְחָה וְטוּב לֵבָב! 💖<br>
