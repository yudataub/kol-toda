        function playSound(frequencies, duration = 0.2) {
            const now = audioContext.currentTime;
            frequencies.forEach((freq, index) => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = freq;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.3, now + index * duration);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + (index + 1) * duration);
                
                oscillator.start(now + index * duration);
                oscillator.stop(now + (index + 1) * duration);
            });
        }

            const newArray = [...array];

                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function renderLesson() {
            if (currentLesson >= lessons.length) {
                renderFinalCertificate();
                return;

            const lesson = lessons[currentLesson];
            currentQuestion = 0;
            lessonScore = 0;
            
            const container = document.getElementById('gameContainer');
            container.innerHTML = `
                <h1>${lesson.title}</h1>

        function startQuestions() {

        // פונקציה להצגת שאלה
        function renderQuestion() {
            const lesson = lessons[currentLesson];
            if (currentQuestion >= lesson.questions.length) {
                checkLessonCompletion();
                return;
            }

            const question = lesson.questions[currentQuestion];
            const shuffledAnswers = question.answers.map((answer, index) => ({ answer, originalIndex: index }));
            const finalShuffled = shuffleArray(shuffledAnswers);

            const container = document.getElementById('gameContainer');
            container.innerHTML = `
                <h1>${lesson.title}</h1>
                <div class="progress-container">
                    <div class="progress-bar" style="width: ${((currentLesson + (currentQuestion / lesson.questions.length)) / lessons.length) * 100}%">
                        שִׁיעוּר ${currentLesson + 1} | שְׁאֵלָה ${currentQuestion + 1} מִתּוֹךְ ${lesson.questions.length}

                <div class="question">
                    <div class="question-text">${question.q}</div>
                    <div id="answersContainer">
                        ${finalShuffled.map((item, index) => `
                            <button class="answer-btn" onclick="checkAnswer(${item.originalIndex}, ${index})" id="btn${index}">
