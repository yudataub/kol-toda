<title>פָּרָשַׁת הַאֲזִינוּ — הַתּוֹרָה נִקְרֵאת שִׁירָה – שִׁירַת הַאֲזִינוּ 🎶</title>
<style>
:root{
  --c1:#4b0082; --c2:#6a0dad; --c3:#8e44ad;
  --accent:#ffd700; --accent2:#ffb700;
  --box:#fdf6ff; --boxBorder:#d9b3ff;
  --hl:#fff8d6; --hlBorder:#f0c419;
  --insp:#e8f1ff; --inspBorder:#5b8def;
  --ok:#28a745; --okBg:#d4edda;
  --bad:#dc3545; --badBg:#f8d7da;
  --txt:#2d1b3d;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Segoe UI","Arial Hebrew",Arial,sans-serif;
  background:linear-gradient(135deg,var(--c1) 0%,var(--c2) 50%,var(--c3) 100%);
  background-attachment:fixed;
  min-height:100vh; padding:15px; color:var(--txt);
  font-size:1.2em; line-height:2; direction:rtl; text-align:right;
}
#gameContainer{
  max-width:820px; margin:0 auto; background:#fff;
  border-radius:22px; padding:28px 26px;
  box-shadow:0 14px 45px rgba(0,0,0,.32);
}
h1{
  font-size:2.1em; text-align:center; line-height:1.5;
  background:linear-gradient(135deg,var(--c1),var(--c3));
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent; margin-bottom:6px;
}
h2{font-size:1.55em;color:var(--c1);line-height:1.6;margin-bottom:12px}
.subtitle{text-align:center;color:#7a5c93;font-size:.95em;margin-bottom:18px;line-height:1.7}
.progress-wrap{background:#eee;border-radius:50px;height:16px;overflow:hidden;margin:16px 0 22px}
.progress-bar{
  height:100%;width:0%;border-radius:50px;transition:width .5s ease;
  background:linear-gradient(90deg,var(--accent2),var(--accent));
}
.card{
  background:var(--box); border:2px solid var(--boxBorder);
  border-radius:15px; padding:20px; margin:16px 0;
  box-shadow:0 4px 14px rgba(0,0,0,.07);
}
.highlight{background:var(--hl);border-right:6px solid var(--hlBorder);border-radius:12px;padding:14px 18px;margin:16px 0;font-weight:700}
.inspiration{background:var(--insp);border-right:6px solid var(--inspBorder);border-radius:12px;padding:14px 18px;margin:16px 0;font-style:italic}
.btn{
  display:inline-block; border:none; cursor:pointer; color:#fff;
  background:linear-gradient(135deg,var(--c2),var(--c3));
  border-radius:50px; padding:14px 38px; font-size:1.15em; font-weight:700;
  font-family:inherit; transition:transform .2s,box-shadow .2s;
  box-shadow:0 5px 16px rgba(0,0,0,.22);
}
.btn:hover{transform:translateY(-3px);box-shadow:0 9px 22px rgba(0,0,0,.3)}
.btn.gold{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#4a3200}
.center{text-align:center}
.name-input-box input{
  width:70%; padding:13px; font-size:1.2em; font-family:inherit;
  border:2px solid var(--boxBorder); border-radius:12px;
  text-align:center; direction:rtl; margin-bottom:16px;
}
.answer-btn{
  display:block; width:100%; text-align:right; margin:11px 0;
  padding:15px 20px; font-size:1.05em; font-family:inherit; line-height:1.8;
  background:#fff; border:2px solid var(--boxBorder); border-radius:14px;
  cursor:pointer; transition:all .2s; color:var(--txt);
}
.answer-btn:hover:not(:disabled){background:var(--box);transform:translateX(-5px);border-color:var(--c3)}
.answer-btn:disabled{cursor:default;opacity:.95}
.answer-btn.correct{background:var(--okBg);border-color:var(--ok);font-weight:700}
.answer-btn.wrong{background:var(--badBg);border-color:var(--bad)}
.feedback{border-radius:14px;padding:18px;margin-top:18px;animation:pop .4s ease}
.feedback.ok{background:var(--okBg);border:2px solid var(--ok)}
.feedback.bad{background:var(--badBg);border:2px solid var(--bad)}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.q-num{color:#8a6aa8;font-size:.9em;margin-bottom:6px}
.certificate{
  border:5px double var(--accent2); border-radius:20px; padding:26px;
  background:linear-gradient(160deg,#fffdf3,#fff8e1); text-align:center;
}
.cert-name{font-size:1.9em;font-weight:800;color:var(--c1);margin:12px 0}
.cert-score{font-size:1.5em;color:var(--ok);font-weight:800;margin:10px 0}
.link-box{background:var(--box);border:2px dashed var(--c3);border-radius:14px;padding:16px;margin:18px 0;text-align:center}
.link-box a{color:var(--c1);font-weight:800}
.contact{text-align:center;color:#6b5580;font-size:.92em;margin-top:18px;line-height:1.9}
.think-q{background:#fff;border-right:5px solid var(--c3);border-radius:10px;padding:10px 14px;margin:9px 0}
.hidden{display:none}
@media (max-width:600px){
  body{font-size:1.3em;padding:8px}
  #gameContainer{padding:18px 14px;border-radius:16px}
  h1{font-size:1.8em}
  h2{font-size:1.3em}
  .name-input-box input{width:92%;font-size:1.1em}
  .btn{padding:12px 30px;font-size:1.1em;width:100%}
  .answer-btn{font-size:1em;padding:13px 15px}
}

  var arr = a.slice();

}
function playTones(freqs, dur){
  var ctx = ensureAudio();

  });

  root.innerHTML =
    progressHtml() +
    '<h2>' + (L.emoji || '📖') + ' ' + L.title + '</h2>' +
    '<div class="card">' + body +
      '<div class="highlight">💡 ' + L.highlight + '</div>' +
      '<div class="inspiration">💖 ' + L.inspiration + '</div>' +
    '</div>' +
    '<div class="center"><button class="btn gold" id="toQ">מוּכָן לַשְּׁאֵלוֹת, ' + userName + '? ✨</button></div>';
  document.getElementById('toQ').addEventListener('click', function(){ qIndex = 0; lessonScore = 0; screenQuestion(); });
  window.scrollTo(0, 0);
}

/* ---------- מסך שאלה ---------- */
function screenQuestion(){
  var L = GAME.lessons[lessonIndex];
  var Q = L.questions[qIndex];
  answered = false;
  currentOptions = shuffleArray(Q.answers.map(function(text, i){
    return { text: text, isCorrect: i === Q.correct };
  }));
  var html =
    progressHtml() +
    '<div class="q-num">שִׁעוּר ' + (lessonIndex + 1) + ' • שְׁאֵלָה ' + (qIndex + 1) + ' מִתּוֹךְ ' + L.questions.length + '</div>' +
    '<h2>❓ ' + Q.q + '</h2><div id="answers">';
  for (var i = 0; i < currentOptions.length; i++){
    html += '<button class="answer-btn" data-i="' + i + '">' + currentOptions[i].text + '</button>';
  }
  html += '</div><div id="fb"></div>';
  root.innerHTML = html;
  var btns = root.querySelectorAll('.answer-btn');
  for (var k = 0; k < btns.length; k++){
    btns[k].addEventListener('click', function(e){ chooseAnswer(parseInt(e.currentTarget.getAttribute('data-i'), 10)); });
  }
  window.scrollTo(0, 0);
}

var PRAISE = ['מְצֻיָּן', 'כָּל הַכָּבוֹד', 'פְּצָצָה', 'מַדְהִים', 'יָפֶה מְאֹד'];
var LOVE = [
  'הַשֵּׁם שָׂמֵחַ כְּשֶׁרוֹאִים אֶת אַהֲבָתוֹ בְּלִבְּךָ',
  'כָּל לִמּוּד שֶׁלְּךָ הוּא נְשִׁיקָה קְטַנָּה לְהַשֵּׁם',
  'הַשֵּׁם מִסְתַּכֵּל עָלֶיךָ עַכְשָׁו בְּאַהֲבָה גְּדוֹלָה'
];

function chooseAnswer(i){
  if (answered) return;
  answered = true;
  var Q = GAME.lessons[lessonIndex].questions[qIndex];
  var isRight = currentOptions[i].isCorrect;
  var btns = root.querySelectorAll('.answer-btn');
  for (var k = 0; k < btns.length; k++){
    btns[k].disabled = true;
    if (currentOptions[k].isCorrect) btns[k].classList.add('correct');
    else if (k === i) btns[k].classList.add('wrong');
  }
  if (isRight){ lessonScore++; totalScore++; soundCorrect(); } else { soundWrong(); }

  var fb = document.getElementById('fb');
  if (isRight){
    fb.innerHTML =
      '<div class="feedback ok">' +
        '<p><strong>' + PRAISE[Math.floor(Math.random() * PRAISE.length)] + ', ' + userName + '! ⭐</strong></p>' +
        '<p>' + Q.explain + '</p>' +
        '<p style="margin-top:8px">' + LOVE[Math.floor(Math.random() * LOVE.length)] + ', ' + userName + ' 💖</p>' +
        '<div class="inspiration">🤔 ' + Q.depth + '</div>' +
        '<div class="center"><button class="btn" id="next">הַמְשֵׁךְ ➡️</button></div>' +
      '</div>';
  } else {
    fb.innerHTML =
      '<div class="feedback bad">' +
        '<p><strong>לֹא בְּדִיּוּק, ' + userName + '... 🤔</strong></p>' +
        '<p>' + Q.explain + '</p>' +
        '<p style="margin-top:8px">גַּם כְּשֶׁטּוֹעִים — לוֹמְדִים! הַשֵּׁם אוֹהֵב אוֹתְךָ, ' + userName + '! 💡</p>' +
        '<div class="inspiration">🤔 ' + Q.depth + '</div>' +
        '<div class="center"><button class="btn" id="next">הַמְשֵׁךְ ➡️</button></div>' +
      '</div>';
  }
  document.getElementById('next').addEventListener('click', nextStep);
  document.getElementById('next').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function nextStep(){
  var L = GAME.lessons[lessonIndex];
  qIndex++;
  if (qIndex < L.questions.length) screenQuestion();
  else screenLessonSummary();
}

/* ---------- סיכום שיעור ושער מעבר ---------- */
function screenLessonSummary(){
  var L = GAME.lessons[lessonIndex];
  var n = L.questions.length;
  var pct = lessonScore / n;
  var passed = pct >= 0.66;
  var msg, emoji;
  if (lessonScore === n){ msg = 'מַדְהִים, ' + userName + '! אַתָּה חַי בְּאַהֲבַת ה׳!'; emoji = '🏆🎉'; soundWin(); }
  else if (passed){ msg = 'כִּמְעַט מֻשְׁלָם, ' + userName + '! מַמָּשׁ כְּמוֹ בְּאַהֲבָה — מַמְשִׁיךְ לִצְמֹחַ'; emoji = '💪🌱'; soundCorrect(); }
  else { msg = 'בּוֹא נְנַסֶּה שׁוּב, ' + userName + ', בְּאַהֲבָה וּבְסַבְלָנוּת'; emoji = '💖'; }

  var html = progressHtml() +
    '<h2>' + emoji + ' סִכּוּם שִׁעוּר ' + (lessonIndex + 1) + '</h2>' +
    '<div class="card center"><p style="font-size:1.3em;font-weight:800">' + lessonScore + ' מִתּוֹךְ ' + n + '</p><p>' + msg + '</p></div>';

  if (passed){
    if (lessonIndex < GAME.lessons.length - 1){
      html += '<div class="center"><button class="btn gold" id="go">' +
        'רוֹצֶה לְהַמְשִׁיךְ וּלְגַלּוֹת עוֹד דֶּרֶךְ לֶאֱהֹב אֶת הַשֵּׁם? ➡️</button></div>';
    } else {
      html += '<div class="center"><button class="btn gold" id="go">לַתְּעוּדָה שֶׁלְּךָ! 🏅</button></div>';
    }
  } else {
    html += '<div class="center"><button class="btn" id="go">לַחֲזֹר עַל הַשִּׁעוּר וּלְנַסּוֹת שׁוּב 🔁</button></div>';
  }
  root.innerHTML = html;
  document.getElementById('go').addEventListener('click', function(){
    if (!passed){ totalScore -= lessonScore; screenLesson(); return; }
    if (lessonIndex < GAME.lessons.length - 1){ lessonIndex++; screenLesson(); }
    else screenCertificate();
  });
  window.scrollTo(0, 0);
}

/* ---------- תעודה ---------- */
function screenCertificate(){
  var tq = totalQuestions();
  var pct = Math.round((totalScore / tq) * 100);
  var thinks = '';
  for (var i = 0; i < GAME.thinkQuestions.length; i++){
    thinks += '<div class="think-q">' + (i + 1) + '. ' + GAME.thinkQuestions[i] + '</div>';
  }
  root.innerHTML =
    '<div class="certificate">' +
      '<div style="font-size:2.4em">🏅</div>' +
      '<h2 style="text-align:center">תְּעוּדַת הִצְטַיְּנוּת</h2>' +
      '<p>מוּעֶנֶת בְּאַהֲבָה לְ:</p>' +
      '<div class="cert-name">' + userName + '</div>' +
      '<p>' + GAME.title + '</p>' +
      '<div class="cert-score">' + totalScore + '/' + tq + ' — ' + pct + '%</div>' +
      '<div class="highlight" style="text-align:center">' + GAME.certificateVerse + '</div>' +
    '</div>' +
    '<div class="card"><h2>🤔 שְׁאֵלוֹת לַמַּחְשָׁבָה</h2>' + thinks + '</div>' +
    '<div class="link-box">🎁 הִשְׁתַּתֵּף בַּהַגְרָלָה!<br>' +
      '<a href="' + RAFFLE_URL + '" target="_blank" rel="noopener">לְמִלּוּי הַטֹּפֶס לְחַץ כָּאן</a></div>' +
    '<div class="center"><button class="btn" id="again">לְשַׂחֵק שׁוּב 🔄</button></div>' +
    '<p class="contact">' + CONTACT + '</p>';
  document.getElementById('again').addEventListener('click', screenWelcome);
  soundWin();
  sendScoreToTeacher(totalScore, tq, pct);
  window.scrollTo(0, 0);
}

/* ---------- שליחה למורה + fallback ---------- */
function sendScoreToTeacher(score, tq, pct){
  var now = new Date();
  var data = {
    name: userName,
    score: score + '/' + tq,
    percentage: pct + '%',
    gameName: GAME.title || document.title || 'משחק למידה',
    date: now.toLocaleDateString('he-IL'),
    time: now.toLocaleTimeString('he-IL')
  };
  showScoreOnScreen(data);
  try {
    fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(data)
    })['catch'](function(){ /* ה־fallback כבר מוצג על המסך */ });
  } catch (e) { /* ה־fallback כבר מוצג על המסך */ }
}
function showScoreOnScreen(data){
  var note = document.createElement('p');
  note.style.cssText = 'font-size:0.9em;color:#666;margin-top:10px;text-align:center;line-height:1.8';
  note.textContent = 'הציון שלך: ' + data.score + ' (' + data.percentage + ') — אם המורה לא רואה זאת בגיליון, אפשר לצלם מסך.';
  root.appendChild(note);
}

/* ---------- הפעלה ---------- */
applyTheme();
screenWelcome();
</script>
</body>
</html>
