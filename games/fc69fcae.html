                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = freq;
                oscillator.type = 'sine';

                        {

                            answers: [
                                "הִנֵּה אָנֹכִי הֹרֵג אֶת בִּנְךָ בְּכֹרֶךָ",
                                "אֶשְׁלַח עָלֶיךָ גֶּשֶׁם גָּדוֹל",
                                "תִּהְיֶה עָנִי וְלֹא יִהְיֶה לְךָ כֶּסֶף",
                                "תִּצְטָרֵךְ לָעֲזוֹב אֶת מִצְרַיִם"
                            ],
                            correct: 0,
                            explanation: "ה' מְגִין עַל בָּנָיו הָאֲהוּבִים! מִי שֶׁפּוֹגֵעַ בָּהֶם - נֶעֱנָשׁ! 🛡️"

        function shuffle(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function updateProgress() {
            const totalLessons = gameData.lessons.length;
            const totalQuestionsPerLesson = gameData.lessons[0].questions.length;
            const totalQuestions = totalLessons * totalQuestionsPerLesson;
            const currentProgress = (gameData.currentLesson * totalQuestionsPerLesson + gameData.currentQuestion) / totalQuestions * 100;
            
            const progressBar = document.getElementById('progressBar');
            progressBar.style.width = currentProgress + '%';
            progressBar.textContent = Math.round(currentProgress) + '%';
        }

        function updateScore() {
            document.getElementById('scoreDisplay').textContent = `נִקּוּד: ${gameData.score} 🌟`;
        }

        function showLesson() {
            const lesson = gameData.lessons[gameData.currentLesson];
            const content = document.getElementById('gameContent');
            
            content.innerHTML = `
                <div class="lesson-content">
                    <h2 style="text-align: center; color: #0066cc; margin-bottom: 20px;">${lesson.title}</h2>
                    ${lesson.content}
                </div>
                <div class="reflection">${lesson.reflection}</div>
                <button class="start-btn" onclick="startQuiz()">בּוֹאוּ נַתְחִיל אֶת הַחִידוֹן! 🎯</button>
            `;
            updateProgress();
        }

        function startQuiz() {
            gameData.currentQuestion = 0;
            showQuestion();
        }

        function showQuestion() {
            const lesson = gameData.lessons[gameData.currentLesson];
            const question = lesson.questions[gameData.currentQuestion];
            const content = document.getElementById('gameContent');
            
            const shuffledAnswers = shuffle(question.answers.map((answer, index) => ({text: answer, index})));
            
            let answersHTML = '';
            shuffledAnswers.forEach((answer) => {
                answersHTML += `<button class="answer-btn" onclick="checkAnswer(${answer.index}, ${question.correct})">${answer.text}</button>`;
            });
            
            content.innerHTML = `
                <div class="question-box">
                    <div class="question-text">
                        שְׁאֵלָה ${gameData.currentQuestion + 1} מִתּוֹךְ 3:
                    </div>
                    <div class="question-text">${question.question}</div>
                    <div class="answers">${answersHTML}</div>
                </div>
                <div id="feedback"></div>
            `;
            updateProgress();
        }

        function checkAnswer(selectedIndex, correctIndex) {
            const lesson = gameData.lessons[gameData.currentLesson];
            const question = lesson.questions[gameData.currentQuestion];
            const buttons = document.querySelectorAll('.answer-btn');
            const feedback = document.getElementById('feedback');
            
            buttons.forEach(btn => btn.disabled = true);
            
            if (selectedIndex === correctIndex) {
                buttons.forEach((btn, idx) => {
                    if (btn.textContent === question.answers[correctIndex]) {
                        btn.classList.add('correct');
                    }
                });
                
                gameData.score++;
                gameData.lessonScores[gameData.currentLesson]++;
                updateScore();
                
                const messages = [
                    "מְצֻיָּן! ⭐",
                    "כָּל הַכָּבוֹד! 💪",
                    "פַּצָּצָה! 🎯",
                    "נִפְלָא! 🌟",
                    "אֶלּוּף! 🏆"
                ];
                const randomMessage = messages[Math.floor(Math.random() * messages.length)];
                
                feedback.innerHTML = `
                    <div class="feedback correct">
                        <div style="font-size: 2em; margin-bottom: 10px;">${randomMessage}</div>
                        <div>${question.explanation}</div>
                        <div style="margin-top: 15px; font-style: italic;">הַשֵּׁם שָׂמֵחַ כְּשֶׁרוֹאִים אֶת אַהֲבָתוֹ בְּלִבְּךָ 💖</div>
                    </div>
                `;
                
                playSound([523.25, 659.25, 783.99], [0.15, 0.15, 0.3]);
            } else {
                buttons.forEach((btn) => {
                    if (btn.textContent === question.answers[selectedIndex]) {
                        btn.classList.add('wrong');
                    }
                    if (btn.textContent === question.answers[correctIndex]) {
                        btn.classList.add('correct');
                    }
                });
                
                feedback.innerHTML = `
                    <div class="feedback wrong">
                        <div style="font-size: 1.5em; margin-bottom: 10px;">לֹא בְּדִיוּק... 🤔</div>
                        <div>${question.explanation}</div>
                        <div style="margin-top: 15px; font-style: italic;">לִפְעָמִים גַּם בַּדֶּרֶךְ לִטְעוֹת אָנוּ לוֹמְדִים לֶאֱהֹב אֶת הַשֵּׁם 💡</div>
                    </div>
                `;
            }
            
            setTimeout(() => {
                feedback.innerHTML += '<button class="next-btn" onclick="nextQuestion()">הַמְשֵׁךְ ➡️</button>';
            }, 1000);
        }

        function nextQuestion() {
            gameData.currentQuestion++;
            
            if (gameData.currentQuestion < gameData.lessons[gameData.currentLesson].questions.length) {
                showQuestion();
            } else {
                showLessonSummary();
            }
        }

        function showLessonSummary() {
            const content = document.getElementById('gameContent');
            const lessonScore = gameData.lessonScores[gameData.currentLesson];
            let message, continueLesson = true;
            
            if (lessonScore === 3) {
                message = "מַדְהִים! 🏆 אַתָּה שׁוֹלֵט! אַתָּה חַי בְּאַהֲבַת הַשֵּׁם! 🎉";
                playSound([523.25, 659.25, 783.99, 1046.50, 783.99, 659.25], [0.15, 0.15, 0.15, 0.2, 0.15, 0.2]);
            } else if (lessonScore >= 2) {
                message = "כִּמְעַט מֻשְׁלָם! 💪 מַמָּשׁ כְּמוֹ בְּאַהֲבָה — מַמְשִׁיךְ לִצְמֹחַ 🌱";
            } else {
                message = "בּוֹא נְנַסֶּה שׁוּב, בְּאַהֲבָה וּבְסַבְלָנוּת 💖";
                continueLesson = false;
            }
            
            content.innerHTML = `
                <div class="lesson-summary">
                    <div style="font-size: 2em; margin-bottom: 20px;">${message}</div>
                    <div style="font-size: 1.5em;">עָנִיתָ נָכוֹן עַל ${lessonScore} מִתּוֹךְ 3 שְׁאֵלוֹת</div>
                </div>
            `;
            
            if (continueLesson) {
                gameData.currentLesson++;
                if (gameData.currentLesson < gameData.lessons.length) {
                    content.innerHTML += '<button class="next-btn" onclick="showLesson()">לַשִּׁיעוּר הַבָּא! 🚀</button>';
                } else {
                    content.innerHTML += '<button class="next-btn" onclick="showFinal()">לְסִיּוּם הַמַּסָּע! 🎓</button>';
                }
            } else {
                content.innerHTML += '<button class="next-btn" onclick="retryLesson()">נְנַסֶּה שׁוּב 🔄</button>';
            }
        }

        function retryLesson() {
            gameData.currentQuestion = 0;
            gameData.lessonScores[gameData.currentLesson] = 0;
            showLesson();
        }

        function showFinal() {
            const content = document.getElementById('gameContent');
            const percentage = Math.round((gameData.score / gameData.totalQuestions) * 100);
            
            content.innerHTML = `
                <div class="certificate">
                    <h2>🎓 תְּעוּדַת הִצְטַיְּנוּת 🎓</h2>
                    <div style="font-size: 1.3em; margin: 20px 0;">
                        שֵׁם הַתַּלְמִיד/ה:
                    </div>
                    <input type="text" class="name-input" id="studentName" placeholder="הַכְנֵס/י אֶת שִׁמְךָ כָּאן">
                    <div class="score-final">
                        נִקּוּד סוֹפִי: ${gameData.score} מִתּוֹךְ ${gameData.totalQuestions} (${percentage}%) 🌟
                    </div>
                    <div class="verse">
                        "בְּנִי בְכֹרִי יִשְׂרָאֵל"<br>
                        אַתָּה בְחַרְתָּנוּ מִכָּל הָעַמִּים,<br>
                        אָהַבְתָּ אוֹתָנוּ וְרָצִיתָ בָּנוּ!
                    </div>
                    <div style="margin: 30px 0; font-size: 1.2em; line-height: 1.8;">
                        <p style="margin-bottom: 15px;">💭 <strong>שְׁאֵלוֹת לְמַחְשָׁבָה:</strong></p>
                        <p>• אֵיךְ אוּכַל לְהַרְגִּישׁ יוֹתֵר אֶת אַהֲבַת הַשֵּׁם אֵלַי?</p>
                        <p>• מָה אֲנִי יָכוֹל לַעֲשׂוֹת הַיּוֹם כְּדֵי לְהָבִיעַ תּוֹדָה לְהַשֵּׁם?</p>
                        <p>• אֵיךְ אֲנִי מְכַבֵּד הוֹרִים וּמוֹרִים מִתּוֹךְ אַהֲבָה?</p>
                    </div>
                    ${percentage >= 67 ? `
                    <div style="background: linear-gradient(135deg, #fff9c4 0%, #fff59d 100%); padding: 25px; border-radius: 15px; margin: 25px 0; border: 3px solid #ffd700;">
                        <div style="font-size: 1.5em; font-weight: bold; margin-bottom: 15px;">🎉 מַזָּל טוֹב! 🎉</div>
                        <div style="font-size: 1.2em; margin-bottom: 15px;">זָכִיתָ לְסַיֵּם אֶת הַמַּסָּע בְּאַהֲבַת הַשֵּׁם!</div>
                        <div style="font-size: 1.1em; margin-bottom: 15px;">אַתָּה נִכְנָס לְהַגְרָלָה נוֹשֵׂאת פְּרָסִים! 🎁</div>
                        <a href="https://forms.gle/A66uubei4XSX6SG2A" target="_blank" style="display: inline-block; background: linear-gradient(135deg, #0066cc 0%, #00a8cc 100%); color: white; padding: 15px 30px; border-radius: 10px; text-decoration: none; font-size: 1.2em; font-weight: bold; margin-top: 10px;">
                            לַהַגְרָלָה - לַחַץ כָּאן! 🎯
                        </a>
                    </div>
                    ` : ''}
                </div>
                <div class="reflection" style="margin-top: 30px;">
                    זִכְרוּ תָּמִיד: אַתֶּם בְּנֵי הַמֶּלֶךְ, בְּנֵי בְכוֹרוֹ שֶׁל הַקָּדוֹשׁ בָּרוּךְ הוּא! 👑💫
                </div>
            `;
        }

        // Initialize game
        gameData.totalQuestions = gameData.lessons.reduce((sum, lesson) => sum + lesson.questions.length, 0);
        showLesson();
    </script>
