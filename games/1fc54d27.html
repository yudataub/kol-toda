        // Audio Context for sounds
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(frequencies, durations) {
            let startTime = audioContext.currentTime;
            frequencies.forEach((freq, index) => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = freq;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.3, startTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + durations[index]);
                
                oscillator.start(startTime);
                oscillator.stop(startTime + durations[index]);
                
                startTime += durations[index];
            });
        }

        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function updateProgress() {
            const totalLessons = gameState.lessons.length;
            const progress = ((gameState.currentLesson + 1) / totalLessons) * 100;
            const progressBar = document.getElementById('progressBar');
            progressBar.style.width = progress + '%';
            progressBar.textContent = Math.round(progress) + '%';
        }

        function updateScore() {
            document.getElementById('scoreDisplay').textContent = 
                `ניקוד: ${gameState.score}/${gameState.totalQuestions}`;
        }

        function showLessonContent() {
            const lesson = gameState.lessons[gameState.currentLesson];
            const part = lesson.parts[gameState.currentPart];
            const content = document.getElementById('gameContent');

            if (part.type === 'content') {
                content.innerHTML = `
                    <div class="lesson-content">
                        ${part.content}
                    </div>
                    <button class="btn" onclick="nextPart()">המשך לשאלות 📝</button>
                `;
            } else if (part.type === 'prompt') {
                content.innerHTML = `
                    ${part.content}
                    <button class="btn" onclick="nextPart()">כן! בואו נמשיך! 🚀</button>
                `;
            }

            updateProgress();
        }

        function nextPart() {
            const lesson = gameState.lessons[gameState.currentLesson];
            gameState.currentPart++;
            
            if (gameState.currentPart < lesson.parts.length) {
                showLessonContent();
            } else {
                gameState.currentQuestion = 0;
                showQuestion();
            }
        }

        function showQuestion() {
            const lesson = gameState.lessons[gameState.currentLesson];
            const question = lesson.questions[gameState.currentQuestion];
            const content = document.getElementById('gameContent');

            const shuffledAnswers = shuffleArray(question.answers.map((answer, index) => ({
                text: answer,
                originalIndex: index
            })));

            let answersHTML = '';
            shuffledAnswers.forEach((answer, index) => {
                answersHTML += `
                    <button class="answer-btn" onclick="checkAnswer(${answer.originalIndex}, ${index})" id="answer${index}">
                        ${answer.text}
                    </button>
                `;
            });

            content.innerHTML = `
                <div class="question-container">
                    <div class="question-text">שאלה ${gameState.currentQuestion + 1} מתוך ${lesson.questions.length}</div>
                    <div class="question-text">${question.question}</div>
                    <div class="answers">
                        ${answersHTML}
                    </div>
                    <div id="feedback"></div>
                    <div class="inspiration" style="margin-top: 20px;">
                        ${question.reflection}
                    </div>
                </div>
            `;

            updateProgress();
        }

        function checkAnswer(originalIndex, buttonIndex) {
            const lesson = gameState.lessons[gameState.currentLesson];
            const question = lesson.questions[gameState.currentQuestion];
            const isCorrect = originalIndex === question.correct;
            
            gameState.totalQuestions++;
            
            const buttons = document.querySelectorAll('.answer-btn');
            buttons.forEach(btn => btn.disabled = true);
            
            const clickedButton = document.getElementById(`answer${buttonIndex}`);
            
            if (isCorrect) {
                gameState.score++;
                clickedButton.classList.add('correct');
                playCorrectSound();
                
                const encouragements = [
                    "מצוין! ⭐",
                    "כל הכבוד! 💪", 
                    "פצצה! 🎯",
                    "מדהים! 🌟",
                    "יופי! 🎨"
                ];
                const randomEncouragement = encouragements[Math.floor(Math.random() * encouragements.length)];
                
                document.getElementById('feedback').innerHTML = `
                    <div class="feedback correct">
                        ${randomEncouragement}<br>
                        ${question.feedback.correct}<br>
                        <strong>השם שמח כשרואים את אהבתו בלבך 💖</strong>
                    </div>
                `;
            } else {
                clickedButton.classList.add('incorrect');
                document.getElementById('feedback').innerHTML = `
                    <div class="feedback incorrect">
                        ${question.feedback.incorrect}<br>
                        <strong>נסה שוב — לפעמים גם בדרך לטעות אנו לומדים לאהוב את השם 💡</strong>
                    </div>
                `;
            }
            
            updateScore();
            
            setTimeout(() => {
                nextQuestion();
            }, 4000);
        }

        function nextQuestion() {
            const lesson = gameState.lessons[gameState.currentLesson];
            gameState.currentQuestion++;
            
            if (gameState.currentQuestion < lesson.questions.length) {
                showQuestion();
            } else {
                showLessonSummary();
            }
        }

        function showLessonSummary() {
            const lesson = gameState.lessons[gameState.currentLesson];
            const lessonScore = gameState.score - gameState.lessonScores.reduce((a, b) => a + b, 0);
            const totalQuestions = lesson.questions.length;
            const percentage = (lessonScore / totalQuestions) * 100;
            
            gameState.lessonScores.push(lessonScore);
            
            const content = document.getElementById('gameContent');
            
            let message = '';
            if (lessonScore === totalQuestions) {
                message = "מדהים! 🏆 אתה שולט! אתה חי באהבת ה'! 🎉";
                playLessonCompleteSound();
            } else if (lessonScore >= 2) {
                message = "כמעט מושלם! 💪 ממש כמו באהבה — ממשיך לצמוח 🌱";
                playLessonCompleteSound();
            } else {
                message = "בוא ננסה שוב, באהבה וסבלנות 💖";
            }
            
            if (percentage >= 66) {
                content.innerHTML = `
                    <div class="lesson-content" style="text-align: center;">
                        <h2>סיימת את ${lesson.title}!</h2>
                        <div class="score-display" style="font-size: 2em; margin: 30px 0;">
                            ${lessonScore}/${totalQuestions} ✨
                        </div>
                        <div class="inspiration" style="font-size: 1.3em;">
                            ${message}
                        </div>
                    </div>
                    ${gameState.currentLesson < gameState.lessons.length - 1 ? 
                        '<button class="btn" onclick="nextLesson()">המשך לשיעור הבא 🚀</button>' :
                        '<button class="btn" onclick="showFinalSummary()">סיום המשחק 🎊</button>'
                    }
                `;
            } else {
                content.innerHTML = `
                    <div class="lesson-content" style="text-align: center;">
                        <h2>כמעט הצלחת!</h2>
                        <div class="score-display" style="font-size: 2em; margin: 30px 0;">
                            ${lessonScore}/${totalQuestions}
                        </div>
                        <div class="inspiration" style="font-size: 1.3em;">
                            ${message}<br><br>
                            צריך לענות נכון על לפחות 2 מתוך 3 שאלות כדי להמשיך הלאה 💪
                        </div>
                    </div>
                    <button class="btn" onclick="retryLesson()">בוא ננסה שוב! 🔄</button>
                `;
            }
        }

        function retryLesson() {
            const lesson = gameState.lessons[gameState.currentLesson];
            const lessonScore = gameState.score - gameState.lessonScores.slice(0, -1).reduce((a, b) => a + b, 0);
            
            gameState.score -= lessonScore;
            gameState.totalQuestions -= lesson.questions.length;
            gameState.lessonScores.pop();
            gameState.currentPart = 0;
            gameState.currentQuestion = 0;
            
            updateScore();
            showLessonContent();
        }

        function nextLesson() {
            gameState.currentLesson++;
            gameState.currentPart = 0;
            gameState.currentQuestion = 0;
            showLessonContent();
        }

        function showFinalSummary() {
            const content = document.getElementById('gameContent');
            const totalQuestions = gameState.totalQuestions;
            const percentage = Math.round((gameState.score / totalQuestions) * 100);
            
            content.innerHTML = `
                <div class="lesson-content" style="text-align: center;">
                    <h2>🎉 סיימת את המשחק! 🎉</h2>
                    <div class="score-display" style="font-size: 2.5em; margin: 30px 0;">
                        ציון סופי: ${gameState.score}/${totalQuestions} (${percentage}%)

                        <li>איזו מצווה אני רוצה לקיים היום מתוך שמחה? 😊</li>
                        <li>איך אוכל להיות 'בנאי של מילים' החל מעכשיו? 🏗️</li>
                    </ul>
                </div>
                
                <button class="btn" onclick="showCertificate()">קבל תעודת הצטיינות! 🎓</button>
            `;
        }

        function showCertificate() {
            const content = document.getElementById('gameContent');
            
            content.innerHTML = `
                <div class="certificate">
                    <h2>🏆 תעודת הצטיינות 🏆</h2>
                    <div style="font-size: 3em; margin: 20px 0;">💖</div>
                    <p style="font-size: 1.3em;">מוענקת בזאת ל:</p>
                    <input type="text" class="name-input" id="studentName" placeholder="הכנס את שמך כאן">
                    <div class="name" id="displayName"></div>
                    <p style="font-size: 1.2em; margin: 20px 0;">
                        על השלמת המסע המרתק<br>
                        <strong>"הכוח הסודי שבפה שלי"</strong>
                    </p>
                    <div class="score-display" style="color: #d63031;">
                        ציון: ${gameState.score}/${gameState.totalQuestions}
                    </div>
                    <div class="verse">

                        וּבְכָל־נַפְשְׁךָ וּבְכָל־מְאֹדֶךָ"
                    </div>
                    <div style="font-size: 3em; margin: 20px 0;">🌟✨🌈</div>
                    <button class="btn" onclick="finalizeCertificate()">סיים והצג תעודה 📜</button>
                </div>
            `;
            
            document.getElementById('studentName').focus();
        }

            const studentName = document.getElementById('studentName').value.trim();
            
            if (!studentName) {
                alert('אנא הכנס את שמך בכדי לקבל את התעודה 😊');
                return;

            document.getElementById('displayName').textContent = studentName;
            document.getElementById('studentName').style.display = 'none';
            
            const content = document.getElementById('gameContent');
            content.innerHTML += `

                        🎉 כל הכבוד ${studentName}! 💖<br>

            showLessonContent();
