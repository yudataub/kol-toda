.kg-frame{--c1:#2f80ed;--c2:#56ccf2;--bg:#eef7ff;position:relative;direction:rtl;font-family:"Rubik","Heebo","Segoe UI",Arial,sans-serif;
  background:var(--bg);border-radius:22px;overflow:clip;max-width:820px;margin:0 auto;min-height:520px;display:flex;flex-direction:column;
  box-shadow:0 8px 30px rgba(0,0,0,.12);color:#1f2a44}

.kg-kid{background:var(--bg);border-radius:12px;padding:8px 12px}

<script>
/* "ילדים יוצרים משחק" – הליבה: מסגרת המשחק, שאלה, ניקוד, לבבות, צלילים ומסך סיום.
   כל טקסט שמגיע מהמשחק (נכתב על ידי ילד) נכנס לדף רק דרך textContent. לא innerHTML. */
(function () {
  'use strict';
  var KG = window.KG = { E: {}, order: [] };

  // רישום מנוע. meta: {shape, name, icon, desc, how, min, lives?, half?}. start(ctx) מצייר ומריץ.
  KG.reg = function (id, meta, start) { meta.id = id; meta.start = start; KG.E[id] = meta; KG.order.push(id); };

  function h(tag, p, kids) {
    var e = document.createElement(tag), k;
    if (p) for (k in p) {
      if (k === 'cls') e.className = p[k];
      else if (k === 'text') e.textContent = p[k];
      else if (k === 'css') e.style.cssText = p[k];
      else if (k === 'on') { for (var ev in p.on) e.addEventListener(ev, p.on[ev]); }
      else e.setAttribute(k, p[k]);
    }
    (kids || []).forEach(function (c) { if (c != null) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    if (tag === 'button' && !e.getAttribute('type')) e.setAttribute('type', 'button');
    return e;
  }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  KG.h = h; KG.shuffle = shuffle; KG.pick = pick;
  // עיצוב של קובץ מנועים: KG.css('.kgx-...{...}') פעם אחת בראש הקובץ
  KG.css = function (s) { document.head.appendChild(h('style', { text: s })); };
  // השוואת מילים שהילד מקליד: בלי ניקוד, בלי פיסוק, אותיות סופיות כרגילות
  KG.norm = function (s) {
    return String(s == null ? '' : s).replace(/[֑-ׇ]/g, '').replace(/["'׳״.,!?;:\-–־()]/g, '')
      .replace(/\s+/g, ' ').trim().replace(/ך/g, 'כ').replace(/ם/g, 'מ').replace(/ן/g, 'נ').replace(/ף/g, 'פ').replace(/ץ/g, 'צ');
  };

  var GOOD = ['כל הכבוד! 🌟', 'נכון מאוד! 👏', 'מצוין! ✨', 'יפה מאוד! 🎯', 'בדיוק! 💪', 'איזה יופי! 🌈', 'תשובה נכונה! 🏅', 'אלופים! 🥇'];
  var OOPS = ['כמעט! מנסים שוב 🙂', 'לא נורא, נסו שוב 💙', 'עוד ניסיון אחד 🌱', 'טועים ולומדים – נסו שוב 🙂'];
  KG.GOOD = GOOD; KG.OOPS = OOPS;

  // ---------- צלילים ----------
  var AC = null;
  try { KG.mute = localStorage.getItem('kg-mute') === '1'; } catch (e) { KG.mute = false; }
  function tone(f, d, t, type, v) {
    if (KG.mute) return;
    try {
      AC = AC || new (window.AudioContext || window.webkitAudioContext)();
      var o = AC.createOscillator(), g = AC.createGain(), s = AC.currentTime + (t || 0);
      o.type = type || 'sine'; o.frequency.value = f; o.connect(g); g.connect(AC.destination);
      g.gain.setValueAtTime(v || 0.12, s); g.gain.exponentialRampToValueAtTime(0.001, s + d);
      o.start(s); o.stop(s + d + 0.02);
    } catch (e) { }
  }
  KG.snd = {
    good: function () { tone(660, 0.12); tone(880, 0.2, 0.1); },
    bad: function () { tone(210, 0.25, 0, 'triangle'); },
    win: function () { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.28, i * 0.14); }); },
    tick: function () { tone(1000, 0.04, 0, 'square', 0.04); },
    step: function () { tone(440, 0.07); }
  };

  // ---------- ערכות צבע (הילד בוחר) ----------
  KG.THEMES = {
    sky: ['#2f80ed', '#56ccf2', '#eef7ff', 'שמיים'], grass: ['#219653', '#6fcf97', '#effaf2', 'דשא'],
    sun: ['#f2994a', '#f2c94c', '#fff8e8', 'שמש'], berry: ['#9b51e0', '#bb6bd9', '#f7effd', 'ענבים'],
    sea: ['#0e7c86', '#2ec4b6', '#eafaf8', 'ים'], fire: ['#eb5757', '#f2994a', '#fff1ee', 'אש'],
    night: ['#2d3a8c', '#5b6ee1', '#eef0ff', 'לילה'], candy: ['#e84393', '#fd79a8', '#fff0f6', 'סוכרייה']
  };

  // ---------- הרצת משחק ----------
  // game: {gtype, title, name, cls, topic, opts:{theme, hero, timer, lives, intro, win}, items:[...]}
  // o: {engine (מנוע אחר לאותו תוכן), onExit(), onDone({stars, points}), demo}
  KG.play = function (root, game, o) {
    o = o || {};
    var E = KG.E[o.engine || game.gtype];
    var opts = game.opts || {};
    var th = KG.THEMES[opts.theme] || KG.THEMES.sky;
    var cleanups = [], ctx = null;

    root.textContent = '';
    var frame = h('div', { cls: 'kg-frame' });
    frame.style.setProperty('--c1', th[0]); frame.style.setProperty('--c2', th[1]); frame.style.setProperty('--bg', th[2]);
    var muteB = h('button', { cls: 'kg-ic', 'aria-label': 'צליל', text: KG.mute ? '🔇' : '🔊' });
    muteB.onclick = function () {
      KG.mute = !KG.mute; muteB.textContent = KG.mute ? '🔇' : '🔊';
      try { localStorage.setItem('kg-mute', KG.mute ? '1' : '0'); } catch (e) { }
    };
    var exitB = h('button', { cls: 'kg-ic', 'aria-label': 'יציאה', text: '✖' });
    exitB.onclick = function () { clean(); if (o.onExit) o.onExit(); };
    var scoreE = h('span', { cls: 'kg-score', text: '⭐ 0' }), livesE = h('span', { cls: 'kg-lives' });
    var progI = h('i'), prog = h('div', { cls: 'kg-prog' }, [progI]);
    frame.appendChild(h('div', { cls: 'kg-bar' }, [exitB, h('div', { cls: 'kg-title', text: (E.icon || '') + ' ' + (game.title || E.name) }), muteB]));
    var status = h('div', { cls: 'kg-status' }, [scoreE, prog, livesE]);
    frame.appendChild(status);
    var stage = h('div', { cls: 'kg-stage' });
    frame.appendChild(stage);
    root.appendChild(frame);

    function clean() {
      if (ctx) ctx.over = true;
      cleanups.forEach(function (fn) { try { fn(); } catch (e) { } });
      cleanups = [];
      Array.prototype.forEach.call(frame.querySelectorAll('.kg-over'), function (x) { x.remove(); });
    }
    function screen(kids) { stage.textContent = ''; stage.appendChild(h('div', { cls: 'kg-card' }, kids)); }

    function intro() {
      var facts = (opts.facts || []).slice(0, 5);
      status.style.visibility = 'hidden';
      screen([
        h('div', { cls: 'kg-big', text: E.icon || '🎮' }),
        h('h2', { text: game.title || E.name }),
        game.name ? h('div', { cls: 'kg-by', text: '🎨 המשחק של ' + game.name + (game.cls ? ' · ' + game.cls : '') }) : null,
        game.topic ? h('div', { cls: 'kg-by', text: '📚 ' + game.topic }) : null,
        h('p', { cls: 'kg-how', text: E.how || '' }),
        opts.intro ? h('p', { cls: 'kg-how kg-kid', text: opts.intro }) : null,
        facts.length ? h('div', { cls: 'kg-facts' }, [h('b', { text: '💡 כדאי לדעת לפני שמשחקים:' })].concat(facts.map(function (f) { return h('div', { text: '• ' + f }); }))) : null,
        h('button', { cls: 'kg-btn kg-go', text: '▶ מתחילים!', on: { click: begin } })
      ]);
    }

    function begin() {
      clean();
      status.style.visibility = '';
      stage.textContent = '';
      var lives = opts.lives > 0 ? opts.lives : (E.lives || 0);
      var keep = E.shape === 'O' || E.shape === 'S';
      var c = ctx = {
        el: stage, data: game, opts: opts, hero: opts.hero || '🙂', items: keep ? game.items.slice() : shuffle(game.items),
        good: 0, bad: 0, points: 0, streak: 0, lives: lives, over: false, halfLeft: E.half ? 2 : 0, missed: [],
        h: h, shuffle: shuffle, pick: pick,
        // "רעיון" שהילד בחר למשחק הזה (meta.ideas = [{k, label, kind:'emoji'|'pick'|'text', opts, def}]); בלי בחירה – ברירת המחדל
        idea: function (k) {
          var v = (opts.ideas || {})[k];
          if (v == null || v === '') (E.ideas || []).forEach(function (x) { if (x.k === k) v = x.def; });
          return v == null ? '' : String(v);
        },
        onExit: function (fn) { cleanups.push(fn); },
        every: function (ms, fn) {
          var t = setInterval(function () { if (!c.over) fn(); }, ms), stop = function () { clearInterval(t); };
          cleanups.push(stop); return stop;
        },
        after: function (ms, fn) {
          var t = setTimeout(function () { if (!c.over) fn(); }, ms), stop = function () { clearTimeout(t); };
          cleanups.push(stop); return stop;
        },
        progress: function (i, total) { progI.style.width = Math.max(0, Math.min(100, Math.round(100 * i / (total || 1)))) + '%'; },
        // תשובה נכונה. first=false כשזה לא הניסיון הראשון (חצי ניקוד)
        right: function (first) {
          if (first === false) c.points += 5;
          else { c.good++; c.streak++; c.points += 10 + (c.streak >= 3 ? 2 : 0); }
          KG.snd.good(); paint();
        },
        // טעות. מחזיר false אם המשחק נגמר (נגמרו הלבבות) – המנוע חייב לעצור.
        wrong: function () {
          c.bad++; c.streak = 0; KG.snd.bad();
          if (lives) { c.lives--; paint(); if (c.lives <= 0) { fail(); return false; } }
          return true;
        },
        say: function (text) {
          var t = h('div', { cls: 'kg-toast', text: text }); frame.appendChild(t);
          setTimeout(function () { t.remove(); }, 1600);
        },
        ask: ask, done: done
      };
      function paint() {
        scoreE.textContent = '⭐ ' + c.points + (c.streak >= 3 ? '  🔥' + c.streak : '');
        livesE.textContent = lives ? new Array(Math.max(0, c.lives) + 1).join('❤️') + new Array(lives - Math.max(0, c.lives) + 1).join('🤍') : '';
      }
      paint(); c.progress(0, 1);

      // שאלה עם 3 תשובות. item: {q, a:[נכונה, שגויה, שגויה], x?: הסבר}. cb(first) אחרי תשובה נכונה (או כשנגמר הזמן).
      // a: {into: אלמנט (במקום חלון צף), timer: שניות, title: כותרת קטנה}
      function ask(item, cb, a) {
        a = a || {};
        var first = true, closed = false, stopT = null, timeUp = false;
        var host = a.into || h('div', { cls: 'kg-over' });
        if (!a.into) frame.appendChild(host);
        host.textContent = '';
        var box = h('div', { cls: 'kg-ask' });
        host.appendChild(box);
        if (a.title) box.appendChild(h('div', { cls: 'kg-ask-t', text: a.title }));
        var sec = a.timer || opts.timer || 0, barI = h('i');
        if (sec) box.appendChild(h('div', { cls: 'kg-time' }, [barI]));
        box.appendChild(h('div', { cls: 'kg-q', text: item.q }));
        var fb = h('div', { cls: 'kg-fb' });
        var btns = shuffle(item.a.map(function (t, i) { return { t: t, ok: i === 0 }; })).map(function (x) {
          var b = h('button', { cls: 'kg-a', text: x.t });
          b._ok = x.ok;
          b.onclick = function () {
            if (closed || b.disabled || c.over) return;
            if (x.ok) return finish();
            b.disabled = true; b.classList.add('no'); first = false;
            if (c.missed.indexOf(item) < 0) c.missed.push(item);
            if (!c.wrong()) { closed = true; return; }
            fb.textContent = pick(OOPS);
          };
          return b;
        });
        box.appendChild(h('div', { cls: 'kg-as' }, btns));
        if (c.halfLeft > 0) {
          var hb = h('button', { cls: 'kg-half', text: '🛟 50:50 (נשארו ' + c.halfLeft + ')' });
          hb.onclick = function () {
            var w = btns.filter(function (b) { return !b._ok && !b.disabled; })[0];
            if (!w || closed) return;
            w.disabled = true; w.classList.add('no'); c.halfLeft--; hb.remove();
          };
          box.appendChild(hb);
        }
        box.appendChild(fb);
        function close() { if (c.over) return; if (a.into) host.textContent = ''; else host.remove(); cb(first); }
        function reveal(text, wait) {
          closed = true; if (stopT) stopT();
          btns.forEach(function (b) { b.disabled = true; if (b._ok) b.classList.add('yes'); });
          fb.textContent = text;
          if (wait) box.appendChild(h('button', { cls: 'kg-btn', text: 'ממשיכים ⬅', on: { click: close } }));
          else c.after(first ? 900 : 1300, close);
        }
        function finish() {
          var fast = sec && !timeUp && first;
          if (fast) c.points += 3;
          c.right(first);
          reveal((first ? pick(GOOD) : 'נכון! 👍') + (fast ? ' ⚡ בונוס מהירות!' : '') + (item.x ? ' ' + item.x : ''), !!item.x);
        }
        if (sec) {
          // השעון נותן בונוס למהירים, ולא מכשיל את מי שקורא לאט (עקרון: אתגר בלי עונש)
          var left = sec * 10;
          stopT = c.every(100, function () {
            left--; barI.style.width = (100 * left / (sec * 10)) + '%';
            if (left === 30) KG.snd.tick();
            if (left <= 0) { stopT(); timeUp = true; barI.parentNode.style.visibility = 'hidden'; }
          });
        }
      }

      function end(kids) {
        c.over = true; clean(); status.style.visibility = 'hidden';
        var others = KG.order.filter(function (id) {
          var x = KG.E[id]; return x.shape === E.shape && id !== E.id && (x.min || 1) <= game.items.length;
        });
        kids.push(h('button', { cls: 'kg-btn kg-go', text: '🔁 לשחק שוב', on: { click: begin } }));
        if (E.shape === 'Q' && c.missed.length) {   // חוזרים רק על מה שטעו בו – עד שיודעים
          var again = { gtype: 'map', title: 'מתרגלים שוב', name: game.name, topic: game.topic, opts: opts, items: c.missed.slice() };
          kids.push(h('button', { cls: 'kg-btn', text: '💪 לתרגל רק את מה שטעיתי (' + c.missed.length + ')', on: { click: function () { KG.play(root, again, { onExit: function () { KG.play(root, game, o); }, demo: true }); } } }));
        }
        if (others.length) {
          kids.push(h('div', { cls: 'kg-by', text: '🎲 אותו תוכן – במשחק אחר:' }));
          kids.push(h('div', { cls: 'kg-chips' }, others.map(function (id) {
            return h('button', { cls: 'kg-chip', text: KG.E[id].icon + ' ' + KG.E[id].name, on: { click: function () { KG.play(root, game, { engine: id, onExit: o.onExit, onDone: o.onDone, demo: o.demo }); } } });
          })));
        }
        kids.push(h('button', { cls: 'kg-btn kg-back', text: '🏠 חזרה', on: { click: function () { if (o.onExit) o.onExit(); } } }));
        screen(kids);
      }
      function fail() {
        end([h('div', { cls: 'kg-big', text: '💔' }), h('h2', { text: 'נגמרו הלבבות' }),
          h('p', { cls: 'kg-how', text: 'צברתם ' + c.points + ' נקודות. לא נורא – מנסים שוב, ובכל פעם זוכרים יותר!' })]);
      }
      function done() {
        if (c.over) return;
        var stars = c.bad === 0 ? 3 : (c.bad <= Math.max(1, c.good / 2) ? 2 : 1);
        KG.snd.win();
        end([h('div', { cls: 'kg-big', text: '🎉' }), h('h2', { text: 'סיימתם את המשחק!' }),
          h('div', { cls: 'kg-stars', text: new Array(stars + 1).join('⭐') + new Array(4 - stars).join('☆') }),
          h('p', { cls: 'kg-how', text: 'צברתם ' + c.points + ' נקודות.' }),
          opts.win ? h('p', { cls: 'kg-how kg-kid', text: opts.win }) : null,
          game.name ? h('div', { cls: 'kg-by', text: '🎨 המשחק נוצר על ידי ' + game.name }) : null]);
        if (o.onDone) o.onDone({ stars: stars, points: c.points });
      }
      try { E.start(c); } catch (err) {
        console.error(err);
        screen([h('h2', { text: 'אוי, המשחק לא נפתח 😕' }), h('button', { cls: 'kg-btn', text: '🏠 חזרה', on: { click: function () { if (o.onExit) o.onExit(); } } })]);
      }
    }
    intro();
    return { stop: clean };
  };
})();

    }

  }

      page([root, shareBox(id)], 'playpg');
      if (g.gtype === 'custom') {
        var fr = h('iframe', { cls: 'custom', sandbox: 'allow-scripts', title: g.title || 'משחק' });
        fr.srcdoc = '<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; script-src \'unsafe-inline\'; style-src \'unsafe-inline\'; img-src data:; media-src data:">' + g.html;
        root.appendChild(h('div', { cls: 'hd' }, [h('h1', { text: '✨ ' + (g.title || 'משחק מיוחד') }), h('div', { cls: 'sub', text: '🎨 המשחק של ' + g.name + (g.cls ? ' · ' + g.cls : '') + ' · 📚 ' + g.topic })]));
        root.appendChild(fr); root.appendChild(back(ls('kg-class') ? '#class' : '#all'));
        post({ type: 'played', id: id });
      } else if (KG.E[g.gtype]) {
        KG.play(root, g, { onExit: exit, onDone: function () { post({ type: 'played', id: id }); } });
      } else page([head('המשחק הזה עוד לא נתמך כאן 😕'), back()]);
    }, function () { page([head('אין חיבור לאינטרנט'), back()]); });
  }

  // ---------- מורה ----------
  function teacherNew() {
    var T = { teacher: '', school: '', grade: '', email: '', topics: [{}, {}] }, list = h('div', { cls: 'rows' });
    function draw() { drawTopics(list, T.topics, draw); }
    draw();
    var saved = (ls('kg-teacher') || []).map(function (x) { return h('a', { cls: 'tlink', href: '#t=' + x.code + '.' + x.ts, text: '🏫 ' + x.label + ' (קוד ' + x.code + ')' }); });
    page([head('👨‍🏫 דף המורה', 'פותחים כיתה, רושמים את הנושאים – והתלמידים יוצרים עליהם משחקי למידה.'),
      saved.length ? h('div', { cls: 'card' }, [h('b', { text: 'הכיתות שלי במחשב הזה:' })].concat(saved)) : null,
      h('div', { cls: 'card howto' }, [h('b', { text: 'איך זה עובד?' }),
        h('p', { text: '1. רושמים כאן את הנושאים שנלמדו (אפשר להוסיף לכל נושא את עיקרי החומר).' }),
        h('p', { text: '2. מקבלים קוד כיתה של 5 ספרות, ונותנים אותו לתלמידים.' }),
        h('p', { text: '3. כל תלמיד בוחר נושא וסוג משחק, כותב את החומר ומעצב את המשחק.' }),
        h('p', { text: '4. החומר נבדק אוטומטית. משחק תקין מתפרסם בגלריה של הכיתה, ואתם יכולים להסתיר כל משחק.' })]),
      h('label', { cls: 'lbl', text: 'שם המורה:' }), input('', 'הרב ישראל ישראלי', 40, function (v) { T.teacher = v; }),
      h('label', { cls: 'lbl', text: 'בית הספר:' }), input('', '', 60, function (v) { T.school = v; }),
      h('label', { cls: 'lbl', text: 'הכיתה:' }), input('', "ד'2", 20, function (v) { T.grade = v; }),
      h('label', { cls: 'lbl', text: 'מייל (לא חובה):' }), input('', '', 80, function (v) { T.email = v; }),
      h('h3', { text: '📚 הנושאים שהתלמידים יוצרים עליהם משחקים' }), list,
      btn('➕ עוד נושא', function () { T.topics.push({}); draw(); }, 'b-2'),
      btn('✔ פותחים כיתה', function () {
        var topics = T.topics.filter(function (t) { return String(t.t || '').trim(); });
        if (!T.teacher.trim() || !topics.length) return warn('צריך שם מורה ולפחות נושא אחד.');
        var ts = rnd(28);
        waitScreen('פותחים כיתה...');
        post({ type: 'class', teacher: T.teacher, school: T.school, grade: T.grade, email: T.email, topics: topics, ts: ts }).then(function (r) {
          if (!r.ok) return page([head('לא הצלחנו לפתוח כיתה 😕'), back('#teacher')]);
          var all = ls('kg-teacher') || [];
          all.unshift({ code: r.code, ts: ts, label: [T.grade, T.school].filter(String).join(' · ') || T.teacher });
          ls('kg-teacher', all); go('#t=' + r.code + '.' + ts);
        }, function () { page([head('אין חיבור לאינטרנט'), back('#teacher')]); });
      }, 'b-big b-main'), back()], 'teacher');
  }
  function drawTopics(list, topics, redraw) {
    list.textContent = '';
    topics.forEach(function (t, i) {
      list.appendChild(h('div', { cls: 'row' }, [h('div', { cls: 'row-n', text: String(i + 1) }), h('div', { cls: 'row-b' }, [
        input(t.t, 'שם הנושא – למשל: ברכות הנהנין', 60, function (v) { t.t = v; }),
        area(t.note, 'עיקרי החומר שנלמד (לא חובה) – עוזר לתלמידים ולבדיקת המשחקים', 1500, function (v) { t.note = v; }, 3)]),
        topics.length > 1 ? h('button', { cls: 'row-x', text: '🗑', on: { click: function () { topics.splice(i, 1); redraw(); } } }) : null]));
    });
  }
  function teacherClass(code, ts) {
    page([h('div', { cls: 'wait', text: '⏳ טוענים את הכיתה...' })]);
    get({ action: 'tclass', cls: code, ts: ts }).then(function (r) {
      if (!r.ok) return page([head('הקישור לא נכון 😕'), back('#teacher')]);
      var C = r.cls, link = SITE + '?c=' + code, topics = JSON.parse(JSON.stringify(C.topics)), list = h('div', { cls: 'rows' });
      function draw() { drawTopics(list, topics, draw); }
      draw();
      var linkIn = h('input', { cls: 'in', readonly: 'readonly', dir: 'ltr' }); linkIn.value = link;
      var mng = h('input', { cls: 'in', readonly: 'readonly', dir: 'ltr' }); mng.value = SITE + '#t=' + code + '.' + ts;
      var all = ls('kg-teacher') || [];
      if (!all.some(function (x) { return x.code === code; })) { all.unshift({ code: code, ts: ts, label: [C.grade, C.school].filter(String).join(' · ') || C.teacher }); ls('kg-teacher', all); }
      var VT = { ok: '✅ אושר', fix: '✏️ הוחזר לתיקון', wait: '⏳ ממתין לבדיקה', '': '⏳ בבדיקה' };
      var games = h('div', { cls: 'rows' }, r.games.length ? r.games.map(function (g) {
        var E = eng(g.gtype) || CUSTOM;
        return h('div', { cls: 'card mine' + (g.hidden ? ' hid' : '') }, [h('b', { text: E.icon + ' ' + (g.title || E.name) + ' – ' + g.name }),
          h('div', { cls: 'sub', text: g.topic + ' · ' + g.date + ' · ' + (VT[g.verdict] || '') + (g.id ? ' · שיחקו ' + g.plays : '') + (g.hidden ? ' · מוסתר' : '') }),
          g.verdict === 'fix' ? h('div', { cls: 'sub', text: 'מה נאמר לתלמיד: ' + g.msg }) : null,
          g.id ? btn('▶ לשחק', function () { window.open(SITE + '#g=' + g.id); }, 'b-sm b-main') : null,
          g.id ? btn(g.hidden ? '👁 להחזיר' : '🙈 להסתיר', function () { post({ type: 'hide', c: code, ts: ts, id: g.id, hide: !g.hidden }).then(function () { teacherClass(code, ts); }); }, 'b-sm b-ghost') : null]);
      }) : [h('div', { cls: 'msg', text: 'עוד לא נשלחו משחקים.' })]);
      page([head('🏫 ' + ([C.grade, C.school].filter(String).join(' · ') || 'הכיתה שלי'), 'המורה: ' + C.teacher),
        h('div', { cls: 'card codebox' }, [h('div', { cls: 'sub', text: 'קוד הכיתה לתלמידים:' }), h('div', { cls: 'code', text: code }),
          h('div', { cls: 'sub', text: 'או קישור ישיר:' }), linkIn, h('div', { cls: 'sub', text: '🔒 הקישור שלכם לניהול הכיתה – שמרו אותו (לא לתלמידים):' }), mng]),
        h('h3', { text: '📚 הנושאים' }), list, btn('➕ עוד נושא', function () { topics.push({}); draw(); }, 'b-2'),
        btn('💾 שומרים את הנושאים', function (e) {
          var tp = topics.filter(function (t) { return String(t.t || '').trim(); });
          if (!tp.length) return warn('צריך לפחות נושא אחד.');
          post({ type: 'class', code: code, ts: ts, topics: tp }).then(function (x) { e.target.textContent = x.ok ? '✔ נשמר' : 'לא נשמר – נסו שוב'; cls = null; });
        }, 'b-main'),
        h('h3', { text: '🎮 המשחקים שהתלמידים שלחו (' + r.games.length + ')' }), games, back('#teacher')], 'teacher');
    }, function () { page([head('אין חיבור לאינטרנט'), back('#teacher')]); });
  }

  // ---------- ניתוב ----------
  function route() {
    Array.prototype.forEach.call(document.querySelectorAll('.modal'), function (m) { m.remove(); });
    var x = location.hash || '#', m;
    if ((m = /^#g=([a-z0-9]{8})$/.exec(x))) return playGame(m[1]);
    if ((m = /^#t=(\d{5})\.([A-Za-z0-9]{16,40})$/.exec(x))) return teacherClass(m[1], m[2]);
    if (x === '#teacher') return teacherNew();
    if (x === '#all') return gallery('🌍 משחקים מכל הכיתות', 'משחקים שילדים יצרו. לחצו על משחק כדי לשחק.', { action: 'games' });
    if (x === '#mine') return mine();
    if (x === '#class') return needClass(function () { gallery('🎮 המשחקים של הכיתה', [cls.grade, cls.school].filter(String).join(' · '), { action: 'games', cls: cls.code }); });
    if ((m = /^#new(\d?)$/.exec(x))) return needClass(function () {
      var s = +m[1] || 0;
      if (s > 0 && !String(D.name || '').trim()) s = 0;
      if (s > 1 && !cls.topics.some(function (t) { return t.t === D.topic; })) s = 1;
      if (s > 2 && !eng(D.gtype)) s = 2;
      [stepName, stepTopic, stepType, stepContent, stepIdeas, stepSend][s]();
    });
    home();
  }
  var qc = new URLSearchParams(location.search).get('c');
  if (qc && /^\d{5}$/.test(qc)) { ls('kg-class', qc); try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) { } }
  window.addEventListener('hashchange', route);
  route();
})();

</script>
</body>
</html>
